 g.globalAlpha=1;
}
function queuePaint(){if(!frame)frame=requestAnimationFrame(()=>{frame=0;paint()})}
function graph(center){
 const out=layout(vp.clientWidth,vp.clientHeight);
 anchors=out.nodes;visible=out.edges;positions.clear();for(const a of anchors)positions.set(a.n.id,a);
 scene.style.width=out.width+"px";scene.style.height=out.height+"px";
 allNodes.innerHTML=anchors.map(({n,x,y,w,h})=>`<button class="pin${n.id===id?" active":""}" type="button" data-kind="${n.kind}" data-go="${n.id}" data-planned="${n.id==="role-specific"}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;--col:${n.color}" aria-label="${escape(n.title)}">${n.kind==="hub"?"":escape(n.title)}${n.id==="role-specific"?"<small>Planned</small>":""}</button>`).join("");
 furniture=[...allNodes.children];
 if(center){const t=out.target;vp.scrollTo(Math.max(0,t.x-vp.clientWidth/2),Math.max(0,t.y-vp.clientHeight/2))}
 paint();
}
function siblingRow(n){return `<div class="linkrow">${btn(n.title,n.id)}</div>`}
function relationList(items,incoming){
 if(!items.length)return "";
 return `<h3>${incoming?"Prerequisite paths":"Comes before"} (${items.length})</h3>`+items.map(e=>{
 const n=byId.get(other(e,id)),drawn=visible.some(v=>v.from===e.from&&v.to===e.to);
 return `<div class="linkrow">${btn(n.title,n.id)}${outline?"":`<button class="pinlink" data-pin="${n.id}" aria-label="Show relationship with ${escape(n.title)}" aria-pressed="${drawn}">${drawn?"Shown":"Show"}</button>`}</div>`;
 }).join("");
}
function detail(){
 const n=byId.get(id);let s="";
 if(n.kind==="hub"){
  s=`<p>Five authored branches radiate from the center. The sixth sector is reserved for role-specific material.</p><h3>Branches</h3>${branches.map(siblingRow).join("")}`;
 }else if(n.kind==="branch"){
  s=`<p>${escape(n.summary)}</p>`+(n.paths.length?`<h3>Paths (${n.paths.length})</h3>${n.paths.map(siblingRow).join("")}`:"<p>The curriculum has no authored paths in this sector yet.</p>");
 }else{
  const all=relations(id),pre=all.filter(e=>e.to===id),next=all.filter(e=>e.from===id);
  s=`<p>${escape(n.summary)}</p>`+(!outline?`<p class="quiet">${visible.length} of ${all.length} path links drawn. Every connection is listed below.</p>`:"")+relationList(pre,true)+relationList(next,false);
  s+=`<details><summary>Skills (${n.skills.length})</summary><ul class="names">${n.skills.map(sk=>`<li>${escape(sk.title)}</li>`).join("")}</ul></details>`;
  for(const cp of n.checkpoints)s+=`<details><summary>Checkpoint: ${escape(cp.title)}</summary><p>${escape(cp.summary)}</p><h3>Required skills (${cp.requires.length})</h3><ul class="names">${cp.requires.map(k=>`<li>${escape(skills.get(k).title)}</li>`).join("")}</ul></details>`;
 }
 $("detail").innerHTML=`<div class="type">${n.kind==="hub"?"Overview":n.kind==="path"?escape(byId.get(n.branchId).title):"Branch"}</div><h2>${escape(n.title)}</h2>${s}<hr><label for="jump">Jump to a path</label><select id="jump"><option value="">Choose a path…</option>${branches.filter(b=>b.paths.length).map(b=>`<optgroup label="${escape(b.title)}">${b.paths.map(p=>`<option value="${p.id}">${escape(p.title)}</option>`).join("")}</optgroup>`).join("")}</select>`;
 $("jump").onchange=e=>{if(e.target.value)go(e.target.value)};
}
function render(center=true){
 const n=byId.get(id);hover=null;
 $("prompt").textContent=n.kind==="hub"?"Choose a branch to explore its paths.":n.kind==="branch"?"Choose a path to inspect its prerequisites.":"Follow an arrow from a prerequisite to the path it prepares you for.";
 $("crumbs").innerHTML=(n.kind!=="hub"?btn("Curriculum",hub.id)+"<span>›</span>":"")+(n.kind==="path"?btn(byId.get(n.branchId).title,n.branchId)+"<span>›</span>":"")+`<strong>${escape(n.title)}</strong>`;
 $("mapBtn").setAttribute("aria-pressed",String(!outline));$("listBtn").setAttribute("aria-pressed",String(outline));$("cap").disabled=outline;$("back").disabled=!historyStack.length;
 vp.hidden=outline;$("outline").hidden=!outline;
 if(outline){
  $("outline").innerHTML=n.kind==="hub"?branches.map(b=>`<details><summary>${escape(b.title)}</summary>${b.paths.length?b.paths.map(p=>btn(p.title,p.id)).join(""):"<p>Planned</p>"}</details>`).join(""):n.kind==="branch"?n.paths.map(p=>btn(p.title,p.id)).join("")||"<p>Planned branch</p>":`<h3>Prerequisite paths</h3>${n.after.map(pid=>btn(title(pid),pid)).join("")||"<p>None</p>"}<h3>Comes before</h3>${prerequisites.filter(e=>e.from===id).map(e=>btn(title(e.to),e.to)).join("")||"<p>None</p>"}`;
 }else{graph(center)}
 $("caption").textContent=outline?"Browse the same curriculum as a list.":n.kind==="hub"?"Sectors show branches. The center radar has no learner progress loaded.":n.kind==="branch"?"Drag or scroll to pan. Arrows show prerequisite order. Dashed lines group entry paths.":"Arrows show prerequisite order. Choose Show beside any omitted connection to bring it into view.";
 detail();sizing=vp.clientWidth+":"+vp.clientHeight;
}
function go(next){
 if(!byId.has(next)||next===id)return;historyStack.push({id,preferred,x:vp.scrollLeft,y:vp.scrollTop});id=next;preferred=null;render();$("announce").textContent=title(id);$("crumbs").scrollIntoView({block:"nearest"});$("back").focus({preventScroll:true});
}
document.addEventListener("click",e=>{const el=e.target.closest("button");if(!el)return;if(el.dataset.go)go(el.dataset.go);if(el.dataset.pin){preferred=el.dataset.pin;render();const keep=$("detail").querySelector(`[data-pin="${preferred}"]`);keep?.focus({preventScroll:true});$("crumbs").scrollIntoView({block:"nearest"});$("announce").textContent="Showing the connection with "+title(preferred)}});
$("back").onclick=()=>{const prev=historyStack.pop();if(prev){id=prev.id;preferred=prev.preferred;render();if(!outline)vp.scrollTo(prev.x,prev.y);$("announce").textContent=title(id)}};
for(const [key,val] of [["mapBtn",false],["listBtn",true]])$(key).onclick=()=>{outline=val;render()};
$("cap").onchange=e=>{cap=Number(e.target.value);render()};
vp.addEventListener("scroll",()=>{hover=null;queuePaint()},{passive:true});
allNodes.addEventListener("focusin",e=>{hover={id:e.target.dataset.go};queuePaint()});
allNodes.addEventListener("focusout",()=>{hover=null;queuePaint()});
vp.addEventListener("pointermove",e=>{
 if(dragging&&e.buttons===1){vp.scrollLeft=panCenter[0]-(e.clientX-dragging[0]);vp.scrollTop=panCenter[1]-(e.clientY-dragging[1]);return}
 if(e.pointerType==="mouse"){const r=vp.getBoundingClientRect();hover={x:e.clientX-r.left+vp.scrollLeft,y:e.clientY-r.top+vp.scrollTop};queuePaint()}
});
vp.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button===0&&!e.target.closest("button")){dragging=[e.clientX,e.clientY];panCenter=[vp.scrollLeft,vp.scrollTop];vp.setPointerCapture(e.pointerId)}});
vp.addEventListener("lostpointercapture",()=>{dragging=null});vp.addEventListener("pointerup",()=>{dragging=null});vp.addEventListener("pointerleave",()=>{hover=null;queuePaint()});
new ResizeObserver(()=>{if(!outline&&sizing!==vp.clientWidth+":"+vp.clientHeight)render()}).observe(vp);
const initial=new URLSearchParams(location.search);if(byId.has(initial.get("path")))id=initial.get("path");render();
})();
</script></html>
