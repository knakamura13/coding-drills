    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    variant: true
    note: Trace pops interleaved with pushes on fresh values.
  - questionId: top-after-pops-review
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    variant: true
