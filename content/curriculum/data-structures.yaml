# Data structures. Part of the mastery map (issue #12).
id: data-structures
title: Data structures
summary: Stacks, heaps, and linked lists, from one operation up to a combined use.
order: 3

paths:
  - id: stack-matching
    title: Stack matching
    summary: Push and pop the latest item, match a closer, and read the stack that remains.
    after: [arrays-and-strings]
    levels:
      - id: push-pop-recent
        title: Push and pop the most recent item
      - id: match-closer
        title: Match a closer
      - id: inspect-final-stack
        title: Inspect the final stack
    checkpoints:
      - id: decide-balanced
        title: Decide balancedness
        summary: Decide balancedness on a mixed string.

  - id: monotonic-stack
    title: Monotonic stack
    summary: Keep waiting positions, resolve smaller tops, and account for the whole run.
    after: [stack-matching, growth-rates]
    afterNote: Index versus value is the arrays skill for reading an index. Growth rates is for the cost.
    needs: [read-index]
    levels:
      - id: identify-waiting-position
        title: Identify a waiting position
      - id: resolve-smaller-tops
        title: Resolve strictly smaller tops
      - id: interpret-leftovers
        title: Interpret leftovers and count total operations
    checkpoints:
      - id: next-greater-and-cost
        title: Next greater and its cost
        summary: Solve next-greater and justify the full-run cost.

  - id: priority-order
    title: Priority order
    summary: Tell a FIFO queue from a priority queue, find the heap root, and predict one push or pop.
    after: [arrays-and-strings]
    levels:
      - id: fifo-versus-priority
        title: Distinguish FIFO from minimum priority
      - id: identify-heap-root
        title: Identify the heap root
      - id: predict-push-pop
        title: Predict one push or pop result
    checkpoints:
      - id: choose-job-queue
        title: Choose a queue for jobs
        summary: Choose a queue for an arriving stream of jobs.

  - id: heap-operations
    title: Heap operations
    summary: Trace one sift and compare ways to build a heap. Ties are a separate fork.
    after: [priority-order, growth-rates]
    afterNote: Tuple ordering for ties is named in the plan and is not a path of its own. The tie fork covers that comparison.
    levels:
      - id: trace-one-sift
        title: Trace one sift
      - id: compare-build-strategies
        title: Compare build strategies
    forks:
      - id: heap-ties
        title: Ties
        levels:
          - id: compare-priority-fields
            title: Compare priority fields
          - id: choose-tie-breaker
            title: Choose a comparable tie-breaker
    checkpoints:
      - id: compare-construction-or-ties
        title: Compare construction or repair ties
        summary: Compare construction strategies or repair tied entries.

  - id: bounded-heaps
    title: Bounded heaps
    summary: Evict to keep a size limit. Merging sorted streams is a separate fork.
    after: [priority-order, operation-costs]
    levels:
      - id: track-eviction-candidate
        title: Track the eviction candidate
      - id: preserve-size-limit
        title: Preserve a size limit
    forks:
      - id: stream-merge
        title: Merge
        levels:
          - id: expose-stream-head
            title: Expose one head per stream
          - id: replenish-popped-stream
            title: Replenish the stream just popped
    checkpoints:
      - id: top-k-or-merge
        title: Top K or a lazy merge
        summary: Meet a memory limit while selecting top K or merging lazily.

  - id: link-rewrites
    title: Link rewrites
    summary: Follow a successor, save and redirect an edge, and handle the first node.
    after: [names-and-objects]
    levels:
      - id: follow-successor
        title: Follow a successor
      - id: save-and-redirect
        title: Save and redirect an edge
      - id: handle-first-node
        title: Handle the first node
    checkpoints:
      - id: reverse-links
        title: Reverse links
        summary: Reverse links without losing the remainder.

  - id: pointer-walks
    title: Pointer walks
    summary: Advance one or two hops, hold a gap or a speed, and stop cleanly.
    after: [link-rewrites]
    levels:
      - id: advance-safely
        title: Advance one or two hops safely
      - id: maintain-gap-or-speed
        title: Maintain a fixed gap or relative speed
      - id: handle-walk-termination
        title: Handle termination
    checkpoints:
      - id: unlink-or-cycle
        title: Unlink or detect a cycle
        summary: Unlink the nth-from-end node or distinguish a cycle from repeated values.

drills:
  - questionId: shortest-job-first
    disposition: rewrite
    path: priority-order
    skill: fifo-versus-priority
    note: Give three pending jobs and one arrival. Pick the next job before choosing the structure.
  - questionId: heapq-min-heap
    disposition: rewrite
    path: priority-order
    skill: predict-push-pop
    note: Predict one minimum pop first. Teach reversing numeric priorities in a later variant.
  - questionId: top-k-min-heap
    disposition: exam
    path: bounded-heaps
    note: Choose which score to evict, then justify the size bound for a stream.
  - questionId: heapify-vs-pushes
    disposition: exam
    path: heap-operations
    note: Connect tree height, one sift and bottom-up construction on existing input.
  - questionId: heap-tie-typeerror
    disposition: rewrite
    path: heap-operations
    note: Compare equal-priority entries once, then introduce a unique tie-breaker before opaque payloads.
  - questionId: merge-k-sorted
    disposition: exam
    path: bounded-heaps
    note: Track one head per stream, choose which to replenish and bound memory.
  - questionId: reverse-in-place
    disposition: exam
    path: link-rewrites
    note: Combine saving the successor, redirecting an edge and advancing both references.
  - questionId: middle-node
    disposition: keep
    path: pointer-walks
    note: Trace one- and two-hop cursors on an even-length list after one-hop practice.
  - questionId: dummy-head
    disposition: rewrite
    path: link-rewrites
    note: Draw a sentinel before a one-node list and ask which edge changes when the head is removed.
  - questionId: remove-nth-from-end
    disposition: exam
    path: pointer-walks
    note: Combine a fixed gap and a sentinel including the head-removal case.
  - questionId: cycle-detection
    disposition: rewrite
    path: pointer-walks
    note: First trace safe two-hop access on odd and even lists, then distinguish node identity from equal values.
  - questionId: cost-model
    disposition: rewrite
    path: link-rewrites
    note: Separate locating a node from splicing after a node already held; compare array insertion later.
  - questionId: next-taller-stall
    disposition: exam
    path: monotonic-stack
    note: Choose and trace the waiting stack on an unfamiliar next-greater problem.
  - questionId: stack-holds-indices
    disposition: keep
    path: monotonic-stack
    note: Select an entry that retains both the height lookup and the distance.
  - questionId: stack-loop-cost
    disposition: exam
    path: monotonic-stack
    note: Combine tracing pops with counting total pushes and pops over a whole run.
  - questionId: strict-vs-nonstrict
    disposition: rewrite
    path: monotonic-stack
    note: Start with two equal heights and ask whether either is resolved; translate to a comparison later.
  - questionId: bracket-balance
    disposition: exam
    path: stack-matching
    note: Combine LIFO order, bracket type, premature closing and leftover openers.
  - questionId: leftover-stack
    disposition: keep
    path: monotonic-stack
    note: Interpret pending indices after the scan finishes; place after the single-pop exercise.
  - questionId: two-push-trace
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: New teaching card for pushing and popping the most recent item. Trace two pushes and one pop.
  - questionId: pop-empty-guard
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: New teaching card for the empty pop check. Predict what an unguarded pop does on a stray closer.
  - questionId: which-opener-matches
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: New teaching card (tap the cell). Tap the opener a closer pops once nearer pairs have closed.
  - questionId: wrong-type-closer
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: New teaching card (drag the pointers). Place the wrong-type closer and the top it pops.
  - questionId: closer-compares-top
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: New teaching card. Find the crossed string that a search-the-stack matcher accepts.
  - questionId: leftover-opener
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: New teaching card for the leftover opener. Find the string a matcher without the final empty check accepts.
  - questionId: unmatched-opener
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: New teaching card (tap the cell). Tap the opener still on the stack when the scan ends.
  - questionId: pop-order-review
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: Review variant on a fresh input. Trace pops interleaved with pushes.
  - questionId: top-after-pops-review
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: Review variant on a fresh input (tap the cell). Tap the top after one push and two pops.
  - questionId: empty-pop-review
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: Review variant on a fresh input (tap the cell). Tap the closer that pops an empty stack.
  - questionId: peek-vs-pop-review
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: Review variant on a fresh input. Tell reading the top apart from popping it.
  - questionId: which-opener-review
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: Review variant on a fresh input (tap the cell). Tap the opener a closer pops.
  - questionId: wrong-type-review
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: Review variant on a fresh input. Say where and why a crossed string fails.
  - questionId: crossed-drag-review
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: Review variant on a fresh input (drag the pointers). Place the wrong-type closer and the top it pops.
  - questionId: leftover-review
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: Review variant on a fresh input. Name the leftover opener and the return value.
  - questionId: leftover-order-review
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: Review variant on a fresh input. Read the leftover openers from the bottom of the stack to the top.
  - questionId: final-top-review
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: Review variant on a fresh input (tap the cell). Tap the top of the stack that is left.
  - questionId: checkpoint-pick-balanced
    disposition: exam
    path: stack-matching
    note: New checkpoint item. Pick the balanced string from a wrong-type closer, a stray closer and a leftover opener.
  - questionId: checkpoint-batch
    disposition: exam
    path: stack-matching
    note: New checkpoint item. Decide balancedness for three mixed strings at once.
  - questionId: checkpoint-complete
    disposition: exam
    path: stack-matching
    note: New checkpoint item. Turn the leftover stack into the closers that complete the string, top first.
  - questionId: checkpoint-skip-bug
    disposition: exam
    path: stack-matching
    note: New checkpoint item. Find the string a matcher that skips bad closers gets wrong.
  - questionId: fifo-or-priority-trace
    disposition: keep
    path: priority-order
    skill: fifo-versus-priority
    note: New teaching card (step-through trace) for the FIFO vs priority trace. Feed one list to a deque and a heap and predict each one's pops.
  - questionId: next-job-on-arrival
    disposition: keep
    path: priority-order
    skill: fifo-versus-priority
    note: New teaching card that carries out the shortest-job-first rewrite. Three pending jobs and one arrival; pick the job that starts next.
  - questionId: heap-list-unsorted
    disposition: keep
    path: priority-order
    skill: identify-heap-root
    note: New teaching card for the heap whose internal array is unsorted. Decide whether an unsorted heap list is broken.
  - questionId: tap-the-root
    disposition: keep
    path: priority-order
    skill: identify-heap-root
    note: New teaching card (tap the cell). Tap the pushed value that ends up at the root.
  - questionId: one-pop-prediction
    disposition: keep
    path: priority-order
    skill: predict-push-pop
    note: New teaching card that promotes the plain-pops one-pop prediction on a fresh input. Predict one pop and the new root.
  - questionId: push-pop-trace
    disposition: keep
    path: priority-order
    skill: predict-push-pop
    note: New teaching card (step-through trace). Predict each pop when a push lands between pops.
  - questionId: push-below-root
    disposition: keep
    path: priority-order
    skill: predict-push-pop
    note: New teaching card. Predict the root and size after pushing a value smaller than the root.
  - questionId: deque-or-heap-review
    disposition: keep
    path: priority-order
    skill: fifo-versus-priority
    note: Review variant on a fresh input. Predict the first value out of a deque and a heap fed the same list.
  - questionId: next-out-drag-review
    disposition: keep
    path: priority-order
    skill: fifo-versus-priority
    note: Review variant on a fresh input (drag the pointers). Place the next value out of a deque and a heap after two pops each.
  - questionId: which-rule-needs-priority-review
    disposition: keep
    path: priority-order
    skill: fifo-versus-priority
    note: Review variant. Pick the ordering rule that a FIFO queue or a stack cannot serve.
  - questionId: heapify-root-review
    disposition: keep
    path: priority-order
    skill: identify-heap-root
    note: Review variant on a fresh input (tap the cell). Tap the value heapify moves to the root.
  - questionId: which-list-breaks-review
    disposition: keep
    path: priority-order
    skill: identify-heap-root
    note: Review variant. Pick the list that breaks the heap rule from an unsorted, a sorted and a repeated-value heap.
  - questionId: read-the-largest-review
    disposition: keep
    path: priority-order
    skill: identify-heap-root
    note: Review variant on a fresh input. Read the largest value of a heap without assuming it sits last.
  - questionId: two-pops-review
    disposition: keep
    path: priority-order
    skill: predict-push-pop
    note: Review variant on a fresh input. Predict two pops in a row.
  - questionId: next-root-tap-review
    disposition: keep
    path: priority-order
    skill: predict-push-pop
    note: Review variant on a fresh input (tap the cell). Tap the value that becomes the root after one pop.
  - questionId: push-pop-trace-review
    disposition: keep
    path: priority-order
    skill: predict-push-pop
    note: Review variant on a fresh input (step-through trace). Predict each pop around two late pushes.
  - questionId: which-push-moves-root-review
    disposition: keep
    path: priority-order
    skill: predict-push-pop
    note: Review variant on a fresh input. Pick the push that changes the root.
  - questionId: checkpoint-which-structure
    disposition: exam
    path: priority-order
    note: New checkpoint item. Infer the structure that served an arriving stream in a given order.
  - questionId: checkpoint-timed-stream
    disposition: exam
    path: priority-order
    note: New checkpoint item. Order a timed stream of jobs by priority, counting only jobs that have arrived.
  - questionId: checkpoint-fifo-fits
    disposition: exam
    path: priority-order
    note: New checkpoint item. Choose a deque when arrival order is the rule and a heap would only add cost.
  - questionId: checkpoint-next-served
    disposition: exam
    path: priority-order
    note: New checkpoint item (tap the cell). Tap the job the last pop serves after pushes and pops interleave.

followUps:
  - questionId: heapq-min-heap
    optionId: plain-pops
    disposition: keep
    path: priority-order
    note: Promote the one-pop prediction to early Priority order practice.
