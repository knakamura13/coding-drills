    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: Trace two pushes and one pop on a list used as a stack. Its worked example introduces the path.
  - questionId: peek-or-pop
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: 'Predict what `stack[-1]` reads and that it leaves the length unchanged, against a pop.'
  - questionId: empty-pop-raises
    disposition: keep
    path: stack-matching
    skill: push-pop-recent
    note: 'Predict that a second `pop()` on a one-item stack raises `IndexError`, not `None` or the old item.'
  - questionId: which-opener-matches
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: Tap the opener a closer pops once nearer pairs have closed. The prompt defines balanced and restates the stack, and the worked example also introduces the path for a learner who skipped the primer.
  - questionId: wrong-type-closer
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: Drag the pointers to the closer that pops the wrong type and the opener it pops.
  - questionId: closer-compares-top
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: 'Find the crossed string that a matcher using `in` and `remove` instead of a pop accepts.'
  - questionId: decode-nested-string
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: 'Predict what `decode` returns on a nested string: each `]` pops the text and the one-digit count saved at its own `[`, the most recent group still open, and puts the saved text in front of the repeated piece.'
  - questionId: calculator-signed-terms
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: 'Step through a calculator for `+ - * /` with no brackets on `3+2*2`: the stack holds signed terms, `*` or `/` pops the top term and pushes it combined, and `print(sum(stack))` prints 7.'
  - questionId: pop-empty-guard
    disposition: keep
    path: stack-matching
    skill: match-closer
    note: 'Predict that the guarded matcher returns `False` on a stray closer without popping, since `or` stops at a true `not stack`. The prompt teaches short-circuit `and` and `or`.'
  - questionId: unmatched-opener
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: Tap the opener still on the stack when the scan ends.
  - questionId: asteroid-survivors
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: 'Step through asteroid collision: a left-moving rock pops smaller right-moving tops, an equal top takes the rock with it, and a larger top destroys it. Predict the stack after each collision and the rocks that remain.'
  - questionId: leftover-opener
    disposition: keep
    path: stack-matching
    skill: inspect-final-stack
    note: 'Find the string a matcher ending in `return True` accepts, the one that leaves an opener on the stack.'
