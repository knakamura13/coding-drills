  - questionId: middle-node
    disposition: retire
    path: pointer-walks
    note: 'Absorbed into Pointer walks as `second-middle-return`, with `.next` for `.link`. The older deck stays as a fixture.'
  - questionId: dummy-head
    disposition: retire
    path: link-rewrites
    note: 'Absorbed into Link rewrites as `first-node-missed`, which shows the node a loop without a dummy never tests. The older deck stays as a fixture.'
  - questionId: remove-nth-from-end
    disposition: retire
    path: pointer-walks
    note: 'Not copied: its right setup is the code `stop-before-target` and `head-removal-gap` show, so it is answerable from memory. The older deck stays as a fixture.'
  - questionId: cycle-detection
    disposition: retire
    path: pointer-walks
    note: 'Its rewrite is done: `odd-length-hops`, `even-guard-crash` and `equal-values-not-same` teach it, and `checkpoint-debug-cycle-guard` tests it. The older deck stays as a fixture.'
  - questionId: cost-model
    disposition: retire
    path: link-rewrites
    note: 'Carried by Link rewrites'' `linked-list-cost`: a splice after a held node against reaching a node and inserting into a Python list. The older deck stays as a fixture.'
