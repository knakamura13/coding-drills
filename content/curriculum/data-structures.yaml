# Data structures. Part of the mastery map (issue #12).
id: data-structures
title: Data structures
summary: Stacks, heaps, linked lists, and structures designed to meet stated costs, from one operation up to a combined use.
order: 3

paths:
  - id: stack-matching
    title: Stack matching
    summary: Push and pop the latest item, match a closer, and read the stack that remains.
    after: [arrays-and-strings]
    levels:
      - id: push-pop-recent
        title: Push and pop the most recent item
      - id: match-closer
        title: Match a closer
      - id: inspect-final-stack
        title: Inspect the final stack
    checkpoints:
      - id: decide-balanced
        title: Decide balancedness
        summary: Decide balancedness on a mixed string.

  - id: monotonic-stack
    title: Monotonic stack
    summary: Keep waiting positions, resolve smaller tops, and account for the whole run. Window maximum is a separate fork.
    after: [stack-matching, growth-rates]
    afterNote: Reading an index is the Arrays and strings skill for telling an index from its value. Growth rates gives the big-O for the cost of a whole run.
    needs: [read-index]
    levels:
      - id: identify-waiting-position
        title: Identify a waiting position
      - id: resolve-smaller-tops
        title: Resolve strictly smaller tops
      - id: interpret-leftovers
        title: Interpret leftovers and count total operations
    forks:
      - id: window-maximum
        title: Window maximum
        after: resolve-smaller-tops
        levels:
          - id: drop-expired-front
            title: Drop an expired front
    checkpoints:
      - id: next-greater-and-cost
        title: Next greater, a window maximum, and the cost
        summary: Solve next-greater or a window maximum on new inputs, and justify the full-run cost.
        mix: [next-greater, window-max]

  - id: priority-order
    title: Priority order
    summary: Tell a FIFO queue from a priority queue, find the heap root, and predict one push or pop.
    after: [operation-costs]
    afterNote: Operation costs brings the queue (first in, first out, `deque` and `popleft`), and through Growth rates the big-O names.
    levels:
      - id: fifo-versus-priority
        title: Distinguish FIFO from minimum priority
      - id: identify-heap-root
        title: Identify the heap root
      - id: predict-push-pop
        title: Predict one push or pop result
    checkpoints:
      - id: choose-job-queue
        title: Choose a queue for jobs
        summary: Choose a queue for an arriving stream of jobs.

  - id: heap-operations
    title: Heap operations
    summary: Trace one sift and compare ways to build a heap. Ties are a separate fork.
    after: [priority-order]
    afterNote: Growth rates comes through Priority order. Tuple ordering for ties is not a path of its own. The tie fork covers that comparison.
    levels:
      - id: trace-one-sift
        title: Trace one sift
      - id: compare-build-strategies
        title: Compare build strategies
    forks:
      - id: heap-ties
        title: Ties
        levels:
          - id: compare-priority-fields
            title: Compare priority fields
          - id: choose-tie-breaker
            title: Choose a comparable tie-breaker
    checkpoints:
      - id: compare-construction-or-ties
        title: Compare construction or repair ties
        summary: Compare construction strategies or repair tied entries.
        mix: [construction, ties]

  - id: bounded-heaps
    title: Bounded heaps
    summary: Evict to keep a size limit, and price it. Merging sorted runs and the running median are separate forks.
    after: [heap-operations]
    afterNote: Heap operations brings `heapify`, the O(log n) cost of one push or pop, and tuple entries that settle ties. Priority order comes through it, with the negated push that pops the largest first.
    levels:
      - id: track-eviction-candidate
        title: Track the eviction candidate
      - id: preserve-size-limit
        title: Preserve a size limit
    forks:
      - id: stream-merge
        title: Merge
        levels:
          - id: expose-stream-head
            title: Put one front per run in the heap
          - id: replenish-popped-stream
            title: Refill the run just popped
      - id: running-median
        title: Running median
        after: preserve-size-limit
        levels:
          - id: balance-two-heaps
            title: Balance two heaps
    checkpoints:
      - id: top-k-or-merge
        title: Top K, a lazy merge, or a running median
        summary: Select top K or merge sorted runs within a memory limit, or keep a running median balanced across two heaps, on new inputs.
        mix: [top-k, merge, median]

  - id: link-rewrites
    title: Link rewrites
    summary: Follow a link, save and redirect a link, and handle the first node.
    after: [names-and-objects, operation-costs]
    afterNote: Names and objects brings names that share one object and what rebinding a parameter does. Operation costs brings the cost of inserting into a Python list and, through Growth rates, the big-O names, which the linked-list cost card uses.
    levels:
      - id: follow-successor
        title: Follow a link
      - id: save-and-redirect
        title: Save and redirect a link
      - id: handle-first-node
        title: Handle the first node
    checkpoints:
      - id: reverse-links
        title: Reverse or merge links
        summary: Reverse or merge linked lists without losing the rest.

  - id: pointer-walks
    title: Pointer walks
    summary: Advance one or two hops, hold a gap or a speed, and stop cleanly.
    after: [link-rewrites]
    levels:
      - id: advance-safely
        title: Advance one or two hops safely
      - id: maintain-gap-or-speed
        title: Maintain a fixed gap or relative speed
      - id: handle-walk-termination
        title: Handle termination
    checkpoints:
      - id: unlink-or-cycle
        title: Unlink or detect a cycle
        summary: Unlink the nth-from-end node or distinguish a cycle from repeated values.

  - id: design-structures
    title: Design structures
    summary: Carry a summary in each stack entry, build a queue from two stacks, and keep a map and a list in step.
    after: [stack-matching, hash-lookups, link-rewrites]
    afterNote: Stack matching brings a list used as a stack. Hash lookups brings dict lookups that cost O(1) on average, and through Operation costs amortized cost and the big-O names. Link rewrites brings the node class and unlinking a node.
    levels:
      - id: carry-a-summary
        title: Carry a summary in each entry
      - id: move-between-two-stacks
        title: Move items between two stacks
      - id: keep-two-in-step
        title: Keep two structures in step
    checkpoints:
      - id: meet-stated-costs
        title: Meet stated costs
        summary: Pick the design that meets a stated set of costs, or find the run a near-miss design gets wrong.

