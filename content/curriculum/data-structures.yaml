# Data structures. Part of the mastery map (issue #12).
id: data-structures
title: Data structures
summary: Stacks, heaps, and linked lists, from one operation up to a combined use.
order: 3

paths:
  - id: stack-matching
    title: Stack matching
    summary: Push and pop the latest item, match a closer, and read the stack that remains.
    after: [arrays-and-strings]
    levels:
      - id: push-pop-recent
        title: Push and pop the most recent item
      - id: match-closer
        title: Match a closer
      - id: inspect-final-stack
        title: Inspect the final stack
    checkpoints:
      - id: decide-balanced
        title: Decide balancedness
        summary: Decide balancedness on a mixed string.

  - id: monotonic-stack
    title: Monotonic stack
    summary: Keep waiting positions, resolve smaller tops, and account for the whole run.
    after: [stack-matching, growth-rates]
    afterNote: Index versus value is the arrays skill for reading an index. Growth rates is for the cost.
    needs: [read-index]
    levels:
      - id: identify-waiting-position
        title: Identify a waiting position
      - id: resolve-smaller-tops
        title: Resolve strictly smaller tops
      - id: interpret-leftovers
        title: Interpret leftovers and count total operations
    checkpoints:
      - id: next-greater-and-cost
        title: Next greater and its cost
        summary: Solve next-greater and justify the full-run cost.

  - id: priority-order
    title: Priority order
    summary: Tell a FIFO queue from a priority queue, find the heap root, and predict one push or pop.
    after: [arrays-and-strings]
    levels:
      - id: fifo-versus-priority
        title: Distinguish FIFO from minimum priority
      - id: identify-heap-root
        title: Identify the heap root
      - id: predict-push-pop
        title: Predict one push or pop result
    checkpoints:
      - id: choose-job-queue
        title: Choose a queue for jobs
        summary: Choose a queue for an arriving stream of jobs.

  - id: heap-operations
    title: Heap operations
    summary: Trace one sift and compare ways to build a heap. Ties are a separate fork.
    after: [priority-order, growth-rates]
    afterNote: Tuple ordering for ties is named in the plan and is not a path of its own. The tie fork covers that comparison.
    levels:
      - id: trace-one-sift
        title: Trace one sift
      - id: compare-build-strategies
        title: Compare build strategies
    forks:
      - id: heap-ties
        title: Ties
        levels:
          - id: compare-priority-fields
            title: Compare priority fields
          - id: choose-tie-breaker
            title: Choose a comparable tie-breaker
    checkpoints:
      - id: compare-construction-or-ties
        title: Compare construction or repair ties
        summary: Compare construction strategies or repair tied entries.

  - id: bounded-heaps
    title: Bounded heaps
    summary: Evict to keep a size limit. Merging sorted streams is a separate fork.
    after: [priority-order, operation-costs]
    levels:
      - id: track-eviction-candidate
        title: Track the eviction candidate
      - id: preserve-size-limit
        title: Preserve a size limit
    forks:
      - id: stream-merge
        title: Merge
        levels:
          - id: expose-stream-head
            title: Expose one head per stream
          - id: replenish-popped-stream
            title: Replenish the stream just popped
    checkpoints:
      - id: top-k-or-merge
        title: Top K or a lazy merge
        summary: Meet a memory limit while selecting top K or merging lazily.

  - id: link-rewrites
    title: Link rewrites
    summary: Follow a successor, save and redirect an edge, and handle the first node.
    after: [names-and-objects]
    levels:
      - id: follow-successor
        title: Follow a successor
      - id: save-and-redirect
        title: Save and redirect an edge
      - id: handle-first-node
        title: Handle the first node
    checkpoints:
      - id: reverse-links
        title: Reverse links
        summary: Reverse links without losing the remainder.

  - id: pointer-walks
    title: Pointer walks
    summary: Advance one or two hops, hold a gap or a speed, and stop cleanly.
    after: [link-rewrites]
    levels:
      - id: advance-safely
        title: Advance one or two hops safely
      - id: maintain-gap-or-speed
        title: Maintain a fixed gap or relative speed
      - id: handle-walk-termination
        title: Handle termination
    checkpoints:
      - id: unlink-or-cycle
        title: Unlink or detect a cycle
        summary: Unlink the nth-from-end node or distinguish a cycle from repeated values.

drills:
  - questionId: shortest-job-first
    disposition: rewrite
    path: priority-order
    skill: fifo-versus-priority
    note: Give three pending jobs and one arrival. Pick the next job before choosing the structure.
  - questionId: heapq-min-heap
    disposition: rewrite
    path: priority-order
    skill: predict-push-pop
    note: Predict one minimum pop first. Teach reversing numeric priorities in a later variant.
  - questionId: top-k-min-heap
    disposition: exam
    path: bounded-heaps
    note: Choose which score to evict, then justify the size bound for a stream.
  - questionId: heapify-vs-pushes
    disposition: exam
    path: heap-operations
    tests: [trace-one-sift, compare-build-strategies]
    note: Connect tree height, one sift and bottom-up construction on existing input.
  - questionId: heap-tie-typeerror
    disposition: rewrite
    path: heap-operations
    skill: choose-tie-breaker
    note: Compare equal-priority entries once, then introduce a unique tie-breaker before opaque payloads.
  - questionId: merge-k-sorted
    disposition: exam
    path: bounded-heaps
    note: Track one head per stream, choose which to replenish and bound memory.
  - questionId: reverse-in-place
    disposition: exam
    path: link-rewrites
    tests: [follow-successor, save-and-redirect]
    note: Combine saving the successor, redirecting an edge and advancing both references.
  - questionId: middle-node
    disposition: keep
    path: pointer-walks
    skill: handle-walk-termination
    note: Trace one- and two-hop cursors on an even-length list after one-hop practice.
  - questionId: dummy-head
    disposition: rewrite
    path: link-rewrites
    skill: handle-first-node
    note: Draw a sentinel before a one-node list and ask which edge changes when the head is removed.
  - questionId: remove-nth-from-end
    disposition: exam
    path: pointer-walks
    tests: [maintain-gap-or-speed, handle-walk-termination]
    note: Combine a fixed gap and a sentinel including the head-removal case.
  - questionId: cycle-detection
    disposition: rewrite
    path: pointer-walks
    skill: advance-safely
    note: First trace safe two-hop access on odd and even lists, then distinguish node identity from equal values.
  - questionId: cost-model
    disposition: rewrite
    path: link-rewrites
    skill: save-and-redirect
    note: Separate locating a node from splicing after a node already held; compare array insertion later.
  - questionId: next-taller-stall
    disposition: exam
    path: monotonic-stack
    tests: [identify-waiting-position, resolve-smaller-tops]
    note: Choose and trace the waiting stack on an unfamiliar next-greater problem.
  - questionId: stack-holds-indices
    disposition: keep
    path: monotonic-stack
    skill: identify-waiting-position
    note: Select an entry that retains both the height lookup and the distance.
  - questionId: stack-loop-cost
    disposition: exam
    path: monotonic-stack
    tests: [resolve-smaller-tops, interpret-leftovers]
    note: Combine tracing pops with counting total pushes and pops over a whole run.
  - questionId: strict-vs-nonstrict
    disposition: rewrite
    path: monotonic-stack
    skill: resolve-smaller-tops
    note: Start with two equal heights and ask whether either is resolved; translate to a comparison later.
  - questionId: bracket-balance
