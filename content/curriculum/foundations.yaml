# Foundations. Part of the mastery map (issue #10). Decisions are recorded
# here and are not applied to the decks yet.
id: foundations
title: Foundations
summary: Shared index, name, and cost skills that the other branches build on.
order: 1

paths:
  - id: arrays-and-strings
    title: Arrays and strings
    summary: Read an index, trace a scan, and tell a copy from a view.
    after: []
    levels:
      - id: read-index
        title: Read a zero-based index or character
      - id: trace-scan
        title: Trace a scan
      - id: copy-versus-view
        title: Distinguish a copy from a view or reference
    checkpoints:
      - id: trace-two-cursor-edit
        title: Trace a two-cursor edit
        summary: Trace a two-cursor string or array edit on a new input.

  - id: problem-solving-routine
    title: Problem-solving routine
    summary: Restate the output, pick a counterexample, and trace a brute-force solution.
    after: [arrays-and-strings]
    levels:
      - id: restate-output
        title: Restate the output
      - id: pick-counterexample
        title: Pick a counterexample
      - id: trace-brute-force
        title: Trace the simplest correct solution
    checkpoints:
      - id: separate-two-procedures
        title: Separate two procedures
        summary: Choose a test that separates two plausible procedures.

  - id: names-and-objects
    title: Names and objects
    summary: Follow a reference, tell assignment from mutation, and predict shared state.
    after: [arrays-and-strings]
    levels:
      - id: follow-reference
        title: Follow a reference
      - id: assignment-versus-mutation
        title: Distinguish assignment from mutation
      - id: predict-shared-state
        title: Predict shared state
    checkpoints:
      - id: caller-visible-changes
        title: Predict caller-visible changes
        summary: Predict which caller-visible objects change on a fresh example.

  - id: growth-rates
    title: Growth rates
    summary: Count operations, compare how the counts grow, and account for allocated output.
    after: [arrays-and-strings]
    levels:
      - id: count-operations
        title: Count concrete operations
      - id: compare-growth
        title: Compare how counts grow
      - id: account-for-output
        title: Account for allocated output
    checkpoints:
      - id: predict-doubling
        title: Predict growth when the input doubles
        summary: Trace a small input, then predict growth when it doubles.

  - id: operation-costs
    title: Operation costs
    summary: Price one operation, add sequential phases, and multiply a repeated cost.
    after: [growth-rates]
    afterNote: Basic set, dictionary, and queue operations apply where an exercise uses them. They are not a separate path yet.
    levels:
      - id: price-primitive
        title: Price a primitive operation
      - id: combine-sequential-costs
        title: Combine sequential costs
      - id: multiply-repeated-cost
        title: Multiply a repeated cost
    checkpoints:
      - id: compare-duplicate-checks
        title: Compare two duplicate checks
        summary: Compare two duplicate checks under time and space constraints.

  - id: hidden-work
    title: Hidden work
    summary: Spot a hidden scan or copy, count how often it runs, and combine the costs.
    after: [operation-costs, recursive-calls]
    afterNote: Recursive calls gate the slicing item.
    levels:
      - id: spot-hidden-scan
        title: Spot a hidden scan or copy
      - id: count-repetitions
        title: Count how often it occurs
      - id: combine-hidden-costs
        title: Combine the costs
    checkpoints:
      - id: explain-dominant-line
        title: Explain the dominant line
        summary: Explain which line dominates, or how to remove repeated work while preserving the output.

drills:
  - questionId: binary-search-lookup
    disposition: keep
    path: growth-rates
    skill: compare-growth
    note: Relate repeated halving to probe count after learners have physically discarded half an array.
  - questionId: triangle-loops
    disposition: keep
    path: growth-rates
    skill: compare-growth
    note: Count the shrinking inner loop after tracing a small input.
  - questionId: frequency-count
    disposition: keep
    path: operation-costs
    skill: multiply-repeated-cost
    note: A single pass with one expected constant-time dictionary update per item.
  - questionId: sort-then-scan
    disposition: keep
    path: operation-costs
    skill: combine-sequential-costs
    note: Combine consecutive operations and identify the dominant cost.
  - questionId: reverse-extra-space
    disposition: keep
    path: growth-rates
    skill: account-for-output
    note: Count a concrete output allocation with the space convention stated.
  - questionId: slice-in-recursion
    disposition: exam
    path: hidden-work
    tests: [spot-hidden-scan, combine-hidden-costs]
    note: Combine shrinking copies, recursive calls and total work.
  - questionId: membership-in-loop
    disposition: exam
    path: hidden-work
    tests: [spot-hidden-scan, count-repetitions]
    note: Choose where to build a set while preserving multiplicity and original order.
  - questionId: queue-front-removal
    disposition: rewrite
    path: operation-costs
    skill: price-primitive
    note: Show a three-item FIFO queue. Ask which removal shifts the remaining items, then introduce deque.
  - questionId: shared-row-grid
    disposition: keep
    path: names-and-objects
    skill: predict-shared-state
    note: Predict one visible mutation after learning what two references to one row mean.
  - questionId: mutate-or-rebind
    disposition: rewrite
    path: names-and-objects
    skill: assignment-versus-mutation
    note: Separate mutating one list from assigning a new list before comparing the two functions.
  - questionId: sorted-in-loop
    disposition: exam
    path: hidden-work
    tests: [count-repetitions, combine-hidden-costs]
    note: Recognize a sort and a scan inside each iteration and compose their costs.
  - questionId: cost-nested-slice-sum
    disposition: exam
    path: hidden-work
    tests: [spot-hidden-scan, combine-hidden-costs]
    note: Combine counting intervals with per-slice copy and sum costs.
