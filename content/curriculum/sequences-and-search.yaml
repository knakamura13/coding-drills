    note: '`checkpoint-count-cost` asks for the same bound, O(n) time and O(k) extra space, on the same function family. The older deck stays as a fixture.'
  - questionId: window-needs-monotonic-sums
    disposition: retire
    path: window-limits
    note: 'Its answer, no negative values, is the path''s headline, which `limit-why-stop-safe`, `limit-zeros-safe` and `limit-review-which-task` ask. The older deck stays as a fixture.'

  - questionId: sum-step-too-small
    disposition: retire
    path: pointer-scans
    note: 'Absorbed into the Pointer scans review as `move-small-sum-review`. The older deck stays as a fixture.'
  - questionId: pair-skips-repeats
    disposition: retire
    path: pointer-scans
    note: 'Absorbed into the Pointer scans review as `skip-both-runs-review`. The older deck stays as a fixture.'
  - questionId: compact-keeps-value
    disposition: retire
    path: pointer-scans
    note: 'Absorbed into the Pointer scans review as `compact-step-review`. The older deck stays as a fixture.'

  - questionId: which-half-remains
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    note: 'Name the indices left after a probe that is too big. Its worked example introduces the path: a sorted list, a target and a probe.'
  - questionId: order-makes-discard-safe
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    note: 'On an unsorted list, the same drop throws the target away.'
  - questionId: tap-next-probe
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    note: 'Tap the next probe, `(lo + hi) // 2`, in the inclusive range that is left.'
  - questionId: drop-the-probe
    disposition: keep
    path: exact-search
    skill: exclude-probed-index
    note: 'Place `lo` past a probe that is too small, with `hi` left where it is.'
  - questionId: update-after-high-probe
    disposition: keep
