# Sequences and search. Part of the mastery map (issue #11).
id: sequences-and-search
title: Sequences and search
summary: Search, hashes, ordering, intervals, and windows over a sequence.
order: 2

paths:
  - id: exact-search
    title: Exact search
    summary: Discard a sorted half, skip the probed index, and tell one candidate from none.
    after: [arrays-and-strings]
    levels:
      - id: discard-sorted-half
        title: Discard a sorted half
      - id: exclude-probed-index
        title: Exclude the probed index
      - id: one-candidate-or-none
        title: Distinguish one candidate from none
    checkpoints:
      - id: diagnose-search-loop
        title: Diagnose a search loop
        summary: Select a whole loop and diagnose a stalled variant on new values.
        mix: [select-loop, diagnose-stall]

  - id: boundary-search
    title: Boundary search
    summary: Find an insertion boundary, and on a separate fork search a rotated list.
    after: [exact-search]
    levels:
      - id: locate-insertion-boundary
        title: Locate an insertion boundary
      - id: retain-equal-side
        title: Decide which side retains an equal value
    forks:
      - id: rotated-range
        title: Rotated search
        levels:
          - id: identify-sorted-half
            title: Identify a sorted half
          - id: choose-rotated-side
            title: Choose a side after rotation
    checkpoints:
      - id: repair-boundary-update
        title: Repair a boundary update
        summary: Repair a boundary update on a new input.
        requires: [locate-insertion-boundary, retain-equal-side]
      - id: rotated-search-variant
        title: Rotated search
        summary: Use a rotated-search variant after both rotated skills.
        requires: [identify-sorted-half, choose-rotated-side]

  - id: pointer-scans
    title: Pointer scans
    summary: Choose which end moves, keep indices distinct, and handle repeats.
    after: [arrays-and-strings]
    afterNote: The scans from both ends assume a sorted input. They do not need the Sort order path.
    levels:
      - id: choose-moving-end
        title: Choose which end moves
      - id: preserve-distinct-indices
        title: Preserve distinct indices
      - id: handle-repeats
        title: Handle repeats
    forks:
      - id: compaction
        title: Compaction
        levels:
          - id: read-compaction-value
            title: Read a value
          - id: decide-to-write
            title: Decide whether to write it
    checkpoints:
      - id: unique-pairs-or-compaction
        title: Unique pairs or compaction
        summary: Return unique pairs or trace in-place compaction on duplicates.
        mix: [unique-pairs, compaction]

  - id: palindromes
    title: Palindromes
    summary: Compare mirrored characters, allow one deletion, and grow a palindrome from its center.
    after: [pointer-scans]
    levels:
      - id: compare-mirrored-pair
        title: Compare mirrored pairs
      - id: allow-one-skip
        title: Allow one deletion
      - id: expand-from-center
        title: Expand from a center
    checkpoints:
      - id: check-or-expand
        title: Check or expand
        summary: Check a phrase, allow one deletion, or grow from a center, on new inputs.

  - id: sort-order
    title: Sort order
    summary: Read a sort key, handle ties, and tell an in-place sort from a returned one.
    after: [names-and-objects]
    afterNote: The in-place cards and the alias items turn on two names sharing one list, which Names and objects teaches.
    levels:
      - id: read-sort-key
        title: Read a sort key
      - id: break-or-preserve-ties
        title: Break or preserve ties
      - id: in-place-versus-returned
        title: Distinguish in-place and returned results
    checkpoints:
      - id: predict-ordering
        title: Predict the ordering
        summary: Predict the ordering and which list changes.
        mix: [ordering, which-list]

  - id: interval-merging
    title: Interval merging
    summary: Draw endpoints, apply the touching rule, and extend the running end.
    after: [sort-order]
    levels:
      - id: draw-endpoints
        title: Draw endpoints
      - id: apply-touching-rule
        title: Apply the stated touching rule
      - id: extend-running-end
        title: Extend the running end
    checkpoints:
      - id: insert-overlapping-ranges
        title: Insert into overlapping intervals
        summary: Insert into a sorted list of intervals when the new one overlaps several, or find the call that breaks a merge.

  - id: event-sweeps
    title: Event sweeps
    summary: Turn endpoints into events, order ties, and track the active count.
    after: [sort-order, interval-merging]
    levels:
      - id: translate-events
        title: Translate start and end to events
      - id: order-event-ties
        title: Order ties
      - id: track-active-peak
        title: Track active and peak counts
    checkpoints:
      - id: rooms-needed
        title: Determine rooms needed
        summary: Determine rooms needed on an unfamiliar schedule.

  - id: hash-lookups
    title: Hash lookups
    summary: Read a set or dictionary, pick a key, and track what has been seen.
    after: [operation-costs]
    afterNote: Operation costs prices a set or dict key test.
    levels:
      - id: read-set-or-dictionary
        title: Read a set or dictionary
      - id: select-key-or-complement
        title: Select a key or complement
      - id: maintain-seen
        title: Maintain what has been seen
    checkpoints:
      - id: recognize-run-starts
        title: Run starts and pairs
        summary: Recognize run starts, explain why each value needs one visit, and choose the lookups for a pair search.
        mix: [run-starts, one-visit, pair-lookup]

  - id: prefix-counts
    title: Prefix counts
    summary: Build a prefix sum list, subtract two entries to sum a subarray, and count earlier matches.
    after: [hash-lookups, arrays-and-strings]
    levels:
      - id: build-prefix
        title: Build a prefix including the empty prefix
      - id: subtract-prefixes
        title: Subtract two prefixes
      - id: count-prior-prefixes
        title: Count prior matching prefixes
    checkpoints:
      - id: count-signed-ranges
        title: Count signed subarrays
        summary: Count the subarrays with a given sum when prefix sums repeat or return to 0.

  - id: variable-windows
    title: Variable windows
    summary: Update a fixed window, move its bounds, and restore validity before recording.
    after: [hash-lookups, arrays-and-strings]
    levels:
      - id: update-fixed-window
        title: Update a fixed-size window
      - id: maintain-moving-counts
        title: Maintain counts as bounds move
      - id: restore-validity
        title: Restore validity before recording results
    checkpoints:
      - id: count-valid-suffixes
        title: Count valid subarrays
        summary: Count the valid subarrays, repair a scan or bound its time and space on a fresh log.
        mix: [valid-suffixes, cost-bound]

  - id: window-limits
    title: Window limits
    summary: See when shrinking a window by its total is safe, and when a negative value breaks it.
    after: [variable-windows, prefix-counts]
    afterNote: Prefix counts is for comparing methods.
    levels:
      - id: trace-nonnegative-sum
        title: Trace a sum with nonnegative values
      - id: trace-negative-removal
        title: Trace one negative removal
      - id: identify-safe-decision
        title: Identify when the decision is safe
    checkpoints:
      - id: select-window-method
        title: Select a window method
        summary: Explain a lost subarray, find the input that breaks the window, and select a method for the stated task.

  - id: feasible-limits
    title: Feasible limits
    summary: Test one limit, find the false-to-true change, and shrink the answer range.
    after: [boundary-search, greedy-choices, operation-costs]
    afterNote: Boundary search is for the half-open loop, and clearing it, the rotated fork included, is part of the gate. Greedy choices is for packing. Operation costs is for the scan cost.
    levels:
      - id: evaluate-one-limit
        title: Evaluate one limit
      - id: false-to-true-transition
        title: Identify the single false-to-true transition
      - id: shrink-answer-range
        title: Shrink the answer range
    checkpoints:
      - id: smallest-feasible-limit
        title: Find the smallest feasible limit
        summary: Find the smallest feasible limit, choose a search for a new task, and account for the scan per probe.

drills:
  - questionId: sorted-array-search-loop
    disposition: retire
    path: exact-search
    note: 'Retired. Its loop is the one `checkpoint-one-change` prints, so the Exact search checkpoint asks for the past-the-end loop instead, in `checkpoint-pick-past-end-loop`. The older deck stays as a fixture.'
  - questionId: search-the-answer-sessions
    disposition: retire
    path: feasible-limits
    note: 'Absorbed into the Feasible limits checkpoint as `checkpoint-pick-speed-search`, which picks bounds and test together on a new task, since the other items print the sessions bounds and test as working code. The older deck stays as a fixture.'
  - questionId: rotated-array-search
    disposition: retire
    path: boundary-search
    note: 'Retired. Boundary search''s rotated cards teach both halves of its planned rewrite: find the sorted part, then choose the side.'
  - questionId: binary-search-preconditions
    disposition: retire
    path: exact-search
    note: Retired. order-makes-discard-safe is the unsorted counterexample this rewrite asked for (#95 pilot). Indexed-access cost belongs in Foundations.
  - questionId: answer-search-total-cost
    disposition: retire
    path: feasible-limits
    note: 'Absorbed into Feasible limits as `count-search-reads`, which asks for the count first and then the growth. The older deck stays as a fixture.'
  - questionId: two-sum-unsorted
    disposition: retire
    path: hash-lookups
    note: 'Absorbed into the Hash lookups checkpoint as `checkpoint-debug-store-first`, the store-first bug on a concrete call. The older deck stays as a fixture.'
  - questionId: group-anagrams-key
    disposition: retire
    path: hash-lookups
    note: 'Absorbed into the Hash lookups teaching deck as `anagram-key-choice`, with the key rule in its prompt. The older deck stays as a fixture.'
  - questionId: longest-consecutive-set
    disposition: retire
    path: hash-lookups
    note: '`checkpoint-why-linear` explains the same approach, so this item could be answered from memory. The older deck stays as a fixture.'
  - questionId: subarray-sum-equals-k
    disposition: retire
    path: prefix-counts
    note: 'Absorbed into the Prefix counts checkpoint as `checkpoint-pick-count-method`, with every pair of prefix sum entries in place of the untaught sliding window. The older deck stays as a fixture.'
  - questionId: contains-duplicate-tradeoff
    disposition: retire
    path: hash-lookups
    note: 'Absorbed into the Hash lookups review deck as `duplicate-check-cost-review`, with each cost named from Operation costs. The older deck stays as a fixture.'
  - questionId: hash-map-cost-model
    disposition: retire
    path: hash-lookups
    note: '`anagram-key-choice` teaches its valid-key half. The key-length cost is past what Operation costs teaches. The older deck stays as a fixture.'
  - questionId: subarray-sum-k
    disposition: retire
    path: prefix-counts
    note: 'Retired: it asks the same signed exact-sum question as `checkpoint-pick-count-method`. Its follow-ups retire with it.'
  - questionId: merge-intervals-sort-start
    disposition: retire
    path: interval-merging
    note: 'Absorbed into Interval merging as `unsorted-loses-start`. The older deck stays as a fixture.'
  - questionId: meeting-rooms-touching
    disposition: retire
    path: interval-merging
    note: '`first-clash-tap` asks the same check on a concrete list, and the "most efficient" framing needs costs this path does not teach. The older deck stays as a fixture.'
  - questionId: insert-interval-three-phases
    disposition: retire
    path: interval-merging
    note: 'Absorbed into the Interval merging checkpoint as `checkpoint-insert-plan`, without the cost claim. The older deck stays as a fixture.'
  - questionId: sorted-key-stability
    disposition: retire
    path: sort-order
    note: '`pair-comparison`, `two-record-tie`, `sort-returns-none` and `trace-sort-names` teach its three parts one at a time. The older deck stays as a fixture.'
  - questionId: sweep-line-minimum-rooms
    disposition: retire
    path: event-sweeps
    note: 'Its choice, an end before a start at the same time, is the answer to `tie-rule-review`, so it could be answered from memory. The older deck stays as a fixture.'
  - questionId: too-large-sum
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    note: States the pair-sum task and the scan from both ends, then asks which end a too-large sum moves. The worked example introduces the path on a too-small sum.
  - questionId: ruled-out-pairs
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    note: Name the pairs one step of the scan skips without checking them, and why skipping them is safe.
  - questionId: trace-scan-to-target
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    note: 'Step through a whole scan from both ends: which end each sum moves, the next sum, and the `break` on a match. Absorbed from `trace-sum-to-target`.'
  - questionId: self-pair
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    note: Choose the loop test that stops a self-pair but keeps two equal copies at different indices.
  - questionId: equal-copies
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    note: Two equal copies at different indices form a pair. Predict the indices the scan returns.
  - questionId: skip-run
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    note: 'To list each pair once, `l` steps over its run of copies after a match. Place `l` after those lines.'
  - questionId: trace-distinct-pairs
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    note: 'Step through a scan that steps over both runs after each match, and count the distinct pairs. Absorbed from `trace-unique-pairs`, rewritten to look back for copies.'
  - questionId: read-then-write
    disposition: keep
    path: pointer-scans
    skill: read-compaction-value
    note: First compaction card. Say what one step of in-place removal reads and which index it writes.
  - questionId: trace-remove-value
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    note: 'Step through an in-place removal: where `write` sits, what a write puts into a cell, and the leftover past `write`. Absorbed from `trace-drop-value`.'
  - questionId: first-write
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    note: Decide which items an in-place dedupe writes, including the first write into an empty prefix and the untouched tail.
  - questionId: trace-pairs-review
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    variant: true
    note: List every pair a scan from both ends checks on a fresh input.
  - questionId: move-small-sum-review
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    variant: true
    note: 'Drag both pointers after a too-small sum: `l` moves and `r` stays. Moved from `sum-step-too-small`.'
  - questionId: self-pair-review
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    variant: true
    note: 'Predict what a `while l <= r` scan returns when one item meets itself.'
  - questionId: equal-copies-review
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    variant: true
    note: Return the indices of a pair made of two equal copies.
  - questionId: skip-right-run-review
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    variant: true
    note: 'Place `r` after it steps over its run of copies.'
  - questionId: repeat-trace-review
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    variant: true
    note: Trace the repeated pairs a scan records when it steps by one after a match.
  - questionId: skip-both-runs-review
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    variant: true
    note: 'Drag both pointers past their runs of copies after a recorded pair. Moved from `pair-skips-repeats`, rewritten to look back for copies.'
  - questionId: three-sum-repeats-review
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    variant: true
    note: '3Sum with no skip for a repeated outer value: predict the repeated triple it returns.'
  - questionId: remove-value-review
    disposition: keep
    path: pointer-scans
    skill: read-compaction-value
    variant: true
    note: Predict the whole list after removing one value in place.
  - questionId: read-cursor-review
    disposition: keep
    path: pointer-scans
    skill: read-compaction-value
    variant: true
    note: Say what one compaction step reads and which index it writes, keeping even values.
  - questionId: decide-write-review
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    variant: true
    note: Decide whether a mid-trace item is written, and into which index.
  - questionId: first-write-review
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    variant: true
    note: Count what deduplicating a single run keeps.
  - questionId: compact-step-review
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    variant: true
    note: 'Drag `read` and `write` after one removal step that writes. Moved from `compact-keeps-value`.'
  - questionId: checkpoint-unique-pairs
    disposition: exam
    path: pointer-scans
    covers: [unique-pairs]
    tests: [handle-repeats, preserve-distinct-indices]
    note: Trace unique pairs, including a pair of equal values.
  - questionId: checkpoint-duplicate-strategy
    disposition: exam
    path: pointer-scans
    covers: [unique-pairs]
    tests: [handle-repeats, preserve-distinct-indices]
    note: 'Pick the handling of repeats that lists each distinct pair once and keeps a pair of equal values. Absorbed from `sorted-pairs-with-duplicates`.'
  - questionId: checkpoint-three-sum
    disposition: exam
    path: pointer-scans
    covers: [unique-pairs]
    tests: [choose-moving-end, preserve-distinct-indices, handle-repeats]
    note: '3Sum: fix each value, scan the rest from both ends, and skip a repeated fixed value. Predict the triples.'
  - questionId: checkpoint-debug-unsorted
    disposition: exam
    path: pointer-scans
    tests: [choose-moving-end]
    note: 'Debugging: pick the call a suggested scan gets wrong when the input is not sorted, so dropping a value is not safe.'
  - questionId: checkpoint-compact-dupes
    disposition: exam
    path: pointer-scans
    covers: [compaction]
    tests: [decide-to-write, read-compaction-value]
    note: Trace in-place deduplication, including the untouched tail.
  - questionId: checkpoint-keep-two
    disposition: exam
    path: pointer-scans
    covers: [compaction]
    tests: [decide-to-write, read-compaction-value]
    note: Trace a keep-at-most-two compaction whose first two writes skip the comparison.
  - questionId: checkpoint-compact-then-pair
    disposition: exam
    path: pointer-scans
    covers: [compaction]
    tests: [decide-to-write, preserve-distinct-indices]
    note: 'Combine both lines: compaction drops a copy that an equal-value pair needed.'
  - questionId: sorted-pairs-with-duplicates
    disposition: retire
    path: pointer-scans
    note: 'Absorbed into the Pointer scans checkpoint as `checkpoint-duplicate-strategy`. The older deck stays as a fixture.'
  - questionId: mirrored-pair-third
    disposition: keep
    path: palindromes
    skill: compare-mirrored-pair
    note: 'Drag `l` and `r` to the third mirrored pair the inward check compares. The worked example introduces the path.'
  - questionId: first-mismatch-stops
    disposition: keep
    path: palindromes
    skill: compare-mirrored-pair
    note: The check returns at the first mirrored pair that differs. Drag the pointers to that pair.
  - questionId: skip-non-letters
    disposition: keep
    path: palindromes
    skill: compare-mirrored-pair
    note: 'With `isalnum()` and `lower()` stated, drag the pointers to the first pair compared after skipping punctuation.'
  - questionId: one-deletion-checks
    disposition: keep
    path: palindromes
    skill: allow-one-skip
    note: At the first pair that differs, name the two checks that leave out the left or the right character.
  - questionId: grow-odd-center
    disposition: keep
    path: palindromes
    skill: expand-from-center
    note: Grow outward from one index and drag markers onto the first and last characters of the palindrome.
  - questionId: even-center-missed
    disposition: keep
    path: palindromes
    skill: expand-from-center
    note: A search that starts only on indices misses an even-length palindrome. Predict what it returns.
  - questionId: count-comparisons
    disposition: keep
    path: palindromes
    skill: expand-from-center
    note: 'Count every comparison over all `2n - 1` centers of a string whose pairs all match.'
  - questionId: exact-case-review
    disposition: keep
    path: palindromes
    skill: compare-mirrored-pair
    variant: true
    note: The plain check compares characters exactly, so an uppercase first letter fails the first pair.
  - questionId: clean-guard-review
    disposition: keep
    path: palindromes
    skill: compare-mirrored-pair
    variant: true
    note: 'On a string with no letters, the `l < r` tests keep the pointers in range. Predict the result.'
  - questionId: right-deletion-review
    disposition: keep
    path: palindromes
    skill: allow-one-skip
    variant: true
    note: The left check fails and the right one passes. Predict the result and the deletion.
  - questionId: two-deletions-review
    disposition: keep
    path: palindromes
    skill: allow-one-skip
    variant: true
    note: Both checks fail because each leaves a second pair that differs. Predict the result.
  - questionId: grow-even-review
    disposition: keep
    path: palindromes
    skill: expand-from-center
    variant: true
    note: Grow outward from a gap and drag markers onto the palindrome it returns.
  - questionId: hardest-string-review
    disposition: keep
    path: palindromes
    skill: expand-from-center
    variant: true
    note: Pick the 5-character string that makes the center search compare the most pairs.
  - questionId: checkpoint-clean-digits
    disposition: exam
    path: palindromes
    tests: [compare-mirrored-pair]
    note: 'A phrase that reads the same by letters fails because `isalnum()` keeps a digit.'
  - questionId: checkpoint-one-deletion
    disposition: exam
    path: palindromes
    tests: [allow-one-skip, compare-mirrored-pair]
    note: Predict two one-deletion results from the definition, one fixed by a deletion and one that needs two.
  - questionId: checkpoint-longest
    disposition: exam
    path: palindromes
    tests: [expand-from-center]
    note: Predict the longest palindrome when an even one from a gap beats an odd one.
  - questionId: checkpoint-center
    disposition: exam
    path: palindromes
    tests: [expand-from-center, compare-mirrored-pair]
    note: Name the center an even-length palindrome grows from.
  - questionId: checkpoint-debug-one-side
    disposition: exam
