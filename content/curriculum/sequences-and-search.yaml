  - questionId: longest-run-at-most-k-types
    disposition: retire
    path: variable-windows
    note: 'Absorbed into the Variable windows teaching deck as `record-after-repair`, the card that places the record after the repair. The older deck stays as a fixture.'
  - questionId: shrink-while-not-if
    disposition: retire
    path: variable-windows
    note: 'Absorbed into the Variable windows checkpoint as `checkpoint-repair-shrink`, on a zero-count rule so that no other item in the pool prints its fix. The older deck stays as a fixture.'
  - questionId: slow-fast-keep-distinct
    disposition: retire
