# Sequences and search. Part of the mastery map (issue #11).
id: sequences-and-search
title: Sequences and search
summary: Search, hashes, ordering, intervals, and windows over a sequence.
order: 2

paths:
  - id: exact-search
    title: Exact search
    summary: Discard a sorted half, skip the probed index, and tell one candidate from none.
    after: [arrays-and-strings]
    levels:
      - id: discard-sorted-half
        title: Discard a sorted half
      - id: exclude-probed-index
        title: Exclude the probed index
      - id: one-candidate-or-none
        title: Distinguish one candidate from none
    checkpoints:
      - id: diagnose-search-loop
        title: Diagnose a search loop
        summary: Select a whole loop and diagnose a stalled variant on new values.
        mix: [select-loop, diagnose-stall]

  - id: boundary-search
    title: Boundary search
    summary: Find an insertion boundary, and on a separate fork search a rotated range.
    after: [exact-search]
    levels:
      - id: locate-insertion-boundary
        title: Locate an insertion boundary
      - id: retain-equal-side
        title: Decide which side retains an equal value
    forks:
      - id: rotated-range
        title: Rotated search
        levels:
          - id: identify-sorted-half
            title: Identify a sorted half
          - id: choose-rotated-side
            title: Choose a side after rotation
    checkpoints:
      - id: repair-boundary-update
        title: Repair a boundary update
        summary: Repair a boundary update on a new input.
        requires: [locate-insertion-boundary, retain-equal-side]
      - id: rotated-search-variant
        title: Rotated search
        summary: Use a rotated-search variant after both rotated skills.
        requires: [identify-sorted-half, choose-rotated-side]

  - id: feasible-limits
    title: Feasible limits
    summary: Test one limit, find the false-to-true change, and shrink the answer range.
    after: [exact-search, greedy-choices, operation-costs]
    afterNote: Greedy choices is for packing. Operation costs is for the scan cost.
    levels:
      - id: evaluate-one-limit
        title: Evaluate one limit
      - id: false-to-true-transition
        title: Identify the single false-to-true transition
      - id: shrink-answer-range
        title: Shrink the answer range
    checkpoints:
      - id: smallest-feasible-limit
        title: Find the smallest feasible limit
        summary: Find the smallest feasible limit and account for the scan per probe.

  - id: hash-lookups
    title: Hash lookups
    summary: Read a set or dictionary, pick a key, and track what has been seen.
    after: [arrays-and-strings]
    afterNote: Basic equality is assumed and is not a separate path yet.
    levels:
      - id: read-set-or-dictionary
        title: Read a set or dictionary
      - id: select-key-or-complement
        title: Select a key or complement
      - id: maintain-seen
        title: Maintain what has been seen
    checkpoints:
      - id: recognize-run-starts
        title: Recognize run starts
        summary: Recognize run starts and explain why each value needs one visit.
        mix: [run-starts, one-visit]

  - id: prefix-counts
    title: Prefix counts
    summary: Build a prefix, subtract two prefixes, and count earlier matches.
    after: [hash-lookups, arrays-and-strings]
    levels:
      - id: build-prefix
        title: Build a prefix including the empty prefix
      - id: subtract-prefixes
        title: Subtract two prefixes
      - id: count-prior-prefixes
        title: Count prior matching prefixes
    checkpoints:
      - id: count-signed-ranges
        title: Count signed ranges
        summary: Count signed ranges with repeated or zero prefixes.

  - id: sort-order
    title: Sort order
    summary: Read a sort key, handle ties, and tell an in-place sort from a returned one.
    after: [arrays-and-strings]
    levels:
      - id: read-sort-key
        title: Read a sort key
      - id: break-or-preserve-ties
        title: Break or preserve ties
      - id: in-place-versus-returned
        title: Distinguish in-place and returned results
    checkpoints:
      - id: predict-ordering
        title: Predict the ordering
        summary: Predict the ordering and which list changes.
        mix: [ordering, which-list]

  - id: interval-merging
    title: Interval merging
    summary: Draw endpoints, apply the touching rule, and extend the running end.
    after: [sort-order]
    levels:
      - id: draw-endpoints
        title: Draw endpoints
      - id: apply-touching-rule
        title: Apply the stated touching rule
      - id: extend-running-end
        title: Extend the running end
    checkpoints:
      - id: insert-overlapping-ranges
        title: Insert into overlapping ranges
        summary: Insert into a sorted sequence that overlaps multiple ranges.

  - id: event-sweeps
    title: Event sweeps
    summary: Turn endpoints into events, order ties, and track the active count.
    after: [sort-order, interval-merging]
    levels:
      - id: translate-events
        title: Translate start and end to events
      - id: order-event-ties
        title: Order ties
      - id: track-active-peak
        title: Track active and peak counts
    checkpoints:
      - id: rooms-needed
        title: Determine rooms needed
        summary: Determine rooms needed on an unfamiliar schedule.

  - id: pointer-scans
    title: Pointer scans
    summary: Choose which end moves, keep indices distinct, and handle repeats.
    after: [arrays-and-strings]
    afterNote: The scans from both ends assume a sorted input. They do not need the Sort order path.
    levels:
      - id: choose-moving-end
        title: Choose which end moves
      - id: preserve-distinct-indices
        title: Preserve distinct indices
      - id: handle-repeats
        title: Handle repeats
    forks:
      - id: compaction
        title: Compaction
        levels:
          - id: read-compaction-value
            title: Read a value
          - id: decide-to-write
            title: Decide whether to write it
    checkpoints:
      - id: unique-pairs-or-compaction
        title: Unique pairs or compaction
        summary: Return unique pairs or trace in-place compaction on duplicates.
        mix: [unique-pairs, compaction]

  - id: variable-windows
    title: Variable windows
    summary: Update a fixed window, move its bounds, and restore validity before recording.
    after: [hash-lookups, arrays-and-strings]
    levels:
      - id: update-fixed-window
        title: Update a fixed-size window
      - id: maintain-moving-counts
        title: Maintain counts as bounds move
      - id: restore-validity
        title: Restore validity before recording results
    checkpoints:
      - id: count-valid-suffixes
        title: Count valid suffixes
        summary: Count valid suffixes or bound time and space on a fresh log.
        mix: [valid-suffixes, cost-bound]

  - id: window-limits
    title: Window limits
    summary: See when shrinking a window by its sum is safe, and when a negative value breaks it.
    after: [variable-windows, prefix-counts]
    afterNote: Prefix counts is for comparing methods.
    levels:
      - id: trace-nonnegative-sum
        title: Trace a sum with nonnegative values
      - id: trace-negative-removal
        title: Trace one negative removal
      - id: identify-safe-decision
        title: Identify when the decision is safe
    checkpoints:
      - id: select-window-method
        title: Select a window method
        summary: Explain a lost candidate and select a suitable method for the stated task.

drills:
  - questionId: sorted-array-search-loop
    disposition: exam
    path: exact-search
    covers: [select-loop]
    tests: [exclude-probed-index, one-candidate-or-none]
    note: Compare inclusive loops, then trace a two-cell stall. Promote the singleton follow-up to guided practice and reserve the stuck-loop diagnosis for the exam.
  - questionId: search-the-answer-sessions
    disposition: exam
    path: feasible-limits
    tests: [evaluate-one-limit, false-to-true-transition, shrink-answer-range]
    note: Choose bounds and prove one greedy feasibility pass for ordered files.
  - questionId: rotated-array-search
    disposition: rewrite
    path: boundary-search
    skill: choose-rotated-side
    note: Show a rotated array. First identify its sorted half, then use a separate item to locate the target.
  - questionId: binary-search-preconditions
    disposition: rewrite
    path: exact-search
    note: Use one unsorted counterexample to teach when discarding a side is valid. Move indexed-access cost to Foundations.
  - questionId: answer-search-total-cost
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    note: After a feasibility scan is familiar, this isolates the cost of one scan times the number of probes.
  - questionId: two-sum-unsorted
    disposition: rewrite
    path: hash-lookups
    skill: maintain-seen
    note: Ask for the missing complement, then trace lookup-before-insert with a repeated value.
  - questionId: group-anagrams-key
    disposition: keep
    path: hash-lookups
    skill: select-key-or-complement
    note: After character counts and valid keys, choose a canonical key that preserves multiplicity.
  - questionId: longest-consecutive-set
    disposition: exam
    path: hash-lookups
    covers: [run-starts, one-visit]
    note: Combine membership, run starts and counting each value once.
  - questionId: subarray-sum-equals-k
    disposition: exam
    path: prefix-counts
    tests: [build-prefix, subtract-prefixes, count-prior-prefixes]
    note: Combine a prefix difference, earlier-prefix frequencies and the empty prefix on signed input.
  - questionId: contains-duplicate-tradeoff
    disposition: rewrite
    path: hash-lookups
    skill: maintain-seen
    note: Practice a single membership test before comparing early exit, space and sorting.
  - questionId: hash-map-cost-model
    disposition: rewrite
    path: hash-lookups
    skill: select-key-or-complement
    note: Separate valid keys, key length and collision cost into distinct decisions.
  - questionId: subarray-sum-k
    disposition: retire
    path: prefix-counts
    note: Duplicates the signed exact-sum objective in subarray-sum-equals-k. Salvage its sorting-destroys-contiguity follow-up for mixed review.
  - questionId: merge-intervals-sort-start
    disposition: rewrite
    path: interval-merging
    skill: extend-running-end
    note: Show two intervals and ask for the merged end before choosing the full sort-and-scan.
  - questionId: meeting-rooms-touching
    disposition: keep
    path: interval-merging
    skill: apply-touching-rule
    note: The touching rule is explicit; practice applying it after ordering by start.
  - questionId: insert-interval-three-phases
    disposition: exam
    path: interval-merging
    tests: [draw-endpoints, apply-touching-rule, extend-running-end]
    note: Compose the before, overlap, and after cases on an already sorted list.
  - questionId: sorted-key-stability
    disposition: rewrite
    path: sort-order
    skill: break-or-preserve-ties
    note: Split stable ties, lexicographic order and in-place return value.
  - questionId: sweep-line-minimum-rooms
    disposition: exam
    path: event-sweeps
    tests: [translate-events, order-event-ties, track-active-peak]
    note: Combine event signs, equal-time ordering and peak occupancy.
  - questionId: too-large-sum
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    note: New teaching card for choosing which end moves. Worked example on a too-small sum, then one decision on a too-large sum.
  - questionId: self-pair
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    note: New teaching card for keeping indices distinct. Choose the loop test that stops a self-pair but keeps two equal copies.
  - questionId: skip-run
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    note: New teaching card for handling repeats. Place `l` after stepping over a run once a pair is recorded.
  - questionId: read-then-write
    disposition: keep
    path: pointer-scans
    skill: read-compaction-value
    note: New teaching card for the compaction fork's first level. Say what one step reads and which slot it writes.
  - questionId: first-write
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    note: New teaching card for deciding whether to write, including the first write into an empty prefix.
  - questionId: ruled-out-pairs
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    note: New teaching card for choosing which end moves. Name the pairs one step skips and why that is safe.
  - questionId: equal-copies
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    note: New teaching card for keeping indices distinct. Two equal copies at different indices form a pair.
  - questionId: next-move-review
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    variant: true
    note: Review variant on a fresh input. Choose the next move after a too-small sum.
  - questionId: trace-pairs-review
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    variant: true
    note: Review variant on a fresh input. Trace every pair a scan from both ends checks.
  - questionId: self-pair-review
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    variant: true
    note: Review variant on a fresh input. Predict what a `l <= r` loop returns when one item meets itself.
  - questionId: equal-copies-review
    disposition: keep
    path: pointer-scans
    skill: preserve-distinct-indices
    variant: true
    note: Review variant on a fresh input. Return the indices of a pair made of equal copies.
  - questionId: skip-right-run-review
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    variant: true
    note: Review variant on a fresh input. Place `r` after stepping over its run.
  - questionId: repeat-trace-review
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    variant: true
    note: Review variant on a fresh input. Trace the repeats a scan records without skipping runs.
  - questionId: remove-value-review
    disposition: keep
    path: pointer-scans
    skill: read-compaction-value
    variant: true
    note: Review variant on a fresh input. Predict the whole list after removing one value in place.
  - questionId: read-cursor-review
    disposition: keep
    path: pointer-scans
    skill: read-compaction-value
    variant: true
    note: Review variant on a fresh input. Say what one compaction step reads and where it writes.
  - questionId: decide-write-review
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    variant: true
    note: Review variant on a fresh input. Decide whether a mid-trace item is written, and into which slot.
  - questionId: first-write-review
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    variant: true
    note: Review variant on a fresh input. Count what deduplicating a single run keeps.
  - questionId: checkpoint-unique-pairs
    disposition: exam
    path: pointer-scans
    covers: [unique-pairs]
    tests: [handle-repeats, preserve-distinct-indices]
    note: New checkpoint item. Trace unique pairs, including a pair of equal values, on an input used nowhere else.
  - questionId: checkpoint-compact-dupes
    disposition: exam
    path: pointer-scans
    covers: [compaction]
    tests: [decide-to-write, read-compaction-value]
    note: New checkpoint item. Trace in-place deduplication, including the untouched tail, on an input used nowhere else.
  - questionId: checkpoint-keep-two
    disposition: exam
    path: pointer-scans
    covers: [compaction]
    tests: [decide-to-write, read-compaction-value]
    note: New checkpoint item. Trace a keep-at-most-two compaction whose first two writes skip the comparison.
  - questionId: checkpoint-compact-then-pair
    disposition: exam
    path: pointer-scans
    covers: [compaction]
    tests: [decide-to-write, preserve-distinct-indices]
    note: New checkpoint item. Combine both lines. Compaction drops a copy that an equal-value pair needed.
  - questionId: sorted-pairs-with-duplicates
    disposition: exam
    path: pointer-scans
    covers: [unique-pairs]
    tests: [handle-repeats, preserve-distinct-indices]
    note: Combine ordered movement, repeated values and distinct indices.
  - questionId: longest-run-at-most-k-types
    disposition: rewrite
    path: variable-windows
    skill: restore-validity
    note: Add one element to a tiny window and update its distinct count before asking for the full scan.
  - questionId: shrink-while-not-if
    disposition: exam
    path: variable-windows
    tests: [maintain-moving-counts, restore-validity]
    covers: [valid-suffixes]
    note: Combine frequency deletion, repeated shrinking and counting valid suffixes.
  - questionId: slow-fast-keep-distinct
    disposition: retire
    path: pointer-scans
    note: Retired (decided on #11). Read-then-write, first-write and the compaction review drills already cover what this rewrite planned.
  - questionId: window-loop-cost
    disposition: exam
    path: variable-windows
    tests: [maintain-moving-counts, restore-validity]
    covers: [cost-bound]
    note: Combine total pointer advances with the peak number of live dictionary keys.
  - questionId: window-needs-monotonic-sums
    disposition: exam
    path: window-limits
    note: Use a signed counterexample to explain why shrinking by sum loses valid answers.

  - questionId: sum-step-too-small
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    note: Drag-the-pointers demo. Move the end a too-small sum calls for, and leave the other end where it is.
  - questionId: pair-skips-repeats
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    note: Drag-the-pointers demo. Place both pointers after stepping over the runs of repeats around a recorded pair.
  - questionId: compact-keeps-value
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    note: Drag-the-pointers demo. Place the read and write cursors after one compaction step that writes.

  - questionId: which-half-remains
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    note: New teaching card for discarding a sorted half. Worked example on a too-small probe, then name the cells left after a too-big one.
  - questionId: order-makes-discard-safe
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    note: New teaching card for discarding a sorted half. The unsorted counterexample that the binary-search-preconditions rewrite asks for.
  - questionId: tap-next-probe
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    note: New tap-cell teaching card. Tap the probe in the half that is left, with lo added and the midpoint rounded down.
  - questionId: drop-the-probe
    disposition: keep
    path: exact-search
    skill: exclude-probed-index
    note: New drag-pointers teaching card for excluding the probed index. Place lo past a too-small probe and leave hi where it is.
  - questionId: update-after-high-probe
    disposition: keep
    path: exact-search
    skill: exclude-probed-index
    note: New teaching card for excluding the probed index. Choose hi = mid - 1 over hi = mid, hi -= 1 and moving the wrong end.
  - questionId: one-candidate-left
    disposition: keep
    path: exact-search
    skill: one-candidate-or-none
    note: New teaching card for one candidate versus none. lo == hi is one unchecked cell, which still has to be compared.
  - questionId: bounds-cross
    disposition: keep
    path: exact-search
    skill: one-candidate-or-none
    note: New drag-pointers teaching card for one candidate versus none. A two-cell trace whose last pass moves hi left of lo.
  - questionId: which-half-review
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    variant: true
    note: Review variant on a fresh input. Name the cells left after a too-small probe.
  - questionId: tap-probe-review
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    variant: true
    note: Review variant on a fresh input. Tap the third probe, in a two-cell range.
  - questionId: unsorted-review
    disposition: keep
    path: exact-search
    skill: discard-sorted-half
    variant: true
    note: Review variant on a fresh input. Name the probe that drops the target from a list with one swapped pair.
  - questionId: drop-probe-review
    disposition: keep
    path: exact-search
    skill: exclude-probed-index
    variant: true
    note: Review variant on a fresh input. Drag hi past a too-big probe and leave lo where it is.
  - questionId: count-left-review
    disposition: keep
    path: exact-search
    skill: exclude-probed-index
    variant: true
    note: Review variant on a fresh input. Count the inclusive range left after lo = mid + 1.
  - questionId: low-update-review
    disposition: keep
    path: exact-search
    skill: exclude-probed-index
    variant: true
    note: Review variant on a fresh input. Choose the update after a too-small probe.
  - questionId: lt-loop-review
    disposition: keep
    path: exact-search
    skill: one-candidate-or-none
    variant: true
    note: Review variant on a fresh input. The promoted lt-inclusive follow-up. A lo < hi loop skips the last cell and returns -1.
  - questionId: empty-range-review
    disposition: keep
    path: exact-search
    skill: one-candidate-or-none
    variant: true
    note: Review variant on a fresh input. lo = hi + 1 is an empty range, so the loop returns -1.
  - questionId: bounds-cross-review
    disposition: keep
    path: exact-search
    skill: one-candidate-or-none
    variant: true
    note: Review variant on a fresh input. Drag lo and hi to where a whole search for a missing target leaves them.
  - questionId: loop-test-review
    disposition: keep
    path: exact-search
    skill: one-candidate-or-none
    variant: true
    note: Review variant on a fresh input. Choose the loop test that lets a one-cell range in and keeps an empty one out.
  - questionId: checkpoint-one-change
    disposition: exam
    path: exact-search
    covers: [select-loop]
    tests: [exclude-probed-index, one-candidate-or-none]
    note: New checkpoint item. Of four one-line changes to the loop, only rounding mid up keeps it correct.
  - questionId: checkpoint-stalled-bounds
    disposition: exam
    path: exact-search
    covers: [diagnose-stall]
    tests: [discard-sorted-half, exclude-probed-index]
    note: New drag-pointers checkpoint item. Place lo and hi on the two-cell range where a lo = mid loop repeats forever.
  - questionId: checkpoint-exposing-input
    disposition: exam
    path: exact-search
    covers: [select-loop]
    tests: [one-candidate-or-none]
    note: New checkpoint item. Pick the two-cell input that exposes a lo < hi loop's skipped last cell.
  - questionId: checkpoint-repair-hang
    disposition: exam
    path: exact-search
    covers: [diagnose-stall]
    tests: [exclude-probed-index, one-candidate-or-none]
    note: New checkpoint item. Repair a hi = mid loop that hangs on a one-cell range, against a guard that hides it.
  - questionId: trace-sum-to-target
    disposition: keep
    path: pointer-scans
    skill: choose-moving-end
    note: Step-through trace demo. Predict which end moves and what the sum is over three passes until the target is found.
  - questionId: trace-drop-value
    disposition: keep
    path: pointer-scans
    skill: decide-to-write
    note: Step-through trace demo. Predict where the read and write cursors go and what a write puts into a cell.
  - questionId: trace-unique-pairs
    disposition: keep
    path: pointer-scans
    skill: handle-repeats
    note: Step-through trace demo. Predict where the pointers land after stepping over runs, and how many pairs are recorded.

  - questionId: read-the-dictionary
    disposition: keep
    path: hash-lookups
    skill: read-set-or-dictionary
    note: New teaching card for reading a dictionary. Membership tests keys, and get returns a stored 0 or the default for a missing key.
  - questionId: count-with-get
    disposition: keep
    path: hash-lookups
    skill: read-set-or-dictionary
    note: New step-trace teaching card for updating a frequency. Predict what get returns, how many keys there are, and the final counts.
  - questionId: missing-complement
    disposition: keep
    path: hash-lookups
    skill: select-key-or-complement
    note: New teaching card for the missing complement. Look up target - x when x is larger than the target. Part of the two-sum-unsorted rewrite.
  - questionId: key-keeps-repeats
    disposition: keep
    path: hash-lookups
    skill: select-key-or-complement
    note: New teaching card for repeated letters in keys. Build the sorted key of a word with repeated letters.
  - questionId: predecessor-lookup
    disposition: keep
    path: hash-lookups
    skill: select-key-or-complement
    note: New tap-cell teaching card for predecessor membership. Tap the value that the x - 1 check finds.
  - questionId: trace-seen-pairs
    disposition: keep
    path: hash-lookups
    skill: maintain-seen
    note: New step-trace teaching card. Trace lookup-before-insert with a repeated value. Part of the two-sum-unsorted rewrite.
  - questionId: first-repeat-stop
    disposition: keep
    path: hash-lookups
    skill: maintain-seen
    note: New tap-cell teaching card. Tap where a seen-set scan stops early. The single membership test the contains-duplicate-tradeoff rewrite asks for.
  - questionId: dict-read-review
    disposition: keep
    path: hash-lookups
    skill: read-set-or-dictionary
    variant: true
    note: Review variant on a fresh input. get with no default, and membership on a value.
  - questionId: set-add-review
    disposition: keep
    path: hash-lookups
    skill: read-set-or-dictionary
    variant: true
    note: Review variant on a fresh input. A single insert of a value the set already holds.
  - questionId: frequency-update-review
    disposition: keep
    path: hash-lookups
    skill: read-set-or-dictionary
    variant: true
    note: Review variant on a fresh input. Choose the line that updates a frequency.
  - questionId: complement-review
    disposition: keep
    path: hash-lookups
    skill: select-key-or-complement
    variant: true
    note: Review variant on a fresh input. The complement of a negative value.
  - questionId: key-groups-review
    disposition: keep
    path: hash-lookups
    skill: select-key-or-complement
    variant: true
    note: Review variant on a fresh input. Count the groups a sorted key makes when the words repeat letters.
