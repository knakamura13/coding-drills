    path: event-sweeps
    skill: translate-events
    variant: true
    note: Review variant on a fresh input (tap the cell). Tap the end event of a meeting when another meeting starts at that time.
  - questionId: tie-landing-tap-review
    disposition: keep
    path: event-sweeps
    skill: order-event-ties
    variant: true
    note: Review variant on a fresh input (tap the cell). Tap the event the plain sort puts at index 4, a start that follows an end at the same time.
  - questionId: inclusive-rooms-review
    disposition: keep
    path: event-sweeps
    skill: order-event-ties
    variant: true
    note: Review variant on a fresh input. The (time, -change) key counts a chain of touching meetings as two rooms.
  - questionId: tie-rule-review
    disposition: keep
    path: event-sweeps
    skill: order-event-ties
    variant: true
    note: Review variant. Read a stated rule and choose to apply the end first at a shared time.
  - questionId: trace-peak-review
    disposition: keep
    path: event-sweeps
    skill: track-active-peak
    variant: true
    note: Review variant on a fresh input (step-through trace). Predict active across an end, then a start, then peak after a drop.
  - questionId: peak-event-tap-review
    disposition: keep
    path: event-sweeps
    skill: track-active-peak
    variant: true
    note: Review variant on a fresh input (tap the cell). Tap the event that first reaches the peak, not the later start that returns to it.
  - questionId: return-active-review
    disposition: keep
    path: event-sweeps
    skill: track-active-peak
    variant: true
    note: Review variant on a fresh input. Returning active instead of peak always gives 0.
  - questionId: start-update-review
    disposition: keep
    path: event-sweeps
    skill: track-active-peak
    variant: true
    note: Review variant. A start that only matches the old peak leaves peak unchanged.
  - questionId: checkpoint-rooms-count
    disposition: exam
    path: event-sweeps
    tests: [translate-events, order-event-ties, track-active-peak]
    note: New checkpoint item. Count the rooms for five meetings with ties at 11 and 13, against start-first, one-per-meeting and merged-block answers.
  - questionId: checkpoint-peak-meeting
    disposition: exam
    path: event-sweeps
    tests: [translate-events, order-event-ties, track-active-peak]
    note: New tap-cell checkpoint item. Tap the meeting whose start first reaches the peak, where a start-first tie would pick another.
  - questionId: checkpoint-inclusive-bookings
    disposition: exam
    path: event-sweeps
    tests: [order-event-ties, track-active-peak]
    note: New checkpoint item. Count instruments when an end hour is still busy, so starts go first at a tie.
  - questionId: checkpoint-time-only-key
    disposition: exam
    path: event-sweeps
    tests: [order-event-ties, track-active-peak]
    note: New checkpoint item. A time-only key keeps the append order at a tie and reports one room too many.
  - questionId: pack-one-limit
    disposition: keep
    path: feasible-limits
    skill: evaluate-one-limit
    note: New step-trace teaching card for evaluating one limit. Predict where each session opens, then whether the count is within d.
  - questionId: file-over-limit
    disposition: keep
    path: feasible-limits
    skill: evaluate-one-limit
    note: New teaching card. A file larger than the limit makes it infeasible, although the pass still returns a count within d.
  - questionId: larger-limit-fits
    disposition: keep
    path: feasible-limits
    skill: false-to-true-transition
    note: New teaching card for the single transition. A packing that fits one limit fits every larger one, so the answers never turn back to no.
  - questionId: first-within-d
    disposition: keep
    path: feasible-limits
    skill: false-to-true-transition
    note: New tap-cell teaching card. Tap the first count that is at most d, not the last one equal to d or the first below it.
  - questionId: upper-bound
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    note: New teaching card for the starting range. hi = sum(sizes) is safe, over the even split, max(sizes) * d and max(sizes).
  - questionId: passing-probe
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    note: New drag-pointers teaching card. A passing probe sets hi = mid and leaves lo where it is.
  - questionId: trace-limit-search
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    note: New step-trace teaching card. Trace a failing probe and two passing ones down to the first limit that fits.
  - questionId: count-sessions-review
    disposition: keep
    path: feasible-limits
    skill: evaluate-one-limit
    variant: true
    note: Review variant on a fresh input. Count the sessions when two loads equal the limit exactly.
  - questionId: oversize-file-review
    disposition: keep
    path: feasible-limits
    skill: evaluate-one-limit
    variant: true
    note: Review variant on a fresh input. A file larger than x makes x fail, whatever count the pass returns.
  - questionId: smaller-limit-review
    disposition: keep
    path: feasible-limits
    skill: false-to-true-transition
    variant: true
    note: Review variant on a fresh input. A failure at one limit rules out every smaller limit.
  - questionId: answer-window-review
    disposition: keep
    path: feasible-limits
    skill: false-to-true-transition
    variant: true
    note: Review variant on a fresh input. One failing and one passing limit leave lo = fail + 1 through the passing limit.
  - questionId: skip-past-d-review
    disposition: keep
    path: feasible-limits
    skill: false-to-true-transition
    variant: true
    note: Review variant on a fresh input (tap the cell). The count drops from 5 straight to 3, so no limit needs exactly d.
  - questionId: prove-smallest-review
    disposition: keep
    path: feasible-limits
    skill: false-to-true-transition
    variant: true
    note: Review variant on a fresh input. A failure at the limit just below proves the answer is the smallest.
  - questionId: lower-bound-review
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    variant: true
    note: Review variant on a fresh input. lo = max(sizes) keeps every probe where the pass counts correctly.
  - questionId: failing-probe-review
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    variant: true
    note: Review variant on a fresh input (drag the pointers). A failing probe sets lo = mid + 1 and leaves hi where it is.
  - questionId: unprobed-top-review
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    variant: true
    note: Review variant on a fresh input (step-through trace). Every probe fails, so lo climbs to the unprobed hi, the total.
  - questionId: range-doubles-review
    disposition: keep
    path: feasible-limits
    skill: shrink-answer-range
    variant: true
    note: Review variant on a fresh input. Doubling the range adds one probe, and each probe is a full pass.
  - questionId: checkpoint-trace-limits
    disposition: exam
    path: feasible-limits
    tests: [evaluate-one-limit, shrink-answer-range]
    note: New step-trace checkpoint item. Run the pass at each probe, place the bounds, and count the sizes the whole search reads.
  - questionId: checkpoint-tap-smallest-limit
    disposition: exam
    path: feasible-limits
    tests: [evaluate-one-limit, false-to-true-transition]
    note: New tap-cell checkpoint item. Run the pass at each limit and tap the first that fits, against the largest file and the even split.
  - questionId: checkpoint-fewer-than-d
    disposition: exam
    path: feasible-limits
    tests: [false-to-true-transition, shrink-answer-range]
    note: New checkpoint item. Repair a < d test that finds the first limit needing fewer sessions, against == d, return lo - 1 and hi = mid - 1.
  - questionId: checkpoint-reads-per-search
    disposition: exam
    path: feasible-limits
    tests: [shrink-answer-range]
    note: New checkpoint item. Count the sizes a search reads, which is the probes over the limit range times one full pass each.
  - questionId: slide-fixed-sum
    disposition: keep
    path: variable-windows
    skill: update-fixed-window
    note: New teaching card for one slide. Subtract the value that leaves and add the one that comes in, against subtracting a value that stays, swapped signs and no subtraction.
  - questionId: drag-fixed-window
    disposition: keep
    path: variable-windows
    skill: update-fixed-window
    note: New drag-pointers teaching card. Move both edges of a size-3 window after two passes, not onto the cell that just left.
  - questionId: tap-leaving-cell
    disposition: keep
    path: variable-windows
    skill: update-fixed-window
    note: New tap-cell teaching card for outgoing arithmetic. Tap nums[right - k], against the new first cell and the cell that comes in.
  - questionId: drop-one-copy
    disposition: keep
    path: variable-windows
    skill: maintain-moving-counts
    note: New teaching card for one removal. A copy of the leaving type stays, so its count drops and its key stays.
  - questionId: trace-window-types
    disposition: keep
    path: variable-windows
    skill: maintain-moving-counts
    note: New step-trace teaching card. Trace a size-3 window's counts through a kept copy, an equal type in and out, and last-copy deletion.
  - questionId: drag-shrink-to-valid
    disposition: keep
    path: variable-windows
    skill: restore-validity
    note: New drag-pointers teaching card for several left moves. Only the third removal empties a count, so left moves three cells.
  - questionId: count-suffixes-here
    disposition: keep
    path: variable-windows
    skill: restore-validity
    note: New teaching card for valid suffixes. After the repair, right - left + 1 stretches end at right.
  - questionId: slide-signed-sum-review
    disposition: keep
    path: variable-windows
    skill: update-fixed-window
    variant: true
    note: Review variant on a fresh input. One slide over negative values, where swapped signs are easy to miss.
  - questionId: leaving-index-review
    disposition: keep
    path: variable-windows
    skill: update-fixed-window
    variant: true
    note: Review variant on a fresh input. Fill in the leaving index, i - k, against i - k + 1, i - 1 and a wrapping i - k - 1.
  - questionId: tap-leaving-review
    disposition: keep
    path: variable-windows
    skill: update-fixed-window
    variant: true
    note: Review variant on a fresh input (tap the cell). Tap the cell a size-3 window drops when right moves to 5.
  - questionId: first-full-window-review
    disposition: keep
    path: variable-windows
    skill: update-fixed-window
    variant: true
    note: Review variant on a fresh input. Record from right >= k - 1, not after the first slide or from the first pass.
  - questionId: last-copy-review
    disposition: keep
    path: variable-windows
    skill: maintain-moving-counts
    variant: true
    note: Review variant on a fresh input. The leaving type's last copy goes, so its key is deleted.
  - questionId: overwrite-count-review
    disposition: keep
    path: variable-windows
    skill: maintain-moving-counts
    variant: true
    note: Review variant on a fresh input. Fix a count that is overwritten with 1, against a looser deletion test and a reordering that only hides it.
  - questionId: trace-types-review
    disposition: keep
    path: variable-windows
    skill: maintain-moving-counts
    variant: true
    note: Review variant on a fresh input (step-through trace). A kept copy, a last-copy deletion and an equal type that stays.
  - questionId: drag-shrink-review
    disposition: keep
    path: variable-windows
    skill: restore-validity
    variant: true
    note: Review variant on a fresh input (drag the pointers). The leading run is not the whole type, so left moves four cells.
  - questionId: record-after-shrink-review
    disposition: keep
    path: variable-windows
    skill: restore-validity
    variant: true
    note: Review variant on a fresh input. Record the length after the repair, not before it or inside it.
  - questionId: zero-limit-suffixes-review
    disposition: keep
    path: variable-windows
    skill: restore-validity
    variant: true
    note: Review variant on a fresh input with a different limit, at most one 0. Count the valid stretches after three left moves.
  - questionId: checkpoint-count-log
    disposition: exam
    path: variable-windows
    tests: [maintain-moving-counts, restore-validity]
    covers: [valid-suffixes]
    note: New checkpoint item. Count valid stretches on a fresh log, where one arrival forces two removals.
  - questionId: checkpoint-no-repeat-left
    disposition: exam
    path: variable-windows
    tests: [maintain-moving-counts, restore-validity]
    covers: [valid-suffixes]
    note: New tap-cell checkpoint item. A new validity rule, no repeated letter, where a repeat of a letter that already left moves nothing.
  - questionId: checkpoint-count-cost
    disposition: exam
    path: variable-windows
    tests: [maintain-moving-counts, restore-validity]
    covers: [cost-bound]
    note: New checkpoint item. Bound the time and space of counting stretches, whose answer can be quadratic though the scan is linear.
  - questionId: checkpoint-fixed-window-cost
    disposition: exam
    path: variable-windows
    tests: [update-fixed-window, maintain-moving-counts]
    covers: [cost-bound]
    note: New checkpoint item. Bound the time and space of a fixed window that tracks its types.

