  - questionId: grid-exam-count-goal
    disposition: exam
    path: grid-tables
    tests: [initialize-edges-obstacles, fill-interior-cell]
    note: New checkpoint item. Count paths on a fresh blocked grid where a block cuts column 0 and another sits above the goal.
  - questionId: grid-exam-tap-first-reached
    disposition: exam
    path: grid-tables
    tests: [initialize-edges-obstacles, fill-interior-cell]
    note: New tap-cell checkpoint item. Tap the leftmost bottom-row cell that a path reaches on a fresh blocked grid.
  - questionId: grid-exam-diagonal-count
    disposition: exam
    path: grid-tables
    tests: [identify-incoming-neighbors, initialize-edges-obstacles, fill-interior-cell]
    note: New checkpoint item. Count paths on a fresh blocked grid when diagonal moves are allowed.
  - questionId: grid-exam-fix-edges
    disposition: exam
    path: grid-tables
    tests: [initialize-edges-obstacles, identify-incoming-neighbors]
    note: New checkpoint item. Pick the change that stops 1s on the edges past a block, against changes to blocks, moves and loop order.
  - questionId: sched-tap-next-kept
    disposition: keep
    path: greedy-scheduling
    skill: choose-compatible-interval
    note: With two intervals kept, tap the next one that starts at or after the kept end, where a touching start counts. Its worked example introduces the path and its loop.
  - questionId: sched-inclusive-days
    disposition: keep
    path: greedy-scheduling
    skill: choose-compatible-interval
    note: Bookings that include their last day share it when they touch, so `>=` returns 3 where only 2 fit.
  - questionId: sched-drag-two-kept
    disposition: keep
    path: greedy-scheduling
    skill: choose-compatible-interval
    note: Place the second and third intervals kept, past ones that end sooner but start too early.
  - questionId: sched-room-left
    disposition: keep
    path: greedy-scheduling
    skill: compare-room-left
    note: Of two compatible choices, the one that ends sooner leaves room for everything the other does, and more.
  - questionId: sched-trace-earliest-finish
    disposition: keep
    path: greedy-scheduling
    skill: apply-earliest-finish
    note: Trace the sort-by-end loop with an index for the last kept interval, including two touching keeps.
  - questionId: sched-which-kept
    disposition: keep
    path: greedy-scheduling
    skill: apply-earliest-finish
    note: Name the meetings the loop keeps, against another best schedule, start order, and next-start picks.
  - questionId: sched-swap-first
    disposition: keep
    path: greedy-scheduling
    skill: compare-room-left
    depth: deep
    note: Swapping the earliest end in for a best schedule's first interval works because it ends no later. The exchange argument is deep, so the card comes last.
  - questionId: sched-review-tap-inclusive
    disposition: keep
    path: greedy-scheduling
    skill: choose-compatible-interval
    variant: true
    note: 'Inclusive-day bookings with `s > last_end`: tap the next booking kept, past one that only touches.'
  - questionId: sched-review-wrong-end
    disposition: keep
    path: greedy-scheduling
    skill: choose-compatible-interval
    variant: true
    note: The test compares the new start with the kept start, and only comparing with the kept end fixes it.
  - questionId: sched-review-drag-fourth
    disposition: keep
    path: greedy-scheduling
    skill: choose-compatible-interval
    variant: true
    note: Place the second and fourth intervals the loop keeps.
  - questionId: sched-review-swap-count
    disposition: keep
    path: greedy-scheduling
    skill: compare-room-left
    variant: true
    note: Putting a sooner end in place of a long middle interval grows the schedule from 3 to 4.
  - questionId: sched-review-partial
    disposition: keep
    path: greedy-scheduling
    skill: compare-room-left
    variant: true
    note: Of two partial schedules of the same size, the one with the sooner last end grows at least as large on any list.
  - questionId: sched-review-tap-first-pick
    disposition: keep
    path: greedy-scheduling
    skill: compare-room-left
    variant: true
    note: Tap the first pick that leaves the most room, against the earliest start and the shortest.
  - questionId: sched-review-trace-ties
    disposition: keep
    path: greedy-scheduling
    skill: apply-earliest-finish
    variant: true
    note: Trace the loop where two pairs share an end, and the second of each pair is skipped.
  - questionId: sched-review-removals
    disposition: keep
    path: greedy-scheduling
    skill: apply-earliest-finish
    variant: true
    note: Count the fewest removals, against start order, merged blocks and a nested pair.
  - questionId: sched-review-sort-start
    disposition: keep
    path: greedy-scheduling
    skill: apply-earliest-finish
    variant: true
    note: The default sort orders by start, so a long first interval blocks the rest and the call returns 1.
  - questionId: sched-review-tied-ends
    disposition: keep
    path: greedy-scheduling
    skill: apply-earliest-finish
    variant: true
    note: Intervals that share an end leave the same room, so the order of ties never changes the count.
  - questionId: sched-exam-retained-set
    disposition: exam
    path: greedy-scheduling
    tests: [choose-compatible-interval, apply-earliest-finish]
    covers: [retained-set]
    note: Name the meetings the loop keeps and the removals, against two other best schedules and a strict test.
  - questionId: sched-exam-trace-inclusive
    disposition: exam
    path: greedy-scheduling
    tests: [choose-compatible-interval, apply-earliest-finish]
    covers: [retained-set]
    note: Trace the loop on inclusive-day bookings with a strict test, where three touching bookings are skipped.
  - questionId: sched-exam-stays-ahead
    disposition: exam
    path: greedy-scheduling
    tests: [compare-room-left, apply-earliest-finish]
    covers: [justify-rule]
    note: The loop's ends are never later than another schedule's, so no 4th interval can extend that schedule alone.
  - questionId: sched-exam-second-swap
    disposition: exam
    path: greedy-scheduling
    tests: [compare-room-left, apply-earliest-finish]
    covers: [justify-rule]
    depth: deep
    note: The second pick is the earliest end among intervals that fit after the first, so it can replace a best schedule's second. It rests on the deep exchange argument.
  - questionId: sched-exam-which-plan
    disposition: exam
    path: greedy-scheduling
    tests: [compare-room-left, apply-earliest-finish]
    covers: [justify-rule]
    note: 'Pick the plan that always removes the fewest: sort by start and keep the sooner end on a clash, against start order, shortest first and merging. Rewritten from `non-overlapping-sort-end`.'
  - questionId: sched-exam-debug-last-end
    disposition: exam
    path: greedy-scheduling
    tests: [choose-compatible-interval]
    note: 'Debugging: pick the call a suggested count gets wrong because it updates `last_end` on skipped intervals too, so a touching interval after a skip is lost.'
  - questionId: entry-read-from-code
    disposition: keep
    path: one-dimensional-tables
    skill: define-table-entry
    note: New teaching card. Read what `best[i]` holds from the code of a climb with fees, against a cost to the top, a fee left out and a running minimum.
  - questionId: entry-answer-cell
    disposition: keep
    path: one-dimensional-tables
    skill: define-table-entry
    note: New tap-cell teaching card. When an entry covers stretches that end at `i`, the answer is the largest cell, not the last.
  - questionId: entry-keeps-count
    disposition: keep
    path: one-dimensional-tables
    skill: define-table-entry
    note: New teaching card. To count digit readings, an entry counts the readings of a prefix, not a True or False, one digit, or a letter count.
  - questionId: empty-start-counts-one
    disposition: keep
    path: one-dimensional-tables
    skill: initialize-table-ends
    note: New teaching card. With steps of 2 or 3, the empty order on step 0 counts 1 and the unreachable step 1 counts 0.
  - questionId: max-needs-minus-inf
    disposition: keep
    path: one-dimensional-tables
    skill: initialize-table-ends
    note: New teaching card. A largest count marks impossible lengths with `-inf`, against 0, `inf` and a phantom piece at length 0.
  - questionId: stone-route-trace
    disposition: keep
    path: one-dimensional-tables
    skill: choose-predecessors
    note: New step-trace teaching card. Pick the stone one hop back that each cheapest route arrives from, passing over a missing stone.
  - questionId: decode-last-piece
    disposition: keep
    path: one-dimensional-tables
    skill: choose-predecessors
    note: New tap-cell teaching card. A `0` cannot stand alone, so `ways[3]` for `'110'` adds only `ways[1]`.
  - questionId: tiling-recurrence
    disposition: rewrite
    path: one-dimensional-tables
    skill: choose-predecessors
    note: Separate the empty strip, last-tile choice and recurrence before pairing them. The new cards teach each part, so this card is the combined version, after them.
  - questionId: prefix-answer-cell-review
    disposition: keep
    path: one-dimensional-tables
    skill: define-table-entry
    variant: true
    note: Review variant, tap the cell. A word-split table has `len(s) + 1` cells, so the whole string is the last one, not the last letter's index.
  - questionId: rising-pick-entry-review
    disposition: keep
    path: one-dimensional-tables
    skill: define-table-entry
    variant: true
    note: Review variant on fresh code. `lis[i]` counts rising picks that end at `i`, which is why the call returns the largest entry.
  - questionId: forward-fill-entry-review
    disposition: keep
    path: one-dimensional-tables
    skill: define-table-entry
    variant: true
    note: Review variant on fresh code. A table that writes forward still means the fewest jumps from the start to each index.
  - questionId: lost-start-order-review
    disposition: keep
    path: one-dimensional-tables
    skill: initialize-table-ends
    variant: true
    note: Review variant on a fresh input. With `ways[0] = 0` and steps of 1 or 4, the call returns 2 and loses `4+1`.
  - questionId: open-water-zero-review
    disposition: keep
    path: one-dimensional-tables
    skill: initialize-table-ends
    variant: true
    note: Review variant, tap the cell. Open water marked 0 instead of `inf` makes a later pad's fewest hops too small.
  - questionId: songs-minus-inf-review
    disposition: keep
    path: one-dimensional-tables
    skill: initialize-table-ends
    variant: true
    note: Review variant on a fresh task. A largest count needs `-inf`, against -1, 0 and `None`.
  - questionId: word-break-drag-review
    disposition: keep
    path: one-dimensional-tables
    skill: choose-predecessors
    variant: true
    note: Review variant, drag the pointers. Each word that ends the string reads the entry where it would start.
  - questionId: stamp-offsets-review
    disposition: keep
    path: one-dimensional-tables
    skill: choose-predecessors
    variant: true
    note: Review variant on a fresh task. Stamps of 2 and 5 step back 2 and 5, and the cases add.
  - questionId: decode-pieces-review
    disposition: keep
    path: one-dimensional-tables
    skill: choose-predecessors
    variant: true
    note: Review variant on a fresh input. For `'2627'`, 27 is not a letter, so `ways[4]` adds only `ways[3]`.
  - questionId: stone-route-trace-review
    disposition: keep
    path: one-dimensional-tables
    skill: choose-predecessors
    variant: true
    note: Review variant, step-through trace. Hops of 1 or 3 with two missing stones.
  - questionId: tables-exam-colored-slabs
    disposition: exam
    path: one-dimensional-tables
    tests: [choose-predecessors, initialize-table-ends]
    covers: [counting]
    note: New checkpoint item. Count pavings with two colors of short slab and one of long slab, with the empty path counted once.
  - questionId: tables-exam-codes-end-b
    disposition: exam
    path: one-dimensional-tables
    tests: [choose-predecessors, define-table-entry]
    covers: [counting]
    note: New tap-cell checkpoint item. Codes with no `BB` that end in B are a shorter code plus `AB`, so tap `count[i - 2]`.
  - questionId: tables-exam-cups-at-least
    disposition: exam
    path: one-dimensional-tables
    tests: [initialize-table-ends, choose-predecessors]
    covers: [optimization]
    note: New checkpoint item. For at least `n` cups the step back stops at 0, against a negative index, a base of `inf` and a start of 0.

