# Problem-solving patterns. Part of the mastery map (issue #14).
id: problem-solving-patterns
title: Problem-solving patterns
summary: Recursion, search, repeated subproblems, tables, greedy rules, and choosing a method.
order: 5

paths:
  - id: recursive-calls
    title: Recursive calls
    summary: Name a stopping case, trace a smaller call, and follow what it returns.
    after: [arrays-and-strings]
    levels:
      - id: identify-stopping-case
        title: Identify a stopping case
      - id: trace-smaller-call
        title: Trace a smaller call
      - id: follow-the-return
        title: Follow the return
    checkpoints:
      - id: predict-live-frames
        title: Predict termination and live frames
        summary: Predict termination and maximum live frames.

  - id: search-state
    title: Search state
    summary: Make a choice, undo it before the next sibling, and snapshot a finished path.
    after: [recursive-calls, names-and-objects]
    levels:
      - id: make-a-choice
        title: Make a choice
      - id: undo-before-sibling
        title: Undo it before a sibling
      - id: snapshot-finished-path
        title: Snapshot a finished path
    checkpoints:
      - id: sibling-state-leak
        title: Diagnose a sibling-state leak
        summary: Diagnose a new sibling-state leak.

  - id: enumerating-choices
    title: Enumerating choices
    summary: List the leaves, tell duplicate siblings apart, and justify a prune.
    after: [search-state, sort-order, growth-rates]
    levels:
      - id: enumerate-leaves
        title: Enumerate leaves
      - id: distinguish-duplicate-siblings
        title: Distinguish duplicate siblings
      - id: justify-pruning
        title: Justify pruning under stated assumptions
    checkpoints:
      - id: preserve-valid-outputs
        title: Preserve valid outputs
        summary: Preserve all valid outputs and account for output size.

  - id: repeated-states
    title: Repeated states
    summary: Name a subproblem, recognize the same inputs, and reuse a cached result.
    after: [recursive-calls, hash-lookups]
    levels:
      - id: name-subproblem
        title: Name a subproblem
      - id: identify-identical-inputs
        title: Identify identical inputs
      - id: reuse-cached-result
        title: Reuse a cached result
    checkpoints:
      - id: overlapping-versus-disjoint
        title: Tell overlapping states from disjoint calls
        summary: Distinguish overlapping states from two disjoint recursive calls.
        mix: [overlapping, disjoint]

  - id: one-dimensional-tables
    title: One-dimensional tables
    summary: Say what an entry means, initialize the empty cases, and choose a predecessor.
    after: [repeated-states]
    levels:
      - id: define-table-entry
        title: Define what an entry means
      - id: initialize-table-ends
        title: Initialize empty and impossible states
      - id: choose-predecessors
        title: Choose valid predecessors
    checkpoints:
      - id: fresh-recurrence
        title: Construct a recurrence
        summary: Construct a recurrence on a fresh counting or optimization task.

  - id: grid-tables
    title: Grid tables
    summary: Find incoming neighbors, initialize edges and obstacles, and fill one interior cell.
    after: [one-dimensional-tables]
    afterNote: Grid coordinates are named as well and are not a separate path. Arrays and strings covers indexes.
    levels:
      - id: identify-incoming-neighbors
        title: Identify incoming neighbors
      - id: initialize-edges-obstacles
        title: Initialize edges and obstacles
      - id: fill-interior-cell
        title: Fill one interior cell
    checkpoints:
      - id: count-blocked-paths
        title: Count paths on a blocked grid
        summary: Count paths on a new blocked grid.

  - id: subsequence-tables
    title: Subsequence tables
    summary: Tell a subsequence from a substring, read two prefix indexes, and choose a transition.
    after: [grid-tables]
    afterNote: String indexes are named as well and are not a separate path.
    levels:
      - id: subsequence-versus-substring
        title: Distinguish subsequence from substring
      - id: read-prefix-indexes
        title: Read two prefix indexes
      - id: choose-table-transition
        title: Choose diagonal or skip transitions
    checkpoints:
      - id: trace-lcs
        title: Trace an LCS table
        summary: Trace a fresh LCS table and distinguish fill, storage and reconstruction costs.

  - id: dp-storage
    title: DP storage
    summary: Keep the past entries still needed, update old and new values in order, and count the work.
    after: [one-dimensional-tables, grid-tables, operation-costs]
    afterNote: Grid tables is for rolling rows.
    levels:
      - id: mark-entries-still-needed
        title: Mark past entries still needed
      - id: preserve-old-and-new
        title: Preserve old and new values in update order
      - id: count-states-and-work
        title: Count states and work per state
    checkpoints:
      - id: compare-memo-or-rolling
        title: Compare storage strategies
        summary: Compare memoization with tabulation or repair a rolling-row update.

  - id: greedy-choices
    title: Greedy choices
    summary: Name a local rule, try a small counterexample, and state the assumption that makes it safe.
    after: [problem-solving-routine]
    levels:
      - id: identify-local-rule
        title: Identify a local rule
      - id: test-greedy-counterexample
        title: Test it on a small counterexample
      - id: name-safe-assumption
        title: Identify an assumption that makes it safe
    checkpoints:
      - id: greedy-rule-survives
        title: See if a greedy rule survives
        summary: Change one constraint and justify whether the greedy rule survives.
        mix: [survives, breaks]

  - id: greedy-scheduling
    title: Greedy scheduling
    summary: Pick a compatible interval, compare the room each choice leaves, and finish earliest.
    after: [greedy-choices, interval-merging]
    levels:
      - id: choose-compatible-interval
        title: Choose a compatible interval
      - id: compare-room-left
        title: Compare how much room each choice leaves
      - id: apply-earliest-finish
        title: Apply earliest finish
    checkpoints:
      - id: optimal-schedule
        title: Explain the retained schedule
        summary: Explain the optimal retained schedule.

  - id: method-selection
    title: Method selection
    summary: Name the constraint that decides the method, contrast two techniques, and justify one.
    after: [problem-solving-routine, pointer-scans, hash-lookups, variable-windows, window-limits, prefix-counts, feasible-limits, bounded-heaps, traversal-layers]
    afterNote: Waits on every candidate method its drills compare, so review and the exam never test a technique the learner has not reached.
    levels:
      - id: identify-decisive-constraint
        title: Identify the decisive constraint
      - id: contrast-two-techniques
        title: Contrast two viable techniques
      - id: justify-one-method
        title: Justify one method on a fresh input
    checkpoints:
      - id: choose-a-method
        title: Choose and trace a method
        summary: Choose and trace a method with a counterexample to its closest alternative.
        mix: [trace, counterexample]

drills:
  - questionId: overlapping-subproblems
    disposition: rewrite
    path: repeated-states
    skill: identify-identical-inputs
    note: Draw a small call tree and circle identical arguments before introducing cache savings. `count-repeated-calls` does the call tree, so this card is the full version with cache savings, after the new cards.
  - questionId: suffix-subproblem
    disposition: keep
    path: repeated-states
    skill: name-subproblem
    note: New teaching card for naming a subproblem. A word-split call answers for the suffix from its index, against the prefix, one word, and a count.
  - questionId: key-misses-total
    disposition: keep
    path: repeated-states
    skill: name-subproblem
    note: New teaching card. A cache keyed on the index alone hands one running total's answer to every other total, so 3 becomes 8.
  - questionId: first-repeat-tap
    disposition: keep
    path: repeated-states
    skill: identify-identical-inputs
    note: New tap-the-cell teaching card. Tap the first call whose argument already appeared, in the call order of a plain recursion.
  - questionId: count-repeated-calls
    disposition: keep
    path: repeated-states
    skill: identify-identical-inputs
    note: New teaching card for the rewrite of `overlapping-subproblems`. Circle repeats in a small call tree, then count the call paths that reach one argument.
  - questionId: trace-memo-hits
    disposition: keep
    path: repeated-states
    skill: reuse-cached-result
    note: New step-through teaching card. Find the first cache hit, a later hit, the call count and the result of a cached recursion.
  - questionId: lookup-after-work
    disposition: keep
    path: repeated-states
    skill: reuse-cached-result
    note: New teaching card. A cache read after the recursive calls keeps the answer and saves nothing.
  - questionId: memo-reset-each-call
    disposition: keep
    path: repeated-states
    skill: reuse-cached-result
    note: New teaching card. A dict built inside the function is new on every call, so no lookup ever hits.
  - questionId: fewest-hops-ends-review
    disposition: keep
    path: repeated-states
    skill: name-subproblem
    variant: true
    note: Review variant, drag the pointers. Place the call that answers the whole row and the call that stops, for a suffix subproblem.
  - questionId: walk-key-review
    disposition: keep
    path: repeated-states
    skill: name-subproblem
    variant: true
    note: Review variant on a fresh recursion. Choose the cache key for a walk that depends on position and moves left.
  - questionId: outside-state-review
    disposition: keep
    path: repeated-states
    skill: name-subproblem
    variant: true
    note: Review variant on fresh state. A count that also reads a global `path` gives a wrong answer once cached on its index.
  - questionId: list-argument-review
    disposition: keep
    path: repeated-states
    skill: identify-identical-inputs
    variant: true
    note: Review variant. A list argument cannot be a cache key, so `@cache` raises before the body runs.
  - questionId: first-repeat-split-review
    disposition: keep
    path: repeated-states
    skill: identify-identical-inputs
    variant: true
    note: Review variant, tap the cell. The first repeat comes from one parent making the same call twice.
  - questionId: shared-grandchild-review
    disposition: keep
    path: repeated-states
    skill: identify-identical-inputs
    variant: true
    note: Review variant, drag the pointers. Place the range that both children of a take-from-either-end call reach.
  - questionId: trace-hits-offset-review
    disposition: keep
    path: repeated-states
    skill: reuse-cached-result
    variant: true
    note: Review variant, step-through trace. A repeated stopping case is not a hit, and the first hit is a stored argument.
  - questionId: falsy-false-review
    disposition: keep
    path: repeated-states
    skill: reuse-cached-result
    variant: true
    note: Review variant on a fresh bug. Testing the stored value instead of the key recomputes every stored `False`.
  - questionId: stale-memo-review
    disposition: keep
    path: repeated-states
    skill: reuse-cached-result
    variant: true
    note: Review variant. A cache keyed by index and kept across two strings returns the first string's answer.
  - questionId: cache-info-review
    disposition: keep
    path: repeated-states
    skill: reuse-cached-result
    variant: true
    note: Review variant. Read `cache_info()`. The body runs once per miss, and a hit skips it.
  - questionId: checkpoint-halves-no-hits
    disposition: exam
    path: repeated-states
    tests: [identify-identical-inputs, reuse-cached-result]
    covers: [disjoint]
    note: New checkpoint item. A split-in-half recursion never repeats a range, so a cache gets no hits.
  - questionId: checkpoint-split-or-trim
    disposition: exam
    path: repeated-states
    tests: [identify-identical-inputs, reuse-cached-result]
    covers: [overlapping, disjoint]
    note: New checkpoint item. Two functions with two calls each, disjoint halves against takes from either end that meet again.
  - questionId: checkpoint-first-hit-steps
    disposition: exam
    path: repeated-states
    tests: [reuse-cached-result, identify-identical-inputs]
    covers: [overlapping]
    note: New checkpoint item, tap the cell. Find the first cache hit in a subtract-or-halve recursion where a stopping case repeats first.
  - questionId: checkpoint-prefix-key
    disposition: exam
    path: repeated-states
    tests: [name-subproblem, identify-identical-inputs]
    covers: [disjoint]
    note: New checkpoint item. Calls that carry their whole prefix are disjoint, and renaming the state to the last digit makes them overlap.
  - questionId: tiling-recurrence
    disposition: rewrite
    path: one-dimensional-tables
    note: Separate the empty strip, last-tile choice and recurrence before pairing them.
  - questionId: nonadjacent-slots
    disposition: exam
    path: one-dimensional-tables
    note: Combine a prefix state with take-or-skip choices and the correct predecessor.
  - questionId: min-coins-recurrence
    disposition: exam
    path: one-dimensional-tables
    note: Distinguish zero coins, impossible amounts and valid predecessor states.
  - questionId: space-two-variables
    disposition: keep
    path: dp-storage
    note: After the full table, identify the two past values needed for the next step.
  - questionId: memoization-complexity
    disposition: exam
    path: dp-storage
    note: Combine reachable states, work per state and live call depth. Use a depth comparison independent of an exact interpreter limit.
  - questionId: window-max-sum-k
    disposition: rewrite
    path: method-selection
    skill: contrast-two-techniques
    note: Turn the name-the-pattern stem into one fixed-window update, then vary the constraint in a mixed exam. Its prefix-sum follow-up contrasts two methods that both work.
  - questionId: sorted-pair-sum
    disposition: rewrite
    path: method-selection
    skill: identify-decisive-constraint
    note: Ask which pointer moves under a tight memory budget and why a pair can be discarded. Sorted input and O(1) space are the deciding facts.
  - questionId: min-eating-speed
    disposition: rewrite
    path: method-selection
    skill: justify-one-method
    note: At one rate compute hours for indivisible batches, then find the monotone decision.
  - questionId: select-order-matters
    disposition: keep
    path: method-selection
    skill: identify-decisive-constraint
    note: New teaching card. Pairs survive sorting and runs do not, so whether neighbors matter decides it. Takes over the contiguity counterexample from the `subarray-sum-k` sort-sweep follow-up.
  - questionId: select-value-search
    disposition: keep
    path: method-selection
    skill: identify-decisive-constraint
    note: New teaching card. Binary search over capacities, not parcel indexes, legal because more capacity never adds days. The parcels are never sorted.
  - questionId: contrast-unsorted-scan
    disposition: keep
    path: method-selection
    skill: contrast-two-techniques
    note: New tap-cell teaching card. The opposite-ends scan on an unsorted list drops half of the only pair first, where a set of seen values needs no order.
  - questionId: contrast-variable-drag
    disposition: keep
    path: method-selection
    skill: contrast-two-techniques
    note: New drag-pointers teaching card. A variable window drops three values in one pass, where a fixed-width step drops one.
  - questionId: contrast-heap-or-sort
    disposition: keep
    path: method-selection
    skill: contrast-two-techniques
    note: New teaching card. A size-10 heap against a full sort for the 10 largest of n readings. It saves space and time, but still reads every reading.
  - questionId: justify-trace-capacity
    disposition: keep
    path: method-selection
    skill: justify-one-method
    note: New step-trace teaching card. Trace binary search over capacities 5 to 12 for parcels shipped in order within 2 days.
  - questionId: justify-window-counterexample
    disposition: keep
    path: method-selection
    skill: justify-one-method
    note: New teaching card. Pick the input that shows a window miscounts runs with an exact total on signed values, against inputs where it agrees with prefix counts.
  - questionId: select-review-sortable-task
    disposition: keep
    path: method-selection
    skill: identify-decisive-constraint
    variant: true
    note: Review variant. Pick the one task over date-ordered readings that sorting does not change.
  - questionId: select-review-monotone-minutes
    disposition: keep
    path: method-selection
    skill: identify-decisive-constraint
    variant: true
    note: Review variant on a fresh task. More minutes never finish fewer print jobs, which makes binary search on the minutes legal.
  - questionId: select-review-fixed-width
    disposition: keep
    path: method-selection
    skill: identify-decisive-constraint
    variant: true
    note: Review variant. A fixed width, not the sign of the values, lets a 7-day window move both ends each pass.
  - questionId: contrast-review-tap-unsorted
    disposition: keep
    path: method-selection
    skill: contrast-two-techniques
    variant: true
    note: Review variant on a fresh input (tap the cell). Tap the pair value the opposite-ends scan drops first on an unsorted list.
  - questionId: contrast-review-prefix-or-window
    disposition: keep
    path: method-selection
    skill: contrast-two-techniques
    variant: true
    note: Review variant. Many range-total questions with different starts and lengths call for running totals, not a window per question.
  - questionId: contrast-review-drag-grow
    disposition: keep
    path: method-selection
    skill: contrast-two-techniques
    variant: true
    note: Review variant on a fresh input (drag the pointers). Over two passes the variable window first grows, then drops one value.
  - questionId: contrast-review-bfs-dfs
    disposition: keep
    path: method-selection
    skill: contrast-two-techniques
    variant: true
    note: Review variant. On an unweighted grid, breadth-first search promises the fewest moves when it first reaches the target. Depth-first search does not.
  - questionId: justify-review-trace-rate
    disposition: keep
    path: method-selection
    skill: justify-one-method
    variant: true
    note: Review variant on a fresh input (step-through trace). Binary search over rates 1 to 8 for batches that must finish within 6 hours.
  - questionId: justify-review-exists-counterexample
    disposition: keep
    path: method-selection
    skill: justify-one-method
    variant: true
    note: Review variant. Pick the signed input where the window misses a run with an exact total, against one that has a negative value and still works.
  - questionId: justify-review-pick-pair
    disposition: keep
    path: method-selection
    skill: justify-one-method
    variant: true
    note: Review variant. A pair with a given total in an unsorted list in O(n) expected time calls for a set of seen values.
  - questionId: method-exam-trace-readers
    disposition: exam
    path: method-selection
    tests: [justify-one-method, identify-decisive-constraint]
    covers: [trace]
    note: New step-trace checkpoint item. Say why the search may drop the upper half, then trace a page-limit search for 2 readers.
  - questionId: method-exam-signed-count
    disposition: exam
    path: method-selection
    tests: [contrast-two-techniques, justify-one-method]
    covers: [counterexample]
    note: New checkpoint item. Prefix counts for exact-total runs on signed values, with the input where the window counts 2 of 3.
  - questionId: method-exam-tap-set-pass
    disposition: exam
    path: method-selection
    tests: [justify-one-method, contrast-two-techniques]
    covers: [trace]
    note: New tap-cell checkpoint item. The opposite-ends scan misses a pair on an unsorted list. Tap where the set pass returns True.
  - questionId: method-exam-sorted-counterexample
    disposition: exam
    path: method-selection
    tests: [identify-decisive-constraint, justify-one-method]
    covers: [counterexample]
    note: New checkpoint item. With values at least 1 and O(1) space, keep the order and use the window. Pick the input where sorting invents a run.
  - questionId: path-at-first-call
    disposition: keep
    path: search-state
    skill: make-a-choice
    note: New teaching card for making a choice. A two-leaf diagram, then what `path` holds when a level-2 call first starts.
  - questionId: child-start-index
    disposition: keep
    path: search-state
    skill: make-a-choice
    note: New drag-the-pointers teaching card. The choice also sets where the next call's loop starts, one past the item taken.
  - questionId: choice-after-call
    disposition: keep
    path: search-state
    skill: make-a-choice
    note: New teaching card for making a choice. An append moved below the call is never seen by it, and the calls never stop.
  - questionId: missing-pop-sibling
    disposition: keep
    path: search-state
    skill: undo-before-sibling
    note: New teaching card for the rewrite of `forgotten-undo`. Stop at the first sibling after a missing pop and ask what its leaf records.
  - questionId: trace-undo-before-sibling
    disposition: keep
    path: search-state
    skill: undo-before-sibling
    note: New step-through teaching card. Predict `path` after each pop and the call each skip branch makes.
  - questionId: saved-then-popped
    disposition: keep
    path: search-state
    skill: snapshot-finished-path
    note: New teaching card for the rewrite of `append-copy`. One saved `path` and one later pop.
  - questionId: trace-shared-record
    disposition: keep
    path: search-state
    skill: snapshot-finished-path
    note: New step-through teaching card. Watch entries saved without a copy change as the search pops.
  - questionId: forgotten-undo
    disposition: rewrite
    path: search-state
    skill: undo-before-sibling
    note: Stop at the first sibling and ask what remains in path; save the full faulty output trace for a variant. `missing-pop-sibling` does the first part, so this card is the full faulty output trace, after the new cards.
  - questionId: append-copy
    disposition: rewrite
    path: search-state
    skill: snapshot-finished-path
    note: Use one saved path and one later pop to teach snapshot versus alias. `saved-then-popped` does that, so this card is the full four-leaf version, after the new cards.
  - questionId: skip-first-path-review
    disposition: keep
    path: search-state
    skill: make-a-choice
    variant: true
    note: Review variant on a fresh search. Skip runs before take, so trace what `path` holds on the second start of a level-2 call.
  - questionId: piece-start-review
    disposition: keep
    path: search-state
    skill: make-a-choice
    variant: true
    note: Review variant, drag the pointers. Cutting a word into pieces, the next call starts where the piece just taken ends.
  - questionId: first-call-with-path-review
    disposition: keep
    path: search-state
    skill: make-a-choice
    variant: true
    note: Review variant, tap the cell. Identify the first call that starts holding a given path.
  - questionId: trace-combo-undo-review
    disposition: keep
    path: search-state
    skill: undo-before-sibling
    variant: true
    note: Review variant, step-through trace. Pop and move on through a choose-two loop, then back up to the caller.
  - questionId: pop-after-loop-review
    disposition: keep
    path: search-state
    skill: undo-before-sibling
    variant: true
    note: Review variant on a fresh bug. One pop per call instead of one per choice piles letters up.
  - questionId: stale-item-review
    disposition: keep
    path: search-state
    skill: undo-before-sibling
    variant: true
    note: Review variant, tap the cell. Pick out the item a skip call was meant to leave out but still holds.
  - questionId: used-flag-review
    disposition: keep
    path: search-state
    skill: undo-before-sibling
    variant: true
    note: Review variant on fresh state. A used flag that is never cleared stops every later ordering.
  - questionId: record-line-review
    disposition: keep
    path: search-state
    skill: snapshot-finished-path
    variant: true
    note: Review variant. Choose the record line that saves a copy, against a reference, an uncalled method and `extend`.
  - questionId: joined-record-review
    disposition: keep
    path: search-state
    skill: snapshot-finished-path
    variant: true
    note: Review variant. A joined string is already a snapshot, so later pops cannot reach it.
  - questionId: new-list-per-call-review
    disposition: keep
    path: search-state
    skill: snapshot-finished-path
    variant: true
    note: Review variant. When each call builds its own list and nothing changes it, saving it needs no copy.
  - questionId: checkpoint-grid-seen-leak
    disposition: exam
    path: search-state
    tests: [undo-before-sibling, make-a-choice]
    note: New checkpoint item. A grid walk never unmarks a cell, so a later sibling is blocked and paths are lost.
  - questionId: checkpoint-alias-pairs
    disposition: exam
    path: search-state
    tests: [snapshot-finished-path, undo-before-sibling]
    note: New checkpoint item. The undo is right and the record leaks, so pick the one change that fixes the output.
  - questionId: checkpoint-running-total-leak
    disposition: exam
    path: search-state
    tests: [undo-before-sibling, make-a-choice]
    note: New checkpoint item. A running total is never undone, so siblings record selections they never chose.
  - questionId: checkpoint-break-before-pop
    disposition: exam
    path: search-state
    tests: [undo-before-sibling, make-a-choice]
    note: New checkpoint item, tap the cell. A prune that breaks before it pops leaves an item behind. Tap the first list never recorded.
  - questionId: subset-cost
    disposition: exam
    path: enumerating-choices
    note: Combine decision-tree leaves and the total cost of copying results.
  - questionId: permutation-duplicates
    disposition: exam
    path: enumerating-choices
    note: Combine sorting, used indices and same-depth duplicate choices.
  - questionId: pruned-search
    disposition: exam
    path: enumerating-choices
    note: Combine sorted positive weights, remaining capacity and a safe early break.
  - questionId: base-case-depth
    disposition: rewrite
    path: recursive-calls
    note: Trace the missing stopping condition on a tiny input before introducing stack limits.
  - questionId: sum-empty-stop
    disposition: keep
    path: recursive-calls
    skill: identify-stopping-case
    note: New teaching card for naming the stopping case. Worked example on a countdown, then one decision on a list sum that must handle `[]`.
  - questionId: deleted-stop
    disposition: keep
    path: recursive-calls
    skill: identify-stopping-case
    note: New teaching card for the missing base case. Trace the countdown's call on 0 once the stopping case is deleted, before any stack limit comes up.
  - questionId: palindrome-third-call
    disposition: keep
    path: recursive-calls
    skill: trace-smaller-call
    note: New drag-the-pointers teaching card. Place `lo` and `hi` for the third call of a palindrome check, counting the first call.
  - questionId: empty-suffix-call
    disposition: keep
    path: recursive-calls
    skill: trace-smaller-call
    note: New tap-the-cell teaching card. Tap where the empty suffix starts, one past the last letter, for the call that stops.
