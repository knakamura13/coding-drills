  - questionId: storage-review-two-rows
    disposition: keep
    path: dp-storage
    skill: mark-entries-still-needed
    variant: true
    note: Review variant. A move two rows down keeps rows r - 1 and r - 2 in memory.
  - questionId: storage-review-trace-two-lines
    disposition: keep
    path: dp-storage
    skill: preserve-old-and-new
    variant: true
