  - questionId: storage-review-tap-reused-item
    disposition: keep
    path: dp-storage
    skill: preserve-old-and-new
    variant: true
    note: Review variant on a fresh input (tap the cell). A left-to-right pass for a weight-3 item first goes wrong at capacity 6.
  - questionId: storage-review-save-diagonal
    disposition: keep
    path: dp-storage
    skill: preserve-old-and-new
    variant: true
    note: Review variant. A one-row path count with diagonal moves must copy the old value before overwriting it.
  - questionId: storage-review-coin-direction
    disposition: keep
    path: dp-storage
    skill: preserve-old-and-new
    variant: true
    note: Review variant. Running the unlimited-coin loop high to low counts each coin at most once and returns 1.
  - questionId: storage-review-grid-memo
    disposition: keep
    path: dp-storage
    skill: count-states-and-work
    variant: true
    note: Review variant. A cached grid path count is O(R·C) time with a stack O(R + C) deep.
  - questionId: storage-review-stock-states
    disposition: keep
    path: dp-storage
    skill: count-states-and-work
    variant: true
    note: Review variant. A day plus a holding flag gives about 2n states and O(n) time.
  - questionId: storage-review-memo-space
    disposition: keep
    path: dp-storage
    skill: count-states-and-work
    variant: true
    note: Review variant. A cached recursion keeps O(n) values and O(n) frames where a two-variable loop keeps O(1).
  - questionId: storage-exam-sparse-states
    disposition: exam
    path: dp-storage
    tests: [count-states-and-work, mark-entries-still-needed]
    covers: [memo-or-table]
    note: New checkpoint item. Halving and thirding reach 108 states from a million, so memoization beats a full table and no window fits.
  - questionId: storage-exam-tap-subset
    disposition: exam
    path: dp-storage
    tests: [preserve-old-and-new]
    covers: [rolling-row]
    note: New tap-cell checkpoint item. A left-to-right subset-sum pass first marks a false sum at 4 by using the 2 twice.
  - questionId: storage-exam-choose-rolling
    disposition: exam
    path: dp-storage
    tests: [mark-entries-still-needed, count-states-and-work]
    covers: [memo-or-table]
    note: New checkpoint item. Look-backs of 1 and 3 up to a million call for three rolling values over memoization or a full table.
  - questionId: storage-exam-triangle-direction
    disposition: exam
    path: dp-storage
    tests: [preserve-old-and-new, mark-entries-still-needed]
    covers: [rolling-row]
    note: New checkpoint item. A one-row triangle walk needs old values on both sides, so the loop runs right to left.
  - questionId: grid-incoming-three-moves
    disposition: keep
    path: grid-tables
    skill: identify-incoming-neighbors
    note: New teaching card. With a diagonal move added, undo each move to find the three cells an entry reads.
  - questionId: grid-tap-down-left-source
    disposition: keep
    path: grid-tables
    skill: identify-incoming-neighbors
    note: New tap-cell teaching card. With a down-left move, tap the cell of the row above that steps into a given cell.
  - questionId: grid-fill-order-left-moves
    disposition: keep
    path: grid-tables
    skill: identify-incoming-neighbors
    note: New teaching card. Moves left and down read the cell to the right, so each row is filled right to left.
  - questionId: grid-tap-first-wrong-edge
    disposition: keep
    path: grid-tables
    skill: initialize-edges-obstacles
    note: New tap-cell teaching card. Filling row 0 with 1s gives a count to the cells past a block. Tap the first wrong one.
  - questionId: grid-blocked-cost-value
    disposition: keep
    path: grid-tables
    skill: initialize-edges-obstacles
    note: New teaching card. A blocked cell in a cheapest-total table holds infinity, since 0, -1 or any fixed cost wins the `min`.
  - questionId: grid-trace-row-fill
    disposition: keep
    path: grid-tables
    skill: fill-interior-cell
    note: New step-trace teaching card. Fill a row of path counts from the row above, past a block in the row and a block above.
  - questionId: grid-interior-min-cell
    disposition: keep
    path: grid-tables
    skill: fill-interior-cell
    note: New teaching card. Compute one interior cheapest total from labeled predecessor totals, against adding both or following the cheaper cell.
  - questionId: grid-review-jump-down
    disposition: keep
    path: grid-tables
    skill: identify-incoming-neighbors
    variant: true
    note: Review variant. A jump of two rows down means the entry reads two rows up, not one.
  - questionId: grid-review-tap-long-diagonal
    disposition: keep
    path: grid-tables
    skill: identify-incoming-neighbors
    variant: true
    note: Review variant on a fresh grid (tap the cell). Tap the source of a move one row down and two columns right.
  - questionId: grid-review-fill-order-up
    disposition: keep
    path: grid-tables
    skill: identify-incoming-neighbors
    variant: true
    note: Review variant. Moves up and right read the row below, so rows are filled bottom to top.
  - questionId: grid-review-tap-free-cells
    disposition: keep
    path: grid-tables
    skill: initialize-edges-obstacles
    variant: true
    note: Review variant on a fresh grid (tap the cell). Off-grid reads of 0 break a cheapest total only once the running total is above 0.
  - questionId: grid-review-blocked-start
    disposition: keep
    path: grid-tables
    skill: initialize-edges-obstacles
    variant: true
    note: Review variant. A start check placed before the block check seeds a blocked start with 1.
  - questionId: grid-review-max-walled-in
    disposition: keep
    path: grid-tables
    skill: initialize-edges-obstacles
    variant: true
    note: Review variant. A largest-total table needs -inf for blocked and off-grid cells, with the start seeded.
  - questionId: grid-review-padded-seed
    disposition: keep
    path: grid-tables
    skill: initialize-edges-obstacles
    variant: true
    note: Review variant. In a table padded with zeros, the seed goes in a padding cell the start reads.
  - questionId: grid-review-interior-max
    disposition: keep
    path: grid-tables
    skill: fill-interior-cell
    variant: true
    note: Review variant on a fresh grid. Compute one interior largest coin total from labeled predecessor totals.
  - questionId: grid-review-trace-row
    disposition: keep
    path: grid-tables
    skill: fill-interior-cell
    variant: true
    note: Review variant on a fresh grid (step-through trace). Fill a row of path counts past a block above and a block in the row.
  - questionId: grid-review-diagonal-cell
    disposition: keep
    path: grid-tables
    skill: fill-interior-cell
    variant: true
