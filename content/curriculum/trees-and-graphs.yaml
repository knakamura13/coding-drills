# Trees and graphs. Part of the mastery map (issue #13).
id: trees-and-graphs
title: Trees and graphs
summary: Reachability, layers, connectivity, orderings, weights, and tree structure.
order: 4

paths:
  - id: reachability
    title: Reachability
    summary: Find legal neighbors, mark a cell when it is discovered, and finish one region.
    after: [arrays-and-strings]
    afterNote: The plan also names FIFO and LIFO operations. Those are not separate paths; stack matching and priority order teach them.
    levels:
      - id: find-legal-neighbors
        title: Find legal neighbors
      - id: mark-on-discovery
        title: Mark on discovery
      - id: finish-reachable-region
        title: Finish one reachable region
    checkpoints:
      - id: islands-without-joins
        title: Count islands
        summary: Count islands without joining diagonals or revisiting land.

  - id: traversal-layers
    title: Traversal layers
    summary: Trace one queue layer, label unit distances, and start from several sources.
    after: [reachability]
    afterNote: FIFO is named as well and is not a separate path. Priority order introduces FIFO versus priority.
    levels:
      - id: trace-queue-layer
        title: Trace one queue layer
      - id: label-unit-distances
        title: Label unit distances
      - id: seed-multiple-sources
        title: Seed multiple sources
    checkpoints:
      - id: simultaneous-spread
        title: Time a simultaneous spread
        summary: Time simultaneous spread and explain where it stops.

  - id: connectivity
    title: Connectivity
    summary: Read an adjacency list and separate components. Linking sets over time is a fork.
    after: [reachability]
    levels:
      - id: read-adjacency-list
        title: Read an adjacency list
      - id: separate-components
        title: Separate components
    forks:
      - id: union-find
        title: Dynamic links
        levels:
          - id: follow-representatives
            title: Follow representatives
          - id: union-sets
            title: Union sets
          - id: test-later-connection
            title: Test a later connection
    checkpoints:
      - id: components-or-links
        title: Components or a link stream
        summary: Count static components or answer a stream of link events.

  - id: dependency-order
    title: Dependency order
    summary: Read a directed prerequisite, count incoming edges, and unlock a successor.
    after: [reachability]
    afterNote: FIFO is named as well and is not a separate path.
    levels:
      - id: read-directed-prerequisite
        title: Read a directed prerequisite
      - id: count-incoming-edges
        title: Count incoming edges
      - id: unlock-successor
        title: Unlock a successor
    checkpoints:
      - id: partial-kahn-result
        title: Explain a partial order
        summary: Explain a partial Kahn result.

  - id: weighted-paths
    title: Weighted paths
    summary: Sum edge weights, relax one edge, and see when a distance can be finalized.
    after: [traversal-layers, priority-order]
    levels:
      - id: sum-edge-weights
        title: Sum edge weights
      - id: relax-one-edge
        title: Relax one edge
      - id: finalize-distance
        title: Decide when a tentative distance can be finalized
    checkpoints:
      - id: choose-weighted-algorithm
        title: Choose a weighted algorithm
        summary: Select an algorithm under the stated weight constraints or diagnose repeated work.

  - id: tree-walks
    title: Tree walks
    summary: Name the parts of a tree, trace a visit order, and tell height from node count.
    after: [recursive-calls]
    afterNote: FIFO for level order is named as well and is not a separate path.
    levels:
      - id: name-tree-parts
        title: Identify root, child, and subtree
      - id: trace-visit-order
        title: Trace visit order
      - id: height-versus-count
        title: Distinguish height from node count
    checkpoints:
      - id: traversal-and-depth
        title: Trace a traversal and its depth
        summary: Trace a traversal and predict live stack depth.

  - id: bst-order
    title: BST order
    summary: Choose an ordered subtree, inherit an ancestor bound, and find where two targets split.
    after: [tree-walks]
    levels:
      - id: choose-ordered-subtree
        title: Choose an ordered subtree
      - id: inherit-ancestor-bound
        title: Inherit an ancestor bound
      - id: identify-target-split
        title: Identify a split between targets
    checkpoints:
      - id: validate-or-ancestor
        title: Validate or find an ancestor
        summary: Validate a tree or find the lowest common ancestor.

  - id: tree-summaries
    title: Tree summaries
    summary: Use child heights, tell a returned height from a path through the node, and keep the best path.
    after: [tree-walks]
    levels:
      - id: compute-child-heights
        title: Compute child heights
      - id: height-versus-through-path
        title: Distinguish returned height from a through-node path
      - id: track-best-path
        title: Track the best path seen
    checkpoints:
      - id: trace-diameter
        title: Trace a diameter
        summary: Complete and trace diameter on a fresh tree.

drills:
  - questionId: prep-order-needs-dag
    disposition: rewrite
    path: dependency-order
    note: Show three tasks and ask which is ready; introduce a cycle separately.
  - questionId: kahn-short-result
    disposition: exam
    path: dependency-order
    note: Explain a partial order and distinguish a blocked descendant from a cycle member.
  - questionId: union-find-link-stream
    disposition: rewrite
    path: connectivity
    note: Trace one union and one same-set query before comparing repeated searches with union-find.
  - questionId: negative-edge-shortest-path
    disposition: exam
    path: weighted-paths
    note: Use a negative edge on a fresh graph to distinguish hop count, greedy finalization and repeated relaxation.
  - questionId: dijkstra-stale-entry
    disposition: exam
    path: weighted-paths
    note: Use a cheaper route discovered later to distinguish correctness from redundant heap work.
  - questionId: count-components-edge-list
    disposition: exam
    path: connectivity
    note: Combine adjacency construction, a visited set and isolated vertices.
  - questionId: count-islands
    disposition: exam
    path: reachability
    note: Combine neighbor rules, flood fill and the outer scan; include diagonally touching land.
  - questionId: shortest-path-grid
    disposition: keep
    path: traversal-layers
    note: After a queue trace, choose a traversal for a maze with unit-cost moves.
  - questionId: bfs-mark-on-enqueue
    disposition: rewrite
    path: reachability
    note: Use a diamond or 2-by-2 grid and ask at which enqueue two paths try to claim the same cell.
  - questionId: multi-source-bfs
    disposition: exam
    path: traversal-layers
    note: Combine initial sources, layer timing and unreachable cells.
  - questionId: recursive-dfs-depth
    disposition: rewrite
    path: reachability
    note: Trace frames on a thin corridor; choose an explicit stack once depth is understood.
  - questionId: grid-bounds-and-cost
    disposition: rewrite
    path: reachability
    note: Split Python negative-index wraparound from counting visited cells. Use the former before flood fill.
  - questionId: postorder-output
    disposition: rewrite
    path: tree-walks
    note: Trace a three-node tree before asking for the complete traversal of an asymmetric tree.
  - questionId: bst-bounds-check
    disposition: exam
    path: bst-order
    note: Combine inherited bounds and recursion to diagnose a deep violation.
  - questionId: level-order-queue
    disposition: rewrite
    path: tree-walks
    note: Draw one frontier and ask where the current level ends before choosing the queue loop.
  - questionId: recursion-cost
    disposition: exam
    path: tree-walks
    note: Distinguish total visited nodes from maximum active depth across two shapes.
  - questionId: bst-lowest-common-ancestor
    disposition: exam
    path: bst-order
    note: Combine ordering, divergence and the case where a target is itself the ancestor.
  - questionId: diameter-return-vs-record
    disposition: exam
    path: tree-summaries
    note: Combine two child heights with a through-node path and a global maximum.

followUps:
  - questionId: grid-bounds-and-cost
    optionId: quadratic
    disposition: rewrite
    path: reachability
    note: Place total visited-cell cost after flood fill; give the bounds lesson a coordinate trace.
  - questionId: count-components-edge-list
    optionId: one-search
    disposition: rewrite
    path: reachability
    note: Promote one completed traversal to Reachability before the connectivity exam.
  - questionId: shortest-path-grid
    optionId: dijkstra
    disposition: rewrite
    path: weighted-paths
    note: Reserve the priority-queue comparison for Weighted paths after Priority order.
