    depth: deep
    note: 'A route listed in reverse needs one pass per edge, so C reaches its cheapest cost only after pass 3, which is V - 1; Bellman-Ford''s V - 1 passes always suffice. Counting the passes a route needs is deep.'
  - questionId: wp-negative-cycle-pass
    disposition: keep
    path: weighted-paths
    skill: relax-one-edge
    depth: deep
    note: Of four edge lists, pass V still lowers a distance only on the one with a negative cycle the start can reach; a negative edge with no cycle, a cycle that adds up to 0 and an unreachable negative cycle do not. Negative cycles are deep.
  - questionId: wp-record-prev
