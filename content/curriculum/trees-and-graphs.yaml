# Trees and graphs. Part of the mastery map (issue #13).
id: trees-and-graphs
title: Trees and graphs
summary: Reachability, layers, connectivity, orderings, weights, and tree structure.
order: 4

paths:
  - id: reachability
    title: Reachability
    summary: Find legal neighbors, mark a cell when it is discovered, and finish one region.
    after: [arrays-and-strings]
    afterNote: The frontier is a plain list, and `frontier.pop()` takes the item added last. That is all this path needs; Traversal layers teaches the queue.
    levels:
      - id: find-legal-neighbors
        title: Find legal neighbors
      - id: mark-on-discovery
        title: Mark on discovery
      - id: finish-reachable-region
        title: Finish one reachable region
    checkpoints:
      - id: islands-without-joins
        title: Count islands
        summary: Count islands without joining diagonals or revisiting land.

  - id: traversal-layers
    title: Traversal layers
    summary: Trace one queue layer, label unit distances, and start from several sources.
    after: [reachability]
    afterNote: 'Its first card states the queue rule in its prompt: `popleft()` removes the item at the front, and `append` adds at the back. So Operation costs, which defines the queue, is not needed.'
    levels:
      - id: trace-queue-layer
        title: Trace one queue layer
      - id: label-unit-distances
        title: Label unit distances
      - id: seed-multiple-sources
        title: Start from several sources
    checkpoints:
      - id: simultaneous-spread
        title: Time a simultaneous spread
        summary: Time simultaneous spread and explain where it stops.

  - id: connectivity
    title: Connectivity
    summary: Read an adjacency list and separate components. Linking sets over time is a fork.
    after: [reachability]
    levels:
      - id: read-adjacency-list
        title: Read an adjacency list
      - id: separate-components
        title: Separate components
    forks:
      - id: union-find
        title: Dynamic links
        levels:
          - id: follow-representatives
            title: Follow representatives
          - id: union-sets
            title: Union sets
          - id: test-later-connection
            title: Test a later connection
    checkpoints:
      - id: components-or-links
        title: Components or a link stream
        summary: Count static components or answer a stream of link events.
        mix: [static-components, dynamic-links]

  - id: dependency-order
    title: Dependency order
    summary: Read a directed prerequisite, count incoming edges, and unlock a successor.
    after: [reachability]
    afterNote: '`dep-unlock-trace`, the review trace and the checkpoint''s cycle check state the queue rule in their prompts: `popleft()` removes the item at the front, and `append` adds at the back. So Operation costs, which defines the queue, is not needed.'
    levels:
      - id: read-directed-prerequisite
        title: Read a directed prerequisite
      - id: count-incoming-edges
        title: Count incoming edges
      - id: unlock-successor
        title: Unlock a successor
    checkpoints:
      - id: partial-kahn-result
        title: Explain a partial order
        summary: Explain a partial Kahn result.

  - id: weighted-paths
    title: Weighted paths
    summary: Sum edge weights, relax every edge in a pass, and find the cheapest route within k stops.
    after: [traversal-layers]
    afterNote: Traversal layers brings graphs and the distance labels these cards relax.
    levels:
      - id: sum-edge-weights
        title: Sum edge weights
      - id: relax-one-edge
        title: Relax one edge
    forks:
      - id: dijkstra
        title: Finalize distances
        after: relax-one-edge
        needs: [predict-push-pop]
        levels:
          - id: finalize-distance
            title: Decide when a tentative distance can be finalized
            depth: deep
    checkpoints:
      - id: cheapest-within-stops
        title: Find the cheapest route within k stops
        summary: Trace relaxation passes and find the cheapest route that stays within a stop limit.
        mix: [relax-edges, limit-stops]

  - id: spanning-trees
    title: Minimum spanning trees
    summary: Read a spanning tree, add the cheapest edge that joins two parts, and grow one tree from a start node.
    depth: deep
    after: [connectivity, weighted-paths, priority-order]
    afterNote: Connectivity brings union-find, path compression and, at this depth, union by size. Weighted paths brings edge weights and Dijkstra's loop, and Priority order the heap that Prim's algorithm pops.
    levels:
      - id: read-spanning-tree
        title: Read a spanning tree
      - id: add-cheapest-joining-edge
        title: Add the cheapest joining edge
      - id: grow-from-one-node
        title: Grow a tree from one node
    checkpoints:
      - id: build-minimum-tree
        title: Build a minimum spanning tree
        summary: Build a minimum spanning tree on a fresh graph with Kruskal or Prim.
        mix: [kruskal, prim]

  - id: tree-walks
    title: Tree walks
    summary: Name the parts of a tree, trace a visit order, and tell height from node count.
    after: [recursive-calls]
    afterNote: 'Its level-order cards state the queue rule in their prompts: `popleft()` removes the item at the front, and `append` adds at the back. So Operation costs, which defines the queue, is not needed.'
    levels:
      - id: name-tree-parts
        title: Identify root, child, and subtree
      - id: trace-visit-order
        title: Trace visit order
      - id: height-versus-count
        title: Distinguish height from node count
    checkpoints:
      - id: traversal-and-depth
        title: Trace a traversal and its live calls
        summary: Trace a traversal and count the calls still live at one moment.

  - id: bst-order
    title: BST order
    summary: Choose an ordered subtree, read the values in sorted order, inherit an ancestor bound, and find where two targets split.
    depth: deep
    after: [tree-walks]
    levels:
      - id: choose-ordered-subtree
        title: Use the sorted order
      - id: inherit-ancestor-bound
        title: Inherit an ancestor bound
      - id: identify-target-split
        title: Identify a split between targets
    checkpoints:
      - id: validate-or-ancestor
        title: Validate or find an ancestor
        summary: Validate a tree or find the lowest common ancestor.
        mix: [validate, ancestor]

  - id: tree-summaries
    title: Tree summaries
    summary: Use child heights, tell a returned height from a path through the node, and keep the best path.
    after: [tree-walks]
    levels:
      - id: compute-child-heights
        title: Compute child heights
      - id: height-versus-through-path
        title: Distinguish returned height from a through-node path
      - id: track-best-path
        title: Track the best path seen
    checkpoints:
      - id: trace-diameter
        title: Trace a diameter
        summary: Complete and trace diameter on a fresh tree.
        mix: [complete-code, trace-tree]

  - id: tree-answers
    title: Tree answers
    summary: Compare two trees, pass a value down to every child, and return what a search found.
    after: [tree-walks]
    levels:
      - id: compare-two-trees
        title: Compare two trees
      - id: pass-down-a-value
        title: Pass a value down
      - id: return-what-was-found
        title: Return what was found
    checkpoints:
      - id: answer-from-subtrees
        title: Answer from subtrees
        summary: Compare, pass down and return answers on fresh trees.
        mix: [compare, pass-down, found]

  - id: tries
    title: Tries
    summary: Follow one link per letter, tell a word from a prefix by its end mark, and count the nodes words share.
    after: [tree-walks, hash-lookups]
    afterNote: A trie node keeps its children in a dict, so a lookup costs about one place on average, as Hash lookups and Operation costs teach. The node class follows Tree walks.
    levels:
      - id: follow-letter-links
        title: Follow letter links
      - id: mark-word-ends
        title: Mark word ends
      - id: count-shared-nodes
        title: Count shared nodes
    checkpoints:
      - id: prefix-or-word
        title: Prefix or word
        summary: Follow letters, read end marks and count new nodes on new word lists.

drills:
  - questionId: prep-order-needs-dag
    disposition: retire
    path: dependency-order
    note: 'Not absorbed: `dep-ready-task` asks which task is ready, and `dep-two-task-cycle` names the cycle. The older deck stays as a fixture.'
  - questionId: kahn-short-result
    disposition: retire
    path: dependency-order
    note: 'Not copied: `dep-cycle-stalls` teaches what a short result means, and `dep-exam-blocked-node` prints it, so the item would be answered from memory. Replaced by `dep-exam-final-counts`. The older deck stays as a fixture.'
  - questionId: union-find-link-stream
    disposition: retire
    path: connectivity
    note: 'Not absorbed: `connectivity-later-same-trace` traces the unions and same-set queries, and its comparison rests on union by size and amortized cost, which are deep. The older deck stays as a fixture.'
  - questionId: negative-edge-shortest-path
    disposition: retire
    path: weighted-paths
    note: 'Copied unchanged into the Weighted paths checkpoint as `wp-exam-negative-edge`, tagged deep: choosing Bellman-Ford for negative weights is deep. The older deck stays as a fixture.'
  - questionId: dijkstra-stale-entry
    disposition: retire
    path: weighted-paths
    note: 'Copied into the Weighted paths checkpoint as `wp-exam-stale-check`, with `float(''inf'')` in place of `from math import inf`, tagged deep with the Dijkstra fork. The older deck stays as a fixture.'
  - questionId: count-components-edge-list
    disposition: retire
    path: connectivity
    note: 'Not copied: the outer scan is taught by `connectivity-components-restart` and printed by `connectivity-exam-one-way-build`, so the approach item would be answered from memory. Replaced by `connectivity-exam-largest-component`. The older deck stays as a fixture.'
  - questionId: count-islands
    disposition: retire
    path: reachability
    note: 'Not copied: the outer scan is taught by `reachability-next-region` and described by `reachability-checkpoint-next-start`, so its approach item would be answered from memory. `reachability-checkpoint-trapped-land` takes its checkpoint place with a fresh problem. The older deck stays as a fixture.'
  - questionId: shortest-path-grid
    disposition: retire
    path: traversal-layers
    note: 'Absorbed into Traversal layers as `traversal-stack-first-label`: the stack-first search labels a cell with a longer route than the queue. The Dijkstra comparison is left to Weighted paths. The older deck stays as a fixture.'
  - questionId: bfs-mark-on-enqueue
    disposition: retire
    path: reachability
    note: 'Its rewrite is done by `reachability-mark-convergence` and `reachability-checkpoint-duplicate-work`, which mark on adding against marking on popping. The older deck stays as a fixture.'
  - questionId: multi-source-bfs
    disposition: retire
    path: traversal-layers
    note: 'Not copied: one queue started from every source is taught by `traversal-source-zero`, so its approach item would be answered from memory. `traversal-exam-shared-neighbor` takes its checkpoint place with a fresh problem. The older deck stays as a fixture.'
  - questionId: recursive-dfs-depth
    disposition: retire
    path: reachability
    note: 'Not absorbed: Reachability is not after Recursion, so call depth and `RecursionError` are untaught on its chain. The older deck stays as a fixture.'
  - questionId: grid-bounds-and-cost
    disposition: retire
    path: reachability
    note: 'Its wraparound half is done by `reachability-negative-wraps`, `reachability-reject-negative-row` and `reachability-checkpoint-wraparound`. Its cost half needs Big-O, which is not on the chain. The older deck stays as a fixture.'
  - questionId: postorder-output
    disposition: retire
    path: tree-walks
    note: 'Absorbed into Tree walks as `tree-walks-postorder-list`, which names the walk postorder in its prompt and drops "depth-first". The older deck stays as a fixture.'
  - questionId: bst-bounds-check
    disposition: retire
    path: bst-order
    note: 'Not kept: its copy in the BST order checkpoint was deleted in the deep pass, because the `(low, high)` validator it asks for is printed by the path''s teaching cards and by other items in the pool. `bst-order-exam-fit-count` checks the skill on a fresh tree. The older deck stays as a fixture.'
  - questionId: level-order-queue
    disposition: retire
    path: tree-walks
    note: 'Not absorbed: `tree-walks-level-order` shows that a queue visits depth by depth, and `tree-walks-round-boundary` finds where one depth ends. The older deck stays as a fixture.'
  - questionId: recursion-cost
    disposition: retire
    path: tree-walks
    note: 'Not copied: it asks for Big-O, which is not on Tree walks'' chain, and `tree-walks-review-calls-and-depth` separates total calls from the most live calls without it. The older deck stays as a fixture.'
  - questionId: bst-lowest-common-ancestor
    disposition: retire
    path: bst-order
    note: 'Not kept: its copy in the BST order checkpoint was deleted in the deep pass, because the split walk it asks for is printed by `bst-order-target-is-ancestor` and by `bst-order-exam-target-ancestor` in the same pool. `bst-order-exam-pick-pair` checks the skill on a fresh tree. The older deck stays as a fixture.'
  - questionId: diameter-return-vs-record
    disposition: retire
    path: tree-summaries
    note: 'Copied as a fresh problem, `tree-summaries-exam-swapped-roles`: a straight copy''s correct pair is printed in `tree-summaries-best-node` and `tree-summaries-exam-trace`, so it would be answered from memory. The older deck stays as a fixture.'

  - questionId: reachability-tap-east
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    note: Tap the land cell one step right of the start. Its worked example introduces the path.
  - questionId: reachability-diagonal-neighbor
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    note: 'Defines `(r, c)` and `grid[r][c]`, then picks the one legal move against two diagonals and a cell two columns away.'
  - questionId: reachability-negative-wraps
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    note: 'Tap the row `grid[-1]` reads after a step up from row 0: the last row, with no error.'
  - questionId: reachability-reject-negative-row
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    note: 'Pick the bounds test that accepts exactly the cells inside a 2-by-3 grid, against no lower bounds, rows for columns, and `<=`.'
  - questionId: reachability-frontier-trace
    disposition: keep
    path: reachability
    skill: mark-on-discovery
    note: 'Defines the frontier and `seen`. Trace one pop, the next cell `pop()` takes, and the final `seen` on a row.'
  - questionId: reachability-mark-convergence
    disposition: keep
    path: reachability
    skill: mark-on-discovery
    note: A second neighbor finds a cell still waiting in the frontier. Skip it, because it was marked when it was added.
  - questionId: reachability-mark-start
    disposition: keep
    path: reachability
    skill: mark-on-discovery
    note: With `seen` starting empty, the start is added back by its neighbor and processed twice.
  - questionId: reachability-stop-at-water
    disposition: keep
    path: reachability
    skill: finish-reachable-region
    note: Defines a flood fill. Pick the cells it reaches, against a diagonal join and crossing water.
  - questionId: reachability-empty-frontier
    disposition: keep
    path: reachability
    skill: finish-reachable-region
    note: Defines graph, node and edge. An empty frontier means the start's region is found, not the whole graph.
  - questionId: reachability-next-region
    disposition: keep
    path: reachability
    skill: finish-reachable-region
    note: Defines an island. Tap where the scan starts the second fill, skipping cells the first fill marked.
  - questionId: reachability-right-edge-review
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    variant: true
    note: Reject a step past the last column before reading it.
  - questionId: reachability-left-edge-review
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    variant: true
    note: Tap the cell a step left from column 0 reads when the test has no lower bound.
  - questionId: reachability-water-neighbor-review
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    variant: true
    note: Pick the neighbors a search may add, against a diagonal and a water cell.
  - questionId: reachability-down-edge-review
    disposition: keep
    path: reachability
    skill: find-legal-neighbors
    variant: true
    note: Pick the step past the last row, with columns bounded by the row length.
  - questionId: reachability-diamond-review
    disposition: keep
    path: reachability
    skill: mark-on-discovery
    variant: true
    note: Count how many times a node with two finders joins the frontier.
  - questionId: reachability-stack-mark-review
    disposition: keep
    path: reachability
    skill: mark-on-discovery
    variant: true
    note: Skip a waiting cell rather than add it again so `pop()` takes it sooner.
  - questionId: reachability-return-to-start-review
    disposition: keep
    path: reachability
    skill: mark-on-discovery
    variant: true
    note: The start's mark in `seen`, not leaving the frontier, keeps it from being added again.
  - questionId: reachability-round-the-wall-review
    disposition: keep
    path: reachability
    skill: finish-reachable-region
    variant: true
    note: A flood fill reaches land past water by a route of land around it.
  - questionId: reachability-diagonal-region-review
    disposition: keep
    path: reachability
    skill: finish-reachable-region
    variant: true
    note: Count the cells a flood fill marks when the only other land is diagonal.
  - questionId: reachability-drain-stack-review
    disposition: keep
    path: reachability
    skill: finish-reachable-region
    variant: true
    note: Trace two pops on a small grid and give the frontier that remains.
  - questionId: reachability-next-region-review
    disposition: keep
    path: reachability
    skill: finish-reachable-region
    variant: true
    note: Tap where the scan starts the third fill on a fresh row.
  - questionId: reachability-checkpoint-corner-patches
    disposition: exam
    path: reachability
    tests:
      - find-legal-neighbors
      - finish-reachable-region
    checkpoint: islands-without-joins
    note: Count islands where some land touches only at corners.
  - questionId: reachability-checkpoint-wraparound
    disposition: exam
    path: reachability
    tests:
      - find-legal-neighbors
      - finish-reachable-region
    checkpoint: islands-without-joins
    note: An island counter whose bounds test has no lower bound for columns reports 1 island instead of 2.
  - questionId: reachability-checkpoint-duplicate-work
    disposition: exam
    path: reachability
    tests:
      - mark-on-discovery
    checkpoint: islands-without-joins
    note: Marking on pop with `frontier.pop()` adds `(0, 1)` twice on a 2-by-2 block.
  - questionId: reachability-checkpoint-next-start
    disposition: exam
    path: reachability
    tests:
      - finish-reachable-region
    checkpoint: islands-without-joins
    note: Pick the cell where the row-by-row scan starts its second fill.
  - questionId: reachability-checkpoint-trapped-land
    disposition: exam
    path: reachability
    tests:
      - find-legal-neighbors
      - finish-reachable-region
    checkpoint: islands-without-joins
    note: Count the land cells whose island reaches no outer row or column, where one inner cell joins an edge island and another island touches it only at a corner.
  - questionId: reachability-checkpoint-debug-start
    disposition: exam
    path: reachability
    tests:
      - mark-on-discovery
    checkpoint: islands-without-joins
    note: 'Debugging: pick the call a suggested region count gets wrong because the start is never marked.'

  - questionId: traversal-layer-pop-trace
    disposition: keep
    path: traversal-layers
    skill: trace-queue-layer
    note: 'Defines BFS and the queue. Trace the front after two pops: every node one move away leaves before any node two moves away.'
  - questionId: traversal-layer-freeze-length
    disposition: keep
    path: traversal-layers
    skill: trace-queue-layer
    note: Defines a layer. A round pops the `n` nodes waiting when it began, not the ones it appends.
  - questionId: traversal-distance-one-step
    disposition: keep
    path: traversal-layers
    skill: label-unit-distances
    note: 'Defines distance. A neighbor found from a node labeled 4 gets `4 + 1`.'
  - questionId: traversal-distance-detour
    disposition: keep
    path: traversal-layers
    skill: label-unit-distances
    note: A wall forces a longer route, so the label is 4, not the straight-line 2.
  - questionId: traversal-first-label-stays
    disposition: keep
    path: traversal-layers
    skill: label-unit-distances
    note: A node found again along a same-layer edge keeps its first label and is not appended again.
  - questionId: traversal-stack-first-label
    disposition: keep
    path: traversal-layers
    skill: label-unit-distances
    note: 'Defines a stack and depth-first search. With `pop()`, the first label of `(0, 2)` is 4, not its fewest moves.'
  - questionId: traversal-lock-wheels
    disposition: keep
    path: traversal-layers
    skill: label-unit-distances
    note: 'BFS over generated neighbors: `turns(code)` builds the codes one move away, with 9 and 0 next to each other. The only 3-move route to `"70"` passes the blocked `"90"`, so BFS labels `"70"` 5 by turning the second wheel off 0 and back, not 3 (through the block), 7 (up only) or 4 (a one-move detour).'
  - questionId: traversal-source-zero
    disposition: keep
    path: traversal-layers
    skill: seed-multiple-sources
    note: Defines a source. Every source starts in the queue with label 0.
  - questionId: traversal-nearer-source
    disposition: keep
    path: traversal-layers
    skill: seed-multiple-sources
    note: Tap the source that reaches X first when both start together.
  - questionId: traversal-review-round-count
