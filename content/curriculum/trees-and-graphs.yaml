  - questionId: traversal-review-source-revisit
    disposition: keep
    path: traversal-layers
    skill: seed-multiple-sources
    variant: true
    note: A source found by another source keeps label 0 and is skipped.
  - questionId: traversal-review-separated-sources
    disposition: keep
    path: traversal-layers
    skill: seed-multiple-sources
    variant: true
    note: A wall cuts a column off from every source, so it gets no label.
  - questionId: traversal-exam-meeting-fronts
    disposition: exam
    path: traversal-layers
    tests:
      - trace-queue-layer
      - seed-multiple-sources
    checkpoint: simultaneous-spread
    note: Time two sources spreading toward each other along a row.
  - questionId: traversal-exam-detour-spread
    disposition: exam
    path: traversal-layers
    tests:
      - label-unit-distances
      - seed-multiple-sources
    checkpoint: simultaneous-spread
    note: Find the last cell to activate when a wall forces a detour from the nearer source.
  - questionId: traversal-exam-blocked-completion
    disposition: exam
    path: traversal-layers
    tests:
      - trace-queue-layer
      - seed-multiple-sources
    checkpoint: simultaneous-spread
    note: Return −1 when a walled-off cell never activates, not the last reachable minute.
  - questionId: traversal-exam-layer-counter
    disposition: exam
    path: traversal-layers
    tests:
      - trace-queue-layer
      - label-unit-distances
    checkpoint: simultaneous-spread
    note: A loop that adds a minute per pop records 3 for a node two layers out.
  - questionId: traversal-exam-shared-neighbor
    disposition: exam
    path: traversal-layers
    tests:
      - trace-queue-layer
      - seed-multiple-sources
    checkpoint: simultaneous-spread
    note: 'Two sources start in one queue and share a neighbor: give the pop order.'
  - questionId: traversal-exam-debug-stack
    disposition: exam
    path: traversal-layers
    tests:
      - label-unit-distances
    checkpoint: simultaneous-spread
    note: 'Debugging: pick the graph a suggested solution that uses `pop()` labels with a distance that is too high.'

  - questionId: connectivity-adj-both-lists
    disposition: keep
    path: connectivity
    skill: read-adjacency-list
    note: Names the adjacency list. Tap the neighbor an undirected edge writes into the second list. Its worked example introduces the path.
  - questionId: connectivity-adj-total-entries
    disposition: keep
    path: connectivity
    skill: read-adjacency-list
    note: Count two adjacency entries for each undirected edge.
  - questionId: connectivity-components-restart
    disposition: keep
    path: connectivity
    skill: separate-components
    note: Defines a connected component. Trace where the outer loop restarts and count the starts, including an isolated node.
  - questionId: connectivity-components-isolated
    disposition: keep
    path: connectivity
    skill: separate-components
