id: reachability
title: Reachability
description: Find legal neighbors, mark each discovery, and explore a region of land.
questions:
  - id: reachability-tap-east
    format: tap-cell
    tags:
      - bfs
    workedExample: |-
      Consider `row = [0, 1, 1, 1]`, where 1 is land and 0 is water, with the start at column 1. One
      step right adds one to the column.

      1. The start is column 1, so one step right is column `1 + 1`, which is 2.
      2. `row` has 4 cells, numbered 0 to 3, so column 2 is inside the row.
      3. `row[2]` is 1, so the cell one step right of the start is land, at index 2.
    prompt: In `row`, 1 is land and 0 is water. Starting at the marked cell, tap the land cell one step right.
    code: |
      row = [1, 1, 0]
      start = 0
    sequence:
      kind: array
      name: row
      cells:
        - '1'
        - '1'
        - '0'
    markers:
      - name: start
        at: 0
    correct: 1
    explanation: One step right increases the column by one. Column 1 is in bounds and holds land.
    misses:
      - index: 0
        explanation: This is the starting cell. Moving right increases the column.
      - index: 2
        explanation: This is two columns away and contains water.
  - id: reachability-diagonal-neighbor
    tags:
      - bfs
      - dfs
    workedExample: |-
      Cells are written `(row, column)`. A legal move goes up, down, left or right, so it changes
      exactly one coordinate, by one. Consider `(1, 1)` and `(0, 1)`.

      1. From `(1, 1)` to `(0, 1)` the row goes from 1 to 0, a change of one.
      2. The column is 1 in both cells, so only one coordinate changes.
      3. So `(0, 1)` is one legal move from `(1, 1)`: a single step up.
    prompt: With moves up, down, left and right only, is (2, 2) one step from (1, 1)?
    options:
      - id: valid
        text: It is two moves away
        explanation: The row and column both change. A legal move changes exactly one coordinate by one.
      - id: mistake
        text: It is one move away
        explanation: A diagonal step is not one of the four moves. Reaching (2, 2) from (1, 1) takes a step down
          and then a step right.
    correct: valid
    followUps:
      mistake:
        prompt: Which coordinates change from (1, 1) to (2, 2)?
        options:
          - id: right
            text: Both row and column
          - id: wrong
            text: The row only
        correct: right
        explanation: The row and column both change. A legal move changes exactly one coordinate by one.
  - id: reachability-reject-negative-row
    tags:
      - bfs
      - dfs
    workedExample: |-
      Consider a grid with 2 rows, so `len(grid)` is 2 and the real rows are 0 and 1. A step down
      adds one to the row.

      1. A step down from row 1 gives `r = 2`.
      2. The check `r < len(grid)` asks whether `2 < 2`. That is false.
      3. So the check rejects row 2, which is beyond the bottom, and the walk never reads `grid[2]`.
         Without the check, `grid[2]` would raise an `IndexError`.
    prompt: At row 0, which check stops an upward step from reading Python’s last row?
    options:
      - id: valid
        text: '`0 <= r < len(grid)`'
        explanation: Moving up from row 0 produces −1. Python accepts a negative index and reads from the end
          unless the guard rejects it.
      - id: mistake
        text: '`r < len(grid)`'
        explanation: This catches only the bottom edge. An upward step from row 0 gives −1, which is less than
          2, so it passes and `grid[-1]` reads the last row.
    correct: valid
    followUps:
      mistake:
        prompt: Does row −1 pass the check `r < 2`?
        options:
          - id: right
            text: Yes, −1 is less than 2
          - id: wrong
            text: No, the check requires nonnegative rows
        correct: right
        explanation: Moving up from row 0 produces −1. Python accepts a negative index and reads from the end
          unless the guard rejects it.
  - id: reachability-mark-convergence
    tags:
      - bfs
      - dfs
    workedExample: |-
      A search pops A and finds its neighbor B, which is not in `seen`. The rule is to add a cell to
      `seen` at the moment it joins the queue.

      1. B is not in `seen`, so A appends B to the queue.
      2. B has now been discovered, so A adds B to `seen` in the same step, even though B's turn has
         not come yet.
      3. So `seen` holds B the whole time B waits in the queue. `seen` means discovered, not
         finished.
    prompt: C later finds B beside it, while B is still waiting in the queue. What should C do?
    options:
      - id: valid
        text: Skip B because it is already seen
        explanation: Seen means discovered, including cells still waiting in the queue. B already has a turn
          coming.
      - id: mistake
        text: Queue B because it has not had a turn
        explanation: B has not had its turn, but one is already coming. Queuing it again gives B two turns, so
          its neighbors are checked twice.
    correct: valid
    followUps:
      mistake:
        prompt: Can a cell be in seen before it is popped?
        options:
          - id: right
            text: Yes, once it is queued
          - id: wrong
            text: No, seen only holds finished cells
        correct: right
        explanation: Seen means discovered, including cells still waiting in the queue. B already has a turn
          coming.
  - id: reachability-mark-start
    tags:
      - bfs
      - dfs
    workedExample: |-
      A search pops A and finds its neighbor B, which is not in `seen` yet. Each cell is added to
      `seen` when it is queued.

      1. B is not in `seen`, so A queues B and adds B to `seen` in the same step.
      2. Later, another cell next to B checks whether B is in `seen`. It is, so that cell does not
         queue B again.
      3. So B gets exactly one turn in the queue, because it was marked the moment it was queued.
    prompt: The start A is queued first. When should A be marked?
    options:
      - id: valid
        text: As soon as A is queued
        explanation: The start follows the same rule as every neighbor. A later visit to a neighbor must not
          rediscover A.
      - id: mistake
        text: Never, as A is the start
        explanation: No neighbor queued A, but A can still be found again. Left unmarked, A looks new when B
          checks its neighbors, so B queues A a second time.
    correct: valid
    followUps:
      mistake:
        prompt: If a neighbor can walk back to an unmarked start, what can it do?
        options:
          - id: right
            text: Queue the start a second time
          - id: wrong
            text: Skip it because its turn already ended
        correct: right
        explanation: The start follows the same rule as every neighbor. A later visit to a neighbor must not
          rediscover A.
  - id: reachability-stop-at-water
    tags:
      - bfs
      - dfs
    workedExample: |-
      Consider the one-row grid `[[0, 1, 1, 0, 1]]`, where 1 is land and 0 is water, and search from
      (0, 1). A search steps only onto land, one cell up, down, left or right.

      1. There is no row above or below, so only left and right are possible. Left of (0, 1) is
         (0, 0), which is water, so the search does not step there.
      2. Right of (0, 1) is (0, 2), which is land, so the search reaches it. Right of (0, 2) is
         (0, 3), which is water, so the search stops going right.
      3. (0, 4) is land, but every way to it from (0, 2) passes (0, 3), which is water. So the
         search reaches (0, 1) and (0, 2) only.
    prompt: |-
      In the grid below, which land does a search from (0, 0) reach? Move only in the four cardinal directions.

      ```text
      1101
      0001
      ```
    options:
      - id: valid
        text: The first two cells of the top row
        explanation: The water in column 2 and the water beneath the left pair cut off the right region.
      - id: mistake
        text: All four land cells in the grid
        explanation: A search never steps onto water. (0, 2) is water, and so is the row below the left pair, so
          the land in column 3 is never reached.
    correct: valid
    followUps:
      mistake:
        prompt: Can the top-right land be reached by crossing water?
        options:
          - id: right
            text: No, water stops the walk
          - id: wrong
            text: Yes, if land resumes afterward
        correct: right
        explanation: The water in column 2 and the water beneath the left pair cut off the right region.
  - id: reachability-empty-frontier
    tags:
      - bfs
      - dfs
    workedExample: |-
      Consider the one-row grid `[[0, 1, 0]]`, where 1 is land, with the search starting at (0, 1).
      The frontier starts with just the start, and each pop offers the popped cell's land neighbors
      that are not yet seen.

      1. The search pops (0, 1). That was the only cell in the frontier, so the frontier is now
         empty.
      2. The neighbors of (0, 1) in the grid are (0, 0) and (0, 2), and both are water. So nothing
         joins the frontier.
      3. Nothing is left to pop, so the search ends after one pop. It has explored (0, 1), the only
         land its start can reach.
    prompt: In a larger walk, what does an empty frontier mean when each popped land cell offers all its legal
      neighbors?
    options:
      - id: valid
        text: The current region has been explored
        explanation: Every discovered cell has been processed. Any still-undiscovered land lies outside the
          start’s reachable region.
      - id: mistake
        text: Every patch of land in the grid is explored
        explanation: The frontier only ever holds cells reached from this start. Land with no path to the start
          never enters it, so that land can still be unexplored.
    correct: valid
    followUps:
      mistake:
        prompt: If a patch of land has no path from the start, will it ever enter this frontier?
        options:
          - id: right
            text: No, it requires a new start
          - id: wrong
            text: Yes, when the last cell is popped
        correct: right
        explanation: Every discovered cell has been processed. Any still-undiscovered land lies outside the
          start’s reachable region.
