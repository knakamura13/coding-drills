id: heap-operations-review
title: "Heap operations: review"
description: Fresh inputs for the Heap operations skills, for recall on later days. No worked examples this time.
heading: What does the heap do?

questions:
  - format: tap-cell
    id: sift-up-rest-review
    heading: Where does it stop?
    tags: [heap, python]
    prompt: 6 is pushed onto the heap below and starts at index 7. At which index does it come to rest? Tap it.
    code: |
      from heapq import heappush

      h = [4, 8, 5, 10, 9, 7, 11]
      heappush(h, 6)  # 6 is appended at index 7
      print(h)
    sequence:
      kind: array
      name: h
      cells: [4, 8, 5, 10, 9, 7, 11, 6]
    markers:
      - { name: new, at: 7 }
    correct: 1
    explanation: >-
      Index 7's parent is index 3, holding 10, so 6 swaps up. Index 3's parent is index 1, holding
      8, and 6 is smaller again. Index 1's parent is the root, 4, which is smaller than 6, so the 6
      stops at index 1. The code prints `[4, 6, 5, 8, 9, 7, 11, 10]`.
    misses:
      - index: 0
        explanation: The 6 climbs toward the root but stops below it, because the root, 4, is smaller.
      - index: 2
        explanation: Index 2 is the root's other child, on another branch. From index 7 the path up runs through indices 3 and 1.
      - index: 3
        explanation: >-
          That is one swap. At index 3 the parent is index 1, holding 8, and 6 is smaller, so it
          climbs again.
      - index: 4
        explanation: Index 4 is the sibling of index 3, not on the 6's path to the root.
      - index: 5
        explanation: 'Index 5 is on the other side of the tree. The parent of index 7 is `(7 - 1) // 2 = 3`.'
      - index: 6
        explanation: Index 6 sits next to index 7 in the list, but it is not its parent.
      - index: 7
        explanation: 6 is smaller than its parent, the 10 at index 3, so it cannot stay at the end.

  - format: drag-pointers
    id: sift-up-drag-review
    heading: Place the item and its parent
    tags: [heap, python]
    prompt: >-
      3 is pushed onto the heap below and starts at index 6. Drag `i` to where the 3 sits after
      its first swap, and `p` to the parent it is compared with next.
    code: |
      from heapq import heappush

      h = [2, 5, 4, 8, 6, 9]
      heappush(h, 3)  # 3 is appended at index 6
    sequence: { kind: array, name: h, cells: [2, 5, 4, 8, 6, 9, 3] }
    pointers:
      - name: i
        start: 6
        correct: 2
        explanation: 'The parent of index 6 is `(6 - 1) // 2 = 2`, holding 4. 3 is smaller, so it swaps into index 2.'
        misses:
          - index: 3
            explanation: '`6 // 2 = 3` is the parent rule for a heap numbered from 1. In a list that starts at 0 the parent is `(6 - 1) // 2 = 2`.'
          - index: 5
            explanation: Index 5 is the sibling of index 6. A sift up moves to the parent, never sideways.
          - index: 0
            explanation: One swap moves the 3 up one level, to index 2. The root is the next comparison, not the first stop.
        elsewhere: One swap moves the 3 to its parent, index 2.
      - name: p
        start: 2
        correct: 0
        explanation: >-
          From index 2 the parent is `(2 - 1) // 2 = 0`, the root. It holds 2, which is smaller
          than 3, so the sift stops after this check.
        misses:
          - index: 1
            explanation: '`2 // 2 = 1` is the rule for a heap numbered from 1. Index 1 is the sibling of index 2, and the parent is `(2 - 1) // 2 = 0`.'
          - index: 2
            explanation: Index 2 is where the 3 now sits. Its parent is one level up.
        elsewhere: 'The parent of index 2 is `(2 - 1) // 2 = 0`.'

  - id: pop-result-review
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heappop

      h = [3, 5, 4, 9, 6, 7]
      heappop(h)
      print(h)
      ```

      What does this print?
    options:
      - id: sifted
        text: "`[4, 5, 7, 9, 6]`"
        explanation: >-
          The pop removes 3 and moves the last item, 7, to the root. Its children are 5 and 4, so
          it swaps with the smaller, 4, and lands on index 2, which has no children.
      - id: left-child
        text: "`[5, 7, 4, 9, 6]`"
        explanation: >-
          This always swaps with the left child. The 7 had children 5 and 4, and with 5 on top
          the root would sit above a smaller 4.
      - id: shifted
        text: "`[5, 4, 9, 6, 7]`"
        explanation: >-
          This removes the root the way `list.pop(0)` does and shifts the rest left. `heappop`
          does not shift the list, which would cost O(n) and scramble parents and children.
      - id: unsifted
        text: "`[7, 5, 4, 9, 6]`"
        explanation: >-
          The 7 does move to the root first, but it is larger than both of its children, so the
          pop is not finished until it sifts down.
    correct: sifted
    followUps:
      left-child:
        prompt: After the pop, 7 sits at the root with children 5 and 4. Which child must it swap with?
        options:
          - id: smaller
            text: 4, the smaller, so the new root is no larger than either child
          - id: left
            text: 5, the left child, which is always checked first
          - id: either
            text: Either one, since both keep the heap valid
        correct: smaller
        explanation: >-
          Whichever child moves up becomes the parent of the other. Only the smaller of the two
          can sit above both, so a sift down always picks the smaller child.
      shifted:
        prompt: What does `heappop` do with the last item of the list?
        options:
          - id: to-root
            text: Moves it to index 0 and sifts it down
          - id: stays
            text: Leaves it at the end while the other items shift left
          - id: deletes
            text: Deletes it along with the root
        correct: to-root
        explanation: >-
          Taking the last item keeps the list contiguous in O(1), and the sift repairs one path in
          O(log n). Shifting every item left would move children under the wrong parents.
      unsifted:
        prompt: The 7 has just been moved to the root of `[7, 5, 4, 9, 6]`. Is the list a heap yet?
        options:
          - id: not-yet
            text: No, 7 is larger than its children, so it must sift down first
          - id: done
            text: Yes, moving the last item to the root finishes the pop
          - id: next-pop
            text: Not until the next `heappop` repairs it
        correct: not-yet
        explanation: >-
          Each `heappop` leaves a valid heap behind. Moving the last item up only fills the hole at
          the root, and the sift in the same call restores the rule before it returns.

  - id: heapify-result-review
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heapify

      x = [9, 5, 8, 2, 4]
      heapify(x)
      print(x)
      ```

      What does this print?
    options:
      - id: bottom-up
        text: "`[2, 4, 8, 5, 9]`"
        explanation: >-
          The last parent is index 1: the 5 swaps with its smaller child, 2. Then the root: the 9
          swaps with the 2, and then with its smaller new child, 4. The 8 never moves.
      - id: pushed
        text: "`[2, 4, 8, 9, 5]`"
        explanation: >-
          That is the heap five `heappush` calls build from 9, 5, 8, 2, 4. It is valid too, but
          `heapify` sifts parents down instead and lands on a different list.
      - id: sorted
        text: "`[2, 4, 5, 8, 9]`"
        explanation: >-
          That is sorted order. `heapify` only makes each parent no larger than its children, so it
          leaves the 8 where it is.
      - id: root-stops
        text: "`[2, 9, 8, 5, 4]`"
        explanation: >-
          This stops the root's sift after one swap. At index 1 the 9 still has smaller children, 5
          and 4.
    correct: bottom-up
    followUps:
      pushed:
        prompt: Pushing 9, 5, 8, 2, 4 one at a time builds `[2, 4, 8, 9, 5]`. Why does `heapify` end with a different list?
        options:
          - id: different-paths
            text: It sifts parents down from the last one, so items travel along different paths
          - id: one-invalid
            text: One of the two lists is not a valid heap
          - id: sorts-first
            text: "`heapify` sorts part of the list before it sifts"
        correct: different-paths
        explanation: >-
          A push sifts each new item up from the end. `heapify` starts with every item in place
          and sifts parents down. Both satisfy the heap rule, and many lists do, so the two builds
          can disagree on everything except the root.
      sorted:
        prompt: In `[2, 4, 8, 5, 9]` the 8 at index 2 comes before the 5 at index 3. Does that break the heap rule?
        options:
          - id: not-its-child
            text: No, 5 is a child of index 1, not of index 2
          - id: next-item
            text: Yes, every item must be no larger than the next one
          - id: third-smallest
            text: Yes, index 2 must hold the third smallest
        correct: not-its-child
        explanation: >-
          The rule compares each parent with its own children, at `2*i + 1` and `2*i + 2`. Index
          2's children would be at 5 and 6, past the end, so the 8 has nothing to be checked
          against.
      root-stops:
        prompt: The 9 has swapped with the 2 and now sits at index 1, with children 5 and 4. What happens next?
        options:
          - id: swaps-again
            text: It swaps again, with the 4, the smaller child
          - id: one-swap
            text: Nothing, since each parent gets one swap
          - id: left-child
            text: It swaps with the 5, the left child
        correct: swaps-again
        explanation: >-
          A sift keeps going until no child is smaller. The 9 is larger than both, and it trades
          places with the 4 so the parent ends up no larger than either child.

  - format: tap-cell
    id: last-parent-tap-review
    heading: Where does heapify start?
    tags: [heap, python]
    prompt: '`heapify` sifts parents down, from the last parent to the root. Which index does it sift first? Tap it.'
    code: |
      from heapq import heapify

      x = [14, 11, 6, 13, 2, 10, 8, 5]
      heapify(x)
    sequence:
      kind: array
      name: x
      cells: [14, 11, 6, 13, 2, 10, 8, 5]
    correct: 3
    explanation: >-
      The last parent is `len(x) // 2 - 1 = 3`. Its child is index 7, the last item. Every index
      after 3 is a leaf, with no children to compare.
    misses:
      - index: 0
        explanation: >-
          The root is sifted last. Going from the bottom up means both subtrees under a parent are
          heaps by the time it sifts.
      - index: 1
        explanation: Index 1 is a parent, but not the last one. Index 3 still has a child, index 7.
      - index: 2
        explanation: Index 2 has children at 5 and 6, but index 3 comes after it and also has a child, index 7.
      - index: 4
        explanation: '`len(x) // 2 = 4` is one too far. Index 4 would have children at 9 and 10, past the end, so it is a leaf.'
      - index: 5
        explanation: Index 5 would have children at 11 and 12, past the end. A leaf has nothing to sift.
      - index: 6
        explanation: Index 6 would have children at 13 and 14, past the end. A leaf has nothing to sift.
      - index: 7
        explanation: 'Index 7 is the last item, but it is a leaf. `heapify` starts at the last item with a child, `8 // 2 - 1 = 3`.'

  - id: heapify-per-arrival-review
    heading: What is the problem?
    tags: [heap, complexity]
    prompt: >-
      Up to `n` tasks wait at once. Each new arrival must be added so the worker's next serve finds
      the smallest. A teammate proposes appending each arrival to the list and calling
      `heapify(waiting)` again, because `heapify` is O(n) while `n` pushes are O(n log n). What is
      the problem?
    options:
      - id: per-arrival
        text: Each `heapify` visits every parent again, O(n) per arrival, where a push is O(log n)
        explanation: >-
          The O(n) bound is for one build from scratch. Calling it after every arrival pays that
          again each time, while `heappush` moves only the new item along one path.
      - id: nothing
        text: Nothing, since `heapify` is the cheaper build, so it wins here too
        explanation: >-
          `heapify` wins when all the items are there before the first serve. Here the heap
          already exists, and only one item is new.
      - id: raises
        text: "`heapify` raises an error on a list that is already a heap"
        explanation: >-
          `heapify` accepts any list, including one that is already a heap. It never checks first,
          which is why it costs O(n) every time it is called.
      - id: no-pop
        text: "`heappop` cannot be used on a list built by `heapify`"
        explanation: >-
          However it was built, a `heapq` heap is just a list whose items follow the heap rule.
          Every `heapq` function works on it.
    correct: per-arrival
    followUps:
      nothing:
        prompt: With `n` tasks waiting, what does adding one more cost each way?
        options:
          - id: n-vs-log
            text: "`heapify`: O(n), visiting every parent. `heappush`: O(log n), one path"
          - id: both-log
            text: Both O(log n), since only one item is new
          - id: heapify-constant
            text: "`heapify`: O(1), since the list is already nearly a heap"
        correct: n-vs-log
        explanation: >-
          `heapify` does not know which item is new, so it checks all `n // 2` parents. A push
          starts at the new item and climbs one path. Over `n` arrivals that is O(n²) against
          O(n log n).
      raises:
        prompt: What does `heapify` do with a list that is a heap except for one new item at the end?
        options:
          - id: full-loop
            text: Runs its whole loop over the parents and moves the new item into place
          - id: value-error
            text: Raises `ValueError`, since the list is already a heap
          - id: returns
            text: Returns at once without checking anything
        correct: full-loop
        explanation: >-
          `heapify` makes no assumption about its input. It sifts every parent, most of which do not
          move, and that loop is the O(n) cost.
      no-pop:
        prompt: After `heapify(x)`, which `heapq` functions can work on `x`?
        options:
          - id: any
            text: Any of them, since a heap is a plain list in heap order
          - id: push-only
            text: Only `heappush`, since `heapify` makes a different kind of heap
          - id: none
            text: None, until it is wrapped in a heap object
        correct: any
        explanation: >-
          `heapq` stores nothing besides the list. `heapify`, `heappush` and `heappop` all read and
          keep the same layout, so they can be mixed freely.

  - id: tie-order-review
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heapify, heappop

      jobs = [(2, "lint", 4), (2, "build", 7), (3, "audit", 1), (2, "build", 3)]
      heapify(jobs)
      print(heappop(jobs))
      ```

      What does this print?
    options:
      - id: third-field
        text: "`(2, 'build', 3)`"
        explanation: >-
          Three entries share priority 2. Of those, two share the name `'build'`, which comes before
          `'lint'`, so the third field decides between them, and 3 is smaller than 7.
      - id: first-build
        text: "`(2, 'build', 7)`"
        explanation: >-
          This is the first `'build'` entry in the list, but list order does not count. The two
          `'build'` entries tie on two fields, so the third field decides.
      - id: audit
        text: "`(3, 'audit', 1)`"
        explanation: >-
          It has the smallest name and the smallest last field, but tuples compare from the left,
          and its priority, 3, loses to 2.
      - id: lint
        text: "`(2, 'lint', 4)`"
        explanation: >-
          It is first in the list, but list position does not survive `heapify`. On tied
          priorities the names decide, and `'build'` comes before `'lint'`.
    correct: third-field
    followUps:
      first-build:
        prompt: "`(2, 'build', 7)` and `(2, 'build', 3)` tie on two fields. What decides between them?"
        options:
          - id: third
            text: The third field, since 3 < 7
          - id: list-order
            text: Their order in the list
          - id: either
            text: Nothing, so `heapq` may return either
        correct: third
        explanation: >-
          A tie moves the comparison one field to the right. After the priority and the name, the
          numbers differ, so the entry with 3 is smaller.
      audit:
        prompt: "`(3, 'audit', 1)` has the smallest name and the smallest last field. Why does it not come out first?"
        options:
          - id: first-field
            text: Its first field, 3, is larger, and the first field is compared first
          - id: not-first
            text: Because it was not first in the list
          - id: skips-strings
            text: Because `heapq` skips string fields
        correct: first-field
        explanation: >-
          Tuples are compared from the left, and the first difference settles it. Every entry with
          priority 2 is smaller, whatever its name or last field.
      lint:
        prompt: Why does being first in `jobs` not make `(2, 'lint', 4)` the answer?
        options:
          - id: smallest-to-root
            text: "`heapify` moves the smallest entry to index 0, and `'build' < 'lint'`"
          - id: keeps-first
            text: It is the answer, since `heapify` keeps the first entry at the root
          - id: longer
            text: "`'lint'` is larger because it has more letters"
        correct: smallest-to-root
        explanation: >-
          `heapify` rearranges the list until the root is the smallest entry. Strings compare
          letter by letter, so `'b'` before `'l'` settles it. `'lint'` and `'build'` are not
          compared by length.

  - id: payload-reached-review
    heading: Which push raises?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heappush

      h = []
      heappush(h, (1, "a", {"x": 1}))
      heappush(h, SECOND)
      ```

      Which entry in place of `SECOND` makes the second push raise `TypeError`?
    options:
      - id: name-differs
        text: '`(1, "b", {"x": 2})`'
        explanation: >-
          The priorities tie, but the names differ, so the comparison ends at `"b"` against `"a"`
          and the dicts are never compared.
      - id: priority-differs
        text: '`(2, "a", {"x": 2})`'
        explanation: The priorities already differ, so neither the names nor the dicts are compared.
      - id: dicts-differ
        text: '`(1, "a", {"x": 2})`'
        explanation: >-
          The priorities and the names tie, so Python orders the next pair, two different dicts.
          Dicts have no `<`, and the push raises `TypeError`.
      - id: dicts-equal
        text: '`(1, "a", {"x": 1})`'
        explanation: >-
          The dicts here are equal. Tuple comparison skips every pair that is equal, so it never
          has to order the dicts, and the push succeeds.
    correct: dicts-differ
    followUps:
      name-differs:
        prompt: 'Comparing `(1, "b", {...})` with `(1, "a", {...})`, where does Python stop?'
        options:
          - id: at-names
            text: At the names, since `"b"` and `"a"` differ
          - id: at-dicts
            text: At the dicts, since the payload is always compared
          - id: at-priority
            text: At the priorities, since they are equal
        correct: at-names
        explanation: >-
          Python stops at the first pair that is not equal and orders that pair. The names are the
          first difference, so the dicts play no part.
      priority-differs:
        prompt: 'Comparing `(2, "a", {"x": 2})` with `(1, "a", {"x": 1})`, which fields are compared?'
        options:
          - id: priorities-only
            text: Only the priorities, which already differ
          - id: all-three
            text: All three, from left to right
          - id: dicts-first
            text: The dicts first, since they hold the data
        correct: priorities-only
        explanation: >-
          The first pair, 2 and 1, is unequal, so it decides the result at once. Nothing to the
          right of it is looked at.
      dicts-equal:
        prompt: 'Comparing `(1, "a", {"x": 1})` with an equal tuple, what does Python do with the two dicts?'
        options:
          - id: equality-only
            text: Checks them with `==`, finds them equal, and never orders them
          - id: orders-them
            text: Orders them with `<`, which raises `TypeError`
          - id: by-id
            text: Compares their `id()` values
        correct: equality-only
        explanation: >-
          Tuple comparison looks for the first pair that is not equal and orders only that pair.
          When every pair is equal, `<` returns `False` without ordering anything.

  - id: max-first-ties-review
    heading: Which entry works?
    tags: [heap, python]
    prompt: |-
      Tickets carry a number, `priority`, and a higher number is more urgent. The most urgent
      ticket must pop first, ties in the order the tickets were added, and the `Ticket` class
      defines no `<`.

      ```python
      import itertools
      from heapq import heappush

      seq = itertools.count()

      def add(h, t):
          heappush(h, ENTRY)
      ```

      Which `ENTRY` does that?
    options:
      - id: negate-count
        text: "`(-t.priority, next(seq), t)`"
        explanation: >-
          Negating turns the largest priority into the smallest number, which `heapq` pops first.
          The counter breaks ties in the order of the adds and keeps every comparison away from
          the tickets.
      - id: no-negate
        text: "`(t.priority, next(seq), t)`"
        explanation: >-
          `heapq` pops the smallest entry, so with the priority as stored the least urgent
          ticket comes out first.
      - id: negate-both
        text: "`(-t.priority, -next(seq), t)`"
        explanation: >-
          The priority part is right, but negating the counter makes each later add smaller, which
          reverses the order among ties.
      - id: no-counter
        text: "`(-t.priority, t)`"
        explanation: >-
          The urgent ticket comes first, but two tickets with equal priority make Python compare
          the tickets themselves, and `Ticket` has no `<`.
    correct: negate-count
    followUps:
      no-negate:
        prompt: '`heapq` pops the smallest entry. With `(t.priority, ...)`, which ticket comes out first?'
        options:
          - id: least-urgent
            text: The least urgent, the one with the lowest number
          - id: most-urgent
            text: The most urgent, since a heap favors large numbers
          - id: oldest
            text: The oldest, since the counter decides
        correct: least-urgent
        explanation: >-
          A `heapq` heap is a min-heap. To get the largest number out first, store a value that
          orders the other way, such as `-t.priority`.
      negate-both:
        prompt: Tickets A and then B tie on priority and get `-0` and `-1` from `-next(seq)`. Which pops first?
        options:
          - id: b-first
            text: B, since -1 < 0, so ties come out newest first
          - id: a-first
            text: A, since it was added first
          - id: either
            text: Either one, since negated counters can tie
        correct: b-first
        explanation: >-
          The heap pops the smaller middle field, and negation reverses the counter's order. To pop
          ties oldest first, leave the counter as it is.
      no-counter:
        prompt: Two tickets share priority 5. What happens when their entries `(-5, t)` are compared?
        options:
          - id: type-error
            text: Python compares the two tickets next, and `Ticket` has no `<`, so it raises `TypeError`
          - id: first-wins
            text: The ticket added first counts as smaller
          - id: equal
            text: They count as equal, and either one pops
        correct: type-error
        explanation: >-
          A tie on the first field moves the comparison to the second, which is the ticket itself.
          A middle field that never repeats stops the comparison before it gets there.

  - id: counter-per-call-review
    heading: What happens?
    tags: [heap, python]
    prompt: |-
      ```python
      import itertools
      from heapq import heappush

      def add(h, priority, task):
          seq = itertools.count()
          heappush(h, (priority, next(seq), task))
      ```

      The `task` objects define no `<`. Two tasks with priority 2 are added to the same heap. What
      happens?
    options:
      - id: reset
        text: "`TypeError`: each call makes a new counter, so both entries get 0"
        explanation: >-
          `seq` is created inside `add`, so every call starts a fresh counter at 0. Both entries
          are `(2, 0, task)`, and the comparison reaches the two tasks.
      - id: fifo
        text: Nothing goes wrong, and ties pop in the order they were added
        explanation: That is what a counter does when it lives as long as the heap. This one lives for a single call.
      - id: identity
        text: Nothing goes wrong, since Python orders two distinct objects by identity
        explanation: >-
          Python 3 does not fall back to identity for `<`. Two objects whose class defines no
          `<` cannot be ordered at all.
    correct: reset
    followUps:
      fifo:
        prompt: How many times does `itertools.count()` run when `add` is called twice?
        options:
          - id: twice
            text: Twice, once per call, and each new counter starts at 0
          - id: once
            text: Once, the first time `add` runs
          - id: never
            text: Never, since the line only defines it
        correct: twice
        explanation: >-
          A local variable is made again on every call. To keep counting across adds, create
          `seq` once, next to the heap, and draw from it inside `add`.
