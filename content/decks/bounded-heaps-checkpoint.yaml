id: bounded-heaps-checkpoint
title: "Bounded heaps: checkpoint"
description: Keep the top K of a stream, merge sorted runs lazily, or keep a running median in two heaps, on new inputs.
heading: What does the capped heap do?

questions:
  - format: step-trace
    id: checkpoint-pushpop-trace
    heading: Follow the evictions
    tags: [heap, python]
    prompt: >-
      The heap starts with the first 3 scores. Each later score goes through `heappushpop(h, x)`,
      which pushes `x` and then pops the root, in one call, and returns the score it pops. Unlike
      `heapreplace`, it pushes first. `out` marks the score evicted most recently, and it starts on
      index 0 before anything is evicted. Predict each step.
    code: |
      from heapq import heapify, heappushpop

      scores = [12, 5, 9, 3, 14, 10, 16, 8]
      k = 3
      h = scores[:k]
      heapify(h)
      for x in scores[k:]:
          heappushpop(h, x)
      print(h[0])
    sequence:
      kind: array
      name: scores
      cells: [12, 5, 9, 3, 14, 10, 16, 8]
    start:
      - { name: out, at: 0 }
    steps:
      - line: 8
        ask: When 3 arrives, which score is evicted? Move `out` to it.
        pointer: out
        correct: 3
        explanation: >-
          The heap holds 12, 5 and 9, so its root is 5. The 3 is smaller than the root, so
          `heappushpop` hands the 3 straight back and the heap does not change.
        misses:
          - index: 1
            explanation: >-
              5 is the root, but `heappushpop` pushes before it pops. The 3 is smaller than 5, so
              the 3 is what comes back out.
          - index: 0
            explanation: 12 arrived first, but the heap evicts its smallest score, not its oldest.
          - index: 2
            explanation: '9 is neither the arrival nor the root. The smaller of 3 and the root 5 leaves.'
        elsewhere: The smaller of the arrival, 3, and the root, 5, is evicted. That is the 3.
      - line: 8
        ask: When 14 arrives, which score is evicted?
        pointer: out
        correct: 1
        explanation: The 14 beats the root, 5, so the 5 is evicted and the heap holds 9, 12 and 14.
        misses:
          - index: 3
            explanation: The 3 never entered the heap. It was evicted in the step before.
          - index: 2
            explanation: '9 is the second smallest kept score. Only the root, 5, leaves.'
          - index: 4
            explanation: '14 is larger than the root, 5, so it stays and the 5 leaves.'
        elsewhere: The root is 5 and the arrival is 14. The smaller one, 5, is evicted.
      - line: 8
        ask: When 10 arrives, which score is evicted?
        pointer: out
        correct: 2
        explanation: The heap holds 9, 12 and 14. The 10 beats the root, 9, so the 9 leaves.
        misses:
          - index: 5
            explanation: '10 is larger than the root, 9, so the 10 stays and the 9 leaves.'
          - index: 1
            explanation: The 5 left in the step before. The root is now 9.
          - index: 0
            explanation: '12 is above the root, 9. Only the smaller of the root and the arrival leaves.'
        elsewhere: The heap holds 9, 12 and 14, and 10 arrives. The 9 is evicted.
      - line: 9
        ask: 16 and then 8 arrive. What does `print(h[0])` show?
        options:
          - id: twelve
            text: '12'
            explanation: >-
              16 evicts the root, 10, and 8 is smaller than the new root, 12, so it is evicted at
              once. The heap ends with 12, 14 and 16, and `h[0]` is the 3rd largest score, 12.
          - id: sixteen
            text: '16'
            explanation: '16 is the largest score, but `h[0]` is the root of a min-heap, the smallest kept score.'
          - id: ten
            text: '10'
            explanation: '10 was the root when 16 arrived. 16 is larger, so the 10 is evicted.'
          - id: eight
            text: '8'
            explanation: >-
              `heappushpop` pushes the 8 and pops the smallest, which is the 8 itself. It never
              enters the heap.
        correct: twelve


  - id: checkpoint-closest-names
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heappush, heappop

      def closest(points, k):
          h = []
          for name, d in points:
              heappush(h, (-d, name))
              if len(h) > k:
                  heappop(h)
          return sorted(name for _, name in h)

      pts = [("a", 5), ("b", 2), ("c", 8), ("d", 1), ("e", 6)]
      print(closest(pts, 2))
      ```

      What does it print?
    options:
      - id: nearest
        text: "`['b', 'd']`"
        explanation: >-
          The entries hold negated distances, so the root is the farthest point kept, and every pop
          evicts it. The two nearest points, `d` at 1 and `b` at 2, remain, and `sorted` orders
          their names.
      - id: farthest
        text: "`['c', 'e']`"
        explanation: Check what the minus sign does to which entry is the root.
      - id: first-two
        text: "`['a', 'b']`"
        explanation: Check whether a pop removes the oldest entry.
      - id: three-kept
        text: "`['b', 'd', 'e']`"
        explanation: Check how many entries are left after a pop.
    correct: nearest
    followUps:
      farthest:
        prompt: The heap holds `(-5, 'a')`, `(-2, 'b')` and `(-8, 'c')`. Which entry does `heappop` remove?
        options:
          - id: c-farthest
            text: "`(-8, 'c')`, the farthest point"
          - id: b-nearest
            text: "`(-2, 'b')`, the nearest point"
          - id: a-first
            text: "`(-5, 'a')`, the first pushed"
        correct: c-farthest
        explanation: >-
          `-8` is the smallest first field, so it is the root. Negating the distances puts the
          farthest point at the root, where the pop finds it, so the nearest points stay.
      first-two:
        prompt: What decides which entry the pop removes?
        options:
          - id: root
            text: The smallest tuple, here the most negative distance
          - id: age
            text: The order the points were pushed in
          - id: name
            text: The name, in alphabetical order
        correct: root
        explanation: >-
          `heappop` always takes the smallest tuple. The first field differs for every point
          here, so the names are never compared and the push order plays no part.
      three-kept:
        prompt: How many entries does `h` hold at the end of each pass, once it has filled?
        options:
          - id: k-entries
            text: '`k`, here 2'
          - id: k-plus-one
            text: '`k + 1`, here 3'
          - id: all
            text: All the points seen so far
        correct: k-entries
        explanation: >-
          The push can bring the heap to 3 for a moment, and `len(h) > 2` then pops one, so every
          pass ends with 2 entries.


  - id: checkpoint-debug-kth-read
    heading: Which call does it fail on?
    tags: [heap, python]
    prompt: |-
      A suggested `kth_largest` should return the `k`th largest value of `nums`, the same value as
      `sorted(nums)[-k]`. One detail is slightly off:

      ```python
      from heapq import heappush, heappop

      def kth_largest(nums, k):
          h = []
          for x in nums:
              heappush(h, x)
              if len(h) > k:
                  heappop(h)
          return h[-1]
      ```

      Which call returns a wrong answer?
    options:
      - id: distinct-kept
        text: '`kth_largest([6, 1, 5, 3], 2)`'
        explanation: >-
          The loop keeps the 2 largest, and `h` ends as `[5, 6]`. The root, 5, is the 2nd largest,
          but `h[-1]` is 6, so the call returns 6. The last cell of a heap is a leaf, not the
          smallest kept value. Reading the root, `h[0]`, gives the `k`th largest.
      - id: one-kept
        text: '`kth_largest([8, 2, 7], 1)`'
        explanation: >-
          With `k = 1` the heap holds a single value, 8, so `h[-1]` and the root are the same cell.
          The call returns 8, which is right.
      - id: equal-pair
        text: '`kth_largest([2, 7, 7], 2)`'
        explanation: >-
          The heap keeps `[7, 7]`. `h[-1]` is not the root's cell, but it holds the same value, so
          the call returns 7, which is right.
      - id: all-same
        text: '`kth_largest([5, 5, 1, 5], 3)`'
        explanation: >-
          The heap keeps three 5s, so every cell holds the right answer, and the call returns 5.
    correct: distinct-kept
    followUps:
      one-kept:
        prompt: With `k = 1`, how many values does `h` hold when the loop ends?
        options:
          - id: one
            text: One, so `h[-1]` is the root
          - id: two
            text: Two, so `h[-1]` is the larger one
          - id: all
            text: All three, so `h[-1]` is the last one pushed
        correct: one
        explanation: >-
          The pop runs whenever the heap holds more than 1, so it ends with the single largest
          value. In a one-item list the first and last cells are the same, so the bug cannot show.
      equal-pair:
        prompt: '`h` ends as `[7, 7]`. Can reading `h[-1]` instead of `h[0]` change the answer?'
        options:
          - id: no
            text: No, both cells hold 7
          - id: yes
            text: Yes, `h[-1]` is the value pushed last
          - id: error
            text: Yes, `h[-1]` raises on a heap
        correct: no
        explanation: >-
          The wrong cell gives the right answer whenever it holds the same value as the root. The
          bug shows only when the kept values differ, as in `[5, 6]`.
      all-same:
        prompt: The heap ends holding three 5s. What does `h[-1]` return?
        options:
          - id: five
            text: 5, the right answer, since every cell holds 5
          - id: one
            text: 1, the smallest value pushed
          - id: none
            text: Nothing, since the last cell is a leaf
        correct: five
        explanation: >-
          The 1 was popped when the 4th value arrived. With every kept value equal, any cell of `h`
          gives the `k`th largest.

  - id: checkpoint-frequent-tie
    heading: What does this print?
    tags: [heap, hash-map, python]
    prompt: |-
      Python compares tuples item by item from the left, and moves to the next item only on a tie.

      ```python
      from heapq import heappush, heappop

      def top_k(nums, k):
          counts = {}
          for x in nums:
              if x in counts:
                  counts[x] += 1
              else:
                  counts[x] = 1
          h = []
          for x, c in counts.items():
              heappush(h, (c, x))
              if len(h) > k:
                  heappop(h)
          return sorted(x for c, x in h)

      print(top_k([3, 5, 8, 3, 1, 5, 3, 8, 1], 2))
      ```

      What does it print?
    options:
      - id: largest-tied
        text: '`[3, 8]`'
        explanation: >-
          3 appears 3 times, and 5, 8 and 1 twice each. The tied entries `(2, 5)`, `(2, 8)` and
          `(2, 1)` compare their values, so each pop takes the one with the smaller value. `(2, 5)`
          and then `(2, 1)` are evicted, and `(2, 8)` stays beside `(3, 3)`.
      - id: first-tied
        text: '`[3, 5]`'
        explanation: Check what decides between two entries with the same count.
      - id: smallest-tied
        text: '`[1, 3]`'
        explanation: Check which of two tied entries is the smaller tuple.
      - id: by-value
        text: '`[5, 8]`'
        explanation: Check which item of each entry is compared first.
    correct: largest-tied
    followUps:
      first-tied:
        prompt: 'The heap holds `(3, 3)` and `(2, 5)`, and `(2, 8)` is pushed. Which entry does the pop remove?'
        options:
          - id: five
            text: '`(2, 5)`, since the counts tie and 5 is less than 8'
          - id: eight
            text: '`(2, 8)`, since it arrived last'
          - id: either
            text: Either of the two, since their counts tie
        correct: five
        explanation: >-
          A tie on the count moves the comparison to the value, so `(2, 5) < (2, 8)`. Push order
          never decides, so 5 leaves although it was counted first.
      smallest-tied:
        prompt: 'Which is smaller, `(2, 1)` or `(2, 8)`?'
        options:
          - id: one
            text: '`(2, 1)`, so the pop removes it and 1 leaves'
          - id: eight
            text: '`(2, 8)`, so the pop removes it and 8 leaves'
          - id: neither
            text: Neither, so the heap keeps both
        correct: one
        explanation: >-
          The counts tie, so 1 and 8 decide, and `(2, 1)` is smaller. A min-heap pops the smaller
          entry, so among tied counts the largest value is the one that stays.
      by-value:
        prompt: Which item of `(c, x)` decides the order first?
        options:
          - id: count
            text: The count `c`, so the least frequent value is at the root
          - id: value
            text: The value `x`, so the smallest value is at the root
          - id: pushed
            text: Neither, the entry pushed first is at the root
        correct: count
        explanation: >-
          The count is the first item, so it is compared first, and the value is reached only when
          two counts tie. Keeping the two largest values, 5 and 8, would need entries ordered by
          value.

  - id: checkpoint-refill-line
    heading: Which line completes it?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heapify, heappop, heappush

      def merge(runs):
          h = [(r[0], i, 0) for i, r in enumerate(runs) if r]
          heapify(h)
          out = []
          while h:
              x, i, j = heappop(h)
              out.append(x)
              # REFILL
          return out
      ```

      Which `REFILL` makes `merge([[2, 9, 11], [4, 5], [1, 7]])` return all seven values in order,
      with at most one entry per run in the heap?
    options:
      - id: same-run
        text: '`if j + 1 < len(runs[i]): heappush(h, (runs[i][j + 1], i, j + 1))`'
        explanation: >-
          The popped run is the only one without an entry, so its next value goes in, with its
          index in the run moved on by one. An exhausted run pushes nothing and drops out. The result is
          `[1, 2, 4, 5, 7, 9, 11]`, and the heap never holds more than 3 entries.
      - id: stale-index
        text: '`if j + 1 < len(runs[i]): heappush(h, (runs[i][j + 1], i, j))`'
        explanation: Check which index the pushed entry records.
      - id: every-run
        text: Push `(runs[r][j + 1], r, j + 1)` for every run `r` that is long enough
        explanation: Check how many entries each run has after the 1 pops.
      - id: guard-on-heap
        text: '`if h and j + 1 < len(runs[i]): heappush(h, (runs[i][j + 1], i, j + 1))`'
        explanation: Check the pass that empties the heap.
    correct: same-run
    followUps:
      stale-index:
        prompt: 'The pop returns `(5, 1, 0)`, an entry for run 1''s second value that still records index 0. What gets pushed?'
        options:
          - id: same-again
            text: '`(5, 1, 0)` again, so the merge appends 5 forever'
          - id: next
            text: The next value, since the value item moved on
          - id: nothing
            text: Nothing, since run 1 is finished
        correct: same-again
        explanation: >-
          The index never advances, so `runs[1][0 + 1]` is read again and again. `out` grows to
          1, 2, 4 and then 5 over and over, and the call never returns.
      every-run:
        prompt: After the 1 pops, this pushes a value from every run. What follows?
        options:
          - id: duplicates
            text: Values repeat and the heap grows
          - id: faster
            text: The merge finishes sooner
          - id: same
            text: Nothing changes
        correct: duplicates
        explanation: >-
          Only the popped run lost its entry. Runs 0 and 1 still have their fronts waiting, so each
          gets a second entry. The call returns 21 values: 5, 7 and 9 three times each, and 11
          nine times.
      guard-on-heap:
        prompt: The pop takes the last entry and leaves `h` empty, but its run still has values. What does `if h and ...` do?
        options:
          - id: drops-tail
            text: It skips the push, the loop ends, and the run's last values are lost
          - id: pushes
            text: It pushes as usual, since the run still has values
          - id: raises
            text: It raises `IndexError` on the empty heap
        correct: drops-tail
        explanation: >-
          `h` is empty and counts as false, so the push is skipped and `while h` ends. Here run 0's
          11 is lost, and the result is `[1, 2, 4, 5, 7, 9]`.

  - format: tap-cell
    id: checkpoint-next-push-tap
    heading: Which value is pushed?
    tags: [heap, python]
    prompt: >-
      The cells lay out `runs[0]`, `runs[1]` and `runs[2]` side by side (indices 0 to 2, 3 to 4,
      and 5 to 7). The runs are merged with a heap of `(value, run, index)` entries, where `index`
      is the value's index in its run. The heap starts with each run's front, and the merge prints
      each value it pops. It has printed 1, 2 and 3. Which value does it push right after it prints
      the 3? Tap it.
    code: |
      from heapq import heapify

      runs = [[3, 6, 7], [1, 9], [2, 4, 5]]
      h = [(r[0], i, 0) for i, r in enumerate(runs)]
      heapify(h)
    sequence:
      kind: array
      cells: [3, 6, 7, 1, 9, 2, 4, 5]
    correct: 1
    explanation: >-
      The 3 was run 0's entry, so run 0 is the one left without a value in the heap. Its next value
      is the 6. The heap then holds 4, 6 and 9, one per run.
    misses:
      - index: 6
        explanation: >-
          4 is the next value to be printed, but it is already in the heap. Run 2 pushed it when
          the 2 left.
      - index: 4
        explanation: The 9 was pushed when the 1 left. Run 1 still has it in the heap.
      - index: 7
        explanation: '5 is behind the 4 in run 2. It is pushed only when the 4 is printed.'
      - index: 2
        explanation: '7 is two places into run 0. The 6 comes before it.'
      - index: 0
        explanation: The 3 is the value just popped. The push brings in the value after it.
      - index: 3
        explanation: The 1 was printed first. Its pop pushed the 9.
      - index: 5
        explanation: The 2 was printed second. Its pop pushed the 4.

  - format: tap-cell
    id: checkpoint-tied-fronts-tap
    heading: Which 4 comes out last?
    tags: [heap, python]
    prompt: >-
      The cells lay out `runs[0]`, `runs[1]` and `runs[2]` side by side (indices 0 to 1, 2 to 3,
      and 4 to 5). The runs are merged with a heap of `(value, run, index)` entries, where `index`
      is the value's index in its run. The heap starts with each run's front, and the merge prints
      each value it pops. Three of the values are 4. Which 4 is printed last? Tap it.
    code: |
      from heapq import heapify

      runs = [[4, 7], [2, 4], [4, 9]]
      h = [(r[0], i, 0) for i, r in enumerate(runs)]
      heapify(h)
    sequence:
      kind: array
      cells: [4, 7, 2, 4, 4, 9]
    correct: 4
    explanation: >-
      The 2 pops first, and run 1 pushes its next value, its 4. The heap then holds three entries
      with the value 4, so each tie moves on to the run number. Run 0's 4 comes out first, then run
      1's, then run 2's, so the last 4 printed is run 2's.
    misses:
      - index: 0
        explanation: >-
          Run 0's 4 ties with the other two, and its run number, 0, is the smallest. It is the
          first 4 out.
      - index: 3
        explanation: >-
          Run 1's 4 entered the heap last, after the 2 left, but arrival order does not break the
          tie. It compares run numbers, and 1 is smaller than 2, so this 4 comes out second.
      - index: 1
        explanation: '7 is not a 4. Run 0 pushes it when its 4 pops, and it comes out after all three 4s.'
      - index: 2
        explanation: '2 is not a 4. It is the smallest front, so it is printed first of all.'
      - index: 5
        explanation: '9 is not a 4. Run 2 pushes it when its 4 pops, and it is printed last of all.'

  - format: tap-cell
    id: checkpoint-median-first-move
    heading: Which arrival makes the move?
    tags: [heap, python]
    prompt: >-
      `add` places each value of `stream` in `lo`, the smaller half stored negated, or in `hi`, the
      larger half, and then rebalances. An empty `lo` counts as false, so `and` stops early and the
      first arrival joins `lo`. Which arrival is the first whose `add` moves a value from `hi` to
      `lo`? Tap it.
    code: |
      from heapq import heappush, heappop

      lo, hi = [], []

      def add(x):
          if lo and x > -lo[0]:
              heappush(hi, x)
          else:
              heappush(lo, -x)
          if len(lo) > len(hi) + 1:
              heappush(hi, -heappop(lo))
          elif len(hi) > len(lo):
              heappush(lo, -heappop(hi))

      stream = [7, 12, 3, 9, 5, 2, 11, 6]
      for x in stream:
          add(x)
    sequence:
      kind: array
      name: stream
      cells: [7, 12, 3, 9, 5, 2, 11, 6]
    correct: 6
    explanation: >-
      Once 2 has been read, each heap holds 3 values: `lo` holds 2, 3 and 5, and `hi` holds 7, 9
      and 12. 11 is larger than `-lo[0]`, 5, so it joins `hi`, which then holds 4 values to `lo`'s
      3. The `elif` moves the smallest value in `hi`, the 7, back to `lo`.
    misses:
      - index: 0
        explanation: >-
          7 is the first arrival and joins the empty `lo`, so nothing moves. It is the value that
          crosses when 11 arrives, but the question asks which arrival makes the move.
      - index: 1
        explanation: '12 joins `hi`, but each heap then holds 1 value, so neither rebalance test is true.'
      - index: 2
        explanation: >-
          3 joins `lo`, which then holds 2 values to `hi`'s 1. `lo` may keep one extra value, so
          nothing moves.
      - index: 3
        explanation: '9 is larger than `-lo[0]`, 7, so it joins `hi`, but each heap then holds 2, so nothing moves.'
      - index: 4
        explanation: >-
          5 joins `lo`, which then holds 3 values to `hi`'s 2. That is one extra, which `lo` may
          keep.
      - index: 5
        explanation: >-
          2 joins `lo`, which then holds 4 values to `hi`'s 2, so the first test moves 7 from `lo`
          to `hi`. That is the first move, but it goes the other way.
      - index: 7
        explanation: >-
          6 is not larger than `-lo[0]`, which is 7 by then, so it joins `lo`, and the first test
          moves 7 to `hi`. That move goes from `lo` to `hi`, and it comes after the 11.

  - id: checkpoint-median-route-lo
    heading: Which values go to hi?
    tags: [heap, python]
    prompt: |-
      This version of `medians` pushes every arrival into `lo` first. `lo` holds the smaller half,
      stored negated, and `hi` holds the larger half.

      ```python
      from heapq import heappush, heappop

      def medians(stream):
          lo, hi, out = [], [], []
          for x in stream:
              heappush(lo, -x)
              heappush(hi, -heappop(lo))
              if len(hi) > len(lo):
                  heappush(lo, -heappop(hi))
              if len(lo) > len(hi):
                  out.append(-lo[0])
              else:
                  out.append((-lo[0] + hi[0]) / 2)
          return out

      medians([8, 3, 6, 10])
      ```

      Which value does `heappush(hi, -heappop(lo))` send to `hi` on each of the four arrivals?
    options:
      - id: largest-in-lo
        text: '`8, 8, 6, 10`'
        explanation: >-
          `-heappop(lo)` is the largest value in `lo` once the arrival is in, so the second line
          sends that value to `hi`, whether or not it is the arrival. The first 8 goes and comes
          back, since `hi` then holds 1 value to `lo`'s 0. When 3 arrives, `lo` holds 3 and 8, so
          the 8 goes and stays. When 6 arrives, `lo` holds 3 and 6, so the 6 goes and comes back,
          since `hi` then holds 2 values to `lo`'s 1. When 10 arrives, it is the largest in `lo`,
          so it goes.
      - id: arrival
        text: '`8, 3, 6, 10`'
        explanation: Check which value `-heappop(lo)` takes when 3 arrives.
      - id: plain-min
        text: '`8, 3, 6, 3`'
        explanation: Check how `lo` stores its values.
      - id: hi-root
        text: '`8, 8, 6, 8`'
        explanation: Check whether the value sent and `hi[0]` are the same once 10 arrives.
    correct: largest-in-lo
    followUps:
      arrival:
        prompt: 'When 3 arrives, `lo` holds 8 and 3 after the first push. Which value does `-heappop(lo)` send to `hi`?'
        options:
          - id: eight
            text: 8, the largest value in `lo`
          - id: three
            text: 3, the value just pushed
          - id: nothing
