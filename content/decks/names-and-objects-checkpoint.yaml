id: names-and-objects-checkpoint
title: "Names and objects: checkpoint"
description: Predict which of the caller's objects change, on new inputs. Each item combines following references, telling rebinding from changing an object, and shared state.
heading: What does the caller see?

questions:
  - id: checkpoint-process-call
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      def process(items, extra):
          items.append(extra[0])
          extra = extra + [0]
          extra[0] = -1
          items = []
          return extra

      a = [7]
      b = [2, 3]
      c = process(a, b)
      print(a, b, c)
      ```

      What does this print?
    options:
      - id: traced
        text: "`[7, 2] [2, 3] [-1, 3, 0]`"
        explanation: >-
          `items.append` changes `a`'s list. `extra + [0]` builds a new list and only the local
          name moves onto it, so the `-1` lands there and `b` is untouched. `items = []` moves a
          local name only. The new list is returned as `c`.
      - id: rebind-clears
        text: "`[] [2, 3] [-1, 3, 0]`"
        explanation: Look at what `items = []` changes, the name or the list.
      - id: plus-in-place
        text: "`[7, 2] [-1, 3, 0] [-1, 3, 0]`"
        explanation: Look at whether `extra + [0]` changes `b`'s list or builds another.
      - id: append-private
        text: "`[7] [2, 3] [-1, 3, 0]`"
        explanation: Look at which list `items` refers to when line 2 runs.
    correct: traced
    followUps:
      rebind-clears:
        prompt: What does `items = []` on line 5 do to the caller's `a`?
        options:
          - id: nothing
            text: Nothing; it points the local name at a new empty list
          - id: empties
            text: It empties the list `a` names
          - id: rebinds-a
            text: It makes `a` refer to a new empty list
        correct: nothing
        explanation: >-
          Assigning to a parameter moves only the local name. `a` and its list keep the 2 that
          line 2 appended.
      plus-in-place:
        prompt: After line 3, does `extra` still refer to `b`'s list?
        options:
          - id: no
            text: No, `extra + [0]` built a new list and `extra` moved onto it
          - id: yes
            text: Yes, `+` added the 0 to `b`'s list
          - id: both
            text: Yes, and the new list is linked to it
        correct: no
        explanation: >-
          `+` builds a new list. From line 3 on, every write through `extra` goes into that new
          list, so `b` stays `[2, 3]`.
      append-private:
        prompt: When `process(a, b)` starts, what does `items` refer to?
        options:
          - id: callers
            text: The list `a` names
          - id: copy
            text: A copy of `a`'s list
          - id: empty
            text: An empty list until something is appended
        correct: callers
        explanation: >-
          A parameter is bound to the argument object itself, so `items.append` changes `a`'s
          list before line 5 moves the name away.

  - format: tap-cell
    id: checkpoint-marked-rows
    heading: Which other row changed?
    tags: [python]
    prompt: >-
      The cells show the rows of `grid` before the call. `mark(grid, 3)` writes `'x'` through row 3.
      Which other row also starts with `'x'` after the call? Tap it.
    code: |
      def mark(grid, r):
          grid[r][0] = 'x'

      row = ['.', '.']
      grid = [['.', '.'], row[:], row, row]
      mark(grid, 3)
    sequence:
      kind: array
      name: grid
      cells: ["['.', '.']", "['.', '.']", "['.', '.']", "['.', '.']"]
    correct: 2
    explanation: >-
      `grid` holds `row` at indices 2 and 3. The call writes into the list at index 3, which is
      `row`, so index 2 shows the change. `grid` becomes `[['.', '.'], ['.', '.'], ['x', '.'], ['x', '.']]`.
    misses:
      - index: 0
        explanation: >-
          This row is its own list display, built separately from `row`. Nothing writes into it.
      - index: 1
        explanation: '`row[:]` copied `row` before the call, so the later write does not reach this copy.'
      - index: 3
        explanation: This is the row the call writes through. The question asks which other row shows the change.

  - id: checkpoint-shallow-dict
    heading: What does this print?
    tags: [python, hash-map]
    prompt: |-
      ```python
      def add(groups, team, name):
          if team in groups:
              groups[team].append(name)
          else:
              groups[team] = [name]

      base = {'red': ['ana']}
      snapshot = dict(base)
      add(base, 'red', 'bo')
      add(base, 'blue', 'cy')
      print(snapshot)
      ```

      What does this print?
    options:
      - id: shared-values
        text: "`{'red': ['ana', 'bo']}`"
        explanation: >-
          `dict(base)` builds a new dictionary whose `'red'` key refers to the same list as
          `base['red']`. Appending to that list shows in `snapshot`. Adding the `'blue'` key changes
          only `base`.
      - id: deep-copy
        text: "`{'red': ['ana']}`"
        explanation: Look at what `dict(base)` copies, the dictionary or the lists inside it.
      - id: alias
        text: "`{'red': ['ana', 'bo'], 'blue': ['cy']}`"
        explanation: Look at whether `snapshot` and `base` are one dictionary or two.
      - id: swapped
        text: "`{'red': ['ana'], 'blue': ['cy']}`"
        explanation: Look at which change happens to a shared object and which to `base` alone.
    correct: shared-values
    followUps:
      deep-copy:
        prompt: After `snapshot = dict(base)`, is `snapshot['red'] is base['red']` true?
        options:
          - id: shared
            text: Yes, the new dictionary refers to the same list
          - id: copied
            text: No, `dict(...)` copies each list value
          - id: missing
            text: No, `snapshot` has no keys until something is added
        correct: shared
        explanation: >-
          `dict(...)` copies only the outer dictionary, like a list slice. The keys go into a new
          dictionary, and each value is the same object as before.
      alias:
        prompt: Is `snapshot is base` true?
        options:
          - id: two-dicts
            text: No, `dict(base)` builds a second dictionary
          - id: one-dict
            text: Yes, both names refer to one dictionary
          - id: depends
            text: Only until a key is added
        correct: two-dicts
        explanation: >-
          Calling `dict(...)` builds a new dictionary. Adding the `'blue'` key to `base` changes
          only that one, so `snapshot` never gets it.
      swapped:
        prompt: Which of the two calls changes an object that `snapshot` can see?
        options:
          - id: append
            text: The append to the `'red'` list
          - id: new-key
            text: Adding the `'blue'` key
          - id: both
            text: Both of them
        correct: append
        explanation: >-
          The `'red'` list is shared by both dictionaries, so the append shows in both. The new
          key goes into `base`'s dictionary only.

  - id: checkpoint-pad-rows
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      def pad_all(rows):
          for row in rows:
              row.append(0)
              row = row + [9]
          rows = rows + [[9]]

      grid = [[1], [2]]
      pad_all(grid)
      print(grid)
      ```

      What does this print?
    options:
      - id: appends-only
        text: "`[[1, 0], [2, 0]]`"
        explanation: >-
          Each pass binds `row` to one of `grid`'s rows, so `append(0)` changes that row. The two
          `+` lines build new lists and move only local names, so neither the 9s nor the extra row
          reach `grid`.
      - id: plus-in-place
        text: "`[[1, 0, 9], [2, 0, 9]]`"
        explanation: Look at whether `row + [9]` changes the row or builds another list.
      - id: loop-copies
        text: "`[[1], [2]]`"
        explanation: Look at which list `row` refers to on each pass.
      - id: outer-grows
        text: "`[[1, 0], [2, 0], [9]]`"
        explanation: Look at what `rows = rows + [[9]]` changes, the name or the caller's list.
    correct: appends-only
    followUps:
      plus-in-place:
        prompt: What happens to the row `row` referred to when `row = row + [9]` runs?
        options:
          - id: untouched
            text: Nothing; a new list is built and `row` moves onto it
          - id: extended
            text: The 9 is added to the end of it
          - id: replaced
            text: "`grid`'s cell is replaced by the new list"
        correct: untouched
        explanation: >-
          `+` builds a new list, and assigning to the loop variable moves only that name. `grid`'s
          row keeps `[1, 0]`.
      loop-copies:
        prompt: On the first pass of `for row in rows`, what does `row` refer to?
        options:
          - id: same-row
            text: The list in `grid[0]` itself
          - id: copy
            text: A copy of `grid[0]` made for the loop
          - id: index
            text: The index 0, as with `range(len(rows))`
        correct: same-row
        explanation: >-
          A `for` loop binds its variable to each item in turn, without copying. Calling a method
          on `row` changes `grid`'s row.
      outer-grows:
        prompt: Does `rows = rows + [[9]]` change the list `grid` names?
        options:
          - id: no
            text: No, it builds a new outer list and only the local `rows` moves
          - id: yes
            text: Yes, it adds `[9]` to the caller's list
          - id: replaces
            text: Yes, `grid` now refers to the new list
        correct: no
        explanation: >-
          `+` builds a new list, and the assignment rebinds the parameter. `rows += [[9]]` or
          `rows.append([9])` would have changed `grid`.

  - id: checkpoint-debug-doubled
    heading: Which line is wrong?
    tags: [python]
    prompt: |-
      A suggested solution should return a new list with every value doubled, and leave the
      caller's list as it was. After the call below, `scores` prints `[6, 8]`. Which line is wrong?

      ```python
      def doubled(nums):
          out = nums
          for i in range(len(out)):
              out[i] = out[i] * 2
          return out

      scores = [3, 4]
      twice = doubled(scores)
      ```
    options:
      - id: second-name
        text: "Line 2: `out = nums`"
        explanation: >-
          `out = nums` gives the caller's list a second name and builds nothing, so every write on
          line 4 lands in `scores`. `out = nums[:]` would make the new list the task asks for.
      - id: write-line
        text: "Line 4: `out[i] = out[i] * 2`"
        explanation: >-
          Writing each doubled value by index is how the new list gets filled. The trouble is which
          list `out` refers to when it runs.
      - id: return-line
        text: "Line 5: `return out`"
        explanation: >-
          Returning hands back a reference, never a copy, but the caller's list has already changed
          by then. Copying here would come too late.
      - id: call-line
        text: "Line 8: `twice = doubled(scores)`"
        explanation: >-
          A call points `nums` at the caller's list without copying, and that is how Python always
          passes arguments. The function itself must make the copy.
    correct: second-name
    followUps:
      write-line:
        prompt: When line 4 runs, which list does `out` refer to?
        options:
          - id: callers
            text: The caller's list, the one `scores` names
          - id: new
            text: A new list made on line 2
          - id: copy
            text: A copy made when `doubled` was called
        correct: callers
        explanation: >-
          Line 2 copied the arrow, not the list. So `out`, `nums` and `scores` all name one list,
          and each write on line 4 changes it.
      return-line:
        prompt: By the time `return out` runs, what does `scores` hold?
        options:
          - id: changed
            text: "`[6, 8]`, since line 4 changed the caller's list"
          - id: unchanged
            text: "`[3, 4]`, until the function returns"
          - id: empty
            text: An empty list
        correct: changed
        explanation: >-
          The writes on line 4 already changed the one list `out` and `scores` share. Whatever
          line 5 returns, `scores` holds `[6, 8]`.
      call-line:
        prompt: When `doubled(scores)` runs, does `nums` get a copy of `scores`?
        options:
          - id: no-copy
            text: No, `nums` refers to the caller's list itself
          - id: copy
            text: Yes, each call gets its own copy
          - id: numbers
            text: Only when the list holds numbers
        correct: no-copy
        explanation: >-
          A call never copies its arguments, so the call line is fine. A function that must leave
          the caller's list alone has to make its own copy before it changes anything.
