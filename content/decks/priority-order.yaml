id: priority-order
title: Priority order
description: Tell a FIFO queue from a priority queue, find the heap root, and predict one push or pop. Each card opens with a worked example, then asks for one decision.
heading: What comes out next?

questions:
  - format: step-trace
    id: fifo-or-priority-trace
    heading: Which job comes out?
    tags: [queue, heap, python]
    prompt: >-
      **Worked example:** a deque fed 5, 1, 3 hands back 5 first, the oldest. A heap fed the same
      values hands back 1 first, the smallest. Below, both are fed `jobs`. `out` marks the job most
      recently handed out by either one, and it starts on index 0. Predict each step.
    code: |
      from collections import deque
      from heapq import heappush, heappop

      jobs = [6, 2, 9, 4]
      queue, heap = deque(), []
      for p in jobs:
          queue.append(p)
          heappush(heap, p)

      b = heappop(heap)
      a = queue.popleft()
      d = heappop(heap)
      c = queue.popleft()
    sequence:
      kind: array
      name: jobs
      cells: [6, 2, 9, 4]
    start:
      - { name: out, at: 0 }
    steps:
      - line: 10
        ask: Which job does `heappop(heap)` hand out? Tap it.
        pointer: out
        correct: 1
        explanation: >-
          All four jobs are in the heap, and `heappop` returns the smallest one, 2. The order the
          jobs arrived in plays no part.
        misses:
          - index: 0
            explanation: >-
              6 arrived first, so a FIFO queue would hand it out first. A heap compares the values
              and returns the smallest.
          - index: 2
            explanation: '9 is the largest. `heapq` builds a min-heap, so the smallest comes out first.'
          - index: 3
            explanation: >-
              4 was pushed last. Taking the newest item is what a stack does. A heap ignores push
              order.
        elsewhere: '`heappop` returns the smallest job in the heap, the 2 at index 1.'
      - line: 11
        ask: What does `queue.popleft()` return?
        options:
          - id: six
            text: '6'
            explanation: >-
              A deque hands jobs out in arrival order, and 6 arrived first. The pop on line 10
              changed the heap only, not `queue`.
          - id: two
            text: '2'
            explanation: >-
              2 is the smallest, which is what the heap returned. A deque never compares jobs. It
              returns the one that has waited longest.
          - id: four
            text: '4'
            explanation: >-
              4 is the newest job, at the right end. `popleft` takes from the left end, where the
              oldest job waits.
        correct: six
        also:
          - { name: out, at: 0 }
      - line: 12
        ask: Which job does the second `heappop(heap)` hand out? Tap it.
        pointer: out
        correct: 3
        explanation: >-
          The heap now holds 6, 9 and 4. Line 11 took a 6 out of `queue`, which is a separate
          container, so the heap still has its own 6. The smallest of the three is 4.
        misses:
          - index: 0
            explanation: >-
              6 left `queue` on line 11, but the heap still holds its own 6. Even so, 4 is smaller,
              so 4 comes out.
          - index: 1
            explanation: >-
              Line 10 already removed 2 from the heap. `heappop` takes the item out; it does not
              only read it.
          - index: 2
            explanation: >-
              9 follows 2 in `jobs`, but a heap does not use list order. Of 6, 9 and 4, the
              smallest is 4.
        elsewhere: The heap holds 6, 9 and 4, so this pop returns 4.
      - line: 13
        ask: What does the second `queue.popleft()` return?
        options:
          - id: two
            text: '2'
            explanation: >-
              `queue` still holds 2, 9 and 4 in arrival order. The heap pops on lines 10 and 12
              changed only the heap, so 2 comes out next.
          - id: nine
            text: '9'
            explanation: >-
              This skips 2, as if the heap's pop had also taken it out of `queue`. Each container
              holds its own copy, and `queue` still starts with 2.
          - id: four
            text: '4'
            explanation: >-
              4 is the job the heap handed out second. A deque ignores values and returns the
              oldest job left, which is 2.
        correct: two
        also:
          - { name: out, at: 1 }

  - id: next-job-on-arrival
    heading: Which job starts next?
    tags: [heap, queue]
    prompt: |-
      **Worked example:** a worker always starts the waiting job with the smallest time estimate.
      With `render` (5 min) and `scan` (3 min) waiting, it starts `scan`, even though `render`
      arrived first.

      Now `export` (9 min), `resize` (4 min) and `thumb` (6 min) are waiting, in that order of
      arrival. While the worker is still busy, `ping` (2 min) arrives. When the worker finishes,
      which job does it start?
    options:
      - id: ping
        text: "`ping`, the shortest job waiting when the worker picks"
        explanation: >-
          When the worker picks, four jobs are waiting and `ping` has the smallest estimate.
          Arriving last does not hold it back, because the rule looks only at the estimates of the
          jobs in the queue.
      - id: export
        text: "`export`, because it has waited longest"
        explanation: >-
          Waiting longest is the FIFO rule. This worker compares estimates instead, and `export`
          has the largest one, so it runs last.
      - id: resize
        text: "`resize`, the shortest of the three that were waiting first"
        explanation: >-
          `resize` is the shortest of the first three, but `ping` arrived before the worker made
          its pick, so it is in the running too.
    correct: ping
    followUps:
      export:
        prompt: The rule is shortest estimate first. When does arrival order decide which job starts?
        options:
          - id: not-when-different
            text: Not when the estimates differ, since the smallest estimate starts
          - id: oldest-first
            text: Always first, since the oldest job starts and estimates order the rest
          - id: long-queue
            text: Whenever more than three jobs are waiting
        correct: not-when-different
        explanation: >-
          A priority rule ranks waiting jobs by the priority, here the estimate. Arrival order
          could at most break a tie between equal estimates, and no two estimates here are equal.
      resize:
        prompt: "`ping` arrived while the worker was busy. Is it a candidate when the worker picks next?"
        options:
          - id: candidate
            text: Yes, every job waiting at the moment of the pick is compared
          - id: next-round
            text: No, a job that arrives mid-run waits for the next round
          - id: beat-running
            text: Only if it is shorter than the job that is running
        correct: candidate
        explanation: >-
          The worker picks only when it finishes a job, and by then `ping` is waiting like the
          others. The running job is not compared at all, because nothing interrupts it.

  - id: heap-list-unsorted
    heading: Is this heap broken?
    tags: [heap, python]
    prompt: |-
      **Worked example:** pushing 6, 4, 9, 1 with `heappush` leaves `h` as `[1, 4, 9, 6]`. The list
      is not sorted, yet `h[0]` holds the smallest value, and that is all `heappop` needs.

      ```python
      from heapq import heappush

      h = []
      for x in [10, 4, 12, 6, 3]:
          heappush(h, x)
      print(h)
      ```

      This prints `[3, 4, 12, 10, 6]`. Is the heap broken?
    options:
      - id: fine
        text: No, only `h[0]` has to be the smallest, and the rest is partly ordered
        explanation: >-
          The heap rule says no item is larger than the items below it in the tree, which puts the
          smallest at the root, `h[0]`. Nothing else has to be in order, so 12 may come before 10
          and 6.
      - id: sorted
        text: Yes, `heappush` should keep the whole list sorted
        explanation: >-
          Keeping every item sorted would mean shifting items on each push. A heap keeps less
          order than that, and this list follows its rule.
      - id: last-largest
        text: Yes, the largest value, 12, should be at the end
        explanation: >-
          Nothing puts the largest value last. 12 sits at index 2, below the root, which the rule
          allows because 3 is smaller than 12.
      - id: push-order
        text: No, `heapq` keeps items in the order they were pushed
        explanation: >-
          The verdict is right but the reason is not. The pushes were 10, 4, 12, 6, 3, and the
          list does not keep that order: the 3 moved to the front.
    correct: fine
    followUps:
      sorted:
        prompt: >-
          `h` is `[3, 4, 12, 10, 6]`, and the children of `h[i]` sit at `2*i + 1` and `2*i + 2`.
          Which items must `h[1]`, the 4, be no larger than?
        options:
          - id: children
            text: "`h[3]` and `h[4]`, its two children"
          - id: neighbor
            text: "`h[2]`, the next cell"
          - id: everything-after
            text: Every item after it
        correct: children
        explanation: >-
          The rule compares each parent with its own children only. 4 is no larger than 10 or 6,
          so index 1 is fine, and the 12 at index 2 has no children in a five-item list.
      last-largest:
        prompt: What does the heap rule say about `h[-1]`?
        options:
          - id: below-parent
            text: Only that it is no smaller than its parent
          - id: largest
            text: It is the largest item
          - id: newest
            text: It is the item pushed last
        correct: below-parent
        explanation: >-
          The last cell is one of the bottom items, nothing more. Here it holds 6, while 12 is the
          largest and 3 was the item pushed last.
      push-order:
        prompt: The pushes were 10, 4, 12, 6, 3. Where did the 3 end up?
        options:
          - id: root
            text: At `h[0]`, because a push moves a smaller item up
          - id: end
            text: At the end, where it was appended
          - id: beside-root
            text: At `h[1]`, next to the old root
        correct: root
        explanation: >-
          `heappush` appends the item, then swaps it with its parent while it is smaller. 3 is
          smaller than every other item, so it climbs all the way to index 0.

  - format: tap-cell
    id: tap-the-root
    heading: Which value is the root?
    tags: [heap, python]
    prompt: >-
      **Worked example:** after pushing 9, 6, 1, 4, `h[0]` is 1, the smallest, even though 9 was
      pushed first. Now the values below are pushed in order. Which of them ends up in `h[0]`? Tap
      it.
    code: |
      from heapq import heappush

      values = [7, 5, 11, 2, 8]
      h = []
      for x in values:
          heappush(h, x)
      print(h[0])
    sequence:
      kind: array
      name: values
      cells: [7, 5, 11, 2, 8]
    correct: 3
    explanation: >-
      Each push moves a smaller item up toward the root, so after all five pushes `h[0]` holds the
      smallest value, 2. The code prints 2.
    misses:
      - index: 0
        explanation: >-
          7 was pushed first and sat at `h[0]` only until 5 arrived. A heap keeps the smallest at
          the root, not the oldest.
      - index: 1
        explanation: >-
          5 was the root after the second push, but 2 is smaller. When 2 was pushed, it climbed
          past 5 to the root.
      - index: 2
        explanation: '11 is the largest. `heapq` builds a min-heap, so the root holds the smallest value.'
      - index: 4
        explanation: >-
          8 was pushed last. It was appended at the end and stayed there, because it is larger than
          its parent, 5. It never came near the root.

  - id: one-pop-prediction
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      **Worked example:** after pushing 5, 9, 2, `heappop(h)` returns 2. The smallest comes out,
      whatever the push order.

      ```python
      from heapq import heappush, heappop

      h = []
      for x in [14, 6, 20, 9]:
          heappush(h, x)
      print(heappop(h), h[0])
      ```

      What does this print?
    options:
      - id: min-then-next
        text: "`6 9`"
        explanation: >-
          The pop removes 6. Of the three left, 14, 20 and 9, the smallest is 9, and the heap
          moves it up to `h[0]`.
      - id: fifo
        text: "`14 6`"
        explanation: >-
          This treats the heap as a queue that hands out the first value pushed. `heappop` looks at
          values, and 14 is not the smallest.
      - id: max-first
        text: "`20 14`"
        explanation: >-
          This takes the largest first. `heapq` is a min-heap, so its pops start from the other
          end.
      - id: peek
        text: "`6 6`"
        explanation: >-
          6 is the right first value, but it does not stay. Once `heappop` returns it, `h[0]`
          holds a different value.
    correct: min-then-next
    followUps:
      fifo:
        prompt: The pushes went in as 14, 6, 20, 9. What decides which value `heappop` returns?
        options:
          - id: value
            text: Which value is smallest
          - id: first
            text: Which value was pushed first
          - id: last
            text: Which value was pushed last
        correct: value
        explanation: >-
          A heap ranks its items by value. Push order only changes where items sit inside the
          list, never which one comes out.
      max-first:
        prompt: Which value does `heapq` keep at `h[0]`?
        options:
          - id: smallest
            text: The smallest value in the heap
          - id: largest
            text: The largest value in the heap
          - id: newest
            text: The value pushed most recently
        correct: smallest
        explanation: >-
          `heapq` is a min-heap. To pop the largest first, push negated values instead and negate
          what comes back.
      peek:
        prompt: What is the difference between `h[0]` and `heappop(h)`?
        options:
          - id: removes
            text: "`h[0]` only reads the smallest, while `heappop` also takes it out"
          - id: same
            text: None, both leave the heap unchanged
          - id: swapped
            text: "`h[0]` takes the smallest out, while `heappop` only reads it"
        correct: removes
        explanation: >-
          Reading `h[0]` is a peek. `heappop` returns the same item and removes it, so the heap
          shrinks by one and the next smallest moves to the root.

  - format: step-trace
    id: push-pop-trace
    heading: Predict each pop
    tags: [heap, python]
    prompt: >-
      **Worked example:** `heappop` returns the smallest value in the heap at that moment,
      including values pushed after earlier pops. The cells show the values in the order they are
      pushed. `out` marks the value the latest pop returned, and it starts on index 0. Predict each
      step.
    code: |
      from heapq import heappush, heappop

      pushed = [7, 3, 9, 1]
      h = []
      for x in pushed[:3]:
          heappush(h, x)
      a = heappop(h)
      heappush(h, pushed[3])
      b = heappop(h)
      c = heappop(h)
    sequence:
      kind: array
      name: pushed
      cells: [7, 3, 9, 1]
    start:
      - { name: out, at: 0 }
    steps:
      - line: 7
        ask: Which value does `a` get? Tap it.
        pointer: out
        correct: 1
        explanation: The heap holds 7, 3 and 9, and the smallest of those is 3.
        misses:
          - index: 0
            explanation: '7 was pushed first, but the heap returns the smallest of 7, 3 and 9.'
          - index: 2
            explanation: >-
              9 is the largest of the three and the last one pushed so far. Neither makes it come
              out first.
          - index: 3
            explanation: 1 is not in the heap yet. It is pushed on line 8, after this pop.
        elsewhere: The heap holds 7, 3 and 9, so `a` is 3.
      - line: 9
        ask: Which value does `b` get? Tap it.
        pointer: out
        correct: 3
        explanation: >-
          Line 8 pushed 1, so the heap holds 7, 9 and 1. A pop compares everything inside at that
          moment, and 1 is the smallest.
        misses:
          - index: 0
            explanation: >-
              7 was the smallest left after line 7, but line 8 then pushed 1. A pop compares
              everything in the heap now.
          - index: 1
            explanation: 3 left the heap on line 7.
          - index: 2
            explanation: 9 is the largest of 7, 9 and 1.
        elsewhere: The heap holds 7, 9 and 1, so `b` is 1.
      - line: 10
        ask: Which value does `c` get? Tap it.
        pointer: out
        correct: 0
        explanation: Only 7 and 9 are left, and 7 is the smaller.
        misses:
          - index: 1
            explanation: 3 was popped on line 7.
          - index: 2
            explanation: 9 is still in the heap, but 7 is smaller.
          - index: 3
            explanation: 1 was popped on line 9.
        elsewhere: Only 7 and 9 are left, so `c` is 7.
      - line: 10
        ask: What does `h` hold after line 10?
        options:
          - id: nine
            text: '`[9]`'
            explanation: Four values went in and three came out. 3, 1 and 7 are gone, so 9 is left.
          - id: empty
            text: '`[]`'
            explanation: >-
              Three pops would empty a heap of three, but line 8 pushed a fourth value. One value is
              still inside.
          - id: seven-nine
            text: '`[7, 9]`'
            explanation: '`c` already took 7 out on line 10, so only 9 is left.'
        correct: nine

  - id: push-below-root
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      **Worked example:** `h = [2, 6, 4]` is a heap. After `heappush(h, 9)`, `h[0]` is still 2,
      because 9 is larger than the root and stays below it.

      ```python
      from heapq import heappush

      h = [3, 7, 4]
      heappush(h, 1)
      print(h[0], len(h))
      ```

      What does this print?
    options:
      - id: new-root
        text: "`1 4`"
        explanation: >-
          1 is appended, then swapped past 7 and then past 3, since it is smaller than each parent
          in turn. It becomes the root, and the list grows to four items.
      - id: root-fixed
        text: "`3 4`"
        explanation: >-
          The list does grow to four, but the root changes too. 1 is smaller than 3, and a pushed
          item keeps rising while it is smaller than its parent.
      - id: replaced
        text: "`1 3`"
        explanation: >-
          1 does become the root, but a push never takes anything out. The heap holds four items
          after it.
    correct: new-root
    followUps:
      root-fixed:
        prompt: Where can a pushed item end up?
        options:
          - id: any-level
            text: Anywhere on its path up from the end, including the root
          - id: end
            text: Always at the end of the list
          - id: never-root
            text: Anywhere except the root, which only `heappop` changes
        correct: any-level
        explanation: >-
          `heappush` appends the item and swaps it with its parent while it is smaller. A new
          smallest value climbs all the way to `h[0]`.
      replaced:
        prompt: After `heappush(h, 1)`, where is the old root, 3?
        options:
          - id: one-level-down
            text: Still in the heap, one level down
          - id: gone
            text: Gone, replaced by 1
          - id: at-end
            text: At the end of the list
        correct: one-level-down
        explanation: >-
          `heappush` only adds. 3 swaps down into the cell that 1 came through, so the heap becomes
          `[1, 3, 4, 7]`.
