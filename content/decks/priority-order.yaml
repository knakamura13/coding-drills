id: priority-order
title: Priority order
description: Tell a first-in, first-out queue from a priority queue, find the heap root, predict a push or pop, and pop the largest first. Each card asks for one decision, with a worked example on hand.
heading: What comes out next?

questions:
  - id: next-job-on-arrival
    heading: Which job starts next?
    tags: [heap, queue]
    workedExample: |-
      A first-in, first-out queue hands out items in the order they arrived. A priority queue
      instead hands out the waiting item with the smallest priority number, whatever the arrival
      order. Python's `heapq` keeps one inside a plain list. Here a worker always starts the waiting
      job with the smallest time estimate, and while it is busy, `render` (5 min) arrives, then
      `scan` (3 min).

      1. When the worker finishes, `render` and `scan` are both waiting, so both are candidates.
      2. `scan` has the smaller estimate, 3 min against 5 min for `render`.
      3. So the worker starts `scan`, although `render` arrived first. A first-in, first-out queue
         would have started `render`.
    prompt: |-
      A queue serves items first in, first out (FIFO): new items join at the back, and the oldest
      leaves from the front. A priority queue instead hands out the waiting item with the smallest
      priority number, whatever order the items arrived in.

      A worker keeps its jobs in a priority queue keyed on time estimates: whenever it finishes a
      job, it starts the waiting job with the smallest estimate. `export` (9 min), `resize` (4 min)
      and `thumb` (6 min) are waiting, in that order of arrival. While the worker is still busy,
      `ping` (2 min) arrives. When the worker finishes, which job does it start?
    options:
      - id: ping
        text: "`ping`, the shortest job waiting when the worker picks"
        explanation: >-
          When the worker picks, four jobs are waiting and `ping` has the smallest estimate.
          Arriving last does not hold it back, because the rule looks only at the estimates of the
          jobs in the queue.
      - id: export
        text: "`export`, because it has waited longest"
        explanation: >-
          Waiting longest is the FIFO rule. This worker compares estimates instead, and `export`
          has the largest one, so it runs last.
      - id: resize
        text: "`resize`, the shortest of the three that were waiting first"
        explanation: >-
          `resize` is the shortest of the first three, but `ping` arrived before the worker made
          its pick, so it is in the running too.
    correct: ping
    followUps:
      export:
        prompt: The rule is shortest estimate first. When does arrival order decide which job starts?
        options:
          - id: not-when-different
            text: Not when the estimates differ, since the smallest estimate starts
          - id: oldest-first
            text: Always first, since the oldest job starts and estimates order the rest
          - id: long-queue
            text: Whenever more than three jobs are waiting
        correct: not-when-different
        explanation: >-
          A priority rule ranks waiting jobs by the priority, here the estimate. Arrival order
          could at most break a tie between equal estimates, and no two estimates here are equal.
      resize:
        prompt: "`ping` arrived while the worker was busy. Is it a candidate when the worker picks next?"
        options:
          - id: candidate
            text: Yes, every job waiting at the moment of the pick is compared
          - id: next-round
            text: No, a job that arrives mid-run waits for the next round
          - id: beat-running
            text: Only if it is shorter than the job that is running
        correct: candidate
        explanation: >-
          The worker picks only when it finishes a job, and by then `ping` is waiting like the
          others. The running job is not compared at all, because nothing interrupts it.

  - format: step-trace
    id: fifo-or-priority-trace
    heading: Which job comes out?
    tags: [queue, heap, python]
    workedExample: |-
      Consider a deque `queue` and a heap `heap`, each fed `5, 1, 3` in that order.
      `queue.popleft()` returns the oldest item, and `heappop(heap)` returns the smallest.

      1. 5 arrived first, so `queue.popleft()` returns 5. A deque never compares values.
      2. The smallest of 5, 1 and 3 is 1, so `heappop(heap)` returns 1, although it arrived second.
      3. The two containers are separate, so each pop changes only its own. The next
         `queue.popleft()` returns 1, and the next `heappop(heap)` returns 3.
    prompt: >-
      `queue` is a deque used as a queue: `append` adds at the back, and `popleft()` removes the
      item at the front, the oldest. `heap` is a `heapq` heap: `heappush` adds an item, and
      `heappop` removes the smallest. Both are fed `jobs`. `out` marks the job most recently handed
      out by either one, and it starts on index 0. Predict each step.
    code: |
      from collections import deque
      from heapq import heappush, heappop

      jobs = [6, 2, 9, 4]
      queue, heap = deque(), []
      for p in jobs:
          queue.append(p)
          heappush(heap, p)

      b = heappop(heap)
      a = queue.popleft()
      d = heappop(heap)
      c = queue.popleft()
    sequence:
      kind: array
      name: jobs
      cells: [6, 2, 9, 4]
    start:
      - { name: out, at: 0 }
    steps:
      - line: 10
        ask: Which job does `heappop(heap)` hand out? Tap it.
        pointer: out
        correct: 1
        explanation: >-
          All four jobs are in the heap, and `heappop` returns the smallest one, 2. The order the
          jobs arrived in plays no part.
        misses:
          - index: 0
            explanation: >-
              6 arrived first, so a FIFO queue would hand it out first. A heap compares the values
              and returns the smallest.
          - index: 2
            explanation: '9 is the largest. `heapq` builds a min-heap, so the smallest comes out first.'
          - index: 3
            explanation: >-
              4 was pushed last, but a heap ignores push order. It compares the values and returns
              the smallest.
        elsewhere: '`heappop` returns the smallest job in the heap, the 2 at index 1.'
      - line: 11
        ask: What does `queue.popleft()` return?
        options:
          - id: six
            text: '6'
            explanation: >-
              A deque hands jobs out in arrival order, and 6 arrived first. The pop on line 10
              changed the heap only, not `queue`.
          - id: two
            text: '2'
            explanation: >-
              2 is the smallest, which is what the heap returned. A deque never compares jobs. It
              returns the one that has waited longest.
          - id: four
            text: '4'
            explanation: >-
              4 is the newest job, at the right end. `popleft` takes from the left end, where the
              oldest job waits.
        correct: six
        also:
          - { name: out, at: 0 }
      - line: 12
        ask: Which job does the second `heappop(heap)` hand out? Tap it.
        pointer: out
        correct: 3
        explanation: >-
          The heap now holds 6, 9 and 4. Line 11 took a 6 out of `queue`, which is a separate
          container, so the heap still has its own 6. The smallest of the three is 4.
        misses:
          - index: 0
            explanation: >-
              6 left `queue` on line 11, but the heap still holds its own 6. Even so, 4 is smaller,
              so 4 comes out.
          - index: 1
            explanation: >-
              Line 10 already removed 2 from the heap. `heappop` takes the item out; it does not
              only read it.
          - index: 2
            explanation: >-
              9 follows 2 in `jobs`, but a heap does not use list order. Of 6, 9 and 4, the
              smallest is 4.
        elsewhere: The heap holds 6, 9 and 4, so this pop returns 4.
      - line: 13
        ask: What does the second `queue.popleft()` return?
        options:
          - id: two
            text: '2'
            explanation: >-
              `queue` still holds 2, 9 and 4 in arrival order. The heap pops on lines 10 and 12
              changed only the heap, so 2 comes out next.
          - id: nine
            text: '9'
            explanation: >-
              This skips 2, as if the heap's pop had also taken it out of `queue`. Each container
              holds its own copy, and `queue` still starts with 2.
          - id: four
            text: '4'
            explanation: >-
              4 is the job the heap handed out second. A deque ignores values and returns the
              oldest job left, which is 2.
        correct: two
        also:
          - { name: out, at: 1 }

  - format: tap-cell
    id: tap-the-root
    heading: Which value is the root?
    tags: [heap, python]
    workedExample: |-
      Consider pushing `9, 6, 1, 4` into an empty `h` with `heappush`. `heappop` takes its value
      from `h[0]` and always returns the smallest, so every push has to leave the smallest value so
      far at `h[0]`.

      1. After the push of 9, `h` holds only 9, so `h[0]` is 9. The push of 6 brings a smaller value,
         so `h[0]` becomes 6.
      2. 1 is smaller than 6, so after its push `h[0]` is 1.
      3. 4 is larger than 1, so `h[0]` stays 1. After all four pushes `h` is `[1, 4, 6, 9]`, with the
         smallest value at `h[0]`, even though 9 was pushed first.
    prompt: >-
      A `heapq` heap is a plain list, and its first item, `h[0]`, is called the root. `heappop(h)`
      removes and returns the root, and it always returns the smallest item. The values below are
      pushed in order. Which of them ends up in `h[0]`? Tap it.
    code: |
      from heapq import heappush

      values = [7, 5, 11, 2, 8]
      h = []
      for x in values:
          heappush(h, x)
      print(h[0])
    sequence:
      kind: array
      name: values
      cells: [7, 5, 11, 2, 8]
    correct: 3
    explanation: >-
      Each push moves a smaller item up toward the root, so after all five pushes `h[0]` holds the
      smallest value, 2. The code prints 2.
    misses:
      - index: 0
        explanation: >-
          7 was pushed first and sat at `h[0]` only until 5 arrived. A heap keeps the smallest at
          the root, not the oldest.
      - index: 1
        explanation: >-
          5 was the root after the second push, but 2 is smaller. Once 2 was pushed, it took the
          root's place.
      - index: 2
        explanation: '11 is the largest. `heapq` builds a min-heap, so the root holds the smallest value.'
      - index: 4
        explanation: >-
          8 was pushed last, but push order does not decide the root. 8 is larger than 2, so it
          never reaches `h[0]`.

  - id: heap-list-unsorted
    heading: Is this heap broken?
    tags: [heap, python]
    workedExample: |-
      Consider pushing `6, 4, 9, 1` with `heappush`, which leaves `h = [1, 4, 9, 6]`. The heap rule
      says each item is no larger than its children, which sit at `2*i + 1` and `2*i + 2`.

      1. `h[0] = 1` has the children `h[1] = 4` and `h[2] = 9`, and 1 is no larger than either.
      2. `h[1] = 4` has one child, `h[3] = 6`, and 4 is no larger than 6. `h[2]` and `h[3]` have no
         children in a list of four.
      3. So every parent passes, and `h` is a valid heap, although 9 comes before 6 and the list is
         not sorted. `h[0]` holds the smallest, which is all `heappop` needs.
    prompt: |-
      `heapq` reads its list as a tree. The children of `h[i]` are `h[2*i + 1]` and `h[2*i + 2]`,
      and `h[i]` is their parent. The heap rule says each item is no larger than its children,
      which is what keeps the smallest item at the root, `h[0]`.

      ```python
      from heapq import heappush

      h = []
      for x in [10, 4, 12, 6, 3]:
          heappush(h, x)
      print(h)
      ```

      This prints `[3, 4, 12, 10, 6]`. Is the heap broken?
    options:
      - id: fine
        text: No, only `h[0]` has to be the smallest, and the rest is partly ordered
        explanation: >-
          The rule checks each parent against its own children: 3 against 4 and 12, and 4 against
          10 and 6. Both pass, and 12 has no children in a list of five. Nothing else has to be in
          order, so 12 may come before 10 and 6.
      - id: sorted
        text: Yes, `heappush` should keep the whole list sorted
        explanation: >-
          Keeping every item sorted would mean shifting items on each push. A heap keeps less
          order than that, and this list follows its rule.
      - id: last-largest
        text: Yes, the largest value, 12, should be at the end
        explanation: >-
          Nothing puts the largest value last. 12 sits at index 2, below the root, which the rule
          allows because 3 is smaller than 12.
      - id: push-order
        text: No, `heapq` keeps items in the order they were pushed
        explanation: >-
          The verdict is right but the reason is not. The pushes were 10, 4, 12, 6, 3, and the
          list does not keep that order: the 3 moved to the front.
    correct: fine
    followUps:
      sorted:
        prompt: >-
          `h` is `[3, 4, 12, 10, 6]`, and the children of `h[i]` sit at `2*i + 1` and `2*i + 2`.
          Which items must `h[1]`, the 4, be no larger than?
        options:
          - id: children
            text: "`h[3]` and `h[4]`, its two children"
          - id: neighbor
            text: "`h[2]`, the next cell"
          - id: everything-after
            text: Every item after it
        correct: children
        explanation: >-
          The rule compares each parent with its own children only. 4 is no larger than 10 or 6,
          so index 1 is fine, and the 12 at index 2 has no children in a five-item list.
      last-largest:
        prompt: What does the heap rule say about `h[-1]`?
        options:
          - id: below-parent
            text: Only that it is no smaller than its parent
          - id: largest
            text: It is the largest item
          - id: newest
            text: It is the item pushed last
        correct: below-parent
        explanation: >-
          The last cell is one of the bottom items, nothing more. Here it holds 6, while 12 is the
          largest and 3 was the item pushed last.
      push-order:
        prompt: The pushes were 10, 4, 12, 6, 3. Where did the 3 end up?
        options:
          - id: root
            text: At `h[0]`, because a push moves a smaller item up
          - id: end
            text: At the end, where it was appended
          - id: beside-root
            text: At `h[1]`, next to the old root
        correct: root
        explanation: >-
          `heappush` appends the item, then swaps it with its parent while it is smaller than that
          parent. 3 is smaller than every other item, so it climbs all the way to index 0.

  - id: one-pop-prediction
    heading: What does this print?
    tags: [heap, python]
    workedExample: |-
      Consider pushing `5, 9, 2` into an empty heap `h`. `heappop(h)` removes and returns the
      smallest value, while `h[0]` only reads the smallest value.

      1. The smallest of 5, 9 and 2 is 2, so `heappop(h)` returns 2, even though 2 was pushed last.
      2. The pop takes the 2 out, so `h` now holds only 5 and 9.
      3. The heap moves the smallest of those to the root, so `h[0]` is now 5.
    prompt: |-
      ```python
      from heapq import heappush, heappop

      h = []
      for x in [14, 6, 20, 9]:
          heappush(h, x)
      print(heappop(h), h[0])
      ```

      What does this print?
    options:
      - id: min-then-next
        text: "`6 9`"
        explanation: >-
          The pop removes 6. Of the three left, 14, 20 and 9, the smallest is 9, and the heap
          moves it up to `h[0]`.
      - id: fifo
        text: "`14 6`"
        explanation: >-
          This treats the heap as a queue that hands out the first value pushed. `heappop` looks at
          values, and 14 is not the smallest.
      - id: max-first
        text: "`20 14`"
        explanation: >-
          This takes the largest first. `heapq` is a min-heap, so its pops start from the other
          end.
      - id: peek
        text: "`6 6`"
        explanation: >-
          6 is the right first value, but it does not stay. Once `heappop` returns it, `h[0]`
          holds a different value.
    correct: min-then-next
    followUps:
      fifo:
        prompt: The pushes went in as 14, 6, 20, 9. What decides which value `heappop` returns?
        options:
          - id: value
            text: Which value is smallest
          - id: first
            text: Which value was pushed first
          - id: last
            text: Which value was pushed last
        correct: value
        explanation: >-
          A heap ranks its items by value. Push order only changes where items sit inside the
          list, never which one comes out.
      max-first:
        prompt: Which value does `heapq` keep at `h[0]`?
        options:
          - id: smallest
            text: The smallest value in the heap
          - id: largest
            text: The largest value in the heap
          - id: newest
            text: The value pushed most recently
        correct: smallest
        explanation: >-
          `heapq` is a min-heap. To pop the largest first, push negated values instead and negate
          what comes back.
      peek:
        prompt: What is the difference between `h[0]` and `heappop(h)`?
        options:
          - id: removes
            text: "`h[0]` only reads the smallest, while `heappop` also takes it out"
          - id: same
            text: None, both leave the heap unchanged
          - id: swapped
            text: "`h[0]` takes the smallest out, while `heappop` only reads it"
        correct: removes
        explanation: >-
          Reading `h[0]` only looks at the root. `heappop` returns the same item and removes it, so
          the heap shrinks by one and the next smallest moves to the root.

  - id: push-below-root
    heading: What does this print?
    tags: [heap, python]
    workedExample: |-
      Consider the heap `h = [2, 6, 4]` and `heappush(h, 9)`. A push appends the value, then swaps
      it with its parent for as long as it is smaller than that parent.

      1. 9 is appended at index 3, so `h` is `[2, 6, 4, 9]` and `len(h)` is 4.
      2. The children of index 1 are indices 3 and 4, so the parent of index 3 is index 1, which
         holds 6. 9 is not smaller than 6, so no swap happens.
      3. The 9 stays at index 3, so `h[0]` is still 2. The push added one item and removed nothing.
    prompt: |-
      `h` already holds a valid heap.

      ```python
      from heapq import heappush

      h = [3, 7, 4]
      heappush(h, 1)
      print(h[0], len(h))
      ```

      What does this print?
    options:
      - id: new-root
        text: "`1 4`"
        explanation: >-
          1 is appended, then swapped past 7 and then past 3, since it is smaller than each parent
          in turn. It becomes the root, and the list grows to four items.
      - id: root-fixed
        text: "`3 4`"
        explanation: >-
          The list does grow to four, but the root changes too. 1 is smaller than 3, and a pushed
          item keeps rising while it is smaller than its parent.
      - id: replaced
        text: "`1 3`"
        explanation: >-
          1 does become the root, but a push never takes anything out. The heap holds four items
          after it.
    correct: new-root
    followUps:
      root-fixed:
        prompt: Where can a pushed item end up?
        options:
          - id: anywhere-up
            text: Anywhere on its path up from the end, including the root
          - id: end
            text: Always at the end of the list
          - id: never-root
            text: Anywhere except the root, which only `heappop` changes
        correct: anywhere-up
        explanation: >-
          `heappush` appends the item and swaps it with its parent while it is smaller. A new
          smallest value climbs all the way to `h[0]`.
      replaced:
        prompt: After `heappush(h, 1)`, where is the old root, 3?
        options:
          - id: child-of-root
            text: Still in the heap, as a child of the new root
          - id: gone
            text: Gone, replaced by 1
          - id: at-end
            text: At the end of the list
        correct: child-of-root
        explanation: >-
          `heappush` only adds. 3 swaps down into the cell that 1 came through, so the heap becomes
          `[1, 3, 4, 7]`.

  - format: step-trace
    id: push-pop-trace
    heading: Predict each pop
    tags: [heap, python]
    workedExample: |-
      Consider a heap `h` that gets `8` and `5` pushed, then one pop, then a push of `2`, then a
      second pop. `heappop` returns the smallest value inside the heap at the moment it runs.

      1. The first pop sees 8 and 5, so it returns 5, and only 8 is left.
      2. Then 2 is pushed, so the heap holds 8 and 2.
      3. The second pop compares what is inside at that moment, 8 and 2, so it returns 2, the value
         pushed after the first pop. The 8 is still in `h`.
    prompt: >-
      The cells show the values in the order they are
      pushed. `out` marks the value the latest pop returned, and it starts on index 0. Predict each
      step.
    code: |
      from heapq import heappush, heappop

      pushed = [7, 3, 9, 1]
      h = []
      for x in pushed[:3]:
          heappush(h, x)
      a = heappop(h)
      heappush(h, pushed[3])
      b = heappop(h)
      c = heappop(h)
    sequence:
      kind: array
      name: pushed
      cells: [7, 3, 9, 1]
    start:
      - { name: out, at: 0 }
    steps:
      - line: 7
        ask: Which value does `a` get? Tap it.
        pointer: out
        correct: 1
        explanation: The heap holds 7, 3 and 9, and the smallest of those is 3.
        misses:
          - index: 0
            explanation: '7 was pushed first, but the heap returns the smallest of 7, 3 and 9.'
          - index: 2
            explanation: >-
              9 is the largest of the three and the last one pushed so far. Neither makes it come
              out first.
          - index: 3
            explanation: 1 is not in the heap yet. It is pushed on line 8, after this pop.
        elsewhere: The heap holds 7, 3 and 9, so `a` is 3.
      - line: 9
        ask: Which value does `b` get? Tap it.
        pointer: out
        correct: 3
        explanation: >-
          Line 8 pushed 1, so the heap holds 7, 9 and 1. A pop compares everything inside at that
          moment, and 1 is the smallest.
        misses:
          - index: 0
            explanation: >-
              7 was the smallest left after line 7, but line 8 then pushed 1. A pop compares
              everything in the heap now.
          - index: 1
            explanation: 3 left the heap on line 7.
          - index: 2
            explanation: 9 is the largest of 7, 9 and 1.
        elsewhere: The heap holds 7, 9 and 1, so `b` is 1.
      - line: 10
        ask: Which value does `c` get? Tap it.
        pointer: out
        correct: 0
        explanation: Only 7 and 9 are left, and 7 is the smaller.
        misses:
          - index: 1
            explanation: 3 was popped on line 7.
          - index: 2
            explanation: 9 is still in the heap, but 7 is smaller.
          - index: 3
            explanation: 1 was popped on line 9.
        elsewhere: Only 7 and 9 are left, so `c` is 7.
      - line: 10
        ask: What does `h` hold after line 10?
        options:
          - id: nine
            text: '`[9]`'
            explanation: Four values went in and three came out. 3, 1 and 7 are gone, so 9 is left.
          - id: empty
            text: '`[]`'
            explanation: >-
              Three pops would empty a heap of three, but line 8 pushed a fourth value. One value is
              still inside.
          - id: seven-nine
            text: '`[7, 9]`'
            explanation: '`c` already took 7 out on line 10, so only 9 is left.'
        correct: nine

  - id: largest-first-negate
    heading: What does this print?
    tags: [heap, python]
    workedExample: |-
      Consider pushing `-x` for each `x` in `4, 9, 6`, so the heap stores -4, -9 and -6. Negating
      flips the order of numbers: 9 is larger than 4, but -9 is smaller than -4.

      1. Of -4, -9 and -6, the smallest is -9, so `heappop` returns -9.
      2. Negating it again gives 9, which is the largest of 4, 9 and 6.
      3. So pushing `-x` and negating what comes back hands the numbers out largest first. The
         next two pops would give 6 and then 4.
    prompt: |-
      `heappop` always returns the smallest item. A common way to pop the largest first, which
      works on every Python version, stores each number negated:

      ```python
      from heapq import heappush, heappop

      h = []
      for x in [8, 3, 11, 5]:
          heappush(h, -x)
      print(-heappop(h))
      ```

      What does it print?
    options:
      - id: eleven
        text: "`11`"
        explanation: >-
          The heap holds -8, -3, -11 and -5, and the smallest of those is -11. `heappop` returns
          -11, and the minus sign in the `print` turns it back into 11, the largest number pushed.
      - id: three
        text: "`3`"
        explanation: >-
          3 is what a heap of the plain numbers would pop first. Here the heap stores -3, which is
          the largest stored value, so it would come out last.
      - id: minus-eleven
        text: "`-11`"
        explanation: >-
          -11 is what `heappop` returns, but the code negates it again before printing, and
          `-(-11)` is 11.
      - id: eight
        text: "`8`"
        explanation: >-
          8 was pushed first, but a heap ignores push order. It pops the smallest stored value,
          which is -11.
    correct: eleven
    followUps:
      three:
        prompt: The heap stores -8, -3, -11 and -5. Which of them does `heappop` return first?
        options:
          - id: minus-eleven
            text: '-11, the smallest, which stands for the largest number'
          - id: minus-three
            text: '-3, since 3 was the smallest number pushed'
          - id: minus-eight
            text: '-8, since it was stored first'
        correct: minus-eleven
        explanation: >-
          Negating flips the order: the larger a number, the smaller its negation. The heap still
          pops the smallest stored value, and that is now the negation of the largest number.
      minus-eleven:
        prompt: "`heappop(h)` returns -11. What does `-heappop(h)` give?"
        options:
          - id: eleven
            text: 11, since the second minus undoes the first
          - id: still-negative
            text: '-11, since the value prints as it was stored'
          - id: error
            text: An error, since a function call cannot be negated
        correct: eleven
        explanation: >-
          The minus in front of the call negates whatever the call returns. The stored value was
          negated once on the way in, so negating once more on the way out restores the number.
      eight:
        prompt: "-8 was stored first. Does that make it the first value out?"
        options:
          - id: smallest-out
            text: No, `heappop` returns the smallest stored value, -11
          - id: first-out
            text: Yes, the first value stored is the first one out
          - id: root-forever
            text: Yes, the first value stored stays at the root
        correct: smallest-out
        explanation: >-
          Push order only changes where items sit in the list. Each `heappop` compares the stored
          values and returns the smallest, so the root changes whenever a smaller value arrives.
