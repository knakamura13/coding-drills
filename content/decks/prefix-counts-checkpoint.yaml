id: prefix-counts-checkpoint
title: "Prefix counts: checkpoint"
description: Count the subarrays with a given sum on new inputs where prefix sums repeat or return to 0. Most items combine the Prefix counts skills.
heading: Which one is right?

questions:
  - id: checkpoint-zero-sum-count
    heading: What does it return?
    tags: [prefix-sum, hash-map, python]
    prompt: |-
      ```python
      def count_subarrays(nums, k):
          seen = {0: 1}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total

      count_subarrays([3, 0, -2, -1, 5, -5], 0)
      ```

      What does the call return?
    options:
      - id: right
        text: '4'
        explanation: >-
          The prefix sums, empty prefix first, are 0, 3, 3, 1, 0, 5, 0. With `k` at 0 every pair
          of equal prefix sums is one subarray. The two 3s give the lone 0, and the three 0s give
          three pairs: `nums[0:4]`, `nums[0:6]` and `nums[4:6]`.
      - id: distinct
        text: '3'
        explanation: How many times does each prefix sum appear?
      - id: no-seed
        text: '2'
        explanation: Which subarrays start at index 0?
      - id: self-match
        text: '10'
        explanation: Does a pass ever find the prefix sum it is about to store?
    correct: right
    followUps:
      distinct:
        prompt: >-
          The prefix sum 0 appears three times: as the empty prefix, after index 3 and after
          index 5. How many subarrays summing to 0 do those three make?
        options:
          - id: three
            text: Three, one for each pair of them
          - id: two
            text: Two, one for each repeat
          - id: one
            text: One, since they are the same prefix sum
        correct: three
        explanation: >-
          Any two equal prefix sums mark a subarray between them that sums to 0. Three equal
          prefix sums make three pairs, so the count has to know how many times each prefix sum
          appeared.
      no-seed:
        prompt: A version that starts with `seen = {}` returns 2 here. Which subarrays does it miss?
        options:
          - id: from-start
            text: '`nums[0:4]` and `nums[0:6]`, the two from index 0'
          - id: lone-zero
            text: The 0 at index 1, `nums[1:2]`
          - id: none
            text: None of them, since `k` is 0
        correct: from-start
        explanation: >-
          A subarray from index 0 subtracts the empty prefix. Without the starting entry `0: 1`,
          those subarrays have nothing to match, even when `k` is 0.
      self-match:
        prompt: If the line that stores `p` ran before the lookup, what would each pass find when `k` is 0?
        options:
          - id: own
            text: Its own prefix sum too, so each pass adds one too many
          - id: earlier
            text: Only earlier prefix sums, as before
          - id: nothing
            text: Nothing, since the store and the lookup use different keys
        correct: own
        explanation: >-
          With `k` at 0, the key `p - k` is `p` itself. Storing first means every pass matches
          the empty subarray ending at itself, which adds 6 here. Looking up before storing
          avoids it.

  - id: checkpoint-zero-prefix-subarrays
    heading: Which subarrays does it count?
    tags: [prefix-sum, hash-map, python]
    prompt: |-
      ```python
      def count_subarrays(nums, k):
          seen = {0: 1}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total

      nums = [5, -4, -1, 0, 5, -3]
      count_subarrays(nums, 2)
      ```

      Which subarrays does the call count?
    options:
      - id: right
        text: '`nums[0:6]`, `nums[3:6]` and `nums[4:6]`'
        explanation: >-
          The prefix sums, empty prefix first, are 0, 5, 1, 0, 0, 5, 2. Only the last pass finds
          a match: 2 - 2 is 0, and 0 has been seen three times. Each 0 starts one subarray that
          ends at the last value.
      - id: no-seed
        text: '`nums[3:6]` and `nums[4:6]`'
        explanation: Is the whole list a subarray that sums to 2?
      - id: once
        text: '`nums[0:6]` only'
        explanation: How many earlier prefix sums equal 0?
      - id: overshoot
        text: None, since the sum passes 2 on the first value
        explanation: Can a negative value bring a sum back down?
    correct: right
    followUps:
      no-seed:
        prompt: The whole list sums to 2. Which earlier prefix sum does that subarray subtract?
        options:
          - id: empty
            text: The empty prefix, 0, from the starting entry
          - id: first
            text: The prefix sum after the first value, 5
          - id: none
            text: None, a subarray over the whole list is never counted
        correct: empty
        explanation: >-
          A subarray from index 0 subtracts the sum of no values. The starting entry `0: 1` is
          that prefix sum, so the last pass finds it along with the two later 0s.
      once:
        prompt: On the last pass the prefix sum is 2, and three earlier prefix sums are 0. How many subarrays end there with sum 2?
        options:
          - id: three
            text: Three, one per earlier 0
          - id: one
            text: One, since the three prefix sums are equal
          - id: two
            text: Two, the 0s after values, not the empty one
        correct: three
        explanation: >-
          Each earlier 0 sits at a different index, so each starts a different subarray. The count
          keeps how many times a prefix sum appeared, and that number is what the pass adds.
      overshoot:
        prompt: The values can be negative. Once a subarray's sum passes 2, can a longer subarray still sum to 2?
        options:
          - id: yes
            text: Yes, later negative values can bring it back down
          - id: no
            text: No, a sum only grows as a subarray gets longer
          - id: zero-only
            text: Only if the next value is 0
        correct: yes
        explanation: >-
          5, then -4 and -1, brings the prefix sum back to 0, and later values reach 2 again.
          Counting with prefix sums does not depend on the values being positive.

  - id: checkpoint-longer-match-start
    format: tap-cell
    heading: Tap where the longer subarray starts
    tags: [prefix-sum, hash-map]
    prompt: >-
      On its last pass, `count_subarrays(nums, 2)` adds 2 to `total`, because two subarrays that
      end at the last value sum to 2. Tap the first value of the longer one.
    code: |
      def count_subarrays(nums, k):
          seen = {0: 1}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total

      count_subarrays([2, -3, 3, 3, -1], 2)
    sequence:
      kind: array
      name: nums
      cells: [2, -3, 3, 3, -1]
    correct: 1
    explanation: >-
      The prefix sums are 0, 2, -1, 2, 5, 4. On the last pass 4 - 2 is 2, which appeared after
      index 0 and after index 2. The earlier copy starts the subarray at index 1:
      -3 + 3 + 3 + -1 is 2.
    misses:
      - index: 0
        explanation: >-
          The whole list sums to 4. A subarray from index 0 matches the empty prefix, and the last
          pass looks for the prefix sum 2.
      - index: 2
        explanation: '3 + 3 + -1 is 5. That subarray subtracts the prefix sum -1, not a 2.'
      - index: 3
        explanation: >-
          `nums[3:5]` does sum to 2, but it starts after the second 2. The longer subarray starts
          after the first one.
      - index: 4
        explanation: The -1 alone sums to -1. That subarray subtracts the prefix sum 5.

  - id: checkpoint-missing-seed
    heading: Which input exposes the bug?
    tags: [prefix-sum, hash-map, python]
    prompt: |-
      This version starts `seen` empty instead of `{0: 1}`:

      ```python
      def count_subarrays(nums, k):
          seen = {}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total
      ```

      With `k = 3`, on which input does it return the wrong count?
    options:
      - id: from-start
        text: '`[-1, 4, 2]`'
        explanation: >-
          `[-1, 4]` sums to 3 and starts at index 0, so the pass after the 4 needs the empty
          prefix. This version never stored a 0, so it returns 0 instead of 1.
      - id: later-range
        text: '`[5, 3, -2]`'
        explanation: Which earlier prefix sum does the one subarray here subtract?
      - id: zero-total
        text: '`[2, -2, 4]`'
        explanation: Does any subarray here sum to 3?
      - id: two-ranges
        text: '`[-2, 1, 3, -1]`'
        explanation: Where do the subarrays that sum to 3 start?
    correct: from-start
    followUps:
      later-range:
        prompt: The only subarray summing to 3 here is `[3]`. Which earlier prefix sum does it subtract?
        options:
          - id: five
            text: 5, which a pass has already stored
          - id: empty
            text: 0, the empty prefix
          - id: eight
            text: 8, the prefix sum after the 3
        correct: five
        explanation: >-
          The subarray starts at index 1, after the 5. A pass stores that prefix sum, so the empty
          `seen` does not matter and both versions return 1.
      zero-total:
        prompt: The prefix sum is 0 after two values. Does any subarray of `[2, -2, 4]` sum to 3?
        options:
          - id: none
            text: No, so both versions return 0
          - id: after-zero
            text: Yes, the subarray after the 0 prefix sum
          - id: whole
            text: Yes, the whole list
        correct: none
        explanation: >-
          The subarrays sum to 2, -2, 4, 0, 2 and 4. A prefix sum of 0 partway through is stored
          like any other, so the missing starting entry costs nothing here.
      two-ranges:
        prompt: '`[3]` and `[1, 3, -1]` both sum to 3. Which subarrays does the missing `0: 1` affect?'
        options:
          - id: from-start
            text: Only subarrays that start at index 0
          - id: every
            text: Every subarray the function should count
          - id: zero-sum
            text: Only subarrays that sum to 0
        correct: from-start
        explanation: >-
          Both subarrays here start after an earlier prefix sum that a pass stores, -2 or -1, so
          both versions return 2. Only a subarray from index 0 needs the empty prefix.

  - id: checkpoint-pick-count-method
    heading: Which approach fits?
    tags: [prefix-sum, hash-map, complexity]
    prompt: >-
      Count the subarrays of a list that add up to exactly `k`. The values may be negative. For
      `[6, -2, 4]` and `k = 4`, the answer is 2, from `[6, -2]` and `[4]`. Which approach gives
      the right count in O(n) time on average?
    options:
      - id: all-pairs
        text: Build the prefix sum list, then test every pair of its entries
        explanation: >-
          The count comes out right, since each pair of entries marks one subarray. But a list of
          n + 1 entries has about n²/2 pairs, so testing them all takes O(n²) time.
      - id: prefix-set
        text: Keep the prefix sum so far and a set of the prefix sums seen
        explanation: >-
          A set can say that an earlier prefix sum `p - k` exists, but not how many times it
          appeared. On `[2, -2, 0]` with `k = 0` the answer is 3, and this approach finds 2, even
          when the set starts as `{0}`.
      - id: prefix-counts-unseeded
        text: Keep the prefix sum so far and a dictionary of counts that starts empty
        explanation: >-
          Counting is right, but an empty start misses every subarray that begins at index 0. For
          `[4]` with `k = 4`, the prefix sum 4 needs an earlier prefix sum of 0, which was never
          stored, so the count comes out 0 instead of 1.
      - id: prefix-counts-seeded
        text: "Keep the prefix sum so far and a dictionary of counts that starts as `{0: 1}`"
        explanation: >-
          Let `p` be the prefix sum so far. Add the count stored under `p - k` to the answer, then
          add one to the count stored under `p`. The starting entry stands for the empty prefix,
          so subarrays from index 0 count. Each pass makes a fixed number of dictionary reads and
          writes, each one step on average, so the scan takes O(n) time on average, and negative
          values do no harm.
    correct: prefix-counts-seeded
    followUps:
      all-pairs:
        prompt: A prefix sum list for n values has n + 1 entries. About how many pairs of entries does it have?
        options:
          - id: half-square
            text: About n²/2, one per subarray
          - id: linear
            text: About n, one per value
          - id: double
            text: About 2n, two per value
        correct: half-square
        explanation: >-
          n + 1 entries make n(n + 1)/2 pairs, and each pair marks one subarray. The dictionary
          finds every match for one entry with a single lookup instead.
      prefix-set:
        prompt: Why must the dictionary store counts instead of only which prefix sums have appeared?
        options:
          - id: repeated-prefix
            text: Several starts can share one prefix sum, and each gives a separate subarray ending here
          - id: no-negatives-in-sets
            text: A set cannot hold negative prefix sums, so it would break on negative input
          - id: set-forgets-order
            text: A set does not remember the order in which prefix sums appeared
        correct: repeated-prefix
        explanation: >-
          On `[2, -2, 0]` with `k = 0` the prefix sums are 0 (empty), 2, 0, 0. At the last value,
          0 has been seen twice before, so the dictionary adds 2 while a set seeded with `{0}`
          adds only 1. Over the whole list that is 3 against 2. Sets hold negative numbers fine,
          and order is not what is missing.
      prefix-counts-unseeded:
        prompt: "What does the starting entry `{0: 1}` stand for?"
        options:
          - id: empty-prefix
            text: The empty prefix before the first value, so subarrays from index 0 can be counted
          - id: zero-sum-exists
            text: A promise that some subarray sums to 0
          - id: avoid-keyerror
            text: A default that keeps the lookup from raising `KeyError`
        correct: empty-prefix
        explanation: >-
          A subarray that starts at index `i` and ends here sums to `p - prefix[i]`. When `i` is
          0, the earlier prefix sum is the empty prefix, 0, and without the entry it is never
          found. Looking up with `.get` already avoids a `KeyError`, but it still misses those
          subarrays.

  - id: checkpoint-debug-short-prefix
    heading: Which call does it fail on?
    tags: [prefix-sum, python]
    prompt: |-
      A suggested solution builds a prefix sum list, where `prefix[t]` is the sum of the first
      `t` values, and uses it to sum `nums[i]` through `nums[j]`, both included. One detail is
      slightly off:

      ```python
      def sum_between(nums, i, j):
          prefix = [0] * len(nums)
          for t in range(1, len(nums)):
              prefix[t] = prefix[t - 1] + nums[t - 1]
          return prefix[j + 1] - prefix[i]

      nums = [4, -1, 3, 5, -2]
      ```

      Which call fails?
    options:
      - id: last-value
        text: '`sum_between(nums, 3, 4)`'
        explanation: >-
          The list has 5 entries, `prefix[0]` to `prefix[4]`, one too few: the sum of all five
          values never gets an entry. This call ends at the last value, so it reads `prefix[5]`
          and raises `IndexError`. The list needs `len(nums) + 1` entries, filled by
          `range(1, len(nums) + 1)`.
      - id: from-zero
        text: '`sum_between(nums, 0, 2)`'
        explanation: >-
          `prefix[0]` is 0, the empty prefix, so a sum from index 0 subtracts nothing extra. The
          call returns `prefix[3] - prefix[0]`, which is 6, and 4 + -1 + 3 is 6.
      - id: middle
        text: '`sum_between(nums, 1, 3)`'
        explanation: >-
          The call reads `prefix[4]` and `prefix[1]`, which are 11 and 4, and returns 7. That is
          -1 + 3 + 5, so it is right.
      - id: single
        text: '`sum_between(nums, 2, 2)`'
        explanation: >-
          The call reads `prefix[3]` and `prefix[2]`, which are 6 and 3, and returns 3, the value
          of `nums[2]`. That is right.
    correct: last-value
    followUps:
      from-zero:
        prompt: What does `prefix[0]` hold in this version?
        options:
          - id: zero
            text: 0, the sum of the first 0 values
          - id: first
            text: 4, the first value
          - id: unset
            text: Nothing, since the loop never writes it
        correct: zero
        explanation: >-
          The list starts as all zeros and the loop starts at `t = 1`, so `prefix[0]` keeps its 0,
          the empty prefix. The entry this version lacks is at the other end.
      middle:
        prompt: Which call reads an entry the list does not have?
        options:
          - id: last-j
            text: One whose `j` is 4, the last index, since it reads `prefix[5]`
          - id: zero-i
            text: One whose `i` is 0, since it reads `prefix[0]`
          - id: equal
            text: One whose `i` equals `j`, since it reads two neighbors
        correct: last-j
        explanation: >-
          `prefix[j + 1]` exists only while `j + 1` is at most 4, the last index of a 5-entry
          list. A full prefix sum list has one more entry than `nums`, for the sum of all of it.
      single:
        prompt: How many entries does a full prefix sum list for 5 values have?
        options:
          - id: six
            text: Six, one more than the values
          - id: five
            text: Five, one per value
          - id: four
            text: Four, one per gap between values
        correct: six
        explanation: >-
          One entry for the empty prefix and one after each value makes six. This version builds
          five, so the sum through the last value has no entry, and only a call that ends there
          fails.
