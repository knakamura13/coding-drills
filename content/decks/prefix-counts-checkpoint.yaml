id: prefix-counts-checkpoint
title: "Prefix counts: checkpoint"
description: Count ranges with a signed sum on new inputs where running totals repeat or return to 0. Each item combines the Prefix counts skills.
heading: Which one is right?

questions:
  - id: checkpoint-zero-sum-count
    heading: What does it return?
    tags: [prefix-sum, hash-map, python]
    prompt: |-
      ```python
      def count_ranges(nums, k):
          seen = {0: 1}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total

      count_ranges([3, 0, -2, -1, 5, -5], 0)
      ```

      What does the call return?
    options:
      - id: right
        text: '4'
        explanation: >-
          The running totals, empty prefix first, are 0, 3, 3, 1, 0, 5, 0. With `k` at 0 every
          pair of equal totals is one range. The two 3s give the lone 0, and the three 0s give
          three pairs: `nums[0:4]`, `nums[0:6]` and `nums[4:6]`.
      - id: distinct
        text: '3'
        explanation: How many times does each total appear?
      - id: no-seed
        text: '2'
        explanation: Which ranges start at index 0?
      - id: self-match
        text: '10'
        explanation: Does a pass ever find the total it is about to store?
    correct: right
    followUps:
      distinct:
        prompt: >-
          The total 0 appears three times: as the empty prefix, after index 3 and after index 5.
          How many ranges summing to 0 do those three make?
        options:
          - id: three
            text: Three, one for each pair of them
          - id: two
            text: Two, one for each repeat
          - id: one
            text: One, since they are the same total
        correct: three
        explanation: >-
          Any two equal totals mark a range between them that sums to 0. Three equal totals make
          three pairs, so the count has to know how many times each total appeared.
      no-seed:
        prompt: A version that starts with `seen = {}` returns 2 here. Which ranges does it miss?
        options:
          - id: from-start
            text: '`nums[0:4]` and `nums[0:6]`, the two from index 0'
          - id: lone-zero
            text: The 0 at index 1, `nums[1:2]`
          - id: none
            text: None of them, since `k` is 0
        correct: from-start
        explanation: >-
          A range from index 0 subtracts the empty prefix. Without the starting entry `0: 1`,
          those ranges have nothing to match, even when `k` is 0.
      self-match:
        prompt: If the line that stores `p` ran before the lookup, what would each pass find when `k` is 0?
        options:
          - id: own
            text: Its own total too, so each pass adds one too many
          - id: earlier
            text: Only earlier totals, as before
          - id: nothing
            text: Nothing, since the store and the lookup use different keys
        correct: own
        explanation: >-
          With `k` at 0, the key `p - k` is `p` itself. Storing first means every pass matches
          the empty range ending at itself, which adds 6 here. Looking up before storing avoids it.

  - id: checkpoint-zero-totals-ranges
    heading: Which ranges does it count?
    tags: [prefix-sum, hash-map, python]
    prompt: |-
      ```python
      def count_ranges(nums, k):
          seen = {0: 1}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total

      nums = [5, -4, -1, 0, 5, -3]
      count_ranges(nums, 2)
      ```

      Which ranges does the call count?
    options:
      - id: right
        text: '`nums[0:6]`, `nums[3:6]` and `nums[4:6]`'
        explanation: >-
          The totals, empty prefix first, are 0, 5, 1, 0, 0, 5, 2. Only the last pass finds a
          match: 2 - 2 is 0, and 0 has been seen three times. Each 0 starts one range that ends
          at the last value.
      - id: no-seed
        text: '`nums[3:6]` and `nums[4:6]`'
        explanation: Is the whole list a range that sums to 2?
      - id: once
        text: '`nums[0:6]` only'
        explanation: How many earlier totals equal 0?
      - id: overshoot
        text: None, since the total overshoots 2 on the first value
        explanation: Can a negative value bring a sum back down?
    correct: right
    followUps:
      no-seed:
        prompt: The whole list sums to 2. Which earlier total does that range subtract?
        options:
          - id: empty
            text: The empty prefix, 0, from the starting entry
          - id: first
            text: The total after the first value, 5
          - id: none
            text: None, a range over the whole list is never counted
        correct: empty
        explanation: >-
          A range from index 0 subtracts the total of no values. The starting entry `0: 1` is that
          total, so the last pass finds it along with the two later 0s.
      once:
        prompt: On the last pass the total is 2, and three earlier totals are 0. How many ranges end there with sum 2?
        options:
          - id: three
            text: Three, one per earlier 0
          - id: one
            text: One, since the three totals are equal
          - id: two
            text: Two, the 0s after values, not the empty one
        correct: three
        explanation: >-
          Each earlier 0 sits at a different index, so each starts a different range. The count
          keeps how many times a total appeared, and that number is what the pass adds.
      overshoot:
        prompt: The values can be negative. Once a running sum passes 2, can a longer range still sum to 2?
        options:
          - id: yes
            text: Yes, later negative values can bring it back down
          - id: no
            text: No, a sum only grows as a range gets longer
          - id: zero-only
            text: Only if the next value is 0
        correct: yes
        explanation: >-
          5, then -4 and -1, brings the total back to 0, and later values reach 2 again. Prefix
          counts never shrink a window, so they handle signed values.

  - id: checkpoint-longer-match-start
    format: tap-cell
    heading: Tap where the longer range starts
    tags: [prefix-sum, hash-map]
    prompt: >-
      On its last pass, `count_ranges(nums, 2)` adds 2 to `total`, because two ranges that end at
      the last value sum to 2. Tap the first value of the longer one.
    code: |
      def count_ranges(nums, k):
          seen = {0: 1}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total

      count_ranges([2, -3, 3, 3, -1], 2)
    sequence:
      kind: array
      name: nums
      cells: [2, -3, 3, 3, -1]
    correct: 1
    explanation: >-
      The totals are 0, 2, -1, 2, 5, 4. On the last pass 4 - 2 is 2, which appeared after index 0
      and after index 2. The earlier copy starts the range at index 1: -3 + 3 + 3 + -1 is 2.
    misses:
      - index: 0
        explanation: >-
          The whole list sums to 4. A range from index 0 matches the empty prefix, and the last
          pass looks for the total 2.
      - index: 2
        explanation: '3 + 3 + -1 is 5. That range subtracts the total -1, not a 2.'
      - index: 3
        explanation: >-
          `nums[3:5]` does sum to 2, but it starts after the second 2. The longer range starts
          after the first one.
      - index: 4
        explanation: The -1 alone sums to -1. That range subtracts the total 5.

  - id: checkpoint-missing-seed
    heading: Which input exposes the bug?
    tags: [prefix-sum, hash-map, python]
    prompt: |-
      This version starts `seen` empty instead of `{0: 1}`:

      ```python
      def count_ranges(nums, k):
          seen = {}
          p = 0
          total = 0
          for x in nums:
              p += x
              total += seen.get(p - k, 0)
              seen[p] = seen.get(p, 0) + 1
          return total
      ```

      With `k = 3`, on which input does it return the wrong count?
    options:
      - id: from-start
        text: '`[-1, 4, 2]`'
        explanation: >-
          `[-1, 4]` sums to 3 and starts at index 0, so the pass after the 4 needs the empty
          prefix. This version never stored a 0, so it returns 0 instead of 1.
      - id: later-range
        text: '`[5, 3, -2]`'
        explanation: Which earlier total does the one range here subtract?
      - id: zero-total
        text: '`[2, -2, 4]`'
        explanation: Does any range here sum to 3?
      - id: two-ranges
        text: '`[-2, 1, 3, -1]`'
        explanation: Where do the ranges that sum to 3 start?
    correct: from-start
    followUps:
      later-range:
        prompt: The only range summing to 3 here is `[3]`. Which earlier total does it subtract?
        options:
          - id: five
            text: 5, which a pass has already stored
          - id: empty
            text: 0, the empty prefix
          - id: eight
            text: 8, the total after the 3
        correct: five
        explanation: >-
          The range starts at index 1, after the 5. A pass stores that total, so the empty `seen`
          does not matter and both versions return 1.
      zero-total:
        prompt: The total is 0 after two values. Does any range of `[2, -2, 4]` sum to 3?
        options:
          - id: none
            text: No, so both versions return 0
          - id: after-zero
            text: Yes, the range after the 0 total
          - id: whole
            text: Yes, the whole list
        correct: none
        explanation: >-
          The ranges sum to 2, -2, 4, 0, 2 and 4. A total of 0 partway through is stored like
          any other, so the missing starting entry costs nothing here.
      two-ranges:
        prompt: '`[3]` and `[1, 3, -1]` both sum to 3. Which ranges does the missing `0: 1` affect?'
        options:
          - id: from-start
            text: Only ranges that start at index 0
          - id: every
            text: Every range the function should count
          - id: zero-sum
            text: Only ranges that sum to 0
        correct: from-start
        explanation: >-
          Both ranges here start after an earlier total that a pass stores, -2 or -1, so both
          versions return 2. Only a range from index 0 needs the empty prefix.
