      - line: 13
        ask: The pass with `c` at 5 runs. What does `print(row)` show?
        options:
          - id: three
            text: '[1, 3, 3, 4, 0, 3]'
            explanation: >-
              `row[5]` is `above[5] + row[4]`, which is 3 + 0. All 3 paths to the corner come from
              above.
          - id: seven
            text: '[1, 3, 3, 4, 0, 7]'
            explanation: >-
              7 reaches past the block to add `row[3]`. A move right comes only from `row[4]`, the
              block's 0.
          - id: zero
            text: '[1, 3, 3, 4, 0, 0]'
            explanation: >-
              A block to the left cuts off only the move from the left. `(2, 5)` is still entered from
