  - id: grid-review-diagonal-cell
    heading: What goes in the cell?
    tags: [dp, grid]
    prompt: |-
      Each move goes one cell right, one cell down, or one cell diagonally down and to the right.
      `#` is blocked. The path counts are filled up to `?`.

      ```
      grid         ways so far
      . . # . .     1 1 0 0 0
      . . . . .     1 3 4 4 4
      . . . . .     1 5 ?
      ```

      What is `ways[2][2]`?
    options:
      - id: three-sum
        text: 12, the sum of above, left and up-left (4 + 5 + 3)
        explanation: >-
          A path's last move into `(2, 2)` is down, right or diagonal, so it comes from `(1, 2)`,
          `(2, 1)` or `(1, 1)`. The groups add: 4 + 5 + 3 = 12.
      - id: two-sum
        text: 9, the sum of above and left (4 + 5)
        explanation: >-
          That leaves out the paths whose last move is the diagonal from `(1, 1)`. Those 3 paths
          reach `(2, 2)` too.
      - id: four-sum
        text: 16, the sum of above, left, up-left and up-right
        explanation: >-
          The up-right cell `(1, 3)` would need a move down and to the left, which is not allowed.
          Only three cells feed `(2, 2)`.
      - id: product
        text: 60, the product of above, left and up-left (4 x 5 x 3)
        explanation: >-
          Each path arrives by exactly one last move, so the three groups do not combine with each
          other. They add.
    correct: three-sum
    followUps:
      two-sum:
        prompt: A path's last move into `(2, 2)` is the diagonal. Where did it start that move?
        options:
          - { id: up-left, text: "`(1, 1)`, one row up and one column left" }
          - { id: counted, text: "`(1, 2)`, so it is already in the 4 above" }
          - { id: nowhere, text: "Nowhere new, since a diagonal is a right plus a down" }
        correct: up-left
        explanation: >-
          A diagonal is one move, so the path never visits `(1, 2)` or `(2, 1)` on the way. Its count
          comes from `(1, 1)` and has to be added.
      four-sum:
        prompt: Can a walker on `(1, 3)` reach `(2, 2)` in one move?
        options:
          - { id: no, text: "No, from there the column would have to drop by one" }
          - { id: yes, text: "Yes, a diagonal move from the row above" }
          - { id: above, text: "Yes, since it sits in the row directly above" }
        correct: no
        explanation: >-
          From `(1, 3)` to `(2, 2)` the column goes down, so the move points left. The allowed moves,
          undone, give exactly three cells.
      product:
        prompt: Why do the three counts add rather than multiply?
        options:
          - { id: alternatives, text: "Each path ends with exactly one of the three moves, so the groups are separate" }
          - { id: independent, text: "The three moves are independent choices made one after another" }
          - { id: same, text: "They multiply on larger grids and add only on small ones" }
        correct: alternatives
        explanation: >-
          Counts of separate groups add. Multiplying counts the ways to pick one item from each group,
          which is not what a last move is.
