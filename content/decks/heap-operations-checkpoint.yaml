id: heap-operations-checkpoint
title: "Heap operations: checkpoint"
description: Compare ways to build a heap or repair tied entries, on new inputs. Each item combines tracing a sift, the cost of a build, and ordering ties.
heading: What does the heap do?

questions:
  - id: checkpoint-heapify-then-pop
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heapify, heappop

      x = [15, 9, 6, 12, 3, 11, 5]
      heapify(x)
      heappop(x)
      print(x)
      ```

      What does this print?
    options:
      - id: traced
        text: "`[5, 9, 6, 12, 15, 11]`"
        explanation: >-
          `heapify` sifts index 2 (6 swaps with 5), index 1 (9 swaps with 3), then the root (15
          swaps with 3, then with 9). The pop removes 3 and moves the last item, 6, to the root,
          where it swaps with its smaller child, 5.
      - id: pushed
        text: "`[5, 6, 9, 15, 12, 11]`"
        explanation: Check which heap `heapify` builds before the pop. Seven pushes would build a different one.
      - id: sorted
        text: "`[5, 6, 9, 11, 12, 15]`"
        explanation: Check which cells the pop's sift moves.
      - id: unsifted
        text: "`[6, 9, 5, 12, 15, 11]`"
        explanation: Check whether the item moved to the root is no larger than its children.
    correct: traced
    followUps:
      pushed:
        prompt: Which list does `heapify` build from `[15, 9, 6, 12, 3, 11, 5]`?
        options:
          - id: bottom-up
            text: "`[3, 9, 5, 12, 15, 11, 6]`"
          - id: by-pushes
            text: "`[3, 6, 5, 15, 12, 11, 9]`"
          - id: sorted-list
            text: "`[3, 5, 6, 9, 11, 12, 15]`"
        correct: bottom-up
        explanation: >-
          `heapify` sifts the parents at indices 2, 1 and 0 down. Pushing the values one at a
          time sifts each one up instead and builds `[3, 6, 5, 15, 12, 11, 9]`, another valid heap.
          The pop then starts from a different list.
      sorted:
        prompt: Which cells can one `heappop` change?
        options:
          - id: one-path
            text: One path from the root, plus the last cell
          - id: every-cell
            text: Every cell, so the list ends up sorted
          - id: root-only
            text: Only the root, where the last item lands
        correct: one-path
        explanation: >-
          The pop moves the last item to the root, which empties the last cell, and sifts it down
          one path. Here only index 0 and
          index 2 change, so the 9 stays ahead of the 6 and the list is not sorted.
      unsifted:
        prompt: The pop has moved the 6 from the end to the root. Its children are 9 and 5. What happens?
        options:
          - id: swaps-five
            text: The 6 swaps with the 5, the smaller child
          - id: done
            text: Nothing, since the pop is finished
          - id: swaps-nine
            text: The 6 swaps with the 9, the left child
        correct: swaps-five
        explanation: >-
          A sift down swaps with the smaller child while that child is smaller. The 5 moves up to
          the root, and the 6 lands on index 2, whose only child, 11, is larger.

  - id: checkpoint-repair-ties
    heading: Which entry fixes it?
    tags: [heap, python]
    prompt: |-
      ```python
      from heapq import heappush

      def post(h, story):  # story is a dict with "headline", "tier" and "section"
          heappush(h, (story["tier"], story["headline"], story))
      ```

      A lower tier must pop first (tier 1 is the front page), and within a tier the newest story
      first. Headlines can repeat. Posting two tier-1 stories both headlined `"Storm"`, for
      different sections, raised `TypeError`. A tier-2 `"Rates"` posted after a tier-2
      `"Budget"` also popped after it. With `seq = itertools.count()` made once, which entry
      fixes both?
    options:
      - id: counter
        text: '`(story["tier"], -next(seq), story)`'
        explanation: >-
          The tier stays as it is, since `heapq` already pops the smallest. The negated counter
          replaces the headline: it never repeats, so the dicts are never compared, and it
          shrinks with each post, so the newest story in a tier pops first.
      - id: name-then-counter
        text: '`(story["tier"], story["headline"], -next(seq), story)`'
        explanation: Check what decides between `"Rates"` and `"Budget"`.
      - id: no-negate
        text: '`(story["tier"], next(seq), story)`'
        explanation: Check which of two stories in one tier gets the smaller counter.
      - id: identity
        text: '`(-story["tier"], -next(seq), story)`'
        explanation: Check which tier `heapq` pops first with this entry.
    correct: counter
    followUps:
      name-then-counter:
        prompt: 'With the headline before the counter, what decides between tier-2 `"Rates"` and `"Budget"`?'
        options:
          - id: names
            text: The headlines, so `"Budget"` pops first despite being older
          - id: counter
            text: The counter, so `"Rates"` pops first
          - id: raises
            text: Nothing, since the comparison raises `TypeError`
        correct: names
        explanation: >-
          The counter only matters when the headlines tie too. It fixes the crash for two
          `"Storm"` stories but leaves each tier in alphabetical order, not newest first.
      no-negate:
        prompt: 'Tier-2 `"Budget"` draws 0 from `next(seq)` and `"Rates"` draws 1. Which pops first?'
        options:
          - id: older
            text: '`"Budget"`, the older story, since 0 < 1'
          - id: newer
            text: '`"Rates"`, since a later post wins a tie'
          - id: either
            text: Either one, since the counter only stops the crash
        correct: older
        explanation: >-
          A min-heap pops the smaller counter, which belongs to the earlier post. Negating it
          makes each later post smaller, so the newest story in a tier comes out first.
      identity:
        prompt: '`heapq` pops the smallest entry. With `-story["tier"]` first, which tier comes out first?'
        options:
          - id: highest
            text: The highest tier number, the least prominent stories
          - id: lowest
            text: Tier 1, the front page
          - id: newest
            text: The newest story, since the counter decides
        correct: highest
        explanation: >-
          Negating turns the largest tier number into the smallest value. Tier 1 is already the
          smallest number, so the tier has to stay as it is.

  - format: tap-cell
    id: checkpoint-heapify-index-one
    heading: Which value lands at x[1]?
    tags: [heap, python]
    prompt: >-
      After `heapify(x)`, which value sits at `x[1]`? The cells show `x` before the call. Tap the
      cell where that value starts.
    code: |
      from heapq import heapify

      x = [16, 15, 10, 13, 5, 6, 7]
      heapify(x)
      print(x[1])
    sequence:
      kind: array
      name: x
      cells: [16, 15, 10, 13, 5, 6, 7]
    correct: 3
    explanation: >-
      Index 2 sifts first: 10 swaps with 6. Then index 1: 15 swaps with 5. Then the root: 16 swaps
      with 5 and then with 13, its smaller new child. The heap is `[5, 13, 6, 16, 15, 10, 7]`, so
      `x[1]` is 13.
    misses:
      - index: 0
        explanation: 16 starts at the root and sinks. It ends at index 3.
      - index: 1
        explanation: 15 starts at index 1, but its own sift moves it down to index 4.
      - index: 2
        explanation: >-
          Pushing the values one at a time would put 10 at index 1. `heapify` sifts parents down
          instead, and 10 ends at index 5.
      - index: 4
        explanation: 5 is the smallest, so it ends at the root, index 0.
      - index: 5
        explanation: >-
          6 is the second smallest, but a heap does not put the second smallest at index 1. It only
          has to be a child of the root, and 6 ends at index 2.
      - index: 6
        explanation: 7 is never swapped. Index 2 sifts with the smaller child, the 6, so 7 stays at index 6.

  - id: checkpoint-next-tied-pop
    heading: What does this print?
    tags: [heap, python]
    prompt: |-
      ```python
      import itertools
      from heapq import heappush, heappop

      seq = itertools.count()
      h = []
      for urgency, name in [(2, "scan"), (5, "fix"), (2, "email"), (5, "audit"), (5, "pay")]:
          heappush(h, (-urgency, next(seq), name))
      print(heappop(h)[2])
      ```

      What does this print?
    options:
      - id: fix
        text: "`fix`"
        explanation: >-
          The negated urgencies make the three urgency-5 jobs the smallest entries. They tie on
          `-5`, so the counter decides, and `fix` was pushed first of the three, with 1.
      - id: audit
        text: "`audit`"
        explanation: Check which item follows the urgency in each entry.
      - id: pay
        text: "`pay`"
        explanation: Check whether a larger counter value pops before a smaller one.
      - id: scan
        text: "`scan`"
        explanation: Check what the minus sign does to urgency 5 and urgency 2.
    correct: fix
    followUps:
      audit:
        prompt: 'The entries for `fix` and `audit` are `(-5, 1, "fix")` and `(-5, 3, "audit")`. What decides between them?'
        options:
          - id: counter
            text: The counter values, 1 and 3, since the urgencies tie
          - id: names
            text: The names, since `"audit"` comes first alphabetically
          - id: list-order
            text: Nothing, so either can come out
        correct: counter
        explanation: >-
          The name is the third item. The comparison stops at the second, the counter, because 1
          and 3 already differ, so the names never take part.
      pay:
        prompt: 'Which is smaller, `(-5, 1, "fix")` or `(-5, 4, "pay")`?'
        options:
          - id: fix
            text: '`(-5, 1, "fix")`, since 1 < 4'
          - id: pay
            text: '`(-5, 4, "pay")`, since it was pushed last'
          - id: equal
            text: Neither, since they tie on urgency
        correct: fix
        explanation: >-
          A min-heap pops the smallest entry, and the counter grows with each push. Among tied
          urgencies the oldest entry comes out first.
      scan:
        prompt: After negation, which is smaller, urgency 5 or urgency 2?
        options:
          - id: five
            text: Urgency 5, stored as -5, which is less than -2
          - id: two
            text: Urgency 2, since 2 is less than 5
          - id: same
            text: Neither, since negation keeps the order
        correct: five
        explanation: >-
          Negation reverses the order, so the most urgent jobs hold the smallest numbers and
          `heapq` pops them first.

  - id: checkpoint-build-for-arrivals
    heading: Which build fits each job?
    tags: [heap, complexity]
    prompt: |-
      Two jobs each need a min-heap of up to `n` numbers:

      - Job A: all `n` numbers are already in a list before any is read out.
      - Job B: numbers arrive one at a time, and the smallest is popped between arrivals.

      Which choice does the least work in the worst case?
    options:
      - id: heapify-then-push
        text: "A: `heapify` once, O(n). B: `heappush` each arrival, O(log n) each"
        explanation: >-
          A has every number up front, so one bottom-up build costs O(n), where `n` pushes could
          cost O(n log n). B already has a heap when each number arrives, so a push moves only the
          new item along one path.
      - id: push-both
        text: "A and B: `heappush` each number, O(log n) each"
        explanation: Check what `n` pushes cost in A, where the whole list is already there.
      - id: heapify-both
        text: "A and B: `heapify`, which for B means again after each arrival"
        explanation: Check what one `heapify` costs when only one number is new.
      - id: swapped
        text: "A: `heappush` each number. B: `heapify` after each arrival"
        explanation: Check which job has every number before the first pop.
    correct: heapify-then-push
    followUps:
      push-both:
        prompt: In A, all `n` numbers are in the list from the start. What do `n` pushes cost against one `heapify`?
        options:
          - id: log-vs-linear
            text: O(n log n) for the pushes against O(n) for `heapify`
          - id: same
            text: O(n log n) for both, since each item can move log n levels
          - id: pushes-cheaper
            text: O(n) for the pushes against O(n log n) for `heapify`
        correct: log-vs-linear
        explanation: >-
          Each push can climb every level, so in the worst case `n` pushes cost O(n log n). The
          bottom-up build gives most items short sifts near the bottom, which adds up to O(n).
      heapify-both:
        prompt: B's heap holds `n` numbers and one more arrives. What does a fresh `heapify` cost against one push?
        options:
          - id: linear-vs-log
            text: O(n), since it sifts every parent again, against O(log n) for the push
          - id: both-log
            text: O(log n) for both, since only one number is new
          - id: heapify-free
            text: O(1) for `heapify`, since the list is nearly a heap already
        correct: linear-vs-log
        explanation: >-
          `heapify` does not know which number is new, so it visits all the parents again. Over
          `n` arrivals that is O(n²), against O(n log n) for one push per arrival.
      swapped:
        prompt: Which job has every number in hand before the first pop?
        options:
          - id: job-a
            text: A, so it can build once from the whole list
          - id: job-b
            text: B, since its numbers arrive in order
          - id: both
            text: Both, since each ends with `n` numbers
        correct: job-a
        explanation: >-
          A one-time build fits a list that is complete before it is read. B has to be a valid heap
          after every arrival, which is what a push keeps for O(log n).

  - id: checkpoint-debug-sift-child
    heading: Which call does it fail on?
    tags: [heap, python]
    prompt: |-
      A suggested `sift_down` should swap `h[i]` with its smaller child for as long as that child
      is smaller. `and` stops at its first false part, so `h[c]` is read only when `c < n`. One
      detail is slightly off:

      ```python
      def sift_down(h, i):
          n = len(h)
          while True:
              small = i
              for c in (2 * i + 1, 2 * i + 2):
                  if c < n and h[c] < h[i]:
                      small = c
              if small == i:
                  return
              h[i], h[small] = h[small], h[i]
              i = small
      ```

      In each list below, only the root is out of place. After `sift_down(h, 0)`, which list
      breaks the heap rule?
    options:
      - id: left-smaller
        text: "`h = [9, 2, 5]`"
        explanation: >-
          Both children, 2 and 5, are smaller than 9. Each child is compared with `h[i]`, not with
          the smallest so far, so the 5 replaces the 2 as `small`, and the 9 swaps with 5. `h`
          becomes `[5, 2, 9]`, with 5 above the smaller 2. Comparing with `h[small]` would pick
          the 2.
      - id: right-smaller
        text: "`h = [9, 5, 2]`"
        explanation: >-
          Both children are smaller than 9, and the right one, 2, is checked last, so it ends up as
          `small`. It is also the smaller child, so `h` becomes `[2, 5, 9]`, which is right.
      - id: one-smaller
        text: "`h = [6, 8, 1]`"
        explanation: >-
          Only the right child, 1, is smaller than 6, so it is the only one that can become
          `small`. `h` becomes `[1, 8, 6]`, which is right.
      - id: two-swaps
        text: "`h = [7, 3, 8, 4]`"
        explanation: >-
          At each step only one child is smaller than the 7: first the 3, then the 4. `h` becomes
          `[3, 4, 8, 7]`, which is right.
    correct: left-smaller
    followUps:
      right-smaller:
        prompt: "In `[9, 5, 2]`, which child does the loop leave in `small`?"
        options:
          - id: right
            text: The right child, 2, which is also the smaller one
          - id: left
            text: The left child, 5, since it is checked first
          - id: neither
            text: Neither, since the loop stops at the first smaller child
        correct: right
        explanation: >-
          Both children pass the test, so the later one, index 2, is kept. Here the later child is
          also the smaller, so the slip does no harm.
      one-smaller:
        prompt: "In `[6, 8, 1]`, how many children are smaller than the root?"
        options:
          - id: one
            text: One, the 1, so `small` can only be that child
          - id: two
            text: Two, the 8 and the 1
          - id: none
            text: None, so nothing moves
        correct: one
        explanation: >-
          The slip matters only when both children are smaller than `h[i]` and the left one is the
          smaller. With one candidate there is nothing to get wrong.
      two-swaps:
        prompt: "In `[7, 3, 8, 4]`, is the 7 ever larger than both of its children at once?"
        options:
          - id: never
            text: No, it has one smaller child at the root and one at index 1
          - id: at-root
            text: Yes, at the root, where its children are 3 and 8
          - id: at-one
            text: Yes, at index 1, where its children are 4 and 8
        correct: never
        explanation: >-
          At the root, only the 3 is smaller than 7. At index 1 the only child is the 4. The slip
          needs two smaller children, so this list comes out right.
