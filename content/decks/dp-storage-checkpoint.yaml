id: dp-storage-checkpoint
title: "DP: saving space (checkpoint)"
description: Choose between memoization, a table and rolling variables, weigh what one row costs, and repair a one-row update. Each item combines the skills of saving space.
heading: Which one is right?

questions:
  - id: storage-exam-sparse-states
    heading: Which storage fits?
    tags: [dp, recursion, complexity]
    prompt: |-
      ```python
      def f(n):
          if n == 0:
              return 1
          return f(n // 2) + f(n // 3)
      ```

      `f(10**6)` is needed once. Which way to compute it does the least work, and why?
    options:
      - id: memo
        text: Memoization, since only values reachable from n by `// 2` and `// 3` are computed
        explanation: >-
          Repeated halving and thirding reach few distinct values: 108 for `n = 10**6`, and the
          deepest chain is 21 calls. A cache runs each body once. A table from 0 up would fill
          1,000,001 entries, almost none of which the answer uses.
      - id: table
        text: A bottom-up table, since it avoids call overhead and computes each value once
        explanation: >-
          A table from 0 to `n` computes every value, and here almost every one is wasted: the
          answer depends on only 108 of them. Avoiding calls does not make up for a million
          entries.
      - id: rolling
        text: Two rolling variables, since each value reads only two others
        explanation: >-
          Rolling variables need reads a fixed distance back. `n // 2` and `n // 3` are far from
          `n`, and the distance grows with `n`, so no fixed number of recent entries holds them.
      - id: neither
        text: Neither works well, since the recursion is about `n` calls deep before it returns
        explanation: >-
          Each call divides `n` by at least 2, so a chain is about log₂ n deep: 21 calls for a
          million. Depth stays small, and the cache keeps the work small too.
    correct: memo
    followUps:
      table:
        prompt: >-
          A dense bottom-up table fills every index from 0 to `n`. For `n = 10**6`, how many values
          does it compute, against the cache?
        options:
          - id: million-vs-few
            text: 1,000,001 against 108
          - id: same
            text: 108 against 108
          - id: fewer
            text: 21 against 108
        correct: million-vs-few
        explanation: >-
          A dense table fills every index, read or not. A cache computes only the states a call
          reaches, and here those are sparse. A table could fill only the reachable states, but it
          would first have to find them by walking `// 2` and `// 3` from `n`, which the recursion
          already does.
      rolling:
        prompt: For `n = 10**6`, how far back from `n` is the read `f(n // 2)`?
        options:
          - id: half
            text: 500,000 positions, and the gap grows as `n` grows
          - id: two
            text: Two positions, like the Fibonacci look-back
          - id: one
            text: One position, since it is the previous call
        correct: half
        explanation: >-
          Rolling variables keep a fixed number of recent entries. When the look-back grows with
          `n`, no fixed number of entries covers it.
      neither:
        prompt: How deep is the longest chain of calls from `f(10**6)`?
        options:
          - id: log
            text: About 20, since each call at least halves `n`
          - id: n
            text: About a million, one per value
          - id: sqrt
            text: About a thousand, the square root of `n`
        correct: log
        explanation: >-
          The chain `f(n // 2)`, `f(n // 4)`, ... reaches 0 after about log₂ n steps. Stack depth
          follows the length of a chain, not the size of `n`.

  - id: storage-exam-tap-subset
    format: tap-cell
    heading: Where does the row go wrong?
    tags: [dp, python]
    prompt: >-
      `can[s]` is 1 when some of the numbers seen so far, each used at most once, add up to `s`.
      The row below holds the result for the numbers `[3]`. A pass now adds the number 2, going
      **left to right**. Tap the first sum that ends as 1 though no choice from `[3, 2]` makes it.
    code: |
      x = 2
      for s in range(x, len(can)):
          can[s] = can[s] or can[s - x]
    sequence: { kind: array, name: can, cells: [1, 0, 0, 1, 0, 0, 0, 0] }
    correct: 4
    explanation: >-
      At `s = 4` the loop reads `can[2]`, which this pass already set to 1 using the 2. So 4 is
      marked as 2 + 2, the number used twice. The only sums of `[3, 2]` are 0, 2, 3 and 5. Right to
      left reads only the old row and gives `[1, 0, 1, 1, 0, 1, 0, 0]`.
    misses:
      - index: 0
        explanation: >-
          The loop starts at `s = 2`, so `can[0]` is never written. The empty choice makes 0, so 1
          is right.
      - index: 1
        explanation: >-
          `can[1]` is never written, and no choice makes 1. 0 is right.
      - index: 2
        explanation: >-
          `can[2]` reads `can[0]`, which this pass never writes, so it becomes 1, the 2 alone. That
          is right.
      - index: 3
        explanation: >-
          `can[3]` was already 1, from the 3. It stays 1, and that is right.
      - index: 5
        explanation: >-
          `can[5]` reads `can[3]`, which this pass left at 1, and becomes 1: 3 + 2. That is right.
      - index: 6
        explanation: >-
          `can[6]` is wrong too, built from the wrong `can[4]`, but the loop wrote a wrong value at
          `s = 4` first.
      - index: 7
        explanation: >-
          `can[7]` is wrong too, as 3 + 2 + 2, but the loop wrote a wrong value at `s = 4` first.

  - id: storage-exam-choose-rolling
    heading: Which version fits?
    tags: [dp, complexity]
    prompt: |-
      A strip of length `n` is covered with tiles of length 1 and 3, and `dp[i]` counts the ways:

      ```python
      dp = [1, 1, 1]
      for i in range(3, n + 1):
          dp.append(dp[i - 1] + dp[i - 3])
      return dp[n]
      ```

      `n` can reach a million, and only `dp[n]` is needed. The counts grow large, but treat each
      stored count as one unit of space and each addition as one step. Which version fits best?
    options:
      - id: three-vars
        text: A loop that keeps the last three values, in O(n) time and O(1) extra space
        explanation: >-
          The farthest read is `dp[i - 3]`, so the entries from `i - 3` to `i - 1` are all that a
          later step can read. Three variables hold them, and the time stays O(n).
      - id: two-vars
        text: A loop that keeps two values, `dp[i - 1]` and `dp[i - 3]`, since those are read
        explanation: >-
          `dp[i - 2]` is not read now, but it is the next step's `dp[i - 3]`. Dropping it loses a
          value that is still ahead, so the loop must keep three.
      - id: memo
        text: Memoized recursion, in O(n) time, since the cache keeps only what is needed
        explanation: >-
          The time is O(n), but `@cache` keeps every value it computes, and the first chain of
          calls is about `n` frames deep. That is O(n) space in two places, and a chain of a
          million calls is far past CPython's default limit of 1000.
      - id: full-table
        text: The full table, since `dp[i - 3]` skips over `dp[i - 2]`
        explanation: >-
          A skipped index does not force a full table. Nothing older than `i - 3` is read again, so
          keeping three values is enough.
    correct: three-vars
    followUps:
      two-vars:
        prompt: Which step reads today's `dp[i - 2]`?
        options:
          - id: next
            text: The next one, as its `dp[(i + 1) - 3]`
          - id: never
            text: None, since no step reads two back
          - id: last
            text: Only the last step
        correct: next
        explanation: >-
          An entry stays needed until the farthest look-back has passed it. With a look-back of 3,
          every one of the last three entries is read now or soon.
      memo:
        prompt: How does memoized recursion's extra space compare with a three-variable loop?
        options:
          - id: on-vs-o1
            text: O(n) for the cache and about `n` stack frames, against O(1)
          - id: same
            text: The same, O(1), since each call reads three values
          - id: smaller
            text: Smaller, since the cache skips states it does not need
        correct: on-vs-o1
        explanation: >-
          Here every value from 0 to `n` is reachable, so the cache keeps them all, and the stack
          holds the first chain of calls. The loop drops what no later step reads.
      full-table:
        prompt: After `dp[50]` is computed, which later step reads `dp[46]`?
        options:
          - id: none
            text: None, since the next step reaches back only to `dp[48]`
          - id: next
            text: "`dp[51]`, since it reads every earlier entry"
          - id: last
            text: "`dp[n]`, at the end"
        correct: none
        explanation: >-
          Each step reaches back at most three. Once the loop is past `dp[49]`, `dp[46]` is never
          read again.

  - id: storage-exam-triangle-direction
    heading: Which loop header is right?
    tags: [dp, python]
    prompt: |-
      A walk goes from the top of a number triangle to its bottom row, stepping to the same index or
      the next index one row down, and adds every number it passes. One list `row` replaces the
      table. When row `r` starts, `row[c]` holds the cheapest total to reach `(r - 1, c)`.

      ```python
      row = [tri[0][0]]
      for r in range(1, len(tri)):
          row.append(row[-1] + tri[r][r])
          for c in ???:
              row[c] = tri[r][c] + min(row[c - 1], row[c])
          row[0] += tri[r][0]
      return min(row)
      ```

      Which header is correct?
    options:
      - id: high-to-low
        text: "`c` from `r - 1` down to 1, since each cell needs the old values at `c - 1` and `c`"
        explanation: >-
          Both reads belong to the row above. Going right to left, `row[c - 1]` is written only
          after `row[c]`, so it still holds the old value when read. On
          `[[3], [7, 1], [7, 1, 5], [1, 5, 3, 2]]` it returns 8, as the full table does.
      - id: low-to-high
        text: "`c` from 1 up to `r - 1`, since the left neighbor has to be up to date first"
        explanation: >-
          Left to right, after the first iteration, `row[c - 1]` already holds this row's value,
          which is a sideways step the walk cannot take. On `[[3], [7, 1], [7, 1, 5], [1, 5, 3, 2]]`
          it returns 10, where the answer is 8.
      - id: either
        text: Either direction, since each write reads only entries of the row above
        explanation: >-
          The reads are meant to be the row above, but in one list that holds only for entries not
          yet rewritten. Left to right reads a rewritten `row[c - 1]` after the first iteration, and
          returns 10 instead of 8
          on `[[3], [7, 1], [7, 1, 5], [1, 5, 3, 2]]`.
      - id: two-rows
        text: No order works; a second list is needed, since both reads come from the row above
        explanation: >-
          A second list would work, but one is enough. Right to left reaches `c` before `c - 1`, so
          both reads still hold the row above.
    correct: high-to-low
    followUps:
      low-to-high:
        prompt: >-
          Going left to right on row 3, the loop writes `row[1]` and then `row[2]`. What does
          `row[1]` hold when `row[2]` is written?
        options:
          - id: new
            text: Row 3's total at index 1, a cell the walk cannot step from
          - id: old
            text: Row 2's total at index 1, which the walk needs
          - id: copy
            text: A copy saved before the inner loop
        correct: new
        explanation: >-
          `row[1]` was rewritten one iteration earlier. Only the first iteration of a row reads an
          old `row[c - 1]`, since `row[0]` is updated after the loop. A step comes from the row above, so every
          interior cell needs old values on both sides, and only right to left keeps `c - 1` old.
      either:
        prompt: >-
          In one list, which entries still hold the row above while `row[c]` is being written?
        options:
          - id: not-yet
            text: Only those the loop has not reached yet in this row
          - id: all
            text: All of them, until the row is finished
          - id: none
            text: None, since the list holds one row
        correct: not-yet
        explanation: >-
          Every write replaces an old value. Whether a read gets the old or new value depends on
          whether the loop has passed that index, so the direction matters.
      two-rows:
        prompt: Going right to left, what does `row[c - 1]` hold when `row[c]` is written?
        options:
          - id: old
            text: The row above's total at `c - 1`
          - id: new
            text: The current row's total at `c - 1`
          - id: lost
            text: The current row's total at `c`
        correct: old
        explanation: >-
          From right to left, every read at `c - 1` and `c` happens before that index is
          rewritten. One list holds both rows correctly at the moment each is read.

  - id: storage-exam-coin-cache-depth
    heading: What is the cost?
    tags: [dp, recursion, complexity]
    prompt: >-
      The fewest coins that pay amount `n`, with `k` coin values, is computed two ways: a
      recursion with `@cache` on `fewest(a)`, which tries every coin as the last one, and a loop
      that fills a table `fewest[0]` to `fewest[n]` from 0 up. The smallest coin is 1 and the
      recursion tries it first. `k` may grow with the input, and Python's default limit of 1000
      live calls applies. Which statement is correct?
    options:
      - id: exponential-memo
        text: The cached recursion is exponential in `n`, since every call branches `k` ways
        explanation: >-
          The cache runs each amount's body once, so the branching happens once per amount, not
          once per route. Without the cache, coins 1, 7 and 10 already make 4,409 calls for
          `n = 30`. With it, `n + 1` amounts each try `k` coins.
      - id: linear-only
        text: Both take O(n) time, since each of the `n + 1` amounts is computed once
        explanation: >-
          Computing one amount tries every coin as its last one, which is `k` steps, so the time
          is O(n·k). With coins 1, 7 and 10 and `n = 300`, the table makes 900 coin tries.
      - id: no-depth-limit
        text: Both take O(n·k) time, and neither nears the limit, since the cache cuts calls short
        explanation: >-
          Nothing is cached until a call returns, and coin 1 is tried first, so the first chain
          goes `n`, `n - 1`, and so on down to 0 before any call returns. With coins 1, 7 and 10,
          `n = 1000` raises `RecursionError`, while the table finishes.
      - id: both-nk-limit
        text: Both take O(n·k) time; only the recursion raises `RecursionError` once `n` nears 1000
        explanation: >-
          There are `n + 1` amounts, each computed once with `k` coin tries, in either version.
          The loop makes no calls. The recursion's first chain has about `n` live calls before
          anything returns, so with coins 1, 7 and 10 it runs at `n = 998` and raises
          `RecursionError` at `n = 1000`.
    correct: both-nk-limit
    followUps:
      exponential-memo:
        prompt: With `@cache`, how many times does the body of `fewest(20)` run?
        options:
          - { id: once, text: "Once; every later call with 20 returns the stored value" }
          - { id: per-route, text: "Once for every route of coins that reaches 20" }
          - { id: k-times, text: "`k` times, once from each coin" }
        correct: once
        explanation: >-
          A repeated amount is a lookup. The work is the number of distinct amounts times the
          coins tried for each, `n + 1` times `k`.
      linear-only:
        prompt: With coins 1, 7 and 10 and `n = 300`, how many coin tries does the table make?
        options:
          - { id: nine-hundred, text: "900, three tries for each of the 300 amounts" }
          - { id: three-hundred, text: "300, one for each amount" }
          - { id: three-oh-three, text: "303, the 300 amounts plus the 3 coins" }
        correct: nine-hundred
        explanation: >-
          Each amount tries every coin, so the work is amounts times coins. `k` counts as a
          constant only when it cannot grow, and here it can.
      no-depth-limit:
        prompt: When the cached `fewest(n)` starts, how many calls are live before the first one returns?
        options:
          - { id: about-n, text: "About `n`, since coin 1 sends each call to `fewest(a - 1)` first" }
          - { id: two, text: "Two, since the cache answers the rest" }
          - { id: k, text: "`k`, one for each coin" }
        correct: about-n
        explanation: >-
          A value is stored only when its call returns, so the first chain runs from `n` down to
          0 with nothing cached. That chain is what passes the limit of 1000.

  - id: storage-exam-row-cost
    heading: What does one row cost?
    tags: [dp, grid, complexity]
    prompt: |-
      The cheapest walk on a grid of `R` rows and `C` columns moves right or down and pays for
      every cell it stands on. One list `row` of `C` entries replaces the `R x C` table.

      ```python
      row = [0] * C
      row[0] = grid[0][0]
      for c in range(1, C):
          row[c] = row[c - 1] + grid[0][c]
      for r in range(1, R):
          row[0] += grid[r][0]
          for c in range(1, C):
              row[c] = grid[r][c] + min(row[c], row[c - 1])
      return row[C - 1]
      ```

      Which statement gives its time and its extra space?
    options:
      - id: rc-and-c
        text: O(R·C) time and O(C) extra space
        explanation: >-
          Every cell of the grid still gets one total, `R` rows of `C` entries, so the time is
          O(R·C). Only `row` is kept, `C` entries, so the extra space drops from O(R·C) to O(C).
      - id: c-and-c
        text: O(C) time and O(C) extra space, since the list has only `C` entries
        explanation: >-
          The list is overwritten once per row of the grid, and each write is a computed total.
          Keeping fewer entries saves memory, not work, so the time stays O(R·C).
      - id: rc-and-one
        text: O(R·C) time and O(1) extra space, since each total reads only two entries
        explanation: >-
          Each total reads two entries, but the next row reads every entry of this one, the cell
          above for each column. So all `C` entries stay, O(C).
      - id: rc-and-rc
        text: O(R·C) time and O(R·C) extra space, since every cell gets a total
        explanation: >-
          Every cell gets a total, but each one overwrites the total of the cell above it, which
          no later step reads. The list never holds more than `C` entries.
    correct: rc-and-c
    followUps:
      c-and-c:
        prompt: Over the whole run, how many totals does the loop compute?
        options:
          - { id: rc, text: "R·C, one for each cell of the grid" }
          - { id: c, text: "C, one for each entry of the list" }
          - { id: r-plus-c, text: "R + C, one for each row and column" }
        correct: rc
        explanation: >-
          Each row pass rewrites all `C` entries, and there are `R` rows. Time counts every write;
          space counts what is held at once.
      rc-and-one:
        prompt: While row `r` is filled, which entries of `row` will a later step still read?
        options:
          - { id: all, text: "All `C` of them, as the cells above the next row" }
          - { id: two, text: "Only `row[c]` and `row[c - 1]`" }
          - { id: none, text: "None, since each row is finished before the next" }
        correct: all
        explanation: >-
          The next row reads the cell above at every column, so no entry can be dropped. The two
          reads for one cell move along the whole row.
      rc-and-rc:
        prompt: When `row[c]` is rewritten for row `r`, which old value does it lose?
        options:
          - { id: above, text: "The total for `(r - 1, c)`, which no later step reads" }
          - { id: left, text: "The total for `(r, c - 1)`, which the next column needs" }
          - { id: start, text: "The total for the start cell" }
        correct: above
        explanation: >-
          The cell above is read for the last time in this very line. Overwriting it loses
          nothing, so one row of totals is all the loop holds.

  - id: storage-exam-debug-blocked-cell
    heading: Which call goes wrong?
    tags: [dp, grid, python]
    prompt: |-
      A suggested solution counts the paths from the top-left cell to the bottom-right cell that
      move right or down and never enter a cell marked `#`. One list `row` replaces the table, and
      each pass rewrites it, left to right, into the next row.

      ```python
      def paths(grid):
          C = len(grid[0])
          row = [1] + [0] * (C - 1)
          for r in range(len(grid)):
              for c in range(C):
                  if grid[r][c] == '#':
                      continue
                  if c > 0:
                      row[c] += row[c - 1]
          return row[C - 1]
      ```

      Which call returns a wrong count?
    options:
      - id: under-open
        text: '`paths(["...", ".#.", "..."])`'
        explanation: >-
          It returns 4, but the answer is 2. On row 1 the `#` is skipped, so `row[1]` keeps the 1
          it held on row 0, where a blocked cell should hold 0. The cells to its right and below
          then add paths through the block.
      - id: under-block
        text: '`paths([".#..", ".#..", "...."])`'
        explanation: >-
          It returns 1, which is right. The `#` on row 1 is skipped, but `row[1]` still holds 0
          from the `#` above it, which is what a blocked cell needs.
      - id: top-row
        text: '`paths(["..#.", "....", "...."])`'
        explanation: >-
          It returns 7, which is right. The only `#` is on row 0, where `row[2]` starts at 0 and
          stays 0 when the cell is skipped.
      - id: under-unreached
        text: '`paths([".#..", "..#.", "...."])`'
        explanation: >-
          It returns 2, which is right. No path reaches `(0, 2)`, so `row[2]` holds 0 when the `#`
          below it is skipped.
    correct: under-open
    followUps:
      under-block:
        prompt: When the loop skips a `#`, what does that entry of `row` hold afterward?
        options:
          - { id: above, text: "The count for the cell above, left over from the last pass" }
          - { id: zero, text: "0, since a skipped entry is cleared" }
          - { id: left, text: "The count for the cell to the left" }
        correct: above
        explanation: >-
          Skipping writes nothing, so the entry keeps the row above's count. That is harmless only
          when the cell above holds 0, as it does under another `#`.
      top-row:
        prompt: A skipped `#` keeps the row above's count. Which skipped cells does that make wrong?
        options:
          - { id: reached-above, text: "Those with paths into the cell above them" }
          - { id: every, text: "Every `#`, wherever it is" }
          - { id: last-row, text: "Only a `#` on the last row" }
        correct: reached-above
        explanation: >-
          On row 0 every entry after the first starts at 0, and under a cell no path reaches the
          entry is 0 too. Apart from a blocked start, a `#` goes wrong only under a cell with a
          count above 0.
      under-unreached:
        prompt: "In `[\".#..\", \"..#.\", \"....\"]`, how many paths reach `(0, 2)`?"
        options:
          - { id: zero, text: "None, since the `#` at `(0, 1)` blocks the only way along row 0" }
          - { id: one, text: "One, straight along row 0" }
          - { id: two, text: "Two, from the left and from above" }
        correct: zero
        explanation: >-
          A cell on row 0 is reached only from its left. The `#` at `(0, 1)` cuts that off, so
          `row[2]` is 0 when the `#` at `(1, 2)` is skipped, and the count stays right.
