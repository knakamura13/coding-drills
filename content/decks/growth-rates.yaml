id: growth-rates
title: Growth rates
description: Count a loop's steps, compare how counts grow, name the growth in Big-O, and account for memory. Each card asks for one decision, with a worked example on hand.
heading: How many steps?

questions:
  - id: count-one-loop
    heading: What does this print?
    tags: [complexity, python]
    workedExample: |-
      This path predicts how much work code does as its input grows, before anyone runs it on a
      large input. The first tool is a count: run the loop on a small input and count its passes.
      Consider `for i in range(4): steps += 1`, with `steps` starting at 0. `range(4)` starts at 0,
      adds 1 each time, and stops just before its stop value, 4.

      1. Starting at 0 and adding 1, `i` takes 0, 1, 2 and 3.
      2. The next value would be 4, which is not below the stop value 4, so the range ends after 3.
      3. The body runs once for each of the 4 values in step 1, so `steps` ends at 4.
    prompt: |-
      A pass is one run of a loop's body.

      ```python
      steps = 0
      for i in range(1, 9, 3):
          steps += 1
      print(steps)
      ```

      What does it print?
    options:
      - id: right
        text: '3'
        explanation: >-
          `i` takes 1, 4 and 7. The next value would be 10, which is not below 9, so the body runs
          three times.
      - id: ignores-step
        text: '8'
        explanation: >-
          Eight values lie from 1 up to 8, but the loop does not visit each of them. It jumps from
          1 to 4 to 7.
      - id: stop-value
        text: '9'
        explanation: >-
          9 is the stop value in `range(1, 9, 3)`, not a count of passes. The count depends on the
          start and the step as well.
      - id: one-past
        text: '4'
        explanation: >-
          That counts a fourth pass with `i = 10`. The values are 1, 4 and 7, and the range ends
          there.
    correct: right
    followUps:
      ignores-step:
        prompt: What does the third argument of `range(1, 9, 3)` do?
        options:
          - id: step
            text: It makes each value 3 more than the one before
          - id: repeat
            text: It repeats each value 3 times
          - id: passes
            text: It sets how many passes the loop makes
        correct: step
        explanation: >-
          The third argument is the step. `range(1, 9, 3)` produces 1, 4 and 7, so a step of 3
          leaves out two numbers between passes.
      stop-value:
        prompt: In `range(start, stop, step)`, what is the stop value?
        options:
          - id: excluded
            text: A limit the values stop short of
          - id: count
            text: The number of values the range produces
          - id: last
            text: The last value the loop runs with
        correct: excluded
        explanation: >-
          A range keeps producing values while they are below the stop, and the stop itself is never
          produced. `range(1, 9, 3)` never even lands on 9. Only `range(stop)`, which starts at 0
          with a step of 1, has exactly `stop` values.
      one-past:
        prompt: The values so far are 1, 4 and 7. Why is there no pass with `i = 10`?
        options:
          - id: not-below
            text: 10 is not below the stop value 9
          - id: three-max
            text: A loop with a step of 3 runs at most three times
          - id: multiple
            text: 10 is not a multiple of 3
        correct: not-below
        explanation: >-
          A range ends as soon as its next value would reach or pass the stop. After 7 comes 10,
          which is past 9, so 7 is the last pass.

  - id: trace-halving-chips
    format: step-trace
    heading: Predict each step
    tags: [complexity, python]
    workedExample: |-
      Consider a pile of `n = 4` chips. Each halving keeps half the pile, `n = n // 2`, and halving
      stops once one chip is left.

      1. The pile starts at 4, which is more than 1, so it halves: `4 // 2` is 2. That is one
         halving.
      2. 2 is still more than 1, so it halves again: `2 // 2` is 1. That is the second halving.
      3. The pile is now 1, so halving stops. Getting from 4 chips to 1 took 2 halvings.
    prompt: >-
      The loop below keeps half of a pile of 16 chips on each pass until one chip is left, and
      `n // 2` divides by 2 and rounds down. The row shows the pile sizes in order, not a Python
      list. Predict each step before it is shown.
    code: |
      n = 16
      halvings = 0
      while n > 1:
          n = n // 2
          halvings += 1
    sequence:
      kind: array
      name: pile
      cells: [16, 8, 4, 2, 1]
    start:
      - { name: n, at: 0 }
    steps:
      - line: 3
        ask: Where is `n` after two passes?
        pointer: n
        correct: 2
        explanation: The first pass halves 16 to 8, and the second halves 8 to 4.
        misses:
          - index: 1
            explanation: That is the pile after one pass. The second pass halves 8 again.
          - index: 3
            explanation: That takes three passes. Each pass divides `n` by 2 once.
        elsewhere: Each pass divides `n` by 2 once, so after two passes it has gone 16, 8, 4.
      - line: 3
        ask: How many times does `halvings += 1` run before the loop ends?
        options:
          - id: four
            text: '4'
            explanation: >-
              16 goes to 8, 4, 2 and 1, which is four halvings. Then `n > 1` is false and the loop
              stops.
          - id: five
            text: '5'
            explanation: >-
              Five pile sizes appear, 16 through 1, but a halving is a move between two of them.
              Five sizes have four moves between them.
          - id: eight
            text: '8'
            explanation: >-
              8 is the size of the pile after the first halving, not a count. Each pass halves the
              pile, which shrinks it far faster than taking one chip away.
          - id: three
            text: '3'
            explanation: >-
              That stops at a pile of 2. The test is `n > 1`, and 2 is greater than 1, so one more
              pass runs.
        correct: four
        also:
          - { name: n, at: 4 }
      - line: 3
        ask: How many times is the test `n > 1` checked in all?
        options:
          - id: five
            text: '5'
            explanation: >-
              It is true four times, at 16, 8, 4 and 2, and false once, at 1. That last check is
              what ends the loop.
          - id: four
            text: '4'
            explanation: >-
              That counts only the checks that pass. A `while` loop checks its test once more after
              the last pass, and that check fails.
          - id: sixteen
            text: '16'
            explanation: >-
              The test runs once per pass, plus one final check. The pile halves on each pass, so
              there are far fewer than 16 passes.
        correct: five

  - id: count-triangle
    heading: What does this print?
    tags: [complexity, python]
    workedExample: |-
      Consider `for i in range(3):` with `for j in range(2): steps += 1` inside it, and `steps`
      starting at 0. A loop nested inside another starts over on every pass of the outer loop.

      1. The outer loop runs 3 times, once each for `i` = 0, 1 and 2.
      2. On each of those passes the inner loop starts over and runs 2 times, for `j` = 0 and 1. Its
         range does not use `i`, so every pass adds the same 2 steps.
      3. So `steps` ends at 2 + 2 + 2, which is 3 × 2 = 6.
    prompt: |-
      Here the inner loop's range depends on `i`:

      ```python
      n = 5
      steps = 0
      for i in range(n):
          for j in range(i):
              steps += 1
      print(steps)
      ```

      What does it print?
    options:
      - id: right
        text: '10'
        explanation: >-
          The inner loop runs `i` times on each pass, so the passes add 0, 1, 2, 3 and 4. That
          totals 10.
      - id: square
        text: '25'
        explanation: >-
          5 × 5 treats the inner loop as `range(n)`. Here it is `range(i)`, so early passes run it
          fewer times.
      - id: inclusive
        text: '15'
        explanation: >-
          15 is 1 + 2 + 3 + 4 + 5, which counts one extra inner pass on every outer pass. The
          inner range stops before `i`.
      - id: one-per-pass
        text: '5'
        explanation: >-
          That counts one step per outer pass. The body `steps += 1` sits inside the inner loop,
          so a single outer pass can add several steps.
    correct: right
    followUps:
      square:
        prompt: On the pass with `i = 0`, how many times does the inner body run?
        options:
          - id: zero
            text: Zero times, because `range(0)` is empty
          - id: five
            text: Five times, as on every pass
          - id: once
            text: Once
        correct: zero
        explanation: >-
          The inner loop runs `i` times, so its count grows from pass to pass. Only a fixed inner
          range such as `range(n)` gives the same count on every pass.
      inclusive:
        prompt: What values does `range(i)` produce when `i` is 3?
        options:
          - id: below
            text: 0, 1 and 2
          - id: through
            text: 0, 1, 2 and 3
          - id: from-one
            text: 1, 2 and 3
        correct: below
        explanation: >-
          `range(i)` starts at 0 and stops before `i`, so it has exactly `i` values. The pass with
          `i` at 3 adds 3 steps, not 4.
      one-per-pass:
        prompt: How many times does `steps += 1` run on the pass with `i = 4`?
        options:
          - id: four
            text: Four times, once for each value of `j`
          - id: once
            text: Once, since it is a single pass
          - id: five
            text: Five times
        correct: four
        explanation: >-
          Every value of `j` runs the body again. On that pass `j` goes 0, 1, 2, 3, so the body
          runs as many times as `range(4)` has values.

  - id: double-the-grid
    heading: What happens when n doubles?
    tags: [complexity, python]
    workedExample: |-
      Consider `for i in range(n): steps += 1`, with `steps` starting at 0. The body runs once for
      each value `range(n)` produces.

      1. `range(n)` produces `n` values, 0 to `n - 1`, so the loop takes `n` steps.
      2. So at `n = 4` the loop takes 4 steps, and at `n = 8` it takes 8 steps.
      3. 8 is twice 4. Since the count equals `n`, doubling `n` doubles the count.
    prompt: |-
      ```python
      def grid_steps(n):
          steps = 0
          for i in range(n):
              for j in range(n):
                  steps += 1
          return steps
      ```

      `grid_steps(6)` returns 36. What does `grid_steps(12)` return?
    options:
      - id: right
        text: '144'
        explanation: >-
          12 outer passes each run 12 inner steps, so the count is 144, four times 36. Both loops
          got twice as long.
      - id: doubles
        text: '72'
        explanation: >-
          72 is 36 doubled, which is right for one loop over `n`. Here both the outer and the
          inner loop run `n` times.
      - id: plus-one
        text: '37'
        explanation: >-
          One extra step per doubling is how a halving loop grows. These loops walk every value
          of `i` and `j` without skipping any.
      - id: squared
        text: '1296'
        explanation: >-
          1296 is 36 × 36. That squares the count, but doubling `n` multiplies each of the two
          loop lengths by 2, not by 6.
    correct: right
    followUps:
      doubles:
        prompt: When `n` goes from 6 to 12, what happens to the number of inner steps on each outer pass?
        options:
          - id: also-doubles
            text: It doubles too, so the total is multiplied by 2 twice
          - id: same
            text: It stays at 6, because only the outer loop grows
          - id: halves
            text: It halves, because the work is spread over more passes
        correct: also-doubles
        explanation: >-
          The inner loop is `range(n)` as well, so each outer pass now runs 12 inner steps. Twice
          as many passes, each twice as long, gives four times the count.
      plus-one:
        prompt: Which loop takes only about one more step when `n` doubles?
        options:
          - id: halving
            text: A loop that halves what is left on each pass
          - id: nested
            text: A loop nested inside another loop over `n`
          - id: every-item
            text: A loop over every item from 0 to `n - 1`
        correct: halving
        explanation: >-
          Halving 2n once gives n, so a halving loop needs just one extra pass after `n` doubles.
          A loop over every value needs twice as many passes.
      squared:
        prompt: Doubling `n` turns the count n × n into what?
        options:
          - id: four-times
            text: (2n) × (2n), which is 4 × n × n
          - id: count-squared
            text: (n × n) × (n × n)
          - id: two-times
            text: 2 × n × n
        correct: four-times
        explanation: >-
          Replace `n` with `2n` everywhere it appears. The factor of 2 comes out of each loop, so
          the count is multiplied by 2 × 2.

  - id: trace-doubling-index
    format: step-trace
    heading: Predict each step
    tags: [complexity, python]
    workedExample: |-
      Consider `n = 4`, with `i = 1` and `steps = 0`. While `i < n`, each pass doubles `i` and adds
      1 to `steps`.

      1. `1 < 4`, so the first pass runs: `i` becomes 2 and `steps` becomes 1.
      2. `2 < 4`, so a second pass runs: `i` becomes 4 and `steps` becomes 2.
      3. `4 < 4` is false, so the loop stops with `steps` at 2. Doubling `i` reached `n` in only 2
         passes.
    prompt: >-
      The row below shows the indices 0 to 8. Step
      through `n = 8` and predict each step before it is shown.
    code: |
      n = 8
      steps = 0
      i = 1
      while i < n:
          i = i * 2
          steps += 1
    sequence:
      kind: array
      cells: [0, 1, 2, 3, 4, 5, 6, 7]
      pastEnd: true
    start:
      - { name: i, at: 1 }
    steps:
      - line: 4
        ask: Where is `i` after two passes?
        pointer: i
        correct: 4
        explanation: The first pass doubles 1 to 2, and the second doubles 2 to 4.
        misses:
          - index: 3
            explanation: That adds 1 on each pass. `i = i * 2` doubles, so it goes 1, 2, 4.
          - index: 2
            explanation: That is after one pass. The second pass doubles 2 again.
          - index: 8
            explanation: That takes three passes, 1 to 2 to 4 to 8.
        elsewhere: Each pass doubles `i`, so after two passes it has gone 1, 2, 4.
      - line: 4
        ask: What is `steps` when the loop ends?
        options:
          - id: three
            text: '3'
            explanation: >-
              `i` goes 1, 2, 4, 8. At 8 the test `i < n` is false, so three passes ran.
          - id: seven
            text: '7'
            explanation: >-
              Seven passes would take `i` from 1 to 8 one index at a time. Doubling skips most of
              the indices.
          - id: four
            text: '4'
            explanation: >-
              That counts a pass with `i` at 8. The test `8 < 8` is false, so the loop ends before
              a fourth pass.
        correct: three
        also:
          - { name: i, at: 8 }
      - ask: Run the same loop with `n = 16`. What is `steps` then?
        options:
          - id: four
            text: '4'
            explanation: >-
              `i` goes 1, 2, 4, 8, 16. Doubling `n` costs one more doubling of `i`, so the count
              rises from 3 to 4.
          - id: six
            text: '6'
            explanation: >-
              6 doubles the count, which is how a loop over every index grows. This loop doubles
              `i`, so a twice-as-large `n` is one pass away.
          - id: three
            text: '3'
            explanation: >-
              After three passes `i` is 8, and `8 < 16` is still true. The count grows slowly, but
              it does grow.
        correct: four

  - id: small-n-misleads
    heading: Which takes more steps?
    tags: [complexity]
    workedExample: |-
      Consider two step counts, `5 * n` and `n * n`. Which one is larger can change as `n` grows.

      1. At `n = 2`, `5 * n` is 10 and `n * n` is 4. So `5 * n` is larger.
      2. At `n = 10`, `5 * n` is 50 and `n * n` is 100. So `n * n` has passed it. They meet at
         `n = 5`, where both are 25.
      3. `n * n` is `n` lots of `n`, and `5 * n` is 5 lots of `n`. Once `n` is more than 5, `n * n`
         has more lots, so it stays larger and the gap keeps growing.
    prompt: >-
      `scan` takes `3 * n + 10` steps and `pairs` takes `n * (n - 1) // 2` steps. At `n = 4`,
      `scan` takes 22 steps and `pairs` takes 6. At `n = 100`, which takes more steps?
    options:
      - id: right
        text: '`pairs`, with 4950 steps against 310'
        explanation: >-
          `pairs` grows with about n² / 2 and `scan` with 3n. They cross between 9 and 10. Past
          that, `pairs` pulls further ahead with every increase in `n`.
      - id: ahead-now
        text: '`scan`, because it already takes more steps at `n = 4`'
        explanation: >-
          A small input says little about a large one. At `n = 10`, `pairs` takes 45 steps and
          `scan` takes 40, so the order has already flipped.
      - id: constant
        text: '`scan`, because its count adds a fixed 10 steps'
        explanation: >-
          The 10 is the same at every `n`. At `n = 100` it is 10 of `scan`'s 310 steps, and
          `pairs` takes 4950.
      - id: same-ratio
        text: Neither stays ahead, since both counts grow with `n` at the same pace
        explanation: >-
          Both grow, but not at the same pace. From `n = 10` to `n = 100`, `scan` goes from 40 to
          310 steps and `pairs` goes from 45 to 4950.
    correct: right
    followUps:
      ahead-now:
        prompt: What decides which count is larger once `n` is large?
        options:
          - id: growth
            text: How fast each count grows as `n` increases
          - id: first-try
            text: Which count is larger at the first `n` you try
          - id: constants
            text: Which formula has the larger constant
        correct: growth
        explanation: >-
          A count that grows like n² overtakes any count that grows like n, however large that
          one's constants are. The crossing point moves, but it always comes.
      constant:
        prompt: How much does the `+ 10` add to `scan` at `n = 100`?
        options:
          - id: ten
            text: Ten steps, just as at any other `n`
          - id: per-item
            text: Ten steps for each of the 100 items
          - id: doubles
            text: Enough to double the count
        correct: ten
        explanation: >-
          A constant term does not grow with `n`. It matters for tiny inputs and fades as the
          other terms grow.
      same-ratio:
        prompt: >-
          `pairs` takes 45 steps at `n = 10` and 4950 at `n = 100`. By about what factor did it grow
          when `n` grew tenfold?
        options:
          - id: hundred
            text: About a hundred, close to 10 × 10
          - id: ten
            text: Ten, the same as `n`
          - id: two
            text: About two
        correct: hundred
        explanation: >-
          4950 / 45 is 110. A count that grows like n² is multiplied by about 100 when `n` is
          multiplied by 10, while `scan` grows by under 8 times.

  - id: name-the-growth
    heading: What is its Big-O?
    tags: [complexity]
    workedExample: |-
      Big-O is the standard way to name how a count grows with `n`: keep the term that grows
      fastest, drop its constant factor, and write what is left inside O( ). The common names,
      slowest-growing first, are O(1), O(log n), O(n), O(n log n), O(n²) and O(2^n). Consider a
      count of `6 * n + 40` steps.

      1. `40` is the same at every `n`, while `6 * n` grows. At `n = 1000`, `6 * n` is 6000
         against 40, so `6 * n` dominates: past some `n`, it outweighs the other terms.
      2. The factor 6 changes the count but not how it grows, since doubling `n` still doubles
         `6 * n`. So Big-O drops it and keeps `n`.
      3. So `6 * n + 40` steps is O(n), the same name as one loop over `n` items.
    prompt: >-
      Big-O names how a step count grows with `n`. Keep only the term that dominates, the one that
      grows fastest and outweighs the rest once `n` is large, and drop its constant factor. So
      `3 * n + 10` steps is O(n). `pairs` takes `n * (n - 1) // 2` steps, which equals
      `(n * n - n) / 2`. What is its Big-O?
    options:
      - id: quadratic
        text: O(n²)
        explanation: >-
          `n * n / 2` grows fastest, and `- n / 2` falls further behind as `n` grows. Dropping the
          factor 1/2 leaves n². At `n = 100` the count is 4950, about half of 100 × 100.
      - id: half
        text: O(n² / 2)
        explanation: >-
          That keeps the constant factor 1/2. It makes every count half as big, but doubling `n`
          still multiplies the count by about 4, so it does not change how the count grows.
      - id: keeps-smaller
        text: O(n² - n)
        explanation: >-
          That keeps the smaller term. Once `n` is large, `n * n` outweighs `n` so far that the
          smaller term stops mattering, and Big-O leaves it out.
      - id: linear
        text: O(n)
        explanation: >-
          At `n = 100` the count is 4950, almost 50 steps for every item, and at `n = 1000` it is
          499,500, almost 500 for every item. A linear count stays close to a fixed number of steps
          per item.
    correct: quadratic
    followUps:
      half:
        prompt: >-
          `pairs` takes 4950 steps at `n = 100` and 19,900 at `n = 200`. What did doubling `n` do to
          the count?
        options:
          - id: four-times
            text: It multiplied it by about 4, as n² does
          - id: two-times
            text: It multiplied it by 2, since the count is halved
          - id: added
            text: It added 4950 steps
        correct: four-times
        explanation: >-
          A constant factor such as 1/2 scales every count the same way, so it never changes how
          the count grows. Big-O drops it and keeps n².
      keeps-smaller:
        prompt: At `n = 1000`, how does `n * n` compare with `n`?
        options:
          - id: far-larger
            text: 1,000,000 against 1000, so `n` barely matters
          - id: similar
            text: They are about the same size
          - id: n-larger
            text: "`n` is larger, since it is subtracted"
        correct: far-larger
        explanation: >-
          The term that grows fastest dominates: past some `n`, it outweighs every smaller term put
          together. So Big-O keeps only that term.
      linear:
        prompt: Which part of `n * (n - 1) // 2` grows like n × n?
        options:
          - id: product
            text: "`n * (n - 1)`, since `n - 1` is close to `n` when `n` is large"
          - id: floor
            text: "`// 2`, which halves the count"
          - id: none
            text: None of it, since dividing by 2 cancels one `n`
        correct: product
        explanation: >-
          `n - 1` grows almost as fast as `n`, so their product grows like n × n. Dividing by 2
          halves every count, but it does not cancel an `n`.

  - id: halving-is-log-n
    heading: What is its Big-O?
    tags: [complexity, python]
    workedExample: |-
      `log2(n)` is the power of 2 that makes `n`: the number of 2s you multiply together to reach
      it. Consider `n = 16` and `n = 32`.

      1. `2 * 2 * 2 * 2` is 16, four 2s, so `log2(16)` is 4.
      2. 32 is 16 doubled, which takes one more 2: `2 ** 5` is 32, so `log2(32)` is 5.
      3. So doubling `n` adds 1 to `log2(n)`. That is why it grows so slowly: `log2` of a million
         is only about 20.
    prompt: |-
      `log2(n)` is the power of 2 that makes `n`. `2 ** 10` is 1024, so `log2(1024)` is 10. Big-O
      writes this growth as O(log n).

      ```python
      def halvings(n):
          count = 0
          while n > 1:
              n = n // 2
              count += 1
          return count
      ```

      How does the number of passes grow with `n`?
    options:
      - id: log
        text: O(log n)
        explanation: >-
          Each pass halves `n`, so 1024 takes 10 passes to reach 1, one for each 2 in `2 ** 10`.
          That is `log2(n)` passes, and doubling `n` adds one more.
      - id: linear
        text: O(n)
        explanation: >-
          A loop that took 1 off `n` on each pass would need about `n` passes. This one halves `n`,
          so 1024 needs only 10.
      - id: half
        text: O(n / 2)
        explanation: >-
          The first pass removes half of `n`, but each later pass removes half of what is left,
          which is less every time. 1024 is done after 10 passes, not 512.
      - id: constant
        text: O(1)
        explanation: >-
          10 passes is few, but the count still grows: 2048 needs 11 and a million needs 19. O(1)
          is for a count that stays the same at every `n`.
    correct: log
    followUps:
      linear:
        prompt: What does `n = n // 2` do to `n` on each pass?
        options:
          - id: halves
            text: It halves `n`, rounding down
          - id: minus-one
            text: It takes 1 away from `n`
          - id: minus-two
            text: It takes 2 away from `n`
        correct: halves
        explanation: >-
          Halving shrinks `n` far faster than counting down. 1024 goes to 512, 256, 128 and so on,
          and reaches 1 after 10 passes.
      half:
        prompt: How many passes does `halvings(16)` make?
        options:
          - id: four
            text: 4, going 16 to 8, 4, 2 and 1
          - id: eight
            text: 8, half of 16
          - id: sixteen
            text: '16'
        correct: four
        explanation: >-
          Each pass halves what is left, so the passes count halvings, and `log2(16)` is 4. Only
          the first pass takes away half of 16. Each later pass takes away less.
      constant:
        prompt: '`halvings(1024)` makes 10 passes. How many does `halvings(2048)` make?'
        options:
          - id: eleven
            text: 11, one more
          - id: ten
            text: 10, the same
          - id: twenty
            text: 20, twice as many
        correct: eleven
        explanation: >-
          2048 halves to 1024 on its first pass, then needs the same 10 passes. A count that grows
          by one per doubling still grows, so it is not O(1).

  - id: add-one-doubles
    heading: How fast does it grow?
    tags: [complexity]
    workedExample: |-
      Consider a row of `n` lamps, each set to off, low or high. A setting of the row picks one of
      3 states for every lamp, and choices for different lamps combine with each other.

      1. One lamp has 3 settings.
      2. A second lamp can be in each of its 3 states next to each of the first lamp's 3, so 2
         lamps have 3 × 3 = 9 settings.
      3. Each new lamp multiplies the count by 3 again, so `n` lamps have `3 ** n` settings: 4
         lamps have 81. Adding one lamp triples the count.
    prompt: >-
      A subset of a list keeps some of its items and leaves out the rest. `[1, 2]` has 4 subsets:
      `[]`, `[1]`, `[2]` and `[1, 2]`. A third item gives each of those 4 a copy with the 3 in it,
      so `[1, 2, 3]` has 8. Big-O writes a count of `2 ** n` as O(2^n). A function tries every
      subset of a list of `n` items. How many does it try at `n = 10` and at `n = 20`, and what is
      its Big-O?
    options:
      - id: exponential
        text: 1,024 and 1,048,576, so O(2^n)
        explanation: >-
          Each item doubles the count, so `n` items have `2 ** n` subsets: 1,024 at 10 and
          1,048,576 at 20. Ten more items doubled it ten times, a factor of 1,024. Its Big-O is
          O(2^n).
      - id: doubles
        text: 1,024 and 2,048, so O(n)
        explanation: >-
          Going from 10 to 20 adds ten items, and each one doubles the count. That is ten
          doublings, not one, so the count grows 1,024 times.
      - id: adds
        text: 20 and 40, so O(n)
        explanation: >-
          Each item has two choices, in or out, but the choices for different items multiply
          rather than add. Three items give 2 × 2 × 2 = 8 subsets, as the prompt counts, not
          2 + 2 + 2 = 6.
      - id: quadratic
        text: 100 and 400, so O(n²)
        explanation: >-
          n × n would count pairs of items. A subset can hold any number of items, and the count
          doubles with each new one, so at `n = 20` it is over a million against 400.
    correct: exponential
    followUps:
      doubles:
        prompt: How many times does the count double when `n` goes from 10 to 20?
        options:
          - id: ten
            text: Ten times, once for each added item
          - id: once
            text: Once, since `n` doubled
          - id: twice
            text: Twice
        correct: ten
        explanation: >-
          Every added item doubles the count. Ten more items is ten doublings, and `2 ** 10` is
          1,024, so the count grows 1,024 times.
      adds:
        prompt: '`[1, 2, 3]` has 8 subsets. Which sum or product gives 8 for the right reason?'
        options:
          - id: product
            text: 2 × 2 × 2, in or out for each item
          - id: sum
            text: 2 + 2 + 2 + 2, two choices per item plus two more
          - id: mixed
            text: 2 × 3 + 2, two choices per item plus `[]` and the whole list
        correct: product
        explanation: >-
          Each item's choice combines with every choice for the other items, so the choices
          multiply. A fourth item makes 2 × 2 × 2 × 2 = 16, and adding up choices would fall short.
      quadratic:
        prompt: Which is larger, `2 ** 20` or `20 * 20`?
        options:
          - id: power
            text: "`2 ** 20`, over a million against 400"
          - id: square
            text: "`20 * 20`, since squaring grows fastest"
          - id: equal
            text: They are about the same
        correct: power
        explanation: >-
          A count that doubles with each new item soon passes any count like n × n. That is why
          O(2^n) sits above O(n²) among the names.

  - id: extra-space-set
    heading: How much extra space?
    tags: [complexity, hash-map, python]
    workedExample: |-
      Extra space is the memory a function uses beyond its input, and Big-O names how it grows.
      Some questions also leave out the value the function returns, and each one says which.
      Consider `def squares(nums): return [x * x for x in nums]` on `n` numbers, with the returned
      list left out.

      1. The returned list holds `n` numbers, but this question leaves it out, so it does not count.
      2. Apart from that list, the function holds only the loop variable `x`, one value at a time.
         That is the same amount at any `n`.
      3. A fixed amount at any `n` is O(1), so the extra space of `squares` is O(1).
    prompt: |-
      Extra space is the memory a function uses beyond its input. Here the returned value is left
      out too.

      ```python
      def count_distinct(nums):
          seen = set()
          for x in nums:
              seen.add(x)
          return len(seen)
      ```

      How much extra space does it use in the worst case?
    options:
      - id: linear
        text: O(n)
        explanation: >-
          When every value is different, `seen` ends up holding all `n` of them. That set counts as
          extra space, because the function does not return it.
      - id: constant
        text: O(1)
        explanation: >-
          The returned value is a single int, but that is not where the memory goes. The set is
          built along the way, and it can grow as large as the input.
      - id: quadratic
        text: O(n²)
        explanation: >-
          Quadratic space needs about one stored value per pair of items. Each pass adds at most
          one value to the set.
      - id: discarded
        text: None, since `seen` is thrown away when the function returns
        explanation: >-
          Extra space counts what the function holds while it runs. The set is freed at the end,
          but by then it may have held `n` values.
    correct: linear
    followUps:
      constant:
        prompt: '`count_distinct` returns one int. Where does the memory that grows with `n` live?'
        options:
          - id: set
            text: In `seen`, which keeps every distinct value
          - id: int
            text: In the returned int, which gets bigger with `n`
          - id: nowhere
            text: Nowhere, because a loop reuses its variables
        correct: set
        explanation: >-
          Here extra space is everything the function allocates besides its input and its result.
          That is the set, which gains one entry per new value.
      quadratic:
        prompt: When `nums` has `n` items, how many values can `seen` hold at most?
        options:
          - id: n
            text: '`n`, one per distinct value'
          - id: n-squared
            text: n × n, one per pair of values
          - id: two
            text: Two, the current value and the previous one
        correct: n
        explanation: >-
          Each pass adds at most one value, and a set never stores a value twice. So `seen` never
          holds more values than the input has items.
      discarded:
        prompt: When is a function's extra space measured?
        options:
          - id: peak
            text: At its peak, while the function is still running
          - id: after
            text: Only after the function has returned
          - id: returned
            text: Only for the values the function returns
        correct: peak
        explanation: >-
          Memory has to be available while it is in use. A set of `n` values freed at the end
          still needed room for all of them first.

  - id: returned-pairs
    heading: How much memory?
    tags: [complexity, python]
    workedExample: |-
      Consider a function that returns `[2 * x for x in nums]`, where `nums` has `n` items, and
      count the returned list as memory. A list takes room for each item it holds.

      1. The comprehension makes one number for each item of `nums`, so the returned list holds `n`
         numbers.
      2. Each number takes the same fixed room, so the list's memory is in proportion to `n`.
      3. So, counting the returned list, its memory is O(n).
    prompt: |-
      ```python
      def all_pairs(nums):
          out = []
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  out.append((nums[i], nums[j]))
          return out
      ```

      `all_pairs` on 4 items returns 6 pairs. This time the returned list counts. How does its
      memory grow with `n`?
    options:
      - id: quadratic
        text: O(n²)
        explanation: >-
          It returns one pair for every two items, which is n(n - 1) / 2 pairs. At 20 items that
          is 190 pairs, so the output grows with the square of `n`.
      - id: linear
        text: O(n)
        explanation: >-
          It returns one list, but the length of that list is what matters. On 10 items it holds
          45 pairs, far more than 10.
      - id: constant
        text: O(1)
        explanation: >-
          Not counting the output, it needs only `i` and `j`. This question counts the returned
          list, and that list grows.
      - id: n-log-n
        text: O(n log n)
        explanation: >-
          A log n factor comes from halving or doubling. The inner loop here shortens by one item
          per pass and never halves.
    correct: quadratic
    followUps:
      linear:
        prompt: What sets the memory of a returned list?
        options:
          - id: length
            text: How many items it holds
          - id: count
            text: How many lists are returned
          - id: input
            text: The size of the input, always
        correct: length
        explanation: >-
          A list takes room for each item it holds. Output can be smaller or larger than the
          input. Here it is larger: one entry per pair.
      constant:
        prompt: The returned list counts in this question. How many pairs does it hold for 5 items?
        options:
          - id: ten
            text: '10'
          - id: five
            text: '5'
          - id: two
            text: '2'
        correct: ten
        explanation: >-
          The first item pairs with 4 others, the second with 3, and so on: 4 + 3 + 2 + 1. A
          stated convention decides whether the output counts, and here it does.
      n-log-n:
        prompt: For `n` items, how many times does `out.append` run?
        options:
          - id: pairs
            text: About n² / 2 times
          - id: n-log-n
            text: About n × log n times
          - id: n
            text: About `n` times
        correct: pairs
        explanation: >-
          The inner loop runs one fewer time on each pass: (n - 1) + (n - 2) + ... + 1. That sum is
          n(n - 1) / 2, about half of n².
