  - id: connectivity-size-bounds-height
    tags:
      - graph
    workedExample: |-
      Consider node `x` in a set of 5 nodes under union by size, and two unions that join its set
      with others. A union hangs the root of the smaller set under the root of the larger set.

      1. `x`'s set of 5 joins a set of 3. The other set is smaller, so its root goes under `x`'s
         root. `x`'s walk to its root is as long as before, and its set holds 8 nodes.
      2. `x`'s set of 8 then joins a set of 9. `x`'s set is the smaller one, so `x`'s root goes
         under the other root, and `x`'s walk grows by one link.
      3. `x`'s set holds 8 + 9 = 17 nodes. Its walk grew only in step 2, the one union that hung
         its root.
    prompt: |-
      Under union by size, node `x` gets one link further from its root only when its root is hung under another root, and a root is hung only under a root whose set holds at least as many nodes. That is why a `find` on n nodes walks at most log2 n links, rounded down: the largest whole `k` with `2 ** k <= n`, where `2 ** k` is `k` 2s multiplied together. That allows at most 10 links for 1,024 nodes, since `2 ** 10 == 1024`, and at most 9 for 1,000 nodes, since `2 ** 9 == 512` and `2 ** 10` is over 1,000. With path compression as well, the cost of each operation, averaged over a long run of operations, is near constant.

      Node `x` started in a set of its own, and its root has been hung under another root 3 times. What is the smallest number of nodes `x`'s set can hold now?
    options:
      - id: eight
        text: '8'
        explanation: >-
          Each time `x`'s root is hung, the set it joins holds at least as many nodes as `x`'s set,
          so `x`'s set at least doubles: from 1 to at least 2, 4 and then 8. Ties reach 8 exactly,
          by joining sets of 1, 2 and 4. That doubling is why `x`'s root can be hung at most 10
          times among 1,024 nodes.
      - id: four
        text: '4'
        explanation: >-
          That adds at least one node per hang, as if the set `x` joins could always be a single
          node. Union by size hangs `x`'s root only under a set at least as large as `x`'s, so the
          set at least doubles each time.
      - id: fifteen
        text: '15'
        explanation: >-
          That hangs a root only under a strictly larger set, so the set grows from 1 to at least
          3, 7 and 15. On a tie the union still hangs one root under the other, so `x`'s set can
          grow from 1 to exactly 2, 4 and 8.
    correct: eight
    followUps:
      four:
        prompt: When `x`'s root is hung under another root, how many nodes does the other set hold?
        options:
          - id: as-many
            text: At least as many as `x`'s set
          - id: one-or-more
            text: At least 1, whatever `x`'s set holds
          - id: exactly
            text: Exactly as many as `x`'s set
        correct: as-many
        explanation: >-
          Union by size hangs the root of the smaller set, so the set `x` joins is never smaller than
          its own. Joining it at least doubles `x`'s set.
      fifteen:
        prompt: Two sets of 4 nodes meet in a union by size. What happens?
        options:
          - id: one-hangs
            text: One root goes under the other, and the set holds 8
          - id: waits
            text: Neither root moves until one set is larger
          - id: new-root
            text: Both roots go under a new root
        correct: one-hangs
        explanation: >-
          On a tie, union by size hangs `a`'s root under `b`'s root. A set of 4 can join another set
          of 4 and exactly double.
