  - id: connectivity-union-by-size
    format: step-trace
    tags:
      - graph
    workedExample: |-
      Consider the sets {0} and {1, 2, 3} with root 3, so `size[0]` is 1 and `size[3]` is 3, and
      the call `union(0, 1)`. The union compares the sizes of the two roots' sets.

      1. `find(0)` is 0 and `find(1)` is 3, so `ra` is 0 and `rb` is 3. The roots differ, so the
         union goes on.
      2. `size[0]` is 1, which is not more than `size[3]`, 3. The `else` branch runs
         `parent[0] = 3` and `size[3] += size[0]`, and `size[3]` becomes 4.
      3. Root 0, the root of the smaller set, went under root 3. Only node 0 is one link further
         from its root, and nodes 1, 2 and 3 walk as far as before.
    prompt: >-
      Union by size keeps the walks to a root short. It stores `size[r]`, the number of nodes in the
      set whose root is `r` (the code reads it only at roots), and a union hangs the root of the
      smaller set under the root of the larger set. On a tie it hangs `a`'s root under `b`'s root,
      as `parent[find(a)] = find(b)` does. `find` follows `parent` links to a root, as before.
      Lines 15 and 16 are ties, so `child` starts on 2, the root `union(2, 3)` hung under 3. Move
      `child` to the root each later union hangs.
    code: |-
      parent = list(range(6))
      size = [1] * 6

      def union(a, b):
          ra, rb = find(a), find(b)
          if ra == rb:
              return
          if size[ra] > size[rb]:
              parent[rb] = ra
              size[ra] += size[rb]
          else:
              parent[ra] = rb
              size[rb] += size[ra]

      union(0, 1)
      union(2, 3)
      union(0, 4)
      union(2, 0)
      union(0, 5)
    sequence:
      kind: array
      name: nodes
      cells: [0, 1, 2, 3, 4, 5]
    start:
      - name: child
        at: 2
    steps:
      - line: 17
        ask: Which root does `union(0, 4)` hang under another root?
        pointer: child
        correct: 4
        explanation: >-
          `find(0)` is 1, whose set {0, 1} holds 2 nodes, and `find(4)` is 4, a set of 1. Since
          `size[1] > size[4]`, line 9 runs `parent[4] = 1`, and `size[1]` becomes 3.
        misses:
          - index: 1
            explanation: >-
              Root 1's set holds 2 nodes and root 4's holds 1, so 1 stays a root and 4 goes under
              it. Hanging `a`'s root 1 under 4 is what `parent[find(a)] = find(b)` would do.
          - index: 0
            explanation: >-
              Node 0 is `a`, but it is not a root: `parent[0]` is 1. A union hangs one of the two
              roots, here root 4.
        elsewhere: >-
          Compare the sets of the two roots, `find(0)` and `find(4)`. Root 1 holds 2 nodes and root
          4 holds 1, so the smaller set's root, 4, is hung.
      - line: 18
        ask: Which root does `union(2, 0)` hang under another root?
        pointer: child
        correct: 3
        explanation: >-
          `find(2)` is 3, a set of 2 nodes, and `find(0)` is 1, a set of 3 nodes. Since 2 is not
          more than 3, line 12 runs `parent[3] = 1`, and `size[1]` becomes 5.
        misses:
          - index: 2
            explanation: >-
              Node 2 is `a`, but it is not a root: `parent[2]` is 3. The union hangs 2's root, 3,
              and node 2 comes along under it.
          - index: 1
            explanation: >-
              Root 1's set {0, 1, 4} holds 3 nodes, more than the 2 nodes of {2, 3}. The root of the
              larger set stays a root.
          - index: 0
            explanation: >-
              Node 0 is `b`, but it is not a root: `parent[0]` is 1. The union compares the roots
              `find(2)` and `find(0)`, which are 3 and 1.
        elsewhere: >-
          Find both roots first: `find(2)` is 3 and `find(0)` is 1. Root 3 holds 2 nodes and root 1
          holds 3, so root 3 is hung.
      - line: 19
        ask: Which root does `union(0, 5)` hang under another root?
        pointer: child
        correct: 5
        explanation: >-
          `find(0)` is 1, whose set holds 5 nodes, and node 5 is a set of 1. Since
          `size[1] > size[5]`, line 9 runs `parent[5] = 1`.
        misses:
          - index: 1
            explanation: >-
              Root 1 holds 5 nodes and root 5 holds 1. Hanging 1 under 5 would put five nodes one
              link further from their root. Union by size hangs 5 and moves only one node.
          - index: 0
            explanation: >-
              Node 0 is `a`, but it is not a root: `parent[0]` is 1. The union hangs one of the
              roots 1 and 5.
        elsewhere: >-
          Root 1 holds 5 nodes and root 5 holds 1, so the smaller set's root, 5, is hung.
      - line: 19
