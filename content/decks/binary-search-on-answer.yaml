id: binary-search-on-answer
title: Binary search, including on the answer
description: Halve a sorted range, or a range of possible answers, and know which loop, test, and cost go with it.
heading: What should you search over?

questions:
  - id: sorted-array-search-loop
    heading: Which loop is correct?
    tags: [binary-search]
    prompt: >-
      Search a sorted array `a` of distinct integers (ascending, 0-based indexes) for `t`, returning
      its index or `-1` if it is absent. All four loops start with `lo, hi = 0, len(a) - 1`, compute
      `mid = (lo + hi) // 2`, and return `mid` when `a[mid] == t`. They differ in the loop condition
      and in how they move `lo` and `hi` after a miss. Which one is correct?
    options:
      - id: lt-inclusive
        text: "`while lo < hi`; after a miss, `lo = mid + 1` or `hi = mid - 1`"
        explanation: >-
          With `hi = len(a) - 1` the range is inclusive, so `lo == hi` is a live one-element range.
          `while lo < hi` stops before looking at it. On `[1, 3, 5]`, searching for `5` returns `-1`,
          and so does `[4]` with `4`. The `lo < hi` condition belongs with a half-open `hi = len(a)`.
      - id: le-minus-one
        text: "`while lo <= hi`; after a miss, `lo = mid + 1` or `hi = mid - 1`"
        explanation: >-
          The invariant is that if `t` is present, it is in `a[lo..hi]`, both ends included. A miss
          rules `mid` out, so `mid + 1` or `mid - 1` keeps the invariant and always shrinks the range.
          The loop ends when `lo > hi`, an empty range, so a one-element range is still examined.
          That is O(log n) probes in the worst case. The half-open form (`hi = len(a)`, `while lo <
          hi`, `hi = mid`) is also correct.
      - id: lo-equals-mid
        text: "`while lo <= hi`; after a miss, `lo = mid` or `hi = mid - 1`"
        explanation: >-
          After `a[mid] < t`, `mid` is ruled out, but `lo = mid` keeps it. Since `//` rounds down,
          `mid == lo` whenever `hi == lo + 1`, so the range stops shrinking. On `[2, 5, 8]` with
          `t = 8`, `lo, hi` goes `0, 2`, then `1, 2`, and stays at `1, 2`, so the loop never
          terminates. A `lo = mid` loop needs both `mid` rounded up and `while lo < hi`.
      - id: hi-equals-mid
        text: "`while lo <= hi`; after a miss, `lo = mid + 1` or `hi = mid`"
        explanation: >-
          With `lo <= hi`, a one-element range still enters the loop. If that element is larger than
          `t`, `hi = mid` leaves `hi` unchanged and the loop repeats forever. On `[2, 5, 8]` with
          `t = 6` the range reaches `lo = hi = 2` and stays there. It hangs whenever `t` is absent and
          smaller than the largest element. `hi = mid` needs `while lo < hi` and a half-open `hi`.
    correct: le-minus-one
    followUps:
      lt-inclusive:
        prompt: >-
          With `a = [4]` and `t = 4`, `lo = hi = 0`. What does the `while lo < hi` version do?
        options:
          - id: never-compared
            text: The loop body never runs, so the only candidate, `a[0]`, is never compared and `-1` comes back
          - id: returns-zero
            text: It returns `0`, because `lo == hi` already shows that the target was found
          - id: loops-forever
            text: It loops forever, because `lo` can never become larger than `hi`
        correct: never-compared
        explanation: >-
          With inclusive bounds, `lo == hi` means one candidate is left, not none. The condition must
          keep running while the range is nonempty, which is `lo <= hi`. With a half-open `hi`, `lo ==
          hi` does mean empty, so `lo < hi` is the matching condition there.
      lo-equals-mid:
        prompt: >-
          On `[2, 5, 8]` with `t = 8`, the range reaches `lo = 1`, `hi = 2`, so `mid = 1` and
          `a[1] = 5 < 8`. Why does `lo = mid` get stuck?
        options:
          - id: keeps-mid
            text: "`mid` was ruled out but kept, and `(1 + 2) // 2` rounds down to 1, so the range does not shrink"
          - id: skips-target
            text: "`lo = mid` jumps past `8`, so the target is never found and `-1` is returned"
          - id: backwards-compare
            text: The comparison `a[mid] < t` is backwards, so the loop moves away from the target
        correct: keeps-mid
        explanation: >-
          Every step must remove at least `mid` from the range. `lo = mid` removes nothing, and with
          floor division `mid` equals `lo` for a two-element range, so the same range comes back. It
          does not skip the target and does not return `-1`. It hangs. `lo = mid + 1` removes `mid`
          and guarantees progress.
      hi-equals-mid:
        prompt: >-
          Which pairing of loop condition and `hi` update is safe? Think about a range with a single
          element, where `lo == hi`.
        options:
          - id: match-pairs
            text: "`lo <= hi` with `hi = mid - 1`, or `lo < hi` with a half-open `hi = len(a)` and `hi = mid`"
          - id: any-pairing
            text: Any condition works with any update, because `mid` always lies inside the range
          - id: le-with-mid
            text: "`lo <= hi` with `hi = mid`, because `<=` gives the loop one extra pass at the end"
        correct: match-pairs
        explanation: >-
          `hi = mid - 1` drops `mid` from an inclusive range, so `lo <= hi` can end on an empty range.
          `hi = mid` suits a half-open `[lo, hi)`, where `hi` itself is already excluded, so `lo < hi`
          ends on empty. Mixing them, as in `lo <= hi` with `hi = mid`, leaves a one-element range
          that never shrinks.

  - id: first-position-duplicates
    heading: Which loop returns the first index with `a[i] >= x`?
    tags: [binary-search, python]
    prompt: >-
      A sorted list `a = [2, 4, 4, 4, 9, 11]` may contain duplicates (0-based indexes). You need the
      first index `i` with `a[i] >= x`, or `len(a)` if there is none. That is what
      `bisect.bisect_left(a, x)` returns, and for `x = 4` it is `1`. Which loop returns it for every
      `x`? Each loop starts with `lo, hi = 0, len(a)` unless the option says otherwise.
    options:
      - id: return-on-equal
        text: "`while lo < hi`; return `mid` on `a[mid] == x`, else halve; return `lo` if absent"
        explanation: >-
          Returning on the first hit stops at whichever 4 the probe lands on. On this list with
          `x = 4` the first probe is index 3, so the loop returns 3, not 1. With
          distinct values this loop is fine. With duplicates, an equal probe must keep searching to
          its left.
      - id: le-moves-right
        text: "`while lo < hi`; `lo = mid + 1` if `a[mid] <= x`, else `hi = mid`"
        explanation: >-
          On `[2, 4, 4, 4, 9, 11]` with `x = 4`, treating an equal probe like a value that is too
          small pushes `lo` past index 1. The loop stops at 4. The question wants index 1, so this
          update rule overshoots the earliest index that meets the bound.
      - id: hi-len-minus-one
        text: "`hi = len(a) - 1`; `while lo < hi`; `lo = mid + 1` if `a[mid] < x`, else `hi = mid`"
        explanation: >-
          Starting `hi` at `len(a) - 1` means the range can never reach index `len(a)`, so "every
          element is below `x`" cannot be reported. With `x = 20` this loop returns 5, but the correct
          answer is 6. A half-open range with `hi = len(a)` can end one past the last element.
      - id: lt-moves-right
        text: "`while lo < hi`; `lo = mid + 1` if `a[mid] < x`, else `hi = mid`; return `lo`"
        explanation: >-
          The invariant is that everything before `lo` is `< x` and everything from `hi` on is
          `>= x`. A probe with `a[mid] < x` rules out `mid` and everything left of it. Otherwise `mid`
          might be the answer, so `hi = mid` keeps it. When `lo == hi`, that index is the first
          `>= x`, possibly `len(a)`. Equal elements move `hi`, never `lo`, which is `bisect_left`.
    correct: lt-moves-right
    followUps:
      return-on-equal:
        prompt: >-
          You want the first index with `a[i] >= x`. When `a[mid] == x` and duplicates are allowed,
          what does that tell you?
        options:
          - id: candidate-keep-left
            text: "`mid` is a candidate, but an earlier equal element may exist, so keep `mid` in range and search left"
          - id: any-equal-fine
            text: Any equal index answers the question, so return it immediately
          - id: first-is-right
            text: The first equal element must lie to the right of `mid`
        correct: candidate-keep-left
        explanation: >-
          For the first index with `a[i] >= x`, an equal `a[mid]` is a candidate, not a finished
          answer, since earlier copies may exist. Setting `hi = mid` keeps it while discarding the
          right side. Returning on equality is right only when any matching index will do.
      le-moves-right:
        prompt: What do the two update rules `a[mid] <= x` and `a[mid] < x` find, when they move `lo` to the right?
        options:
          - id: le-after-lt-before
            text: "`<=` finds the first index with `a[i] > x` (`bisect_right`), `<` finds the first with `a[i] >= x` (`bisect_left`)"
          - id: same-answer
            text: They always return the same index, and differ only in how many probes they use
          - id: reversed
            text: "`<=` finds the first index with `a[i] >= x`, and `<` finds the first with `a[i] > x`"
        correct: le-after-lt-before
        explanation: >-
          Moving right on `a[mid] <= x` pushes past every copy of `x`, so the loop stops after the
          last one. On the list above the two loops give 4 and 1 for `x = 4`. When `x` is absent they
          agree, so a test without duplicates can hide the mix-up. `bisect_right(a, x) -
          bisect_left(a, x)` counts the copies, 3 here.
      hi-len-minus-one:
        prompt: How many different answers can an insertion point take in a list of `len(a)` elements?
        options:
          - id: len-plus-one
            text: "`len(a) + 1`: before any element, or after the last, so `hi` must start at `len(a)`"
          - id: len-answers
            text: "`len(a)`: one per element, so `hi = len(a) - 1` already covers them"
          - id: hi-irrelevant
            text: The starting `hi` does not matter, because the loop returns `lo` anyway
        correct: len-plus-one
        explanation: >-
          An insertion point can sit before each element or after the last one, which is `len(a) + 1`
          choices. Starting at `hi = len(a) - 1` offers only `len(a)` of them and never the one after
          the end. That start is fine only when the answer is certain to be an existing index.

  - id: search-the-answer-sessions
    tags: [binary-search]
    prompt: >-
      A pipeline uploads `n` files in their given order, so each upload session takes a contiguous
      run of files. File `i` has size `sizes[i]` (positive integers, duplicates allowed) and cannot
      be split. Every session has the same size limit `x`. Find the smallest `x` that fits all the
      files into at most `d` sessions. For `sizes = [4, 9, 3, 7, 6, 2, 8]` and `d = 3` the answer is
      16. Which search finds `x` in general?
    options:
      - id: search-positions
        text: Binary search the cut positions in `sizes`, probing the middle index each time
        explanation: >-
          The sizes are in arbitrary order, so no probed index says which side the cuts belong on:
          nothing is sorted or monotonic by position. There are also `d - 1` cuts to place, not one
          index. What is monotonic is the limit `x`, so the search runs over capacities, not over the
          array.
      - id: average-test
        text: "Search `x` in `[1, sum(sizes)]`, with the test `sum(sizes) <= x * d`"
        explanation: >-
          This test checks only the average load. It ignores that files cannot be split and that
          sessions are contiguous, so it can pass when no grouping works. On the sample it accepts
          `x = 13`, since `39 <= 13 * 3`, but at 13 greedy packing needs 4 sessions. It is a lower
          bound on the answer, not a feasibility test.
      - id: exactly-d
        text: "Search `x` in `[max(sizes), sum(sizes)]`; test: greedy packing uses exactly `d` sessions"
        explanation: >-
          The greedy session count only falls as `x` grows, so "exactly `d`" holds on a middle
          stretch and fails on both sides. A failed test then no longer says which way to go. On the
          sample, the first probe `x = 24` uses 2 sessions, so the test fails and the usual
          `lo = mid + 1` moves up, ending at 39 instead of 16.
      - id: at-most-d
        text: "Search `x` in `[max(sizes), sum(sizes)]`; test: greedy packing needs at most `d` sessions"
        explanation: >-
          The search and the test are separate. `feasible(x)` fills a session until the next file would exceed
          `x`, then starts a new one, in one O(n) pass. A larger `x` never needs more sessions, so
          the results read `False ... False True ... True`, and the search finds the first `True`.
          Below `max(sizes)` some file never fits, and `sum(sizes)` always fits in one session. Here
          `x = 15` needs 4 sessions and `x = 16` needs 3.
    correct: at-most-d
    followUps:
      search-positions:
        prompt: >-
          Binary search needs a yes/no question whose answer flips once as the probe moves. Which
          probe gives that here?
        options:
          - id: capacity-probe
            text: A limit `x`. If `x` suffices, every larger limit does too, so the answer flips once
          - id: index-probe
            text: An index `i`. The files before `i` are smaller, so the answer lies on one side
          - id: size-probe
            text: A file size taken from `sizes`, because the answer must equal one of the sizes
        correct: capacity-probe
        explanation: >-
          No order on the files lets a position probe discard a side, but capacities are ordered and
          feasibility flips once from no to yes. The answer 16 is not a file size. It is the total of
          a contiguous group, so you search the number range, not the list.
      average-test:
        prompt: >-
          On the sample, `sum(sizes) <= x * d` is true at `x = 13`, yet 13 is too small. What does it
          fail to account for?
        options:
          - id: indivisible-ordered
            text: Files are indivisible and sessions are contiguous, so the load cannot be spread evenly
          - id: needs-rounding
            text: It needs integer rounding, since `39 / 3` should be rounded up
          - id: not-monotonic
            text: It is not monotonic, so binary search takes the wrong side
        correct: indivisible-ordered
        explanation: >-
          The test is monotonic, so the search runs, but it answers the wrong question. Even
          spreading needs splittable work. At 13, greedy packing gives `[4, 9]`, `[3, 7]`,
          `[6, 2]`, `[8]`, which is 4 sessions. Feasibility needs the actual packing.
      exactly-d:
        prompt: As `x` grows, what happens to the number of sessions that greedy packing uses?
        options:
          - id: never-rises
            text: It never rises. A bigger limit can only merge sessions, so the count stays level or falls
          - id: rises-and-falls
            text: It can rise and fall, so no test on it is monotonic
          - id: stays-at-d
            text: It stays at `d` once `x` reaches the answer
        correct: never-rises
        explanation: >-
          On the sample, the count is 6 at `x = 9`, 5 for 10 to 12, 4 for 13 to 15, 3 for 16 to 22,
          2 for 23 to 38, and 1 at 39. It never rises, so "at most `d`" flips once at 16, while
          "exactly `d`" is true only for 16 through 22.

  - id: rotated-array-search
    heading: Which rule decides the side?
    tags: [binary-search]
    prompt: >-
      A sorted array of distinct integers was rotated at an unknown point, such as
      `[14, 17, 19, 3, 5, 8, 11]` (0-based indexes). You must find a target `t` in O(log n) time.
      At each step you probe `mid` between `lo` and `hi`. Which rule works?
    options:
      - id: plain-compare
        text: "Ordinary binary search: go right if `a[mid] < t`, otherwise go left"
        explanation: >-
          Plain comparisons assume the whole range ascends. In the example with `t = 17`, the first
          probe is 3, which is below 17, so the rule goes right and discards `[14, 17, 19]`. The call
          returns `-1`, although 17 sits at index 1.
      - id: strict-sorted-test
        text: "Decide the left part is sorted with the strict test `a[lo] < a[mid]`, then check `t`"
        explanation: >-
          On a two-element range `mid` rounds down to `lo`, so the left part is a single element and
          sorted, but `a[lo] < a[mid]` is false. The code then assumes the right part is sorted. On
          `[5, 2]` with `t = 2` it returns `-1`. The test `a[lo] <= a[mid]` returns 1.
      - id: scan-for-pivot
        text: Scan for where the order drops, then binary search the half that can hold `t`
        explanation: >-
          This finds the right answer, but the scan reads elements one by one, so the worst case is
          O(n) for the whole search, no better than a linear search. The drop can itself be found in
          O(log n) with a binary search, and the sorted-half rule avoids the separate pass.
      - id: sorted-half
        text: "Find the sorted side (`a[lo] <= a[mid]` means left), then see whether `t` lies in it"
        explanation: >-
          After a rotation, at least one of `a[lo..mid]` and `a[mid..hi]` is in order. If
          `a[lo] <= a[mid]`, the left part is sorted: if `a[lo] <= t < a[mid]`, go left,
          otherwise go right. If the left part is not sorted, the right part is: if
          `a[mid] < t <= a[hi]`, go right, otherwise go left. Each step discards half, so it is
          O(log n).
    correct: sorted-half
    followUps:
      plain-compare:
        prompt: >-
          In `[14, 17, 19, 3, 5, 8, 11]`, `mid = 3` holds 3 and `t = 17`. Why does "go right because
          3 < 17" fail?
        options:
          - id: order-breaks
            text: Values left of `mid` can be larger than the ones on its right, so `a[mid] < t` does not say which side holds `t`
          - id: wrong-mid
            text: In a rotated array, `mid` must be rounded up instead of down
          - id: target-absent
            text: 17 is not in the array, so every rule fails
        correct: order-breaks
        explanation: >-
          Plain search needs "everything left is at most `a[mid]`, and everything right is at least
          it". After a rotation that holds only inside one sorted run. Here the right part,
          `[5, 8, 11]`, is entirely below 17, and 17 is on the left. Finding the sorted side first
          restores a valid comparison.
      strict-sorted-test:
        prompt: >-
          In `[5, 2]`, `lo = 0`, `hi = 1`, so `mid = 0`. Is the left part `a[lo..mid]` sorted, and does
          the test need to accept `a[lo] == a[mid]`?
        options:
          - id: single-sorted
            text: A single element is sorted, and `a[lo]` and `a[mid]` are the same element, so the test must accept equality
          - id: not-sorted
            text: It is not sorted, because 5 is larger than 2
          - id: mid-rounds-up
            text: It is sorted, but `mid` should round up to 1 in a two-element range
        correct: single-sorted
        explanation: >-
          A one-element part is trivially sorted, and `lo == mid` makes `a[lo] == a[mid]`. So the
          test is `a[lo] <= a[mid]`. It is true when the left part is one element or truly ascends.
          Then `t` is checked against `a[lo]..a[mid]`, and otherwise the search goes right.
      scan-for-pivot:
        prompt: How can the rotation point be found in O(log n) instead of by scanning?
        options:
          - id: compare-with-hi
            text: Compare `a[mid]` with `a[hi]`. If `a[mid] > a[hi]`, the drop is right of `mid`, otherwise at or left of it
          - id: scan-only
            text: It cannot. Only a scan can locate the rotation point
          - id: sort-first
            text: Sort the array first, then undo the rotation
        correct: compare-with-hi
        explanation: >-
          The drop is the only place where order breaks, so comparing `a[mid]` with `a[hi]` shows
          which side holds it. That is itself a binary search, O(log n). Sorting would cost
          O(n log n), which loses the point of searching a sorted structure.

  - id: binary-search-preconditions
    heading: Which statement is true?
    tags: [binary-search, complexity]
    prompt: >-
      Binary search halves the candidates with each probe. Which statement about what it needs, and
      about total running time or correctness when those needs are missing, is true? (Python 3,
      0-based indexes, ascending order.)
    options:
      - id: linked-list-ok
        text: On a sorted linked list, total time is O(log n), since comparisons are O(log n)
        explanation: >-
          The comparisons are O(log n), but a linked list has no indexing, so the cost of reaching
          the middle of the range is missing from that count. With a million nodes and a target above
          the maximum there are 20 comparisons, yet the search is no faster than reading every node.
          Counting comparisons alone is the mistake.
      - id: unsorted-ok
        text: On an unsorted array it still finds `t` whenever `t` is present, only less reliably fast
        explanation: >-
          Without order, a probe says nothing about which side holds `t`. On
          `[9, 2, 7, 4, 1, 8, 5]` the targets 9, 7, 1, and 5 are all present, and the search returns
          `-1` for each. On shuffled 11-element arrays, roughly two thirds of the present targets
          are missed.
      - id: python-overflow
        text: "In Python, `(lo + hi) // 2` can overflow on huge lists, so write `lo + (hi - lo) // 2`"
        explanation: >-
          Python integers have arbitrary precision, so `lo + hi` cannot overflow:
          `(sys.maxsize + sys.maxsize) // 2` works. The advice comes from fixed-width integers in
          languages like Java, where `1_500_000_000 + 2_000_000_000` wraps to a negative number
          in 32 bits (in C, signed overflow is undefined behavior). The `lo + (hi - lo) // 2` form is harmless in Python, just unnecessary.
      - id: needs-access-and-order
        text: It needs O(1) access to the middle and an order, so one probe discards a whole side
        explanation: >-
          A probe is useful only if it settles a whole side. That needs an order (or, for an answer
          search, a yes/no test that flips once) and cheap access to the middle, which a Python
          `list` gives in O(1). A sorted array satisfies both. Missing cheap access loses the O(log n)
          bound. Missing order loses correctness: a probe no longer shows which side holds `t`, so a
          present value can be reported as absent.
    correct: needs-access-and-order
    followUps:
      linked-list-ok:
        prompt: Binary search on a sorted linked list makes O(log n) comparisons. Why is its total time still O(n) when the search keeps a pointer at the range start?
        options:
          - id: walk-cost
            text: Walking the links to each middle node adds up to about `n` steps
          - id: compare-cost
            text: Each comparison of two nodes walks the list from its head, costing O(n)
          - id: cannot-sort
            text: A linked list cannot be kept in sorted order once values are inserted
        correct: walk-cost
        explanation: >-
          Time is the number of probes times the cost of each probe. An array reaches `a[mid]` in
          O(1), but a linked list walks about half the current range on each probe, and with a pointer
          at the range start those walks sum to about `n`. Re-walking from the head on every probe can
          instead cost about `n log n`, as it does for a target above the maximum.
      unsorted-ok:
        prompt: On an unsorted array, what is wrong with discarding the right half after seeing `a[mid] > t`?
        options:
          - id: no-order
            text: Nothing says larger values are on the right, so `t` may be in the half that was discarded
          - id: slow-fix
            text: It is correct, but the discarded half must be scanned afterwards, which costs time
          - id: wrong-middle
            text: "`mid` is not the middle element when the array is unsorted"
        correct: no-order
        explanation: >-
          The discard step relies on an order. Without one, `a[mid] > t` says nothing about where
          `t` is. In `[9, 2, 7, 4, 1, 8, 5]` the probes for 5 hit 4, 8, and 1, and the search ends
          at `-1`, although 5 is at index 6.
      python-overflow:
        prompt: When does `(lo + hi) // 2` overflow in a language like Java or C?
        options:
          - id: fixed-width
            text: When `lo + hi` passes the largest value of a fixed-width int, such as 2^31 - 1
          - id: any-large
            text: Whenever the array is large, because `lo` and `hi` are then stored as floats
          - id: odd-sum
            text: Whenever `lo + hi` is odd, since integer division then rounds the sum down
        correct: fixed-width
        explanation: >-
          Fixed-width integer types wrap around (Java) or have undefined behavior (signed C) when the sum is too big. Python's `int` grows
          as needed, so the sum is exact and the `lo + (hi - lo) // 2` form is only a habit to keep
          when porting code. Rounding on odd sums is a separate matter, about rounding `mid` down or
          up.

  - id: answer-search-total-cost
    heading: What is the worst-case time complexity?
    tags: [binary-search, complexity]
    prompt: |-
      To find the smallest session limit for `n` files in order (sample: `sizes = [4, 9, 3, 7, 6, 2, 8]`
      with at most `d = 3` sessions), you binary search the limit:

      ```python
      lo, hi = max(sizes), sum(sizes)
      while lo < hi:
          mid = (lo + hi) // 2
          if feasible(mid):   # one pass over all n sizes
              hi = mid
          else:
              lo = mid + 1
      ```

      `feasible(x)` makes one pass over the `n` sizes, and `R = hi - lo + 1` is the size of the
      initial search range. What is the worst-case time of the whole loop?
    options:
      - id: log-r
        text: O(log R)
        explanation: >-
          That counts the probes and forgets their cost. The loop makes at most `ceil(log2 R)`
          probes, but each `feasible` call scans all `n` sizes. O(log R) would be right only if a
          probe took constant time, as when `bisect.bisect_left(a, x)` reads one element of a
          sorted list per step.
      - id: n-plus-log-r
        text: O(n + log R)
        explanation: >-
          Adding fits two separate phases, such as one pass over the data and then a search. Here
          `feasible` runs inside the loop, so its O(n) cost recurs on every probe. With 7 sizes and
          5 probes the loop made 35 element visits, not 12.
      - id: n-log-r
        text: O(n log R)
        explanation: >-
          The loop halves the range, so it makes at most `ceil(log2 R)` probes, and each probe costs
          O(n). For `sizes = [4, 9, 3, 7, 6, 2, 8]` and `d = 3`, `R = 31` and the loop made 5 probes,
          35 visits. In Python 3.10+, `bisect_left(range(lo, hi + 1), True, key=feasible)` runs this
          same search.
      - id: n-times-r
        text: O(n × R)
        explanation: >-
          O(n × R) is what you get by trying every limit from `lo` to `hi` in turn, with one O(n) test
          each. Binary search needs only about `log2 R` of those tests, because feasibility flips
          once. When `R` is in the billions, the gap decides whether the program finishes.
    correct: n-log-r
    followUps:
      log-r:
        prompt: >-
          Binary search on a sorted list reads `a[mid]` O(log n) times and is O(log n). What differs
          about `feasible(mid)`?
        options:
          - id: costs-n
            text: Each call has to scan the `n` sizes, so a probe costs O(n) instead of O(1)
          - id: hidden-sort
            text: It sorts the sizes first, so each probe costs O(n log n)
          - id: more-probes
            text: It gets called many more than `log2 R` times
        correct: costs-n
        explanation: >-
          Total time is the number of probes times the cost of one probe. Reading `a[mid]` is O(1),
          so O(log n) probes give O(log n). A greedy `feasible` visits every size, so O(n) per probe
          gives O(n log R). It does not sort, since the sizes must stay in their original order.
      n-plus-log-r:
        prompt: Is `feasible` run once before the loop, or once per probe?
        options:
          - id: per-probe
            text: Once per probe, with a different `mid` each time, so its cost multiplies the number of probes
          - id: once-only
            text: Once, because the result for one `mid` also answers every other `mid`
          - id: cached
            text: Once per probe, but each result is reused by later probes, so the passes add up only once
        correct: per-probe
        explanation: >-
          Each `mid` is a different limit and needs its own pass. The pass at 24 does not say how
          many sessions 16 needs. A cache would not help, because this loop never probes the same
          `mid` twice. Costs of separate phases add, and costs of work nested in a loop multiply.
      n-times-r:
        prompt: What lets binary search skip most of the `R` candidate limits that a linear scan would try?
        options:
          - id: single-flip
            text: "`feasible` flips once from false to true, so one probe discards every candidate on one side"
          - id: sorted-sizes
            text: The sizes are sorted, so the candidate limits are sorted as well
          - id: only-sizes
            text: It tries only limits equal to a file size
        correct: single-flip
        explanation: >-
          A failing probe at `mid` means every smaller limit fails, and a passing probe means every
          larger one passes. That discards half of the remaining candidates per probe, leaving about
          `log2 R` probes. The sizes need not be sorted, and the answer, 16 in the sample, need not
          equal any single size.

  - id: bs-recursive
    heading: Which recursive helper is correct?
    tags: [binary-search, recursion]
    prompt: >-
      Write a recursive search over `a`, a sorted ascending list of distinct integers (0-based indexes).
      The helper is `search(a, t, lo, hi)`. It returns the index of `t` within `a[lo..hi]`, or `-1` if
      `t` is absent. The top-level call is `search(a, t, 0, len(a) - 1)`. Each call sets `mid = (lo + hi) // 2`. If `a[mid] == t`, it returns `mid`.
      Which version is correct?
    options:
      - id: gt-base
        text: "`lo > hi` returns -1; if `a[mid] < t`, recurse on `(mid + 1, hi)`, else `(lo, mid - 1)`"
        explanation: >-
          The bounds are inclusive, so an empty range is `lo > hi`, and that base case is the only place -1
          comes from. Each miss removes `mid` from the range, so every call sees a smaller range and the recursion ends.
      - id: ge-base
        text: "`lo >= hi` returns -1; if `a[mid] < t`, recurse on `(mid + 1, hi)`, else `(lo, mid - 1)`"
        explanation: >-
          A one-element range (`lo == hi`) still holds a candidate. This base case returns before that element
          is compared, so `[2, 5]` with `t = 5` returns -1 instead of 1.
      - id: mid-no-plus-one
        text: "`lo > hi` returns -1; if `a[mid] < t`, recurse on `(mid, hi)`, else `(lo, mid - 1)`"
        explanation: >-
          `mid` is already ruled out, but `(mid, hi)` keeps it in range, so the range can stop shrinking once `mid == lo`, which happens when one or two elements remain. On `[1, 2]`
          with `t = 2`, the calls repeat `(0, 1)` until Python raises RecursionError. The recursion must start at `mid + 1`.
      - id: swapped-branches
        text: "`lo > hi` returns -1; if `a[mid] < t`, recurse on `(lo, mid - 1)`, else `(mid + 1, hi)`"
        explanation: >-
          In an ascending array, `a[mid] < t` means `t` lies to the right of `mid`. This version searches the left
          part, so `[1, 3, 5, 7]` with `t = 7` returns -1 instead of 3.
    correct: gt-base
    followUps:
      ge-base:
        prompt: >-
          On `a = [2, 5]` with `t = 5`, the outer call probes `mid = 0`, sees `2 < 5`, and returns the result of
          `search(a, t, 1, 1)`. With the base case `lo >= hi`, what does the outer call return?
        options:
          - id: child-minus-one
            text: "-1, since the child's -1 is passed up unchanged and `a[1]` is never read"
          - id: outer-compares
            text: "1, because the outer call compares the second value itself once the child misses"
          - id: outer-returns-mid
            text: "0, because the outer call returns the `mid` it probed, once the child has failed"
        correct: child-minus-one
        explanation: >-
          The outer call does not compare `a[1]`. After `mid = 0` it only returns the child's answer, and the child
          `search(a, t, 1, 1)` hits the base case `lo >= hi` and returns -1 before reading `a[1]`. So the whole search
          returns -1, not 1, which is the bug in this version.
      mid-no-plus-one:
        prompt: >-
          On `a = [1, 2]` with `t = 2`, the first probe is `mid = 0`, and `a[0] = 1 < 2`. The version recurses on
          `(mid, hi)`, which is `(0, 1)`. What happens next?
        options:
          - id: repeats
            text: "The same call `(0, 1)` repeats until Python raises RecursionError"
          - id: right-half
            text: "It probes `mid = 1` next and returns `1`, because the right half is searched next"
          - id: too-small
            text: "It returns -1, because a two-element range is too small to search"
        correct: repeats
        explanation: >-
          Recursing on `(mid, hi)` keeps `mid` in the range after it has been ruled out. Under floor division, `mid`
          equals `lo` when two elements remain, so the bounds never shrink. The recursion must start at `mid + 1`.
      swapped-branches:
        prompt: >-
          In an ascending array, suppose `a[mid] < t`. Which part of `a[lo..hi]` can hold `t`?
        options:
          - id: after-mid
            text: "Only indexes after `mid`, so the call recurses on `(mid + 1, hi)`"
          - id: before-mid
            text: "Only indexes before `mid`, so the call recurses on `(lo, mid - 1)`"
          - id: either-side
            text: "Either side, since one probe says nothing about where `t` lies"
        correct: after-mid
        explanation: >-
          In an ascending array, every element left of `mid` is at most `a[mid]`, so when `a[mid] < t` the target
          cannot be at or left of `mid`. Swapping the branches searches the wrong part: on `[1, 3, 5, 7]` with
          `t = 7`, the swapped version returns -1 instead of 3.

  - id: bs-recursive-space
    heading: What extra space does each version use?
    tags: [binary-search, complexity, recursion]
    prompt: >-
      Assume Python 3, a sorted ascending list `a` of `n` distinct integers (0-based indexes). Two versions look
      for `t`. One is an iterative loop that keeps `lo`, `hi`, and `mid` in variables. The other is a recursive
      helper `search(a, t, lo, hi)` that passes the same bounds. Ignoring the list itself, what
      extra space does each one use?
    options:
      - id: o1-and-log-n
        text: "Iterative: O(1). Recursive: O(log n), since each unfinished probe keeps a frame"
        explanation: >-
          The loop keeps `lo`, `hi`, and `mid`, so its extra space is O(1). The recursive version keeps one frame for
          each probe still in progress, plus the final call on the empty range. Each call halves the range, so the
          depth is about `log2 n`. Measured on CPython 3.12, the deepest point had 11 `search()` frames at n = 1,000 (10 probes)
          and 21 at n = 1,000,000 (20 probes).
      - id: both-log-n
        text: "Both O(log n), since the loop also stores one step for each halving"
        explanation: >-
          The loop does not store one bound for every halving. It keeps a fixed handful of names and replaces the
          active bound on each probe, so the extra space stays O(1) however many probes happen.
      - id: tail-call-reuse
        text: "Iterative: O(1). Recursive: O(1), since a `return` of a call reuses the frame"
        explanation: >-
          CPython does not turn a call in `return` position into a loop. Each probe adds a frame, plus a final call on
          the empty range, so the deepest point had 11 `search()` frames at n = 1,000 (10 probes) and 21 at n = 1,000,000
          (20 probes). That is O(log n), not O(1).
      - id: slice-copies
        text: "Iterative: O(1). Recursive: O(n), since each call copies its slice of `a`"
        explanation: >-
          The version in this question makes no slices. A slicing version keeps a copy of the remaining elements at
          each level. For n = 1,024, with `mid = (len - 1) // 2`, the same rule as the question, the copies alive at once total 1,013 references when the target is below every
          element (the copy is always `a[:mid]`), and 1,023 when it is above every element (always `a[mid + 1:]`).
          Either way the total is about n. Passing bounds avoids that, so it stays O(log n).
    correct: o1-and-log-n
    followUps:
      both-log-n:
        prompt: >-
          The iterative loop keeps `lo`, `hi`, and `mid` in three variables. Over many halvings, how many earlier
          bounds or midpoints does it keep?
        options:
          - id: none-kept
            text: "None. Each step overwrites `lo` or `hi`, so the same variables serve every step"
          - id: one-per-halving
            text: "One per halving, stored in a list so the search can undo a step"
          - id: all-probes
            text: "Every `mid` it has probed, because each one is needed to confirm a miss"
        correct: none-kept
        explanation: >-
          A miss discards `mid` and everything on one side, so older bounds are never read again. The loop therefore
          needs the same fixed number of variables however many halvings happen, which is O(1) extra space. A recursive
          version holds one frame per probe still in progress, and that is what makes its space O(log n).
      tail-call-reuse:
        prompt: >-
          A recursive search ends with `return search(a, t, mid + 1, hi)`. Does CPython drop the caller's frame before
          that call, so the stack stays flat?
        options:
          - id: frames-pile-up
            text: "No. Each call adds a frame, and the recursion limit caps how deep the calls can go"
          - id: reused-as-loop
            text: "Yes. A call in `return` position is turned into a loop, so the stack stays flat"
          - id: small-frames
            text: "No, but each frame is small, so the total stack stays O(1)"
        correct: frames-pile-up
        explanation: >-
          CPython does not eliminate tail calls. A function whose body is only `return f(n + 1)` raises RecursionError
          on Python 3.12, because each call adds a frame and the default limit is 1000. So the stack grows with the
          frame count, which is about log n for this search.
      slice-copies:
        prompt: >-
          In Python, what does the slice `a[lo:mid]` create?
        options:
          - id: new-references
            text: "A new list whose slots reference the same elements, so its cost grows with its length"
          - id: element-copies
            text: "A new list with a copy of each element, so every element is duplicated in memory"
          - id: shared-view
            text: "A view that shares `a`'s memory, so the slice costs O(1)"
        correct: new-references
        explanation: >-
          A slice makes a new list object and copies one reference per slot, so its time and memory grow with its
          length. The elements themselves are not copied: for `b = a[1:]` on `a = [[1], [2], [3]]`, `b[0] is a[1]` is `True`.
          The bounds-passing version makes no slices, so it pays none of this cost.

  - id: search-method-choice
    heading: Which method fits this one check?
    tags: [array, binary-search, hash-map]
    prompt: |-
      A script defines this list of 8 names. The names are in no particular order:

      ```python
      names = ["mira", "omar", "rosa", "theo", "lena", "kofi", "ada", "yuki"]
      ```

      It checks once whether `"ada"` is in `names`, and the list is never used again. Which method does this
      check with the least total work and the least extra memory?
    options:
      - id: linear-scan
        text: 'A linear scan, `"ada" in names`, since it reads names one by one and builds nothing'
        explanation: >-
          The names are not sorted, so the scan must read them in order until it reaches `"ada"`, at index 6, the seventh name.
          That is 7 comparisons here. Any correct method must read every name in the worst case, so for one check
          on unsorted data the scan is already the cheapest choice.
      - id: binary-search-unsorted
        text: 'Binary search on `names`, since each probe halves what is left to check'
        explanation: >-
          The list is not sorted, so a probe's comparison says nothing about which side holds `"ada"`. The halving
          search probes `"theo"`, then `"omar"`, then `"mira"`, and returns -1, although `"ada"` sits at index 6.
          Halving is valid only after sorting, and sorting first costs more than the scan here.
      - id: set-lookup
        text: "Build a set from `names`, then test membership, since an average set lookup is O(1)"
        explanation: >-
          Building the set reads all 8 names first, so it does the same O(n) work as the scan and also allocates a
          hash table. A set is not incorrect, but for one lookup it is worse. On CPython 3.12 the list object takes
          120 bytes and `set(names)` takes 728, while the scan needs no extra structure.
      - id: sort-then-search
        text: "Sort `names`, then binary search it, since binary search is O(log n) per lookup"
        explanation: >-
          The O(log n) search is cheap, but the sort in front of it is not. On CPython 3.12, sorting this list makes 16
          comparisons, and the scan needed 7. Sorting costs O(n log n) in the worst case, which is
          more than the single O(n) pass it would replace.
    correct: linear-scan
    followUps:
      binary-search-unsorted:
        prompt: >-
          What property of `names` does binary search need here?
        options:
          - id: sorted-order
            text: "The names must be sorted, so `names[mid]` shows which side can hold the target"
          - id: odd-length
            text: "The list must have an odd number of names, so there is a single middle index"
          - id: unique-names
            text: "Names cannot repeat, because a repeated name confuses the midpoint"
        correct: sorted-order
        explanation: >-
          Binary search depends on order: once `names` is sorted, every name left of `mid` is at most `names[mid]`, so
          one probe discards a side. Length does not matter: an even count such as the 8 names here still has a middle
          index under floor division. Repeated names do not break the discard either, because a probe that finds
          `names[mid] < t` still rules out everything at or left of `mid`.
      set-lookup:
        prompt: >-
          What does building the set cost, compared with the single scan?
        options:
          - id: same-order-plus-memory
            text: "It adds O(n) work and O(n) memory, so one lookup is no cheaper than the scan"
          - id: free-reuse
            text: "Nothing extra, because the set reuses the list's memory"
          - id: amortized-once
            text: "O(1) in total, because the build is paid once and the lookup is O(1)"
        correct: same-order-plus-memory
        explanation: >-
          A set builds its own hash table, with more slots than names (32 slots for these 8 on CPython 3.12), so the
          build reads every name and allocates new memory. The scan needs no setup and only constant extra space. A set
          pays off only after enough lookups to cover its build.
      sort-then-search:
        prompt: >-
          Sorting `names` first means calling a sort before the search. For this list, is that sort more work or
          less work than the one scan it replaces?
        options:
          - id: more-work
            text: "More. Sorting this list takes 16 comparisons, more than twice the scan's 7"
          - id: less-work
            text: "Less. Log2 of 8 is only 3, so sorting is cheap beside a pass over 8 names"
          - id: linear-sort
            text: "The same. Python's sort is linear on any input, so it costs one pass"
        correct: more-work
        explanation: >-
          On CPython 3.12, sorting this list makes 16 comparisons, and the scan needed 7. A sorted list and its strict
          reverse each took 7, so the input order changes the cost even at the same n. Python's sort is O(n log n) in
          the worst case, and here sorting before one lookup costs more than the lookup saves.
