id: repeated-states
title: Memoization
description: Say what a recursive call solves, spot the calls that repeat it, and answer a repeat from a cache. Each card asks for one decision, with a worked example on hand.
heading: What does the call solve?

questions:
  - id: suffix-subproblem
    heading: What does the call answer?
    tags: [dp, recursion]
    workedExample: |-
      A call's subproblem is the question it answers about the part of the input it is handed.
      Naming it shows which calls ask the same question, and this path uses that to skip repeated
      work. `climb(n)` counts the ways to climb `n` steps, 1 or 2 at a time: it returns 1 when
      `n <= 1`, and otherwise `climb(n - 1) + climb(n - 2)`.

      1. After a first move of 1 step, `n - 1` steps are left, and `climb(n - 1)` counts the ways to
         finish them. After a first move of 2, `climb(n - 2)` counts the rest.
      2. So each call is handed only what is still left. Its subproblem is "the ways to climb the
         `n` steps still left".
      3. `climb(3)` starts with every step left, so it answers the whole question:
         `climb(2) + climb(1) = 2 + 1 = 3`, for `1+1+1`, `1+2` and `2+1`.
    prompt: |-
      A call's subproblem is the question it answers about the part of the input it is handed, and
      its state is the arguments that decide that answer. `can_split(i)` asks about splitting a
      string `s` into words from `words`. `s.startswith(w, i)` checks whether `w` appears in `s`
      starting at index `i`.

      ```python
      def can_split(i):
          if i == len(s):
              return True
          for w in words:
              if s.startswith(w, i) and can_split(i + len(w)):
                  return True
          return False
      ```

      Which sentence names the subproblem `can_split(i)` solves?
    options:
      - id: suffix
        text: Whether `s[i:]`, the part from index `i` on, splits into words
        explanation: >-
          The call is only reached once `s[:i]` has been split, and it looks only at what is
          left, the suffix of `s` from index `i`. It succeeds when a word starts at `i` and the
          call after that word succeeds, down to `i == len(s)`, where nothing is left. So
          `can_split(0)` answers the whole question.
      - id: prefix
        text: Whether `s[:i]`, the first `i` letters, splits into words
        explanation: >-
          The first `i` letters were handled by the calls above this one. This call only reads
          from index `i` on, so its answer is about the rest of the string.
      - id: word-at-i
        text: Whether one of the words in `words` starts at index `i`
        explanation: >-
          A word at `i` is not enough. The `and` also needs `can_split(i + len(w))` to succeed, so
          the whole rest of the string has to split.
      - id: count-splits
        text: How many ways `s[i:]`, the part from index `i` on, splits into words
        explanation: >-
          The call returns `True` or `False` and stops at the first split that works. A count
          would add up the results of every word instead of returning early.
    correct: suffix
    followUps:
      prefix:
        prompt: When `can_split(3)` starts, which part of `s` is still undecided?
        options:
          - id: from-three
            text: "`s[3:]`, because the calls above it already split the first three letters"
          - id: first-three
            text: "`s[:3]`, because the argument counts the letters to split"
          - id: whole-string
            text: All of `s`, because every call checks the string from the start
        correct: from-three
        explanation: >-
          A recursive call is handed what is left to do. Here the argument is where the rest of
          the string begins, so the subproblem is the suffix from that index.
      word-at-i:
        prompt: >-
          With `words = ["ice", "cone"]` and `s = "icecold"`, a word starts at index 0. What does
          `can_split(0)` return?
        options:
          - id: rest-fails
            text: "`False`, because after `ice` the rest, `cold`, does not split"
          - id: word-found
            text: "`True`, because `ice` starts at index 0"
          - id: error
            text: It raises an error, because `cold` is not in `words`
        correct: rest-fails
        explanation: >-
          The subproblem includes everything after index `i`. A word at `i` only moves the
          question on to `can_split(i + len(w))`, and that call has to succeed too.
      count-splits:
        prompt: What does `can_split(i)` do when the first word it tries leads to a full split?
        options:
          - id: returns-true
            text: It returns `True` at once and tries no other word
          - id: adds-one
            text: It adds one to a running count and tries the next word
          - id: returns-count
            text: It returns the number of words it has tried so far
        correct: returns-true
        explanation: >-
          The return type is part of the subproblem's name. This one answers yes or no, so the
          first success settles it. A counting version would sum over every word.

  - id: first-repeat-tap
    format: tap-cell
    heading: Which call repeats?
    tags: [dp, recursion]
    workedExample: |-
      Consider plain `f(n) = f(n - 1) + f(n - 2)`, with `f(n) = n` when `n <= 1`, called as `f(4)`.
      Each call finishes its left call, `f(n - 1)`, before it starts its right call, `f(n - 2)`.

      1. `f(4)` calls `f(3)`, which calls `f(2)`, which calls `f(1)` and then `f(0)`. So the first
         five calls have the arguments 4, 3, 2, 1 and 0, each one new.
      2. `f(2)` returns to `f(3)`, which now makes its right call, `f(3 - 2)`, which is `f(1)`.
      3. 1 already appeared as the fourth call, so this sixth call, `f(1)`, is the first one that
         repeats an earlier argument.
    prompt: >-
      The cells list the arguments of `h(7)`'s calls in the order they start. Tap the first call
      whose argument already appeared.
    code: |
      def h(n):
          if n < 3:
              return 1
          return h(n - 2) + h(n - 3)

      h(7)
    sequence:
      kind: array
      name: calls
      cells: [7, 5, 3, 1, 0, 2, 4, 2, 1]
    correct: 7
    explanation: >-
      `h(7)` runs `h(5)` first, which runs `h(3)` and then `h(2)`. Back in `h(7)`, the second
      call is `h(4)`, which calls `h(2)` again. That `h(2)` is the first argument seen twice.
      Spotting the repeat comes first: a repeated call is the work that storing each answer
      would save.
    misses:
      - index: 0
        explanation: '`h(7)` is the first call, so nothing came before it to repeat.'
      - index: 1
        explanation: '`h(5)` is the first call made by `h(7)`, and no earlier call had 5.'
      - index: 2
        explanation: '`h(3)` comes from `h(5)`. 3 has not appeared before it.'
      - index: 3
        explanation: '`h(1)` comes from `h(3)` and is a stopping case, but no earlier call had 1.'
      - index: 4
        explanation: '`h(0)` is the second call from `h(3)`, and 0 is new.'
      - index: 5
        explanation: >-
          This is the first `h(2)`, made by `h(5)` after `h(3)` returns. The later `h(2)` repeats
          it, not the other way round.
      - index: 6
        explanation: >-
          `h(4)` is `h(7)`'s second call. 4 is new: `h(7)` called `h(5)` and `h(4)`, and nothing
          else had produced a 4.
      - index: 8
        explanation: >-
          This `h(1)` repeats too, but it comes after the second `h(2)`, so it is not the first
          repeat.

  - id: count-repeated-calls
    heading: How often is it called?
    tags: [dp, recursion]
    workedExample: |-
      Consider plain `f(4)` with `f(n) = f(n - 1) + f(n - 2)` and stopping cases `f(1)` and `f(0)`.
      Nothing is stored between calls, so each call path from 4 down to an argument makes its own
      call with that argument.

      1. `f(4)` calls `f(2)` directly, a drop of 2. That is one call of `f(2)`, along the path
         `4, 2`.
      2. `f(4)` also calls `f(3)`, which calls `f(2)` again, along the path `4, 3, 2`. So `f(2)` is
         called twice, once per path from 4 to 2.
      3. Each of those `f(2)` calls makes its own `f(1)` and `f(0)`, so the stopping cases under it
         repeat along with it.
    prompt: |-
      In plain `f(4)` below, `f(2)` is called twice, once along each call path from 4 down to 2.
      The two calls are in parentheses.

      ```text
      f(4)
      ├─ f(3)
      │  ├─ (f(2)) ─ f(1), f(0)
      │  └─ f(1)
      └─ (f(2)) ─ f(1), f(0)
      ```

      `h(n) = h(n - 2) + h(n - 3)`, with `h(n) = 1` for `n < 3`. How many times is `h(5)` called
      during `h(12)`?
    options:
      - id: three
        text: "3, one for each call path from 12 down to 5"
        explanation: >-
          Every way to drop 7 using steps of 2 and 3 is one call path, and 7 = 2 + 2 + 3 in three
          orders: 12, 10, 8, 5 and 12, 10, 7, 5 and 12, 9, 7, 5. Counting the calls
          confirms 3. Each of those calls redoes all of `h(5)`'s work.
      - id: one
        text: "1, because each argument is computed once"
        explanation: >-
          That is true only when each answer is stored and reused. Plain recursion starts a new
          `h(5)` every time a call path reaches 5, and three paths do.
      - id: two
        text: "2, one under `h(10)` and one under `h(9)`"
        explanation: >-
          `h(10)` reaches 5 along two paths, through 8 and through 7. Together with the path
          through 9 that makes three calls.
      - id: seven
        text: "7, because 12 - 5 = 7 levels separate them"
        explanation: >-
          7 is the gap, not a count of calls. Each call path covers the gap with steps of 2 and 3,
          and only three orders of steps add up to 7.
    correct: three
    followUps:
      one:
        prompt: In plain recursion, what happens each time a call path reaches 5?
        options:
          - id: new-call
            text: A new `h(5)` starts and runs its whole body again
          - id: returns-stored
            text: Python returns the value from the earlier `h(5)`
          - id: skipped
            text: The call is skipped, because 5 was already reached
        correct: new-call
        explanation: >-
          Python does not remember results on its own. A repeated argument is only answered from
          storage when the code stores each answer itself, which is what the next cards add.
      two:
        prompt: Along how many paths does `h(10)` reach 5?
        options:
          - id: two-paths
            text: Two, 10, 8, 5 and 10, 7, 5
          - id: one-path
            text: One, 10, 7, 5
          - id: three-paths
            text: Three, because every path from 12 goes through 10
        correct: two-paths
        explanation: >-
          From 10 the gap is 5, which is 2 + 3 or 3 + 2. Add the path through 9 (12, 9, 7, 5) and
          there are three calls in all.
      seven:
        prompt: Which list counts the calls to `h(5)`?
        options:
          - id: orders
            text: The orders of steps of 2 and 3 that add up to 12 - 5 = 7
          - id: gap
            text: The numbers from 6 to 12, one per level
          - id: distinct
            text: The distinct arguments between 5 and 12
        correct: orders
        explanation: >-
          Each call of `h(5)` sits at the end of one path of steps. Counting orders of steps, not
          the size of the gap, counts the calls.

  - id: store-each-once
    heading: How many results are computed?
    tags: [dp, hash-map, recursion]
    workedExample: |-
      Consider `g(n) = g(n - 1) + g(n - 2)`, with `g(n) = 1` when `n <= 1`, called as `g(6)`. Plain
      recursion makes 25 calls. Here `g` first checks a cache, a dict of results stored under their
      arguments, and returns a stored result at once.

      1. The first call with each argument finds nothing stored, so it computes its result and
         stores it.
      2. Every later call with that argument finds the stored result and returns it without
         computing, so it makes no calls of its own.
      3. The arguments run from 6 down to 0, so `g` computes 7 results, one per argument, in 11
         calls in all.
    prompt: |-
      `f(n)` is 1 when `n <= 1`, and `f(n - 1) + 2 * f(n - 2)` otherwise. As plain recursion,
      `f(28)` makes 1,028,457 calls. A cache is a dict that keeps each result under its argument.
      This version checks its cache first and returns a stored result at once:

      ```python
      cache = {}
      def f(n):
          if n in cache:
              return cache[n]
          if n <= 1:
              result = 1
          else:
              result = f(n - 1) + 2 * f(n - 2)
          cache[n] = result
          return result
      ```

      During `f(28)`, how many calls compute a result instead of returning a stored one?
    options:
      - id: twenty-nine
        text: "29"
        explanation: >-
          Each argument from 28 down to 0 is computed once, by the first call that reaches it, and
          every later call with it finds `cache[n]`. That is 29 results, where plain recursion
          made 1,028,457 calls.
      - id: fifty-five
        text: "55"
        explanation: >-
          55 is every call the cached version makes. 26 of them find their argument in `cache` and
          return at once, so only 29 compute.
      - id: twenty-six
        text: "26"
        explanation: >-
          26 is the number of calls that return a stored result. The other 29 calls, one per
          argument from 0 to 28, compute.
      - id: plain-count
        text: "1,028,457"
        explanation: >-
          That is the plain recursion. A call that finds its argument in `cache` returns before it
          makes any calls of its own, so the calls below it never start.
    correct: twenty-nine
    followUps:
      fifty-five:
        prompt: What does a call do when `n in cache` is true?
        options:
          - id: returns
            text: It returns the stored result at once
          - id: recomputes
            text: It computes the result again and overwrites the stored one
          - id: checks
            text: It computes the result and checks it against the stored one
        correct: returns
        explanation: >-
          The check comes before any work, so a call with a stored argument computes nothing. Only
          the first call with each argument computes.
      twenty-six:
        prompt: Which calls compute a result?
        options:
          - id: first-each
            text: The first call with each argument, which finds nothing stored
          - id: stored
            text: The calls that find their argument in `cache`
          - id: top-only
            text: Only `f(28)`, the call that was asked for
        correct: first-each
        explanation: >-
          A call computes only when its argument is not yet a key. Every argument from 0 to 28 is
          reached, so each is computed once.
      plain-count:
        prompt: A call finds its argument in `cache`. What happens to the calls it would have made?
        options:
          - id: never-start
            text: They never start, since it returns before its recursive calls
          - id: faster
            text: They still run, but each one is faster
          - id: half
            text: Half of them run, one branch instead of two
        correct: never-start
        explanation: >-
          A cache removes calls rather than speeding them up. The cached `f(28)` makes 55 calls in
          all, and only 29 of them compute.

  - id: trace-memo-hits
    format: step-trace
    heading: Which calls hit the cache?
    tags: [dp, hash-map, recursion]
    workedExample: |-
      Consider `t(n) = t(n - 2) + t(n - 3)`, with `t(n) = 1` when `n < 3`, a `memo` checked after
      the stopping case, and the call `t(10)`. A call is answered from `memo` only if an earlier
      call with the same argument has finished and stored its value.

      1. `t(10)` calls `t(8)`, which calls `t(6)`. Inside `t(6)`, `t(4)` and then `t(3)` finish and
         store 2 each, and `t(6)` stores 4.
      2. `t(8)` next calls `t(5)`, and `t(5)` calls `t(3)`. The earlier `t(3)` finished inside
         `t(6)`, so this call finds 3 in `memo` and returns 2 at once.
      3. So that `t(3)` is the first hit, inside `t(8)`, before `t(10)` makes its second call. Calls
         with 2, 1 or 0 never hit, because the stopping case returns before the `memo` check.
    prompt: >-
      Checking a cache before the work, and answering each repeat from it, is called memoization.
      Here `memo` is the cache. The cells are the arguments 0 to 5, and `call` marks one call.
      Predict each step of `f(5)`.
    code: |
      memo = {}
      def f(n):
          if n <= 1:
              return n
          if n in memo:
              return memo[n]
          memo[n] = f(n - 1) + f(n - 2)
          return memo[n]

      print(f(5))
    sequence:
      kind: array
      name: n
      cells: [0, 1, 2, 3, 4, 5]
    start:
      - { name: call, at: 5 }
    steps:
      - line: 7
        ask: Which call is the first to return from `memo`? Move `call` to its argument.
        pointer: call
        correct: 2
        explanation: >-
          `f(5)` runs down to `f(2)`, which stores 1. Then `f(3)` stores 2, and `f(4)` makes its
          second call, `f(2)`. 2 is in `memo` now, so that call returns at once.
        misses:
          - index: 1
            explanation: >-
              `f(1)` is called twice before any hit, but `n <= 1` returns before the `memo` check,
              and 1 is never stored.
          - index: 3
            explanation: '`f(3)` hits later, when `f(5)` makes its second call. `f(2)` hits first, inside `f(4)`.'
          - index: 4
            explanation: '`f(4)` is called once, from `f(5)`, so it never finds itself in `memo`.'
        elsewhere: The first repeated argument above 1 is 2, called again by `f(4)` after `f(2)` stored 1.
      - line: 7
        ask: "`f(4)` stores 3. Then `f(5)` calls `f(3)`. What happens?"
        options:
          - id: hit
            text: It finds 3 in `memo` and returns 2
            explanation: "`f(3)` finished inside `f(4)` and stored 2, so this call skips its body."
          - id: miss
            text: It runs its body again
            explanation: The first `f(3)` has already finished and stored its answer, so the check catches this one.
          - id: hit-three
            text: It finds 3 in `memo` and returns 3
            explanation: 3 is the key. The stored value is `f(3)`, which is 2.
        correct: hit
      - line: 10
        ask: How many calls of `f` run in all, counting `f(5)`?
        options:
          - id: nine
            text: "9"
            explanation: "`f(5)`, `f(4)`, `f(3)`, `f(2)`, `f(1)`, `f(0)`, `f(1)`, then the two hits, `f(2)` and `f(3)`. Plain recursion makes 15."
          - id: fifteen
            text: "15"
            explanation: 15 is the plain recursion. Each hit cuts off a whole subtree of calls.
          - id: six
            text: "6"
            explanation: There are 6 distinct arguments, but a repeat still makes a call. It just returns early.
          - id: four
            text: "4"
            explanation: 4 is the number of keys stored, 2 to 5. The other calls stop at `n <= 1` or hit.
        correct: nine
      - line: 10
        ask: What does `print(f(5))` show?
        options:
          - id: five
            text: "5"
            explanation: "`memo` ends as `{2: 1, 3: 2, 4: 3, 5: 5}`, so `f(5)` is 5, the same as without a cache."
          - id: eight
            text: "8"
            explanation: 8 would be `f(6)`. The cache changes how many calls run, not the values.
          - id: three-val
            text: "3"
            explanation: 3 is `f(4)`. `f(5)` adds `f(4)` and `f(3)`, which is 3 + 2.
        correct: five

  - id: lookup-after-work
    heading: What does the cache save?
    tags: [dp, hash-map, recursion]
    workedExample: |-
      Consider `ways(n) = ways(n - 1) + ways(n - 2)`, with `ways(n) = 1` when `n <= 1`, and a `memo`
      checked right after the stopping case, before the recursive calls. The call is `ways(10)`.

      1. The first call with each argument from 10 down to 2 finds nothing in `memo`, so it makes
         both recursive calls and stores its value.
      2. Any later call with one of those arguments meets the check before the recursive calls, so
         it returns the stored value and makes no calls of its own.
      3. So `ways(10)` makes 19 calls in all, while plain recursion makes 177. The saving comes from
         reading `memo` before the work starts.
    prompt: |-
      Solving each subproblem once and reusing its answer is called dynamic programming. This
      version checks `memo` only after both recursive calls:

      ```python
      memo = {}
      def ways(n):
          if n <= 1:
              return 1
          result = ways(n - 1) + ways(n - 2)
          if n in memo:
              return memo[n]
          memo[n] = result
          return result
      ```

      What does `ways(25)` do?
    options:
      - id: same-calls
        text: Returns 121,393 after 242,785 calls, since the check runs after the work
        explanation: >-
          The answer is right, but both recursive calls run before the check, so a repeat does the
          full work and only then finds its value. The call count matches the plain
          recursion exactly. A cache saves work only when it is read before the work starts.
      - id: forty-nine
        text: Returns 121,393 after 49 calls, since every repeat is in `memo`
        explanation: >-
          Repeats are in `memo`, but they are found too late. By the time a call reaches the
          check, it has already made both of its recursive calls.
      - id: wrong-value
        text: Returns a wrong value, since it returns `memo[n]` instead of `result`
        explanation: >-
          `memo[n]` was stored from the same calculation, so it equals `result`. The value is
          right at 121,393. Only the savings are lost.
      - id: recursion-error
        text: Raises `RecursionError`, since nothing stops a repeat from recursing
        explanation: >-
          `n <= 1` stops every chain, and the longest chain is only about 25 calls. Repeats
          recurse in full, which costs time, not more live calls.
    correct: same-calls
    followUps:
      forty-nine:
        prompt: When the second `ways(3)` starts, what does it do before it reaches `if n in memo`?
        options:
          - id: both-calls
            text: It calls `ways(2)` and `ways(1)`, the work the check was meant to skip
          - id: nothing
            text: Nothing, because the check is the first line after the stopping case
          - id: one-call
            text: It calls only `ways(2)`, since `ways(1)` is a stopping case
        correct: both-calls
        explanation: >-
          Lines run top to bottom. The `result =` line comes before the check, so every call
          recurses in full whether or not its answer is stored.
      wrong-value:
        prompt: When a repeat returns `memo[n]`, how does that value compare with its own `result`?
        options:
          - id: equal
            text: They are equal, since both come from the same arguments and the same body
          - id: stale
            text: "`memo[n]` is stale, since it was stored by an earlier call"
          - id: doubled
            text: "`memo[n]` is twice `result`, since both calls added to it"
        correct: equal
        explanation: >-
          `ways(n)` depends only on `n`, so every call with the same `n` computes the same value.
          The bug costs time, not correctness.
      recursion-error:
        prompt: During `ways(25)`, at most how many calls are live at once?
        options:
          - id: about-25
            text: About 25, along the chain `ways(25)`, `ways(24)`, down to `ways(1)`
          - id: about-49
            text: About 49, one for each call the cached version makes
          - id: unbounded
            text: Without limit, because repeats keep recursing
        correct: about-25
        explanation: >-
          The live calls at any moment form one chain, each waiting on the next, and each step
          lowers `n`. Repeated work makes the run slow, but it never makes a chain longer.

  - id: memo-reset-each-call
    heading: Does the cache ever hit?
    tags: [dp, hash-map, recursion]
    workedExample: |-
      Consider `memo = {}` built once, outside `ways`, with `ways(n) = ways(n - 1) + ways(n - 2)`,
      `ways(n) = 1` when `n <= 1`, and the check `if n in memo` before the recursive calls. The call
      is `ways(10)`.

      1. The dict is made once, before `ways(10)` runs, so every call reads and writes that same
         dict.
      2. When the first `ways(3)` returns, it stores `memo[3] = 3`, and the dict keeps that entry
         after the call ends. The next `ways(3)` finds it there and returns at once.
      3. So `ways(10)` makes 19 calls, while plain recursion makes 177. The cache helps because it
         outlives the calls that fill it.
    prompt: |-
      Here the dict is built inside the function:

      ```python
      def ways(n):
          memo = {}
          if n <= 1:
              return 1
          if n in memo:
              return memo[n]
          memo[n] = ways(n - 1) + ways(n - 2)
          return memo[n]
      ```

      How many calls does `ways(25)` make?
    options:
      - id: all-calls
        text: 242,785, since every call starts with a new, empty `memo`
        explanation: >-
          `memo = {}` runs at the start of every call, so each call has its own empty dict, and
          the check never finds anything. Stored values are thrown away when their call returns.
          It makes 242,785 calls, the same as no cache. The cache has to outlive
          the calls that read it.
      - id: forty-nine
        text: 49, since repeated arguments are still keyed by `n`
        explanation: >-
          The key is right, but each lookup goes to a dict that this call created a moment ago.
          The value from an earlier call sits in that call's dict, which is gone.
      - id: name-error
        text: None, since `memo` is local and inner calls raise `NameError`
        explanation: >-
          Each inner call runs `memo = {}` itself, so the name always exists. No error is raised,
          and `ways(25)` returns 121,393.
      - id: half
        text: About half, since each call reuses what its own child stored
        explanation: >-
          A child's dict is its own local variable, and it disappears when the child returns. The
          parent never sees it, so nothing is reused.
    correct: all-calls
    followUps:
      forty-nine:
        prompt: When the second `ways(3)` checks `if n in memo`, which dict does it look in?
        options:
          - id: own-new
            text: The empty dict it built on its first line
          - id: first-ways3
            text: The dict of the first `ways(3)`, which stored 3
          - id: shared
            text: One dict shared by every call
        correct: own-new
        explanation: >-
          A name assigned inside a function belongs to that call. To share one cache, build it
          outside the function (or pass it in), or use `functools.cache`.
      name-error:
