  - id: cache-decorator
    heading: How often does the body run?
    tags: [dp, python, recursion]
    workedExample: |-
      Consider `@cache` on `climb(n)`, whose body prints `n` and then returns 1 when `n <= 1`, and
      otherwise `climb(n - 1) + climb(n - 2)`. The call is `climb(4)`.

      1. The first call with each argument is a miss, so its body runs: `climb(4)`, `climb(3)`,
         `climb(2)`, `climb(1)` and `climb(0)` each print once.
      2. `climb(3)` then makes its second call, `climb(1)`. 1 is already a key, so the stored 1 comes
         back and the body, `print` included, does not run. The same happens when `climb(4)` calls
         `climb(2)` again.
      3. So `climb(4)` prints 5 lines, one per argument the calls reach (here every one from 4 down
         to 0), in 7 calls.
    prompt: |-
      `from functools import cache` brings in `@cache`. Written above a function, it keeps a dict
      whose keys are the arguments and whose values are the results. Each call looks up its
      arguments first. On a hit it returns the stored result without running the body, and on a
      miss it runs the body and stores what the body returns.

      ```python
      from functools import cache

      @cache
      def count(n):
          print(n)
          if n < 3:
              return 1
          return count(n - 2) + count(n - 3)

      count(10)
      ```

      How many lines does `count(10)` print?
    options:
      - id: ten
        text: "10"
        explanation: >-
          The body runs once for each argument the calls reach: 10, 8, 6, 4, 2, 1, 3, 0, 5 and 7, in
          the order they first appear. The other 5 calls are hits and print nothing. 9 never
          appears, since each call subtracts 2 or 3 from an argument of at most 10.
      - id: eleven
        text: "11"
        explanation: >-
          11 counts every argument from 0 to 10, but no call has 9. `count(10)` calls `count(8)`
          and `count(7)`, and every later argument is smaller than 8.
      - id: fifteen
        text: "15"
        explanation: >-
          15 is every call, hits included. A hit returns the stored result before the body starts,
          so its `print` never runs.
      - id: twenty-three
        text: "23"
        explanation: >-
          23 is the call count of plain recursion. A hit makes no calls of its own, so the cached
          run makes only 15 calls, and only the 10 misses print.
    correct: ten
    followUps:
      eleven:
        prompt: Which call passes 9 to `count`?
        options:
          - id: none
            text: None, since `count(10)` passes 8 and 7 and every later call passes less
          - id: top
            text: "`count(10)`, since its first call is one below it"
          - id: from-eleven
            text: "`count(11)`, since `11 - 2` is 9"
        correct: none
        explanation: >-
          A call passes `n - 2` and `n - 3`, never `n - 1`. The body runs once per argument that
          some call actually passes, so 9 adds no line.
      fifteen:
        prompt: A call to `count(4)` finds 4 already stored. What runs?
        options:
          - id: lookup
            text: Only the lookup, which returns the stored result and prints nothing
          - id: body-again
            text: The body, which prints 4 before the stored result is returned
          - id: replace
            text: The body, which prints 4 and replaces the stored result
        correct: lookup
        explanation: >-
          `@cache` checks its dict before the body starts. A hit skips every line of the body,
          `print` included.
      twenty-three:
        prompt: Why does the cached run make fewer calls than plain recursion?
        options:
          - id: subtree
            text: A hit returns before its body, so the calls it would make never start
          - id: faster
            text: "`@cache` makes each call faster, and the count stays the same"
          - id: stops
            text: "`@cache` skips the calls with `n < 3`"
        correct: subtree
        explanation: >-
          Only a miss runs the body and makes recursive calls. Each hit cuts off the whole set of
          calls below it.

  - id: key-misses-total
    heading: What does the cache return?
    tags: [dp, hash-map, recursion]
    workedExample: |-
      Consider `climb(n)`, which returns `climb(n - 1) + climb(n - 2)`, and 1 when `n <= 1`. A cache
      key is safe only if every call with that key has the same answer.

      1. The body reads nothing but `n`. No second argument and no outside value can change what it
         returns.
      2. So two calls with the same `n` always return the same value. For example, both calls to
         `climb(2)` inside `climb(4)` return 2.
      3. That makes `n` alone a safe key, and `memo[n]` can hold the answer of `climb(n)`.
    prompt: |-
      This counts the ways to put `+` or `-` before each number so the total is `target`.
      With `nums = [1, 2, 1, 2]` and `target = 2` there are 3 ways.

      ```python
      memo = {}
      def count(i, total):
          if i == len(nums):
              return 1 if total == target else 0
          if i in memo:
              return memo[i]
          memo[i] = (count(i + 1, total + nums[i])
                     + count(i + 1, total - nums[i]))
          return memo[i]
      ```

      What does `count(0, 0)` return?
    options:
      - id: eight
        text: "8, because the answer stored for an index is reused for any total"
        explanation: >-
          The first call to reach `i = 3` has `total = 4`, and its answer, 1, goes into
          `memo[3]`. Every later call at `i = 3` gets that 1, whatever its total. The wrong
          values add up to 8. The subproblem is "the ways to finish from index `i`
          with this running total", so the state, and the key, must be `(i, total)`.
      - id: three
        text: "3, because the cache only skips work and never changes a result"
        explanation: >-
          That holds only when the key names every input the answer depends on. Two calls with the
          same `i` and different totals have different answers, yet they share one slot here.
      - id: sixteen
        text: "16, because every one of the 16 sign choices is counted"
        explanation: >-
          The reused values are wrong, but not that wrong. Calls at the last index return 0 or 1,
          so the stored values are 1, 2, 4 and 8, not a count of all 16 sign patterns.
      - id: key-error
        text: "It raises `KeyError`, because `memo[i]` is read before it is stored"
        explanation: >-
          The `if i in memo` check guards the read, so `memo[i]` is only read once it exists.
          No error is raised. The result is wrong instead.
    correct: eight
    followUps:
      three:
        prompt: >-
          `count(3, 4)` and `count(3, 2)` both reach the last number, 2. What does each return?
        options:
          - id: one-and-one
            text: Both return 1, so they can share a slot safely
          - id: zero-and-zero
            text: Both return 0, because one number cannot bring either total to 2
          - id: differ
            text: "`count(3, 4)` returns 1 and `count(3, 2)` returns 0, so one key cannot hold both"
        correct: differ
        explanation: >-
          From total 4, only `- 2` reaches 2. From total 2, `+ 2` gives 4 and `- 2` gives 0, so
          neither works. Different answers for the same `i` mean the total belongs in the key.
      sixteen:
        prompt: What does `memo[3]` hold after the first call at `i = 3` returns?
        options:
          - id: one
            text: 1, the number of ways to finish from total 4
          - id: two
            text: 2, one for each sign of the last number
          - id: sixteen-ways
            text: 16, the number of sign patterns in all
        correct: one
        explanation: >-
          A slot holds the answer of the call that filled it, not a count of every pattern. Here
          `memo[3]` gets 1, and `memo[2]`, `memo[1]` and `memo[0]` get 2, 4 and 8, each built
          from reused values.
      key-error:
        prompt: When can `return memo[i]` run?
        options:
          - id: after-store
            text: Only after some call has stored `memo[i]`, because the `in` check comes first
          - id: first-call
            text: On the first call at each index, before anything is stored
          - id: never
            text: Never, because the store line always runs before it
        correct: after-store
        explanation: >-
          `i in memo` is `False` until a value is stored, so the read is safe. The bug is not a
          missing key but a key that leaves out the running total.
