        options:
          - id: binds-local
            text: It makes a new empty dict, local to that inner call
          - id: reads-outer
            text: It reads the caller's `memo`
          - id: raises
            text: It raises an error, because `memo` already exists in the caller
        correct: binds-local
        explanation: >-
