id: traversal-layers
title: Traversal layers
description: Trace the queue, label distances, and start a wave from several sources.
questions:
  - id: traversal-layer-pop-trace
    format: step-trace
    tags:
      - bfs
      - queue
    workedExample: |-
      Consider `queue = deque(["P", "Q", "R"])`, in the order they joined. `popleft()` removes the
      front node, and `append` adds a node at the back, behind every node already waiting.

      1. `queue.popleft()` removes P, the front node, which leaves `[Q, R]`.
      2. Appending P's new neighbor S puts it behind R: `[Q, R, S]`. So `queue[0]` is Q.
      3. The next `popleft()` removes Q. R joined before S, so `queue[0]` is now R, and S waits
         behind it.
    prompt: |-
      The queue contains B and C, both at distance 1. D is the only new neighbor of B.
      The row shows every node in arrival order, including D, which has not been appended yet.
      Predict the next node at the front of the queue after each step.
    code: |-
      node = queue.popleft()
      queue.append(next_neighbor[node])
      front = queue[0]
      node = queue.popleft()
      front = queue[0]
    sequence:
      kind: array
      name: nodes
      cells: [B, C, D]
    start:
      - name: front
        at: 0
    steps:
      - line: 1
        ask: After removing B and appending D, which node is at the front?
        pointer: front
        correct: 1
        explanation: C was already waiting when D joined. Removing B leaves C at the front.
        misses:
          - index: 0
            explanation: B was removed by `popleft`, so it is no longer at the front.
          - index: 2
            explanation: Appending D puts it behind C, which was already waiting.
        elsewhere: Appending D puts it behind C, which was already waiting.
      - line: 4
        ask: After the next pop, which node is at the front?
        pointer: front
        correct: 2
        explanation: The second pop removes C, the last node at distance 1. D now starts the next layer.
        elsewhere: The two pops removed B and C. D is the only node still waiting.
  - id: traversal-layer-freeze-length
    tags:
      - bfs
    workedExample: |-
      A round starts with the queue `[U, V]`. The round's length is `n = len(queue)`, read once
      before its first pop.

      1. The queue holds U and V when the round starts, so `n` is 2.
      2. Popping U adds its new neighbor W at the back, so the queue is `[V, W]`. `n` stays 2,
         because it was read before W arrived.
      3. The round's second pop takes V, and after 2 pops the round ends. W waits for the next
         round, since it is one layer further out.
    prompt: A new round starts with P, Q, R. P adds two nodes. How many pops finish this round?
    options:
      - id: correct
        text: Three pops, for P, Q and R
        explanation: The initial queue length defines this round. Discoveries from the round belong to the next
          layer.
      - id: other
        text: Five pops, for P, Q, R and the new nodes
        explanation: Separate the starting frontier from what it discovers.
    correct: correct
    followUps:
      other:
        prompt: At the start of the round, are the nodes found by P already in the queue?
        options:
          - id: 'yes'
            text: They will arrive later
          - id: 'no'
            text: They are part of the initial queue
        correct: 'yes'
        explanation: The initial queue length defines this round. Discoveries from the round belong to the next
          layer.
  - id: traversal-layer-cross-edge
    tags:
      - bfs
    workedExample: |-
      BFS runs from `S` on `graph = {"S": ["A", "B"], "A": ["B", "C"], "B": [], "C": []}`. A node is
      labeled and appended at the back when it is first found, and a node already found is skipped.

      1. Popping S finds A, then B, so both get label 1 and the queue is `[A, B]`.
      2. Popping A finds B along the edge `A→B`, which joins two nodes of the same layer. B was
         already found, so it keeps label 1 and its place in the queue.
      3. A's other neighbor, C, is new, so it gets label `1 + 1`, which is 2, and joins at the back
         behind B. The labels end as A 1, B 1 and C 2.
    prompt: |-
      The queue starts with M followed by N, both one move from the start. BFS removes M
      and appends its new neighbor X. Which node is first now?
    options:
      - id: correct
        text: N, the other one-move node
        explanation: The queue holds N followed by X. Adding a node at the back preserves the turn of each earlier
          discovery.
      - id: other
        text: X, the newly discovered node
        explanation: Write the remaining queue before appending X.
    correct: correct
    followUps:
      other:
        prompt: Where does X join the queue?
        options:
          - id: 'yes'
            text: After the nodes already waiting
          - id: 'no'
            text: At the front of the queue
        correct: 'yes'
        explanation: The queue holds N followed by X. Adding a node at the back preserves the turn of each earlier
          discovery.
  - id: traversal-distance-one-step
    tags:
      - bfs
    workedExample: |-
      BFS starts at `S`, and `S -> P -> R` is a path of unseen nodes. Each edge costs one move, and
      a node's label is the number of moves needed to reach it.

      1. `S` is the start, so reaching it takes 0 moves, and its label is 0.
      2. `P` is one edge from `S`. Reaching it takes the 0 moves to `S` plus 1 for the edge, so `P`
         gets the label `0 + 1`, which is 1.
      3. `R` is one edge from `P`. It takes the 1 move to reach `P` plus 1 more, so `R` gets the
         label `1 + 1`, which is 2.
    prompt: A node with label 4 discovers an unseen neighbor across one unit-cost edge. What label does the
      neighbor get?
    options:
      - id: correct
        text: 5 moves
        explanation: Following one edge adds one move to the distance already traveled to reach its parent.
      - id: other
        text: 4 moves
        explanation: Count the move from the parent to the neighbor.
    correct: correct
    followUps:
      other:
        prompt: Does taking the next edge use any of the moves in the path to the parent?
        options:
          - id: 'yes'
            text: It adds an extra move
          - id: 'no'
            text: It reuses the parent’s final move
        correct: 'yes'
        explanation: Following one edge adds one move to the distance already traveled to reach its parent.
  - id: traversal-distance-detour
    tags:
      - bfs
    workedExample: |-
      In the grid below, S starts at minute 0 and `#` is a wall. Each minute moves one cell up,
      down, left or right onto an open cell.

      ```text
      S#.T
      ....
      ```

      1. The cell right of S, (0, 1), is a wall, and the grid has nothing above or left of S. So the
         first move must be down, to (1, 0), at minute 1.
      2. T is 3 columns right of S, so the walk needs at least 3 right moves. It also left row 0, so
         it needs 1 up move to return to T's row.
      3. That is at least `1 + 3 + 1`, which is 5 moves, and going down, right 3 times, then up
         takes exactly 5. So BFS first reaches T at minute 5.
    prompt: |-
      In this grid, S starts at minute 0. Move one cell per minute in four directions. When can BFS first reach T?

      ```text
      S#T
      ...
      ```
    options:
      - id: correct
        text: Minute 4, by going around the wall
        explanation: The shortest legal walk goes down, right twice, then up. Each edge contributes one minute.
      - id: other
        text: Minute 2, by moving straight across
        explanation: Trace a walk that only enters open cells.
    correct: correct
    followUps:
      other:
        prompt: Can the first step from S move right?
        options:
          - id: 'yes'
            text: The wall blocks that step
          - id: 'no'
            text: The wall costs one extra step
        correct: 'yes'
        explanation: The shortest legal walk goes down, right twice, then up. Each edge contributes one minute.
  - id: traversal-seed-zero
    tags:
      - bfs
    workedExample: |-
      One machine, M, starts sending at time 0, and each link takes 1 minute. A node's BFS distance
      is the minute it first has the message.

      1. M has the message at time 0, before any link is crossed, so its distance is 0.
      2. BFS grows outward from nodes whose distance is already known. So M goes into the queue with
         distance 0 before any edge is processed.
      3. When M is popped, each neighbor one link away gets distance `0 + 1`, which is 1.
    prompt: Two machines both start sending at time 0. Both are seed nodes. How should BFS prepare its queue
      before processing any edges?
    options:
      - id: correct
        text: Queue both with distance 0
        explanation: Both sources are already active at the start. Queue order breaks ties within minute zero
          without changing their labels.
      - id: other
        text: Queue one with distance 0 and the other with distance 1
        explanation: Think about when the second source starts sending.
    correct: correct
    followUps:
      other:
        prompt: Must a message travel to the second source before that source is active?
        options:
          - id: 'yes'
            text: It is already active
          - id: 'no'
            text: It must get the first message
        correct: 'yes'
        explanation: Both sources are already active at the start. Queue order breaks ties within minute zero
          without changing their labels.
  - id: traversal-nearer-seed
    tags:
      - bfs
    workedExample: |-
      Consider the row `S . X . . S`, with positions 0 to 5. Both sources start at move 0, and each
      move goes one position left or right.

      1. The left S is at position 0 and X is at position 2, so it needs `2 - 0`, which is 2 moves.
      2. The right S is at position 5, so it needs `5 - 2`, which is 3 moves.
      3. Both sources start together, so X is first reached after the smaller count, 2 moves, by the
         left source.
    prompt: |-
      In the row below, which source reaches X first? Each step is one position left or right.

      ```text
      S . . X S
      ```
    options:
      - id: correct
        text: The source to the right of X
        explanation: The right source is one move away, closer than the left source. Starting both together makes
          X’s label the smaller distance.
      - id: other
        text: The source to the left of X
        explanation: Count from both starting positions to X.
    correct: correct
    followUps:
      other:
        prompt: How many moves does the source to the left need to reach X?
        options:
          - id: 'yes'
            text: Three moves
          - id: 'no'
            text: One move
        correct: 'yes'
        explanation: The right source is one move away. The left source is three moves away. Starting both together
          makes X’s label the smaller distance.
