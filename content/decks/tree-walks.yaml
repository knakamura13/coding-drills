id: tree-walks
title: Tree walks
description: Name the parts of a binary tree, trace the order a walk visits them, and tell height from node count.
heading: What does the walk do?

questions:
  - id: tree-walks-follow-links
    format: tap-cell
    heading: Which node is it?
    tags: [tree]
    workedExample: |-
      A binary tree stores values in nodes. The top node is the root, and each node links to at
      most two children, `.left` and `.right`. A missing child is `None`. Here `root` is P:

      ```text
          P
         / \
        Q   R
           / \
          S   T
      ```

      1. `root` is P, so `root.right` follows P's right link one level down, to R.
      2. `root.right` is R, so `root.right.left` follows R's left link one more level down, to S.
      3. So `root.right.left` names S, two links below the root.
    prompt: |-
      A binary tree stores values in nodes, and every card in this path uses this class:

      ```python
      class TreeNode:
          def __init__(self, val, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right
      ```

      `TreeNode(5)` builds a node holding 5 with no children, and `TreeNode(5, a, b)` builds one
      whose left child is `a` and right child is `b`. A missing child is `None`. The top node is
      the root, and each `.left` or `.right` moves one level down, to a child. Here `root` is A.
      Tap the node that `root.left.right` names.

      ```text
              A
             / \
            B   C
           / \   \
          D   E   F
             /
            G
      ```
    code: |
      node = root.left.right
    sequence:
      kind: array
      name: nodes
      cells: [A, B, C, D, E, F, G]
    correct: 4
    explanation: >-
      Read the links from left to right. `root` is A, `.left` moves down to B, and `.right` moves down
      from B to its right child, E. Each link moves exactly one level down.
    misses:
      - index: 0
        explanation: >-
          A is `root` itself. Every `.left` or `.right` moves one level down, so two links end two levels
          below A.
      - index: 1
        explanation: That is `root.left`. The `.right` after it moves one more level down, from B to its right child.
      - index: 2
        explanation: >-
          That is `root.right`. The first link after `root` is `.left`, which goes to B, and the
          `.right` is taken from there.
      - index: 3
        explanation: That is `root.left.left`. The second link is `.right`, so it goes to B's other child.
      - index: 5
        explanation: >-
          F is `root.right.right`. The first link here is `.left`, so the walk never enters C's side of
          the tree.
      - index: 6
        explanation: >-
          G is `root.left.right.left`, three links down. `root.left.right` stops one level higher, at
          E.

  - id: tree-walks-subtree-members
    heading: Which nodes are in the subtree?
    tags: [tree]
    workedExample: |-
      Take `TreeNode(1, TreeNode(2, TreeNode(4)), TreeNode(3))`: 1 has children 2 and 3, and 2
      has the left child 4. A subtree is a node plus every node below it, however many levels
      down.

      1. The subtree is rooted at 2, so 2 itself is in it.
      2. 2 has one child, 4, so 4 is below 2 and is in the subtree too.
      3. 4 has no children, so nothing else is below 2. 1 is above 2 and 3 is beside it, so
         neither is included. The subtree rooted at 2 is 2 and 4.
    prompt: |-
      A node's children are the nodes one link below it, and its parent is the node one link
      above it. The subtree rooted at a node is that node together with every node below it:
      its children, their children, and so on.

      ```text
              A
             / \
            B   C
           / \   \
          D   E   F
             /
            G
      ```

      Which nodes make up the subtree rooted at B?
    options:
      - id: children-only
        text: D and E
        explanation: >-
          D and E are B's children, but a subtree also holds its own root and every node further
          down. G sits below E, and B itself is the root of this subtree.
      - id: no-root
        text: D, E and G
        explanation: >-
          These are the nodes below B, but a subtree includes the node it is rooted at, so B
          itself belongs to it.
      - id: whole
        text: B, D, E and G
        explanation: >-
          A subtree is one node and every node below it. Below B are its children D and E and E's
          child G, so the subtree holds B, D, E and G.
      - id: with-parent
        text: A, B, D, E and G
        explanation: >-
          A is B's parent, above B. A subtree reaches only downward from its root, so it never
          includes a node above it.
    correct: whole
    followUps:
      children-only:
        prompt: G is E's child, and E is B's child. Is G in the subtree rooted at B?
        options:
          - { id: yes-descendant, text: "Yes, because a subtree holds every node below its root, however many levels down" }
          - { id: no-grandchild, text: "No, because G is two links below B, not one" }
          - { id: no-hangs, text: "No, because G hangs from E, not from B" }
        correct: yes-descendant
        explanation: >-
          A subtree is not limited to one level. It holds its root and every node below it, so
          children, grandchildren and nodes further down all count.
      no-root:
        prompt: In this tree, why is C part of the subtree rooted at C?
        options:
          - { id: root-included, text: "A subtree is named by its root, and the root is one of its nodes" }
          - { id: c-is-leaf, text: "C is included only because it has a single child" }
          - { id: c-is-right, text: "C is included only because it is a right child" }
        correct: root-included
        explanation: >-
          The node a subtree is rooted at is its top node, so it is always one of the subtree's
          nodes.
      with-parent:
        prompt: Which direction does a subtree extend from its root?
        options:
          - { id: down-only, text: "Only downward, through children and their children" }
          - { id: up-and-down, text: "Up to the parent and down to the children" }
          - { id: whole-level, text: "Sideways across the root's level, then downward" }
        correct: down-only
        explanation: >-
          A node's subtree is the node plus every node below it. Its parent and the nodes beside it
          are outside it, and following `.left` and `.right` from it never reaches them.

  - id: tree-walks-review-leaves
    heading: Which nodes are leaves?
    tags: [tree]
    workedExample: |-
      Consider `TreeNode(1, TreeNode(2), TreeNode(3, TreeNode(4)))`. A leaf is a node whose
      `.left` and `.right` are both `None`.

      1. Node 1 has `.left` 2 and `.right` 3, so it has children and is not a leaf.
      2. Node 3 has `.left` 4. Its `.right` is `None`, but one child is enough, so 3 is not a leaf.
      3. Nodes 2 and 4 have no children, so they are the leaves, though 4 sits one level lower
         than 2.
    prompt: |-
      A leaf is a node with no children: both `.left` and `.right` are `None`.

      ```text
              P
             / \
            Q   R
           /   / \
          S   T   U
               \
                W
      ```

      Which nodes are leaves?
    options:
      - id: bottom-row
        text: S, T, U and W
        explanation: >-
          T is drawn on the same level as S and U, but it has a right child, W. A leaf is defined by
          its links, not by how low it is drawn.
      - id: right
        text: S, U and W
        explanation: >-
          S, U and W each have `None` on both sides. Every other node has at least one child: P, R and T
          have one or two, and Q has S.
      - id: deepest
        text: W only
        explanation: >-
          W is the lowest node, but leaves can sit on different levels. S and U also have no
          children.
      - id: one-child
        text: Q, S, U and W
        explanation: >-
          Q has only one child, but one child is enough to make a node not a leaf. Q's left link
          points to S.
    correct: right
    followUps:
      bottom-row:
        prompt: What is `T.right` in this tree?
        options:
          - { id: is-w, text: "W, so T has a child" }
          - { id: is-none, text: "`None`, because T is on the same level as S and U" }
          - { id: is-u, text: "U, the node beside it" }
        correct: is-w
        explanation: >-
          A node with any non-`None` link is not a leaf. W hangs from T's right link, so T has a child
          even though it is drawn on the same level as two leaves.
      deepest:
        prompt: What are `S.left` and `S.right`?
        options:
          - { id: both-none, text: "Both `None`, so S has no children" }
          - { id: s-has-w, text: "`S.right` is W" }
          - { id: unknown, text: "They cannot be read, because S is not at the bottom" }
        correct: both-none
        explanation: >-
          Being a leaf depends only on a node's own links. S has no children, so it is a leaf two levels
          below the root, while W is a leaf three levels below.
      one-child:
        prompt: Is a node with exactly one child a leaf?
        options:
          - { id: not-leaf, text: "No, because one of its links points to a node" }
          - { id: half-leaf, text: "Yes, because one of its links is `None`" }
          - { id: depends, text: "Only if the child is on the left" }
        correct: not-leaf
        explanation: >-
          A leaf needs both links to be `None`. A node with one child still has a node below it, so
          it is not a leaf.

  - id: tree-walks-three-node-orders
    heading: What is in `out` afterward?
    tags: [tree, dfs, recursion]
    workedExample: |-
      A tree walk visits every node once. A recursive `walk` returns at `None`; otherwise it calls
      itself on both children and records the node with `out.append(node.val)`. Take
      `TreeNode(4, TreeNode(1), TreeNode(6))`, with the append placed before both calls.
      `TreeNode(val, left, right)` builds a node with those children, so this is 4 with 1 on the
      left and 6 on the right.

      1. The call on 4 runs its append first, so `out` becomes `[4]`.
      2. Next it runs `walk(node.left, out)`, the call on 1. That call appends 1, and its calls on
         `None` return at once, so `out` becomes `[4, 1]`.
      3. Last, the call on 4 runs `walk(node.right, out)`, which appends 6. So `out` ends as
         `[4, 1, 6]`: each node comes before the nodes below it.
    prompt: |-
      A tree walk visits every node once. This recursive `walk` returns at `None`; otherwise it
      calls itself on both children and records the node. Each line runs after the call on the
      line before it returns. Where the append sits names the walk: before both calls is
      preorder, between them is inorder, after both is postorder. Below is an inorder walk on
      `TreeNode(5, TreeNode(3), TreeNode(8))`, with `out` starting as `[]`.

      ```python
      def walk(node, out):
          if node is None:
              return
          walk(node.left, out)
          out.append(node.val)
          walk(node.right, out)
      ```

      ```text
        5
       / \
      3   8
      ```

      What is in `out` afterward?
    options:
      - id: preorder
        text: "`[5, 3, 8]`"
        explanation: >-
          That is the preorder list, which needs the append before both calls. Here the call on the
          left child runs first, so 3 is recorded before 5.
      - id: inorder
        text: "`[3, 5, 8]`"
        explanation: >-
          The call on 5 first runs `walk` on its left child, which records 3. Then 5 runs its own append,
          and last the call on its right child records 8. A node between the calls lands between its
          left and right subtrees.
      - id: postorder
        text: "`[3, 8, 5]`"
        explanation: >-
          That is the postorder list, which needs the append after both calls. Here the call on 5
          records 5 as soon as its left call returns, before it starts the call on 8.
    correct: inorder
    followUps:
      preorder:
        prompt: What is the first line the call on 5 runs after its `None` check?
        options:
          - { id: left-call, text: "`walk(node.left, out)`, so the call on 3 runs before 5 is recorded" }
          - { id: append-first, text: "`out.append(node.val)`, so 5 is recorded first" }
          - { id: right-call, text: "`walk(node.right, out)`, so 8 is recorded first" }
        correct: left-call
        explanation: >-
          Lines run top to bottom inside each call. Whatever sits above the append runs first, so a
          left call above it records the whole left subtree before the node.
      postorder:
        prompt: When the call on 3 returns, what does the call on 5 run next?
        options:
          - { id: its-append, text: "Its append, which records 5" }
          - { id: right-next, text: "The call on 8, because both children come first" }
          - { id: return-now, text: "It returns, because 3 was its only job" }
        correct: its-append
        explanation: >-
          The append is the next line after the left call. The right call comes after it, so 5 is
          recorded before 8 here. Only an append placed after both calls waits for both children.

  - id: tree-walks-preorder-trace
    format: step-trace
    heading: Which node is recorded next?
    tags: [tree, dfs, recursion]
    prompt: |-
      `walk(root, out)` is a preorder walk: it records a node, then walks its left subtree, then its
      right subtree. The cells list the nodes level by level; they are not the visiting order. The call on A has just recorded A.
      Tap the node whose call records next, each time.

      ```text
              A
             / \
            B   C
           / \   \
          D   E   F
      ```
    code: |-
      def walk(node, out):
          if node is None:
              return
          out.append(node.val)
          walk(node.left, out)
          walk(node.right, out)
    sequence:
      kind: array
      name: nodes
      cells: [A, B, C, D, E, F]
    start:
      - { name: call, at: 0 }
    steps:
      - line: 4
        ask: Which node is recorded after A?
        pointer: call
        correct: 1
        explanation: A's next line is the call on its left child, B, and B records itself before anything else.
        misses:
          - index: 2
            explanation: >-
              C is A's right child. A runs its left call first, and that call has to finish B's whole
              subtree before A reaches the line that calls C.
          - index: 3
            explanation: D is below B. The call on B records B before it calls D.
        elsewhere: A calls its left child first, and that call records its own node before going further down.
      - line: 4
        ask: Which node is recorded after B?
        pointer: call
        correct: 3
        explanation: B's next line is its own left call, so D is recorded next.
        misses:
          - index: 2
            explanation: >-
              C is the next cell, but the cells list nodes level by level, not in visiting order. A
              recursive walk goes down first: B calls D before the call on B returns to A.
          - index: 4
            explanation: E is B's right child. B calls its left child, D, first.
        elsewhere: After recording itself, B calls its left child, so the walk goes one level down.
      - line: 4
        ask: Which node is recorded after D?
        pointer: call
        correct: 4
        explanation: >-
          D has no children, so its two calls on `None` return at once. Control goes back to B, whose
          next line is the call on its right child, E.
        misses:
          - index: 2
            explanation: >-
              C waits until the call on B returns, and B still has its right call to make. E is
              recorded first.
          - index: 1
            explanation: B was recorded already, before its children. A call records its node once.
        elsewhere: D is a leaf, so the call on D returns to B, which still has a right child to visit.
      - line: 4
        ask: Which node is recorded after E?
        pointer: call
        correct: 2
        explanation: >-
          E is a leaf, so its call returns to B. B has finished both calls and returns to A, whose last
          line calls its right child, C.
        misses:
          - index: 5
            explanation: >-
              F is below C. The call on C records C before it reaches the line that calls F.
          - index: 0
            explanation: A was recorded first. The call on A resumes at its right call, without recording A again.
        elsewhere: After B's subtree is done, A calls its right child, which records itself before its children.

  - id: tree-walks-postorder-list
    heading: What is in `out` afterward?
    tags: [tree, dfs, recursion]
    workedExample: |-
      Take `TreeNode(1, TreeNode(2, None, TreeNode(3)), TreeNode(4))` and a postorder `walk`, which
      records a node only after both of its calls have returned.

      1. The call on 1 calls 2 first. 2 has no left child, so it calls its right child 3, which has
         no children and records 3.
      2. Back in the call on 2, both calls have returned, so it records 2. `out` is `[3, 2]`.
      3. Then the call on 1 calls 4, which records 4, and last the call on 1 records 1. So `out`
         is `[3, 2, 4, 1]`.
    prompt: |-
      This `walk` appends after both calls, so it is a postorder walk. It runs with `out = []` on
      the tree below, which is
      `TreeNode(5, TreeNode(2, TreeNode(9), TreeNode(4, TreeNode(8))), TreeNode(7, None, TreeNode(6)))`.

      ```python
      def walk(node, out):
          if node is None:
              return
          walk(node.left, out)
          walk(node.right, out)
          out.append(node.val)
      ```

      ```text
              5
             / \
            2   7
           / \   \
          9   4   6
             /
            8
      ```

      What is in `out` afterward?
    options:
      - id: preorder
        text: "`[5, 2, 9, 4, 8, 7, 6]`"
        explanation: >-
          That is the preorder list: each node comes before both of its subtrees. Here the append comes
          after both recursive calls, so a node is added only once everything below it has been added,
          and the root 5 comes last.
      - id: inorder
        text: "`[9, 2, 8, 4, 5, 7, 6]`"
        explanation: >-
          That is the inorder list: left subtree, node, right subtree. It needs the append between the
          two calls. With the append at the end, the 2 is added after its whole right subtree (4 and 8),
          not before it.
      - id: level-order
        text: "`[5, 2, 7, 9, 4, 6, 8]`"
        explanation: >-
          That lists the tree level by level, top to bottom. This `walk` records a node only once
          both of its calls have returned, so it records a leaf first and the root 5 last.
      - id: postorder
        text: "`[9, 8, 4, 2, 6, 7, 5]`"
        explanation: >-
          Postorder is left subtree, right subtree, then the node. The left subtree of 5 gives 9, then
          8, 4, 2. The right subtree gives 6, then 7. The root 5 comes last. Every node appears after
          every node below it.
    correct: postorder
    followUps:
      preorder:
        prompt: >-
          In `walk`, where does `out.append(node.val)` sit relative to the two recursive calls, and
          what does that make the first value added?
        options:
          - id: after-both
            text: After both calls, so the first value added is the leftmost leaf, 9
          - id: before-both
            text: Before both calls, so the first value added is the root, 5
          - id: between
            text: Between the calls, so the first value added is the root, 5
        correct: after-both
        explanation: >-
          The position of the append names the order. Before both calls is preorder, between them is
          inorder, and after both is postorder. In postorder the recursion has to reach a leaf
          before anything is appended, so 9 is first and the root is last.
      inorder:
        prompt: >-
          Inside the subtree rooted at 2 (children 9 and 4, with 8 under 4), which value does `walk`
          append last?
        options:
          - id: two-last
            text: 2, because its append runs after both of its subtrees are finished
          - id: four-last
            text: 4, because it is the right child
          - id: two-middle
            text: 2, because it is appended before its right subtree
        correct: two-last
        explanation: >-
          The append after both calls puts a node after everything in its left and right subtrees, so
          this subtree gives 9, 8, 4, 2. Appending the 2 before its right subtree (4 and 8) would give
          9, 2, 8, 4, which needs the append between the calls, and that is inorder.
      level-order:
        prompt: >-
          In the level-by-level list `[5, 2, 7, 9, 4, 6, 8]` the 7 comes before the 9. In the output of
          `walk` on this tree, does the 7 come before the 9?
        options:
          - id: finishes-subtree
            text: No, because `walk` finishes the whole subtree under 2, which holds the 9, before it starts the one under 7
          - id: shallow-first
            text: Yes, because 7 is on a shallower level and recursion handles shallower nodes first
          - id: append-last
            text: Yes, because appending after the calls moves shallow nodes ahead
        correct: finishes-subtree
        explanation: >-
          A recursive call returns only after all of its own calls have returned, so one whole
          subtree is completed before the one beside it begins. In the output the 9 is first and the 7 is
          sixth.

  - id: tree-walks-level-order
    heading: In what order does the queue visit the nodes?
    tags: [tree, bfs, queue]
    workedExample: |-
      Take `TreeNode(1, TreeNode(2), TreeNode(3, TreeNode(4)))` and the loop in the question. The
      queue starts holding only the root, 1.

      1. `popleft()` takes 1, and its children 2 and 3 are appended at the back, so the queue is
         `[2, 3]`.
      2. `popleft()` takes 2, which has no children. Then it takes 3 and appends 3's child 4, so
         the queue is `[4]`.
      3. Last it takes 4, which has no children. So `out` is `[1, 2, 3, 4]`.
    prompt: |-
      A `deque` from `collections` is a queue: `popleft()` removes the item at the front, and
      `append` adds at the back, so items leave first in, first out. `if node.left:` is true when
      the left child is not `None`. A node's depth is the number of links from the root down to
      it, so the root is at depth 0 and its children are at depth 1.

      ```python
      queue = deque([root])
      out = []
      while queue:
          node = queue.popleft()
          out.append(node.val)
          if node.left:
              queue.append(node.left)
          if node.right:
              queue.append(node.right)
      ```

      ```text
            8
           / \
          3   5
         / \   \
        9   1   4
           /
          6
      ```

      What is in `out` afterward?
    options:
      - id: by-depth
        text: "`[8, 3, 5, 9, 1, 4, 6]`"
        explanation: >-
          Popping 8 appends 3 and 5, and they leave before 9, 1 and 4, which join behind them. 6
          joins last. Every node at one depth joins the queue before any node one depth further
          down, so `out` lists the tree depth by depth.
      - id: preorder
        text: "`[8, 3, 9, 1, 6, 5, 4]`"
        explanation: >-
          That is the preorder list, which finishes 3's whole subtree before 5. The queue serves
          5, which joined when 8 was popped, before 9 and 1, which joined later, when 3 was popped.
      - id: last-added
        text: "`[8, 5, 4, 3, 1, 6, 9]`"
        explanation: >-
          That takes the item added last each time, as `pop()` would. `popleft()` takes the item
          at the front, the one that joined first.
    correct: by-depth
    followUps:
      preorder:
        prompt: When 3 is popped and appends 9 and 1, where do they join the queue?
        options:
          - { id: back, text: "At the back, behind 5" }
          - { id: front, text: "At the front, ahead of 5" }
          - { id: in-place, text: "In 3's place, so they leave next" }
        correct: back
        explanation: >-
          `append` always adds at the back. 5 joined earlier, when 8 was popped, so it leaves
          before 3's children.
      last-added:
        prompt: Which item does `popleft()` remove?
        options:
          - { id: front, text: "The one at the front, which joined first" }
          - { id: back, text: "The one at the back, which joined last" }
          - { id: smallest, text: "The one holding the smallest value" }
        correct: front
        explanation: >-
          A queue serves items in the order they joined, first in, first out. Taking the item that
          joined last is what a list's `pop()` does.

  - id: tree-walks-round-boundary
    format: tap-cell
    heading: Where does the round end?
    tags: [tree, bfs, queue]
    workedExample: |-
      Take `TreeNode(6, TreeNode(4, TreeNode(2), TreeNode(7)), TreeNode(9))`: 6 has children 4
      and 9, and 4 has children 2 and 7. A round starts with the queue `[4, 9]`.
      `n = len(queue)` is set once, before the round's `for` loop starts.

      1. The queue holds 4 and 9 when the round starts, so `n` is 2, and the loop will pop exactly
         2 nodes.
      2. Popping 4 appends its children 2 and 7, so the queue is `[9, 2, 7]`. `n` is still 2,
         because it was set before 2 and 7 arrived.
      3. The second pop takes 9, which has no children. After 2 pops the round ends, so 9 is its
         last pop, and 2 and 7 wait for the next round.
    prompt: |-
      This queue loop visits the tree depth by depth, which is called level order: `popleft()`
      removes the node at the front, and `append` adds at the back. To tell where one depth ends,
      each round reads `n = len(queue)` once, before its first pop, and then pops `n` nodes. A
      round starts with the queue `[D, E, F]`, every node at depth 2 of the tree below. It has
      popped D and appended D's child G. Tap the last node this round will pop.

      ```text
              A
            /   \
           B     C
          / \     \
         D   E     F
        /         / \
       G         H   I
      ```
    code: |
      queue = deque([root])
      while queue:
          n = len(queue)
          for _ in range(n):
              node = queue.popleft()
              if node.left:
                  queue.append(node.left)
              if node.right:
                  queue.append(node.right)
    sequence:
      kind: array
      name: queue
      cells: [E, F, G]
    correct: 1
    explanation: >-
      `n` was 3 when the round began, for D, E and F. D is gone, so two pops remain, E and then F. G was
      appended during the round and waits behind F for the next round.
    misses:
      - index: 0
        explanation: >-
          E is popped next, but it is not the last pop of the round. `n` was set to 3 before the round
          began, and only D has been popped.
      - index: 2
        explanation: >-
          G was appended by D during this round. `n` was fixed at 3 before G arrived, so G belongs to the
          next round, depth 3.

  - id: tree-walks-height-two-shapes
    heading: What are the heights?
    tags: [tree, complexity]
    prompt: |-
      Height here is the number of nodes on the longest path from the root down to a leaf. One node has
      height 1 and the empty tree has height 0. Each level holds at most twice as many nodes as the
      level above it. Both trees hold 7 nodes.

      ```text
      Tree P:     1
                /   \
               2     3
              / \   / \
             4   5 6   7
      ```

      Tree Q is a chain: 1 has the right child 2, 2 has the right child 3, and so on down to 7. No node
      in Q has a left child.

      What are the heights of P and Q?
    options:
      - id: right
        text: P is 3 and Q is 7
        explanation: >-
          Every path from the root of P to a leaf passes through 3 nodes, such as 1, 2, 4. Q has a single
          path that passes through all 7 nodes. The node count is the same, but the shape sets the height.
      - id: count
        text: Both are 7
        explanation: >-
          7 is the node count. Height counts only the nodes on one root-to-leaf path. In P, the path 1,
          2, 4 already ends at a leaf.
      - id: log
        text: Both are 3
        explanation: >-
          A height of 3 for 7 nodes holds only when every level is filled, as in P. Q puts one node on
          each level, so its single path runs through every node.
    correct: right
    followUps:
      count:
        prompt: In tree P, which nodes are on the path from the root to the leaf 4?
        options:
          - { id: three, text: "1, 2 and 4" }
          - { id: all, text: "All 7 nodes" }
          - { id: four, text: "1, 2, 3 and 4" }
        correct: three
        explanation: >-
          A root-to-leaf path follows one child link per level, so it never visits both children of a node, such as 2 and 3.
          Height measures the longest such path, not the whole tree.
      log:
        prompt: How many nodes does tree Q have on each level?
        options:
          - { id: one-each, text: "One on every level, across 7 levels" }
          - { id: doubling, text: "1, 2 and 4, like P" }
          - { id: two-each, text: "Two on most levels" }
        correct: one-each
        explanation: >-
          With one child per node, every level holds one node, so the tree is as tall as its node count.
          That chain is the worst case for anything that grows with the height.

  - id: tree-walks-live-calls-trace
    format: step-trace
    heading: How many calls are live?
    tags: [tree, recursion]
    prompt: |-
      `height(root)` runs on the tree below. A call is live from the moment it starts until it
      returns. Count only calls on real nodes, not calls on `None`. Predict each step.

      ```text
          A
         / \
        B   C
       /
      D
      ```
    code: |-
      def height(node):
          if node is None:
              return 0
          left = height(node.left)
          right = height(node.right)
          return 1 + max(left, right)
    sequence:
      kind: array
      name: nodes
      cells: [A, B, C, D]
    start:
      - { name: call, at: 0 }
    steps:
      - line: 4
        ask: The call on A runs line 4. Which node does the next real call start on?
        pointer: call
        correct: 1
        explanation: Line 4 calls `height` on A's left child, B.
        misses:
          - index: 2
            explanation: C is A's right child. Line 5 calls it only after the left call has returned.
        elsewhere: Line 4 passes `node.left`, A's left child.
      - line: 4
        ask: The call on B runs line 4. Which node does the next real call start on?
        pointer: call
        correct: 3
        explanation: B's left child is D, so B's line 4 starts a call on D while the calls on A and B wait.
        misses:
          - index: 2
            explanation: >-
              C is A's child, not B's. A cannot reach its line 5 until the call on B has returned.
        elsewhere: B's line 4 passes B's own left child.
      - line: 2
        ask: When the call on D starts, how many real calls are live, counting it?
        options:
          - id: three
            text: "3"
            explanation: >-
              The calls on A and B are each paused at line 4, waiting for their left call, and the call
              on D has just started: A, B and D.
          - id: two
            text: "2"
            explanation: >-
              The call on D counts as well. A, B and D are all live, one call for each node on the path
              down from the root.
          - id: four
            text: "4"
            explanation: >-
              C has not been called yet. A reaches its line 5 only after the call on B returns, so just
              A, B and D are live.
        correct: three
      - line: 5
        ask: D and then B return. The call on A runs line 5. Which node does the next real call start on?
        pointer: call
        correct: 2
        explanation: A's line 5 calls `height` on its right child, C.
        misses:
          - index: 1
            explanation: The call on B has returned with its height, 2. A's line 5 passes its right child.
        elsewhere: Line 5 passes `node.right`, A's right child.
      - line: 2
        ask: When the call on C starts, how many real calls are live, counting it?
        options:
          - id: two
            text: "2"
            explanation: >-
              The calls on B and D have returned and their frames are gone. Only A, waiting at line 5,
              and C are live.
          - id: four
            text: "4"
            explanation: >-
              4 counts every call made so far. A call stops being live when it returns, and B and D
              returned before A reached line 5.
          - id: three
            text: "3"
            explanation: >-
              3 was the count at D. Since then D and B have returned, so only A and C are live.
        correct: two

  - id: tree-walks-chain-recursion-limit
    heading: Which runs stop with RecursionError?
    tags: [tree, recursion]
    workedExample: |-
      Consider `height` on a chain of 800 nodes, each the right child of the one before. A call
      stays live until it returns, and it returns only after its own child calls have returned.

      1. The call on the top node waits on the call on its child, and that call waits on the one
         below it. So when the call on the bottom node runs, all 800 calls are live.
      2. Python stops a run with RecursionError when about 1,000 calls are live at once. 800 is
         below that, so this run finishes and returns 800.
      3. So on a chain, every node is on the one path down, and the most calls live at once is the
         number of nodes.
    prompt: |-
      This `height` is correct: it counts the nodes on the longest path from a node down to a
      leaf, with 0 for `None`. Python stops a run with RecursionError when about 1,000 calls are
      live at once.

      ```python
      def height(node):
          if node is None:
              return 0
          left = height(node.left)
          right = height(node.right)
          return 1 + max(left, right)
      ```

      Tree P is a chain of 5,000 nodes: each node has only a right child. Tree Q also holds 5,000
      nodes, with every level full except the last, so its height is 13. `p` and `q` are their
      roots. Count only calls on real nodes, not calls on `None`. Which runs stop with
      RecursionError?
    options:
      - id: only-p
        text: Only `height(p)`
        explanation: >-
          The live calls at any moment are the calls on one path down from the root, so a run
          needs as many live calls at once as the tree's height. P needs 5,000, far past about
          1,000. Q needs 13, so its run finishes, though the tree is just as large.
      - id: both
        text: Both runs
        explanation: >-
          Q's run makes one call per node, 5,000 in all, but not all at once. A call returns before
          the next call on its level starts, so on Q no more than 13 calls are live at once.
      - id: neither
        text: Neither run
        explanation: >-
          Correct code can still run out of room. On P each call waits on the call below it, so
          the live calls grow by one for each node down the chain and reach about 1,000 long
          before the bottom, where Python stops the run.
      - id: only-q
        text: Only `height(q)`
        explanation: >-
          Q is wide, and its twelfth level holds 2,048 nodes, which a level-order queue would hold
          at once. The calls on one level are never live together: each returns before the next
          one starts, so at most 13 are live.
    correct: only-p
    followUps:
      both:
        prompt: On Q, while the call on the lowest node of its longest path runs, which calls are live?
        options:
          - { id: path, text: "The calls on the 13 nodes of that path" }
          - { id: so-far, text: "Every call made so far" }
          - { id: all, text: "All 5,000, one per node" }
        correct: path
        explanation: >-
          Every call that has finished its subtree has returned. Only the chain of calls from the
          root down to the running call is live, one per node on that path.
      neither:
        prompt: The run on P has gone 900 nodes down the chain. How many calls on real nodes are live?
        options:
          - { id: nine-hundred, text: "900, the running call and every call above it" }
          - { id: one, text: "1, the call that is running" }
          - { id: two, text: "2, the running call and its parent's" }
        correct: nine-hundred
        explanation: >-
          A call on a chain waits on its only child, so nothing has returned yet. Each node further
          down adds one more live call, so the count reaches about 1,000, where Python stops the
          run, long before the 5,000th node, whether or not the code is correct.
      only-q:
        prompt: Are the calls on two nodes at the same level ever live at the same time?
        options:
          - { id: never, text: "No, only the calls on one path from the root are live" }
          - { id: together, text: "Yes, all calls on one level run together" }
          - { id: last-level, text: "Only on the last level, which is not full" }
        correct: never
        explanation: >-
          Two nodes on one level lie on different paths. The call on the first one returns before
          the walk reaches the second, so the live calls never span a level.
