id: connectivity-checkpoint
title: 'Connectivity: checkpoint'
description: Count static components and answer a stream of link events on fresh graphs.
questions:
  - id: connectivity-exam-last-start
    format: tap-cell
    tags:
      - graph
    prompt: >-
      The loop starts a search at each unseen node, in order from 0 to 7, and each search marks its
      whole component. Tap the node where the last search starts.
    code: |-
      adj = {0: [5, 2], 1: [], 2: [0, 5], 3: [6],
             4: [], 5: [0, 2], 6: [3, 7], 7: [6]}
      for start in range(8):
          if start not in seen:
              explore(start)
    sequence:
      kind: array
      name: nodes
      cells: [0, 1, 2, 3, 4, 5, 6, 7]
    correct: 4
    explanation: >-
      Searches start at 0 (marking 0, 2, 5), at 1 (no neighbors), at 3 (marking 3, 6, 7) and at 4 (no
      neighbors). Nodes 5, 6 and 7 are already seen, so 4 is the last start and the graph has 4
      components.
    misses:
      - index: 0
        explanation: Node 0 is where the first search starts.
      - index: 1
        explanation: >-
          Node 1 has an empty list, so it is a component by itself. It is the second start, and later
          nodes still need searches.
      - index: 2
        explanation: Node 2 is in `adj[0]`, so the search from 0 marks it.
      - index: 3
        explanation: >-
          Node 3 starts the third search, which marks 3, 6 and 7. Node 4 is still unseen after it.
      - index: 5
        explanation: Node 5 is in `adj[0]`, so the first search marks it.
      - index: 6
        explanation: Node 6 is in `adj[3]`, so the search from 3 marks it.
      - index: 7
        explanation: >-
          Node 7 is reached through 6, which is in `adj[3]`. The search from 3 marks it, so the loop
          skips it.

  - id: connectivity-exam-one-way-build
    tags:
      - graph
    prompt: |-
      The graph is undirected with `n = 5` nodes and the edges `(0, 1), (2, 1), (3, 4)`. This count stores each edge in one list only. What is `count` after this runs?

      ```python
      adj = [[] for _ in range(5)]
      for a, b in edges:
          adj[a].append(b)
      count = 0
      for start in range(5):
          if start not in seen:
              count += 1
              explore(start)   # marks what it can reach through adj
      ```
    options:
      - id: three
        text: 3, because node 2 starts a search of its own
        explanation: >-
          The search from 0 follows `adj[0] == [1]` and stops, since `adj[1]` is empty. Node 2 was not
          reached, so it starts a second search, and 3 starts a third. The true count is 2:
          {0, 1, 2} and {3, 4}. Appending `adj[b].append(a)` as well fixes it.
      - id: two
        text: 2, one for each component
        explanation: >-
          There are two components, but the search from 0 cannot reach 2. The edge `(2, 1)` is stored
          only in `adj[2]`, so nothing leads from 0 or 1 to 2.
      - id: four
        text: 4, because node 1 starts a search of its own
        explanation: >-
          Node 1 is reached from 0, since `adj[0]` holds 1. The searches start at 0, 2 and 3.
    correct: three
    followUps:
      two:
        prompt: After the build loop, what is `adj[1]`?
        options:
          - id: empty
            text: An empty list, since 1 is never the first node of an edge
          - id: zero-two
            text: '`[0, 2]`, one entry for each edge at node 1'
          - id: zero
            text: '`[0]`, from the edge `(0, 1)`'
        correct: empty
        explanation: >-
          The loop writes only `adj[a]`. Node 1 is always the second element, so its list stays empty
          and no search can leave node 1. That is why 2 is never reached from 0.
      four:
        prompt: When the search from 0 runs, which nodes does it mark?
        options:
          - id: zero-one
            text: 0 and 1, through `adj[0]`
          - id: zero-only
            text: Only 0, since 1 is listed under node 2
          - id: zero-one-two
            text: 0, 1 and 2, since 1 is joined to 2
        correct: zero-one
        explanation: >-
          `adj[0]` holds 1, so the search reaches 1. It stops there because `adj[1]` is empty, which
          leaves 2 for a later start.

  - id: connectivity-exam-stream-answers
    tags:
      - graph
    prompt: |-
      Union-find answers each `same` when it arrives. Nodes 0 to 3 start in separate sets. What are the three answers?

      ```text
      link(0, 1)
      link(2, 3)
      same(1, 2)
      link(3, 0)
      same(1, 2)
      link(1, 2)
      same(0, 3)
      ```
    options:
      - id: false-true-true
        text: False, True, True
        explanation: >-
          At the first question, {0, 1} and {2, 3} are separate. `link(3, 0)` merges them, so 1 and 2
          share a root from then on. `link(1, 2)` finds both ends in one set and changes nothing, and
          `same(0, 3)` is True.
      - id: false-false-true
        text: False, False, True
        explanation: >-
          The second question comes after `link(3, 0)`. The chain 1, 0, 3, 2 already joins 1 and 2,
          even before `link(1, 2)` arrives.
      - id: true-true-true
        text: True, True, True
        explanation: >-
          That answers the first question with the final graph. When `same(1, 2)` first arrives, only
          `link(0, 1)` and `link(2, 3)` have happened.
    correct: false-true-true
    followUps:
      false-false-true:
        prompt: After `link(3, 0)`, which nodes share a root with 1?
        options:
          - id: all
            text: 0, 2 and 3, since the union merged both whole sets
          - id: zero-three
            text: Only 0 and 3, the nodes named in links with 1 or 0
          - id: zero
            text: Only 0, its direct link
        correct: all
        explanation: >-
          A union joins the roots of two sets, so every member of {0, 1} and {2, 3} ends up under one
          root. 1 and 2 are connected through 0 and 3.
      true-true-true:
        prompt: Can a link that arrives later change an earlier `same` answer?
        options:
          - id: no-later
            text: No, each answer uses the links that came before it
          - id: yes-later
            text: Yes, answers are revised when the stream ends
          - id: only-cycles
            text: Only when the later link closes a loop
        correct: no-later
        explanation: >-
          The stream is answered online. Each `same` reflects the sets at that moment, and later links
          only affect later questions.

  - id: connectivity-exam-count-roots
    tags:
      - graph
    prompt: >-
      Union-find holds `parent = [2, 0, 2, 4, 4, 3, 6]` for nodes 0 to 6, where a root is its own
      parent. How many separate sets are there?
    options:
      - id: three
        text: '3'
        explanation: >-
          Only cells 2, 4 and 6 hold their own index, so there are three roots. The sets are
          {0, 1, 2}, {3, 4, 5} and {6}. Every other node walks up to one of them.
      - id: five
        text: '5'
        explanation: >-
          That counts the different values in the array: 0, 2, 3, 4 and 6. Nodes 0 and 3 are parents
          but not roots, since `parent[0]` is 2 and `parent[3]` is 4.
      - id: two
        text: '2'
        explanation: >-
          Node 6 has never been linked to anything, but it is still a set. Its cell holds 6, so it is
          its own root.
    correct: three
    followUps:
      five:
        prompt: Is node 0 a root, given `parent[0] == 2`?
        options:
          - id: not-root
            text: No, a root's cell holds its own index
          - id: is-root
            text: Yes, because other nodes point at it
          - id: depends
            text: Only if no node points at node 2
        correct: not-root
        explanation: >-
          Having children does not make a node a root. Node 1 points at 0, but 0 points at 2, so all
          three share root 2.
      two:
        prompt: Which set does node 6 belong to?
        options:
          - id: own
            text: Its own, with root 6
          - id: last
            text: The set of 5, its neighbor in the array
          - id: none
            text: None, until a link touches it
        correct: own
        explanation: >-
          Every node starts as its own set. A node that no union has touched stays a set of one, and
          it counts.

  - id: connectivity-exam-largest-component
    heading: How big is the largest component?
    tags: [graph]
    prompt: >-
      A graph has `n = 12` nodes, numbered 0 to 11, and the undirected edges
      `(0, 4), (2, 6), (9, 1), (4, 8), (3, 7), (6, 9), (8, 0)`. Nodes 5, 10 and 11 have no edges.
      A connected component is a group of nodes that can all reach one another, with no edge to any
      node outside the group. How many nodes does the largest component hold?
    options:
      - id: four
        text: '4'
        explanation: >-
          The components are {0, 4, 8}, {1, 2, 6, 9}, {3, 7}, {5}, {10} and {11}. The edges `(2, 6)`
          and `(6, 9)` join 2, 6 and 9, and `(9, 1)` joins 1 to them, so that component holds 4 nodes.
      - id: three
        text: '3'
        explanation: >-
          That is {0, 4, 8}, the component a search from node 0 finds, or {2, 6, 9} without node 1. An
          undirected edge joins both of its ends, so `(9, 1)` adds 1 to the chain 2, 6, 9, and that
          component holds 4.
      - id: six
        text: '6'
        explanation: >-
          That is how many components there are, one per search start. The question asks how many
          nodes the biggest one holds.
    correct: four
    followUps:
      three:
        prompt: Which nodes can node 1 reach?
        options:
          - id: chain
            text: 2, 6 and 9, through the edge `(9, 1)`
          - id: none
            text: None, since node 1 appears only at the end of an edge
          - id: nine-only
            text: Only 9, its one direct neighbor
        correct: chain
        explanation: >-
          An undirected edge works both ways, so 1 reaches 9, then 6 through `(6, 9)`, then 2 through
          `(2, 6)`.
      six:
        prompt: What does each new search start add 1 to?
        options:
          - id: components
            text: The number of components
          - id: largest
            text: The size of the largest component
          - id: edges
            text: The number of edges read
        correct: components
        explanation: >-
          Each start marks one whole component, so 6 starts mean 6 components. A component's size is
          the number of nodes its own search marks.

  - id: connectivity-exam-debug-union
    heading: Which call does it fail on?
    tags: [graph]
    prompt: |-
      A suggested solution should report whether nodes `a` and `b` are joined once every link in `links` has arrived.

      ```python
      def find(parent, x):
          while parent[x] != x:
              x = parent[x]
          return x

      def joined(n, links, a, b):
          parent = list(range(n))
          for x, y in links:
              parent[x] = find(parent, y)
          return find(parent, a) == find(parent, b)
      ```

      Which call returns the wrong answer?
    options:
      - id: chain
        text: '`joined(4, [(0, 1), (1, 2), (2, 3)], 0, 3)`'
        explanation: >-
          The links write `parent[0] = 1`, `parent[1] = 2` and `parent[2] = 3`, each into a node no
          earlier link has written. Every write lands on a root, so `find` from 0 walks to 3, and it
          returns True, which is right.
      - id: star
        text: '`joined(4, [(1, 0), (2, 0), (3, 0)], 1, 3)`'
        explanation: >-
          The links write `parent[1]`, `parent[2]` and `parent[3]`, three nodes that are still roots.
          All four end at 0, so it returns True, which is right.
      - id: rewrite
        text: '`joined(4, [(1, 2), (0, 1), (1, 3)], 0, 3)`'
        explanation: >-
          The first link writes `parent[1] = 2`, and the second writes `parent[0] = 2`. The third
          writes `parent[1] = 3` over the link to 2, so 1 moves to 3's set while 0 and 2 stay behind.
          `find` gives 2 for node 0 and 3 for node 3, so it returns False, but the links join all four
          nodes. Writing into `parent[find(parent, x)]` would hang root 2 under 3 instead.
      - id: late-join
        text: '`joined(4, [(0, 1), (2, 3), (1, 3)], 0, 2)`'
        explanation: >-
          The links write `parent[0] = 1` and `parent[2] = 3`, then `parent[1] = 3`, and node 1 was
          still a root. `find` walks 0, 1, 3 from node 0 and gives 3 for node 2, so it returns True,
          which is right.
    correct: rewrite
    followUps:
      chain:
        prompt: When the second link writes `parent[1]`, is node 1 a root?
        options:
          - id: still-root
            text: Yes, no link has written its cell yet
          - id: under-zero
            text: No, the first link put it under 0
          - id: last-only
            text: No, only the last node of the list is a root
        correct: still-root
        explanation: >-
          Writing a root's cell is what a correct union does too. The bug shows only when a link writes
          a node that is no longer a root.
      star:
        prompt: In `[(1, 0), (2, 0), (3, 0)]`, which node's cell is written more than once?
        options:
          - id: none-twice
            text: None, each link writes a different first node
          - id: shared
            text: Node 0, which is in every link
          - id: last
            text: Node 3, the last one written
        correct: none-twice
        explanation: >-
          The line writes the cell of each link's first node. Node 0 is only ever the second node, so
          its cell keeps 0 and no link is overwritten.
      late-join:
        prompt: When `(1, 3)` arrives, which cell does a correct union write?
        options:
          - id: root-one
            text: '`parent[1]`, since 1 is the root of {0, 1}'
          - id: first-zero
            text: '`parent[0]`, since 0 joined first'
          - id: second-three
            text: '`parent[3]`, since 3 is the second node'
        correct: root-one
        explanation: >-
          A correct union writes the root of the first node's set. Here that root is node 1 itself, so
          the buggy line writes the same cell.

  - id: connectivity-exam-union-by-size
    heading: What does union by size leave?
    tags: [graph]
    prompt: |-
      This union by size starts from three sets: {0, 1, 2, 3} with root 1, {4, 5, 6} with root 5, and {7}. `size[r]` counts the nodes in the set whose root is `r`, and the code reads it only at roots. What is `parent` after both unions?

      ```python
      parent = [1, 1, 1, 2, 5, 5, 5, 7]
      size = [1, 4, 2, 1, 1, 3, 1, 1]

      def union(a, b):
          ra, rb = find(a), find(b)
          if ra == rb:
              return
          if size[ra] > size[rb]:
              parent[rb] = ra
              size[ra] += size[rb]
          else:
              parent[ra] = rb
              size[rb] += size[ra]

      union(0, 4)
      union(7, 2)
      ```
    options:
      - id: by-size
        text: '`[1, 1, 1, 2, 5, 1, 5, 1]`'
        explanation: >-
          `union(0, 4)` compares root 1, a set of 4, with root 5, a set of 3, and runs
          `parent[5] = 1`. `union(7, 2)` compares root 7, a set of 1, with root 1, a set of 7 by
          then, and runs `parent[7] = 1`. No other cell changes.
      - id: a-root
        text: '`[1, 5, 1, 2, 5, 5, 5, 5]`'
        explanation: >-
          That hangs `a`'s root under `b`'s root every time, as `parent[find(a)] = find(b)` does:
          `parent[1] = 5`, then `parent[7] = 5`. In `union(0, 4)` the set of `a` is the larger one,
          so union by size hangs root 5 instead.
      - id: larger-under
        text: '`[1, 5, 1, 2, 5, 7, 5, 7]`'
        explanation: >-
          That hangs the larger set's root under the smaller one: root 1 under 5, and then root 5,
          with 7 nodes, under the single node 7. Union by size keeps the larger set's root as the
          root.
      - id: all-root
        text: '`[1, 1, 1, 1, 1, 1, 1, 1]`'
        explanation: >-
          That points every node at the final root. Each union writes a single `parent` cell, so 3
          still points at 2, and 4 and 6 still point at 5.
    correct: by-size
    followUps:
      a-root:
        prompt: In `union(0, 4)`, which root stays a root?
        options:
          - id: one
            text: 1, whose set holds 4 nodes to root 5's 3
          - id: five
            text: 5, the root of `b`'s set
          - id: four
            text: 4, the node passed as `b`
        correct: one
        explanation: >-
          Union by size compares `size[1]`, 4, with `size[5]`, 3, and keeps the larger set's root.
          Only on a tie does `a`'s root go under `b`'s.
      larger-under:
        prompt: Which root does union by size hang under the other?
        options:
          - id: smaller
            text: The root of the smaller set
          - id: larger
            text: The root of the larger set
          - id: higher-index
            text: The root with the larger index
        correct: smaller
        explanation: >-
          Hanging the smaller set's root puts fewer nodes one link further from their root. Here
          root 5 goes under 1, and then root 7 goes under 1.
      all-root:
        prompt: How many `parent` cells does one union write?
        options:
          - id: one-cell
            text: One, the cell of the root it hangs
          - id: smaller-set
            text: One for each node in the smaller set
          - id: both-sets
            text: One for each node in both sets
        correct: one-cell
        explanation: >-
          A union writes `parent[ra]` or `parent[rb]`, a single root's cell. The nodes below that
          root keep their cells and reach the new root through it.
