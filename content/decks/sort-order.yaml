id: sort-order
title: Sort order
description: Read what a sort key compares, decide how ties come out, and tell a sort in place from a returned copy. Each card asks for one decision, with a worked example on hand.
heading: What does this give?

questions:
  - id: key-by-remainder
    heading: What does this print?
    tags: [sorting, python]
    workedExample: |-
      Python's `sorted` puts items in order, smallest first. This path covers what a sort
      compares, what happens to ties, and whether a list changes. `sorted(items, key=f)` calls
      `f` once on each item and orders the items by those results. Consider
      `sorted(["kiwi", "fig", "banana"], key=len)`.

      1. The key function is `len`, so the keys are `len("kiwi") = 4`, `len("fig") = 3` and
         `len("banana") = 6`.
      2. From the smallest key to the largest the keys go 3, 4, 6, so the items go fig, kiwi,
         banana.
      3. The sort hands back the items, not the keys. So the result is
         `['fig', 'kiwi', 'banana']`.
    prompt: |-
      `sorted(items, key=f)` gives each item a sort key, the value `f(item)`, and compares
      those keys, smallest first. `lambda n: n % 10` is a one-line function that returns
      `n % 10`, the remainder after dividing `n` by 10, which for these numbers is the last
      digit.

      ```python
      print(sorted([12, 7, 30, 4], key=lambda n: n % 10))
      ```

      What does it print?
    options:
      - id: right
        text: "`[30, 12, 4, 7]`"
        explanation: >-
          The keys are the last digits: 2, 7, 0 and 4. Ordered by key, 30 (key 0) comes first, then
          12 (2), 4 (4) and 7 (7). The numbers themselves come back, not their keys.
      - id: by-value
        text: "`[4, 7, 12, 30]`"
        explanation: >-
          That is the plain sort with no key. The key stands in for each number whenever two are
          compared, so 30, whose last digit is 0, counts as the smallest.
      - id: keys
        text: "`[0, 2, 4, 7]`"
        explanation: >-
          Those are the keys, sorted. The key only decides where each item goes. The list that
          comes back holds the numbers you passed in.
      - id: descending
        text: "`[7, 4, 12, 30]`"
        explanation: >-
          That runs from the largest key, 7, down to the smallest, 0. `sorted` goes the other way:
          smallest key first.
    correct: right
    followUps:
      by-value:
        prompt: "With `key=lambda n: n % 10`, what does the sort compare when it compares 30 and 4?"
        options:
          - id: keys
            text: 0 and 4, the results of the key function
          - id: items
            text: 30 and 4, the numbers themselves
          - id: both
            text: The keys first, then the numbers whenever the keys tie
        correct: keys
        explanation: >-
          The key function runs once per item, and the sort compares only what it returns. 30 % 10
          is 0, so 30 counts as the smallest. When two keys tie, the items are not compared at all.
      keys:
        prompt: What does `sorted(items, key=f)` return?
        options:
          - id: items
            text: The original items, arranged by their keys
          - id: keys
            text: The values `f(x)`, in sorted order
          - id: pairs
            text: Pairs of each key and its item
        correct: items
        explanation: >-
          The key decides the order and is then thrown away. With `n % 10` as the key you get 30
          back, not 0.
      descending:
        prompt: In which direction does `sorted` order the keys?
        options:
          - id: ascending
            text: From the smallest key up
          - id: descending
            text: From the largest key down
          - id: input
            text: In the order the items came in
        correct: ascending
        explanation: >-
          `sorted` is ascending: the item with the smallest key comes first. Here that is 30,
          whose key is 0.

  - id: uppercase-first
    format: tap-cell
    heading: Tap the word it prints
    tags: [sorting, python]
    workedExample: |-
      Consider `sorted(["bat", "Cow"])`. Strings compare one character at a time by code point, the
      number `ord` gives each character.

      1. The first characters are `"b"` and `"C"`. `ord("b")` is 98 and `ord("C")` is 67.
      2. Every capital A to Z (65 to 90) has a smaller code point than every lowercase a to z (97 to
         122). So `"C"` comes before `"b"`, since 67 < 98.
      3. The first characters already differ, so they decide: the result is `['Cow', 'bat']`, though
         b comes before c in the alphabet.
    prompt: >-
      With no key, `sorted` compares strings one character at a time from the left, and the
      first pair of characters that differ decides (a string that runs out first sorts first).
      Every capital letter A to Z sorts before every lowercase letter a to z. Tap the word that
      the code below prints.
    code: |
      words = ["mango", "Pear", "apple", "Kiwi"]
      print(sorted(words)[0])
    sequence:
      kind: array
      name: words
      cells: [mango, Pear, apple, Kiwi]
    correct: 3
    explanation: >-
      Kiwi and Pear start with capitals, which sort before every lowercase a to z, and K comes
      before P. So `sorted(words)[0]` is Kiwi.
    misses:
      - index: 0
        explanation: >-
          mango is first in the input, but `sorted` reorders everything. A lowercase m comes after
          both words that start with a capital.
      - index: 1
        explanation: >-
          Pear does start with a capital, but P comes after K, so Kiwi is ahead of it.
      - index: 2
        explanation: >-
          apple would be first if case were ignored. A plain sort does not ignore it, and a
          lowercase a comes after every capital A to Z.

  - id: pair-comparison
    heading: What does this print?
    tags: [sorting, python]
    workedExample: |-
      Consider `(2, 9) < (3, 1)` and `(2, 4) < (2, 9)`. Tuples compare item by item from the left,
      and the comparison moves to the next item only on a tie.

      1. In `(2, 9) < (3, 1)`, the first items are 2 and 3. They differ and 2 < 3, so the result is
         `True`. The 9 and the 1 are never compared.
      2. In `(2, 4) < (2, 9)`, the first items are 2 and 2. They tie, so the comparison moves on
         to the second items.
      3. The second items are 4 and 9, and 4 < 9, so `(2, 4) < (2, 9)` is `True` too. So
         `sorted([(3, 1), (2, 9), (2, 4)])` gives `[(2, 4), (2, 9), (3, 1)]`.
    prompt: |-
      Python compares tuples item by item from the left, and moves to the next item only on a
      tie. With no key, `sorted` compares the tuples themselves.

      ```python
      pairs = [(3, 1), (1, 5), (3, 0), (1, 2)]
      print(sorted(pairs))
      ```

      What does it print?
    options:
      - id: right
        text: "`[(1, 2), (1, 5), (3, 0), (3, 1)]`"
        explanation: >-
          The first values put both 1s ahead of both 3s. Within each tie the second value decides,
          so (1, 2) comes before (1, 5), and (3, 0) before (3, 1).
      - id: first-only
        text: "`[(1, 5), (1, 2), (3, 1), (3, 0)]`"
        explanation: >-
          That compares only the first values and keeps tied pairs in input order. With no key,
          a tie on the first value moves on to the second.
      - id: second-first
        text: "`[(3, 0), (3, 1), (1, 2), (1, 5)]`"
        explanation: >-
          That orders by the second value. Tuples compare from the left, so the first value is
          looked at first.
      - id: by-sum
        text: "`[(3, 0), (1, 2), (3, 1), (1, 5)]`"
        explanation: >-
          That orders by each pair's total. With no key, `sorted` compares the tuples with `<`,
          not their sums.
    correct: right
    followUps:
      first-only:
        prompt: "`(1, 5)` and `(1, 2)` tie on their first value. What does a plain `sorted` do next?"
        options:
          - id: next
            text: Compares 5 with 2, which puts `(1, 2)` first
          - id: input
            text: Keeps them in input order, `(1, 5)` first
          - id: either
            text: Treats them as equal and may put either first
        correct: next
        explanation: >-
          With no key, the things being compared are the whole tuples, and a tuple comparison only
          stops at the first difference. Input order matters only when two items compare equal.
      second-first:
        prompt: Which values decide whether `(1, 5)` or `(3, 0)` comes first?
        options:
          - id: first
            text: The first values, 1 and 3
          - id: second
            text: The second values, 5 and 0
          - id: sums
            text: The totals, 6 and 3
        correct: first
        explanation: >-
          Comparison starts at the first item and moves on only on a tie. 1 < 3, so `(1, 5)` comes
          first, however large its second value is.
      by-sum:
        prompt: What does `sorted(pairs)` compare when no key is given?
        options:
          - id: tuples
            text: The tuples themselves, item by item
          - id: sums
            text: The total of each tuple
          - id: lengths
            text: The length of each tuple
        correct: tuples
        explanation: >-
          With no key, items are compared with `<`, and for tuples that goes from left to right. To
          order by total, pass `key=sum`.

  - id: two-record-tie
    heading: In what order do they come out?
    tags: [sorting, python]
    workedExample: |-
      Consider `sorted([("ann", 90), ("bo", 85), ("cy", 90)], key=lambda r: r[1])`. Python's sort is
      stable: items with equal keys keep the order they came in.

      1. The keys are the scores: 90 for ann, 85 for bo and 90 for cy. 85 is the smallest, so bo
         comes first.
      2. ann and cy both have the key 90, so they tie. The key is only `r[1]`, so their names are
         never compared.
      3. Since the sort is stable, the tie keeps the input order, ann before cy. The result is
         `[('bo', 85), ('ann', 90), ('cy', 90)]`.
    prompt: |-
      Python's sort is stable: items whose keys are equal keep the order they came in.

      ```python
      tasks = [("write", 2), ("test", 1), ("deploy", 2)]
      print(sorted(tasks, key=lambda t: t[1]))
      ```

      In what order do the task names come out?
    options:
      - id: right
        text: test, write, deploy
        explanation: >-
          test has the smallest key, 1. write and deploy both have 2, a tie, so the stable sort
          leaves them as they came: write, then deploy.
      - id: by-name
        text: test, deploy, write
        explanation: >-
          That breaks the tie by name. The key is only `t[1]`, so the names are never compared.
      - id: whole-tuple
        text: deploy, test, write
        explanation: >-
          That sorts the whole tuples, which compare by name first. The key makes every comparison
          look at `t[1]` only.
      - id: largest-first
        text: write, deploy, test
        explanation: >-
          The tie comes out right, but that runs from the largest key down. `sorted` puts the
          smallest key first, so test leads.
    correct: right
    followUps:
      by-name:
        prompt: "With `key=lambda t: t[1]`, what does the sort compare for write and deploy?"
        options:
          - id: keys
            text: 2 against 2, a tie
          - id: names
            text: Their names, since the keys are equal
          - id: tuples
            text: The whole tuples
        correct: keys
        explanation: >-
          The sort compares keys and nothing else. When keys are equal, it does not fall back to
          the items. Stability leaves them in input order.
      whole-tuple:
        prompt: "What does `key=lambda t: t[1]` change about the comparisons?"
        options:
          - id: number
            text: Each task is compared by its number, not by the whole tuple
          - id: nothing
            text: Nothing, the tuples still compare by name first
          - id: output
            text: The result holds only the numbers
        correct: number
        explanation: >-
          Without a key, tuples compare from the left, so the names would decide. With the key,
          every comparison uses `t[1]`, and the tuples themselves still come back.
      largest-first:
        prompt: "Which task does `sorted(tasks, key=lambda t: t[1])` put first?"
        options:
          - id: smallest
            text: test, whose key 1 is the smallest
          - id: largest
            text: write, whose key 2 is the largest and comes first in the input
          - id: input
            text: write, because it is first in the input
        correct: smallest
        explanation: >-
          `sorted` is ascending, so the smallest key leads. Stability only orders items whose keys
          are equal, like write and deploy.

  - id: tie-break-key
    heading: Which key gives this order?
    tags: [sorting, python]
    workedExample: |-
      Consider `rows = [("dee", 4), ("cal", 6), ("abe", 4)]` sorted with
      `key=lambda r: (r[1], r[0])`. A key can return a tuple, and tuples compare from the left.

      1. The keys are `(4, "dee")`, `(6, "cal")` and `(4, "abe")`. The first item is the number,
         so it decides first: both 4s come before the 6.
      2. `(4, "dee")` and `(4, "abe")` tie on the first item, so the second decides. `"abe" < "dee"`, so
         abe comes before dee.
      3. So the result is `[('abe', 4), ('dee', 4), ('cal', 6)]`: by `r[1]` first, and by `r[0]`
         only where `r[1]` ties.
    prompt: |-
      The rows are `[("kim", 9), ("al", 7), ("jo", 9), ("bea", 7)]`. Passing `reverse=True`
      makes a sort run from the largest key down to the smallest. Which key sorts the rows by
      score from high to low, and breaks a tie by name from A to Z?
    options:
      - id: right
        text: "`key=lambda r: (-r[1], r[0])`"
        explanation: >-
          Negating the score turns high scores into small keys, so the 9s come first. The name is
          left as it is, so it sorts A to Z inside each score: jo, kim, al, bea.
      - id: reverse-all
        text: "`key=lambda r: (r[1], r[0])` with `reverse=True`"
        explanation: >-
          `reverse=True` flips the comparison of the whole key, names included, so each tie comes
          out Z to A: kim before jo.
      - id: score-only
        text: "`key=lambda r: -r[1]`"
        explanation: >-
          This orders the scores correctly, but the names are not part of the key. Ties stay in
          input order, kim before jo.
      - id: name-first
        text: "`key=lambda r: (r[0], -r[1])`"
        explanation: >-
          The name comes first in the key, so it decides first: al, bea, jo, kim. The score
          would only matter between two rows with the same name.
    correct: right
    followUps:
      reverse-all:
        prompt: With the key `(score, name)`, which part does `reverse=True` reverse?
        options:
          - id: both
            text: Both, so names also run from Z to A inside a score
          - id: first
            text: Only the score, the first item
          - id: ties
            text: Only the order of tied rows
        correct: both
        explanation: >-
          `reverse=True` reverses each comparison of whole keys, every item of the tuple. To
          flip one part only, negate it inside the key, as `-r[1]` does for a number.
      score-only:
        prompt: "With `key=lambda r: -r[1]`, where do kim and jo end up relative to each other?"
        options:
          - id: input
            text: kim first, as in the input
          - id: name
            text: jo first, by name
          - id: random
            text: Either order, at random
        correct: input
        explanation: >-
          Both keys are -9, so they tie, and the stable sort keeps the order they came in. To order
          ties by name, the name has to be part of the key.
      name-first:
        prompt: In the key `(r[0], -r[1])`, which part is compared first?
        options:
          - id: name
            text: "`r[0]`, the name"
          - id: score
            text: The score, because it is a number
          - id: larger
            text: Whichever part differs more
        correct: name
        explanation: >-
          A tuple key is compared from its first item. Put the field that should decide first in
          front, and the tie-breaker after it.

  - id: tied-landing
    format: tap-cell
    heading: Tap the name at index 2
    tags: [sorting, python]
    workedExample: |-
      Consider `sorted(["ab", "c", "de"], key=len)`. The sort is stable: items with equal keys keep
      their input order.

      1. The keys are 2 for ab, 1 for c and 2 for de. 1 is the smallest, so c comes first, at index
         0.
      2. ab and de both have the key 2, so they tie. Since the sort is stable, ab, which came first
         in the input, stays ahead of de.
      3. So the result is `['c', 'ab', 'de']`, with ab at index 1 and de at index 2.
    prompt: >-
      The key looks up each name's age in the dictionary `age`. Tap the name that lands at index 2
      of `order`.
    code: |
      age = {"lu": 30, "max": 25, "ida": 30, "ben": 25}
      names = ["lu", "max", "ida", "ben"]
      order = sorted(names, key=lambda n: age[n])
      print(order[2])
    sequence:
      kind: array
      name: names
      cells: [lu, max, ida, ben]
    correct: 0
    explanation: >-
      The two 25s come first, max then ben, in their input order. The two 30s follow, lu then ida,
      so `order` is `['max', 'ben', 'lu', 'ida']` and index 2 holds lu.
    misses:
      - index: 1
        explanation: max has the smaller age, 25, and comes first among the 25s, so it lands at index 0.
      - index: 2
        explanation: >-
          ida ties with lu at 30. The key is only the age, so the names are never compared, and lu,
          which came first, stays ahead at index 2.
      - index: 3
        explanation: ben is the second of the two 25s, so it lands at index 1.

  - id: sorted-leaves-original
    format: tap-cell
    heading: Tap the value it prints
    tags: [sorting, python]
    workedExample: |-
      Consider `a = [2, 1]`. Python has two ways to sort a list: the function `sorted(a)` and the
      method `a.sort()`. They differ in whether the list `a` refers to changes.

      1. If the code runs `a.sort()`, the list `a` refers to is reordered, so `a` becomes `[1, 2]`
         and `a[0]` is 1.
      2. If the code runs `b = sorted(a)` instead, the new list `[1, 2]` goes to `b`, and `a` is
         never touched.
      3. So after `b = sorted(a)`, `a` is still `[2, 1]` and `a[0]` is still 2, while `b[0]` is 1.
    prompt: >-
      `sorted(nums)` builds a new sorted list and returns it. Tap the cell holding the value this
      code prints.
    code: |
      nums = [6, 3, 9, 1]
      out = sorted(nums)
      print(nums[0])
    sequence:
      kind: array
      name: nums
      cells: [6, 3, 9, 1]
    correct: 0
    explanation: >-
      `sorted` returned a new list, `out = [1, 3, 6, 9]`. `nums` was never changed, so `nums[0]` is
      still 6.
    misses:
      - index: 1
        explanation: 3 is `nums[1]`, or `out[1]`. The code reads index 0 of `nums`.
      - index: 2
        explanation: >-
          9 is the largest value. It would lead only after a sort from high to low, and `nums` was
          not sorted at all.
      - index: 3
        explanation: >-
          1 is `out[0]`, the front of the sorted copy. `nums[0]` reads the original list, which
          `sorted` leaves alone.

  - id: sort-returns-none
    heading: What does this print?
    tags: [sorting, python]
    workedExample: |-
      Consider `a = [9, 7]` and the line `print(a.sort())`. The method `.sort()` reorders the list it
      is called on and returns `None`.

      1. `a.sort()` runs first. It reorders the list `a` refers to, so `a` now holds `[7, 9]`.
      2. It returns `None`, and `print` shows the value it was handed, so the line prints `None`.
      3. The sorted list is not lost: a later `print(a)` shows `[7, 9]`, because the sort changed
         `a` itself.
    prompt: |-
      The method `nums.sort()` reorders the list `nums` refers to, in place, and returns `None`.
      Unlike `sorted(nums)`, it builds no new list.

      ```python
      nums = [3, 1, 2]
      res = nums.sort()
      print(nums, res)
      ```

      What does it print?
    options:
      - id: right
        text: "`[1, 2, 3] None`"
        explanation: >-
          Line 2 reorders the list `nums` refers to, so `nums` prints sorted. `res` holds what the
          method returned, which is `None`.
      - id: like-sorted
        text: "`[3, 1, 2] [1, 2, 3]`"
        explanation: >-
          That is what `res = sorted(nums)` would print. `.sort()` changes `nums` itself and hands
          back no list.
      - id: returns-list
        text: "`[1, 2, 3] [1, 2, 3]`"
        explanation: >-
          `nums` is right, but the method does not return the list it sorted. It returns `None`,
          so that is what `res` holds.
      - id: unchanged
        text: "`[3, 1, 2] None`"
        explanation: >-
          `res` is right, but the sort still happened. `.sort()` reorders the list in place, so
          `nums` shows the new order even though the return value is `None`.
    correct: right
    followUps:
      like-sorted:
        prompt: Which of the two leaves `nums` in its original order?
        options:
          - id: function
            text: "`sorted(nums)`, which returns a new list"
          - id: method
            text: "`nums.sort()`, which returns `None`"
          - id: both
            text: Both, since neither result is assigned to `nums`
        correct: function
        explanation: >-
          `sorted` copies the items into a new list and leaves `nums` alone. `.sort()` reorders the
          list `nums` refers to, whatever happens to its return value.
      returns-list:
        prompt: What value does `nums.sort()` return?
        options:
          - id: none
            text: "`None`, since its work is done on the list itself"
          - id: sorted
            text: The sorted list, the one it just reordered
          - id: original
            text: A copy of the list as it was before the sort
        correct: none
        explanation: >-
          A method that changes its list in place hands back nothing useful. Writing
          `nums = nums.sort()` would therefore lose the list and leave `nums` as `None`.
      unchanged:
        prompt: "`res` is `None` after line 2. What happened to the list `nums` refers to?"
        options:
          - id: sorted
            text: It was reordered to `[1, 2, 3]`
          - id: same
            text: Nothing, because the sorted result was thrown away
          - id: emptied
            text: It was emptied
        correct: sorted
        explanation: >-
          The reordering happens to the list itself while the method runs. Returning `None`
          throws nothing away, since there was no separate sorted copy.

  - id: trace-sort-names
    format: step-trace
    heading: Follow the names
    tags: [sorting, python]
    workedExample: |-
      Consider `a = [3, 2]`, then `b = sorted(a)`, `c = a.sort()` and `print(a, b, c)`. `sorted(a)`
      builds a new list and returns it, while `a.sort()` reorders the list `a` refers to and returns
      `None`.

      1. `b = sorted(a)` builds a new list, `[2, 3]`, and points `b` at it. `a` still refers to its
         own list, which still holds `[3, 2]`.
      2. `c = a.sort()` then reorders that list in place, so `a` now holds `[2, 3]`. No new list is
         built.
      3. `a.sort()` returns `None`, so `c` is `None`. `print(a, b, c)` shows `[2, 3] [2, 3] None`.
    prompt: >-
      The cells are objects, not a Python list: the list built on line 1, a second list, and
      `None`. The arrows show what each name refers to. Predict each step before it is shown.
    code: |
      nums = [5, 1, 4]
      out = nums
      res = nums
      out = sorted(nums)
      res = nums.sort()
      print(nums, out, res)
    sequence:
      kind: array
      cells: [list A, list B, None]
    start:
      - { name: nums, at: 0 }
      - { name: out, at: 0 }
      - { name: res, at: 0 }
    steps:
      - line: 4
        ask: Line 4 runs. Which object does `out` refer to now?
        pointer: out
        correct: 1
        explanation: >-
          `sorted` builds a new list, `[1, 4, 5]`, and returns it, so `out` moves to list B. List A
          still holds `[5, 1, 4]`.
        misses:
          - index: 0
            explanation: >-
              `sorted` never changes the list it reads, and it does not hand that list back. It
              returns a new one, and `out` now refers to it.
          - index: 2
            explanation: >-
              `None` is what the `.sort()` method returns. The function `sorted` returns a list.
        elsewhere: "`sorted` returns a new list, list B."
      - line: 5
        ask: Line 5 runs. Which object does `res` refer to now?
        pointer: res
        correct: 2
        explanation: >-
          `nums.sort()` reorders list A where it is and returns `None`, so `res` is `None`.
        misses:
          - index: 0
            explanation: >-
