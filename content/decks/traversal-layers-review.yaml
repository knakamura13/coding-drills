id: traversal-layers-review
title: 'Traversal layers: review'
description: Recall queue layers, unit distances, and simultaneous starts on fresh problems.
questions:
  - id: traversal-review-round-count
    tags:
      - bfs
    prompt: A BFS round starts with six nodes. Processing those six discovers four new nodes. How many nodes
      belong to the round that just finished?
    options:
      - id: correct
        text: Six nodes
        explanation: The round contains the nodes present at its start. Discoveries wait for the next round.
      - id: other
        text: Ten nodes
        explanation: Use the queue length at the beginning of the round.
    correct: correct
    followUps:
      other:
        prompt: Which round processes a new node discovered during the current round?
        options:
          - id: 'yes'
            text: The following round
          - id: 'no'
            text: The current round
        correct: 'yes'
        explanation: The round contains the nodes present at its start. Discoveries wait for the next round.
  - id: traversal-review-pending-peer
    tags:
      - bfs
    prompt: A queue holds C, D. You remove C and discover E then F. Which order is the queue in now, front first?
    options:
      - id: correct
        text: D, E, F
        explanation: Removing C leaves D at the front. E and F join behind it, in discovery order.
      - id: other
        text: E, F, D
        explanation: Track D after C is removed.
    correct: correct
    followUps:
      other:
        prompt: Is D taken off the queue by the operation that removes C?
        options:
          - id: 'yes'
            text: It stays waiting for a later pop
          - id: 'no'
            text: It leaves along with C
        correct: 'yes'
        explanation: Removing C leaves D at the front. E and F join behind it, in discovery order.
  - id: traversal-review-layer-label
    tags:
      - bfs
    prompt: The queue starts with P and Q, both distance 3. P is processed, discovering R at distance 4. Which
      nodes can still be processed in the distance-3 layer?
    options:
      - id: correct
        text: Q only
        explanation: Only Q still has distance 3. R was discovered across a new edge and belongs to distance
          4.
      - id: other
        text: Q and R
        explanation: Check the labels of the queued nodes.
    correct: correct
    followUps:
      other:
        prompt: Which label does the edge from P give R?
        options:
          - id: 'yes'
            text: 4, one move past P
          - id: 'no'
            text: 3, the same as P
        correct: 'yes'
        explanation: Only Q still has distance 3. R was discovered across a new edge and belongs to distance
          4.
  - id: traversal-review-count-edges
    tags:
      - bfs
    prompt: |-
      On this board you can move up, down, left or right through open cells. How many moves does the shortest walk from S to T use?

      ```text
      S#T
      .#.
      ...
      ```
    options:
      - id: correct
        text: 6 moves
        explanation: The walk goes down twice, right twice and up twice. It visits seven cells, including S
          at distance zero.
      - id: other
        text: 7 moves
        explanation: Count moves between cells, including the final step into T.
    correct: correct
    followUps:
      other:
        prompt: How many moves have happened before leaving S?
        options:
          - id: 'yes'
            text: Zero moves
          - id: 'no'
            text: One move
        correct: 'yes'
        explanation: The walk goes down twice, right twice and up twice. It visits seven cells, including S
          at distance zero.
  - id: traversal-review-unreachable-target
    tags:
      - bfs
    prompt: |-
      The queue empties and T still has no label. Moves are up, down, left and right. What does this mean on the board below?

      ```text
      S#T
      .#.
      .#.
      ```
    options:
      - id: correct
        text: There is no legal route to T
        explanation: The entire middle column is blocked. The queue finished exploring the side reachable from
          S, leaving T undiscovered.
      - id: other
        text: BFS stopped before it reached T
        explanation: BFS stops only when the queue is empty, and by then every cell reachable from S has a label.
          T has none, so no route reaches it.
    correct: correct
    followUps:
      other:
        prompt: When the queue empties, has every cell reachable from S been labeled?
        options:
          - id: 'yes'
            text: Yes, every reachable cell
          - id: 'no'
            text: No, some may still be waiting
        correct: 'yes'
        explanation: A cell joins the queue as soon as a labeled neighbor finds it, so the queue cannot empty while
          a reachable cell is unlabeled. The middle column is a wall, so T stays undiscovered.
  - id: traversal-review-first-label
    tags:
      - bfs
    prompt: Every edge costs one. A node was discovered on layer 2. A node processed in layer 3 later offers
      another route to it. What distance should the first node keep?
    options:
      - id: correct
        text: Keep 2
        explanation: Layer 3 can only reach a neighbor in at least four moves through that parent. The two-move
          discovery is already shorter.
      - id: other
        text: Replace 2 with 4
        explanation: Compare the known distance with one more move from layer 3.
    correct: correct
    followUps:
      other:
        prompt: How long is the route to that neighbor through the layer-3 node?
        options:
          - id: 'yes'
            text: Four edges
          - id: 'no'
            text: Three edges
        correct: 'yes'
        explanation: Layer 3 can only reach a neighbor in at least four moves through that parent. The two-move
          discovery is already shorter.
  - id: traversal-review-no-offset
    tags:
      - bfs
    prompt: R and S begin active together. You put R before S in the initial queue. What time label does S receive?
    options:
      - id: correct
        text: 0, before any edge traversal
        explanation: A source’s label is its activation time. Its position only determines which source gets
          processed first.
      - id: other
        text: 1, because its queue position is second
        explanation: Separate queue position from the starting time.
    correct: correct
    followUps:
      other:
        prompt: Does S need a route from R to be a source?
        options:
          - id: 'yes'
            text: It starts on its own
          - id: 'no'
            text: It first needs to be reached
        correct: 'yes'
        explanation: A source’s label is its activation time. Its position only determines which source gets
          processed first.
  - id: traversal-review-tied-seeds
    tags:
      - bfs
    prompt: |-
      Two sources at the ends of the row spread left and right, one cell per minute. When does the center cell first become active?

      ```text
      S . . X . . S
      ```
    options:
      - id: correct
        text: Minute 3
        explanation: Both routes to the center take three steps. Either one suffices to reach X.
      - id: other
        text: Minute 6
        explanation: Count the steps of one route from a source to the center.
    correct: correct
    followUps:
      other:
        prompt: If two sources arrive together, how many arrivals does X need to activate?
        options:
          - id: 'yes'
            text: One arrival is enough
          - id: 'no'
            text: Both arrivals must complete in sequence
        correct: 'yes'
        explanation: Both routes to the center take three steps. Either one suffices to reach X.
  - id: traversal-review-source-revisit
    tags:
      - bfs
    prompt: You seed two adjacent sources A and B at minute 0 and mark them seen. When A is processed, it sees
      B beside it. What should it do?
    options:
      - id: correct
        text: Leave B’s zero label and skip it
        explanation: B is already in the starting frontier. The edge from A offers a slower route to something
          already active.
      - id: other
        text: Replace B’s label with 1 and append B
        explanation: Remember which cells were marked when the queue was seeded.
    correct: correct
    followUps:
      other:
        prompt: Is B already scheduled to be processed when A checks the edge?
        options:
          - id: 'yes'
            text: It joined the initial queue
          - id: 'no'
            text: It joins only if A discovers it
        correct: 'yes'
        explanation: B is already in the starting frontier. The edge from A offers a slower route to something
          already active.
  - id: traversal-review-separated-sources
    tags:
      - bfs
    prompt: |-
      The two left cells are simultaneous sources. The middle column is a wall. Which label will BFS give the top-right open cell?

      ```text
      S#.
      S#.
      ```
    options:
      - id: correct
        text: No distance label
        explanation: The wall blocks both seeds. Sharing a row with a source is insufficient when no legal path
          exists.
      - id: other
        text: Distance 1 from the source in its row
        explanation: Look for a route that stays on open cells.
    correct: correct
    followUps:
      other:
        prompt: Does either source have an open path into the right column?
        options:
          - id: 'yes'
            text: Neither source can cross the wall
          - id: 'no'
            text: The upper source can travel straight right
        correct: 'yes'
        explanation: The wall blocks both seeds. Sharing a row with a source is insufficient when no legal path
          exists.
