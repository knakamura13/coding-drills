id: tap-the-cell
title: Tap the cell
description: Tap the cell an index or a pointer names.
heading: Pick the cell

questions:
  - format: tap-cell
    id: read-at-index
    tags: [python]
    prompt: Which cell does `nums[1]` read?
    code: |
      nums = [3, 0, 1, 2]
      print(nums[1])
    sequence:
      kind: array
      name: nums
      cells: [3, 0, 1, 2]
    correct: 1
    explanation: >-
      Indexes start at 0, so `nums[1]` is the second cell. The value sitting there is `0`.
    misses:
      - index: 0
        explanation: Counting from 1 stops on the first cell. Position 1 is the next one.
      - index: 2
        explanation: This cell holds `1`. Brackets read a position; they do not search for that number.
      - index: 3
        explanation: This is `nums[3]`, the last cell. Position 1 is the second cell.

  - format: tap-cell
    id: one-past-the-end
    tags: [python]
    prompt: Which index does `len(code)` name?
    code: |
      code = "zip"
      print(code[len(code)])
    sequence:
      kind: string
      name: code
      cells: [z, i, p]
      pastEnd: true
    correct: 3
    explanation: >-
      `len("zip")` is 3, one past the last character. There is no cell at that index, so the read
      raises IndexError.
    misses:
      - index: 0
        explanation: '`len` counts the cells. It is not the first index.'
      - index: 1
        explanation: Index 1 is the middle character, `i`. `len("zip")` is 3.
      - index: 2
        explanation: Index 2 holds `p`, and `code[2]` succeeds. `len` is one step past that character.

  - format: tap-cell
    id: where-right-moves
    tags: [python, two-pointers]
    prompt: The markers show `left` and `right` before the last line. Which cell does `right` name after it?
    code: |
      nums = [8, 1, 5, 4, 9]
      left = 1
      right = 2
      right += 1
    sequence:
      kind: array
      name: nums
      cells: [8, 1, 5, 4, 9]
    markers:
      - { name: left, at: 1 }
      - { name: right, at: 2 }
    correct: 3
    explanation: '`right` started at 2. Adding 1 moves it to index 3, the cell holding `4`. `left` stays at 1.'
    misses:
      - index: 0
        explanation: '`right` moved toward the end of the array, not back to the first cell.'
      - index: 1
        explanation: That cell is `left`. This line changes `right` only.
      - index: 2
        explanation: This is where `right` started. `right += 1` moves it one cell forward.
      - index: 4
        explanation: One step from index 2 lands on 3. Index 4 is a step further.
