id: reachability-review
title: 'Reachability: review'
description: Practice the same three reachability skills on fresh grids and frontiers.
questions:
  - id: reachability-right-edge-review
    tags:
      - bfs
      - dfs
    prompt: A grid has five columns. You are at column 4. What happens to the proposed step right?
    options:
      - id: valid
        text: Reject column 5 before reading it
        explanation: The last legal column is 4. An index equal to the length is already outside the row.
      - id: mistake
        text: Read column 5 before testing for land
        explanation: A five-column row has no column 5, so reading it raises `IndexError`. The bounds check has
          to run before the read.
    correct: valid
    followUps:
      mistake:
        prompt: With five columns and zero-based indexing, what is the last legal column?
        options:
          - id: right
            text: Column 4
          - id: wrong
            text: Column 5
        correct: right
        explanation: The last legal column is 4. An index equal to the length is already outside the row.
  - id: reachability-left-edge-review
    tags:
      - bfs
      - dfs
    prompt: At (2, 0), a candidate moves left. The row has four columns. Which candidate must the bounds check
      reject?
    options:
      - id: valid
        text: (2, −1)
        explanation: A left step subtracts one from the column. The negative column would wrap to the last
          column in Python.
      - id: mistake
        text: (1, 0)
        explanation: This changes the row, so it is the upward step, and row 1 is inside the grid. The left step
          is (2, −1).
    correct: valid
    followUps:
      mistake:
        prompt: Which coordinate changes when you move left?
        options:
          - id: right
            text: Only the second coordinate
          - id: wrong
            text: Only the first coordinate
        correct: right
        explanation: A left step subtracts one from the column. The negative column would wrap to the last
          column in Python.
  - id: reachability-water-neighbor-review
    tags:
      - bfs
      - dfs
    prompt: |-
      From the top-left land in this grid, which neighbor may be added? Moves change one coordinate by one.

      ```text
      10
      11
      ```
    options:
      - id: valid
        text: (1, 0) only
        explanation: The cell to the right is water and (1, 1) is diagonal. Only the cell below is both adjacent
          and land.
      - id: mistake
        text: (1, 0) and (1, 1)
        explanation: (1, 1) changes both the row and the column, so it is a diagonal, not a neighbor. It is land,
          but no single move reaches it.
    correct: valid
    followUps:
      mistake:
        prompt: What makes (1, 1) ineligible from (0, 0)?
        options:
          - id: right
            text: It changes both coordinates
          - id: wrong
            text: It is outside the grid
        correct: right
        explanation: The cell to the right is water and (1, 1) is diagonal. Only the cell below is both adjacent
          and land.
  - id: reachability-down-edge-review
    tags:
      - bfs
      - dfs
    prompt: A grid has three rows of four cells each. Start at (2, 1). Which step is out of bounds?
    options:
      - id: valid
        text: Down to (3, 1)
        explanation: Rows run from 0 to 2. The proposed row 3 is outside the grid.
      - id: mistake
        text: Right to (2, 2)
        explanation: Column 2 is inside a four-column row, so this step stays in bounds. The step down to row 3
          is past the last row, 2.
    correct: valid
    followUps:
      mistake:
        prompt: Which length limits the row index?
        options:
          - id: right
            text: The number of rows
          - id: wrong
            text: The number of columns
        correct: right
        explanation: Rows run from 0 to 2. The proposed row 3 is outside the grid.
  - id: reachability-diamond-review
    tags:
      - bfs
      - dfs
    prompt: This search marks a node seen when it queues it. B and C are queued. Neither has been processed.
      Both have an edge to D. B is popped first and queues D. What should C do when it checks D?
    options:
      - id: valid
        text: Do not queue D
        explanation: B marked D when it queued it. Marking on discovery lets the second parent tell that D already
          has a place in the queue.
      - id: mistake
        text: Queue D again
        explanation: C did find D by a different edge, but D is already marked and waiting. A second entry gives D
          two turns, and its edges are scanned twice.
    correct: valid
    followUps:
      mistake:
        prompt: Does the queue represent visits to cells or visits along each incoming edge?
        options:
          - id: right
            text: One queued visit per discovered cell
          - id: wrong
            text: One queued visit per incoming edge
        correct: right
        explanation: Marking on discovery lets the second parent tell that D already has a place in the queue.
  - id: reachability-stack-mark-review
    tags:
      - bfs
      - dfs
    prompt: A stack-based flood fill marks a cell seen when it pushes it. T is already on the stack but has not
      been popped. A second neighbor offers T. What should it do?
    options:
      - id: valid
        text: Do not push T
        explanation: T was marked when it was pushed. Discovery happens when the cell joins the frontier. Stack
          order only changes which pending cell comes off next.
      - id: mistake
        text: Push T again
        explanation: T is still waiting, but it is already marked and has a turn coming. A second push makes the
          fill process T twice.
    correct: valid
    followUps:
      mistake:
        prompt: Does switching from a queue to a stack make a discovered cell undiscovered?
        options:
          - id: right
            text: No, it is still discovered
          - id: wrong
            text: Yes, until it is popped
        correct: right
        explanation: Discovery happens when the cell joins the frontier. Stack order only changes which pending
          cell comes off next.
  - id: reachability-return-to-start-review
    tags:
      - bfs
      - dfs
    prompt: Two land cells touch. The traversal starts at A and queues B from A. When B checks A, what prevents
      another visit to A?
    options:
      - id: valid
        text: A was marked when it first entered the queue
        explanation: Seeding the queue and marking the start go together. B can then ignore the edge back to
          A.
      - id: mistake
        text: A was removed from the queue earlier
        explanation: Leaving the queue records nothing. Only the seen mark stops B, so an unmarked start would be
          queued again.
    correct: valid
    followUps:
      mistake:
        prompt: If seen is empty and A is no longer queued, can B rediscover A?
        options:
          - id: right
            text: Yes, A appears unvisited
          - id: wrong
            text: No, popped cells cannot be queued again
        correct: right
        explanation: Seeding the queue and marking the start go together. B can then ignore the edge back to
          A.
  - id: reachability-round-the-wall-review
    tags:
      - bfs
      - dfs
    prompt: |-
      From (0, 0), can a four-direction flood fill reach the top-right land in this grid?

      ```text
      101
      111
      ```
    options:
      - id: valid
        text: Yes, by going through the bottom row
        explanation: Water blocks the direct route. The bottom row connects the two top cells by a valid path.
      - id: mistake
        text: No, because the top row contains water
        explanation: The water blocks only the straight route along row 0. The fill can step down, cross row 1
          and step up to (0, 2).
    correct: valid
    followUps:
      mistake:
        prompt: Which row gives an unbroken route from column 0 to column 2?
        options:
          - id: right
            text: Row 1 connects the two ends
          - id: wrong
            text: Row 0 connects the two ends
        correct: right
        explanation: Water blocks the direct route. The bottom row connects the two top cells by a valid path.
  - id: reachability-diagonal-region-review
    tags:
      - bfs
      - dfs
    prompt: |-
      A flood fill can move up, down, left or right. How many cells does it mark from (0, 0)?

      ```text
      10
      01
      ```
    options:
      - id: valid
        text: One cell
        explanation: The only other land is on the diagonal. There is no land step connecting it to the start.
      - id: mistake
        text: Two cells
        explanation: (1, 1) touches (0, 0) only at a corner. Its edge neighbors, (0, 1) and (1, 0), are water, so
          the fill never reaches it.
    correct: valid
    followUps:
      mistake:
        prompt: Can two cells that only touch at a corner be joined by a single legal step?
        options:
          - id: right
            text: No, one coordinate must stay fixed
          - id: wrong
            text: Yes, a corner counts as a shared edge
        correct: right
        explanation: The only other land is on the diagonal. There is no land step connecting it to the start.
  - id: reachability-drain-stack-review
    tags: [dfs, stack]
    prompt: |-
      In this grid, the letters are land and a dot is water.

      ```text
      A B C
      D . .
      ```

      Start with `[A]` on the stack and A marked seen. Pop the rightmost entry. Check neighbors in order: right,
      down, left, up. Push any unseen land and mark it as seen. After two pops, what is the stack?
    options:
      - id: waiting
        text: "`[B]`, with B ready to pop"
        explanation: A pushes B and then D. D pops next. D has no unseen land neighbor, so B stays.
      - id: followed-right
        text: "`[D, C]`, with C ready to pop"
        explanation: Compare the two entries right after A adds them and find the top.
    correct: waiting
    followUps:
      followed-right:
        prompt: Right after A pushes B and then D, which cell is taken next?
        options:
          - id: d
            text: D, the most recently pushed cell
          - id: b
            text: B, the cell that entered first
        correct: d
        explanation: A stack pops the last entry first. D joined after B and has its turn before B.
