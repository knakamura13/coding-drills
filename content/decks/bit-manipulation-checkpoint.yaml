id: bit-manipulation-checkpoint
title: "Bit manipulation: checkpoint"
description: Trace bit operations on new inputs, and pick a bit method that meets a stated limit. Each item combines the Bit manipulation skills.
heading: Which one is right?

questions:
  - id: bits-exam-sparse-count
    heading: Which loop is best?
    tags: [bit-manipulation, complexity, python]
    prompt: >-
      A settings mask `m` covers 60 features, with bit `j` on when feature `j` is on, and any of
      the 60 can be on. A typical mask has only two or three bits set. Which loop leaves the number
      of features that are on in `count` (starting from 0) in the fewest passes?
    options:
      - id: clear-lowest
        text: "`while m: m &= m - 1; count += 1`"
        explanation: >-
          Each pass clears one set bit, so the loop runs once per feature that is on: two or three
          passes on a typical mask, wherever the bits sit. No correct loop here can make fewer
          passes than that.
      - id: shift
        text: "`while m: count += m & 1; m >>= 1`"
        explanation: >-
          This count is right, but the loop keeps going until every digit up to the top 1 has been
          shifted out, zeros included. A mask with feature 59 on takes 60 passes.
      - id: every-bit
        text: "`for j in range(60): count += (m >> j) & 1`"
        explanation: >-
          This count is right, but the loop reads all 60 bits on every mask, however few are set.
      - id: count-down
        text: "`while m: m -= 1; count += 1`"
        explanation: >-
          Subtracting 1 visits every value from `m` down to 0, so `count` ends up equal to `m`, not
          to the number of set bits, after as many as `2 ** 60 - 1` passes.
    correct: clear-lowest
    followUps:
      shift:
        prompt: "For `m = (1 << 59) | 8`, how many passes does the shift loop make?"
        options:
          - { id: digits, text: "60, one per binary digit up to the highest set bit" }
          - { id: ones, text: "2, one per set bit" }
          - { id: fifty-nine, text: "59, since bit 59 is the last one it reaches" }
        correct: digits
        explanation: >-
          The shift loop stops only when `m` is 0, which takes one pass per binary digit up to the
          highest set bit, bit 59: 60 passes here. The zeros between the two set bits each cost a
          pass, which the `m &= m - 1` loop skips.
      every-bit:
        prompt: How many passes does `for j in range(60)` make on a mask with two bits set?
        options:
          - { id: sixty, text: "60, however many bits are set" }
          - { id: two, text: "2, since it skips the zero bits" }
          - { id: highest, text: "As many as the position of the highest set bit" }
        correct: sixty
        explanation: >-
          A `for` over `range(60)` always runs 60 times. Only a loop that jumps from one set bit
          to the next, such as `m &= m - 1`, makes as few passes as there are bits set.
      count-down:
        prompt: "What does `while m: m -= 1; count += 1` leave in `count`?"
        options:
          - { id: value, text: "The starting value of `m`, after up to `2 ** 60 - 1` passes" }
          - { id: ones, text: "The number of set bits, the same as the `m &= m - 1` loop" }
          - { id: digits, text: "The number of binary digits in `m`" }
        correct: value
        explanation: >-
          `m -= 1` steps through every value down to 0, so the loop runs `m` times and counts
          them. `m &= m - 1` jumps straight past all those values to the next set bit.

  - id: bits-exam-shared-tags
    heading: Which check fits?
    tags: [bit-manipulation, python]
    prompt: >-
      A site has 60 interest tags, numbered 0 to 59, and stores each user's tags as one int, with
      bit `j` set when the user has tag `j`. It checks millions of times whether two users `a` and
      `b` share at least one tag, so each check must run with no loop over the tags. Which check
      fits?
    options:
      - id: and
        text: "`(a & b) != 0`"
        explanation: >-
          `a & b` has bit `j` set only when both users have tag `j`, so it is not 0 exactly when
          they share a tag. It is one operation and one comparison, with no loop.
      - id: or
        text: "`(a | b) != 0`"
        explanation: >-
          `a | b` has a bit set when either user has that tag, so it is not 0 whenever at least
          one of them has any tag at all, shared or not.
      - id: xor
        text: "`(a ^ b) != 0`"
        explanation: >-
          `a ^ b` has a bit set where exactly one user has the tag, so it is not 0 whenever their
          tags differ. Two users with the same tags share them all, and this check says no.
      - id: loop
        text: "`any((a >> j) & (b >> j) & 1 for j in range(60))`"
        explanation: >-
          This answer is right, since it tests bit `j` of both users for each tag. But it loops
          over the tags: for two users who share none it runs all 60 tests.
    correct: and
    followUps:
      or:
        prompt: "For `a = 0b0011` and `b = 0b0100`, what is `(a | b) != 0`?"
        options:
          - { id: true-unshared, text: "`True`, though the two share no tag" }
          - { id: says-false, text: "`False`, since they share no tag" }
          - { id: true-shared, text: "`True`, since both have tag 2" }
        correct: true-unshared
        explanation: >-
          `a | b` is `0b0111`, which is not 0, yet `a` has tags 0 and 1 and `b` has only tag 2.
          `a & b` is 0, which gives the right answer.
      xor:
        prompt: "For `a = 0b0110` and `b = 0b0110`, what is `(a ^ b) != 0`?"
        options:
          - { id: false-shared, text: "`False`, though the two share tags 1 and 2" }
          - { id: says-true, text: "`True`, since they share tags 1 and 2" }
          - { id: false-none, text: "`False`, since they share no tag" }
        correct: false-shared
        explanation: >-
          Every bit is set in both, so `a ^ b` is 0. `^` drops the bits the two have in common,
          which are exactly the shared tags this check needs.
      loop:
        prompt: >-
          `any` stops at the first true test. How many tests does the `any` check run for two users
          who share no tag?
        options:
          - { id: sixty, text: "60, one per tag" }
          - { id: one, text: "1, since `any` stops early" }
          - { id: their-tags, text: "As many as the tags the two users have" }
        correct: sixty
        explanation: >-
          With no shared tag no test is true, so `any` never stops early and tests every `j` from
          0 to 59. `(a & b) != 0` compares all 60 bits in one operation.

  - id: bits-exam-tap-isolate
    format: tap-cell
    heading: Tap the only 1
    tags: [bit-manipulation, python]
    prompt: >-
      The cells show `n` from line 1, highest bit first. Tap the only digit that is 1 in `m` after
      line 3.
    code: |
      n = 0b01101100
      m = n & (n - 1)
      m ^= n
    sequence:
      kind: string
      name: n
      cells: ['0', '1', '1', '0', '1', '1', '0', '0']
    correct: 5
    explanation: >-
      Line 2 clears the lowest 1 of `n`, at index 5, and keeps the rest: `01101000`. Line 3 XORs
      that with `n`, so every 1 the two share cancels, and only the cleared one is left:
      `00000100`, which is 4.
    misses:
      - index: 0
        explanation: This digit is 0 in `n` and in `m`, and `0 ^ 0` is 0.
      - index: 1
        explanation: >-
          This is the highest 1 of `n`. Line 2 keeps it, so `m` and `n` both have it, and line 3
          cancels it to 0.
      - index: 2
        explanation: >-
          Line 2 keeps this 1, since it clears only the lowest 1. Line 3 then cancels it against
          the same 1 in `n`.
      - index: 3
        explanation: This digit is 0 in `n` and in `m`, and `0 ^ 0` is 0.
      - index: 4
        explanation: >-
          This 1 sits just above the lowest 1, and line 2 keeps it. Both numbers have it, so the
          XOR on line 3 turns it off.
      - index: 6
        explanation: >-
          `n - 1` turns this 0 into a 1, but the `&` with `n` makes it 0 again. It is 0 in both
          `m` and `n`, so the XOR leaves 0.
      - index: 7
        explanation: >-
          `n - 1` sets this digit, but `n` has a 0 here, so line 2 gives 0. Line 3 XORs two 0s.

  - id: bits-exam-shift-mask-clear
    heading: What does this print?
    tags: [bit-manipulation, python]
    prompt: |-
      ```python
      n = 0b11010110
      m = (n >> 3) & 0b1111
      m &= m - 1
      print(m)
      ```

      What does this print?
    options:
      - id: eight
        text: "`8`"
        explanation: >-
          `n >> 3` drops the three lowest bits and gives `0b11010`. `& 0b1111` keeps its low four
          bits, so `m` is 10. `m &= m - 1` then clears the lowest set bit of `0b1010`, which
          leaves `0b1000`, or 8.
      - id: twenty-four
        text: "`24`"
        explanation: >-
          24 is `0b11010 & 0b11001`, which clears the lowest set bit of `n >> 3` but skips the mask.
          `& 0b1111` first drops bit 4, so `m` is 10 before line 3.
      - id: two
        text: "`2`"
        explanation: >-
          2 clears the highest set bit of 10, bit 3. `m & (m - 1)` clears the lowest set bit, since
          subtracting 1 only changes the lowest set bit and the 0s below it.
      - id: nine
        text: "`9`"
        explanation: >-
          9 is `m - 1`. Line 3 also runs `&` with the old `m`, which drops the bit 0 that the
          subtraction turned on.
    correct: eight
    followUps:
      twenty-four:
        prompt: What is `0b11010 & 0b1111`?
        options:
          - { id: ten, text: "`0b1010`, which is 10" }
          - { id: twenty-six, text: "`0b11010`, which is 26" }
          - { id: thirteen, text: "`0b1101`, which is 13" }
        correct: ten
        explanation: >-
          `0b1111` sets bits 0 to 3, so the `&` keeps those four bits of `0b11010` and drops bit 4.
          That leaves `0b1010`, which is 10.
      two:
        prompt: "`m` is `0b1010`. Which set bit does `m & (m - 1)` clear?"
        options:
          - { id: bit-one, text: "Bit 1, the lowest set bit" }
          - { id: bit-three, text: "Bit 3, the highest set bit" }
          - { id: bit-zero, text: "Bit 0, the rightmost bit" }
        correct: bit-one
        explanation: >-
          `m - 1` is `0b1001`: the lowest set bit, bit 1, turned to 0 and bit 0 below it turned to
          1. The `&` keeps only bit 3, which both share, so `m` becomes 8.
      nine:
        prompt: "`m` is 10 and `m - 1` is 9. What is `10 & 9`?"
        options:
          - { id: eight, text: "`8`, since only bit 3 is set in both" }
          - { id: nine, text: "`9`, since `&` keeps the smaller number" }
          - { id: ten, text: "`10`, since `&` keeps the first number" }
        correct: eight
        explanation: >-
          10 is `0b1010` and 9 is `0b1001`. Bit 3 is set in both and bits 1 and 0 each in only one,
          so `10 & 9` is `0b1000`, which is 8.

  - id: bits-exam-debug-flips
    heading: Which call fails?
    tags: [bit-manipulation, python]
    prompt: |-
      Lights 0 to `n - 1` start off. Each number `j` in `flips` flips light `j`: off becomes on, and
      on becomes off. A suggested solution keeps the lights in one int `m`, with bit `j` set while
      light `j` is on, and should return the lights left on, in increasing order.

      ```python
      def lights_on(flips, n):
          m = 0
          for j in flips:
              m |= 1 << j
          return [j for j in range(n) if (m >> j) & 1]
      ```

      Which call returns the wrong list?
    options:
      - id: twice
        text: "`lights_on([1, 3, 1], 4)`"
        explanation: >-
          Light 1 is flipped twice, so it ends off, and the right list is `[3]`. `m |= 1 << j` sets
          bit 1 again instead of clearing it, so the call returns `[1, 3]`. Flipping needs
          `m ^= 1 << j`.
      - id: three-times
        text: "`lights_on([2, 0, 2, 2], 3)`"
        explanation: >-
          Light 2 is flipped three times, so it ends on, and `|=` also leaves bit 2 set. The call
          returns `[0, 2]`, which is right.
      - id: distinct
        text: "`lights_on([0, 1, 2], 3)`"
        explanation: >-
          Each light is flipped once, from off to on. Setting a bit that is 0 gives the same result
          as flipping it, so the call returns `[0, 1, 2]`, which is right.
      - id: out-of-order
        text: "`lights_on([3, 0], 4)`"
        explanation: >-
          Lights 3 and 0 are each flipped once, so both are on. The list walks `j` up from 0, so the
          call returns `[0, 3]`, which is right.
    correct: twice
    followUps:
      three-times:
        prompt: Light 2 is flipped three times. Where does it end, and what does the code leave?
        options:
          - { id: on-on, text: "On, and the code leaves bit 2 set, which agrees" }
          - { id: off-on, text: "Off, but the code leaves bit 2 set" }
          - { id: on-off, text: "On, but the code leaves bit 2 clear" }
        correct: on-on
        explanation: >-
          Off, on, off, on: three flips end on. `|=` sets bit 2 the first time and keeps it set, so
          the bug hides when a light is flipped an odd number of times.
      distinct:
        prompt: When does `m |= 1 << j` give the same result as `m ^= 1 << j`?
        options:
          - { id: clear, text: "When bit `j` of `m` is 0" }
          - { id: always, text: "Always, since both use the mask `1 << j`" }
          - { id: set, text: "When bit `j` of `m` is already 1" }
        correct: clear
        explanation: >-
          On a bit that is 0, setting it and flipping it both give 1. They differ only on a bit
          that is already 1, which `^=` turns off and `|=` leaves on.
      out-of-order:
        prompt: In what order does `lights_on` list the lights?
        options:
          - { id: increasing, text: "In increasing order, since it walks `j` up from 0" }
          - { id: flip-order, text: "In the order they were first flipped" }
          - { id: last-first, text: "The most recently flipped light first" }
        correct: increasing
        explanation: >-
          The comprehension tests `j` for each value in `range(n)`, so the lights come out from 0
          up, whatever order the flips came in. `lights_on([3, 0], 4)` returns `[0, 3]`.
