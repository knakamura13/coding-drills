id: feasible-limits-checkpoint
title: "Feasible limits: checkpoint"
description: Find the smallest feasible limit, choose a search for a new task, find a pass that miscounts, and count what the search reads. Most items combine the Feasible limits skills.
heading: Which one is right?

questions:
  - id: checkpoint-trace-limits
    format: step-trace
    heading: Predict each step
    tags: [binary-search, greedy]
    prompt: >-
      `sessions(sizes, x)` packs the files in order and opens a new session when the next file
      would push the load over `x`. Each cell is a candidate limit. Predict each step before it is
      shown.
    code: |
      sizes, d = [4, 5, 3], 2
      lo, hi = max(sizes), sum(sizes)
      while lo < hi:
          mid = (lo + hi) // 2
          if sessions(sizes, mid) <= d:
              hi = mid
          else:
              lo = mid + 1
      print(lo)
    sequence:
      kind: array
      name: limits
      cells: [5, 6, 7, 8, 9, 10, 11, 12]
    start:
      - { name: lo, at: 0 }
      - { name: hi, at: 7 }
    steps:
      - line: 5
        ask: The first probe is 8. What does `sessions(sizes, 8)` return?
        options:
          - id: two-passes
            text: 2, so the probe passes
            explanation: >-
              4 + 5 = 9 is over 8, so the 5 opens a second session. 5 + 3 = 8 is not over 8, so
              the 3 joins it: [4] and [5, 3].
          - id: three-fails
            text: 3, so the probe fails
            explanation: A load equal to the limit fits. Check 5 + 3 against 8.
          - id: one-passes
            text: 1, so the probe passes
            explanation: Check whether the 5 fits beside the 4.
        correct: two-passes
      - line: 5
        ask: Where does `hi` sit after the first pass?
        pointer: hi
        correct: 3
        explanation: 8 passed, so no larger limit can be the smallest, and `hi = mid` keeps 8.
        misses:
          - index: 2
            explanation: That is `mid - 1`. Could 8 itself be the answer?
          - index: 7
            explanation: Which bound does a passing probe move?
        elsewhere: "`hi = mid` puts `hi` on 8."
      - line: 4
        ask: Where does `lo` sit after the second pass?
        pointer: lo
        correct: 2
        explanation: >-
          `mid` is (5 + 8) // 2 = 6. At 6 every file sits alone, three sessions, so 6 fails and
          `lo = mid + 1` puts `lo` on 7.
        misses:
          - index: 1
            explanation: That keeps the probe. Did 6 pass?
          - index: 0
            explanation: Run the pass at 6. Which bound does a failure move?
        elsewhere: 6 needs three sessions, so `lo = mid + 1 = 7`.
      - line: 4
        ask: Where does `lo` sit after the third pass?
        pointer: lo
        correct: 3
        explanation: >-
          `mid` is (7 + 8) // 2 = 7. 4 + 5 = 9 and 5 + 3 = 8 are both over 7, so 7 needs three
          sessions and fails. `lo` moves to 8 and meets `hi`.
        misses:
          - index: 2
            explanation: Run the pass at 7. Which pairs fit under it?
        elsewhere: 7 fails, so `lo = 8`.
      - line: 9
        ask: The loop prints 8. How many sizes did the `sessions` calls read in all?
        options:
          - id: nine
            text: '9'
            explanation: >-
              Three probes, at 8, 6 and 7, and each `sessions` call reads all 3 sizes. The cost is
              the number of probes times one pass.
          - id: three
            text: '3'
            explanation: How many sizes does one probe read?
          - id: twenty-four
            text: '24'
            explanation: Did the search run the pass at every candidate?
        correct: nine

  - id: checkpoint-tap-smallest-limit
    format: tap-cell
    heading: Tap the smallest feasible limit
    tags: [binary-search, greedy]
    prompt: >-
      The files stay in order and can't be split, and a session's load may equal the limit. The
      cells are the limits 11 to 18. Tap the smallest feasible limit, the smallest that fits the
      files into at most `d` sessions.
    code: |
      sizes = [2, 11, 4, 6, 3, 7]
      d = 3
    sequence:
      kind: array
      name: limits
      cells: [11, 12, 13, 14, 15, 16, 17, 18]
    correct: 2
    explanation: >-
      At 13 the pass packs [2, 11], [4, 6, 3] and [7], three sessions. At 12 it needs four,
      because 2 + 11 = 13 is over 12. So the answers turn from no to yes at 13.
    misses:
      - index: 0
        explanation: >-
          11 is the largest file and the even split, 33 / 3. Run the pass: where does the 2 go?
      - index: 1
        explanation: Run the pass at 12. Can the 2 and the 11 share a session?
      - index: 3
        explanation: 14 is feasible. Is a smaller limit feasible too?
      - index: 4
        explanation: 15 is feasible. Is a smaller limit feasible too?
      - index: 5
        explanation: 16 is feasible. Is a smaller limit feasible too?
      - index: 6
        explanation: >-
          17 is the first limit that needs only two sessions. Does the question ask for exactly
          `d`, or at most `d`?
      - index: 7
        explanation: 18 is feasible, but it is not the smallest feasible limit.

  - id: checkpoint-reads-per-search
    heading: How many reads?
    tags: [binary-search, complexity]
    prompt: |-
      ```python
      lo, hi = max(sizes), sum(sizes)   # 1,000 and 8,999
      while lo < hi:
          mid = (lo + hi) // 2
          if sessions(sizes, mid) <= d:
              hi = mid
          else:
              lo = mid + 1
      ```

      `sizes` holds 300 files, and each `sessions` call reads all of them. The range holds 8,000
      candidate limits. At most how many sizes do the `sessions` calls read in all?
    options:
      - id: probes-times-pass
        text: 3,900
        explanation: >-
          Each probe halves the 8,000 candidates, so the loop makes at most 13 probes, since
          13 halvings bring even 8,192 down to one. Each probe is one full pass over 300 sizes:
          13 × 300 = 3,900.
      - id: probes-only
        text: '13'
        explanation: That counts the probes. What does one probe read?
      - id: halves-files
        text: 72,000
        explanation: That is 9 × 8,000. Which range does each probe halve?
      - id: every-limit
        text: 2,400,000
        explanation: That is one pass per candidate. Does the search run them all?
    correct: probes-times-pass
    followUps:
      probes-only:
        prompt: What does one probe cost?
        options:
          - id: full-pass
            text: One `sessions` pass, which reads all 300 sizes
          - id: one-read
            text: One read, as with `a[mid]` in a sorted list
          - id: log-reads
            text: About 9 reads, one for each halving of 300
        correct: full-pass
        explanation: >-
          A probe asks "is this limit feasible?", and only a pass over every file can answer. The
          total is the number of probes times that pass.
      halves-files:
        prompt: What does each probe cut in half?
        options:
          - id: limits
            text: The range of candidate limits, 8,000 at the start
          - id: files
            text: The list of 300 files
          - id: both
            text: Both the limits and the files
        correct: limits
        explanation: >-
          The search runs over limits, about 13 halvings for 8,000. The files are read in full on
          every probe, since the pass needs every one of them.
      every-limit:
        prompt: Why can the search skip most of the 8,000 limits?
        options:
          - id: settles-side
            text: A pass rules out every larger limit, and a failure every smaller one
          - id: below-largest
            text: Most limits are below the largest file
          - id: cached
            text: The pass caches its results between probes
        correct: settles-side
        explanation: >-
          Feasibility turns from no to yes once, so one probe settles half the range. That is
          why doubling the range adds only one probe.

  - id: checkpoint-pick-speed-search
    heading: Which search finds it?
    tags: [binary-search]
    prompt: >-
      A reader must finish `n` chapters, `pages[i]` pages each, within `h` days, where `h` is at
      least `n`. Each day they read at most `k` pages, all from one chapter, so a 7-page chapter
      takes 3 days at `k = 3`. The task is the smallest `k` that finishes in time. For
      `pages = [4, 9, 5, 12]` and `h = 8` the answer is 5. Which search finds `k` for every input?
    options:
      - id: right
        text: Search 1 to `max(pages)`, testing whether the days needed are at most `h`
        explanation: >-
          At `k = max(pages)` each chapter takes one day, so `n` days are enough and that `k`
          works. A larger `k` never needs more days, so the answers turn from no to yes once.
          Here the search finds 5, since at 4 the reader needs 9 days.
      - id: copy-bounds
        text: Search `max(pages)` to `sum(pages)`, testing whether the days needed are at most `h`
        explanation: Here that search returns 12. Can the answer be below the longest chapter?
      - id: exactly
        text: Search 1 to `max(pages)`, testing whether the days needed are exactly `h`
        explanation: The first probe is 6, which needs 6 days. Which way does the search move?
      - id: total
        text: Search 1 to `max(pages)`, testing whether `sum(pages) <= k * h`
        explanation: That test accepts 4. How many days does the reader need at 4?
    correct: right
    followUps:
      copy-bounds:
        prompt: A file had to fit whole in one session. Does a chapter have to be read in one day?
        options:
          - id: spread
            text: No, a long chapter can take several days, so `k` can be below `max(pages)`
          - id: one-day
            text: Yes, so `k` must be at least the longest chapter
          - id: last-only
            text: Only the last chapter
        correct: spread
        explanation: >-
          Reading a chapter can spread over days, so the lower bound the sessions search needed
          does not carry over. Starting at the longest chapter skips the answer 5 and returns 12.
      exactly:
        prompt: As `k` goes from 1 to 6, the days needed are 30, 16, 11, 9, 7 and 6. Does any `k` need exactly 8 days?
        options:
          - id: skips
            text: No, the count jumps from 9 to 7, so the test never says yes
          - id: five
            text: Yes, `k = 5`
          - id: from-five
            text: Yes, every `k` from 5 up
        correct: skips
        explanation: >-
          The days needed can step over `h`. "Exactly `h`" then says no at every probe, and the
          search climbs to 12. "At most `h`" turns from no to yes once, which is what the search
          needs.
      total:
        prompt: "At `k = 4` the total test holds, since 30 is at most 4 × 8 = 32. How many days does the reader need?"
        options:
          - id: nine
            text: '9, which is 1 + 3 + 2 + 3, more than 8'
          - id: eight
            text: 8, since 32 pages fit in 8 days
          - id: seven
            text: 7, since 30 / 4 rounds down to 7
        correct: nine
        explanation: >-
          A day's reading stays in one chapter, so a chapter's last day is often not full. The
          total test treats the pages as one pile and accepts a speed that is too slow.

  - id: checkpoint-debug-sessions
    heading: Which call does it fail on?
    tags: [binary-search, greedy, python]
    prompt: |-
      A suggested solution counts the sessions the greedy pass needs at limit `x`: files stay in
      order and whole, and a new session opens when the next file would push the load over `x`.
      One detail is slightly off:

      ```python
      def sessions(sizes, x):
          count, load = 1, 0
          for s in sizes:
              if load + s > x:
                  count += 1
                  load = 0
              else:
                  load += s
          return count
      ```

      Which call returns a wrong count?
    options:
      - id: lost-load
        text: '`sessions([3, 8, 9], 10)`'
        explanation: >-
          The 8 opens the second session, but the `else` skips `load += s`, so `load` stays 0
          instead of 8. Then 0 + 9 is not over 10, so the 9 joins and the call returns 2. The real
          sessions are [3], [8] and [9], which is 3. Moving `load += s` out of the `else`, below
          the `if`, fixes it.
      - id: small-tail
        text: '`sessions([7, 4, 1, 1], 10)`'
        explanation: >-
          The 4 opens the second session with `load` at 0 instead of 4. The two 1s join either
          way, since 4 + 1 + 1 is 6, so the call returns 2, which is right.
      - id: exact-tail
        text: '`sessions([6, 6, 2], 8)`'
        explanation: >-
          The second 6 opens a session with `load` at 0 instead of 6. The 2 joins either way,
          since 6 + 2 is 8, not over 8, so the call returns 2, which is right.
      - id: last-opens
        text: '`sessions([5, 5, 6], 10)`'
        explanation: >-
          The 6 opens the second session, and no file comes after it, so the load it should have
          added is never read. The call returns 2, which is right.
    correct: lost-load
    followUps:
      small-tail:
        prompt: In `sessions([7, 4, 1, 1], 10)` the second session should hold 4, 1 and 1. Does the lost 4 change any decision?
        options:
          - id: no
            text: No, the 1s join whether the load counts the 4 or not
          - id: third
            text: Yes, the 1s open a third session
          - id: twice
            text: Yes, the 4 is counted twice
        correct: no
        explanation: >-
          A load that is too small changes the count only when a later file would not fit beside
          the real load but fits beside the smaller one. Here 4 + 1 + 1 is only 6.
      exact-tail:
        prompt: With the real load, does the 2 fit beside the second 6 at limit 8?
        options:
          - id: fits
            text: Yes, 6 + 2 is 8, which is not over 8
          - id: over
            text: No, 6 + 2 is over 8
          - id: always-opens
            text: No, a file after a new session always opens another
        correct: fits
        explanation: >-
          The real load, 6, and the buggy one, 0, both let the 2 join, so the count comes out the
          same.
      last-opens:
        prompt: When does skipping `load += s` for the file that opens a session change the count?
        options:
          - id: later-file
            text: When a later file would not fit beside the file that opened the session
          - id: exact-load
            text: Whenever a load equals the limit exactly
          - id: any-open
            text: Whenever a new session opens
        correct: later-file
        explanation: >-
          In `[5, 5, 6]` the 6 opens the last session and nothing follows it, so its load is never
          compared again. In `[3, 8, 9]` the 9 would not fit beside the 8, and the lost load lets
          it in.
