id: one-dimensional-tables-checkpoint
title: "Dynamic programming: 1D tables (checkpoint)"
description: Build a table for a fresh counting or optimization task. Each item combines the 1D table skills.
heading: Which plan is right?

questions:
  - id: tables-exam-colored-slabs
    heading: Which plan is right?
    tags: [dp]
    prompt: >-
      A path of length `n` is paved from left to right with no gaps. A slab of length 1 comes in
      red or blue, and a slab of length 2 comes only in gray. Two pavings differ when any slab's
      color or position differs, so red-blue and blue-red are different. Let `w[i]` be the number
      of ways to pave a path of length `i`. Which plan is right?
    options:
      - id: right
        text: "`w[i] = 2 * w[i-1] + w[i-2]`, with `w[0] = 1` and `w[1] = 2`"
        explanation: >-
          The last slab is red, blue or gray. A red or a blue one leaves any paving of `i - 1`,
          which gives two cases, and a gray one leaves any paving of `i - 2`. The empty path has
          one paving, the one with no slabs. The table for 0 to 4 is 1, 2, 5, 12, 29.
      - id: no-colors
        text: "`w[i] = w[i-1] + w[i-2]`, with `w[0] = 1` and `w[1] = 2`"
        explanation: How many colors can the last slab have when it has length 1?
      - id: gray-twice
        text: "`w[i] = 2 * (w[i-1] + w[i-2])`, with `w[0] = 1` and `w[1] = 2`"
        explanation: How many colors does a slab of length 2 come in?
      - id: empty-zero
        text: "`w[i] = 2 * w[i-1] + w[i-2]`, with `w[0] = 0` and `w[1] = 2`"
        explanation: How many pavings of length 2 are a single gray slab?
    correct: right
    followUps:
      no-colors:
        prompt: A paving of length 3 ends in a slab of length 1. Given `w[2] = 5`, how many such pavings are there?
        options:
          - id: ten
            text: 10, two for each of the 5
          - id: five
            text: 5, one for each of the 5
          - id: seven
            text: 7, the 5 plus one per color
        correct: ten
        explanation: >-
          Each of the 5 shorter pavings can end in a red slab or a blue one, and those are
          different pavings. So the length-1 case counts `w[i-1]` twice.
      gray-twice:
        prompt: A paving ends in a gray slab. How many choices does that last slab add?
        options:
          - id: one
            text: One, since gray is its only color
          - id: two
            text: Two, the same as a slab of length 1
          - id: three
            text: Three, one for each color in the set
        correct: one
        explanation: >-
          Each case is counted once per way to make its last slab. A slab of length 2 has one color,
          so it adds `w[i-2]` once. Doubling both terms counts a second gray that does not exist:
          `w[2]` comes out 6 instead of 5.
      empty-zero:
        prompt: With `w[0] = 0`, what is `w[2]`, and which paving goes missing?
        options:
          - id: four-gray
            text: 4, missing the single gray slab
          - id: five
            text: 5, and nothing goes missing
          - id: four-mixed
            text: 4, missing the red-blue paving
        correct: four-gray
        explanation: >-
          A single gray slab covers length 2 and leaves the empty path, which `w[0]` counts. With
          `w[0] = 0` that paving is lost, and so is every paving built on it: `w[4]` becomes 24
          instead of 29.

  - id: tables-exam-codes-end-b
    format: tap-cell
    heading: Tap the entry that counts them
    tags: [dp]
    prompt: >-
      A code is a string of the letters A and B with no two Bs side by side. `count[i]` is the
      number of codes of length `i`, shown below for 0 to 6. Every code of length 6 ends in A or
      in B. Tap the entry that equals the number of codes of length 6 that end in B.
    code: |
      # count[i]: strings of A and B of length i with no 'BB'
      count = [1, 2, 3, 5, 8, 13, 21]
    sequence: { kind: array, name: count, cells: [1, 2, 3, 5, 8, 13, 21] }
    correct: 4
    explanation: >-
      A B at the end needs an A just before it, so these codes are a code of length 4 followed by
      `AB`. There are `count[4]` of them, which is 8. The codes that end in A are any code of
      length 5 plus an A, 13 of them, and 13 + 8 is 21.
    misses:
      - index: 0
        explanation: >-
          `count[0]` is the empty code. A code of length 6 that ends in `AB` still has 4 letters
          before them.
      - index: 1
        explanation: Taking off the final `AB` leaves 4 letters, not 1.
      - index: 2
        explanation: Taking off the final `AB` leaves 4 letters, not 2.
      - index: 3
        explanation: >-
          A code that ends in B ends in `AB`, so the last two letters are fixed, not three.
      - index: 5
        explanation: >-
          `count[5]` counts the codes that end in A, any code of length 5 plus an A. A B cannot
          follow just any code, since that code may already end in B.
      - index: 6
        explanation: "`count[6]` counts every code of length 6, the ones that end in A as well."

  - id: tables-exam-cups-at-least
    heading: Which setup is right?
    tags: [dp, python]
    prompt: |-
      Packs of 3 cups cost $5 and packs of 5 cups cost $7. `least(n)` should return the smallest
      price for **at least** `n` cups, so extra cups are fine. Here `inf` is `float('inf')`.

      ```python
      def least(n):
          cost = [START] * (n + 1)
          cost[0] = BASE
          for i in range(1, n + 1):
              for size, price in ((3, 5), (5, 7)):
                  cost[i] = min(cost[i], price + cost[PREV])
          return cost[n]
      ```

      Which choice of `START`, `BASE` and `PREV` is right?
    options:
      - id: right
        text: "`START = inf`, `BASE = 0`, `PREV = max(0, i - size)`"
        explanation: >-
          The last pack covers `size` of the cups still needed. When fewer remain, one pack covers
          them all and nothing is left to buy, so the step back stops at 0 instead of landing on
          an impossible amount. `inf` starts every other entry so `min` can replace it. For 7 cups
          the table gives $12, a 3-pack and a 5-pack.
      - id: exact
        text: "`START = inf`, `BASE = 0`, `PREV = i - size`"
        explanation: What does `cost[i - size]` read when `i` is smaller than `size`?
      - id: base-inf
        text: "`START = inf`, `BASE = inf`, `PREV = max(0, i - size)`"
        explanation: What does buying nothing cost when you need 0 cups?
      - id: start-zero
        text: "`START = 0`, `BASE = 0`, `PREV = max(0, i - size)`"
        explanation: Can `min(cost[i], ...)` ever replace a starting value of 0?
    correct: right
    followUps:
      exact:
        prompt: With `PREV = i - size`, `cost[2]` reads `cost[-1]`. What does that hold, and what does `least(7)` return?
        options:
          - id: inf-seven
            text: "`inf`, the last entry, so `least(7)` is `inf`"
          - id: error
            text: "Nothing, so `least(7)` raises `IndexError`"
          - id: twelve
            text: "`cost[0]`, so `least(7)` is still $12"
        correct: inf-seven
        explanation: >-
          A negative index counts from the end of the list, where entries still hold `inf`, so
          `cost[-1]` is the unfilled `cost[7]`. Then 1, 2 and 4 cups look impossible, although one
          pack covers them, and 7 builds only on those.
          With "at least", a shortfall smaller than a pack is covered by that pack, which is why
          the step back stops at 0.
      base-inf:
        prompt: With `BASE = inf`, what is `cost[3]`?
        options:
          - id: inf
            text: "`inf`, like every other entry"
          - id: five
            text: $5, the price of one 3-pack
          - id: zero
            text: $0, since 3 is a pack size
        correct: inf
        explanation: >-
          Every chain of packs ends at `cost[0]`, the price of the cups still needed once the order
          is covered. Needing nothing costs $0. With `inf` there, every price is `inf + 5` or
          `inf + 7`, which is `inf`.
      start-zero:
        prompt: With every entry starting at 0, what does `min(cost[i], price + cost[PREV])` keep?
        options:
          - id: zero
            text: 0, since a price plus a cost is never below 0, so the table stays 0
          - id: right
            text: The cheaper pack, since `min` compares the two packs
          - id: price
            text: The price of the first pack tried
        correct: zero
        explanation: >-
          A `min` table can only move down from where it starts. A start of 0 means "free", and no
          real price beats it, so `least(7)` returns 0. Entries that `min` must fill start at `inf`.

  - id: tables-exam-booked-slots
    heading: Which plan is right?
    tags: [dp]
    prompt: >-
      A room has `n` time slots in a row. Slot `i` has a value `v[i]` that is never negative. Two
      neighboring slots cannot both be booked, because the room needs a reset between them. Book
      slots so the total value is as large as possible. Let `best[i]` be the best total using only
      slots 0 to `i`, and read any index below 0 as 0. Which plan is right?
    options:
      - id: largest-first
        text: Repeatedly book the highest-value free slot and block its two neighbors
        explanation: >-
          A large value can block two neighbors whose combined worth is larger. On
          `[11, 14, 11, 5]` this books the 14, which blocks slots 0 and 2, then the 5, for a total
          of 19. Booking slots 0 and 2 gives 22.
      - id: always-take
        text: "`best[i] = best[i-2] + v[i]`, and return `best[n-1]`"
        explanation: >-
          This forces slot `i` to be booked. A prefix may do better by skipping its last slot: on
          `[2, 13, 3]` the recurrence gives `best[2] = 2 + 3 = 5`, while the best total is 13.
      - id: max-then-add
        text: "`best[i] = max(best[i-1], best[i-2]) + v[i]`, and return `best[n-1]`"
        explanation: >-
          When `best[i-1]` is the larger term, it may include slot `i-1`, and adding `v[i]` then
          books two neighbors. On `[6, 8, 6]` it returns 20, but the best total is 12 (slots 0
          and 2).
      - id: take-or-skip
        text: "`best[i] = max(best[i-1], best[i-2] + v[i])`, and return `best[n-1]`"
        explanation: >-
          For slot `i` there are two cases. Skip it, and the best total is `best[i-1]`. Book it,
          and its neighbor is off limits, so it adds `v[i]` to the best total over slots 0 to
          `i-2`. Take the larger. On `[11, 14, 11, 5]` the entries are 11, 14, 22, 22, so the
          answer is 22.
    correct: take-or-skip
    followUps:
      largest-first:
        prompt: >-
          On `[11, 14, 11, 5]` the largest-first plan books the 14 first. What total does it end
          with, and what is the best total?
        options:
          - id: nineteen
            text: 19 (the 14, then the 5), while slots 0 and 2 give 22
          - id: twenty-two
            text: 22, so the largest-first plan happens to match the best total
          - id: fourteen
            text: 14, because booking the 14 blocks every other slot
        correct: nineteen
        explanation: >-
          Booking the 14 blocks slots 0 and 2, but slot 3 stays free, so the plan ends at 19. The
          recurrence does not commit to the biggest value. It compares skipping and booking at
          each slot, and keeps the better total.
      always-take:
        prompt: >-
          On `[2, 13, 3]`, `best[1]` is 13 but `best[2] = best[0] + v[2]` is 5. What does that
          recurrence leave out?
        options:
          - id: skip-option
            text: Skipping slot `i`, which would let `best[i]` be at least `best[i-1]`
          - id: base-cases
            text: The base cases, because `best[0]` should be 0
          - id: add-previous
            text: Adding `best[i-1] + v[i]`, since the previous slot is free to use
        correct: skip-option
        explanation: >-
          `best[i]` means the best total using slots 0 to `i`, and that includes plans that never
          book slot `i`. Without the `best[i-1]` term the total can fall below a shorter prefix's
          total. Adding `best[i-1] + v[i]` would break the neighbor rule.
      max-then-add:
        prompt: >-
          On `[6, 8, 6]`, `max(best[i-1], best[i-2]) + v[i]` returns 20. Why is that total
          invalid?
        options:
          - id: may-include-neighbor
            text: "`best[i-1]` may already book slot `i-1`, so adding `v[i]` books two neighbors"
          - id: use-min
            text: "`max` should be `min`, to avoid choosing a neighbor"
          - id: forgot-previous-value
            text: It forgets to add `v[i-1]` to the total
        correct: may-include-neighbor
        explanation: >-
          `v[i]` may be added only to a total that leaves slot `i-1` free, which is `best[i-2]`.
          The right recurrence puts `+ v[i]` inside the second term only, so the first term,
          `best[i-1]`, stays a plain "skip slot `i`" case.

  - id: tables-exam-debug-empty-seed
    heading: Which call does it fail on?
    tags: [dp, python]
    prompt: |-
      A suggested `best_sum(nums)` should return the largest total of a subarray, a slice of
      neighboring values with at least one value in it. Its `end[i + 1]` is the largest total of a
      subarray that ends exactly at index `i`, and `end[0]` is an extra entry set to 0. One detail
      is slightly off:

      ```python
      def best_sum(nums):
          end = [0] * (len(nums) + 1)
          for i in range(len(nums)):
              end[i + 1] = max(nums[i], end[i] + nums[i])
          return max(end)
      ```

      Which call returns a wrong answer?
    options:
      - id: all-negative
        text: "`best_sum([-4, -1, -6])`"
        explanation: >-
          `end` is `[0, -4, -1, -6]`. The extra `end[0]` stands for no subarray at all, and
          `max(end)` returns its 0, though every subarray here has a negative total. The right
          answer is -1, the -1 alone. Returning `max(end[1:])` fixes it.
      - id: zero-first
        text: "`best_sum([0, -5, -1])`"
        explanation: >-
          `max(end)` returns 0, and that is right: the subarray `0` alone totals 0. The extra
          `end[0]` matches a real answer here, so no harm is done.
      - id: middle-positive
        text: "`best_sum([-5, 2, -8])`"
        explanation: >-
          `end` is `[0, -5, 2, -6]`, so the call returns 2, the 2 alone, which is right. The extra
          0 is smaller than 2 and never wins.
      - id: restart-last
        text: "`best_sum([3, -9, 4])`"
        explanation: >-
          `end` is `[0, 3, -6, 4]`. At index 2, `max(4, -6 + 4)` starts fresh with the 4, and the
          call returns 4, which is right.
    correct: all-negative
    followUps:
      zero-first:
        prompt: What is the largest total of a subarray of `[0, -5, -1]`?
        options:
          - id: zero
            text: 0, from the subarray `0` alone
          - id: minus-one
            text: -1, from the subarray `-1` alone
          - id: minus-six
            text: -6, from the whole list
        correct: zero
        explanation: >-
          The 0 at index 0 is a subarray of one value, and its total, 0, beats every other one. The
          extra 0 in `end[0]` only goes wrong when no real subarray reaches 0.
      middle-positive:
        prompt: When can the 0 in `end[0]` change what `max(end)` returns?
        options:
          - id: below-zero
            text: Only when every real subarray totals less than 0
          - id: any-negative
            text: Whenever the list holds a negative value
          - id: first-negative
            text: Whenever the first value is negative
        correct: below-zero
        explanation: >-
          `max` returns the 0 only when no real entry is 0 or more. A list with any value that is
          0 or more has a subarray that reaches it, so the extra 0 does no harm there.
      restart-last:
        prompt: "In `best_sum([3, -9, 4])`, does starting fresh at the 4 lose a better subarray?"
        options:
          - id: no-lower
            text: No. Extending to `3, -9, 4` totals -2, less than the 4 alone
          - id: yes-whole
            text: Yes. It loses `3, -9, 4`, which totals 7
          - id: yes-three
            text: Yes. It loses the 3, which the answer needs
        correct: no-lower
        explanation: >-
          `end[2]` is -6, so adding it only lowers the total. A fresh start is right whenever the
          entry before is negative, so this fill is right, and so is `max(end)`, which is 4.
