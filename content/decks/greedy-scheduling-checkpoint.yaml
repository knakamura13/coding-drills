id: greedy-scheduling-checkpoint
title: "Greedy scheduling: checkpoint"
description: Find the schedule that earliest finish keeps on new inputs, and explain why no schedule keeps more. Each item combines the Greedy scheduling skills.
heading: Which schedule is kept?

questions:
  - id: sched-exam-retained-set
    heading: Which meetings stay?
    tags: [intervals, greedy, sorting]
    prompt: >-
      Touching meetings may both stay. The loop sorts by end and keeps each meeting that starts at
      or after the last kept end:
      `[[5, 8], [0, 4], [9, 11], [3, 5], [1, 2], [6, 9], [4, 6], [8, 10]]`. Which meetings does it
      keep, and how many are removed?
    options:
      - id: earliest-finish
        text: "`[1, 2]`, `[3, 5]`, `[5, 8]`, `[8, 10]`, so 4 are removed"
        explanation: >-
          In end order: keep `[1, 2]`, skip `[0, 4]`, keep `[3, 5]`, skip `[4, 6]`, keep `[5, 8]`,
          skip `[6, 9]`, keep `[8, 10]` (it touches 8), skip `[9, 11]`. Of 8, 4 go, and a brute
          force agrees that 4 is the most that can stay.
      - id: start-order
        text: "`[0, 4]`, `[4, 6]`, `[6, 9]`, `[9, 11]`, so 4 are removed"
        explanation: >-
          This schedule is also valid and also keeps 4, but it is what start order builds. In end
          order `[1, 2]` comes first and is kept, so `[0, 4]` is skipped.
      - id: strict
        text: "`[1, 2]`, `[3, 5]`, `[6, 9]`, so 5 are removed"
        explanation: >-
          That treats touching meetings as a clash. Touching is allowed here, so `[5, 8]` follows
          `[3, 5]` and `[8, 10]` follows `[5, 8]`.
      - id: skip-touch
        text: "`[1, 2]`, `[3, 5]`, `[5, 8]`, `[9, 11]`, so 4 are removed"
        explanation: >-
          Another valid schedule of 4, but not the loop's. `[8, 10]` ends at 10, before
          `[9, 11]`, and starts where `[5, 8]` ends, so it is kept, and `[9, 11]` then clashes.
    correct: earliest-finish
    followUps:
      start-order:
        prompt: Both `[0, 4]` and `[1, 2]` could start a schedule. Which does the loop read first, and why?
        options:
          - { id: one-two, text: "`[1, 2]`, since it ends at 2" }
          - { id: zero-four, text: "`[0, 4]`, since it starts at 0" }
          - { id: either, text: "Either, since both keep 4 in the end" }
        correct: one-two
        explanation: >-
          The loop reads in end order. Equal counts can come from several schedules, but the
          loop builds the one whose picks end soonest.
      strict:
        prompt: "`[3, 5]` is kept. What does `5 >= 5` give for `[5, 8]`?"
        options:
          - { id: kept, text: "True. `[5, 8]` is kept" }
          - { id: skipped, text: "False. `[5, 8]` is skipped" }
          - { id: depends, text: "It depends on the end of `[5, 8]`" }
        correct: kept
        explanation: >-
          When touching is allowed, the test is `>=`, and a meeting that starts at the kept end
          stays.
      skip-touch:
        prompt: After `[5, 8]` is kept, the loop reads `[6, 9]`, then `[8, 10]`, then `[9, 11]`. Which is kept?
        options:
          - { id: eight-ten, text: "`[8, 10]`. It starts at 8, the kept end" }
          - { id: nine-eleven, text: "`[9, 11]`. It is the first that starts after 8" }
          - { id: six-nine, text: "`[6, 9]`. It is read first" }
        correct: eight-ten
        explanation: >-
          `[6, 9]` starts before 8. `[8, 10]` touches the kept end and is read before `[9, 11]`,
          so it is kept, and `[9, 11]` then starts before 10.

  - id: sched-exam-trace-inclusive
    format: step-trace
    heading: Predict each step
    tags: [intervals, greedy, python]
    prompt: >-
      Each booking `[a, b]` holds a room on days `a` through `b`, both included. The board shows
      `days` after the sort. Predict each step before it is shown.
    code: |
      def most_bookings(days):
          days = sorted(days, key=lambda b: b[1])
          last, count = 0, 1
          for i in range(1, len(days)):
              if days[i][0] > days[last][1]:
                  last = i
                  count += 1
          return count

      most_bookings([[6, 8], [1, 2], [7, 9], [3, 5], [8, 10], [2, 4], [4, 7], [5, 6]])
    sequence:
      kind: array
      name: days
      cells: ['[1,2]', '[2,4]', '[3,5]', '[5,6]', '[4,7]', '[6,8]', '[7,9]', '[8,10]']
    start:
      - { name: last, at: 0 }
      - { name: i, at: 1 }
    steps:
      - line: 4
        ask: After the passes with `i` at 1 and 2, where is `last`?
        pointer: last
        correct: 2
        explanation: >-
          `[2, 4]` starts on day 2, which `[1, 2]` holds, so `2 > 2` is False. `[3, 5]` starts on
          day 3, and `3 > 2`, so `last` moves to 2.
        misses:
          - index: 1
            explanation: >-
              `[2, 4]` only touches `[1, 2]`, but both include day 2. The strict test `2 > 2` is
              False.
          - index: 0
            explanation: "`[3, 5]` starts on day 3, after day 2, so `3 > 2` holds and `last` moves."
        elsewhere: Among indices 1 and 2, only `[3, 5]` starts after day 2.
        also:
          - { name: i, at: 2 }
      - line: 4
        ask: After the passes with `i` at 3, 4 and 5, where is `last`?
        pointer: last
        correct: 5
        explanation: >-
          `[5, 6]` needs day 5, which `[3, 5]` holds, and `[4, 7]` starts on day 4. `[6, 8]`
          starts on day 6, after 5, so `last` moves to 5.
        misses:
          - index: 3
            explanation: >-
              `[5, 6]` ends soonest, but it starts on day 5, which `[3, 5]` still holds. `5 > 5`
              is False.
          - index: 4
            explanation: "`[4, 7]` starts on day 4, which `[3, 5]` holds, so it is skipped."
          - index: 2
            explanation: "`[6, 8]` starts on day 6, after day 5, so `6 > 5` holds and `last` moves."
        elsewhere: The kept booking holds day 5, and `[6, 8]` is the first to start after it.
        also:
          - { name: i, at: 5 }
      - line: 4
        ask: After the passes with `i` at 6 and 7, where is `last`?
        pointer: last
        correct: 5
        explanation: >-
          `[7, 9]` and `[8, 10]` start on days 7 and 8, which `[6, 8]` holds, so `last` stays.
        misses:
          - index: 6
            explanation: "`[7, 9]` starts on day 7, which `[6, 8]` holds, so it is skipped."
          - index: 7
            explanation: >-
              `[8, 10]` only touches `[6, 8]`, but both include day 8. `8 > 8` is False.
        elsewhere: Neither booking starts after day 8, so `last` does not move.
        also:
          - { name: i, at: 7 }
      - line: 8
        ask: What does the call return?
        options:
          - id: three
            text: '3'
            explanation: >-
              It keeps `[1, 2]`, `[3, 5]` and `[6, 8]`. A brute force over every choice of
              bookings agrees that 3 is the most with no shared day.
          - id: five
            text: '5'
            explanation: >-
              That is the count with `>=`, which lets touching bookings both stay. Here they
              share a day, so `[2, 4]`, `[5, 6]` and `[8, 10]` are skipped.
          - id: four
            text: '4'
            explanation: "`last` moved only twice after starting at 0, so `count` is 3."
          - id: two
            text: '2'
            explanation: "`count` starts at 1 for `[1, 2]` and grows at `[3, 5]` and `[6, 8]`, so it is 3."
        correct: three

  - id: sched-exam-stays-ahead
    heading: Can another schedule keep more?
    tags: [intervals, greedy]
    prompt: >-
      Touching intervals may both be kept. On some list, the earliest-finish loop keeps 3
      intervals, which end at 3, 6 and 10. Another valid schedule has 3 intervals that end at 4,
      8 and 11. Could the list hold a 4th interval to add after the other schedule's last one?
    options:
      - id: no-loop-would-keep
        text: No. It starts at 11 or later, so the loop would have kept a 4th
        explanation: >-
          A 4th interval for the other schedule starts at 11 or later, so it also ends after 10
          and is read after the loop's third pick, while the kept end is still 10. Then
          `s >= 10` holds and the loop would have kept a 4th, but it kept 3.
      - id: yes-room
        text: Yes. The other schedule ends later, so it has room the loop gave away
        explanation: >-
          A later end is less room, not more. Each of the loop's ends is at or before the
          matching end of the other schedule, so whatever follows that schedule follows the
          loop's too.
      - id: yes-between
        text: Yes, if that interval starts somewhere between 10 and 11
        explanation: >-
          To follow the other schedule it must start at 11 or later. A start between 10 and 11
          would overlap the interval that ends at 11.
      - id: only-disjoint
        text: Only if the two schedules share no intervals at all
        explanation: >-
          Shared intervals do not matter. The argument compares end times: the loop's third end,
          10, is no later than the other's, 11.
    correct: no-loop-would-keep
    followUps:
      yes-room:
        prompt: The loop's ends are 3, 6, 10 and the other's are 4, 8, 11. What does each pair show?
        options:
          - { id: ahead, text: "The loop's end is never later, so it never has less room" }
          - { id: behind, text: "The loop's end is always earlier, so it wasted time" }
          - { id: nothing, text: "Nothing, since the schedules hold different intervals" }
        correct: ahead
        explanation: >-
          After each pick, the loop's last end is at or before any other schedule's. That is
          why it can always take whatever the other schedule takes next.
      yes-between:
        prompt: An interval starts at 10.5. Can it follow the interval that ends at 11?
        options:
          - { id: no-overlap, text: "No. It starts before 11, so they overlap" }
          - { id: yes-after-ten, text: "Yes. It starts after 10" }
          - { id: yes-short, text: "Yes, if it is short enough" }
        correct: no-overlap
        explanation: >-
          Following an interval means starting at or after its end. Starting after the loop's
          end is easier than starting after the other schedule's.
      only-disjoint:
        prompt: What does the argument compare between the two schedules?
        options:
          - { id: ends, text: "The end of each schedule's k-th interval" }
          - { id: shared, text: "How many intervals they share" }
          - { id: lengths, text: "The total length of each schedule" }
        correct: ends
        explanation: >-
          The loop's k-th end is never later than another schedule's k-th end. Shared or not,
          that keeps the loop at least as large.

  - id: sched-exam-which-plan
    heading: Which plan removes the fewest?
    tags: [intervals, greedy, sorting]
    prompt: >-
      Remove as few intervals as possible so that the rest never overlap. Touching intervals,
      like `[1, 2]` and `[2, 3]`, may both stay. Each plan below reads the intervals once. Which
      plan always removes the fewest?
    options:
      - id: clash-keep-sooner
        text: Sort by start, and on a clash with the last one kept, keep whichever ends sooner
        explanation: >-
          On a clash one of the two has to go, and the one that ends sooner leaves room for
          everything the other does, and more. On `[[1, 10], [2, 3], [4, 5], [6, 7]]` it keeps
          `[2, 3]` over `[1, 10]`, then keeps `[4, 5]` and `[6, 7]`, so it removes 1, the fewest.
      - id: start-keep-first
        text: Sort by start, and keep each one that starts at or after the last kept end
        explanation: >-
          An early start says nothing about the end. On `[[1, 10], [2, 3], [4, 5], [6, 7]]` it
          keeps `[1, 10]` and removes the other three, though removing `[1, 10]` alone is enough.
      - id: shortest-first
        text: Sort by length, shortest first, and keep each one that overlaps nothing kept
        explanation: >-
          A short interval can still block a lot. On `[[1, 6], [5, 8], [7, 12]]` the shortest,
          `[5, 8]`, overlaps both others, so it removes 2, though removing `[5, 8]` alone is
          enough.
      - id: clash-keep-shorter
        text: Sort by start, and on a clash with the last one kept, keep whichever is shorter
        explanation: >-
          Shorter is not the same as ending sooner. On `[[1, 9], [3, 10], [9, 11]]` it keeps
          `[3, 10]` over `[1, 9]`, then keeps `[9, 11]` over `[3, 10]`, so it removes 2, though
          removing `[3, 10]` alone is enough.
    correct: clash-keep-sooner
    followUps:
      start-keep-first:
        prompt: "Sorted by start, `[[1, 10], [2, 3], [4, 5], [6, 7]]` begins with `[1, 10]`. How many does this plan keep, against the most that can stay?"
        options:
          - { id: one-three, text: 'It keeps 1, while 3 can stay' }
          - { id: three-three, text: 'It keeps 3, the most that can stay' }
          - { id: two-three, text: 'It keeps 2, while 3 can stay' }
        correct: one-three
        explanation: >-
          `[1, 10]` starts first but ends last, so every later interval starts before 10 and is
          skipped. Keeping the interval that ends sooner would have kept the three short ones.
      shortest-first:
        prompt: Which number of a kept interval decides what can come after it?
        options:
          - { id: end, text: 'Its end, since the next start must be at or after it' }
          - { id: length, text: 'Its length, since a short interval blocks less time' }
          - { id: start, text: 'Its start, since an early start leaves no gap' }
        correct: end
        explanation: >-
          What follows a kept interval depends on where it ends, not on how long it is. A short
          interval in the middle can overlap two longer ones that could both stay.
      clash-keep-shorter:
        prompt: "`[1, 9]` is kept and `[3, 10]` clashes with it. Which one leaves more room for `[9, 11]`?"
        options:
          - { id: ends-nine, text: "`[1, 9]`, since `[9, 11]` can start where it ends" }
          - { id: shorter, text: "`[3, 10]`, since it is shorter" }
          - { id: neither, text: "Neither, since both clash with `[9, 11]`" }
        correct: ends-nine
        explanation: >-
          What can follow a kept interval depends on its end, not its length. `[9, 11]` starts
          where `[1, 9]` ends but before `[3, 10]` ends.

  - id: sched-exam-debug-last-end
    heading: Which call does it fail on?
    tags: [intervals, greedy, python]
    prompt: |-
      A suggested solution should return the most intervals that can be kept with no two
      overlapping. Touching intervals may both be kept. `float('-inf')` is smaller than every
      number. One detail is slightly off:

      ```python
      def most_kept(spans):
          count, last_end = 0, float('-inf')
          for s, e in sorted(spans, key=lambda iv: iv[1]):
              if s >= last_end:
                  count += 1
              last_end = e
          return count
      ```

      Which call returns a wrong answer?
    options:
      - id: skip-then-fit
        text: "`most_kept([[1, 3], [2, 4], [3, 5]])`"
        explanation: >-
          `last_end = e` runs on every pass, not only after a keep. `[2, 4]` is skipped but still
          sets `last_end` to 4, so `[3, 5]` fails `3 >= 4` and the call returns 1. `[1, 3]` and
          `[3, 5]` touch, so 2 fit. Indenting `last_end = e` under the `if` fixes it.
      - id: skip-harmless
        text: "`most_kept([[1, 3], [2, 4], [5, 6]])`"
        explanation: >-
          The skipped `[2, 4]` sets `last_end` to 4, but `[5, 6]` starts at 5, after both 3 and
          4, so it is kept either way. It returns 2, which is right.
      - id: all-touch
        text: "`most_kept([[4, 6], [1, 2], [2, 4]])`"
        explanation: >-
          Sorted by end, the order is `[1, 2]`, `[2, 4]`, `[4, 6]`, and each starts where the last
          one ends. Every interval is kept, so `last_end` is only ever a kept end. It returns 3,
          which is right.
      - id: skip-last
        text: "`most_kept([[1, 5], [2, 3]])`"
        explanation: >-
          Sorted by end, `[2, 3]` is kept, and `[1, 5]` starts before 3 and is skipped. Nothing
          comes after it, so its end never reaches a test. It returns 1, which is right.
    correct: skip-then-fit
    followUps:
      skip-harmless:
        prompt: "After `[2, 4]` is skipped, `last_end` is 4 instead of 3. Does that change what happens to `[5, 6]`?"
        options:
          - { id: kept, text: 'No, 5 is at least 4 and at least 3' }
          - { id: skipped, text: 'Yes, `[5, 6]` is now skipped' }
          - { id: stops, text: 'Yes, the loop stops at the skipped interval' }
        correct: kept
        explanation: >-
          A wrong `last_end` only hurts when the next start falls between the real kept end and
          the skipped end. 5 is past both.
      all-touch:
        prompt: When does the line `last_end = e` run on an interval the loop does not keep?
        options:
          - { id: skip, text: 'On every skipped interval, since it sits outside the `if`' }
          - { id: never, text: 'Never, since it runs only after `count += 1`' }
          - { id: last, text: 'Only on the last interval' }
        correct: skip
        explanation: >-
          The line is indented under the `for`, not the `if`. Here no interval is skipped, so it
          only ever records a kept end, and the answer comes out right.
      skip-last:
        prompt: "`[1, 5]` is skipped and sets `last_end` to 5. Which interval reads that value?"
        options:
          - { id: none, text: 'None, since `[1, 5]` is the last one read' }
          - { id: first, text: '`[2, 3]`, which is then skipped' }
          - { id: itself, text: '`[1, 5]`, which is then kept' }
        correct: none
        explanation: >-
          A wrong `last_end` matters only to the intervals read after it. The skipped interval is
          last here, so the count is still right.

  - id: sched-exam-second-swap-end
    heading: What does the second swap need?
    tags: [intervals, greedy]
    prompt: >-
      Touching intervals may both be kept. The earliest-finish loop sorts a list by end and keeps
      each interval that starts at or after the last kept end. On some list it keeps `[1, 5]`
      first, and its second pick is an interval X. A best schedule is `[0, 6]`, `[7, 11]`,
      `[11, 13]`. A proof turns it into the loop's schedule one swap at a time. The first swap
      gives `[1, 5]`, `[7, 11]`, `[11, 13]`. The second puts X in for `[7, 11]`. X starts at or
      after 5, since the loop kept it after `[1, 5]`, so the swap needs only that X ends at or
      before 11, where `[11, 13]` starts. Without seeing the rest of the list, what guarantees
      that?
    options:
      - id: rival
        text: "`[7, 11]` also starts at or after 5, and X ends first among the intervals that do"
        explanation: >-
          The loop reads in end order and keeps the first interval that starts at or after 5, so
          X ends first among all such intervals. `[7, 11]` starts at 7, so it is one of them, and
          X ends no later than it, at 11 or before. So `[1, 5]`, X, `[11, 13]` is valid.
      - id: whole-list
        text: "X has the second earliest end in the whole list, after `[1, 5]`"
        explanation: >-
          Only the first pick is the earliest end in the whole list. `[0, 6]` ends at 6, but it
          starts before 5, so the loop skips it. The second pick ends first only among the
          intervals that start at or after 5.
      - id: starts-sooner
        text: "X starts no later than `[7, 11]`, so it also ends no later"
        explanation: >-
          Where X starts says nothing about where it ends, and X need not start before 7. On
          `[[0, 6], [1, 5], [8, 9], [7, 11], [11, 13]]` the loop's second pick is `[8, 9]`.
      - id: best-ends-first
        text: "`[7, 11]` is in a best schedule, so nothing that fits after `[1, 5]` ends sooner"
        explanation: >-
          A best schedule only keeps the most intervals. Its first, `[0, 6]`, ends after
          `[1, 5]`, and on `[[0, 6], [1, 5], [1, 7], [5, 10], [7, 11], [11, 13]]` the loop's
          second pick, `[5, 10]`, ends before `[7, 11]`.
    correct: rival
    followUps:
      whole-list:
        prompt: "`[0, 6]` ends at 6. Can the loop keep it second, after `[1, 5]`?"
        options:
          - { id: clashes, text: "No. It starts at 0, before `[1, 5]` ends" }
          - { id: ends-early, text: "Yes. It ends at 6, before `[7, 11]` does" }
          - { id: in-best, text: "Yes. It is in a best schedule" }
        correct: clashes
        explanation: >-
          The second pick is the earliest end among the intervals that start at or after 5, the
          first pick's end. `[0, 6]` is not one of them, however soon it ends.
      starts-sooner:
        prompt: "`[5, 14]` starts before `[7, 11]`. Does it end at or before 11?"
        options:
          - { id: no-fourteen, text: "No. It ends at 14" }
          - { id: yes-start, text: "Yes. A sooner start means a sooner end" }
          - { id: if-kept, text: "Only if the loop keeps it" }
        correct: no-fourteen
        explanation: >-
          A start says nothing about an end. X ends by 11 because `[7, 11]` is one of the
          intervals the loop could have picked second, not because of where X starts.
      best-ends-first:
        prompt: "The best schedule starts with `[0, 6]`, though `[1, 5]` ends at 5. Does a best schedule always hold the earliest ends?"
        options:
          - { id: no-count, text: "No. It only has to keep the most intervals" }
          - { id: yes-best, text: "Yes. Otherwise it would not be best" }
          - { id: from-second, text: "Only from its second interval on" }
        correct: no-count
        explanation: >-
          Several schedules can tie for the most. The swaps are needed because a best schedule can
          hold later ends than the loop's picks.
