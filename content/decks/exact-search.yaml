id: exact-search
title: Exact search
description: Discard the half a probe rules out, drop the probed index, and tell one candidate from none. Each card asks for one decision, with a worked example on hand.
heading: What happens next?

questions:
  - id: which-half-remains
    heading: Which cells are left?
    tags: [binary-search]
    workedExample: |-
      Binary search looks for the index of a target value in a sorted list, or shows the list
      does not hold it. Sorted means values only grow from left to right. A probe reads one cell
      and compares its value with the target. Here the target is `17`, and indices count from 0:

      ```
      index  0  1  2   3   4   5   6
      a      2  6  9  13  17  21  30
      ```

      1. The first probe reads the middle cell, `a[3] = 13`. 13 is smaller than 17, so index 3
         does not hold 17.
      2. Since the list is sorted, every cell left of index 3 holds a value smaller than 13, so
         smaller than 17 too. None of indices 0 to 3 can hold 17.
      3. So only indices 4 to 6 can still hold 17. One probe ruled out four cells, and the next
         probe looks in the cells that are left.
    prompt: |-
      Binary search looks for a target in a sorted list. Each probe reads one cell and compares
      it with the target. Here `a = [3, 7, 11, 18, 24, 29, 35]` and the target is 11. The first
      probe reads `a[3] = 18`. Which indices can still hold 11?
    options:
      - id: left
        text: Indices 0 to 2
        explanation: >-
          18 is too big. The list is sorted, so 24, 29 and 35 are bigger still, and none of
          indices 3 to 6 can be 11. Only the cells left of the probe stay in play.
      - id: right
        text: Indices 4 to 6
        explanation: >-
          Those cells hold 24, 29 and 35, all larger than the 18 that already overshot. A probe
          that is too big sends the search toward the smaller values.
      - id: all-but-probe
        text: Every index except 3
        explanation: >-
          That rules out only the cell that was compared. In a sorted list one comparison also
          settles every cell right of the probe, since each holds an even larger value.
      - id: keep-probe
        text: Indices 0 to 3
        explanation: >-
          Index 3 holds 18, and the probe has just compared it with 11. It is not a match, so it
          can't stay a candidate.
    correct: left
    followUps:
      right:
        prompt: 18 is too big for a target of 11. In this sorted list, where are the values smaller than 18?
        options:
          - id: left-side
            text: Left of index 3
          - id: right-side
            text: Right of index 3
          - id: anywhere
            text: Anywhere, the probe can't tell
        correct: left-side
        explanation: >-
          Sorted ascending means values only grow to the right. So a probe that overshoots
          points the search left, toward the smaller values.
      all-but-probe:
        prompt: The probe read `a[3] = 18` and the target is 11. Which cells does that one comparison rule out?
        options:
          - id: probe-and-right
            text: Index 3 and every index after it
          - id: probe-only
            text: Only index 3
          - id: none-yet
            text: None, each cell needs its own comparison
        correct: probe-and-right
        explanation: >-
          Every cell right of the probe holds at least 18, so it can't hold 11 either. That is how
          one comparison discards about half the list.
      keep-probe:
        prompt: The probe compared `a[3] = 18` with the target 11. Can index 3 still hold 11?
        options:
          - id: no
            text: No, it holds 18, which was just checked
          - id: yes-mid
            text: Yes, the range always keeps the probed cell
          - id: yes-end
            text: Yes, until the loop ends
        correct: no
        explanation: >-
          A probe that misses has settled its own cell. Keeping it in the range only means
          comparing the same 18 again.

  - id: order-makes-discard-safe
    heading: Can the search still find it?
    tags: [binary-search]
    workedExample: |-
      Consider the sorted list `a = [2, 5, 9, 14, 20]` and target `5`. Sorted means values only
      grow from left to right, and that promise is what lets one probe rule out a whole side.

      1. A probe reads `a[2] = 9`. 9 is larger than 5, so index 2 does not hold 5.
      2. Since the list is sorted, `a[3]` and `a[4]` hold values larger than 9, so larger than 5
         too. The search can drop indices 2 to 4 without reading them.
      3. So the 5, at index 1, is still among the cells left. Dropping the right side was safe
         only because the order promised what those cells hold.
    prompt: |-
      The list `a = [6, 2, 8, 1, 4]` is not sorted, and the target is 1. A probe reads
      `a[2] = 8`, which is larger than 1, and the search drops the cells it would drop on a
      sorted list. What happens to the 1?
    options:
      - id: lost
        text: It is dropped, so no later probe can reach it
        explanation: >-
          The 1 sits at index 3, right of the probe, so it goes with the dropped cells. On a
          sorted list every cell right of 8 would hold more than 8. This list breaks that
          promise, and the search loses its target.
      - id: found-later
        text: A later probe still finds it at index 3
        explanation: >-
          No probe reads a cell after it has been dropped. The 1 sits at index 3, which went with
          the right side.
      - id: noticed
        text: The search sees the list is unsorted and stops
        explanation: >-
          Nothing in the search compares neighbors. A probe compares one value with the target,
          so the right side is dropped the same way on any list.
      - id: kept
        text: It stays, since 1 is smaller than 8
        explanation: >-
          The search drops cells by position, not by value. Index 3 is right of the probe, so the
          1 goes with it, whatever it holds.
    correct: lost
    followUps:
      found-later:
        prompt: The search has dropped index 2 and everything right of it. Which cells can a later probe read?
        options:
          - id: left-cells
            text: Only indices 0 and 1
          - id: every
            text: Every index, one at a time
          - id: target-cell
            text: Index 3 too, since it holds the target
        correct: left-cells
        explanation: >-
          A probe reads only cells still in the range. Once a cell is dropped it is never read
          again, so a target among the dropped cells is lost for good.
      noticed:
        prompt: Which step of the search would notice that `[6, 2, 8, 1, 4]` is out of order?
        options:
          - id: none
            text: None, each probe only compares one cell with the target
          - id: probe
            text: The probe, since 8 is out of place
          - id: drop
            text: The drop, since it reads the cells it throws away
        correct: none
        explanation: >-
          A probe compares one cell with the target, and a drop throws cells away unread. Sorted
          order is a promise the caller makes, and the search never checks it.
      kept:
        prompt: Does the search read `a[3]` before it drops index 3?
        options:
          - id: unread
            text: No, it drops the whole side unread
          - id: reads
            text: Yes, it checks each value before dropping it
          - id: unsorted-only
            text: Only when the list is unsorted
        correct: unread
        explanation: >-
          One probe settles a whole side without reading it. On a sorted list that is safe,
          because position says what a cell holds. Here it throws away the 1.

  - id: tap-next-probe
    format: tap-cell
    heading: Tap the next probe
    tags: [binary-search]
    workedExample: |-
      Consider a search range with `lo = 2` and `hi = 5`. The next probe is `mid = (lo + hi) // 2`,
      and `//` divides and rounds down.

      1. `lo + hi` is `2 + 5 = 7`.
      2. `7 / 2` is 3.5, and `//` rounds it down, so `7 // 2` is 3. The probe reads index 3.
      3. Indices 2 to 5 have two middle cells, 3 and 4. Since `//` rounds down, the probe takes the
         lower one, index 3.
    prompt: >-
      The search below has read `a[3] = 15`, too small for 33, so indices 0 to 3 are gone. Two
      bounds hold what is left: every index from `lo = 4` to `hi = 7`, both ends included, is
      still a candidate. The next probe is `mid = (lo + hi) // 2`, and `//` divides and rounds
      down. Tap the cell the second probe reads.
    code: |
      a = [4, 9, 12, 15, 21, 26, 33, 40]
      t = 33
      # first probe: mid = 3, a[3] = 15 < 33
      lo, hi = 4, 7
      mid = (lo + hi) // 2
    sequence:
      kind: array
      name: a
      cells: [4, 9, 12, 15, 21, 26, 33, 40]
    markers:
      - { name: lo, at: 4 }
      - { name: hi, at: 7 }
    correct: 5
    explanation: >-
      `(4 + 7) // 2` is 11 // 2, which is 5. The probe reads 26, too small again, so the next
      range is indices 6 to 7.
    misses:
      - index: 0
        explanation: Index 0 was dropped by the first probe. 15 was too small, so 4 is smaller still.
      - index: 1
        explanation: >-
          `(7 - 4) // 2` is 1, but that is a distance from `lo`, not an index. Add it to `lo` and
          the probe is index 5.
      - index: 2
        explanation: Index 2 was dropped by the first probe, along with everything else left of 15.
      - index: 3
        explanation: Index 3 is the first probe. It has been compared, and the range now starts at 4.
      - index: 4
        explanation: That is `lo`, the left end of the range. The probe goes to the middle of 4 to 7.
      - index: 6
        explanation: >-
          33 sits here, but the loop can't see that yet. It probes the middle, and `//` rounds
          5.5 down to 5, not up to 6.
      - index: 7
        explanation: That is `hi`, the right end of the range. The probe goes to the middle of 4 to 7.

  - id: drop-the-probe
    format: drag-pointers
    heading: Place the bounds
    tags: [binary-search]
    workedExample: |-
      Consider `a = [3, 6, 10]` and target `3`, with `lo, hi = 0, 2`. The bounds are inclusive, so
      every index from `lo` to `hi` is still a candidate.

      1. The probe is `mid = (0 + 2) // 2 = 1`, which reads `a[1] = 6`. 6 is larger than 3, so index
         1 is not the target, and neither is index 2, which holds an even larger 10.
      2. Index 1 has been checked and missed, so it must leave the range. `hi = mid - 1` sets
         `hi = 0`, not 1.
      3. A probe that is too big rules out nothing on the left, so `lo` stays on 0. The range is now
         index 0 alone, which holds the 3.
    prompt: >-
      The search below runs its first pass with `mid = 3`. Drag `lo` and `hi` to where they sit
      when that pass ends.
    code: |
      a = [1, 5, 8, 12, 14, 19, 25, 31]
      t = 19
      lo, hi = 0, len(a) - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          if a[mid] == t:
              break
          if a[mid] < t:
              lo = mid + 1
          else:
              hi = mid - 1
    sequence:
      kind: array
      name: a
      cells: [1, 5, 8, 12, 14, 19, 25, 31]
    markers:
      - { name: mid, at: 3 }
    pointers:
      - name: lo
        start: 0
        correct: 4
        explanation: >-
          12 is below 19, so index 3 and everything left of it are out. `lo = mid + 1` puts `lo`
          on index 4, the first cell that could still hold 19.
        misses:
          - index: 3
            explanation: >-
              That is `lo = mid`. Index 3 holds 12, which was just compared with 19, so it can't
              stay in the range.
          - index: 5
            explanation: >-
              19 does sit at index 5, but the loop hasn't seen it. One pass drops only the cells
              the probe ruled out.
        elsewhere: A probe of 12 rules out index 3 and every cell before it, so `lo` moves to 3 + 1 = 4.
      - name: hi
        start: 7
        correct: 7
        explanation: '`hi` stays on 31. A probe that is too small says nothing against the right end.'
        misses:
          - index: 2
            explanation: >-
              That is `hi = mid - 1`, the update for a probe that is too big. 12 is below 19, so
              the right side is where 19 must be.
          - index: 6
            explanation: A too-small probe moves only `lo`. `hi` keeps its place on index 7.
        elsewhere: The probe was too small, so this pass leaves `hi` on index 7.

  - id: update-after-high-probe
    heading: Which update is right?
    tags: [binary-search]
    workedExample: |-
      Consider `a = [2, 9, 16, 21, 30]` and target `21`, with inclusive bounds `lo = 0` and
      `hi = 4`. Sorted means values only grow from left to right.

      1. The probe is `mid = (0 + 4) // 2 = 2`, which reads `a[2] = 16`. 16 is smaller than 21, so
         index 2 is not the target.
      2. The list is sorted, so 2 and 9, left of the probe, are smaller still. So indices 0 to 2 are
         all ruled out.
      3. So `lo = mid + 1 = 3`, the first cell that could still hold 21, and `hi` stays on 4. The
         range is indices 3 to 4.
    prompt: |-
      `a = [6, 10, 13, 17, 22]`, the target is 10, and the inclusive bounds are `lo = 0` and
      `hi = 4`. The probe reads `a[mid] = 13` at `mid = 2`, too big. Which update keeps every cell
      that could hold 10 and drops every cell the probe ruled out?
    options:
      - id: mid-minus-one
        text: "`hi = mid - 1`"
        explanation: >-
          13 overshoots, so index 2 and everything after it are out. `hi` becomes 1, and the
          range is indices 0 to 1, which holds the 10.
      - id: mid
        text: "`hi = mid`"
        explanation: >-
          That keeps index 2 in the range. It holds 13, which has already been compared with 10.
      - id: minus-one
        text: "`hi -= 1`"
        explanation: >-
          That drops only index 4 and keeps 13 and 17, which the probe already ruled out. The
          search still works, but one cell per probe makes it a linear scan.
      - id: lo-up
        text: "`lo = mid + 1`"
        explanation: >-
          That keeps 17 and 22 and drops 6 and 10. A probe that is too big rules out the right
          side, not the left.
    correct: mid-minus-one
    followUps:
      mid:
        prompt: The probe compared `a[2] = 13` with the target 10. Is index 2 still a candidate?
        options:
          - id: no
            text: No, 13 isn't 10, so index 2 is settled
          - id: yes
            text: Yes, `mid` stays in the range until the loop ends
          - id: maybe
            text: Only if the list has duplicates
        correct: no
        explanation: >-
          With inclusive bounds every cell from `lo` to `hi` is still a candidate. A cell that has
          been compared and missed must leave, which is what the `- 1` does.
      minus-one:
        prompt: The probe read 13, larger than 10. Which cells does that rule out?
        options:
          - id: two-to-four
            text: Index 2 and every index after it
          - id: four
            text: Only index 4, the current `hi`
          - id: two
            text: Only index 2, the probe
        correct: two-to-four
        explanation: >-
          Every cell from the probe rightward holds at least 13. Dropping all of them at once is
          what makes each probe halve the range.
      lo-up:
        prompt: 13 is larger than the target 10. In a sorted list, which side of index 2 could hold 10?
        options:
          - id: left
            text: The left side, where the values are smaller
          - id: right
            text: The right side, past the probe
          - id: both
            text: Either side
        correct: left
        explanation: >-
          A probe that overshoots means the target, if present, is smaller. So `hi` moves down
          and `lo` stays where it is.

  - id: equal-bounds-one-cell
    heading: How many cells are left?
    tags: [binary-search]
    workedExample: |-
      Consider a search with inclusive bounds `lo = 2` and `hi = 4`. Inclusive means the range runs
      from `lo` to `hi` with both ends included, and every cell in it is still a candidate.

      1. Both ends are included, so index 2 (`lo`) and index 4 (`hi`) are in the range.
      2. Every index between the ends is in the range too, so index 3 is in it as well.
      3. So the range holds `hi - lo + 1 = 4 - 2 + 1 = 3` cells: indices 2, 3 and 4.
    prompt: |-
      A search for 38 in `a = [4, 10, 15, 23, 31, 38]` has run two passes, and now `lo = 5` and
      `hi = 5`. The bounds are inclusive: every index from `lo` to `hi`, both ends included, is
      still a candidate. How many cells are still candidates?
    options:
      - id: one
        text: One, index 5
        explanation: >-
          The range runs from index 5 to index 5, so it holds `hi - lo + 1 = 1` cell. Index 5 has
          not been compared yet.
      - id: none
        text: None, the bounds have met
        explanation: >-
          Both ends are included, and here they are the same index. So index 5 is still in the
          range, and it has not been compared yet.
      - id: two
        text: Two, the cell at `lo` and the cell at `hi`
        explanation: >-
          `lo` and `hi` both sit on index 5. Two bounds on one cell still make a range of one
          index.
    correct: one
    followUps:
      none:
        prompt: With inclusive bounds, which pair leaves no cell to check?
        options:
          - id: passed
            text: "`lo = 6` and `hi = 5`"
          - id: met
            text: "`lo = 5` and `hi = 5`"
          - id: adjacent
            text: "`lo = 4` and `hi = 5`"
        correct: passed
        explanation: >-
          An inclusive range holds `hi - lo + 1` cells. Equal bounds give 1, and the count reaches
          0 only once `lo` passes `hi`.
      two:
        prompt: "`lo` and `hi` both sit on index 5. How many different indices do they name?"
        options:
          - id: same
            text: One, since both name index 5
          - id: each
            text: Two, one for each bound
          - id: edges
            text: None, bounds mark the edges between cells
        correct: same
        explanation: >-
          Two names can point at the same cell. The range counts the indices from `lo` to `hi`,
          so equal bounds hold exactly one.

  - id: one-candidate-left
    heading: What should the loop do?
    tags: [binary-search]
    workedExample: |-
      Consider `a = [2, 7, 11, 16, 23]` and target `9`. Two passes leave `lo = 1` and `hi = 1`, so
      index 1, which holds `7`, is the one candidate left. The loop runs while `lo <= hi`.

      1. `1 <= 1` is true, so the loop runs another pass. It probes `mid = (1 + 1) // 2 = 1` and
         reads `a[1] = 7`.
      2. 7 is not 9, so the comparison shows the target is not at index 1. Since 7 is smaller
         than 9, `lo = mid + 1 = 2`.
      3. Now `lo = 2` has passed `hi = 1`, so no candidate is left, and the call returns -1.
         Returning 1 without that comparison would have been wrong.
    prompt: |-
      The `search` below runs on `a = [5, 8, 14, 20, 27, 31]` with target 20. After two passes
      `lo = 3` and `hi = 3`, so index 3 is the one candidate left. What should happen next?

      ```python
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1
      ```
    options:
      - id: run-again
        text: Run once more, since index 3 has not been compared yet
        explanation: >-
          `3 <= 3` holds, so the loop runs a pass. It probes `mid = 3`, reads 20 and returns 3.
          The comparison is what shows the target is there.
      - id: stop-met
        text: Stop and return `-1`, since the bounds have met
        explanation: >-
          The loop runs while `lo <= hi`, and equal bounds pass that test. Stopping here would
          skip index 3, which holds the target 20.
      - id: return-three
        text: Return 3 without comparing, since the last candidate must be the target
        explanation: >-
          The last candidate is only where the target would be. It still has to be compared to
          know whether it is there.
    correct: run-again
    followUps:
      stop-met:
        prompt: The loop runs while `lo <= hi`. With `lo = 3` and `hi = 3`, does it run another pass?
        options:
          - id: yes
            text: Yes, `3 <= 3` is true
          - id: no
            text: No, equal bounds end the loop
          - id: only-if
            text: Only if `a[3]` is the target
        correct: yes
        explanation: >-
          `<=` is true when the bounds are equal, so a one-cell range still gets its pass. Short
          of a match, the loop ends only once `lo` passes `hi`.
      return-three:
        prompt: >-
          With target 21 instead, the same list narrows to `lo = hi = 3` too, and `a[3]` is 20.
          Should the search return 3?
        options:
          - id: compare
            text: No, 20 isn't 21, so it must compare and then return `-1`
          - id: yes-last
            text: Yes, the last candidate is always the answer
          - id: yes-close
            text: Yes, 20 is the closest value to 21
        correct: compare
        explanation: >-
          Narrowing the range finds where the target would be, not whether it is there. Only the
          comparison tells a present target from a missing one.

  - id: bounds-cross
    format: drag-pointers
    heading: Place the bounds
    tags: [binary-search]
    workedExample: |-
      Consider `a = [4, 9, 15, 20]` and target `12`, with inclusive bounds `lo, hi = 0, 3`. The loop
      runs while `lo <= hi`, and every index from `lo` to `hi` is still a candidate.

      1. The probe is `mid = (0 + 3) // 2 = 1`, which reads `a[1] = 9`. 9 is smaller than 12, so
         `lo = mid + 1 = 2`, and `hi` stays on 3.
      2. Now the range is indices 2 to 3. The probe is `mid = (2 + 3) // 2 = 2`, which reads
         `a[2] = 15`. 15 is larger than 12, so `hi = mid - 1 = 1`, and `lo` stays on 2.
      3. Now `hi = 1` sits left of `lo = 2`, so no cell is left. `2 <= 1` is false, so the loop ends
         and the call returns -1. 12 would fall between 9 and 15, and the list does not hold it.
    prompt: >-
      Below,
      one pass has run and the range is indices 3 to 4. The second pass probes `mid = 3`. Drag
      `lo` and `hi` to where they sit when that pass ends.
    code: |
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1

      search([6, 13, 18, 25, 31], 21)
    sequence:
      kind: array
      name: a
      cells: [6, 13, 18, 25, 31]
    pointers:
      - name: lo
        start: 3
        correct: 3
        explanation: '`lo` stays on index 3. Only a probe that is too small moves `lo`, and 25 is too big.'
        misses:
          - index: 4
            explanation: '`lo` moves only after a probe that is too small. 25 is larger than 21.'
        elsewhere: The probe was too big, so this pass leaves `lo` on index 3.
      - name: hi
        start: 4
        correct: 2
        explanation: >-
          25 is too big, so `hi = mid - 1 = 2`. Now `hi` sits left of `lo`, so no cell is left.
          `while lo <= hi` fails and the call returns -1. 21 would fall between 18 and 25.
        misses:
          - index: 3
            explanation: >-
              That keeps index 3, the 25 that was just ruled out. `hi` may pass `lo`: an empty
              range is how the loop learns the target is absent.
          - index: 4
            explanation: 25 is larger than 21, so a probe this big must move `hi` below `mid`.
        elsewhere: '`hi` moves to `mid - 1`, which is 2, one cell left of `lo`.'
