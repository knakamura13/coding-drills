id: window-limits-checkpoint
title: "Window limits: checkpoint"
description: Explain a subarray a sum window loses on signed values, find the input that breaks it, and pick a method that fits the task. Most items combine the Window limits skills.
heading: Which one is right?

questions:
  - id: limit-exam-lost-shortest
    heading: What does it return?
    tags: [sliding-window, python]
    prompt: |-
      ```python
      def shortest(nums, T):
          best = None
          total = left = 0
          for right in range(len(nums)):
              total += nums[right]
              while total >= T:
                  size = right - left + 1
                  if best is None or size < best:
                      best = size
                  total -= nums[left]
                  left += 1
          return best

      shortest([3, 3, -6, 3, 8], 10)
      ```

      What does the call return, and which valid subarray does it never check?
    options:
      - id: right
        text: 5, and it never checks `3, 8`, which totals 11
        explanation: >-
          The total first reaches 10 when the 8 arrives: 11 for the whole list, so the loop
          records 5. Without the first 3 the total is 8, under 10, and the -6 is never removed.
          `3, 8` at the end is valid but never examined.
      - id: finds-it
        text: 2, since the loop reaches `3, 8` on the last pass
        explanation: Where is `left` when the loop stops on the last pass?
      - id: one-more
        text: 4, since the loop records the window after the first 3 leaves
        explanation: After the first 3 leaves, is the total still at least 10?
      - id: wrong-subarray
        text: 5, and it never checks `3, -6, 3, 8`, which totals 8
        explanation: Does that subarray reach `T`?
    correct: right
    followUps:
      finds-it:
        prompt: >-
          On the last pass the loop records 5 and drops the first 3. The window is
          `3, -6, 3, 8`. What is its total, and does the loop run again?
        options:
          - { id: stops, text: '8, so the loop stops with the -6 still inside' }
          - { id: runs, text: '11, so the loop keeps dropping until `3, 8` is left' }
          - { id: zero, text: '2, so the loop stops at once' }
        correct: stops
        explanation: >-
          3 - 6 + 3 + 8 is 8, below 10. The -6 drags the total down, so the loop never drops it,
          and the subarray `3, 8` that starts after it is never recorded.
      one-more:
        prompt: The loop records a size only while the total is at least `T`. Is `3, -6, 3, 8` ever recorded?
        options:
          - { id: no, text: 'No, it totals 8, below 10' }
          - { id: yes, text: 'Yes, it is recorded before the loop checks the total' }
          - { id: last, text: 'Yes, the loop always records one last window' }
        correct: no
        explanation: >-
          The loop condition is checked before each record. A window that totals 8 never reaches
          the record line when `T` is 10.
      wrong-subarray:
        prompt: Which of these subarrays totals at least 10?
        options:
          - { id: end, text: '`3, 8`, which totals 11' }
          - { id: middle, text: '`3, -6, 3, 8`, which totals 8' }
          - { id: start, text: '`3, 3`, which totals 6' }
        correct: end
        explanation: >-
          A missed subarray has to be valid to matter. `3, 8` is valid and shorter than the 5 the
          template returns.

  - id: limit-exam-tap-lost-longest
    format: tap-cell
    heading: Tap where the longest subarray starts
    tags: [sliding-window]
    prompt: >-
      The longest-subarray template returns 3 on this list with `S = 9`. Tap the first cell of
      the longest subarray whose total is at most 9.
    code: |
      def longest(nums, S):
          best = total = left = 0
          for right in range(len(nums)):
              total += nums[right]
              while total > S:
                  total -= nums[left]
                  left += 1
              best = max(best, right - left + 1)
          return best

      longest([5, 3, 2, 7, 1, -6], 9)   # returns 3
    sequence: { kind: array, name: nums, cells: [5, 3, 2, 7, 1, -6] }
    correct: 1
    explanation: >-
      `3, 2, 7, 1, -6` totals 7, so 5 values fit. The template dropped the 3 when the 7 came in
      (total 12) and the 2 when the 1 came in (total 10). The -6 that would have offset them
      arrived after both had gone.
    misses:
      - index: 0
        explanation: >-
          The whole list totals 12, over 9, and `5, 3, 2, 7, 1` totals 18. No subarray that
          starts here and holds 5 or more values fits.
      - index: 2
        explanation: >-
          `2, 7, 1, -6` totals 4 and fits, but it has only 4 values. A subarray one value longer
          also fits.
      - index: 3
        explanation: >-
          The template's last window starts here, `7, 1, -6`, 3 values. A longer subarray starts
          further left.
      - index: 4
        explanation: Only 2 values start here. A subarray of 5 values fits further left.
      - index: 5
        explanation: Only 1 value starts here. A subarray of 5 values fits further left.

  - id: limit-exam-signed-exists
    heading: Which method fits?
    tags: [sliding-window, prefix-sum, hash-map]
    prompt: >-
      An elevator logs the floor change of each of `n` trips: `+3` for three floors up, `-2` for
      two down. You need to know whether some subarray of the log, trips one after another, nets
      exactly `k` floors. Which method answers in O(n) time on average?
    options:
      - id: right
        text: Walk once with a set of the prefix sums so far, starting with 0, and look up `p - k`
        explanation: >-
          A subarray that ends at this trip nets `k` exactly when an earlier prefix sum equals
          `p - k`. The 0 is the empty prefix, so a subarray from the first trip counts. Each
          lookup is O(1) on average, and trips down cause no trouble.
      - id: window
        text: Grow a window trip by trip, and drop its first trip while its net change is above `k`
        explanation: Can dropping a trip from the front raise the net change here?
      - id: every-start
        text: Add up the subarrays from each start trip, and stop at the first one that nets `k`
        explanation: How many sums does that add up when no subarray nets `k`?
      - id: largest
        text: Track the largest net change of a subarray ending at each trip, and compare it with `k`
        explanation: Does a subarray that nets exactly `k` have to be the largest one ending there?
    correct: right
    followUps:
      window:
        prompt: With `k = 2`, the first trip, `+5`, already nets more than 2, so it is dropped. Then come `-4`, `+3` and `-2`. What is lost?
        options:
          - { id: lost, text: '`+5, -4, +3, -2`, which nets 2, since the `+5` has gone' }
          - { id: none, text: 'Nothing, since no subarray of this log nets 2' }
          - { id: fine, text: 'Nothing, since the window can take the `+5` back' }
        correct: lost
        explanation: >-
          With trips down still to come, a window that is too high now can come back to `k`
          later. The drop throws the `+5` away for good, so the one subarray that nets 2 is lost.
      every-start:
        prompt: No subarray of the `n` trips nets `k`. How many sums does adding up the subarrays from each start take?
        options:
          - { id: quadratic, text: '`n * (n + 1) / 2`, which is O(n²)' }
          - { id: linear, text: '`n`, one for each start' }
          - { id: halving, text: 'About log n, since each start stops early' }
        correct: quadratic
        explanation: >-
          With no early stop, the start at the first trip adds `n` sums, the next `n - 1`, and so
          on down to 1. That total grows with the square of `n`, past the O(n) the task asks
          for.
      largest:
        prompt: On the log `+3, +1` with `k = 1`, the largest subarray ending at the second trip nets 4. Is a subarray that nets 1 missed?
        options:
          - { id: missed, text: 'Yes, `+1` alone nets 1 but is not the largest' }
          - { id: none, text: 'No, no subarray of this log nets 1' }
          - { id: found, text: 'No, the check at the first trip finds it' }
        correct: missed
        explanation: >-
          The largest subarray ending at a trip is only one of those ending there. One that nets
          exactly `k` can be smaller, so this check misses it even when no trip goes down.

  - id: limit-exam-nonneg-longest
    heading: Which method fits?
    tags: [sliding-window, two-pointers]
    prompt: >-
      A list of `n` daily screen-time readings, in minutes, is never negative. You need the
      longest subarray, days in a row, whose total is at most `S`. Which method gives the right
      length in O(n) time and O(1) extra space?
    options:
      - id: right
        text: Grow a window on the right and drop from the left while its total exceeds `S`
        explanation: >-
          With no negative value, dropping from the left never raises the total, so once the
          window fits, no longer subarray ending here fits either. Each index enters and leaves
          once, and the window needs only a total and two indices.
      - id: dict
        text: Count earlier prefix sums equal to `p - S` in a dictionary
        explanation: Does that lookup find a subarray whose total is below `S`?
      - id: sort
        text: Sort the readings and take the smallest until the total exceeds `S`
        explanation: Are the smallest readings consecutive days?
      - id: every
        text: Try every start, and extend each subarray until its total exceeds `S`
        explanation: How many steps can that take when every reading is 0?
    correct: right
    followUps:
      dict:
        prompt: An earlier prefix sum equal to `p - S` marks a subarray with which total?
        options:
          - { id: exact, text: 'Exactly `S`' }
          - { id: atmost, text: 'At most `S`' }
          - { id: atleast, text: 'At least `S`' }
        correct: exact
        explanation: >-
          A dictionary lookup matches one value, so it finds only subarrays totaling exactly `S`
          and misses those below it. The task allows any total up to `S`, and the dictionary
          also costs O(n) extra space.
      sort:
        prompt: What does sorting the readings lose?
        options:
          - { id: order, text: 'Which days are next to each other' }
          - { id: totals, text: 'The total of the whole list' }
          - { id: nothing, text: 'Nothing, since the readings are not negative' }
        correct: order
        explanation: >-
          A subarray is made of neighboring days. The smallest readings can come from days far
          apart.
      every:
        prompt: With every reading 0 and any `S`, how far does each start extend?
        options:
          - { id: end, text: 'To the end of the list, so the total work is O(n²)' }
          - { id: one, text: 'One day, so the total work is O(n)' }
          - { id: none, text: 'Nowhere, since 0 never exceeds `S`' }
        correct: end
        explanation: >-
          The total never exceeds `S`, so each start runs to the end. That is correct but
          quadratic.

  - id: limit-exam-debug-signed
    heading: Which call does it fail on?
    tags: [sliding-window, python]
    prompt: |-
      A suggested solution returns the length of the longest subarray of `nums` whose total is
      at most `S`. The values may be negative.

      ```python
      def longest(nums, S):
          best = total = left = 0
          for right in range(len(nums)):
              total += nums[right]
              while total > S:
                  total -= nums[left]
                  left += 1
              best = max(best, right - left + 1)
          return best
      ```

      Which call returns a wrong answer?
    options:
      - id: early-drop
        text: '`longest([4, 3, -5, 2], 5)`'
        explanation: >-
          The 3 pushes the total to 7, so the 4 leaves before the -5 arrives. The call returns
          3, but the whole list totals 4, which is at most 5, so the right answer is 4.
      - id: never-drops
        text: '`longest([1, -2, 4, 2], 5)`'
        explanation: >-
          The total goes 1, -1, 3 and 5 and never passes 5, so nothing leaves. The call returns
          4, the whole list, which is right.
      - id: same-length
        text: '`longest([6, 1, -4, 3], 5)`'
        explanation: >-
          The 6 is over 5 on its own, so it leaves at once, and `6, 1, -4` is never checked.
          But `1, -4, 3` also has 3 values and the whole list totals 6, so the call's 3 is right.
      - id: zeros
        text: '`longest([3, 0, 0, 4, 1], 4)`'
        explanation: >-
          No value is negative, so the shrink is safe. The call returns 3, and no 4 values in a
          row total 4 or less.
    correct: early-drop
    followUps:
      never-drops:
        prompt: In `longest([1, -2, 4, 2], 5)`, does the loop ever drop a value?
        options:
          - { id: no, text: 'No, the total never goes above 5' }
          - { id: drops-negative, text: 'Yes, it drops the -2 to raise the total' }
          - { id: drops-one, text: 'Yes, it drops the 1 when the 4 arrives' }
        correct: no
        explanation: >-
          The totals are 1, -1, 3 and 5. A negative value does harm only when a value leaves
          before the negative arrives, and here nothing leaves.
      same-length:
        prompt: The template never checks `6, 1, -4`. Does that change what `longest([6, 1, -4, 3], 5)` returns?
        options:
          - { id: no, text: 'No, a subarray of the same length is still recorded' }
          - { id: four, text: 'Yes, the right answer is 4, the whole list' }
          - { id: one, text: 'Yes, the right answer is 1' }
        correct: no
        explanation: >-
          A missed subarray matters only when it is longer than every one the template records.
          `1, -4, 3` has 3 values too, and the whole list totals 6, over 5.
      zeros:
        prompt: Can a 0 make the longest-subarray template drop a value it needed later?
        options:
          - { id: no, text: 'No, with no negative value a start that went over `S` stays over' }
          - { id: early, text: 'Yes, the loop drops zeros too early' }
          - { id: stuck, text: 'Yes, a 0 stops the total from changing' }
        correct: no
        explanation: >-
          Once the window from `left` totals more than `S`, adding values that are 0 or more
          keeps every longer subarray from `left` above `S`. So dropping that start loses
          nothing, zeros included.
