id: window-limits-checkpoint
title: "Window limits: checkpoint"
description: Explain a stretch a sum window loses on signed values, and pick a method that fits the task. Each item combines the Window limits skills.
heading: Which one is right?

questions:
  - id: limit-exam-lost-shortest
    heading: What does it return?
    tags: [sliding-window, python]
    prompt: |-
      ```python
      def shortest(nums, T):
          best = None
          total = left = 0
          for right in range(len(nums)):
              total += nums[right]
              while total >= T:
                  size = right - left + 1
                  if best is None or size < best:
                      best = size
                  total -= nums[left]
                  left += 1
          return best

      shortest([3, 3, -6, 3, 8], 10)
      ```

      What does the call return, and which valid stretch does it never check?
    options:
      - id: right
        text: 5, and it never checks `3, 8`, which totals 11
        explanation: >-
          The total first reaches 10 when the 8 arrives: 11 for the whole list, so the loop
          records 5. Without the first 3 the total is 8, under 10, and the -6 is never removed.
          `3, 8` at the end is valid but never examined.
      - id: finds-it
        text: 2, since the loop reaches `3, 8` on the last pass
        explanation: Where is `left` when the loop stops on the last pass?
      - id: one-more
        text: 4, since the loop records the window after the first 3 leaves
        explanation: After the first 3 leaves, is the total still at least 10?
      - id: wrong-stretch
        text: 5, and it never checks `3, -6, 3, 8`, which totals 8
        explanation: Does that stretch reach `T`?
    correct: right
    followUps:
      finds-it:
        prompt: >-
          On the last pass the loop records 5 and drops the first 3. The window is
          `3, -6, 3, 8`. What is its total, and does the loop run again?
        options:
          - { id: stops, text: '8, so the loop stops with the -6 still inside' }
          - { id: runs, text: '11, so the loop keeps dropping until `3, 8` is left' }
          - { id: zero, text: '2, so the loop stops at once' }
        correct: stops
        explanation: >-
          3 - 6 + 3 + 8 is 8, below 10. The -6 drags the total down, so the loop never drops it,
          and the stretch `3, 8` that starts after it is never recorded.
      one-more:
        prompt: The loop records a size only while the total is at least `T`. Is `3, -6, 3, 8` ever recorded?
        options:
          - { id: no, text: 'No, it totals 8, below 10' }
          - { id: yes, text: 'Yes, it is recorded before the loop checks the total' }
          - { id: last, text: 'Yes, the loop always records one last window' }
        correct: no
        explanation: >-
          The loop condition is checked before each record. A window that totals 8 never reaches
          the record line when `T` is 10.
      wrong-stretch:
        prompt: Which of these stretches totals at least 10?
        options:
          - { id: end, text: '`3, 8`, which totals 11' }
          - { id: middle, text: '`3, -6, 3, 8`, which totals 8' }
          - { id: start, text: '`3, 3`, which totals 6' }
        correct: end
        explanation: >-
          A missed stretch has to be valid to matter. `3, 8` is valid and shorter than the 5 the
          template returns.

  - id: limit-exam-tap-lost-longest
    format: tap-cell
    heading: Tap where the longest stretch starts
    tags: [sliding-window]
    prompt: >-
      The longest-stretch template returns 3 on this list with `S = 9`. Tap the first cell of
      the longest stretch whose total is at most 9.
    code: |
      def longest(nums, S):
          best = total = left = 0
          for right in range(len(nums)):
              total += nums[right]
              while total > S:
                  total -= nums[left]
                  left += 1
              best = max(best, right - left + 1)
          return best

      longest([5, 3, 2, 7, 1, -6], 9)   # returns 3
    sequence: { kind: array, name: nums, cells: [5, 3, 2, 7, 1, -6] }
    correct: 1
    explanation: >-
      `3, 2, 7, 1, -6` totals 7, so 5 values fit. The template dropped the 3 when the 7 came in
      (total 12) and the 2 when the 1 came in (total 10). The -6 that would have offset them
      arrived after both had gone.
    misses:
      - index: 0
        explanation: >-
          The whole list totals 12, over 9, and `5, 3, 2, 7, 1` totals 18. No stretch that starts
          here and holds 5 or more values fits.
      - index: 2
        explanation: >-
          `2, 7, 1, -6` totals 4 and fits, but it has only 4 values. A stretch one value longer
          also fits.
      - index: 3
        explanation: >-
          The template's last window starts here, `7, 1, -6`, 3 values. A longer stretch starts
          further left.
      - index: 4
        explanation: Only 2 values start here. A stretch of 5 values fits further left.
      - index: 5
        explanation: Only 1 value starts here. A stretch of 5 values fits further left.

  - id: limit-exam-signed-exists
    heading: Which method fits?
    tags: [sliding-window, prefix-sum, hash-map]
    prompt: >-
      An elevator logs the floor change of each of `n` trips: `+3` for three floors up, `-2` for
      two down. You need to know whether any run of consecutive trips ends exactly `k` floors
      above where it started. Which method answers in O(n) expected time?
    options:
      - id: right
        text: Walk once with a set of the net changes so far, starting at 0, and look up `net - k`
        explanation: >-
          A run that ends at this trip nets `k` exactly when an earlier net change equals
          `net - k`. The 0 stands for the start, before any trip, so a run from the first trip
          counts. Each lookup is O(1) expected, and trips down cause no trouble.
      - id: window
        text: Grow a run trip by trip, and drop its first trip while its net change passes `k`
        explanation: Can dropping a trip from the front raise the net change here?
      - id: shift
        text: Binary-search the earlier net changes for `net - k`, since they are in order
        explanation: Are the net changes so far in order when the elevator also goes down?
      - id: every
        text: Track the largest net change of a run ending at each trip, and compare it with `k`
        explanation: Does a run that nets exactly `k` have to be the largest one ending there?
    correct: right
    followUps:
      window:
        prompt: With `k = 2`, the first trip, `+5`, already passes 2, so it is dropped. Then come `-4`, `+3` and `-2`. What is lost?
        options:
          - { id: lost, text: '`+5, -4, +3, -2`, which nets 2, since the `+5` has gone' }
          - { id: none, text: 'Nothing, since no run of this log nets 2' }
          - { id: fine, text: 'Nothing, since the run can take the `+5` back' }
        correct: lost
        explanation: >-
          With trips down still to come, a run that is too high now can come back to `k` later.
          The drop throws the `+5` away for good, so the one run that nets 2 is lost.
      shift:
        prompt: The log `+4, -6, +3` gives net changes `0, 4, -2, 1`. Can a binary search look them up?
        options:
          - { id: unsorted, text: 'No, a trip down lowers the net change, so they are out of order' }
          - { id: sorted, text: 'Yes, net changes only grow as trips are added' }
          - { id: fast, text: 'Yes, and it takes O(n) time in all' }
        correct: unsorted
        explanation: >-
          Net changes are in order only when no trip goes down. Here they are not, so a binary
          search can miss a value that is there. Even on sorted values, `n` searches would take
          O(n log n) time.
      every:
        prompt: On the log `+3, +1` with `k = 1`, the largest run ending at the second trip nets 4. Is a run that nets 1 missed?
        options:
          - { id: missed, text: 'Yes, `+1` alone nets 1 but is not the largest run' }
          - { id: none, text: 'No, no run of this log nets 1' }
          - { id: found, text: 'No, the check at the first trip finds it' }
        correct: missed
        explanation: >-
          The largest run ending at a trip is only one of the runs ending there. A run that nets
          exactly `k` can be smaller, so this check misses it even when no trip goes down.

  - id: limit-exam-nonneg-longest
    heading: Which method fits?
    tags: [sliding-window, two-pointers]
    prompt: >-
      A list of `n` daily screen-time readings, in minutes, is never negative. You need the
      longest stretch of consecutive days whose total is at most `S`. Which method gives the
      right length in O(n) time and O(1) extra space?
    options:
      - id: right
        text: Grow a window on the right and drop from the left while its total exceeds `S`
        explanation: >-
          With no negative value, dropping from the left never raises the total, so once the
          window fits, no longer stretch ending here fits either. Each index enters and leaves
          once, and the window needs only a total and two indices.
      - id: dict
        text: Count earlier running totals equal to `total - S` in a dictionary
        explanation: Does that lookup find a stretch whose total is below `S`?
      - id: sort
        text: Sort the readings and take the smallest until the total exceeds `S`
        explanation: Are the smallest readings consecutive days?
      - id: every
        text: Try every start, and extend each stretch until its total exceeds `S`
        explanation: How many steps can that take when every reading is 0?
    correct: right
    followUps:
      dict:
        prompt: An earlier running total equal to `total - S` marks a stretch with which total?
        options:
          - { id: exact, text: 'Exactly `S`' }
          - { id: atmost, text: 'At most `S`' }
          - { id: atleast, text: 'At least `S`' }
        correct: exact
        explanation: >-
          A dictionary lookup matches one value, so it finds only stretches totaling exactly `S`
          and misses those below it. The task allows any total up to `S`, and the
          dictionary also costs O(n) space.
      sort:
        prompt: What does sorting the readings lose?
        options:
          - { id: order, text: 'Which days are next to each other' }
          - { id: totals, text: 'The total of the whole list' }
          - { id: nothing, text: 'Nothing, since the readings are not negative' }
        correct: order
        explanation: >-
          A stretch is a run of neighbouring days. The smallest readings can come from days far
          apart.
      every:
        prompt: With every reading 0 and any `S`, how far does each start extend?
        options:
          - { id: end, text: 'To the end of the list, so the total work is O(n²)' }
          - { id: one, text: 'One day, so the total work is O(n)' }
          - { id: none, text: 'Nowhere, since 0 never exceeds `S`' }
        correct: end
        explanation: >-
          The total never exceeds `S`, so each start runs to the end. That is correct but
          quadratic.
