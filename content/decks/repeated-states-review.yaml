  - id: cache-info-review
    heading: How often does the body run?
    tags: [dp, python, recursion]
    prompt: |-
      ```python
      from functools import cache

      @cache
      def fib(n):
          return n if n < 2 else fib(n - 1) + fib(n - 2)

      print(fib(30))
      print(fib.cache_info())
      ```

      Plain recursion makes 2,692,537 calls for `fib(30)`. `fib.cache_info()` reports how many
      calls were hits and how many were misses. How many times does the body of the cached `fib`
      run?
    options:
      - id: thirty-one
        text: 31, once for each argument from 0 to 30
        explanation: >-
          Every call is looked up first, and only a miss runs the body. `cache_info()` prints
          `CacheInfo(hits=28, misses=31, maxsize=None, currsize=31)`. Each of the 31 arguments
          misses once, and the other 28 calls are hits.
      - id: fifty-nine
        text: 59, one for every call, since a hit still runs the body
        explanation: >-
          There are 59 calls, 28 hits and 31 misses, but a hit returns the stored value without
          running the body.
      - id: twenty-eight
        text: 28, one for each hit reported by `cache_info`
        explanation: >-
          A hit is a call that did not run the body. The body runs on misses, and there are 31.
      - id: plain-count
        text: 2,692,537, since the cache only makes each call cheaper
        explanation: >-
          A hit still makes a call, but it skips the body, so none of the calls below it start.
          That is why the cached run makes 59 calls, and the body runs on only 31 of them.
    correct: thirty-one
    followUps:
      fifty-nine:
        prompt: What does a cache hit do?
        options:
          - id: returns-stored
            text: It returns the stored value and skips the body
          - id: runs-checks
            text: It runs the body and checks the result against the stored one
          - id: refreshes
            text: It runs the body and replaces the stored value
        correct: returns-stored
        explanation: >-
          The point of a hit is that no work happens. Only the lookup costs anything.
      twenty-eight:
        prompt: In `cache_info()`, which number counts the times the body ran?
        options:
          - id: misses
            text: "`misses`, since a miss is a call that had to compute"
          - id: hits
            text: "`hits`, since a hit is a call that was answered"
          - id: currsize
            text: "`currsize`, but only when it is larger than `misses`"
        correct: misses
        explanation: >-
          A miss runs the body and stores the result, so with no size limit `currsize` equals
          `misses`. Hits are calls answered from storage.
      plain-count:
        prompt: Why does the cached `fib(30)` make so few calls?
        options:
          - id: subtree-skipped
            text: A hit returns at once, so the calls below it never start
          - id: smaller-calls
            text: Each call does less arithmetic, so more fit in the same time
          - id: fewer-live
            text: The cache keeps fewer calls live at once, so fewer frames are made
        correct: subtree-skipped
        explanation: >-
          Without the cache, the repeated `fib(28)` alone would make 1,028,457 calls. With the
          cache, it is one lookup.
