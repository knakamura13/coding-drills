  - id: lis-predecessor-tap
    format: tap-cell
    heading: Which value comes just before?
    tags: [dp]
    workedExample: |-
      Consider `nums = [2, 5, 9, 1, 7]` and `lis[i]`, the length of the longest increasing
      subsequence that ends with `nums[i]`. The table so far is `lis = [1, 2, 3, 1]`, and `lis[4]`,
      for the 7, is next.

      1. The value just before the 7 must come earlier and be smaller than 7. The 9 is larger, so
         it cannot, even though `lis[2] = 3` is the largest entry so far.
      2. That leaves the 2, the 5 and the 1, with entries 1, 2 and 1. The 1 is the nearest, but
         `1, 7` has length 2. The 5 has the longest entry, for `2, 5`, so the 7 goes after it.
      3. So `lis[4] = 1 + lis[1] = 3`, for `2, 5, 7`. A value with no smaller value before it, like
         the 1, starts its own subsequence, which is why `lis[3] = 1`.
    prompt: >-
      An increasing subsequence takes values from left to right, each larger than the one before,
      and may skip values. `lis[i]` is the length of the longest increasing subsequence that ends
      with `nums[i]`, and `lis[0]` to `lis[6]` are filled, as the code shows. Tap the value that
      comes just before `nums[7]`, the 5, in the longest increasing subsequence that ends with it.
    code: |
      nums = [4, 2, 6, 3, 1, 7, 8, 5]
      lis  = [1, 1, 2, 2, 1, 3, 4]    # lis[0] to lis[6]
      # lis[7] is filled next
    sequence: { kind: array, name: nums, cells: [4, 2, 6, 3, 1, 7, 8, 5] }
    markers:
      - { name: i, at: 7 }
    correct: 3
    explanation: >-
      The 3 comes earlier and is smaller than 5, and `lis[3]` is 2, for `2, 3`. The other smaller
      values, 4, 2 and 1, have entries of 1. So `lis[7] = 1 + lis[3] = 3`, for `2, 3, 5`. The 6, 7
      and 8 come earlier but are larger, so none of them can sit just before the 5.
    misses:
      - index: 0
        explanation: >-
          The 4 is the smaller value closest to 5, but `lis[0]` is 1, so `4, 5` has length 2. The 3
          has `lis[3] = 2`, which gives `2, 3, 5`.
      - index: 1
        explanation: >-
          The 2 is in the longest one, `2, 3, 5`, but the 3 sits between it and the 5. `lis[1]` is
          1, so `2, 5` on its own has length 2.
      - index: 2
        explanation: >-
          The 6 comes earlier but is larger than 5. An increasing subsequence cannot go from 6 down
          to 5.
      - index: 4
        explanation: >-
          The 1 is the nearest smaller value, but `lis[4]` is 1, so `1, 5` has length 2. The 3
          further back has a longer entry, 2.
      - index: 5
        explanation: "`lis[5]` is 3, but the 7 is larger than 5, so it cannot come just before it."
      - index: 6
        explanation: >-
          The 8 sits right before the 5 and has the largest entry, 4, but it is larger than 5. Only
          an earlier, smaller value can come just before it.
      - index: 7
        explanation: >-
          This is `nums[7]` itself, the value the subsequence ends with. The question asks for the
          value before it.

  - id: decode-last-piece
    format: tap-cell
    heading: Tap the entry it adds
    tags: [dp]
    workedExample: |-
      Consider `s = '1226'`, where `ways[i]` counts the readings of the first `i` digits and `1` to
      `26` stand for A to Z. The last piece of a reading is one digit or two.

      1. If the last piece is the `6` alone, the rest is `'122'`, the first 3 digits. `6` is a
         letter, so `ways[4]` adds `ways[3]`.
      2. If the last piece is `26`, the rest is `'12'`, the first 2 digits. 26 is from 10 to 26, so
         it is a letter too, and `ways[4]` adds `ways[2]`.
      3. So `ways[4] = ways[3] + ways[2] = 3 + 2 = 5`.
    prompt: >-
      Below, `s = '1106'`, and the cells
      are the finished table. `ways[3]` covers the first three digits, `'110'`, so its last piece
      is either the `0` alone or `10`. Tap the one entry that `ways[3]` adds.
    code: |
      def count_reads(s):
          ways = [0] * (len(s) + 1)
          ways[0] = 1
          for i in range(1, len(s) + 1):
              if s[i - 1] != '0':                  # last piece: one digit
                  ways[i] += ways[i - 1]
              if i >= 2 and 10 <= int(s[i - 2:i]) <= 26:
                  ways[i] += ways[i - 2]           # last piece: two digits
          return ways[len(s)]

      count_reads('1106')   # 1
    sequence: { kind: array, name: ways, cells: [1, 1, 2, 1, 1] }
    markers:
      - { name: i, at: 3 }
    correct: 1
    explanation: >-
      The `0` cannot stand alone, so the one-digit case adds nothing. `10` is a letter, so the
      two-digit case adds `ways[1]`, the readings of `'1'`. `ways[3]` is 1, for `1 10`.
    misses:
      - index: 0
        explanation: >-
          `ways[0]` would be read for a last piece of three digits, `110`. Pieces are one or two
          digits.
      - index: 2
        explanation: >-
          `ways[2]` is read when the last piece is the `0` alone. A `0` is not a letter, so that
          case adds nothing, even though `ways[2]` holds 2.
      - index: 3
        explanation: This is `ways[3]` itself, the entry being filled. It adds earlier entries.
      - index: 4
        explanation: >-
          `ways[4]` covers all four digits and is filled after `ways[3]`. An entry only adds
          entries that come before it.
