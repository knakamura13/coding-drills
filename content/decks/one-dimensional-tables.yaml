      1. `end[0] = 2`, the 2 alone, since nothing comes before it.
      2. For `end[1]`, extending gives `2 + -3 = -1` and starting fresh gives -3. -1 is larger, so
         the subarray `2, -3` is extended, and `end[1] = -1`.
      3. For `end[2]`, extending gives `-1 + 4 = 3` and starting fresh gives 4. Adding the negative
         `end[1]` can only lower the total, so the fresh start wins: `end[2] = 4`, for the 4 alone.
    prompt: >-
