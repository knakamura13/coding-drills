id: boundary-search-checkpoint
title: "Boundary search: checkpoint"
description: Repair a boundary update, pick the call that breaks a suggested solution, and search a rotated list, on new values. Most items combine the two skills that lead into its checkpoint.
heading: Which one is right?

questions:
  - id: checkpoint-repair-first-copy
    heading: Which fix works?
    tags: [binary-search]
    prompt: |-
      `first_at_least` should return the first index with `a[i] >= x`, or `len(a)` if there is
      none.

      ```python
      def first_at_least(a, x):
          lo, hi = 0, len(a)
          while lo < hi:
              mid = (lo + hi) // 2
              if a[mid] <= x:
                  lo = mid + 1
              else:
                  hi = mid
          return lo
      ```

      `first_at_least([5, 9, 9, 9, 16, 20], 9)` returns 4 instead of 1. Which one-line change
      makes it correct for every sorted list and every `x`?
    options:
      - id: strict
        text: "`if a[mid] < x:`"
        explanation: >-
          With `<=`, an equal value moves `lo` past it, so the loop finds the slot after the last
          copy. With `<`, only values below `x` move `lo`, and an equal value stays a candidate on
          the `hi` side. The call then returns 1.
      - id: minus-one
        text: "`return lo - 1`"
        explanation: >-
          That returns 3 here, the last 9, not the first. The `<=` test still sends `lo` past
          every copy, so changing the return only lands on a different wrong cell.
      - id: hi-minus
        text: "`hi = mid - 1` in the `else` branch"
        explanation: Trace the call again. Which cells does the first probe drop?
      - id: closed-hi
        text: "`lo, hi = 0, len(a) - 1`"
        explanation: Trace the same call with the new start. Which test sends `lo` past the 9s?
    correct: strict
    followUps:
      minus-one:
        prompt: With `return lo - 1`, what does `first_at_least([5, 9, 9, 9, 16, 20], 12)` return?
        options:
          - id: three
            text: 3, the index of the last 9, though 12 belongs at index 4
          - id: four
            text: 4, the slot where 12 belongs
          - id: minus
            text: -1, because 12 is absent
        correct: three
        explanation: >-
          The loop still finds the slot after values `<= x`. Subtracting 1 lands on the last copy
          when `x` is present, and on the wrong cell when it isn't. The fix is in the test, not
          the return.
      hi-minus:
        prompt: >-
          With `hi = mid - 1`, the call probes index 3 (a 9, so `lo = 4`), then index 5 (20, so
          `hi = 4`). What does it return?
        options:
          - id: four-still
            text: 4, past the 9s
          - id: one
            text: 1, the first 9
          - id: three-last
            text: 3, the last 9
        correct: four-still
        explanation: >-
          It returns 4, the same wrong answer, because the `<=` test still moves `lo` past the
          9s. The bug is which side keeps an equal value. Changing the other branch leaves `<=` in
          place, and it also lets `hi` drop a value that could be the answer.
      closed-hi:
        prompt: With `hi = len(a) - 1`, what can the function no longer return?
        options:
          - id: no-len
            text: "`len(a)`, the answer for an `x` larger than every value"
          - id: no-zero
            text: 0, the answer for an `x` smaller than every value
          - id: nothing
            text: Nothing is lost, it only fixes the duplicates
        correct: no-len
        explanation: >-
          A half-open `hi` lets the loop end past the last cell. Closing it removes that answer,
          and the `<=` test still pushes `lo` past every copy.

  - id: checkpoint-repair-past-boundary
    heading: Which fix works?
    tags: [binary-search]
    prompt: |-
      `first_greater` should return the first index with `a[i] > x`, or `len(a)` if there is
      none.

      ```python
      def first_greater(a, x):
          lo, hi = 0, len(a)
          while lo < hi:
              mid = (lo + hi) // 2
              if a[mid] > x:
                  hi = mid - 1
              else:
                  lo = mid + 1
          return lo
      ```

      `first_greater([4, 10, 10, 13, 21, 26], 10)` returns 2 instead of 3. Which one-line change
      makes it correct for every sorted list and every `x`?
    options:
      - id: hi-mid
        text: "`hi = mid`"
        explanation: >-
          The first probe reads 13 at index 3. 13 is greater than 10, so index 3 may be the
          answer, and `hi = mid - 1` threw it away. `hi = mid` keeps it, and the call returns 3.
      - id: plus-one
        text: "`return lo + 1`"
        explanation: That fixes this call. Try `x = 13` on the same list.
      - id: le
        text: "`while lo <= hi:`"
        explanation: Try an `x` larger than every value.
      - id: round-up
        text: "`mid = (lo + hi + 1) // 2`"
        explanation: Work out the first probe on the list `[5]`.
    correct: hi-mid
    followUps:
      plus-one:
        prompt: With `return lo + 1`, what does `first_greater([4, 10, 10, 13, 21, 26], 13)` return?
        options:
          - id: five
            text: 5, the index of 26
          - id: four
            text: 4, the index of 21
          - id: three
            text: 3, the index of 13
        correct: five
        explanation: >-
          The buggy loop already returns 4 here, because no probe drops the answer. Adding 1
          gives 5, though the first value above 13 is 21, at index 4. Patching the return hides one symptom instead of keeping every
          candidate.
      le:
        prompt: With `while lo <= hi`, what happens on `first_greater([4, 10, 10, 13, 21, 26], 30)`?
        options:
          - id: index-error
            text: It probes index 6, past the end, and raises `IndexError`
          - id: six
            text: It returns 6, the length of the list
          - id: hangs
            text: It loops forever
        correct: index-error
        explanation: >-
          A half-open `hi` is never a real cell. With `lo <= hi` the loop runs once more when
          `lo == hi == 6`, and reads `a[6]`.
      round-up:
        prompt: With `mid = (lo + hi + 1) // 2`, which cell does the first probe read on `first_greater([5], 3)`?
        options:
          - id: past-end
            text: Index 1, past the end
          - id: zero
            text: Index 0, which holds 5
          - id: none
            text: No cell, it never probes
        correct: past-end
        explanation: >-
          With `lo = 0` and `hi = 1`, rounding up gives 1, and `hi` is outside the list, so
          reading `a[1]` raises `IndexError`. A half-open loop has to round down so that `mid` stays below `hi`.

  - id: checkpoint-pick-boundary-loop
    heading: Which loop is correct?
    tags: [binary-search]
    prompt: >-
      A sorted list `a` may hold copies of a value. You need the first index `i` with
      `a[i] >= x`, or `len(a)` when there is none, which is what `bisect_left(a, x)` returns. For
      `a = [2, 4, 4, 4, 9, 11]` and `x = 4` it is 1. Each loop starts `lo` at 0, probes
      `mid = (lo + hi) // 2`, moves either `lo` or `hi` after each probe, and ends with
      `return lo`. All four move `lo` the same way, after the same probes, and that part is right.
      They differ only in where `hi` starts, the loop test, and what `hi` becomes when it moves.
      Which loop returns the right index for every sorted list and every `x`?
    options:
      - id: lt-moves-right
        text: "`hi` starts at `len(a)`, the loop runs while `lo < hi`, and `hi` moves to `mid`"
        explanation: >-
          The answer always lies from `lo` to `hi`, both included, and with `hi` starting at
          `len(a)` that covers the answer past the end. `hi` moves only after a probe that may be
          the answer, so `hi = mid` keeps it. When `lo == hi`, one index is left, and it is the
          answer, possibly `len(a)`.
      - id: le-loop
        text: "`hi` starts at `len(a)`, the loop runs while `lo <= hi`, and `hi` moves to `mid`"
        explanation: >-
          With `lo <= hi` the loop runs again when `lo == hi`, though that index is already the
          answer. On this list with `x = 20`, `lo` reaches 6 and the loop reads `a[6]`, past the
          end. With `x = 10`, it reaches `lo = hi = 5`, probes the 11, and `hi` moves to 5 again,
          so it loops forever.
      - id: hi-len-minus-one
        text: "`hi` starts at `len(a) - 1`, the loop runs while `lo < hi`, and `hi` moves to `mid`"
        explanation: >-
          Starting `hi` at `len(a) - 1` means the loop can never end on `len(a)`, so it can't
          report that every value is below `x`. With `x = 20` it returns 5, but the right answer
          is 6.
      - id: hi-minus-one
        text: "`hi` starts at `len(a)`, the loop runs while `lo < hi`, and `hi` moves to `mid - 1`"
        explanation: >-
          `hi` moves after a probe that may be the answer, and `mid - 1` throws that probe away.
          On this list with `x = 10`, the probe at index 5 reads 11, larger than 10, so `hi` drops
          to 4 and the call returns 4. The right answer is 5, the 11.
    correct: lt-moves-right
    followUps:
      le-loop:
        prompt: >-
          On `[2, 4, 4, 4, 9, 11]` with `x = 20`, `lo` reaches 6 while `hi` is 6. What does
          `while lo <= hi` do next?
        options:
          - id: past-end
            text: It probes index 6, past the end, and raises `IndexError`
          - id: returns
            text: It returns 6, since the bounds have met
          - id: moves-hi
            text: It moves `hi` to 5 and stops
        correct: past-end
        explanation: >-
          `hi` starts at `len(a)`, which is never a real cell, so when `lo == hi` nothing is left
          to read. `while lo < hi` stops there and returns 6.
      hi-len-minus-one:
        prompt: How many insertion points does a list of `len(a)` values have?
        options:
          - id: len-plus-one
            text: "`len(a) + 1`: in front of each value, or after the last"
          - id: len-answers
            text: "`len(a)`: one per value, so `hi = len(a) - 1` covers them"
          - id: hi-irrelevant
            text: The starting `hi` does not matter, because the loop returns `lo`
        correct: len-plus-one
        explanation: >-
          An insertion point can sit in front of each value or after the last one, which is
          `len(a) + 1` choices. Starting at `hi = len(a) - 1` offers only `len(a)` of them and
          never the one after the end.
      hi-minus-one:
        prompt: On `[2, 4, 4, 4, 9, 11]` with `x = 10`, a probe reads 11 at index 5. Can index 5 be the answer?
        options:
          - id: keep
            text: Yes, 11 is larger than 10, so `hi` has to keep index 5
          - id: drop
            text: No, 11 is not 10, so index 5 can go
          - id: last
            text: Only because 11 is the last value
        correct: keep
        explanation: >-
          The answer is the first index whose value is at least `x`, so a probe larger than `x`
          can be it. Moving `hi` to `mid` keeps it, and `mid - 1` throws it away.

  - id: checkpoint-debug-contains
    heading: Which call does it fail on?
    tags: [binary-search]
    prompt: |-
      A suggested solution checks whether the sorted list `a` holds `x`. `bisect_left(a, x)`
      returns the first index whose value is at least `x`, or `len(a)` when no value is. One line
      is slightly off:

      ```python
      from bisect import bisect_left

      def contains(a, x):
          i = bisect_left(a, x)
          return a[i] == x

      a = [4, 9, 15, 22]
      ```

      Which call fails?
    options:
      - id: above-all
        text: "`contains(a, 30)`"
        explanation: >-
          No value is at least 30, so `bisect_left` returns 4, which is `len(a)`. The last line
          then reads `a[4]`, past the end, and raises `IndexError`. The fix is
          `return i < len(a) and a[i] == x`: `and` stops at a false `i < len(a)`, so `a[i]` is
          read only when `i` is a real index.
      - id: below-all
        text: "`contains(a, 2)`"
        explanation: >-
          Every value is at least 2, so `bisect_left` returns 0. `a[0]` is 4, not 2, so the call
          returns `False`, which is right.
      - id: between
        text: "`contains(a, 12)`"
        explanation: >-
          The first value that is at least 12 is 15, at index 2. 15 is not 12, so the call returns
          `False`, which is right.
      - id: last-value
        text: "`contains(a, 22)`"
        explanation: >-
          The first value that is at least 22 is the 22 itself, at index 3, the last cell. The call
          returns `True`, which is right.
    correct: above-all
    followUps:
      below-all:
        prompt: For `contains(a, 2)`, which index does `bisect_left` return, and what happens next?
        options:
          - id: zero-false
            text: Index 0, and `a[0]` is 4, so it returns `False`
          - id: minus-one
            text: Index -1, so it raises an error
          - id: zero-true
            text: Index 0, and it returns `True`
        correct: zero-false
        explanation: >-
          `bisect_left` never returns less than 0. An `x` smaller than every value gives the first
          cell, a real cell, so comparing it is safe.
      between:
        prompt: When `x` is missing but some value is larger, which index does `bisect_left` return?
        options:
          - id: first-larger
            text: The index of the first value larger than `x`, a real cell
          - id: last-smaller
            text: The index of the last value smaller than `x`
          - id: past-end
            text: "`len(a)`, past the end"
        correct: first-larger
        explanation: >-
          That cell exists, so the comparison reads a real value and returns `False`. Only an `x`
          larger than every value gives `len(a)`, past the end.
      last-value:
        prompt: "`bisect_left(a, 22)` returns 3. Is index 3 a real cell of `a`?"
        options:
          - id: real
            text: Yes, the last one, so the comparison is safe
          - id: past
            text: No, it is past the end
          - id: depends
            text: Only if `a` holds more than four values
        correct: real
        explanation: >-
          A four-item list has indices 0 to 3. `bisect_left` returns `len(a)` only when no value is
          at least `x`, and 22 is in the list.

  - id: checkpoint-count-in-range
    heading: Which expression counts the range?
    tags: [binary-search]
    prompt: >-
      `a` is sorted and may hold copies. `bisect_left(a, x)` returns the first index with
      `a[i] >= x`, and `bisect_right(a, x)` the first index with `a[i] > x`, each `len(a)` when no
      index qualifies. Which expression returns how many values `v` in `a` have
      `low <= v < high`, for every sorted list and every `low <= high`?
    options:
      - id: left-left
        text: "`bisect_left(a, high) - bisect_left(a, low)`"
        explanation: >-
          `bisect_left(a, low)` is the first index of a value at least `low`, and
          `bisect_left(a, high)` the first index of a value at least `high`. The values between
          those two slots are exactly the ones from `low` up to, but not including, `high`. For
          `[2, 5, 5, 7, 9, 12]` with `low = 5` and `high = 9` it gives 4 - 1 = 3: the two 5s and
          the 7.
      - id: right-high
        text: "`bisect_right(a, high) - bisect_left(a, low)`"
        explanation: >-
          `bisect_right(a, high)` steps past every copy of `high`, so they are counted though
          `v < high` leaves them out. For `[2, 5, 5, 7, 9, 12]` with `low = 5` and `high = 9` it
          gives 5 - 1 = 4, counting the 9.
      - id: right-low
        text: "`bisect_left(a, high) - bisect_right(a, low)`"
        explanation: >-
          `bisect_right(a, low)` starts past every copy of `low`, so they are left out though
          `low <= v` keeps them. For `[2, 5, 5, 7, 9, 12]` with `low = 5` and `high = 9` it gives
          4 - 3 = 1, only the 7.
      - id: right-right
        text: "`bisect_right(a, high) - bisect_right(a, low)`"
        explanation: >-
          Both ends step past their copies, so this counts `low < v <= high`. For
          `[2, 5, 5, 7, 9, 12]` with `low = 5` and `high = 9` it gives 5 - 3 = 2, the 7 and the 9.
    correct: left-left
    followUps:
      right-high:
        prompt: In `[2, 5, 5, 7, 9, 12]`, which index does `bisect_right(a, 9)` return?
        options:
          - { id: five, text: "5, past the 9, so the 9 is inside the count" }
          - { id: four, text: "4, the index of the 9" }
          - { id: three, text: "3, the index of the 7" }
        correct: five
        explanation: >-
          `bisect_right` returns the first index whose value is larger than 9, which is the 12.
          A count that must stop before `high` ends at `bisect_left(a, high)`, the first copy.
      right-low:
        prompt: In `[2, 5, 5, 7, 9, 12]`, which index does `bisect_right(a, 5)` return?
        options:
          - { id: three, text: "3, past both 5s, so they fall outside the count" }
          - { id: one, text: "1, the first 5" }
          - { id: two, text: "2, the second 5" }
        correct: three
        explanation: >-
          `bisect_right` skips every copy of 5. A count that keeps `low` must start at the first
          copy, which is what `bisect_left(a, low)` returns.
      right-right:
        prompt: Which values does `bisect_right(a, high) - bisect_right(a, low)` count?
        options:
          - { id: open-closed, text: "Those with `low < v <= high`" }
          - { id: same, text: "Those with `low <= v < high`, the same values" }
          - { id: all-copies, text: "Every copy of `low` and of `high`, and the values between" }
        correct: open-closed
        explanation: >-
          Starting past the copies of `low` drops them, and ending past the copies of `high` adds
          them. The two match only when neither end has a copy in `a`.

  - id: checkpoint-read-two-boundaries
    heading: What must the list hold?
    tags: [binary-search]
    prompt: >-
      `bisect_left(a, x)` returns the first index with `a[i] >= x`, and `bisect_right(a, x)` the
      first index with `a[i] > x`. On a sorted list `a` of 7 values, `bisect_left(a, x)` is 2 and
      `bisect_right(a, x)` is 5. Which statement must be true?
    options:
      - id: three-copies
        text: "`a[2]`, `a[3]` and `a[4]` equal `x`, and `a[1] < x < a[5]`"
        explanation: >-
          Index 2 is the first value at least `x`, so `a[1]` is below `x`. Index 5 is the first
          value above `x`, so `a[2]` to `a[4]` are at most `x`, and being at least `x` too, they
          equal it. `a[5]` is above `x`.
      - id: four-copies
        text: "`a[2]` to `a[5]` equal `x`, four copies"
        explanation: >-
          `bisect_right` returns the first index past the copies, not the last copy. `a[5]` is
          already above `x`, so the copies stop at index 4.
      - id: shifted
        text: "`a[3]`, `a[4]` and `a[5]` equal `x`, and `a[2] < x`"
        explanation: >-
          This reads `bisect_left` as the last index below `x` and `bisect_right` as the last copy.
          But `bisect_left` returns the first copy itself, so `a[2]` equals `x`, and `a[5]` is
          already above it.
    correct: three-copies
    followUps:
      four-copies:
        prompt: What value sits at the index `bisect_right(a, x)` returns, when that index is inside `a`?
        options:
          - { id: larger, text: "The first value larger than `x`" }
          - { id: last-copy, text: "The last copy of `x`" }
          - { id: smaller, text: "The last value smaller than `x`" }
        correct: larger
        explanation: >-
          `bisect_right` returns the first index with `a[i] > x`. So the copies of `x` end just
          before it, at index 4 here.
      shifted:
        prompt: When `x` is in `a`, what does `a[bisect_left(a, x)]` hold?
        options:
          - { id: first-copy, text: "`x` itself, its first copy" }
          - { id: below, text: "The last value below `x`" }
          - { id: above, text: "The first value above `x`" }
        correct: first-copy
        explanation: >-
          `bisect_left` returns the first index with `a[i] >= x`. When `x` is present, that value
          is `x`, so the first copy sits at index 2 here.

  - id: checkpoint-rotated-trace
    format: step-trace
    heading: Predict each step
    tags: [binary-search]
    prompt: Predict each step of this search on a rotated list before it is shown.
    code: |
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[lo] <= a[mid]:
                  if a[lo] <= t < a[mid]:
                      hi = mid - 1
                  else:
                      lo = mid + 1
              else:
                  if a[mid] < t <= a[hi]:
                      lo = mid + 1
                  else:
                      hi = mid - 1
          return -1

      search([57, 61, 68, 74, 80, 12, 25, 41], 25)
    sequence:
      kind: array
      name: a
      cells: [57, 61, 68, 74, 80, 12, 25, 41]
    start:
      - { name: lo, at: 0 }
      - { name: hi, at: 7 }
    steps:
      - line: 4
        ask: The first probe is index 3. Which part is in order?
        options:
          - id: left-first
            text: "Indices 0 to 3: 57 to 74"
            explanation: '`a[lo] = 57 <= a[mid] = 74`, so the left part has no drop.'
          - id: right-first
            text: "Indices 3 to 7: 74 to 41"
            explanation: That part falls from 80 to 12, so it holds the drop.
          - id: both-first
            text: Both parts
            explanation: The drop from 80 to 12 is in the right part, so only the left part is in order.
        correct: left-first
      - line: 7
        ask: Where does `lo` sit after the first pass?
        pointer: lo
        correct: 4
        explanation: 25 is below 57, so it is not in 57 to 74. `lo = mid + 1 = 4`.
        misses:
          - index: 0
            explanation: >-
              That keeps the left part, as the plain rule would because 74 is larger than 25. But
              57 to 74 is sorted, and 25 is below all of it.
          - index: 3
            explanation: That is `lo = mid`. Index 3 holds 74, which was just compared with 25.
          - index: 6
            explanation: 25 sits at index 6, but one pass drops only the part ruled out.
        elsewhere: 25 is not between 57 and 74, so `lo` moves past the probe, to 4.
      - line: 4
        ask: The second probe is index 5. Which part is in order?
        options:
          - id: right-second
            text: "Indices 5 to 7: 12, 25, 41"
            explanation: '`a[lo] = 80` is larger than `a[mid] = 12`, so the drop is on the left and 12, 25, 41 is in order.'
          - id: left-second
            text: "Indices 4 to 5: 80, 12"
            explanation: That part falls from 80 to 12. `a[lo] <= a[mid]` is `80 <= 12`, false.
          - id: both-second
            text: Both parts
            explanation: The drop from 80 to 12 is still inside the range, in the left part.
        correct: right-second
      - line: 7
        ask: Where does `lo` sit after the second pass?
        pointer: lo
        correct: 6
        explanation: 25 is between 12 and 41, so it is in the sorted right part, and `lo = mid + 1 = 6`.
        misses:
          - index: 4
            explanation: >-
              `lo` stays only when the search goes left. 25 is in the sorted part 12 to 41, so it
              goes right.
          - index: 5
            explanation: That is `lo = mid`. Index 5 holds 12, which was just compared with 25.
        elsewhere: 25 is in the sorted part 12 to 41, so `lo` moves past the probe, to 6.
      - line: 4
        ask: What does the call return?
        options:
          - id: six
            text: '6'
            explanation: '`lo = 6` and `hi = 7`, so `mid = 6`. `a[6]` is 25, and the call returns 6.'
          - id: seven
            text: '7'
            explanation: '`mid` is `(6 + 7) // 2`, which rounds down to 6, and `a[6]` is already 25.'
          - id: minus-one
            text: '-1'
            explanation: The 25 is still inside the range 6 to 7, so the next probe finds it.
          - id: five
            text: '5'
            explanation: Index 5 holds 12, the smallest value. The 25 is one cell to its right.
        correct: six

  - id: checkpoint-strict-test
    heading: Which call shows the bug?
    tags: [binary-search]
    prompt: |-
      This rotated search tests the left part with `<` instead of `<=`.

      ```python
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[lo] < a[mid]:
                  if a[lo] <= t < a[mid]:
                      hi = mid - 1
                  else:
                      lo = mid + 1
              else:
                  if a[mid] < t <= a[hi]:
                      lo = mid + 1
                  else:
                      hi = mid - 1
          return -1
      ```

      With `a = [48, 7, 15, 22, 30, 39]`, which call returns a wrong answer?
    options:
      - id: seven
        text: "`search(a, 7)`"
        explanation: >-
          The first probe reads 15, and the search keeps `lo = 0`, `hi = 1`. Now `mid = 0`, and
          `48 < 48` is false, so the code treats 48, 7 as the sorted part. 7 is not between 48
          and 7, so `hi = -1`, and the call returns -1 though 7 is at index 1.
      - id: forty-eight
        text: "`search(a, 48)`"
        explanation: Trace the two-cell range. Which cell does the second probe read?
      - id: thirty-nine
        text: "`search(a, 39)`"
        explanation: Trace the first probe. Does the search ever reach a range where `lo == mid` and the probe misses?
      - id: ten
        text: "`search(a, 10)`"
        explanation: Work out what a correct search returns for this call first.
    correct: seven
    followUps:
      forty-eight:
        prompt: On the range `lo = 0`, `hi = 1`, `mid` is 0. What happens when the target is 48?
        options:
          - id: found
            text: "`a[0]` is 48, so the call returns 0 before the faulty test runs"
          - id: lost
            text: The faulty test drops the 48, and the call returns -1
          - id: hangs
            text: The range never shrinks
        correct: found
        explanation: >-
          The equality check comes first. The strict test does harm only on a pass where `mid ==
          lo` and the probe misses.
      thirty-nine:
        prompt: The first probe reads 15, and 15 to 39 is the sorted part. Where does the search go for 39?
        options:
          - id: right-only
            text: Right, to the 22, 30 and 39
          - id: left
            text: Left, to the 48 and the 7
          - id: stuck
            text: Nowhere, the `<` test stops it
        correct: right-only
        explanation: >-
          It goes right, to 22 to 39, a range with no drop. The strict test is wrong only on a
          one-cell left part, and the only pass here with `mid == lo` finds the 39. A search that
          never probes with `mid == lo` on a miss never hits the bug.
      ten:
        prompt: 10 is not in `[48, 7, 15, 22, 30, 39]`. What do a correct search and this one return?
        options:
          - id: both-minus
            text: Both return -1, so the answers agree
          - id: correct-one
            text: A correct search returns 1, and this one returns -1
          - id: this-hangs
            text: A correct search returns -1, and this one hangs
        correct: both-minus
        explanation: >-
          A missing target gives -1 whichever part is searched. The bug shows only when the part
          it drops holds the target.

  - id: checkpoint-rotated-minimum
    heading: Which update finds the smallest value?
    tags: [binary-search]
    prompt: |-
      `smallest` should return the index of the smallest value in a sorted list of distinct values
      that may have been rotated. For `[33, 40, 46, 9, 17, 25]` it returns 3.

      ```python
      def smallest(a):
          lo, hi = 0, len(a) - 1
          while lo < hi:
              mid = (lo + hi) // 2
              ...  # which update?
          return lo
      ```

      Which update makes it correct for every such list, rotated or not?
    options:
      - id: vs-hi
        text: "`if a[mid] > a[hi]: lo = mid + 1`, else `hi = mid`"
        explanation: >-
          If `a[mid] > a[hi]`, the drop is right of `mid`, so `mid` is not the smallest and `lo`
          steps past it. Otherwise indices `mid` to `hi` ascend, so the smallest is `mid` or to its left,
          and `hi = mid` keeps `mid`.
      - id: vs-lo
        text: "`if a[mid] >= a[lo]: lo = mid + 1`, else `hi = mid`"
        explanation: Try a list that was not rotated at all.
      - id: hi-minus
        text: "`if a[mid] > a[hi]: lo = mid + 1`, else `hi = mid - 1`"
        explanation: Try a list where the first probe lands on the smallest value.
      - id: lo-mid
        text: "`if a[mid] > a[hi]: lo = mid`, else `hi = mid`"
        explanation: Trace a two-cell range whose smaller value is on the right.
    correct: vs-hi
    followUps:
      vs-lo:
        prompt: On the unrotated `[4, 11, 19]`, what does the `a[lo]` version return?
        options:
          - id: two
            text: 2, the largest value
          - id: zero
            text: 0, the smallest value
          - id: one
            text: 1, the middle value
        correct: two
        explanation: >-
          Every probe is at least `a[lo]`, so `lo` climbs to 2. `a[mid] >= a[lo]` is true in any
          ascending part, so it can't tell "the drop is to the
          right" from "there is no drop". Comparing with `a[hi]` can: an ascending range has
          `a[mid] <= a[hi]`.
      hi-minus:
        prompt: On `[30, 8, 12]`, the probe reads 8 at index 1, and 8 is not above 12. What does `hi = mid - 1` do?
        options:
          - id: drops-min
            text: It drops index 1, the 8, and the call returns 0
          - id: keeps-min
            text: It keeps the 8, and the call returns 1
          - id: hangs-min
            text: It leaves the range unchanged
        correct: drops-min
        explanation: >-
          `a[mid] <= a[hi]` says the smallest is `mid` or left of it, so `mid` stays a candidate.
          Stepping past it can throw away the answer.
      lo-mid:
        prompt: On `[50, 6]`, `mid` is 0 and 50 is above 6. What does `lo = mid` do?
        options:
          - id: stuck
            text: It leaves `lo` on 0, so the loop repeats forever
          - id: finds
            text: It moves `lo` to 1, the 6
          - id: ends
            text: It ends the loop and returns 0
        correct: stuck
        explanation: >-
          `a[mid] > a[hi]` rules `mid` out, so the update must step past it. `lo = mid` never
          shrinks a two-cell range, because `mid` rounds down to `lo`.

  - id: checkpoint-pick-sorted-run
    heading: Which run holds the target?
    tags: [binary-search]
    prompt: |-
      `a` is a sorted list of distinct values that may have been rotated: some values, possibly
      none, moved in order from its front to its back. So `a` is one sorted run from `k`, the
      index of its smallest value, to the end, and another from 0 to `k - 1`, which is empty when
      `k` is 0. `find` runs a plain binary search on one run.

      ```python
      def find(a, t):
          k = smallest(a)  # index of the smallest value
          if ____:
              lo, hi = k, len(a) - 1
          else:
              lo, hi = 0, k - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1
      ```

      Which test fills the blank so that `find` returns the index of `t`, or -1, on every such list?
    options:
      - id: le-last
        text: "`t <= a[-1]`"
        explanation: >-
          Every value from `k` to the end is at most `a[-1]`, and every value before `k` is larger
          than `a[-1]`, since that run was moved from the front of the sorted list. So `t` can only
          be in the run from `k` when `t <= a[-1]`. On a list that was not rotated, `k` is 0 and
          the test sends every present `t` to the whole list.
      - id: lt-first
        text: "`t < a[0]`"
        explanation: >-
          On a rotated list this works, since the run before `k` starts at `a[0]`. On a list that
          was not rotated, `k` is 0, so every present `t` fails the test and goes to the empty run
          from 0 to -1. `find([3, 8, 14], 8)` returns -1.
      - id: ge-smallest
        text: "`t >= a[k]`"
        explanation: >-
          `a[k]` is the smallest value, so every value in `a` passes this test, and `find` always
          searches the run from `k`. A value in the other run is never found:
          `find([14, 20, 3, 8], 20)` returns -1.
      - id: lt-last
        text: "`t < a[-1]`"
        explanation: >-
          This sends `a[-1]` itself to the run before `k`, which holds only larger values.
          `find([14, 20, 3, 8], 8)` returns -1, though 8 is at index 3.
    correct: le-last
    followUps:
      lt-first:
        prompt: On a list that was not rotated, which values does the run from 0 to `k - 1` hold?
        options:
          - { id: none, text: "None, since `k` is 0" }
          - { id: all, text: "All of them" }
          - { id: first, text: "Only `a[0]`" }
        correct: none
        explanation: >-
          With no rotation the smallest value is at index 0, so the run from `k` is the whole list
          and the other run is empty. A test against `a[0]` sends every present `t` to the empty
          run.
      ge-smallest:
        prompt: Which values in `a` are at least `a[k]`?
        options:
          - { id: every, text: "Every value, since `a[k]` is the smallest" }
          - { id: run-k, text: "Only those in the run from `k`" }
          - { id: run-zero, text: "Only those in the run before `k`" }
        correct: every
        explanation: >-
          A test every value passes cannot tell the two runs apart. The run before `k` holds the
          values larger than `a[-1]`, so compare `t` with `a[-1]`.
      lt-last:
        prompt: For `find([14, 20, 3, 8], 8)`, which run holds the 8?
        options:
          - { id: from-k, text: "The run from `k`, as its last value" }
          - { id: before-k, text: "The run before `k`, with 14 and 20" }
          - { id: neither, text: "Neither, since 8 is the last value" }
        correct: from-k
        explanation: >-
          `a[-1]` ends the run from `k`, so `t == a[-1]` belongs there. A strict `<` sends it to
          the other run, which holds only 14 and 20.

  - id: checkpoint-two-pass-drag
    format: drag-pointers
    heading: Where are the bounds after two passes?
    tags: [binary-search]
    prompt: >-
      A search on a rotated sorted list of distinct values runs while `lo <= hi`. Each pass probes
      `mid = (lo + hi) // 2` and returns it if `a[mid] == t`. Otherwise it finds which part,
      `lo` to `mid` or `mid` to `hi`, is in order, keeps the part that may hold `t`, and sets
      `hi = mid - 1` or `lo = mid + 1`. Drag `lo` and `hi` to where they are after two passes.
    code: |
      a = [44, 51, 59, 66, 2, 9, 17, 30]
      t = 2
      lo, hi = 0, 7
      # two passes run
    sequence: { kind: array, name: a, cells: [44, 51, 59, 66, 2, 9, 17, 30] }
    pointers:
      - name: lo
        start: 0
        correct: 4
        explanation: >-
          Pass 1 probes the 66. 44 to 66 is in order and 2 is below it, so `lo = 4`. Pass 2 probes
          the 9 and keeps the left part, so `lo` stays on 4.
        misses:
          - index: 3
            explanation: '`lo` moves past the probe, to `mid + 1`. Index 3 holds 66, already ruled out.'
          - index: 5
            explanation: >-
              Pass 2 probes index 5, the 9. 2 to 9 is in order and holds 2, so the search keeps
              the left part and `hi` moves, not `lo`.
          - index: 6
            explanation: >-
              That treats 2 as outside 2 to 9 on pass 2. `a[lo]` is 2 itself, so the in-order part
              may hold `t`, and `lo` stays on 4.
        elsewhere: >-
          Pass 1 moves `lo` past the 66, because 2 is not in the in-order part 44 to 66. Pass 2
          keeps the left part, so `lo` stays on 4.
      - name: hi
        start: 7
        correct: 4
        explanation: >-
          Pass 1 keeps the right part, so `hi` stays on 7. Pass 2 probes the 9, the part 2 to 9 is
          in order and holds 2, so `hi = mid - 1 = 4`.
        misses:
          - index: 7
            explanation: '`hi` stays on pass 1 only. Pass 2 keeps the left part, 2 to 9, and moves `hi`.'
          - index: 5
            explanation: '`hi` moves past the probe, to `mid - 1`. Index 5 holds 9, which was just compared.'
          - index: 0
            explanation: >-
              That follows the plain rule twice: 2 is below 66, then below 51. But 44 to 66 is in
              order and 2 is not in it, so pass 1 goes right.
        elsewhere: Pass 1 leaves `hi` on 7, and pass 2 moves it to `mid - 1`, which is 4.

  - id: checkpoint-not-a-rotation
    heading: Which list is not a rotation?
    tags: [binary-search]
    prompt: >-
      A rotated sorted list is a sorted list of distinct values with some values, possibly none,
      moved in order from its front to its back. Which of these lists cannot be one?
    options:
      - id: ends-high
        text: "`[6, 9, 2, 5, 7]`"
        explanation: >-
          It drops once, from 9 to 2, but its last value, 7, is above its first, 6. In a rotation
          the values after the drop come from the start of the sorted list, so all of them are
          below the first value. Sorted, the values are `[2, 5, 6, 7, 9]`, and no rotation of that
          starts with 6 and ends with 7.
      - id: unrotated
        text: "`[2, 5, 6, 7, 9]`"
        explanation: >-
          Moving no values is allowed, so the sorted list itself is a rotation. It has no drop, so
          its whole range is in order.
      - id: drop-first
        text: "`[9, 2, 5, 6, 7]`"
        explanation: >-
          Moving the first four values of `[2, 5, 6, 7, 9]` to the back gives this list. Its drop
          comes right after the first value.
      - id: drop-last
        text: "`[5, 6, 7, 9, 2]`"
        explanation: >-
          Moving the first value of `[2, 5, 6, 7, 9]` to the back gives this list. Its drop comes
          just before the last value.
    correct: ends-high
    followUps:
      unrotated:
        prompt: Does moving no values from the front give a rotated sorted list?
        options:
          - { id: allowed, text: "Yes, the rule allows none, so a sorted list counts" }
          - { id: needs-drop, text: "No, a rotation needs at least one drop" }
          - { id: only-short, text: "Only when the list has fewer than three values" }
        correct: allowed
        explanation: >-
          The definition says some values, possibly none. A search on a rotated list has to handle
          that case too, where every part is in order.
      drop-first:
        prompt: Which values of `[2, 5, 6, 7, 9]` move to the back to give `[9, 2, 5, 6, 7]`?
        options:
          - { id: four, text: "The first four, `2, 5, 6, 7`" }
          - { id: one, text: "Only the 9, which moves to the front" }
          - { id: none, text: "None: values move from the back, so this is not a rotation" }
        correct: four
        explanation: >-
          Moving `2, 5, 6, 7` in order to the back leaves the 9 first. Any place for the drop works,
          including right after the first value.
      drop-last:
        prompt: Which values of `[2, 5, 6, 7, 9]` move to the back to give `[5, 6, 7, 9, 2]`?
        options:
          - { id: one, text: "Only the first one, the 2" }
          - { id: four, text: "The last four, `5, 6, 7, 9`" }
          - { id: none, text: "None: a list cannot end on its smallest value" }
        correct: one
        explanation: >-
          Moving the 2 to the back puts the drop just before the last value. The smallest value
          can sit anywhere, the last index included.
