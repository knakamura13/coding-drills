id: pointer-walks-checkpoint
title: "Pointer walks: checkpoint"
description: Unlink the n-th node from the end, or tell a cycle from repeated values, on new inputs. Each item combines safe hops, a gap or a speed, and where the walk stops.
heading: What does this give?

questions:
  - id: walk-exam-remove-head
    heading: What does this print?
    tags: [linked-list, two-pointers, python]
    prompt: |-
      This version opens a gap of `n + 1` and loops `while fast`. `values(n)` lists the values a
      walk from `n` reaches.

      ```python
      def remove_nth(head, n):
          dummy = Node(0, head)
          slow = fast = dummy
          for _ in range(n + 1):
              fast = fast.next
          while fast:
              slow = slow.next
              fast = fast.next
          slow.next = slow.next.next
          return dummy.next

      head = Node(4, Node(1, Node(8, Node(6, Node(3)))))
      head = remove_nth(head, 5)
      print(values(remove_nth(head, 4)))
      ```

      What does this print?
    options:
      - id: right
        text: "`[8, 6, 3]`"
        explanation: >-
          Six hops from the dummy take `fast` past the 3 onto `None`, so the `while` loop never
          runs and line 9 points the dummy past the 4. The list is now `[1, 8, 6, 3]`, four long,
          so `n = 4` is its length again and the second call drops the 1 the same way.
      - id: unchanged
        text: "`[4, 8, 6, 3]`"
        explanation: Look at which node's link line 9 rewrites in the first call.
      - id: second
        text: "`[4, 6, 3]`"
        explanation: Count the passes the `while` loop runs once `fast` has made its six hops.
      - id: raises
        text: It raises `AttributeError`
        explanation: Look at what the sixth hop reads, and from which node.
    correct: right
    followUps:
      unchanged:
        prompt: In the first call `slow` is still on the dummy when line 9 runs. What does that line do?
        options:
          - id: dummy-link
            text: The dummy's link now skips the 4, so the caller gets the 1
          - id: head-link
            text: It points the 4 past the 1, so the 1 goes
          - id: none-changes
            text: Nothing the caller sees, since the dummy is thrown away
        correct: dummy-link
        explanation: >-
          The dummy gives the head a node in front of it, which the head otherwise lacks.
          Rewriting the dummy's link removes the head, and
          returning `dummy.next` hands the caller the new first node, so the second call starts
          from the 1.
      second:
        prompt: After the first call's `for` loop, `fast` is `None`. How many times does `while fast` run?
        options:
          - id: zero-passes
            text: Zero, because `fast` is already `None`
          - id: one-pass
            text: Once, to move `slow` onto the 4
          - id: five-passes
            text: Five times, once per node
        correct: zero-passes
        explanation: >-
          A gap of `n + 1` from the dummy runs `fast` off the end when `n` is the length. `slow`
          stays on the dummy, one node before the head, in both calls.
      raises:
        prompt: The first call's sixth hop starts from the 3, the tail. What does `fast = fast.next` do there?
        options:
          - id: to-none
            text: It sets `fast` to `None`, and the loop ends
          - id: error
            text: It raises, because the tail has no next node
          - id: wraps
            text: It goes back to the dummy
        correct: to-none
        explanation: >-
          Reading `.next` from a real node is always safe, even when it holds `None`. Only reading
          `.next` from `None` raises, and nothing does that here: the `while` test stops first.

  - id: walk-exam-while-fast
    heading: What does this print?
    tags: [linked-list, two-pointers, python]
    prompt: |-
      This version loops on `while fast` instead of `while fast.next`. `values(n)` lists the
      values a walk from `n` reaches.

      ```python
      def remove_nth(head, n):
          dummy = Node(0, head)
          slow = fast = dummy
          for _ in range(n):
              fast = fast.next
          while fast:
              slow = slow.next
              fast = fast.next
          slow.next = slow.next.next
          return dummy.next

      print(values(remove_nth(Node(4, Node(6, Node(1, Node(3, Node(8))))), 2)))
      ```

      What does this print?
    options:
      - id: right
        text: "`[4, 6, 1, 3]`"
        explanation: >-
          The loop now runs until `fast` is `None`, one pass past the tail. `slow` ends on the 3
          instead of the 1, so line 9 removes the 8, the last node, instead of the 3.
      - id: intended
        text: "`[4, 6, 1, 8]`"
        explanation: Count how many passes run once the stopping test changes to `while fast`.
      - id: early
        text: "`[4, 6, 3, 8]`"
        explanation: Check whether the changed test makes the walk stop sooner or later.
      - id: raises
        text: It raises `AttributeError`
        explanation: Look at which node `slow` ends on, and whether it has a `next`.
    correct: right
    followUps:
      intended:
        prompt: Under `while fast`, where is `fast` when the loop ends?
        options:
          - id: past-tail
            text: On `None`
          - id: tail
            text: On the 8
          - id: before-tail
            text: On the 3
        correct: past-tail
        explanation: >-
          `while fast` keeps going as long as `fast` is a node, including the tail, so it ends one
          step past the tail. That extra pass moves `slow` one node too far, so the node after it
          is one too late.
      early:
        prompt: Compared with `while fast.next`, how many passes does `while fast` run?
        options:
          - id: one-more
            text: One more, since it also runs with `fast` on the tail
          - id: one-fewer
            text: One fewer, since `None` is reached sooner
          - id: same
            text: The same, since both stop at the end
        correct: one-more
        explanation: >-
          Both pointers move together, so an extra pass shifts `slow` one node toward the end.
          The removed node moves one toward the end as well.
      raises:
        prompt: When the loop ends, `slow` is on the 3. Is `slow.next.next` safe to read?
        options:
          - id: safe
            text: "Yes"
          - id: unsafe
            text: No, `slow.next` is `None`
          - id: slow-none
            text: No, `slow` is `None`
        correct: safe
        explanation: >-
          With `n = 2`, `slow` ends on the second node from the end, so `slow.next` is the 8, the
          tail, a real node. The read only fails when `n = 1`, where `slow` lands on the tail
          itself.

  - id: checkpoint-debug-cycle-guard
    heading: Which list does it fail on?
    tags: [linked-list, two-pointers, python]
    prompt: |-
      A suggested `has_cycle` should return `True` when the list has a cycle and `False` when it
      does not. One detail is slightly off:

      ```python
      def has_cycle(head):
          slow = fast = head
          while fast.next:
              slow = slow.next
              fast = fast.next.next
              if slow is fast:
                  return True
          return False
      ```

      "Links back to" means the tail's link leads to that earlier node. On which list does the call
      fail?
    options:
      - id: odd-no-cycle
        text: '`3 -> 8 -> 5`, no cycle'
        explanation: >-
          One pass takes `fast` from the 3 to the 5, the tail. The 5's `next` is `None`, so the
          test is false and the call returns `False`, which is right.
      - id: even-no-cycle
        text: '`3 -> 8 -> 5 -> 1`, no cycle'
        explanation: >-
          The second pass takes `fast` from the 5 past the tail, the 1, to `None`. The loop test
          then reads `None.next` and raises `AttributeError`. The test has to rule out `None`
          first, as `while fast and fast.next` does.
      - id: even-cycle
        text: '`3 -> 8 -> 5 -> 1`, and the 1 links back to the 8'
        explanation: >-
          With a cycle, `fast` never reaches `None`, so the test never reads through it. On the
          third pass both pointers land on the 1, and the call returns `True`, which is right.
      - id: single
        text: '`3`, a single node with no cycle'
        explanation: >-
          The only node's `next` is `None`, so the test is false at once and the call returns
          `False`, which is right. Reading `.next` from a real node is safe.
    correct: even-no-cycle
    followUps:
      odd-no-cycle:
        prompt: On a list with an odd number of nodes and no cycle, where does `fast` stop?
        options:
          - id: on-tail
            text: On the tail, so `fast.next` is read from a real node
          - id: past-tail
            text: On `None`, one step past the tail
          - id: before-tail
            text: On the node before the tail
        correct: on-tail
        explanation: >-
          `fast` lands on the first, third, fifth node and so on, so an odd length puts it on the
          tail. Only an even length sends it past the tail to `None`.
      even-cycle:
        prompt: In a list with a cycle, can `fast` ever become `None`?
        options:
          - id: never-none
            text: No, every node has a real `next`, so every hop lands on a node
          - id: at-tail
            text: Yes, once it passes the tail
          - id: on-even
            text: Yes, when the cycle has an even number of nodes
        correct: never-none
        explanation: >-
          The tail's link leads back into the list, so no link is `None`. A test that skips the
          `None` check only fails on a list that ends.
      single:
        prompt: "On the 1-node list, what does `while fast.next` do the first time?"
        options:
          - id: false-safe
            text: It reads `None` from a real node, so it is false and safe
          - id: raises
            text: It raises, since the node is the tail
          - id: runs
            text: It runs the body once, since `fast` is a node
        correct: false-safe
        explanation: >-
          Reading `.next` from a node is always safe, even when it holds `None`. The error needs
          `fast` itself to be `None`.

  - format: step-trace
    id: walk-exam-cycle-trace
    heading: Follow the walk
    tags: [linked-list, two-pointers, python]
    prompt: >-
      The cells are `5 -> 8 -> 3 -> 7 -> 3 -> 1` in order, and the 1 links back to the first 3, so
      the list has a cycle. The board cannot draw that link. Predict each step before it is shown.
    code: |
      def has_cycle(head):
          slow = fast = head
          while fast and fast.next:
              slow = slow.next
              fast = fast.next.next
              if slow is fast:
                  return True
          return False
    sequence:
      kind: array
      cells: [5, 8, 3, 7, 3, 1]
    start:
      - { name: slow, at: 0 }
      - { name: fast, at: 0 }
    steps:
      - line: 3
        ask: The first two passes run. Where is `fast` now?
        pointer: fast
        correct: 4
        explanation: >-
          Two hops a pass take `fast` from the 5 to the first 3, then to the second 3. `slow` is
          on the first 3.
        misses:
          - index: 2
            explanation: >-
              That is after one pass. The second pass takes `fast` two more nodes, to the second
              3.
          - index: 5
            explanation: >-
              Two passes of two hops cover four links from the 5, which reach the second 3, not the 1.
        elsewhere: 'Four links from the 5 reach the second 3.'
        also:
          - { name: slow, at: 2 }
      - line: 6
        ask: Both pointers are on a node holding 3. Is `slow is fast` true here?
        options:
          - id: different-nodes
            text: "No"
            explanation: >-
              `slow` is on the first 3 and `fast` on the second, two different nodes that both hold
              3. `is` asks about the node, not its value, so the walk goes on.
          - id: same-value
            text: "Yes"
            explanation: >-
              Both hold 3, but equal values are not one node. A value check would stop here, and
              on a list like this
              without the back link it would report a cycle that is not there.
        correct: different-nodes
      - line: 3
        ask: The third pass runs. Where is `fast` now?
        pointer: fast
        correct: 2
        explanation: >-
          One hop from the second 3 is the 1, and the 1 links back to the first 3. `fast` has gone
          around the cycle. `slow` moves to the 7.
        misses:
          - index: 5
            explanation: >-
              The 1 is one hop. The second hop follows the 1's link, which leads back to the first
              3.
          - index: 0
            explanation: >-
              The 1 links back to the first 3, not to the head. The 5 and the 8 are not in the
              cycle.
        elsewhere: 'Two hops from the second 3 go through the 1 and back to the first 3.'
        also:
          - { name: slow, at: 3 }
      - line: 3
        ask: The fourth pass runs. Where does `slow` meet `fast`?
        pointer: slow
        correct: 4
        explanation: >-
          `slow` moves from the 7 to the second 3, and `fast` goes from the first 3, through the 7,
          to the second 3. Now `slow is fast`, and the function returns `True`.
        misses:
          - index: 2
            explanation: >-
              `fast` was on the first 3, but it moves two hops this pass, to the second 3, and
              `slow` moves there too.
          - index: 5
            explanation: >-
              `slow` moves one node a pass, from the 7 to the second 3. The 1 is one further.
        elsewhere: '`slow` takes one hop from the 7, to the second 3, where `fast` also lands.'
        also:
          - { name: fast, at: 4 }
