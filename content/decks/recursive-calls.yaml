id: recursive-calls
title: Recursion
description: Name the call that stops, trace the smaller call each one makes, follow each value back up, and count the calls that are live at once. Each card asks for one decision, with a worked example on hand.
heading: What happens next?

questions:
  - id: sum-empty-stop
    heading: Which stopping case works?
    tags: [recursion]
    workedExample: |-
      A recursive function calls itself on a smaller input, and every chain of calls has to end at
      a stopping case: a call that returns without calling again. Consider `countdown(2)`, which
      prints `go` and returns when `n == 0`, and otherwise prints `n` and calls `countdown(n - 1)`.

      1. `countdown(2)` prints 2 and calls `countdown(1)`, which prints 1 and calls `countdown(0)`.
         Each call passes `n - 1`, so the input shrinks by 1 every time.
      2. `countdown(0)` meets `n == 0`, so it prints `go` and returns before it reaches the line
         that calls again. That call is the stopping case.
      3. So the output is 2, then 1, then `go`. The calls stop because every chain shrinks `n`
         until it lands exactly on 0.
    prompt: |-
      A recursive function calls itself on a smaller input. A stopping case is a call that returns
      without calling again, and every chain of calls has to reach one. `total` adds up a list, and
      each call passes `nums[1:]`, a slice one item shorter:

      ```python
      def total(nums):
          ???
          return nums[0] + total(nums[1:])
      ```

      Which line works in place of `???` for every list, including `[]`?
    options:
      - id: empty
        text: "`if not nums: return 0`"
        explanation: >-
          Every slice is one item shorter, so every chain of calls ends on `[]`. That call returns
          before it reads `nums[0]`, and 0 leaves the sum as it is. `total([])` gives 0 and
          `total([3, 4])` gives 7.
      - id: one-left
        text: "`if len(nums) == 1: return nums[0]`"
        explanation: >-
          This works for `[3, 4]`, but `total([])` skips the check and reads `nums[0]` of a list
          with nothing in it, which raises IndexError.
      - id: zero-value
        text: "`if nums[0] == 0: return 0`"
        explanation: >-
          This tests what the first item holds. `total([3, 4])` never meets a 0, so the slices
          shrink to `[]` and `nums[0]` raises IndexError.
      - id: return-one
        text: "`if not nums: return 1`"
        explanation: >-
          The check is in the right place, but the value is off. Every call adds its item to what
          the call on `[]` returns, so `total([3, 4])` gives 8.
    correct: empty
    followUps:
      one-left:
        prompt: With the `len(nums) == 1` check, what happens on `total([])`?
        options:
          - id: index-error
            text: The check is false, so `nums[0]` runs on an empty list and raises IndexError
          - id: zero
            text: It returns 0, since there is nothing to add
          - id: none
            text: It returns `None`, since no line returns a value
        correct: index-error
        explanation: >-
          An empty list never has length 1, so that call goes straight to the last line. A
          stopping case has to catch the smallest input the function can get, and here that is
          `[]`.
      zero-value:
        prompt: What does a stopping case for `total` need to check?
        options:
          - id: size
            text: How many items are left, since the slices shrink toward `[]`
          - id: item
            text: Whether the current item is 0, since 0 adds nothing
          - id: target
            text: Whether the sum so far has reached some target
        correct: size
        explanation: >-
          Each call removes one item, so the length is what changes from call to call. A check on
          a value can be missed by every call, as it is on `[3, 4]`.
      return-one:
        prompt: "`total([])` should be the sum of no numbers. What is that sum?"
        options:
          - id: zero
            text: 0, because adding it to any sum leaves that sum unchanged
          - id: one
            text: 1, because the call still counts as one step
          - id: none
            text: "`None`, because there are no numbers to add"
        correct: zero
        explanation: >-
          The empty call's value is added into every other result. Only 0 keeps the total of
          `[3, 4]` at 7.

  - id: deleted-stop
    heading: What does this call do?
    tags: [recursion]
    workedExample: |-
      Consider `countdown(1)` with its stopping case, where a call prints `go` and returns when
      `n == 0`. Otherwise it prints `n` and calls `countdown(n - 1)`.

      1. `n` is 1, so the test `n == 0` is false. The call prints 1 and calls `countdown(0)`.
      2. In `countdown(0)`, the test `n == 0` is true, so the stopping case runs: it prints `go` and
         returns.
      3. That `return` comes before the line that calls again, so `countdown(-1)` is never made, and
         the run ends.
    prompt: |-
      ```python
      def countdown(n):
          if n == 0:
              print("go")
              return
          print(n)
          countdown(n - 1)
      ```

      A slip deleted the stopping case:

      ```python
      def countdown(n):
          print(n)
          countdown(n - 1)
      ```

      `countdown(2)` prints 2 and 1, then calls `countdown(0)`. What does that call do?
    options:
      - id: goes-negative
        text: Prints 0 and calls `countdown(-1)`
        explanation: >-
          Nothing in the body tests `n` any more. So 0 is printed like any other number, and the
          calls go on to -1, -2 and beyond. No call stops on its own. Only Python's limit on
          nested calls ends the run, with RecursionError.
      - id: zero-stops
        text: Returns, because `n` has counted down to 0
        explanation: >-
          0 is special only when a line tests for it. With the check deleted, this call does the
          same two things every call does.
      - id: zero-error
        text: Raises an error at once, because `n` can't go below 0
        explanation: >-
          `n` is a plain integer, and Python lets `n - 1` go below zero. This call prints 0 and
          calls again like the others.
      - id: prints-go
        text: Prints `go` and returns, as the first version of `countdown` does
        explanation: >-
          The `go` line lived inside the deleted stopping case. The body that is left only prints
          `n` and calls again.
    correct: goes-negative
    followUps:
      zero-stops:
        prompt: What makes a call stop instead of calling again?
        options:
          - id: test-returns
            text: A test on the argument that returns before the recursive call
          - id: reaches-zero
            text: Nothing is needed, a call stops once its argument reaches 0
          - id: print-ends
            text: The `print`, which ends the call once the value is shown
        correct: test-returns
        explanation: >-
          Python gives 0 no special meaning. A call stops only where the code returns before
          making the next call, and this version has no such line.
      zero-error:
        prompt: What is `n - 1` when `n` is 0?
        options:
          - id: minus-one
            text: -1, an ordinary integer
          - id: error
            text: An error, since a count can't be negative
          - id: stays-zero
            text: 0, since integers stop at zero
        correct: minus-one
        explanation: >-
          Python integers go below zero with no complaint. A countdown that should stop at 0
          needs code that says so.
      prints-go:
        prompt: In the first version of `countdown`, which part prints `go`?
        options:
          - id: stop-branch
            text: The stopping case, which this version no longer has
          - id: last-line
            text: The last line, which runs once the countdown ends
          - id: python
            text: Python itself, when a recursion finishes
        correct: stop-branch
        explanation: >-
          `go` came from the branch that ran when `n == 0`. Deleting that branch removes both the
          message and the stop.

  - id: palindrome-third-call
    format: drag-pointers
    heading: Where does the call start?
    tags: [recursion, arrays-strings]
    workedExample: |-
      Consider `is_pal("level", 0, 4)`. Each call compares `s[lo]` with `s[hi]` and, when they
      match, calls again with `lo + 1` and `hi - 1`.

      1. The first call compares `s[0] = 'l'` with `s[4] = 'l'`. They match, so it calls
         `is_pal("level", 1, 3)`.
      2. The second call compares `s[1] = 'e'` with `s[3] = 'e'`. They match, so it calls
         `is_pal("level", 2, 2)`.
      3. In the third call `lo >= hi` holds, since `2 >= 2`, so it returns True. Each call checked
         one pair and passed on the pair just inside it.
    prompt: >-
      The pointers show the first call on `"rotator"`. Drag `lo` and `hi` to where the third call
      starts.
    code: |
      def is_pal(s, lo, hi):
          if lo >= hi:
              return True
          if s[lo] != s[hi]:
              return False
          return is_pal(s, lo + 1, hi - 1)

      is_pal("rotator", 0, 6)
    sequence:
      kind: string
      name: s
      cells: [r, o, t, a, t, o, r]
    pointers:
      - name: lo
        start: 0
        correct: 2
        explanation: >-
          The first call has `lo = 0`, the second `lo = 1`, and the third `lo = 2`. Each call
          passes `lo + 1`.
        misses:
          - index: 1
            explanation: >-
              That is the second call. The first call, `is_pal(s, 0, 6)`, counts as one, so the third
              call is two steps in.
          - index: 3
            explanation: >-
              That is the fourth call, where `lo` meets `hi` and the stopping case returns True. The
              first call already counts as one.
          - index: 0
            explanation: '`lo` belongs to the first call here. Every later call passes `lo + 1`.'
        elsewhere: Each call moves `lo` one cell right, so the third call starts with `lo` at index 2.
      - name: hi
        start: 6
        correct: 4
        explanation: >-
          `hi` steps left once per call: 6, then 5, then 4. The third call compares `t` with `t`.
        misses:
          - index: 5
            explanation: >-
              That is the second call. Count the first call, `is_pal(s, 0, 6)`, as one.
          - index: 3
            explanation: >-
              That is the fourth call, where `lo` and `hi` meet. The first call already counts as
              one.
          - index: 6
            explanation: '`hi` moves too. Every call passes `hi - 1`.'
        elsewhere: Each call moves `hi` one cell left, so the third call starts with `hi` at index 4.

  - id: empty-suffix-call
    format: tap-cell
    heading: Where does the input start?
    tags: [recursion, arrays-strings]
    workedExample: |-
      Consider `count_a("ab")`. Each call returns 0 when `s == ""`, and otherwise calls
      `count_a(s[1:])`, the string without its first letter.

      1. The first call has `s = "ab"`. It is not empty, so it calls `count_a("b")`.
      2. The second call has `s = "b"`, still not empty, so it calls `count_a("b"[1:])`, which is
         `count_a("")`.
      3. The third call meets `s == ""` and returns 0. So there are three calls, one per letter plus
         one for the empty string.
    prompt: >-
      A suffix is the part of a string from some index to the end. Every call's `s` is a suffix of
      `"banana"`, and the slot after the last letter stands for the empty suffix, `""`. Tap where
      the `s` of the call that meets `s == ""` starts.
    code: |
      def count_a(s):
          if s == "":
              return 0
          rest = count_a(s[1:])
          return rest + (1 if s[0] == "a" else 0)

      count_a("banana")
    sequence:
      kind: string
      name: s
      cells: [b, a, n, a, n, a]
      pastEnd: true
    correct: 6
    explanation: >-
      Each call drops one letter: `"banana"`, `"anana"`, and so on down to `"a"`. The call on `"a"`
      still has a letter, so it calls once more with `"a"[1:]`, which is `""`. That seventh call
      starts past the last letter, and it is the one that stops.
    misses:
      - index: 0
        explanation: That is the first call, on the whole string. It has letters, so it calls again.
      - index: 1
        explanation: That is the second call, on `"anana"`. It still has letters to drop.
      - index: 2
        explanation: That is the third call, on `"nana"`. It still has letters to drop.
      - index: 3
        explanation: That is the fourth call, on `"ana"`. It still has letters to drop.
      - index: 4
        explanation: That is the fifth call, on `"na"`. It still has letters to drop.
      - index: 5
        explanation: >-
          That is the sixth call, on `"a"`. It is not empty, so it calls once more with `"a"[1:]`.

  - id: halving-call
    heading: Which calls run?
    tags: [recursion]
    workedExample: |-
      Consider `digit_count(345)`, where a call returns 0 when `n == 0` and otherwise returns
      `1 + digit_count(n // 10)`. `//` divides and rounds down to a whole number.

      1. The first call has `n = 345`. It is not 0, so it calls with `345 // 10`, which is 34,
         since 34.5 rounds down.
      2. The call with 34 is not 0 either, so it passes `34 // 10`, which is 3. The call with 3
         passes `3 // 10`, which is 0, since 0.3 rounds down.
      3. The call with 0 meets `n == 0` and returns. So the calls get 345, 34, 3 and 0: one call
         per digit, plus the call that stops.
    prompt: |-
      `//` divides and rounds down to a whole number.

      ```python
      def halve_count(n):
          if n == 0:
              return 0
          return 1 + halve_count(n // 2)
      ```

      `halve_count(13)` runs. Which values of `n` do the calls get, in order, the first call
      included?
    options:
      - id: halves
        text: 13, 6, 3, 1, 0
        explanation: >-
          `13 // 2` is 6, since 6.5 rounds down. Then 6 gives 3, 3 gives 1, and `1 // 2` is 0.
          The call with 0 meets the stopping case, so five calls run.
      - id: stops-at-one
        text: 13, 6, 3, 1
        explanation: >-
          That stops one call early. The only test is `n == 0`, and 1 is not 0, so the call with
          1 calls once more, with `1 // 2`.
      - id: rounds-up
        text: 13, 7, 4, 2, 1, then 1 again without end
        explanation: >-
          That rounds 6.5 up to 7. Rounded up, half of 1 would be 1 again, so the calls would never
          reach 0. `//` rounds down, so `13 // 2` is 6 and `1 // 2` is 0.
      - id: minus-one
        text: 13, 12, 11 and so on down to 0
        explanation: >-
          That steps down by one, as a call on `n - 1` would. This call passes `n // 2`, so `n`
          halves each time.
    correct: halves
    followUps:
      stops-at-one:
        prompt: "`halve_count(1)` runs. Does it call again?"
        options:
          - id: calls
            text: Yes, with `1 // 2`, which is 0
          - id: last
            text: No, 1 is the last value before 0, so it stops
          - id: cannot
            text: No, `1 // 2` has no whole-number answer
        correct: calls
        explanation: >-
          The only stopping test is `n == 0`. A call with 1 fails it, so it calls once more, and
          that call with 0 is the one that returns 0.
      rounds-up:
        prompt: What is `13 // 2`?
        options:
          - id: six
            text: 6, since `//` rounds 6.5 down
          - id: seven
            text: 7, since 6.5 rounds up
          - id: half
            text: 6.5, since 13 is odd
        correct: six
        explanation: >-
          `//` always rounds down to a whole number, so an odd `n` loses its half: 13 gives 6, and
          3 gives 1.
      minus-one:
        prompt: Which argument does `halve_count(n)` pass to its smaller call?
        options:
          - id: half
            text: "`n // 2`, about half of `n`"
          - id: one-less
            text: "`n - 1`, one less than `n`"
          - id: two-less
            text: "`n - 2`, two less than `n`"
        correct: half
        explanation: >-
          A smaller call can shrink its input by any rule that still lands on the stopping case.
          Here each call halves `n`, so 13 reaches 0 in four steps.

  - id: split-second-call
    format: drag-pointers
    heading: Which call starts next?
    tags: [recursion]
    workedExample: |-
      Consider `total(nums, 0, 3)` on four cells. A call on one cell returns that cell. Any other
      call splits at `mid = (lo + hi) // 2`, calls on `lo` to `mid`, and only once that call has
      returned, calls on `mid + 1` to `hi`.

      1. `total(nums, 0, 3)` splits at `(0 + 3) // 2`, which is 1, and starts `total(nums, 0, 1)`.
      2. `total(nums, 0, 1)` is a call like any other, so it splits at 0 and starts
         `total(nums, 0, 0)` before anything else happens. That call returns at once, and
         `total(nums, 1, 1)` starts next.
      3. Only after `total(nums, 0, 1)` returns does `total(nums, 0, 3)` reach its next line and
         start `total(nums, 2, 3)`. So the calls start in the order 0 to 3, 0 to 1, 0 to 0, 1 to
         1, 2 to 3, 2 to 2 and 3 to 3.
    prompt: >-
      `total(nums, lo, hi)` adds up the cells from index `lo` to index `hi`. It splits its range at
      `mid` and makes two calls, and each line runs only after the call on the line before it has
      returned. `total(nums, 0, 5)` has just started `total(nums, 0, 2)`, which the pointers show.
      Drag `lo` and `hi` to the range of the next call that starts.
    code: |
      def total(nums, lo, hi):
          if lo == hi:
              return nums[lo]
          mid = (lo + hi) // 2
          left = total(nums, lo, mid)
          right = total(nums, mid + 1, hi)
          return left + right

      total([4, 1, 7, 3, 8, 2], 0, 5)
    sequence:
      kind: array
      name: nums
      cells: [4, 1, 7, 3, 8, 2]
    pointers:
      - name: lo
        start: 0
        correct: 0
        explanation: >-
          `total(nums, 0, 2)` makes its own first call before anything else, and that call keeps
          `lo` at 0.
        misses:
          - index: 3
            explanation: >-
              Index 3 starts `total(nums, 3, 5)`, the second call of `total(nums, 0, 5)`. That
              line runs only after `total(nums, 0, 2)` and every call it makes have returned.
        elsewhere: '`total(nums, 0, 2)` calls on `lo` to `mid`, so the next call keeps `lo` at 0.'
      - name: hi
        start: 2
        correct: 1
        explanation: >-
          `total(nums, 0, 2)` splits at `(0 + 2) // 2`, which is 1, and its first call covers 0 to
          1.
        misses:
          - index: 5
            explanation: >-
              5 is the end of `total(nums, 3, 5)`, the second call of `total(nums, 0, 5)`. That
              call waits until `total(nums, 0, 2)` has returned, and it has only just started.
          - index: 2
            explanation: >-
              That is `total(nums, 0, 2)` itself, which is already running. It splits at `mid`,
              which is 1, and calls on 0 to 1.
          - index: 0
            explanation: >-
              `total(nums, 0, 0)` starts later, as the first call of `total(nums, 0, 1)`. The call
              on 0 to 1 has to start before it.
        elsewhere: '`mid` is `(0 + 2) // 2`, which is 1, so the next call ends at index 1.'

  - id: reverse-return
    heading: What does it return?
    tags: [recursion]
    workedExample: |-
      Consider `rev("hi")`, where `rev(s)` returns `""` when `s == ""` and otherwise returns
      `rev(s[1:]) + s[0]`.

      1. `rev("hi")` calls `rev("i")`, which calls `rev("")`. That last call meets the stopping case
         and returns `""`.
      2. `rev("i")` gets `""` back and returns `"" + "i"`, which is `"i"`.
      3. `rev("hi")` gets `"i"` back and puts its own first letter after it: `"i" + "h"`, which is
         `"ih"`.
    prompt: |-
      ```python
      def rev(s):
          if s == "":
              return ""
          return rev(s[1:]) + s[0]
      ```

      What does `rev("cat")` return?
    options:
      - id: tac
        text: '`"tac"`'
        explanation: >-
          `rev("")` returns `""`. `rev("t")` puts `t` on the end of that, `rev("at")` puts `a`
          after it, and `rev("cat")` puts `c` last. Each call adds its first letter behind what
          the smaller call returned.
      - id: cat
        text: '`"cat"`'
        explanation: >-
          That keeps the letters in the order the calls were made. Look at which side of the `+`
          the current letter sits on.
      - id: empty
        text: '`""`'
        explanation: >-
          `""` is what the deepest call returns, but the calls above it are not done. Each one
          still adds a letter once the result comes back.
      - id: last-letter
        text: '`"t"`'
        explanation: >-
          `"t"` is what `rev("t")` returns. Two calls above it have not returned yet, and each
          one adds a letter.
    correct: tac
    followUps:
      cat:
        prompt: In `rev(s[1:]) + s[0]`, where does the current call's letter go?
        options:
          - id: after
            text: After everything the smaller call returned
          - id: before
            text: Before everything the smaller call returned
          - id: in-place
            text: Back where it was in `s`
        correct: after
        explanation: >-
          The smaller call's result is on the left of the `+`, so it comes first. The first letter
          of `s` ends up last.
      empty:
        prompt: '`rev("t")` gets `""` back from `rev("")`. What does `rev("t")` return?'
        options:
          - id: adds-t
            text: '`"t"`, the empty string with its own letter added'
          - id: unchanged
            text: '`""`, passing the result up unchanged'
          - id: nothing
            text: Nothing, since the stopping case already returned
        correct: adds-t
        explanation: >-
          A call that waits on a smaller call still finishes its own line once the result comes
          back. Here that line adds one letter.
      last-letter:
        prompt: When `rev("t")` returns, how many calls have started and not yet returned?
        options:
          - id: two
            text: Two, `rev("at")` and `rev("cat")`
          - id: zero
            text: None, the first call to return ends the whole thing
          - id: one
            text: One, the call that started everything
        correct: two
        explanation: >-
          Each call waits until the call it made returns. The final result appears only after
          every call above has finished its line.

  - id: missing-return
    heading: What does it return?
    tags: [recursion, python]
    workedExample: |-
      Consider `last([2, 7])`, where `last(nums)` returns `nums[0]` when `len(nums) == 1` and
      otherwise runs `return last(nums[1:])`.

      1. `[2, 7]` has 2 items, so the call runs `return last(nums[1:])`, which calls `last([7])`.
      2. `[7]` has 1 item, so `last([7])` returns `nums[0]`, which is 7, to the expression that
         called it.
      3. That expression sits after `return` in `last([2, 7])`, so the 7 is handed back one more
         level, and `last([2, 7])` returns 7.
    prompt: |-
      A slip dropped the `return` in front of the recursive call:

      ```python
      def last(nums):
          if len(nums) == 1:
              return nums[0]
          last(nums[1:])
      ```

      What does `last([4, 8, 6])` return?
    options:
      - id: none
        text: "`None`"
        explanation: >-
          `last([6])` hands 6 to `last([8, 6])`, but that call throws the value away and reaches
          the end of its body. The top call does the same with what it gets back. A Python function
          that ends without `return` gives `None`.
      - id: six
        text: "`6`"
        explanation: >-
          6 goes back to `last([8, 6])`. Check what that call does with the value it receives.
      - id: four
        text: "`4`"
        explanation: >-
          4 is the first item, but the only line that returns an item is the stopping case, and
          that runs only on a one-item list.
      - id: error
        text: It raises an error, because a call returned nothing
        explanation: >-
          Ending a function without `return` is allowed in Python. No error happens unless later
          code tries to use the missing value.
    correct: none
    followUps:
      six:
        prompt: "`last([8, 6])` runs `last(nums[1:])` and gets 6 back. What does `last([8, 6])` return?"
        options:
          - id: dropped
            text: "`None`, because the 6 is discarded and the body ends"
          - id: passes-up
            text: 6, because a returned value passes up on its own
          - id: own-item
            text: 8, its own first item
        correct: dropped
        explanation: >-
          A value goes back one level only, to the expression that made the call. Without `return`
          in front of that call, the value is dropped.
      four:
        prompt: Which call runs `return nums[0]`?
        options:
          - id: one-item
            text: Only the call on `[6]`, the one-item list
          - id: every
            text: Every call, before it recurses
          - id: first
            text: The first call, on `[4, 8, 6]`
        correct: one-item
        explanation: >-
          That line runs only when `len(nums) == 1`. Longer lists skip it and go straight to the
          recursive call.
      error:
        prompt: What does a Python function give back when its body ends with no `return`?
        options:
          - id: none
            text: "`None`, with no error raised"
          - id: type-error
            text: A `TypeError`, since a value was expected
          - id: zero
            text: 0, the default number
        correct: none
        explanation: >-
          Falling off the end of a function is the same as `return None`. An error comes only if
          later code treats that `None` as a number.

  - id: first-negative-index
    format: tap-cell
    heading: Which cell does it return?
    tags: [recursion]
    workedExample: |-
      Consider `first_neg([3, -6, 1], 0)`. Each call returns `i` when `nums[i] < 0`, and otherwise
      returns whatever `first_neg(nums, i + 1)` returns.

      1. The call at `i = 0` sees 3, which is not negative, so it calls `first_neg(nums, 1)` and
         waits.
      2. The call at `i = 1` sees -6, which is negative, so it returns 1 without calling again.
      3. The call at `i = 0` returns that 1 unchanged, so the result is 1, the index of the first
         negative value. No call ever looks at `nums[2]`.
    prompt: >-
      Tap the cell whose index `first_neg(nums, 0)` returns.
    code: |
      def first_neg(nums, i):
          if i == len(nums):
              return -1
          if nums[i] < 0:
              return i
          return first_neg(nums, i + 1)

      nums = [4, 7, -2, 5, -1]
      first_neg(nums, 0)
    sequence:
      kind: array
      name: nums
      cells: [4, 7, -2, 5, -1]
    correct: 2
    explanation: >-
      The calls at `i = 0` and `i = 1` see 4 and 7 and pass the question on. The call at `i = 2`
      sees -2 and returns 2 without calling again. Each call above it returns that same 2.
    misses:
      - index: 0
        explanation: >-
          The first call has `i = 0`, but 4 is not negative. It returns whatever the call at
          `i = 1` gives back, never its own `i`.
      - index: 1
        explanation: >-
          7 is not negative, so the call at `i = 1` does not return 1. It returns what the next call
          gives it.
      - index: 3
        explanation: The calls stopped at `i = 2`. No call ever looks at the 5.
      - index: 4
        explanation: >-
          -1 is negative too, but the call at `i = 2` returned before any call reached index 4.

  - id: count-live-calls
    heading: How many calls are live?
    tags: [recursion]
    workedExample: |-
      Consider the same `total` on four cells, `total(nums, 0, 3)`, at the moment
      `total(nums, 1, 1)` runs. A call is live from when it starts until it returns.

      1. `total(nums, 0, 3)` started `total(nums, 0, 1)`, which started `total(nums, 0, 0)`. That
         call returned at once, so it is no longer live.
      2. `total(nums, 0, 1)` then started `total(nums, 1, 1)`, its second call. So
         `total(nums, 0, 3)`, `total(nums, 0, 1)` and `total(nums, 1, 1)` have started and not
         returned.
      3. So 3 calls are live at that moment, although the whole run makes 7. The calls on 2 to 3
         have not started yet.
    prompt: |-
      A live call is one that has started and not returned, and Python keeps a record of each live
      call, called a frame. When about 1,000 calls are live at once, Python stops the run with
      RecursionError. This `total` adds up the cells from index `lo` to index `hi` by making
      a call on each half:

      ```python
      def total(nums, lo, hi):
          if lo == hi:
              return nums[lo]
          mid = (lo + hi) // 2
          left = total(nums, lo, mid)
          right = total(nums, mid + 1, hi)
          return left + right
      ```

      `nums` has 12 cells, and `total(nums, 0, 11)` runs. While `total(nums, 0, 0)` runs, how many
      calls are live, the first call included?
    options:
      - id: five
        text: "5"
        explanation: >-
          The live calls are on 0 to 11, 0 to 5, 0 to 2, 0 to 1 and 0 to 0, each one started and
          not returned. No call on the right half has started yet.
      - id: four
        text: "4"
        explanation: >-
          That leaves one call out. The four calls that split on the way down to index 0 are live,
          and so is `total(nums, 0, 0)` itself, which has started and not returned.
      - id: twelve
        text: "12"
        explanation: >-
          That counts one call per cell. While `total(nums, 0, 0)` runs, the calls on the other
          cells have not started yet.
      - id: twenty-three
        text: "23"
        explanation: >-
          That is how many calls the whole run makes. A call is live only between its start and
          its return, and most of these calls have not started yet.
    correct: five
    followUps:
      four:
        prompt: >-
          `total(nums, 0, 0)` returns without calling again. Is it live while it runs?
        options:
          - id: live
            text: Yes, it has started and not returned
          - id: no-calls
            text: No, a call that makes no calls is never live
          - id: splitters
            text: No, only the calls that split count
        correct: live
        explanation: >-
          Live means started and not yet returned, whatever the call does. The stopping call counts
          too, on top of the four calls that split on the way to it.
      twelve:
        prompt: Which calls are live while `total(nums, 0, 0)` runs?
        options:
          - id: holds-zero
            text: The calls whose range holds index 0, from the widest down
          - id: per-cell
            text: One call for each cell of `nums`
          - id: running
            text: Only `total(nums, 0, 0)`, the call that is running
        correct: holds-zero
        explanation: >-
          Every live call but the running one is waiting on the call it made. Only the ranges that
          hold index 0 lead down to `total(nums, 0, 0)`, and the calls on the other cells have not
          started yet.
      twenty-three:
        prompt: When `total(nums, 0, 0)` starts, has `total(nums, 6, 11)` started?
        options:
          - id: not-yet
            text: No, it starts only after `total(nums, 0, 5)` returns
          - id: all-start
            text: Yes, every call starts when the first call does
          - id: parallel
            text: Yes, the two halves run at the same time
        correct: not-yet
        explanation: >-
          The second call's line runs only once the first call has returned. So the calls on the
          right half start after the whole left half is done, and none of them is live yet.
