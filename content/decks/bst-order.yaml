            /    \
          30      70
         /  \    /  \
        20  40  60  80
            /
           35
      ```
    code: |-
      def lca(node, p, q):
          while node is not None:
              if p < node.val and q < node.val:
                  node = node.left
              elif p > node.val and q > node.val:
                  node = node.right
              else:
                  return node
