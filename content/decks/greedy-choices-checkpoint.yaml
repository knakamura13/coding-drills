id: greedy-choices-checkpoint
title: "Greedy choices: checkpoint"
description: Change one constraint and decide whether a greedy rule survives, with a counterexample or the fact that keeps it safe. Each item combines the Greedy choices skills.
heading: Does the rule survive?

questions:
  - id: greedy-exam-gift-values
    heading: Does the rule survive?
    tags: [greedy]
    prompt: >-
      "Buy the cheapest gift left while it fits" buys the most gifts within a budget. Now each
      gift has a value, and the goal changes to the most total value within a budget of 20. Gift
      A costs 4 and is worth 5, gift B costs 6 and is worth 6, and gift C costs 16 and is worth
      30. Does cheapest first still give the best result?
    options:
      - id: breaks
        text: No, it buys A and B for a value of 11, while A and C give 35
        explanation: >-
          Cheapest first buys A and B (10 spent), and C no longer fits in the 10 left. A and C
          cost exactly 20 and are worth 35. The rule was safe only because every gift added the
          same 1. With values, a cheap gift can crowd out a valuable one.
      - id: survives
        text: Yes, a cheaper gift always leaves more budget for the rest
        explanation: It leaves more budget, but is each gift still worth the same?
      - id: over-budget
        text: No, it buys A, B and C, which goes over the budget
        explanation: Does the rule buy a gift that does not fit in what is left?
      - id: ties
        text: Yes, as long as no two gifts have the same price
        explanation: No two prices tie here. What does the rule end with, and what is the best?
    correct: breaks
    followUps:
      survives:
        prompt: In the gift-count problem, what did each gift add to the goal, and what does it add now?
        options:
          - { id: worth, text: 'Each added 1 before, and now each adds its own value' }
          - { id: same, text: 'Each adds 1 in both problems' }
          - { id: price, text: 'Each adds its price in both problems' }
        correct: worth
        explanation: >-
          The swap argument for cheapest first needs every gift to be worth the same. Once values
          differ, saving money on a cheap gift can cost a much more valuable one.
      over-budget:
        prompt: After A and B, 10 of the budget is left. What does the rule do with C, which costs 16?
        options:
          - { id: skip, text: 'It leaves C out, since 16 is more than 10' }
          - { id: buy, text: 'It buys C and goes 6 over' }
          - { id: swap, text: 'It returns B to make room for C' }
        correct: skip
        explanation: >-
          The rule only buys what fits, and it never returns a gift. It stops at A and B, worth
          11, which is why it loses to A and C.
      ties:
        prompt: What does cheapest first end with here, and what is the best value within 20?
        options:
          - { id: loses, text: '11 from A and B, while A and C give 35' }
          - { id: wins, text: '35 from A and C, which is the best' }
          - { id: equal, text: '11, and nothing else fits in 20' }
        correct: loses
        explanation: >-
          The prices are all different and the rule still loses. Ties were never the problem; the
          change in what each gift is worth was.

  - id: greedy-exam-reused-boards
    heading: Does the rule survive?
    tags: [greedy]
    prompt: >-
      "Take the longest board left" covers at least a target with the fewest boards when each
      board is used once. Now boards of 3, 5 and 8 metres can be used as many times as needed,
      and the target is at least 30 metres. The rule takes 8 four times, for 32 metres. Does
      longest first still give the fewest boards, and why?
    options:
      - id: survives
        text: Yes, any 3 boards total at most 24, so 4 boards is the fewest
        explanation: >-
          Each board adds at most 8, so 3 boards reach at most 24, short of 30. Four 8s reach 32.
          The rule survives because the goal is "at least": going over costs nothing.
      - id: exact-mix
        text: No, four 8s overshoot to 32, and a mix can land on exactly 30
        explanation: Does landing exactly on 30 use fewer boards than going over?
      - id: like-coins
        text: No, like coin change, largest first fails once lengths repeat
        explanation: Does coin change ask for at least an amount, or exactly that amount?
      - id: not-multiple
        text: Yes, but only because 30 is not a multiple of 8
        explanation: Would the rule fail if the target were 32 instead?
    correct: survives
    followUps:
      exact-mix:
        prompt: What is the fewest boards that total exactly 30?
        options:
          - { id: five, text: 'Five, such as 8 + 8 + 8 + 3 + 3' }
          - { id: four, text: 'Four, such as 8 + 8 + 8 + 6' }
          - { id: three, text: 'Three, such as 8 + 8 + 5' }
        correct: five
        explanation: >-
          No four boards of 3, 5 and 8 total 30 (and there is no 6), so an exact fit needs five.
          For an "at least" goal, overshooting with four 8s is better.
      like-coins:
        prompt: Why can largest first fail for coin change but not here?
        options:
          - { id: exact, text: 'Coins must pay exactly, so a large coin can leave a rest only small coins pay' }
          - { id: repeat, text: 'Coins cannot repeat, so a large coin can use up the only one of its value' }
          - { id: count, text: 'Coin sets have no 1, so a large coin can leave a rest that nothing pays' }
        correct: exact
        explanation: >-
          With an exact amount, a large coin can leave a remainder that only small coins pay: with
          coins 1, 3 and 4, largest first pays 6 as 4 + 1 + 1 instead of 3 + 3. Here going over is
          allowed, so a final gap of at most 8 is covered by one more 8.
      not-multiple:
        prompt: If the target were 32 metres, how many boards would the rule use, and is that the fewest?
        options:
          - { id: four, text: 'Four 8s, and no 3 boards reach 32, so it is the fewest' }
          - { id: fails, text: 'Four 8s, but a mix of 5s and 3s uses fewer' }
          - { id: five, text: 'Five, since the rule overshoots' }
        correct: four
        explanation: >-
          The argument is that k boards total at most 8k. It holds for every target, whether or
          not it is a multiple of 8.

  - id: greedy-exam-tap-new-coin
    format: tap-cell
    heading: Tap the smallest amount that breaks the rule
    tags: [greedy]
    prompt: >-
      With coins 1, 5 and 10, taking the largest coin that fits always uses the fewest coins. A
      12 coin is added. Each cell is an amount owed. Tap the smallest amount the rule now pays
      with more coins than it needs.
    code: |
      coins = [12, 10, 5, 1]   # largest first
    sequence: { kind: array, name: amount, cells: [11, 12, 13, 14, 15, 16, 17] }
    correct: 4
    explanation: >-
      The rule pays 15 as 12 + 1 + 1 + 1, four coins, while 10 + 5 is two. The 12 leaves 3, which
      only 1s can pay. Before the 12 was added, the rule paid 15 with 10 + 5.
    misses:
      - index: 0
        explanation: The 12 does not fit, so the rule pays 10 + 1, two coins, the best for 11.
      - index: 1
        explanation: One 12 pays it.
      - index: 2
        explanation: The rule pays 12 + 1, two coins. No single coin is 13, so two is the best.
      - index: 3
        explanation: >-
          The rule pays 12 + 1 + 1, three coins. No two coins add up to 14 (10 + 5 is 15, 12 + 1
          is 13), so three is the best.
      - index: 5
        explanation: >-
          The rule loses here too, 12 + 1 + 1 + 1 + 1 against 10 + 5 + 1, but 15 is a smaller
          amount where it already loses.
      - index: 6
        explanation: The rule pays 12 + 5, two coins, the best for 17.

  - id: greedy-exam-shipping-fee
    heading: Does the rule survive?
    tags: [greedy, sorting]
    prompt: >-
      "Buy the cheapest gift left while it fits" buys the most gifts within a budget of 40. The
      prices are 9, 4, 14, 7 and 11, so it buys four gifts. Now a shipping fee of 3 is added to
      every gift's price. Does cheapest first still buy the most gifts?
    options:
      - id: survives
        text: Yes, it now buys 3, and any 4 gifts cost at least 43
        explanation: >-
          With the fee the prices are 7, 10, 12, 14 and 17. Cheapest first buys 7, 10 and 12 (29),
          and the 14 would make 43. Adding 3 to every price keeps the same order, and each gift
          still adds 1 to the count, so the argument holds.
      - id: still-four
        text: Yes, it still buys 4, as the order of prices is unchanged
        explanation: What do the four cheapest gifts cost once the fee is added?
      - id: cheap-hurt
        text: No, the fee hurts cheap gifts most, so pricier gifts fit more
        explanation: Does the fee add the same amount to every gift?
      - id: two
        text: No, it now buys 2, while a mix of 3 gifts still fits
        explanation: After 7 and 10, how much of the 40 is left?
    correct: survives
    followUps:
      still-four:
        prompt: With the fee, what do the four cheapest gifts cost together?
        options:
          - { id: over, text: '43, which is over the budget of 40' }
          - { id: under, text: '31, the same as before the fee' }
          - { id: exact, text: '40, exactly the budget' }
        correct: over
        explanation: >-
          7 + 10 + 12 + 14 is 43. The rule is still right, and the best is now three gifts. A
          rule can survive a change and still give a smaller answer.
      cheap-hurt:
        prompt: Before the fee, the 4 gift was cheaper than the 7 gift. Which is cheaper after it?
        options:
          - { id: same, text: 'Still the first, 7 against 10' }
          - { id: flipped, text: 'The second, since the fee hurts small prices more' }
          - { id: tied, text: 'Neither, the fee makes them equal' }
        correct: same
        explanation: >-
          Adding the same 3 to every price keeps the order, and any 4 gifts cost exactly 12 more
          than before. The cheapest gifts are still the cheapest set of any size.
      two:
        prompt: After 7 and 10, 23 of the 40 is left. What does the rule do with the 12?
        options:
          - { id: buy, text: 'Buys it, leaving 11, for 3 gifts' }
          - { id: skip, text: 'Skips it, since 12 is more than half of 23' }
          - { id: stop, text: 'Stops, since two gifts is the limit with fees' }
        correct: buy
        explanation: >-
          12 fits in 23, so the rule buys it. The next price, 14, does not fit in 11, so the rule
          ends at three, and no four gifts fit.

  - id: greedy-exam-debug-rate-key
    heading: Which call does it fail on?
    tags: [greedy, sorting, python]
    prompt: |-
      A suggested solution should return the most value that fits in `room` kg. Each load is a
      `(weight, value)` pair, and any part of a load can be taken for that part of its value. One
      detail is slightly off:

      ```python
      def pack(loads, room):
          total = 0
          for weight, value in sorted(loads, key=lambda p: p[1], reverse=True):
              take = min(weight, room)
              total += value * take / weight
              room -= take
          return total
      ```

      Which call returns a wrong answer?
    options:
      - id: rate-beats-value
        text: "`pack([(2, 10), (4, 12)], 3)`"
        explanation: >-
          The key is the value alone, so the load worth 12 comes first and 3 of its 4 kg give 9.0.
          The load worth 10 is 5 per kg against 3 per kg, so the best is all 2 kg of it and 1 kg of
          the other, 10 + 3 = 13.0. Sorting by `p[1] / p[0]` fixes it.
      - id: orders-agree
        text: "`pack([(3, 15), (5, 10)], 4)`"
        explanation: >-
          The load worth 15 has the larger value and also the better rate, 5 per kg against 2, so
          both keys give the same order. It returns 15 + 2 = 17.0, which is right.
      - id: all-fit
        text: "`pack([(1, 4), (5, 15)], 6)`"
        explanation: >-
          The keys disagree on the order, but the loads weigh 6 kg together, so both are taken
          whole whatever the order. It returns 19.0, which is right.
      - id: rates-tie
        text: "`pack([(2, 8), (4, 16)], 3)`"
        explanation: >-
          Both loads are worth 4 per kg, so every kg taken adds 4 whichever load it comes from. It
          returns 12.0, which is right.
    correct: rate-beats-value
    followUps:
      orders-agree:
        prompt: "In `[(3, 15), (5, 10)]`, which load comes first by value, and which by value per kg?"
        options:
          - { id: same, text: 'The load worth 15 comes first under both keys' }
          - { id: differ, text: 'The load worth 15 by value, the other by value per kg' }
          - { id: neither, text: 'The 5 kg load under both keys, since it is heavier' }
        correct: same
        explanation: >-
          15 is the larger value, and 15 over 3 kg is 5 per kg against 10 over 5 kg, 2 per kg. The
          wrong key can only hurt when the two orders differ.
      all-fit:
        prompt: When every load fits in the room, does the order the loop visits them change the total?
        options:
          - { id: no-change, text: 'No, every load is taken whole in any order' }
          - { id: first-most, text: 'Yes, the first load visited takes the most room' }
          - { id: rate-only, text: 'Yes, unless the loads are sorted by value per kg' }
        correct: no-change
        explanation: >-
          With room for everything, `min(weight, room)` is the whole weight on every pass. The
          order only matters once a load has to be cut to fit.
      rates-tie:
        prompt: "In `[(2, 8), (4, 16)]`, what is each load worth per kg?"
        options:
          - { id: four, text: '4 per kg for both loads' }
          - { id: differ, text: '4 per kg for one and 2 per kg for the other' }
          - { id: values, text: '8 and 16, the values of the loads' }
        correct: four
        explanation: >-
          8 over 2 kg and 16 over 4 kg are both 4 per kg. With equal rates, the 3 kg taken are
          worth 12 from either load, so sorting by value does no harm here.
