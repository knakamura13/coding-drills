id: growth-rates-checkpoint
title: "Growth rates: checkpoint"
description: Trace a small input, predict the steps or memory when the input doubles, and name the growth. Each item combines the Growth rates skills on code used nowhere else.
heading: Predict each step

questions:
  - id: checkpoint-doubling-inner
    format: step-trace
    tags: [complexity, python]
    prompt: >-
      The row shows the outer loop's indices. Trace `n = 4`, then predict the count when `n`
      doubles.
    code: |
      n = 4
      steps = 0
      for i in range(n):
          j = 1
          while j < n:
              j = j * 2
              steps += 1
    sequence:
      kind: array
      cells: [0, 1, 2, 3]
    start:
      - { name: i, at: 0 }
    steps:
      - line: 5
        ask: On the pass with `i` at 0, how many times does the `while` body run?
        options:
          - id: two
            text: '2'
            explanation: '`j` goes 1, 2, 4. At 4 the test `j < n` fails, so the body runs twice.'
          - id: four
            text: '4'
            explanation: >-
              That is one pass per value up to `n`. `j` doubles, 1 to 2 to 4, so it reaches 4 in
              fewer passes.
          - id: three
            text: '3'
            explanation: >-
              That counts a pass with `j` at 4. The test `4 < 4` is false, so the loop ends there.
        correct: two
      - line: 3
        ask: What is `steps` when the outer loop ends?
        options:
          - id: eight
            text: '8'
            explanation: >-
              Line 4 resets `j` to 1 on every outer pass, so each of the 4 passes adds 2 steps.
          - id: sixteen
            text: '16'
            explanation: >-
              That gives each outer pass 4 inner passes, as `range(n)` would. The inner loop doubles
              `j` instead, so each outer pass adds only 2.
          - id: two
            text: '2'
            explanation: >-
              That counts only the first outer pass. Line 4 sets `j` back to 1 on every outer pass,
              so all 4 passes add 2 steps.
        correct: eight
        also:
          - { name: i, at: 3 }
      - ask: Run it again with `n = 8`. What is `steps` then?
        options:
          - id: twenty-four
            text: '24'
            explanation: >-
              Each inner loop now takes 3 doublings, 1 to 8, and there are 8 outer passes, so
              8 × 3 is 24. Doubling `n` doubled the passes and made each one a step longer, so the
              count tripled.
          - id: sixteen
            text: '16'
            explanation: >-
              That doubles the outer passes but keeps each inner loop at 2. Reaching 8 by doubling
              takes 3 passes, 1 to 2 to 4 to 8.
          - id: thirty-two
            text: '32'
            explanation: >-
              Four times the count would need each inner loop to double in length too. Doubling `n`
              adds only one pass to a doubling loop.
        correct: twenty-four
      - ask: What is the Big-O of `steps`?
        options:
          - id: n-log-n
            text: O(n log n)
            explanation: >-
              Each of the `n` outer passes runs the doubling loop about `log2(n)` times, so `steps`
              is about n × log n: 8 is 4 × 2, and 24 is 8 × 3.
          - id: quadratic
            text: O(n²)
            explanation: >-
              That needs an inner loop that walks up to `n` one step at a time. This one doubles
              `j`, so it runs only `log2(n)` times.
          - id: log
            text: O(log n)
            explanation: >-
              That is the cost of one doubling loop. The outer loop runs it `n` times over.
          - id: linear
            text: O(n)
            explanation: >-
              The inner count grows with `n` too, 2 at `n = 4` and 3 at `n = 8`, so `steps` grows
              faster than `n`.
        correct: n-log-n

  - id: checkpoint-row-table
    format: step-trace
    tags: [complexity, python]
    prompt: >-
      The row shows the loop's indices. Trace `table(4)`, then predict how much the returned value
      holds when `n` doubles.
    code: |
      def table(n):
          rows = []
          for i in range(n):
              rows.append([i] * (i + 1))
          return rows

      table(4)
    sequence:
      kind: array
      cells: [0, 1, 2, 3]
    start:
      - { name: i, at: 0 }
    steps:
      - line: 4
        ask: How many numbers does the row appended on the pass with `i` at 2 hold?
        options:
          - id: three
            text: '3'
            explanation: '`[2] * 3` is `[2, 2, 2]`, three numbers.'
          - id: two
            text: '2'
            explanation: >-
              That uses `i` as the length. The row is `[i] * (i + 1)`, so it holds one more number.
          - id: four
            text: '4'
            explanation: >-
              That is `n`, but the row's length is `i + 1`, which does not use `n`.
        correct: three
        also:
          - { name: i, at: 2 }
      - line: 5
        ask: How many numbers does `table(4)` hold across all its rows?
        options:
          - id: ten
            text: '10'
            explanation: 'The rows hold 1, 2, 3 and 4 numbers: 10 in all.'
          - id: four
            text: '4'
            explanation: >-
              That counts the rows. Each row holds `i + 1` numbers, so the rows hold different
              amounts.
          - id: sixteen
            text: '16'
            explanation: >-
              That makes every row 4 long. Row `i` holds `i + 1` numbers, so only the last one is.
        correct: ten
        also:
          - { name: i, at: 3 }
      - ask: How many numbers does `table(8)` hold?
        options:
          - id: thirty-six
            text: '36'
            explanation: >-
              1 + 2 + ... + 8 is 36, more than three times 10. The total is n(n + 1) / 2, so the
              returned value grows like n², about four times per doubling for large `n`.
          - id: twenty
            text: '20'
            explanation: >-
              That doubles 10, as if the rows kept their lengths. The 4 new rows are longer than any
              old one, 5 to 8 numbers each.
          - id: sixty-four
            text: '64'
            explanation: >-
              That makes every row 8 long. The first row is `[0]`, one number, and the rows grow by
              one each.
        correct: thirty-six

  - id: checkpoint-binary-digits
    heading: How does the output grow?
    tags: [complexity, python]
    prompt: |-
      `n % 2` is the remainder after dividing by 2, so it is 0 when `n` is even, and `n //= 2`
      means `n = n // 2`. This function halves `n` until it reaches 0 and keeps each remainder.

      ```python
      def remainders(n):
          out = []
          while n > 0:
              out.append(n % 2)
              n //= 2
          return out
      ```

      `remainders(13)` returns `[1, 0, 1, 1]`. How long is `remainders(26)`, and how does the
      returned list grow with `n`?
    options:
      - id: right
        text: '5 items: one more per doubling of `n`, so O(log n)'
        explanation: >-
          Each pass appends one item and halves `n`. 26 halves to 13 on its first pass, and 13
          needs the same 4 passes as before, so `remainders(26)` is `[0, 1, 0, 1, 1]`.
      - id: doubles
        text: '8 items: twice as many, so O(n)'
        explanation: >-
          Twice as many items would mean twice as many passes. Halving 26 gives 13 on the first
          pass, so it needs only one pass more than 13 does.
      - id: per-unit
        text: '26 items: one per unit of `n`, so O(n)'
        explanation: >-
          One item per unit would need a loop that takes 1 off `n` on each pass. `n //= 2` halves
          `n`, so 26 runs out in a handful of passes.
      - id: constant
        text: '4 items again: a returned list is one object, so O(1)'
        explanation: >-
          The list gets one item per pass, and 26 needs one more pass than 13. A list's size is
          the number of items it holds.
    correct: right
    followUps:
      doubles:
        prompt: '`n //= 2` halves `n` on each pass. How many more passes does 26 need than 13?'
        options:
          - id: one
            text: One more
          - id: twice
            text: Four more
          - id: none
            text: No more
        correct: one
        explanation: >-
          The first halving turns 26 into 13, and from there the passes are the same as for 13.
          A halving loop pays one pass per doubling of its input. The list gains one item per
          pass, so it grows by one too.
      per-unit:
        prompt: How many passes does `remainders(13)` make?
        options:
          - id: four
            text: Four, one per halving from 13 down to 0
          - id: thirteen
            text: Thirteen, one per unit of `n`
          - id: one
            text: One
        correct: four
        explanation: >-
          13 halves to 6, 3, 1 and then 0. A loop that subtracts 1 each pass would take 13 passes,
          but this one divides.
      constant:
        prompt: Does the length of the returned list depend on `n`?
        options:
          - id: grows
            text: Yes, it gains one item for each halving of `n`
          - id: fixed
            text: No, a list is a single object of fixed size
          - id: powers
            text: Only when `n` is a power of two
        correct: grows
        explanation: >-
          A list takes room for every item it holds. The number of items here is the number of
          passes, which grows slowly with `n` but does grow.

  - id: checkpoint-two-phases
    heading: Count it, then double it
    tags: [complexity, python]
    prompt: |-
      ```python
      def work(n):
          steps = 0
          for i in range(n):
              steps += 1
          for i in range(n):
              for k in range(3):
                  steps += 1
          return steps
      ```

      What do `work(5)` and `work(10)` return?
    options:
      - id: right
        text: 20, then 40
        explanation: >-
          The first loop adds 5 and the nested one adds 5 × 3 = 15, so `work(5)` is 20. Both
          loops run `n` times and the inner loop stays at 3, so `work(10)` is 10 + 30 = 40. The
          count is 4n, so doubling `n` doubles it.
      - id: quadratic
        text: 20, then 80
        explanation: >-
          80 is four times 20, which needs the inner loop to grow with `n`. It is `range(3)`, so it
          stays at 3.
      - id: one-loop
        text: 15, then 30
        explanation: >-
          15 and 30 count only the nested loop. The plain loop before it adds `n` more steps.
      - id: inner-once
        text: 10, then 20
        explanation: >-
          That counts the nested loop's body once per outer pass. It runs 3 times on each one.
    correct: right
    followUps:
      quadratic:
        prompt: The inner loop is `range(3)`. What happens to it when `n` doubles?
        options:
          - id: stays
            text: It still runs 3 times per pass
          - id: doubles
            text: It doubles to 6 times per pass
          - id: becomes-n
            text: It runs `n` times per pass
        correct: stays
        explanation: >-
          A nested loop multiplies the work only by its own length. With a fixed inner length of
          3, the nested part grows like 3n, not like n².
      one-loop:
        prompt: Which loops add to `steps`?
        options:
          - id: both
            text: The plain loop and the nested one, one after the other
          - id: nested
            text: Only the nested loop, because it does the most work
          - id: plain
            text: Only the plain loop
        correct: both
        explanation: >-
          Every `steps += 1` that runs counts. The plain loop adds `n` and the nested one adds
          3n, so their counts add.
      inner-once:
        prompt: With `n = 5`, how many times does the nested loop's body run in all?
        options:
          - id: fifteen
            text: 15, three on each of the 5 outer passes
          - id: three
            text: 3, once for each value of `k`
          - id: five
            text: 5, once per outer pass
        correct: fifteen
        explanation: >-
          The inner loop starts over on every outer pass. Its 3 steps repeat 5 times.

  - id: checkpoint-debug-next-three
    heading: Which line is wrong?
    tags: [complexity, python]
    prompt: |-
      A suggested solution should return, for each index `i`, the sum of `nums[i]` and the two
      values after it (fewer near the end), in O(n) steps. Its answers are right, but on long
      lists it takes far more steps than that. Which line is wrong?

      ```python
      def sum_next_three(nums):
          n = len(nums)
          out = []
          for i in range(n):
              total = 0
              for j in range(i, n):
                  if j < i + 3:
                      total += nums[j]
              out.append(total)
          return out
      ```
    options:
      - id: inner-range
        text: "Line 6: `for j in range(i, n):`"
        explanation: >-
          The inner loop runs from `i` to the end, `n - i` passes, and the `if` throws most of them
          away. In all that is `n + (n - 1) + ... + 1` passes, which is O(n²).
          `range(i, min(i + 3, n))` keeps each inner loop to at most 3 passes, so the total is O(n).
      - id: outer-range
        text: "Line 4: `for i in range(n):`"
        explanation: >-
          The function returns one total per index, so any correct version makes `n` outer passes.
          What each outer pass costs is the problem.
      - id: if-line
        text: "Line 7: `if j < i + 3:`"
        explanation: >-
          The test is what keeps each total right. It runs for every `j`, but how many values `j`
          takes is set by the line above it.
      - id: append-line
        text: "Line 9: `out.append(total)`"
        explanation: >-
          It runs once per outer pass, `n` times in all, which fits O(n).
    correct: inner-range
    followUps:
      outer-range:
        prompt: With `n = 1000`, how many passes does the inner loop make when `i` is 0?
        options:
          - id: thousand
            text: 1000, though only 3 of them add anything
          - id: three
            text: 3, one per value summed
          - id: one
            text: 1, since the `if` stops it
        correct: thousand
        explanation: >-
          `range(i, n)` runs to the end whatever the `if` decides. A loop's passes are set by its
          range, not by how many of them do useful work.
      if-line:
        prompt: Which line decides how many values `j` takes?
        options:
          - id: range-line
            text: Line 6, the range of the inner loop
          - id: test-line
            text: Line 7, the `if` test
          - id: add-line
            text: Line 8, which adds to `total`
        correct: range-line
        explanation: >-
          The `if` decides only what a pass does. Cutting the passes means bounding the range
          itself.
      append-line:
        prompt: On a list of `n` items, how many times does `out.append(total)` run?
        options:
          - id: n-times
            text: "`n` times, once per outer pass"
          - id: n-squared
            text: About n² times, once per pair
          - id: three-n
            text: 3 × `n` times, once per value summed
        correct: n-times
        explanation: >-
          It sits in the outer loop, after the inner one finishes, so it runs once per index.
