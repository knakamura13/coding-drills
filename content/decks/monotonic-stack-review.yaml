  - id: stack-loop-cost
    heading: What is the complexity?
    tags: [stack, complexity]
    prompt: |-
      What is the tightest worst-case bound on the time `next_greater` takes for a list of `n`
      values?

      ```python
      def next_greater(nums):
          out = [-1] * len(nums)
          stack = []
          for i, x in enumerate(nums):
              while stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = x
              stack.append(i)
          return out
      ```
    options:
      - id: quadratic
        text: O(n²), because a `while` loop sits inside a `for` loop
        explanation: >-
          O(n²) is a valid upper bound but not a tight one. A loop inside a loop does not always
          multiply. The `while` loop can pop many entries in one step (on `[9, 8, 7, 6, 5, 100]` the
          last step pops five), but popped entries are gone, so all the pops together are at most `n`.
      - id: n-log-n
        text: O(n log n), because the stack is kept in sorted order
        explanation: >-
          O(n log n) is also a valid upper bound but not a tight one, and its reason is off: nothing
          is sorted or inserted into the middle. Order is kept by removing smaller entries from the
          top before pushing, and each push or pop is one step at the end of the list.
      - id: avg-linear
        text: O(n) on average, but O(n²) in the worst case on increasing values
        explanation: >-
          The O(n) bound holds for every input, including strictly increasing values. On that input
          the stack stays tiny, and on non-increasing values nothing is popped at all. There is no
          input where the nested pops become quadratic.
      - id: linear
        text: O(n) in the worst case, because each index is pushed once and popped at most once
        explanation: >-
          Across the whole call there are exactly `n` pushes and at most `n` pops, so the `while`
          body runs at most `n` times in total, not `n` times per step. That is about 2n operations
          whatever the input. The stack also keeps its values from bottom to top in non-increasing
          order, because smaller tops are popped before each push.
    correct: linear
    followUps:
      quadratic:
        prompt: >-
          One step of the `for` loop can pop many entries. Why is O(n²) still not the tightest bound
          for the whole function?
        options:
          - id: popped-once
            text: Each index is popped at most once in the whole call
          - id: pops-bounded
            text: One step never pops more than a few entries
          - id: pops-free
            text: Pops are free in big-O, so only pushes count
        correct: popped-once
        explanation: >-
          A single step can pop a lot, as the last step of `[9, 8, 7, 6, 5, 100]` does, so the
          few-pops claim is false. Pops are not free either. They are limited in total, because an
          index leaves the stack for good after it is popped, and each of the `n` indices enters
          once. All steps together pop at most `n` times.
      n-log-n:
        prompt: How does the stack stay in order without sorting or inserting into the middle?
        options:
          - id: pop-before-push
            text: Each push first pops any smaller tops
          - id: auto-sorted
            text: A Python list sorts itself on `append`
          - id: log-size
            text: It never holds more than log n entries
        correct: pop-before-push
        explanation: >-
          The popping step removes exactly the entries that would break the order, so the new index
          lands on top in order and a plain `append` is safe. Lists do not sort themselves, and the stack can hold all `n` indices, for example
          when values never increase.
      avg-linear:
        prompt: What does the stack do on strictly increasing values such as 1, 2, 3, ..., n?
        options:
          - id: one-pop-per-step
            text: Each step after the first pops one entry, the previous one
          - id: pops-everything
            text: Each step pops every earlier entry, which costs about n² / 2
          - id: no-pops
            text: Nothing is popped, because every new value is larger
        correct: one-pop-per-step
        explanation: >-
          On increasing values each arrival beats only the one waiting index, so the stack never
          holds more than one index, and every step after the first costs one pop and one push. There is no input that pushes more than `n` times or pops
          more than `n` times, so there is no quadratic worst case to find.

