          - id: zero
            text: '`0`'
            explanation: >-
              0 throws away the `a` that still matches. `fail[2]` is 1, so `j` keeps one letter.
          - id: two
            text: '`2`'
            explanation: '2 is `j - 1`. The code reads `fail[j - 1]`, and `fail[2]` is 1.'
        correct: one
      - line: 6
        ask: What is `j` after the `if`?
        options:
          - id: two
            text: '`2`'
            explanation: '`text[4]` and `p[1]` are both `b`, so `j += 1` makes `j` 2.'
          - id: one
            text: '`1`'
            explanation: >-
              The `while` stopped because `text[4]` matches `p[1]`, so the `if` holds and adds 1.
          - id: zero
            text: '`0`'
            explanation: >-
              0 would need a second fallback, but `text[4]` and `p[1]` are both `b`, so the
              `while` stops at 1 and the `if` adds 1.
        correct: two
      - line: 3
        ask: Where is `i` when `j` reaches 4? Move `i` to it.
        pointer: i
        correct: 6
        explanation: >-
          At `i = 5`, `a` matches `p[2]` and `j` becomes 3. At `i = 6`, `c` matches `p[3]` and `j`
          becomes 4, the length of `p`.
        misses:
          - index: 5
            explanation: '`a` matches `p[2]`, so `j` becomes 3, one short of `len(p)`.'
        elsewhere: '`i` only moves forward. `j` reaches 4 when `text[6]`, `c`, matches `p[3]`.'
      - line: 9
        ask: What does the search return?
        options:
          - id: three
            text: '`3`'
            explanation: '`i - len(p) + 1` is 6 - 4 + 1 = 3, and `text[3:7]` is `abac`.'
          - id: one
            text: '`1`'
            explanation: >-
              Index 1 is where the first try began, with `aba` at indices 1 to 3. That try failed
              at `text[4]`. The match that ends at index 6 starts at 3.
          - id: two
            text: '`2`'
            explanation: >-
              2 is `i - len(p)`, without the `+ 1`. A match of 4 letters that ends at index 6
              covers indices 3, 4, 5 and 6.
          - id: six
            text: '`6`'
            explanation: '6 is `i`, where the match ends. The search returns where it starts.'
        correct: three

  - id: kmp-linear-bound
    heading: What sets the cost?
    tags: [complexity, arrays-strings]
    workedExample: |-
      Consider a loop over 6 letters with a counter `c` that starts at 0. In each pass an inner
      loop may run `c -= 1` several times, but only while `c > 0`, and then the pass runs
      `c += 1` once.

      1. `c += 1` runs once per pass, so it runs 6 times in all, and `c` gains 6 at most.
      2. `c -= 1` runs only while `c > 0`, so `c` never drops below 0, and the drops cannot
         outnumber the gains.
      3. So `c -= 1` runs at most 6 times over the whole loop, even if one pass runs it several
         times.
    prompt: >-
      A text has n letters and a pattern m letters, and the pattern may be longer than the text.
      Building `fail` runs a `while` inside a `for` over the pattern, and the KMP search runs the
      same shape over the text. In the search, `j += 1` runs at most once per text letter, each
      fallback `j = fail[j - 1]` makes `j` smaller, and `j` never drops below 0. Which Big-O names
      the growth of the build and the search together?
    options:
      - id: n-plus-m
        text: O(n + m)
        explanation: >-
          The fallbacks lower `j` by no more than the `j += 1` steps raise it, and those are at most
          n, so the whole search is O(n). The build is the same count on the pattern, O(m).
          Together they are O(n + m).
      - id: n-times-m
        text: O(n × m)
        explanation: >-
          That treats every text letter as if it could fall back m times. One letter can fall back
          several times, but each fallback undoes an earlier `j += 1`, and there are at most n of
          those over the whole search.
      - id: n-only
        text: O(n)
        explanation: >-
          The search alone is O(n), but it needs the whole `fail` table first, and building it reads
          every pattern letter. With m allowed above n, that O(m) part can be the larger one.
      - id: n-log-m
        text: O(n log m)
        explanation: >-
          That assumes each fallback at least halves `j`, so a letter falls back about log m times
          at most. A fallback can lower `j` by just 1. The bound comes from counting the fallbacks
          over the whole run instead.
    correct: n-plus-m
    followUps:
      n-times-m:
        prompt: Over the whole search, at most how many fallbacks can there be?
        options:
          - { id: at-most-n, text: 'n, since each one undoes an earlier `j += 1`' }
          - { id: n-m, text: 'n × m, up to m for each text letter' }
          - { id: m, text: 'm, the length of the pattern' }
        correct: at-most-n
        explanation: >-
          `j` rises at most once per text letter and never drops below 0, so the drops cannot
          outnumber the rises. That caps all the fallbacks together at n.
      n-only:
        prompt: Which work does the O(n) count leave out?
        options:
          - { id: build, text: 'Building `fail`, which reads all m pattern letters' }
          - { id: twice, text: 'A second read of the text' }
          - { id: nothing, text: 'Nothing, since m never changes the cost' }
        correct: build
        explanation: >-
          The search needs the whole table before it starts, and building it is O(m) by the same
          count. When m can be larger than n, that part has to stay in the Big-O.
      n-log-m:
        prompt: 'For `p = "aaaa"`, `fail` is `[0, 1, 2, 3]`. How far does one fallback from `j = 3` lower `j`?'
        options:
          - { id: one, text: 'By 1, to `fail[2]`, which is 2' }
          - { id: half, text: 'By about half, to 1' }
          - { id: all, text: 'All the way to 0' }
        correct: one
        explanation: >-
          A fallback can lower `j` by just 1, so no halving bound holds. The bound comes from
          counting: all the fallbacks together cannot outnumber the rises of `j`, which are at most
          n.
