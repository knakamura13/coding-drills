      def search(text, p, fail):
          j = 0
          for i in range(len(text)):
              while j > 0 and text[i] != p[j]:
                  j = fail[j - 1]
              if text[i] == p[j]:
                  j += 1
              if j == len(p):
                  return i - len(p) + 1
          return -1
    sequence: { kind: string, name: text, cells: [c, a, b, a, b, a, c] }
    start:
      - { name: i, at: 4 }
    steps:
      - line: 4
        ask: '`text[4]` is `b` and `p[3]` is `c`. What is `j` after the fallback?'
        options:
