id: hidden-work-checkpoint
title: "Hidden work: checkpoint"
description: Find the line that dominates, or remove repeated work without changing the output. Each item combines the Hidden work skills on code used nowhere else.
heading: Remove the repeated work

questions:
  - id: checkpoint-rank-positions
    heading: Which change keeps the output?
    tags: [complexity, python, sorting]
    prompt: |-
      Every query appears in `nums`, and `nums` may hold repeats. `nums.sort()` reorders the list
      in place, while `sorted(nums)` returns a new list.

      ```python
      def positions(nums, queries):
          out = []
          for q in queries:
              out.append(sorted(nums).index(q))
          return out
      ```

      `positions([4, 1, 4, 7], [7, 4])` returns `[3, 1]`. Which change sorts only once, returns
      the same list for every such input, and leaves `nums` unchanged?
    options:
      - id: hoist
        text: Set `ordered = sorted(nums)` above the loop and append `ordered.index(q)`
        explanation: >-
          The loop never changes `nums`, so every pass sorted the same list. Sorting once gives
          the same sorted list, so each `index` call finds the same first position. One sort per
          query drops to one sort in all.
      - id: dict
        text: 'Build `rank = {v: i for i, v in enumerate(sorted(nums))}` and append `rank[q]`'
        explanation: >-
          Try it on the example. What does `rank[4]` hold after both 4s have been stored?
      - id: sort-in-place
        text: Call `nums.sort()` above the loop and append `nums.index(q)`
        explanation: >-
          The positions come out right. Look at the last condition the change has to meet.
      - id: set
        text: Set `ordered = sorted(set(nums))` above the loop and append `ordered.index(q)`
        explanation: Where does 7 sit in `sorted(set([4, 1, 4, 7]))`?
    correct: hoist
    followUps:
      dict:
        prompt: '`sorted([4, 1, 4, 7])` is `[1, 4, 4, 7]`. What does `rank[4]` hold?'
        options:
          - id: two
            text: 2, since the second 4 overwrites the first
          - id: one
            text: 1, the first index of 4
          - id: both
            text: Both indices, 1 and 2
        correct: two
        explanation: >-
          A dict keeps one value per key, and the comprehension stores the last one it sees.
          `.index` returns the first position, so on repeats the two disagree.
      sort-in-place:
        prompt: What does `nums.sort()` do to the caller's list?
        options:
          - id: reorders
            text: It reorders that same list, so the caller sees it sorted
          - id: copy
            text: It sorts a copy and leaves the caller's list alone
          - id: nothing
            text: Nothing, since the function has its own name for the list
        correct: reorders
        explanation: >-
          A parameter names the caller's list, and `sort` changes a list in place. `sorted(...)`
          builds a new list and leaves the original as it was.
      set:
        prompt: What is `sorted(set([4, 1, 4, 7]))`, and where is 7 in it?
        options:
          - id: three-items
            text: '`[1, 4, 7]`, with 7 at index 2'
          - id: four-items
            text: '`[1, 4, 4, 7]`, with 7 at index 3'
          - id: no-seven
            text: '`[1, 4]`, with no 7'
        correct: three-items
        explanation: >-
          The set drops the second 4, so every value after it moves one place left. Positions
          change whenever a repeat sits before the query.

  - id: checkpoint-sorted-unique
    heading: Which line dominates?
    tags: [complexity, python, sorting]
    prompt: |-
      ```python
      def unique_sorted(names):
          names = sorted(names)
          out = []
          for name in names:
              if name not in out:
                  out.append(name)
          return out
      ```

      `names` holds `n` different names. Which line dominates the running time, and what removes
      its cost while returning the same list for every input?
    options:
      - id: scan-out
        text: '`name not in out`; test `not out or out[-1] != name` instead'
        explanation: >-
          With `n` different names, `out` grows by one each pass and the `in` test reads all of
          it: 0 + 1 + ... + (n - 1) comparisons, 499,500 for 1,000 names. After the sort, equal
          names sit side by side, so comparing with the last kept name is enough.
      - id: drop-sort
        text: '`sorted(names)`; drop it and keep the `in` test'
        explanation: >-
          Compare n log n with the work the `in` test does over the whole loop. And what order
          does the result come out in?
      - id: append
        text: '`out.append(name)`; build the list with `out = out + [name]` instead'
        explanation: What does `append` cost, and what does `out + [name]` cost?
      - id: set-loop
        text: '`for name in names:`; loop over `set(names)` instead'
        explanation: The header runs its expression once. In what order does a set hand out its items?
    correct: scan-out
    followUps:
      drop-sort:
        prompt: Without the sort, what does `["mo", "al", "mo", "bea"]` give?
        options:
          - id: first-seen
            text: '`["mo", "al", "bea"]`, in order of first appearance'
          - id: sorted
            text: '`["al", "bea", "mo"]`, the same as before'
          - id: all
            text: '`["mo", "al", "mo", "bea"]`'
        correct: first-seen
        explanation: >-
          The sort is what puts the result in order, so dropping it changes the output. It is
          also not the slow line: n log n is less than the n² / 2 comparisons of the `in` tests.
      append:
        prompt: When `out` holds 500 names and has a spare slot, what does each version copy?
        options:
          - id: plus-copies
            text: '`append` none of them, `out + [name]` all 500'
          - id: same
            text: '`append` all 500, `out + [name]` all 500'
          - id: neither
            text: '`append` none of them, `out + [name]` none'
        correct: plus-copies
        explanation: >-
          `append` writes the new name into the spare slot and copies none of the 500. A list keeps
          extra room, so only the occasional append that runs out of room copies everything, which
          averages to a constant per append. `+` builds a new list and copies all 500 every time, so
          that change adds a second hidden copy instead of removing the scan. The line to fix is the
          `in` test that reads all of `out`.
      set-loop:
        prompt: Does looping over `set(names)` keep the names in sorted order?
        options:
          - id: no-order
            text: No, a set hands out its items in no promised order
          - id: sorted
            text: Yes, a set keeps its items sorted
          - id: insertion
            text: Yes, a set keeps the order the items were added in
        correct: no-order
        explanation: >-
          A set has no order you can rely on, so the output could change. The header was not the
          slow part anyway: the `in` test inside the loop was.

  - id: checkpoint-trace-prefix-copies
    format: step-trace
    heading: Predict each step
    tags: [complexity, python]
    prompt: >-
      The row shows `nums`, and `last` marks the last cell a slice copies. Trace
      `running([3, 1, 4, 2])`, then remove its repeated work.
    code: |
      def running(nums):
          out = []
          for i in range(len(nums)):
              out.append(sum(nums[:i + 1]))
          return out

      running([3, 1, 4, 2])
    sequence:
      kind: array
      name: nums
      cells: [3, 1, 4, 2]
    start:
      - { name: last, at: 0 }
    steps:
      - line: 4
        ask: On the pass with `i` at 2, tap the last cell `nums[:i + 1]` copies.
        pointer: last
        correct: 2
        explanation: '`nums[:3]` stops before index 3, so it copies cells 0, 1 and 2.'
        misses:
          - index: 1
            explanation: The stop is `i + 1`, not `i`.
          - index: 3
            explanation: Is the stop index part of the slice?
        elsewhere: '`nums[:3]` holds cells 0, 1 and 2.'
      - line: 5
        ask: How many cells do the slices copy across the whole call?
        options:
          - id: ten
            text: '10'
            explanation: 'The four passes copy 1, 2, 3 and 4 cells: 10 in all.'
          - id: sixteen
            text: '16'
            explanation: Is every slice 4 cells long?
          - id: four
            text: '4'
            explanation: That counts slices. How many cells is each?
        correct: ten
        also:
          - { name: last, at: 3 }
      - ask: '`running` gets 8 numbers. How many cells do the slices copy?'
        options:
          - id: thirty-six
            text: '36'
            explanation: >-
              1 + 2 + ... + 8 is 36, more than three times 10. The copies (and the sums over them)
              grow like n² / 2.
          - id: twenty
            text: '20'
            explanation: That doubles 10. Do the slices stay the same length when the list doubles?
          - id: sixty-four
            text: '64'
            explanation: Is the first slice 8 cells long?
        correct: thirty-six
      - ask: Which rewrite returns the same list and copies no cells?
        options:
          - id: running-total
            text: Keep `total = 0`, then add `nums[i]` to it and append `total` on each pass
            explanation: >-
              Each pass's sum is the previous sum plus one new number. Carrying it forward does one
              addition per pass, so the whole call is O(n) and copies nothing.
          - id: suffix
            text: Append `sum(nums[i:])` instead
            explanation: That sums from `i` to the end. What does it give on the first pass?
          - id: hoist-sum
            text: Set `total = sum(nums)` above the loop and append `total`
            explanation: Hoisting works when the value is the same on every pass. Is it here?
        correct: running-total

  - id: checkpoint-hoist-which-line
    heading: Which line can move?
    tags: [complexity, python, sorting]
    prompt: |-
      `nums` is never empty.

      ```python
      def keep_new(nums):
          out = []
          for x in nums:
              top = max(nums)
              prior = sorted(out)
              if x < top and x not in prior:
                  out.append(x)
          return out
      ```

      Which lines can move above the loop, to run once, so that `keep_new` still returns the same
      list for every such input?
    options:
      - id: top-only
        text: Only `top = max(nums)`
        explanation: >-
          The loop never changes `nums`, so `max(nums)` is the same on every pass. `out` grows
          inside the loop, so `sorted(out)` depends on the pass: moved up, it would always be
          `[]`, and repeats would slip through. On `[5, 2, 8, 2, 5]` the original returns
          `[5, 2]`.
      - id: prior-only
        text: Only `prior = sorted(out)`
        explanation: What does `out` hold before the loop starts?
      - id: both
        text: Both lines
        explanation: Does every line read a list that stays the same during the loop?
      - id: neither
        text: Neither, since a line inside a loop may depend on the pass
        explanation: Which list does `max(nums)` read, and does the loop ever change it?
    correct: top-only
    followUps:
      prior-only:
        prompt: Above the loop, `out` is `[]`. What would `prior` hold on every pass?
        options:
          - id: empty
            text: '`[]`, so `x not in prior` is always true'
          - id: grows
            text: The values kept so far, as before
          - id: nums
            text: A sorted copy of `nums`
        correct: empty
        explanation: >-
          A value computed once is frozen at that moment. `out` changes inside the loop, so a
          test on it has to see each new version.
      both:
        prompt: Which of the two lists does the loop change?
        options:
          - id: out
            text: '`out`, by appending to it'
          - id: nums
            text: '`nums`, by reading it'
          - id: neither-list
            text: Neither of them
        correct: out
        explanation: >-
          Work can move out of a loop only when its inputs stay the same on every pass. `nums` does
          and `out` does not.
      neither:
        prompt: Does any line in the loop change `nums`?
        options:
          - id: none
            text: No, so `max(nums)` gives the same value on every pass
          - id: append
            text: Yes, `out.append(x)` adds to `nums`
          - id: for
            text: Yes, the `for` loop removes each item it visits
        correct: none
        explanation: >-
          `out` and `nums` are separate lists, and iterating does not remove items. A value whose
          inputs never change in the loop can be computed once above it.

  - id: checkpoint-sort-each-pass
    heading: What is the time cost?
    tags: [complexity, python, sorting]
    prompt: |-
      `nums` holds `n` numbers in no particular order, and `sorted` makes about n log n
      comparisons.

      ```python
      def above_median(nums):
          out = []
          for x in nums:
              mid = sorted(nums)[len(nums) // 2]
              if x > mid:
                  out.append(x)
          return out
      ```

      What is the Big-O of `above_median`?
    options:
      - id: n-squared-log-n
        text: O(n² log n)
        explanation: >-
          `sorted(nums)` sits in the body, so it runs on every one of the `n` passes, and each run
          costs about n log n. Reading the middle item and the test add a fixed amount per pass.
          So the total is n × n log n. Sorting once above the loop would bring it to O(n log n).
      - id: n-log-n
        text: O(n log n)
        explanation: How many times does `sorted(nums)` run in this loop?
      - id: quadratic
        text: O(n²)
        explanation: What does one call of `sorted` cost on numbers in no particular order?
      - id: cubic
        text: O(n³)
        explanation: Is a sort of `n` numbers as costly as comparing every pair?
    correct: n-squared-log-n
    followUps:
      n-log-n:
        prompt: How many times does `sorted(nums)` run in `above_median`?
        options:
          - id: per-pass
            text: Once per pass, so `n` times
          - id: once
            text: Once, since its result is the same every time
          - id: per-kept
            text: Once for each number that is kept
        correct: per-pass
        explanation: >-
          Python does not notice that `nums` never changes, so the call in the body runs again on
          every pass and builds a new sorted list each time.
      quadratic:
        prompt: What does one call of `sorted(nums)` cost for `n` numbers in no particular order?
        options:
          - id: n-log-n-each
            text: About n log n comparisons
          - id: n-each
            text: About `n` steps, one per number copied
          - id: one-each
            text: About one step, since `sorted` is built in
        correct: n-log-n-each
        explanation: >-
          `sorted` copies the numbers and orders them, and ordering takes about n log n
          comparisons. Paid on each of `n` passes, that is n × n log n.
      cubic:
        prompt: Which costs more for 1,000 numbers, one sort or one comparison of every pair?
        options:
          - id: pairs-more
            text: Every pair, about 500,000 comparisons against about 10,000 for the sort
          - id: sort-more
            text: The sort, since it also copies the list
          - id: equal
            text: They cost the same, since a sort compares every pair
        correct: pairs-more
        explanation: >-
          A sort makes about n log n comparisons, far fewer than the n² / 2 pairs. So one sort per
          pass gives n² log n, not n³.

  - id: checkpoint-shared-set
    heading: Which change brings the cost down?
    tags: [complexity, python, hash-map]
    prompt: |-
      `words` and `banned` are lists of `n` words each, and this function is too slow.

      ```python
      def flagged(words, banned):
          return [w for w in words if w in banned]
      ```

      Which change makes the total cost O(n) on average and still returns every `w` in `words`
      that appears in `banned`, in order and with its repeats?
    options:
      - id: set-once
        text: Build `bad = set(banned)` above the line and test `w in bad`
        explanation: >-
          The set is built once, about `n` steps, and each `w in bad` is then about one step on
          average, so the line costs about n + n. The price is a set of up to `n` words in memory.
          The loop still walks `words`, so order and repeats are kept.
      - id: sort-banned
        text: Sort `banned` first and keep the same comprehension
        explanation: Does `w in banned` read fewer words when `banned` is sorted?
      - id: set-inside
        text: Write `w in set(banned)` inside the comprehension
        explanation: How many times does `set(banned)` run?
      - id: set-words
        text: Loop over `set(words)` instead and keep `w in banned`
        explanation: Which container does each `in` test still search, and what happens to repeats?
    correct: set-once
    followUps:
      sort-banned:
        prompt: Does `w in some_list` use the fact that the list is sorted?
        options:
          - id: no-scan
            text: No, it compares item by item from the front
          - id: halves
            text: Yes, Python notices the order and halves the list
          - id: strings
            text: Only for lists of strings
        correct: no-scan
        explanation: >-
          A list does not record whether it is sorted, so `in` on a list is always a scan, and
          the comprehension stays about n × n.
      set-inside:
        prompt: In `[w for w in words if w in set(banned)]`, how often does `set(banned)` run?
        options:
          - id: per-word
            text: Once for every word in `words`, building an `n`-word set each time
          - id: once
            text: Once, since the expression is the same every time
          - id: first-match
            text: Until the first match, and then Python reuses the set
        correct: per-word
        explanation: >-
          The condition of a comprehension runs again for every item, call and all. Each build
          reads all of `banned`, so the cost is back to about n × n.
      set-words:
        prompt: In `[w for w in set(words) if w in banned]`, what does each `in` test search?
        options:
          - id: list
            text: The list `banned`, word by word, and repeats in `words` are dropped too
          - id: set
            text: The set built from `words`, in about one step
          - id: neither
            text: Nothing, since a set is involved
        correct: list
        explanation: >-
          `in` searches the object on its right. To make the tests cheap, the set has to be built
          from `banned`, the list being searched.

  - id: checkpoint-slice-sums
    heading: What is the time cost?
    tags: [complexity, python]
    prompt: |-
      `nums` holds `n` numbers.

      ```python
      best = 0
      for i in range(len(nums)):
          for j in range(i + 1, len(nums) + 1):
              best = max(best, sum(nums[i:j]))
      ```

      What is the Big-O of this code?
    options:
      - id: cubic
        text: O(n³)
        explanation: >-
          The loops visit about n² / 2 pairs `(i, j)`. For each pair, `nums[i:j]` copies `j - i`
          numbers and `sum` reads them, up to `n` per pair. In all that is n(n + 1)(n + 2) / 6
          cells, 171,700 at `n = 100`, which grows like n³. A running sum per `i` would bring it
          to O(n²).
      - id: quadratic
        text: O(n²)
        explanation: That counts the pairs. What does the line inside the inner loop cost for each pair?
      - id: linear
        text: O(n)
        explanation: How many times does the inner loop run in all?
      - id: exponential
        text: O(2^n)
        explanation: Does each pass choose some items to keep and others to drop, or a start and an end?
    correct: cubic
    followUps:
      quadratic:
        prompt: For one pair `(i, j)`, what does `sum(nums[i:j])` cost?
        options:
          - id: length
            text: About `j - i` steps to copy the slice, and as many again to add it up
          - id: one
            text: One step, since `sum` is built in
          - id: log
            text: About log n steps
        correct: length
        explanation: >-
          A slice copies every cell it covers and `sum` reads every one, so the cost per pair
          grows with the slice. Up to `n` per pair, over about n² / 2 pairs, grows like n³.
      linear:
        prompt: How many pairs `(i, j)` do the two loops visit for `n = 100`?
        options:
          - id: pairs
            text: 5,050, since for each `i` the inner loop runs from `i + 1` to `n`
          - id: hundred
            text: 100, one per value of `i`
          - id: two-hundred
            text: 200, one pass for each loop
        correct: pairs
        explanation: >-
          The inner loop runs `n - i` times for each `i`, which adds up to n(n + 1) / 2 pairs. The
          line inside then runs once per pair.
      exponential:
        prompt: How many different slices `nums[i:j]` with `i < j` does a list of `n` items have?
        options:
          - id: start-end
            text: n(n + 1) / 2, since a slice is fixed by where it starts and stops
          - id: two-to-n
            text: 2^n, since each item is either in or out
          - id: n-factorial
            text: n!, since order matters
        correct: start-end
        explanation: >-
          A slice holds items that sit next to each other, so choosing a start and a stop fixes it.
          2^n counts the ways to keep or drop each item freely, which is a far larger number.

  - id: checkpoint-debug-scale-up
    heading: Which line is wrong?
    tags: [complexity, python]
    prompt: |-
      A suggested solution should return the tasks in `todo` that are not in the set `done`, in
      order and with their repeats, in O(n) steps on average. `todo` is a list of `n` tasks, and
      `out.remove(t)` deletes the first item of `out` that equals `t`. Its answers are right, but
      when most tasks are done it takes far more steps than that. Which line is wrong?

      ```python
      def pending(todo, done):
          out = list(todo)
          for t in todo:
              if t in done:
                  out.remove(t)
          return out
      ```
    options:
      - id: remove-line
        text: 'Line 5: `out.remove(t)`'
        explanation: >-
          `remove` reads `out` from the front to find `t`, then slides every item behind it one
          slot left to close the gap. When every task is done, each call finds `t` at index 0 and
          slides all the rest: (n - 1) + (n - 2) + ... + 0 moves, 499,500 for 1,000 tasks, about
          n² / 2. Starting from `out = []` and appending each `t` that is not in `done` keeps the
          call O(n) on average.
      - id: copy-line
        text: 'Line 2: `out = list(todo)`'
        explanation: How many times does line 2 run, and what does it copy?
      - id: in-line
        text: 'Line 4: `if t in done:`'
        explanation: What kind of object is `done`, and how does `in` search it?
      - id: loop-line
        text: 'Line 3: `for t in todo:`'
        explanation: Can any correct version decide about every task in fewer than `n` passes?
    correct: remove-line
    followUps:
      copy-line:
        prompt: What does `out = list(todo)` cost in this function?
        options:
          - id: once
            text: One copy of the `n` tasks, made once above the loop
          - id: per-pass
            text: One copy of the `n` tasks on every pass
          - id: none
            text: Nothing, since `out` becomes a second name for `todo`
        correct: once
        explanation: >-
          `list(...)` builds a new list and copies all `n` tasks, but it sits above the loop, so it
          runs one time. Its `n` copies add to the loop's cost instead of multiplying it.
      in-line:
        prompt: '`done` is a set. What does `t in done` read?'
        options:
          - id: hash
            text: About one place, found from the hash of `t`
          - id: scan
            text: Every task in `done`, from the first
          - id: todo
            text: Every task in `todo`, from the first
        correct: hash
        explanation: >-
          `in` searches the object on its right, and a set finds `t` from its hash, in about one
          step on average at any size. The steps pile up on line 5, which works on a list.
      loop-line:
        prompt: The function keeps or drops each task in `todo`. How many passes does that need?
        options:
          - id: n-passes
            text: '`n`, one per task, which fits O(n) if each pass is cheap'
          - id: log-passes
            text: About log n, by halving `todo` on each pass
          - id: n-squared
            text: About n², one per pair of tasks
        correct: n-passes
        explanation: >-
          Every task has to be checked, so `n` passes are needed. What each pass costs decides the
          total, and on each pass whose task is done, line 5 searches and slides `out`.
