  - id: three-sum-repeats-review
    heading: What does it return?
    tags: [two-pointers]
    prompt: |-
      `nums` is sorted. For each `i`, the outer loop fixes `nums[i]` and scans the indices after
      it from both ends for two values that bring the total to 0. This version has no line that
      skips a repeated `nums[i]`.

      ```python
      def three_sum(nums):
          out = []
          for i in range(len(nums) - 2):
              l, r = i + 1, len(nums) - 1
              while l < r:
                  s = nums[i] + nums[l] + nums[r]
                  if s < 0:
                      l += 1
                  elif s > 0:
                      r -= 1
                  else:
                      out.append((nums[i], nums[l], nums[r]))
                      l += 1
                      r -= 1
                      while l < r and nums[l] == nums[l - 1]:
                          l += 1
          return out
      ```

      What does `three_sum([-2, -2, 0, 2, 4])` return?
    options:
      - id: repeat-from-second
        text: "`[(-2, -2, 4), (-2, 0, 2), (-2, 0, 2)]`"
        explanation: >-
          With `i = 0`, the scan finds `-2 + -2 + 4` and then `-2 + 0 + 2`. With `i = 1` the
          second -2 is fixed, its scan starts at index 2, and it finds `-2 + 0 + 2` again. With
          `i = 2` nothing sums to 0.
      - id: no-repeat
        text: "`[(-2, -2, 4), (-2, 0, 2)]`"
        explanation: >-
          That is the answer with a skip for a repeated `nums[i]`. Here `i = 1` fixes the second
          -2 and runs its own scan.
      - id: no-equal-pair
        text: "`[(-2, 0, 2), (-2, 0, 2)]`"
        explanation: >-
          That drops `(-2, -2, 4)`. With `i = 0`, `l` starts on index 1, the second -2, which is a
          separate item.
      - id: repeat-all
        text: "`[(-2, -2, 4), (-2, 0, 2), (-2, -2, 4), (-2, 0, 2)]`"
        explanation: >-
          With `i = 1`, `l` starts at index 2. The first -2 sits before `i`, so the second scan
          can't use it.
    correct: repeat-from-second
    followUps:
      no-repeat:
        prompt: "With `i = 1`, `nums[i]` is the second -2. What does its scan look for?"
        options:
          - id: same-target
            text: Two values after index 1 that add up to 2, the same as for `i = 0`
          - id: skipped
            text: Nothing, since a repeated value is skipped by the loop itself
          - id: new-target
            text: Two values that add up to 4, since the target doubles
        correct: same-target
        explanation: >-
          The outer loop runs for every `i`. A repeated `nums[i]` needs the same partners, so
          without a skip it records the same triples again.
      no-equal-pair:
        prompt: "With `i = 0`, `l` starts at index 1. Can `nums[0]` and `nums[1]` sit in one triple?"
        options:
          - id: separate
            text: Yes, they are two items at different indices
          - id: same-value
            text: No, a triple needs three different values
          - id: outer-only
            text: No, only the outer loop may use a -2
        correct: separate
        explanation: >-
          Equal values at different indices are separate items. `-2 + -2 + 4` is 0, so the scan
          records it.
      repeat-all:
        prompt: "With `i = 1`, where does `l` start?"
        options:
          - id: two
            text: At index 2, right after `i`
          - id: zero
            text: At index 0, the start of the list
          - id: one
            text: At index 1, on `i` itself
        correct: two
        explanation: >-
          `l` starts at `i + 1`, so each scan looks only after the fixed item. The first -2 at
          index 0 is out of reach once `i` is 1.
