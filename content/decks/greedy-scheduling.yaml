id: greedy-scheduling
title: Greedy scheduling
description: Keep the most intervals that never overlap. Pick a compatible interval, compare the room each choice leaves, and apply earliest finish. Each card asks for one decision, with a worked example on hand.
heading: Which interval is kept?

questions:
  - id: sched-tap-next-kept
    format: tap-cell
    heading: Tap the next interval kept
    tags: [intervals, greedy]
    workedExample: |-
      This path keeps as many intervals as possible with no two overlapping. Its loop sorts them by
      end and keeps each one that starts at or after the last kept end. Here touching intervals may
      both be kept, the list sorted by end is `[1, 3]`, `[3, 4]`, `[2, 6]`, and the loop has kept
      `[1, 3]`.

      1. `[3, 4]` starts at 3, exactly where `[1, 3]` ends. Touching intervals share no time, and
         `3 >= 3` holds, so `[3, 4]` is kept, and its end, 4, is what the next interval has to
         clear.
      2. `[2, 6]` starts at 2, and `2 >= 4` is false. It would run from 2 to 4 alongside the kept
         intervals, so it clashes and is skipped.
      3. So the loop keeps `[1, 3]` and `[3, 4]`. Each interval is tested against the end of the
         last one kept, not against every kept interval.
    prompt: >-
      An interval is compatible with a schedule when it overlaps none of the intervals kept. The
      loop below keeps an interval when it starts at or after the last kept end. `spans` is sorted
      by end, touching intervals may both be kept, and the loop has kept `[0, 2]` and `[2, 5]`.
      Tap the interval it keeps next.
    code: |
      # spans is sorted by end; kept is [[0, 2], [2, 5]]
      for s, e in spans[2:]:
          if s >= kept[-1][1]:
              kept.append([s, e])
    sequence:
      kind: array
      name: spans
      cells: ['[0,2]', '[2,5]', '[4,6]', '[3,7]', '[5,8]', '[6,9]', '[8,10]']
    correct: 4
    explanation: >-
      The last kept end is 5. `[4, 6]` and `[3, 7]` start before 5, so they clash. `[5, 8]`
      starts at 5, and `5 >= 5` holds, so it is the next interval kept.
    misses:
      - index: 0
        explanation: "`[0, 2]` is already kept. The loop reads from index 2 onward."
      - index: 1
        explanation: >-
          `[2, 5]` is the interval just kept. Its end, 5, is what the next interval has to start
          at or after.
      - index: 2
        explanation: >-
          `[4, 6]` ends soonest of the rest, but it starts at 4, before the kept end 5. It
          overlaps `[2, 5]` from 4 to 5.
      - index: 3
        explanation: "`[3, 7]` starts at 3, before 5, so it overlaps `[2, 5]` from 3 to 5."
      - index: 5
        explanation: >-
          `[6, 9]` starts after 5, but `[5, 8]` comes first in end order and is kept first. Then
          `[6, 9]` starts before 8 and clashes.
      - index: 6
        explanation: >-
          `[8, 10]` is kept later, once `[5, 8]` sets the end to 8. It is not the next one,
          because `[5, 8]` is read before it.

  - id: sched-inclusive-days
    heading: What does it return?
    tags: [intervals, greedy, python]
    workedExample: |-
      Consider a meeting `[9, 10]` in hours and a booking `[9, 10]` of whole days. The next interval
      may be kept only if it uses none of the time the last one holds.

      1. The meeting runs from hour 9 up to hour 10 and frees the room at 10. So a meeting
         `[10, 11]` can follow it, and the test is `s >= last_end`.
      2. The booking holds day 9 and day 10, both included. A booking that starts on day 10 would
         need day 10 too, so it clashes.
      3. So after a booking of days 9 through 10, the next one has to start on day 11 or later, and
         the test is `s > last_end`.
    prompt: |-
      Here each booking `[a, b]` holds the room on days `a` through `b`, both included.
      `float('-inf')` is smaller than every number, so the first booking always passes the test.

      ```python
      def most_bookings(days):
          count, last_end = 0, float('-inf')
          for s, e in sorted(days, key=lambda b: b[1]):
              if s >= last_end:
                  count += 1
                  last_end = e
          return count

      most_bookings([[1, 3], [3, 5], [5, 7], [2, 4]])
      ```

      What does the call return, and is it right?
    options:
      - id: three-wrong
        text: 3, but `[1, 3]` and `[3, 5]` both hold day 3, so only 2 fit
        explanation: >-
          Sorted by end, the order is `[1, 3]`, `[2, 4]`, `[3, 5]`, `[5, 7]`. The `>=` test keeps
          `[1, 3]`, `[3, 5]` and `[5, 7]`, so it returns 3. Those share day 3 and day 5. With
          `s > last_end` it keeps `[1, 3]` and `[5, 7]` and returns 2, the most that fit.
      - id: three-right
        text: 3, and it is right, since touching bookings never clash
        explanation: >-
          Touching intervals share no time only when the end point is excluded. These bookings
          include their last day, so `[1, 3]` and `[3, 5]` both need day 3.
      - id: two-already
        text: 2, since `>=` already rejects a booking that starts on the last day
        explanation: >-
          `>=` accepts a start equal to `last_end`. `3 >= 3` is True, so `[3, 5]` is kept after
          `[1, 3]`, and the call returns 3.
      - id: four-all
        text: 4, since every booking starts on or after an earlier one ends
        explanation: >-
          `[2, 4]` starts at 2, before `[1, 3]` ends at 3, so even the `>=` test skips it. The
          call returns 3.
    correct: three-wrong
    followUps:
      three-right:
        prompt: Booking `[1, 3]` holds days 1, 2 and 3. Booking `[3, 5]` holds days 3, 4 and 5. Can both be kept?
        options:
          - { id: no-day-three, text: "No. Both need day 3" }
          - { id: yes-touch, text: "Yes. They only touch at 3" }
          - { id: yes-sorted, text: "Yes. They are in end order" }
        correct: no-day-three
        explanation: >-
          When both ends are included, touching intervals share their end point. Only a start
          after the last end is free, so the test is `s > last_end`.
      two-already:
        prompt: "`last_end` is 3 and the next booking starts at 3. What does `3 >= last_end` give?"
        options:
          - { id: true-keeps, text: "True. The booking is kept" }
          - { id: false-skips, text: "False. The booking is skipped" }
          - { id: error, text: "An error. Equal values cannot be compared" }
        correct: true-keeps
        explanation: >-
          `>=` is True for equal values. To reject a booking that starts on the last day held,
          the test has to be the strict `>`.
      four-all:
        prompt: After `[1, 3]` is kept, `last_end` is 3. What does the loop do with `[2, 4]`?
        options:
          - { id: skips, text: "It skips it, since `2 >= 3` is False" }
          - { id: keeps, text: "It keeps it, since `[2, 4]` ends after `[1, 3]`" }
          - { id: replaces, text: "It swaps it in for `[1, 3]`" }
        correct: skips
        explanation: >-
          The test reads only the start of the new booking against the last kept end. A start
          before that end is a clash under either convention.

  - id: sched-drag-two-kept
    format: drag-pointers
    heading: Place the next two kept
    tags: [intervals, greedy]
    workedExample: |-
      Consider `spans` sorted by end, `[[1, 2], [1, 3], [2, 4]]`, where touching intervals may both
      be kept. The loop keeps an interval when its start is at or after the last kept end.

      1. The first interval, `[1, 2]`, is kept, so the last kept end is 2.
      2. `[1, 3]` starts at 1, and `1 >= 2` is false, so it is skipped. The last kept end stays 2.
      3. `[2, 4]` starts at 2, and `2 >= 2` holds, so it is kept, and the last kept end becomes 4.
    prompt: >-
      Below, `spans` is
      sorted by end, touching intervals may both be kept, and `[1, 4]` is kept. Drag `second` to
      the next interval the loop keeps and `third` to the one it keeps after that.
    code: |
      # spans is sorted by end; [1, 4] is kept, last_end is 4
      for s, e in spans[1:]:
          if s >= last_end:
              kept.append([s, e])
              last_end = e
    sequence:
      kind: array
      name: spans
      cells: ['[1,4]', '[2,5]', '[3,6]', '[4,7]', '[6,8]', '[5,9]', '[7,10]', '[8,11]']
    markers:
      - { name: kept, at: 0 }
    pointers:
      - name: second
        start: 1
        correct: 3
        explanation: >-
          `[2, 5]` and `[3, 6]` start before 4. `[4, 7]` starts at 4, which touches the kept end,
          so it is kept and `last_end` becomes 7.
        misses:
          - index: 1
            explanation: "`[2, 5]` starts at 2, before the kept end 4, so it overlaps `[1, 4]`."
          - index: 2
            explanation: "`[3, 6]` starts at 3, before 4, so it overlaps `[1, 4]` from 3 to 4."
          - index: 4
            explanation: >-
              `[6, 8]` starts after 4, but `[4, 7]` ends sooner and is read first. Touching is
              allowed, so `4 >= 4` keeps it.
        elsewhere: The next kept interval is the first in end order that starts at 4 or later.
      - name: third
        start: 2
        correct: 6
        explanation: >-
          With `last_end` at 7, `[6, 8]` and `[5, 9]` start too early. `[7, 10]` starts at 7 and
          is kept.
        misses:
          - index: 4
            explanation: "`[6, 8]` starts at 6, before the new end 7, so it overlaps `[4, 7]`."
          - index: 5
            explanation: "`[5, 9]` starts at 5, before 7, so it overlaps `[4, 7]`."
          - index: 7
            explanation: >-
              `[8, 11]` starts after 7, but `[7, 10]` ends sooner and is read first. Once it is
              kept, `[8, 11]` starts before 10 and clashes.
        elsewhere: After `[4, 7]`, the next kept interval is the first in end order that starts at 7 or later.

  - id: sched-room-left
    heading: Which choice leaves more room?
    tags: [intervals, greedy]
    workedExample: |-
      Consider two intervals that both fit next, `[1, 9]` and `[2, 6]`, where touching intervals may
      both be kept. Whatever comes after a kept interval must start at or after its end.

      1. After `[1, 9]`, the next interval must start at 9 or later.
      2. After `[2, 6]`, it must start at 6 or later. Every start of 9 or later is also 6 or later,
         so anything that can follow `[1, 9]` can also follow `[2, 6]`.
      3. `[2, 6]` also allows starts from 6 to 8, such as `[6, 8]`, which cannot follow `[1, 9]`. So
         the choice that ends sooner never loses anything and may gain.
    prompt: >-
      Touching
      intervals may both be kept. `[0, 2]` is kept, and the list also holds `A = [2, 8]`,
      `B = [3, 5]`, `[5, 7]`, `[6, 9]` and `[8, 10]`. A and B both fit after `[0, 2]`. Which
      one should come next?
    options:
      - id: b-ends-sooner
        text: B, since what fits after A also fits after B, and more besides
        explanation: >-
          After A only `[8, 10]` fits, for 3 intervals in all. After B, `[5, 7]` and `[8, 10]`
          fit, for 4: `[0, 2]`, `[3, 5]`, `[5, 7]`, `[8, 10]`. A brute force over every choice of
          intervals agrees that 4 is the most.
      - id: a-no-gap
        text: A, since it starts right where `[0, 2]` ends and wastes no time
        explanation: >-
          The gap from 2 to 3 costs nothing. The count depends on where the choice ends, and A
          ends at 8, which shuts out `[5, 7]` and `[6, 9]`.
      - id: a-longer
        text: A, since one long interval covers more of the timeline
        explanation: >-
          The goal is the most intervals, not the most time covered. A long interval uses up
          room that two short ones could share.
      - id: either-same
        text: Either, since both fit after `[0, 2]` and so leave the same room
        explanation: >-
          Both fit, but they leave different room. Only intervals that start at 8 or later
          follow A, while anything that starts at 5 or later can follow B.
    correct: b-ends-sooner
    followUps:
      a-no-gap:
        prompt: Which number decides what can follow a kept interval?
        options:
          - { id: end, text: "Its end. The next start must be at or after it" }
          - { id: start, text: "Its start. An early start leaves no gap behind it" }
          - { id: length, text: "Its length. A long interval leaves less time" }
        correct: end
        explanation: >-
          Every later choice is tested against the last kept end. Where the kept interval starts
          only matters for the interval before it, which already fits.
      a-longer:
        prompt: What is the schedule trying to make as large as possible?
        options:
          - { id: count, text: "The number of intervals kept" }
          - { id: covered, text: "The total time the kept intervals cover" }
          - { id: longest, text: "The length of the longest kept interval" }
        correct: count
        explanation: >-
          Every kept interval counts once, however long it is. So a long interval is a cost: it
          pushes the next allowed start later.
      either-same:
        prompt: Which intervals can follow A, which ends at 8, but not B, which ends at 5?
        options:
          - { id: none, text: "None. Any start of 8 or later is also 5 or later" }
          - { id: five-seven, text: "`[5, 7]`, since it starts after B ends" }
          - { id: eight-ten, text: "`[8, 10]`, since it starts where A ends" }
        correct: none
        explanation: >-
          Whatever can follow the later end can also follow the sooner one. So the sooner end is
          never worse, and here B is strictly better.

  - id: sched-trace-earliest-finish
    format: step-trace
    heading: Predict each step
    tags: [intervals, greedy, python]
    workedExample: |-
      Consider `most_meetings` on spans already in end order, `[[1, 2], [1, 3], [2, 4]]`. `last` is
      the index of the last kept interval and starts at 0, with `count = 1`.

      1. With `i` at 1, `[1, 3]` starts at 1. The kept end is `spans[0][1] = 2`, and `1 >= 2` is
         false, so `last` stays at 0.
      2. With `i` at 2, `[2, 4]` starts at 2. The kept end is still 2, and `2 >= 2` holds, so `last`
         moves to 2 and `count` becomes 2.
      3. The loop ends there, so the call returns 2, for `[1, 2]` and `[2, 4]`.
    prompt: >-
      Below, the board shows `spans`
      after the sort. Predict each step before it is shown.
    code: |
      def most_meetings(spans):
          spans = sorted(spans, key=lambda iv: iv[1])
          last, count = 0, 1
          for i in range(1, len(spans)):
              if spans[i][0] >= spans[last][1]:
                  last = i
                  count += 1
          return count

      most_meetings([[4, 7], [9, 12], [1, 3], [6, 8], [3, 5], [8, 10], [2, 4], [5, 9]])
    sequence:
      kind: array
      name: spans
      cells: ['[1,3]', '[2,4]', '[3,5]', '[4,7]', '[6,8]', '[5,9]', '[8,10]', '[9,12]']
    start:
      - { name: last, at: 0 }
      - { name: i, at: 1 }
    steps:
      - line: 4
        ask: After the passes with `i` at 1 and 2, where is `last`?
        pointer: last
        correct: 2
        explanation: >-
          `[2, 4]` starts at 2, before the kept end 3, so it is skipped. `[3, 5]` starts at 3,
          and `3 >= 3`, so `last` moves to 2.
        misses:
          - index: 1
            explanation: "`[2, 4]` starts at 2, before `[1, 3]` ends at 3, so the test fails and `last` does not move there."
          - index: 0
            explanation: >-
              `[3, 5]` starts at 3, where `[1, 3]` ends. `3 >= 3` is True, so `last` moves on.
        elsewhere: The loop has read only indices 1 and 2, and keeps the one that starts at 3 or later.
        also:
          - { name: i, at: 2 }
      - line: 4
        ask: After the passes with `i` at 3 and 4, where is `last`?
        pointer: last
        correct: 4
        explanation: >-
          `[4, 7]` starts at 4, before the kept end 5, so it is skipped. `[6, 8]` starts at 6,
          after 5, so `last` moves to 4.
        misses:
          - index: 3
            explanation: "`[4, 7]` starts at 4, before `[3, 5]` ends at 5, so it overlaps and is skipped."
          - index: 2
            explanation: "`[6, 8]` starts at 6, after the kept end 5, so the test passes and `last` moves."
        elsewhere: The kept end is 5, and only `[6, 8]` among indices 3 and 4 starts at 5 or later.
        also:
          - { name: i, at: 4 }
      - line: 4
        ask: After the passes with `i` at 5 and 6, where is `last`?
        pointer: last
        correct: 6
        explanation: >-
          `[5, 9]` starts at 5, before the kept end 8. `[8, 10]` starts at 8, and touching is
          allowed, so `last` moves to 6.
        misses:
          - index: 5
            explanation: "`[5, 9]` starts at 5, before `[6, 8]` ends at 8, so it is skipped."
          - index: 4
            explanation: >-
              `[8, 10]` starts at 8, exactly where `[6, 8]` ends. `8 >= 8` is True, so `last`
              moves on.
        elsewhere: The kept end is 8, and `[8, 10]` starts there.
        also:
          - { name: i, at: 6 }
      - line: 8
        ask: The pass with `i` at 7 reads `[9, 12]`. What does the call return?
        options:
          - id: four
            text: '4'
            explanation: >-
              `[9, 12]` starts at 9, before the kept end 10, so it is skipped. The loop kept
              `[1, 3]`, `[3, 5]`, `[6, 8]` and `[8, 10]`.
          - id: five
            text: '5'
            explanation: "`[9, 12]` starts at 9, before `[8, 10]` ends at 10, so it is not kept."
          - id: three
            text: '3'
            explanation: >-
              Each touching pair counts: `[3, 5]` after `[1, 3]`, and `[8, 10]` after `[6, 8]`.
              Together with `[1, 3]` and `[6, 8]` that is 4.
          - id: two
            text: '2'
            explanation: >-
              `count` grows every time `last` moves. It moved three times after starting at 1,
              so it is 4.
        correct: four
        also:
          - { name: i, at: 7 }

  - id: sched-which-kept
    heading: Which meetings stay?
    tags: [intervals, greedy, sorting]
    workedExample: |-
      Consider meetings `[[3, 5], [1, 4], [4, 6]]`, where touching meetings may both stay. The loop
      sorts them by end and keeps each meeting that starts at or after the last kept end.

      1. The ends are 5, 4 and 6, so sorting by end gives `[1, 4]`, `[3, 5]`, `[4, 6]`.
      2. The loop keeps `[1, 4]`, so the last kept end is 4. `[3, 5]` starts at 3, before 4, so it
         is skipped.
      3. `[4, 6]` starts at 4, and `4 >= 4` holds, so it is kept. The loop keeps `[1, 4]` and
         `[4, 6]`.
    prompt: >-
      Below, touching meetings may both stay. Sort
      `[[6, 9], [1, 5], [2, 3], [4, 7], [3, 6], [8, 10], [7, 8]]` by end and keep each meeting
      that starts at or after the last kept end. Which meetings does that keep?
    options:
      - id: earliest-finish
        text: "`[2, 3]`, `[3, 6]`, `[7, 8]`, `[8, 10]`"
        explanation: >-
          In end order the loop keeps `[2, 3]`, skips `[1, 5]`, keeps `[3, 6]`, skips `[4, 7]`,
          keeps `[7, 8]`, skips `[6, 9]` and keeps `[8, 10]`. That is 4 meetings, so 3 are
          removed, and a brute force over every choice of meetings confirms 4 is the most.
      - id: another-best
        text: "`[2, 3]`, `[4, 7]`, `[7, 8]`, `[8, 10]`"
        explanation: >-
          This is a valid schedule of 4, but not the one the loop keeps. `[3, 6]` ends at 6,
          before `[4, 7]`, so it is read first and kept, and `[4, 7]` then clashes with it.
      - id: earliest-start
        text: "`[1, 5]`, `[6, 9]`"
        explanation: >-
          That is what sorting by start and keeping what fits gives. `[1, 5]` starts first but
          runs long and shuts out `[2, 3]`, `[3, 6]` and `[4, 7]`.
      - id: next-start
        text: "`[2, 3]`, `[3, 6]`, `[6, 9]`"
        explanation: >-
          After `[3, 6]` this picks the meeting that starts soonest, `[6, 9]`. The loop takes the
          one that ends soonest, `[7, 8]`, which leaves room for `[8, 10]`.
    correct: earliest-finish
    followUps:
      another-best:
        prompt: Both `[3, 6]` and `[4, 7]` fit after `[2, 3]`. Which does the loop keep, and why?
        options:
          - { id: three-six, text: "`[3, 6]`. It ends first, so it is read first" }
          - { id: four-seven, text: "`[4, 7]`. It starts later, so it wastes less" }
          - { id: both, text: "Both. Each one fits after `[2, 3]`" }
        correct: three-six
        explanation: >-
          The loop reads in end order and keeps the first interval that fits. A list can have
          several best schedules, and the loop always builds the one whose picks end soonest.
      earliest-start:
        prompt: Why does sorting by start keep only 2 here?
        options:
          - { id: long-first, text: "`[1, 5]` is kept first and shuts out three meetings" }
          - { id: same-count, text: "It keeps 4, the same count as sorting by end" }
          - { id: needs-merge, text: "Sorting by start works only after a merge step" }
        correct: long-first
        explanation: >-
          `[1, 5]` starts first, so it is kept, and it shuts out `[2, 3]`, `[3, 6]` and `[4, 7]`.
          An early start says nothing about how long a meeting runs. Sorting by end puts the
          meeting that frees the room soonest first.
      next-start:
        prompt: After `[3, 6]`, which next meeting leaves more room, `[6, 9]` or `[7, 8]`?
        options:
          - { id: seven-eight, text: "`[7, 8]`. It frees the room at 8, not 9" }
          - { id: six-nine, text: "`[6, 9]`. It starts right at 6, so no time is wasted" }
          - { id: same, text: "They leave the same room, since both start after 6" }
        correct: seven-eight
        explanation: >-
          The next choice should end soonest, not start soonest. Ending at 8 lets `[8, 10]`
          follow, while ending at 9 does not.

  - id: sched-swap-first
    heading: Why does the swap work?
    tags: [intervals, greedy]
    workedExample: |-
      Consider a best schedule `[0, 7]`, `[8, 10]`, where touching intervals may both be kept, and
      suppose the list's earliest-ending interval is `[1, 3]`.

      1. The schedule is valid, so `[8, 10]` starts at or after the end of `[0, 7]`: 8 is at
         least 7.
      2. `[1, 3]` has the earliest end in the whole list, so it ends no later than `[0, 7]` does: 3
         is at most 7.
      3. `[1, 3]` ends at 3, which is at most 7 (step 2), and 7 is at most 8 (step 1). So `[1, 3]`
         ends no later than `[8, 10]` starts, `[1, 3]`, `[8, 10]` is valid, and the count stays 2.
    prompt: >-
      Touching intervals may both be kept. On another list, a best schedule is `[1, 6]`,
      `[6, 9]`, `[10, 12]`, and the list's earliest-ending interval is `[2, 4]`. Why is
      `[2, 4]`, `[6, 9]`, `[10, 12]` still a valid schedule?
    options:
      - id: ends-no-later
        text: "`[2, 4]` ends no later than `[1, 6]`, so it ends before `[6, 9]` starts"
        explanation: >-
          The swapped-in interval only has to end by the time the next one starts. As the
          earliest end in the whole list, it ends at or before `[1, 6]` does, which already
          ended by 6.
      - id: shorter
        text: "`[2, 4]` is shorter than `[1, 6]`, so it overlaps fewer intervals"
        explanation: >-
          Length is not what the swap uses. A short interval placed later could still run into
          `[6, 9]`. What matters is that `[2, 4]` ends by 6.
      - id: starts-later
        text: "`[2, 4]` starts after `[1, 6]` starts, so nothing before it can clash"
        explanation: >-
          Nothing comes before the first interval, so its start is never tested. The swap would
          work just as well for an interval like `[0, 4]`, which starts earlier.
      - id: inside
        text: "It works only because `[2, 4]` lies inside `[1, 6]`"
        explanation: >-
          Lying inside is not needed. If the earliest end were `[0, 4]`, which is not inside
          `[1, 6]`, the swap would still work, since it ends by 6.
    correct: ends-no-later
    followUps:
      shorter:
        prompt: Swap `[7, 8]` in for `[1, 6]`. It is shorter. Is `[7, 8]`, `[6, 9]`, `[10, 12]` valid?
        options:
          - { id: no-overlap, text: "No. `[7, 8]` overlaps `[6, 9]`" }
          - { id: yes-short, text: "Yes. A shorter interval always fits" }
          - { id: yes-count, text: "Yes. The count is still 3" }
        correct: no-overlap
        explanation: >-
          A short interval can still sit in the wrong place. The swap is safe only because the
          earliest end finishes no later than the interval it replaces.
      starts-later:
        prompt: Swap `[0, 4]` in for `[1, 6]`. It starts earlier. Is `[0, 4]`, `[6, 9]`, `[10, 12]` valid?
        options:
          - { id: yes-ends, text: "Yes. It ends at 4, before `[6, 9]` starts" }
          - { id: no-start, text: "No. It starts before `[1, 6]` did" }
          - { id: no-length, text: "No. It is longer than `[2, 4]`" }
        correct: yes-ends
        explanation: >-
          The first interval has nothing before it, so only its end is tested against the next
          start.
      inside:
        prompt: What does the swap need from the interval it puts first?
        options:
          - { id: end-by-next, text: "To end at or before the next interval starts" }
          - { id: inside-old, text: "To lie inside the interval it replaces" }
          - { id: same-length, text: "To be the same length as the one it replaces" }
        correct: end-by-next
        explanation: >-
          The earliest end always ends no later than the interval it replaces, so it always ends
          at or before the next one starts. Where it starts does not matter.
