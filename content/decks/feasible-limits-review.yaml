id: feasible-limits-review
title: "Feasible limits: review"
description: The Feasible limits decisions again, on fresh inputs and with no worked example. Use these for spaced review.
heading: What happens next?

questions:
  - id: count-sessions-review
    heading: How many sessions?
    tags: [binary-search, greedy]
    prompt: |-
      ```python
      def sessions(sizes, x):
          count, load = 1, 0
          for s in sizes:
              if load + s > x:
                  count += 1
                  load = 0
              load += s
          return count
      ```

      What does `sessions([6, 4, 7, 5, 5, 3], 10)` return?
    options:
      - id: four
        text: '4'
        explanation: >-
          [6, 4] has a load of exactly 10, which fits. 7 + 5 = 12 is over 10, so the 7 sits alone.
          Then [5, 5] fills 10, and the 3 opens a fourth session.
      - id: three
        text: '3'
        explanation: >-
          That is the total, 30, divided by 10: the count if files could be split. Under 10 the 7
          has no neighbor it can share with, so the pass needs one more.
      - id: five
        text: '5'
        explanation: >-
          That treats a load of exactly 10 as over the limit. The test is `load + s > x`, so
          [6, 4] and [5, 5] each fit.
    correct: four
    followUps:
      three:
        prompt: Which neighbors can't share a session at limit 10?
        options:
          - id: seven-five
            text: The 7 and the 5 after it
          - id: six-four
            text: The 6 and the 4 after it
          - id: two-fives
            text: The 5 and the 5 after it
        correct: seven-five
        explanation: >-
          7 + 5 = 12 is over 10, so the 7 sits alone, while 6 + 4 and 5 + 5 are exactly 10. A
          total gives only a lower bound on the count. The pass decides it, because files stay
          whole and in order.
      five:
        prompt: At limit 10, does a session with a load of exactly 10 fit?
        options:
          - id: equal-fits
            text: Yes. The test `load + s > x` lets the load reach `x`
          - id: below-only
            text: No. The load must stay below `x`
          - id: last-only
            text: Only for the last session
        correct: equal-fits
        explanation: >-
          The limit is the most a session may hold, so a load equal to it is fine. Writing `>=`
          instead of `>` would make this call return 5.

  - id: oversize-file-review
    heading: Is this limit feasible?
    tags: [binary-search, greedy]
    prompt: >-
      `sizes = [3, 4, 15, 2, 6]` and `d = 3`. The `sessions` pass (a session closes when the next
      file would push its load over `x`) returns 3 for `x = 14`. What should a correct
      `feasible(14)` return?
    options:
      - id: false-oversize
        text: "False: the 15 can't fit in any session under 14"
        explanation: >-
          A session that holds the 15 has a load of 15, over 14. No grouping changes that, so 14
          fails, and so does every limit below 15.
      - id: true-count
        text: "True: the pass returned 3, which is at most `d`"
        explanation: >-
          The pass put the 15 in a session of its own without comparing it with 14. Its count is
          right only for limits of at least `max(sizes)`.
      - id: true-total
        text: "True: the total, 30, is at most 3 × 14 = 42"
        explanation: >-
          The total test spreads the 15 over more than one session, which a whole file can't do.
    correct: false-oversize
    followUps:
      true-count:
        prompt: When the pass reaches a file larger than `x`, what does it do?
        options:
          - id: counts-it
            text: Counts it in its own session
          - id: raises
            text: Stops the pass with an error
          - id: skips-it
            text: Leaves it out of every session
        correct: counts-it
        explanation: >-
          `load = 0` and then `load += s` admit the file without comparing it with `x`. So the count
          is trustworthy only when `x` is at least the largest file.
      true-total:
        prompt: Can part of the 15 go in one session and the rest in the next?
        options:
          - id: whole
            text: No. A file is never split, so it needs a session of at least 15 to itself
          - id: neighbors
            text: Yes, as long as the parts land in neighboring sessions
          - id: if-total
            text: Yes, if the total still fits
        correct: whole
        explanation: >-
          The total test is a lower bound that assumes files can be split evenly. One file larger
          than the limit is enough to make the limit fail.

  - id: smaller-limit-review
    heading: What follows from one result?
    tags: [binary-search]
    prompt: >-
      For some list and `d = 3`, `sessions(sizes, 21)` returns 4. Without running it, what can you
      say about the limit 19?
    options:
      - id: fails-too
        text: "19 fails too: a smaller limit never needs fewer sessions"
        explanation: >-
          If 19 fit in 3 sessions, that same packing would fit under 21, and 21 would fit. It
          doesn't, so 19 can't. Every limit below a failing one fails.
      - id: unknown
        text: "Nothing yet: a smaller limit can group the files differently"
        explanation: >-
          The grouping can change, but the count can't drop. A pass at 19 closes each session no
          later than the pass at 21 did.
      - id: divides
        text: 19 fits if it divides `sum(sizes)` evenly
        explanation: >-
          Sessions may be partly empty. Feasibility depends only on how many sessions the pass
          needs, and that count never drops when the limit shrinks.
    correct: fails-too
    followUps:
      unknown:
        prompt: Suppose 19 did fit in 3 sessions. Would those same sessions fit under 21?
        options:
          - id: contradiction
            text: Yes, so 21 would fit, which contradicts the count of 4
          - id: regroup
            text: No, because 21 groups the files differently
          - id: if-exact
            text: Only if one of the loads were exactly 21
        correct: contradiction
        explanation: >-
          Any packing that works at a limit works at every larger limit. So a failure at 21 rules
          out every smaller limit.
      divides:
        prompt: Does a limit have to divide the total evenly to fit?
        options:
          - id: under-cap
            text: No. Each load just has to stay at or under the limit
          - id: no-gaps
            text: Yes, or else one session is left partly empty
          - id: if-d-divides
            text: Only when `d` divides the total
        correct: under-cap
        explanation: >-
          A limit is a cap, not a share of the total. Whether it fits depends on how the whole
          files pack, in order.

  - id: answer-window-review
    heading: Which limits are still possible?
    tags: [binary-search]
    prompt: >-
      `sizes` and `d` are fixed. So far the limit 12 fails and the limit 17 fits. Which limits
      could still be the smallest feasible limit?
    options:
      - id: thirteen-to-seventeen
        text: 13 through 17
        explanation: >-
          Every limit at or below 12 fails, so the answer is above 12. 17 fits, so the answer is at
          most 17, and it is 17 itself if 13 to 16 all fail. That is the range `lo = 13`, `hi = 17`.
      - id: thirteen-to-sixteen
        text: 13 through 16
        explanation: >-
          That drops the one limit known to fit. If every limit from 13 to 16 fails, it is the
          answer.
      - id: twelve-to-seventeen
        text: 12 through 17
        explanation: 12 failed, so it isn't feasible, let alone the smallest feasible limit.
      - id: only-seventeen
        text: Only 17, the one known to fit
        explanation: >-
          17 fits, but a smaller limit between 13 and 16 might fit as well. Only a probe there can
          tell.
    correct: thirteen-to-seventeen
    followUps:
      thirteen-to-sixteen:
        prompt: If 13, 14, 15 and 16 all fail, what is the answer?
        options:
          - id: seventeen
            text: 17, the only limit left that fits
          - id: none
            text: There is none
          - id: eighteen
            text: 18, the first limit above the range
        correct: seventeen
        explanation: >-
          A limit known to fit stays a candidate until a smaller one is found to fit. That is why a
          passing probe sets `hi = mid`, not `mid - 1`.
      twelve-to-seventeen:
        prompt: Can a limit that failed be the answer?
        options:
          - id: must-fit
            text: No. The answer has to fit, so failed limits are out
          - id: if-closest
            text: Yes, if it sits right before the change
          - id: if-next-fits
            text: Yes, when the next limit fits
        correct: must-fit
        explanation: >-
          The answer is the first limit that fits. A failing probe rules itself out along with
          everything below it, which is why `lo = mid + 1`.
      only-seventeen:
        prompt: What does the passing probe at 17 tell you about 15?
        options:
          - id: nothing-yet
            text: Nothing. 15 may fit or fail
          - id: fifteen-fails
            text: 15 fails, since 17 is the first probe that fit
          - id: fifteen-fits
            text: 15 fits, since it is close to 17
        correct: nothing-yet
        explanation: >-
          A pass settles the limits above it, and a failure settles the limits below it. The
          limits between 12 and 17 are still open until a probe lands among them.

  - id: skip-past-d-review
    format: tap-cell
    heading: Tap the smallest feasible limit
    tags: [binary-search]
    prompt: "`needs[i]` is the number of sessions at limit `9 + i`, and `d = 4`. Tap the entry for the smallest feasible limit."
    code: |
      sizes = [3, 9, 3, 2, 7, 5]
      d = 4
      needs = [sessions(sizes, x) for x in range(9, 17)]
      # needs == [5, 5, 5, 3, 3, 3, 2, 2]
    sequence:
      kind: array
      name: needs
      cells: [5, 5, 5, 3, 3, 3, 2, 2]
    correct: 3
    explanation: >-
      At 12 the pass packs [3, 9], [3, 2, 7] and [5], three sessions, which is at most 4. At 11 it
      needs 5. No limit needs exactly 4: the count drops from 5 straight to 3, so the test has to be
      "at most `d`".
    misses:
      - index: 0
        explanation: Limit 9 needs 5 sessions, one more than `d` allows.
      - index: 1
        explanation: Limit 10 needs 5 sessions, still too many.
      - index: 2
        explanation: >-
          Limit 11 needs 5 sessions: [3], [9], [3, 2], [7] and [5]. Each new session opens where
          the next file would bring the load to 12, one over the limit.
      - index: 4
        explanation: Limit 13 fits, but so does 12, one cell earlier.
      - index: 5
        explanation: Limit 14 fits, but 12 is smaller and fits too.
      - index: 6
        explanation: >-
          Limit 15 is the first with 2 sessions. Using fewer than `d` sessions isn't required, so a
          smaller limit already fits.
      - index: 7
        explanation: Limit 16 needs the fewest sessions here, but the question asks for the smallest limit that fits.

  - id: prove-smallest-review
    heading: Which fact proves it?
    tags: [binary-search]
    prompt: >-
      `sizes = [7, 3, 4, 8, 2, 5]` and `d = 3`. The pass at 12 packs [7, 3], [4, 8] and [2, 5], so
      12 fits. Which one more fact proves that 12 is the smallest feasible limit?
    options:
      - id: eleven-fails
        text: "`sessions(sizes, 11)` returns more than 3"
        explanation: >-
          At 11 the pass needs 4: [7, 3], [4], [8, 2] and [5]. Every limit below a failing one
          fails too, so 11 and everything under it are out, and 12 is the first that fits.
      - id: exactly-d
        text: "`sessions(sizes, 12)` returns exactly 3"
        explanation: >-
          That is the fact already given, that 12 fits. A limit can need exactly `d` sessions and
          still not be the smallest.
      - id: thirteen
        text: "`sessions(sizes, 13)` returns 3 as well"
        explanation: 13 is above 12. Results above the answer say nothing about the limits below it.
      - id: total
        text: "`sum(sizes) <= 3 * 12`, that is 29 <= 36"
        explanation: >-
          The total test also passes at 10 (29 <= 30), yet 10 needs four sessions. It can't rule
          out anything below 12.
    correct: eleven-fails
    followUps:
      exactly-d:
        prompt: Does needing exactly `d` sessions make a limit the smallest feasible one?
        options:
          - id: several
            text: No. Several limits in a row can each need exactly `d`
          - id: smallest-exact
            text: Yes. The smallest feasible limit always needs exactly `d`
          - id: if-two
            text: Yes, as long as `d` is at least 2
        correct: several
        explanation: >-
          Here 12, 13 and 14 all need exactly 3. The count can also jump past `d`. What proves a
          limit is the smallest is that the limit just below it fails.
      thirteen:
        prompt: Which neighbor of 12 has to be checked to prove that nothing smaller fits?
        options:
          - id: below
            text: 11, the limit just below
          - id: above
            text: 13, the limit just above
          - id: both-sides
            text: Both 11 and 13
        correct: below
        explanation: >-
          One failure at 11 rules out every smaller limit, since a smaller limit never needs fewer
          sessions. The limits above 12 fit anyway.
      total:
        prompt: The total test passes at 10. Does 10 fit in 3 sessions?
        options:
          - id: four-at-ten
            text: No. The pass needs four sessions at 10
          - id: proves-it
            text: Yes. The total test proves it
          - id: if-reordered
            text: Only if the files are reordered
        correct: four-at-ten
        explanation: >-
          The total test assumes the load can be spread evenly. Whole files in a fixed order often
          can't be, so only the pass can say whether a limit fits.

  - id: lower-bound-review
    heading: Which `lo` is safe?
    tags: [binary-search]
    prompt: |-
      `sessions` never compares a single file with `x`, so a file larger than `x` is admitted and
      counted anyway. Which start for `lo` keeps this search right for every list? For
      `sizes = [3, 10, 2, 4]` and `d = 3` the answer is 10.

      ```python
      lo, hi = ..., sum(sizes)  # which lo?
      while lo < hi:
          mid = (lo + hi) // 2
          if sessions(sizes, mid) <= d:
              hi = mid
          else:
              lo = mid + 1
      print(lo)
      ```
    options:
      - id: largest
        text: "`max(sizes)`"
        explanation: >-
          No limit below the largest file can hold it, and from there up the pass counts
          correctly. Here the loop prints 10, `max(sizes)` itself, since [3], [10] and [2, 4] fit.
      - id: one
        text: '`1`'
        explanation: >-
          Probes below 10 let the pass park the 10 in an over-limit session and still count it.
          Here the loop prints 6, smaller than the largest file.
      - id: largest-plus-one
        text: "`max(sizes) + 1`"
        explanation: >-
          That rules out the largest file's own size, but the answer can equal it. Here the loop
          prints 11, one more than needed.
    correct: largest
    followUps:
      one:
        prompt: What does `sessions([3, 10, 2, 4], 6)` return?
        options:
          - id: three-passes
            text: 3, so the probe passes
          - id: four-fails
            text: 4, so the probe fails
          - id: error
            text: It stops with an error
        correct: three-passes
        explanation: >-
          It returns 3, with sessions [3], [10] and [2, 4], so 6 passes although the 10 can't fit
          under 6. The pass never compares a single file with `x`. Starting at `max(sizes)` keeps every
          probe in the range where its count is right.
      largest-plus-one:
        prompt: Can the smallest feasible limit equal the largest file?
        options:
          - id: can-equal
            text: Yes, when the other files pack around it within `d` sessions
          - id: must-exceed
            text: No. The limit must be larger than every file
          - id: one-file
            text: Only when there is a single file
        correct: can-equal
        explanation: >-
          A session may hold exactly its limit, so a limit equal to the largest file fits that
          file. Starting above it can skip the answer.

  - id: failing-probe-review
    format: drag-pointers
    heading: Place the bounds
    tags: [binary-search]
    prompt: >-
      The cells are the candidate limits 30 to 37. The first probe fails: `sessions(sizes, 33)` is
      more than `d`. Drag `lo` and `hi` to where they sit after this pass.
    code: |
      lo, hi = 30, 37
      while lo < hi:
          mid = (lo + hi) // 2      # 33
          if sessions(sizes, mid) <= d:
              hi = mid
          else:
              lo = mid + 1
    sequence:
      kind: array
      name: limits
      cells: [30, 31, 32, 33, 34, 35, 36, 37]
    pointers:
      - name: lo
        start: 0
        correct: 4
        explanation: >-
          33 fails, so 30 to 33 all fail. `lo = mid + 1` puts `lo` on 34, the smallest limit still
          possible.
        misses:
          - index: 3
            explanation: >-
              That is `lo = mid`, which keeps 33 although it just failed. On a two-cell range that
              update can repeat forever.
          - index: 0
            explanation: A failing probe moves `lo`. Every limit up to 33 is now ruled out.
        elsewhere: 33 failed, so `lo = mid + 1 = 34`.
      - name: hi
        start: 7
        correct: 7
        explanation: A failing probe says nothing about the limits above 33, so `hi` stays on 37.
        misses:
          - index: 3
            explanation: Moving `hi` onto the probe is the update for a passing probe. 33 failed.
        elsewhere: Only a passing probe moves `hi`.

  - id: unprobed-top-review
    format: step-trace
    heading: Predict each step
    tags: [binary-search]
    prompt: >-
      With `d = 1`, only a limit that holds every file at once fits. The cells are the limits from
      `max(sizes)` to `sum(sizes)`. Predict each step before it is shown.
    code: |
      sizes, d = [7, 20], 1
      lo, hi = max(sizes), sum(sizes)
      while lo < hi:
          mid = (lo + hi) // 2
          if sessions(sizes, mid) <= d:
              hi = mid
          else:
              lo = mid + 1
      print(lo)
    sequence:
      kind: array
      name: limits
      cells: [20, 21, 22, 23, 24, 25, 26, 27]
    start:
      - { name: lo, at: 0 }
      - { name: hi, at: 7 }
    steps:
      - line: 4
        ask: Where does `lo` sit after the first pass?
        pointer: lo
        correct: 4
        explanation: "`mid` is (20 + 27) // 2 = 23. The pass needs [7] and [20], two sessions, so 23 fails and `lo = 24`."
        misses:
          - index: 3
            explanation: "`lo = mid` would keep 23, which just failed."
          - index: 0
            explanation: 23 fails, so `lo` moves past it.
        elsewhere: 23 needs two sessions, so it fails and `lo = mid + 1 = 24`.
      - line: 4
        ask: Where does `lo` sit after the second pass?
        pointer: lo
        correct: 6
        explanation: "`mid` is (24 + 27) // 2 = 25. 7 + 20 = 27 is over 25, so it fails and `lo = 26`."
        misses:
          - index: 5
            explanation: "`lo = mid` would keep 25, which just failed."
          - index: 4
            explanation: 25 fails too, so `lo` moves again.
        elsewhere: 25 fails, so `lo = 26`.
      - line: 4
        ask: Where does `lo` sit after the third pass?
        pointer: lo
        correct: 7
        explanation: "`mid` is (26 + 27) // 2 = 26. 27 is over 26, so it fails, and `lo = 27` meets `hi`."
        misses:
          - index: 6
            explanation: 26 fails, since 7 + 20 = 27 is over 26, so `lo` moves past it.
        elsewhere: 26 fails, so `lo = 27`.
      - line: 9
        ask: The loop never probed 27. Why is it safe to print it?
        options:
          - id: total-fits
            text: 27 is `sum(sizes)`, which always fits in one session
            explanation: >-
              `hi` starts on a limit known to fit, so the loop never needs to test it. When every
              probe fails, `lo` climbs to `hi`, and the answer is the total.
          - id: not-safe
            text: It isn't. The loop should test `lo` once more after it ends
            explanation: >-
              That test would always pass. `hi` only ever holds a limit known to fit: its start
              value, or a probe that passed.
          - id: found-d
            text: "`lo == hi` means the search found exactly `d` sessions"
            explanation: >-
              `lo == hi` only means one candidate is left. It is the answer because every value
              `hi` has held is known to fit.
        correct: total-fits

  - id: range-doubles-review
    heading: How many reads?
    tags: [binary-search, complexity]
    prompt: >-
      A search over 1,024 candidate limits on `n = 2,000` sizes makes 10 probes. Each `sessions`
      pass reads all 2,000 sizes, so the search makes 20,000 reads. If the range grows to 2,048
      candidates, how many reads does the search make?
    options:
      - id: twenty-two-thousand
        text: 22,000
        explanation: >-
          Doubling the range adds one halving, so the search makes 11 probes. Each still reads all
          2,000 sizes: 11 × 2,000 = 22,000.
      - id: forty-thousand
        text: 40,000
        explanation: >-
          That doubles the work as if the probes grew with the range. They grow with its
          logarithm.
      - id: twenty-thousand
        text: 20,000
        explanation: The probe count depends on the range. A bigger range needs one more halving to get down to one candidate.
      - id: four-million
        text: 4,096,000
        explanation: That is one pass per candidate, 2,048 × 2,000, the cost of testing the limits one by one.
    correct: twenty-two-thousand
    followUps:
      forty-thousand:
        prompt: How many probes does a halving search need for 1,024 candidates, and for 2,048?
        options:
          - id: ten-eleven
            text: 10 and 11
          - id: ten-twenty
            text: 10 and 20
          - id: linear
            text: 1,024 and 2,048
        correct: ten-eleven
        explanation: >-
          Each probe halves the candidates, so the probe count is `log2` of the range. Doubling
          the range costs one more probe, that is one more pass over the sizes.
      twenty-thousand:
        prompt: After the first probe on 2,048 candidates, how many remain?
        options:
          - id: half
            text: 1,024, so the search then needs as many probes as before
          - id: all
            text: All 2,048, since one probe only tests one limit
          - id: one
            text: One, if the probe passes
        correct: half
        explanation: >-
          One probe takes 2,048 candidates down to 1,024, and from there the search runs as
          before. Every doubling of the range adds one probe, and each probe is a full pass.
      four-million:
        prompt: Why can the search skip most of the 2,048 limits?
        options:
          - id: one-side
            text: Each probe's result settles every limit on one side of it
          - id: below-max
            text: Most of the limits are below `max(sizes)`
          - id: cached
            text: The pass is cached between probes
        correct: one-side
        explanation: >-
          A failure rules out every smaller limit and a pass rules out every larger one as the
          smallest. So each probe discards half of what is left.
