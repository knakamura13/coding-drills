id: problem-solving-routine
title: Problem-solving routine
description: Say exactly what a function must return, choose a test that exposes a wrong procedure, and trace the brute force. Each card opens with a worked example, then asks for one decision.
heading: What must it return?

questions:
  - id: values-or-indices
    tags: [python, arrays-strings]
    workedExample: |-
      "return the index of the largest value" on `[4, 9, 2]` asks for `1`,
      the position of the 9, not the 9 itself.
    prompt: |-
      ```python
      # Return the indices i < j of the two numbers in nums
      # that add up to target. Exactly one pair does.
      def two_sum(nums, target): ...
      ```

      What must `two_sum([8, 3, 5, 9], 12)` return?
    options:
      - id: indices
        text: "`[1, 3]`"
        explanation: >-
          3 sits at index 1 and 9 at index 3, and 3 + 9 = 12. The statement asks for indices with
          i < j, so the answer is those two positions in the list the caller passed.
      - id: values
        text: "`[3, 9]`"
        explanation: >-
          3 and 9 are the pair that adds up to 12, but the statement asks where they sit, not what
          they are.
      - id: sorted-indices
        text: "`[0, 3]`"
        explanation: >-
          These are positions in the sorted copy `[3, 5, 8, 9]`. Sorting moves the numbers, so
          index 0 of the copy is not where the 3 sits in the caller's list.
      - id: one-based
        text: "`[2, 4]`"
        explanation: >-
          This counts positions from 1. Python counts from 0, so the 3 sits at index 1 and the 9
          at index 3.
    correct: indices
    followUps:
      values:
        prompt: The statement says "return the indices". For the pair 3 and 9 in `[8, 3, 5, 9]`, what does that ask for?
        options:
          - id: positions
            text: Where the 3 and the 9 sit in `nums`
          - id: numbers
            text: The 3 and the 9 themselves
          - id: between
            text: How many numbers sit between them
        correct: positions
        explanation: >-
          An index names a position. Values and indices are different outputs for the same pair,
          so settle which one the statement asks for before writing any code.
      sorted-indices:
        prompt: In `[8, 3, 5, 9]`, what sits at index 0?
        options:
          - id: eight
            text: 8, so index 0 does not point at the 3
          - id: three
            text: 3, the smallest value
          - id: depends
            text: It depends on whether the list was sorted first
        correct: eight
        explanation: >-
          The caller's list keeps its own order. An index into a sorted copy has to be mapped back
          to the original position before it is returned.
      one-based:
        prompt: In `nums = [8, 3, 5, 9]`, which expression reads the 3?
        options:
          - id: one
            text: "`nums[1]`"
          - id: two
            text: "`nums[2]`"
          - id: three
            text: "`nums[3]`"
        correct: one
        explanation: >-
          The first item is at index 0, so the second item, 3, is at index 1. A returned index has
          to work when the caller reads `nums` with it.

  - format: tap-cell
    id: median-original-index
    tags: [python, arrays-strings]
    workedExample: >-
      For `[12, 5, 8]` the median is 8, the middle value once sorted. It sits
      at index 2, so the function returns 2, although the middle cell holds 5.
    prompt: >-
      Now the input is
      `[9, 4, 7, 1, 6]`. Tap the cell whose index `median_index` must return.
    code: |
      # Return the index, in nums, of the median:
      # the value in the middle once nums is sorted.
      # len(nums) is odd and the values are distinct.
      def median_index(nums): ...

      median_index([9, 4, 7, 1, 6])
    sequence:
      kind: array
      name: nums
      cells: [9, 4, 7, 1, 6]
    correct: 4
    explanation: >-
      Sorted, the values are 1, 4, 6, 7, 9, so the median is 6. The statement asks where 6 sits in
      the list the caller passed, which is index 4.
    misses:
      - index: 0
        explanation: 9 is the largest value. Sorting puts it last, not in the middle.
      - index: 1
        explanation: >-
          4 is the second smallest value, one place left of the middle once sorted. The middle of
          five sorted values is the third one, 6.
      - index: 2
        explanation: >-
          Index 2 is the middle position, both of this list and of the sorted copy. The median is
          a value, 6, and the function returns where that value sits in `nums`.
      - index: 3
        explanation: 1 is the smallest value, so sorting puts it first, not in the middle.

  - id: repeats-in-output
    tags: [python, arrays-strings]
    workedExample: |-
      "return each value that repeats" on `[2, 2, 2]` asks for `[2]`: one
      entry for the value, not one for each extra copy.
    prompt: |-
      ```python
      # Return each value that appears more than once,
      # listed once, in order of first appearance.
      def repeated(nums): ...
      ```

      What must `repeated([4, 1, 4, 2, 1, 4])` return?
    options:
      - id: right
        text: "`[4, 1]`"
        explanation: >-
          4 and 1 both appear more than once, and 2 does not. Listed once each, in the order they
          first appear, that gives `[4, 1]`.
      - id: every-copy
        text: "`[4, 1, 4]`"
        explanation: >-
          This lists every extra copy: the 4 at index 2, the 1 at index 4 and the 4 at index 5.
          The statement asks for each repeated value a single time.
      - id: sorted
        text: "`[1, 4]`"
        explanation: >-
          These are the right values in sorted order. The statement asks for the order of first
          appearance, and 4 shows up before 1.
      - id: indices
        text: "`[0, 1]`"
        explanation: >-
          These are the indices where 4 and 1 first appear. The statement asks for the repeated
          values themselves.
    correct: right
    followUps:
      every-copy:
        prompt: 4 appears three times in the input. How many times does it appear in the output?
        options:
          - id: one-time
            text: One time, since the output names values
          - id: twice
            text: Twice, one for each extra copy
          - id: three
            text: Three times, one for each copy
        correct: one-time
        explanation: >-
          The output is a list of values that repeat, so each value appears in it once, however
          many copies the input holds.
      sorted:
        prompt: Which repeated value appears first in `[4, 1, 4, 2, 1, 4]`?
        options:
          - id: four
            text: 4, at index 0
          - id: one-smaller
            text: 1, because it is smaller
          - id: one-index
            text: 1, at index 1
        correct: four
        explanation: >-
          "Order of first appearance" means reading the input left to right. 4 is at index 0,
          before the 1 at index 1, so 4 comes first.
      indices:
        prompt: What does each entry of the output name?
        options:
          - id: value
            text: A value from `nums`
          - id: position
            text: A position in `nums`
          - id: count
            text: How many copies a value has
        correct: value
        explanation: >-
          The statement says it returns values. Before tracing anything, settle whether the output
          holds values, indices or counts.

  - id: zero-start-max
    heading: Which test exposes the bug?
    tags: [python, arrays-strings]
    workedExample: |-
      A solution that returns `nums[0]` as the smallest value passes on
      `[2, 6]` but fails on `[6, 2]`. A test exposes a bug only when the code's answer differs
      from the right one.
    prompt: |-
      ```python
      # Return the largest value in a non-empty list.
      def largest(nums):
          best = 0
          for x in nums:
              if x > best:
                  best = x
          return best
      ```

      Which test shows that this code is wrong?
    options:
      - id: negatives
        text: "`[-3, -7]`"
        explanation: >-
          The right answer is -3. Neither value beats the starting 0, so `best` stays 0 and the
          call returns a value that is not even in the list. `best` should start from `nums[0]`.
      - id: typical
        text: "`[5, 2, 8]`"
        explanation: >-
          The code returns 8, which is right. A test the code passes cannot expose a bug.
      - id: duplicates
        text: "`[4, 4]`"
        explanation: >-
          The first 4 beats 0, `best` becomes 4, and the second 4 changes nothing. The call
          returns 4, which is right.
      - id: single
        text: "`[7]`"
        explanation: >-
          A one-item list is a good edge case, but 7 beats the starting 0. The call returns 7,
          which is right.
    correct: negatives
    followUps:
      typical:
        prompt: "`largest([5, 2, 8])` returns 8. What does that test tell you about the code?"
        options:
          - id: this-input
            text: Only that it gives the right answer for this input
          - id: correct
            text: That the code is correct
          - id: positives
            text: That the starting value never matters
        correct: this-input
        explanation: >-
          A passing test rules nothing out beyond itself. To catch a bug, pick an input where the
          code's shortcut, here the starting 0, gives a different answer from the statement.
      duplicates:
        prompt: What would a test need for `best = 0` to give the wrong answer?
        options:
          - id: below-zero
            text: Every value below 0
          - id: repeat
            text: Two equal values
          - id: long
            text: More than two values
        correct: below-zero
        explanation: >-
          The starting 0 stays only if no value beats it. That happens when every value is
          negative, and then 0 is returned although it is not in the list.
      single:
        prompt: "`largest([7])` runs the loop once. What is `best` after it?"
        options:
          - id: seven
            text: 7, so the test passes
          - id: zero
            text: 0, because a single item is skipped
          - id: error
            text: An error, because there is nothing to compare
        correct: seven
        explanation: >-
          The loop visits the one item, 7 is greater than 0, and `best` takes it. A single item
          exposes this bug only if it is negative, such as `[-2]`.

  - id: duplicate-separates
    heading: Which test separates them?
    tags: [python, arrays-strings]
    workedExample: |-
      `x * 2` and `x + x` agree on every integer, so no test can separate
      them. Two procedures differ only where some input gives them different answers.
    prompt: |-
      Both functions try to count the distinct values in a list:

      ```python
      def count_a(nums):
          return len(set(nums))

      def count_b(nums):
          count = 0
          for i in range(len(nums)):
              if i == 0 or nums[i] != nums[i - 1]:
                  count += 1
          return count
      ```

      Which test gives different answers from the two?
    options:
      - id: apart
        text: "`[3, 1, 3]`"
        explanation: >-
          `count_a` finds two distinct values, 1 and 3. `count_b` compares each value only with its
          left neighbour, and the two 3s are not neighbours, so it counts 3. `count_b` is right
          only when copies sit together, as in sorted input.
      - id: together
        text: "`[1, 1, 3]`"
        explanation: >-
          The repeat sits right after its copy, so `count_b` skips it. Both return 2.
      - id: empty
        text: "`[]`"
        explanation: >-
          Empty input is worth testing, but both handle it here. The set is empty and the loop
          never runs, so both return 0.
      - id: no-repeats
        text: "`[2, 5, 7]`"
        explanation: >-
          All three values differ, so both return 3. A test with no repeats cannot show how either
          function treats them.
    correct: apart
    followUps:
      together:
        prompt: In `[1, 1, 3]`, where does the second 1 sit relative to the first?
        options:
          - id: next
            text: Right after it
          - id: apart
            text: Two cells away
          - id: after-three
            text: After the 3
        correct: next
        explanation: >-
          `count_b` compares each value with the one just before it, so a copy right after its twin
          is caught. To fool it, the copies of a value have to be apart.
      empty:
        prompt: What does `count_b([])` return?
        options:
          - id: zero
            text: 0, since the loop body never runs
          - id: one
            text: 1, since `i == 0` is always counted
          - id: error
            text: An error, since `nums[i - 1]` reads past the start
        correct: zero
        explanation: >-
          `range(0)` is empty, so no index is checked and `count` stays 0, which matches
          `len(set([]))`.
      no-repeats:
        prompt: Where can `count_a` and `count_b` give different answers?
        options:
          - id: split-copies
            text: On copies of a value that are not next to each other
          - id: long
            text: On any list longer than two items
          - id: negative
            text: On lists with negative numbers
        correct: split-copies
        explanation: >-
          Both count each new value once. They differ only when a value comes back after something
          else, because `count_b` has forgotten it by then.

  - id: empty-mean
    heading: Which test exposes the bug?
    tags: [python, arrays-strings]
    workedExample: |-
      A statement that names a special case is asking for a test of it.
      "Return the first word, or `''` if there is none" calls for a test with no words.
    prompt: |-
      ```python
      # Return the mean of nums, or 0.0 if nums is empty.
      def mean(nums):
          return sum(nums) / len(nums)
      ```

      Which test shows that this code is wrong?
    options:
      - id: empty
        text: "`[]`"
        explanation: >-
          The statement promises 0.0 for an empty list. Here `len(nums)` is 0, so the division
          raises `ZeroDivisionError` instead.
      - id: halves
        text: "`[1, 2]`"
        explanation: >-
          In Python 3, `/` gives a float even for two integers, so the mean of 1 and 2 comes out
          right.
      - id: zero-sum
        text: "`[-2, 2]`"
        explanation: >-
          The sum is 0, but dividing 0 by 2 is fine. The call returns 0.0, which is right.
      - id: single
        text: "`[5]`"
        explanation: >-
          One item is a good edge case, but 5 divided by a length of one is 5.0, which is right.
    correct: empty
    followUps:
      halves:
        prompt: What does `3 / 2` give in Python 3?
        options:
          - id: float
            text: "`1.5`"
          - id: floor
            text: "`1`"
          - id: round-up
            text: "`2`"
        correct: float
        explanation: >-
          `/` is true division in Python 3. Only `//` rounds down.
      zero-sum:
        prompt: Which part of `sum(nums) / len(nums)` must be zero to raise `ZeroDivisionError`?
        options:
          - id: divisor
            text: "`len(nums)`, the number divided by"
          - id: dividend
            text: "`sum(nums)`, the number being divided"
          - id: either
            text: Either one
        correct: divisor
        explanation: >-
          Zero divided by anything nonzero is just zero. The error comes only from dividing by
          zero, and the length is 0 only for an empty list.
      single:
        prompt: What does `mean([5])` divide by?
        options:
          - id: length
            text: 1, the length of the list
          - id: zero
            text: 0, since one item has no neighbours
          - id: value
            text: 5, the value itself
        correct: length
        explanation: >-
          A one-item list is safe to divide by its length. The special case the statement names
          is the empty list, so that is the test to write.

  - format: step-trace
    id: trace-pair-loop
    heading: Trace the brute force
    tags: [python, arrays-strings]
    workedExample: >-
      On `[2, 5, 3]` with target 8, the loops test (0, 1), then (0, 2), then
      (1, 2), where 5 + 3 = 8, and return `[1, 2]`.
    prompt: >-
      Now trace `pair([4, 7, 1, 6], 7)`. Predict
      each step before it is shown.
    code: |
      def pair(nums, target):
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  if nums[i] + nums[j] == target:
                      return [i, j]
          return None

      pair([4, 7, 1, 6], 7)
    sequence:
      kind: array
      name: nums
      cells: [4, 7, 1, 6]
    start:
      - { name: i, at: 0 }
      - { name: j, at: 1 }
    steps:
      - line: 4
        ask: How many pairs does the call test while `i` is 0?
        options:
          - id: three
            text: '3'
            explanation: >-
              4 + 7 = 11, 4 + 1 = 5 and 4 + 6 = 10. None is 7, so the inner loop runs out after
              three tests.
          - id: four
            text: '4'
            explanation: >-
              `j` starts at `i + 1`, so 4 is never paired with itself. Only the three cells after it
              are tested.
          - id: one
            text: '1'
            explanation: >-
              A failed test does not end the search. `return None` sits after both loops, so the
              inner loop goes on to the next `j`.
        correct: three
        also:
          - { name: j, at: 3 }
      - line: 2
        ask: "`i` moves to 1. Where does `j` start?"
        pointer: j
        correct: 2
        explanation: '`range(i + 1, len(nums))` starts one cell after `i`, at index 2.'
        misses:
          - index: 0
            explanation: >-
              Starting at 0 would test 7 with 4 again, a pair already tested as (0, 1). `j` starts
              after `i`.
          - index: 1
            explanation: >-
              `j` on the same cell as `i` would add 7 to itself. The range starts one cell later.
          - index: 3
            explanation: '`j` restarts for each new `i`. It does not carry on from where it stopped.'
        elsewhere: '`j` starts at `i + 1`, which is index 2.'
        also:
          - { name: i, at: 1 }
      - line: 4
        ask: What is `nums[i] + nums[j]` on that test?
        options:
          - id: eight
            text: '8'
            explanation: '`i` reads 7 and `j` reads 1, so the sum is 8. It is not 7, and the loop goes on.'
          - id: eleven
            text: '11'
            explanation: '11 was 4 + 7, the first test. `i` now reads 7 and `j` reads 1.'
          - id: thirteen
            text: '13'
            explanation: '7 + 6 is the test after this one, with `j` at 3. This test has `j` at 2.'
        correct: eight
      - line: 5
        ask: Where is `i` when the call returns?
        pointer: i
        correct: 2
        explanation: >-
          7 + 6 = 13 fails too, so `i` moves to 2 and `j` starts at 3. 1 + 6 = 7, so the call
          returns `[2, 3]`.
        misses:
          - index: 1
            explanation: With `i` at 1 the sums are 7 + 1 = 8 and 7 + 6 = 13. Neither is 7.
          - index: 0
            explanation: Every pair with the 4 was tested first, and none of them summed to 7.
          - index: 3
            explanation: >-
              `j` always sits right of `i`, so a pair is never tested with `i` on the last cell.
        elsewhere: '`i` is on index 2, where 1 + 6 = 7.'
        also:
          - { name: j, at: 3 }
      - line: 5
        ask: How many pairs did the call test in all?
        options:
          - id: six
            text: '6'
            explanation: >-
              Three with `i` at 0, two with `i` at 1, and one with `i` at 2. The match was the last
              pair, so the loops tested every pair once.
          - id: twelve
            text: '12'
            explanation: >-
              That counts each pair twice, once in each order. `j` starts after `i`, so (2, 3) is
              tested and (3, 2) never is.
          - id: five
            text: '5'
            explanation: >-
              The matching test counts too. The call tests (2, 3), finds 7, and only then returns.
        correct: six

  - format: drag-pointers
    id: closest-pair-drag
    heading: Trace the brute force
    tags: [python, arrays-strings]
    workedExample: >-
      On `[10, 4, 6]` the loops measure every gap, 6, 4 and 2, and keep the
      smallest, so the call returns `(1, 2)`.
    prompt: >-
      Now run `closest([9, 2, 14, 5, 11])`. Drag `i` and
      `j` to the pair it returns.
    code: |
      def closest(nums):
          best = None
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  gap = abs(nums[i] - nums[j])
                  if best is None or gap < best[0]:
                      best = (gap, i, j)
          return best[1], best[2]

      closest([9, 2, 14, 5, 11])
    sequence:
      kind: array
      name: nums
      cells: [9, 2, 14, 5, 11]
    pointers:
      - name: i
        start: 0
        correct: 0
        explanation: >-
          The smallest gap is 2, between 9 and 11, and the 9 sits at index 0. The loops compare
          every pair, so no closer pair can be skipped.
        misses:
          - index: 1
            explanation: >-
              2 and 5 are 3 apart, the second smallest gap. 9 and 11 are only 2 apart.
          - index: 3
            explanation: >-
              5 and 11 are the closest neighbours, 6 apart. The loops also compare cells that are
              not side by side, and 9 and 11 are closer.
        elsewhere: The closest pair is 9 and 11, and 9 sits at index 0.
      - name: j
        start: 1
        correct: 4
        explanation: '11, at index 4, is 2 away from 9. No other pair is that close.'
        misses:
          - index: 1
            explanation: >-
              (0, 1) is only the first pair tested. Its gap of 7 is replaced by smaller gaps later.
          - index: 3
            explanation: 5 is 3 away from 2, but 9 and 11 are closer still.
          - index: 2
            explanation: 14 is 5 away from 9. The 11 is closer to it.
        elsewhere: '`j` is on the 11 at index 4, 2 away from the 9.'
