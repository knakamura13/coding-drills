id: bit-manipulation
title: Bit manipulation
description: Read binary, apply the bit operators, clear the lowest set bit, and use an int as a set of flags. Each card has a worked example on hand.
heading: What does this produce?

questions:
  - format: tap-cell
    id: place-values
    heading: Tap the bit worth 32
    tags: [bit-manipulation, python]
    workedExample: |-
      Bit manipulation works on the binary digits of an int, so the first skill is reading them. A
      binary number is written with a `0b` prefix, and each digit, called a bit, is worth twice the
      one to its right. Bits are numbered from the right, starting at 0, so bit `j` is worth
      `2 ** j`. Here the number is `0b1101`.

      1. Reading from the right, bit 0 is 1, bit 1 is 0, bit 2 is 1 and bit 3 is 1.
      2. Bit `j` is worth `2 ** j`, so those bits are worth 1, 2, 4 and 8. A bit that is 1 is called
         a set bit.
      3. The set bits are bits 0, 2 and 3, worth 1, 4 and 8, so `0b1101` is `1 + 4 + 8`, which is 13.
    prompt: >-
      In binary each digit is a bit, and `0b` marks a binary number. Bits are numbered from the
      right, starting at 0, and bit `j` is worth `2 ** j`. The cells show `x`, highest bit first.
      Tap the bit worth 32.
    code: |
      x = 0b10100110
    sequence:
      kind: string
      name: x
      cells: ['1', '0', '1', '0', '0', '1', '1', '0']
    correct: 2
    explanation: >-
      32 is `2 ** 5`, so it is bit 5. Counting from the right and starting at 0, bit 5 is the sixth
      cell from the right, the third from the left.
    misses:
      - index: 0
        explanation: >-
          This is bit 7, the highest of the eight, worth `2 ** 7`, which is 128. 32 is `2 ** 5`, two
          places lower.
      - index: 1
        explanation: This is bit 6, worth 64. 32 is half of that, one place to the right.
      - index: 3
        explanation: >-
          Counting from 1 makes this bit 5, but the numbering starts at 0 with the rightmost bit. This
          is bit 4, worth 16.
      - index: 4
        explanation: >-
          Counting from the left and starting at 1 makes this bit 5, but bits are numbered from the
          right, starting at 0. This is bit 3, worth 8.
      - index: 5
        explanation: >-
          Counting from the left makes this bit 5, but bits are numbered from the right. This is bit
          2, worth 4.
      - index: 6
        explanation: This is bit 1, worth 2. Each place to the left doubles the worth.
      - index: 7
        explanation: >-
          This is bit 0, the rightmost, worth `2 ** 0`, which is 1. It is the lowest place, not the
          highest.

  - id: binary-to-int
    heading: What does this print?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `0b100101`. A bit that is 1 is a set bit, and bit `j`, counted from the right starting
      at 0, is worth `2 ** j`.

      1. Reading from the right, the digits are 1, 0, 1, 0, 0 and 1, so the set bits are bits 0, 2
         and 5.
      2. Bit 0 is worth `2 ** 0`, which is 1, bit 2 is worth 4, and bit 5 is worth 32.
      3. The 0 bits add nothing, so `0b100101` is `1 + 4 + 32`, which is 37.
    prompt: |-
      A bit that is 1 is called a set bit. An int is the sum of what its set bits are worth, and bit
      `j`, counted from the right starting at 0, is worth `2 ** j`.

      ```python
      print(0b11010)
      ```

      What does this print?
    options:
      - id: twenty-six
        text: "`26`"
        explanation: >-
          Counted from the right, the set bits of `0b11010` are bits 1, 3 and 4. They are worth 2, 8
          and 16, which sum to 26.
      - id: eleven
        text: "`11`"
        explanation: >-
          11 is `0b01011`, the same digits read from the other end. Bit 0 is the rightmost digit,
          which is 0 here, and bit 4, the leftmost, is worth 16.
      - id: three
        text: "`3`"
        explanation: >-
          3 counts the set bits. Each set bit adds what its place is worth, and here those are 2, 8
          and 16.
      - id: digits
        text: "`11010`"
        explanation: >-
          `print` shows an int in decimal, however it was written. The `0b` prefix only tells Python
          to read the digits as binary.
    correct: twenty-six
    followUps:
      eleven:
        prompt: Which digit of `0b11010` is bit 0?
        options:
          - { id: rightmost, text: "The rightmost digit, worth 1" }
          - { id: leftmost, text: "The leftmost digit, worth 1" }
          - { id: lowest-one, text: "The rightmost 1, worth 2" }
        correct: rightmost
        explanation: >-
          Bits are numbered by place from the right, whether they are 0 or 1, so the rightmost
          digit is bit 0, worth 1. In `0b11010` that digit is 0, and the leftmost is bit 4, worth 16.
      three:
        prompt: What does one set bit add to an int's value?
        options:
          - { id: worth, text: "What its place is worth, `2 ** j` for bit `j`" }
          - { id: one, text: "1, wherever it sits" }
          - { id: index, text: "Its bit number `j`" }
        correct: worth
        explanation: >-
          A set bit adds the worth of its place, so bit 4 adds 16 and bit 1 adds 2. Counting the set
          bits gives how many there are, not the value.
      digits:
        prompt: What does `print(0b101)` show?
        options:
          - { id: five, text: "`5`" }
          - { id: same, text: "`101`" }
          - { id: prefixed, text: "`0b101`" }
        correct: five
        explanation: >-
          `0b101` is the int 5, bits 0 and 2 set, and `print` shows ints in decimal. The binary
          digits are only how the literal was typed.

  - id: bits-and-or
    heading: What does this print?
    tags: [bit-manipulation, python]
    workedExample: |-
      Bit manipulation works on the binary digits, called bits, of an int. Bits are numbered from
      the right, starting at 0, and bit `j` is worth `2 ** j`. Consider `6` and `3`, which are
      `0b110` and `0b011`. `&` and `|` compare them one bit at a time.

      1. Lined up, `110` and `011` are both set only at bit 1, worth 2. `&` keeps a bit set in both,
         so `6 & 3` is `0b010`, which is 2.
      2. Every bit is set in at least one of the two numbers. `|` keeps a bit set in either, so
         `6 | 3` is `0b111`, which is 7.
      3. Each bit is decided on its own, so nothing carries from one place to the next. That is why
         `6 | 3` is 7 here while `6 + 3` is 9.
    prompt: |-
      A bit that is 1 is called a set bit. To write an int in binary, set the bit with the largest
      worth that fits and repeat on what is left: 21 is 16 + 4 + 1, which is `0b10101`. `&` and `|`
      compare two ints one bit at a time: `a & b` has a set bit where both `a` and `b` have one, and
      `a | b` where at least one of them does.

      ```python
      print(12 & 10, 12 | 10)
      ```

      What does this print?
    options:
      - id: eight-fourteen
        text: "`8 14`"
        explanation: >-
          `12` is `0b1100` and `10` is `0b1010`. Only bit 3, worth 8, is set in both, so `12 & 10`
          is 8. Bits 3, 2 and 1 are set in at least one, so `12 | 10` is `0b1110`, which is 14.
      - id: fourteen-eight
        text: "`14 8`"
        explanation: >-
          That swaps the two rules. `&` keeps a bit only where both numbers have it, the stricter
          test, so it gives the smaller result here.
      - id: eight-twenty-two
        text: "`8 22`"
        explanation: >-
          22 is `12 + 10`. Both numbers have bit 3 set, and `|` keeps that bit once instead of
          carrying it into bit 4, so `12 | 10` is 14.
      - id: ten-twelve
        text: "`10 12`"
        explanation: >-
          Those are `12 and 10` and `12 or 10`, which each return one of the two numbers whole. `&`
          and `|` work bit by bit and build a new number.
    correct: eight-fourteen
    followUps:
      fourteen-eight:
        prompt: Which bits does `a & b` keep?
        options:
          - { id: both, text: "The bits set in both `a` and `b`" }
          - { id: either, text: "The bits set in at least one of `a` and `b`" }
          - { id: neither, text: "The bits set in neither `a` nor `b`" }
        correct: both
        explanation: >-
          `&` needs both bits set, and `|` needs at least one. For 12 and 10 only bit 3 is set in
          both, so `12 & 10` is 8, and `12 | 10` is the larger 14.
      eight-twenty-two:
        prompt: When does `a | b` equal `a + b`?
        options:
          - { id: disjoint, text: "When `a` and `b` share no set bit, so no place is counted twice" }
          - { id: always, text: "Always, since `|` is the bitwise way to add two ints" }
          - { id: powers, text: "Only when `a` and `b` are both powers of two" }
        correct: disjoint
        explanation: >-
          Addition carries when both numbers have a 1 in the same place, and `|` does not. With no
          shared set bit there is nothing to carry, so the two agree: `3 | 4` and `3 + 4` are both 7.
          `4 | 4` is 4, so two powers of two are not enough.
      ten-twelve:
        prompt: How do `&` and `and` differ on two ints?
        options:
          - { id: bitwise, text: "`&` compares bit by bit, and `and` returns one of the two ints" }
          - { id: same, text: "They are the same operator, written two ways" }
          - { id: reversed, text: "`and` compares bit by bit, and `&` returns one of the two ints" }
        correct: bitwise
        explanation: >-
          `12 and 10` returns 10 and `12 or 10` returns 12, whole numbers picked by truth. `&` and
          `|` build a new int from the bits, which gives 8 and 14.

  - id: bits-xor
    heading: What does this print?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `6 ^ 3`. `6` is `0b110` and `3` is `0b011`, and `^` sets a bit in the result where
      exactly one of the two numbers has it set.

      1. Bit 2, worth 4, is set in 6 and not in 3, so it is set in the result.
      2. Bit 1, worth 2, is set in both, so it is not. Bit 0, worth 1, is set only in 3, so it is.
      3. The result has bits 2 and 0 set, so `6 ^ 3` is `0b101`, which is 5.
    prompt: |-
      `^`, called XOR, compares two ints one bit at a time: `a ^ b` has a set bit where exactly one
      of `a` and `b` has one.

      ```python
      print(12 ^ 10)
      ```

      What does this print?
    options:
      - id: six
        text: "`6`"
        explanation: >-
          `12` is `0b1100` and `10` is `0b1010`. Bit 2, worth 4, and bit 1, worth 2, are each set in
          only one of them, and bit 3 is set in both. So `12 ^ 10` is `0b0110`, which is 6.
      - id: eight
        text: "`8`"
        explanation: >-
          8 is `12 & 10`: bit 3 is the only bit set in both. `^` looks for the opposite, the bits
          set in exactly one.
      - id: fourteen
        text: "`14`"
        explanation: >-
          14 is `12 | 10`. `^` keeps a bit set in exactly one number, so bit 3, set in both, is
          dropped.
      - id: two
        text: "`2`"
        explanation: >-
          2 is `12 - 10`. `^` compares the two numbers bit by bit and never borrows, so it is not
          subtraction. Here the bits set in exactly one are worth 4 and 2.
    correct: six
    followUps:
      eight:
        prompt: Where does `a ^ b` have a set bit?
        options:
          - { id: differ, text: "Where exactly one of `a` and `b` has a set bit" }
          - { id: both, text: "Where both `a` and `b` have a set bit" }
          - { id: either, text: "Where at least one of `a` and `b` has a set bit" }
        correct: differ
        explanation: >-
          XOR is 1 where the bits differ. A bit set in both is `&`, and a bit set in at least one
          is `|`. For 12 and 10 the bits differ at bits 2 and 1, so `12 ^ 10` is 6.
      fourteen:
        prompt: How does `a ^ b` differ from `a | b`?
        options:
          - { id: drops-shared, text: "`^` drops a bit set in both, and `|` keeps it" }
          - { id: keeps-shared, text: "`^` keeps only the bits set in both, and `|` drops them" }
          - { id: zero-only, text: "They differ only when one of the numbers is 0" }
        correct: drops-shared
        explanation: >-
          Both keep a bit set in exactly one number. A bit set in both stays in `a | b` and is
          dropped from `a ^ b`, which is why bit 3 of 12 and 10 is in 14 and not in 6.
      two:
        prompt: Which statement about `^` is true?
        options:
          - { id: per-bit, text: "It works on each bit separately, so `12 ^ 10` and `10 ^ 12` are both 6" }
          - { id: subtract, text: "It subtracts the smaller number from the larger, so `12 ^ 10` is 2" }
          - { id: ordered, text: "It depends on the order, so `12 ^ 10` and `10 ^ 12` differ" }
        correct: per-bit
        explanation: >-
          `^` compares each place on its own and has no borrows, so the order of the two numbers
          does not matter. The places where 12 and 10 disagree are worth 4 and 2, which gives 6.

  - id: bits-shift-drag
    format: drag-pointers
    heading: Where does each 1 land?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `3 << 1`. `3` is `011` in binary, and `<< k` moves every digit `k` places toward the
      high end, filling the low places with 0s.

      1. Moving each digit of `011` one place up and putting a 0 in the lowest place gives `110`.
      2. `110` has a 1 in the places worth 4 and 2, so it is 6.
      3. Each place is worth twice the place below it, so moving every digit up one place doubles
         the value: `3 << 1` is `3 * 2`, which is 6.
    prompt: >-
      `x << k` moves every bit of `x` `k` places toward the high end and fills the low places with
      0s. The cells show `x = 0b00010110` (22) with the highest bit first. `top` marks its highest
      set bit and `low` its lowest set bit. Drag each pointer to where that bit sits after line 2.
    code: |
      x = 0b00010110
      x = x << 2
    sequence: { kind: string, name: x, cells: ['0', '0', '0', '1', '0', '1', '1', '0'] }
    pointers:
      - name: top
        start: 3
        correct: 1
        explanation: >-
          `<< 2` moves every digit two places toward the high end, which is left in this drawing.
          The 1 at index 3 moves to index 1, and `x` becomes `01011000`, which is 88, four times 22.
        misses:
          - index: 5
            explanation: >-
              That is two places toward the low end, which `>> 2` does. `<<` moves digits toward
              the high end and multiplies the value.
          - index: 2
            explanation: >-
              Every digit moves by the shift count. The count here is 2, so the 1 moves two places,
              not one.
        elsewhere: Every digit moves exactly two places toward the high end, on the left.
      - name: low
        start: 6
        correct: 4
        explanation: >-
          The lowest 1 moves two places left as well, from index 6 to index 4. Two 0s fill the
          places it and the digit below it left behind.
        misses:
          - index: 6
            explanation: >-
              A shift moves every digit, not only the top one. The new lowest places are filled
              with 0s, so the 1 cannot stay at index 6.
          - index: 7
            explanation: >-
              Moving toward the right is what `>>` does. `<<` moves this 1 two places left.
        elsewhere: The lowest 1 moves two places left, the same as every other digit.

  - id: shift-right
    heading: What does this print?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `20 >> 3`. `20` is `0b10100`, and `>> 3` moves every bit 3 places toward the low end,
      so its 3 lowest bits are dropped.

      1. The 3 lowest bits of `0b10100` are `100`. Dropping them leaves `0b10`, which is 2.
      2. Each place down halves a bit's worth, so 3 places divide by `2 ** 3`, which is 8. The exact
         quotient `20 / 8` is 2.5.
      3. The dropped bits held the remainder, 4, and they are gone, so the shift rounds down:
         `20 >> 3` is 2, the same as `20 // 8`.
    prompt: |-
      `x >> k` moves every bit of `x` `k` places toward the low end, and the bits that move past
      bit 0 are dropped. Each place down halves a bit's worth. `//` divides and rounds down, so
      `7 // 2` is 3.

      ```python
      print(45 >> 2)
      ```

      What does this print?
    options:
      - id: eleven
        text: "`11`"
        explanation: >-
          `45` is `0b101101`. Dropping its two lowest bits, `01`, leaves `0b1011`, which is 11. Two
          places down divide by 4, and the dropped bits were the remainder, so this is `45 // 4`.
      - id: fraction
        text: "`11.25`"
        explanation: >-
          11.25 is `45 / 4`. The dropped bits are simply lost, so a shift rounds down the way `//`
          does and returns an int.
      - id: one-place
        text: "`22`"
        explanation: >-
          22 is `45 >> 1`, one place down. The second place halves again, so `>> 2` divides by
          `2 ** 2`, which is 4.
      - id: left
        text: "`180`"
        explanation: >-
          180 is `45 << 2`, four times 45. `>>` points the other way, so its result is below 45,
          not above it.
    correct: eleven
    followUps:
      fraction:
        prompt: What type does `45 >> 2` return?
        options:
          - { id: int, text: "An int, since a shift of an int is always an int" }
          - { id: float-dropped, text: "A float, whenever the shift drops a set bit" }
          - { id: like-division, text: "The same type as `45 / 4`, which is a float" }
        correct: int
        explanation: >-
          The bits that move past bit 0 are thrown away, the way `//` throws away a remainder. So
          `45 >> 2` is the int 11, the same as `45 // 4`.
      one-place:
        prompt: How many times does `x >> k` halve `x`, rounding down?
        options:
          - { id: k-times, text: "`k` times, so it divides by `2 ** k`" }
          - { id: once, text: "Once, whatever `k` is" }
          - { id: by-k, text: "It divides by `k` once instead of halving" }
        correct: k-times
        explanation: >-
          Each place down halves the value, and `>> k` moves `k` places. So `45 >> 1` is 22, and
          one more place gives `22 >> 1`, which is 11.
      left:
        prompt: Which way does `>>` move the bits?
        options:
          - { id: low, text: "Toward the low end, which makes the number smaller" }
          - { id: high, text: "Toward the high end, which makes the number larger" }
          - { id: odd, text: "Toward the low end for odd numbers and the high end for even ones" }
        correct: low
        explanation: >-
          `>>` points toward the low end and `<<` toward the high end. `45 >> 2` is 11, and
          `45 << 2` is 180.

  - id: bits-tap-lowest
    format: tap-cell
    heading: Tap the digit that changes
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `n = 12`, which is `1100` in binary. `n & (n - 1)` combines `n` with the number one
      below it, keeping a 1 only where both have one.

      1. `n - 1` is 11, which is `1011`. Subtracting 1 borrowed from the lowest 1 of `1100`: that 1
         became a 0, and the two 0s below it became 1s.
      2. Above that lowest 1, nothing changed, so `1100` and `1011` both have a 1 in the top place.
         `&` keeps it.
      3. At the lowest 1 and below it, step 1 shows the two numbers disagree in every place, so `&`
         gives 0 there. So `12 & 11` is `1000`, which is 8: only the lowest 1 was cleared.
    prompt: >-
      Subtracting 1 from `n` turns its lowest set bit into 0 and every 0 below it into 1, and leaves
      the bits above it alone. The cells show `n` from line 1, highest bit first. Tap the digit that
      line 2 turns from 1 to 0.
    code: |
      n = 0b10110100
      n = n & (n - 1)
    sequence:
      kind: string
      name: n
      cells: ['1', '0', '1', '1', '0', '1', '0', '0']
    correct: 5
    explanation: >-
      `n - 1` is `10110011`: the 1 at index 5 becomes 0 and the two 0s below it become 1. `&`
      keeps a 1 only where both numbers have one, so the result is `10110000`. Only index 5
      changed.
    misses:
      - index: 0
        explanation: >-
          This is the highest 1. Subtracting 1 changes only the low end: the lowest 1 and the 0s
          below it. Index 0 is 1 in both `n` and `n - 1`, so it stays.
      - index: 1
        explanation: This digit is already 0, so nothing can turn it from 1 to 0.
      - index: 2
        explanation: >-
          This 1 sits above the lowest 1. `n - 1` leaves it alone, so it is 1 in both numbers and
          the `&` keeps it.
      - index: 3
        explanation: >-
          This is the next 1 above the lowest 1, but the borrow from subtracting 1 stops at the
          lowest 1, at index 5. This digit is the same in `n - 1`, so it stays.
      - index: 4
        explanation: This digit is already 0, so nothing can turn it from 1 to 0.
      - index: 6
        explanation: >-
          `n - 1` turns this 0 into a 1, but `n` has a 0 here, so the `&` gives 0. It was 0
          before line 2 and is 0 after it.
      - index: 7
        explanation: >-
          Subtracting 1 flips more than the last digit when that digit is 0: the borrow runs up
          to the lowest 1. This digit is 0 in `n`, so the `&` leaves it 0.

  - id: bits-trace-popcount
    format: step-trace
    heading: Predict each step
    tags: [bit-manipulation, complexity, python]
    workedExample: |-
      Consider `count_ones(0b1010)`. Each pass runs `n &= n - 1`, which clears the lowest 1 of `n`,
      and adds 1 to `count`. The loop stops when `n` is 0.

      1. The lowest 1 of `0b1010` is in the 2 place. The first pass clears it, so `n` becomes
         `0b1000` and `count` is 1.
      2. `0b1000` is not 0, so the loop runs again. Its lowest 1 is in the 8 place. The second pass
         clears it, so `n` becomes 0 and `count` is 2.
      3. `n` is 0, so the `while` test fails and the call returns `2`. Each pass cleared one 1, so
         the passes count the 1 digits.
    prompt: >-
      `n &= n - 1` means `n = n & (n - 1)`, which clears the lowest set bit of `n`. Below, the cells
      show the starting `n`, highest bit first, and they do not change as `n` does. `low` marks the
      lowest set bit still in `n`. Predict each step before it is shown.
    code: |
      def count_ones(n):
          count = 0
          while n:
              n &= n - 1
              count += 1
          return count

      count_ones(0b01101000)
    sequence: { kind: string, name: n, cells: ['0', '1', '1', '0', '1', '0', '0', '0'] }
    start:
      - { name: low, at: 4 }
    steps:
      - line: 4
        ask: After the first pass, which digit is the lowest set bit of `n`?
        pointer: low
        correct: 2
        explanation: >-
          Line 4 clears the lowest 1, at index 4, and leaves `01100000`, which is 96. The lowest 1
          left is the one at index 2.
        misses:
          - index: 4
            explanation: >-
              That is the 1 line 4 clears. `n & (n - 1)` always removes the lowest 1, so it is 0
              after the first pass.
          - index: 5
            explanation: >-
              `n - 1` turns the 0s below the lowest 1 into 1s, but `n` has 0s there, so the `&`
              keeps them 0.
          - index: 1
            explanation: >-
              One pass clears only one 1. The 1 at index 2 is still set, and it is lower than
              index 1.
        elsewhere: Each pass clears only the lowest 1, so the next 1 up becomes the lowest.
      - line: 4
        ask: After the second pass, which digit is the lowest set bit of `n`?
        pointer: low
        correct: 1
        explanation: >-
          The second pass clears the 1 at index 2 and leaves `01000000`, which is 64. Only the 1
          at index 1 is left.
        misses:
          - index: 2
            explanation: That 1 was the lowest at the start of this pass, so this pass cleared it.
          - index: 0
            explanation: >-
              Index 0 was 0 from the start, and clearing bits never sets one. The 1 at index 1 is
              still there.
        elsewhere: The second pass clears the 1 at index 2, which leaves only index 1.
      - line: 6
        ask: The loop runs until `n` is 0. What does the call return?
        options:
          - id: three
            text: '3'
            explanation: >-
              The third pass clears the 1 at index 1, `n` becomes 0 and the `while` test fails.
              Three passes ran, one per 1 digit, so `count` is 3.
          - id: seven
            text: '7'
            explanation: >-
              7 is the number of digits from the highest 1 down to bit 0. The loop never visits
              the 0 digits; each pass jumps to the next 1.
          - id: eight
            text: '8'
            explanation: >-
              8 is the number of cells drawn. The leading 0 and the 0s between the 1s add no pass,
              because each pass clears a 1.
        correct: three

  - id: bits-review-power-of-two
    heading: Which test is right?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `n = 16`, which is `0b10000`, and `n = 20`, which is `0b10100`. `n & (n - 1)`
      clears the lowest set bit of `n` and keeps every bit above it.

      1. 16 has one set bit, bit 4. Clearing it leaves no set bit, so `16 & 15` is 0.
      2. 20 has two set bits, bits 4 and 2. Clearing bit 2 leaves bit 4 set, so `20 & 19` is
         `0b10000`, which is 16.
      3. So `n & (n - 1)` is 0 for 16 and 16 for 20: the result keeps every set bit but the lowest.
    prompt: >-
      `n` is an int that is 0 or more. A power of two (1, 2, 4, 8 and so on) has exactly one set
      bit. Which test is `True` exactly when `n` is a power of two?
    options:
      - id: right
        text: "`n > 0 and (n & (n - 1)) == 0`"
        explanation: >-
          `n & (n - 1)` clears the lowest set bit, so it is 0 only when `n` had at most one. A
          power of two has exactly one, and `n > 0` rules out 0, which has none. For 1 to 69 the
          test accepts 1, 2, 4, 8, 16, 32 and 64.
      - id: allows-zero
        text: "`n >= 0 and (n & (n - 1)) == 0`"
        explanation: >-
          0 has no set bit, so `&` with it gives 0 whatever `n - 1` is, and this test returns
          `True` for 0. The powers of two start at `2 ** 0`, which is 1.
      - id: plus-one
        text: "`n > 0 and (n & (n + 1)) == 0`"
        explanation: >-
          This passes for 1, 3, 7, 15 and 31, and it fails for 2: `2 & 3` is 2. It looks for a
          run of set bits from bit 0 up, not a single set bit.
      - id: even
        text: "`n > 0 and (n & 1) == 0`"
        explanation: >-
          `n & 1` keeps only bit 0, so this tests whether `n` is even. It accepts 6 and 12, which
          have two set bits, and it rejects 1, which is `2 ** 0`.
    correct: right
    followUps:
      allows-zero:
        prompt: What does `n >= 0 and (n & (n - 1)) == 0` give when `n` is 0?
        options:
          - { id: passes, text: "`True`, since 0 has no set bit, but 0 is not a power of two" }
          - { id: fails, text: "`False`, since there is no lowest set bit to clear" }
          - { id: counts, text: "`True`, which is right, since 0 is `2 ** 0`" }
        correct: passes
        explanation: >-
          `&` keeps a bit only where both numbers have it set, and 0 has none, so `0 & x` is 0 for
          any `x`. The clear-the-lowest-bit test cannot tell one set bit from none, so 0 needs its
          own check. `2 ** 0` is 1.
      plus-one:
        prompt: Which numbers make `(n & (n + 1)) == 0` true?
        options:
          - { id: all-ones, text: "Numbers whose binary digits are all 1, such as 3 and 7" }
          - { id: powers, text: "Powers of two, such as 2 and 8" }
          - { id: odd, text: "Every odd number" }
        correct: all-ones
        explanation: >-
          Adding 1 to a run of 1s carries all the way up, as in `0111 + 1 = 1000`, so the two share
          no bit. For a power of two above 1, `n + 1` keeps the same top bit, so the test fails,
          and 5 fails too: `5 & 6` is 4.
      even:
        prompt: Which number does `n > 0 and (n & 1) == 0` get wrong?
        options:
          - { id: twelve, text: "12, which is even but has two set bits, `1100`" }
          - { id: sixteen, text: "16, which is even and has one set bit, `10000`" }
          - { id: nine, text: "9, which is odd and has two set bits, `1001`" }
        correct: twelve
        explanation: >-
          Every power of two above 1 is even, but most even numbers are not powers of two. 12 is
          even with two set bits, so the test wrongly accepts it. It rightly accepts 16 and rightly
          rejects 9.

  - id: pick-items-from-mask
    heading: Which items does it pick?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `items = ['x', 'y', 'z']` and `mask = 6`, which is `0b110`. Item `j` is picked when
      `(mask >> j) & 1` is 1.

      1. For `j = 0`, `6 >> 0` is 6, `0b110`. Its bit 0 is 0, so `& 1` gives 0 and `'x'` is not
         picked.
      2. For `j = 1`, `6 >> 1` is 3, `0b11`. Its bit 0 is 1, so `'y'` is picked. For `j = 2`,
         `6 >> 2` is 1, so `'z'` is picked too.
      3. So mask 6 picks `['y', 'z']`, items 1 and 2, the places of its set bits.
    prompt: |-
      A mask is an int whose bit `j` says whether item `j` is picked. `(mask >> j) & 1` moves bit
      `j` down to bit 0 and keeps only that bit, so it is 1 when bit `j` is set and 0 when it is not.

      ```python
      items = ['p', 'q', 'r', 's']
      mask = 5
      picked = [items[j] for j in range(4) if (mask >> j) & 1]
      print(picked)
      ```

      What does this print?
    options:
      - id: p-r
        text: "`['p', 'r']`"
        explanation: >-
          5 is `0b0101`, with bits 0 and 2 set. `(5 >> 0) & 1` and `(5 >> 2) & 1` are 1, and the
          tests for `j = 1` and `j = 3` are 0, so items 0 and 2 are picked.
      - id: q-s
        text: "`['q', 's']`"
        explanation: >-
          That reads `0101` onto the list from the left. Bit `j` is counted from the right, so bit
          0, the rightmost digit, goes with `items[0]`.
      - id: p-q
        text: "`['p', 'q']`"
        explanation: >-
          5 has two set bits, but which items are picked depends on where those bits sit, not on
          how many there are. They are bits 0 and 2.
      - id: p-q-r
        text: "`['p', 'q', 'r']`"
        explanation: >-
          That treats `mask >> j` alone as the test, which is not 0 for `j` up to 2. `& 1` keeps
          only bit 0 of the shifted value, and `5 >> 1` is `0b10`, whose bit 0 is 0.
    correct: p-r
    followUps:
      q-s:
        prompt: Which item does bit 0 of `mask` go with?
        options:
          - { id: first, text: "`items[0]`, since bit 0 is the rightmost digit" }
          - { id: last, text: "`items[3]`, since the rightmost digit lines up with the last item" }
          - { id: leftmost, text: "`items[0]`, since bit 0 is the leftmost digit" }
        correct: first
        explanation: >-
          `(mask >> 0) & 1` reads bit 0, the rightmost digit, for `items[0]`. Binary is written
          highest bit first, so on paper the list order runs right to left.
      p-q:
        prompt: "Which items does mask 6 (`0b0110`) pick from `['p', 'q', 'r', 's']`?"
        options:
          - { id: q-r, text: "`['q', 'r']`" }
          - { id: p-q, text: "`['p', 'q']`" }
          - { id: r-s, text: "`['r', 's']`" }
        correct: q-r
        explanation: >-
          6 has bits 1 and 2 set, so it picks items 1 and 2. Mask 5 also has two set bits, at bits
          0 and 2, so it picks a different pair.
      p-q-r:
        prompt: Why is `'q'` left out of `picked`?
        options:
          - { id: clear, text: "Bit 0 of `5 >> 1`, which is `0b10`, is clear" }
          - { id: shifted-zero, text: "`5 >> 1` is 0, so the test fails" }
          - { id: skipped, text: "The comprehension never tests `j = 1`" }
        correct: clear
        explanation: >-
          `5 >> 1` is 2, which is not 0, so `mask >> j` alone would pick `'q'`. `& 1` keeps only
          the lowest bit of 2, and that bit is 0.

  - id: bits-mask-subsets
    heading: Which loop visits every subset?
    tags: [bit-manipulation, backtracking, python]
    workedExample: |-
      Consider the items `['x', 'y']`, at index 0 and index 1. A mask is an int whose bit `j` says
      whether item `j` is in the subset.

      1. Two items need two bits, and every pattern of two bits is a mask: `00`, `01`, `10` and
         `11`, which are 0, 1, 2 and 3.
      2. Mask 0 (`00`) sets no bit and picks nothing. Mask 1 (`01`) sets bit 0 and picks `['x']`.
         Mask 2 (`10`) sets bit 1 and picks `['y']`.
      3. Mask 3 (`11`) sets both bits and picks `['x', 'y']`. So the four masks 0 to 3 give the four
         subsets, each exactly once.
    prompt: |-
      A subset of `n` items is any choice of them, from none to all. Each item is in or out, so `n`
      items have `2 ** n` subsets. A subset's mask has bit `j` set when item `j` is in, and every
      other bit 0.

      Which loop visits the mask of each subset of `n` items exactly once, the empty set and the
      full set included?
    options:
      - id: full-range
        text: "`for mask in range(1 << n):`"
        explanation: >-
          `1 << n` is `2 ** n`, so the masks run from 0 up to `2 ** n - 1`. Each item has its own
          bit, so every pattern of picks is one mask, and there are `2 ** n` of them. For three
          items that is 8 masks, from 0 (nothing) to 7 (`111`, everything).
      - id: from-one
        text: "`for mask in range(1, (1 << n) + 1):`"
        explanation: >-
          This visits `2 ** n` masks too, but they run from 1 to `2 ** n`. It skips mask 0, the
          empty set's mask, and its last mask, `1 << n`, sets bit `n`, which belongs to no item.
          For three items it visits 1 to 8, and 8 is `0b1000`.
      - id: skip-full
        text: "`for mask in range((1 << n) - 1):`"
        explanation: >-
          `range` stops before its end, so this loop stops at `2 ** n - 2`. The mask with every
          bit set is never visited. For three items it visits 0 to 6, which is 7 of the 8 subsets.
      - id: n-masks
        text: "`for mask in range(n):`"
        explanation: >-
          This visits only `n` masks. For three items it visits 0, 1 and 2, which pick nothing,
          the first item alone and the second item alone. Pairs and the full set are never
          reached.
    correct: full-range
    followUps:
      from-one:
        prompt: Which mask belongs to the empty set?
        options:
          - { id: zero, text: "0, since no item is in and every bit is 0" }
          - { id: one, text: "1, since the masks are counted from 1" }
          - { id: stop, text: "`1 << n`, the first value past the full set" }
        correct: zero
        explanation: >-
          The empty set has no item in, so its mask has no bit set, which is 0. `1 << n` sets bit
          `n`, and no item has that bit. A loop that visits the empty set starts at 0.
      skip-full:
        prompt: For three items, which mask stands for the full set?
        options:
          - { id: seven, text: "7, which is `111` in binary" }
          - { id: eight, text: "8, which is `1000` in binary" }
          - { id: six, text: "6, which is `110` in binary" }
        correct: seven
        explanation: >-
          The full set has every one of the three bits set, `111`, which is `2 ** 3 - 1`. 8 is
          `1 << 3`, the stop value of `range(1 << 3)`, so it is never a mask.
      n-masks:
        prompt: How many subsets does a set of `n` distinct items have?
        options:
          - { id: power, text: "`2 ** n`, since each item is in or out on its own" }
          - { id: linear, text: "`n`, one for each item" }
          - { id: factorial, text: "`n!`, one for each order of the items" }
        correct: power
        explanation: >-
          Each item doubles the count: every subset without it has a twin with it. So three items
          give 8 subsets. Order does not matter in a subset, so `n!` counts something else.

  - id: toggle-one-bit
    heading: What does this print?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `m = 0b1000` and the mask `1 << 1`, which is `0b0010`. `^` sets a bit where exactly
      one of the two numbers has it set.

      1. Bit 1 of `m` is 0 and bit 1 of the mask is 1, so exactly one of them is set, and bit 1 of
         `m ^ (1 << 1)` is 1.
      2. Every other bit of the mask is 0, so the other bits of `m` are kept as they are:
         `m ^= 1 << 1` makes `m` equal `0b1010`, which is 10.
      3. `m | (1 << 1)` is also `0b1010`, since `|` sets bit 1 too. On a bit that is 0, flipping it
         and setting it give the same result.
    prompt: |-
      `1 << j` moves a 1 up to bit `j`, so it is a mask whose only set bit is bit `j`. `m ^= x`
      means `m = m ^ x`.

      ```python
      m = 0b1101
      m ^= 1 << 2
      print(m)
      ```

      What does this print?
    options:
      - id: nine
        text: "`9`"
        explanation: >-
          `1 << 2` is `0b0100`. Bit 2 of `m` is set too, and `^` drops a bit set in both, so it
          turns off: `0b1001`, which is 9. Every other bit of `m` meets a 0 and stays.
      - id: thirteen
        text: "`13`"
        explanation: >-
          13 is `m | (1 << 2)`, which sets bit 2, and bit 2 was already set. `^` drops a bit that
          is set in both numbers, so bit 2 flips to 0.
      - id: fifteen
        text: "`15`"
        explanation: >-
          15 is `13 ^ 2`, which XORs the bit number itself. `1 << 2` is 4, the mask for bit 2,
          while 2 is the mask for bit 1.
      - id: seventeen
        text: "`17`"
        explanation: >-
          17 is `13 + 4`. Adding carries out of bit 2 because it is already set. `^` never carries:
          it flips bit 2 alone.
    correct: nine
    followUps:
      thirteen:
        prompt: What does `m ^= 1 << j` do to bit `j` when it is already set?
        options:
          - { id: off, text: "Turns it off, since a bit set in both is dropped" }
          - { id: stays, text: "Leaves it set, the way `m |= 1 << j` would" }
          - { id: carry, text: "Turns it off and sets bit `j + 1`, like a carry" }
        correct: off
        explanation: >-
          `^` keeps a bit set in exactly one number, so a set bit `j` meets the mask's 1 and turns
          off, and a clear bit `j` turns on. `|` only ever turns bits on, which is why the two
          differ here.
      fifteen:
        prompt: Which value is the mask for bit 2?
        options:
          - { id: shift, text: "`1 << 2`, which is 4" }
          - { id: number, text: "`2`, the bit number" }
          - { id: three, text: "`1 << 3`, which is 8" }
        correct: shift
        explanation: >-
          Bit 2 is worth `2 ** 2`, so the mask with only bit 2 set is 4, `0b0100`. The number 2
          is `0b0010`, the mask for bit 1, and `13 ^ 2` flips that bit instead.
      seventeen:
        prompt: How does `m ^ (1 << j)` differ from `m + (1 << j)`?
        options:
          - { id: no-carry, text: "`^` changes bit `j` only, and `+` can carry into higher bits" }
          - { id: equal, text: "They are always equal, since the mask has one set bit" }
          - { id: reversed, text: "`+` changes bit `j` only, and `^` can carry into higher bits" }
        correct: no-carry
        explanation: >-
          When bit `j` is clear the two agree. When it is set, `+` carries into bit `j + 1`, so
          `13 + 4` is 17, while `^` turns bit `j` off and gives 9.

  - id: bits-xor-pairs
    heading: What does this print?
    tags: [bit-manipulation, python]
    workedExample: |-
      Consider `5 ^ 3 ^ 5`, worked left to right. In binary `5` is `101` and `3` is `011`, and `^`
      keeps a 1 where the two numbers disagree.

      1. `101` and `011` disagree in the places worth 4 and 2, so `5 ^ 3` is `110`, which is 6.
      2. `6` is `110` and `5` is `101`. They disagree in the places worth 2 and 1, so `6 ^ 5` is
         `011`, which is 3.
      3. The result is 3, the value that appears once: the second 5 took back every bit the first
         5 had flipped.
    prompt: |-
      `acc ^= v` means `acc = acc ^ v`, and the order of a run of `^` steps does not change the
      result.

      ```python
      acc = 0
      for v in [5, 9, 5, 2, 9]:
          acc ^= v
      print(acc)
      ```

      What does this print?
    options:
      - id: two
        text: "`2`"
        explanation: >-
          The running values are 5, 12, 9, 11 and 2. Order does not matter, so the two 5s cancel
          and the two 9s cancel, which leaves the 2. This is why one `^` pass with one variable
          finds the value that has no partner.
      - id: zero
        text: "`0`"
        explanation: >-
          A value cancels only when it meets a copy of itself. The 2 appears once, so it has no
          partner and is what is left.
      - id: fifteen
        text: "`15`"
        explanation: >-
          15 is `5 | 9 | 2`. With `|`, a second copy of a value changes nothing, so nothing
          cancels. `^` flips the bits back the second time.
      - id: thirty
        text: "`30`"
        explanation: >-
          30 is the sum of the list. `^` does not add: it has no carries, and a value combined
          with a copy of itself disappears.
    correct: two
    followUps:
      zero:
        prompt: In a run of `^`, which values cancel out?
        options:
          - { id: even-count, text: "Values that occur an even number of times" }
          - { id: all, text: "All of them, so a full XOR of a list is always 0" }
          - { id: adjacent, text: "Only copies that sit next to each other in the list" }
        correct: even-count
        explanation: >-
          Each pair of equal values gives 0, in any order, so a value seen twice (or four times)
          leaves nothing. A value seen once survives, which is why the result is 2.
      fifteen:
        prompt: Why does folding with `|` not cancel pairs?
        options:
          - { id: idempotent, text: "`x | x` is `x`, so a second copy adds no change" }
          - { id: even-only, text: "`|` cancels pairs too, but only for even values" }
          - { id: sorted, text: "`|` cancels pairs only when the list is sorted" }
        correct: idempotent
        explanation: >-
          `|` can turn bits on but never off. A repeated value turns on bits that are already on,
          so every value ever seen leaves its 1s behind: `5 | 9 | 2` is 15.
      thirty:
        prompt: How does `^` differ from `+`?
        options:
          - { id: no-carry, text: "`^` never carries, and `x ^ x` is 0 for every int" }
          - { id: small, text: "`^` matches `+` for small numbers and differs only above 255" }
          - { id: order, text: "`^` depends on the order of its two numbers, and `+` does not" }
        correct: no-carry
        explanation: >-
          `^` works on each bit separately, with no carry into the next place. So a value cancels
          its own copy, which `+` never does: `9 + 9` is 18, while `9 ^ 9` is 0.
