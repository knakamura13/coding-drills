id: traversal-layers-checkpoint
title: 'Traversal layers: checkpoint'
description: Time simultaneous spread and explain how the frontier finishes.
questions:
  - id: traversal-exam-meeting-fronts
    tags:
      - bfs
    prompt: |-
      Two sensors activate at minute 0. Each minute activation spreads one position along an open row. How long until every position here is active?

      ```text
      S . . . . S
      ```
    options:
      - id: correct
        text: 2 minutes
        explanation: The two outer unknown positions activate in minute 1. The two center positions activate
          in minute 2, completing the row.
      - id: other
        text: 4 minutes
        explanation: Trace a round with both sensors active.
    correct: correct
    followUps:
      other:
        prompt: Which positions are activated during minute 1?
        options:
          - id: 'yes'
            text: The neighbors of both sensors
          - id: 'no'
            text: Only the neighbor of the left sensor
        correct: 'yes'
        explanation: The two outer unknown positions activate in minute 1. The two center positions activate
          in minute 2, completing the row.
  - id: traversal-exam-detour-spread
    tags:
      - bfs
    prompt: |-
      Both S cells are active at minute 0. Activation spreads to adjacent dots up, down, left, or right
      at one step per minute. It cannot cross #. When is the last dot activated?

      ```text
      S#..
      ....
      ...S
      ```
    options:
      - id: correct
        text: Minute 3
        explanation: 'The dot immediately right of the wall is reached from the lower source in three moves. All other open
          cells are reached by then: the two waves cover opposite sides of the wall.'
      - id: other
        text: Minute 5
        explanation: For each cell, take the earlier arrival before finding the last arrival.
    correct: correct
    followUps:
      other:
        prompt: If a cell is two moves from one source and four from the other, when does it activate?
        options:
          - id: 'yes'
            text: After two minutes
          - id: 'no'
            text: After four minutes
        correct: 'yes'
        explanation: 'The dot immediately right of the wall is reached from the lower source in three moves. All other open
          cells are reached by then: the two waves cover opposite sides of the wall.'
  - id: traversal-exam-blocked-completion
    tags:
      - bfs
    prompt: |-
      Both S cells start active at minute 0. Activation spreads one step per minute up, down, left, or right through dots. Return the time when all dots are active, or −1 if that never happens. What should the algorithm return for this grid?

      ```text
      S.#.
      S.#.
      ```
    options:
      - id: correct
        text: −1, with two dots still inactive
        explanation: The dots next to the sources activate in minute 1. The frontier then empties with both
          right-side dots untouched, so the completion condition fails.
      - id: other
        text: 1, when the left side finishes
        explanation: After the frontier empties, check the entire board.
    correct: correct
    followUps:
      other:
        prompt: How many dots remain inactive once the queue empties?
        options:
          - id: 'yes'
            text: Two dots beyond the wall
          - id: 'no'
            text: Zero dots remain inactive
        correct: 'yes'
        explanation: The dots next to the sources activate in minute 1. The frontier then empties with both
          right-side dots untouched, so the completion condition fails.
  - id: traversal-exam-layer-counter
    tags:
      - bfs
    prompt: The graph has edges A–X, B–Y and Y–Z. A and B are sources at minute 0. A buggy loop increments minute
      after each pop. To count the time when Z activates, what should the loop count instead?
    options:
      - id: correct
        text: One tick per full distance layer
        explanation: After the complete source layer, X and Y are active at minute 1. Processing the distance-1
          layer discovers Z at minute 2. Counting nodes confuses breadth with elapsed time.
      - id: other
        text: One tick per newly discovered node
        explanation: Check whether discoveries from the two sources occur at the same time.
    correct: correct
    followUps:
      other:
        prompt: When do X and Y become active?
        options:
          - id: 'yes'
            text: Both at minute 1
          - id: 'no'
            text: X at minute 1 and Y at minute 2
        correct: 'yes'
        explanation: After the complete source layer, X and Y are active at minute 1. Processing the distance-1
          layer discovers Z at minute 2. Counting nodes confuses breadth with elapsed time.
