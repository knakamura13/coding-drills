id: exact-search-checkpoint
title: "Exact search: checkpoint"
description: Pick a loop that works on every input, diagnose one that stalls, and find the wrong line in a suggested solution. Most items combine discarding a half, dropping the probe and the one-cell range.
heading: Which one is right?

questions:
  - id: checkpoint-one-change
    heading: Which change still works?
    tags: [binary-search]
    prompt: |-
      ```python
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1
      ```

      Each option makes one change to this function. After which change does it still return the
      right answer for every sorted list of distinct values and every target?
    options:
      - id: round-up
        text: "`mid = (lo + hi + 1) // 2`"
        explanation: >-
          Rounding up still picks a cell from `lo` to `hi`, and both updates step past it. So
          every pass shrinks the range, a one-cell range is still probed, and the loop ends on an
          empty range. Only the order of the probes changes.
      - id: lt
        text: "`while lo < hi:`"
        explanation: Try a list with a single item that equals the target.
      - id: hi-len
        text: "`lo, hi = 0, len(a)`"
        explanation: Try a target larger than every item.
      - id: hi-mid
        text: "`hi = mid` in the `else` branch"
        explanation: Try a one-cell range whose item is larger than the target.
    correct: round-up
    followUps:
      lt:
        prompt: With `while lo < hi`, what does `search([11], 11)` return?
        options:
          - id: minus-one
            text: "`-1`, because the loop body never runs"
          - id: zero
            text: "`0`, because `lo == hi` already points at the 11"
          - id: hangs
            text: Nothing, it loops forever
        correct: minus-one
        explanation: >-
          `lo` and `hi` both start at 0, so `lo < hi` is false at once and the 11 is never
          compared. With inclusive bounds the test has to let a one-cell range in.
      hi-len:
        prompt: With `lo, hi = 0, len(a)`, what happens on `search([2, 9], 15)`?
        options:
          - id: index-error
            text: It probes index 2, past the end, and raises `IndexError`
          - id: minus-one
            text: It returns `-1`, like the original
          - id: two
            text: It returns 2, the length of the list
        correct: index-error
        explanation: >-
          The probes read 9 at index 1, then `lo` and `hi` are both 2, so the loop reads `a[2]`.
          An inclusive `hi` has to start on the last real cell, `len(a) - 1`.
      hi-mid:
        prompt: With `hi = mid`, what happens on `search([6, 14], 3)`?
        options:
          - id: hangs
            text: "It reaches `lo = hi = 0` and repeats that pass forever"
          - id: minus-one
            text: It returns `-1` after two probes
          - id: zero
            text: It returns 0, the slot where 3 would go
        correct: hangs
        explanation: >-
          The first probe reads 6, too big, so `hi = 0`. Then `mid` is 0, 6 is still too big,
          and `hi = mid` leaves `hi` at 0. The range never shrinks, so the loop never ends.

  - id: checkpoint-stalled-bounds
    format: drag-pointers
    heading: Find where it stalls
    tags: [binary-search]
    prompt: >-
      This version updates `lo` with `lo = mid`. The call below never returns. Drag `lo` and `hi`
      from where they start to the range the loop repeats forever.
    code: |
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  lo = mid
              else:
                  hi = mid - 1
          return -1

      search([5, 11, 16, 24, 30, 37, 45, 52], 52)
    sequence:
      kind: array
      name: a
      cells: [5, 11, 16, 24, 30, 37, 45, 52]
    pointers:
      - name: lo
        start: 0
        correct: 6
        explanation: >-
          The probes read 24, 37 and 45, all too small, so `lo` goes to 3, 5 and then 6. With
          `lo = 6` and `hi = 7`, `mid` is 13 // 2, which is 6 again. 45 is too small, `lo = mid`
          leaves `lo` on 6, and the pass repeats with the 52 never probed.
        misses:
          - index: 7
            explanation: >-
              `lo` never gets there. In the range 6 to 7, `mid` rounds down to 6, and `lo = mid`
              puts `lo` back on 6.
          - index: 5
            explanation: >-
              `lo` passes 5. The probe at `lo = 5, hi = 7` is index 6, reads 45, too small, and
              moves `lo` to 6.
          - index: 3
            explanation: >-
              That is where the first probe leaves `lo`. The next probes, at 5 and 6, are too
              small as well and move it on.
        elsewhere: Every probe is too small, and `lo = mid` follows the probes to 3, 5 and then 6, where it sticks.
      - name: hi
        start: 7
        correct: 7
        explanation: >-
          Every probe is smaller than 52, so `hi` never moves. The loop is stuck on the two-cell
          range 6 to 7.
        misses:
          - index: 6
            explanation: >-
              `hi` moves only after a probe that is too big. Every probe here reads a value below
              52.
        elsewhere: No probe is too big, so `hi` stays on index 7.

  - id: checkpoint-exposing-input
    heading: Which call shows the bug?
    tags: [binary-search]
    prompt: |-
      This version keeps inclusive bounds but tests `lo < hi`.

      ```python
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo < hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1

      a = [3, 8, 11, 17, 20, 26, 31]
      ```

      Which call returns a wrong answer?
    options:
      - id: t-three
        text: "`search(a, 3)`"
        explanation: >-
          The probes read 17 at index 3 and then 8 at index 1, both too big, so `hi` drops to 0.
          Now `lo == hi`, the loop stops, and the call returns -1 though 3 is at index 0. The
          one cell the range shrinks to is never compared, and here that is the first cell.
      - id: t-eight
        text: "`search(a, 8)`"
        explanation: Trace the probes. Which cells does `mid` name on the way down?
      - id: t-fifteen
        text: "`search(a, 15)`"
        explanation: Work out what a correct search returns for this call first.
      - id: t-forty
        text: "`search(a, 40)`"
        explanation: Find the cell this call leaves unchecked, and what it holds.
    correct: t-three
    followUps:
      t-eight:
        prompt: For 8, the first probe reads 17 at index 3, so `hi = 2`. What does the next probe read?
        options:
          - id: match
            text: 8 at index 1, a match, so it returns 1 correctly
          - id: skipped
            text: Nothing, since the loop stops before index 1
          - id: eleven
            text: 11 at index 2, so it misses the 8
        correct: match
        explanation: >-
          `(0 + 2) // 2` is 1, so the second probe lands on the 8. A target that a probe reaches is
          found. The bug hides in the one cell the range shrinks to without a probe.
      t-fifteen:
        prompt: 15 is not in `a`. What should a correct search return, and what does this one return?
        options:
          - id: both-minus-one
            text: Both return `-1`, so the answers agree
          - id: three
            text: A correct search returns 3, this one returns -1
          - id: two
            text: A correct search returns 2, this one returns -1
        correct: both-minus-one
        explanation: >-
          A missing target gives -1 either way, so skipping a cell changes nothing. A bug shows
          only when the skipped cell holds the target.
      t-forty:
        prompt: For 40, the probes read 17 and 26, and the loop stops with `lo = hi = 6`. Does skipping index 6 matter?
        options:
          - id: no-matter
            text: No, it holds 31, so -1 is still right
          - id: matters
            text: Yes, it hides the 40
          - id: none
            text: No cell was skipped, both ends were compared
        correct: no-matter
        explanation: >-
          The unchecked cell holds 31, not 40, so the call still returns the right -1. The
          target has to sit in the cell the loop leaves unchecked to show the bug.

  - id: checkpoint-repair-hang
    heading: Which fix works?
    tags: [binary-search]
    prompt: |-
      ```python
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  lo = mid + 1
              else:
                  hi = mid
          return -1
      ```

      `search([7, 15, 22, 38, 44, 61], 40)` never returns. Which one-line change makes `search`
      correct for every sorted list and every target?
    options:
      - id: mid-minus-one
        text: "`hi = mid - 1` in the `else` branch"
        explanation: >-
          The call reaches `lo = hi = 4`, probes 44, and `hi = mid` keeps `hi` at 4 forever.
          Stepping `hi` past the probe drops the 44, the range becomes empty, and the call
          returns -1. With both updates stepping past `mid`, every pass shrinks the range.
      - id: lt
        text: "`while lo < hi:`"
        explanation: That stops the hang. Check what it does with a one-cell list that holds the target.
      - id: round-up
        text: "`mid = (lo + hi + 1) // 2`"
        explanation: Trace the same call again with `mid` rounded up.
      - id: guard
        text: "Add `if lo == hi: break` at the top of the loop"
        explanation: That stops the hang. Check what happens when the last candidate is the target.
    correct: mid-minus-one
    followUps:
      lt:
        prompt: With `while lo < hi`, what does `search([9], 9)` return?
        options:
          - id: minus-one
            text: "`-1`, because the loop never runs"
          - id: zero
            text: "`0`, because `lo` already points at the 9"
          - id: hangs
            text: Nothing, it still hangs
        correct: minus-one
        explanation: >-
          With inclusive bounds a one-cell range is a real candidate, and `lo < hi` shuts it out.
          The hang is gone, but now a target in the last cell is reported missing.
      round-up:
        prompt: >-
          With `mid = (lo + hi + 1) // 2`, the call reaches `lo = 4, hi = 5`. What does the next
          pass do?
        options:
          - id: repeats
            text: It probes 61 at index 5, and `hi = mid` leaves `hi` at 5, so the pass repeats
          - id: finishes
            text: It probes 44 at index 4, then the range empties and it returns -1
          - id: drops
            text: It probes 61 at index 5, and `hi` drops to 4
        correct: repeats
        explanation: >-
          Rounding up only moves the stall. Whenever `mid` lands on `hi`, `hi = mid` changes
          nothing. Only an update that steps past `mid` is sure to shrink the range.
      guard:
        prompt: With the guard added, what does `search([5, 13, 20], 20)` return?
        options:
          - id: minus-one
            text: It returns `-1`
          - id: two
            text: It returns `2`
          - id: hangs
            text: It still hangs
        correct: minus-one
        explanation: >-
          The probe reads 13, so `lo = 2 = hi`, and the guard breaks before the 20 is compared,
          so the call returns -1 though 20 is at index 2. It hides the stall instead of fixing the update that caused it.

  - id: checkpoint-pick-past-end-loop
    heading: Which loop is correct?
    tags: [binary-search]
    prompt: >-
      A search looks for `t` in a sorted list `a` of distinct values and returns its index, or
      `-1` when `t` is absent. This time `hi` starts past the end: all four loops start with
      `lo, hi = 0, len(a)`, so the indices that can still hold `t` run from `lo` to `hi - 1`, and
      `hi` itself is never one of them. Each loop probes `mid = (lo + hi) // 2` and returns `mid`
      when `a[mid] == t`. They differ in the loop test and in how they move `lo` or `hi` after a
      miss. Which one is correct for every sorted list and every target?
    options:
      - id: le-mid
        text: "`while lo <= hi`; after a miss, `lo = mid + 1` or `hi = mid`"
        explanation: >-
          When `lo == hi`, no index is left to search, because `hi` is never one of them, but
          `lo <= hi` runs the loop anyway. On `[2, 5, 8]` with `t = 9`, the probes read 5 and 8,
          `lo` reaches 3, and the loop reads `a[3]`, past the end, which raises `IndexError`.
      - id: lt-minus-one
        text: "`while lo < hi`; after a miss, `lo = mid + 1` or `hi = mid - 1`"
        explanation: >-
          `hi` is already left out, so `hi = mid - 1` also drops the index just below `mid`, which
          may hold `t`. On `[2, 5, 8]` with `t = 2`, the probe reads 5, `hi` drops to 0, and the
          call returns -1 though 2 is at index 0.
      - id: lt-mid
        text: "`while lo < hi`; after a miss, `lo = mid + 1` or `hi = mid`"
        explanation: >-
          The indices still to search run from `lo` to `hi - 1`, so the loop runs while there is
          one, which is `lo < hi`. A probe that is too big rules out `mid` and every index right of
          it, and `hi = mid` leaves `mid` out, because `hi` is never searched. Every miss drops
          `mid`, so each pass leaves fewer indices, and the loop stops when none is left.
      - id: lo-mid
        text: "`while lo < hi`; after a miss, `lo = mid` or `hi = mid`"
        explanation: >-
          A probe that is too small is ruled out, but `lo = mid` keeps it. On `[2, 5, 8]` with
          `t = 9`, `lo` goes to 1 and then 2. With `lo = 2` and `hi = 3`, `mid` is 2 again, so the
          same pass repeats forever.
    correct: lt-mid
    followUps:
      le-mid:
        prompt: On `[2, 5, 8]` with `t = 9`, the loop reaches `lo = hi = 3`. How many indices are left to search?
        options:
          - id: none
            text: None, since `hi` itself is never searched
          - id: one
            text: One, index 3
          - id: two
            text: Two, indices 2 and 3
        correct: none
        explanation: >-
          The indices left run from `lo` to `hi - 1`, which is 3 to 2, so none is left. The loop
          has to stop once `lo` reaches `hi`, which is what `while lo < hi` does.
      lt-minus-one:
        prompt: On `[2, 5, 8]` with `t = 2`, the first probe reads 5 at index 1. Which indices can still hold the 2?
        options:
          - id: zero
            text: Only index 0, so `hi` should become 1
          - id: nothing
            text: None, so `hi` should become 0
          - id: zero-one
            text: 0 and 1, so `hi` should become 2
        correct: zero
        explanation: >-
          The 5 rules out index 1 and every index right of it. `hi` itself is never searched, so
          keeping index 0 means `hi = 1`, which is `hi = mid`.
      lo-mid:
        prompt: On `[2, 5, 8]` with `t = 9`, the loop reaches `lo = 2` and `hi = 3`. What does the next pass do?
        options:
          - id: repeats
            text: It probes the 8 at index 2, and `lo = mid` leaves `lo` on 2
          - id: ends
            text: It moves `lo` to 3, so the loop ends and returns `-1`
          - id: past-end
            text: It probes index 3, past the end
        correct: repeats
        explanation: >-
          With one index left, `mid` is `lo` itself, so `lo = mid` changes nothing and the pass
          repeats forever. Every miss has to drop `mid`, which `lo = mid + 1` does.

  - id: checkpoint-debug-search
    heading: Which line is wrong?
    tags: [binary-search]
    prompt: |-
      A suggested solution searches a sorted list `a` for `t` and returns its index, or `-1` when
      `t` is absent. It has one wrong line: changing that line alone makes it correct. Which line
      is it?

      ```python
      def search(a, t):
          lo, hi = 0, len(a) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if a[mid] == t:
                  return mid
              if a[mid] < t:
                  hi = mid - 1
              else:
                  lo = mid + 1
          return -1
      ```
    options:
      - id: test-backwards
        text: "Line 7: `if a[mid] < t:`"
        explanation: >-
          A probe below `t` should send the search right, but this test sends it to
          `hi = mid - 1`, toward values that are smaller still. On `search([2, 5, 8], 8)` the probe
          reads 5, `hi` drops to 0, and the call returns -1 though 8 is at index 2. With
          `if a[mid] > t:` every pass drops the side the probe rules out. Swapping lines 8 and 10
          also works, but that changes two lines.
      - id: loop-test
        text: "Line 3: `while lo <= hi:`"
        explanation: >-
          Both bounds are inclusive, so a one-cell range still holds a candidate, and `<=` lets the
          loop compare it. The loop ends only once `lo` passes `hi`, which is right.
      - id: probe-line
        text: "Line 4: `mid = (lo + hi) // 2`"
        explanation: >-
          The probe lands from `lo` to `hi`, near the middle, on every pass. Where it lands is not
          the problem. What the search does after reading it is.
      - id: high-update
        text: "Line 8: `hi = mid - 1`"
        explanation: >-
          `hi = mid - 1` is the right update for a probe that is too big. Changing line 8 alone
          would make both branches move `lo`. The test above it sends the wrong probes here.
    correct: test-backwards
    followUps:
      loop-test:
        prompt: "`lo = hi = 2`, with both ends included. Does index 2 still need a comparison?"
        options:
          - id: one-left
            text: Yes, it is one cell no probe has read yet
          - id: over
            text: No, equal bounds mean the search is over
          - id: last-only
            text: Only when it is the last index of the list
        correct: one-left
        explanation: >-
          With inclusive bounds a one-cell range still holds a candidate, so the loop runs while
          `lo <= hi`. Line 3 is right.
      probe-line:
        prompt: With `lo = 3` and `hi = 6`, which index does `(lo + hi) // 2` probe?
        options:
          - id: four
            text: 4, a cell from `lo` to `hi`
          - id: one
            text: 1, half the distance from `lo` to `hi`
          - id: five
            text: 5, since it rounds up
        correct: four
        explanation: >-
          `(3 + 6) // 2` is 9 // 2, which is 4. The probe always lands inside the range, so line 4
          is right.
      high-update:
        prompt: A probe reads a value larger than `t`. Which update keeps every cell that could hold `t`?
        options:
          - id: hi-down
            text: "`hi = mid - 1`, the update on line 8"
          - id: lo-up
            text: "`lo = mid + 1`, the update on line 10"
          - id: hi-mid
            text: "`hi = mid`"
        correct: hi-down
        explanation: >-
          A probe that is too big rules out itself and every cell right of it, so `hi = mid - 1` is
          right. Line 8 is the right update reached by the wrong test: line 7 sends a probe that
          is too small to it.
