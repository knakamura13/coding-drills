id: monotonic-stack
title: Monotonic stack
description: Find each next greater element in one pass by popping smaller tops, read what is left, then keep each window's maximum in a deque. Each card asks for one decision, with a worked example on hand.
heading: What does the stack do?

questions:
  - id: next-greater-by-hand
    heading: What is the answer?
    tags: [stack]
    workedExample: |-
      For each index of a list, its next greater element is the first value to its right that is
      strictly larger, or -1 when there is none. Scanning right from every index can take O(n²)
      time. This path finds every answer in one left-to-right pass, using a stack of the
      indices still waiting for their answer. Here `nums = [4, 1, 3, 6]`.

      1. Index 0 holds 4. To its right, 1 and 3 are smaller and 6 is larger, so index 0's answer
         is 6.
      2. Index 1 holds 1, and the very next value, 3, is larger. The 6 is larger too, but 3 comes
         first, so index 1's answer is 3.
      3. Index 2 holds 3, answered by 6. Index 3 holds 6 with nothing to its right, so its answer
         is -1. The answers are `[6, 3, 6, -1]`.
    prompt: >-
      For each index of a list, its next greater element is the first value to its right that is
      strictly larger, or -1 when there is none. For `nums = [5, 2, 4, 4, 7, 1]`, what is the next
      greater element at every index?
    options:
      - id: strict
        text: "`[7, 4, 7, 7, -1, -1]`"
        explanation: >-
          The 2 meets a larger 4 right after it. The first 4 is followed by an equal 4, which is not
          larger, so it waits for the 7, as the second 4 and the 5 do. The 7 and the 1 have nothing
          larger to their right.
      - id: or-equal
        text: "`[7, 4, 4, 7, -1, -1]`"
        explanation: >-
          This answers the first 4 with the equal 4 after it. "Strictly larger" rules out an equal
          value, so that 4 waits for the 7.
      - id: largest-right
        text: "`[7, 7, 7, 7, -1, -1]`"
        explanation: >-
          This takes the largest value to the right. For the 2, the first larger value is the 4
          right after it, which comes before the 7.
      - id: looked-left
        text: "`[-1, 5, 5, 5, -1, 7]`"
        explanation: >-
          This looks left, for the nearest larger value before each position. The next greater
          element comes from the right.
    correct: strict
    followUps:
      or-equal:
        prompt: What is the next greater element of the 4 at index 2?
        options:
          - id: seven
            text: 7, since the 4 after it is equal, not larger
          - id: four
            text: 4, the value right after it
          - id: none
            text: -1, since the value 4 appears twice
        correct: seven
        explanation: >-
          An equal value is not strictly larger, so the search goes on past it to the 7.
      largest-right:
        prompt: What is the next greater element of the 2 at index 1?
        options:
          - id: four
            text: 4, the first larger value after it
          - id: seven
            text: 7, the largest value after it
          - id: five
            text: 5, the larger value before it
        correct: four
        explanation: >-
          The search stops at the first larger value to the right. The 4 at index 2 is larger than 2
          and comes first.
      looked-left:
        prompt: Where is the next greater element for an index found?
        options:
          - id: right
            text: The right, the first larger value after it
          - id: left
            text: The left, the nearest larger value before it
          - id: either
            text: Either side, whichever larger value is nearer
        correct: right
        explanation: >-
          The task reads to the right of each position. The 5 at index 0 has nothing before it,
          but the 7 to its right answers it.

  - format: tap-cell
    id: pop-one-smaller-top
    heading: Which index is popped?
    tags: [stack, python]
    workedExample: |-
      Consider `next_greater` on `nums = [4, 7, 2, 3]`. The `while` loop compares only the top of
      `stack`, and it stops at the first top that is not smaller than the arrival.

      1. The 7 at index 1 popped index 0, since `4 < 7`, and the 2 at index 2 popped nothing. So
         `stack` is `[1, 2]` before index 3 is read.
      2. The 3 at index 3 meets the top, index 2. `2 < 3` is true, so index 2 is popped.
      3. The new top is index 1, holding 7, and `7 < 3` is false. So the loop stops after one pop,
         and index 3 is pushed.
    prompt: >-
      `next_greater` finds every next greater element in one left-to-right pass. `stack` holds the
      indices still waiting for their answer, and `stack[-1]` is its top. When `x` arrives at index
      `i`, the `while` loop pops while the top's value is smaller than `x`, writing `x` as each
      popped index's answer, and then pushes `i`. Here `stack` is `[0, 1, 2]` just before index 3
      is read. Which index does the 4 at index 3 pop? Tap it.
    code: |
      def next_greater(nums):
          out = [-1] * len(nums)  # one -1 per position
          stack = []  # indices still waiting
          for i, x in enumerate(nums):
              while stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = x
              stack.append(i)
          return out

      next_greater([9, 6, 2, 4, 7])
    sequence:
      kind: array
      name: nums
      cells: [9, 6, 2, 4, 7]
    markers:
      - { name: i, at: 3 }
    correct: 2
    explanation: >-
      Before index 3, `stack` is `[0, 1, 2]`. The top holds 2, which is smaller than 4, so index 2
      is popped. The new top holds 6, and `6 < 4` is false, so the loop stops.
    misses:
      - index: 0
        explanation: >-
          The 9 is at the bottom. The loop compares only the top and stops at the 6 before it
          reaches the 9.
      - index: 1
        explanation: >-
          The 6 is on top once index 2 is gone, but `6 < 4` is false, so it stays and the loop
          ends.
      - index: 3
        explanation: Index 3 is the arrival. It is pushed after the pops, not popped.
      - index: 4
        explanation: >-
          The 7 has not arrived yet. On its turn it pops index 3 and then index 1.

  - format: step-trace
    id: trace-pops-per-arrival
    heading: Predict each arrival
    tags: [stack, python]
    workedExample: |-
      Consider `nums = [6, 4, 1, 5]`, with `stack = [0, 1, 2]` before index 3. After every pop, the
      `while` loop tests the new top again.

      1. The 5 at index 3 meets the top, index 2, holding 1. `1 < 5` is true, so index 2 is popped.
      2. The new top is index 1, holding 4. `4 < 5` is still true, so index 1 is popped as well.
      3. The new top is index 0, holding 6, and `6 < 5` is false. So the loop stops after 2 pops
         with index 0 on top, and index 3 is pushed above it.
    prompt: >-
      Each arrival pops while the value on top of `stack` is smaller than it, and is then pushed.
      `top` marks the top of `stack`, which is `[0, 1, 2]` after index 2. Predict each step.
    code: |
      nums = [5, 3, 1, 2, 6, 4, 2, 3]
      out = [-1] * len(nums)
      stack = []
      for i, x in enumerate(nums):
          while stack and nums[stack[-1]] < x:
              j = stack.pop()
              out[j] = x
          stack.append(i)
    sequence:
      kind: array
      name: nums
      cells: [5, 3, 1, 2, 6, 4, 2, 3]
    start:
      - { name: top, at: 2 }
    steps:
      - line: 5
        ask: The 2 at index 3 arrives. How many indices does the `while` loop pop?
        options:
          - id: one
            text: "1"
            explanation: >-
              The top, index 2, holds 1, which is smaller than 2, so it is popped. The next top
              holds 3, and `3 < 2` is false.
          - id: zero
            text: "0"
            explanation: The top holds 1, and `1 < 2` is true, so at least one pop happens.
          - id: two
            text: "2"
            explanation: >-
              After index 2 goes, the top holds 3. `3 < 2` is false, so the loop stops after one
              pop.
          - id: three
            text: "3"
            explanation: >-
              The loop stops at the first top that is not smaller. The 3 at index 1 stops it, so
              the 5 is never compared.
        correct: one
      - line: 5
        ask: When that `while` loop stops, which index is on top? Tap it.
        pointer: top
        correct: 1
        explanation: >-
          Index 2 is gone, and the 3 at index 1 is not smaller than 2. It is on top when the loop
          stops, and index 3 is then pushed above it.
        misses:
          - index: 2
            explanation: Index 2 was just popped.
          - index: 0
            explanation: The 5 sits under index 1. The loop stops before it reaches the 5.
          - index: 3
            explanation: >-
              Index 3 is pushed after the loop stops. The question asks for the top at the moment
              it stops.
        elsewhere: The loop stops with index 1 on top.
      - line: 5
        ask: "The 6 at index 4 arrives with `stack` at `[0, 1, 3]`. How many indices does it pop?"
        options:
          - id: three
            text: "3"
            explanation: >-
              2, 3 and 5 are all smaller than 6. Each pop exposes a new top that is still smaller,
              so the loop empties the stack before index 4 is pushed.
          - id: one
            text: "1"
            explanation: >-
              The `while` loop tests again after every pop. Index 1 holds 3 and index 0 holds 5,
              and both are smaller than 6.
          - id: two
            text: "2"
            explanation: >-
              Index 0 holds 5, which is also smaller than 6, so the loop pops it too and stops only
              when the stack is empty.
          - id: four
            text: "4"
            explanation: >-
              Only three indices are on the stack. Index 2 was popped by the 2 at index 3 and
              cannot be popped twice.
        correct: three
        also:
          - { name: top, at: 4 }
      - line: 5
        ask: "The 3 at index 7 arrives with `stack` at `[4, 5, 6]`. When its loop stops, which index is on top? Tap it."
        pointer: top
        correct: 5
        explanation: >-
          The top, index 6, holds 2, which is smaller than 3, so it is popped. Index 5 holds 4, and
          `4 < 3` is false, so the loop stops with index 5 on top.
        misses:
          - index: 6
            explanation: The 2 at index 6 is smaller than 3, so the arrival pops it.
          - index: 4
            explanation: >-
              The 6 sits under index 5. The loop stops at the 4 before it reaches the 6.
          - index: 7
            explanation: >-
              Index 7 is the arrival. It goes on top only after the loop stops.
        elsewhere: Only indices 4, 5 and 6 are on the stack, and the loop stops at index 5.

  - format: tap-cell
    id: land-on-larger-top
    heading: What sits under the new top?
    tags: [stack, python]
    workedExample: |-
      Consider `next_greater` on `nums = [12, 10, 8, 9]`. Each arrival pops the tops that are
      smaller than it, and is then pushed onto whatever top is left.

      1. 12, 10 and 8 only go down, so neither 10 nor 8 pops anything, and `stack` is `[0, 1, 2]`
         before index 3 is read.
      2. The 9 at index 3 meets the top, index 2. `8 < 9` is true, so index 2 is popped.
      3. The new top is index 1, and `10 < 9` is false, so the loop stops. Index 3 is pushed onto
         `[0, 1]`, so index 1 sits directly beneath it: the nearest earlier value that is not
         smaller than 9.
    prompt: >-
      `next_greater` runs on `nums` below. Each arrival pops the smaller tops and is then pushed
      onto whatever top is left. Once index 6 is pushed, which index sits directly beneath it? Tap
      it.
    code: |
      def next_greater(nums):
          out = [-1] * len(nums)
          stack = []
          for i, x in enumerate(nums):
              while stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = x
              stack.append(i)
          return out

      next_greater([7, 4, 9, 3, 6, 2, 5, 1])
    sequence:
      kind: array
      name: nums
      cells: [7, 4, 9, 3, 6, 2, 5, 1]
    correct: 4
    explanation: >-
      The 5 at index 6 pops index 5, since 2 is smaller, and stops at index 4, since 6 is not. So
      `stack` is `[2, 4, 6]`, and index 4 sits directly beneath the new top. Since every arrival
      first pops the smaller tops, the values on the stack never increase from bottom to top (here
      9, 6, 5). That order is the "monotonic" in the path's name.
    misses:
      - index: 0
        explanation: The 9 at index 2 already popped this 7.
      - index: 1
        explanation: The 9 at index 2 popped this 4 as well.
      - index: 2
        explanation: >-
          The 9 is waiting, but at the bottom. Index 4 sits between it and index 6.
      - index: 3
        explanation: The 6 at index 4 popped this 3.
      - index: 5
        explanation: >-
          This is the index just before 6, but its 2 is smaller than the arriving 5, so index 6
          pops it before it is pushed.
      - index: 6
        explanation: Index 6 is the new top itself. The question asks for the entry under it.
      - index: 7
        explanation: Index 7 has not been read when index 6 is pushed.

  - id: name-waiting-indices
    heading: Which indices are waiting?
    tags: [stack, python]
    workedExample: |-
      Consider `next_greater` on `nums = [7, 3, 5]`. `stack` holds the indices still waiting for a
      larger value, and an index leaves it only when a larger value pops it.

      1. Index 0, the 7, is pushed onto the empty stack. The 3 at index 1 does not pop it, since
         `7 < 3` is false, so `stack` is `[0, 1]`.
      2. The 5 at index 2 meets the top, index 1. `3 < 5` is true, so index 1 is popped and gets its
         answer, `out[1] = 5`.
      3. The new top is index 0, and `7 < 5` is false, so the loop stops and index 2 is pushed.
         `stack` is `[0, 2]`: the 7 and the 5 are still waiting.
    prompt: |-
      ```python
      def next_greater(nums):
          out = [-1] * len(nums)
          stack = []  # indices still waiting
          for i, x in enumerate(nums):
              while stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = x
              stack.append(i)
          return out
      ```

      For `nums = [6, 2, 5, 1, 3, 8]`, what does `stack` hold just before index 5 is read?
    options:
      - id: waiting
        text: "`[0, 2, 4]`"
        explanation: >-
          The 6, the 5 and the 3 have not met a larger value yet. The 5 popped index 1 and the 3
          popped index 3, so those two have their answers and are gone. An index waits on the
          stack for as long as no larger value has arrived after it.
      - id: values
        text: "`[6, 5, 3]`"
        explanation: >-
          These are the values at the waiting positions, but the loop pushes `i`, not `x`. Each
          entry is a position, so `out[j] = x` knows which slot to fill when it is popped.
      - id: kept-popped
        text: "`[0, 2, 3, 4]`"
        explanation: >-
          Index 3 holds 1, and the 3 at index 4 is larger, so index 4 pops it before it is pushed.
          A popped index has its answer and is no longer waiting.
      - id: answered
        text: "`[1, 3]`"
        explanation: >-
          These two have their answers already: index 1 got 5 and index 3 got 3. The stack holds
          the other positions, the ones still without an answer.
    correct: waiting
    followUps:
      values:
        prompt: When the 8 later pops an entry `j`, what must that entry tell the loop?
        options:
          - id: slot
            text: Which entry of `out` to write, so the stack entry has to be an index
          - id: value-only
            text: Its value, which the loop cannot look up any other way
          - id: nothing
            text: Nothing, because the arrival writes into its own entry of `out`
        correct: slot
        explanation: >-
          `out[j] = x` writes at index `j`. The value is one lookup away as `nums[j]`, so a stored
          index gives both, while a stored value cannot say where to write.
      kept-popped:
        prompt: Index 3 holds 1 and index 4 holds 3. What happens to index 3 when index 4 is read?
        options:
          - id: popped
            text: "It is popped, and `out[3]` becomes 3"
          - id: last-only
            text: It stays, because only the last value in the list pops anything
          - id: stays-pushed
            text: It stays, because index 4 is pushed on top of it without a comparison
        correct: popped
        explanation: >-
          Every arrival runs the `while` test before it is pushed. `1 < 3` is true, so index 3 is
          popped and answered first.
      answered:
        prompt: After `j = stack.pop()` and `out[j] = x` run, is index `j` still waiting?
        options:
          - id: done
            text: No, it has its answer and has left the stack
          - id: popped-wait
            text: Yes, popped indices are the ones that wait
          - id: until-end
            text: Yes, until the loop ends
        correct: done
        explanation: >-
          The stack is the waiting list. An index joins it when it is read and leaves it at the
          moment a larger value answers it.

  - id: equal-value-waits
    heading: What does this print?
    tags: [stack, python]
    workedExample: |-
      Consider `next_greater` on `nums = [9, 4, 11]`. The test `nums[stack[-1]] < x` is strict, so a
      top is popped only when the arrival is larger than it.

      1. The 4 at index 1 meets index 0. `9 < 4` is false, so index 0 stays, and index 1 is pushed:
         `stack` is `[0, 1]`.
      2. The 11 at index 2 meets index 1. `4 < 11` is true, so index 1 is popped and `out[1]`
         becomes 11.
      3. The new top is index 0, and `9 < 11` is true, so it is popped and answered with 11 too.
         `stack` ends as `[2]`: each index left only when a strictly larger value arrived.
    prompt: |-
      ```python
      nums = [6, 6, 10]
      out = [-1] * len(nums)
      stack = []
      for i, x in enumerate(nums[:2]):  # only the two 6s
          while stack and nums[stack[-1]] < x:
              out[stack.pop()] = x
          stack.append(i)
      print(stack, out)
      ```

      What does this print?
    options:
      - id: both-wait
        text: "`[0, 1] [-1, -1, -1]`"
        explanation: >-
          `6 < 6` is false, so the second 6 does not pop the first. Both wait, and the 10 would
          answer both of them on the next pass.
      - id: equal-pops
        text: "`[1] [6, -1, -1]`"
        explanation: >-
          This pops on an equal value, which `<=` would do. With `<`, a 6 is not larger than a 6,
          so index 0 keeps waiting.
      - id: skip-duplicate
        text: "`[0] [-1, -1, -1]`"
        explanation: >-
          `stack.append(i)` runs on every pass, whatever the value, so index 1 waits too.
      - id: mutual
        text: "`[] [6, 6, -1]`"
        explanation: >-
          An index gets an answer only when it is popped, and a pop needs a larger arrival. Neither
          6 is larger than the other.
    correct: both-wait
    followUps:
      equal-pops:
        prompt: The second 6 arrives with index 0 on top. What does `nums[0] < 6` evaluate to?
        options:
          - id: not-less
            text: False, because 6 is not less than 6
          - id: true-match
            text: True, because the values match
          - id: true-older
            text: True, because index 0 is older
        correct: not-less
        explanation: >-
          Strict `<` needs a larger arrival. An equal value leaves the top waiting. `<=` would pop
          it, which answers "next value at least as large" instead.
      skip-duplicate:
        prompt: Which line puts index 1 on the stack, and what does it check first?
        options:
          - id: no-check
            text: "`stack.append(i)`, and it checks nothing"
          - id: checks-dupes
            text: "`stack.append(i)`, after checking that the value is not already waiting"
          - id: shares
            text: No line does, because equal values share index 0
        correct: no-check
        explanation: >-
          The `while` loop may pop, but the append always runs. Every index is pushed exactly once,
          equal values included.
      mutual:
        prompt: What has to happen before `out[j]` gets a value?
        options:
          - id: larger-arrives
            text: A strictly larger value has to arrive while `j` is on top
          - id: equal-arrives
            text: A value equal to `nums[j]` has to arrive
          - id: loop-ends
            text: The loop has to reach the end of the list
        correct: larger-arrives
        explanation: >-
          The only write into `out` sits inside the `while` loop, and the loop pops only smaller
          tops. Equal values never write anything.

  - id: distance-between-indices
    heading: What does this write?
    tags: [stack, python]
    workedExample: |-
      Consider `steps_to_greater` on `nums = [4, 1, 5]`. When the arrival at index `i` pops a
      waiting index `j`, it writes the distance `out[j] = i - j`.

      1. The 1 at index 1 does not pop the 4, since `4 < 1` is false, so `stack` is `[0, 1]` before
         index 2.
      2. The 5 at index 2 pops index 1, because `1 < 5`, and writes `out[1] = 2 - 1 = 1`.
      3. The new top is index 0, and `4 < 5` is true, so it is popped too, and `out[0] = 2 - 0 = 2`.
         Each pop subtracts its own index from the same `i`, so `out` ends as `[2, 1, 0]`.
    prompt: |-
      ```python
      def steps_to_greater(nums):
          out = [0] * len(nums)
          stack = []
          for i, x in enumerate(nums):
              while stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = i - j
              stack.append(i)
          return out
      ```

      For `nums = [8, 3, 2, 6, 1, 9]`, the 9 at index 5 pops three indices. What does it write
      into `out[0]`?
    options:
      - id: five
        text: "5"
        explanation: >-
          Index 0 has waited since the start, and the 9 arrives at index 5. The distance is
          `5 - 0`, whatever sits in between.
      - id: nine
        text: "9"
        explanation: >-
          9 is the value that answers index 0, which `next_greater` would store. This function
          writes `i - j`, a gap between positions.
      - id: pop-order
        text: "3"
        explanation: >-
          Index 0 is the third index this arrival pops, after 4 and 3. The order of the pops does
          not enter the subtraction.
      - id: reversed
        text: "-5"
        explanation: >-
          This is `j - i`. The waiting index is the earlier one, so the arrival's index comes first
          and every stored distance is positive.
    correct: five
    followUps:
      nine:
        prompt: Which two numbers does `out[j] = i - j` combine?
        options:
          - id: positions
            text: The arrival's index and the waiting index
          - id: values
            text: The arriving value and the waiting value
          - id: mixed
            text: The arriving value and the waiting index
        correct: positions
        explanation: >-
          `i` and `j` are both indices, so their difference counts steps along the list. The values
          decide whether a pop happens, not how far apart the two positions are.
      pop-order:
        prompt: The 9 pops indices 4, 3 and 0, in that order. Does the order change `out[0]`?
        options:
          - id: own-index
            text: No, each pop subtracts its own popped index from 5
          - id: third
            text: Yes, the third pop writes 3
          - id: cumulative
            text: Yes, each pop subtracts the distances written before it
        correct: own-index
        explanation: >-
          Each pop computes `i - j` with the same `i` and its own `j`, so the pops write 1, 2 and 5
          into `out[4]`, `out[3]` and `out[0]`.
      reversed:
        prompt: On `[4, 1, 5]`, the 5 at index 2 answers index 0. Which subtraction gives the distance 2?
        options:
          - id: arrival-first
            text: "`2 - 0`, the arrival's index minus the waiting index"
          - id: waiting-first
            text: "`0 - 2`, the waiting index minus the arrival's index"
          - id: by-value
            text: "`5 - 4`, the arriving value minus the waiting value"
        correct: arrival-first
        explanation: >-
          The arrival is always later than the index it pops, so `i - j` is positive. `j - i` gives
          the same size with the wrong sign.

  - id: leftover-stack
    heading: What is left on the stack?
    tags: [stack, python]
    workedExample: |-
      Consider `next_greater` on `nums = [3, 5, 2]`. `out` starts as all -1, and the only line
      that writes into it, `out[j] = x`, runs right after index `j` is popped.

      1. The 5 at index 1 pops index 0, since `3 < 5`, so `out[0]` becomes 5.
      2. The 2 at index 2 pops nothing, since `5 < 2` is false. The loop ends with `stack` holding
         `[1, 2]`.
      3. Indices 1 and 2 were never popped, so nothing wrote into their slots, and `out` ends as
         `[5, -1, -1]`. Neither the 5 nor the 2 has a larger value to its right.
    prompt: |-
      ```python
      def next_greater(nums):
          out = [-1] * len(nums)
          stack = []
          for i, x in enumerate(nums):
              while stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = x
              stack.append(i)
          return out
      ```

      For `nums = [8, 3, 6, 6, 2, 9, 4, 1]` the loop ends with `stack` holding `[5, 6, 7]`. What
      do these leftover indices mean for their answers?
    options:
      - id: none-larger
        text: No larger value comes after them, so their answers stay -1
        explanation: >-
          An index is popped the moment a larger value arrives, so one still on the stack never saw
          one. Nothing wrote into its slot, and the starting -1 is already the right answer for
          the 9, the 4 and the 1. No second pass is needed.
      - id: second-pass
        text: Their answers are still missing, so a second pass must find them
        explanation: >-
          Every value after a leftover index has already arrived and failed to pop it, so no larger
          value exists to find. The -1 already in its slot is the answer.
      - id: last-value
        text: They are answered with the last value, 1
        explanation: >-
          `out` changes only when an index is popped. The 1 at the end pops nothing, and no line
          after the loop fills in the leftovers.
      - id: own-value
        text: Each one is answered with its own value
        explanation: >-
          A slot of `out` holds the next greater element, never the position's own value. The
          leftovers keep the starting -1.
    correct: none-larger
    followUps:
      second-pass:
        prompt: Index 5 holds 9 and is still on the stack at the end. Which values arrived after it?
        options:
          - id: all
            text: The 4 and the 1, and neither was larger, so neither popped it
          - id: none
            text: None yet, since the loop stopped early
          - id: some
            text: Only the 4, since the 1 was never read
        correct: all
        explanation: >-
          The loop reads every index. A value still waiting at the end has met every later value,
          so a -1 there means none of them was larger.
      last-value:
        prompt: Which line writes into `out`, and when does it run?
        options:
          - id: on-pop
            text: "`out[j] = x`, only right after index `j` is popped"
          - id: after-loop
            text: "`out[j] = x`, once more for each leftover after the loop"
          - id: on-push
            text: "`stack.append(i)`, which copies `x` into `out`"
        correct: on-pop
        explanation: >-
          The only write is inside the `while` loop. An index that is never popped is never written,
          so it keeps its -1.
      own-value:
        prompt: What does a -1 that survives the loop say about its index?
        options:
          - id: no-larger
            text: No larger value appears to its right
          - id: holds
            text: The value at that index is -1
          - id: last
            text: That index was the last one read
        correct: no-larger
        explanation: >-
          -1 is the "none" answer. It survives exactly at the indices still on the stack, because
