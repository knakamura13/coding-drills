  - id: count-pops-in-run
    heading: What does this print?
    tags: [stack, complexity, python]
    workedExample: |-
      Consider the loop on `nums = [3, 1, 2]`. Each index is pushed exactly once, and an index can
      leave the stack only through one pop.

      1. The 1 at index 1 pops nothing, since `3 < 1` is false. The 2 at index 2 pops index 1, since
         `1 < 2`, but not index 0, since `3 < 2` is false.
      2. So the run makes 3 pushes and ends with `stack = [0, 2]`, which is 2 indices left.
      3. Every index that is gone left through exactly one pop, so the pops equal the pushes minus
         the indices left: `3 - 2 = 1`.
    prompt: |-
      ```python
      nums = [2, 9, 4, 3, 7, 1, 8]
      pops = 0
      stack = []
      for i, x in enumerate(nums):
          while stack and nums[stack[-1]] < x:
              stack.pop()
              pops += 1
          stack.append(i)
      print(pops, stack)
      ```

      Each index is pushed once and popped at most once, so a run over `n` values makes at most
      `n` pops. What does this print?
    options:
      - id: five
        text: "`5 [1, 6]`"
        explanation: >-
          Seven indices are pushed and two are left, so five were popped: index 0 by the 9, 3 and 2
          by the 7, and 5 and 4 by the 8. The 9 and the final 8 never meet a larger value.
      - id: all-popped
        text: "`7 []`"
        explanation: >-
          An index is popped only by a larger value after it. The 9 is the largest, and the 8 is
          last, so neither is ever popped.
      - id: per-arrival
        text: "`3 [1, 6]`"
        explanation: >-
          Three arrivals pop something, the 9, the 7 and the 8, but the 7 and the 8 pop two indices
          each. `pops` counts every pop.
      - id: leftovers
        text: "`2 [1, 6]`"
        explanation: >-
          2 is the size of the stack at the end. The pops are the indices that are no longer there.
    correct: five
    followUps:
      all-popped:
        prompt: The 9 at index 1 is the largest value. What could pop it?
        options:
          - id: nothing
            text: Nothing, since a pop needs a larger value after it and none exists
          - id: last-value
            text: The 8, when the loop reaches the end
          - id: any-later
            text: Any later value, once the stack grows long enough
        correct: nothing
        explanation: >-
          The only pops happen inside the `while` loop, and they need a larger arrival. The loop
          does not empty the stack when the list ends.
      per-arrival:
        prompt: The 7 at index 4 arrives with `[1, 2, 3]` on the stack. How many times does `pops += 1` run for it?
        options:
          - id: two
            text: Twice, once for index 3 and once for index 2
          - id: once
            text: Once, since it counts arrivals that pop
          - id: three
            text: Three times, once per entry on the stack
        correct: two
        explanation: >-
          `pops += 1` sits inside the `while` loop, so it runs once per pop. The 3 and the 4 are
          smaller than 7, and the 9 is not.
      leftovers:
        prompt: This run pushes 7 indices and leaves 2 on the stack. How many pops were there?
        options:
          - id: difference
            text: 5, the pushes minus the indices left
          - id: size
            text: 2, the size of the final stack
          - id: per-push
            text: 7, one per push
        correct: difference
        explanation: >-
          Every index enters once. The ones that are gone at the end each left by exactly one pop,
          so pops equal pushes minus leftovers.

  - id: expired-front-index
    heading: Which index leaves the front?
    tags: [sliding-window, queue, python]
    workedExample: |-
      A window is `k` neighboring values, and the window maximum is the largest value in each one.
      One pass keeps a deque `dq` of indices whose values fall from front to back, so the front
      holds the largest value, as long as an index that has left the window is removed. Here
      `nums = [5, 9, 4, 3]` and `k = 2`.

      1. Before index 3 is read, `dq` holds `[1, 2]`: the 9 and then the 4, falling from front to
         back.
      2. The window that ends at index 3 holds its 2 values, indices 2 and 3. Index 1 is outside
         it, and `1 <= 3 - 2` is true, so `popleft()` removes index 1 from the front.
      3. The front is now index 2, and the 3 at index 3 is appended behind it. So the window
         maximum is 4, even though the 9 was the largest value in `dq` a moment before.
    prompt: |-
      `window_max` finds the largest value in each window, the `k` neighboring values that end at
      index `i`. `dq` is a deque of indices whose values fall from front to back: `dq[0]` reads the
      front and `dq[-1]` the back, `popleft()` removes the item at the front, `pop()` the item at
      the back, and `append` adds at the back.

      ```python
      from collections import deque

      def window_max(nums, k):
          dq = deque()
          out = []
          for i, x in enumerate(nums):
              if dq and dq[0] <= i - k:
                  dq.popleft()
              while dq and nums[dq[-1]] <= x:
                  dq.pop()
              dq.append(i)
              if i >= k - 1:
                  out.append(nums[dq[0]])
          return out
      ```

      For `nums = [2, 5, 1, 9, 6, 4, 5, 3]` and `k = 3`, `dq` holds `[3, 4, 5]` before index 6 is
      read. What does the first `if` remove?
    options:
      - id: index-three
        text: Index 3
        explanation: >-
          The window that ends at index 6 runs from index 4 to index 6, so index 3 has left it, and
          `3 <= 6 - 3` is true. `popleft()` removes it, even though its 9 is the largest value in
          `dq`.
      - id: nothing
        text: No index
        explanation: >-
          This keeps index 3 one step too long. The `k = 3` values that end at index 6 start at
          index 4, and `3 <= 6 - 3` is true, so the first `if` removes the front.
      - id: index-five
        text: Index 5
        explanation: >-
          Index 5 is the back, the newest index in `dq`, and it is inside the window. `popleft()`
          removes the front.
      - id: three-and-four
        text: Indices 3 and 4
        explanation: >-
          Index 4 is inside the window that ends at index 6, and `4 <= 6 - 3` is false. An `if`
          also runs its body at most once, so it removes one index at most.
    correct: index-three
    followUps:
      nothing:
        prompt: With `k = 3`, which indices does the window that ends at index 6 cover?
        options:
          - id: four-to-six
            text: Indices 4, 5 and 6
          - id: three-to-six
            text: Indices 3, 4, 5 and 6
          - id: three-to-five
            text: Indices 3, 4 and 5
        correct: four-to-six
        explanation: >-
          A window of `k` values that ends at index `i` starts at `i - k + 1`, here 4. So index
          `i - k`, here 3, is the newest index outside it, which is what `dq[0] <= i - k` catches.
      index-five:
        prompt: Which end of `dq` holds the oldest index?
        options:
          - id: front
            text: The front, since each index is appended at the back as it is read
          - id: back
            text: The back, since the newest index goes in at the front
          - id: smaller
            text: Whichever end holds the smaller value
        correct: front
        explanation: >-
          `append` adds each index at the back, in the order the indices are read, so they grow from
          front to back. An index that has left the window is the oldest, so it can only be at the
          front.
      three-and-four:
        prompt: Why is an `if`, not a `while`, enough at the front?
        options:
          - id: one-step
            text: Each new index moves the window one place right, so at most one index leaves it
          - id: next-pass
            text: An index left over now is removed when the next index is read
          - id: back-loop
            text: The `while` loop at the back removes any other old index
        correct: one-step
        explanation: >-
          When index 6 is read, every index before 3 has already been removed at an earlier step.
          Moving the window to end at index 6 drops one more position, index 3, so at most one index
          in `dq` can have expired.

  - format: tap-cell
    id: back-pops-equal-value
    heading: Which index is popped last?
    tags: [sliding-window, queue, python]
    workedExample: |-
      Consider `nums = [7, 4, 4]` with `k = 3`. Before index `i` is appended, the `while` loop pops
      the back while its value is at most `x`. A popped index is never needed again: every later
      window that holds it also holds index `i`, whose value is at least as large.

      1. Before index 2 is read, `dq` holds `[0, 1]`, the 7 and then the 4, and the front check
         removes nothing.
      2. The 4 at index 2 meets the back, index 1, which also holds 4. `4 <= 4` is true, so index 1
         is popped: the newer 4 is just as large and stays in the window longer.
      3. The back is now index 0, holding 7, and `7 <= 4` is false, so the loop stops. Index 2 is
         appended, and `dq` is `[0, 2]`, with 7 and 4 still falling from front to back.
    prompt: >-
      `window_max` finds the largest value in each window, the `k` neighboring values that end at
      index `i`. `dq` is a deque of indices: `dq[0]` reads its front and `dq[-1]` its back,
      `popleft()` removes the item at the front, `pop()` removes the item at the back, and `append`
      adds at the back. Before index `i` is appended, the `while` loop pops the back while its value
      is at most `x`. With `k = 4`, `dq` holds `[2, 3, 4]` when index 5 is read, and the front check
      removes nothing. Which index is the last one the `while` loop pops? Tap it.
    code: |
      from collections import deque

      def window_max(nums, k):
          dq = deque()  # indices
          out = []
          for i, x in enumerate(nums):
              if dq and dq[0] <= i - k:
                  dq.popleft()
              while dq and nums[dq[-1]] <= x:
                  dq.pop()
              dq.append(i)
              if i >= k - 1:
                  out.append(nums[dq[0]])
          return out

      window_max([4, 6, 9, 7, 3, 7, 5, 8], 4)
    sequence:
      kind: array
      name: nums
      cells: [4, 6, 9, 7, 3, 7, 5, 8]
    markers:
      - { name: i, at: 5 }
    correct: 3
    explanation: >-
      The 7 at index 5 pops index 4, since `3 <= 7`. The new back, index 3, holds an equal 7, and
      `7 <= 7` is true, so it is popped too. The 9 at index 2 stops the loop, so index 3 is the last
      pop and `dq` becomes `[2, 5]`.
    misses:
      - index: 0
        explanation: Index 0 is no longer in `dq`. The 6 at index 1 popped it, since `4 <= 6`.
      - index: 1
        explanation: Index 1 is no longer in `dq`. The 9 at index 2 popped it, since `6 <= 9`.
      - index: 2
        explanation: >-
          The 9 stops the loop: `9 <= 7` is false, so index 2 stays at the front.
      - index: 4
        explanation: >-
          Index 4 is popped first, since `3 <= 7`. The loop then tests the new back, the 7 at index
          3, and `7 <= 7` is true, so the popping goes on.
      - index: 5
        explanation: Index 5 is the arrival. It is appended after the pops, not popped.
      - index: 6
        explanation: The 5 at index 6 has not been read when index 5 arrives.
      - index: 7
        explanation: The 8 at index 7 has not been read when index 5 arrives.

