id: design-structures-checkpoint
title: "Design structures: checkpoint"
description: Pick the design that meets a stated set of costs, or find the call a near-miss design gets wrong. The last item, which replays calls on a store, goes deeper.
heading: Which design meets the costs?

questions:
  - id: checkpoint-lru-pair
    heading: Which design meets every cost?
    tags: [hash-map, linked-list, complexity]
    prompt: >-
      A cache must look up a key and store a key, each in O(1) on average, and every lookup or
      store counts as a use of that key. When it is full, it must evict the least recently used key
      in O(1). Removing an item from the middle of a Python list moves every later item. Which
      design meets every cost?
    options:
      - id: dict-doubly
        text: A dict from key to node, and a doubly linked list in order of use
        explanation: >-
          The dict finds a key's node in O(1) on average. With `prev`, that node unlinks itself in
          O(1) and joins the most-recent end in O(1), and the least recently used node sits at the
          other end, ready to evict.
      - id: dict-singly
        text: A dict from key to node, and a singly linked list in order of use
        explanation: >-
          Each use moves a node to the most-recent end. Unlinking it needs the node before it, and
          without `prev` only a walk from the head finds that, which is O(n).
      - id: pair-list
        text: One Python list of `(key, value)` pairs in order of use
        explanation: >-
          Each use moves its pair to the end of the list. Finding the pair is a scan, and removing
          it from the middle moves every later pair, so each use is O(n).
      - id: dict-times
        text: A dict from key to the time of its last use
        explanation: >-
          Lookups and stores are O(1) on average, but nothing keeps the keys in order of use.
          Finding the oldest time to evict means checking every key, which is O(n).
    correct: dict-doubly
    followUps:
      dict-singly:
        prompt: You hold a node in a singly linked list. What does unlinking it need first?
        options:
          - id: node-before
            text: The node before it, found by a walk from the head
          - id: node-after
            text: Only the node after it, one hop away
          - id: nothing
            text: Nothing, since the dict already holds the node
        correct: node-before
        explanation: >-
          Unlinking rewrites the link that leads into the node, and that link belongs to the node
          before it. `prev` reaches that node in one hop, and without it the walk is O(n).
      pair-list:
        prompt: What does moving a pair from the middle of a Python list to its end cost?
        options:
          - id: linear
            text: O(n), to find the pair and to move every pair after it
          - id: constant
            text: O(1), since a list reads any index in one step
          - id: log
            text: O(log n), by halving the list
        correct: linear
        explanation: >-
          Reading an index is O(1), but the list does not know which index holds the key, so it
          scans. A gap in the middle is then closed by moving every later item.
      dict-times:
        prompt: With only a dict from key to its last-use time, how is the key to evict found?
        options:
          - id: scan
            text: By checking every key's time, O(n)
          - id: first-key
            text: By reading the first key, O(1)
          - id: lookup
            text: By looking up the oldest time, O(1) on average
        correct: scan
        explanation: >-
          A dict finds a key fast, but not the key with the smallest value. Keeping the keys in use
          order is what makes the oldest one sit at a known end.

  - id: checkpoint-random-set
    heading: Which design meets every cost?
    tags: [hash-map, complexity, python]
    prompt: >-
      A set of numbers must add a number, remove a number and return a random member, each in O(1)
      on average. `random.choice(seq)` picks a random item of a list in O(1), but it cannot take a
      set, which has no indices. Removing an item from the middle of a list moves every later item.
      Which design meets every cost?
    options:
      - id: list-and-index
        text: A list of the numbers, and a dict from each number to its index
        explanation: >-
          Adding appends to the list and stores the index. Removing reads the index from the dict,
          copies the last number into that index, pops the end and updates the moved number's
          index, all O(1) on average. `random.choice` works on the list.
      - id: set-alone
        text: A Python set of the numbers
        explanation: >-
          Adding and removing are O(1) on average, but `random.choice` cannot take a set. Copying
          it into a list for each pick is O(n).
      - id: list-alone
        text: A list of the numbers
        explanation: >-
          Adding and picking are O(1), but removing needs a scan to find the number and then moves
          every later item, so it is O(n).
      - id: sorted-list
        text: A sorted list of the numbers
        explanation: >-
          Keeping it sorted means each add goes to its place in order and moves every later item,
          which is O(n). Removing has the same cost.
    correct: list-and-index
    followUps:
      set-alone:
        prompt: What does `random.choice` need that a set does not have?
        options:
          - id: indices
            text: Indices, to pick the item at a random one
          - id: order
            text: Sorted order
          - id: size
            text: A known size
        correct: indices
        explanation: >-
          `random.choice` picks a random index and reads the item there. A set has no indices, so
          it would have to be copied into a list first, which takes O(n).
      list-alone:
        prompt: How does a plain list find the number to remove?
        options:
          - id: scan
            text: By comparing items from the front, O(n)
          - id: hash
            text: By its hash, O(1) on average
          - id: binary
            text: By halving the list, O(log n)
        correct: scan
        explanation: >-
          A list keeps no hash of its items. The dict from number to index is what finds the
          number in O(1) on average.
      sorted-list:
        prompt: Where does a new number go in a sorted list?
        options:
          - id: in-order
            text: At its place in order, which moves every later item
          - id: at-end
            text: At the end, since a list appends there
          - id: at-front
            text: At the front, in O(1)
        correct: in-order
        explanation: >-
          Sorted order fixes where the number belongs, usually in the middle. Making room there
          moves every item after it.

  - id: checkpoint-min-queue-design
    heading: Which design meets every cost?
    tags: [stack, queue, complexity]
    prompt: >-
      A queue must push, pop the oldest item, and report its smallest value, each in amortized
      O(1). Which design meets every cost?
    options:
      - id: two-stacks-pairs
        text: Two stacks, `inbox` and `outbox`, each holding `(value, smallest so far)` pairs
        explanation: >-
          A push stores the new value with the smaller of it and `inbox`'s top summary. A pop that
          finds `outbox` empty moves every item across, rebuilding each summary against `outbox`'s
          top as the item lands, so each item moves once and the cost is amortized O(1). The
          smallest value is the smaller of the two tops' summaries, two reads.
      - id: two-stacks-variable
        text: Two stacks, `inbox` and `outbox`, of values, and one variable holding the smallest
        explanation: >-
          A push can update the variable in O(1). But when the smallest value is popped, the
          variable has nothing to fall back to, and finding the next smallest is a scan, O(n).
      - id: deque-min
        text: One `deque` of values, and `min(queue)` when asked
        explanation: >-
          Push and pop are O(1), but `min` reads every item, so reporting the smallest value is
          O(n).
      - id: pairs-pop-front
        text: One list of `(value, smallest so far)` pairs, popping from the front
        explanation: >-
          `pop(0)` moves every later pair, which is O(n). Each summary also counts the older items
          below it, so once the oldest is popped, the summaries above it can name a value that is
          gone.
    correct: two-stacks-pairs
    followUps:
      two-stacks-variable:
        prompt: The variable holds the smallest value, and a pop removes that value. What does the variable need next?
        options:
          - id: next-smallest
            text: The next smallest value, which only a scan of both stacks finds
          - id: nothing
            text: Nothing, it can keep the old value
          - id: newest
            text: The value of the newest item
        correct: next-smallest
        explanation: >-
          One variable remembers one value. Keeping a smallest so far in every entry is what keeps
          the answer one read away after any pop.
      deque-min:
        prompt: How many items does `min(queue)` read on a queue of `n` items?
        options:
          - id: all
            text: All `n`
          - id: one
            text: One, the oldest
          - id: half
            text: About half of them
        correct: all
        explanation: >-
          `min` has to compare every item, since any of them could be the smallest. That makes the
          report O(n).
      pairs-pop-front:
        prompt: >-
          A list of `(value, smallest so far)` pairs is `[(2, 2), (5, 2), (7, 2)]`, oldest first.
          After `pop(0)` removes `(2, 2)`, what does the newest pair report as the smallest?
        options:
          - id: stale
            text: 2, though the smallest value left is 5
          - id: right
            text: 5, the smallest value left
          - id: newest
            text: 7, the newest value
        correct: stale
        explanation: >-
          `(7, 2)` was built while the 2 was still below it, and popping the front does not rebuild
          it. Summaries carried in a stack only stay right when items leave from the top.

  - id: checkpoint-debug-transfer
    heading: Which run does it fail on?
    tags: [stack, queue, python]
    prompt: |-
      A suggested queue built from two stacks should return items first in, first out. One detail
      is slightly off:

      ```python
      def push(inbox, x):
          inbox.append(x)

      def pop(inbox, outbox):
          while inbox:
              outbox.append(inbox.pop())
          return outbox.pop()
      ```

      Each run starts with both lists empty. `push(x)` stands for `push(inbox, x)` and `pop()` for
      `pop(inbox, outbox)`. In which run does a `pop()` return the wrong item?
    options:
      - id: interleaved
        text: '`push(4)`, `push(6)`, `pop()`, `push(8)`, `pop()`'
        explanation: >-
          The first pop moves 6 and 4, so `outbox` is `[6, 4]`, and returns 4. The 8 then arrives,
          and the second pop moves it on top of the 6 and returns 8, though the 6 came first. A
          pop must move items only when `outbox` is empty.
      - id: pushes-first
        text: '`push(4)`, `push(6)`, `push(8)`, `pop()`, `pop()`, `pop()`'
        explanation: >-
          The first pop moves all three, leaving `outbox` as `[8, 6, 4]`, and returns 4. `inbox`
          stays empty, so the later pops move nothing and return 6 and 8, which is right.
      - id: alternating
        text: '`push(4)`, `pop()`, `push(6)`, `pop()`'
        explanation: >-
          Each pop finds `outbox` empty, so moving everything is harmless here. The pops return 4
          and then 6, which is right.
      - id: pair
        text: '`push(4)`, `push(6)`, `pop()`, `pop()`'
        explanation: >-
          The first pop moves both, leaving `[6, 4]`, and returns 4. `inbox` is empty at the second
          pop, so it returns 6, which is right.
    correct: interleaved
    followUps:
      pushes-first:
        prompt: When every push comes before every pop, how often does `while inbox` move anything?
        options:
          - id: first-pop
            text: Only on the first pop, since `inbox` is empty after it
          - id: every-pop
            text: On every pop
          - id: never
            text: Never
        correct: first-pop
        explanation: >-
          With no pushes between the pops, `inbox` stays empty after the first move. The bug needs
          a new item to arrive while older items still wait in `outbox`.
      alternating:
        prompt: In this run, what does `outbox` hold each time a pop starts?
        options:
          - id: empty
            text: Nothing, so moving `inbox` across is the right step
          - id: old-items
            text: The items from earlier pops
          - id: everything
            text: Every item pushed so far
        correct: empty
        explanation: >-
          Each pop takes the only item `outbox` held. Moving items onto an empty `outbox` keeps the
          order right, so the run cannot show the bug.
      pair:
        prompt: At the second pop, which lists hold items?
        options:
          - id: outbox-only
            text: Only `outbox`, holding the 6
          - id: both
            text: Both lists
          - id: inbox-only
            text: Only `inbox`
        correct: outbox-only
        explanation: >-
          Both items crossed on the first pop, and nothing was pushed after it. With `inbox` empty,
          the `while` loop moves nothing and the order stays right.

  - id: checkpoint-first-unique-design
    heading: Which design meets every cost?
    tags: [hash-map, queue, complexity]
    prompt: >-
      A stream takes in items one at a time and must report the earliest item that has arrived
      exactly once so far. Adding an item and reporting must each cost amortized O(1), counting a
      dict operation as O(1). A dict keeps its keys in the order they were first added. On a
      `deque`, `popleft()` is O(1), but `remove(x)` searches from the front, which is O(n). Which
      design meets every cost?
    options:
      - id: pop-front
        text: A dict of counts, and a `deque` of first arrivals, popping repeated items off its front
        explanation: >-
          Each item joins the `deque` once, on its first arrival, and leaves at most once, since
          counts never drop. So a whole run pops no more items than it adds, and each report is
          amortized O(1). The front left standing has a count of 1.
      - id: remove-repeat
        text: A dict of counts, and a `deque` of first arrivals, calling `remove` when a count reaches 2
        explanation: >-
          The answers are right, but `remove` searches the `deque` from the front. If the items
          repeat from newest to oldest, every search walks the whole `deque`, so even the average
          cost is O(n). An item that waits until it reaches the front leaves by `popleft()`.
      - id: scan-counts
        text: A dict of counts, scanned in key order for the first count of 1 on each report
        explanation: >-
          The keys are in arrival order, but a report walks past every repeated key before it
          finds a count of 1. After `1, 1, 2, 2, 3, 3, 4` it passes three keys, and each report
          walks them again, so the cost grows with `n`.
      - id: one-variable
        text: A set of items seen, and one variable holding the earliest item seen once
        explanation: >-
          Adding is O(1) until the held item arrives again. Then the next item seen once has to be
          found, and a set keeps neither arrival order nor counts, so finding it means going back
          over the stream, which is O(n).
    correct: pop-front
    followUps:
      remove-repeat:
        prompt: What does `remove` cost when the repeated item sits near the back of the `deque`?
        options:
          - id: linear
            text: O(n), since it searches from the front
          - id: constant
            text: O(1), since the dict finds the item
          - id: log
            text: O(log n), by halving the `deque`
        correct: linear
        explanation: >-
          The dict holds counts, not places in the `deque`, so `remove` has to search for the
          item. Taking items only from the front never searches.
      scan-counts:
        prompt: On one report, how many keys can the scan pass before it finds a count of 1?
        options:
          - id: all
            text: Up to every key, when the early items have all repeated
          - id: one
            text: One, since a dict lookup is O(1)
          - id: none
            text: None, since the keys are in arrival order
        correct: all
        explanation: >-
          A dict finds a given key fast, but finding the first key with a count of 1 means checking
          keys in order. Dropping repeated items from a queue once means no later report passes
          them again.
      one-variable:
        prompt: The held item arrives a second time. What does the design need next?
        options:
          - id: next-once
            text: The next item seen once, which only a pass over the stream finds
          - id: nothing
            text: Nothing, since the held item still arrived first
          - id: newest
            text: The newest item, since it has arrived only once
        correct: next-once
        explanation: >-
          One variable remembers one item. Once that item repeats, the answer moves to a later
          item, and a set of items seen cannot tell which of them arrived only once.

  - id: checkpoint-newest-item
    heading: Which expression reads the newest item?
    tags: [stack, queue, python]
    prompt: |-
      This queue is built from two stacks, `inbox` and `outbox`, each a Python list used only at
      its end:

      ```python
      def push(inbox, x):
          inbox.append(x)

      def pop(inbox, outbox):
          if not outbox:
              while inbox:
                  outbox.append(inbox.pop())
          return outbox.pop()
      ```

      A `back` operation must return the newest item in O(1) without moving anything. Which
      expression returns it after any run that leaves the queue not empty?
    options:
      - id: inbox-top
        text: '`inbox[-1] if inbox else outbox[0]`'
        explanation: >-
          Every item in `inbox` was pushed after every item in `outbox`, and the newest push is on
          top of `inbox`. When `inbox` is empty, the newest item was the first one moved across,
          since a move pops `inbox` from its top, so it lands at the bottom of `outbox`, index 0.
      - id: outbox-top
        text: '`inbox[-1] if inbox else outbox[-1]`'
        explanation: >-
          The top of `outbox` is the item the next `pop` returns. After push 1, push 2, push 3 and
          a pop, `outbox` is `[3, 2]`, and this returns 2 instead of 3.
      - id: outbox-first
        text: '`outbox[0] if outbox else inbox[-1]`'
        explanation: >-
          It reads `outbox` even when `inbox` holds newer items. After push 1, push 2, a pop and
          push 3, `outbox` is `[2]` and `inbox` is `[3]`, and this returns 2 instead of 3.
      - id: inbox-bottom
        text: '`inbox[0] if inbox else outbox[0]`'
        explanation: >-
          `inbox[0]` is the earliest item still in `inbox`. After push 1 and push 2, `inbox` is
          `[1, 2]`, and this returns 1 instead of 2.
    correct: inbox-top
    followUps:
      outbox-top:
        prompt: After items move from `inbox` to `outbox`, which one sits on top of `outbox`?
        options:
          - id: oldest
            text: The oldest, which the next pop returns
          - id: newest
            text: The newest, as on top of `inbox`
          - id: second
            text: Whichever was pushed second
        correct: oldest
        explanation: >-
          Moving reverses the order, so the item pushed first ends on top and the item pushed last
          ends at the bottom, index 0.
      outbox-first:
        prompt: When both lists hold items, which list holds the newest one?
        options:
          - id: inbox
            text: '`inbox`, since every push goes there'
          - id: outbox
            text: '`outbox`, since its items moved last'
          - id: either
            text: Either one, depending on the last pop
        correct: inbox
        explanation: >-
          The items in `outbox` were moved there before any item now in `inbox` was pushed. So
          when `inbox` holds anything, its top is the newest item.
      inbox-bottom:
        prompt: In `inbox`, which end holds the newest item?
        options:
          - id: end
            text: The end, `inbox[-1]`, where `append` puts it
          - id: front
            text: The front, `inbox[0]`
          - id: neither
            text: Neither, since `inbox` holds its items reversed
        correct: end
        explanation: >-
          `append` adds at the end, so `inbox` runs from oldest to newest. Only `outbox` holds its
          items in reverse order.

  - id: checkpoint-token-expiry
    heading: Which tokens are live?
    tags: [hash-map]
    prompt: >-
      A session store keeps `expires`, a dict from each token to the time it expires. A token is
      live at time `t` while `expires[tok] > t`. `issue(tok, t)` sets `expires[tok]` to `t + 5`.
      `renew(tok, t)` sets `expires[tok]` to `t + 5` only if `tok` is live at `t`, and does nothing
      otherwise. `live(t)` returns the tokens live at `t`. The calls are `issue('a', 1)`,
      `issue('d', 2)`, `issue('b', 3)`, `renew('a', 6)`, `issue('c', 7)` and `live(8)`. Which
      tokens does `live(8)` return?
    options:
      - id: only-c
        text: Only `c`
        explanation: >-
          `expires['a']` is 6, so at time 6 the token `a` has run out and the renew does nothing.
          `expires['d']` is 7 and `expires['b']` is 8, and neither is greater than 8. Only `c`, which
          expires at 12, is live at 8.
      - id: a-and-c
        text: "`a` and `c`"
        explanation: >-
          That holds only if a renew always works. `renew('a', 6)` first checks that `a` is live at
          6, and `expires['a']` is 6, which is not greater than 6, so the renew does nothing.
      - id: a-b-and-c
        text: "`a`, `b` and `c`"
        explanation: >-
          That counts a token as live at the moment its expiry arrives. The rule is
          `expires[tok] > t`, so `a` is not live at 6 and is never renewed, and `b`, whose expiry is
          8, is not live at 8.
      - id: all-four
        text: "`a`, `b`, `c` and `d`"
        explanation: >-
          Every token is still a key in `expires`, but `live(8)` returns only those whose expiry is
          greater than 8. `a` ran out at 6, `d` at 7 and `b` at 8.
    correct: only-c
    followUps:
      a-and-c:
        prompt: When `renew('a', 6)` runs, `expires['a']` is 6. Does the renew change `expires['a']`?
        options:
          - id: not-live
            text: No, since `6 > 6` is false, so `a` is not live at 6
          - id: renews-anyway
            text: Yes, a renew works on any token that was issued
          - id: still-a-key
            text: Yes, since `a` is still a key in `expires`
        correct: not-live
        explanation: >-
          `renew` checks `expires['a'] > 6` first. `6 > 6` is false, so the renew does nothing and
          `a` stays expired.
      a-b-and-c:
        prompt: "`expires['b']` is 8. Is `b` live at time 8?"
        options:
          - id: expired
            text: No, since `8 > 8` is false
          - id: last-moment
            text: Yes, its last moment is time 8
          - id: newer
            text: Yes, since it was issued after `a`
        correct: expired
        explanation: >-
          The rule compares with `>`, so a token whose expiry equals `t` is no longer live. `b`
          would need an expiry greater than 8.
      all-four:
        prompt: Does a token stay in `expires` after it runs out?
        options:
          - id: stays-skipped
            text: Yes, but `live` leaves it out
          - id: removed
            text: No, it is removed when it runs out
          - id: stays-counted
            text: Yes, and `live` returns it too
        correct: stays-skipped
        explanation: >-
          Nothing here deletes a key from `expires`. `live(t)` compares each expiry with `t`, so a
          key that has run out is left out of the answer.
