id: bit-manipulation-review
title: "Bit manipulation: review"
description: Fresh inputs for the Bit manipulation skills, for recall on later days. No worked examples this time.
heading: What does this produce?

questions:
  - format: tap-cell
    id: bits-review-bit-worth
    heading: Tap the bit worth 16
    tags: [bit-manipulation, python]
    prompt: >-
      The cells show `x` from line 1, highest bit first. Tap the bit worth 16.
    code: |
      x = 0b01110010
    sequence:
      kind: string
      name: x
      cells: ['0', '1', '1', '1', '0', '0', '1', '0']
    correct: 3
    explanation: >-
      16 is `2 ** 4`, so it is bit 4. Bits are numbered from the right starting at 0, so bit 4 is
      the fifth cell from the right, the fourth from the left.
    misses:
      - index: 0
        explanation: >-
          This is bit 7, the highest of the eight, worth 128. It is 0 here, so it adds nothing to
          `x`.
      - index: 1
        explanation: This is bit 6, worth 64. 16 is two places further right.
      - index: 2
        explanation: This is bit 5, worth 32. 16 is half of that, one place to the right.
      - index: 4
        explanation: >-
          Counting from the left, or counting from 1, lands here, but bits are numbered from the
          right starting at 0. This is bit 3, worth 8.
      - index: 5
        explanation: This is bit 2, worth 4. Each place to the left doubles the worth.
      - index: 6
        explanation: >-
          This is bit 1, worth 2, the lowest set bit of `x`. 16 sits three places further left.
      - index: 7
        explanation: This is bit 0, the rightmost, worth 1.

  - id: bits-review-read-binary
    heading: What does this print?
    tags: [bit-manipulation, python]
    prompt: |-
      ```python
      print(0b1011001)
      ```

      What does this print?
    options:
      - id: eighty-nine
        text: "`89`"
        explanation: >-
          Counted from the right, the set bits are bits 0, 3, 4 and 6. They are worth 1, 8, 16 and
          64, which sum to 89.
      - id: seventy-seven
        text: "`77`"
        explanation: >-
          77 is `0b1001101`, the same digits read from the other end. Bit 0 is the rightmost digit,
          and the leftmost here is bit 6, worth 64.
      - id: four
        text: "`4`"
        explanation: >-
          4 is how many set bits there are. Each one adds what its place is worth, which here is 1,
          8, 16 and 64.
      - id: digits
        text: "`1011001`"
        explanation: >-
          `print` shows an int in decimal. The `0b` prefix only tells Python how to read the
          digits as they were typed.
    correct: eighty-nine
    followUps:
      seventy-seven:
        prompt: In `0b1011001`, which digit is worth 64?
        options:
          - { id: leftmost, text: "The leftmost, bit 6" }
          - { id: rightmost, text: "The rightmost, bit 0" }
          - { id: seventh-from-left, text: "The seventh from the left, since it is bit 6" }
        correct: leftmost
        explanation: >-
          The number has seven digits, bits 6 down to 0. Bit 6 is the leftmost and is worth
          `2 ** 6`, which is 64, and the rightmost is bit 0, worth 1.
      four:
        prompt: Which two binary numbers have the same count of set bits but different values?
        options:
          - { id: differ, text: "`0b11` and `0b1001`, which are 3 and 9" }
          - { id: none, text: "None: the count of set bits fixes the value" }
          - { id: same, text: "`0b11` and `0b011`, which are 3 and 6" }
        correct: differ
        explanation: >-
          Both have two set bits, but at different places: bits 0 and 1 give 3, and bits 0 and 3
          give 9. A leading 0 changes nothing, so `0b011` is also 3.
      digits:
        prompt: What does `print(0b1010)` show?
        options:
          - { id: ten, text: "`10`" }
          - { id: same, text: "`1010`" }
          - { id: prefixed, text: "`0b1010`" }
        correct: ten
        explanation: >-
          `0b1010` has bits 1 and 3 set, worth 2 and 8, so it is the int 10, and `print` shows ints
          in decimal.

  - id: bits-review-low-mask
    heading: What does this print?
    tags: [bit-manipulation, python]
    prompt: |-
      ```python
      x = 0b10110110
      print(x & 0b1111)
      ```

      What does this print?
    options:
      - id: six
        text: "`6`"
        explanation: >-
          `0b1111` sets the four lowest bits and no others. `&` keeps the low four bits of `x`,
          `0110`, and clears everything above them, so the result is 6.
      - id: eleven
        text: "`11`"
        explanation: >-
          11 is `1011`, the top four digits of `x`. A shorter number lines up with the right end,
          so `0b1111` covers bits 0 to 3, the low end.
      - id: fifteen
        text: "`15`"
        explanation: >-
          15 is the mask itself. `&` gives the mask back only if `x` has a 1 under each of its
          bits, and the low four digits of `x` are `0110`.
      - id: one-ninety-one
        text: "`191`"
        explanation: >-
          191 is `x | 0b1111`, where every place under the mask becomes 1. `&` copies those places
          from `x` instead, and clears everything above them.
    correct: six
    followUps:
      eleven:
        prompt: Which bits of `x` does `x & 0b1111` keep?
        options:
          - { id: low, text: "The lowest four, since `0b1111` sets bits 0 to 3" }
          - { id: high, text: "The highest four, since binary is written from the left" }
          - { id: zeros, text: "The bits that are 0 in `x`" }
        correct: low
        explanation: >-
          A mask keeps the places where it has a 1. `0b1111` is 15, whose set bits are the four
          lowest places, so `x & 0b1111` keeps the low four digits, `0110`.
      fifteen:
        prompt: When does `x & m` equal `m`?
        options:
          - { id: covers, text: "When `x` has a 1 under every 1 of `m`" }
          - { id: always, text: "Always, since `&` returns the mask" }
          - { id: larger, text: "Whenever `x` is larger than `m`" }
        correct: covers
        explanation: >-
          `&` keeps a 1 only where both numbers have one. If `x` has a 0 under some bit of `m`, that
          bit is lost. Here `x` ends in `0110`, so two of the four mask bits are lost.
      one-ninety-one:
        prompt: What does `x | 0b1111` do, unlike `x & 0b1111`?
        options:
          - { id: set-low, text: "It turns the low four bits on and keeps the rest of `x`" }
          - { id: keep-low, text: "It keeps the low four bits and clears the rest of `x`" }
          - { id: flip-low, text: "It flips the low four bits and keeps the rest of `x`" }
        correct: set-low
        explanation: >-
          `|` gives 1 wherever the mask has a 1, so the low four bits become `1111` and the top
          bits stay. `x & 0b1111` keeps the low four as they are and clears the top, and flipping
          is `^`.

  - id: bits-review-xor-print
    heading: What does this print?
    tags: [bit-manipulation, python]
    prompt: |-
      ```python
      print(13 ^ 6)
      ```

      What does this print?
    options:
      - id: eleven
        text: "`11`"
        explanation: >-
          `13` is `0b1101` and `6` is `0b0110`. Bits 3, 1 and 0 are each set in only one of them,
          and bit 2 is set in both, so `13 ^ 6` is `0b1011`, which is 11.
      - id: four
        text: "`4`"
        explanation: >-
          4 is `13 & 6`, the one bit set in both. `^` drops that bit and keeps the bits set in
          exactly one.
      - id: fifteen
        text: "`15`"
        explanation: >-
          15 is `13 | 6`. `^` also keeps the bits set in exactly one number, but it drops bit 2,
          which both have.
      - id: seven
        text: "`7`"
        explanation: >-
          7 is `13 - 6`. `^` works bit by bit with no borrowing, so it is not subtraction.
    correct: eleven
    followUps:
      four:
        prompt: For `13 ^ 6`, what happens to bit 2, which both numbers have set?
        options:
          - { id: dropped, text: "It is dropped, and the bits set in only one are kept" }
          - { id: kept-only, text: "It is the only bit kept" }
          - { id: kept-all, text: "It is kept along with every other set bit" }
        correct: dropped
        explanation: >-
          `^` sets a bit where exactly one number has it set. Keeping only the shared bit is `&`,
          which gives 4, and keeping every set bit is `|`.
      fifteen:
        prompt: When do `a ^ b` and `a | b` give the same result?
        options:
          - { id: no-shared, text: "When `a` and `b` share no set bit" }
          - { id: always, text: "Always, since both keep every set bit" }
          - { id: odd, text: "When both numbers are odd" }
        correct: no-shared
        explanation: >-
          The two differ only on a bit set in both: `|` keeps it and `^` drops it. 13 and 6 share
          bit 2, so `13 | 6` is 15 and `13 ^ 6` is 11.
      seven:
        prompt: Why is `13 ^ 6` not `13 - 6`?
        options:
          - { id: per-bit, text: "`^` decides each bit on its own, with no borrow" }
          - { id: order, text: "`^` subtracts the larger number from the smaller one" }
          - { id: same, text: "It is: `^` is subtraction for numbers below 16" }
        correct: per-bit
        explanation: >-
          Subtraction borrows from higher places, and `^` never does. Each bit of `13 ^ 6` is set
          when exactly one of the two numbers has it set, which gives 11.

  - id: bits-review-shift-drag
    format: drag-pointers
    heading: Where does each 1 land?
    tags: [bit-manipulation, python]
    prompt: >-
      The cells show `x = 0b01011000` (88), highest bit first. `hi` marks its highest 1 and `lo`
      its lowest 1. Drag each pointer to where that 1 sits after line 2.
    code: |
      x = 0b01011000
      x >>= 3
    sequence: { kind: string, name: x, cells: ['0', '1', '0', '1', '1', '0', '0', '0'] }
    pointers:
      - name: hi
        start: 1
        correct: 4
        explanation: >-
          `>>= 3` moves every digit three places toward the low end, which is right in this
          drawing. The 1 at index 1 moves to index 4, and `x` becomes `00001011`, which is 11.
        misses:
          - index: 2
            explanation: The shift count is 3, so every digit moves three places, not one.
          - index: 1
            explanation: Every digit moves, the highest 1 included. 0s fill the top three places.
        elsewhere: Every digit moves exactly three places toward the low end, on the right.
      - name: lo
        start: 4
        correct: 7
        explanation: >-
          The lowest 1 moves three places right as well, from index 4 to index 7. The three 0s
          that were below it fall off the end.
        misses:
          - index: 1
            explanation: >-
              Three places to the left is what `<<= 3` does. `>>` moves digits toward the low end.
          - index: 4
            explanation: >-
              Every digit moves. The three 0s below this 1 are dropped, so it lands in the lowest
              place.
        elsewhere: The lowest 1 moves three places right, the same as every other digit.

  - id: bits-review-tap-two-clears
    format: tap-cell
    heading: Tap the lowest 1
    tags: [bit-manipulation, python]
    prompt: >-
      The cells show `n` from line 1, highest bit first. They do not change when lines 2 and 3
      run. Tap the digit that is the lowest 1 of `n` after line 3.
    code: |
      n = 0b11010100
      n &= n - 1
      n &= n - 1
    sequence:
      kind: string
      name: n
      cells: ['1', '1', '0', '1', '0', '1', '0', '0']
    correct: 1
    explanation: >-
      Line 2 clears the lowest 1, at index 5, and leaves `11010000`. Line 3 clears the next one,
      at index 3, and leaves `11000000`. The lowest 1 left is at index 1.
    misses:
      - index: 0
        explanation: >-
          Index 0 is still 1, but the 1 at index 1 is lower and survives both lines, since each
          line clears only one 1.
      - index: 2
        explanation: This digit was 0 from the start, and clearing bits never sets one.
      - index: 3
        explanation: >-
          This was the lowest 1 after line 2, so line 3 cleared it. Each line removes whichever
          1 is lowest at that moment.
      - index: 4
        explanation: This digit was 0 from the start, and clearing bits never sets one.
      - index: 5
        explanation: >-
          This was the lowest 1 at the start, so line 2 cleared it. Two lines clear two 1s.
      - index: 6
        explanation: >-
          `n - 1` turns this 0 into a 1, but `n` has a 0 here, so the `&` makes it 0 again.
      - index: 7
        explanation: >-
          `n - 1` turns this 0 into a 1, but `n` has a 0 here, so the `&` makes it 0 again. The
          last digit of `n` stays 0.

  - id: bits-review-which-power
    heading: Which call passes?
    tags: [bit-manipulation, python]
    prompt: |-
      ```python
      def check(n):
          return n > 0 and (n & (n - 1)) == 0
      ```

      Which call returns `True`?
    options:
      - id: sixty-four
        text: "`check(0b1000000)`"
        explanation: >-
          `0b1000000` is 64, with one set bit. Clearing it leaves nothing, so `64 & 63` is 0, and
          64 is more than 0.
      - id: zero
        text: "`check(0b0)`"
        explanation: >-
          `0b0` is 0. `n > 0` is `False`, so `and` stops there and the call returns `False`. 0 has
          no set bit, so the `&` test alone would have passed it.
      - id: ninety-six
        text: "`check(0b1100000)`"
        explanation: >-
          `0b1100000` is 96, with two set bits. Clearing the lowest leaves bit 6, so `96 & 95` is
          64, not 0.
      - id: sixty-three
        text: "`check(0b111111)`"
        explanation: >-
          `0b111111` is 63, with six set bits. Clearing bit 0 leaves five, so `63 & 62` is 62, not
          0.
    correct: sixty-four
    followUps:
      zero:
        prompt: What makes `check(0)` return `False`?
        options:
          - { id: guard, text: "`n > 0`, since 0 would pass the `&` test" }
          - { id: and-test, text: "`(n & (n - 1)) == 0`, since 0 has no set bit to clear" }
          - { id: neither, text: "Nothing: `check(0)` returns `True`" }
        correct: guard
        explanation: >-
          `and` stops at the first false part, so for 0 the `&` test never runs. It would have
          passed, since 0 has no set bit and `&` with it gives 0.
      ninety-six:
        prompt: What is `0b1100000 & 0b1011111`?
        options:
          - { id: sixty-four, text: "`0b1000000`, which is 64" }
          - { id: zero, text: "`0`" }
          - { id: thirty-two, text: "`0b0100000`, which is 32" }
        correct: sixty-four
        explanation: >-
          Those are 96 and 95. Subtracting 1 cleared bit 5, the lowest set bit, and set the bits
          below it, so only bit 6 is set in both.
      sixty-three:
        prompt: What is `0b111111 & 0b111110`?
        options:
          - { id: sixty-two, text: "`0b111110`, which is 62" }
          - { id: zero, text: "`0`" }
          - { id: one, text: "`0b1`, which is 1" }
        correct: sixty-two
        explanation: >-
          Those are 63 and 62. The `&` clears only bit 0, the lowest set bit, and the other five
          set bits stay, so the test sees 62.

  - id: bits-review-popcount-passes
    heading: How many passes?
    tags: [bit-manipulation, complexity, python]
    prompt: |-
      ```python
      n = (1 << 30) + 1
      count = 0
      while n:
          n &= n - 1
          count += 1
      ```

      How many times does the loop body run?
    options:
      - id: two
        text: 2 passes
        explanation: >-
          `n` has two 1 digits, bit 30 and bit 0. The first pass clears bit 0 and leaves `1 << 30`,
          the second clears bit 30 and leaves 0, and the `while` test fails.
      - id: thirty-one
        text: 31 passes
        explanation: >-
          31 is the number of binary digits of `n`, bits 30 down to 0. The loop does not visit each
          digit. Only 1 digits cost a pass, and the 29 zeros between them cost nothing.
      - id: one
        text: 1 pass
        explanation: >-
          One pass clears only the lowest 1, bit 0. That leaves `1 << 30`, which is not 0, so the
          loop runs again.
      - id: billion
        text: 2 ** 30 passes
        explanation: >-
          About a billion passes would be a count down by one. Each pass jumps straight to the
          next 1, so the loop skips every value in between.
    correct: two
    followUps:
      thirty-one:
        prompt: What sets the number of passes this loop makes?
        options:
          - { id: ones, text: "How many 1 digits `n` has" }
          - { id: digits, text: "How many binary digits `n` has" }
          - { id: value, text: "How large `n` is" }
        correct: ones
        explanation: >-
          Each pass clears exactly one 1, and the loop stops when none are left. Zeros never cost
          a pass, so a 31-digit number with two 1s takes two passes.
      one:
        prompt: For `n = (1 << 30) + 1`, what is `n & (n - 1)`?
        options:
          - { id: high, text: "`1 << 30`, since only the lowest 1 is cleared" }
          - { id: zero, text: "0, since `n` and `n - 1` share no 1 digit" }
          - { id: low, text: "1, since the highest 1 is cleared" }
        correct: high
        explanation: >-
          `n - 1` is `1 << 30`, which differs from `n` only in bit 0. The `&` keeps bit 30, so the
          loop needs a second pass to clear it.
      billion:
        prompt: How far does one pass move `n`?
        options:
          - { id: one-bit, text: "It clears one 1 digit, however many values that skips" }
          - { id: minus-one, text: "It subtracts 1, so it visits every value down to 0" }
          - { id: halve, text: "It halves `n`, so it takes one pass per digit" }
        correct: one-bit
        explanation: >-
          `n &= n - 1` is not `n -= 1`. Here the first pass goes from `2 ** 30 + 1` to `2 ** 30`
          and the second straight to 0, skipping about a billion values.

  - id: bits-review-build-mask
    heading: Which mask picks these items?
    tags: [bit-manipulation, python]
    prompt: |-
      ```python
      items = ['a', 'b', 'c', 'd']
      picked = [items[j] for j in range(4) if (mask >> j) & 1]
      ```

      Which value of `mask` makes `picked` equal `['a', 'b']`?
    options:
      - id: three
        text: "`3`"
        explanation: >-
          `'a'` is item 0 and `'b'` is item 1, so the mask needs bit 0 and bit 1, which is
          `0b0011`, or 3.
      - id: twelve
        text: "`12`"
        explanation: >-
          12 is `1100`, which reads the list onto the binary digits from the left. Bit `j` counts
          places from the right, starting at 0, so 12 picks `['c', 'd']`.
      - id: six
        text: "`6`"
        explanation: >-
          6 is `0110`, which numbers the items from bit 1. `(mask >> 0) & 1` reads bit 0 for
          `items[0]`, and 6 has bit 0 clear, so `'a'` is left out.
      - id: eleven
        text: "`11`"
        explanation: >-
          The binary digits are `11`, but as a Python int literal `11` is eleven, `1011`, which
          picks `['a', 'b', 'd']`.
    correct: three
    followUps:
      twelve:
        prompt: Which bit of `mask` decides whether `items[0]` is picked?
        options:
          - { id: lowest, text: "Bit 0, the lowest, worth 1" }
          - { id: leftmost, text: "Bit 3, the leftmost of four, worth 8" }
          - { id: sign, text: "The sign bit, since index 0 comes first" }
        correct: lowest
        explanation: >-
          `(mask >> j) & 1` shifts bit `j` down to the bottom and reads it, so item 0 goes with bit
          0. Binary is written highest bit first, which reverses the list order on paper.
      six:
        prompt: Which items does mask 6 (`0110`) pick?
        options:
          - { id: b-c, text: "`['b', 'c']`" }
          - { id: a-b, text: "`['a', 'b']`" }
          - { id: c-d, text: "`['c', 'd']`" }
        correct: b-c
        explanation: >-
          6 has bits 1 and 2 set, which are items 1 and 2. Numbering the items from bit 1 shifts
          every pick up by one.
      eleven:
        prompt: What is the value of `0b11`?
        options:
          - { id: three, text: "3, since it is 2 + 1" }
          - { id: eleven, text: "11, the same as the digits" }
          - { id: two, text: "2, since it has two 1 digits" }
        correct: three
        explanation: >-
          Binary `11` is one 2 plus one 1, which is 3. Writing `11` without the `0b` prefix makes a
          decimal eleven.

  - id: bits-review-trace-xor
    format: step-trace
    heading: Predict each step
    tags: [bit-manipulation, python]
    prompt: >-
      Every value in `vals` appears twice except one. Predict `acc` at each step before it is
      shown.
    code: |
      acc = 0
      for v in vals:
          acc ^= v
      print(acc)
    sequence: { kind: array, name: vals, cells: [4, 7, 4, 9, 7] }
    start:
      - { name: v, at: 0 }
    steps:
      - line: 3
        ask: "`acc` is 4 after the first pass. What is it after the 7 at index 1?"
        options:
          - id: three
            text: '3'
            explanation: >-
              4 is `100` and 7 is `111`. They differ in the 2 and 1 places, so `4 ^ 7` is `011`,
              which is 3.
          - id: eleven
            text: '11'
            explanation: 11 is `4 + 7`. `^` does not add; it marks the places where the two differ.
          - id: seven
            text: '7'
            explanation: 7 is `4 | 7`. `^` turns the shared 4 bit off instead of keeping it.
        correct: three
        also:
          - { name: v, at: 1 }
      - line: 3
        ask: The second 4, at index 2, comes next. What is `acc` after it?
        options:
          - id: seven
            text: '7'
            explanation: >-
              `3 ^ 4` is 7. The second 4 cancels the first, so `acc` now holds only the 7, the one
              value seen an odd number of times so far.
          - id: three
            text: '3'
            explanation: >-
              The second 4 is not skipped. `^` with it flips the 4 bit again, so `acc` changes from 3
              to 7.
          - id: zero
            text: '0'
            explanation: >-
              Only the two 4s cancel. The 7 has been seen once, so `acc` still holds it.
        correct: seven
        also:
          - { name: v, at: 2 }
      - line: 3
        ask: The 9 at index 3 comes next. What is `acc` after it?
        options:
          - id: fourteen
            text: '14'
            explanation: >-
              7 is `0111` and 9 is `1001`. They differ in the 8, 4 and 2 places, so `7 ^ 9` is
              `1110`, which is 14.
          - id: sixteen
            text: '16'
            explanation: 16 is `7 + 9`. `^` has no carries, and the shared 1 bit cancels instead.
          - id: fifteen
            text: '15'
            explanation: 15 is `7 | 9`. The 1 bit is set in both, so `^` turns it off.
        correct: fourteen
        also:
          - { name: v, at: 3 }
      - line: 4
        ask: The second 7, at index 4, is the last value. What does line 4 print?
        options:
          - id: nine
            text: '9'
            explanation: >-
              `14 ^ 7` is 9. Both 7s and both 4s have cancelled, which leaves the 9, the value that
              appears once.
          - id: zero
            text: '0'
            explanation: >-
              Only values with a partner cancel. The 9 appears once, so it is what is left.
          - id: twenty-one
            text: '21'
            explanation: 21 is `14 + 7`. `^` takes the 7 back out instead of adding it.
        correct: nine
        also:
          - { name: v, at: 4 }

  - id: bits-review-toggle
    heading: What does this print?
    tags: [bit-manipulation, python]
    prompt: |-
      ```python
      m = 0b0101
      m ^= 1 << 2
      m ^= 1 << 1
      print(m)
      ```

      What does this print?
    options:
      - id: three
        text: "`3`"
        explanation: >-
          `1 << 2` is `0100`, and bit 2 of `m` is 1, so line 2 turns it off: `0001`. `1 << 1` is
          `0010`, and bit 1 is 0, so line 3 turns it on: `0011`, which is 3.
      - id: seven
        text: "`7`"
        explanation: >-
          7 is `0101 | 0100 | 0010`, which turns both bits on. `^=` turns a bit off when it was
          already on, and bit 2 was.
      - id: one
        text: "`1`"
        explanation: >-
