      `[3, 4, 12]`, and the route to stone 2 came from stone 1 (`src`). The pass with `i` at 3
      skips the missing stone. Predict each step before it is shown.
    code: |
      inf = float('inf')

      def cheapest(cost):
          best = [inf] * len(cost)
          best[0] = cost[0]
          for i in range(1, len(cost)):
              if cost[i] is None:        # a missing stone
                  continue
              for j in (i - 1, i - 3):
                  if j >= 0:
                      best[i] = min(best[i], best[j] + cost[i])
          return best[-1]

