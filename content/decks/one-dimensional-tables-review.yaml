id: one-dimensional-tables-review
title: "Dynamic programming: 1D tables (review)"
description: Fresh tables for the 1D table skills, for recall on later days. No worked examples this time.
heading: What does the table hold?

questions:
  - id: prefix-answer-cell-review
    format: tap-cell
    heading: Tap the answer
    tags: [dp]
    prompt: >-
      `ok[i]` is True when the first `i` letters of `s` split into dictionary words. Tap the cell
      that says whether all of `s` splits.
    code: |
      s = 'toned'
      words = ['to', 'ton', 'ned', 'one']
      ok = [False] * (len(s) + 1)
      ok[0] = True
      for i in range(1, len(s) + 1):
          for w in words:
              if i >= len(w) and ok[i - len(w)] and s[i - len(w):i] == w:
                  ok[i] = True
      print(ok)   # [True, False, True, True, False, True]
    sequence: { kind: array, name: ok, cells: ['True', 'False', 'True', 'True', 'False', 'True'] }
    correct: 5
    explanation: >-
      `ok[5]` covers the first 5 letters, which is all of `'toned'`: `to` + `ned`. The table has
      `len(s) + 1` cells, so the whole string is the last one.
    misses:
      - index: 0
        explanation: >-
          `ok[0]` is the empty prefix, True before any word is placed. Every split starts there,
          but it is not the answer.
      - index: 1
        explanation: "`ok[1]` covers `'t'` alone, which no word matches."
      - index: 2
        explanation: "`ok[2]` covers `'to'`. The rest, `'ned'`, still has to split."
      - index: 3
        explanation: "`ok[3]` covers `'ton'`. It is True, but the `'ed'` after it is left over."
      - index: 4
        explanation: >-
          4 is the index of the last letter in `s`, but `ok[4]` covers only the first four
          letters, `'tone'`, and they do not split.

  - id: rising-pick-entry-review
    heading: What does an entry mean?
    tags: [dp, python]
    prompt: |-
      An increasing subsequence takes values from left to right, each larger than the one before,
      and may skip values.

      ```python
      def longest(nums):
          lis = [1] * len(nums)
          for i in range(len(nums)):
              for j in range(i):
                  if nums[j] < nums[i]:
                      lis[i] = max(lis[i], lis[j] + 1)
          return max(lis)

      longest([1, 5, 2, 6, 3, 0])   # lis is [1, 2, 2, 3, 3, 1], returns 3
      ```

      What does `lis[i]` hold?
    options:
      - id: ends-at
        text: The length of the longest increasing subsequence that ends with `nums[i]`
        explanation: >-
          `lis[i]` extends a subsequence that ends at an earlier, smaller value by one, so every
          subsequence it counts ends on `nums[i]`. That is why the call returns `max(lis)`: the
          longest one may end anywhere. Here `1, 2, 3` and `1, 5, 6` both have length 3.
      - id: prefix
        text: The length of the longest increasing subsequence among `nums[0]` through `nums[i]`
        explanation: >-
          Then the last entry would be the answer, and no entry could be smaller than the one
          before it. Yet `lis[5]` is 1, while `1, 2, 3` appears earlier in the list.
      - id: starts-at
        text: The length of the longest increasing subsequence that starts with `nums[i]`
        explanation: >-
          The inner loop only looks at indices smaller than `i`, the values to its left. A
          subsequence that starts at `nums[i]` would be built from values to its right.
      - id: neighbors
        text: The length of the longest increasing subarray that ends at `nums[i]`
        explanation: >-
          The inner loop looks at every earlier value, not only the neighbor. `lis[2]` is 2, from
          `1, 2`, although the 5 between them is larger than 2.
    correct: ends-at
    followUps:
      prefix:
        prompt: "`lis[5]` is 1 for `[1, 5, 2, 6, 3, 0]`. What does that say about the meaning of `lis[i]`?"
        options:
          - id: only-ending
            text: It counts only subsequences that end on the 0, though all six values hold one of length 3
          - id: bug
            text: It is a bug, since the first six values hold one of length 3
          - id: starting
            text: It counts the subsequences that start at index 5
        correct: only-ending
        explanation: >-
          Nothing smaller than 0 comes before it, so a subsequence that ends on the 0 is just `0`.
          The entry is about subsequences that end at `i`, so the answer is the largest entry, not
          the last.
      starts-at:
        prompt: Which entries does `lis[i]` read?
        options:
          - id: earlier
            text: "`lis[j]` for `j` before `i`, so `nums[i]` is the end of each subsequence"
          - id: later
            text: "`lis[j]` for `j` after `i`, so `nums[i]` is the start of each subsequence"
          - id: previous
            text: Only `lis[i - 1]`, the neighbor to the left
        correct: earlier
        explanation: >-
          `range(i)` covers the indices before `i`. Adding 1 to a subsequence that ends at
          `nums[j]` puts `nums[i]` at the end, so the entry describes subsequences that end there.
      neighbors:
        prompt: "`lis[2]` is 2 for `[1, 5, 2, 6, 3, 0]`. Which subsequence gives it?"
        options:
          - id: skips
            text: "`1, 2`, skipping the 5 between them"
          - id: neighbors
            text: "`5, 2`, the two values side by side"
          - id: alone
            text: "`2` alone, counted twice by the loops"
        correct: skips
        explanation: >-
          The inner loop tries every earlier smaller value, here the 1 at index 0, so a subsequence
          need not use neighbors. The neighbors `5, 2` go down, so an increasing subarray that ends
          at index 2 has length 1.

  - id: forward-fill-entry-review
    heading: What does an entry mean?
    tags: [dp, python]
    prompt: |-
      `reach[i]` is the farthest a jump from index `i` can go. Each pass writes forward into later
      entries instead of reading earlier ones.

      ```python
      inf = float('inf')

      def fewest(reach):
          n = len(reach)
          hops = [inf] * n
          hops[0] = 0
          for i in range(n):
              for j in range(i + 1, min(n, i + reach[i] + 1)):
                  hops[j] = min(hops[j], hops[i] + 1)
          return hops[-1]

      fewest([2, 1, 3, 0, 1, 2])   # hops is [0, 1, 1, 2, 2, 2], returns 2
      ```

      What does `hops[j]` hold once the loop ends?
    options:
      - id: from-start
        text: The fewest jumps that take you from index 0 to land on index `j`
        explanation: >-
          `hops[0] = 0` is the start, and a jump from `i` offers `hops[i] + 1` to every index it can
          land on, keeping the smallest offer. On `[2, 1, 3, 0, 1, 2]`, index 3 takes 2 jumps, 0 to
          2 to 3, and the last index also takes 2, 0 to 2 to 5.
      - id: to-end
        text: The fewest jumps that take you from index `j` to the last index
        explanation: >-
          `hops[0]` is 0, yet the last index is 2 jumps from index 0. The entries count jumps from
          the start, and only the last one is the answer.
      - id: sources
        text: The number of earlier indices whose jump can land on index `j`
        explanation: >-
          Indices 0 and 1 can both jump to index 2, yet `hops[2]` is 1. Each write keeps a
          smallest value, it does not add one per index.
      - id: farthest
        text: The farthest index you can land on using exactly `j` jumps
        explanation: >-
          `hops[1]` is 1, yet one jump from index 0 reaches index 2. The entry is about landing on
          index `j`, not about a number of jumps.
    correct: from-start
    followUps:
      to-end:
        prompt: "`hops[0]` is 0. What would it be if the entries meant jumps to the last index?"
        options:
          - id: two
            text: 2, since the end is two jumps from index 0
          - id: zero
            text: 0, since index 0 is the start either way
          - id: one
            text: 1, since a single jump of 2 reaches the end
        correct: two
        explanation: >-
          From index 0 the end takes 2 jumps, 0 to 2 to 5, so a table of jumps to the end would
          hold 2 there. `hops[0]` is 0 because it counts the jumps taken to get to index 0, which is
          none, so the entries count from the start.
      sources:
        prompt: Indices 0 and 1 can both jump to index 2, yet `hops[2]` is 1. Why?
        options:
          - id: min-not-tally
            text: Each write keeps the fewest, not a tally
          - id: cannot-reach
            text: Index 1 cannot jump as far as index 2
          - id: skipped
            text: The second write to index 2 is skipped
        correct: min-not-tally
        explanation: >-
          Each write is `min(hops[j], hops[i] + 1)`. Index 1 offers `hops[1] + 1`, which is 2, and
          `min` keeps the 1 offered from index 0. The entry is a smallest number of jumps.
      farthest:
        prompt: "`hops[1]` is 1. Is index 1 the farthest one jump from index 0 reaches?"
        options:
          - id: no-two
            text: No. Index 2 is, since `reach[0]` is 2
          - id: yes-limit
            text: Yes, since a jump of 2 is not allowed
          - id: yes-first
            text: Yes, since index 1 is reached first
        correct: no-two
        explanation: >-
          `reach[0]` is 2, so index 0 reaches indices 1 and 2. `hops[j]` describes index `j`,
          not a number of jumps: the table is indexed by where you land, and each entry stores how
          many jumps it takes to get there.

  - id: lost-start-order-review
    heading: What does it return?
    tags: [dp, python]
    prompt: |-
      ```python
      def count(n):     # orders of 1-steps and 4-steps that reach step n
          ways = [0] * (n + 1)
          ways[0] = 0
          ways[1] = 1
          for i in range(2, n + 1):
              ways[i] = ways[i - 1] + (ways[i - 4] if i >= 4 else 0)
          return ways[n]
      ```

      There are 3 orders that reach step 5: `1+1+1+1+1`, `1+4` and `4+1`. What does `count(5)`
      return?
    options:
      - id: two-lost-four-one
        text: 2, and the order lost is `4+1`
        explanation: >-
          `ways[4]` adds `ways[0]` for an order whose last move is a 4-step from step 0. With
          `ways[0] = 0` the order `4` is lost, so `ways[4]` is 1. `ways[5] = ways[4] + ways[1]` is
          then 2, and the missing order is `4+1`. Setting `ways[0] = 1` gives 3.
      - id: three
        text: 3, since `ways[1] = 1` already covers the empty start
        explanation: >-
          A 4-step from step 0 reads `ways[0]`, not `ways[1]`. That entry is 0 here, so the order
          `4` is lost, and so is every order that starts with it.
      - id: two-lost-one-four
        text: 2, and the order lost is `1+4`
        explanation: >-
          `1+4` ends with a 4-step from step 1, so it reads `ways[1]`, which is 1. It is counted.
          The order that reads the 0 in `ways[0]` is the one that starts with a 4.
      - id: one
        text: 1, since only `1+1+1+1+1` is counted
        explanation: >-
          `ways[5] = ways[4] + ways[1]`, and both are 1 here. `1+4` is counted through `ways[1]`.
    correct: two-lost-four-one
    followUps:
      three:
        prompt: Which entry does a 4-step from step 0 to step 4 read?
        options:
          - id: zero
            text: "`ways[0]`, which is 0 here"
          - id: one
            text: "`ways[1]`, the seed set to 1"
          - id: three
            text: "`ways[3]`, the step just below"
        correct: zero
        explanation: >-
          The predecessor of a 4-step into step 4 is step 0, and `ways[0]` is 0 here, so that order
          adds nothing. The empty order that stands on step 0 has to count as 1, or every order that
          starts with a 4-step is dropped.
      two-lost-one-four:
        prompt: The order `1+4` ends with a 4-step from step 1. Which entry counts its start?
        options:
          - id: one
            text: "`ways[1]`, which is 1, so `1+4` is counted"
          - id: zero
            text: "`ways[0]`, which is 0, so `1+4` is lost"
          - id: four
            text: "`ways[4]`, which is 1"
        correct: one
        explanation: >-
          The 4-step into step 5 starts on step 1, so it reads `ways[1]`. The order lost is the one
          whose 4-step starts on step 0, which is `4+1`.
      one:
        prompt: "`ways[5] = ways[4] + ways[1]`. What do those two entries hold here?"
        options:
          - id: one-one
            text: 1 and 1, so the call returns 2
          - id: one-zero
            text: 1 and 0, so the call returns 1
          - id: zero-one
            text: 0 and 1, so the call returns 1
        correct: one-one
        explanation: >-
          `ways[1]` is set to 1, and `ways[4]` is `ways[3] + ways[0]`, which is 1 + 0. Only the
          orders that pass through the 0 in `ways[0]` are lost.

  - id: open-water-zero-review
    format: tap-cell
    heading: Tap the first wrong count
    tags: [dp, python]
    prompt: >-
      A frog starts on pad 0 and hops 1 or 3 places forward. `pads[i]` is False over open water.
      `f[i]` should be the fewest hops to land on place `i`, or `inf` when it cannot. This code
      marks open water with 0. Tap the first pad the frog can stand on whose count comes out
      wrong.
    code: |
      inf = float('inf')
      pads = [True, False, False, True, True, False, True, True]
      f = [inf] * len(pads)
      f[0] = 0
      for i in range(1, len(pads)):
          if not pads[i]:
              f[i] = 0        # nothing to do on open water
              continue
          for h in (1, 3):
              if i >= h:
                  f[i] = min(f[i], 1 + f[i - h])
      print(f)   # [0, 0, 0, 1, 1, 0, 1, 2]
    sequence: { kind: array, name: pads, cells: ['True', 'False', 'False', 'True', 'True', 'False', 'True', 'True'] }
    correct: 4
    explanation: >-
      Pad 4 is reached from pad 3 (1 hop so far) or from place 1, which is water. The 0 stored for
      place 1 makes `1 + f[1]` equal 1, so `f[4]` is 1. The real count is 2, 0 to 3 to 4. Open
      water needs `inf`, which `min` never prefers.
    misses:
      - index: 0
        explanation: Pad 0 is the start, and 0 hops is right.
      - index: 1
        explanation: >-
          Place 1 is open water. Its 0 is the cause, but the frog cannot stand there, and the
          question asks for a pad.
      - index: 2
        explanation: Place 2 is open water, so the frog cannot stand there.
      - index: 3
        explanation: >-
          `f[3]` is 1, from pad 0 with one 3-hop. Place 2 offers 1 + 0 as well, so the count
          happens to be right.
      - index: 5
        explanation: Place 5 is open water, so the frog cannot stand there.
      - index: 6
        explanation: >-
          `f[6]` is 1 here, and it is wrong too (the real count is 2, 0 to 3 to 6), but pad 4 went
          wrong first.
      - index: 7
        explanation: >-
          `f[7]` is 2 here while the real count is 3, but pad 4 went wrong first.

  - id: songs-minus-inf-review
    heading: Which setup is right?
    tags: [dp, python]
    prompt: |-
      Songs last 4 or 7 minutes. `most[i]` is the largest number of songs that fill exactly `i`
      minutes, or `-inf` when no playlist fills them. Here `inf` is `float('inf')`.

      ```python
      def most_songs(n):
          # setup goes here
          for i in range(1, n + 1):
              for p in (4, 7):
                  if p <= i:
                      most[i] = max(most[i], 1 + most[i - p])
          return most[n]
      ```

      Which setup is right?
    options:
      - id: minus-inf
        text: "`most = [-inf] * (n + 1)`, then `most[0] = 0`"
        explanation: >-
          `-inf` loses every `max` and stays `-inf` after adding 1, so impossible lengths stay
          marked. No playlist fills 13 minutes, and `most_songs(13)` returns `-inf`.
          `most_songs(18)` returns 3, for 4 + 7 + 7.
      - id: minus-one
        text: "`most = [-1] * (n + 1)`, then `most[0] = 0`"
        explanation: >-
          -1 is too close to a real count. `most[5]` becomes 1 + -1, which is 0, and reads like an
          empty playlist. `most_songs(13)` returns 2, though no playlist fills 13 minutes.
      - id: zeros
        text: "`most = [0] * (n + 1)`"
        explanation: >-
          Every impossible length looks like a playlist of 0 songs, and the songs built on it
          count. `most_songs(13)` returns 3.
      - id: nones
        text: "`most = [None] * (n + 1)`, then `most[0] = 0`"
        explanation: >-
          `max` cannot compare `None` with a number. The first time a song fits, at 4 minutes,
          `max(None, 1)` raises `TypeError` in Python 3.
    correct: minus-inf
    followUps:
      minus-one:
        prompt: With -1 for impossible, what does `most[5]` become, and what does that look like?
        options:
          - id: zero
            text: 0, which looks like a playlist of no songs
          - id: minus-one
            text: -1, so 5 minutes stays marked impossible
          - id: minus-two
            text: -2, since 1 is subtracted from the marker
        correct: zero
        explanation: >-
          `most[5]` is 1 + `most[1]`, which is 1 + -1, or 0. Adding 1 to the marker turns it into a
          real-looking count. The marker must survive the `+ 1` and lose every `max`, and only
          `-inf` does both.
      zeros:
        prompt: Five minutes cannot be filled. What does `most[5]` hold when the table starts at 0?
        options:
          - id: one
            text: 1, from 1 + `most[1]`, as if one song filled it
          - id: zero
            text: 0, which is right, since no song fits
          - id: minus-inf
            text: "`-inf`, since the loop marks it impossible"
        correct: one
        explanation: >-
          A 4-minute song fits in 5, and the 1 minute left holds 0, which looks like a finished
          playlist. The loop only builds on what the setup stored.
      nones:
        prompt: What does `max(None, 1)` do in Python 3?
        options:
          - id: type-error
            text: It raises `TypeError`, since `None` and `int` cannot be compared
          - id: returns-one
            text: It returns 1, since `None` counts as the smallest value
          - id: returns-none
            text: It returns `None`
        correct: type-error
        explanation: >-
          Python 3 does not order `None` against numbers, so the comparison inside `max` fails. An
          impossible marker has to be a number that loses every comparison.

  - id: word-break-drag-review
    format: drag-pointers
    heading: Drag each pointer to the entry it reads
    tags: [dp]
    prompt: >-
      `s = 'seaside'` and `words = ['sea', 'side', 'aside', 'e']`. `ok[i]` is True when the first
      `i` letters split into words. To fill `ok[7]`, each word that matches the end of `s` reads
      the entry where that word would start. Drag each pointer, named after its word, to the
      entry it reads.
    code: |
      ok = [False] * (len(s) + 1)
      ok[0] = True
      for i in range(1, len(s) + 1):
          for w in words:
              if i >= len(w) and ok[i - len(w)] and s[i - len(w):i] == w:
                  ok[i] = True
      # ok is [True, False, False, True, False, False, False, True]
    sequence: { kind: array, name: ok, cells: ['True', 'False', 'False', 'True', 'False', 'False', 'False', 'True'] }
    pointers:
      - name: side
        start: 7
        correct: 3
        explanation: >-
          `side` has 4 letters, so it starts at 7 - 4, which is 3. `ok[3]` is True (`sea`), so
          `ok[7]` is True: `sea` + `side`.
        misses:
          - index: 4
            explanation: That is where a 3-letter word would start. `side` has 4 letters.
          - index: 7
            explanation: "`ok[7]` is the entry being filled. The word reads the entry where it starts."
        elsewhere: "`side` takes the last 4 letters, so it reads `ok[7 - 4]`."
      - name: aside
        start: 7
        correct: 2
        explanation: >-
          `aside` has 5 letters, so it starts at 7 - 5, which is 2. `ok[2]` is False, since `se`
          does not split, so this word adds nothing.
        misses:
          - index: 3
            explanation: That is where `side` starts. `aside` is one letter longer.
          - index: 7
            explanation: "`ok[7]` is the entry being filled. The word reads the entry where it starts."
        elsewhere: "`aside` takes the last 5 letters, so it reads `ok[7 - 5]`."
      - name: e
        start: 7
        correct: 6
        explanation: >-
          `e` has 1 letter, so it reads `ok[6]`. That is False, since `seasid` does not split.
        misses:
          - index: 7
            explanation: >-
              `ok[7]` is the entry being filled. A 1-letter word reads the entry one place
              before it.
        elsewhere: "`e` takes only the last letter, so it reads `ok[7 - 1]`."

  - id: stamp-offsets-review
    heading: Which line fills the table?
    tags: [dp]
    prompt: >-
      Stamps worth 2 and 5 cents are stuck in a row, and different orders count as different rows.
      `ways[i]` is the number of rows worth exactly `i` cents, with `ways[0] = 1`, and any index
      below 0 reads as 0. Which line fills `ways[i]`?
    options:
      - id: two-five
        text: "`ways[i] = ways[i - 2] + ways[i - 5]`"
        explanation: >-
          The last stamp is a 2 or a 5, so the rest of the row is worth `i - 2` or `i - 5`. Each
          row falls in exactly one case, so the counts add. The table for 0 to 9 is 1, 0, 1, 0, 1,
          1, 1, 2, 1, 3. `ways[7]` is 2: `2+5` and `5+2`.
      - id: one-two
        text: "`ways[i] = ways[i - 1] + ways[i - 2]`"
        explanation: >-
          There is no 1-cent stamp. This counts rows of 1s and 2s, and `ways[3]` comes out as 3,
          though no row of 2s and 5s is worth 3 cents.
      - id: two-three
        text: "`ways[i] = ways[i - 2] + ways[i - 3]`"
        explanation: >-
          A 5-cent stamp steps back 5 cents, not 3. With `i - 3`, `ways[3]` becomes 1, though 3
          cents cannot be made from 2s and 5s.
      - id: product
        text: "`ways[i] = ways[i - 2] * ways[i - 5]`"
        explanation: >-
          The last stamp is a 2 or a 5, never both, so the cases add. The product is 0 whenever
          one case is empty: `ways[2]` becomes 1 × 0, which is 0, though a single 2 is a row.
    correct: two-five
    followUps:
      one-two:
        prompt: When the last stamp is a 5, how much is the rest of the row worth?
        options:
          - id: minus-five
            text: "`i - 5`, the stamp's own value back"
          - id: minus-one
            text: "`i - 1`, one cent back each time"
          - id: minus-two
            text: "`i - 2`, back to the next stamp down"
        correct: minus-five
        explanation: >-
          Removing the last stamp leaves the row before it, worth `i` minus that stamp. Each stamp
          value is one predecessor, so 2 and 5 give `i - 2` and `i - 5`.
      two-three:
        prompt: Is a 5-cent stamp the same as a 2-cent stamp followed by a 3?
        options:
          - id: no
            text: No. There is no 3-cent stamp to follow it
          - id: yes
            text: Yes, since 2 + 3 makes the same 5 cents
          - id: yes-unordered
            text: Yes, when the order of stamps does not matter
        correct: no
        explanation: >-
          `ways[i - 3]` counts real rows worth `i - 3`, but finishing one of them takes a 3-cent
          stamp, and there is none. Rows use only 2s and 5s, so each predecessor comes from a stamp
          that exists: a 5 steps back exactly 5 cents.
      product:
        prompt: Each row's last stamp is a 2 or a 5. How do the two cases combine?
        options:
          - id: add
            text: They add, since every row is in exactly one case
          - id: multiply
            text: They multiply, since both choices are made
          - id: larger
            text: Take the larger, since only one case is used
        correct: add
        explanation: >-
          Add when each outcome falls in exactly one of several cases. Multiply when independent
          choices are made one after another. A row has one last stamp, so the cases add.

  - id: decode-pieces-review
    heading: Which entries does it add?
    tags: [dp]
    prompt: |-
      ```python
      def count_reads(s):
          ways = [0] * (len(s) + 1)
          ways[0] = 1
          for i in range(1, len(s) + 1):
              if s[i - 1] != '0':                  # last piece: one digit
                  ways[i] += ways[i - 1]
              if i >= 2 and 10 <= int(s[i - 2:i]) <= 26:
                  ways[i] += ways[i - 2]           # last piece: two digits
          return ways[len(s)]
      ```

      Digits `1` to `26` stand for letters. For `s = '2627'`, `ways[3]` is 2 (`2 6 2` and `26 2`).
      Which entries does `ways[4]` add?
    options:
      - id: only-three
        text: Only `ways[3]`, since `7` is a letter and `27` is not
        explanation: >-
          The last digit, 7, is a letter, so the one-digit case adds `ways[3]`. The last two
          digits, 27, are above 26, so the two-digit case adds nothing. `ways[4]` is 2: `2 6 2 7`
          and `26 2 7`.
      - id: both
        text: "`ways[3]` and `ways[2]`, since `7` and `27` are both pieces"
        explanation: >-
          27 is past 26, so it is not a letter, and the two-digit case is skipped. Adding
          `ways[2]` would give 4.
      - id: only-two
        text: Only `ways[2]`, since a digit after a `2` always pairs with it
        explanation: >-
          A single 7 is a letter, so the one-digit case counts. Whether a pair is a letter depends
          on its value, and 27 is too large.
      - id: neither
        text: Neither, since `27` is not a letter and ends no reading
        explanation: >-
          The 7 can still be read on its own. Only the two-digit piece is ruled out.
    correct: only-three
    followUps:
      both:
        prompt: Which two-digit numbers stand for letters?
        options:
          - id: ten-to-26
            text: 10 to 26, so 27 is not one
          - id: ten-to-27
            text: 10 to 27
          - id: any-pair
            text: Any two digits that do not start with 0
        correct: ten-to-26
        explanation: >-
          Only 26 letters exist, and a pair cannot start with 0. Each possible last piece must be a
