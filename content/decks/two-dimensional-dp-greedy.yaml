        options:
          - id: sum-falls
            text: "`i + j` falls every step, so no cell repeats and there are at most m + n steps"
          - id: can-return
            text: The walk can return to a cell it left, so it may take up to m·n steps
          - id: both-fall
            text: Both `i` and `j` fall in every step, so the walk takes at most min(m, n) steps in all
        correct: sum-falls
        explanation: >-
          An up move lowers only `i` and a left move lowers only `j`, so one of them can stay fixed
          for many steps. The sum still falls every time, which rules out revisits and caps the walk
