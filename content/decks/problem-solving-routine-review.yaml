id: problem-solving-routine-review
title: "Problem-solving routine: review"
description: Fresh inputs for the Problem-solving routine skills, for recall on later days. No worked examples this time.
heading: What must it return?

questions:
  - id: two-sum-indices-review
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return the indices i < j of the two numbers in nums
      # that add up to target. Exactly one pair does.
      def two_sum(nums, target): ...
      ```

      What must `two_sum([5, 12, 3, 7], 10)` return?
    options:
      - id: indices
        text: "`[2, 3]`"
        explanation: >-
          3 + 7 = 10, and no other pair adds up to 10. The 3 sits at index 2 and the 7 at index 3,
          so the answer is `[2, 3]`.
      - id: values
        text: "`[3, 7]`"
        explanation: >-
          3 and 7 are the right pair, but the statement asks for indices, not the numbers
          themselves.
      - id: sorted-indices
        text: "`[0, 2]`"
        explanation: >-
          These are positions in the sorted copy `[3, 5, 7, 12]`. In the caller's list, index 0
          holds a different number.
      - id: one-based
        text: "`[3, 4]`"
        explanation: >-
          This counts from 1. A four-item list has indices 0 to 3, so there is no index 4 to
          return.
    correct: indices
    followUps:
      values:
        prompt: For the pair 3 and 7 in `[5, 12, 3, 7]`, what does "return the indices" ask for?
        options:
          - id: positions
            text: The positions of 3 and 7 in `nums`
          - id: numbers
            text: The numbers 3 and 7
          - id: sum
            text: Their sum, 10
        correct: positions
        explanation: >-
          An index is a position in the list. The same pair gives a different output depending on
          whether the statement asks for values or indices.
      sorted-indices:
        prompt: What sits at index 0 of the original `[5, 12, 3, 7]`?
        options:
          - id: five
            text: 5, not the 3
          - id: three
            text: 3, the smallest value
          - id: twelve
            text: 12, the largest value
        correct: five
        explanation: >-
          Sorting builds a new order. The caller reads the original list, so an index has to point
          into that list.
      one-based:
        prompt: Which index reads the last item of a four-item list?
        options:
          - id: len-minus-one
            text: "`len(nums) - 1`, which is 3"
          - id: len
            text: "`len(nums)`, which is 4"
          - id: one-less
            text: "`len(nums) - 2`, which is 2"
        correct: len-minus-one
        explanation: >-
          Indices run from 0 to one less than the length. The 7 is the last item, so it sits at
          index 3.

  - id: unique-values-review
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return the values that appear exactly once,
      # in their original order.
      def singles(nums): ...
      ```

      What must `singles([7, 3, 7, 5, 3, 9])` return?
    options:
      - id: right
        text: "`[5, 9]`"
        explanation: >-
          7 and 3 each appear twice. Only 5 and 9 appear exactly once, and 5 comes first.
      - id: distinct
        text: "`[7, 3, 5, 9]`"
        explanation: >-
          This is every distinct value, which also keeps the values that repeat. The statement
          asks only for the values with a single copy.
      - id: indices
        text: "`[3, 5]`"
        explanation: >-
          These are the indices of 5 and 9. The statement asks for the values.
      - id: count
        text: "`2`"
        explanation: >-
          Two values qualify, but the statement asks which ones, not how many.
    correct: right
    followUps:
      distinct:
        prompt: 7 appears twice in the input. Does it belong in the output?
        options:
          - id: left-out
            text: No, it does not appear exactly once
          - id: once
            text: Yes, once, like every distinct value
          - id: twice
            text: Yes, twice
        correct: left-out
        explanation: >-
          "Exactly once" leaves out every value with a second copy. Removing duplicates is a
          different task.
      indices:
        prompt: 5 sits at index 3 of the input. What goes in the output for it?
        options:
          - id: value
            text: 5, the value
          - id: index
            text: 3, its index
          - id: both
            text: Both, as a pair
        correct: value
        explanation: >-
          The statement says it returns values. Here the indices are small numbers too, so an
          output of indices can look plausible.
      count:
        prompt: The statement says "return the values". What kind of output is that?
        options:
          - id: list
            text: A list of values
          - id: number
            text: A single number
          - id: flag
            text: "`True` or `False`"
        correct: list
        explanation: >-
          A count answers "how many". This statement asks "which ones", so the output lists them.

  - format: tap-cell
    id: second-largest-index-review
    tags: [python, arrays-strings]
    prompt: Tap the cell whose index `second_index` must return.
    code: |
      # Return the index, in nums, of the
      # second-largest value. The values
      # are distinct.
      def second_index(nums): ...

      second_index([8, 15, 11, 4, 6])
    sequence:
      kind: array
      name: nums
      cells: [8, 15, 11, 4, 6]
    correct: 2
    explanation: >-
      From the top, the values are 15, then 11. The 11 sits at index 2, so the function returns 2.
    misses:
      - index: 0
        explanation: 8 is the third largest. 15 and 11 are both bigger.
      - index: 1
        explanation: >-
          15 is the largest. The second-largest is the biggest value once 15 is set aside.
      - index: 3
        explanation: >-
          4 is the smallest value. Index 3 is the second cell from the end, which is a position,
          not a rank by size.
      - index: 4
        explanation: 6 is the second smallest. "Second-largest" counts down from the top.

  - id: zero-start-min-review
    heading: Which test exposes the bug?
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return the smallest value in a non-empty list.
      def smallest(nums):
          best = 0
          for x in nums:
              if x < best:
                  best = x
          return best
      ```

      Which test shows that this code is wrong?
    options:
      - id: positives
        text: "`[4, 9]`"
        explanation: >-
          The right answer is 4. Neither value is below the starting 0, so `best` stays 0 and the
          call returns a value that is not in the list.
      - id: has-negative
        text: "`[-5, 2]`"
        explanation: >-
          -5 is below 0, so `best` becomes -5 and the call returns -5, which is right.
      - id: has-zero
        text: "`[0, 3]`"
        explanation: >-
          The smallest value really is 0, so the starting 0 happens to be right.
      - id: repeat
        text: "`[-1, -1]`"
        explanation: >-
          The first -1 is below 0, and the second changes nothing. The call returns -1, which is
          right.
    correct: positives
    followUps:
      has-negative:
        prompt: For `best = 0` to give the wrong minimum, what must the input lack?
        options:
          - id: zero-or-less
            text: Any value of 0 or less
          - id: repeat
            text: A repeated value
          - id: positive
            text: A positive value
        correct: zero-or-less
        explanation: >-
          The starting 0 survives only if no value is below it. When the list holds 0 or a
          negative, the true minimum is at most 0 and the code finds it.
      has-zero:
        prompt: "`smallest([0, 3])` returns 0. Is that answer wrong?"
        options:
          - id: right
            text: No, 0 is the true minimum here
          - id: wrong
            text: Yes, 0 came from the starting value
          - id: skipped
            text: Yes, the 3 is never read
        correct: right
        explanation: >-
          A test fails only when the output differs from the right answer. Here the starting value
          and the true minimum are both 0, so the bug stays hidden.
      repeat:
        prompt: After the first item of `[-1, -1]`, what is `best`?
        options:
          - id: minus-one
            text: Minus one, the first item
          - id: zero
            text: Zero, the starting value
          - id: minus-two
            text: Minus two, the sum so far
        correct: minus-one
        explanation: >-
          -1 is below 0, so `best` takes it. A repeat matters only to code that treats equal values
          differently, and this bug is about the starting value.

  - id: first-or-last-review
    heading: Which test separates them?
    tags: [python, arrays-strings]
    prompt: |-
      Both functions try to return the index of the first `target` in `nums`, or -1:

      ```python
      def find_first(nums, target):
          for i, x in enumerate(nums):
              if x == target:
                  return i
          return -1

      def find_last(nums, target):
          ans = -1
          for i, x in enumerate(nums):
              if x == target:
                  ans = i
          return ans
      ```

      Which test gives different answers from the two?
    options:
      - id: repeated-target
        text: "`nums = [5, 3, 5]`, `target = 5`"
        explanation: >-
          `find_first` stops at index 0. `find_last` keeps going and overwrites `ans` at index 2.
          The target has to appear more than once for the two to differ.
      - id: single-target
        text: "`nums = [5, 3, 5]`, `target = 3`"
        explanation: >-
          The list has a repeat, but 3 is not the repeated value. Both return 1.
      - id: empty
        text: "`nums = []`, `target = 5`"
        explanation: >-
          Neither loop runs. `find_first` reaches `return -1`, and `ans` was never changed from -1.
      - id: last-cell
        text: "`nums = [3, 5]`, `target = 5`"
        explanation: >-
          5 appears once, at index 1, so both return 1.
    correct: repeated-target
    followUps:
      single-target:
        prompt: When do `find_first` and `find_last` return different indices?
        options:
          - id: target-repeats
            text: When the target appears more than once
          - id: any-repeat
            text: When the list has any repeated value
          - id: missing
            text: When the target is not in the list
        correct: target-repeats
        explanation: >-
          Only matches of the target move `ans`. A repeat of some other value changes nothing for
          either function.
      empty:
        prompt: What does `find_last([], 5)` return?
        options:
          - id: start
            text: -1, its starting `ans`
          - id: none
            text: "`None`"
          - id: error
            text: It raises `IndexError`
        correct: start
        explanation: >-
          With no items, the loop body never runs and `ans` keeps its first value. Both functions
          agree on an empty list.
      last-cell:
        prompt: In `[3, 5]`, how many times does 5 appear?
        options:
          - id: once
            text: Once, so first and last are the same index
          - id: twice
            text: Twice, counting its index
          - id: none
            text: None, because it is the last item
        correct: once
        explanation: >-
          With a single match, the first match is also the last one. A separating test needs at
          least two copies of the target.

  - id: empty-run-review
    heading: Which test exposes the bug?
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return the length of the longest run of equal
      # values in a row. One value alone is a run of 1.
      # Return 0 for an empty list.
      def longest_run(nums):
          best = run = 1
          for i in range(1, len(nums)):
              if nums[i] == nums[i - 1]:
                  run += 1
              else:
                  run = 1
              best = max(best, run)
          return best
      ```

      Which test shows that this code is wrong?
    options:
      - id: empty
        text: "`[]`"
        explanation: >-
          The statement promises 0, but `best` starts at 1 and the loop never runs, so the call
          returns 1.
      - id: single
        text: "`[7]`"
        explanation: >-
          One value is a run of length 1, and the call returns 1, which is right.
      - id: all-equal
        text: "`[8, 8, 8]`"
        explanation: >-
          Each step extends the run and `best` keeps up, so the call returns the length of the whole
          list, which is right.
      - id: ends-in-run
        text: "`[6, 9, 9]`"
        explanation: >-
          A run at the very end is lost by code that updates `best` only when a run breaks. This
          code updates it on every pass, so the call returns 2, which is right.
    correct: empty
    followUps:
      single:
        prompt: What is the right answer for `[7]`?
        options:
          - id: one
            text: 1, a run of one value
          - id: zero
            text: 0, since nothing repeats
          - id: seven
            text: 7, the value itself
        correct: one
        explanation: >-
          A single value is a run by itself. The code starts `best` at 1, which is right for every
          non-empty list and wrong only for an empty one.
      all-equal:
        prompt: On `[8, 8, 8]`, what is `run` after the pass with `i = 2`?
        options:
          - id: never
            text: '3'
          - id: all-equal
            text: '2'
          - id: negatives
            text: '4'
        correct: never
        explanation: >-
          `run` starts at 1, and each value equal to its left neighbour adds 1, so the passes with
          `i = 1` and `i = 2` take it to 2 and then 3. `best` follows `run` on every pass, so the
          call returns 3, which is right.
      ends-in-run:
        prompt: When does `best = max(best, run)` run?
        options:
          - id: every-pass
            text: On every pass of the loop
          - id: run-ends
            text: Only when a run ends
          - id: after
            text: Only after the loop
        correct: every-pass
        explanation: >-
          The line sits after the `if`/`else`, at loop level, so it runs whichever branch was
          taken. A run that is still going at the end has already been counted.

  - format: step-trace
    id: trace-repeat-pair-review
    heading: Trace the brute force
    tags: [python, arrays-strings]
    prompt: >-
      The function returns the first pair (i, j), in loop order, whose values are equal. Trace
      `first_repeat([3, 8, 5, 5, 8])` and predict each step before it is shown.
    code: |
      def first_repeat(nums):
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  if nums[i] == nums[j]:
                      return i, j
          return None

      first_repeat([3, 8, 5, 5, 8])
    sequence:
      kind: array
      name: nums
      cells: [3, 8, 5, 5, 8]
    start:
      - { name: i, at: 0 }
      - { name: j, at: 4 }
    steps:
      - line: 2
        ask: No value matches the 3, so `i` moves to 1. Where does `j` start?
        pointer: j
        correct: 2
        explanation: '`j` starts at `i + 1`, one cell after `i`, which is index 2.'
        misses:
          - index: 1
            explanation: >-
              On `i` itself, `j` would compare the 8 with itself and report a repeat that is not
              there. The range starts one cell later.
          - index: 0
            explanation: The pairs with index 0 are done. `j` never starts left of `i`.
          - index: 4
            explanation: '`j` restarts for each new `i`. It does not stay where the last pass ended.'
        elsewhere: '`j` starts at `i + 1`, which is index 2.'
        also:
          - { name: i, at: 1 }
      - line: 4
        ask: Where is `j` when the call returns?
        pointer: j
        correct: 4
        explanation: >-
          With `i` on the 8 at index 1, `j` reads 5, then 5, then 8. The 8 at index 4 matches, so
          the call returns `(1, 4)`.
        misses:
          - index: 3
            explanation: >-
              The 5s at indices 2 and 3 are equal, but `i` is on the 8. The loop finishes the pass
              for `i = 1` first, and the 8 at index 4 matches it.
          - index: 2
            explanation: 5 is not 8, so the test fails and `j` moves on.
        elsewhere: '`j` stops on the 8 at index 4, the copy of `nums[1]`.'
      - line: 5
        ask: How many pairs did the call test, counting the match?
        options:
          - id: seven
            text: '7'
            explanation: >-
              Four tests with `i` at 0 and three with `i` at 1, the last of which matches.
          - id: three
            text: '3'
            explanation: >-
              That counts only the tests with `i` at 1. The four tests with `i` at 0 ran first.
          - id: ten
            text: '10'
            explanation: >-
              10 is every pair of a five-item list. The call returns at its first match, so pairs
              such as (2, 3) are never tested.
        correct: seven

  - id: count-down-pairs-review
    heading: Trace the brute force
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      def count_down_pairs(nums):
          count = 0
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  if nums[i] > nums[j]:
                      count += 1
          return count

      print(count_down_pairs([4, 1, 3, 2]))
      ```

      What does this print?
    options:
      - id: four
        text: "`4`"
        explanation: >-
          The 4 is larger than all three values after it, and the 3 is larger than the 2 after it.
          No other earlier value is larger than a later one.
      - id: neighbours
        text: "`2`"
        explanation: >-
          Only the neighbouring pairs (4, 1) and (3, 2) give 2. The inner loop runs to the end of
          the list, so the 4 is also compared with the 3 and the 2.
      - id: every-pair
        text: "`6`"
        explanation: >-
          A four-item list has 6 pairs, but only the ones where the earlier value is larger are
          counted.
    correct: four
    followUps:
      neighbours:
        prompt: With `i` at 0, which values does `j` compare against the 4?
        options:
          - id: all-later
            text: 1, 3 and 2, every value after it
          - id: neighbour
            text: Only 1, its neighbour
          - id: last
            text: Only 2, the last value
        correct: all-later
        explanation: >-
          `range(i + 1, len(nums))` runs to the end of the list. The brute force checks every pair,
          not just neighbours.
      every-pair:
        prompt: Is the pair 1 and 3, at indices 1 and 2, counted?
        options:
          - id: not-counted
            text: No, the earlier value is the smaller one
          - id: yes-all
            text: Yes, every pair is counted
          - id: yes-larger
            text: Yes, because 3 is larger than 1
        correct: not-counted
        explanation: >-
          The test is `nums[i] > nums[j]` with `i` before `j`. 1 > 3 is false, so that pair adds
          nothing.

  - format: tap-cell
    id: most-larger-later-review
    heading: Trace the brute force
    tags: [python, arrays-strings]
    prompt: >-
      For each index, this brute force counts the later values that are larger, and returns the
      index with the highest count, the first one on a tie. Tap the cell whose index it returns.
    code: |
      def most_larger_later(nums):
          best_i, best_count = 0, -1
          for i in range(len(nums)):
              count = 0
              for j in range(i + 1, len(nums)):
                  if nums[j] > nums[i]:
                      count += 1
              if count > best_count:
                  best_i, best_count = i, count
          return best_i

      most_larger_later([5, 1, 4, 2, 6])
    sequence:
      kind: array
      name: nums
      cells: [5, 1, 4, 2, 6]
    correct: 1
    explanation: >-
      The 1 is followed by 4, 2 and 6, all larger, for a count of 3. Every other index has a count
      of at most 1, so the call returns 1.
    misses:
      - index: 0
        explanation: Only the 6 after the 5 is larger, a count of 1.
      - index: 2
        explanation: After the 4 come 2 and 6, and only the 6 is larger, a count of 1.
      - index: 3
        explanation: Only the 6 comes after the 2, a count of 1.
      - index: 4
        explanation: >-
          6 is the largest value, but nothing comes after it, so its count is 0. The function
          counts larger values to the right, not how big the value itself is.

  - format: drag-pointers
    id: closest-pair-review
    heading: Trace the brute force
    tags: [python, arrays-strings]
    prompt: Run `closest([20, 6, 13, 27, 10])`. Drag `i` and `j` to the pair it returns.
    code: |
      def closest(nums):
          best = None
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  gap = abs(nums[i] - nums[j])
                  if best is None or gap < best[0]:
                      best = (gap, i, j)
          return best[1], best[2]

      closest([20, 6, 13, 27, 10])
    sequence:
      kind: array
      name: nums
      cells: [20, 6, 13, 27, 10]
    pointers:
      - name: i
        start: 0
        correct: 2
        explanation: >-
          13 and 10 are 3 apart, the smallest gap of any pair. The 13 is the earlier of the two, at
          index 2.
        misses:
          - index: 1
            explanation: 6 and 10 are 4 apart, the second smallest gap. 13 and 10 are closer.
          - index: 0
            explanation: The 20 is at least 7 away from every other value.
        elsewhere: The closest pair is 13 and 10, and the 13 sits at index 2.
      - name: j
        start: 1
        correct: 4
        explanation: '10, at index 4, is 3 away from 13. No other pair is that close.'
        misses:
          - index: 1
            explanation: >-
              (0, 1) is only the first pair tested. Its gap of 14 is replaced by smaller gaps
              later.
          - index: 2
            explanation: >-
              13 belongs to the closest pair, but as the earlier cell. `j` is always right of `i`,
              so it is on the 10.
          - index: 3
            explanation: 27 is 14 away from 13, far from the closest gap.
        elsewhere: '`j` is on the 10 at index 4, 3 away from the 13.'
