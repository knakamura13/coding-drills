id: monotonic-stack-checkpoint
title: "Monotonic stack: checkpoint"
description: Solve next-greater or a window maximum on new inputs, and justify the cost of a whole run. Most items combine two or more of the path's skills.
heading: Solve the next-greater task

questions:
  - id: checkpoint-next-greater-output
    heading: What is the answer?
    tags: [stack]
    prompt: >-
      For each index of `nums`, find the first value to its right that is strictly larger, or -1
      if there is none. For `nums = [3, 7, 7, 2, 5, 1, 8]`, what is the answer?
    options:
      - id: strict
        text: "`[7, 8, 8, 5, 8, 8, -1]`"
        explanation: >-
          The 7 answers the 3. The second 7 does not answer the first, so both 7s wait, along with
          the 5 and the 1. The 8 then answers all four, and nothing answers the 8.
      - id: or-equal
        text: "`[7, 7, 8, 5, 8, 8, -1]`"
        explanation: Check whether an equal value counts as larger.
      - id: one-pop
        text: "`[7, -1, -1, 5, -1, 8, -1]`"
        explanation: Check how many waiting positions the 8 answers.
      - id: largest-right
        text: "`[8, 8, 8, 8, 8, 8, -1]`"
        explanation: Check whether the 3 needs the first larger value or the largest one.
    correct: strict
    followUps:
      or-equal:
        prompt: What is the answer for the first 7, at index 1?
        options:
          - id: eight
            text: 8, since the 7 right after it is equal, not larger
          - id: seven
            text: 7, the next value
          - id: none
            text: -1, since 7 appears twice
        correct: eight
        explanation: >-
          "Strictly larger" rules out an equal value. In a stack pass, `7 < 7` is false, so index 1
          keeps waiting until the 8 pops it.
      one-pop:
        prompt: >-
          When the 8 arrives, the indices still waiting hold 7, 7, 5 and 1. How many of them does
          it answer?
        options:
          - id: all-four
            text: All four, since each is smaller than 8
          - id: top-only
            text: One, the 1 on top
          - id: distinct
            text: Three, one per distinct value
        correct: all-four
        explanation: >-
          The `while` loop keeps popping as long as the top is smaller than the arrival. 1, 5, 7 and
          7 are all smaller than 8, so the 8 answers each of them in one arrival.
      largest-right:
        prompt: What is the answer for the 3 at index 0?
        options:
          - id: seven
            text: 7, the first larger value after it
          - id: eight
            text: 8, the largest value after it
          - id: none
            text: -1, since 3 is not the largest
        correct: seven
        explanation: >-
          The 7 at index 1 is larger and comes first, so it answers the 3 at once. The largest
          value to the right is a different question.

  - id: checkpoint-run-cost
    heading: How much work is the whole run?
    tags: [stack, complexity]
    prompt: |-
      ```python
      nums = [9, 4, 6, 2, 2, 5, 1, 7]
      pops = 0
      stack = []
      for i, x in enumerate(nums):
          while stack and nums[stack[-1]] < x:
              stack.pop()
              pops += 1
          stack.append(i)
      ```

      What is `pops` at the end, and what bounds the total work of this loop on any list of length
      `n`?
    options:
      - id: linear
        text: 6; no index is ever popped twice, so the whole loop is O(n) on any input
        explanation: >-
          The 6 pops index 1, the 5 pops indices 4 and 3, and the 7 pops indices 6, 5 and 2. Indices
          0 and 7 stay. Across any run there are `n` pushes and fewer than `n` pops, so the `while`
          body runs fewer than `n` times in total.
      - id: quadratic
        text: 6, but some inputs need about n²/2 pops, so O(n²) in the worst case
        explanation: Check how many times one index can be popped over the whole run.
      - id: all-popped
        text: 8, one pop per index, so exactly 2n stack operations on every input
        explanation: Check which indices are still on the stack at the end.
      - id: burst
        text: 3, the most one arrival pops, and O(n) since no arrival pops more than 3
        explanation: Check what `pops` counts, and whether one arrival's pops have a fixed limit.
    correct: linear
    followUps:
      quadratic:
        prompt: One arrival can pop many entries. Why can a whole run never make about n²/2 pops?
        options:
          - id: once-each
            text: Each index is popped at most once, so all pops together stay below `n`
          - id: constant
            text: Each arrival pops at most a constant number of entries
          - id: log-size
            text: The stack never holds more than log n entries
        correct: once-each
        explanation: >-
          A pop removes an index for good, and only `n` indices ever enter. A long burst of pops
          clears what earlier arrivals built up, so the same index is never paid for twice.
      all-popped:
        prompt: Which indices are still on the stack after this run?
        options:
          - id: zero-seven
            text: Index 0 and index 7
          - id: empty
            text: No index remains
          - id: last
            text: Only index 7 remains
        correct: zero-seven
        explanation: >-
          A pop needs a larger later value, and the loop does not empty the stack at the end. The 9
          is the largest and the 7 is last, so neither has anything larger after it. They wait to the
          end, and the pops are 8 - 2.
      burst:
        prompt: On `[5, 4, 3, 2, 1, 6]`, how many entries does the final arrival pop?
        options:
          - id: five
            text: 5, every entry waiting
          - id: one
            text: 1, only the top
          - id: three
            text: 3, the same limit as before
        correct: five
        explanation: >-
          One arrival can pop as many entries as are waiting, so no fixed per-arrival limit exists.
          The linear bound counts pops per index instead: each one leaves at most once.

  - format: tap-cell
    id: checkpoint-tap-next-greater
    heading: Which value answers index 0?
    tags: [stack, python]
    prompt: Which cell holds the value that `next_greater` writes into `out[0]`? Tap it.
    code: |
      def next_greater(nums):
          out = [-1] * len(nums)
          stack = []
          for i, x in enumerate(nums):
              while stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = x
              stack.append(i)
          return out

      next_greater([5, 2, 5, 3, 4, 8, 6, 9])
    sequence:
      kind: array
      name: nums
      cells: [5, 2, 5, 3, 4, 8, 6, 9]
    correct: 5
    explanation: >-
      Index 0 waits through the 2, the equal 5, the 3 and the 4, since none is larger. The 8 at
      index 5 is the first larger value, so it pops index 0 and writes 8.
    misses:
      - index: 0
        explanation: Index 0 is the position being answered, not its answer.
      - index: 1
        explanation: 2 is smaller than 5, so index 0 keeps waiting.
      - index: 2
        explanation: >-
          This 5 equals the waiting 5, and `5 < 5` is false, so it does not pop index 0.
      - index: 3
        explanation: 3 is smaller than 5, so index 0 keeps waiting.
      - index: 4
        explanation: 4 is smaller than 5, so index 0 keeps waiting.
      - index: 6
        explanation: >-
          6 is larger than 5, but the 8 at index 5 comes first and has already popped index 0.
      - index: 7
        explanation: 9 is the largest value to the right, not the first larger one.

  - id: checkpoint-distance-output
    heading: What is the answer?
    tags: [stack]
    prompt: >-
      A sensor logs one reading per step. For each reading, find how many steps later a strictly
      higher reading appears, or 0 if none does. For `[2, 5, 5, 1, 3, 6, 4]`, what is the answer?
    options:
      - id: steps
        text: "`[1, 4, 3, 1, 1, 0, 0]`"
        explanation: >-
          The 5 at index 1 waits through the equal 5 until the 6 at index 5, so it gets `5 - 1 = 4`.
          The 6 and the final 4 have no higher reading after them, so they get 0.
      - id: values
        text: "`[5, 6, 6, 3, 6, 0, 0]`"
        explanation: Check whether the task asks for the higher reading or the number of steps.
      - id: or-equal
        text: "`[1, 1, 3, 1, 1, 0, 0]`"
        explanation: Check whether an equal reading counts as higher.
      - id: to-end
        text: "`[1, 4, 3, 1, 1, 2, 1]`"
        explanation: Check what the last two readings should get.
    correct: steps
    followUps:
      values:
        prompt: The 5 at index 1 is answered by the 6 at index 5. What is the answer at index 1?
        options:
          - id: gap
            text: 4, the steps from index 1 to index 5
          - id: reading
            text: 6, the higher reading
          - id: own
            text: 5, its own reading
        correct: gap
        explanation: >-
          The task asks how many steps later, so the answer is a difference of positions,
          `i - j`. The reading that answers it only decides when the pop happens.
      or-equal:
        prompt: Is the 5 at index 2 a strictly higher reading for the 5 at index 1?
        options:
          - id: not-higher
            text: No, an equal reading is not higher, so index 1 waits for the 6
          - id: at-least
            text: Yes, a reading at least as high counts
          - id: adjacent
            text: Yes, since it comes right after
        correct: not-higher
        explanation: >-
          With a strict test, `5 < 5` is false and index 1 stays waiting. The answer for index 1 is
          4, not 1.
      to-end:
        prompt: The 6 at index 5 has no higher reading after it. What is the answer at index 5?
        options:
          - id: zero
            text: 0, the value the task gives for no higher reading
          - id: steps-to-end
            text: 2, the steps to the end of the list
          - id: one-step
            text: 1, the step to the next reading
        correct: zero
        explanation: >-
          A positive number claims a higher reading exists that many steps away. Positions left on
          the stack at the end never met one, so they keep the 0 they started with.

  - id: next-taller-stall
    heading: Which approach is slow?
    tags: [stack, complexity]
    prompt: >-
      A line of `n` market stalls is described by their heights, left to right. For each stall, find
      how many steps to the right the first strictly taller stall is, or 0 if there is none. For
      `[14, 9, 11, 7, 7, 20, 12, 15]` the answer is `[5, 1, 3, 2, 1, 0, 1, 0]`. Which approach gives
      the right answer on every input, but has O(n²) as its tightest worst-case time bound?
    options:
      - id: nested-scan
        text: For each stall, scan to the right until a taller one appears
        explanation: >-
          Each scan stops at the first taller stall, so every answer is right. When heights never
          increase, no scan stops early: the scans read (n - 1) + (n - 2) + ... + 1 stalls, which is
          n(n - 1) / 2 in all, so O(n²). Equal heights do not stop a scan either.
      - id: sort-neighbor
        text: Sort the stalls by height and pair each one with the next taller stall in sorted order
        explanation: >-
          Sorting throws away the left-to-right positions, and the answer depends on them. In
          `[40, 30, 50]` the stall of height 30 is followed in sorted order by the 40, which stands
          to its left, so the distance comes out as -1. The first taller stall to its right is the
          50, one step away.
      - id: suffix-max
        text: Precompute the tallest stall to the right of each stall and measure the distance to it
        explanation: >-
          The tallest stall to the right is not the first taller one. On `[30, 20, 25, 50]` this
          gives `[3, 2, 1, 0]`, because the 20 is matched to the 50 two steps away. The correct
          answer is `[3, 1, 1, 0]`, since the 25 is one step away and already taller than the 20.
      - id: waiting-stack
        text: One left-to-right pass with a stack of stalls that are still waiting for a taller one
        explanation: >-
          This gives the right answer on every input, but its tightest worst-case bound is O(n),
          not O(n²). Each stall is pushed once and leaves the stack at most once.
    correct: nested-scan
    followUps:
      sort-neighbor:
        prompt: What does sorting by height throw away that this problem needs?
        options:
          - id: positions
            text: The order of the stalls along the line
          - id: heights
            text: The heights of the stalls
          - id: comparability
            text: A way to compare two stalls
        correct: positions
        explanation: >-
          The taller stall must stand to the right, and sorting replaces order along the line with
          order by height, so the next taller stall in sorted order may stand to the left. Heights
          are unchanged by sorting and still comparable. What is lost is where each stall stood.
      suffix-max:
        prompt: >-
          On `[30, 20, 25, 50]` the tallest stall to the right of the 20 is the 50, two steps away.
          Why is 2 the wrong answer?
        options:
          - id: nearest-taller
            text: The 25 is nearer and already taller than 20
          - id: ties-only
            text: It is not wrong; only tied heights break it
          - id: wrong-direction
            text: The idea is right but must run right to left
        correct: nearest-taller
        explanation: >-
          The task asks for the first taller stall, and the 25 beats the 20 one step away. "First
          taller" and "tallest" agree only when the first taller stall also happens to be the
          tallest one. Running the same tallest-stall rule from the other side still finds the
          tallest stall, not the nearest.
      waiting-stack:
        prompt: One arrival in the stack pass can pop many waiting stalls. How many pops can a whole pass over `n` stalls make?
        options:
          - id: below-n
            text: Fewer than `n`, because no stall is popped twice
          - id: quadratic
            text: About n²/2, since each arrival can pop every waiting stall
          - id: one-each
            text: Exactly `n`, one per arrival
        correct: below-n
        explanation: >-
          A popped stall never comes back. Only `n` stalls ever enter, and the last one is never
          popped, so all the pops together stay below `n`, however they are spread over the
          arrivals.

  - id: checkpoint-largest-rectangle
    heading: What is the largest area?
    tags: [stack]
    prompt: >-
      Bars of width 1 stand side by side with heights `h`. A rectangle drawn inside them covers
      neighboring bars and is as tall as the shortest bar it covers. The widest one at bar `j`'s
      full height runs from just after the previous strictly shorter bar to just before the next
      strictly shorter bar, or to the edge where there is none. A pass like `next_greater` that pops
      taller tops instead of smaller ones gives every next strictly shorter bar, and the same pass
      run from the right gives every previous one. For `h = [4, 3, 7, 9, 6, 9, 3]`, what is the
      area of the largest rectangle?
    options:
      - id: twenty-four
        text: "24"
        explanation: >-
          The 6 at index 4 has its previous shorter bar at index 1 and its next at index 6, so its
          rectangle spans indices 2 to 5: `6 * 4 = 24`. Each 3 has no strictly shorter bar on
          either side, so it spans all 7 bars for 21, and every other bar gives less.
      - id: eighteen
        text: "18"
        explanation: Check whether the rectangle at a bar can also reach to its left.
      - id: thirty-six
        text: "36"
        explanation: Check whether the shorter bars that stop a rectangle belong to it.
      - id: nine
        text: "9"
        explanation: Check whether a rectangle can cover more than one bar.
    correct: twenty-four
    followUps:
      eighteen:
        prompt: >-
          The 6 at index 4 has a 9 and a 7 to its left, then the 3 at index 1. How far left does a
          rectangle of height 6 that covers index 4 reach?
        options:
          - id: index-two
            text: To index 2, just after the shorter 3
          - id: own-bar
            text: It starts at index 4 and reaches only right
          - id: left-edge
            text: To index 0, the left edge
        correct: index-two
        explanation: >-
          The 7 and the 9 are both at least 6, so the rectangle reaches back over them and stops
          before the 3. With both sides counted, it is 4 bars wide, so its area is 24.
      thirty-six:
        prompt: >-
          A rectangle of height 6 over index 4 stops at the 3 at index 1 and the 3 at index 6. Do
          those two 3s belong to it?
        options:
          - id: inside-only
            text: No, they are shorter than 6, so it covers indices 2 to 5
          - id: both-ends
            text: Yes, the bars that stop it are part of it
          - id: left-end
            text: Only the 3 on the left belongs to it
        correct: inside-only
        explanation: >-
          A rectangle is as tall as the shortest bar it covers. Covering a 3 would cut its height
          to 3, so a rectangle of height 6 stops just inside the shorter bars, 4 bars wide.
      nine:
        prompt: Can a rectangle cover more than one bar?
        options:
          - id: several
            text: Yes, any neighboring bars, at the height of the shortest one
          - id: single
            text: No, each rectangle is a single bar
          - id: equal-only
            text: Only bars of equal height
        correct: several
        explanation: >-
          Covering more bars trades height for width. The 9 alone gives 9, while height 6 across
          the 4 bars from index 2 to index 5 gives 24.

  - id: checkpoint-window-max-output
    heading: What is the answer?
    tags: [sliding-window]
    prompt: >-
      A window is `k` neighboring values. For each window, from the one that ends at index `k - 1`
      to the one that ends at the last index, find its largest value. For
      `nums = [9, 4, 8, 3, 5, 7, 3, 5]` and `k = 4`, what is the answer?
    options:
      - id: maxima
        text: "`[9, 8, 8, 7, 7]`"
        explanation: >-
          The windows end at indices 3 to 7. The 9 at index 0 is in the first window only, the 8 at
          index 2 is the largest in the next two, and once it has gone, the 7 at index 5 is the
          largest in the last two.
      - id: running
        text: "`[9, 9, 9, 9, 9]`"
        explanation: Check whether the 9 at index 0 is still in the later windows.
      - id: five-wide
        text: "`[9, 9, 8, 8, 7]`"
        explanation: Check whether each window holds `k` values or one more.
      - id: three-wide
        text: "`[8, 8, 7, 7, 7]`"
        explanation: Check whether each window holds `k` values or one fewer.
    correct: maxima
    followUps:
      running:
        prompt: Is the 9 at index 0 in the window that ends at index 4?
        options:
          - id: not-in
            text: No, that window runs from index 1 to index 4
          - id: so-far
            text: Yes, every window keeps the largest value read so far
          - id: until-larger
            text: Yes, the 9 stays until a larger value arrives
        correct: not-in
        explanation: >-
          A window is the last `k` values, so a value leaves however large it is. The window of 4
          that ends at index 4 starts at index 1, and its largest value is the 8 at index 2.
      five-wide:
        prompt: How many values does the window that ends at index 4 hold?
        options:
          - id: four
            text: 4, from index 1 to index 4
          - id: five
            text: 5, from index 0 to index 4
          - id: three
            text: 3, from index 2 to index 4
        correct: four
        explanation: >-
          Each window holds `k = 4` values, so the one that ends at index 4 starts at
          `4 - 4 + 1 = 1`. Index 0 and its 9 are outside it.
      three-wide:
        prompt: Which indices does the first window cover?
        options:
          - id: zero-to-three
            text: Indices 0 to 3
          - id: one-to-three
            text: Indices 1 to 3
          - id: zero-to-four
            text: Indices 0 to 4
        correct: zero-to-three
        explanation: >-
          The first window ends at index `k - 1 = 3` and holds 4 values, so it starts at index 0.
          Its largest value is the 9.

  - format: tap-cell
    id: checkpoint-window-front-tap
    heading: Which index is at the front?
    tags: [sliding-window, queue, python]
    prompt: >-
      `window_max` finds the largest value in each window, the `k` neighboring values that end at
      index `i`. `dq` is a deque of indices: `dq[0]` reads its front and `dq[-1]` its back,
      `popleft()` removes the item at the front, `pop()` removes the item at the back, and `append`
      adds at the back. Once index 6 is appended, which index is at the front of `dq`? Tap it.
    code: |
      from collections import deque

      def window_max(nums, k):
          dq = deque()  # indices
          out = []
          for i, x in enumerate(nums):
              if dq and dq[0] <= i - k:
                  dq.popleft()
              while dq and nums[dq[-1]] <= x:
                  dq.pop()
              dq.append(i)
              if i >= k - 1:
                  out.append(nums[dq[0]])
          return out

      window_max([3, 9, 2, 6, 1, 6, 5, 4], 4)
    sequence:
      kind: array
      name: nums
      cells: [3, 9, 2, 6, 1, 6, 5, 4]
    correct: 5
    explanation: >-
      When index 5 is read, index 1 is at most `5 - 4`, so its 9 leaves the front. The 6 at index 5
      then pops the 1 and the equal 6 at index 3, since the loop pops every value at most `x`. The 5
      at index 6 is appended behind it, so index 5 is at the front.
    misses:
      - index: 0
        explanation: The 9 at index 1 popped index 0, since `3 <= 9`.
      - index: 1
        explanation: >-
          Index 1 left the window when index 5 was read: `1 <= 5 - 4` is true, so `popleft()`
          removed it.
      - index: 2
        explanation: The 6 at index 3 popped index 2, since `2 <= 6`.
      - index: 3
        explanation: >-
          The 6 at index 5 popped this equal 6, since `6 <= 6` is true. The loop pops values at most
          `x`, not only smaller ones.
      - index: 4
        explanation: The 6 at index 5 popped index 4, since `1 <= 6`.
      - index: 6
        explanation: >-
          The 5 at index 6 is smaller than the 6 at index 5, so it is appended at the back.
      - index: 7
        explanation: Index 7 has not been read when index 6 is appended.

  - id: checkpoint-debug-one-pop
    heading: Which call does it fail on?
    tags: [stack, python]
    prompt: |-
      A suggested `next_greater` should give each index the first value to its right that is
      strictly larger, or -1 when there is none. One detail is slightly off:

      ```python
      def next_greater(nums):
          out = [-1] * len(nums)
          stack = []
          for i, x in enumerate(nums):
              if stack and nums[stack[-1]] < x:
                  j = stack.pop()
                  out[j] = x
              stack.append(i)
          return out
      ```

      Which call returns a wrong answer?
    options:
      - id: needs-two
        text: "`next_greater([4, 2, 3, 5])`"
        explanation: >-
          When the 5 arrives, the stack holds index 0 (the 4) under index 2 (the 3). The `if` pops
          index 2 and stops, so index 0 keeps -1, and the call returns `[-1, 3, 5, -1]` instead of
          `[5, 3, 5, -1]`. A `while` would test the new top again and pop index 0 too.
      - id: increasing
        text: "`next_greater([1, 3, 5, 7])`"
        explanation: >-
          Each arrival finds one index waiting, the one just before it, so one pop per arrival is
          enough. The call returns `[3, 5, 7, -1]`, which is right.
      - id: one-larger
        text: "`next_greater([8, 3, 5, 2])`"
        explanation: >-
          The 5 pops the 3 and then meets the 8, which is larger, so a `while` would stop there
          too. The call returns `[-1, 5, -1, -1]`, which is right.
      - id: repeats
        text: "`next_greater([3, 1, 2, 1, 2])`"
        explanation: >-
          Each 2 pops the 1 just before it and then meets a value that is not smaller, the 3 or the
          first 2. The call returns `[-1, 2, -1, 2, -1]`, which is right.
    correct: needs-two
    followUps:
      increasing:
        prompt: On `[1, 3, 5, 7]`, how many indices are on the stack when each new value arrives?
        options:
          - id: one
            text: One, the index just before it
          - id: all
            text: Every earlier index
          - id: none
            text: None at all
        correct: one
        explanation: >-
          Each value answers the one before it right away, so the stack never holds more than one
          index. One pop per arrival is all a `while` would do here too.
      one-larger:
        prompt: When the 5 in `[8, 3, 5, 2]` arrives, what would a `while` loop do after popping the 3?
        options:
          - id: stop
            text: Stop, since the 8 on top is not smaller than 5
          - id: pop-eight
            text: Pop the 8 as well
          - id: pop-two
            text: Pop the 2 next
        correct: stop
        explanation: >-
          A `while` stops at the first top that is not smaller. Here that happens after one pop, so
          the `if` and the `while` do the same work.
      repeats:
        prompt: In `[3, 1, 2, 1, 2]`, does any arrival find two smaller values waiting on top?
        options:
          - id: no
            text: No, each 2 has only one smaller value waiting on top
          - id: both-ones
            text: Yes, the last 2 finds both 1s on top
          - id: equal-two
            text: Yes, the last 2 finds the second 1 and the first 2
        correct: no
        explanation: >-
          The first 2 pops index 1 and stops at the 3. The last 2 pops index 3 and stops at the
          first 2, since `2 < 2` is false. One pop per arrival is all this input needs.
