id: enumerating-choices-checkpoint
title: "Backtracking: subsets and orderings (checkpoint)"
description: Keep every valid output of a search you have not seen, and count what the output costs. Each item combines listing leaves, telling repeated siblings apart, and justifying a prune.
heading: What does the search return?

questions:
  - id: checkpoint-repeat-sums
    tags: [backtracking, sorting]
    prompt: |-
      Each value in `nums` may be used once, and every distinct set that adds up to `target`
      must come out once.

      ```python
      def find(nums, target):
          nums = sorted(nums)
          out, path = [], []
          def explore(start, left):
              if left == 0:
                  out.append(path[:])
                  return
              for i in range(start, len(nums)):
                  if i > start and nums[i] == nums[i - 1]:
                      continue
                  if nums[i] > left:
                      break
                  path.append(nums[i])
                  explore(i + 1, left - nums[i])
                  path.pop()
          explore(0, target)
          return out
      ```

      What does `find([2, 4, 1, 3, 2], 5)` return?
    options:
      - id: all-three
        text: "`[[1, 2, 2], [1, 4], [2, 3]]`"
        explanation: >-
          Sorted, the input is `[1, 2, 2, 3, 4]`. The call holding `[1, 2]` takes the second 2 on
          its first pass, so `[1, 2, 2]` is found. The top loop skips the second 2, so `[2, 3]`
          comes out once. Each `break` ends only its own call's loop, so `[1, 4]` is found too.
      - id: no-repeat-path
        text: "`[[1, 4], [2, 3]]`"
        explanation: >-
          The test is `i > start`, not `i > 0`. A repeat on a loop's first pass is taken.
      - id: twice
        text: "`[[1, 2, 2], [1, 4], [2, 3], [2, 3]]`"
        explanation: >-
          The top loop does not start a second branch with the other 2.
      - id: lost-pair
        text: "`[[1, 2, 2]]`"
        explanation: >-
          A `break` in a deeper call does not end the loop of the call above it. If it did, the
          call holding `[1, 3]` would cut off `[1, 4]`, and the call holding `[2, 2]` would cut
          off `[2, 3]`.
    correct: all-three
    followUps:
      no-repeat-path:
        prompt: In the call holding `[1, 2]`, where `start == 2`, is the 2 at index 2 skipped?
        options:
          - id: taken
            text: No, `i == start`, so it is taken
          - id: equal
            text: Yes, it equals the 2 before it
          - id: just-taken
            text: Yes, since 2 is the value just taken
        correct: taken
        explanation: >-
          The test skips a repeat only after the same loop has tried an equal value. On the first
          pass there is nothing to repeat, so one path can hold both 2s.
      twice:
        prompt: In the top call, why is the 2 at index 2 skipped?
        options:
          - id: same-sets
            text: It would start the same sets the 2 at index 1 started
          - id: in-path
            text: It is already in `path`
          - id: heavy
            text: It is heavier than `left`
        correct: same-sets
        explanation: >-
          The branch that opened with the first 2 already found every set that starts with a 2.
          Opening another with an equal value would find `[2, 3]` again.
      lost-pair:
        prompt: The call holding `[1, 3]` breaks because 4 > 1. Which loop does that end?
        options:
          - id: own
            text: Only that call's loop, so the caller then tries the 4
          - id: all
            text: Every loop up to the top call
          - id: caller
            text: The caller's loop too, since 4 is next there as well
        correct: own
        explanation: >-
          `break` leaves the innermost loop, which belongs to the call that runs it. The call
          holding `[1]` still has `left == 4`, so the 4 fits there exactly.

  - id: checkpoint-ordering-prefixes
    heading: How many lists?
    tags: [backtracking, recursion]
    prompt: |-
      This search records a list at every call. It starts from `explore()` with
      `items = [6, 1, 8, 3]`, `used = [False] * 4` and `path = []`, and `used[i]` is `True` while
      `items[i]` is in `path`.

      ```python
      def explore():
          out.append(path[:])
          for i in range(len(items)):
              if used[i]:
                  continue
              used[i] = True
              path.append(items[i])
              explore()
              path.pop()
              used[i] = False
      ```

      How many lists does `out` hold at the end?
    options:
      - id: sixty-five
        text: "65"
        explanation: >-
          Count the calls by how many items `path` holds. The top call holds none, and each call
          makes one call per unused item, so the levels below it hold 4, 4 × 3 = 12, 12 × 2 = 24
          and 24 × 1 = 24 calls. Every call records once: 1 + 4 + 12 + 24 + 24 = 65.
      - id: twenty-four
        text: "24"
        explanation: >-
          24 counts only the full orderings. The record line comes first in every call, with no
          length test, so the empty list and every partial ordering are recorded too.
      - id: sixteen
        text: "16"
        explanation: >-
          16 is the number of subsets of 4 items, what this search would record if each loop
          started after the index just taken. This loop runs over every index, so each subset
          comes out once per order of its items: each pair twice, each three 6 times and all four
          24 times.
      - id: eleven
        text: "11"
        explanation: >-
          1 + 4 + 3 + 2 + 1 adds the choices each level offers, as if each level held one call.
          Every call at a level makes its own calls, so the level with 2 items holds 4 × 3 = 12.
    correct: sixty-five
    followUps:
      twenty-four:
        prompt: What does the top call add to `out` before its loop runs?
        options:
          - id: empty
            text: "`[]`, since the record line has no length test"
          - id: nothing
            text: Nothing, since `path` does not hold every item yet
          - id: all
            text: All 24 orderings, once its loop is done
        correct: empty
        explanation: >-
          `out.append(path[:])` is the first line of every call. Each call adds one list, whatever
          `path` holds.
      sixteen:
        prompt: Does this search record both `[6, 1]` and `[1, 6]`?
        options:
          - id: both
            text: Yes, each call can take any unused item next
          - id: once
            text: No, each set of items is recorded once
          - id: index-order
            text: Only `[6, 1]`, since lists keep index order
        correct: both
        explanation: >-
          The loop runs over every index and skips only the used ones, so the 1 can come before
          the 6. Lists that hold the same items in another order are recorded separately.
      eleven:
        prompt: How many calls hold exactly 2 items?
        options:
          - id: twelve
            text: 12, since each of the 4 one-item calls makes 3 calls
          - id: three
            text: 3, one for each choice at that level
          - id: six
            text: 6, one for each pair of items
        correct: twelve
        explanation: >-
          Each call makes one call per unused item. The 4 calls holding one item each make 3, so
          12 calls hold two items, and each of those makes 2 more.

  - id: checkpoint-unsorted-lost-set
    format: tap-cell
    heading: Which set is lost?
    tags: [backtracking, sorting]
    prompt: >-
      This search should record every set of weights that adds up to 8, starting from
      `explore(0, 8)` with `weights = [2, 1, 6, 3, 4, 5]`. It breaks on the first weight that is
      too heavy, but the weights were never sorted. Without the `break`, it records the four sets
      shown, in this order. With the `break` it records only three. Tap the set it never records.
    code: |
      def explore(start, left):
          if left == 0:
              out.append(path[:])
              return
          for i in range(start, len(weights)):
              if weights[i] > left:
                  break
              path.append(weights[i])
              explore(i + 1, left - weights[i])
              path.pop()
    sequence:
      kind: array
      name: sets
      cells: ["[2, 1, 5]", "[2, 6]", "[1, 3, 4]", "[3, 5]"]
    correct: 0
    explanation: >-
      The call holding `[2, 1]` has `left == 5`. Its loop meets the 6 first, and 6 > 5 breaks it,
      so the 5 at the end is never tried. Sorted first, the 5 would come before the 6 and all four
      sets would be found.
    misses:
      - index: 1
        explanation: >-
          The call holding `[2]` has `left == 6`, and 6 is not more than 6, so the 6 is taken. The
          break fires only on a weight above `left`.
      - index: 2
        explanation: >-
          The call holding `[1]` has `left == 7`. The 6 fits there, and the break below it ends
          only that deeper loop. The loop then takes the 3, and the call below takes the 4.
      - index: 3
        explanation: >-
          The call holding `[3]` has `left == 5`. The weights after the 3 are 4 and 5, neither above
          5, so nothing breaks before the 5 is taken.

  - id: checkpoint-dedupe-cost
    heading: What does each version cost?
    tags: [backtracking, complexity]
    prompt: |-
      `nums` is twenty 7s, `[7] * 20`. Two searches each return its 21 distinct subsets, from no
      7s to twenty.

      **A** uses the skip test:

      ```python
      def explore(start):
          out.append(path[:])
          for i in range(start, len(nums)):
              if i > start and nums[i] == nums[i - 1]:
                  continue
              path.append(nums[i])
              explore(i + 1)
              path.pop()
      ```

      **B** runs the plain take-or-skip search over all 20 indices and adds `tuple(path)` to a set
      at each leaf. Which statement is right?
    options:
      - id: b-leaves
        text: Both keep every subset, but B reaches 1,048,576 leaves first
        explanation: >-
          A opens each distinct subset once and makes 21 calls. B still visits all 2^20 =
          1,048,576 leaves (2,097,151 calls) and builds a tuple at each, then keeps 21. The output
          is small, and B's work is not.
      - id: same-calls
        text: Both make about the same calls, since equal values merge
        explanation: >-
          B branches on every index, whatever the values are.
      - id: a-loses
        text: A loses lists such as `[7, 7]`, so only B is right
        explanation: >-
          A never skips the first item a call's loop tries.
      - id: b-faster
        text: B is faster overall, since each set insert is O(1)
        explanation: >-
          Count how many inserts B makes.
    correct: b-leaves
    followUps:
      same-calls:
        prompt: How many leaves does the take-or-skip tree over 20 items have?
        options:
          - id: two-to-twenty
            text: 2^20, one per pattern of take and skip
          - id: twenty-one
            text: 21, one per distinct subset
          - id: twenty
            text: 20, one per item
        correct: two-to-twenty
        explanation: >-
          Each of the 20 indices is taken or skipped, so there are 2^20 = 1,048,576 leaves. Equal
          values make many of them hold the same list, but the search still visits each one.
      a-loses:
        prompt: In the call holding `[7]`, is the first item its loop tries skipped?
        options:
          - id: taken
            text: No, `i == start`, so it is taken
          - id: equal
            text: Yes, it equals the 7 before it
          - id: every
            text: Yes, every repeat is skipped
        correct: taken
        explanation: >-
          Each call's first pass takes the next 7, so A walks down to `[7] * 20` and records every
          length on the way. Only siblings that would repeat a branch are skipped.
      b-faster:
        prompt: How many set inserts does B make?
        options:
          - id: million
            text: 1,048,576, one per leaf
          - id: twenty-one
            text: 21, one per distinct subset
          - id: twenty
            text: 20, one per item
        correct: million
        explanation: >-
          Each insert is cheap, but B makes one per leaf, each after building a tuple of up to 20
          items. A records 21 lists in total.

  - id: checkpoint-subset-copies
    heading: What is the complexity?
    tags: [backtracking, complexity]
    prompt: >-
      A routine takes `n` distinct items and decides for each one, in turn, whether to include it or
      leave it out. After all `n` decisions it records a copy of the current subset with `path[:]`.
      A copy writes each item of the list it copies, so it costs one step per item. Each include
      and each undo is O(1), and the results are not sorted. Counting the cost of those copies,
      what is the tightest bound on the total running time?
    options:
      - id: two-to-n
        text: O(2^n)
        explanation: >-
          There are 2^n subsets, but recording one is not constant. Copying a subset costs time in
          proportion to its length, and the lengths add up to n × 2^(n − 1) items. For n = 4 that is 32
          items across 16 subsets, so the total is more than O(2^n).
      - id: n-two-to-n
        text: O(n × 2^n)
        explanation: >-
          The tree has 2^(n+1) - 1 calls (31 for n = 4), and those cost O(2^n) in total. The copies
          cost more: each item is in exactly half the subsets, so about n × 2^(n − 1) items are copied
          (32 for n = 4). The output alone already holds that many items, so the bound is tight.
      - id: n-squared
        text: O(n²)
        explanation: >-
          There are n levels below the top call, but each level holds twice as many calls as the
          one above, so the bottom level alone has 2^n of them. The output has 2^n lists, and 2^n
          outgrows every multiple of n², so no O(n²) routine can write them all.
      - id: n-factorial
        text: O(n!)
        explanation: >-
          Each item has two options, include or leave out, which gives 2^n leaves. The n! count comes
          from ordering items, a different search. n! is a valid but loose upper bound here: at n = 10
          it is 3,628,800 against 10,240 for n × 2^n.
    correct: n-two-to-n
    followUps:
      two-to-n:
        prompt: >-
          For n = 4, 16 subsets are recorded. How many items are copied in total across all of them?
        options:
          - id: sixteen
            text: 16, one per subset, so copying adds only a constant amount
          - id: thirty-two
            text: 32, since subsets average two items each (n × 2^(n − 1))
          - id: sixty-four
            text: 64, because each of the 16 subsets has all four items
        correct: thirty-two
        explanation: >-
          Each of the 4 items appears in exactly 8 of the 16 subsets, which is 4 × 8 = 32 copied items.
          A copy takes time in proportion to its length, so the copies cost O(n × 2^n) in total.
      n-squared:
        prompt: >-
          Count the top call as level 0. How many calls does level `d` of the include/exclude tree hold?
        options:
          - id: doubles
            text: 2^d, because each call makes two calls
          - id: d-calls
            text: d, one call for each level above it
          - id: n-calls
            text: n, because every level looks at all n items
        correct: doubles
        explanation: >-
          Each call makes two, so level `d` holds 2^d calls and the last level holds 2^n. Having n
          levels does not mean n calls per level.
      n-factorial:
        prompt: >-
          For n = 4, how many finished subsets does the include/exclude tree produce?
        options:
          - id: sixteen
            text: 16, since each of the four items has two options
          - id: twenty-four
            text: 24, since the items can be ordered in 4! ways
          - id: eight
            text: 8, since each item adds two more subsets
        correct: sixteen
        explanation: >-
          Two options for each of four items gives 2 × 2 × 2 × 2 = 16 leaves. The 4! = 24 count applies
          when the order of the chosen items matters, as in orderings, which is a different search.

  - id: checkpoint-debug-skip-break
    heading: Which call does it fail on?
    tags: [backtracking, sorting]
    prompt: |-
      A suggested `subsets_once(nums)` should return each distinct subset of `nums` once. One
      detail is slightly off:

      ```python
      def subsets_once(nums):
          nums = sorted(nums)
          out, path = [], []
          def explore(start):
              out.append(path[:])
              for i in range(start, len(nums)):
                  if i > start and nums[i] == nums[i - 1]:
                      break
                  path.append(nums[i])
                  explore(i + 1)
                  path.pop()
          explore(0)
          return out
      ```

      Which call returns a wrong answer?
    options:
      - id: pair-first
        text: "`subsets_once([4, 4, 6])`"
        explanation: >-
          The top loop meets the second 4 at `i = 1`, and `break` ends the loop, so the 6 never
          opens a branch. The call returns `[[], [4], [4, 4], [4, 4, 6], [4, 6]]` and loses `[6]`.
          The skip should be `continue`, which passes over the one repeat and goes on to the
          values after it.
      - id: pair-last
        text: "`subsets_once([5, 7, 7])`"
        explanation: >-
          Each loop that breaks does so on the last 7, and nothing after it is lost. The call
          returns all 6 distinct subsets: `[]`, `[5]`, `[5, 7]`, `[5, 7, 7]`, `[7]` and `[7, 7]`.
      - id: all-equal
        text: "`subsets_once([3, 3, 3])`"
        explanation: >-
          Every value after a break is another 3, and the branch of the first 3 in that loop
          already records every subset they would start. The call returns `[]`, `[3]`, `[3, 3]`
          and `[3, 3, 3]`, which is right.
      - id: distinct
        text: "`subsets_once([6, 9])`"
        explanation: >-
          No value equals its left neighbor, so the `break` never runs. The call returns `[]`,
          `[6]`, `[6, 9]` and `[9]`, which is right.
    correct: pair-first
    followUps:
      pair-last:
        prompt: In `subsets_once([5, 7, 7])`, the top loop breaks at index 2. Which values come after it?
        options:
          - id: none
            text: None, since the second 7 is the last value
          - id: five
            text: The 5, which the break skips
          - id: sevens
            text: Both 7s
        correct: none
        explanation: >-
          `break` loses only the values after the repeat. When the repeat is last, it does what
          `continue` would.
      all-equal:
        prompt: >-
          In `subsets_once([3, 3, 3])`, the top loop breaks at index 1. What would a branch opened
          by that 3 have recorded?
        options:
          - id: repeats
            text: "`[3]` and `[3, 3]`, which the first 3's branch already recorded"
          - id: lost
            text: "`[3, 3, 3]`, which is now lost"
          - id: nothing
            text: Nothing, since a branch never takes a 3 twice
        correct: repeats
        explanation: >-
          With equal values only, every branch after the first would repeat it. Cutting all of
          them loses nothing, so the slip shows only when a different value follows a repeat.
      distinct:
        prompt: When does the `break` line run?
        options:
          - id: equal-neighbor
            text: Only on a pass after the first whose value equals its left neighbor
          - id: every-later
            text: On every pass after the loop's first
          - id: larger
            text: Whenever a value is larger than the one before it
        correct: equal-neighbor
        explanation: >-
          Both parts of the `if` must hold. With no equal values side by side, the slipped line
          never runs, and the search records every subset once.

  - id: checkpoint-ordering-value-test
    heading: Which call goes wrong?
    tags: [backtracking, sorting]
    prompt: |-
      A suggested `orderings_once(nums)` should return each distinct ordering of `nums` once. For
      `[5, 8, 5]` that is `[5, 5, 8]`, `[5, 8, 5]` and `[8, 5, 5]`. One detail is slightly off:

      ```python
      def orderings_once(nums):
          nums = sorted(nums)
          out, path, used = [], [], [False] * len(nums)
          def explore():
              if len(path) == len(nums):
                  out.append(path[:])
                  return
              for i in range(len(nums)):
                  if used[i]:
                      continue
                  if i > 0 and nums[i] == nums[i - 1] and nums[i] not in path:
                      continue
                  used[i] = True
                  path.append(nums[i])
                  explore()
                  path.pop()
                  used[i] = False
          explore()
          return out
      ```

      Which call returns a wrong answer?
    options:
      - id: three-equal
        text: "`orderings_once([7, 7, 7])`"
        explanation: >-
          In the call holding the 7 at index 0, index 1 passes, and so does index 2 once index 1
          is popped: a 7 is in `path`, though index 1 is not. Both open a branch, so the call
          returns `[[7, 7, 7], [7, 7, 7]]`. Testing `not used[i - 1]` instead fixes it, since index
          2 then waits until the 7 at index 1 is in use.
      - id: one-pair
        text: "`orderings_once([9, 2, 2])`"
        explanation: >-
          Sorted, the input is `[2, 2, 9]`, and the call returns `[[2, 2, 9], [2, 9, 2],
          [9, 2, 2]]`, which is right. With only two 2s, which 2 can be in `path` when index 1 is
          tested?
      - id: two-pairs
        text: "`orderings_once([8, 3, 8, 3])`"
        explanation: >-
          Sorted, the input is `[3, 3, 8, 8]`, and the call returns its 6 distinct orderings once
          each, which is right. Each value has only two copies.
      - id: distinct
        text: "`orderings_once([6, 1])`"
        explanation: >-
          Sorted, the input is `[1, 6]`, and the call returns `[[1, 6], [6, 1]]`, which is right.
          The second test needs two equal values side by side.
    correct: three-equal
    followUps:
      one-pair:
        prompt: >-
          In `orderings_once([9, 2, 2])`, the loop tests the 2 at index 1. Which 2 can already be
          in `path`?
        options:
          - id: index-zero
            text: Only the 2 at index 0, so the value test matches `used[0]`
          - id: either
            text: The 2 at index 0 or the 2 at index 1
          - id: none
            text: Neither, since a 2 is never placed before another 2
        correct: index-zero
        explanation: >-
          `used[1]` is False whenever index 1 is tested, so a 2 in `path` must be index 0. With
          only two copies, "a 2 is in `path`" and "the 2 to the left is in use" always agree.
      two-pairs:
        prompt: >-
          Sorted, the input is `[3, 3, 8, 8]`. When the loop tests the 8 at index 3, which 8 can be
          in `path`?
        options:
          - id: index-two
            text: Only the 8 at index 2, so the value test matches `used[2]`
          - id: any
            text: Any 8 in the input, including the one at index 3
          - id: threes
            text: None, since the 3s block it
        correct: index-two
        explanation: >-
          Index 3 is not in use when it is tested, so an 8 in `path` must be index 2. Each value
          has two copies, so the value test agrees with a check on the left neighbor.
      distinct:
        prompt: When does the second `continue` run on `[1, 6]`?
        options:
          - id: never
            text: Never, since `nums[1]` is 6 and `nums[0]` is 1
          - id: always
            text: Whenever the 1 is already in `path`
          - id: once
            text: Once, in the top call
        correct: never
        explanation: >-
          All three parts of the `if` must hold, and the values differ, so the slipped test never
          fires. With distinct values, `used` alone records each ordering once.
