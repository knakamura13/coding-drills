id: problem-solving-routine-checkpoint
title: "Problem-solving routine: checkpoint"
description: Choose a test that separates two plausible procedures, on new problems. Each item combines restating the output, picking a test, and tracing both procedures on it.
heading: Which test separates them?

questions:
  - id: checkpoint-first-max-index
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return the index of the largest value. If it
      # appears more than once, return the first index.
      def top_a(nums):
          best = 0
          for i in range(1, len(nums)):
              if nums[i] > nums[best]:
                  best = i
          return best

      def top_b(nums):
          best = 0
          for i in range(1, len(nums)):
              if nums[i] >= nums[best]:
                  best = i
          return best
      ```

      Which test gives different answers from the two?
    options:
      - id: tied-max
        text: "`[2, 9, 4, 9]`"
        explanation: >-
          The largest value, 9, appears twice. `top_a` keeps index 1 because the second 9 is not
          greater. `top_b` moves to index 3 because it is equal. The statement asks for the first
          index, so `top_b` is the wrong one.
      - id: max-first
        text: "`[9, 4, 2]`"
        explanation: >-
          The 9 comes first and nothing later matches it, so `>` and `>=` act the same here. A
          separating test needs a tie that `>=` reacts to and `>` does not.
      - id: tied-below
        text: "`[4, 4, 9]`"
        explanation: >-
          The two 4s do tie, but 4 is not the largest value. Look at what the 9 at the end does to
          each function's `best`.
      - id: single
        text: "`[8]`"
        explanation: >-
          With one item there is nothing to compare, so both return their starting index. A tie
          needs at least two items.
    correct: tied-max
    followUps:
      max-first:
        prompt: In `[9, 4, 2]`, does `>=` ever hold where `>` does not?
        options:
          - id: never
            text: No, no later value equals the current best
          - id: first
            text: Yes, on the first comparison
          - id: start
            text: Yes, because 9 is at index 0
        correct: never
        explanation: >-
          `>` and `>=` differ only on a tie with the current best. A separating test needs the
          largest value at least twice.
      tied-below:
        prompt: "`top_b` moves to index 1 on the tie between the 4s. Where does it end?"
        options:
          - id: on-nine
            text: On index 2
          - id: on-tie
            text: On index 1
          - id: on-start
            text: On index 0
        correct: on-nine
        explanation: >-
          The 9 at index 2 beats both 4s, so `top_b` moves there, just like `top_a`. A tie below
          the maximum is overwritten once a larger value arrives. Only a tie on the largest value
          survives to the return.
      single:
        prompt: How many times does the loop run on `[8]`?
        options:
          - id: zero
            text: Zero
          - id: once
            text: Once
          - id: twice
            text: Twice
        correct: zero
        explanation: >-
          `range(1, 1)` is empty, so the body never runs. With one item, both functions return
          their starting `best`, index 0. A single item cannot contain a tie.

  - id: checkpoint-pair-count
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return how many index pairs i < j
      # have nums[i] + nums[j] == target.
      def pairs_a(nums, target):
          count = 0
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  if nums[i] + nums[j] == target:
                      count += 1
          return count

      def pairs_b(nums, target):
          seen = set()
          count = 0
          for x in nums:
              if target - x in seen:
                  count += 1
              seen.add(x)
          return count
      ```

      `pairs_b` reads the list once, keeps each value it has passed in `seen`, and adds 1 when an
      earlier value plus `x` makes `target`. Which test gives different answers from the two?
    options:
      - id: three-equal
        text: "`nums = [3, 3, 3]`, `target = 6`"
        explanation: >-
          The three 3s make three pairs, so `pairs_a` returns 3. `pairs_b` adds at most 1 for each
          value. The third 3 has two earlier partners but adds 1, so `pairs_b` returns 2.
      - id: distinct
        text: "`nums = [1, 5, 2, 4]`, `target = 6`"
        explanation: >-
          With no repeated values, each value has at most one earlier partner, so adding 1 per value
          misses nothing. Both find the pairs 1 and 5 and 2 and 4.
      - id: two-equal
        text: "`nums = [3, 3]`, `target = 6`"
        explanation: >-
          Two equal values make a single pair, and `pairs_b` adds 1 for the second one. A value has
          to have two earlier partners before adding 1 falls short.
      - id: shared-partner
        text: "`nums = [6, 0, 0]`, `target = 6`"
        explanation: >-
          The pairs are the 6 with each 0, and each 0 has only one earlier partner. Adding 1 per
          value counts both, so the two functions agree.
    correct: three-equal
    followUps:
      distinct:
        prompt: With no repeated values, how many times does `pairs_b` count the pair 1 and 5?
        options:
          - id: once
            text: Once, when the 5 finds 1 in the set
          - id: twice
            text: Twice, once from each side
          - id: never
            text: Never, because 1 is added after its test
        correct: once
        explanation: >-
          Each pair is counted when its later value arrives. With distinct values, every value has
          at most one earlier partner, so both functions return 2.
      two-equal:
        prompt: "In `pairs_b([3, 3], 6)`, is 3 in `seen` when the second 3 arrives?"
        options:
          - id: yes-one
            text: Yes, so it counts 1, the only pair
          - id: not-seen
            text: No, a set ignores repeated values
          - id: yes-two
            text: Yes, so it counts 2
        correct: yes-one
        explanation: >-
          Two copies make one pair, and `pairs_b` counts it once. It loses count only when one
          value has two or more earlier partners.
      shared-partner:
        prompt: For each 0, which earlier value completes the pair?
        options:
          - id: six
            text: The 6, which is in the set both times
          - id: other-zero
            text: The other 0
          - id: nothing
            text: Nothing, since 0 adds no value
        correct: six
        explanation: >-
          Each 0 has exactly one earlier partner, the single 6, so adding 1 per value is enough.
          Both functions return 2.

  - id: checkpoint-letter-counts
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return True if t uses exactly the same letters
      # as s, each the same number of times.
      def same_a(s, t):
          return sorted(s) == sorted(t)

      def same_b(s, t):
          return set(s) == set(t)
      ```

      Which test gives different answers from the two?
    options:
      - id: counts-differ
        text: "`s = 'aab'`, `t = 'abb'`"
        explanation: >-
          Both strings use only a and b, so the sets match and `same_b` returns `True`. The counts
          differ, two a's against one, so the sorted lists differ and `same_a` returns `False`,
          which is what the statement asks for.
      - id: reordered
        text: "`s = 'abc'`, `t = 'cab'`"
        explanation: >-
          The two strings hold the same letters in a different order. Sorting removes the order, so
          both functions agree here.
      - id: extra-letter
        text: "`s = 'ab'`, `t = 'abc'`"
        explanation: >-
          The extra c changes the letters themselves, so `same_a` and `same_b` both see a
          difference. A separating test has to fool only one of them.
      - id: empty
        text: "`s = ''`, `t = ''`"
        explanation: >-
          Two empty strings use the same letters, none, the same number of times. Both functions
          agree on them.
    correct: counts-differ
    followUps:
      reordered:
        prompt: Do `'abc'` and `'cab'` use any letter a different number of times?
        options:
          - id: same-counts
            text: No, so both functions return `True`
          - id: order
            text: Yes, the order differs, so `same_a` returns `False`
          - id: moved
            text: Yes, the c moved to the front
        correct: same-counts
        explanation: >-
          `sorted` puts both strings in the same order before comparing, so order never matters
          to `same_a`. Only a difference in counts can separate the two.
      extra-letter:
        prompt: Is `set('ab') == set('abc')`?
        options:
          - id: unequal
            text: No, the c is missing from the first
          - id: subset
            text: Yes, every letter of `'ab'` is in `'abc'`
          - id: length
            text: Yes, sets ignore length
        correct: unequal
        explanation: >-
          Set equality needs the same members on both sides, so both functions return `False`. A
          separating test keeps the same letters and changes only how often one appears.
      empty:
        prompt: What do `sorted('')` and `set('')` give?
        options:
          - id: empties
            text: An empty list and an empty set, so both return `True`
          - id: errors
            text: Errors, since there is nothing to sort
          - id: none
            text: "`None` for both"
        correct: empties
        explanation: >-
          Two empty strings use the same letters the same number of times. Both functions agree,
          so this test separates nothing.

  - id: checkpoint-final-run
    tags: [python, arrays-strings]
    prompt: |-
      ```python
      # Return the length of the longest run of equal
      # values in a row. One value alone is a run of 1.
      # Return 0 for an empty list.
      def run_a(nums):
          best = run = 0
          for i in range(len(nums)):
              if i > 0 and nums[i] == nums[i - 1]:
                  run += 1
              else:
                  run = 1
              best = max(best, run)
          return best

      def run_b(nums):
          best = run = 0
          for i in range(len(nums)):
              if i > 0 and nums[i] == nums[i - 1]:
                  run += 1
              else:
                  best = max(best, run)
                  run = 1
          return best
      ```

      Which test gives different answers from the two?
    options:
      - id: ends-in-run
        text: "`[1, 2, 2]`"
        explanation: >-
          The longest run, the two 2s, is still going when the loop ends. `run_a` updates `best` on
          every pass and returns 2. `run_b` updates only when a new run starts, which never happens
          after the last run, so it returns 1.
      - id: run-first
        text: "`[2, 2, 1]`"
        explanation: >-
          The run of 2s ends before the loop does, and `run_b` records a run as soon as the next
          one starts. Both functions see it.
      - id: empty
        text: "`[]`"
        explanation: >-
          An empty list skips the loop, so both return their starting `best`, which is what the
          statement asks for.
      - id: earlier-tie
        text: "`[4, 4, 1, 1]`"
        explanation: >-
          `run_b` loses the last run, the two 1s, but the two 4s are just as long and were recorded
          when the 1s began. The lost run does not change the answer.
    correct: ends-in-run
    followUps:
      run-first:
        prompt: In `[2, 2, 1]`, when does `run_b` record the run of 2s?
        options:
          - id: on-change
            text: When the 1 starts a new run
          - id: never
            text: Never
          - id: after
            text: After the loop ends
        correct: on-change
        explanation: >-
          `run_b` saves a run when the next one starts. The 2s end before the last item, so both
          functions return 2.
      empty:
        prompt: What do both functions return for `[]`?
        options:
          - id: zero
            text: 0, the starting `best`
          - id: one
            text: 1, a run of nothing
          - id: error
            text: An error from `nums[i - 1]`
        correct: zero
        explanation: >-
          The loop never runs, so both return their starting value. Both meet the statement on an
          empty list.
      earlier-tie:
        prompt: "`run_b` drops the final run of 1s. Does that change its answer here?"
        options:
          - id: no-change
            text: No, it returns 2
          - id: one
            text: Yes, it returns 1
          - id: zero
            text: Yes, it returns 0
        correct: no-change
        explanation: >-
          `run_b` records the two 4s when the first 1 arrives. The lost run is no longer than that,
          so both return 2. A separating test needs the last run to be longer than every earlier
          run.

  - id: checkpoint-debug-two-sum
    heading: Which input does it fail on?
    tags: [python, arrays-strings]
    prompt: |-
      A suggested solution tries every pair, as a brute force should, but one line is slightly
      off:

      ```python
      # Return the indices i < j of the two numbers in nums
      # that add up to target. Exactly one pair does.
      def two_sum(nums, target):
          for i in range(len(nums)):
              for j in range(i, len(nums)):
                  if nums[i] + nums[j] == target:
                      return [i, j]
      ```

      On which input does it return a wrong answer?
    options:
      - id: half-target
        text: "`nums = [3, 5, 1]`, `target = 6`"
        explanation: >-
          `j` starts at `i`, not `i + 1`, so the first test adds `nums[0]` to itself. 3 + 3 is 6,
          so the call returns `[0, 0]`. The right answer is `[1, 2]`, since 5 + 1 is 6.
      - id: last-pair
        text: "`nums = [2, 7, 4]`, `target = 11`"
        explanation: >-
          The answer, 7 + 4, is the last pair, but the search still reaches it. Each value doubled
          gives 4, 14 and 8, and none is 11, so testing a value with itself never matches. The call
          returns `[1, 2]`, which is right.
      - id: two-items
        text: "`nums = [8, 1]`, `target = 9`"
        explanation: >-
          The extra test adds 8 to itself, which is 16, not 9. The next test finds 8 + 1, so the
          call returns `[0, 1]`, which is right.
      - id: has-zero
        text: "`nums = [5, 0, 7]`, `target = 5`"
        explanation: >-
          5 + 5 is 10, not 5, so the extra test fails and the next one finds 5 + 0. The call
          returns `[0, 1]`, which is right. A 0 is not what trips this code.
    correct: half-target
    followUps:
      last-pair:
        prompt: When does testing a value with itself give a wrong answer?
        options:
          - id: doubled
            text: When some value doubled equals `target`
          - id: late
            text: When the right pair comes last
          - id: long
            text: When the list has more than two items
        correct: doubled
        explanation: >-
          `range(i, len(nums))` adds a test of `nums[i] + nums[i]` before the real pairs. It
          returns too early only if that sum is `target`, so the failing input needs a value equal
          to half of `target`.
      two-items:
        prompt: What is the first sum the code tests on any input?
        options:
          - id: self
            text: "`nums[0] + nums[0]`, the first value with itself"
          - id: first-pair
            text: "`nums[0] + nums[1]`, the first real pair"
          - id: last
            text: "`nums[0] + nums[-1]`, the two ends"
        correct: self
        explanation: >-
          On the first pass `i` is 0 and `j` starts at `i`, so the first test adds `nums[0]` to
          itself. Every pass opens with such a test, which is harmless unless the doubled value
          equals `target`.
      has-zero:
        prompt: Which sum must equal `target` for this code to return a wrong pair?
        options:
          - id: self-sum
            text: A value added to itself
          - id: zero-sum
            text: Any sum that includes a 0
          - id: end-sum
            text: The sum of the last two values
        correct: self-sum
        explanation: >-
          The only tests this code adds to a correct brute force are `nums[i] + nums[i]`. A wrong
          answer needs one of those to hit `target`, and with a target of 5 that would take a value
          of 2.5.
