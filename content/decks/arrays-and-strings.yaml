id: arrays-and-strings
title: Arrays and strings
description: Read an index, scan a list, move two pointers, and read a slice. Each card asks for one decision, with a worked example on hand.
heading: What does this give?

questions:
  - format: tap-cell
    id: read-index-cell
    heading: Which cell does it read?
    tags: [arrays-strings]
    workedExample: |-
      Most coding problems hand you data in a list or a string, so the first skill is reading it
      exactly. Here the list is `scores = [70, 85, 92]`. A list keeps its items in order, and each
      item sits at an index, counted from 0.

      1. Counting from 0, `70` is at index 0, `85` at index 1 and `92` at index 2.
      2. `scores[2]` asks for the item at index 2. The `2` names an index, not a value.
      3. By step 1, index 2 holds `92`, so `scores[2]` is `92`.
    prompt: >-
      A list keeps its items in order, and each item sits at an index, counted from 0. `nums[i]`
      reads the item at index `i`. Tap the cell `nums[1]` reads.
    code: |
      nums = [3, 0, 1, 2]
      print(nums[1])
    sequence:
      kind: array
      name: nums
      cells: [3, 0, 1, 2]
    correct: 1
    explanation: >-
      Indices count from 0, so index 1 is the second cell. `nums[1]` reads the `0` stored there.
    misses:
      - index: 0
        explanation: >-
          This is index 0, the first cell. Counting from 0, index 1 is the cell after it.
      - index: 2
        explanation: >-
          This cell holds the value `1`. The `1` in `nums[1]` names an index, so it does not search
          for a value.
      - index: 3
        explanation: This is index 3, the last cell, which `nums[3]` would read.

  - format: tap-cell
    id: read-past-the-end
    heading: Which index does it read?
    tags: [arrays-strings]
    workedExample: |-
      Consider `word = "drill"`. `len(word)` counts its characters, and indices count from 0.

      1. `len(word)` is 5, so the characters sit at indices 0, 1, 2, 3 and 4.
      2. Since the first index is 0, the last one is the length minus one, `5 - 1 = 4`. So the
         last character is `word[4]`, which is `l`.
      3. Since 4 is the last index, `word[5]` names a character that does not exist, and reading
         it raises `IndexError`.
    prompt: >-
      `len(code)` gives how many characters `code` holds. Which index does `code[len(code)]`
      read? The index after the last cell is past the end: no character sits there, and reading it
      raises `IndexError`. Tap the index.
    code: |
      code = "fig"
      print(code[len(code)])
    sequence:
      kind: string
      name: code
      cells: [f, i, g]
      pastEnd: true
    correct: 3
    explanation: >-
      `len("fig")` is 3, and the indices run from 0 to 2. Index 3 is one past the last character,
      so `code[len(code)]` raises `IndexError`. The last character is `code[len(code) - 1]`.
    misses:
      - index: 0
        explanation: >-
          `len(code)` counts the characters, so it is 3. Index 0 is the first character.
      - index: 1
        explanation: Index 1 holds `i`, the middle character. `len("fig")` is 3.
      - index: 2
        explanation: >-
          Index 2 holds `g`, the last character, and `code[2]` works. Indices start at 0, so the
          length, 3, is one past it.

  - format: tap-cell
    id: negative-index
    heading: Which cell does it read?
    tags: [arrays-strings]
    workedExample: |-
      Consider `nums = [10, 20, 30, 40]`. A negative index counts back from the end, and `-1`
      names the last item.

      1. `len(nums)` is 4, so the last index is 3, and `nums[-1]` reads `nums[3]`, which is `40`.
      2. Each step further back lowers the index by one. So `nums[-3]` is three items from the
         end, counting the last as the first: index `4 - 3 = 1`, which holds `20`.
      3. So for `k` from 1 up to `len(nums)`, `nums[-k]` reads the same cell as
         `nums[len(nums) - k]`.
    prompt: >-
      A negative index counts back from the end of a string or list, so `-1` names the last cell.
      Tap the cell `word[-2]` reads.
    code: |
      word = "stream"
      print(word[-2])
    sequence:
      kind: string
      name: word
      cells: [s, t, r, e, a, m]
    correct: 4
    explanation: >-
      `-1` is the last cell, index 5, so `-2` is one step back from it, index 4, which holds `a`.
      `word[-2]` reads the same cell as `word[6 - 2]`.
    misses:
      - index: 5
        explanation: This is `word[-1]`, the last cell. `-2` counts one more step back.
      - index: 3
        explanation: >-
          This is `word[-3]`. `-1` is already the last cell, so `-2` is only one step back from
          it.
      - index: 2
        explanation: >-
          This is `word[2]`. The minus sign makes the index count back from the end, not forward
          from the start.
      - index: 1
        explanation: Index 1 is the second cell from the front. A negative index counts from the back.
      - index: 0
        explanation: Index 0 is the first cell. `-2` counts back from the end, so it lands near the end.

  - id: empty-position
    heading: Which guard works?
    tags: [arrays-strings]
    workedExample: |-
      Consider `nums = []`, the empty list. Reading an index that has no cell raises
      `IndexError`.

      1. `len(nums)` is 0, so `nums` holds no items and has no indices at all.
      2. `nums[0]` asks for the first item. Since `nums` has no indices, there is none, so
         `nums[0]` raises `IndexError`.
      3. `nums[-1]` asks for the last item. For the same reason there is none, so `nums[-1]`
         raises `IndexError` too.
    prompt: |-
      An empty string or list counts as false in an `if`, and any other string or list counts as
      true. The line below must not crash when `s` is empty, and must still read the last
      character of any other string. Which guard works?

      ```python
      if ???:
          last = s[-1]
      ```
    options:
      - id: truthy
        text: "`if s:`"
        explanation: >-
          `if s:` skips the body for `""` and runs it for every other string, so the read happens
          only when `s` has at least one character. That is exactly when index -1 exists.
      - id: reads-first
        text: "`if s[-1]:`"
        explanation: >-
          The guard itself reads `s[-1]`, so on an empty string it fails before it can protect the
          line below.
      - id: length-zero
        text: "`if len(s) >= 0:`"
        explanation: >-
          Every length is at least 0, including the empty string's, so this guard is always true
          and lets the empty case through.
      - id: space
        text: "`if s != \" \":`"
        explanation: >-
          `""` and `" "` are different strings: the empty string has no characters, and `" "` has
          one, a space. So this test passes for `""`, and the read still fails.
    correct: truthy
    followUps:
      reads-first:
        prompt: "`s = \"\"`. What does evaluating `s[-1]` do?"
        options:
          - id: raises
            text: Raises `IndexError`
          - id: falsy
            text: Gives `''`, which is falsy, so the body is skipped
          - id: none
            text: Gives `None`, which is falsy, so the body is skipped
        correct: raises
        explanation: >-
          An empty string has no index -1, so the read fails. A condition is evaluated like any
          other expression, so it must not do the risky read itself.
      length-zero:
        prompt: For which lengths is `s[-1]` safe?
        options:
          - id: one-plus
            text: 1 or more
          - id: zero-plus
            text: 0 or more
          - id: two-plus
            text: 2 or more, so that first and last differ
        correct: one-plus
        explanation: >-
          `s[-1]` needs at least one character. A one-letter string is fine: its first and last
          character are the same cell. `len(s) > 0` and plain `if s:` both say the same thing.
      space:
        prompt: "`s = \"\"`. What is `s != \" \"`?"
        options:
          - id: is-true
            text: "`True`"
          - id: is-false
            text: "`False`"
          - id: error
            text: It raises an error
        correct: is-true
        explanation: >-
          An empty string is not a space, so the test is `True` and the body runs. A guard has to
          test for the empty string itself, as `if s:` does.

  - format: tap-cell
    id: middle-index
    heading: Which cell does it read?
    tags: [arrays-strings]
    workedExample: |-
      Consider `n // 2` for two lengths. `//` divides and rounds down to a whole number.

      1. `5 // 2`: 5 divided by 2 is 2.5, which rounds down to 2. A list of 5 items has indices 0
         to 4, and index 2 has two cells on each side, so it is the middle cell.
      2. `6 // 2` is exactly 3. A list of 6 items has two middle cells, indices 2 and 3, and
         `6 // 2` names the right one of the pair, 3.
      3. So for any list that is not empty, `len(xs) // 2` is a real index near the middle.
    prompt: >-
      `//` divides and rounds down to a whole number, so `9 // 2` is `4`. Tap the cell
      `nums[len(nums) // 2]` reads.
    code: |
      nums = [8, 3, 5, 9, 1, 4, 7]
      print(nums[len(nums) // 2])
    sequence:
      kind: array
      name: nums
      cells: [8, 3, 5, 9, 1, 4, 7]
    correct: 3
    explanation: >-
      `len(nums)` is 7, and `7 // 2` is 3, since 3.5 rounds down. Index 3 has three cells on each
      side, so it is the middle cell, and `nums[3]` is `9`.
    misses:
      - index: 4
        explanation: That rounds 3.5 up. `//` always rounds down, so `7 // 2` is 3.
      - index: 2
        explanation: >-
          This is the third cell. `7 // 2` is 3, and index 3 counts from 0, so it is the fourth
          cell.
      - index: 1
        explanation: >-
          This cell holds the value 3. `7 // 2` gives the index 3, and the brackets read the cell
          at that index.
      - index: 6
        explanation: >-
          This is the last cell, index `len(nums) - 1`. Halving the length lands in the middle,
          not at the end.
      - index: 0
        explanation: Index 0 is the first cell. `len(nums) // 2` is 3, halfway along.
      - index: 5
        explanation: Index 5 is the second cell from the end. `7 // 2` is 3.

  - id: repeated-letters
    heading: What does this scan leave behind?
    tags: [arrays-strings]
    workedExample: |-
      Consider `word = "banana"` and a scan that counts its `a`s:

      ```python
      count = 0
      for i in range(len(word)):
          if word[i] == "a":
              count += 1
      ```

      1. `len(word)` is 6, so `range(6)` gives `i` the values 0, 1, 2, 3, 4 and 5. The loop reads
         every cell, from the left.
      2. `word[i] == "a"` is true at indices 1, 3 and 5, and false everywhere else.
      3. Each true test adds 1, so `count` becomes 1, then 2, then 3. Nothing ends the loop early,
         so it still reads the last cell, and `count` ends at 3.
    prompt: |-
      This loop scans `word`: it reads the cells one by one from the left, since
      `range(len(word))` gives each index from 0 up to `len(word) - 1`. What is `last` after the
      loop?

      ```python
      word = "pepper"
      last = -1
      for i in range(len(word)):
          if word[i] == "p":
              last = i
      ```
    options:
      - id: last-match
        text: "`3`"
        explanation: >-
          The loop visits all six indices. `p` appears three times, and each match replaces
          `last`, so it ends on the final match.
      - id: first-match
        text: "`0`"
        explanation: >-
          `0` is the first match, but nothing in the loop stops it there. Trace what each later
          match does to `last`.
      - id: one-based
        text: "`4`"
        explanation: >-
          The last `p` is the fourth character, and `4` counts it from 1. `i` comes from
          `range(len(word))`, which starts at 0.
      - id: all-matches
        text: "`[0, 2, 3]`"
        explanation: >-
          Those are the indices the `if` accepts, but `last` is a single name, not a list.
          Nothing in the loop collects them.
    correct: last-match
    followUps:
      first-match:
        prompt: Does this loop stop when it finds the first `p`?
        options:
          - id: no-stop
            text: No, nothing in the loop body ends it early
          - id: if-stops
            text: Yes, the `if` ends the loop once it is true
          - id: assign-stops
            text: Yes, assigning to `last` ends the loop
        correct: no-stop
        explanation: >-
          Nothing in this body leaves the loop early (no `break`, `return` or exception), so the
          loop keeps going and every later `p` overwrites `last`.
      one-based:
        prompt: Which indices of `"pepper"` hold a `p`?
        options:
          - id: zero-based
            text: 0, 2 and 3
          - id: shifted
            text: 1, 3 and 4
          - id: missed-double
            text: 0 and 2 only
        correct: zero-based
        explanation: >-
          Counting from 0, p-e-p-p-e-r puts a `p` at 0, then at 2 and 3 back to back. The fourth
          character sits at index 3.
      all-matches:
        prompt: "`last = i` runs with `i` equal to 0, then 2, then 3. What does `last` hold afterwards?"
        options:
          - id: replaced
            text: "`3`"
          - id: all
            text: "`[0, 2, 3]`"
          - id: total
            text: "`5`"
        correct: replaced
        explanation: >-
          A plain variable holds one value at a time, and each assignment replaces the old one, so
          only the last, `3`, is left. Collecting every match needs a list and `append`.

  - format: step-trace
    id: compare-neighbors
    heading: Follow the scan
    tags: [arrays-strings]
    workedExample: |-
      Consider `s = "moon"` and the test `s[i] == s[i - 1]`, which compares the letter at index
      `i` with the letter just before it.

      1. With `i` at 1, the test compares `s[1]`, `o`, with `s[0]`, `m`. They differ.
      2. With `i` at 2, it compares `s[2]`, `o`, with `s[1]`, `o`. They are equal, so a double is
         found when `i` names the second letter of the pair.
      3. So a scan that returns `i` at the first equal pair returns 2 for `"moon"`.
    prompt: >-
      `first_double` scans `s` for two equal letters next to each other. `i` is drawn on its first
      value. Predict each step before it is shown.
    code: |
      def first_double(s):
          for i in range(1, len(s)):
              if s[i] == s[i - 1]:
                  return i
          return -1

      first_double("kitten")
    sequence:
      kind: string
      name: s
      cells: [k, i, t, t, e, n]
    start:
      - { name: i, at: 1 }
    steps:
      - line: 2
        ask: Why does `range(1, len(s))` start `i` at 1, not at 0?
        options:
          - id: before
            text: So `s[i - 1]` is always the letter just before `s[i]`
            explanation: >-
              At `i = 1`, `s[i - 1]` is `s[0]`, the first letter. Starting at 0 would compare
              `s[0]` with `s[-1]`, which is the last letter, `n`, not a neighbor.
          - id: skip-first
            text: Because the first letter can never be part of a double
            explanation: >-
              The first letter can start a double, as in `"oops"`. With `i` at 1, the test
              compares `s[1]` with `s[0]`, so that double is still found.
          - id: error
            text: Because `s[i - 1]` would raise `IndexError` with `i` at 0
            explanation: >-
              At `i = 0`, `s[i - 1]` is `s[-1]`, a real index: the last letter. No error is
              raised, so the loop would quietly compare `k` with `n`.
        correct: before
      - line: 3
        ask: On the pass with `i` at 2, which two letters does line 3 compare?
        options:
          - id: back
            text: "`s[2]` and `s[1]`, which are `t` and `i`"
            explanation: >-
              `s[i - 1]` is the cell just left of `i`. The two letters differ, so the loop moves
              on.
          - id: ahead
            text: "`s[2]` and `s[3]`, which are `t` and `t`"
            explanation: >-
              That looks one cell ahead. `s[i - 1]` looks one cell back, to index 1.
          - id: previous-pass
            text: "`s[1]` and `s[0]`, which are `i` and `k`"
            explanation: That was the pass with `i` at 1. On this pass `i` is 2.
        correct: back
        also:
          - { name: i, at: 2 }
      - line: 4
        ask: The test passes for the first time. Tap the cell `i` names when `return i` runs.
        pointer: i
        correct: 3
        explanation: >-
          With `i` at 3, `s[3]` and `s[2]` are both `t`, so the function returns 3, the index of
          the second letter of the pair.
        misses:
          - index: 2
            explanation: >-
              This is the first `t`. With `i` at 2 the test compares `t` with `i` and fails. The
              pair is found once `i` reaches the second `t` and looks back.
          - index: 4
            explanation: >-
              The function returns at the first equal pair, before `i` reaches index 4.
        elsewhere: The first equal pair is `tt`, found when `i` names the second `t`, index 3.

  - format: step-trace
    id: trace-swap-inward
    heading: Follow the pointers
    tags: [arrays-strings, two-pointers]
    workedExample: |-
      Consider `b = [3, 5]` with `i = 0` and `j = 1`. `b[i], b[j] = b[j], b[i]` reads both values
      on the right first, then writes them into the two cells on the left.

      1. The right side reads `b[1]` and `b[0]`, which are `5` and `3`.
      2. Then `b[0]` gets `5` and `b[1]` gets `3`, so `b` is `[5, 3]`. Both cells changed.
      3. `i += 1` and `j -= 1` make `i` 1 and `j` 0. `i < j` is now false, so a loop with that
         test stops.
    prompt: >-
      `i` and `j` are pointers: indices kept in variables that move along the list. Line 4 swaps
      two cells: Python reads both values on the right first, then writes them into the cells on
      the left. The cells show `a` before the loop. Predict each step before it is shown.
    code: |
      a = [7, 1, 9, 4, 6]
      i, j = 0, len(a) - 1
      while i < j:
          a[i], a[j] = a[j], a[i]
          i += 1
          j -= 1
    sequence:
      kind: array
      name: a
      cells: [7, 1, 9, 4, 6]
    start:
      - { name: i, at: 0 }
      - { name: j, at: 4 }
    steps:
      - line: 4
        ask: Line 4 runs on the first pass. What does `a` hold now?
        options:
          - id: swapped
            text: "`[6, 1, 9, 4, 7]`"
            explanation: >-
              The values at indices 0 and 4 trade places. The cells between them are not touched.
          - id: one-write
            text: "`[6, 1, 9, 4, 6]`"
            explanation: >-
              That writes only `a[0]`. Both cells are on the left of `=`, so both are written, and
              `a[4]` gets the old `7`.
          - id: neighbors
            text: "`[1, 7, 9, 4, 6]`"
            explanation: >-
              That swaps the first two cells. Line 4 swaps the cells `i` and `j` name, indices 0
              and 4.
        correct: swapped
      - line: 5
        ask: Lines 5 and 6 run. Tap the cell `j` names now.
        pointer: j
        correct: 3
        explanation: >-
          `j -= 1` moves `j` one cell left, from 4 to 3, while `i += 1` moves `i` from 0 to 1.
        misses:
          - index: 4
            explanation: '`j -= 1` subtracts 1, so `j` moves one cell left, from 4 to 3.'
          - index: 1
            explanation: That is where `i` moves. `j` comes in from the right end.
        elsewhere: '`j` starts at 4 and `j -= 1` moves it one cell left, to 3.'
        also:
          - { name: i, at: 1 }
      - line: 4
        ask: The second pass swaps indices 1 and 3, then moves both pointers. Tap the cell `i` names when it ends.
        pointer: i
        correct: 2
        explanation: >-
          `i += 1` moves `i` from 1 to 2, and `j -= 1` moves `j` from 3 to 2. Both pointers now
          name the middle cell.
        misses:
          - index: 1
            explanation: '`i` was 1 during the second pass, and line 5 moves it on to 2.'
          - index: 3
            explanation: That is where `j` was during the second pass. `i` moves right, from 1 to 2.
        elsewhere: '`i` was 1 on the second pass, and `i += 1` moves it to 2.'
        also:
          - { name: j, at: 2 }
      - line: 3
        ask: Line 3 tests `i < j` with both pointers on index 2. What happens?
        options:
          - id: stops
            text: The loop stops, and `a` is `[6, 4, 9, 1, 7]`
            explanation: >-
              `2 < 2` is false, so the loop ends. The middle cell has no partner, and `a` is now
              reversed.
          - id: third-pass
            text: A third pass swaps index 2 with itself
            explanation: That would need `i <= j`. With `<`, the test `2 < 2` is false.
          - id: one-pass
            text: The loop stops, and `a` is `[6, 1, 9, 4, 7]`
            explanation: >-
              That is `a` after one pass. The second pass also swapped indices 1 and 3, so `1`
              and `4` traded places.
        correct: stops

  - format: drag-pointers
    id: slice-bounds
    heading: Which cells does the slice copy?
    tags: [arrays-strings]
    workedExample: |-
      Consider `nums = [10, 20, 30, 40, 50]` and the slice `nums[1:3]`. A slice copies from the
      start index up to, but not including, the stop index.

      1. The start is 1, so the first item copied is `nums[1]`, which is `20`.
      2. The stop is 3, and it is left out, so the last index copied is 2, which holds `30`.
      3. So `nums[1:3]` is `[20, 30]`, a new list of `3 - 1 = 2` items, and `nums` itself does
         not change.
    prompt: >-
      `word[start:stop]` is a slice: a new string holding the characters from index `start` up to,
      but not including, index `stop`. A slice of a string is called a substring, and a slice of a
      list is a new list. Leaving out `start` begins at 0, and leaving out `stop` runs to the end.
      Drag `first` onto the first cell `word[2:5]` copies and `last` onto the last one.
    code: |
      word = "planets"
      part = word[2:5]
    sequence:
      kind: string
      name: word
      cells: [p, l, a, n, e, t, s]
    pointers:
      - name: first
        start: 0
        correct: 2
        explanation: The slice starts at its start index, 2, which holds `a`.
        misses:
          - index: 1
            explanation: Index 1 holds `l`. A slice starts at the start index itself, which is 2.
          - index: 3
            explanation: The slice includes its start index, so index 2 is copied too.
        elsewhere: '`word[2:5]` starts at index 2, the `a`.'
      - name: last
        start: 6
        correct: 4
        explanation: >-
          The stop, 5, is left out, so the last character copied is at index 4, the `e`. `part` is
          `"ane"`.
        misses:
          - index: 5
            explanation: >-
              Index 5 is the stop, and a slice ends just before it. The last character copied is
              at index 4.
          - index: 3
            explanation: Index 4 is below the stop, 5, so it is copied too. Only the stop is left out.
        elsewhere: The last cell copied is index 4, one before the stop.

  - id: string-write
    heading: What does this print?
    tags: [arrays-strings]
    workedExample: |-
      Consider `word = "mild"`. To change one letter, copy the letters into a list, change the
      list, then join it back into a string.

      1. `chars = list(word)` builds a new list, `['m', 'i', 'l', 'd']`.
      2. `chars[0] = "w"` replaces index 0 of that list, so `chars` is `['w', 'i', 'l', 'd']`.
         `word` is a separate string, and it is still `"mild"`.
      3. `"".join(chars)` glues the four letters into `"wild"`.
    prompt: |-
      A string can't be changed once it is made: `s[0] = "b"` raises `TypeError`. `list(s)`
      builds a new list holding the characters of `s`, and `"".join(chars)` glues the strings in
      a list into one string. What does this print?

      ```python
      s = "cat"
      chars = list(s)
      chars[0] = "b"
      print(s, "".join(chars))
      ```
    options:
      - id: copy
        text: "`cat bat`"
        explanation: >-
          `list(s)` copies the three letters into a new list, and the write changes that list. The
          string `s` cannot change, so it still prints `cat`, and joining the list gives `bat`.
      - id: shared
        text: "`bat bat`"
        explanation: >-
          That would need `chars` and `s` to be one object. They are not even the same type: one is
          a list and the other is a string.
      - id: type-error
        text: Raises `TypeError`
        explanation: >-
          Writing into a string fails, but `chars` came from `list(s)`. Look at what type `chars`
          is before deciding whether the write is allowed.
    correct: copy
    followUps:
      shared:
        prompt: Does `chars = list(s)` make `chars` and `s` one object?
        options:
          - id: new-list
            text: No, it builds a new list holding the letters
          - id: same
            text: Yes, `chars` and `s` are the same object
          - id: until-print
            text: Yes, until `s` is printed
        correct: new-list
        explanation: >-
          `list(s)` makes a fresh list and puts each character in it. A string never changes after
          it is made, so no write to `chars` can reach `s`.
      type-error:
        prompt: Which of these raises `TypeError`?
        options:
          - id: string
            text: '`s[0] = "b"` when `s` is a string'
          - id: list
            text: '`chars[0] = "b"` when `chars` is a list'
          - id: both
            text: Both of them
        correct: string
        explanation: >-
          Strings can't be changed, so writing one character of a string fails. A list of
