id: arrays-and-strings
title: Arrays and strings
description: Read a position, trace a scan, and tell a copy from a shared list. Each card opens with a worked example, then asks for one decision.
heading: What does this give?

questions:
  - id: index-versus-value
    tags: [arrays-strings]
    prompt: |-
      **Worked example:** `scores = [70, 85, 92]` has positions 0, 1 and 2. `scores[1]` reads
      position 1 and gives the value `85`.

      Now `nums = [3, 0, 1, 2]`. What is `nums[1]`?
    options:
      - id: zero
        text: "`0`"
        explanation: >-
          Position 1 is the second slot of `nums`, and it holds `0`. The number in the brackets
          says where to look, and the result is whatever is stored there.
      - id: three
        text: "`3`"
        explanation: >-
          `3` is the first item of `nums`. Python counts positions from 0, so position 1 is the
          item after it.
      - id: two
        text: "`2`"
        explanation: >-
          `2` is where the value `1` sits, which is what `nums.index(1)` returns. Square brackets
          work the other way round.
      - id: one
        text: "`1`"
        explanation: >-
          This reads `[1]` as naming the value `1`. The brackets name a slot, and they do not
          depend on which values the list holds.
    correct: zero
    followUps:
      three:
        prompt: A Python list holds four items. Which positions does it have?
        options:
          - id: from-zero
            text: 0, 1, 2 and 3
          - id: from-one
            text: 1, 2, 3 and 4
          - id: both-ends
            text: 0, 1, 2, 3 and 4
        correct: from-zero
        explanation: >-
          Positions start at 0, so the last one is the length minus one. That makes position 1
          the second item, not the first.
      two:
        prompt: In `nums[1]`, what does the `1` ask for?
        options:
          - id: slot
            text: The item stored at position 1
          - id: search
            text: The position where the value 1 is stored
          - id: first
            text: The first item, since lists count from 1
        correct: slot
        explanation: >-
          Brackets take a position and hand back the value in that slot. To go from a value to
          its position, call `nums.index(value)`.
      one:
        prompt: "`nums = [3, 0, 1, 2]` holds the value `1` at position 2. Which expression gives `1`?"
        options:
          - id: slot-two
            text: "`nums[2]`"
          - id: slot-one
            text: "`nums[1]`"
          - id: slot-three
            text: "`nums[3]`"
        correct: slot-two
        explanation: >-
          To read a value you name its slot. The value 1 is in slot 2, so `nums[2]` gives `1`,
          and `nums[1]` gives what slot 1 holds, which is `0`.

  - id: last-position
    tags: [arrays-strings]
    prompt: |-
      **Worked example:** `word = "drill"` has 5 characters, at positions 0 to 4. Its last
      character is `word[4]`, which can also be written `word[-1]`.

      Now `code = "zip"`. What does `code[len(code)]` give?
    options:
      - id: last-char
        text: "`'p'`"
        explanation: >-
          `'p'` is the last character, but `len(code)` is 3. Counting from 0, a length of 3 does
          not name the last character.
      - id: empty
        text: "`''`, an empty string"
        explanation: >-
          That is how a slice behaves when it starts past the end. Reading one position is
          stricter than slicing.
      - id: none
        text: "`None`"
        explanation: >-
          Python has no placeholder value for a missing position. Reading one that does not exist
          stops with an error instead of handing something back.
      - id: index-error
        text: Raises `IndexError`
        explanation: >-
          `code` has positions 0, 1 and 2, and `len(code)` is 3, one past the last. Reading a
          position that does not exist raises `IndexError`. The last character is
          `code[len(code) - 1]`, or `code[-1]`.
    correct: index-error
    followUps:
      last-char:
        prompt: "`code = \"zip\"` has length 3. Which expression reads its last character?"
        options:
          - id: two
            text: "`code[2]`"
          - id: three
            text: "`code[3]`"
          - id: one
            text: "`code[1]`"
        correct: two
        explanation: >-
          Positions run from 0 to the length minus one, so the last is 2 for a three-letter
          string. `code[-1]` reads the same slot.
      empty:
        prompt: "`t = \"ok\"`. Which of these gives `''` instead of an error?"
        options:
          - id: slice
            text: "`t[2:]`"
          - id: index
            text: "`t[2]`"
          - id: negative
            text: "`t[-3]`"
        correct: slice
        explanation: >-
          A slice is clipped to the string's bounds, so `t[2:]` is `''`. An index is not clipped:
          `t[2]` and `t[-3]` both raise `IndexError`.
      none:
        prompt: "`nums = [5, 8]`. What happens on `nums[2]`?"
        options:
          - id: error
            text: Python raises `IndexError`
          - id: none
            text: It returns `None`
          - id: last
            text: It returns `8`, the last item
        correct: error
        explanation: >-
          Positions 0 and 1 exist and 2 does not, so the read fails. Code that might read past the
          end has to check the length first.

  - id: empty-position
    heading: Which guard works?
    tags: [arrays-strings]
    prompt: |-
      **Worked example:** `s = ""` has length 0, so it has no positions at all. `s[0]` and `s[-1]`
      both raise `IndexError`.

      The line below must not crash when `s` is empty. Which guard works?

      ```python
      if ???:
          last = s[-1]
      ```
    options:
      - id: truthy
        text: "`if s:`"
        explanation: >-
          An empty string is falsy and every other string is truthy. The body runs only when `s`
          has at least one character, which is exactly when position -1 exists.
      - id: reads-first
        text: "`if s[-1]:`"
        explanation: >-
          The guard itself reads `s[-1]`, so on an empty string it fails before it can protect the
          line below.
      - id: length-zero
        text: "`if len(s) >= 0:`"
        explanation: >-
          Every length is at least 0, including the empty string's, so this guard is always true
          and lets the empty case through.
      - id: not-none
        text: "`if s is not None:`"
        explanation: >-
          An empty string is a real string object, not `None`, so this test passes and the read
          still fails.
    correct: truthy
    followUps:
      reads-first:
        prompt: "`s = \"\"`. What does evaluating `s[-1]` do?"
        options:
          - id: raises
            text: Raises `IndexError`
          - id: falsy
            text: Gives `''`, which is falsy, so the body is skipped
          - id: none
            text: Gives `None`, which is falsy, so the body is skipped
        correct: raises
        explanation: >-
          An empty string has no position -1, so the read fails. A condition is evaluated like any
          other expression, so it must not do the risky read itself.
      length-zero:
        prompt: For which lengths is `s[-1]` safe?
        options:
          - id: one-plus
            text: 1 or more
          - id: zero-plus
            text: 0 or more
          - id: two-plus
            text: 2 or more, so that first and last differ
        correct: one-plus
        explanation: >-
          `s[-1]` needs at least one character. A one-letter string is fine: its first and last
          character are the same slot. `len(s) > 0` and plain `if s:` both say the same thing.
      not-none:
        prompt: "`s = \"\"`. What is `s is None`?"
        options:
          - id: is-false
            text: "`False`"
          - id: is-true
            text: "`True`"
          - id: error
            text: It raises an error
        correct: is-false
        explanation: >-
          `""` and `None` are different objects. Empty means a string of length 0, and `None` means
          no value at all, so a guard against one does not cover the other.

  - id: substring-versus-subsequence
    heading: Which one fits?
    tags: [arrays-strings]
    prompt: |-
      **Worked example:** in `"planet"`, `"lan"` is a **substring**: its letters sit next to each
      other. `"pnt"` is only a **subsequence**: its letters appear in order, with gaps between them.

      Which of these is a subsequence of `"stream"` but **not** a substring?
    options:
      - id: seam
        text: '`"seam"`'
        explanation: >-
          `s`, `e`, `a` and `m` appear in that order in `"stream"`, at positions 0, 3, 4 and 5.
          The jump from 0 to 3 means they are not next to each other.
      - id: tre
        text: '`"tre"`'
        explanation: >-
          `"tre"` sits at positions 1, 2 and 3 with no gaps, so it is a substring. The question
          asks for one that is not.
      - id: mast
        text: '`"mast"`'
        explanation: >-
          Every letter of `"mast"` is in `"stream"`, but not in that order: the `m` comes last in
          `"stream"`. Having the letters somewhere is not enough.
      - id: seem
        text: '`"seem"`'
        explanation: >-
          `"seem"` needs two `e`s after the `s`, and `"stream"` has only one `e`.
    correct: seam
    followUps:
      tre:
        prompt: '`"tre"` sits at positions 1, 2 and 3 of `"stream"`. What is it?'
        options:
          - id: both
            text: Both a substring and a subsequence
          - id: substring-only
            text: Only a substring
          - id: subsequence-only
            text: Only a subsequence
        correct: both
        explanation: >-
          Every substring is also a subsequence: adjacent letters are in order, with gaps of zero.
          The question wanted letters in order that are not all adjacent.
      mast:
        prompt: 'Is `"ts"` a subsequence of `"stream"`?'
        options:
          - id: no-order
            text: No, because a subsequence must keep the letters' order
          - id: yes-present
            text: Yes, because both letters appear
          - id: yes-adjacent
            text: Yes, because the two letters are next to each other
        correct: no-order
        explanation: >-
          A subsequence picks letters from left to right. `"ts"` would need an `s` somewhere after
          the `t` at position 1, and there is none.
      seem:
        prompt: '`"stream"` has one `e`. Can a subsequence use it twice, as `"seem"` would need?'
        options:
          - id: once
            text: No, each position can be used at most once
          - id: reuse
            text: Yes, as long as the order is kept
          - id: adjacent
            text: Yes, if the two copies would sit next to each other
        correct: once
        explanation: >-
          A subsequence is made by deleting letters, never by repeating them. Two `e`s in the
          pattern need two `e`s in the text.

  - id: repeated-letters
    heading: What does this scan leave behind?
    tags: [arrays-strings]
    prompt: |-
      **Worked example:** `"letter".index("t")` is `2`. The search stops at the first `t`, even
      though another one sits at position 3.

      What is `last` after this loop?

      ```python
      word = "pepper"
      last = -1
      for i in range(len(word)):
          if word[i] == "p":
              last = i
      ```
    options:
      - id: last-match
        text: "`3`"
        explanation: >-
          The loop visits all six positions. `p` appears three times, and each match replaces
          `last`, so it ends on the final match.
      - id: first-match
        text: "`0`"
        explanation: >-
          `0` is the first match, which is what `"pepper".index("p")` would give. This loop is not
          `.index`, so trace what happens after that first match.
      - id: one-based
        text: "`4`"
        explanation: >-
          The last `p` is the fourth character, and `4` counts it from 1. `i` comes from
          `range(len(word))`, which starts at 0.
      - id: all-matches
        text: "`[0, 2, 3]`"
        explanation: >-
          Those are the positions the `if` accepts, but `last` is a single name, not a list.
          Nothing in the loop collects them.
    correct: last-match
    followUps:
      first-match:
        prompt: Does this loop stop when it finds the first `p`?
        options:
          - id: no-stop
            text: No, nothing in the loop body ends it early
          - id: if-stops
            text: Yes, the `if` ends the loop once it is true
          - id: assign-stops
            text: Yes, assigning to `last` ends the loop
        correct: no-stop
        explanation: >-
          Only `break` or `return` leaves a loop early. Without one the loop keeps going, and every
          later `p` overwrites `last`.
      one-based:
        prompt: Which positions of `"pepper"` hold a `p`?
        options:
          - id: zero-based
            text: 0, 2 and 3
          - id: shifted
            text: 1, 3 and 4
          - id: missed-double
            text: 0 and 2 only
        correct: zero-based
        explanation: >-
          Counting from 0, p-e-p-p-e-r puts a `p` at 0, then 2 and 3 back to back. The fourth
          character sits at position 3.
      all-matches:
        prompt: "`last = i` runs with `i` equal to 0, then 2, then 3. What does `last` hold afterwards?"
        options:
          - id: replaced
            text: Only `3`, since each assignment replaces the old value
          - id: all
            text: All three values, in order
          - id: total
            text: Their total, `5`
        correct: replaced
        explanation: >-
          A plain variable holds one value at a time. Collecting every match needs a list and
          `append`.

  - id: one-in-place-write
    heading: What does this print?
    tags: [arrays-strings]
    prompt: |-
      **Worked example:** after `a = [1, 2, 3]` and `b = a`, the write `b[0] = 9` changes the one
      list both names point to, so `a` becomes `[9, 2, 3]`.

      What does this print?

      ```python
      a = [5, 6, 7]
      b = a[1:]
      b[0] = 0
      print(a, b)
      ```
    options:
      - id: copy
        text: "`[5, 6, 7] [0, 7]`"
        explanation: >-
          `a[1:]` builds a new list from position 1 onward. The write changes slot 0 of that new
          list only, so `a` keeps all three of its values.
      - id: view
        text: "`[5, 0, 7] [0, 7]`"
        explanation: >-
          That would be right if `b` were a second name for `a`, as in the worked example. Here `b`
          comes from a slice, not from `b = a`.
      - id: skip-first
        text: "`[5, 6, 7] [0]`"
        explanation: >-
          This drops one item too many from the front of `b`. Check which position `a[1:]` starts
          at.
      - id: insert
        text: "`[5, 6, 7] [0, 6, 7]`"
        explanation: >-
          Count how many items `b` holds before and after the write. Writing to a position does not
          change a list's length.
    correct: copy
    followUps:
      view:
        prompt: After `b = a[1:]`, do `a` and `b` refer to the same list?
        options:
          - id: separate
            text: No, the slice is a separate new list
          - id: window
            text: Yes, a slice is a window onto `a`
          - id: until-change
            text: Yes, until `a` itself changes
        correct: separate
        explanation: >-
          Slicing a Python list copies the chosen items into a new list, so a write to one never
          reaches the other. Other representations differ: a basic NumPy slice is a view that
          shares memory.
      skip-first:
        prompt: "`a = [5, 6, 7]`. What is `a[1:]`?"
        options:
          - id: from-one
            text: "`[6, 7]`"
          - id: after-one
            text: "`[7]`"
          - id: before-one
            text: "`[5, 6]`"
        correct: from-one
        explanation: >-
          A slice includes its start index, so `a[1:]` starts at position 1, the `6`, and runs to
          the end.
      insert:
        prompt: "`b = [6, 7]`. What is `b` after `b[0] = 0`?"
        options:
          - id: replaced
            text: "`[0, 7]`"
          - id: inserted
            text: "`[0, 6, 7]`"
          - id: whole
            text: "`[0]`"
        correct: replaced
        explanation: >-
          Assigning to `b[0]` replaces the item in slot 0 and keeps the length. Adding an item at
          the front takes `b.insert(0, x)`.

  - id: string-write
    heading: What does this print?
    tags: [arrays-strings]
    prompt: |-
      **Worked example:** with `s = "cat"`, the line `s[0] = "b"` raises `TypeError`, because a
      Python string cannot be changed in place. To edit one letter, copy the letters into a list.

      What does this print?

      ```python
      s = "cat"
      chars = list(s)
      chars[0] = "b"
      print(s, "".join(chars))
      ```
    options:
      - id: copy
        text: "`cat bat`"
        explanation: >-
          `list(s)` copies the three letters into a new list, and the write changes that list. The
          string `s` cannot change, so it still prints `cat`, and joining the list gives `bat`.
      - id: shared
        text: "`bat bat`"
        explanation: >-
          That would need `chars` and `s` to be one object. They are not even the same type: one is
          a list and the other is a string.
      - id: type-error
        text: Raises `TypeError`
        explanation: >-
          The worked example's error came from writing into a string. Look at what `chars` is
          before deciding whether the write is allowed.
    correct: copy
    followUps:
      shared:
        prompt: Does `chars = list(s)` give `s` a second name, the way `b = a` does?
        options:
          - id: new-list
            text: No, it builds a new list holding the letters
          - id: same
            text: Yes, `chars` and `s` are the same object
          - id: until-print
            text: Yes, until `s` is printed
        correct: new-list
        explanation: >-
          `list(s)` makes a fresh list and puts each character in it. A string never changes after
          it is made, so no write to `chars` can reach `s`.
      type-error:
        prompt: Which of these raises `TypeError`?
        options:
          - id: string
            text: '`s[0] = "b"` when `s` is a string'
          - id: list
            text: '`chars[0] = "b"` when `chars` is a list'
          - id: both
            text: Both of them
        correct: string
        explanation: >-
          Strings are immutable, so item assignment on a string fails. A list of characters is an
          ordinary list, and any one of its slots can be replaced.
