id: bst-order-checkpoint
title: 'BST order: checkpoint'
description: Validate a fresh tree against inherited bounds and find the lowest common ancestor of two values.
heading: Use the order

questions:
  - id: bst-order-exam-deep-violation
    format: tap-cell
    heading: Which node breaks the rule?
    tags: [tree, recursion]
    prompt: |-
      All values are distinct. Every left child below is smaller than its parent and every right child
      is larger, but the tree is not a BST.

      ```text
                47
              /    \
            23      71
           /  \    /  \
          12  35  59   88
             /  \
            29   51
      ```

      Tap the node that does not fit one of its ancestors.
    code: |
      def valid(node, low, high):
          if node is None:
              return True
          if not low < node.val < high:
              return False
          return (valid(node.left, low, node.val)
                  and valid(node.right, node.val, high))
    sequence:
      kind: array
      name: nodes
      cells: [47, 23, 71, 12, 35, 59, 88, 29, 51]
    correct: 8
    explanation: >-
      51 is larger than its parent 35 and larger than 23, so the nearer checks pass. It is also in 47's
      left subtree, so it must be smaller than 47. Its call gets the range (35, 47), and 51 is outside it.
    misses:
      - index: 0
        explanation: 47 is the root, so nothing limits it.
      - index: 1
        explanation: 23 is in 47's left subtree and smaller than 47. Its range is (-inf, 47), and 23 fits.
      - index: 2
        explanation: 71 is in 47's right subtree and larger than 47. Its range is (47, inf), and 71 fits.
      - index: 3
        explanation: 12 must be smaller than 23 and 47. Its range is (-inf, 23), and 12 fits.
      - index: 4
        explanation: 35 must be larger than 23 and smaller than 47. Its range is (23, 47), and 35 fits.
      - index: 5
        explanation: 59 must be larger than 47 and smaller than 71. Its range is (47, 71), and 59 fits.
      - index: 6
        explanation: 88 must be larger than 47 and 71. Its range is (71, inf), and 88 fits.
      - index: 7
        explanation: >-
          29 is 35's left child, 23's right descendant and in 47's left subtree. Its range is (23, 35),
          and 29 fits.

  - id: bst-order-exam-dropped-bound
    heading: Which tree slips through?
    tags: [tree, recursion]
    prompt: |-
      This version is meant to check that a tree with distinct values is a BST. It is called as
      `valid(root, float('-inf'), float('inf'))`.

      ```python
      def valid(node, low, high):
          if node is None:
              return True
          if not low < node.val < high:
              return False
          return (valid(node.left, float('-inf'), node.val)
                  and valid(node.right, node.val, high))
      ```

      Which tree does it wrongly accept?
    options:
      - id: right-then-left
        text: "`TreeNode(20, None, TreeNode(40, TreeNode(10)))`"
        explanation: >-
          The left call passes `float('-inf')` instead of `low`, so the call on 10 gets (-inf, 40) and
          10 fits. But 10 is in 20's right subtree and must exceed 20. The lower bound from 20 was
          dropped on the way down.
      - id: left-then-right
        text: "`TreeNode(20, TreeNode(10, None, TreeNode(30)))`"
        explanation: >-
          The right call keeps `high`, so the call on 30 gets (10, 20). 30 is outside it, and the
          function returns `False`, which is correct: 30 is in 20's left subtree.
      - id: right-then-right
        text: "`TreeNode(20, TreeNode(10), TreeNode(40, None, TreeNode(30)))`"
        explanation: >-
          The call on 30 is a right call from 40 and gets (40, inf). 30 is outside it, so the function
          returns `False`, which is correct.
      - id: real-bst
        text: "`TreeNode(20, TreeNode(10), TreeNode(40, TreeNode(30)))`"
        explanation: >-
          This one is a BST: 30 is in 20's right subtree and 40's left subtree, and it lies between them.
          The function accepts it, and that is right.
    correct: right-then-left
    followUps:
      left-then-right:
        prompt: Which bound does a right call in this version still inherit from above?
        options:
          - { id: keeps-high, text: "The upper one: `high` is passed down unchanged" }
          - { id: keeps-none, text: "Neither; both bounds are reset on every call" }
          - { id: keeps-low, text: "The lower one: `low` is passed down unchanged" }
        correct: keeps-high
        explanation: >-
          Only the left call is broken. A right call sets `low` to the node and keeps `high`, so a value
          that is too large is still caught. A value that is too small after a turn to the left is not.
      right-then-right:
        prompt: What range does the call on 30 receive here?
        options:
          - { id: forty-up, text: "Above 40, with no upper limit" }
          - { id: twenty-forty, text: "Between 20 and 40" }
          - { id: below-forty, text: "Below 40, with no lower limit" }
        correct: forty-up
        explanation: >-
          30 is a right child, and right calls work correctly in this version. 30 is not above 40, so it
          is rejected. The broken line only matters after a step to the left.
      real-bst:
        prompt: Is `TreeNode(20, TreeNode(10), TreeNode(40, TreeNode(30)))` a BST?
        options:
          - { id: yes, text: "Yes; 30 is above 20 and below 40, which is all its ancestors require" }
          - { id: no-thirty, text: "No; 30 is smaller than its parent, 40" }
          - { id: no-shape, text: "No; 40 has a left child but no right child" }
        correct: yes
        explanation: >-
          Accepting a real BST is not a mistake. The question asks for a tree the function accepts even
          though it breaks the rule.

  - id: bst-order-exam-target-ancestor
    format: tap-cell
    heading: Which node is the lowest common ancestor?
    tags: [tree, binary-search]
    prompt: |-
      The lowest common ancestor of two values is the lowest node with both of them in its subtree, and a
      node counts as being in its own subtree.

      ```text
                58
              /    \
            31      74
           /  \       \
          19   44      90
              /  \
            37    50
                 /
               47
      ```

      Tap the lowest common ancestor of 47 and 44.
    code: |
      def lca(node, p, q):
          while node is not None:
              if p < node.val and q < node.val:
                  node = node.left
              elif p > node.val and q > node.val:
                  node = node.right
              else:
                  return node
    sequence:
      kind: array
      name: nodes
      cells: [58, 31, 74, 19, 44, 90, 37, 50, 47]
    correct: 4
    explanation: >-
      Both values are smaller than 58, so the walk goes left to 31. Both are larger than 31, so it goes
      right to 44. 44 is one of the targets and 47 is below it, so 44 is the answer.
    misses:
      - index: 0
        explanation: 58 holds both, but both values are smaller than 58, so a lower node holds both too.
      - index: 1
        explanation: 31 holds both, but both values are larger than 31, so both are in its right subtree.
      - index: 2
        explanation: 74 is in 58's right subtree. Both values are smaller than 58, so neither is there.
      - index: 3
        explanation: 19 is 31's left child. Both values are larger than 31, so neither is under 19.
      - index: 5
        explanation: 90 is in 58's right subtree, where neither value is.
      - index: 6
        explanation: 37 is 44's left child. 47 is larger than 44, so it is not under 37, and neither is 44.
      - index: 7
        explanation: 50 is 47's parent, but 44 is above 50. The answer has to hold 44 as well.
      - index: 8
        explanation: 47 is one target, but 44 is above it, not below. The answer has to hold both.

  - id: bst-order-exam-or-split
    heading: What does the faulty walk return?
    tags: [tree, binary-search]
    prompt: |-
      This version uses `or` where the correct one uses `and`.

      ```python
      def lca(node, p, q):
          while node is not None:
              if p < node.val or q < node.val:
                  node = node.left
              elif p > node.val or q > node.val:
                  node = node.right
              else:
                  return node
          return None
      ```

      ```text
                58
              /    \
            31      74
           /  \       \
          19   44      90
              /  \
            37    50
      ```

      What does `lca(root, 37, 74)` return, and what is the correct answer?
    options:
      - id: none-58
        text: It returns `None`, but the answer is 58
        explanation: >-
          At 58, 37 is smaller, so the `or` sends the walk left even though 74 is on the right. From
          there it goes right at 31, left at 44, and right at 37, falling off the tree. The answer is
          58, where the two values part.
      - id: same-58
        text: It returns 58, which is also the answer
        explanation: >-
          The first test asks whether either value is smaller than 58. 37 is, so the walk leaves 58
          before it can return it.
      - id: thirty-seven
        text: It returns 37, but the answer is 58
        explanation: >-
          The walk does reach 37, but 74 is larger, so the second test sends it right to 37's empty
          slot. The loop ends and the function returns `None`.
      - id: forty-four
        text: It returns 44, but the answer is 58
        explanation: >-
          At 44, 37 is smaller, so the first test moves the walk left again. With `or`, one value on
          either side of a node is enough to move past it.
    correct: none-58
    followUps:
      same-58:
        prompt: At 58, is `p < node.val or q < node.val` true?
        options:
          - { id: true-37, text: "Yes; 37 is below 58, and one true side is enough for `or`" }
          - { id: false-74, text: "No; 74 is above 58, so the test fails" }
          - { id: equal, text: "No; the test only matters when a value equals 58" }
        correct: true-37
        explanation: >-
          `or` needs just one side. The correct version uses `and` so the walk moves only when both
          values are on the same side, and stops where they split.
      thirty-seven:
        prompt: At 37, with `p = 37` and `q = 74`, which branch runs?
        options:
          - { id: elif-right, text: "The `elif`, since 74 is above 37, so the walk moves right" }
          - { id: else-return, text: "The `else`, since `p` equals 37, so it returns 37" }
          - { id: if-left, text: "The first `if`, since 37 is not above 37" }
        correct: elif-right
        explanation: >-
          The `else` runs only when neither test holds. With `or`, any value on one side is enough to
          move, so a node equal to `p` is passed by when `q` differs.
      forty-four:
        prompt: When can this version reach its `return node` line?
        options:
          - { id: both-equal, text: "Only at a node equal to both `p` and `q`" }
          - { id: one-equal, text: "At any node equal to `p` or to `q`" }
          - { id: split, text: "At the node where the two values go different ways" }
        correct: both-equal
        explanation: >-
          With `or`, a node is left whenever either value differs from it. For two different values the
          walk never stops on a node and ends at `None`.

  - id: bst-order-exam-bounds-check
    heading: What must each call receive?
    tags: [tree, dfs, recursion]
    prompt: |-
      In this tree all values are distinct, and at every node the whole left subtree must be smaller
      and the whole right subtree larger. The function below returns `True` for
      `TreeNode(30, TreeNode(12), TreeNode(45, TreeNode(18), TreeNode(60)))`, but the 18 sits in the
      right subtree of the 30, so the tree is not a BST.

      ```python
      def looks_like_bst(node):
          if node is None:
              return True
          if node.left and node.left.val >= node.val:
              return False
          if node.right and node.right.val <= node.val:
              return False
          return looks_like_bst(node.left) and looks_like_bst(node.right)
      ```

      What extra information should each recursive call receive to be correct for every tree?
    options:
      - id: nothing-more
        text: Nothing; comparing each node with its children already checks the whole tree
        explanation: >-
          The sample tree shows otherwise: the 18 is smaller than its parent 45, so that comparison
          passes, but it is also in the right subtree of the 30 and must exceed 30. A parent-child
          comparison never sees an ancestor that is further up.
      - id: root-value
        text: The root's value, so every node is also compared with the root
        explanation: >-
          This catches the sample, but it only looks at the top of the tree. In
          `TreeNode(30, TreeNode(14, None, TreeNode(22, TreeNode(9))))` the 9 passes the parent check
          (9 < 22) and the root check (9 < 30), and the tree is still not a BST.
      - id: sibling-value
        text: The sibling's value, so the left child must also be smaller than the right child
        explanation: >-
          Siblings are not what the rule is about. The sample passes this extra test too: 12 < 45 at
          the root and 18 < 60 below it. The rule links a node with every node in its subtrees, not
          with its sibling.
      - id: low-high
        text: A (low, high) range that narrows as the call goes left or right
        explanation: >-
          Pass `low` and `high` down: going left sets `high` to the current value, going right sets
          `low`, and every node must satisfy `low < val < high`. In the sample the 18 arrives with the
          range (30, 45) and fails. Equivalently, an inorder traversal of a valid BST with distinct
          values is strictly increasing, and the sample's is `[12, 30, 18, 45, 60]`.
    correct: low-high
    followUps:
      nothing-more:
        prompt: >-
          The 18 is a left child of the 45 and passes the check. Which BST rule does it break?
        options:
          - id: whole-subtree
            text: Every value in a node's right subtree must exceed the node, and 18 is in the right subtree of 30
          - id: complete
            text: A BST must have every level full, and this tree does not
          - id: bigger-than-parent
            text: Every node must be larger than its parent, and 18 is not
        correct: whole-subtree
        explanation: >-
          The rule covers a node's entire subtree, not just its direct children. A left child is
          allowed to be smaller than its parent (the 12 under the 30 is), and a BST does not have to be
          full or balanced.
      root-value:
        prompt: >-
          In `TreeNode(30, TreeNode(14, None, TreeNode(22, TreeNode(9))))` the 9 passes its parent
          check and the root check. Which ancestor does it violate?
        options:
          - id: the-fourteen
            text: The 14, because the 9 is in the right subtree of the 14 and must be larger than 14
          - id: the-twenty-two
            text: The 22, because a left child must be larger than its parent
          - id: none
            text: None, because 9 < 30 puts it correctly in the left half of the tree
        correct: the-fourteen
        explanation: >-
          Every ancestor sets a limit, not only the root. With bounds, the 22 is called with the range
          (14, 30) and the 9 with (14, 22), so `9 <= 14` fails. A left child smaller than its parent
          (9 < 22) is allowed.
      sibling-value:
        prompt: >-
          The sample's inorder traversal is `[12, 30, 18, 45, 60]`. Which two adjacent entries of that
          list show that the tree is not a BST?
        options:
          - id: thirty-eighteen
            text: 30 then 18, which goes down; the inorder list of a BST must be strictly increasing
          - id: eighteen-fortyfive
            text: 18 then 45, because a left child must be larger than its parent
          - id: none
            text: None; inorder order depends on the tree's shape, so a dip proves nothing
        correct: thirty-eighteen
        explanation: >-
          Inorder visits a valid BST in increasing order whatever its shape, so any step down exposes a
          violation. The 30 followed by the 18 is exactly the node that ended up on the wrong side of
          the root. Whether two siblings happen to be in order proves nothing about the rest.

  - id: bst-order-exam-lca-approach
    heading: Which technique fits?
    tags: [tree, binary-search, complexity]
    prompt: |-
      In a binary search tree with distinct values, `p` and `q` both exist in the tree. Their lowest
      common ancestor is the lowest node with both in its subtree, and a node counts as being in its
      own subtree. Example:
      `TreeNode(40, TreeNode(20, TreeNode(10), TreeNode(30, TreeNode(25), TreeNode(35))), TreeNode(60, TreeNode(50), TreeNode(70)))`.
      For `p = 25` and `q = 70` it is 40. Which approach uses the ordering to find it in O(h) time,
      where `h` is the height of the tree?
    options:
      - id: two-paths
        text: Search the whole tree for the path to `p` and the path to `q`, then compare them
        explanation: >-
          This returns the correct node, since the last shared node of the two paths is the ancestor.
          It does not use the ordering, though: searching an unordered tree can look at every node, so
          the cost is O(n) rather than O(h). The ordering lets a search follow a single downward
          path.
      - id: strictly-between
        text: Walk down and return the first node whose value lies strictly between `p` and `q`
        explanation: >-
          This fails when the ancestor is `p` or `q` itself, because that node is not strictly between
          the two. For `p = 20` and `q = 35` the walk passes the 20 and returns 30, but the lowest
          common ancestor is 20, which has 35 in its own subtree. It also finds nothing when `p == q`.
      - id: inorder-midpoint
        text: List the values in order and return the one halfway between `p` and `q` in the list
        explanation: >-
          The ancestor lies between `p` and `q` in inorder, but not halfway. Inorder is
          `[10, 20, 25, 30, 35, 40, 50, 60, 70]`. For `p = 10` and `q = 35` the halfway element is 25,
          while the ancestor is 20. Building the list also costs O(n).
      - id: split-point
        text: Go left if both are smaller, right if both are larger, otherwise return the current node
        explanation: >-
          While both values are smaller, both lie in the left subtree, so the ancestor is there too,
          and likewise on the right. The first node that does not send both the same way either splits
          them or equals one of them, so it is the ancestor. Each step goes down one level, so the cost
          is O(h): about log₂ n if the tree is balanced, n for a chain.
    correct: split-point
    followUps:
      two-paths:
        prompt: Why can a BST reach `p` in O(h) steps, while the search above may look at nodes it does not need?
        options:
          - id: order-picks-child
            text: At each node the ordering says which child can hold `p`, so only one path is followed
          - id: always-balanced
            text: A BST is always balanced, so h is about log n
          - id: parent-pointers
            text: Every BST node stores a pointer to its parent
        correct: order-picks-child
        explanation: >-
          Comparing `p` with the current value discards a whole subtree, so the search follows a single
          root-to-node path of at most h nodes. A BST is not always balanced: inserting 1, 2, ..., 50
          in that order gives a chain with h = 50, and then O(h) is O(n). Nothing in this approach
          needs parent pointers.
      strictly-between:
        prompt: >-
          In the example tree, take `p = 20` and `q = 35`. What does the strictly-between version
          return, and what is the correct answer?
        options:
          - id: thirty-vs-twenty
            text: It returns 30, but the answer is 20, because 20 has 35 in its subtree and is itself one of the values
          - id: twenty-both
            text: It returns 20, the same as the correct answer
          - id: forty
            text: It returns 40, the root
        correct: thirty-vs-twenty
        explanation: >-
          The strict test skips the 20 because it equals `p`, so the walk continues to the right and
          lands on 30. A node counts as its own descendant, so 20 is the answer. The both-smaller and
          both-larger tests handle that case without a special rule.
      inorder-midpoint:
        prompt: >-
          Inorder for the example tree is `[10, 20, 25, 30, 35, 40, 50, 60, 70]`. For `p = 10` and
          `q = 35`, the halfway element is 25. What is the lowest common ancestor?
        options:
          - id: twenty
            text: 20, the lowest node with both 10 and 35 in its subtree; a position in the list says nothing about depth
          - id: twenty-five
            text: 25, because it sits halfway between them in the list
          - id: thirty
            text: 30, the parent of the 35, because the ancestor sits just above the larger value
        correct: twenty
        explanation: >-
          The ancestor is defined by the tree structure (who contains whom), not by list distance. Here
          25 is not even an ancestor of the 10, and 30 is the parent of the 35 but does not contain the 10.
          Inorder only guarantees the ancestor lies somewhere between the two values, inclusive, and the
          split-point walk finds it directly.
