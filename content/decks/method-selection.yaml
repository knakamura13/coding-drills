id: method-selection
title: Method selection
description: Name the fact that decides the method, contrast two methods that could work, and justify one for the task asked. Each card has a worked example on hand.
heading: Which method fits?

questions:
  - id: select-order-matters
    heading: Which fact decides it?
    tags: [sorting, arrays-strings]
    workedExample: |-
      Several methods can fit one task, and one fact about the task or its input decides which is
      safe. Consider `nums = [7, 2, 4]`, `k = 6` and the task "do any two values total 6?", which a
      scan from both ends could answer once the list is sorted.

      1. Sorting gives `[2, 4, 7]`. It moves values to new indices, but it keeps every value.
      2. A pair is any two values, wherever they sit. The values are unchanged, so the pairs are too,
         and `2 + 4 = 6` is in both lists.
      3. So the answer cannot change, and sorting first is safe for this task.
    prompt: |-
      Take `nums = [1, 5, 2]` with `k = 3`, and two tasks:

      1. Do any two values total 3?
      2. Does some subarray total 3?

      Sorted, the list is `[1, 2, 5]`. Which fact about these two tasks decides whether sorting first is safe?
    options:
      - id: neighbors
        text: Whether the task cares which values sit side by side
        explanation: >-
          Task 1 asks about values only, and 1 + 2 = 3 before and after sorting. Task 2 asks about
          subarrays. In `[1, 5, 2]` the subarrays total 1, 5, 2, 6, 7 and 8, so none totals 3.
          Sorting puts the 1 beside the 2 and invents the subarray `1, 2`.
      - id: negatives
        text: Whether the list holds any negative values at all
        explanation: Nothing here is negative. Does task 2 still change its answer after sorting?
      - id: size
        text: Whether `k` is larger than every value in the list
        explanation: Would the subarray `1, 2` exist in the original list for any `k`?
      - id: cost
        text: Whether sorting fits in the time budget for the task
        explanation: Even if sorting were free, would task 2 give the same answer after it?
    correct: neighbors
    followUps:
      negatives:
        prompt: Sorting `[1, 5, 2]` invents the subarray `1, 2`. What did sorting change?
        options:
          - { id: adjacency, text: Which values are neighbors }
          - { id: signs, text: The sign of some values }
          - { id: total, text: The total of the whole list }
        correct: adjacency
        explanation: >-
          Sorting keeps every value and the total, and it changes no sign. It gives values new
          neighbors, and a subarray is defined by its neighbors.
      size:
        prompt: Is `1, 2` a subarray of the original list `[1, 5, 2]`?
        options:
          - { id: no, text: 'No, the 5 sits between them' }
          - { id: values, text: 'Yes, both values are in the list' }
          - { id: k, text: 'Yes, once `k` is at least 3' }
        correct: no
        explanation: >-
          A subarray is consecutive indices of the original list. The 1 and the 2 sit at indices 0
          and 2, so any subarray holding both also holds the 5. Changing `k` does not change that.
      cost:
        prompt: Suppose sorting were free. Would sorting first be safe for task 2?
        options:
          - { id: no, text: 'No, it changes which subarrays exist' }
          - { id: free, text: 'Yes, a free step cannot change an answer' }
          - { id: positive, text: 'Yes, because every value is positive' }
        correct: no
        explanation: >-
          Cost and correctness are separate questions. Sorting changes which values are
          neighbors, so it changes the answer to a task about subarrays, whatever it costs.

  - id: space-decides-pair
    heading: Which fact rules it out?
    tags: [two-pointers, hash-map, complexity]
    workedExample: |-
      Two methods find two values that total a target: a set of seen values, which looks up
      `target - x` before it adds each `x`, and a scan from both ends, which needs a sorted list.
      Consider an unsorted list of `n` values and a limit of O(n) time.

      1. The set makes one pass, and each lookup costs O(1) on average, so it fits in O(n).
      2. The scan needs the list sorted first, and a sort costs O(n log n), over the limit.
      3. So both methods find the pair, and the time limit is the stated fact that rules out the
         scan.
    prompt: |-
      Extra space is the memory a method uses beyond its input. The task: in a sorted list of `n`
      values, do two values at different indices total `target`? The method must use O(1) extra
      space.

      A set of seen values and a scan from both ends would both find the pair. Which fact rules
      out the set?
    options:
      - id: space
        text: The O(1) extra space limit, since the set can grow to hold n values
        explanation: >-
          The set stores each value it passes, so on a list with no pair it ends up holding all n
          of them, which is O(n) extra space. The scan from both ends keeps only two indices, and
          the sorted order tells it which one to move.
      - id: sorted
        text: The sorted order, since a set of seen values needs an unsorted list
        explanation: >-
          The set never reads the order. On unsorted `[6, 1, 4, 3]` with target 10 it finds 6 + 4
          when the 4 arrives, and it would find the pair on a sorted list too.
      - id: indices
        text: The two different indices, since a set can pair a value with itself
        explanation: >-
          The set looks up `target - x` before it adds `x`, so `x` is never paired with itself. On
          `[3, 3]` with target 6, the second 3 finds the first one.
      - id: time
        text: The time, since each set lookup reads every value stored so far
        explanation: >-
          A set lookup costs O(1) on average, not a read of every value. One pass is O(n), the
          same as the scan. No time limit is stated, and time is not what the set breaks.
    correct: space
    followUps:
      sorted:
        prompt: A set of seen values runs on unsorted `[6, 1, 4, 3]` with target 10. What does it return?
        options:
          - { id: found, text: '`True`, when the 4 finds the 6 already in the set' }
          - { id: missed, text: '`False`, since the list is not sorted' }
          - { id: error, text: 'An error, since a set needs its values in order' }
        correct: found
        explanation: >-
          At the 4 it looks up 10 - 4 = 6, which it added first. A set answers "seen before?"
          whatever the order, so sorting neither helps it nor rules it out.
      indices:
        prompt: On `[5, 2]` with target 10, the set reaches the 5 first. What does it look up, and what does it hold?
        options:
          - { id: empty, text: 'It looks up 5 in an empty set, so the 5 is not paired with itself' }
          - { id: self, text: 'It looks up 5 after adding it, so it pairs the 5 with itself' }
          - { id: skip, text: 'It skips the lookup for the first value' }
        correct: empty
        explanation: >-
          The lookup comes before the add, so the set holds only earlier values. The 5 finds
          nothing, then the 2 looks up 8 and finds nothing, so the call returns `False`.
      time:
        prompt: About how long does one lookup of `target - x` in a set take?
        options:
          - { id: constant, text: 'O(1) on average, however many values it holds' }
          - { id: linear, text: 'O(n), one check per value stored' }
          - { id: log, text: 'O(log n), as in a binary search' }
        correct: constant
        explanation: >-
          A set finds a value by its hash, so a lookup costs O(1) on average. The whole pass is
          O(n). What the set costs is memory, one entry per value it passes.

  - id: select-value-search
    heading: What does the search run over?
    tags: [binary-search]
    workedExample: |-
      Binary search can run over any range where a yes-or-no test switches once, from false to
      true. Consider sorted `prices = [12, 25, 31, 40, 58]` and the test "the value at index `i` is
      at least 37".

      1. The test is false at indices 0 to 2 (12, 25 and 31) and true at indices 3 and 4 (40 and
         58). The sorted order makes it switch exactly once.
      2. So a probe at any index shows which side of the switch it is on, and the search can drop
         the other side.
      3. The search ends at the first index where the test is true, 3, which is where 37 belongs.
    prompt: |-
      Parcels ship in the order given. Each day a truck loads parcels in order until the next one would go over its capacity, then leaves. Find the smallest capacity that ships every parcel within `D` days.

      Binary search fits this task. What does it search over, and what makes that legal?
    options:
      - id: capacities
        text: Capacities from the largest parcel to the total; more room never adds days
        explanation: >-
          Below the largest parcel nothing ships, and at the total weight one day is enough. A
          bigger truck never needs an extra day, so the capacities that work form one block at the
          top, and the search finds where that block starts. The parcels are never sorted.
      - id: indices
        text: Indices of the parcel list, since binary search needs a list to probe
        explanation: What would an index of the parcel list tell you about a capacity?
      - id: sorted-indices
        text: Indices after sorting the parcels by weight, so the cut sits in one place
        explanation: The trucks load in the given order. What could sorting do to the days needed?
      - id: sorted-only
        text: Capacities, but only when the parcels arrive sorted from light to heavy
        explanation: Take the parcels in any order. Can a larger capacity ever need more days?
    correct: capacities
    followUps:
      indices:
        prompt: The answer is a capacity. Is it always one of the parcel weights?
        options:
          - { id: between, text: 'No, it can fall between or above them' }
          - { id: heaviest, text: 'Yes, it is always the heaviest parcel' }
          - { id: weight, text: 'Yes, it is always one of the weights' }
        correct: between
        explanation: >-
          Parcels `3, 4, 1, 5` with 2 days need capacity 7, which is no parcel's weight. The search
          runs over a range of numbers, not over indices of the list.
      sorted-indices:
        prompt: Parcels ship in order. Can sorting them change the days a capacity needs?
        options:
          - { id: yes, text: 'Yes, it changes which parcels share a day' }
          - { id: total, text: 'No, the total weight stays the same' }
          - { id: moves, text: 'No, sorting only moves parcels around' }
        correct: yes
        explanation: >-
          At capacity 7, `3, 4, 1, 5` ships in 2 days (`3, 4` then `1, 5`). Sorted to `1, 3, 4,
          5` it needs 3 (`1, 3`, then `4`, then `5`). The order is part of the task, so sorting
          answers a different question.
      sorted-only:
        prompt: With the parcels in any fixed order, how do the days change as capacity grows?
        options:
          - { id: never-up, text: They never go up }
          - { id: zigzag, text: They go up and down unless the parcels are sorted }
          - { id: one-each, text: They fall by one for each unit of capacity }
        correct: never-up
        explanation: >-
          A bigger truck can always take at least the parcels a smaller one took, so the loading
          never needs more days. That holds for any order, and it is the fact that lets the search
          drop half the range.

  - id: limit-picks-growth
    heading: Which growth fits?
    tags: [complexity]
    workedExample: |-
      Consider a task where `n` is at most 2,000 and a solution may take about 10^8 simple steps.
      Put the largest `n` into each growth, ignore constant factors, and compare the result with
      the budget.

      1. n² is 2,000 × 2,000 = 4,000,000, which is 25 times under 10^8.
      2. n log2 n is about 2,000 × 11 = 22,000, since `log2(2000)` is about 11. It fits too, with
         far more room.
      3. Since n² fits, an O(n²) method such as checking every pair is fast enough here, and the
         limit does not force a faster one.
    prompt: >-
      A task says `n` is at most 100,000, and a solution may take about 10^8 (100 million) simple
      steps. To read a limit, put the largest `n` into a growth and ignore constant factors.
      `log2(n)`, the power of 2 that makes `n`, is about 16.6 for 100,000. Of these growths, which
      takes the most steps while still fitting the budget?
    options:
      - id: n-log-n
        text: O(n log n)
        explanation: >-
          100,000 × 16.6 is about 1.66 million steps, about 60 times under 10^8. So sorting first,
          or any other O(n log n) method, fits, while checking every pair does not.
      - id: n-squared
        text: O(n²)
        explanation: >-
          100,000² is 10^10 steps, 100 times the budget. The limit rules out an O(n²) method such
          as checking every pair.
      - id: linear
        text: O(n)
        explanation: >-
          100,000 steps fits easily, but O(n log n) fits too and takes more steps. The limit does
          not force a method down to O(n).
    correct: n-log-n
    followUps:
      n-squared:
        prompt: How many steps is n² when `n` is 100,000?
        options:
          - { id: ten-ten, text: '10^10, which is 100 times the budget' }
          - { id: ten-eight, text: '10^8, which is right at the budget' }
          - { id: ten-six, text: '10^6, which is a hundredth of the budget' }
        correct: ten-ten
        explanation: >-
          100,000 is 10^5, and 10^5 × 10^5 is 10^10. A method that checks every pair would take
          about 100 times the steps the task allows.
      linear:
        prompt: About how many steps is n log2 n when `n` is 100,000?
        options:
          - { id: millions, text: 'About 1.66 million, well under 10^8' }
          - { id: ten-ten, text: 'About 10^10, the same as n²' }
          - { id: ten-nine, text: 'About 10^9, ten times the budget' }
        correct: millions
        explanation: >-
          A log grows slowly, so the log factor multiplies 100,000 by only about 16.6. O(n log n)
          fits with room to spare, so the limit allows it, not only O(n).

  - id: contrast-unsorted-scan
    format: tap-cell
    heading: Tap the value it drops first
    tags: [two-pointers, hash-map]
    workedExample: |-
      Consider sorted `nums = [1, 3, 6, 9]` with `target = 9` and a scan from both ends, which
      starts at `left = 0` and `right = 3`.

      1. The first sum is `nums[0] + nums[3] = 1 + 9 = 10`, over 9, so the scan drops `right`,
         the 9.
      2. That is safe because the list is sorted. Every value from `left` on is at least
         `nums[left] = 1`, so the 9 plus any of them is at least 10, and the 9 pairs with nothing.
      3. Next, `1 + 6 = 7` is under 9, so `left` moves to the 3, and `3 + 6 = 9` is found.
    prompt: >-
      Below, a scan from both ends runs on a list that is not sorted, with `target = 4`. It
      returns `False`, though 1 + 3 = 4. Tap the value of that pair the scan drops first.
    code: |
      def has_pair(nums, target):
          left, right = 0, len(nums) - 1
          while left < right:
              total = nums[left] + nums[right]
              if total == target:
                  return True
              if total < target:
                  left += 1
              else:
                  right -= 1
          return False

      has_pair([5, 1, 8, 3], 4)   # False
    sequence: { kind: array, name: nums, cells: [5, 1, 8, 3] }
    markers:
      - { name: left, at: 0 }
      - { name: right, at: 3 }
    correct: 3
    explanation: >-
      The first sum is 5 + 3 = 8, over 4, so `right` drops the 3. On a sorted list that is safe,
      but here the 1 sits between them. A set of seen values needs no order: when the 3 arrives, it
      looks for 1, which it has already seen.
    misses:
      - index: 0
        explanation: >-
          Every sum the scan sees (8, 13, then 6) is over 4, so only `right` moves and the 5 is
          never dropped. It is not in the pair either.
      - index: 1
        explanation: >-
          The 1 is in the pair, and the scan drops it on its last pass (5 + 1 = 6). It dropped the
          other half of the pair two passes before that.
      - index: 2
        explanation: The scan drops the 8 on its second pass, but no pair that totals 4 uses it.

  - id: contrast-variable-drag
    format: drag-pointers
    heading: Drag the pointers
    tags: [sliding-window]
    workedExample: |-
      Consider `nums = [4, 1, 3, 6, 2]` and a window over `nums[0]` to `nums[2]`, total 8, with
      `left = 0` and `right = 2`. The next pass adds `nums[3] = 6`, so `right` moves to 3.

      1. A window of fixed width 3 drops exactly one value on that pass, the 4. `left` moves to 1,
         and the window holds 3 values again.
      2. A window whose total must stay at most 9 drops values only while the total is over 9. After
         the 6 the total is 14, so it drops the 4 (10) and then the 1 (9).
      3. A total of 9 is not over 9, so it stops with `left = 2`. A fixed width moves `left` one
         cell per pass, and a total limit moves it as many cells as the total needs.
    prompt: >-
      Below, the task is the longest subarray with total at most `S = 8`, where no value is
      negative. The window holds `2, 1, 3, 2` (total 8), and the next pass adds the 6. Drag `left`
      and `right` to where they sit when that pass ends.
    code: |
      best = total = left = 0
      for right in range(len(nums)):
          total += nums[right]
          while total > S:
              total -= nums[left]
              left += 1
          best = max(best, right - left + 1)
    sequence: { kind: array, name: nums, cells: [2, 1, 3, 2, 6, 1] }
    pointers:
      - name: left
        start: 0
        correct: 3
        explanation: >-
          The 6 makes the total 14. The loop drops the 2 (12), the 1 (11) and the 3 (8), and stops
          because 8 is not over 8. The width shrinks from 4 to 2, which a fixed-width step never
          does.
        misses:
          - index: 1
            explanation: >-
              That is a fixed-width step, one value in and one out. The total would be 1 + 3 + 2 +
              6 = 12, still over 8, so the loop keeps dropping.
          - index: 2
            explanation: After the 2 and the 1 leave, the total is 11, still over 8. The 3 has to go too.
          - index: 4
            explanation: >-
              After the 3 leaves, the total is 8. The loop runs only while the total is over 8, so
              the 2 stays.
        elsewhere: The loop drops values only while the total is over 8, and it stops at a total of 8.
      - name: right
        start: 3
        correct: 4
        explanation: Each pass moves `right` to the value it adds, here the 6.
        misses:
          - index: 3
            explanation: That is where `right` was before this pass. The pass adds the 6 at index 4.
        elsewhere: One pass adds one value, the 6 at index 4.

  - id: contrast-heap-or-sort
    heading: What does it save?
    tags: [heap, sorting, complexity]
    workedExample: |-
      Consider `vals = [6, 2, 9, 4, 8, 1]` and the task of finding the 3 largest, either by sorting
      the list or with a min-heap that never holds more than 3 values. The heap keeps its smallest
      value at `heap[0]`.

      1. `sorted(vals)` builds a new list of all 6 values, `[1, 2, 4, 6, 8, 9]`, in O(n log n) time.
         The last 3 are the answer.
      2. The heap takes 6, 2 and 9 first. Each later value is compared with `heap[0]`, and it
         replaces that value only when it is larger.
      3. The 4 replaces the 2, the 8 replaces the 4, and the 1 is ignored, leaving 6, 8 and 9. The
         heap never held more than 3 values, so each replace cost O(log 3), not O(log n).
    prompt: |-
      A sensor log holds about 10 million readings, and you need the 10 largest. Both methods give the right answer. What does the size-10 heap save?
    options:
      - id: both
        text: Extra space falls to O(10), and time to O(n log 10) from O(n log n)
        explanation: >-
          Each reading costs at most one push or replace on a heap of 10, which is O(log 10). The heap
          never holds more than 10 readings. Sorting stores all n and pays O(n log n).
      - id: partial
        text: It reads only part of the log, since it can stop once it holds 10
        explanation: Could the largest reading be the last one in the log?
      - id: ordered
        text: It hands back the 10 in sorted order with no extra work at the end
        explanation: Which value does a min-heap promise to keep at the front?
      - id: log-n
        text: Extra space only, since each heap step still costs O(log n) time
        explanation: How many values does this heap hold when it takes a reading?
    correct: both
    followUps:
      partial:
        prompt: The log ends with its largest reading. When does a top-10 heap first see it?
        options:
          - { id: last, text: 'On the last reading, so every reading must be read' }
          - { id: early, text: Within the first 10 readings }
          - { id: never, text: 'Never, since the heap is already full by then' }
        correct: last
        explanation: >-
          Any reading could be one of the 10 largest, so each one is compared with the heap's
          smallest. Both methods read all n readings. The heap saves work per reading, not
          readings.
      ordered:
        prompt: A min-heap holds the 10 largest readings. What can you read off it with no more work?
        options:
          - { id: smallest, text: 'Only the smallest of the 10, at `heap[0]`' }
          - { id: all, text: All 10 in increasing order }
          - { id: largest, text: Only the largest of the 10 }
        correct: smallest
        explanation: >-
          A heap keeps its smallest value at the front and promises nothing about the order of the
          rest. Listing the 10 in order takes a sort of those 10, which is cheap. A sorted log
          already has them in order.
      log-n:
        prompt: Each push or replace costs O(log m) on a heap of m values. What is m here?
        options:
          - { id: ten, text: '10, since the heap never holds more' }
          - { id: n, text: 'n, the number of readings' }
          - { id: log, text: 'log n, the height of a tree over all readings' }
        correct: ten
        explanation: >-
          The heap is capped at 10, so each step is O(log 10), a constant. Over n readings that is
          O(n log 10), which is O(n).

  - id: greedy-or-table
    heading: Which method gives the fewest?
    tags: [greedy, dp]
    workedExample: |-
      Consider coins of 1, 2 and 5, each usable any number of times, and the fewest coins that pay
      9. Largest first takes the largest coin that fits until nothing is owed. A table fills
      `few[a]` for every amount from 0 up, trying each coin as the last one.

      1. Largest first pays 9 as 5 + 2 + 2, three coins.
      2. The table builds `few[9]` from `few[8]`, `few[7]` and `few[4]`, one for each last coin 1,
         2 and 5. Those hold 3, 2 and 2, so `few[9]` is 1 + 2, which is 3.
      3. Both give 3 here. Largest first commits to one coin at each step, while the table keeps the
         smallest count over every last coin.
    prompt: |-
      Coins of 1, 5 and 6 can each be used any number of times, and the task is the fewest coins
      that pay exactly 10. Largest first takes the largest coin that fits until nothing is owed.
      The table below tries each coin as the last one.

      ```python
      def fewest(coins, amount):
          few = [0] + [float('inf')] * amount
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a:
                      few[a] = min(few[a], 1 + few[a - c])
          return few[amount]
      ```

      Which method gives the fewest coins for 10?
    options:
      - id: table
        text: The table, which returns 2 (5 + 5), while largest first uses five coins
        explanation: >-
          Largest first takes the 6 and owes 4, which only four 1s pay: 6 + 1 + 1 + 1 + 1, five
          coins. The table reaches `few[10]` from `few[5]`, which is 1, plus a last 5, so it
          returns 2. It tries every last coin, so a first pick that looks good cannot trap it.
      - id: either
        text: Either one, since the 1 coin lets largest first find 2 coins as well
        explanation: Largest first takes the 6 first. What is left to pay, and which coins fit it?
      - id: faster
        text: Largest first, since it finds the same count in fewer steps
        explanation: Count the coins largest first uses for 10. Is it the same as the table's?
      - id: uses-six
        text: Largest first, since the fewest coins always include the largest coin, 6
        explanation: Does 5 + 5 use a 6? How many coins does it use?
    correct: table
    followUps:
      either:
        prompt: Largest first takes a 6 from 10. How does it pay the 4 that is left?
        options:
          - { id: ones, text: 'With four 1s, so it uses five coins in all' }
          - { id: five, text: 'With a 5, since 5 is close to 4' }
          - { id: backs-up, text: 'It backs up and pays 5 + 5 instead' }
        correct: ones
        explanation: >-
          Only coins that fit can be taken, and the 5 and 6 are larger than 4, so four 1s pay it.
          A 1 coin lets largest first finish, but it does not make the count the fewest.
      faster:
        prompt: How many coins does largest first use for 10, against the table's 2?
        options:
          - { id: five, text: 'Five, 6 + 1 + 1 + 1 + 1' }
          - { id: two, text: 'Two, the same as the table' }
          - { id: three, text: 'Three, 6 + 4' }
        correct: five
        explanation: >-
          Speed matters only between methods that give the right answer. Largest first is quick,
          but five coins is not the fewest, so its speed does not make up for a wrong count.
      uses-six:
        prompt: What is the fewest coins that pay 10 when the payment must include a 6?
        options:
          - { id: five, text: 'Five, since the 4 left takes four 1s' }
          - { id: two, text: 'Two, a 6 and a 4' }
          - { id: four, text: 'Four, a 6 and three 1s' }
        correct: five
        explanation: >-
          After a 6, the 4 left can only be paid with 1s, since 5 and 6 are too big. That makes
          five coins, and a 6 with three 1s pays only 9. Two coins, 5 + 5, use no 6 at all.

  - id: list-or-count
    heading: Which task can the cache shrink?
    tags: [dp, backtracking, recursion]
    workedExample: |-
      A search can decide each index in turn, taking or skipping its value, with the state
      `(i, left)`: the next index to decide and the total still needed. Consider `nums = [1, 1, 1]`
      and a total of 2, starting from `(0, 2)`.

      1. Taking index 0 leads to `(1, 1)`, and skipping it leads to `(1, 2)`.
      2. From `(1, 1)`, skipping index 1 leads to `(2, 1)`. From `(1, 2)`, taking index 1 also
         leads to `(2, 1)`.
      3. Two routes reach the same state. Whatever came before, both face the same rest of the
         problem: total 1 from index 2 on.
    prompt: |-
      A subset is any choice of a list's items. `nums = [2, 3, 5, 7, 8]` has 3 subsets that total
      10: `[2, 3, 5]`, `[2, 8]` and `[3, 7]`. Task A lists those subsets, and task B counts them.

      A take-or-skip search over the indices has the state `(i, left)`: the next index to decide
      and the total still needed. A cache keyed by `(i, left)` runs each state's body once.

      For which task can the cache keep the work from growing with the number of answers?
    options:
      - id: count
        text: Task B, since a state's result is one number, however many subsets it covers
        explanation: >-
          Every call that reaches `(i, left)` gets back one stored count, so the work is one body
          per state. With 40 values of 1 and a total of 20 there are 137,846,528,820 subsets, yet
          `i` runs from 0 to 40 and `left` from 0 to 20, so the count needs at most 861 bodies.
      - id: list
        text: Task A, since each state's list of subsets is built once and reused
        explanation: What does a stored list for a state hold when that state leads to many subsets?
      - id: both
        text: Both tasks, since each state's body runs only once in either one
        explanation: In task A, what does one body have to build from the lists it gets back?
      - id: neither
        text: Neither task, since a count must still reach every subset it counts
        explanation: When a body adds two counts, which subsets does it build?
    correct: count
    followUps:
      list:
        prompt: A state leads to 1,000 subsets. What must its stored list hold?
        options:
          - { id: all, text: 'All 1,000 subsets, so building it takes at least 1,000 steps' }
          - { id: one, text: 'One subset, since the cache keeps one answer per state' }
          - { id: count, text: 'The number 1,000, as a count would' }
        correct: all
        explanation: >-
          Task A must hand back every subset, so a stored list is as long as the answers it covers.
          Reusing it saves a second search, but the subsets still have to be written out once each.
      both:
        prompt: In task A, a body joins the lists from its take call and its skip call. What does that cost?
        options:
          - { id: grows, text: 'At least one step per subset in the two lists' }
          - { id: one, text: 'One step, the same as adding two counts' }
          - { id: free, text: 'Nothing, since both lists come from the cache' }
        correct: grows
        explanation: >-
          Each subset in the result has to be put there, so joining costs as much as the lists are
          long. In task B the same body adds two numbers in one step.
      neither:
        prompt: "A body of the count returns `count(i + 1, left - nums[i]) + count(i + 1, left)`. What does it build?"
        options:
          - { id: number, text: 'One number, the sum of two counts' }
          - { id: subsets, text: 'Every subset that the two calls cover' }
          - { id: lists, text: 'Two lists of subsets, one from each call' }
        correct: number
        explanation: >-
          The count adds what the two choices lead to and never writes a subset down. A cached
          count of 1,000 is reused as one number, without visiting the 1,000 subsets again.
