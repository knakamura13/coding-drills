  - id: pop-empty-guard
    heading: What happens?
    tags: [stack, python]
    workedExample: |-
      Consider `nums = []` and the test `not nums or nums[0] > 5`. `or` checks its left side first,
      and when that side is true the whole test is already true, so the right side never runs.

      1. `nums` is empty, and an empty list counts as false, so `not nums` is `True`.
      2. A true left side settles the `or`, so Python stops there and never reads `nums[0]`.
      3. So the test is `True`, with no `IndexError`, although `nums[0]` has no cell to read. With
         `nums = [8]`, `not nums` is `False`, so the right side runs, and `nums[0] > 5` is `True`.
    prompt: |-
      Popping an empty list raises `IndexError`. `and` and `or` check their left side first and
      stop as soon as it settles the result: `or` stops at a true left side, and `and` stops at a
      false one. The right side then never runs.

      ```python
      PAIRS = {')': '(', ']': '[', '}': '{'}

      def balanced(s):
          stack = []
          for ch in s:
              if ch in '([{':
                  stack.append(ch)
              elif not stack or stack.pop() != PAIRS[ch]:
                  return False
          return not stack
      ```

      What happens on `balanced('())')`?
    options:
      - id: guarded
        text: It returns `False` at the second `)`, with no pop on the empty stack
        explanation: >-
          The `(` is pushed and the first `)` pops it, so the stack is empty when the second `)`
          arrives. `not stack` is `True`, so `or` stops there: `stack.pop()` never runs, and the
          line returns `False`.
      - id: crashes
        text: It fails with `IndexError` at the second `)`
        explanation: >-
          An empty pop would fail, but this pop never runs. The stack is empty, so `not stack` is
          `True`, and `or` stops before it reaches `stack.pop()`.
      - id: skips
        text: It returns `True`, since the extra `)` has nothing to pop
        explanation: >-
          A closer with nothing open is the clearest sign of an unbalanced string. The `not stack`
          test catches it and returns `False` inside the loop.
      - id: last-line
        text: It reads every character and returns `False` at the last line
        explanation: >-
          The loop returns at the second `)`, so the last line never runs. If it did, the stack
          would be empty there, and `not stack` would give `True`.
    correct: guarded
    followUps:
      crashes:
        prompt: When the second `)` arrives, `not stack` is `True`. Does `stack.pop()` run?
        options:
          - id: stops
            text: No, a true left side settles the `or`
          - id: both
            text: Yes, `or` always runs both sides
          - id: pop-first
            text: Yes, the pop runs before the test
        correct: stops
        explanation: >-
          `or` reads left to right and stops at the first true side. Putting `not stack` first is
          what keeps the matcher from ever popping an empty list.
      skips:
        prompt: A `)` arrives and the stack is empty. What does that say about the string?
        options:
          - id: unbalanced
            text: It is unbalanced, because this closer has no opener to match
          - id: undecided
            text: Nothing yet, so the matcher should skip it and read on
          - id: fine
            text: It is balanced so far, because nothing is left open
        correct: unbalanced
        explanation: >-
          Every closer needs an earlier opener that is still unmatched. An empty stack means there
          is none, so the answer is already `False`.
      last-line:
        prompt: Where does `balanced('())')` return?
        options:
          - id: in-loop
            text: Inside the loop, at the second `)`
          - id: at-end
            text: At the last line, after the third character
          - id: first
            text: Inside the loop, at the first `)`
        correct: in-loop
        explanation: >-
          The first `)` matches the `(`, so the loop goes on. The second `)` finds the stack empty,
          and the closer line returns `False` before the loop ends.

