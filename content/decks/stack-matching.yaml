  - format: step-trace
    id: asteroid-survivors
    heading: Which rocks remain?
    tags: [stack, python]
    workedExample: |-
      Consider `rocks = [1, 4, -2, -9]`. A left-moving rock meets the top of `stack` while that top
      moves right: a smaller top is popped and the rock moves on, and a larger top destroys the
      rock.

      1. The 1 and the 4 move right, so both are pushed, and `stack` is `[1, 4]`.
      2. The -2 meets the 4. The 4 is larger than 2, so the -2 is destroyed, and `stack` stays
         `[1, 4]`.
      3. The -9 meets the 4 and then the 1. Both are smaller than 9, so both are popped, and with
         `stack` empty the -9 is pushed. `stack` ends as `[-9]`.
    prompt: >-
      Each value in `rocks` is a rock: a positive value moves right, a negative one moves left, and
      `abs(rock)` is its size. `stack` holds the rocks still flying, left to right. Only a
      left-moving rock with a right-moving rock on top of `stack` collides. A smaller top is
      popped, and the rock goes on to the next top. An equal top is popped, and the rock is
      destroyed too. A larger top destroys the rock. A rock that is not destroyed is pushed.
      `stack[-1]` reads the top without removing it, and `and` stops at its first false test, so
      `stack[-1]` is read only when `stack` is not empty. `rock`
      marks the rock arriving, and `top` the rock on top of `stack`. Predict each step.
    code: |
      stack = []
      for rock in rocks:
          alive = True
          while alive and rock < 0 and stack and stack[-1] > 0:
              if stack[-1] < abs(rock):
                  stack.pop()
              elif stack[-1] == abs(rock):
                  stack.pop()
                  alive = False
              else:
                  alive = False
          if alive:
              stack.append(rock)
      print(stack)
    sequence:
      kind: array
      name: rocks
      cells: [4, 2, -3, 5, -5, -6, 1]
    start:
      - { name: rock, at: 2 }
      - { name: top, at: 1 }
    steps:
