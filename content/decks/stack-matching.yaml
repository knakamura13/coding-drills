        ask: The -3 at index 2 arrives with `stack` at `[4, 2]`. Which rock is on top once it is handled? Tap it.
        pointer: top
        correct: 0
        explanation: >-
          The 2 is smaller than 3, so it is popped, and the -3 goes on to the 4. The 4 is larger,
          so the -3 is destroyed and never pushed, and the 4 is left on top.
        misses:
          - index: 1
            explanation: >-
              The 2 is smaller than the -3's size, 3, so it is popped. A smaller top never stops a
              rock.
          - index: 2
            explanation: >-
              The -3 reaches the 4, which is larger than 3, so the -3 is destroyed. Only a rock
              that survives every top is pushed.
        elsewhere: The -3 pops the 2 and is destroyed by the 4, so the 4 is on top.
        also:
          - { name: rock, at: 4 }
      - line: 4
        ask: The 5 at index 3 is pushed. The -5 at index 4 arrives. What is `stack` once the -5 is handled?
        options:
          - id: both-gone
            text: '`[4]`'
            explanation: >-
              The top, 5, equals the -5's size, so the 5 is popped and the -5 is destroyed too.
              That leaves `[4]`, and the 4 is never compared, since the loop stops once the rock
              is gone.
          - id: rock-lives
            text: '`[4, -5]`'
            explanation: >-
              An equal top is popped, but the rock is destroyed with it, so it is never pushed.
              Only a smaller top lets the rock go on.
          - id: top-stays
            text: '`[4, 5]`'
            explanation: >-
              That is what a larger top does. The 5 is equal in size to the -5, and an equal top is
