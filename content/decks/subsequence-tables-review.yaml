  - id: walk-back-review
    format: step-trace
    heading: Predict each step of the walk back
    tags: [dp, python]
    prompt: |-
      The table is for `a = "tones"` and `b = "onset"`. The board shows its rows, each labelled by
      the last letter of its prefix of `a`. The walk starts at `(5, 5)`, with `j` at 5.

      ```
           -  o  n  s  e  t
      -    0  0  0  0  0  0
      t    0  0  0  0  0  1
      o    0  1  1  1  1  1
      n    0  1  2  2  2  2
      e    0  1  2  2  3  3
      s    0  1  2  3  3  3
      ```
    code: |
      def walk_back(a, b, dp):
          i, j = len(a), len(b)
          out = []
          while i > 0 and j > 0:
              if a[i - 1] == b[j - 1]:
                  out.append(a[i - 1])
                  i -= 1
                  j -= 1
              elif dp[i - 1][j] >= dp[i][j - 1]:
                  i -= 1
              else:
                  j -= 1
          return ''.join(reversed(out))
    sequence: { kind: array, name: rows, cells: ['-', t, o, n, e, s] }
    start:
      - { name: i, at: 5 }
