          walk steps left, so `j` drops to 4 and `i` stays 4.
        misses:
          - index: 3
            explanation: >-
              Going up reaches `dp[3][5]`, which is 2. The cell to the left holds 3, so the walk
              goes left and `i` stays.
        elsewhere: A mismatch moves one step, up or left, and here the left cell is larger.
      - line: 5
        ask: At `(4, 4)` both letters are `e`. What does this pass do?
        options:
          - id: record-diagonal
            text: Records `e` and moves to `(3, 3)`
            explanation: >-
              A match records the letter and drops the last letter of both prefixes, so `i` and
              `j` both fall by 1.
          - id: record-left
            text: Records `e` and moves to `(4, 3)`
            explanation: >-
              Moving only left keeps the `e` of `tones` in play after it was just matched. A match
              lowers both `i` and `j`.
          - id: no-record
