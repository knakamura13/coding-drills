id: bounded-heaps
title: Bounded heaps
description: Keep the k largest or smallest with a capped heap and say what it costs, then merge sorted runs with one entry per run. Each card asks for one decision, with a worked example on hand.
heading: What does the capped heap do?

questions:
  - format: tap-cell
    id: evict-root-tap
    heading: Which score is evicted?
    tags: [heap, python]
    workedExample: |-
      To keep the `k` largest scores of a long stream, you need not store the whole stream. Keep at
      most `k` scores in a min-heap. Its root, `h[0]`, is the smallest score kept, the weakest one,
      so it is the one to drop when a larger score arrives. Here the scores are `3, 8, 1, 6` and
      `k = 3`.

      1. After 3, 8 and 1 are pushed, the root is 1, the smallest of the three, so 1 is the weakest
         score kept.
      2. When 6 arrives, `heappush` adds it, so `h` holds 4 scores, one more than `k`.
      3. `heappop` removes the root, which is still 1 because 6 is larger than 1. `h` keeps 3, 6 and
         8, the 3 largest so far.
    prompt: >-
      `h` is a min-heap that keeps the 4 largest scores seen so far. When 9 arrives, it is pushed,
      and then one score is popped so that 4 stay. The cells show `h` before the push. Which kept
      score leaves? Tap it.
    code: |
      from heapq import heappush, heappop

      h = [5, 6, 12, 8]  # the 4 largest scores so far
      heappush(h, 9)
      heappop(h)
      print(sorted(h))
    sequence:
      kind: array
      name: h
      cells: [5, 6, 12, 8]
    correct: 0
    explanation: >-
      The root of a min-heap is its smallest score, 5, so it is the weakest of the kept scores and
      the first to go. 9 is larger than 5, so it stays. The code prints `[6, 8, 9, 12]`.
    misses:
      - index: 1
        explanation: >-
          6 is the next smallest, and it becomes the new root once 5 leaves. The pop takes the
          current root, which is still 5.
      - index: 2
        explanation: >-
          12 is the largest kept score. Evicting it would leave the smallest scores. `heappop` on a
          min-heap returns the root, the smallest.
      - index: 3
        explanation: >-
          8 is the last cell of the list. `heappop` returns `h[0]`, not the end of the list.
          `list.pop()` is what removes the last cell.

  - format: step-trace
    id: capped-stream-trace
    heading: Follow the evictions
    tags: [heap, python]
    workedExample: |-
      Consider `k = 2` and the stream `30, 10, 70, 20`. Each arrival is pushed first, and when
      `len(h) > k` the root, the smallest score held, is popped.

      1. 30 and 10 are pushed. `len(h)` is 2, which is not more than `k`, so nothing is popped yet.
      2. 70 is pushed, so `h` holds 30, 10 and 70, and `len(h) = 3` is more than `k`. The root is
         10, the smallest of the three, so 10 is evicted.
      3. 20 is pushed next to 30 and 70. 20 is smaller than both, so it becomes the root, and the
         pop removes the 20 that was just pushed. An arrival smaller than every kept score never
         stays, so `h` ends with 30 and 70.
    prompt: >-
      Below, `out` marks the score most recently evicted, and it starts on
      index 0 before anything is evicted. Predict each step.
    code: |
      from heapq import heappush, heappop

      stream = [6, 2, 9, 4, 1, 8, 5]
      k = 3
      h = []
      for x in stream:
          heappush(h, x)
          if len(h) > k:
              heappop(h)
      print(h[0])
    sequence:
      kind: array
      name: stream
      cells: [6, 2, 9, 4, 1, 8, 5]
    start:
      - { name: out, at: 0 }
    steps:
      - line: 9
        ask: The first three scores fill the heap. When 4 arrives, which score is evicted? Move `out` to it.
        pointer: out
        correct: 1
        explanation: >-
          The heap holds 6, 2 and 9, so its root is 2. The 4 is pushed, the heap holds 4 scores,
          and the pop removes the root, 2.
        misses:
          - index: 0
            explanation: >-
              6 arrived first, but the heap does not evict by age. It evicts its root, the
              smallest kept score, which is 2.
          - index: 2
            explanation: '9 is the largest kept score. A min-heap pops its smallest, 2, so the largest scores stay.'
          - index: 3
            explanation: >-
              4 is the arrival. It is pushed first, and it is larger than the root 2, so the 2
              leaves instead.
        elsewhere: The heap holds 6, 2, 9 and the new 4. The pop removes the smallest, 2.
      - line: 9
        ask: Next, 1 arrives. Which score is evicted?
        pointer: out
        correct: 4
        explanation: >-
          The heap holds 4, 6 and 9. The 1 is pushed and becomes the root, so the pop removes the
          1 itself. An arrival smaller than every kept score never stays.
        misses:
          - index: 3
            explanation: >-
              4 was the root before the push. The 1 is pushed first and sifts above it, so the pop
              takes the 1.
          - index: 1
            explanation: 2 was evicted in the step before. It is no longer in the heap.
          - index: 0
            explanation: '6 is in the middle of the kept scores. Only the smallest of the four leaves, and that is the 1.'
        elsewhere: After the push the heap holds 1, 4, 6 and 9. The pop removes the 1 it just pushed.
      - line: 9
        ask: Next, 8 arrives. Which score is evicted?
        pointer: out
        correct: 3
        explanation: The heap holds 4, 6 and 9 again. The 8 is pushed and the root, 4, is popped.
        misses:
          - index: 4
            explanation: The 1 left in the step before. The heap holds 4, 6 and 9 when 8 arrives.
          - index: 0
            explanation: '6 is the second smallest. The pop removes only the root, 4.'
          - index: 5
            explanation: '8 is larger than the root, 4, so the 8 stays and the 4 leaves.'
        elsewhere: The heap holds 4, 6, 8 and 9 after the push. The pop removes the 4.
      - line: 10
        ask: The last score, 5, arrives. What does `print(h[0])` show?
        options:
          - id: third-largest
            text: '6'
            explanation: >-
              5 is smaller than the root, 6, so it is evicted at once. `h` ends with 6, 8 and 9, the
              3 largest scores of the stream, and its root is the smallest of them. So `h[0]` is
              the 3rd largest score of the whole stream, 6.
          - id: newest
            text: '5'
            explanation: >-
              5 is the root for a moment after the push, but the pop removes it. The root is then
              the smallest of 6, 8 and 9.
          - id: largest
            text: '9'
            explanation: >-
              9 is the largest score kept. `h[0]` is the root of a min-heap, the smallest score
              kept.
        correct: third-largest

  - id: pop-condition-off-by-one
    heading: What does this print?
    tags: [heap, python]
    workedExample: |-
      Consider keeping the `k = 2` largest of `4, 1, 7`. Each score is pushed, and a pop runs only
      once the heap holds `k + 1` scores, so that no pass ends with more than `k` kept.

      1. 4 and 1 are pushed. The heap holds 2 scores, which is `k` and not `k + 1`, so no pop runs.
      2. 7 is pushed, so the heap holds 3 scores, which is `k + 1`. The pop runs and removes the
         root, 1, because it is the smallest.
      3. The heap ends with 4 and 7, the 2 largest. It keeps `k` because the pop waited for `k + 1`
         scores, which in code is the check `len(h) > k`.
    prompt: |-
      ```python
      from heapq import heappush, heappop

      def top3(stream):
          h = []
          for x in stream:
              heappush(h, x)
              if len(h) >= 3:
                  heappop(h)
          return sorted(h)

      print(top3([7, 3, 10, 5, 12, 6]))
      ```

      The function is meant to keep the 3 largest. What does it print?
    options:
      - id: two-kept
        text: '`[10, 12]`'
        explanation: >-
          `>= 3` is true on the push that brings the heap to 3, so every pop leaves 2 scores. The
          heap never ends a pass holding 3, and it returns the 2 largest.
      - id: three-kept
        text: '`[7, 10, 12]`'
        explanation: That is the intended answer. Check how many scores are left after each pop.
      - id: four-kept
        text: '`[6, 7, 10, 12]`'
        explanation: Check when the pop runs. It runs on the push that brings the heap to 3.
      - id: smallest-three
        text: '`[3, 5, 6]`'
        explanation: Check which score `heappop` removes from a min-heap.
    correct: two-kept
    followUps:
      three-kept:
        prompt: 'With `len(h) >= 3`, how many scores does `h` hold right after a pop?'
        options:
          - id: two
            text: '2, since the pop runs as soon as there are 3'
          - id: three
            text: '3, since the pop runs only when there are 4'
          - id: varies
            text: It depends on whether the arrival was the smallest
        correct: two
        explanation: >-
          The condition fires on the push that brings the heap to 3, so each pass ends with 2. To
          end with `k`, pop only when the heap holds more than `k`: `len(h) > k`.
      four-kept:
        prompt: When does `heappop` run in this loop?
        options:
          - id: at-three
            text: Whenever the push has brought the heap to 3 or more
          - id: at-four
            text: Only when the heap has grown to 4
          - id: at-end
            text: Once, after the whole stream has been pushed
        correct: at-three
        explanation: >-
          The check runs after every push. `>= 3` is already true at 3, so the heap never reaches
          4. With `> 3` it would hold 4 and keep 4 scores.
      smallest-three:
        prompt: Which score does `heappop` remove from `heapq`'s heap?
        options:
          - id: smallest
            text: The smallest, so the larger scores stay
          - id: largest
            text: The largest, so the smaller scores stay
          - id: newest
            text: The one pushed most recently
        correct: smallest
        explanation: >-
          `heapq` keeps a min-heap, so each pop throws away the smallest score held. The scores
          that survive are the largest, here 10 and 12.


  - id: replace-before-compare
    heading: What does this print?
    tags: [heap, python]
    workedExample: |-
      Consider the heap `h = [5, 9]` and the arrival `x = 2`. `heapreplace(h, x)` pops the root
      first and then pushes `x`.

      1. The pop runs first, so it removes the root, 5, before the 2 is looked at.
      2. The push then adds 2, so `h` becomes `[2, 9]`.
      3. The 5 is gone although it was larger than 2, because `heapreplace` never compares `x` with
         the root.
    prompt: |-
      `heapreplace(h, x)` pops the root of `h` and then pushes `x`, in one call.

      ```python
      from heapq import heappush, heapreplace

      def top3(stream):
          h = []
          for x in stream:
              if len(h) < 3:
                  heappush(h, x)
              else:
                  heapreplace(h, x)
          return sorted(h)

      print(top3([8, 15, 11, 20, 13, 4]))
      ```

      What does it print?
    options:
      - id: kept-four
        text: '`[4, 15, 20]`'
        explanation: >-
          Every arrival after the third evicts the root, even a small one. 20 replaces 8, 13
          replaces 11, and then 4 replaces 13, although 13 was larger. Calling `heapreplace` only
          when `x > h[0]` keeps `[13, 15, 20]`.
      - id: true-top
        text: '`[13, 15, 20]`'
        explanation: That is the 3 largest. Check what `heapreplace` does with the last arrival, 4.
      - id: first-three
        text: '`[8, 11, 15]`'
        explanation: Check whether the `else` branch changes the heap.
      - id: replace-largest
        text: '`[4, 8, 11]`'
        explanation: Check which entry `heapreplace` pops.
    correct: kept-four
    followUps:
      true-top:
        prompt: The heap holds 13, 15 and 20, and 4 arrives. What does `heapreplace(h, 4)` do?
        options:
          - id: pops-root
            text: It pops 13 and pushes 4, so 4 is kept
          - id: compares
            text: It sees that 4 is smaller than 13 and leaves the heap alone
          - id: pushes-first
            text: It pushes 4 and pops it straight back out
        correct: pops-root
        explanation: >-
          `heapreplace` pops before it pushes, so it never compares the arrival with the root. The
          root is evicted whatever arrives, unless the code checks `x > h[0]` first.
      first-three:
        prompt: What does the `else` branch do once the heap holds 3 scores?
        options:
          - id: swaps
            text: It removes the root and adds the arrival on every pass
          - id: nothing
            text: Nothing, since the heap is full
          - id: grows
            text: It adds the arrival, so the heap grows past 3
        correct: swaps
        explanation: >-
          `heapreplace` is one pop and one push, so the size stays at 3 but the contents change on
          every arrival. That is why the last arrival, 4, ends up kept.
      replace-largest:
        prompt: Which entry does `heapreplace` remove from a `heapq` heap?
        options:
          - id: root
            text: The root, the smallest score held
          - id: largest
            text: The largest score held
          - id: oldest
            text: The score that was pushed first
        correct: root
        explanation: >-
          `heapreplace` removes `h[0]`, the smallest, and puts the arrival in its place. 20 replaces
          8, 13 replaces 11, and 4 replaces 13.

  - format: tap-cell
    id: keep-k-smallest
    heading: Which distance is evicted?
    tags: [heap, python]
    workedExample: |-
      Consider keeping the 2 smallest of the distances `4, 7, 2`. Each distance `d` is pushed as
      `-d`, and `heappop` removes the smallest entry, so it removes the most negative one.

      1. After 4 and 7 are pushed, the heap holds `-4` and `-7`. The root is `-7`, the smaller of
         the two, and it stands for 7, the larger distance.
      2. 2 arrives and `-2` is pushed, so the heap holds 3 entries, one more than 2.
      3. `heappop` removes the root, `-7`, so the distance 7 is evicted. The heap keeps `-4` and
         `-2`, which stand for 4 and 2, the 2 smallest distances.
    prompt: >-
      This loop keeps the 2 smallest distances. Each distance is pushed negated, and the root is
      popped whenever the heap holds more than 2. Which distance is evicted when the 1 arrives? Tap
      it.
    code: |
      from heapq import heappush, heappop

      dists = [6, 3, 9, 1]
      h = []
      for d in dists:
          heappush(h, -d)
          if len(h) > 2:
              heappop(h)
      print(sorted([-x for x in h]))
    sequence:
      kind: array
      name: dists
      cells: [6, 3, 9, 1]
    correct: 0
    explanation: >-
      Before the 1 arrives the heap holds `-6` and `-3`. Pushing `-1` makes 3 entries, and the pop
      removes the smallest, `-6`. So the distance evicted is 6, the largest one kept. Negating
      turns the capped min-heap around: its root is the largest kept distance, the weakest
      candidate for the 2 smallest. The code prints `[1, 3]`.
    misses:
      - index: 1
        explanation: >-
          3 is kept. Its entry is `-3`, which is larger than `-6`, so the pop takes the `-6` and
          evicts the 6.
      - index: 2
        explanation: >-
          9 left earlier. When it arrived, `-9` was the smallest of `-6`, `-3` and `-9`, so it was
          popped at once.
      - index: 3
        explanation: >-
          1 is the smallest distance, so its entry `-1` is the largest in the heap and is not the
          root. The root is `-6`, and that is what the pop removes.

  - id: capped-cost
    heading: Which Big-O fits?
    tags: [heap, complexity]
    workedExample: |-
      Consider a capped heap that keeps the 3 largest of 1,000 scores. Each arrival is pushed, and
      the root is popped when the heap holds more than 3, so it never holds more than 4 scores. A
      sift moves one level per swap.

      1. A heap of 4 scores has 3 levels: the root, its two children, and one more below. So a
         push can climb at most 2 levels, and a pop can sink at most 2.
      2. So each arrival costs at most about 4 swaps, however many scores have come before it.
      3. 1,000 arrivals then cost at most about 4,000 swaps, and the heap still holds at most 4
         scores. Double the stream and the swaps double, while the memory stays the same.
    prompt: >-
      A push or a pop on a heap of `m` items sifts along one path, one level per swap, so it costs
      O(log m). A capped heap keeps the 10 largest of 1,000,000 scores. Each arrival is one push
      and at most one pop, on a heap that never holds more than 11 scores. For `n` scores and a cap
      of `k`, which Big-O names how the whole stream's time and memory grow?
    options:
      - id: n-log-k
        text: O(n log k) time and O(k) memory
        explanation: >-
          Each of the `n` arrivals works on a heap of at most `k + 1` items, so it costs O(log k).
          Here `log2(11)` is under 4, while `log2(1,000,000)` is about 20. The heap never holds
          more than `k + 1` scores, whatever `n` is, so memory is O(k).
      - id: n-log-n
        text: O(n log n) time and O(n) memory
        explanation: >-
          That is the cost of keeping and ordering every score, for example sorting them all. The
          capped heap never holds more than `k + 1` scores, so its sifts are short and its memory
          does not grow with `n`.
      - id: n-times-k
        text: O(n × k) time and O(k) memory
        explanation: >-
          That would be the growth if each arrival were compared with every kept score. A sift
          follows one path of about `log k` levels, so the work grows like `n log k`, slower than
          `n × k`.
      - id: log-k
        text: O(log k) time and O(k) memory
        explanation: >-
          O(log k) is the cost of one arrival. The stream has `n` arrivals, so the total time is
          `n` times that.
    correct: n-log-k
    followUps:
      n-log-n:
        prompt: How many scores does the capped heap hold at most, while 1,000,000 arrive?
        options:
          - id: eleven
            text: 11, one more than the cap, for a moment between the push and the pop
          - id: million
            text: 1,000,000, since every score is pushed
          - id: half
            text: About 500,000, since half the scores are popped
        correct: eleven
        explanation: >-
          Every score is pushed, but a pop follows as soon as the heap holds more than `k`. The
          heap stays at `k + 1` at most, so each sift is on a heap of 11 and memory is O(k).
      n-times-k:
        prompt: On a heap of 11 scores, which scores can one push compare the new score with?
        options:
          - id: path
            text: Only the parents on its way up, at most one per level
          - id: all
            text: All 11, to find where the new score belongs
          - id: root
            text: Only the root
        correct: path
        explanation: >-
          A sift up compares the new score with its parent and either stops or swaps. A heap of 11
          has 4 levels, so a push makes at most 3 comparisons, not 11.
      log-k:
        prompt: One arrival costs O(log k). What does the whole stream of `n` arrivals cost?
        options:
          - id: n-times
            text: '`n` times as much, O(n log k), since every arrival does its own push'
          - id: same
            text: O(log k) in all, since the heap never grows
          - id: k-times
            text: O(k log k), since only `k` scores are kept
        correct: n-times
        explanation: >-
          A small heap keeps each arrival cheap, but every arrival still pays. Work done once per
          arrival adds up over all `n` arrivals.

  - id: initial-heads
    heading: What does the heap start with?
    tags: [heap, sorting]
    workedExample: |-
      Consider merging two sorted runs, `[5, 8]` and `[2, 9]`. In a sorted run, every value behind
      the front is at least as large as the front.

      1. 8 cannot come out before 5, and 9 cannot come out before 2, since each run is sorted. So
         the first value out is one of the two fronts, and 2 is the smaller.
      2. Once 2 is out, its run's next value, 9, becomes that run's front. The fronts are now 5 and
         9, so 5 comes out next.
      3. Each step of a two-run merge compares only the two fronts. A heap merge is the same merge
         with `k` runs: the heap holds the `k` fronts and pops the smallest.
    prompt: |-
      A merge turns several sorted runs into one sorted output. A sorted run is a list whose values
      never decrease from front to back. The merge reads each run one value at a time from its
      front, and reads a value only once it could be the next one out. A heap holds the values read
      but not yet output.

      `[2, 4, 9]`, `[1, 3]`, `[6, 7, 8]`

      Which values does the heap hold before the first pop?
    options:
      - id: fronts
        text: 2, 1 and 6
        explanation: >-
          One value per run: its front. A value behind a front cannot be next while that front is
          waiting, so it can stay unread. The heap holds 3 values for 3 runs.
      - id: three-smallest
        text: 1, 2 and 3
        explanation: Check whether the third run is represented.
      - id: everything
        text: All eight values
        explanation: Check which values could be the next one out.
      - id: just-one
        text: Only 1, the first value to come out
        explanation: Check how the merge would know what comes after 1.
    correct: fronts
    followUps:
      three-smallest:
        prompt: Why does the heap hold the 6 but not the 3 before the first pop?
        options:
          - id: front-rule
            text: The 6 is a front and the 3 is not
          - id: size-rule
            text: The heap keeps the 3 smallest values of all runs
          - id: order-rule
            text: Runs are read from the last one
        correct: front-rule
        explanation: >-
          Each run is represented by its front, so the third run needs its 6 even though 3 is
          smaller. The 3 sits behind the 1 in its own run, so it is read only when the 1 leaves.
          Finding the 3 smallest values of all runs would mean reading every run first.
      everything:
        prompt: What goes wrong if every value is pushed into the heap before the first pop?
        options:
          - id: memory
            text: The heap holds every value of every run
          - id: order
            text: Output order breaks
          - id: duplicates
            text: Duplicates are lost
        correct: memory
        explanation: >-
          The output is still sorted and keeps its duplicates, but the heap holds all `N` values,
          and nothing can come out until every run is read in full. Holding only the fronts keeps
          one value per run and lets the first output appear at once.
      just-one:
        prompt: After the 1 comes out, which values can be next?
        options:
          - id: any-front
            text: The 3 behind it, or the front of either other run
          - id: same-run
            text: Only the 3, the next value of the same run
          - id: run-order
            text: Only the front of the next run, the 6
        correct: any-front
        explanation: >-
          The next value is the smallest of all the current fronts, here 2. The heap needs every
          run's front to answer that without scanning, so it starts with one per run.

  - id: head-entry-shape
    heading: Which entry works?
    tags: [heap, python]
    workedExample: |-
      Consider the entries `a = (3, 1, 0)`, `b = (3, 0, 2)` and `c = (2, 5, 1)`. Python compares
      tuples item by item from the left, and moves to the next item only on a tie.

      1. `c < a`, because the first items differ and 2 is less than 3. Nothing after the first
         item is compared.
      2. `a` and `b` tie on 3, so Python compares their second items. 0 is less than 1, so
         `b < a`, and the third items are never compared.
      3. So the first item decides the order, and each later item is read only when every item
         before it ties.
    prompt: |-
      Python compares tuples item by item from the left, and moves to the next item only on a tie.
      A merge pushes one entry for each run that is not empty:

      ```python
      h = []
      for i in range(len(runs)):
          if runs[i]:
              heappush(h, ENTRY)
      ```

      Values can repeat across runs. After each pop, the merge reads the next value of the run the
      entry came from, at the next index. Which `ENTRY` works?
    options:
      - id: value-run-index
        text: '`(runs[i][0], i, 0)`'
        explanation: >-
          The value comes first, so the smallest front pops. Tied values compare the run number
          `i`, which no other entry shares, so the comparison stops there. The entry also says
          which run to read next and at which index of the run.
      - id: run-first
        text: '`(i, runs[i][0], 0)`'
        explanation: Check which item decides the order.
      - id: dict-payload
        text: '`(runs[i][0], {"run": i, "pos": 0})`'
        explanation: Check what happens when two fronts are equal.
      - id: value-only
        text: '`runs[i][0]`'
        explanation: Check what the merge needs after a pop.
    correct: value-run-index
    followUps:
      run-first:
        prompt: What does a heap of `(i, runs[i][0], 0)` entries pop first?
        options:
          - id: run-zero
            text: The front of run 0, whatever its value
          - id: smallest
            text: The smallest front, since the values are compared too
          - id: newest
            text: The front pushed last
        correct: run-zero
        explanation: >-
          Tuples compare their first items first, and the run numbers all differ, so the values
          are never compared. Runs `[4, 7]` and `[2, 9]` would pop `(0, 4, 0)` before the 2.
      dict-payload:
        prompt: Two runs have the front 3. What happens when their entries are compared?
        options:
          - id: type-error
            text: The values tie, so Python compares the two dicts and raises `TypeError`
          - id: first-wins
            text: The entry pushed first wins the tie
          - id: equal
            text: They count as equal, so either one pops
        correct: type-error
        explanation: >-
          A tie on the first item moves the comparison to the second. Dicts have no `<`, so the push
          or pop that compares them raises `TypeError`. A run number that no other entry shares settles every tie
          before anything else is reached.
      value-only:
        prompt: The heap pops the value 5. What can the merge not do next?
        options:
          - id: which-run
            text: Find which run the 5 came from, to read that run's next value
          - id: sort-order
            text: Keep the output sorted, since bare values have no order
          - id: empty-check
            text: Tell whether the heap is empty
        correct: which-run
        explanation: >-
          The merge must replace the popped front with the next value from the same run. A bare
          value does not say which run that is, so the entry carries the run number and the
          index.

  - id: replenish-which-run
    heading: Which entry is pushed?
    tags: [heap, sorting]
    workedExample: |-
      Consider `runs[0] = [4, 5]` and `runs[1] = [1, 7]`, merged with a heap of
      `(value, run, index)` entries. The heap holds exactly one entry per run, that run's current
      front.

      1. Before the pop, the heap holds `(4, 0, 0)` for run 0 and `(1, 1, 0)` for run 1.
      2. The pop returns `(1, 1, 0)`, the smaller entry. So run 1 has no entry left, while run 0
         still has its 4 in the heap.
      3. So the push is run 1's next value, `(7, 1, 1)`, although run 0's 5 is smaller. The 5 sits
         behind the 4, so it is pushed when the 4 pops, and the heap again holds one entry per run.
    prompt: |-
      Three sorted runs are being merged:

      `runs[0] = [3, 10, 12]`, `runs[1] = [5, 6, 7]`, `runs[2] = [4, 11]`

      The heap holds `(3, 0, 0)`, `(4, 2, 0)` and `(5, 1, 0)`, as `(value, run, index)`, where
      `index` is the value's index in its run. The next pop returns `(3, 0, 0)`. Which entry should
      be pushed?
    options:
      - id: same-run
        text: '`(10, 0, 1)`, the next value of run 0'
        explanation: >-
          Run 0 lost its front, so its next value takes the place. The heap keeps one entry per
          run, and the merge prints 3, 4, 5, 6, 7, 10, 11, 12.
      - id: smallest-next
        text: '`(6, 1, 1)`, the smallest value not yet in the heap'
        explanation: Check what happens to run 0's values and to the 6 later on.
      - id: both
        text: '`(10, 0, 1)` and `(6, 1, 1)`'
        explanation: Check what run 1 pushes when its 5 is popped.
      - id: nothing
        text: Nothing, since the heap still holds two fronts
        explanation: Check whether the 10 and the 12 are ever read.
    correct: same-run
    followUps:
      smallest-next:
        prompt: 'If `(6, 1, 1)` is pushed instead of `(10, 0, 1)`, and the merge goes on normally, what goes wrong?'
        options:
          - id: lost-and-repeated
            text: Run 0's 10 and 12 are never printed, and 6 and 7 are printed twice
          - id: unsorted
            text: The output is complete but no longer sorted
          - id: nothing-wrong
            text: Nothing, since 6 is the next value after 5 either way
        correct: lost-and-repeated
        explanation: >-
          Run 0 has no entry, so its values are never read. When the 5 pops, run 1 pushes its
          next value, the 6, again. Python prints 3, 4, 5, 6, 6, 7, 7, 11.
      both:
        prompt: Pushing both entries makes the heap hold two values from run 1. What follows?
        options:
          - id: duplicates
            text: When the 5 pops, run 1 pushes 6 again, so 6 and 7 come out twice
          - id: fine
            text: Nothing goes wrong, the heap is just one entry larger
          - id: crash
            text: The next push raises `IndexError`
        correct: duplicates
        explanation: >-
          Run 1 already had its 5 in the heap. Each run's entry is replaced only when it pops, so
          an extra entry means values are read twice. Python prints 3, 4, 5, 6, 6, 7, 7, 10, 11, 12.
      nothing:
        prompt: If nothing is pushed for run 0 now, when is its 10 read?
        options:
          - id: never
            text: Never, since only a popped entry triggers a read of its run
          - id: later
            text: When the heap runs empty, the merge reads the rest of run 0
          - id: next-pop
            text: On the next pop, which reads every run
        correct: never
        explanation: >-
          A run is read again only when its own entry pops. With no entry, run 0 is forgotten, and
          Python prints 3, 4, 5, 6, 7, 11 without the 10 and the 12.

  - format: step-trace
    id: merge-heads-trace
    heading: Follow the merge
    tags: [heap, python]
    workedExample: |-
      Consider `runs = [[10, 13], [7, 11, 15]]` and a heap of `(value, i, j)` entries that starts
      with each run's front. Each pass pops the smallest entry, prints its value, and pushes the
      next value of run `i`, if it has one.

      1. The heap starts with `(10, 0, 0)` and `(7, 1, 0)`. 7 is smaller, so the pop prints 7, and
         run 1 pushes its next value, 11.
      2. The heap now holds 10 and 11. 10 is smaller, so the pop prints 10, and run 0 pushes its
         next value, 13.
      3. The heap now holds 13 and 11. 11 is smaller, so the pop prints 11, and run 1 pushes its 15.
         So far the merge has printed 7, 10 and 11, and the heap still holds one entry per run.
    prompt: >-
      The cells lay out `runs[0]`, `runs[1]` and `runs[2]` side by side (indices 0
      to 2, 3 to 4, and 5 to 7). `a`, `b` and `c` mark the value each run has in the heap. The
      first pop has printed 1 and pushed the 2, and `out` marks the value printed last. Predict
      each step.
    code: |
      from heapq import heapify, heappop, heappush

      runs = [[1, 2, 8], [4, 9], [3, 5, 6]]
      h = [(r[0], i, 0) for i, r in enumerate(runs)]
      heapify(h)
      while h:
          x, i, j = heappop(h)
          print(x)
          if j + 1 < len(runs[i]):
              heappush(h, (runs[i][j + 1], i, j + 1))
    sequence:
      kind: array
      cells: [1, 2, 8, 4, 9, 3, 5, 6]
    start:
      - { name: out, at: 0 }
      - { name: a, at: 1 }
      - { name: b, at: 3 }
      - { name: c, at: 5 }
    steps:
      - line: 7
        ask: Which value does the next pop print? Move `out` to it.
        pointer: out
        correct: 1
        explanation: >-
          The heap holds 2, 4 and 3, the values under `a`, `b` and `c`. The smallest is 2, pushed
          when the 1 left. Run 0 then pushes its 8.
        misses:
          - index: 5
            explanation: >-
              3 is run 2's front, but the heap also holds the 2, pushed from run 0 when the 1 was
              printed. 2 is smaller.
          - index: 3
            explanation: '4 is run 1''s front. The heap holds 2 and 3 as well, and both are smaller.'
          - index: 2
            explanation: 8 sits behind the 2 in run 0. It is not in the heap until the 2 leaves.
        elsewhere: The heap holds the values under `a`, `b` and `c`. The smallest is the 2.
        also:
          - { name: a, at: 2 }
      - line: 7
        ask: Which value does the next pop print?
        pointer: out
        correct: 5
        explanation: The heap holds 8, 4 and 3. The 3 is smallest, and run 2 pushes its next value, 5.
        misses:
          - index: 2
            explanation: '8 is run 0''s front now, but 3 and 4 are smaller.'
          - index: 3
            explanation: '4 is run 1''s front, but run 2''s front, 3, is smaller.'
          - index: 6
            explanation: 5 sits behind the 3 in run 2. It is pushed only when the 3 leaves.
        elsewhere: The heap holds 8, 4 and 3. The smallest is the 3.
        also:
          - { name: c, at: 6 }
      - line: 7
        ask: Which value does the next pop print?
        pointer: out
        correct: 3
        explanation: The heap holds 8, 4 and 5. The 4 is smallest.
        misses:
          - index: 6
            explanation: '5 is run 2''s new front, pushed when the 3 left. The 4 is smaller.'
          - index: 4
            explanation: 9 sits behind the 4 in run 1. It is not in the heap yet.
          - index: 2
            explanation: '8 is in the heap, but 4 and 5 are smaller.'
        elsewhere: The heap holds 8, 4 and 5. The smallest is the 4.
      - line: 9
        ask: The 4 has been printed. Which entry is pushed next?
        options:
          - id: run-one
            text: '`(9, 1, 1)`'
            explanation: >-
              The 4 came from run 1, so run 1 loses its entry and pushes its next value, 9. The
              heap holds 8, 9 and 5, one per run.
          - id: next-smallest
            text: '`(5, 2, 1)`'
            explanation: >-
              5 is the next value to be printed, but it is already in the heap: run 2 pushed it
              when the 3 left. The push refills the run that was just popped.
          - id: nothing
            text: Nothing is pushed
            explanation: >-
              Run 1 still has the 9, since `j + 1 = 1` is less than `len(runs[1]) = 2`. Only an
              exhausted run pushes nothing.
          - id: run-zero
            text: '`(8, 0, 2)`'
            explanation: 8 is already in the heap, pushed when the 2 left. Run 0 has no value after it.
        correct: run-one
        also:
          - { name: b, at: 4 }

