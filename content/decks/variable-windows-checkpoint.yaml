id: variable-windows-checkpoint
title: "Variable windows: checkpoint"
description: Count valid subarrays, repair or debug a window scan and bound its cost on new logs. Most items combine the Variable windows skills.
heading: Which one is right?

questions:
  - id: checkpoint-count-log
    heading: What does it return?
    tags: [sliding-window, hash-map, python]
    prompt: |-
      ```python
      def count_valid(days, k):
          counts = {}
          left = total = 0
          for right, d in enumerate(days):
              counts[d] = counts.get(d, 0) + 1
              while len(counts) > k:
                  gone = days[left]
                  counts[gone] -= 1
                  if counts[gone] == 0:
                      del counts[gone]
                  left += 1
              total += right - left + 1
          return total

      log = ["plan", "test", "plan", "ship", "ship", "test", "ship"]
      count_valid(log, 2)
      ```

      What does the call return?
    options:
      - id: right
        text: '18'
        explanation: >-
          After each repair `left` is 0, 0, 0, 2, 2, 3, 3, so the passes add 1, 2, 3, 2, 3, 3
          and 4. The first `ship` forces out `plan`, `test`, and the second `test` forces out the
          last `plan`.
      - id: one-removal
        text: '19'
        explanation: When the first `ship` arrives, how many days have to leave?
      - id: before-repair
        text: '21'
        explanation: Is every window counted after it holds at most 2 types?
      - id: short-count
        text: '11'
        explanation: How many subarrays end at `right` when `left == right`?
    correct: right
    followUps:
      one-removal:
        prompt: >-
          The first `ship` arrives at index 3 and the window is `plan, test, plan, ship`. After one
          day leaves, how many types does it hold?
        options:
          - { id: three, text: 'Still 3, so `test` has to leave as well' }
          - { id: two, text: '2, since one type has gone' }
          - { id: one, text: '1, since only `ship` is new' }
        correct: three
        explanation: >-
          The first `plan` leaves, but `test`, another `plan` and `ship` remain. The `while`
          removes days until a count reaches 0, which takes two removals here.
      before-repair:
        prompt: On the pass where the first `ship` arrives, the window briefly spans indices 0 to 3. Should those 4 starts count?
        options:
          - { id: after, text: 'No, only the starts left after the repair, which are 2 and 3' }
          - { id: all, text: 'Yes, every start up to `right` counts' }
          - { id: half, text: 'Only the starts from 1 to 3' }
        correct: after
        explanation: >-
          A subarray from index 0 or 1 to index 3 holds three types. Counting before the `while`
          adds those invalid subarrays, which happens on two passes here.
      short-count:
        prompt: On the first pass, `left` and `right` are both 0. How many valid subarrays end there?
        options:
          - { id: one, text: 'One, the single first day' }
          - { id: zero, text: 'None, since `right - left` is 0' }
          - { id: two, text: 'Two, the day and the empty subarray' }
        correct: one
        explanation: >-
          The starts run from `left` to `right`, both included, so each pass adds
          `right - left + 1`. Dropping the `+ 1` loses one subarray on every pass, 7 in all here.

  - id: checkpoint-no-repeat-left
    format: tap-cell
    heading: Tap where the left edge sits
    tags: [sliding-window, hash-map, python]
    prompt: >-
      This function counts the substrings of `s` in which no letter repeats. After its last pass,
      tap the cell where `left` sits.
    code: |
      def count_no_repeat(s):
          counts = {}
          left = total = 0
          for right, ch in enumerate(s):
              counts[ch] = counts.get(ch, 0) + 1
              while counts[ch] > 1:
                  counts[s[left]] -= 1
                  left += 1
              total += right - left + 1
          return total

      count_no_repeat("abcbda")
    sequence: { kind: string, name: s, cells: [a, b, c, b, d, a] }
    correct: 2
    explanation: >-
      The second `b`, at index 3, pushes `left` past the `a` and the first `b`, to 2. The final
      `a` repeats the `a` at index 0, but that copy has already left, so its count is 0 and
      nothing moves. The window `c, b, d, a` repeats no letter.
    misses:
      - index: 0
        explanation: >-
          The window would hold both `b` letters. `left` moved past index 1 when the second `b`
          arrived, and it never moves back.
      - index: 1
        explanation: >-
          That is one past the earlier `a`, which is where a "jump past the last copy" version
          lands if it forgets that `left` is already at 2. It would move the left edge back and
          bring in a repeated `b`.
      - index: 3
        explanation: >-
          The `c` at index 2 repeats nothing, so it can stay. The loop stops as soon as the new
          letter's count is 1.
      - index: 4
        explanation: >-
          The last pass does not shrink at all: the earlier `a` has already left, so the new `a`
          has a count of 1.
      - index: 5
        explanation: >-
          Starting over at the new letter throws away `c, b, d`, which hold no repeat. The
          window only loses letters while one repeats.

  - id: checkpoint-count-cost
    heading: What is the complexity?
    tags: [sliding-window, complexity, hash-map]
    prompt: |-
      `count_valid(days, k)` adds `right - left + 1` on every pass, so on a log of one type it
      returns `n(n + 1) / 2`. Assume `1 <= k <= n` and that each dictionary read, write and
      delete takes O(1). What are its tightest worst-case time and extra space, the memory it
      uses beyond its input?

      ```python
      def count_valid(days, k):
          counts = {}
          left = total = 0
          for right, d in enumerate(days):
              counts[d] = counts.get(d, 0) + 1
              while len(counts) > k:
                  gone = days[left]
                  counts[gone] -= 1
                  if counts[gone] == 0:
                      del counts[gone]
                  left += 1
              total += right - left + 1
          return total
      ```
    options:
      - id: right
        text: O(n) time and O(k) extra space
        explanation: >-
          Each day enters once and leaves at most once, since `left` never moves back, so all the
          `while` passes together remove at most `n` days. Each pass adds a whole group of
          subarrays with one subtraction, and `counts` never holds more than `k + 1` keys.
      - id: quadratic
        text: O(n²) time and O(k) extra space
        explanation: Does the loop visit each subarray, or add them up in groups?
      - id: k-per-pass
        text: O(nk) time and O(k) extra space
        explanation: Is the number of removals bounded per pass, or over the whole call?
      - id: n-space
        text: O(n) time and O(n) extra space
        explanation: What happens to a key when its last copy leaves?
    correct: right
    followUps:
      quadratic:
        prompt: On a pass with `left` at 2 and `right` at 9, how much work does `total += right - left + 1` do?
        options:
          - { id: one, text: 'Constant work, for all 8 at once' }
          - { id: eight, text: 'Eight steps, one per subarray' }
          - { id: ten, text: 'Ten steps, one per index so far' }
        correct: one
        explanation: >-
          The count of valid subarrays ending at `right` is a formula, not a list to walk. The
          answer can be far larger than the work, so the time is set by the moves of `left` and
          `right`.
      k-per-pass:
        prompt: >-
          With `k = 1`, the log is 50 days of `plan` followed by one `ship`. How many days leave on
          the last pass?
        options:
          - { id: fifty, text: 'All 50, one per `plan`' }
          - { id: one, text: 'One, since `k` is 1' }
          - { id: two, text: 'Two, which is `k + 1`' }
        correct: fifty
        explanation: >-
          One pass can remove far more than `k` days. The bound comes from the whole call: each
          day leaves at most once, so the removals add up to at most `n`.
      n-space:
        prompt: With `k = 2` and a log that uses 40 types, how many keys can `counts` hold at once?
        options:
          - { id: three, text: 'At most 3, which is `k + 1`' }
          - { id: forty, text: 'Up to 40, one per type' }
          - { id: n, text: 'Up to `n`, one per day' }
        correct: three
        explanation: >-
          A key is deleted when its count reaches 0, so `counts` only describes the current
          window. The repair keeps that window at `k` types, with one more for a moment before
          the repair, so the space grows with `k`, not with the log.

  - id: checkpoint-fixed-window-cost
    heading: What is the complexity?
    tags: [sliding-window, complexity, hash-map]
    prompt: |-
      The function returns the most task types in any `k` consecutive days. Assume `1 <= k <= n`
      and that each dictionary read, write and delete takes O(1). What are its tightest
      worst-case time and extra space, the memory it uses beyond its input?

      ```python
      def most_types(days, k):
          counts = {}
          best = 0
          for right, d in enumerate(days):
              counts[d] = counts.get(d, 0) + 1
              if right >= k:
                  gone = days[right - k]
                  counts[gone] -= 1
                  if counts[gone] == 0:
                      del counts[gone]
              if right >= k - 1:
                  best = max(best, len(counts))
          return best
      ```
    options:
      - id: right
        text: O(n) time and O(k) extra space
        explanation: >-
          Each pass adds one day and removes at most one, so the work per pass is constant. The
          window holds `k` days, plus one for a moment, so `counts` has at most `k + 1` keys.
      - id: nk-time
        text: O(nk) time and O(k) extra space
        explanation: Does any pass look at all `k` days of its window?
      - id: n-space
        text: O(n) time and O(n) extra space
        explanation: Can a type that left the window keep its key?
      - id: constant-space
        text: O(n) time and O(1) extra space
        explanation: What does `counts` hold between passes?
    correct: right
    followUps:
      nk-time:
        prompt: How many dictionary updates does one pass make once the window is full?
        options:
          - { id: two, text: 'Two, one in and one out' }
          - { id: k, text: '`k`, one per window day' }
          - { id: right, text: '`right`, one per day so far' }
        correct: two
        explanation: >-
          The window is never rebuilt. Each pass changes only the counts of the day that comes in
          and the day that leaves, so the whole call does O(n) updates.
      n-space:
        prompt: With `k = 3`, what is the most keys `counts` can hold at once, however many types the log uses?
        options:
          - { id: four, text: 'Four, the window plus one' }
          - { id: types, text: 'One per type in the log' }
          - { id: three, text: 'Three, the window size' }
        correct: four
        explanation: >-
          A key goes when its count reaches 0, so `counts` describes only the current window.
          The new day is added before the old one leaves, so for a moment there are `k + 1`.
      constant-space:
        prompt: Between passes, what is in `counts`?
        options:
          - { id: window, text: 'A count per type in the window' }
          - { id: one, text: 'One number, the window size' }
          - { id: log, text: 'One entry per day in the log' }
        correct: window
        explanation: >-
          `counts` maps each type in the window to its copies there, at most `k` of them between
          passes, so it grows with `k`. A dictionary whose size depends on the input is not O(1)
          extra space.

  - id: checkpoint-anagram-starts
    heading: What does it return?
    tags: [sliding-window, hash-map, python]
    prompt: |-
      This function returns the start index of every window of `s` that is an anagram of `p`,
      with the same letters in the same amounts.

      ```python
      def anagram_starts(s, p):
          k = len(p)
          target = {}
          for ch in p:
              target[ch] = target.get(ch, 0) + 1
          counts = {}
          out = []
          for right, ch in enumerate(s):
              counts[ch] = counts.get(ch, 0) + 1
              if right >= k:
                  gone = s[right - k]
                  counts[gone] -= 1
                  if counts[gone] == 0:
                      del counts[gone]
              if counts == target:
                  out.append(right - k + 1)
          return out

      anagram_starts("abbcbaba", "abb")
      ```

      What does the call return?
    options:
      - id: right
        text: '`[0, 4]`'
        explanation: >-
          The windows are `abb`, `bbc`, `bcb`, `cba`, `bab` and `aba`, and only `abb` and `bab`
          hold an `a` and two `b` letters. The `c` key is deleted once the `c` has left, so
          `counts` can equal `target` again at start 4.
      - id: same-letters
        text: '`[0, 4, 5]`'
        explanation: Does the window `aba` hold the letters of `abb` in the same amounts?
      - id: kept-zero
        text: '`[0]`'
        explanation: What happens to the `c` key once the `c` leaves the window?
      - id: end-index
        text: '`[2, 6]`'
        explanation: Does `right - k + 1` name the first letter of a window or its last?
    correct: right
    followUps:
      same-letters:
        prompt: '`aba` uses the same two letters as `abb`. Is it an anagram of `abb`?'
        options:
          - id: amounts
            text: No, it has two `a` letters and one `b`, and `abb` has one `a` and two `b` letters
          - id: letters
            text: Yes, since both use only `a` and `b`
          - id: length
            text: Yes, since both have three letters
        correct: amounts
        explanation: >-
          An anagram needs every letter in the same amount, which is why `counts` keeps counts
          and not only letters. `{"a": 2, "b": 1}` is not equal to `{"a": 1, "b": 2}`.
      kept-zero:
        prompt: Suppose the `c` key stayed at 0 after the `c` left. Could `counts` equal `target` for the window `bab`?
        options:
          - id: extra-key
            text: No, `counts` would have a `c` key that `target` lacks
          - id: zero-ignored
            text: Yes, since a count of 0 is ignored
          - id: right-amounts
            text: Yes, since the window holds one `a` and two `b` letters
        correct: extra-key
        explanation: >-
          Dictionaries are equal only with the same keys and the same values. Deleting a key at 0
          is what lets a later window match `target` after a letter outside `p` has passed
          through.
      end-index:
        prompt: On the pass with `right` at 2, the window is `s[0:3]`. Which index does the function record?
        options:
          - id: start
            text: 0, which is `right - k + 1`, where the window starts
          - id: end
            text: 2, which is `right`, where the window ends
          - id: past
            text: 3, which is `right + 1`
        correct: start
        explanation: >-
          A window of `k` letters that ends at `right` starts `k - 1` places earlier, at
          `right - k + 1`. The function returns starts, so its first match is 0, not 2.

  - id: checkpoint-repair-zero-jump
    heading: Which change fixes it?
    tags: [sliding-window, python]
    prompt: |-
      This function counts the subarrays of `nums` that hold at most `k` zeros. Instead of
      counting zeros, it keeps the indices of the window's 0s in `zero_at`, oldest first, and
      moves `left` straight to its new place.

      ```python
      def count_few_zeros(nums, k):
          zero_at = []
          left = total = 0
          for right, x in enumerate(nums):
              if x == 0:
                  zero_at.append(right)
              if len(zero_at) > k:
                  left = zero_at.pop(0)
              total += right - left + 1
          return total
      ```

      For `[1, 1, 0, 1, 0, 1, 0]` and `k = 1` it returns 20, but the true count is 17. Which
      change makes it correct for every input?
    options:
      - id: past-oldest
        text: Change the jump to `left = zero_at.pop(0) + 1`
        explanation: >-
          The oldest 0 has to leave, so `left` lands one past it. The current line lands on that
          0 and counts windows that still hold `k + 1` zeros. With the `+ 1`, `left` is 0, 0, 0,
          0, 3, 3 and 5 after each pass, so the passes add 1, 2, 3, 4, 2, 3 and 2, which is 17.
      - id: while-loop
        text: Replace the `if` with `while len(zero_at) > k`
        explanation: >-
          Each pass adds at most one 0, so `zero_at` never holds more than `k + 1` indices, and one
          pop brings it back to `k`. A `while` runs its body once, just as the `if` does, and
          still leaves `left` on the 0 that should leave. The call still returns 20.
      - id: pop-newest
        text: Change the jump to `left = zero_at.pop() + 1`
        explanation: >-
          `pop()` takes the newest 0, the one at `right`, so `left` jumps past `right` and the
          pass counts nothing, while the oldest 0 stays in `zero_at`. The call returns 11.
      - id: no-pop
        text: Change the jump to `left = zero_at[0] + 1`
        explanation: >-
          Without the pop, a 0 that has left stays at the front of `zero_at`, so `left` keeps
          landing at 3. When the third 0 arrives, the window `1, 0, 1, 0` holds two 0s and is
          counted anyway. The call returns 19.
    correct: past-oldest
    followUps:
      while-loop:
        prompt: How many 0s can one pass add to the window?
        options:
          - id: one
            text: At most one, the value at `right`
          - id: k
            text: Up to `k`, the limit
          - id: any
            text: Any number, since the window can be long
        correct: one
        explanation: >-
          Only `nums[right]` arrives on a pass, so one jump is always enough here. What is wrong
          is where `left` lands, not how many times it moves.
      pop-newest:
        prompt: On the pass with `right` at 4, `zero_at` is `[2, 4]`. Which 0 has to leave the window?
        options:
          - id: oldest
            text: The 0 at index 2, the oldest
          - id: newest
            text: The 0 at index 4, the newest
          - id: either
            text: Either one, since both are 0s
        correct: oldest
        explanation: >-
          Every subarray that ends at `right` contains the value at `right`, so that 0 cannot
          leave. Dropping the oldest 0 keeps the most values, and `left` lands one past it, at 3.
      no-pop:
        prompt: On the last pass, the 0s at indices 2, 4 and 6 have arrived and `k` is 1. Where should `left` land?
        options:
          - id: five
            text: At 5, one past the 0 at index 4
          - id: three
            text: At 3, one past the 0 at index 2
          - id: seven
            text: At 7, one past the 0 at index 6
        correct: five
        explanation: >-
          The window may keep one 0, the new one at index 6, so the 0 at index 4 has to leave as
          well. Popping each 0 as it leaves keeps the oldest 0 still in the window at the front of
          `zero_at`.

  - id: checkpoint-debug-record-early
    heading: Which call does it fail on?
    tags: [sliding-window, hash-map, python]
    prompt: |-
      A suggested solution returns the length of the longest substring of `s` with at most `k`
      types. One detail is slightly off:

      ```python
      def longest(s, k):
          counts = {}
          left = best = 0
          for right, ch in enumerate(s):
              counts[ch] = counts.get(ch, 0) + 1
              best = max(best, right - left + 1)
              while len(counts) > k:
                  gone = s[left]
                  counts[gone] -= 1
                  if counts[gone] == 0:
                      del counts[gone]
                  left += 1
          return best
      ```

      Which call returns a wrong answer?
    options:
      - id: broken-longest
        text: '`longest("aabbc", 2)`'
        explanation: >-
          When the `c` arrives, the window `a, a, b, b, c` holds 3 types, and its length, 5, is
          recorded before the `while` repairs it. The call returns 5, but the longest valid
          substring is `aabb`, of length 4. Moving the record below the `while` fixes it.
      - id: tie
        text: '`longest("caabb", 2)`'
        explanation: >-
          The broken window `c, a, a, b` is recorded as 4 before the repair, but `aabb` is 4 too,
          so the call returns 4, which is right.
      - id: shorter
        text: '`longest("abcbb", 2)`'
        explanation: >-
          The broken window `a, b, c` is recorded as 3, less than `bcbb`, of length 4. The call
          returns 4, which is right.
      - id: tie-end
        text: '`longest("cbbaa", 2)`'
        explanation: >-
          The broken window `c, b, b, a` is recorded as 4, the same as `bbaa`. The call returns 4,
          which is right.
    correct: broken-longest
    followUps:
      tie:
        prompt: In `longest("caabb", 2)`, the broken window `c, a, a, b` is recorded. Why does that not change the result?
        options:
          - id: no-longer
            text: Its length, 4, is no more than the true answer, `aabb`
          - id: erased
            text: The `while` erases the record when it repairs the window
          - id: never
            text: A broken window is never recorded
        correct: no-longer
        explanation: >-
          A record taken before the repair can be one letter longer than the last valid window.
          It changes the result only when that length beats every valid substring.
      shorter:
        prompt: When can recording before the repair change the result?
        options:
          - id: beats
            text: When a broken window is longer than every valid substring
          - id: any-repair
            text: Whenever any pass repairs the window
          - id: ends-new
            text: Only when the string ends with a new type
        correct: beats
        explanation: >-
          `max` keeps the largest length seen. In `abcbb` the only broken window, `a, b, c`, has
          length 3, below the answer 4, so it never becomes the largest.
      tie-end:
        prompt: The broken window `c, b, b, a` is recorded as 4. What is the longest valid substring of `cbbaa`?
        options:
          - id: bbaa
            text: '`bbaa`, also of length 4'
          - id: cbb
            text: '`cbb`, of length 3'
          - id: baa
            text: '`baa`, of length 3'
        correct: bbaa
        explanation: >-
          `bbaa` holds 2 types, so it is valid, and its length ties the broken record. `max`
          returns 4 either way, so this call cannot expose the misplaced line.
