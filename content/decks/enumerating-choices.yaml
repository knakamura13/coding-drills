id: enumerating-choices
title: "Backtracking: subsets and orderings"
description: List what a search records, count its lists, tell a repeated value from a repeated sibling, and say which assumption makes a prune safe. Each card asks for one decision, with a worked example on hand.
heading: What does the search record?

questions:
  - id: pairs-leaf-trace
    format: step-trace
    heading: Trace the leaves
    tags: [backtracking, recursion]
    workedExample: |-
      A search's output is the leaves that record, so this path asks which leaves a search
      reaches, which repeat, and which branches it can cut. `pick(start)` chooses 2 of
      `items = [6, 2, 9]`: its loop runs `j` from `start`, takes `items[j]` and calls
      `pick(j + 1)`, and a call holding 2 items records them.

      1. `pick(0)` takes the 6 and calls `pick(1)`, whose loop covers indices 1 and 2. Its two
         calls are leaves that record `[6, 2]` and then `[6, 9]`.
      2. `pick(0)` pops the 6 and takes the 2. `pick(2)` loops only over index 2, so its one call
         records `[2, 9]`.
      3. Each call looks only past the index just taken, so each pair of indices comes out once,
         in index order: 3 leaves, and never `[9, 6]`.
    prompt: >-
      `pick(start)` records every pair from `items = [4, 1, 7, 3]`: its loop takes `items[j]` and
      calls `pick(j + 1)`, and a call holding 2 items records a copy of `path`. `first` is `j` in
      `pick(0)`, and `second` is `j` in the call one level down. That call has recorded `[4, 1]`,
      `[4, 7]` and `[4, 3]`, and its loop has run out. The arrows move when a step is revealed.
      Predict each step before it is shown.
    code: |
      def pick(start):
          if len(path) == 2:
              out.append(path[:])
              return
          for j in range(start, len(items)):
              path.append(items[j])
              pick(j + 1)
              path.pop()
    sequence:
      kind: array
      name: items
      cells: [4, 1, 7, 3]
    start:
      - { name: first, at: 0 }
      - { name: second, at: 3 }
    steps:
      - line: 8
        ask: "`pick(0)` pops the 4 and its loop moves on. Tap where `first` lands."
        pointer: first
        correct: 1
        explanation: >-
          The top loop advances `j` by one, to index 1. Every pair that starts with 4 is already
          recorded, so the next pairs start with 1.
        misses:
          - index: 0
            explanation: >-
              A loop never goes back to a `j` it has finished. All three pairs that start with 4
              are already in `out`.
          - index: 3
            explanation: >-
              Index 3 is where `second` stopped, in the call below. `first` belongs to the top
              loop, which moves one cell at a time.
        elsewhere: The top loop moves `j` from 0 to 1.
      - line: 7
        ask: "`pick(0)` appends the 1 and calls `pick(2)`. Tap where `second` starts."
        pointer: second
        correct: 2
        explanation: >-
          The call is `pick(j + 1)` with `j = 1`, so its loop starts at index 2. It records
          `[1, 7]` and then `[1, 3]`.
        misses:
          - index: 0
            explanation: >-
              Starting at 0 would record `[1, 4]`, the same pair as `[4, 1]` in another order.
              The call passes `j + 1`, so it only sees items after the 1.
          - index: 1
            explanation: >-
              Starting at `first` would pair the 1 with itself, `[1, 1]`. The call passes
              `j + 1`, one past the item just taken.
        elsewhere: "`pick(j + 1)` with `j = 1` starts its loop at index 2."
      - line: 3
        ask: After `[1, 7]` and `[1, 3]`, `pick(0)` pops the 1 and moves `first` on to the 7. What is the next leaf?
        options:
          - id: seven-three
            text: "`[7, 3]`"
            explanation: >-
              The call below starts at index 3, so the only item it can pair with 7 is the 3.
          - id: seven-four
            text: "`[7, 4]`"
            explanation: >-
              That pair was already recorded as `[4, 7]`. The call below starts at index 3, so the
              4 at index 0 is out of its reach.
          - id: seven-one
            text: "`[7, 1]`"
            explanation: >-
              That pair was already recorded as `[1, 7]`. The call below only looks at items after
              the 7.
        correct: seven-three
        also:
          - { name: first, at: 2 }
          - { name: second, at: 3 }
      - line: 5
        ask: "`pick(0)` pops the 7, moves `first` on to the 3 and calls `pick(4)` with `path == [3]`. What does that call record?"
        options:
          - id: nothing
            text: Nothing
            explanation: >-
              `range(4, 4)` is empty, and `path` holds one item, not two. So the 3 starts no pair,
              and the search ends with 6 leaves, one per pair of indices: 4 × 3 / 2 = 6.
          - id: single
            text: "`[3]`"
            explanation: >-
              A leaf needs `len(path) == 2`. `pick(4)` holds one item and has nothing left to add,
              so it records nothing.
          - id: wraps
            text: "`[3, 4]`"
            explanation: >-
              The loop runs from `start` to the end and never wraps around to index 0. The pair
              was recorded as `[4, 3]`.
        correct: nothing
        also:
          - { name: first, at: 3 }

  - id: count-three-of-five
    heading: How many lists?
    tags: [backtracking, recursion]
    workedExample: |-
      Consider choosing 3 of `items = [2, 4, 6, 8]` with the `pick` loop, which records `path` once
      it holds 3 items. Each call loops only past the index just taken, so the items in a list are
      in index order, and its first item decides which items can follow.

      1. A list that starts at index 0 picks its other 2 items from indices 1 to 3. That gives
         `[2, 4, 6]`, `[2, 4, 8]` and `[2, 6, 8]`, 3 lists.
      2. A list that starts at index 1 picks 2 items from indices 2 and 3, so it can only be
         `[4, 6, 8]`, 1 list. Index 2 has 1 item after it and index 3 has none, too few to finish a
         list of 3, so they start no list.
      3. So the search records `3 + 1 = 4` lists.
    prompt: |-
      ```python
      def pick(start):
          if len(path) == 3:
              out.append(path[:])
              return
          for j in range(start, len(items)):
              path.append(items[j])
              pick(j + 1)
              path.pop()
      ```

      This search records lists of 3 from `items = [5, 1, 8, 3, 6]`, starting from `pick(0)`. How
      many lists does it record?
    options:
      - id: ten
        text: "10"
        explanation: >-
          Count by the first item. Index 0 leads 6 lists, one for each pair from the 4 items after
          it (3 + 2 + 1). Index 1 leads 3, and index 2 leads only `[8, 3, 6]`. Indices 3 and 4 have
          too few items after them. That makes 6 + 3 + 1 = 10.
      - id: sixty
        text: "60"
        explanation: >-
          5 × 4 × 3 = 60 counts a first, second and third pick in every order, so each set of three
          is counted 6 times, once per order. This search takes items in index order only, so it
          records each set of three a single time.
      - id: nine
        text: "9"
        explanation: >-
          9 leaves out the list that starts at index 2. The 8 still has two items after it, so
          `[8, 3, 6]` is recorded. Only indices 3 and 4 start no list.
      - id: six
        text: "6"
        explanation: >-
          6 counts only the lists that start with the 5. Once they are recorded, the top loop moves
          on: the 1 leads 3 more lists and the 8 leads 1.
    correct: ten
    followUps:
      sixty:
        prompt: Does this search record both `[5, 1, 8]` and `[1, 5, 8]`?
        options:
          - id: once
            text: No, the call below starts after `j`, so each set comes out once
          - id: both
            text: Yes, every order of the three items is a separate leaf
          - id: equal-only
            text: Only when two of the items are equal
        correct: once
        explanation: >-
          After taking index `j`, the next call looks only at later indices. So the items in each
          list are in index order, and the 5 can never follow the 1.
      nine:
        prompt: With `path == [8]`, which items can the call below take?
        options:
          - id: three-six
            text: The 3 and the 6, enough to finish `[8, 3, 6]`
          - id: none
            text: None, since the 8 is too close to the end
          - id: six-only
            text: Only the 6, the last item
        correct: three-six
        explanation: >-
          The call below is `pick(3)`, which loops over indices 3 and 4. A list of 3 needs two more
          items after its first, and the 8 has exactly two.
      six:
        prompt: "`pick(0)` has recorded every list that starts with the 5. What does its loop do next?"
        options:
          - id: next-index
            text: It moves `j` to index 1 and takes the 1
          - id: ends
            text: It ends, since a list of 3 is already recorded
          - id: restarts
            text: It starts over at index 0
        correct: next-index
        explanation: >-
          The top loop runs over every index. Each later first item leads its own lists, as long as
          at least two items come after it.

  - id: orderings-count
    heading: How many orderings?
    tags: [backtracking, recursion]
    workedExample: |-
      Consider the ordering search over `items = "pq"`. `used[i]` is `True` while `items[i]` is in
      `path`, and a call records once `path` holds every item.

      1. The top call has 2 unused items. It takes the p first, and the call below skips the p,
         since `used[0]` is `True`, so it can only place the q. That records `pq`.
      2. The top call then pops the p, sets `used[0]` back to `False` and takes the q. The call
         below can only place the p, which records `qp`.
      3. The levels offered 2 choices and then 1, so the search records `2 × 1 = 2` strings.
    prompt: |-
      An ordering of a list uses every item once, in some order. This search records every ordering
      of `items = "xyz"`, starting with `used = [False, False, False]`. `used[i]` is `True` while
      `items[i]` is in `path`, so each call skips the items already placed. The product
      `n × (n − 1) × ... × 2 × 1` is written `n!`, said "n factorial": `4!` is
      `4 × 3 × 2 × 1 = 24`.

      ```python
      def explore():
          if len(path) == len(items):
              out.append("".join(path))
              return
          for i in range(len(items)):
              if used[i]:
                  continue
              used[i] = True
              path.append(items[i])
              explore()
              path.pop()
              used[i] = False
      ```

      How many strings does the search record?
    options:
      - id: six
        text: "6"
        explanation: >-
          The top loop has 3 items to start with. The call one level down skips the item in
          `path`, so it has 2, and the last level has 1: 3 × 2 × 1 = 6, which is `3!`. The strings
          are `xyz`, `xzy`, `yxz`, `yzx`, `zxy` and `zyx`. In general, `n` distinct items have `n!`
          orderings.
      - id: twenty-seven
        text: "27"
        explanation: >-
          27 is 3 × 3 × 3, as if every level could take any item. `used` skips the items already
          in `path`, so a string such as `xxy` is never built.
      - id: eight
        text: "8"
        explanation: >-
          8 is 2 × 2 × 2, the count of ways to take or skip each item. Every recorded string uses
          all 3 items, and only their order changes.
      - id: three
        text: "3"
        explanation: >-
          Each first letter leads more than one string. After the x, the call below can place the
          y or the z next, so the x leads `xyz` and `xzy`.
    correct: six
    followUps:
      twenty-seven:
        prompt: With `path == ['x']`, which items can the next call place?
        options:
          - id: y-and-z
            text: The y and the z, since `used[0]` skips the x
          - id: all-three
            text: The x, the y and the z
          - id: y-only
            text: Only the y, the next item in order
        correct: y-and-z
        explanation: >-
          Each level skips the items already in `path`, so the levels offer 3, 2 and 1 choices.
      eight:
        prompt: How many items does every recorded string hold?
        options:
          - id: all-three
            text: All 3, since a call records only once `path` holds every item
          - id: any
            text: Anywhere from 0 to 3
          - id: two
            text: 2, on average
        correct: all-three
        explanation: >-
          The record line runs only when `len(path) == len(items)`. The strings differ in order,
          not in which items they hold.
      three:
        prompt: With `path == ['x']`, how many strings does that branch record?
        options:
          - id: two
            text: 2, `xyz` and `xzy`
          - id: one
            text: 1, `xyz`
          - id: three
            text: 3, one per item
        correct: two
        explanation: >-
          The call below has 2 unused items to place next, and each choice leaves 1 for the last
          level. So each first letter leads 2 × 1 = 2 strings.

  - id: equal-values-distinct-subsets
    heading: How many different lists?
    tags: [backtracking]
    workedExample: |-
      Consider the take-or-skip search over `items = [3, 3]`. At each index it first takes the item
      and then skips it, and it records `path` after the last index.

      1. Two indices with two choices each give `2 × 2 = 4` leaves: take both, take index 0 only,
         take index 1 only, take neither.
      2. Those leaves record `[3, 3]`, `[3]`, `[3]` and `[]`. Taking index 0 only and taking index 1
         only both hold one 3, so both record the list `[3]`.
      3. So the 4 leaves hold 3 different lists: `[3, 3]`, `[3]` and `[]`. A list here is set by how
         many 3s it holds, not by which indices it took.
    prompt: |-
      A subset of a list is any choice of its items, from none to all of them. This take-or-skip
      search records one list for each choice of indices, so `n` items give `2 ** n` lists, a count
      that grows as O(2^n).

      ```python
      def explore(i):
          if i == len(items):
              out.append(path[:])
              return
          path.append(items[i])
          explore(i + 1)
          path.pop()
          explore(i + 1)
      ```

      `items` is `[1, 2, 2]`, so the search records `2 ** 3 = 8` lists. How many different lists
      are among them?
    options:
      - id: six
        text: "6"
        explanation: >-
          Take the 1 or not, and take zero, one or two 2s: 2 × 3 = 6. Each list holding a single 2
          comes out twice, once per index, so 8 − 2 = 6.
      - id: eight
        text: "8"
        explanation: >-
          8 counts choices of indices. Taking index 1 or index 2 gives the same value, so `[2]`
          and `[1, 2]` each appear twice.
      - id: four
        text: "4"
        explanation: >-
          4 is the count for the values 1 and 2 used at most once each. The input holds two 2s,
          and a list may take both, so `[2, 2]` and `[1, 2, 2]` count too.
      - id: seven
        text: "7"
        explanation: >-
          Two lists repeat, not one. `[2]` repeats, and so does `[1, 2]`, which is the same
          choice with the 1 added.
    correct: six
    followUps:
      eight:
        prompt: >-
          One leaf skips the 1, takes index 1 and skips index 2. Another skips the 1, skips index
          1 and takes index 2. What do they record?
        options:
          - id: same
            text: "`[2]` and `[2]`, the same list twice"
          - id: different
            text: "`[2]` and `[2, 2]`, two different lists"
          - id: dropped
            text: "Only one `[2]`, since a repeat is never recorded"
        correct: same
        explanation: >-
          Each leaf records the values it took. Two different index choices can hold the same
          values, and the search records both.
      four:
        prompt: Can this search record `[2, 2]` when `items` is `[1, 2, 2]`?
        options:
          - id: yes
            text: Yes, it takes both items equal to 2
          - id: no
            text: No, it takes each value at most once
          - id: sorted
            text: Only when the input is sorted first
        correct: yes
        explanation: >-
          The search chooses items, not values, and the input has two items equal to 2. Taking
          both gives `[2, 2]`, a different list from taking one.
      seven:
        prompt: Which lists appear twice among the 8?
        options:
          - id: two-and-pair
            text: "`[2]` and `[1, 2]`"
          - id: just-two
            text: "Only `[2]`"
          - id: long-ones
            text: "`[2, 2]` and `[1, 2, 2]`"
        correct: two-and-pair
        explanation: >-
          Each list that holds exactly one 2 can take it from index 1 or index 2. With or without
          the 1, that gives two repeats.

  - id: skip-repeat-sibling
    format: tap-cell
    heading: Which index is skipped?
    tags: [backtracking, sorting]
    workedExample: |-
      Consider sorted `nums = [1, 3, 3]` and `explore(0)`, the top call of a search that records
      `path` at every call and skips index `i` when `i > start` and `nums[i] == nums[i - 1]`.

      1. At `i = 0` the 1 has no left neighbour, so the loop takes it. At `i = 1` the 3 differs from
         the 1 before it, so the loop takes it too, and that branch records `[3]` and `[3, 3]`.
      2. At `i = 2`, `2 > 0` holds and `nums[2] == nums[1]`, so the loop skips the second 3.
      3. A branch opened by the second 3 would record `[3]` again. Since the list is sorted, equal
         values sit side by side, so comparing each value with its left neighbour finds the repeat.
    prompt: >-
      This search records `path` at every call, so each call records one subset. `nums` is sorted,
      so equal values sit side by side. Tap the index that the loop of the top call, `explore(0)`,
      skips.
    code: |
      def explore(start):
          out.append(path[:])
          for i in range(start, len(nums)):
              if i > start and nums[i] == nums[i - 1]:
                  continue
              path.append(nums[i])
              explore(i + 1)
              path.pop()
    sequence:
      kind: array
      name: nums
      cells: [2, 2, 5]
    correct: 1
    explanation: >-
      At `i = 1`, `1 > 0` holds and `nums[1] == nums[0]`, so `continue` skips it. The first 2's
      branch already recorded `[2]`, `[2, 2]`, `[2, 2, 5]` and `[2, 5]`. A branch opened by the
      second 2 would record `[2]` and `[2, 5]` again.
    misses:
      - index: 0
        explanation: >-
          `i = 0` is the loop's first pass, so `i > start` is false. The first 2 opens the branch
          that records every subset starting with a 2.
      - index: 2
        explanation: >-
          The 5's left neighbour is a 2, so `nums[2] == nums[1]` is false and the loop takes it.
          Its branch records `[5]`, which no earlier branch did.

  - id: repeat-down-the-path
    format: tap-cell
    heading: Which item comes next?
    tags: [backtracking, sorting]
    workedExample: |-
      Consider sorted `nums = [3, 3]` and the loop that skips index `i` when `i > start` and
      `nums[i] == nums[i - 1]`. The skip stops one value from opening two branches in the same loop.

      1. In `explore(0)`, `i = 0` takes the first 3. At `i = 1`, `1 > 0` holds and
         `nums[1] == nums[0]`, so the second 3 is skipped there. A branch starting with it would
         list the same subsets again.
      2. Taking the first 3 calls `explore(1)`, so that call's `start` is 1. Its loop begins at
         `i = 1`, where `i > start` is false, so the skip cannot fire on that first pass.
      3. So that call takes the second 3, and `[3, 3]` is recorded. The skip blocks a repeat beside
         it in one loop, never a repeat further down one path.
    prompt: >-
      This search records each distinct subset of a sorted list once. `nums` is `[1, 2, 2, 2, 5]`,
      and `explore(2)` runs with `path == [1, 2]`. Tap the item its loop takes first.
    code: |
      def explore(start):
          out.append(path[:])
          for i in range(start, len(nums)):
              if i > start and nums[i] == nums[i - 1]:
                  continue
              path.append(nums[i])
              explore(i + 1)
              path.pop()
    sequence:
      kind: array
      name: nums
      cells: [1, 2, 2, 2, 5]
    correct: 2
    explanation: >-
      `i == start` on the first pass, so `i > start` is false and the 2 at index 2 is taken.
      `path` becomes `[1, 2, 2]`. The rule only stops a value from opening a second sibling branch
      in the same loop. A repeat further down one path is a different subset.
    misses:
      - index: 0
        explanation: >-
          `explore(2)` loops from index 2. The 1 at index 0 is already in `path` and lies before
          `start`.
      - index: 1
        explanation: >-
          Index 1 is the 2 the caller just took. This call's loop starts at `start`, which is 2.
      - index: 3
        explanation: >-
          Index 3 is skipped in this loop, but only after index 2 has had its turn. It is a second
          2 in the same loop, so it would start the same lists again.
      - index: 4
        explanation: >-
          Jumping to the 5 means skipping every 2, as a test of `i > 0` would. That loses
          `[1, 2, 2]` and `[1, 2, 2, 2]`.

  - id: skip-from-zero
    heading: Which lists are lost?
    tags: [backtracking, sorting]
    workedExample: |-
      Consider sorted `nums = [1, 4, 4]` and `explore(start)`, which records `path` and then loops
      `i` from `start`, skipping `i` when `i > start` and `nums[i] == nums[i - 1]`.

      1. `explore(0)` records `[]`, takes the 1, and calls `explore(1)`, which records `[1]`, takes
         the 4 at index 1, and calls `explore(2)` with `path == [1, 4]`.
      2. `explore(2)` records `[1, 4]`. Its loop starts at `i = start = 2`, so `i > start` is false
         and it takes the second 4, which records `[1, 4, 4]`.
      3. Back in `explore(1)`, `i = 2` is skipped, since `2 > 1` and `nums[2] == nums[1]`.
         `explore(0)` then takes the 4 at index 1, which gives `[4]` and `[4, 4]`, and skips
         index 2. Each distinct subset comes out once.
    prompt: |-
      With sorted `nums = [3, 3, 6]`, the test `i > start` records `[]`, `[3]`, `[3, 3]`,
      `[3, 3, 6]`, `[3, 6]` and `[6]`. A slip changes the test to `i > 0`:

      ```python
      def explore(start):
          out.append(path[:])
          for i in range(start, len(nums)):
              if i > 0 and nums[i] == nums[i - 1]:
                  continue
              path.append(nums[i])
              explore(i + 1)
              path.pop()
      ```

      Which lists does the slipped version lose?
    options:
      - id: both-threes
        text: "`[3, 3]` and `[3, 3, 6]`"
        explanation: >-
          With `i > 0`, index 1 is skipped in every loop, including the call that already took
          index 0. No list can hold both 3s, so the slipped version returns
          `[[], [3], [3, 6], [6]]`.
      - id: none
        text: None, the six lists are the same
        explanation: >-
          The tests differ when a call's loop opens on a repeat. In `explore(1)`, `i == start ==
          1`, so `i > start` is false and the second 3 is taken, but `i > 0` is true and skips it.
      - id: only-long
        text: "Only `[3, 3, 6]`"
        explanation: >-
          `[3, 3]` needs the same step as `[3, 3, 6]`: taking index 1 inside the call that took
          index 0. That is the step `i > 0` skips, so both are lost.
      - id: with-six
        text: "`[3, 6]` and `[6]`"
        explanation: >-
          Those lists use at most one 3, and index 0 supplies it. `i > 0` never skips index 0, so
          only lists that need the second 3 are lost.
    correct: both-threes
    followUps:
      none:
        prompt: In `explore(1)`, with `path == [3]`, what happens on the loop's first pass?
        options:
          - id: skipped
            text: "`i` is 1, `i > 0` holds and the 3s match, so it is skipped"
          - id: taken
            text: "`i` is 1, and the first pass of a loop is always taken"
          - id: restarts
            text: "`i` is 0, since every loop starts over at the front"
        correct: skipped
        explanation: >-
          `i > 0` ignores where the loop started. `i > start` is what lets the first pass take a
          repeat, which is how one path holds both 3s.
      only-long:
        prompt: Which item must the call holding `[3]` take to record `[3, 3]`?
        options:
          - id: index-one
            text: The 3 at index 1, which `i > 0` skips
          - id: index-zero
            text: The 3 at index 0, taken a second time
          - id: top
            text: None, `[3, 3]` comes from the top loop
        correct: index-one
        explanation: >-
          Each item is used once, so the second 3 has to be index 1. The slipped test skips it, so
          every list that needs both 3s is lost.
      with-six:
        prompt: Does `[3, 6]` need the 3 at index 1?
        options:
          - id: no
            text: No, the 3 at index 0 is enough, and it is never skipped
          - id: yes-index
            text: Yes, since the 6 sits at index 2, after index 1
          - id: yes-all
            text: Yes, every list holding a 3 uses index 1
        correct: no
        explanation: >-
          Index 0 has no left neighbour to match, so neither test skips it. Lists with one 3 take
          that one and are still found.

  - id: negative-value-stop
    heading: Which assumption makes it safe?
    tags: [backtracking]
    workedExample: |-
      Consider `nums = [4, 3, 5]` with target 7. `left` starts at 7, taking a value `x` changes it
      to `left - x`, and a branch stops as soon as `left < 0`.

      1. The branch that takes 4 and then 5 has `left = 7 - 4 - 5 = -2`, so the stop fires.
      2. Every value is positive, so each further value taken would only push `left` lower. Nothing
         deeper in that branch could bring it back up to 0.
      3. So stopping at -2 loses no set. The search still records `[4, 3]`, since `7 - 4 - 3 = 0`.
    prompt: |-
      `left` starts at the target, and taking a value `x` changes it to `left - x`. Stopping a
      branch early, because nothing below it can be recorded, is called pruning. This search prunes
      as soon as `left < 0`, and the values in `nums` can be any integers:

      ```python
      def explore(start, left):
          if left < 0:
              return
          if left == 0:
              out.append(path[:])
          for i in range(start, len(nums)):
              path.append(nums[i])
              explore(i + 1, left - nums[i])
              path.pop()
      ```

      Which stated assumption guarantees that the `left < 0` stop never loses a set?
    options:
      - id: no-negatives
        text: No value is negative, so `left` never rises
        explanation: >-
          Each step subtracts a value. With no negative value, `left` stays or falls, so once it
          is below 0 nothing deeper can bring it back. Zeros are fine: a 0 leaves `left` as it is,
          and since the record line does not return, sets with and without the 0 both come out.
      - id: distinct
        text: Every value is distinct, so no set repeats
        explanation: >-
          `[5, -2]` with target 3 has distinct values. Taking 5 drops `left` to -2, the stop
          fires, and `[5, -2]` is never recorded.
      - id: positive-target
        text: The target is above 0, so `left` starts positive
        explanation: >-
          The target 3 is above 0 in `[5, -2]` too. Where `left` starts does not stop a later
          negative value from raising it back to 0.
      - id: within-target
        text: No single value is larger than the target
        explanation: >-
          In `[2, 3, -2]` with target 3, no value is above 3. Taking 2 and 3 leaves `left == -2`,
          the stop fires, and `[2, 3, -2]` is lost.
    correct: no-negatives
    followUps:
      distinct:
        prompt: With `[5, -2]` and target 3, what happens after the search takes the 5?
        options:
          - id: stops
            text: "`left` is -2, so the call returns before it can take the -2"
          - id: waits
            text: "`left` is still 3, since it is only reduced at a leaf"
          - id: adds
            text: "`left` is -2, but the loop takes the -2 before the stop runs"
        correct: stops
        explanation: >-
          The stop is the first line of the call, before its loop. A negative value that could
          have fixed the total is never reached.
      positive-target:
        prompt: Once `left` is below 0, what can bring it back to 0?
        options:
          - id: negative
            text: Only taking a negative value
          - id: loop-end
            text: Reaching the end of the loop
          - id: smaller
            text: Taking any value smaller than the target
        correct: negative
        explanation: >-
          Taking `x` changes `left` to `left - x`, which rises only when `x` is negative. Rule out
          negative values and a stop below 0 is safe.
      within-target:
        prompt: >-
          Taking 2 and then 3 from `[2, 3, -2]` leaves `left` at -2. Can a later value bring it
          back to 0?
        options:
          - id: yes
            text: Yes, taking the -2 raises `left` to 0
          - id: no-falls
            text: No, once below 0, `left` can only fall
          - id: no-bounded
            text: No, since each value is at most the target
        correct: yes
        explanation: >-
          -2 − (-2) is 0, so `[2, 3, -2]` adds up to 3. A bound on the size of each value says
          nothing about whether `left` can rise.

  - id: sorted-break-drag
    format: drag-pointers
    heading: Where does the loop stop?
    tags: [backtracking, sorting]
    workedExample: |-
      Consider sorted `weights = [2, 3, 6, 8]` and a call with `left = 6` whose loop starts at
      index 0. The loop runs `break` at the first `weights[i] > left`.

      1. `weights[0] = 2` and `weights[1] = 3` are not above 6, so the loop tries both.
      2. `weights[2] = 6` equals `left`, and `6 > 6` is false, so it is tried too. It fits exactly
         and brings `left` to 0.
      3. `weights[3] = 8` is above 6, so `break` runs at `i = 3`. The list is sorted, so any weight
         after it would be at least 8 and too heavy as well. Stopping there loses nothing.
    prompt: >-
      `weights` is sorted, the target is 6, and `explore(1, 5)` runs with `path == [1]`. Drag `i`
      to where this call's loop is when `break` runs.
    code: |
      def explore(start, left):
          if left == 0:
              out.append(path[:])
              return
          for i in range(start, len(weights)):
              if weights[i] > left:
                  break
              path.append(weights[i])
              explore(i + 1, left - weights[i])
              path.pop()
    sequence:
      kind: array
      name: weights
      cells: [1, 2, 4, 5, 7, 9]
    pointers:
      - name: i
        start: 1
        correct: 4
        explanation: >-
          7 is the first weight above 5. The list is sorted, so 9 is too, and `break` loses
          nothing. Before that, at `i = 3`, the 5 fits exactly and `[1, 5]` is recorded.
        misses:
          - index: 3
            explanation: >-
              5 equals `left`, so `5 > 5` is false. The loop takes it, and the next call records
              `[1, 5]`. The break comes one cell later.
          - index: 5
            explanation: >-
              `break` ends the loop at the first weight that is too heavy. 7 is already above 5,
              so the loop never reaches 9.
          - index: 2
            explanation: >-
              4 fits, since 4 is not above 5. The loop takes it. The call below breaks on 5 > 1,
              but that ends only the call below's loop.
          - index: 1
            explanation: >-
              2 fits with room to spare. The call below finds nothing (4 > 3), and this loop moves
              on.
        elsewhere: The break runs at the first weight greater than `left`, which is 5.
