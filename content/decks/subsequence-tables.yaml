  - id: walk-back-trace
    format: step-trace
    heading: Predict each step of the walk back
    tags: [dp, python]
    workedExample: |-
      Consider the table for `a = "bead"` and `b = "bad"`, walked back from the corner `(4, 3)`. On
      a match the walk records the letter and steps diagonally, and otherwise it steps to the larger
      of the cell above and the cell to the left.

      1. At `(4, 3)` both letters are `d`, so the walk records `d` and steps to `(3, 2)`. Both
         letters there are `a`, so it records `a` and steps to `(2, 1)`.
      2. At `(2, 1)`, `e` and `b` differ. The cell above, `dp[1][1]`, is 1 and the cell to the left,
         `dp[2][0]`, is 0, so the walk steps up to `(1, 1)`.
      3. At `(1, 1)` both letters are `b`, so it records `b`. The letters came out as `d`, `a`, `b`,
         and reversed they read `bad`.
    prompt: |-
      Below is the table for `a = "crate"` and `b = "cart"`. The board shows its rows, each
      labelled by the last letter of its prefix of `a`. `i` starts at 5 and `j` starts at 4.
      Predict each step of the walk back.

      ```
           -  c  a  r  t
      -    0  0  0  0  0
      c    0  1  1  1  1
      r    0  1  1  2  2
      a    0  1  2  2  2
      t    0  1  2  2  3
      e    0  1  2  2  3
      ```
    code: |
      def walk_back(a, b, dp):
          i, j = len(a), len(b)
          out = []
          while i > 0 and j > 0:
              if a[i - 1] == b[j - 1]:
                  out.append(a[i - 1])
                  i -= 1
                  j -= 1
              elif dp[i - 1][j] >= dp[i][j - 1]:
                  i -= 1
              else:
                  j -= 1
          return ''.join(reversed(out))
    sequence: { kind: array, name: rows, cells: ['-', c, r, a, t, e] }
    start:
      - { name: i, at: 5 }
    steps:
      - line: 5
        ask: At `(5, 4)`, `e` and `t` differ. Where is `i` after this pass?
        pointer: i
        correct: 4
        explanation: >-
          The cell above, `dp[4][4]`, is 3 and the cell to the left, `dp[5][3]`, is 2. The walk
          goes up, so `i` drops to 4 and `j` stays 4.
        misses:
          - index: 5
            explanation: >-
              Staying in row 5 means stepping left to `dp[5][3]`, which is 2. The cell above holds
              3, so the walk goes up.
        elsewhere: A mismatch moves one step, up or left, and going up lowers `i` by 1.
      - line: 5
        ask: At `(4, 4)` both letters are `t`. What does this pass do?
        options:
          - id: record-diagonal
            text: Records `t` and moves to `(3, 3)`
            explanation: >-
              A match records the letter and drops the last letter of both prefixes, so `i` and
              `j` both fall by 1.
          - id: record-up
            text: Records `t` and moves to `(3, 4)`
            explanation: >-
              Moving only up keeps the `t` of `cart` in play after it was just matched. A match
              lowers both `i` and `j`.
          - id: move-up
            text: Moves up to `(3, 4)` without recording
            explanation: >-
              The larger-neighbor rule is for mismatches. A cell whose letters match took its value
              from the diagonal plus 1, so the walk records the letter.
        correct: record-diagonal
        also:
          - { name: i, at: 3 }
      - line: 5
        ask: At `(3, 3)`, `a` and `r` differ, and both neighbors hold 2. Where is `i` after this pass?
        pointer: i
        correct: 2
        explanation: >-
          On a tie the `>=` on line 9 sends the walk up, so `i` drops to 2 and `j` stays 3.
        misses:
          - index: 3
            explanation: >-
              Staying in row 3 means stepping left. Both neighbors hold 2, and the `>=` sends a tie
              up.
        elsewhere: A mismatch moves one step, and this tie goes up.
      - line: 13
        ask: The passes at `(2, 3)`, `(1, 2)` and `(1, 1)` run next. What does the call return?
        options:
          - id: crt
            text: "`crt`"
            explanation: >-
              `(2, 3)` records `r`. At `(1, 2)`, `c` and `a` differ and the cell to the left is
              larger, so `(1, 1)` records `c`. Reversed, `t`, `r`, `c` read `crt`.
          - id: trc
            text: "`trc`"
            explanation: >-
              `trc` is the order the letters were recorded in, from the ends of the words. The walk
              reverses `out` before returning it.
          - id: cat
            text: "`cat`"
            explanation: >-
              `cat` is also a longest common subsequence, but this walk never records the `a`. It
              would have to step left at the tie in `(3, 3)`.
        correct: crt
        also:
          - { name: i, at: 0 }
      - line: 4
        ask: >-
          This call made 6 passes. For any `a` of 5 letters and `b` of 4, what is the most passes
          the loop can make?
        options:
          - id: eight
            text: '8'
            explanation: >-
              Every pass lowers `i`, `j` or both, so `i + j` falls by at least 1 from its start of
              9. A pass runs only while both are at least 1, so `i + j` is still 2 or more when
              the last pass starts: at most 7 passes come before it, 8 in all. That is one fewer
              than `len(a) + len(b)`, and `a = "brown"` with `b = "bell"` takes all 8.
          - id: twenty
            text: '20'
            explanation: >-
              20 is one pass for each cell where `i` and `j` are both at least 1, 5 times 4. Each
              pass lowers `i + j`, so the walk never comes back to a cell: it crosses the table
              along one path, not cell by cell.
          - id: nine
            text: '9'
            explanation: >-
              9 passes would need `i + j` to fall from 9 to 0 by exactly 1 each time. The last
              pass starts with both `i` and `j` at least 1, so at most 7 passes come before it.
          - id: five
            text: '5'
            explanation: >-
              5 counts only the passes that lower `i`. A pass that steps left lowers only `j`, so
              a walk can step up 4 times and left 3 times before its last pass.
        correct: eight

  - id: substring-mismatch-zero
    heading: What does the run cell hold?
    tags: [dp, arrays-strings]
    workedExample: |-
      Consider `a = "stamp"` and `b = "tamer"`. In a longest common substring table, `run[i][j]`
      is the length of the shared run that ends exactly at `a[i - 1]` and `b[j - 1]`. On a match,
      the run that ends at the pair before it, the diagonal, grows by one letter.

      1. `a[1]` and `b[0]` are both `t`. The diagonal `run[1][0]` sits in column 0, the empty
         prefix of `b`, so it holds 0, and `run[2][1] = 0 + 1 = 1`.
      2. `a[2]` and `b[1]` are both `a`. The run `t` ends just before them, so
         `run[3][2] = run[2][1] + 1 = 2`, for `ta`.
      3. `a[3]` and `b[2]` are both `m`, so `run[4][3] = run[3][2] + 1 = 3`. That cell holds the
         run `tam`, which ends at the two `m`s.
    prompt: |-
      The longest common substring is the longest piece whose letters sit next to each other in
      both words. Its table gives a cell a new meaning: `run[i][j]` is the length of the shared
      run, letters next to each other in both words, that ends exactly at `a[i - 1]` and
      `b[j - 1]`. A match adds 1 to the diagonal. For `a = "sport"` and `b = "spoon"`,
      `run[4][4]` compares `a[3]`, an `r`, with `b[3]`, an `o`. The diagonal `run[3][3]` is 3, the
      cell above, `run[3][4]`, is 1, and the cell to the left, `run[4][3]`, is 0. What does
      `run[4][4]` hold?
    options:
      - id: zero
        text: "0: the letters differ, so the run breaks"
        explanation: >-
          A shared run that ends at this pair would end with an `r` in `sport` and an `o` in
          `spoon`. The letters differ, so no shared run ends here, even though `spo` ends just
          before the pair.
      - id: larger
        text: "1: the larger of the cell above and the cell to the left"
        explanation: >-
          That is the LCS rule, which carries a count across a gap. The cell above holds the run
          `o` that pairs the `o` of `sport` with the second `o` of `spoon`, a run that ends at a
          different pair. No neighbor's run ends at the `r` and the `o`.
      - id: diagonal
        text: "3: the diagonal, carried over unchanged"
        explanation: >-
          The diagonal is the run `spo`, which ends just before this pair. Carrying it over counts
          the `r` and the `o` as part of the run, but they differ, so the run stops at `spo`.
    correct: zero
    followUps:
      larger:
        prompt: In this table, which run does the cell above, `run[3][4]`, describe?
        options:
          - { id: own-pair, text: "The run `o`, which ends at `a[2]` and `b[3]`" }
          - { id: best-count, text: "The most letters `spo` and `spoo` share, as in the LCS table" }
          - { id: this-pair, text: "A run that ends at this cell's `r` and `o`" }
        correct: own-pair
        explanation: >-
          Each cell describes only the run that ends at its own two letters. The cell above ends
          at a different pair, so its 1 cannot carry over to the `r` and the `o`.
      diagonal:
        prompt: "`spo` ends just before this pair. What must be true for a shared run to end at the pair?"
        options:
          - { id: equal, text: "The pair's two letters must be equal" }
          - { id: after-run, text: "The pair must come right after a shared run" }
          - { id: either, text: "One of the two letters must be in the run before it" }
        correct: equal
        explanation: >-
          A shared run is the same letters in both words, so its last letters match. `r` and `o`
          differ, so the run `spo` stops before them.

  - id: substring-answer-cell
    heading: Which cell holds the answer?
    tags: [dp, arrays-strings]
    workedExample: |-
      Consider `a = "castle"` and `b = "pastel"`, where `run[i][j]` is the length of the shared run
      that ends exactly at `a[i - 1]` and `b[j - 1]`. Read the cell `run[4][4]`, which holds 3.

