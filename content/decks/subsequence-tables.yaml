  - id: substring-table-rule
    heading: Which rule fits the task?
    tags: [dp]
    workedExample: |-
      Consider the longest common *substring* of `a = "stamp"` and `b = "tamer"`. `dp[i][j]` is the
      length of the shared run that ends exactly at `a[i-1]` and `b[j-1]`: the diagonal plus 1 on a
      match, and 0 on a mismatch.

      1. `a[1:4]` and `b[0:3]` are both `tam`. Each matching pair adds 1 to the diagonal, so
         `dp[2][1] = 1`, `dp[3][2] = 2` and `dp[4][3] = 3`.
      2. The corner `dp[5][5]` compares the last letters, `p` and `r`. They differ, so no shared run
         ends there, and the corner holds 0.
      3. So the run `tam`, of length 3, is recorded at `dp[4][3]`, where it ends, and not in the
         corner.
    prompt: |-
      Take `a = "parcel"` and `b = "pancake"`. On a match a cell is the
      diagonal plus 1. Which mismatch rule and answer cell give the longest common substring?
    options:
      - id: reset-largest
        text: "Mismatch: 0. Answer: the largest cell anywhere in the table"
        explanation: >-
          A mismatch breaks the run, so the cell is 0. The longest run can end anywhere, so the
          answer is the largest cell: 2, for `pa`.
      - id: skip-corner
        text: "Mismatch: `max(up, left)`. Answer: the corner cell"
        explanation: >-
          That is the subsequence table. It carries counts across gaps and ends at 4, for `pace`,
          which skips the `r` of `parcel` and three letters of `pancake`.
      - id: reset-corner
        text: "Mismatch: 0. Answer: the corner cell"
        explanation: >-
          The corner compares `l` with `e`. They differ, so it holds 0, though the two words share
          the run `pa` earlier on.
      - id: diagonal-largest
        text: "Mismatch: the diagonal. Answer: the largest cell anywhere"
        explanation: >-
          Copying the diagonal carries a run across a mismatch. It reaches 3 at the two `c`s,
          counting `p`, `a` and `c` as one run, though `r` and `n` sit between `a` and `c`.
    correct: reset-largest
    followUps:
      skip-corner:
        prompt: >-
          On a mismatch, `max(up, left)` keeps the count from before the gap. What does that make
          the table measure?
        options:
          - { id: subseq, text: "The longest common subsequence, where gaps are allowed" }
          - { id: substr, text: "The longest common substring, where gaps are not allowed" }
          - { id: prefix, text: "The longest prefix the two words share" }
        correct: subseq
        explanation: >-
          Carrying the best count past a mismatch is what lets letters with gaps between them add
          up. A substring count has to restart after every mismatch.
      reset-corner:
        prompt: In this substring table, which runs does the corner `dp[6][7]` describe?
        options:
          - { id: end-both, text: "Only a run that ends at the last letter of both words" }
          - { id: any-run, text: "The longest run found anywhere in the two words" }
          - { id: start-both, text: "Only a run that starts at the first letter of both words" }
        correct: end-both
        explanation: >-
          Each cell describes the run that ends exactly at its two letters. The best run can end
          earlier, so the answer is the largest cell in the table.
      diagonal-largest:
        prompt: "`r` and `n` do not match. How long is the shared run that ends at that pair?"
        options:
          - { id: zero, text: "0, since no shared run can end at two different letters" }
          - { id: two, text: "2, the run `pa` just before the pair" }
          - { id: one, text: "1, since one of the two letters may be skipped" }
        correct: zero
        explanation: >-
          A run that ends at a pair needs those two letters to be equal. Copying the diagonal
          pretends the run goes on, so `p`, `a` and `c` are counted as one run across the gap.
