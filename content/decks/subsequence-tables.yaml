id: subsequence-tables
title: "Dynamic programming: two strings"
description: Tell a subsequence from a substring, read which prefixes a cell covers, and fill an LCS table on a match and on a mismatch. Each card has a worked example on hand.
heading: What does the table hold?

questions:
  - id: subsequence-not-substring
    heading: Which one fits?
    tags: [arrays-strings]
    workedExample: |-
      This path fills a dynamic programming table that compares two strings, and first it settles
      what the two strings may share. A **substring** is letters that sit next to each other. A
      **subsequence** keeps its letters in order but may skip letters between them. Consider
      `"planet"`.

      1. `"lan"` uses indices 1, 2 and 3, back to back, so it is a substring. A substring is also a
         subsequence, since its letters are in order.
      2. `"pnt"` uses indices 0, 3 and 5. They rise from left to right, so its letters appear in
         order, and `"pnt"` is a subsequence.
      3. Indices 0 and 3 have a gap between them, so `"pnt"` is a subsequence but not a substring.
    prompt: |-
      A substring is letters that sit next to each other in a string. A subsequence keeps its
      letters in order but may skip letters between them. Which of these is a subsequence of
      `"stream"` but **not** a substring?
    options:
      - id: seam
        text: '`"seam"`'
        explanation: >-
          `s`, `e`, `a` and `m` appear in that order in `"stream"`, at indices 0, 3, 4 and 5. The
          jump from 0 to 3 means they are not next to each other.
      - id: tre
        text: '`"tre"`'
        explanation: >-
          `"tre"` sits at indices 1, 2 and 3 with no gaps, so it is a substring. The question asks
          for one that is not.
      - id: mast
        text: '`"mast"`'
        explanation: >-
          Every letter of `"mast"` is in `"stream"`, but not in that order: the `m` comes last in
          `"stream"`. Having the letters somewhere is not enough.
      - id: seem
        text: '`"seem"`'
        explanation: >-
          `"seem"` needs two `e`s after the `s`, and `"stream"` has only one `e`.
    correct: seam
    followUps:
      tre:
        prompt: '`"tre"` sits at indices 1, 2 and 3 of `"stream"`. What is it?'
        options:
          - id: both
            text: Both a substring and a subsequence
          - id: substring-only
            text: Only a substring
          - id: subsequence-only
            text: Only a subsequence
        correct: both
        explanation: >-
          Every substring is also a subsequence: letters next to each other are in order, with no
          letters skipped. The question wanted letters in order that are not all next to each
          other.
      mast:
        prompt: 'Is `"ts"` a subsequence of `"stream"`?'
        options:
          - id: no-order
            text: No, because a subsequence must keep the letters' order
          - id: yes-present
            text: Yes, because both letters appear
          - id: yes-adjacent
            text: Yes, because the two letters are next to each other
        correct: no-order
        explanation: >-
          A subsequence picks letters from left to right. `"ts"` would need an `s` somewhere after
          the `t` at index 1, and there is none.
      seem:
        prompt: '`"stream"` has one `e`. Can a subsequence use it twice, as `"seem"` would need?'
        options:
          - id: once
            text: No, each index can be used at most once
          - id: reuse
            text: Yes, as long as the order is kept
          - id: adjacent
            text: Yes, if the two copies would sit next to each other
        correct: once
        explanation: >-
          A subsequence is made by deleting letters, never by repeating them. Two `e`s in the
          pattern need two `e`s in the string.

  - id: run-or-gaps
    heading: Which length does the task want?
    tags: [dp, arrays-strings]
    workedExample: |-
      Consider `pilot` and `plot`. A common substring must sit letter by letter in both words, and
      a common subsequence only has to keep its order in both.

      1. `lot` ends both words, with no letter skipped in either, so it is a common substring of
         3 letters. `plot` is not one, since `pilot` has an `i` between its `p` and its `l`.
      2. `p`, `l`, `o` and `t` appear in that order in `pilot`, skipping the `i`, and they make up
         all of `plot`. So `plot` is a common subsequence of 4 letters.
      3. So the longest common substring has length 3 and the longest common subsequence has
         length 4. Which one a task wants depends on whether letters may be skipped.
    prompt: |-
      A task asks for the length of the longest common substring of `wander` and `warden`: the
      longest piece whose letters sit next to each other in **both** words. What is the answer?
    options:
      - id: two
        text: "2, such as `wa` or `de`"
        explanation: >-
          `wa` and `de` each sit letter by letter in both words, and no piece of three does. This
          is the longest common substring.
      - id: four
        text: "4, `wade`"
        explanation: >-
          `wade` keeps its order in both words, but it skips the `n` of `wander` and the `r` of
          `warden`. That is the longest common subsequence, which may skip letters. The task asked
          for letters next to each other.
      - id: three
        text: "3, `ard`"
        explanation: >-
          `ard` sits letter by letter in `warden`, but `wander` has no `r` between its `a` and
          `d`, so `ard` does not appear there at all.
      - id: six
        text: 6, since both words use the same six letters
        explanation: >-
          The words do use the same letters, but not in the same order: `n` comes before `d` in
          `wander` and after it in `warden`. Neither word appears inside the other.
    correct: two
    followUps:
      four:
        prompt: "`wade` skips one letter in each word. Can it be a common substring?"
        options:
          - { id: gaps, text: "No: a substring skips no letters, so `wade` is not one" }
          - { id: order, text: "Yes: only a change of order rules a piece out" }
          - { id: ends, text: "Yes: only a gap at either end rules a piece out" }
        correct: gaps
        explanation: >-
          A substring takes letters that sit next to each other. A subsequence keeps the order but
          may skip letters, which is how `wade` fits both words.
      three:
        prompt: For the answer to count `ard`, where does it have to sit letter by letter?
        options:
          - { id: both, text: "In each of the two words" }
          - { id: either, text: "In at least one of the words" }
          - { id: longer, text: "In one of them, and in order in the other" }
        correct: both
        explanation: >-
          A common substring has to appear in every word being compared. `ard` is a substring of
          `warden`, but `wander` has no `r` between its `a` and `d`, so `ard` does not count.
      six:
        prompt: "`wander` and `warden` use the same six letters. Why is the answer not 6?"
        options:
          - { id: order, text: "The order differs, so no six-letter piece is in both words" }
          - { id: repeats, text: "Each letter may be counted only once per word" }
          - { id: length, text: "Two words of the same length can never share all their letters" }
        correct: order
        explanation: >-
          Substrings and subsequences both keep letters in order. `n` comes before `d` in `wander`
          and after it in `warden`, so no piece that holds both letters can fit the two words.

  - id: cell-covers-prefixes
    heading: Which prefixes does the cell cover?
    tags: [dp, arrays-strings]
    workedExample: |-
      Consider `a = "dog"` and `b = "go"`. The table has one row for each prefix length of `a`, from
      0 to 3, and one column for each prefix length of `b`, from 0 to 2.

      1. That gives 4 rows and 3 columns. Row 0 and column 0 stand for the empty prefixes.
      2. The first index of `dp[2][1]` counts the letters kept from `a`, so the cell covers `a[:2]`,
         which is `do`.
      3. The second index counts the letters kept from `b`, so it covers `b[:1]`, which is `g`.
         `dp[2][1]` holds the longest common subsequence of `do` and `g`, which is 0.
    prompt: |-
      A prefix is the start of a string: `a[:i]`, the first `i` letters. This table holds the
      length of the longest common subsequence (LCS) of two prefixes, with one row for each prefix
      length of `a` and one column for each prefix length of `b`. For `a = "candle"` and
      `b = "lend"`, which two prefixes does `dp[3][2]` cover?
    options:
      - id: prefixes
        text: "`can` and `le`"
        explanation: >-
          Row 3 covers the first three letters of `a`, and column 2 the first two of `b`. The
          indices count letters kept, so `dp[3][2]` covers `a[:3]` and `b[:2]`.
      - id: through-index
        text: "`cand` and `len`"
        explanation: >-
          That reads 3 and 2 as the indices of the last letters kept, `a[3]` and `b[2]`. The cell
          keeps 3 and 2 letters, so its last letters are `a[2]` and `b[1]`.
      - id: letters-only
        text: "`n` and `e` on their own"
        explanation: >-
          Those are the last letters of the two prefixes, `a[2]` and `b[1]`. The cell's value is
          about the whole prefixes, so earlier letters can count too.
      - id: suffixes
        text: "`dle` and `nd`"
        explanation: >-
          Those are the last three letters of `a` and the last two of `b`. This table grows
          prefixes from the front, so row 3 is the start of `a`, not its end.
    correct: prefixes
    followUps:
      through-index:
        prompt: How many letters of `a` does row 0 cover?
        options:
          - { id: none, text: "None: row 0 is the empty prefix" }
          - { id: one, text: "One: row 0 holds `a[0]`" }
          - { id: all, text: "All of them: row 0 is the whole word" }
        correct: none
        explanation: >-
          Row `i` covers `a[:i]`, the first `i` letters. Row 0 is empty, and row 3 ends at `a[2]`,
          the third letter.
      letters-only:
        prompt: Which letters can the value in `dp[3][2]` count?
        options:
          - { id: any, text: "Any letters of `can` and `le`, matched in order" }
          - { id: last, text: "Only `n` and `e`, the last letters of the two prefixes" }
          - { id: flag, text: "None: the cell only records whether `n` equals `e`" }
        correct: any
        explanation: >-
          The cell stores the length of the longest common subsequence of the whole prefixes.
          Every letter of `can` and of `le` can be part of it.
      suffixes:
        prompt: In this table, how does row 4 differ from row 3?
        options:
          - { id: adds, text: "It adds the next letter of `a`, the `d`, to the end of the prefix" }
          - { id: drops, text: "It drops the first letter of `a`, leaving a shorter suffix" }
          - { id: same, text: "It covers the same letters, compared with a later letter of `b`" }
        correct: adds
        explanation: >-
          Rows grow the prefix of `a` one letter at a time: row 3 is `can` and row 4 is `cand`.
          Columns grow the prefix of `b` the same way.

  - id: prefix-letter-tap
    format: tap-cell
    heading: Which letter does the row compare?
    tags: [dp, arrays-strings]
    workedExample: |-
      Consider `a = "bead"` and `b = "dab"`, where `dp[i][j]` covers the prefixes `a[:i]` and
      `b[:j]` and compares their last letters.

      1. `dp[2][1]` covers `a[:2]`, which is `be`, and `b[:1]`, which is `d`.
      2. The last letter of `be` is `a[1]`, the `e`, and the last letter of `d` is `b[0]`. The code
         reads them as `a[i - 1]` and `b[j - 1]`.
      3. So `dp[2][1]` compares `e` with `d`. Every cell in row 2 covers the same prefix `be`, so
         every one of them compares that same `e`.
    prompt: |-
      Below, `a = "orchid"`. Tap the letter of `a` that every cell in row 4, `dp[4][j]`, compares.
    code: |
      for i in range(1, len(a) + 1):
          for j in range(1, len(b) + 1):
              if a[i - 1] == b[j - 1]:
                  ...  # the rule for a match
              else:
                  ...  # the rule for a mismatch
    sequence: { kind: string, name: a, cells: [o, r, c, h, i, d] }
    correct: 3
    explanation: >-
      Row 4 covers the prefix `orch`, four letters. Its last letter is `a[3]`, the `h`, which the
      code reads as `a[i - 1]`.
    misses:
      - index: 4
        explanation: >-
          That is `a[4]`. Row 4 covers four letters, `a[0]` to `a[3]`, and the code reads
          `a[i - 1]`, not `a[i]`.
      - index: 0
        explanation: >-
          `o` is the first letter of the prefix `orch`. A cell compares only the last letter of its
          prefix.
      - index: 1
        explanation: >-
          `r` is inside the prefix `orch`, but row 2 is the one that compares it. Each row adds one
          letter.
      - index: 2
        explanation: "`c` is compared by row 3, which covers `orc`. Row 4 covers one more letter."
      - index: 5
        explanation: "`d` is the last letter of `a`. Only row 6, the whole word, compares it."

  - id: match-uses-diagonal
    heading: What does the match cell hold?
    tags: [dp]
    workedExample: |-
      Consider `a = "tram"` and `b = "team"`. `dp[4][4]` compares `a[3]` and `b[3]`, which are both
      `m`.

      1. The diagonal `dp[3][3]` covers `tra` and `tea`, which leave out both `m`s. Their longest
         common subsequence is `ta`, so it holds 2.
      2. Neither `m` is used in that 2, so the matching pair can be added to it as one more letter.
      3. So `dp[4][4] = dp[3][3] + 1 = 3`, for `tam`.
    prompt: |-
      For `a = "hello"` and `b = "yellow"`, `dp[4][3]` compares `a[3]` and `b[2]`, both `l`. The
      diagonal `dp[3][2]` is 1, the cell above, `dp[3][3]`, is 2, and the cell to the left,
      `dp[4][2]`, is 1. What does `dp[4][3]` hold?
    options:
      - id: diagonal
        text: "2: the diagonal, 1, plus 1 for the matched `l`"
        explanation: >-
          Reaching `dp[3][2]` drops both `l`s, so neither is counted there. Adding 1 for the pair
          gives 2, for `el`.
      - id: up-plus-one
        text: "3: the cell above, 2, plus 1 for the matched `l`"
        explanation: >-
          `dp[3][3]` covers `hel` and `yel`, and its 2 already uses the `l` of `yel`. Adding 1
          counts that `l` twice, but `hell` and `yel` share only `el`.
      - id: diagonal-copy
        text: "1: the diagonal, 1, carried over unchanged"
        explanation: >-
          Carrying the diagonal over leaves out the pair being compared. A match adds that pair,
          so the cell is one more than the diagonal.
    correct: diagonal
    followUps:
      up-plus-one:
        prompt: "`dp[3][3] = 2` matches `el` in `hel` and `yel`. Which `l` of `yellow` does that 2 already use?"
        options:
          - { id: same, text: "`b[2]`, the same `l` this cell wants to match" }
          - { id: other, text: "`b[3]`, the second `l`, which this cell does not reach" }
          - { id: neither, text: "The cell above never uses the last letter of its prefix of `b`" }
        correct: same
        explanation: >-
          Column 3 covers `yel`, whose only `l` is `b[2]`. The diagonal is the one neighbor where
          neither compared letter has been used yet.
      diagonal-copy:
        prompt: The diagonal, 1, counts the `e` of `hel` and `ye`. What does matching the two `l`s add?
        options:
          - { id: one-more, text: "One more letter, so `e` becomes `el`" }
          - { id: nothing, text: "Nothing, since the diagonal already counts them" }
          - { id: two, text: "Two, one for the `l` of each word" }
        correct: one-more
        explanation: >-
          The diagonal leaves out both compared letters. A matching pair adds one letter to the
          common subsequence, and that letter appears once in each word.

  - id: mismatch-takes-larger
    heading: What does the mismatch cell hold?
    tags: [dp]
    workedExample: |-
      Consider `a = "lamp"` and `b = "palm"`. `dp[4][4]` compares `a[3]`, a `p`, with `b[3]`, an
      `m`. The two letters differ, so they cannot be paired with each other.

      1. So a longest common subsequence of `lamp` and `palm` leaves out the `p`, the `m`, or both.
         Leaving out the `p` gives `lam` against `palm`: that is the cell above, `dp[3][4]`, which
         holds 2, for `am`.
      2. Leaving out the `m` gives `lamp` against `pal`: that is the cell to the left, `dp[4][3]`,
         which holds 1. Leaving out both can do no better than leaving out one of them.
      3. The best case wins, so `dp[4][4]` takes the larger of the cell above and the cell to the
         left: 2.
    prompt: |-
      For `a = "plates"` and `b = "pastel"`, `dp[5][6]` compares `a[4]`, an `e`, with `b[5]`, an
      `l`. The letters differ. The diagonal `dp[4][5]` is 3, the cell above, `dp[4][6]`, is 3, and
      the cell to the left, `dp[5][5]`, is 4. What does `dp[5][6]` hold?
    options:
      - id: four
        text: "4: the larger of the cell above and the cell to the left"
        explanation: >-
          The `e` and the `l` cannot pair with each other, so at least one of them is left out.
          Leaving out the `e` gives the cell above, 3. Leaving out the `l` gives the cell to the
          left, 4, for `pate`. The cell keeps the larger.
      - id: three
        text: "3: the diagonal, which leaves out both letters"
        explanation: >-
          Only one of the two letters has to go. Leaving out just the `l` keeps a match that the
          diagonal throws away, so the cell to the left reaches 4.
      - id: five
        text: "5: the cell to the left, 4, plus 1 for this pair"
        explanation: >-
          Adding 1 needs a matched pair, and `e` and `l` differ. The 4 to the left carries over
          unchanged.
      - id: zero
        text: "0: the letters differ, so the count starts again"
        explanation: >-
          Starting again would throw away the matches before this pair. A subsequence may skip
          letters, so `pate` still counts across the mismatch.
    correct: four
    followUps:
      three:
        prompt: The cell to the left, `dp[5][5]`, leaves out only the `l` of `pastel`. What does it keep that the diagonal loses?
        options:
          - { id: e-match, text: "The `e` of `plate`, which pairs with the `e` of `paste`" }
          - { id: l-match, text: "The `l` of `pastel`, which pairs with the `l` of `plate`" }
          - { id: nothing, text: "Nothing, since both cells leave out the same letters" }
        correct: e-match
        explanation: >-
          A mismatch rules out pairing the two letters with each other, not using either one. The
          diagonal drops both and loses the `e` match, so the cell compares the cell above with
          the cell to the left instead.
      five:
        prompt: When does a cell add 1 to a neighbor?
        options:
          - { id: match, text: "Only when its two letters match, and then to the diagonal" }
          - { id: larger, text: "Whenever one neighbor is larger than the other" }
          - { id: always, text: "On every cell, to count the letter of `a` being read" }
        correct: match
        explanation: >-
          A cell grows only by matching a pair of letters. On a mismatch it copies the larger of
          the cell above and the cell to the left, here 4.
      zero:
        prompt: "`pate` is common to `plate` and `paste`. Does the mismatch of `e` and `l` remove it?"
        options:
          - { id: keeps, text: "No: a subsequence may skip the `l`, so `pate` still counts" }
          - { id: removes, text: "Yes: a mismatch ends the count of matches so far" }
          - { id: partly, text: "Partly: one letter is skipped, so one match is lost" }
        correct: keeps
        explanation: >-
          A subsequence may skip letters, so earlier matches carry across a mismatch. That is why
          the cell copies its larger neighbor instead of starting again.

  - id: edit-distance-source-tap
    format: tap-cell
    heading: Which cell does it build on?
    tags: [dp]
    workedExample: |-
      Consider `a = "pen"` and `b = "pin"`, where `dp[i][j]` is the fewest edits that turn `a[:i]`
      into `b[:j]`. `dp[2][2]` compares `a[1]`, an `e`, with `b[1]`, an `i`. They differ, so the
      last letters need one edit, a replace, a delete or an insert, and each costs one neighbor
      plus 1.

      1. Replace the `e` with an `i`, after turning `p` into `p`: the diagonal, `dp[1][1] = 0`,
         plus 1.
      2. Delete the `e`, then turn `p` into `pi`: the cell above, `dp[1][2] = 1`, plus 1.
      3. Turn `pe` into `p`, then insert the `i`: the cell to the left, `dp[2][1] = 1`, plus 1.
      4. The table keeps the fewest, so `dp[2][2] = 1 + min(0, 1, 1) = 1`. At `dp[3][3]` both
         letters are `n`, so no edit is needed and the cell copies the diagonal, 1.
    prompt: >-
      Edit distance is the fewest edits that turn one string into another. An edit inserts a
      letter, deletes a letter or replaces one letter with another. Here `dp[i][j]` is the edit
      distance from `a[:i]` to `b[:j]`, for `a = "blush"` and `b = "plush"`. `dp[5][3]` compares
      `a[4]`, an `h`, with `b[2]`, a `u`, so the letters differ. The board is row 4 of the table,
      and the cell to the left, `dp[5][2]`, is 4. Tap the cell of row 4 that `dp[5][3]` builds
      on.
    code: |
      for i in range(1, len(a) + 1):
          for j in range(1, len(b) + 1):
              if a[i - 1] == b[j - 1]:
                  dp[i][j] = dp[i - 1][j - 1]   # no edit needed
              else:
                  ...                           # the rule for a mismatch
    sequence: { kind: array, name: row4, cells: [4, 4, 3, 2, 1, 2] }
    correct: 3
    explanation: >-
      The cell above, `dp[4][3] = 2`, turns `blus` into `plu`, and deleting the `h` then gives 3
      edits. A replace builds on the diagonal, 3, and an insert on the cell to the left, 4, so both
      cost more. A mismatch is 1 plus the smallest of the three neighbors: `dp[5][3] = 1 + 2 = 3`.
    misses:
      - index: 0
        explanation: >-
          Column 0 turns `blus` into an empty string by deleting all 4 letters. The three cells
          `dp[5][3]` builds on sit in columns 2 and 3.
      - index: 1
        explanation: >-
          Column 1 is two columns back. The three cells `dp[5][3]` builds on are the diagonal and
          the cell above in row 4, and the cell to the left in row 5.
      - index: 2
        explanation: >-
          This is the diagonal, `dp[4][2] = 3`, which a replace builds on, for 3 + 1 = 4 edits. The
          table keeps the fewest edits, and the cell above holds 2.
      - index: 4
        explanation: >-
          This is the smallest cell in the row, but column 4 covers `plus`, which goes past
          `b[:3]`. Only columns 2 and 3 of row 4 are neighbors of `dp[5][3]`.
      - index: 5
        explanation: >-
          Column 5 covers all of `plush`, two columns past `dp[5][3]`. A cell builds on neighbors
          in its own column or the one before it.

  - id: fill-row-trace
    format: step-trace
    heading: Predict each step
    tags: [dp, python]
    workedExample: |-
      Consider `a = "cam"`, `b = "came"` and row `i = 3`, so `a[i - 1]` is `m`. The row above is
      `prev = [0, 1, 2, 2, 2]`, and `cur[0]` is 0.

      1. For `j` at 1 and 2, `b[j - 1]` is `c` and then `a`, neither of them `m`. Each pass stores
         the larger of `prev[j]`, the cell above, and `cur[j - 1]`, the cell to the left:
         `max(1, 0) = 1`, then `max(2, 1) = 2`.
      2. At `j = 3`, `b[2]` is `m`, a match. The pass stores the diagonal plus 1: `prev[2] + 1 = 3`.
      3. At `j = 4`, `b[3]` is `e`, a mismatch, so the pass stores
         `max(prev[4], cur[3]) = max(2, 3) = 3`. The row ends `[0, 1, 2, 3, 3]`.
    prompt: >-
      Here `a = "garden"`, `b = "lament"` and `i = 6`, so `a[i - 1]` is `n`. The board is `prev`,
      row 5 of the table. The passes with `j` at 1 to 3 have run, so `cur` starts `[0, 0, 1, 1]`.
      Predict each step.
    code: |
      cur = [0] * (len(b) + 1)
      for j in range(1, len(b) + 1):
          if a[i - 1] == b[j - 1]:
              cur[j] = prev[j - 1] + 1
          else:
              cur[j] = max(prev[j], cur[j - 1])
    sequence: { kind: array, name: prev, cells: [0, 0, 1, 1, 2, 2, 2] }
    start:
      - { name: j, at: 3 }
    steps:
      - line: 3
        ask: On the pass with `j` at 4, `b[3]` is `e`. What is `cur[4]`?
        options:
          - id: two
            text: '2'
            explanation: >-
