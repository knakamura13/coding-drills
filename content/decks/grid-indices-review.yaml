id: grid-indices-review
title: "Grid indices: review"
description: Fresh grids for the Grid indices skills, for recall on later days. No worked examples this time.
heading: What does this give?

questions:
  - id: flat-index-review
    heading: Which cell is it?
    tags: [grid, arrays-strings]
    prompt: >-
      `flat` stores a grid of 3 rows and 5 columns in one list, row by row: row 0 first, then
      row 1, then row 2. Which cell of the grid is `flat[13]`?
    options:
      - id: row-two
        text: Row 2, column 3
        explanation: >-
          Each row holds 5 cells, so `13 // 5`, which is 2, counts the full rows before it, and
          `13 % 5`, the remainder, is 3 more cells into row 2.
      - id: swapped
        text: Row 3, column 2
        explanation: >-
          That puts the remainder first. The row is how many full rows of 5 come before index
          13, which is `13 // 5`, 2. The grid has no row 3.
      - id: by-rows
        text: Row 4, column 1
        explanation: >-
          That divides by 3, the number of rows. A row holds 5 cells, one per column, so the
          divisor is 5.
      - id: from-one
        text: Row 3, column 4
        explanation: >-
          That counts rows and columns from 1. Like every index, they count from 0, so the cell
          is row 2, column 3.
    correct: row-two
    followUps:
      swapped:
        prompt: In `flat`, what does `i // cols` count for index `i`?
        options:
          - id: full-rows
            text: The full rows of `cols` cells that come before index `i`
          - id: columns
            text: The columns to the left of index `i`
          - id: cells
            text: The cells before index `i` in its own row
        correct: full-rows
        explanation: >-
          Every row takes `cols` cells, so dividing and rounding down counts the whole rows
          before `i`. That is its row. The remainder is its column.
      by-rows:
        prompt: Why is the divisor 5 here, and not 3?
        options:
          - id: row-length
            text: A row holds 5 cells, so each new row starts 5 indices later
          - id: more
            text: The larger number of the two always goes in the divisor
          - id: rows-wide
            text: There are 3 rows, so each row is 3 cells long
        correct: row-length
        explanation: >-
          `flat` lays the rows end to end, and each row is as long as the number of columns. So
          the row of index `i` is `i // cols`.
      from-one:
        prompt: Which cell is `flat[0]`?
        options:
          - id: zero-zero
            text: Row 0, column 0
          - id: one-one
            text: Row 1, column 1
          - id: zero-one
            text: Row 0, column 1
        correct: zero-zero
        explanation: >-
          `0 // 5` and `0 % 5` are both 0. Rows and columns count from 0, so the first cell is
          row 0, column 0.

  - id: column-sum-review
    heading: What happens?
    tags: [grid, arrays-strings]
    prompt: |-
      This loop is meant to add up column 1 of `grid`.

      ```python
      grid = [[4, 1, 6],
              [2, 8, 5]]
      total = 0
      for r in range(len(grid[0])):
          total += grid[r][1]
      print(total)
      ```

      What happens when it runs?
    options:
      - id: index-error
        text: It raises `IndexError` when `r` is 2
        explanation: >-
          `len(grid[0])` is 3, the number of columns, so `r` runs 0, 1, 2. `grid` has only 2
          rows, so `grid[2]` is past the end. The loop needs `range(len(grid))`.
      - id: nine
        text: It prints `9`
        explanation: >-
          `9` is `1 + 8`, column 1 of both rows. But `len(grid[0])` counts the cells in row 0,
          3 of them, so `r` also reaches 2, and there is no row 2.
      - id: fifteen
        text: It prints `15`
        explanation: >-
          `15` is `2 + 8 + 5`, row 1. That reads `grid[r][1]` as column `r` of row 1. The first
          index picks the row, so `grid[r][1]` is column 1 of row `r`.
    correct: index-error
    followUps:
      nine:
        prompt: What does `len(grid[0])` count?
        options:
          - id: row-cells
            text: The cells in row 0, which is the number of columns
          - id: rows
            text: The rows of `grid`
          - id: first-value
            text: The value in the first cell
        correct: row-cells
        explanation: >-
          `grid[0]` is row 0, so its length is the number of columns, here 3. `len(grid)` counts
          the rows, here 2.
      fifteen:
        prompt: In `grid[r][1]`, what does each index pick?
        options:
          - id: row-first
            text: "`r` picks the row, then `1` picks the column in it"
          - id: column-first
            text: "`r` picks the column, then `1` picks the row"
          - id: either
            text: Either order, since the grid has numbers in every cell
        correct: row-first
        explanation: >-
          `grid[r]` is a row, and indexing that row picks a column. So `grid[r][1]` walks down
          column 1 as `r` grows.

  - id: turn-corner-review
    heading: Where does it land?
    tags: [grid, arrays-strings]
    prompt: >-
      A clockwise quarter turn of a 3 by 3 grid moves the top row to the right column, read
      from top to bottom. Where does the value at row 2, column 0 land?
    options:
      - id: top-left
        text: Row 0, column 0
        explanation: >-
          Column 0 becomes row 0. Row 2, the bottom row, becomes the left column, column 0. So
          the bottom-left corner moves to the top-left corner: `(r, c)` goes to
          `(c, n - 1 - r)`, and `3 - 1 - 2` is 0.
      - id: top-right
        text: Row 0, column 2
        explanation: >-
          That is `(c, r)`, a transpose. In a turn the top row goes to the right column, so the
          bottom row goes to the left one.
      - id: bottom-right
        text: Row 2, column 2
        explanation: >-
          That is a counterclockwise turn, where column `c` becomes row `n - 1 - c`. Clockwise,
          the left column becomes the top row, so the value lands in row 0.
      - id: top-middle
        text: Row 0, column 1
        explanation: >-
          That uses `n - r`, which is `3 - 2`. The columns run 0 to 2, so row `r` becomes column
          `n - 1 - r`, which is 0.
    correct: top-left
    followUps:
      top-right:
        prompt: In a clockwise turn, which column does the top row become?
        options:
          - id: right
            text: The right column, and the last row goes to column 0
          - id: left
            text: The left column, and the last row goes to the right edge
          - id: same
            text: It stays a row
        correct: right
        explanation: >-
          A transpose would put row 0 in column 0. A clockwise turn mirrors that, so row 0 goes
          to the last column and the last row to column 0.
      bottom-right:
        prompt: In a clockwise turn, which row does the left column become?
        options:
          - id: top
            text: The top row, row 0
          - id: bottom
            text: The bottom row, row 2
          - id: middle
            text: The middle row, row 1
        correct: top
        explanation: >-
          Column `c` becomes row `c`, so column 0 becomes row 0. Turning the other way sends it
          to the bottom row instead.
      top-middle:
        prompt: In a 3 by 3 grid, which column does row 0 become?
        options:
          - id: two
            text: "Column 2, since `3 - 1 - 0` is 2"
          - id: three
            text: "Column 3, since `3 - 0` is 3"
          - id: one
            text: Column 1, the middle one
        correct: two
        explanation: >-
          The columns are 0, 1 and 2, so the last one is `n - 1`. Row `r` becomes column
          `n - 1 - r`.

  - id: transpose-count-review
    heading: How many swaps?
    tags: [grid, arrays-strings]
    prompt: |-
      This transpose works in place. `m` has 4 rows of 4 cells.

      ```python
      def transpose(m):
          n = len(m)
          for i in range(n):
              for j in range(i + 1, n):
                  m[i][j], m[j][i] = m[j][i], m[i][j]
      ```

      How many times does the swap line run?
    options:
      - id: six
        text: "6"
        explanation: >-
          `j` starts after `i`, so `i = 0` swaps 3 times, `i = 1` twice, `i = 2` once and
          `i = 3` not at all. That is `3 + 2 + 1`, which is 6, once per pair of cells off the
          diagonal.
      - id: sixteen
        text: "16"
        explanation: >-
          That is `4 * 4`, one swap for every `i` and every `j`. The inner loop starts at
          `i + 1`, so it runs fewer times on each pass.
      - id: twelve
        text: "12"
        explanation: >-
          That counts every cell off the diagonal, which names each pair twice, once in each
          order. Since `j` starts after `i`, each pair is swapped once.
      - id: ten
        text: "10"
        explanation: >-
          That also counts the diagonal, where `j` equals `i`. The inner loop starts at `i + 1`,
          so `j` never equals `i`.
    correct: six
    followUps:
      sixteen:
        prompt: When `i` is 2, which values does `j` take?
        options:
          - id: just-three
            text: Just 3, since `range(3, 4)` holds one value
          - id: all-four
            text: 0, 1, 2 and 3
          - id: two-three
            text: 2 and 3
        correct: just-three
        explanation: >-
          `range(i + 1, n)` starts one past `i`. So the pass for `i = 2` swaps once, and the pass
          for `i = 3` not at all.
      twelve:
        prompt: How many times is the pair `(0, 1)` and `(1, 0)` swapped?
        options:
          - id: once
            text: Once, when `i` is 0 and `j` is 1
          - id: twice
            text: Twice, once from each cell
          - id: never
            text: Never, since one of them has `j < i`
        correct: once
        explanation: >-
          With `j > i` only, the pass for `i = 1` never reaches `j = 0`. One swap moves both
          values, so each pair needs only one.
      ten:
        prompt: When `i` is 0, which values does `j` take?
        options:
          - id: one-to-three
            text: 1, 2 and 3
          - id: zero-to-three
            text: 0, 1, 2 and 3
          - id: one-two
            text: 1 and 2
        correct: one-to-three
        explanation: >-
          `range(1, 4)` starts at 1, so `j` is never 0 when `i` is 0. A cell on the diagonal
          would swap with itself, which changes nothing.

  - format: step-trace
    id: spiral-tall-review
    heading: Follow the bounds
    tags: [grid, arrays-strings]
    prompt: >-
      Each row of `grid` is a string, so `grid[r][c]` is one letter. `range(a, b, -1)` counts
      down from `a` and stops before `b`. The trace starts after line 8 of the first pass: the
      top row is read and `top` is 1. Predict each step.
    code: |
      def spiral(grid):
          out = []
          top, bottom = 0, len(grid) - 1
          left, right = 0, len(grid[0]) - 1
          while top <= bottom and left <= right:
              for c in range(left, right + 1):
                  out.append(grid[top][c])
              top += 1
              for r in range(top, bottom + 1):
                  out.append(grid[r][right])
              right -= 1
              if top <= bottom:
                  for c in range(right, left - 1, -1):
                      out.append(grid[bottom][c])
                  bottom -= 1
              if left <= right:
                  for r in range(bottom, top - 1, -1):
                      out.append(grid[r][left])
                  left += 1
          return out

      spiral(["abc", "def", "ghi", "jkl"])
    sequence:
      kind: array
      name: grid
      cells: [abc, def, ghi, jkl]
    start:
      - { name: top, at: 1 }
      - { name: bottom, at: 3 }
    steps:
      - line: 9
        ask: What does the loop on lines 9 and 10 append?
        options:
          - id: f-i-l
            text: "`f`, `i`, `l`"
            explanation: >-
              `right` is 2, and `r` runs from `top`, 1, to `bottom`, 3. That reads `f`, `i` and
              `l`.
          - id: c-f-i-l
            text: "`c`, `f`, `i`, `l`"
            explanation: >-
              That starts at row 0. `top` is already 1, so the corner `c`, read with the top row,
              is skipped.
          - id: f-i
            text: "`f`, `i`"
            explanation: >-
              The stop is `bottom + 1`, so row 3 is read too, giving `l`.
        correct: f-i-l
      - line: 13
        ask: What does the loop on lines 13 and 14 append?
        options:
          - id: k-j
            text: "`k`, `j`"
            explanation: >-
              Line 11 moved `right` to 1, so `c` counts down from 1 to 0 along row 3, reading `k`
              and `j`.
          - id: l-k-j
            text: "`l`, `k`, `j`"
            explanation: >-
              That starts at column 2. `right` moved to 1 after the right column was read, so `l`
              is not read again.
          - id: j-k
            text: "`j`, `k`"
            explanation: >-
              The loop counts down from `right` to `left`, so the bottom row is read from right to
              left: `k` first.
        correct: k-j
      - line: 15
        ask: Where does `bottom` point after line 15?
        pointer: bottom
        correct: 2
        explanation: '`bottom -= 1` moves `bottom` from row 3 to row 2.'
        misses:
          - index: 3
            explanation: Line 15 moves `bottom` up one row once the bottom row is read, to row 2.
        elsewhere: '`bottom` moves up one row, from 3 to 2.'
      - line: 17
        ask: What does the loop on lines 17 and 18 append?
        options:
          - id: g-d
            text: "`g`, `d`"
            explanation: >-
              `r` counts down from `bottom`, 2, and stops before `top - 1`, 0. So it reads rows 2
              and 1 of column 0: `g` and `d`.
          - id: j-g-d
            text: "`j`, `g`, `d`"
            explanation: >-
              That starts at row 3. `bottom` is now 2, so `j`, read with the bottom row, is
              skipped.
          - id: g-d-a
            text: "`g`, `d`, `a`"
            explanation: >-
              The count stops before `top - 1`, which is 0, so row 0 is not read. `a` was read
              with the top row.
        correct: g-d
      - line: 5
        ask: The second pass starts with `top` 1, `bottom` 2, and `left` and `right` both 1. What does that pass append?
        options:
          - id: e-h
            text: "`e`, `h`"
            explanation: >-
              The top-row loop reads `grid[1][1]`, `e`, and moves `top` to 2. The right-column
              loop then reads `grid[2][1]`, `h`. The bottom-row loop finds an empty range, line
              16 skips the left column, and the walk ends with all 12 letters read once.
          - id: h-e
            text: "`h`, `e`"
            explanation: >-
              The top-row loop runs first on every pass, so `e`, in row `top`, comes before `h`.
          - id: e-only
            text: "`e`"
            explanation: >-
              After `top` moves to 2, the right-column loop runs `range(2, 3)`, which holds row 2.
              So it reads `h` as well.
        correct: e-h
