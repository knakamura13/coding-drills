id: prefix-counts
title: Prefix counts
description: Build a prefix sum list from the empty prefix, subtract two entries to sum a subarray, and count earlier matches. Each card asks for one decision, with a worked example on hand.
heading: What happens next?

questions:
  - id: include-empty-prefix
    heading: Which list is the prefix?
    tags: [prefix-sum, python]
    workedExample: |-
      Adding up a subarray value by value takes one step per value. A prefix sum list answers any
      subarray sum with one subtraction instead. Consider `nums = [3, 1, 2]`. `prefix[i]` is the
      sum of the first `i` values of `nums`.

      1. The first 0 values are no values at all, so `prefix[0]` is 0. That entry is the empty
         prefix.
      2. Each later entry adds one more value to the entry before it: `0 + 3 = 3`, then `3 + 1 = 4`,
         then `4 + 2 = 6`. So `prefix` is `[0, 3, 4, 6]`, one entry longer than `nums`.
      3. The sum of `nums[1:3]`, which is `1 + 2`, is the first 3 values minus the first 1 value:
         `prefix[3] - prefix[1] = 6 - 3 = 3`.
    prompt: |-
      A subarray is the values of a list from one index up to another, with none skipped: the
      slice `nums[i:j]`. A prefix sum list gives the sum of any subarray with one subtraction.
      `prefix[i]` is the sum of the first `i` values of `nums`, for every `i` from 0 to
      `len(nums)`. `prefix[0]` covers the first 0 values, which are called the empty prefix.

      `nums = [5, -2, 4, 1]`. Which list is `prefix`?
    options:
      - id: right
        text: '`[0, 5, 3, 7, 8]`'
        explanation: >-
          The first 0 values add up to 0, then each entry adds one more value: 0 + 5 is 5,
          5 + -2 is 3, 3 + 4 is 7 and 7 + 1 is 8. Four values give five entries.
      - id: no-empty
        text: '`[5, 3, 7, 8]`'
        explanation: >-
          The prefix sums are right, but the list starts at the first value. Without the 0 in
          front, `prefix[i]` no longer means "the first `i` values", and one kind of subarray has
          no entry to subtract.
      - id: copied
        text: '`[0, 5, -2, 4, 1]`'
        explanation: >-
          After the 0 this copies `nums`. Each entry has to carry everything before it, so
          `prefix[3]` is 5 + -2 + 4, not the 4 alone.
      - id: dropped-sign
        text: '`[0, 5, 7, 11, 12]`'
        explanation: >-
          That adds 2 where the list holds -2. A negative value lowers the prefix sum, so after
          5 comes 3.
    correct: right
    followUps:
      no-empty:
        prompt: >-
          With `[5, 3, 7, 8]`, every subarray sum is one entry minus an earlier one. Which
          subarray has no earlier entry to subtract?
        options:
          - id: from-start
            text: A subarray that starts at index 0, such as `nums[0:2]`
          - id: to-end
            text: A subarray that ends at the last value, such as `nums[1:4]`
          - id: middle
            text: A single value in the middle, such as `nums[1:2]`
        correct: from-start
        explanation: >-
          A subarray from index 0 has nothing before it, so the entry subtracted has to be the sum
          of no values. That is the 0 at the front of the list, and leaving it out loses every
          subarray that starts at the beginning.
      copied:
        prompt: What should `prefix[3]` hold for `nums = [5, -2, 4, 1]`?
        options:
          - id: sum
            text: 5 + -2 + 4, which is 7
          - id: value
            text: '`nums[2]`, which is 4'
          - id: next
            text: '`nums[3]`, which is 1'
        correct: sum
        explanation: >-
          `prefix[3]` is the sum of the first three values. Each entry adds one more value to the
          entry before it, so it keeps everything seen so far.
      dropped-sign:
        prompt: '`prefix[1]` is 5 and `nums[1]` is -2. What is `prefix[2]`?'
        options:
          - id: three
            text: 3, since adding -2 lowers the sum
          - id: seven
            text: 7, since the size of each value is added
          - id: five
            text: 5, since a negative value is skipped
        correct: three
        explanation: >-
          Every value is added with its sign. Prefix sums can go down, and they can return to a
          value seen earlier, which later cards rely on.

  - id: trace-build-prefix
    format: step-trace
    heading: Predict each step
    tags: [prefix-sum, python]
    workedExample: |-
      Consider `nums = [2, 5]` with `prefix = [0]` to start. Each pass appends `prefix[-1] + x`: the
      last entry so far plus the current value.

      1. On the first pass `x = 2` and `prefix[-1] = 0`, so it appends `0 + 2 = 2`. `prefix` is now
         `[0, 2]`.
      2. On the second pass `x = 5`, and `prefix[-1]` is the 2 just appended, so it appends
         `2 + 5 = 7`.
      3. The loop ends after both values, so `prefix` is `[0, 2, 7]`. The starting 0 is still in
         front, because appending never removes it.
    prompt: >-
      Step through the loop below and predict each value before it is shown.
    code: |
      nums = [4, -1, -3, 2]
      prefix = [0]
      for i, x in enumerate(nums):
          prefix.append(prefix[-1] + x)
    sequence:
      kind: array
      name: nums
      cells: [4, -1, -3, 2]
    start:
      - { name: i, at: 0 }
    steps:
      - line: 4
        ask: On the pass with `i` at 1, what value is appended?
        options:
          - id: three
            text: '3'
            explanation: >-
              After the first pass `prefix` is `[0, 4]`, so `prefix[-1]` is 4. Adding -1 gives 3.
          - id: value
            text: '-1'
            explanation: >-
              That appends `x` alone. The line adds `x` to `prefix[-1]`, the prefix sum so far,
              which is 4.
          - id: minus
            text: '5'
            explanation: >-
              That subtracts -1. The line adds `x`, and adding -1 to 4 gives 3.
        correct: three
        also:
          - { name: i, at: 1 }
      - line: 4
        ask: On the pass with `i` at 2, what value is appended?
        options:
          - id: zero
            text: '0'
            explanation: >-
              `prefix[-1]` is 3, and 3 + -3 is 0. The first three values cancel out, so this
              entry equals the empty prefix.
          - id: two-values
            text: '-4'
            explanation: >-
              That adds the last two values of `nums`, -1 and -3. `prefix[-1]` is the prefix sum
              so far, 3, not the previous value.
          - id: value
            text: '-3'
            explanation: >-
              That appends `x` alone. The prefix sum so far is 3, and adding -3 brings it to 0.
        correct: zero
        also:
          - { name: i, at: 2 }
      - ask: What is `prefix` when the loop ends?
        options:
          - id: right
            text: '`[0, 4, 3, 0, 2]`'
            explanation: >-
              One entry for the empty prefix and one after each of the four values. The last pass
              adds 2 to 0.
          - id: no-empty
            text: '`[4, 3, 0, 2]`'
            explanation: >-
              The list started as `[0]`, and appending never removes that first entry. It stays as
              the empty prefix.
          - id: short
            text: '`[0, 4, 3, 0]`'
            explanation: >-
              That stops one pass early. The loop also runs for the last value, 2, and appends
              0 + 2.
        correct: right
        also:
          - { name: i, at: 3 }

  - id: trapped-water-tap
    format: tap-cell
    heading: Tap the bar with the most water
    tags: [prefix-sum, python]
    workedExample: |-
      Consider `height = [3, 1, 2]`. The water above bar `i` rises to the shorter of
      `left_max[i]`, the tallest bar from the left end through `i`, and `right_max[i]`, the
      tallest from `i` through the right end, and the bar itself fills the part below.

      1. From the left, each entry is the larger of the entry before it and `height[i]`: 3, then
         `max(3, 1) = 3`, then `max(3, 2) = 3`. So `left_max` is `[3, 3, 3]`.
      2. From the right the same way: 2 for the last bar, then `max(2, 1) = 2`, then
         `max(2, 3) = 3`. So `right_max` is `[3, 2, 2]`.
      3. At index 1 the shorter wall is `min(3, 2) = 2` and the bar is 1 tall, so 1 unit of water
         sits on it. At index 2 it is `min(3, 2) - 2 = 0`: nothing stands to its right to hold
         water in.
    prompt: >-
      Bars of width 1 stand side by side, with heights in `height`. After rain, the water above
      bar `i` rises to the shorter of two walls: the tallest bar from the left end through `i`,
      and the tallest bar from `i` through the right end. `left_max` and `right_max` hold those
      walls. Each is a running maximum, built the way a prefix sum is but with `max` in place of
      `+`, and each includes bar `i` itself, so neither starts with an empty entry. `right_max`
      runs over suffixes, the parts of the list from an index to its end, so its loop takes `i`
      from `n - 2` down to 0. Tap the bar with the most water above it.
    code: |
      def water_at(height):
          n = len(height)
          left_max = [height[0]] * n
          for i in range(1, n):
              left_max[i] = max(left_max[i - 1], height[i])
          right_max = [height[-1]] * n
          for i in range(n - 2, -1, -1):
              right_max[i] = max(right_max[i + 1], height[i])
          return [min(left_max[i], right_max[i]) - height[i]
                  for i in range(n)]

      water_at([2, 0, 4, 1, 5, 1, 5, 0])
    sequence:
      kind: array
      name: height
      cells: [2, 0, 4, 1, 5, 1, 5, 0]
    correct: 5
    explanation: >-
      `left_max[5]` is 5, from bar 4, and `right_max[5]` is 5, from bar 6. The water rises to 5
      above a bar 1 tall, so 4 units sit there, more than the 3 at index 3 or the 2 at index 1.
    misses:
      - index: 0
        explanation: >-
          Bar 0 is the left end, so `left_max[0]` is its own height, 2. `min(2, 5) - 2` is 0.
      - index: 1
        explanation: >-
          The left wall here is only bar 0, which is 2 tall, and water spills over the shorter
          wall. `min(2, 5) - 0` is 2, less than at index 5.
      - index: 2
        explanation: >-
          Bar 2 is 4 tall, the tallest so far, so `left_max[2]` is 4 and `min(4, 5) - 4` is 0.
      - index: 3
        explanation: >-
          `min(4, 5) - 1` is 3. The left wall is bar 2, which is 4 tall, lower than the 5 on each
          side of index 5.
      - index: 4
        explanation: >-
          Bar 4 is 5 tall, as tall as any bar, so both walls are 5 and `min(5, 5) - 5` is 0.
      - index: 6
        explanation: >-
          Bar 6 is 5 tall, as tall as both of its walls, so `min(5, 5) - 5` is 0.
      - index: 7
        explanation: >-
          Bar 7 is the right end, so `right_max[7]` is its own height, 0, and `min(5, 0) - 0` is
          0. With `left_max` alone it would hold 5, but nothing on its right holds the water in.

  - id: tap-subtracted-prefix
    format: tap-cell
    heading: Tap the prefix to subtract
    tags: [prefix-sum, python]
    workedExample: |-
      Consider `nums = [4, 1, 2]` and `prefix = [0, 4, 5, 7]`, where `prefix[i]` is the sum of the
      values before index `i`. The goal is `sum(nums[1:3])`, which is `1 + 2`.

      1. `prefix[3] = 7` is the sum of `nums[0]`, `nums[1]` and `nums[2]`. That is the subarray
         plus `nums[0]`, which comes before it.
      2. The subarray starts at index 1, so the extra part is the values before index 1. Their sum
         is `prefix[1] = 4`.
      3. So `sum(nums[1:3])` is `prefix[3] - prefix[1] = 7 - 4 = 3`, which matches `1 + 2`.
    prompt: >-
      Below, tap the entry to subtract from
      `prefix[5]` to get `sum(nums[2:5])`.
    code: |
      nums = [3, -2, 5, 2, -1]
      prefix = [0, 3, 1, 6, 8, 7]
      # sum(nums[2:5]) == prefix[5] - prefix[?]
    sequence:
      kind: array
      name: prefix
      cells: [0, 3, 1, 6, 8, 7]
    correct: 2
    explanation: >-
      `prefix[2]` is 1, the sum of the two values before the subarray, 3 and -2. 7 - 1 is 6, which
      is 5 + 2 + -1. The slice `nums[i:j]` always sums to `prefix[j] - prefix[i]`.
    misses:
      - index: 0
        explanation: >-
          That is the empty prefix. 7 - 0 is the sum of the whole list, including the 3 and -2
          before the subarray.
      - index: 1
        explanation: >-
          `prefix[1]` holds only the 3. Subtracting it leaves 4, which still counts `nums[1]`, the
          -2, though the subarray starts at index 2.
      - index: 3
        explanation: >-
          `prefix[3]` already includes `nums[2]`, the 5. Subtracting it leaves 1, which drops the
          first value of the subarray.
      - index: 4
        explanation: >-
          `prefix[4]` includes `nums[2]` and `nums[3]`. 7 - 8 is -1, the last value alone.
      - index: 5
        explanation: >-
          A prefix minus itself is 0, the sum of an empty subarray. The entry to subtract sits
          where the subarray starts.

  - id: subarray-from-zero
    heading: Which subtraction is right?
    tags: [prefix-sum, python]
    workedExample: |-
      Consider `nums = [2, 7, -3, 4, 1]` and `prefix = [0, 2, 9, 6, 10, 11]`, where `prefix[i]` is
      the sum of the values before index `i`. The goal is the sum of `nums[1]` through `nums[3]`.

      1. The subarray ends at `nums[3]`. The first entry that includes it is `prefix[4] = 10`, one
         index past the last value.
      2. `prefix[4]` also includes `nums[0]`, which is before the subarray. The subarray starts at
         index 1, so the part to remove is `prefix[1] = 2`, the sum of the values before index 1.
      3. So the sum is `prefix[4] - prefix[1] = 10 - 2 = 8`, which matches `7 + -3 + 4`.
    prompt: |-
      Below, `prefix[i]` is the sum of the first `i` values of `nums`.

      ```python
      nums = [6, -2, 5, 0, -4]
      prefix = [0, 6, 4, 9, 9, 5]
      ```

      What is the sum of `nums[0]` through `nums[2]`?
    options:
      - id: right
        text: '`prefix[3] - prefix[0]`, which is 9'
        explanation: >-
          The subarray starts at index 0, so the entry subtracted is the empty prefix. 9 - 0 is 9,
          which is 6 + -2 + 5.
      - id: wraps
        text: '`prefix[3] - prefix[-1]`, which is 4'
        explanation: >-
          Subtracting the entry one before the start works for a list without the empty prefix.
          Here the start is index 0, and one before it is -1, which Python does not reject.
      - id: end-short
        text: '`prefix[2] - prefix[0]`, which is 4'
        explanation: >-
          The subarray ends at `nums[2]`, but `prefix[2]` stops before it. The larger index has
          to be one past the last value.
      - id: skip-first
        text: '`prefix[3] - prefix[1]`, which is 3'
        explanation: >-
          That subtracts one value too many. The subarray starts at `nums[0]`, and this leaves
          only -2 + 5.
    correct: right
    followUps:
      wraps:
        prompt: What does `prefix[-1]` read when `prefix` is `[0, 6, 4, 9, 9, 5]`?
        options:
          - id: last
            text: The last entry, 5
          - id: empty
            text: The empty prefix, 0
          - id: error
            text: Nothing, it raises `IndexError`
        correct: last
        explanation: >-
          A negative index counts back from the end, so -1 quietly reads the sum of the whole
          list. With the empty prefix at the front, a subarray that starts at index 0 subtracts
          `prefix[0]`, and no index ever has to go below 0.
      end-short:
        prompt: Which values does `prefix[2]` add up?
        options:
          - id: two
            text: '`nums[0]` and `nums[1]`'
          - id: three
            text: '`nums[0]`, `nums[1]` and `nums[2]`'
          - id: one
            text: '`nums[2]` alone'
        correct: two
        explanation: >-
          `prefix[i]` is the sum of the first `i` values, the ones before index `i`. To include
          `nums[2]`, the subtraction has to start from `prefix[3]`.
      skip-first:
        prompt: Taking `prefix[1]` away from `prefix[3]` removes which value?
        options:
          - id: first
            text: '`nums[0]`, the 6'
          - id: nothing
            text: None, because 1 is just where the subarray starts
          - id: second
            text: '`nums[1]`, the -2'
        correct: first
        explanation: >-
          `prefix[1]` is the sum of the values before index 1, which is `nums[0]` alone. A
          subarray that keeps `nums[0]` subtracts `prefix[0]`, the empty prefix.

  - id: drag-equal-prefixes
    format: drag-pointers
    heading: Find the subarray that sums to 0
    tags: [prefix-sum, python]
    workedExample: |-
      Consider `nums = [1, 4, 2, 3, -5]` and `prefix = [0, 1, 5, 7, 10, 5]`. A subarray sum is
      `sum(nums[i:j]) == prefix[j] - prefix[i]`.

      1. The prefix sum 5 appears twice in `prefix`: at index 2 and at index 5.
      2. Since `prefix[5]` and `prefix[2]` are equal, `prefix[5] - prefix[2]` is `5 - 5 = 0`. So
         `sum(nums[2:5])` is 0.
      3. Check: `nums[2:5]` is `[2, 3, -5]`, and `2 + 3 + -5 = 0`. Any two equal entries mark a
         subarray that sums to 0, with `i` at the first and `j` at the second.
    prompt: >-
      Below, drag `i` and `j`, with `i < j`, so that `prefix[j] - prefix[i]` is 0.
    code: |
      nums = [2, 3, -1, -2, 4]
      prefix = [0, 2, 5, 4, 2, 6]
      # sum(nums[i:j]) == prefix[j] - prefix[i] == 0
    sequence:
      kind: array
      name: prefix
      cells: [0, 2, 5, 4, 2, 6]
    pointers:
      - name: i
        start: 0
        correct: 1
        explanation: >-
          `prefix[1]` and `prefix[4]` are both 2, so the values between them, 3, -1 and -2, sum
          to 0.
        misses:
          - index: 0
            explanation: 'The empty prefix is 0, and no later prefix sum is 0.'
          - index: 2
            explanation: '5 appears only once. Look for a prefix sum that comes back later.'
        elsewhere: The two equal prefix sums in the list are the 2s, at indices 1 and 4.
      - name: j
        start: 5
        correct: 4
        explanation: >-
          `prefix[4]` is 2 again, so `sum(nums[1:4])` is 2 - 2, which is 0.
        misses:
          - index: 5
            explanation: '`prefix[5]` is 6, and 6 appears nowhere before it.'
          - index: 1
            explanation: >-
              `prefix[1]` is 2, and no earlier prefix sum is 2, so nothing ending here sums to 0
              except an empty subarray.
          - index: 3
            explanation: '`prefix[3]` is 4, and 4 appears nowhere before it.'
        elsewhere: The prefix sum returns to 2 at index 4.

  - id: needed-earlier-prefix
    heading: Which prefix sum does it need?
    tags: [prefix-sum, hash-map]
    workedExample: |-
      Consider `nums = [2, 4, 1, 3]` and `k = 4`, with the scan at the last value, so the prefix
      sum through it is `p = 10`. A subarray that ends here and starts at index `i` sums to
      `p - prefix[i]`.

      1. That subarray sums to 4 exactly when `10 - prefix[i] == 4`.
      2. Adding `prefix[i]` to both sides and subtracting 4 gives `prefix[i] == 10 - 4`, which
         is 6.
      3. The prefix sums before this value are 0, 2, 6 and 7, and 6 is `prefix[2]`. So
         `nums[2:4]`, which is `1 + 3`, sums to 4.
    prompt: |-
      A scan reads `nums` from the left and keeps `p`, the prefix sum through the current value.
      A subarray that ends at the current value and starts at index `i` sums to `p - prefix[i]`.
      To find the subarrays that sum to `k`, the scan works out which earlier prefix sum it
      needs, much as two-sum works out a complement.

      `p` is 8 and `k = 5`. Which earlier prefix sum makes a subarray ending here sum to 5?
    options:
      - id: three
        text: '3'
        explanation: >-
          8 - 3 is 5, so a subarray that starts right after a prefix sum of 3 and ends here sums
          to 5. The earlier prefix sum to look for is always `p - k`.
      - id: thirteen
        text: '13'
        explanation: >-
          That is `p + k`. A subarray after a prefix sum of 13 sums to 8 - 13, which is -5.
      - id: five
        text: '5'
        explanation: >-
          That looks for `k` itself. A subarray after a prefix sum of 5 sums to 8 - 5, which
          is 3.
      - id: minus-three
        text: '-3'
        explanation: >-
          That is `k - p`, the subtraction the wrong way round. A subarray after a prefix sum of
          -3 sums to 8 - (-3), which is 11.
    correct: three
    followUps:
      thirteen:
        prompt: >-
          A subarray starts right after the earlier prefix sum `q` and ends at the current value.
          What does it sum to?
        options:
          - id: current-minus
            text: '`8 - q`, the current prefix sum minus the earlier one'
          - id: earlier-minus
            text: '`q - 8`, the earlier prefix sum minus the current one'
          - id: both
            text: '`q + 8`, both prefix sums together'
        correct: current-minus
        explanation: >-
          The current prefix sum covers every value up to here, and `q` covers the values before
          the start, so the subarray sums to `8 - q`. Setting that to 5 gives `q = 3`.
      five:
        prompt: An earlier prefix sum of 5 is found. What does the subarray after it, ending here, sum to?
        options:
          - id: three
            text: 3, which is 8 - 5
          - id: five
            text: 5, the value that was found
          - id: eight
            text: 8, the current prefix sum
        correct: three
        explanation: >-
          The subarray sums to the current prefix sum minus the one found. To make that `k`, the
          scan looks for `p - k`, not `k`.
      minus-three:
        prompt: Solve `8 - q == 5` for `q`.
        options:
          - id: three
            text: '`q = 8 - 5`, which is 3'
          - id: minus-three
            text: '`q = 5 - 8`, which is -3'
          - id: thirteen
            text: '`q = 5 + 8`, which is 13'
        correct: three
        explanation: >-
          Add `q` to both sides and subtract 5, which gives `q = 8 - 5`. Swapping the two values
          gives a prefix sum with the wrong sign.

  - id: count-ending-here
    heading: How many subarrays end here?
    tags: [prefix-sum, hash-map]
    workedExample: |-
      Consider `k = 3`, the earlier prefix sums `0, 5, 2, 5, 1, 5` (starting with the empty
      prefix), and a current prefix sum of `8`. A subarray that ends here sums to 8 minus the
      earlier prefix sum where it starts.

      1. A subarray sums to 3 exactly when `8 - q == 3` for its earlier prefix sum `q`. So `q`
         must be `8 - 3 = 5`.
      2. The prefix sum 5 appears three times among the earlier ones. Each copy is a different
         start, so each one gives a different subarray that ends here.
      3. So 3 subarrays end here with a sum of 3. The other earlier prefix sums, 0, 2 and 1, start
         subarrays that sum to 8, 6 and 7.
    prompt: >-
      `k = 5`. The prefix sums before the current value, starting with the empty prefix, were 0,
      3, -1, 3, 6 and 1, and the current prefix sum `p` is 8. How many subarrays ending at the
      current value sum to 5?
    options:
      - id: two
        text: '2'
        explanation: >-
          The prefix sum to look for is 8 - 5, which is 3. It appeared twice, after the first
          value and after the third, so two different subarrays end here with a sum of 5.
      - id: one
        text: '1'
        explanation: >-
          That checks whether 3 appeared, not how many times. Each copy of an earlier prefix sum
          is a separate place for a subarray to start.
      - id: zero
        text: '0'
        explanation: >-
          None of 5, -3 or 13 appear earlier, but none of them is the prefix sum to look for. A
          subarray ending here sums to the current prefix sum minus an earlier one.
      - id: all
        text: '6'
        explanation: >-
          Every earlier prefix sum starts some subarray that ends here, but most of those
          subarrays do not sum to 5.
    correct: two
    followUps:
      one:
