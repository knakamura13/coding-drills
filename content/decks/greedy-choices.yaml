id: greedy-choices
title: Greedy choices
description: Name the local rule a greedy loop applies, find a small input that breaks it, and state the fact that makes it safe. Each card asks for one decision, with a worked example on hand.
heading: Does the rule hold?

questions:
  - id: greedy-trace-change
    format: step-trace
    heading: Predict each step
    tags: [greedy, python]
    workedExample: |-
      A greedy algorithm applies one local rule at each step: take what looks best right now, and
      never take a choice back. This path names the rule a greedy loop applies, finds inputs that
      break it, and states the fact that makes it safe. `make_change([10, 5, 1], 12)` takes
      `coins[i]` whenever it is not more than `amount`, and moves `i` on only when that coin is too
      big.

      1. `coins[0] = 10` is not more than 12, so the loop takes it, and `amount` falls to 2. A take
         leaves `i` at 0.
      2. 10 is more than 2, so `i` moves to the 5. The 5 is more than 2 too, so `i` moves to the 1.
      3. The 1 fits in 2, so it is taken, and it still fits in the 1 left, so it is taken again. The
         call returns `[10, 1, 1]`: at each step, the largest coin that fit.
    prompt: >-
      A greedy loop applies one local rule at each step and never takes a choice back. This one
      takes the largest coin that fits: it takes `coins[i]` whenever it is not more than `amount`,
      and moves `i` on only when that coin is too big. The coins are sorted largest first and 48
      is owed. The first pass took the 25, so `amount` is 23 and `i` is still 0. Predict each step
      before it is shown.
    code: |
      def make_change(coins, amount):
          used = []
          i = 0
          while amount > 0:
              if coins[i] <= amount:
                  amount -= coins[i]
                  used.append(coins[i])
              else:
                  i += 1
          return used

      make_change([25, 10, 5, 1], 48)
    sequence: { kind: array, name: coins, cells: [25, 10, 5, 1] }
    start:
      - { name: i, at: 0 }
    steps:
      - line: 4
        ask: Where is `i` when the loop takes its next coin?
        pointer: i
        correct: 1
        explanation: >-
          25 is more than the 23 still owed, so the `else` branch moves `i` to the 10. The 10
          fits, and `amount` falls to 13.
        misses:
          - index: 0
            explanation: >-
              The 25 fit once, but now 23 is owed and 25 is more than that. The loop moves `i`
              before it takes anything.
          - index: 2
            explanation: >-
              The 10 fits in 23, so the loop takes it. `i` moves only while the coin it points at
              is too big.
        elsewhere: The loop moves past coins larger than 23 and stops on the first one that fits.
      - line: 4
        ask: Now 13 is owed. Where is `i` when the loop takes its next coin?
        pointer: i
        correct: 1
        explanation: >-
          10 still fits in 13, and a take does not move `i`, so the loop takes a second 10. 3 is
          left.
        misses:
          - index: 2
            explanation: >-
              `i` moves only on the `else` branch. 10 is not more than 13, so the 10 is taken
              again.
          - index: 3
            explanation: The rule takes the largest coin that fits. 10 fits in 13, and it beats the 1.
        elsewhere: A coin can be taken more than once. The 10 still fits in 13.
      - line: 4
        ask: Now 3 is owed. Where is `i` when the loop takes its next coin?
        pointer: i
        correct: 3
        explanation: >-
          The 10 and the 5 are both more than 3, so `i` moves twice and stops on the 1.
        misses:
          - index: 2
            explanation: 5 is more than 3, so the `else` branch moves `i` once more.
          - index: 1
            explanation: 10 is more than 3, so the 10 cannot be taken a third time.
        elsewhere: The loop moves past every coin larger than 3.
      - line: 10
        ask: What does the call return?
        options:
          - id: six
            text: '`[25, 10, 10, 1, 1, 1]`'
            explanation: >-
              Three 1s pay the last 3. Each coin was the largest that fit at the moment it was
              taken.
          - id: two-ones
            text: '`[25, 10, 10, 1, 1]`'
            explanation: >-
              With 1 still owed, `while amount > 0` runs once more and takes a third 1. The loop
              stops only when nothing is owed.
          - id: short
            text: '`[25, 10, 10, 1]`'
            explanation: >-
              After one 1, 2 is still owed, so `while amount > 0` runs two more passes.
        correct: six

  - id: greedy-rule-for-goal
    heading: Which rule fits the goal?
    tags: [greedy, sorting]
    workedExample: |-
      Consider picking 3 of `[8, 2, 9, 4, 7]` for the largest sum, with the rule "take the largest
      number left".

      1. The goal is a sum, so each pick adds its own value. The largest number left, 9, adds more
         than any other single pick could.
      2. Taking 9 does not stop any other number from being picked later, so nothing is lost. The
         rule then takes 8 and 7 the same way.
      3. So the rule picks 9, 8 and 7 for a sum of 24, and no three of the numbers add up to more.
         The rule fits the goal.
    prompt: >-
      A shopper has 30 to spend and wants as many different gifts as possible. The prices, in the
      order listed, are 15, 4, 12, 9, 3 and 6. Which local rule buys the most gifts here, and on
      any list of prices?
    options:
      - id: cheapest
        text: Buy the cheapest gift left, while it fits
        explanation: >-
          3, 4, 6 and 9 total 22, and adding the 12 would make 34. That is four gifts, and no five
          gifts fit, since the five cheapest already cost 34.
      - id: priciest
        text: Buy the priciest gift that still fits the budget
        explanation: >-
          That buys 15, 12 and 3, which spends all 30 on three gifts. Every gift counts as one, so
          a high price only uses up budget the others could have used.
      - id: any-order
        text: Any order works, since every gift counts as one
        explanation: >-
          In the listed order the shopper buys 15, 4 and 9, and then nothing else fits: three
          gifts. A gift's price decides what still fits after it.
    correct: cheapest
    followUps:
      priciest:
        prompt: Every gift adds 1 to the count. Which pick leaves the most budget for the gifts after it?
        options:
          - { id: cheapest, text: The cheapest gift left }
          - { id: priciest, text: The priciest gift that fits }
          - { id: first, text: Whichever gift is listed first }
        correct: cheapest
        explanation: >-
          A cheaper gift adds the same 1 for less money, so every later purchase has at least as
          much room. Swapping a bought gift for a cheaper one that was not bought never lowers the
          count.
      any-order:
        prompt: Buying in the listed order and skipping any gift that does not fit, how many gifts does the shopper get?
        options:
          - { id: three, text: '3, namely 15, 4 and 9' }
          - { id: four, text: '4, namely 15, 4, 9 and 3' }
          - { id: five, text: '5, every gift except the 15' }
        correct: three
        explanation: >-
          After 15, 4 and 9, only 2 is left, so the 12, the 3 and the 6 are all skipped. Cheapest
          first buys four, so the order changes the count.

  - id: greedy-name-the-rule
    heading: Which rule is it?
    tags: [greedy, sorting, python]
    workedExample: |-
      Consider orders written as `(cost, price)` pairs and a loop that runs
      `for cost, price in sorted(orders, key=lambda o: o[1] - o[0], reverse=True)`. A loop that
      sorts once and then takes items in that order applies the rule its sort key spells out.

      1. `o[0]` is the cost and `o[1]` is the price, so the key `o[1] - o[0]` is the profit on one
         order.
      2. `reverse=True` sorts from the largest key down, so the loop reaches the order with the
         largest profit first, then the next largest, and so on.
      3. So the rule is "take the order with the largest profit left". On
         `[(4, 9), (2, 10), (5, 6)]` the keys are 5, 8 and 1, and the loop visits `(2, 10)`, then
         `(4, 9)`, then `(5, 6)`.
    prompt: |-
      Below, each load is a `(weight, value)` pair, and any fraction of a load can be taken for
      that fraction of its value.

      ```python
      def pack(loads, room):
          total = 0
          for weight, value in sorted(loads, key=lambda p: p[1] / p[0], reverse=True):
              take = min(weight, room)
              total += value * take / weight
              room -= take
          return total
      ```

      Which local rule does the loop apply at each step?
    options:
      - id: best-rate
        text: Take as much as fits of the load worth the most per unit of weight
        explanation: >-
          The sort key is `value / weight`, largest first, so each pass takes from the load with
          the best rate left. `min(weight, room)` takes all of it, or just the part that fits.
      - id: most-valuable
        text: Take as much as fits of the load with the largest total value
        explanation: >-
          The key divides the value by the weight. A load worth 21 over 6 kg (3.5 per kg) comes
          after one worth 12 over 3 kg (4 per kg).
      - id: lightest
        text: Take as much as fits of the lightest load, so that more loads fit
        explanation: >-
          Weight appears only as the divisor in the key. A light load with a poor rate comes late.
      - id: closest-fit
        text: Take the load whose weight is closest to the room still left
        explanation: >-
          The order comes from one sort before the loop, by rate. `room` only decides how much of
          each load is taken, never which load comes next.
    correct: best-rate
    followUps:
      most-valuable:
        prompt: For a load of 4 kg worth 20, what does the sort key `p[1] / p[0]` compute?
        options:
          - { id: rate, text: '5, the value per kg' }
          - { id: value, text: '20, the value of the whole load' }
          - { id: weight, text: '4, the weight of the load' }
        correct: rate
        explanation: >-
          `p[0]` is the weight and `p[1]` is the value, so the key is value per kg. The loop ranks
          loads by rate, not by total value.
      lightest:
        prompt: The keys are sorted with `reverse=True`. Which load does the loop reach first?
        options:
          - { id: best-rate, text: The one with the largest value per kg }
          - { id: lightest, text: The one with the smallest weight }
          - { id: worst-rate, text: The one with the smallest value per kg }
        correct: best-rate
        explanation: >-
          `reverse=True` puts the largest key first, and the key is value per kg. A load's weight
          matters only through that ratio.
      closest-fit:
        prompt: Does the order the loop visits loads change as `room` shrinks?
        options:
          - { id: fixed, text: 'No, one sort before the loop fixes the order' }
          - { id: resorts, text: 'Yes, each pass re-sorts by how close a weight is to `room`' }
          - { id: skips, text: 'Yes, loads that no longer fit move to the end' }
        correct: fixed
        explanation: >-
          `sorted(...)` runs once. A greedy loop like this commits to its rule up front and never
          revisits it, which is why the rule alone has to be safe.

  - id: greedy-tap-failing-amount
    format: tap-cell
    heading: Tap the amount that breaks the rule
    tags: [greedy]
    workedExample: |-
      Consider coins `[4, 3, 1]`, 6 owed, and the rule "take the largest coin that fits". One amount
      that the rule pays with more coins than needed shows the rule is not safe.

      1. The largest coin that fits in 6 is 4, so the rule takes it, and 2 is left.
      2. Only the 1 fits in 2, so the rule takes a 1 and then another 1. It pays 6 as `4 + 1 + 1`,
         three coins.
      3. But `3 + 3` also makes 6, with two coins. So the rule uses more coins than it needs for 6,
         and it is not safe for these coins.
    prompt: >-
      The coins are 1, 4 and 5, and the rule takes the largest coin that fits until nothing is
      owed. Each cell is an amount owed. Tap the amount the rule pays with more coins than it
      needs.
    code: |
      coins = [5, 4, 1]   # largest first
      # take the largest coin that fits, until nothing is owed
    sequence: { kind: array, name: amount, cells: [3, 4, 5, 6, 7, 8, 9] }
    correct: 5
    explanation: >-
      The rule pays 8 as 5 + 1 + 1 + 1, four coins, while two 4s pay it with two. Taking the 5
      leaves 3, which only 1s can pay.
    misses:
      - index: 0
        explanation: Only 1s fit in 3, so every way to pay it uses three coins. The rule matches the best.
      - index: 1
        explanation: One 4 pays it. The rule skips the 5, which is too big, and takes the 4.
      - index: 2
        explanation: One 5 pays it, and the rule takes the 5 first.
      - index: 3
        explanation: The rule pays 5 + 1, two coins. No single coin is 6, so two is the best.
      - index: 4
        explanation: >-
          The rule pays 5 + 1 + 1, three coins. No two coins add up to 7 (the pairs give 2, 5, 6,
          8, 9 and 10), so three is the best.
      - index: 6
        explanation: The rule pays 5 + 4, two coins, which is the best for 9.

  - id: greedy-packing-counterexample
    heading: Which input breaks the rule?
    tags: [greedy, sorting]
    workedExample: |-
      Consider a 10 kg box, items of `[6, 5, 5]` kg, and the rule "pack the heaviest item that still
      fits". A list breaks the rule when some other packing holds more weight.

      1. The heaviest item is 6, and it fits, so the rule packs it. That leaves `10 - 6 = 4` kg of
         room.
      2. Each 5 is more than the 4 kg left, so the rule skips both and ends at 6 kg.
      3. Packing the two 5s instead gives `5 + 5 = 10` kg, a full box. 10 is more than 6, so this
         list breaks the rule.
    prompt: >-
      A box holds 12 kg, and the goal is to pack as much weight as possible. The rule packs
      the heaviest item that still fits, then the next, skipping any that do not fit. Which list
      of item weights makes the rule pack less than the best?
    options:
      - id: three-fours
        text: '`[7, 4, 4, 4]`'
        explanation: >-
          The rule packs 7 and 4, which is 11 kg. Only 1 kg is left, so the other two 4s are
          skipped. The three 4s together fill all 12 kg.
      - id: eight-four
        text: '`[8, 4, 3, 1]`'
        explanation: The rule packs 8 and 4, which fill the box. Nothing can beat a full box.
      - id: fives
        text: '`[5, 5, 4, 2]`'
        explanation: >-
          After both 5s, the 4 is passed over and the 2 goes in, so all 12 kg are used.
      - id: nine
        text: '`[9, 7, 3]`'
        explanation: After the 9, the 7 is too big, but the 3 fits and brings the total to 12 kg.
    correct: three-fours
    followUps:
      eight-four:
        prompt: The rule packs 8 and then 4. How much room is left, and can any packing do better?
        options:
          - { id: full, text: 'None is left, so no packing can beat it' }
          - { id: four-left, text: '4 kg is left, so the 3 and the 1 still go in' }
          - { id: one-left, text: '1 kg is left, so the 1 still goes in' }
        correct: full
        explanation: >-
          8 + 4 is exactly 12. A counterexample needs a packing better than the rule's, and a
          full box is already the best possible.
      fives:
        prompt: After 5 and 5, 2 kg of room is left. What does the rule do with the 4 and the 2?
        options:
          - { id: skip-take, text: 'It skips the 4 and packs the 2, filling the box' }
          - { id: stops, text: 'It stops, because the 4 does not fit' }
          - { id: swaps, text: 'It packs the 4 by taking out one 5' }
        correct: skip-take
        explanation: >-
          The rule skips an item that does not fit and keeps going, and it never takes an item
          back out. The 2 fills the last of the room.
      nine:
        prompt: After the 9, 3 kg of room is left. Which of the remaining items does the rule pack?
        options:
          - { id: three, text: 'The 3, which fills the box' }
          - { id: seven, text: 'The 7, because it is the next heaviest' }
          - { id: none, text: 'Neither, because packing stops at the first item that does not fit' }
        correct: three
        explanation: >-
          The 7 does not fit in 3 kg, so the rule skips it and packs the 3. A list breaks the rule
          only if a better packing exists, and here the rule already fills 12 kg.

  - id: greedy-split-or-whole
    heading: Which fact makes it safe?
    tags: [greedy]
    workedExample: |-
      Consider coins `[8, 4, 2, 1]`, 14 owed, and the rule "take the largest coin that fits". Each
      coin is worth exactly two of the coin below it.

      1. Since two of a coin equal one of the next coin up, a payment holding two 1s, two 2s or two
         4s can swap that pair for one larger coin and use one coin fewer.
      2. So a payment with the fewest coins holds at most one 1, one 2 and one 4, which add up to at
         most 7. Any amount of 8 or more must then use an 8, the coin the rule takes first.
      3. The same holds for what is left at each step, so the rule pays 14 as `8 + 4 + 2`, the
         fewest coins. A fact about these coins makes the rule safe, not the rule being greedy.
    prompt: >-
      A jar holds 8 litres. Syrup A is 5 litres worth 25 (5 per litre), and syrups B and C are 4
      litres each worth 18 (4.5 per litre). If any amount can be poured, the best rate first gives
      5 litres of A and 3 of B, worth 38.5, which is the best. If each syrup comes in one sealed
      bottle, the rule takes A, nothing else fits, and it ends at 25 while B and C give 36. Which
      fact made the rule safe in the first case and fails in the second?
    options:
      - id: split
        text: Any part of a load can be poured
        explanation: >-
          With pouring, any room left after the best syrup is filled at the next best rate. With
          bottles, the 3 litres left after A can take no whole bottle, so they are wasted.
      - id: no-ties
        text: No two syrups have the same rate
        explanation: >-
          B and C tie at 4.5 in both cases, and pouring is still optimal. Equal rates add the same
          value per litre in either order.
      - id: fits-alone
        text: Every syrup fits in the jar on its own
        explanation: >-
          Every bottle fits on its own here, and the rule still loses. What fails is the room
          left after A, which no bottle can use.
      - id: too-much
        text: The syrups hold more than the jar does
        explanation: >-
          That holds in both cases. It is why there is a choice to make, not why the rule is safe.
    correct: split
    followUps:
      no-ties:
        prompt: With bottles, would taking C instead of B after A change the result?
        options:
          - { id: same, text: 'No, neither 4-litre bottle fits in the 3 litres left' }
          - { id: c-fits, text: 'Yes, C fits where B did not' }
          - { id: neither, text: 'Yes, the tie makes the rule take neither of them' }
        correct: same
        explanation: >-
          A tie changes which bottle is named, not how much room is left. The loss comes from 3
          litres that no whole bottle can use.
      fits-alone:
        prompt: With bottles, the rule takes A and 3 litres are left. Why does its total stop at 25?
        options:
          - { id: no-bottle, text: No whole bottle fits in 3 litres }
          - { id: order, text: A bottle cannot follow one with a higher rate }
          - { id: full, text: The jar is already full }
        correct: no-bottle
        explanation: >-
          The proof for pouring fills leftover room at the next best rate. Whole bottles cannot be
          cut to fit, so the leftover room can stay empty.
      too-much:
        prompt: If all three syrups together fitted in the jar, what would any rule do?
        options:
          - { id: all, text: 'Take all of them, so every rule gives the same total' }
          - { id: best, text: 'Take only the syrup with the best rate' }
          - { id: room, text: 'Leave room in case a better syrup comes along' }
        correct: all
        explanation: >-
          Having more than fits is what makes choosing matter. It is true with pouring and with
          bottles, so it cannot be the fact that bottles break.

  - id: greedy-at-least-target
    heading: Which fact makes it safe?
    tags: [greedy, sorting]
    workedExample: |-
      Consider a budget of 10, gift prices `[6, 2, 5, 3]`, and the rule "buy the cheapest gift left
      while it fits". Every gift adds the same 1 to the count.

      1. The rule buys 2, then 3, then 5, which spends exactly 10 on three gifts. The 6 no longer
         fits.
      2. The `k` cheapest gifts cost no more than any other `k` gifts, because they are the `k`
         smallest prices. So if the `k` cheapest do not fit, no `k` gifts fit.
      3. The 4 cheapest gifts are all four, which cost `2 + 3 + 5 + 6 = 16`, over 10. So no 4 gifts
         fit, and the rule's 3 is the most.
    prompt: >-
      Boards of lengths 2, 7, 3, 5 and 4 metres are laid end to end to cover at least 13 metres
      with as few boards as possible. The rule takes the longest board left until the length
      reaches 13. It takes 7, 5 and then 4, three boards, and 16 metres. Which fact shows that no
      choice uses fewer boards?
    options:
      - id: top-k
        text: No two boards are longer together than the 7 and the 5
        explanation: >-
          7 + 5 is 12, short of 13, so every pair falls short and three is the fewest. In general,
          the k longest boards are at least as long as any other k, which is what makes longest
          first safe.
      - id: sorted
        text: The rule looks at the boards from longest to shortest
        explanation: >-
          That is how the rule works, not why it is right. The proof has to rule out every other
          choice of boards.
      - id: exact
        text: Some boards add up to exactly 13 metres
        explanation: >-
          7 + 4 + 2 is 13, but the goal is at least 13, so going over costs nothing. Exact sums
          matter for a different goal.
      - id: distinct
        text: No two boards have the same length
        explanation: >-
          Ties do not matter here. Two boards of equal length add the same, so either one leads to
          the same count.
    correct: top-k
    followUps:
      sorted:
        prompt: Which fact shows that three boards is the fewest?
        options:
          - { id: pairs, text: 'The two longest boards total 12, so no pair reaches 13' }
          - { id: fast, text: 'Sorting the boards first makes the rule quick to run' }
          - { id: natural, text: 'A person would also start with the longest board' }
        correct: pairs
        explanation: >-
          A greedy rule is shown safe by a fact about every alternative. If the two longest
          boards fall short, every pair falls short, so no plan with two boards exists.
      exact:
        prompt: If the boards had to total exactly 13 metres, what would longest first do?
        options:
          - { id: overshoot, text: 'Reach 16 with 7, 5 and 4, though 7 + 4 + 2 is exactly 13' }
          - { id: stops, text: 'Reach exactly 13, since it stops at the target' }
          - { id: none, text: 'Fail, since no boards total exactly 13' }
        correct: overshoot
        explanation: >-
          Longest first is safe only because extra length is harmless. With an exact goal, a long
          board can overshoot, and the rule never takes a board back.
      distinct:
        prompt: Suppose two of the boards were 5 metres. Would it matter which 5 the rule took first?
        options:
          - { id: no, text: 'No, either 5 adds the same length' }
          - { id: first, text: 'Yes, the 5 listed first is the safer pick' }
          - { id: both, text: 'Yes, a tie means the rule must try both orders' }
        correct: no
        explanation: >-
          Boards of equal length are interchangeable for this goal. The argument only needs each
          pick to be at least as long as the boards left.
