id: weighted-paths
title: Weighted paths
description: Add up a route's edge weights, relax every edge in a pass, and find the cheapest route within k stops. The last cards, on pass counts, negative cycles, routes and Dijkstra's algorithm, go deeper.
heading: What does the weighted search do?

questions:
  - id: wp-cheapest-route
    heading: Which route is cheapest?
    tags: [graph]
    workedExample: |-
      In a weighted graph each edge has a cost, its weight, and a route costs the sum of its
      weights. BFS counts edges, so it finds a route with the fewest edges, which need not be the
      cheapest. Here the one-way edges are `P -> R` 8, `P -> Q` 2, `Q -> R` 3, `Q -> X` 2 and
      `X -> R` 4.

      1. `P -> R` has one edge, the fewest, so BFS finds it. It costs 8.
      2. `P -> Q -> R` has two edges and costs `2 + 3`, which is 5.
      3. `P -> Q -> X -> R` has three edges and costs `2 + 2 + 4`, which is 8.
      4. 5 is the smallest total, so `P -> Q -> R` is the cheapest route. It has neither the
         fewest edges nor the most: only the totals decide.
    prompt: |-
      In a weighted graph each edge has a weight, its cost, and a route costs the sum of the
      weights on its edges. Below, every edge is one-way and each pair is `(next node, weight)`.
      Which route from `S` to `T` is cheapest?

      ```python
      graph = {
          "S": [("T", 9), ("A", 2), ("B", 5)],
          "A": [("T", 6), ("B", 1)],
          "B": [("T", 3)],
      }
      ```
    options:
      - id: direct
        text: '`S -> T`, the direct edge'
        explanation: >-
          It has the fewest edges, but its one edge costs 9, the most of any route. The route
          `S -> A -> B -> T` costs 2 + 1 + 3 = 6.
      - id: via-a
        text: '`S -> A -> T`'
        explanation: >-
          It starts on the cheapest edge out of `S`, then pays 6 to reach `T`: 2 + 6 = 8. Going
          on through `B` costs 2 + 1 + 3 = 6.
      - id: via-b
        text: '`S -> B -> T`'
        explanation: >-
          `B -> T` is the cheapest edge into `T`, but reaching `B` by `S -> B` costs 5, so the
          route costs 8. Reaching `B` through `A` costs only 3.
      - id: via-a-b
        text: '`S -> A -> B -> T`'
        explanation: >-
          2 + 1 + 3 = 6. The other routes cost 9 (`S -> T`), 8 (`S -> A -> T`) and 8
          (`S -> B -> T`). The cheapest route has the most edges.
    correct: via-a-b
    followUps:
      direct:
        prompt: Is a route with fewer edges always cheaper than one with more?
        options:
          - id: weights-decide
            text: No. Cost is the sum of the weights, and one heavy edge can outweigh three light ones
          - id: edges-add
            text: Yes. Every extra edge adds to the total, so fewer edges always cost less
          - id: small-weights
            text: Only when every weight is below 10, as it is in this graph
        correct: weights-decide
        explanation: >-
          Counting edges measures cost only when every edge weighs the same. Here one edge of 9
          costs more than three edges of 2, 1 and 3.
      via-a:
        prompt: What does starting on the cheapest edge out of `S` guarantee about the whole route?
        options:
          - id: nothing
            text: Nothing about the total. The edges after the first one decide the rest
          - id: cheapest-total
            text: The cheapest total, whenever every weight in the graph is positive
          - id: cheapest-two
            text: The cheapest total, as long as the route then goes straight to `T`
        correct: nothing
        explanation: >-
          A cheap first edge can lead to an expensive one. Compare whole routes by adding every
          weight on them: `S -> A -> T` is 8 and `S -> A -> B -> T` is 6.
      via-b:
        prompt: >-
          `B -> T` is the cheapest edge into `T`. Must the cheapest route reach `B` by the edge
          `S -> B`?
        options:
          - id: through-a
            text: No. `S -> A -> B` reaches `B` for 3, less than the 5 of `S -> B`
          - id: direct-best
            text: Yes. A direct edge is always the cheapest way to reach a node
          - id: no-both
            text: Yes. A route may not pass through both `A` and `B`
        correct: through-a
        explanation: >-
          A node can be reached by several routes, and the cheapest one may be longer. `S -> A ->
          B` costs 2 + 1 = 3, so `S -> A -> B -> T` costs 3 + 3 = 6.

  - format: tap-cell
    id: wp-tap-costliest
    heading: Which node costs the most?
    tags: [graph]
    workedExample: |-
      Consider one-way edges `S -> X` costing 5, `S -> Y` costing 1 and `Y -> X` costing 1. A node's
      cost from `S` is the total of its cheapest route.

      1. The direct route `S -> X` costs 5.
      2. The route `S -> Y -> X` costs `1 + 1`, which is 2.
      3. These are the only two routes to `X`, and 2 is less than 5. So `X` costs 2, not 5.
    prompt: >-
      Below, every edge is one-way. Using each node's cheapest route from `S`, which node costs
      the most to reach? Tap it.
    code: |
      graph = {
          "S": [("A", 4), ("B", 1), ("E", 7)],
          "B": [("A", 1), ("D", 7)],
          "A": [("C", 1)],
          "C": [("D", 1)],
      }
    sequence:
      kind: array
      name: nodes
      cells: [S, A, B, C, D, E]
    correct: 5
    explanation: >-
      `E` has one route, `S -> E`, costing 7. The others cost less: `B` 1, `A` 2 through `B`,
      `C` 3, and `D` 4 through `S -> B -> A -> C -> D`. The node whose cheapest route has the
      most edges, `D`, is not the one that costs the most.
    misses:
      - index: 0
        explanation: '`S` is the start. Its cost is 0.'
      - index: 1
        explanation: >-
          `S -> A` costs 4, but `S -> B -> A` costs 1 + 1 = 2. A node's cost is its cheapest
          route, so `A` costs 2.
      - index: 2
        explanation: '`B` costs 1 by the edge `S -> B`, the cheapest node after `S` itself.'
      - index: 3
        explanation: '`C` is reached by `S -> B -> A -> C`, which costs 1 + 1 + 1 = 3.'
      - index: 4
        explanation: >-
          The two-edge route `S -> B -> D` costs 8, more than `E`'s 7. But `S -> B -> A -> C -> D`
          costs 4, and a node's cost is its cheapest route, however many edges it has.

  - id: wp-relax-no-gain
    heading: What does one relaxation change?
    tags: [graph, python]
    workedExample: |-
      Relaxing an edge `u -> v` with weight `w` checks `dist[u] + w < dist[v]`. Consider
      `dist[u] = 6`, `w = 1` and `dist[v] = 10`.

      1. A route through `u` pays `dist[u]` to reach `u`, then `w` for the edge, so it costs
         `6 + 1`, which is 7.
      2. The test asks whether `7 < 10`. It is true, so the route through `u` beats the best cost
         known for `v`.
      3. Since the test passes, the assignment runs and `dist[v]` drops from 10 to 7. Had the test
         failed, `dist[v]` would keep its old value.
    prompt: |-
      `dist` maps each node to the cheapest cost from the start found so far. In a weighted graph
      that is a node's distance: the cost of its cheapest route, not its fewest edges. Relaxing
      the edge `u -> v` with weight `w` checks whether going to `u` and then along the edge costs
      less than `dist[v]`:

      ```python
      dist = {"S": 0, "A": 3, "B": 4}
      u, v, w = "A", "B", 2
      if dist[u] + w < dist[v]:  # relax the edge A -> B
          dist[v] = dist[u] + w
      print(dist["B"])
      ```

      What does this print?
    options:
      - id: keeps
        text: '`4`'
        explanation: >-
          The route through `A` costs 3 + 2 = 5, which is not less than 4. The test fails and
          `B` keeps the cheaper cost it already had.
      - id: overwrites
        text: '`5`'
        explanation: >-
          5 is the cost through `A`, but the assignment runs only when that cost is smaller.
          5 is not less than 4, so nothing changes.
      - id: weight-only
        text: '`2`'
        explanation: >-
          2 is the weight of `A -> B` alone. A route through `A` also pays the 3 it costs to
          reach `A`.
      - id: adds-to-head
        text: '`6`'
        explanation: >-
          6 adds the weight to `B`'s own distance. The weight is added to the distance of the
          edge's start, `A`: 3 + 2.
    correct: keeps
    followUps:
      overwrites:
        prompt: When does relaxing `u -> v` change `dist[v]`?
        options:
          - id: only-cheaper
            text: Only when `dist[u] + w` is smaller than the current `dist[v]`
          - id: always
            text: Every time the edge is checked, since the newest route is the one kept
          - id: weight-smaller
            text: Whenever the weight `w` is smaller than the current `dist[v]`
        correct: only-cheaper
        explanation: >-
          Relaxing never raises a distance. It replaces `dist[v]` only with a strictly cheaper
          route, so a worse route found later leaves it alone.
      weight-only:
        prompt: What does a route that reaches `B` through `A` cost?
        options:
          - id: sum
            text: The cost of reaching `A`, plus the weight of `A -> B`
          - id: last-edge
            text: The weight of `A -> B` alone, since `A` has already been reached
          - id: larger
            text: The larger of the two, the cost of `A` or the weight of `A -> B`
        correct: sum
        explanation: >-
          A route's cost is every weight on it, from `S` to the end. `dist["A"]` holds the cost
          of the part up to `A`, and the edge adds its own weight.
      adds-to-head:
        prompt: In `dist[u] + w`, which node's distance is the weight added to?
        options:
          - id: tail
            text: The node `u`, where the edge starts
          - id: head
            text: The node `v`, where the edge ends
          - id: smaller
            text: Whichever of the two nodes has the smaller distance
        correct: tail
        explanation: >-
          The candidate route goes to `u` and then along the edge, so it costs `dist[u] + w`. It
          is then compared with `dist[v]`, the best route to `v` known so far.

  - format: step-trace
    id: wp-bellman-pass-trace
    heading: Follow one pass over the edges
    tags: [graph, python]
    workedExample: |-
      Consider `edges = [("X", "Y", 2), ("S", "X", 1)]` and `dist` with `S` at 0 and `X` and `Y` at
      `inf`. One pass relaxes every edge once, in list order.

      1. The first edge is `X -> Y`. `dist["X"]` is still `inf`, and `inf + 2` is `inf`, which is
         not less than `inf`. So `dist["Y"]` stays `inf`.
      2. The second edge is `S -> X`. `0 + 1` is 1, which is less than `inf`, so `X` drops to 1.
      3. The pass has now checked each edge once. It ends with `X` at 1 but `Y` still at `inf`,
         because `X -> Y` was checked before `X` had a distance.
    prompt: >-
      One pass relaxes every edge once, in list order. `float('inf')` stands for a node with no
      known route yet: it is larger than every number, and `inf + w` is still `inf`. Predict each
      step of this single pass. The pointer `again` is used only in the last step.
    code: |
      INF = float('inf')
      edges = [("B", "C", 1), ("S", "A", 3), ("A", "B", 1),
               ("S", "B", 5), ("A", "C", 4)]
      dist = {"S": 0, "A": INF, "B": INF, "C": INF}
      for u, v, w in edges:  # one pass, in list order
          if dist[u] + w < dist[v]:
              dist[v] = dist[u] + w
      print(dist)
    sequence:
      kind: array
      name: nodes
      cells: [S, A, B, C]
    start:
      - { name: again, at: 0 }
    steps:
      - line: 6
        ask: 'The first edge is `B -> C` with weight 1. What is `dist["C"]` after it?'
        options:
          - id: still-inf
            text: '`inf`'
            explanation: >-
              `dist["B"]` is still `inf`, and `inf + 1` is `inf`, which is not less than `inf`.
              No route to `B` is known yet, so the edge cannot help `C`.
          - id: weight
            text: '`1`'
            explanation: >-
              1 is the weight alone. A route through `B` also needs a way to reach `B`, and none
              is known yet.
          - id: error
            text: An `OverflowError`
            explanation: >-
              Python adds a number to `float('inf')` without an error: `inf + 1` is `inf`. And
              `inf < inf` is false, so `C` stays `inf`.
        correct: still-inf
      - line: 6
        ask: 'Next come `S -> A` (3) and `A -> B` (1). What is `dist["B"]` after both?'
        options:
          - id: four
            text: '`4`'
            explanation: >-
              `S -> A` sets `A` to 3. `A -> B` runs later in the same pass and sees that 3, so
              `B` becomes 3 + 1 = 4.
          - id: one
            text: '`1`'
            explanation: '1 is the weight of `A -> B` alone. The route also pays 3 to reach `A`.'
          - id: inf
            text: '`inf`'
            explanation: >-
              `A` was lowered to 3 by the edge just before. A pass uses each new value as soon
              as it is written, so `A -> B` sees 3.
        correct: four
      - line: 6
        ask: 'Next comes `S -> B` with weight 5. What is `dist["B"]` after it?'
        options:
          - id: stays
            text: '`4`'
            explanation: '0 + 5 = 5 is not less than 4, so `B` keeps the cheaper route through `A`.'
          - id: five
            text: '`5`'
            explanation: >-
              5 is the cost of the direct edge. The relaxation writes only a smaller value, and
              `B` is already 4.
        correct: stays
      - line: 6
        ask: 'Last comes `A -> C` with weight 4. What value does `print(dist)` show for `C`?'
        options:
          - id: seven
            text: '`7`'
            explanation: >-
              3 + 4 = 7 beats `inf`. The cheaper route through `B` exists, but `B -> C` was
              checked first, while `B` was `inf`, and this pass does not return to it.
          - id: five
            text: '`5`'
            explanation: >-
              5 is the cost through `B`, 4 + 1. That edge came first in the list, while `B` was
              still `inf`, and one pass checks each edge only once.
          - id: inf
            text: '`inf`'
            explanation: '`A` is 3 by now, so `A -> C` offers 3 + 4 = 7, less than `inf`.'
        correct: seven
      - line: 5
        ask: A second pass runs over the same list. Which node's distance does it lower? Move `again` to it.
        pointer: again
        correct: 3
        explanation: >-
          `B -> C` now sees `dist["B"]` at 4, so `C` drops from 7 to 5. An edge checked before
          its start was lowered needs another pass, which is why the pass is repeated.
        misses:
          - index: 1
            explanation: '`A` is reached only by `S -> A`. `S` is fixed at 0, so `A` stays 3.'
          - index: 2
            explanation: >-
              `B` is 4 through `A`, and `S -> B` offers 5. Neither edge into `B` gives less than
              4.
        elsewhere: '`S` is the start at 0, and no edge leads into it.'

  - id: wp-k-stops-copy
    heading: What is the cheapest cost within one stop?
    tags: [graph, python]
    workedExample: |-
      Consider `edges = [("S", "X", 2), ("X", "Y", 3)]` with `k = 0`, so no stop is allowed, and
      `dist` with `S` at 0 and `X` and `Y` at `inf`. The loop runs `k + 1` passes, which is 1.

      1. The pass starts by copying `dist` into `before`, so `before` has `S` at 0 and `X` and `Y`
         at `inf`.
      2. `S -> X` reads `before["S"]`, which is 0, so `dist["X"]` drops to 2. `before["X"]` is
         still `inf`, because the copy was made before this write.
      3. `X -> Y` reads `before["X"]`, which is `inf`, so `dist["Y"]` stays `inf`. Reading
         `dist["X"]` would have set `Y` to 5, by a route with one stop. With no stop allowed, `Y`
         has no route.
    prompt: |-
      A stop is a node a route passes through between its start and its end, so a route with at
      most `k` stops uses at most `k + 1` edges. This code runs `k + 1` passes. Each pass reads
      from `before`, a copy of `dist` made when the pass starts: `dist.copy()` builds a new
      dictionary with the same keys and values, so writes to `dist` during the pass leave it
      unchanged.

      ```python
      INF = float('inf')
      edges = [("S", "A", 1), ("A", "B", 1), ("B", "T", 1),
               ("S", "T", 9), ("A", "T", 5)]
      k = 1
      dist = {"S": 0, "A": INF, "B": INF, "T": INF}
      for _ in range(k + 1):
          before = dist.copy()
          for u, v, w in edges:
              if before[u] + w < dist[v]:
                  dist[v] = before[u] + w
      print(dist["T"])
      ```

      What does this print?
    options:
      - id: six
        text: '`6`'
        explanation: >-
          Pass 1 reads `before`, where only `S` has a cost, so it sets `A` to 1 and `T` to 9.
          Pass 2 reads `A` at 1, so `A -> T` lowers `T` to 6, while `B -> T` still reads
          `before["B"]` as `inf`. The route `S -> A -> B -> T` costs 3, but it has 2 stops.
      - id: three
        text: '`3`'
        explanation: >-
          3 is the cost of `S -> A -> B -> T`, which has 2 stops. In pass 1, `A -> B` reads
          `before["A"]`, which is still `inf`, so a pass cannot build on an edge it just relaxed.
      - id: nine
        text: '`9`'
        explanation: >-
          9 is the direct edge, a route with no stop. `k = 1` allows one stop, so a route of 2
          edges counts, and `S -> A -> T` costs 1 + 5 = 6.
    correct: six
    followUps:
      three:
        prompt: >-
          In pass 1, `A -> B` is checked right after `S -> A` set `dist["A"]` to 1. What does
          `before["A"]` hold at that moment?
        options:
          - id: inf
            text: '`inf`, the value copied when the pass started'
          - id: one
            text: '`1`, since `before` changes whenever `dist` does'
          - id: zero
            text: '`0`, the cost of the start'
        correct: inf
        explanation: >-
          `before` is a separate dictionary, copied before `S -> A` ran. So each pass adds at
          most one edge to a route, and `k + 1` passes allow at most `k + 1` edges.
      nine:
        prompt: With `k = 1`, how many edges can a route from `S` to `T` use?
        options:
          - id: two
            text: Up to 2, one into the stop and one out of it
          - id: one
            text: Only 1, since `k` is 1
          - id: any
            text: Any number, as long as it ends at `T`
        correct: two
        explanation: >-
          One stop is one node between `S` and `T`, so the route uses 2 edges. That is why the
          loop runs `k + 1` passes.

  - id: wp-passes-needed
    heading: How many passes does the route need?
    tags: [graph, python]
    workedExample: |-
      Consider `edges = [("S", "P", 2), ("Q", "R", 1), ("P", "Q", 3)]`, with `dist` at 0 for `S`
      and `inf` for `P`, `Q` and `R`. The cheapest route to `R` is `S -> P -> Q -> R`, and each
      pass checks the edges in list order.

      1. In pass 1, `S -> P` sets `P` to 2. `Q -> R` comes next, while `Q` is still `inf`, so `R`
         stays `inf`.
      2. `P -> Q` comes last and reads the new `P`, so `Q` drops to `2 + 3`, which is 5. Pass 1
         has fixed two edges of the route, because `P -> Q` comes after `S -> P` in the list.
      3. In pass 2, `Q -> R` reads `Q` at 5, so `R` drops to 6. `Q -> R` waited one pass because
         it was checked before its start had a cost.
    prompt: |-
      Bellman-Ford repeats the pass V - 1 times, where V is the number of nodes. Below, V is 4, so
      the loop runs 3 passes and prints `dist["C"]` after each one. The cheapest route to `C` is
      `S -> A -> B -> C`, which costs 3, and the list holds its edges in reverse order.

      ```python
      INF = float('inf')
      edges = [("B", "C", 1), ("A", "B", 1), ("S", "A", 1), ("S", "C", 9)]
      dist = {"S": 0, "A": INF, "B": INF, "C": INF}
      for p in range(1, 4):  # V - 1 = 3 passes
          for u, v, w in edges:
              if dist[u] + w < dist[v]:
                  dist[v] = dist[u] + w
          print(p, dist["C"])
      ```

      After which pass does it first print 3 for `C`?
    options:
      - id: one
        text: After pass 1
        explanation: >-
          Pass 1 gives `C` the cost 9 through `S -> C`, so it prints 9. `B -> C` and `A -> B` come
          before `S -> A` in the list, so in pass 1 they still read `inf`.
      - id: two
        text: After pass 2
        explanation: >-
          Pass 2 lowers `B` to 2 through `A -> B`, but `B -> C` was checked earlier in that pass,
          while `B` was still `inf`. So pass 2 still prints 9.
      - id: three
        text: After pass 3
        explanation: >-
          Each pass fixes one more edge of the route: pass 1 sets `A` to 1, pass 2 sets `B` to 2
          and pass 3 sets `C` to 3. Unless some cycle's weights add up to less than 0, every node the
          start reaches has a cheapest route that repeats no node, so it has at most V - 1 edges.
          Each pass fixes at least one more of them, so V - 1 passes always suffice.
      - id: four
        text: None, since it needs a 4th pass
        explanation: >-
          A 4th pass, one per node, is not needed: pass 3 already prints 3. The start needs no
          pass, so a route through all 4 nodes has 3 edges, and 3 passes fix them even when the
          list holds them in reverse.
    correct: three
    followUps:
      one:
        prompt: 'When pass 1 checks `B -> C`, what is `dist["B"]`?'
        options:
          - id: inf
            text: '`inf`, since `A -> B` and `S -> A` come later in the list'
          - id: two
            text: '`2`, since a pass follows the route out from `S` first'
          - id: one
            text: '`1`, the weight of `A -> B`'
        correct: inf
        explanation: >-
          A pass works through the list in order, and an edge reads the values written so far. In
          this order each pass carries the route only one edge further.
      two:
        prompt: Pass 2 lowers `B` to 2. Why does `C` not drop in the same pass?
        options:
          - id: checked-first
            text: '`B -> C` was checked before `A -> B` lowered `B`'
          - id: has-cost
            text: '`C` already has the cost 9, and a cost is set only once'
          - id: one-per-pass
            text: A pass can lower at most one distance
        correct: checked-first
        explanation: >-
          `B -> C` is first in the list, so in pass 2 it still read `B` at `inf`. It sees the new
          `B` only in pass 3.
      four:
        prompt: On 4 nodes, how many edges can a route have if it repeats no node?
        options:
          - id: three
            text: At most 3, one fewer than the nodes
          - id: four
            text: At most 4, one for each node
          - id: any
            text: Any number, depending on the weights
        correct: three
        explanation: >-
          A route that repeats no node visits at most 4 nodes, and joining 4 nodes in a row takes
          3 edges. So V - 1 passes are enough for such a route on V nodes, even in the worst order.

  - id: wp-negative-cycle-pass
    heading: When does pass V still lower a distance?
    tags: [graph, python]
    workedExample: |-
      Consider a cycle `X -> Y -> X` with weights 3 and -1, and a route that reaches `X` for 5. A
      route can go round a cycle and come back to the node it left.

      1. Going on to `Y` costs `5 + 3`, which is 8, and coming back to `X` costs `8 - 1`, which is
         7.
      2. The trip round the cycle added `3 + (-1)`, which is 2. So the second visit to `X` costs
         more than the first, and a cheapest route skips the trip.
      3. Each further trip adds 2 again, so going round this cycle never lowers the cost of `X`.
    prompt: |-
      A cycle is a route back to its own start, and a negative cycle is one whose weights add up to
      less than 0. This code runs Bellman-Ford's V - 1 passes, where V is `len(nodes)`, and then
      one more pass, pass V, which only checks whether some edge would still lower a distance:

      ```python
      def pass_v_lowers(nodes, edges, src):
          dist = {n: float('inf') for n in nodes}
          dist[src] = 0
          for _ in range(len(nodes) - 1):
              for u, v, w in edges:
                  if dist[u] + w < dist[v]:
                      dist[v] = dist[u] + w
          for u, v, w in edges:  # pass V
              if dist[u] + w < dist[v]:
                  return True
          return False
      ```

      The nodes are `S`, `A`, `B` and `C`, and every edge is one-way. On which edge list does
      `pass_v_lowers(nodes, edges, "S")` return `True`?
    options:
      - id: reachable
        text: '`S -> A` 2, `A -> B` 1, `B -> A` -3, `B -> C` 4'
        explanation: >-
          `A -> B -> A` adds up to 1 - 3 = -2, and `S` reaches `A`. Each trip round it lowers `A`
          and `B` by 2 more, so no number of passes settles them, and pass V finds an edge that
          still lowers a distance. A route can get as cheap as you like, so `A`, `B` and `C` have
          no cheapest cost.
      - id: negative-edge
        text: '`S -> A` 4, `S -> B` 1, `B -> A` -2, `A -> C` 3'
        explanation: >-
          `B -> A` lowers `A` from 4 to -1, but this graph has no cycle, so no route can use that
          edge twice. Every route has at most 3 edges, 3 passes settle them, and pass V lowers
          nothing.
      - id: zero-cycle
        text: '`S -> A` 1, `A -> B` 2, `B -> A` -2, `B -> C` 1'
        explanation: >-
          `A -> B -> A` adds up to 2 - 2 = 0. A trip round it brings a route back to `A` at the
          same cost, and the test needs strictly less, so pass V lowers nothing.
      - id: unreachable
        text: '`S -> A` 3, `B -> C` 2, `C -> B` -4, `C -> A` 1'
        explanation: >-
          `B -> C -> B` adds up to 2 - 4 = -2, but no edge from `S` or `A` leads into `B` or `C`.
          They stay `inf`, `inf + w` is still `inf`, and pass V lowers nothing.
    correct: reachable
    followUps:
      negative-edge:
        prompt: In a graph with no cycle, can a negative edge make pass V lower a distance?
        options:
          - id: no-cycle
            text: No. No route repeats a node, so V - 1 passes fix every route
          - id: every-pass
            text: Yes. A negative edge lowers its end again in every pass
          - id: listed-last
            text: Yes, whenever the negative edge comes last in the list
        correct: no-cycle
        explanation: >-
          A route can come back to a node only by going round a cycle. Without one, every route
          has at most V - 1 edges, and V - 1 passes settle them all, negative edges included.
      zero-cycle:
        prompt: How much does a trip round a cycle whose weights add up to 0 change a route's cost?
        options:
          - id: nothing
            text: It stays the same, since 2 + (-2) is 0
          - id: by-negative
            text: It lowers it by 2, the size of the negative edge
          - id: by-positive
            text: It raises it by 2, the weight of `A -> B`
        correct: nothing
        explanation: >-
          The trip adds 2 + (-2) = 0, so the route comes back at the same cost. Only a cycle that
          adds up to less than 0 makes a route cheaper each time round.
      unreachable:
        prompt: In a pass, what does an edge out of a node still at `inf` do?
        options:
          - id: nothing
            text: Nothing, since `inf + w` is `inf` and lowers no distance
          - id: negative-w
            text: It lowers its end by `w` whenever `w` is negative
          - id: sets-w
            text: It sets its end to `w`, the edge's weight
        correct: nothing
        explanation: >-
          `inf` plus any number is still `inf`, which is never less than a distance. A negative
          cycle the start cannot reach keeps its nodes at `inf`, so pass V never sees it.

  - id: wp-record-prev
    heading: Which route does `prev` rebuild?
    tags: [graph, python]
    workedExample: |-
      Consider one pass over `edges = [("S", "X", 6), ("S", "Y", 2), ("Y", "X", 3), ("X", "Y", 1)]`,
      starting with `S` at 0 and the rest at `inf`. A relaxation that lowers `dist[v]` also sets
      `prev[v] = u`.

      1. `S -> X` lowers `X` from `inf` to 6, so `prev["X"]` becomes `S`. `S -> Y` lowers `Y` to
         2, so `prev["Y"]` becomes `S`.
      2. `Y -> X` offers `2 + 3`, which is 5, less than 6. So `X` drops to 5, and `prev["X"]` is
         overwritten with `Y`.
      3. `X -> Y` offers `5 + 1`, which is 6, not less than 2. The test fails, so neither
         `dist["Y"]` nor `prev["Y"]` changes.
    prompt: |-
      A relaxation that lowers `dist[v]` can also record `prev[v] = u`, the node the cheaper route
      came through. Following `prev` back from a node, then from that node's `prev`, and so on
      until the start, rebuilds the node's route backward. Every edge is one-way.

      ```python
      INF = float('inf')
      edges = [("S", "A", 4), ("S", "B", 1), ("B", "A", 2), ("A", "T", 3),
               ("B", "C", 5), ("C", "T", 1), ("S", "T", 9)]
      dist = {n: INF for n in "SABCT"}
      dist["S"] = 0
      prev = {}
      for u, v, w in edges:  # one pass, in list order
          if dist[u] + w < dist[v]:
              dist[v] = dist[u] + w
              prev[v] = u
      ```

      After this pass, which route does following `prev` back from `T` rebuild?
    options:
      - id: via-b-a
        text: '`S -> B -> A -> T`, costing 6'
        explanation: >-
          `prev["T"]` is `A`, written when `A -> T` set `T` to 3 + 3 = 6. `prev["A"]` is `B`,
          since `B -> A` lowered `A` to 3, and `prev["B"]` is `S`. Read backward, the walk gives
          `S -> B -> A -> T`, which costs 1 + 2 + 3 = 6.
      - id: via-a
        text: '`S -> A -> T`, costing 7'
        explanation: >-
          `prev["A"]` was `S` only until `B -> A` lowered `A` from 4 to 3 and wrote `B` over it.
          The walk reads `prev` as it stands after the pass.
      - id: direct
        text: '`S -> T`, costing 9'
        explanation: >-
          `S -> T` is the last edge into `T`, but it offers 9, not less than 6, so it never writes
          `prev["T"]`. Neither does `C -> T`, which offers 6 + 1 = 7.
      - id: backward
        text: '`T -> A -> B -> S`, costing 6'
        explanation: >-
          That is the order the walk visits the nodes, from `T` back to `S`. The route runs the
          other way, and every edge is one-way: there is no edge `T -> A`.
    correct: via-b-a
    followUps:
      via-a:
        prompt: '`S -> A` wrote `prev["A"] = "S"`. What happens to it when `B -> A` lowers `A`?'
        options:
          - id: replaced
            text: It is replaced by `B`, the start of the cheaper edge
          - id: kept
            text: It stays `S`, since a key is written only once
          - id: both
            text: Both are kept, and the walk follows the first one
        correct: replaced
        explanation: >-
          Assigning to a dictionary key replaces its old value. Each lowering of `A` writes the
          node it came through, so `prev["A"]` always names the node whose edge set the current
          `dist["A"]`.
      direct:
        prompt: Does checking `S -> T` change `prev["T"]`?
        options:
          - id: no-write
            text: No. The test `0 + 9 < 6` fails, so `prev` is left alone
          - id: every-check
            text: Yes. Every edge that is checked writes its start into `prev`
          - id: last-edge
            text: Yes, since it is the last edge into `T` in the list
        correct: no-write
        explanation: >-
          `prev[v] = u` sits inside the `if`, so it runs only when the route through `u` is
          cheaper. `prev` changes exactly when `dist` does.
      backward:
        prompt: Which way does the rebuilt route run?
        options:
          - id: from-start
            text: From `S` to `T`, so the walk's nodes are read in reverse
          - id: from-end
            text: From `T` to `S`, the order in which the walk visits them
          - id: either
            text: Either way, since a route can use an edge in both directions
        correct: from-start
        explanation: >-
          `prev[v]` is the node before `v` on the route, so the walk from `T` meets the nodes last
          to first. Reversing them gives the route from `S`.

  - format: tap-cell
    id: wp-pop-smallest-final
    heading: Which distance is already final?
    tags: [graph, heap, python]
    workedExample: |-
      No weight is negative. `S` is done, with its edges `S -> X` 3 and `S -> Y` 6 relaxed, so
      `dist = {"S": 0, "X": 3, "Y": 6}` and the heap holds `(3, "X")` and `(6, "Y")`. The only
      other edge is `X -> Y` with weight 2.

      1. `Y`'s entry is 6, but a route through `X` costs `3 + 2`, which is 5. So `Y`'s 6 can still
         drop, and it is not final.
      2. Any route to `X` other than `S -> X` must leave `S` through `Y`, and reaching `Y` already
         costs at least 6.
      3. Weights add 0 or more, so such a route costs at least 6, more than 3. Nothing found later
         can beat 3, so `X`'s distance is final.
    prompt: >-
      Dijkstra's algorithm finds cheapest distances when no weight is negative. It keeps a heap
      of `(distance, node)` pairs, pushes one whenever a relaxation lowers `dist[v]`, and pops the
      pair with the smallest distance (Python compares tuples item by item from the left, and
      moves to the next item only on a tie). A distance is final when no route found later can
      lower it. Below, `S` and `A` are done: their distances are final and their edges are
      relaxed. The cells list the nodes still in the heap. Whose distance is already final? Tap
      it.
    code: |
      graph = {"S": [("A", 2), ("B", 7)], "A": [("C", 2), ("D", 3), ("E", 7)],
               "B": [("E", 1)], "C": [("B", 1), ("D", 0)], "D": [("E", 2)], "E": []}
      dist = {"S": 0, "A": 2, "B": 7, "C": 4, "D": 5, "E": 9}
      heap = [(4, "C"), (7, "B"), (5, "D"), (9, "E")]  # S and A done
    sequence:
      kind: array
      name: nodes
      cells: [B, C, D, E]
    correct: 1
    explanation: >-
      `(4, "C")` is the smallest entry. A route that reaches `C` through `B`, `D` or `E` starts
      from at least 5, and weights add 0 or more. Nothing found later can beat 4, so `C` is final.
    misses:
      - index: 0
        explanation: >-
          `B` is at 7, but once `C`'s edges are relaxed, `C -> B` offers 4 + 1 = 5. A larger entry
          can still drop.
      - index: 2
        explanation: >-
          `D`'s 5 is the next smallest, but `C -> D` weighs 0 and offers 4 + 0 = 4, less than 5.
          Only the smallest entry is safe.
      - index: 3
        explanation: >-
          `E`'s 9 is the largest entry, and a route through `D` costs only 5 + 2 = 7. A distance
          that a cheaper route can still beat is not final.

  - format: step-trace
    id: wp-dijkstra-pop-trace
    heading: Follow the pops
    tags: [graph, heap, python]
    workedExample: |-
      Consider `graph = {"S": [("X", 4), ("Y", 1)], "Y": [("X", 1)], "X": []}`, with the heap
      starting as `[(0, "S")]`. Each pop takes the smallest entry.

      1. Popping `(0, "S")` expands `S`. `X` drops to 4 and `Y` to 1, and the entries `(4, "X")` and
         `(1, "Y")` are pushed.
      2. The smallest entry is `(1, "Y")`, so `Y` is expanded next. `1 + 1` is 2, which is less than
         4, so `X` drops to 2 and `(2, "X")` is pushed.
      3. `(2, "X")` pops next and expands `X` at 2. Then `(4, "X")` pops. 4 is more than
         `dist["X"]`, which is 2, so that entry is stale and skipped.
    prompt: >-
      This is Dijkstra's algorithm. The heap holds `(distance, node)` pairs and pops the pair with
      the smallest distance (Python compares tuples item by item from the left, and moves to the
      next item only on a tie). A node is expanded when an entry for it pops and its edges are
      relaxed, each lowered `dist[v]` pushing `(d + w, v)`. An entry is stale when its distance is
      larger than the node's `dist`, because a cheaper entry for that node was pushed after it.
      `u` marks the node expanded most recently. Predict each step.
    code: |
      import heapq
      graph = {"S": [("A", 2), ("B", 7)], "A": [("B", 3), ("C", 7)],
               "B": [("C", 1), ("D", 6)], "C": [("D", 2)], "D": []}
      dist = {node: float("inf") for node in graph}
      dist["S"] = 0
      heap = [(0, "S")]
      while heap:
          d, u = heapq.heappop(heap)
          if d > dist[u]:
              continue
          for v, w in graph[u]:
              if d + w < dist[v]:
                  dist[v] = d + w
                  heapq.heappush(heap, (d + w, v))
    sequence:
      kind: array
      name: nodes
      cells: [S, A, B, C, D]
    start:
      - { name: u, at: 0 }
    steps:
      - line: 8
        ask: '`S` has been expanded. Which node is expanded next? Move `u` to it.'
        pointer: u
        correct: 1
        explanation: '`S` pushed `(2, "A")` and `(7, "B")`. The smaller entry pops first, so `A` is expanded at 2.'
        misses:
          - index: 2
            explanation: '`B`''s entry is 7, larger than `A`''s 2. The heap orders entries by distance.'
        elsewhere: Only `A` and `B` have entries in the heap, and `A`'s is smaller.
      - line: 8
        ask: Which node is expanded next?
        pointer: u
        correct: 2
        explanation: >-
          `A` pushed `(5, "B")`, since 2 + 3 is less than 7, and `(9, "C")`. The heap holds 5, 7
          and 9, so `B` is expanded at 5.
        misses:
          - index: 3
            explanation: '`C`''s entry is 9, larger than `B`''s new 5.'
        elsewhere: '`S` and `A` are done, and `D` has no entry yet. The smallest entry is `(5, "B")`.'
      - line: 8
        ask: Which node is expanded next?
        pointer: u
        correct: 3
        explanation: >-
          `B` pushed `(6, "C")` and `(11, "D")`. The heap holds 6, 7, 9 and 11, so `C` is expanded
          at 6.
        misses:
          - index: 4
            explanation: '`D`''s only entry is 11, larger than `C`''s 6.'
          - index: 2
            explanation: >-
              The old `(7, "B")` entry is still in the heap, but 6 is smaller, so `(6, "C")` pops
              first.
        elsewhere: The smallest entry in the heap is `(6, "C")`.
      - line: 9
        ask: 'The next pop is `(7, "B")`. What does the loop do with it?'
        options:
          - id: skip
            text: 'Skips it, since 7 is larger than `dist["B"]`'
            explanation: '`B` was expanded at 5, so the entry with 7 is stale. The check skips it before any edge is scanned.'
          - id: rescan
            text: Scans the edges out of `B` again, now with `d` at 7
            explanation: >-
              That happens only without the stale check. With it, `7 > 5` sends the loop to
              `continue`.
          - id: raise
            text: 'Sets `dist["B"]` to 7, the distance in the entry'
            explanation: >-
              Nothing in the loop raises a distance. `dist` changes only inside
              `if d + w < dist[v]`, which lowers it.
        correct: skip
      - line: 8
        ask: '`D` is expanded next. With what distance does its entry pop?'
        options:
          - id: eight
            text: '`8`'
            explanation: >-
              `C` pushed `(8, "D")`, since 6 + 2 is less than 11. That entry pops before the old
              11, which is stale by the time it pops.
          - id: eleven
            text: '`11`'
            explanation: >-
              11 came from `B`. `C` later found 6 + 2 = 8, which pops first. The 11 entry is
              stale when it pops.
          - id: thirteen
            text: '`13`'
            explanation: >-
              13 would be 7 + 6, the stale `B` entry plus `B -> D`. That entry was skipped, so its
              edges were never scanned.
        correct: eight

  - format: tap-cell
