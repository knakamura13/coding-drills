id: subsequence-tables-checkpoint
title: "Dynamic programming: two strings (checkpoint)"
description: Fill fresh LCS and edit distance tables, find the call a near-miss fill gets wrong, and complete the table for a new two-string task. Each item combines the two-string table skills.
heading: What does the table hold?

questions:
  - id: checkpoint-row-trace
    format: step-trace
    heading: Predict each step
    tags: [dp, python]
    prompt: >-
      `a = "lament"`, `b = "mantle"` and `i = 6`, so `a[i - 1]` is `t`. The board is `prev`, row 5
      of the LCS table. The passes with `j` at 1 and 2 have run, so `cur` starts `[0, 1, 1]`.
      Predict each step.
    code: |
      cur = [0] * (len(b) + 1)
      for j in range(1, len(b) + 1):
          if a[i - 1] == b[j - 1]:
              cur[j] = prev[j - 1] + 1
          else:
              cur[j] = max(prev[j], cur[j - 1])
    sequence: { kind: array, name: prev, cells: [0, 1, 1, 2, 2, 2, 2] }
    start:
      - { name: j, at: 2 }
    steps:
      - line: 3
        ask: On the pass with `j` at 3, `b[2]` is `n`. What is `cur[3]`?
        options:
          - id: two
            text: '2'
            explanation: >-
              `n` is not `t`, so the cell takes the larger of `prev[3]`, 2, and `cur[2]`, 1.
          - id: one
            text: '1'
            explanation: Check which neighbors a mismatch compares.
          - id: three
            text: '3'
            explanation: Check whether this pass is a match.
        correct: two
        also:
          - { name: j, at: 3 }
      - line: 3
        ask: Tap where `j` is on the pass where `a[i - 1]` equals `b[j - 1]`.
        pointer: j
        correct: 4
        explanation: >-
          The `t` of `mantle` is `b[3]`, and the code compares `b[j - 1]`, so the match comes on
          the pass with `j` at 4.
        misses:
          - index: 3
            explanation: Check which letter of `b` the code reads when `j` is 3.
          - index: 5
            explanation: Check which letter of `b` the code reads when `j` is 5.
        elsewhere: The code compares `b[j - 1]`.
      - line: 3
        ask: What does the pass with `j` at 4 store in `cur[4]`?
        options:
          - id: three
            text: '3'
            explanation: >-
              The letters match, so the cell is `prev[3] + 1`: 2 for `lamen` and `man`, plus the
              `t`.
          - id: two
            text: '2'
            explanation: Check which rule a match uses.
          - id: one
            text: '1'
            explanation: Check what a match adds 1 to.
        correct: three
      - line: 3
        ask: The pass with `j` at 5 compares `t` with `l`. What is `cur[5]`?
        options:
          - id: three
            text: '3'
            explanation: >-
              No match, so the cell is the larger of `prev[5]`, 2, and `cur[4]`, 3.
          - id: two
            text: '2'
            explanation: Check the cell to the left as well as the cell above.
          - id: four
            text: '4'
            explanation: Check whether this pass is a match.
        correct: three
        also:
          - { name: j, at: 5 }
      - line: 3
        ask: The pass with `j` at 6 runs. What length does the full table report?
        options:
          - id: three
            text: "3, such as `ant`"
            explanation: >-
              `cur[6]` is `dp[6][6]`, the larger of `prev[6]`, 2, and `cur[5]`, 3. `ant` and `mnt`
              are in order in both words.
          - id: two
            text: "2, the common substring `nt`"
            explanation: Check whether the table counts letters with gaps between them.
          - id: four
            text: "4, as `mantle` adds its `e`"
            explanation: Check whether `lament` has an `e` after its `t`.
        correct: three
        also:
          - { name: j, at: 6 }

  - id: checkpoint-subsequence-check-rule
    heading: Which line completes the table?
    tags: [dp, arrays-strings]
    prompt: |-
      This table tells whether `s` is a subsequence of `t`: every letter of `s` used once, in
      order, with letters of `t` skipped between them. `ok[i][j]` is `True` when the first `i`
      letters of `s` are a subsequence of the first `j` letters of `t`. Row 0 is all `True`, since
      the empty string is a subsequence of anything, and the rest of column 0 is `False`.

      ```python
      ok = [[False] * (len(t) + 1) for _ in range(len(s) + 1)]
      for j in range(len(t) + 1):
          ok[0][j] = True
      for i in range(1, len(s) + 1):
          for j in range(1, len(t) + 1):
              if s[i - 1] == t[j - 1]:
                  ok[i][j] = ok[i - 1][j - 1]
              else:
                  ok[i][j] = ???
      return ok[len(s)][len(t)]
      ```

      Which expression replaces `???` so that the call returns `True` exactly when `s` is a
      subsequence of `t`?
    options:
      - id: skip-t
        text: "`ok[i][j - 1]`"
        explanation: >-
          The two letters differ, so `t[j - 1]` cannot be the letter that matches `s[i - 1]`, and
          `t` may skip it. `s` may skip nothing, so its prefix stays the same and only `j` drops.
      - id: skip-either
        text: "`ok[i - 1][j] or ok[i][j - 1]`"
        explanation: >-
          `ok[i - 1][j]` drops the letter `s[i - 1]` without matching it, so `s` could skip
          letters. For `s = "ear"` and `t = "area"` it returns `True`, but `"area"` has no `r`
          after its `e`.
      - id: diagonal
        text: "`ok[i - 1][j - 1]`"
        explanation: >-
          The diagonal drops `s[i - 1]` along with `t[j - 1]`, so that letter of `s` is never
          found. In row 1 it reads row 0, which is all `True`. For `s = "lit"` and `t = "tail"`
          it returns `True`, but `"tail"` has no `t` after its `i`.
      - id: always-false
        text: "`False`"
        explanation: >-
          A mismatch only means `t` skips a letter here. Writing `False` forgets the matches made
          before it: for `s = "pat"` and `t = "plant"` it returns `False`, though `p`, `a` and `t`
          appear in order with the `l` and the `n` skipped.
    correct: skip-t
    followUps:
      skip-either:
        prompt: Which of the two strings may skip letters?
        options:
          - { id: t-only, text: "Only `t`: every letter of `s` must be matched" }
          - { id: both, text: "Both, as in the longest common subsequence table" }
          - { id: s-only, text: "Only `s`, since it is the shorter string" }
        correct: t-only
        explanation: >-
          In the longest common subsequence table either string may leave a letter out. Here `s`
          must be found whole, so on a mismatch only the letter of `t` is dropped.
      diagonal:
        prompt: On a mismatch, which letter is certain not to help match `s[i - 1]`?
        options:
          - { id: t-letter, text: "`t[j - 1]`, since it differs from `s[i - 1]`" }
          - { id: both, text: "Both `s[i - 1]` and `t[j - 1]`, since they differ" }
          - { id: s-letter, text: "`s[i - 1]`, since it is the letter being looked for" }
        correct: t-letter
        explanation: >-
          `s[i - 1]` still has to be matched by some earlier letter of `t`. Only `t[j - 1]` is
          ruled out, so the cell reads `ok[i][j - 1]`.
      always-false:
        prompt: "For `s = \"pat\"` and `t = \"plant\"`, where is the `a` of `s` matched?"
        options:
          - { id: index-two, text: "At `t[2]`, after the `l` of `t` is skipped" }
          - { id: nowhere, text: "Nowhere, since `t[1]` is an `l`" }
          - { id: index-one, text: "At `t[1]`, since letters are matched index by index" }
        correct: index-two
        explanation: >-
          A subsequence may skip letters of `t` between matches. So a mismatch passes the count
          from the cell to the left instead of starting again.

  - id: checkpoint-debug-match-neighbor
    heading: Which call goes wrong?
    tags: [dp, python]
    prompt: |-
      A suggested solution fills the LCS table to return the length of the longest common
      subsequence of `a` and `b`.

      ```python
      def lcs_length(a, b):
          dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
          for i in range(1, len(a) + 1):
              for j in range(1, len(b) + 1):
                  if a[i - 1] == b[j - 1]:
                      dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]) + 1
                  else:
                      dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
          return dp[len(a)][len(b)]
      ```

      Which call returns a wrong length?
    options:
      - id: seen-tone
        text: '`lcs_length("seen", "tone")`'
        explanation: >-
          It returns 2, but the answer is 1. At `dp[3][4]` the first `e` of `seen` is already
          matched with the `e` of `tone`, so the cell above holds 1. The second `e` matches that
          same `e` again, and adding 1 to the cell above counts it twice. The diagonal, 0, would
          give the right 1.
      - id: moon-tent
        text: '`lcs_length("moon", "tent")`'
        explanation: >-
          It returns 1, which is right. Both words repeat a letter, but neither repeated letter is
          in the other word, so no letter can be matched twice.
      - id: plan-lane
        text: '`lcs_length("plan", "lane")`'
        explanation: >-
          It returns 3, which is right, for `lan`. No letter repeats, so at each match the cell
          above and the cell to the left equal the diagonal, and adding 1 to them is safe.
      - id: wing-twig
        text: '`lcs_length("wing", "twig")`'
        explanation: >-
          It returns 3, which is right, for `wig`. At the `g` match the cell above, the cell to
          the left and the diagonal all hold 2, so adding 1 to the larger neighbor gives the same
          3 as the diagonal.
    correct: seen-tone
    followUps:
      moon-tent:
        prompt: "For adding 1 to the larger neighbor to go wrong, what must be true at a match?"
        options:
          - { id: used, text: "The larger neighbor already used one of the two matched letters" }
          - { id: repeat, text: "Either word repeats any letter at all" }
          - { id: long, text: "The words are longer than four letters" }
        correct: used
        explanation: >-
          The cell above has used the letter of `b` only if a letter of `a` equal to it came
          earlier. That needs a repeated letter that the other word also holds.
      plan-lane:
        prompt: At a match, when are the cell above and the cell to the left larger than the diagonal?
        options:
          - { id: reused, text: "Only when one of them has already matched one of the two letters" }
          - { id: always, text: "Always, since they cover more letters" }
          - { id: never, text: "Never, since a match cell's neighbors are equal" }
        correct: reused
        explanation: >-
          A neighbor beats the diagonal only by matching a letter the diagonal leaves out, one of
          the two letters this cell compares. Without a repeated letter, nothing else can match
          them.
      wing-twig:
        prompt: "In `lcs_length(\"wing\", \"twig\")`, what does the match of the two `g`s add 1 to?"
        options:
          - { id: two, text: "2, which the diagonal also holds, so the result is right" }
          - { id: three, text: "3, so the result is 4, one too many" }
          - { id: one, text: "1, so the result is 2, one too few" }
        correct: two
        explanation: >-
          `win` and `twig` share `wi`, and so do `wing` and `twi`, and `win` and `twi`. With all
          three cells at 2, the larger neighbor is no larger than the diagonal.

  - id: checkpoint-edit-distance-cell
    heading: What does the cell hold?
    tags: [dp]
    prompt: >-
      Edit distance is the fewest edits that turn one string into another, where an edit inserts,
      deletes or replaces one letter. `dp[i][j]` is the edit distance from `a[:i]` to `b[:j]`. For
      `a = "tile"` and `b = "timer"`, `dp[4][5]` compares `a[3]`, an `e`, with `b[4]`, an `r`. The
      diagonal `dp[3][4]` is 2, the cell above, `dp[3][5]`, is 3, and the cell to the left,
      `dp[4][4]`, is 1. What does `dp[4][5]` hold?
    options:
      - id: two
        text: "2: 1 plus the cell to the left, for inserting the `r`"
        explanation: >-
          `e` and `r` differ, so the cell is 1 plus the smallest of its three neighbors. The cell to
          the left turns `tile` into `time` in 1 edit, and inserting the `r` makes 2. A replace would
          cost 2 + 1 and a delete 3 + 1.
      - id: one
        text: "1: the cell to the left, copied, since it is the smallest"
        explanation: >-
          Copying a neighbor adds no edit, which only a match allows. `e` and `r` differ, so one
          more edit is needed: inserting the `r` after `time` makes 2.
      - id: three
        text: "3: the larger of the cell above and the cell to the left"
        explanation: >-
          That is the longest common subsequence rule, which keeps the larger count of shared
          letters. Edit distance keeps the fewest edits, so it starts from the smallest neighbor
          and adds 1 on a mismatch: 1 + 1 = 2.
      - id: four
        text: "4: the diagonal, 2, plus 2 for deleting the `e` and inserting the `r`"
        explanation: >-
          Deleting the `e` and inserting the `r` is two edits, but replacing the `e` with an `r` is
          one, so the diagonal gives 3. Inserting the `r` after `time` does better still: 1 + 1 = 2.
    correct: two
    followUps:
      one:
        prompt: When can an edit distance cell copy a neighbor without adding 1?
        options:
          - { id: match, text: "Only on a match, since equal letters need no edit" }
          - { id: smallest, text: "Whenever that neighbor is the smallest of the three" }
          - { id: left, text: "Whenever that neighbor is the cell to the left" }
        correct: match
        explanation: >-
          Each neighbor counts the edits for shorter prefixes, and building on one adds an edit for
          the last letters. Only on a match is that edit not needed, and then the cell copies the
          diagonal.
      three:
        prompt: In an edit distance table, is a larger cell a better answer?
        options:
          - { id: fewer, text: "No: fewer edits is better, so the smallest neighbor is kept" }
          - { id: larger, text: "Yes: a larger cell has matched more letters" }
          - { id: mismatch, text: "Only on a mismatch, as in the longest common subsequence table" }
        correct: fewer
        explanation: >-
          The LCS table counts shared letters, so it keeps the larger neighbor. An edit distance
          table counts edits, so it builds on the smallest of the three neighbors and adds 1 on a
          mismatch.
      four:
        prompt: How many edits turn a single `e` into an `r`?
        options:
          - { id: one, text: "One, a replace" }
          - { id: two, text: "Two, a delete and then an insert" }
          - { id: none, text: "None, since both are single letters" }
        correct: one
        explanation: >-
          A replace swaps one letter for another in a single edit, which is why the diagonal counts
          only 1 more. A delete and an insert do the same work in two.

  - id: checkpoint-walk-ties-left
    heading: What does the walk back return?
    tags: [dp]
    prompt: |-
      The table is for `a = "stone"` and `b = "snore"`. A walk back starts at `dp[5][5]`. On a
      match it records the letter and steps diagonally. On a mismatch it steps up if
      `dp[i - 1][j] > dp[i][j - 1]` and left otherwise, so a tie steps **left**. It returns the
      recorded letters reversed. What does it return?

      ```
           -  s  n  o  r  e
      -    0  0  0  0  0  0
      s    0  1  1  1  1  1
      t    0  1  1  1  1  1
      o    0  1  1  2  2  2
      n    0  1  2  2  2  2
      e    0  1  2  2  2  3
      ```
    options:
      - id: sne
        text: "`sne`"
        explanation: >-
          `(5, 5)` records `e`. The ties at `(4, 4)` and `(4, 3)` both step left, and `(4, 2)`
          records `n`. Two steps up, where 1 beats 0, reach `(1, 1)`, which records `s`. Reversed:
          `sne`.
      - id: soe
        text: "`soe`"
        explanation: Check which way this walk breaks a tie.
      - id: ens
        text: "`ens`"
        explanation: Check the order in which the walk records its letters.
    correct: sne
    followUps:
      soe:
        prompt: At `(4, 4)` both neighbors hold 2. Which way does `>` send the walk?
        options:
          - { id: left, text: "Left, since 2 > 2 is false" }
          - { id: up, text: "Up, since a tie always goes up" }
          - { id: diagonal, text: "Diagonally, since neither neighbor is larger" }
        correct: left
        explanation: >-
          With `>`, the walk goes up only when the cell above is strictly larger. Ties step left.
          `soe` and `sne` are both longest common subsequences, and the tie rule picks which one
          comes out.
      ens:
        prompt: The walk starts at the corner and moves toward `dp[0][0]`. In what order does it record letters?
        options:
          - { id: back, text: "From the ends of the words toward the start, so the list comes out reversed" }
          - { id: front, text: "From the start of the words toward the end, already in reading order" }
          - { id: sorted, text: "In sorted order, since the table only counts letters" }
        correct: back
        explanation: >-
          The corner covers the whole words, and the walk finds each match before the matches to
          its left. Reversing the list puts the letters back in reading order.

  - id: checkpoint-run-end-tap
    format: tap-cell
    heading: Where does the shared run end?
    tags: [dp, arrays-strings]
    prompt: >-
      `a = "blanket"` and `b = "banker"`. The code fills a table that resets to 0 on a mismatch and
      keeps the largest cell in `best`. Tap the letter of `a` where their longest common substring
      ends.
    code: |
      best = 0
      for i in range(1, len(a) + 1):
          for j in range(1, len(b) + 1):
              if a[i - 1] == b[j - 1]:
                  run[i][j] = run[i - 1][j - 1] + 1
                  best = max(best, run[i][j])
    sequence: { kind: string, name: a, cells: [b, l, a, n, k, e, t] }
    correct: 5
    explanation: >-
      `anke` sits letter by letter in both words, `bl-anke-t` and `b-anke-r`, and ends at `a[5]`.
      No common substring of five letters exists, so `best` is 4.
    misses:
      - index: 6
        explanation: Check whether `banker` has this letter.
      - index: 0
        explanation: Check whether the letters after this `b` match in both words.
      - index: 1
        explanation: Check whether `banker` has this letter.
      - index: 2
        explanation: Check whether the shared run stops here.
      - index: 3
        explanation: Check whether the shared run stops here.
      - index: 4
        explanation: Check whether the shared run stops here.

  - id: checkpoint-length-or-string
    heading: What does each program need?
    tags: [dp, complexity]
    prompt: >-
      Two programs fill the LCS table for `a` of length 50 and `b` of length 400, with one row per
      prefix of `a` and one column per prefix of `b`. Program A needs only the length. Program B
      needs one longest common subsequence, rebuilt by the plain walk back from `dp[50][400]`.
      Which statement is correct?
    options:
      - id: two-rows-or-all
        text: "Both fill 20,000 cells. A can keep two rows of 401; B keeps all 51 rows"
        explanation: >-
          The fill computes one cell per pair of nonempty prefixes, 50 x 400 = 20,000, in either
          program. A row reads only the row above, so A needs 2 x 401 entries. The walk back climbs
          into rows far above the last, so B stores 51 x 401 = 20,451 entries and walks at most
          449 steps.
      - id: two-rows-both
        text: "Both can keep two rows, since the walk back reads only the last row"
        explanation: Check which rows the walk can reach when it steps up.
      - id: walk-quadratic
        text: "B keeps all 51 rows and may walk 20,000 steps, one per cell"
        explanation: Check what each step of the walk does to `i + j`.
      - id: a-full
        text: "A must also keep all 51 rows, since every row feeds `dp[50][400]`"
        explanation: Check which rows a row reads while it is filled.
    correct: two-rows-or-all
    followUps:
      two-rows-both:
        prompt: >-
          From `(i, j)` the walk may step to `(i - 1, j)`. After many such steps, which rows can it
          read?
        options:
          - { id: earlier, text: "Rows far above the last one, all the way toward row 0" }
          - { id: last-two, text: "Only the last two rows, since it moves one row at a time" }
          - { id: last, text: "Only row 50, since `j` is the index that changes" }
        correct: earlier
        explanation: >-
          The walk can climb from row 50 to row 0, so every row may be read. Two rows give the
          length, but rebuilding the string this way needs the whole table.
      walk-quadratic:
        prompt: >-
          The walk starts with `i + j = 450`, and every step lowers `i + j` by 1 or 2. At most how
          many steps can it take?
        options:
          - { id: at-most-449, text: "449, as it stops once `i` or `j` reaches 0" }
          - { id: twenty-thousand, text: "20,000, as it may visit every cell" }
          - { id: fifty, text: "50, as only `i` limits the walk" }
        correct: at-most-449
        explanation: >-
          No cell repeats, since `i + j` always falls. The walk stops at `i = 0` or `j = 0`, so it
          takes at most m + n - 1 steps, far fewer than the 20,000 cells of the fill.
      a-full:
        prompt: While row 30 is being filled, which earlier rows will the fill still read?
        options:
          - { id: row-29, text: "Only row 29, along with row 30 itself" }
          - { id: all, text: "All of rows 0 to 29, since the corner depends on them" }
          - { id: none, text: "None, since each row is computed from `a` and `b` alone" }
        correct: row-29
        explanation: >-
          Row `i` reads only row `i - 1` and itself. Earlier rows have already shaped row 29, so
          the length needs just two rows of 401 entries.
