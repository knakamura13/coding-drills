id: sort-order-review
title: "Sort order: review"
description: Fresh inputs for the Sort order skills, for recall on later days. No worked examples this time.
heading: What does this give?

questions:
  - id: abs-key-review
    heading: What does this print?
    tags: [sorting, python]
    prompt: |-
      ```python
      print(sorted([-7, 3, -1, 5], key=abs))
      ```

      What does it print?
    options:
      - id: right
        text: "`[-1, 3, 5, -7]`"
        explanation: >-
          `abs` gives the keys 7, 3, 1 and 5. In key order that is -1 (1), 3, 5 and -7 (7). The
          numbers come back with their signs.
      - id: by-value
        text: "`[-7, -1, 3, 5]`"
        explanation: >-
          That is the plain sort with no key. With `key=abs`, -7 counts as 7, the largest, so it goes
          last.
      - id: keys
        text: "`[1, 3, 5, 7]`"
        explanation: >-
          Those are the keys, sorted. `sorted` uses them to place the items, then returns the items
          themselves.
      - id: descending
        text: "`[-7, 5, 3, -1]`"
        explanation: >-
          That starts from the largest key. `sorted` starts from the smallest unless it is given
          `reverse=True`.
    correct: right
    followUps:
      by-value:
        prompt: With `key=abs`, what does the sort compare when it compares -7 and 5?
        options:
          - id: keys
            text: 7 against 5
          - id: items
            text: -7 against 5
          - id: both
            text: 7 against 5, then -7 against 5 if those tie
        correct: keys
        explanation: >-
          Every comparison uses the keys, and only the keys. 7 > 5, so -7 goes after 5, even though
          -7 is the smaller number.
      keys:
        prompt: What does the list returned by `sorted(v, key=abs)` hold?
        options:
          - id: originals
            text: The numbers from `v`, signs and all
          - id: absolute
            text: The absolute values
          - id: pairs
            text: Pairs of each number and its key
        correct: originals
        explanation: >-
          The key is only for comparing. To get the absolute values themselves, map them first, as
          in `sorted(abs(x) for x in v)`.
      descending:
        prompt: Which call puts the number with the largest `abs` first?
        options:
          - id: reverse
            text: "`sorted(v, key=abs, reverse=True)`"
          - id: plain
            text: "`sorted(v, key=abs)`"
          - id: method
            text: "`sorted(v, key=abs).reverse()`"
        correct: reverse
        explanation: >-
          `sorted` is ascending by default, and `reverse=True` turns it around. `.reverse()` does
          reverse a list, but it works in place and returns `None`, so that last call gives `None`.

  - id: digit-strings-review
    format: tap-cell
    heading: Tap the string it prints
    tags: [sorting, python]
    prompt: Tap the string that this code prints.
    code: |
      ids = ["9", "10", "100", "25"]
      print(sorted(ids)[-1])
    sequence:
      kind: array
      name: ids
      cells: ['"9"', '"10"', '"100"', '"25"']
    correct: 0
    explanation: >-
      These are strings, so they compare character by character. The first characters are 9, 1, 1
      and 2, and the character 9 is the largest, so `"9"` sorts last, even though 9 is the smallest
      number.
    misses:
      - index: 1
        explanation: >-
          `"10"` starts with the character 1, the smallest first character here, so it sorts
          first.
      - index: 2
        explanation: >-
          As a number, 100 is the largest. As a string it starts with 1, so it sorts near the front,
          right after `"10"`.
      - index: 3
        explanation: >-
          `"25"` starts with 2, which comes before 9, so it sorts ahead of `"9"`.

  - id: case-key-review
    heading: What does this print?
    tags: [sorting, python]
    prompt: |-
      ```python
      words = ["beta", "Alpha", "gamma", "Delta"]
      print(sorted(words, key=lambda w: w.lower()))
      ```

      What does it print?
    options:
      - id: right
        text: "`['Alpha', 'beta', 'Delta', 'gamma']`"
        explanation: >-
          The keys are the lowercased words, so the order is alphabetical as if case did not exist.
          The key is only for comparing, so the words come back with their capitals.
      - id: default
        text: "`['Alpha', 'Delta', 'beta', 'gamma']`"
        explanation: >-
          That is the plain sort, where every capital A to Z comes before every lowercase a to z.
          With the key, beta is compared as beta and Delta as delta, so beta goes first.
      - id: keys
        text: That order, but with every word in lowercase
        explanation: >-
          The order is right, but lowercase words are the keys. The sort compares the lowercased words and
          hands back the original ones, capitals and all.
    correct: right
    followUps:
      default:
        prompt: "What does `key=lambda w: w.lower()` change about comparing `\"beta\"` and `\"Delta\"`?"
        options:
          - id: compare-lower
            text: They are compared as beta and delta, so b comes before d
          - id: nothing
            text: Nothing, a capital still comes before any lowercase letter
          - id: capitals-only
            text: Only `"Delta"` is lowered, because only it has a capital
        correct: compare-lower
        explanation: >-
          The key runs on every word before comparing. Once both are lowercase, the capital D no
          longer pulls Delta ahead.
      keys:
        prompt: "Does `sorted(words, key=lambda w: w.lower())` change the words it returns?"
        options:
          - id: originals
            text: No, it returns the original words, ordered by their lowercased keys
          - id: lowered
            text: Yes, it returns every word in lowercase
          - id: first-only
            text: Only the words that had a capital
        correct: originals
        explanation: >-
          A key is used only to compare. To get lowercase words back, lower them first, as in
          `sorted(w.lower() for w in words)`.

  - id: pair-ends-review
    format: drag-pointers
    heading: Where do the ends land?
    tags: [sorting, python]
    prompt: >-
      `sorted(pairs)` runs on the list below. Drag `first` to the pair it puts first and `last` to
      the pair it puts last.
    code: |
      pairs = [(5, 1), (2, 8), (5, 0), (2, 3), (1, 9)]
      out = sorted(pairs)
    sequence:
      kind: array
      name: pairs
      cells: ['(5, 1)', '(2, 8)', '(5, 0)', '(2, 3)', '(1, 9)']
    pointers:
      - name: first
        start: 1
        correct: 4
        explanation: >-
          1 is the smallest first value, so `(1, 9)` leads. Its large second value never comes into
          it.
        misses:
          - index: 2
            explanation: >-
              `(5, 0)` has the smallest second value, but tuples compare their first values first,
              and 5 is the largest of those.
          - index: 3
            explanation: >-
              `(2, 3)` is the smaller of the two pairs that start with 2, but `(1, 9)` starts with 1,
              which is smaller still.
        elsewhere: The first values decide first, and 1 is the smallest.
      - name: last
        start: 3
        correct: 0
        explanation: >-
          `(5, 1)` and `(5, 0)` share the largest first value, 5. The second values break the tie,
          0 < 1, so `(5, 1)` is last.
        misses:
          - index: 2
            explanation: >-
              `(5, 0)` ties with `(5, 1)` on the first value. A plain sort then compares the second
              values, and 0 < 1 puts `(5, 0)` ahead.
          - index: 4
            explanation: >-
              `(1, 9)` has the largest second value, but its first value, 1, is the smallest, so it
              goes first.
        elsewhere: The pairs that start with 5 go last, and their second values order them.

  - id: stable-len-review
    format: tap-cell
    heading: Tap the word it prints
    tags: [sorting, python]
    prompt: Tap the word that this code prints.
    code: |
      words = ["bee", "ox", "ant", "cat", "yak"]
      out = sorted(words, key=len)
      print(out[1])
    sequence:
      kind: array
      name: words
      cells: [bee, ox, ant, cat, yak]
    correct: 0
    explanation: >-
      ox is the only 2-letter word, so it is `out[0]`. The four 3-letter words tie and keep their
      input order, so bee comes next: `['ox', 'bee', 'ant', 'cat', 'yak']`.
    misses:
      - index: 1
        explanation: ox is the shortest word, so it lands at index 0.
      - index: 2
        explanation: >-
          ant would come next if ties were broken alphabetically. The key is only the length, so
          the tied words stay in input order, and bee came first.
      - index: 3
        explanation: cat is the third of the tied words, so it lands at index 3.
      - index: 4
        explanation: >-
          yak came last among the tied words, and a stable sort keeps them in input order, so it
          lands last, at index 4.

  - id: reverse-flag-review
    heading: What does this print?
    tags: [sorting, python]
    prompt: |-
      ```python
      words = ["kiwi", "fig", "banana", "grape"]
      print(sorted(words, key=len, reverse=True))
      ```

      What does it print?
    options:
      - id: right
        text: "`['banana', 'grape', 'kiwi', 'fig']`"
        explanation: >-
          The keys are the lengths 4, 3, 6 and 5. `reverse=True` runs from the largest key down, so
          banana (6) leads, then grape (5), kiwi (4) and fig (3).
      - id: ascending
        text: "`['fig', 'kiwi', 'grape', 'banana']`"
        explanation: >-
          That is the order with no `reverse`, shortest first. `reverse=True` starts from the
          largest key.
      - id: input-reversed
        text: "`['grape', 'banana', 'fig', 'kiwi']`"
        explanation: >-
          That is the input back to front, `words[::-1]`. `reverse=True` reverses the key order,
          so the lengths still decide.
      - id: spelling-reversed
        text: "`['kiwi', 'grape', 'fig', 'banana']`"
        explanation: >-
          That is the words by spelling from Z to A, which ignores the key. With `key=len`, every
          comparison uses the lengths.
    correct: right
    followUps:
      ascending:
        prompt: With `reverse=True`, which word comes first?
        options:
          - id: largest
            text: The word with the largest key, the longest
          - id: smallest
            text: The word with the smallest key, the shortest
          - id: last-input
            text: The last word in the input
        correct: largest
        explanation: >-
          A sort runs from the smallest key up unless it is given `reverse=True`, which makes it
          start from the largest key.
      input-reversed:
        prompt: What does `reverse=True` reverse?
        options:
          - id: keys
            text: The order of the keys, so the largest key comes first
          - id: input
            text: The input list, before anything is compared
          - id: result
            text: Nothing, unless two keys tie
        correct: keys
        explanation: >-
          The sort still compares the lengths. `reverse=True` only turns that order around, so the
          longest word leads, wherever it was in the input.
      spelling-reversed:
        prompt: "With `key=len`, what decides whether kiwi or grape comes first?"
        options:
          - id: lengths
            text: Their lengths, 4 and 5
          - id: spelling
            text: Their spelling, k against g
          - id: input
            text: Their order in the input
        correct: lengths
        explanation: >-
          The key stands in for each word in every comparison. The words are compared by spelling
          only in a sort with no key.

  - id: two-pass-review
    heading: What does this print?
    tags: [sorting, python]
    prompt: |-
      ```python
      rows = [("eve", "a"), ("al", "b"), ("cy", "a"), ("bo", "b")]
      rows.sort(key=lambda r: r[0])
      rows.sort(key=lambda r: r[1])
      print([name for name, group in rows])
      ```

      What does it print?
    options:
      - id: right
        text: "`['cy', 'eve', 'al', 'bo']`"
        explanation: >-
          The first sort puts the names A to Z: al, bo, cy, eve. The second sorts by group, and
          because it is stable, each group keeps the name order from the first sort: cy, eve, then
          al, bo.
      - id: undone
        text: "`['eve', 'cy', 'al', 'bo']`"
        explanation: >-
          That is the second sort run on the original rows. The first sort had already reordered
          the list, and the second keeps that order within each group.
      - id: first-only
        text: "`['al', 'bo', 'cy', 'eve']`"
        explanation: >-
          That is the list after the first sort only. The second call sorts again, by group, and
          moves the a rows to the front.
    correct: right
    followUps:
      undone:
        prompt: Before the second sort, cy is ahead of eve, and both are in group a. Where does the second sort leave them?
        options:
          - id: kept
            text: cy still ahead of eve
          - id: original
            text: eve ahead of cy, as in the original rows
          - id: random
            text: In either order
        correct: kept
        explanation: >-
          The second sort compares only groups, so cy and eve tie, and a tie keeps the order the
          list had going in. Sorting by the minor field first and the major field second is a
          common way to sort on two fields.
      first-only:
        prompt: Does the second `rows.sort(...)` change the list?
        options:
          - id: yes
            text: Yes, it reorders the same list by group
          - id: no-first
            text: No, only the first sort counts
          - id: no-copy
            text: No, it returns a sorted copy that is thrown away
        correct: yes
        explanation: >-
          Every `.sort()` call reorders the list where it is. The last call sets the overall order,
          and the earlier one only shows through among ties.

  - id: alias-sort-review
    heading: What does this print?
    tags: [sorting, python]
    prompt: |-
      ```python
      a = [7, 2, 5]
      b = a
      c = sorted(a)
      a.sort(reverse=True)
      print(b, c)
      ```

      What does it print?
    options:
      - id: right
        text: "`[7, 5, 2] [2, 5, 7]`"
        explanation: >-
          `b` and `a` are two names for one list, and line 4 reorders that list, so `b` shows
          `[7, 5, 2]`. `c` is the separate list `sorted` built on line 3, and line 4 does not touch
          it.
      - id: copy
        text: "`[7, 2, 5] [2, 5, 7]`"
        explanation: >-
          That treats `b` as a copy. `b = a` gives the same list a second name, so sorting it
          through `a` shows through `b`.
      - id: shared
        text: "`[7, 5, 2] [7, 5, 2]`"
        explanation: >-
          That treats `c` as linked to `a`. `sorted` built `c` as a new list on line 3, and sorting
          `a` afterwards leaves it alone.
    correct: right
    followUps:
      copy:
        prompt: After `b = a`, how many lists are there?
        options:
          - id: one
            text: One list, with two names
          - id: two
            text: Two, because `b` got a copy
          - id: later
            text: Two, but only after one of them changes
        correct: one
        explanation: >-
          Assignment copies the reference, not the list. `a.sort()` changes that one list, so `b`
          sees the change.
      shared:
        prompt: Does `a.sort()` on line 4 change `c`?
        options:
          - id: separate
            text: No, `c` is a separate list that `sorted` built
          - id: made-from
            text: Yes, `c` was made from `a`
          - id: linked
            text: Yes, `sorted` keeps a link back to `a`
        correct: separate
        explanation: >-
          `sorted` copies the items into a brand-new list and keeps no tie to its input. Later
          changes to `a`'s list do not reach `c`.

  - id: sorted-string-review
    heading: What does this print?
    tags: [sorting, python]
    prompt: |-
      `sorted` can read a string. It returns the string's characters in a new list, in order.

      ```python
      word = "tide"
      letters = sorted(word)
      print(word, letters)
      ```

      What does it print?
    options:
      - id: right
        text: "`tide ['d', 'e', 'i', 't']`"
        explanation: >-
          `sorted` reads the string's characters and returns them as a new list. It never changes
          what it reads, so `word` is still `"tide"`.
      - id: in-place
        text: "`deit ['d', 'e', 'i', 't']`"
        explanation: >-
          That changes `word` itself. `sorted` never changes its input, and a string cannot be
          changed in place anyway.
      - id: none
        text: "`tide None`"
        explanation: >-
          `word` is right, but `None` is what the method `.sort()` returns. The function `sorted`
          returns the new list, and `letters` holds it.
    correct: right
    followUps:
      in-place:
        prompt: Can `sorted` change the string it is given?
        options:
          - id: never
            text: No, it returns a new list
          - id: strings
            text: Yes, it sorts strings in place
          - id: always
            text: Yes, it reorders its input
        correct: never
        explanation: >-
          `sorted` only reads its input and returns a new list, and a string cannot be changed
          anyway. To keep the sorted letters, assign the result, as `letters = sorted(word)` does
          here.
      none:
        prompt: Which of these returns `None`?
        options:
          - id: method
            text: The method `xs.sort()`
          - id: function
            text: The function `sorted(xs)`
          - id: both
            text: Both of them
        correct: method
        explanation: >-
          `.sort()` reorders a list in place and returns `None`. `sorted` builds a new list and
          returns it, which is how `letters` gets the characters.

  - id: sort-then-index-review
    format: tap-cell
    heading: Tap the value it prints
    tags: [sorting, python]
    prompt: The board shows `vals` before the sort. Tap the cell holding the value this code prints.
    code: |
      vals = [8, 6, 3, 1]
      vals.sort()
      print(vals[1])
    sequence:
      kind: array
      name: vals
      cells: [8, 6, 3, 1]
    correct: 2
    explanation: >-
      `vals.sort()` reorders the list in place to `[1, 3, 6, 8]`, so `vals[1]` is now 3.
    misses:
      - index: 0
        explanation: 8 is the largest value, so the sort moves it to index 3.
      - index: 1
        explanation: >-
          6 was at index 1 before the sort. `.sort()` changes `vals` itself, so index 1 now holds
          the second-smallest value.
      - index: 3
        explanation: 1 is the smallest, so it is `vals[0]` after the sort. Index 1 holds the next value.
