id: arrays-and-strings-review
title: "Arrays and strings: review"
description: Fresh inputs for the Arrays and strings skills, for recall on later days. No worked examples this time.
heading: What does this give?

questions:
  - id: index-of-value-review
    tags: [python]
    prompt: "`digits = [3, 4, 0, 2, 1]`. What is `digits.index(2)`?"
    options:
      - id: three
        text: "`3`"
        explanation: >-
          `.index(2)` searches for the value `2` and reports where it sits. It is the fourth item,
          and counting from 0 that is slot 3.
      - id: zero
        text: "`0`"
        explanation: >-
          `0` is what sits at position 2, which is `digits[2]`. Here `2` is the value being searched
          for.
      - id: four
        text: "`4`"
        explanation: >-
          `2` is the fourth item, and `4` counts it from 1. Positions in Python start at 0.
      - id: two
        text: "`2`"
        explanation: >-
          `2` is the value you asked about. `.index` reports where that value is, not the value
          itself.
    correct: three
    followUps:
      zero:
        prompt: Which expression searches `digits` for the value 2?
        options:
          - id: index
            text: "`digits.index(2)`"
          - id: brackets
            text: "`digits[2]`"
          - id: count
            text: "`digits.count(2)`"
        correct: index
        explanation: >-
          `.index(x)` looks for a value and returns its position. Brackets do the reverse: they take
          a position and return the value stored there. `.count(x)` says how many times `x` appears.
      four:
        prompt: In `[3, 4, 0, 2, 1]`, what position does the first item have?
        options:
          - id: zero
            text: Position 0
          - id: one
            text: Position 1
          - id: value
            text: It depends on the value stored there
        correct: zero
        explanation: >-
          Every Python list starts at position 0, whatever it holds, so the fourth item is at
          position 3.
      two:
        prompt: What does `seq.index(x)` return?
        options:
          - id: where
            text: Where the first `x` sits in `seq`
          - id: itself
            text: "`x` itself, if it is in `seq`"
          - id: how-many
            text: How many times `x` appears in `seq`
        correct: where
        explanation: >-
          `.index` scans from the front and returns the position of the first match, or raises
          `ValueError` if there is none. Counting matches is `.count(x)`.

  - id: value-at-index-review
    tags: [python]
    prompt: "`ids = [1, 3, 4, 2, 0]`. What is `ids[3]`?"
    options:
      - id: two
        text: "`2`"
        explanation: >-
          Counting from 0, slot 3 is the fourth slot, and it holds `2`. The `3` picks the slot, and
          the answer is what is stored in it.
      - id: four
        text: "`4`"
        explanation: >-
          `4` is the third item. That is what you get by treating 3 as a count from 1.
      - id: one
        text: "`1`"
        explanation: >-
          `1` is the position of the value `3`. Brackets do not search for a value.
      - id: three
        text: "`3`"
        explanation: >-
          `3` is the position you asked about. Reading a slot returns what it holds, not its number.
    correct: two
    followUps:
      four:
        prompt: "`ids = [1, 3, 4, 2, 0]`. Which expression gives the first item, `1`?"
        options:
          - id: zero
            text: "`ids[0]`"
          - id: one
            text: "`ids[1]`"
          - id: last
            text: "`ids[-1]`"
        correct: zero
        explanation: >-
          The first item is at position 0, so `ids[3]` is the fourth item, not the third. `ids[-1]`
          is the last item.
      one:
        prompt: Which expression searches `ids` for the value 3 and gives its position?
        options:
          - id: index
            text: "`ids.index(3)`"
          - id: brackets
            text: "`ids[3]`"
          - id: count
            text: "`ids.count(3)`"
        correct: index
        explanation: >-
          `.index(x)` goes from a value to its position. Brackets go from a position to its value,
          and `.count(x)` counts matches.
      three:
        prompt: "`ids = [1, 3, 4, 2, 0]`. What is `ids[0]`?"
        options:
          - id: one
            text: "`1`"
          - id: zero
            text: "`0`"
          - id: four
            text: "`4`"
        correct: one
        explanation: >-
          Slot 0 holds `1`. The number in the brackets only comes back as the answer when the slot
          happens to hold it. `4` is where the value `0` sits.

  - id: last-position-review
    heading: Which values does this print?
    tags: [python]
    prompt: |-
      ```python
      temps = [9, 7, 5, 3]
      for i in range(len(temps) - 1):
          print(temps[i])
      ```
    options:
      - id: skip-last
        text: "`9`, `7`, `5`"
        explanation: >-
          `len(temps) - 1` is 3, and `range(3)` stops before 3, so `i` never reaches the last
          position. That suits a loop that compares each item with the next one, and it is a bug
          in a loop meant to visit every item.
      - id: all
        text: "`9`, `7`, `5`, `3`"
        explanation: >-
          That would need `i` to reach 3. Check where `range(len(temps) - 1)` stops.
      - id: from-one
        text: "`7`, `5`, `3`"
        explanation: >-
          This starts one item late and ends on the last item. Check the first value of `i`.
    correct: skip-last
    followUps:
      all:
        prompt: What does `range(3)` produce?
        options:
          - id: below
            text: 0, 1 and 2
          - id: through
            text: 0, 1, 2 and 3
          - id: from-one
            text: 1, 2 and 3
        correct: below
        explanation: >-
          `range(stop)` starts at 0 and stops before `stop`. So `range(len(xs))` covers every
          position, and `range(len(xs) - 1)` leaves out the last one.
      from-one:
        prompt: What is the first value that `range(len(temps) - 1)` gives?
        options:
          - id: zero
            text: "`0`"
          - id: one
            text: "`1`"
          - id: minus-one
            text: "`-1`"
        correct: zero
        explanation: >-
          With one argument, `range` always starts at 0. To start at 1 you write `range(1, stop)`.

  - id: empty-input-review
    heading: Which call raises `IndexError`?
    tags: [python]
    prompt: |-
      ```python
      def ends(s):
          return s[0] + s[-1]
      ```

      Which call raises `IndexError`?
    options:
      - id: empty
        text: '`ends("")`'
        explanation: >-
          An empty string has no position 0 and no position -1, so the first read fails. Every
          other call here has at least one character.
      - id: one-char
        text: '`ends("a")`'
        explanation: >-
          A one-letter string has a first and a last character. Try both reads on `"a"`.
      - id: space
        text: '`ends(" ")`'
        explanation: >-
          A string that looks blank is not necessarily empty. Count its characters.
      - id: none
        text: None of them
        explanation: >-
          One of these calls has nothing at all to read at position 0.
    correct: empty
    followUps:
      one-char:
        prompt: '`s = "a"`. Which slot does `s[-1]` read?'
        options:
          - id: same
            text: Slot 0, the same one as `s[0]`
          - id: missing
            text: None, since one character has no separate last character
          - id: one
            text: Slot 1
        correct: same
        explanation: >-
          On a string of length 1, `-1` means position `1 - 1`, which is 0. First and last are the
          same character, so `ends("a")` returns `'aa'`.
      space:
        prompt: What is `len(" ")`?
        options:
          - id: one
            text: Length 1
          - id: zero
            text: Length 0
          - id: error
            text: It raises an error
        correct: one
        explanation: >-
          A space is a character, so the string has length 1 and `ends(" ")` returns two spaces.
          Only `""` has length 0.
      none:
        prompt: '`s = ""`. What does `s[0]` give?'
        options:
          - id: raises
            text: It raises `IndexError`
          - id: empty
            text: "`''`, an empty string"
          - id: none
            text: "`None`"
        correct: raises
        explanation: >-
          Reading one position never falls back to an empty string. Only slices do that. With no
          characters there is no position 0 to read.

  - id: substring-versus-subsequence-review
    heading: Which one fits?
    tags: [python]
    prompt: Which of these is a subsequence of `"pocket"` but **not** a substring?
    options:
      - id: pot
        text: '`"pot"`'
        explanation: >-
          `p`, `o` and `t` appear in that order, at positions 0, 1 and 5. The gap before the `t`
          means they are not all adjacent.
      - id: ock
        text: '`"ock"`'
        explanation: >-
          `"ock"` sits at positions 1 to 3 with no gaps, so it is a substring. The question asks for
          one that is not.
      - id: top
        text: '`"top"`'
        explanation: >-
          All three letters are in `"pocket"`, but check the order they appear in.
      - id: pop
        text: '`"pop"`'
        explanation: >-
          Count how many `p`s the pattern needs and how many the word has.
    correct: pot
    followUps:
      ock:
        prompt: Is every substring also a subsequence?
        options:
          - id: always
            text: Yes, always
          - id: never
            text: No, never
          - id: whole
            text: Only when it is the whole string
        correct: always
        explanation: >-
          A substring keeps its letters in order with no gaps, and a subsequence only needs the
          order. So every substring is a subsequence, but not the other way round.
      top:
        prompt: Is `"ko"` a subsequence of `"pocket"`?
        options:
          - id: order
            text: No, the `o` comes before the `k`
          - id: present
            text: Yes, both letters are in the word
          - id: close
            text: Yes, because the letters are close together
        correct: order
        explanation: >-
          A subsequence reads its letters left to right. After the `k` at position 3 there is no
          `o`, so the pattern cannot finish.
      pop:
        prompt: Can a subsequence of `"pocket"` use its single `p` twice?
        options:
          - id: once
            text: No, each position is used at most once
          - id: order
            text: Yes, if the order is kept
          - id: start
            text: Yes, if the letter is at the start
        correct: once
        explanation: >-
          A subsequence comes from deleting letters, never repeating them. A pattern needs as many
          copies of a letter as it uses.

  - id: subsequence-scan-review
    heading: What does this scan return?
    tags: [two-pointers]
    prompt: |-
      What does this print?

      ```python
      def is_subseq(p, s):
          i = 0
          for ch in s:
              if i < len(p) and p[i] == ch:
                  i += 1
          return i == len(p)

      print(is_subseq("rat", "treaty"))
      ```
    options:
      - id: matches
        text: "`True`"
        explanation: >-
          `i` waits for `r` and skips the first `t`. It matches `r` at 1, skips `e`, matches `a` at
          3 and `t` at 4. Then `i` is 3, the length of `"rat"`, and the `y` is never compared.
      - id: not-adjacent
        text: '`False`, because the letters of `"rat"` are not next to each other'
        explanation: >-
          Adjacency is what a substring needs. Look at what the loop compares: it never checks that
          two matches are neighbours.
      - id: first-t
        text: "`False`, because the first `t` comes before the `r`"
        explanation: >-
          The first `t` is not used. Trace what `i` is when the loop reaches that first `t`.
      - id: index-error
        text: Raises `IndexError` when it reaches the `y`
        explanation: >-
          `p[3]` would be out of range, but look at what is checked before `p[i]` is read.
    correct: matches
    followUps:
      not-adjacent:
        prompt: Which test does `is_subseq` perform?
        options:
          - id: in-order
            text: Whether the letters of `p` appear in `s` in order, gaps allowed
          - id: block
            text: Whether `p` appears in `s` as one unbroken block
          - id: anywhere
            text: Whether every letter of `p` appears somewhere in `s`
        correct: in-order
        explanation: >-
          `i` moves forward only when the next letter of `p` turns up, and every other letter of `s`
          is skipped. That is the definition of a subsequence. A substring test is `p in s`.
      first-t:
        prompt: When the loop reads the first `t` of `"treaty"`, `i` is 0. What happens?
        options:
          - id: skipped
            text: Nothing, because `p[0]` is `r`, so this `t` is skipped
          - id: fails
            text: The scan fails, since a `t` arrived out of order
          - id: jumps
            text: "`i` jumps to the `t` in `\"rat\"`"
        correct: skipped
        explanation: >-
          The loop compares each letter only with the one it is waiting for. Letters that do not
          match are passed over, and a later `t` is matched once `i` gets to it.
      index-error:
        prompt: When the loop reaches `y`, `i` is already 3. Is `p[i]` read?
        options:
          - id: short-circuit
            text: No, `i < len(p)` is false, so `and` skips `p[i]`
          - id: raises
            text: Yes, and it raises `IndexError`
          - id: wraps
            text: Yes, and it reads `p[-1]`
        correct: short-circuit
        explanation: >-
          `and` evaluates its right side only when the left side is true. The length check guards
          the read, which is why it comes first.

  - id: first-repeat-review
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      word = "referee"
      for i in range(len(word)):
          if word[i] == "e":
              break
      print(i)
      ```
    options:
      - id: first
        text: "`1`"
        explanation: >-
          `e` appears four times in `"referee"`, but `break` leaves the loop at the first one. `i`
          keeps the value it had at that moment.
      - id: last
        text: "`6`"
        explanation: >-
          `6` is the last `e`. A loop that kept going would end there, so check what happens at the
          first match.
      - id: one-based
        text: "`2`"
        explanation: >-
          The first `e` is the second character, and `2` counts it from 1.
    correct: first
    followUps:
      last:
        prompt: What does `break` do?
        options:
          - id: leave
            text: Leaves the loop at once, and `i` keeps its current value
          - id: next-pass
            text: Skips to the next pass of the loop
          - id: end-if
            text: Ends the `if` block, and the loop keeps going
        correct: leave
        explanation: >-
          `break` ends the whole loop. Skipping to the next pass is `continue`. After the loop, `i`
          still holds the position where it stopped.
      one-based:
        prompt: In `"referee"`, what position does the `r` at the front have?
        options:
          - id: zero
            text: Position 0
          - id: one
            text: Position 1
        correct: zero
        explanation: >-
          Positions start at 0, so the first character is at 0 and the second, the first `e`, is
          at 1.

  - id: adjacent-repeat-review
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      def first_double(s):
          for i in range(1, len(s)):
              if s[i] == s[i - 1]:
                  return i
          return -1

      print(first_double("balloon"))
      ```
    options:
      - id: second-of-pair
        text: "`3`"
        explanation: >-
          The scan compares each letter with the one before it. The first equal neighbours are the
          two `l`s, found when `i` points at the second `l`, and the function returns that `i` right
          away.
      - id: first-of-pair
        text: "`2`"
        explanation: >-
          `2` is where the pair starts, but the function returns `i`. Check which letter of the
          pair `i` points at.
      - id: one-based
        text: "`4`"
        explanation: >-
          The second `l` is the fourth letter, and `4` counts it from 1.
      - id: later-pair
        text: "`5`"
        explanation: >-
          `5` is where the `oo` pair ends. Check whether the function gets that far.
    correct: second-of-pair
    followUps:
      first-of-pair:
        prompt: When `i` is 3, which two positions does `s[i] == s[i - 1]` compare?
        options:
          - id: back
            text: 3 and 2
          - id: ahead
            text: 3 and 4
          - id: both-back
            text: 2 and 1
        correct: back
        explanation: >-
          `s[i - 1]` is the letter just before `i`. A match is found when `i` reaches the second
          letter of a pair, and that `i` is what comes back.
      one-based:
        prompt: Which positions of `"balloon"` hold an `l`?
        options:
          - id: zero-based
            text: 2 and 3
          - id: shifted
            text: 3 and 4
          - id: one
            text: 2 only
        correct: zero-based
        explanation: >-
          Counting from 0, b-a-l-l-o-o-n puts the two `l`s at 2 and 3. The function returns 3, the
          second of the pair.
      later-pair:
        prompt: What does `return` inside the loop do once the first pair is found?
        options:
          - id: ends
            text: Ends the function, so later pairs are never checked
          - id: saves
            text: Saves `i` and lets the loop continue
          - id: pass
            text: Ends only the current pass of the loop
        correct: ends
        explanation: >-
          `return` leaves the function immediately, loop and all. A scan for the first match can
          stop there, and a scan for the last one has to keep a variable instead.

  - id: alias-or-copy-review
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      row = [4, 4, 4]
      same = row
      saved = row[:]
      same[2] = 1
      print(row, saved)
      ```
    options:
      - id: aliased
        text: "`[4, 4, 1] [4, 4, 4]`"
        explanation: >-
          `same = row` adds a second name for one list, so the write shows up in `row`. `row[:]`
          copied the three values before the write, so `saved` is untouched.
      - id: no-alias
        text: "`[4, 4, 4] [4, 4, 4]`"
        explanation: >-
          That would be right if `same` were a copy. Compare how `same` and `saved` were made.
      - id: slice-shared
        text: "`[4, 4, 1] [4, 4, 1]`"
        explanation: >-
          That treats `saved` like `same`. Check what a slice builds.
      - id: one-based
        text: "`[4, 1, 4] [4, 4, 4]`"
        explanation: >-
          Count positions from 0 to find which slot `same[2]` names.
    correct: aliased
    followUps:
      no-alias:
        prompt: After `same = row`, how many lists are there?
        options:
          - id: one
            text: One, with two names
          - id: two
            text: Two, each with its own items
          - id: until
            text: Two, until one of them changes
        correct: one
        explanation: >-
          Assigning a list to a new name copies nothing. Both names point at the same list, so a
          write through either name is seen through the other.
      slice-shared:
        prompt: What is `row[:]`?
        options:
          - id: new-list
            text: A new list with the same items
          - id: name
            text: Another name for `row`
          - id: view
            text: A read-only view of `row`
        correct: new-list
        explanation: >-
          A full slice copies every item into a new list. Later writes to `row` do not reach it.
      one-based:
        prompt: Which slot of `[4, 4, 4]` does `same[2] = 1` replace?
        options:
          - id: third
            text: The third, which is the last one
          - id: second
            text: The second
          - id: every
            text: Every slot holding a 4
        correct: third
        explanation: >-
          Position 2 is the third slot when counting from 0. Item assignment replaces exactly one
          slot, and equal values elsewhere do not change which slot an index names.

  - id: negative-write-review
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      xs = [2, 4, 6]
      ys = xs
      ys[-1] = 0
      print(xs)
      ```
    options:
      - id: shared
        text: "`[2, 4, 0]`"
        explanation: >-
          `ys` and `xs` name the same list, and `ys[-1]` is its last slot. The write replaces the
          `6`, and `xs` sees it.
      - id: copy
        text: "`[2, 4, 6]`"
        explanation: >-
          That would be right if the second line had copied the list. Think about how many lists
          exist.
      - id: append
        text: "`[2, 4, 6, 0]`"
        explanation: >-
          Writing to `-1` does not add a slot. Compare the length before and after.
    correct: shared
    followUps:
      copy:
        prompt: Which line makes a separate copy of `xs`?
        options:
          - id: slice
            text: "`ys = xs[:]`"
          - id: assign
            text: "`ys = xs`"
          - id: both
            text: Both of them
        correct: slice
        explanation: >-
          Plain assignment adds a name for the existing list. A slice, `list(xs)` or `xs.copy()`
          builds a new one.
      append:
        prompt: "`ys = [2, 4, 6]`. Which slot does `ys[-1]` name?"
        options:
          - id: last
            text: The last one, which holds `6`
          - id: after
            text: A new slot after the end
          - id: before
            text: The slot before the first
        correct: last
        explanation: >-
          Negative positions count back from the end, and `-1` is the last item. Writing there
          replaces it. Adding to the end takes `append`.

  - id: string-copy-review
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      s = "dime"
      chars = list(s)
      chars[-1] = "s"
      print(s, "".join(chars))
      ```
    options:
      - id: copy
        text: "`dime dims`"
        explanation: >-
          `list(s)` copies the four letters into a new list, and its last slot becomes `"s"`. The
          string itself never changes.
      - id: shared
        text: "`dims dims`"
        explanation: >-
          That would need `chars` and `s` to be one object. One is a list and the other is a string.
      - id: type-error
        text: Raises `TypeError`
        explanation: >-
          Writing into a string fails, but check what `chars` is.
    correct: copy
    followUps:
      shared:
        prompt: After `chars = list(s)`, what does a write to `chars` do to `s`?
        options:
          - id: nothing
            text: Nothing, since `chars` is a separate list
          - id: both
            text: Changes `s` too
          - id: after-join
            text: Changes `s` once `join` runs
        correct: nothing
        explanation: >-
          `list(s)` copies the characters into a new list. A string can never be changed, so no
          write can reach it.
      type-error:
        prompt: Can one slot of a list of characters be replaced?
        options:
          - id: mutable
            text: Yes, it is an ordinary list
          - id: immutable
            text: No, characters taken from a string stay immutable
          - id: first
            text: Only the first slot
        correct: mutable
        explanation: >-
          Each character is a one-letter string, and the list holding them is mutable. Replacing a
          slot changes which string the list holds. No string is edited.

  - id: string-method-review
    heading: What does this print?
    tags: [python]
    prompt: |-
      ```python
      word = "pool"
      word.replace("o", "e")
      print(word)
      ```
    options:
      - id: unchanged
        text: "`pool`"
        explanation: >-
          `replace` builds and returns a new string, `"peel"`, and this code throws that result
          away. `word` still names the original.
      - id: in-place
        text: "`peel`"
        explanation: >-
          `peel` is the value `replace` produces. Check where that value goes.
      - id: type-error
        text: Raises `TypeError`
        explanation: >-
          Strings are immutable, but that does not stop their methods from running. Check what
          `replace` hands back.
    correct: unchanged
    followUps:
      in-place:
        prompt: What does `word.replace("o", "e")` do to `word`?
        options:
          - id: new
            text: Nothing, it returns a new string instead
          - id: edits
            text: Changes `word` in place
          - id: first
            text: Changes only the first `o` in place
        correct: new
        explanation: >-
          String methods never edit a string. To keep the result, write
          `word = word.replace("o", "e")`.
      type-error:
        prompt: '`word = "pool"`. Which line raises `TypeError`?'
        options:
          - id: assign
            text: '`word[1] = "e"`'
          - id: replace
            text: '`word.replace("o", "e")`'
          - id: both
            text: Both of them
        correct: assign
        explanation: >-
          Item assignment tries to edit the string, and that fails. `replace` never edits: it
          builds a new string, so it is allowed.
