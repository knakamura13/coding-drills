id: arrays-and-strings-review
title: "Arrays and strings: review"
description: Fresh inputs for the Arrays and strings skills, for recall on later days. No worked examples this time.
heading: What does this give?

questions:
  - format: tap-cell
    id: negative-index-review
    heading: Which cell does it read?
    tags: [arrays-strings]
    prompt: Tap the cell `temps[-3]` reads.
    code: |
      temps = [3, 8, 1, 6, 2]
      print(temps[-3])
    sequence:
      kind: array
      name: temps
      cells: [3, 8, 1, 6, 2]
    correct: 2
    explanation: >-
      `-1` is the last cell, index 4, so `-3` is two steps further back, index 2. `temps[-3]` reads
      the same cell as `temps[5 - 3]`, which holds `1`.
    misses:
      - index: 4
        explanation: This is `temps[-1]`, the last cell. `-3` counts two more steps back.
      - index: 3
        explanation: This is `temps[-2]`, one step back from the last cell. `-3` is one step further.
      - index: 1
        explanation: >-
          This is `temps[-4]`. Counting back from the end, `-1` is the last cell, so `-3` is the
          third cell from the end.
      - index: 0
        explanation: >-
          Index 0 is the first cell, which is `temps[-5]`. `-3` counts back from the end, two cells
          short of the front.

  - format: tap-cell
    id: value-at-index-review
    heading: Which cell does it read?
    tags: [arrays-strings]
    prompt: Tap the cell `ids[3]` reads.
    code: |
      ids = [1, 3, 4, 2, 0]
      print(ids[3])
    sequence:
      kind: array
      name: ids
      cells: [1, 3, 4, 2, 0]
    correct: 3
    explanation: >-
      Counting from 0, index 3 is the fourth cell, and it holds `2`. The `3` picks the cell, and
      the answer is what is stored in it.
    misses:
      - index: 1
        explanation: >-
          This cell holds the value `3`. The brackets read the cell at index 3; they do not search
          for a value.
      - index: 2
        explanation: This is the third cell, counted from 1. Indices count from 0, so index 3 is the fourth.
      - index: 0
        explanation: Index 0 is the first cell. `ids[3]` reads three cells further along.
      - index: 4
        explanation: This is the last cell, index 4. `ids[3]` reads the cell just before it.

  - format: tap-cell
    id: middle-index-review
    heading: Which cell does it read?
    tags: [arrays-strings]
    prompt: Tap the cell `word[len(word) // 2]` reads.
    code: |
      word = "garden"
      print(word[len(word) // 2])
    sequence:
      kind: string
      name: word
      cells: [g, a, r, d, e, n]
    correct: 3
    explanation: >-
      `len(word)` is 6, and `6 // 2` is exactly 3. With an even length there are two middle cells,
      indices 2 and 3, and `len(word) // 2` names the right one, the `d`.
    misses:
      - index: 2
        explanation: >-
          Index 2 is the left of the two middle cells. `6 // 2` is exactly 3, so nothing rounds
          down to 2.
      - index: 4
        explanation: Index 4 is one past the middle. `6 // 2` is 3.
      - index: 5
        explanation: This is the last cell, index `len(word) - 1`. Halving the length lands in the middle.
      - index: 0
        explanation: Index 0 is the first cell. `len(word) // 2` is 3, halfway along.
      - index: 1
        explanation: Index 1 is the second cell. `len(word) // 2` is 3.

  - id: last-position-review
    heading: Which values does this print?
    tags: [arrays-strings]
    prompt: |-
      ```python
      temps = [9, 7, 5, 3]
      for i in range(len(temps) - 1):
          print(temps[i])
      ```
    options:
      - id: skip-last
        text: "`9`, `7`, `5`"
        explanation: >-
          `len(temps) - 1` is 3, and `range(3)` stops before 3, so `i` never reaches the last
          index. That suits a loop that compares each item with the next one, and it is a bug in a
          loop meant to visit every item.
      - id: all
        text: "`9`, `7`, `5`, `3`"
        explanation: >-
          That would need `i` to reach 3. Check where `range(len(temps) - 1)` stops.
      - id: from-one
        text: "`7`, `5`, `3`"
        explanation: >-
          This starts one item late and ends on the last item. Check the first value of `i`.
    correct: skip-last
    followUps:
      all:
        prompt: What does `range(3)` produce?
        options:
          - id: below
            text: 0, 1 and 2
          - id: through
            text: 0, 1, 2 and 3
          - id: from-one
            text: 1, 2 and 3
        correct: below
        explanation: >-
          `range(stop)` starts at 0 and stops before `stop`. So `range(len(xs))` covers every
          index, and `range(len(xs) - 1)` leaves out the last one.
      from-one:
        prompt: What is the first value that `range(len(temps) - 1)` gives?
        options:
          - id: zero
            text: "`0`"
          - id: one
            text: "`1`"
          - id: minus-one
            text: "`-1`"
        correct: zero
        explanation: >-
          With one argument, `range` always starts at 0. To start at 1 you write `range(1, stop)`.

  - id: empty-input-review
    heading: Which call raises `IndexError`?
    tags: [arrays-strings]
    prompt: |-
      ```python
      def ends(s):
          return s[0] + s[-1]
      ```

      Which call raises `IndexError`?
    options:
      - id: empty
        text: '`ends("")`'
        explanation: >-
          An empty string has no index 0 and no index -1, so the first read fails. Every other
          call here has at least one character.
      - id: one-char
        text: '`ends("a")`'
        explanation: >-
          A one-letter string has a first and a last character. Try both reads on `"a"`.
      - id: space
        text: '`ends(" ")`'
        explanation: >-
          A string that looks blank is not necessarily empty. Count its characters.
      - id: none
        text: None of them
        explanation: >-
          One of these calls has nothing at all to read at index 0.
    correct: empty
    followUps:
      one-char:
        prompt: '`s = "a"`. Which cell does `s[-1]` read?'
        options:
          - id: same
            text: Index 0, the same cell as `s[0]`
          - id: missing
            text: None, since one character has no separate last character
          - id: one
            text: Index 1
        correct: same
        explanation: >-
          On a string of length 1, `-1` means index `1 - 1`, which is 0. First and last are the
          same character, so `ends("a")` returns `'aa'`.
      space:
        prompt: What is `len(" ")`?
        options:
          - id: one
            text: Length 1
          - id: zero
            text: Length 0
          - id: error
            text: It raises an error
        correct: one
        explanation: >-
          A space is a character, so the string has length 1 and `ends(" ")` returns two spaces.
          Only `""` has length 0.
      none:
        prompt: '`s = ""`. What does `s[0]` give?'
        options:
          - id: raises
            text: It raises `IndexError`
          - id: empty
            text: "`''`, an empty string"
          - id: none
            text: "`None`"
        correct: raises
        explanation: >-
          Reading one index never falls back to an empty string. Only slices do that. With no
          characters there is no index 0 to read.

  - id: first-repeat-review
    heading: What does this print?
    tags: [arrays-strings]
    prompt: |-
      ```python
      word = "referee"
      for i in range(len(word)):
          if word[i] == "e":
              break
      print(i)
      ```
    options:
      - id: first
        text: "`1`"
        explanation: >-
          `e` appears four times in `"referee"`, but `break` leaves the loop at the first one. `i`
          keeps the value it had at that moment.
      - id: last
        text: "`6`"
        explanation: >-
          `6` is the last `e`. A loop that kept going would end there, so check what happens at the
          first match.
      - id: one-based
        text: "`2`"
        explanation: >-
          The first `e` is the second character, and `2` counts it from 1.
    correct: first
    followUps:
      last:
        prompt: What does `break` do?
        options:
          - id: leave
            text: Leaves the loop at once, and `i` keeps its current value
          - id: next-pass
            text: Skips to the next pass of the loop
          - id: end-if
            text: Ends the `if` block, and the loop keeps going
        correct: leave
        explanation: >-
          `break` ends the whole loop. Skipping to the next pass is `continue`. After the loop, `i`
          still holds the index where it stopped.
      one-based:
        prompt: In `"referee"`, what index does the `r` at the front have?
        options:
          - id: zero
            text: Index 0
          - id: one
            text: Index 1
        correct: zero
        explanation: >-
          Indices start at 0, so the first character is at 0 and the second, the first `e`, is at
          1.

  - id: adjacent-repeat-review
    heading: What does this print?
    tags: [arrays-strings]
    prompt: |-
      ```python
      def count_doubles(s):
          n = 0
          for i in range(1, len(s)):
              if s[i] == s[i - 1]:
                  n += 1
          return n

      print(count_doubles("mississippi"))
      ```
    options:
      - id: every-pair
        text: "`3`"
        explanation: >-
          The scan compares each letter with the one before it. It finds `ss` at indices 2 and 3,
          `ss` again at 5 and 6, and `pp` at 8 and 9, and each match adds 1.
      - id: kinds
        text: "`2`"
        explanation: >-
          `2` counts the kinds of doubled letter, `s` and `p`. The loop adds 1 for every pass where
          the test is true, so the second `ss` counts again.
      - id: letters
        text: "`6`"
        explanation: >-
          `6` counts both letters of every pair. Each pass compares one pair and adds 1 at most.
      - id: first-only
        text: "`1`"
        explanation: >-
          That treats the scan as stopping at the first pair. Nothing in the loop body ends it
          early.
    correct: every-pair
    followUps:
      kinds:
        prompt: The test is true when `i` is 3 and again when `i` is 6, both on an `s`. How much does `n` grow?
        options:
          - id: twice
            text: By 2, one for each true test
          - id: once
            text: By 1, since both pairs are `s`
          - id: none
            text: By 0, since `s` was already counted
        correct: twice
        explanation: >-
          `n += 1` runs on every pass where the test is true. The loop does not remember which
          letters it has seen, so two `ss` pairs add 2.
      letters:
        prompt: When `i` is 3, the test finds the pair at indices 2 and 3. How much does that pass add to `n`?
        options:
          - id: one
            text: 1, since `n += 1` runs once per pass
          - id: two
            text: 2, one for each letter of the pair
          - id: zero
            text: 0, until the pair is finished
        correct: one
        explanation: >-
          Each pass compares one pair, `s[i]` and `s[i - 1]`, and adds 1 when they match. A pair is
          counted once, on the pass where `i` names its second letter.
      first-only:
        prompt: Does `count_doubles` stop when it finds the first pair?
        options:
          - id: keeps-going
            text: No, the loop reads every index, and only `return n` after it ends the call
          - id: stops
            text: Yes, `n += 1` ends the loop
          - id: if-stops
            text: Yes, a true `if` ends the loop
        correct: keeps-going
        explanation: >-
          There is no `break` or `return` inside the loop, so it reads every index. Counting every
          match needs that, and returning at the first match needs a `return` in the loop.

  - id: swap-inward-review
    heading: What does this print?
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      nums = [5, 9, 2, 6, 4, 1]
      i, j = 0, len(nums) - 1
      while i < j:
          nums[i], nums[j] = nums[j], nums[i]
          i += 1
          j -= 1
      print(nums)
      ```
    options:
      - id: reversed
        text: "`[1, 4, 6, 2, 9, 5]`"
        explanation: >-
          The passes swap indices 0 and 5, then 1 and 4, then 2 and 3. After that `i` is 3 and
          `j` is 2, the test fails, and every pair has traded places.
      - id: two-passes
        text: "`[1, 4, 2, 6, 9, 5]`"
        explanation: >-
          That stops after two passes. Then `i` is 2 and `j` is 3, and `2 < 3` is still true, so
          the middle pair swaps too.
      - id: swapped-back
        text: "`[5, 9, 2, 6, 4, 1]`"
        explanation: >-
          That would need the swaps to run again once the pointers cross. The loop stops as soon
          as `i < j` is false.
      - id: copied
        text: "`[1, 4, 6, 6, 4, 1]`"
        explanation: >-
          That copies the right half over the left half, as `nums[i] = nums[j]` would. Line 4
          puts both cells to the left of `=`, so both are written and their values trade places.
    correct: reversed
    followUps:
      two-passes:
        prompt: After two passes, `i` is 2 and `j` is 3. What does `while i < j` do next?
        options:
          - id: runs
            text: Runs one more pass, since `2 < 3`
          - id: stops-neighbors
            text: Stops, since the pointers are next to each other
          - id: stops-half
            text: Stops, since two passes cover half the list
        correct: runs
        explanation: >-
          The loop checks `i < j` before every pass, and `2 < 3` is true. It stops only when `i`
          is no longer less than `j`.
      swapped-back:
        prompt: After the third pass, `i` is 3 and `j` is 2. What happens next?
        options:
          - id: stops
            text: The loop stops, since `3 < 2` is false
          - id: continues
            text: The loop keeps swapping until `i` reaches the end
          - id: error
            text: It raises an error, since `i` passed `j`
        correct: stops
        explanation: >-
          The test fails once the pointers cross, so no pair is swapped twice. Each pair trades
          places exactly once.
      copied:
        prompt: "`nums[i], nums[j] = nums[j], nums[i]` runs with `i` at 0 and `j` at 5. Which cells change?"
        options:
          - id: both
            text: Both, since each is on the left of `=`
          - id: left
            text: Only `nums[0]`
          - id: right
            text: Only `nums[5]`
        correct: both
        explanation: >-
          Python reads both values on the right first, then writes one into each cell on the left.
          So both cells change, and their values trade places.

  - id: string-copy-review
    heading: What does this print?
    tags: [arrays-strings]
    prompt: |-
      ```python
      s = "dime"
      chars = list(s)
      chars[-1] = "s"
      print(s, "".join(chars))
      ```
    options:
      - id: copy
        text: "`dime dims`"
        explanation: >-
          `list(s)` copies the four letters into a new list, and its last cell becomes `"s"`. The
          string itself never changes.
      - id: shared
        text: "`dims dims`"
        explanation: >-
          That would need `chars` and `s` to be one object. One is a list and the other is a string.
      - id: type-error
        text: Raises `TypeError`
        explanation: >-
          Writing into a string fails, but check what `chars` is.
    correct: copy
    followUps:
      shared:
        prompt: After `chars = list(s)`, what does a write to `chars` do to `s`?
        options:
          - id: nothing
            text: Nothing, since `chars` is a separate list
          - id: both
            text: Changes `s` too
          - id: after-join
            text: Changes `s` once `join` runs
        correct: nothing
        explanation: >-
          `list(s)` copies the characters into a new list. A string can never be changed, so no
          write can reach it.
      type-error:
        prompt: Can one cell of a list of characters be replaced?
        options:
          - id: mutable
            text: Yes, it is an ordinary list
          - id: immutable
            text: No, characters taken from a string stay unchangeable
          - id: first
            text: Only the first cell
        correct: mutable
        explanation: >-
          Each character is a one-letter string, and the list holding them can change. Replacing a
          cell changes which string the list holds. No string is edited.

  - id: string-method-review
    heading: What does this print?
    tags: [arrays-strings]
    prompt: |-
      ```python
      word = "pool"
      word.replace("o", "e")
      print(word)
      ```
    options:
      - id: unchanged
        text: "`pool`"
        explanation: >-
          `replace` builds and returns a new string, `"peel"`, and this code throws that result
          away. `word` still names the original.
      - id: in-place
        text: "`peel`"
        explanation: >-
          `peel` is the value `replace` produces. Check where that value goes.
      - id: type-error
        text: Raises `TypeError`
        explanation: >-
          Strings can't be changed, but that does not stop their methods from running. Check what
          `replace` hands back.
    correct: unchanged
    followUps:
      in-place:
        prompt: What does `word.replace("o", "e")` do to `word`?
        options:
          - id: new
            text: Nothing, it returns a new string instead
          - id: edits
            text: Changes the string `word` names
          - id: first
            text: Changes only the first `o` of `word`
        correct: new
        explanation: >-
          String methods never edit a string. To keep the result, write
          `word = word.replace("o", "e")`.
      type-error:
        prompt: '`word = "pool"`. Which line raises `TypeError`?'
        options:
          - id: assign
            text: '`word[1] = "e"`'
          - id: replace
            text: '`word.replace("o", "e")`'
          - id: both
            text: Both of them
        correct: assign
        explanation: >-
          Writing one character tries to edit the string, and that fails. `replace` never edits:
          it builds a new string, so it is allowed.

  - id: slice-letters-review
    heading: What does this give?
    tags: [arrays-strings]
    prompt: "`code = \"lantern\"`. What is `code[1:4]`?"
    options:
      - id: stop-excluded
        text: '`"ant"`'
        explanation: >-
          The slice starts at index 1, the `a`, and stops before index 4. So it copies indices 1,
          2 and 3, which hold `a`, `n` and `t`.
      - id: stop-included
        text: '`"ante"`'
        explanation: >-
          That copies index 4 as well. The stop index is left out of a slice.
      - id: one-based
        text: '`"lan"`'
        explanation: >-
          That starts at the first letter, counting index 1 from 1. Indices count from 0, so index
          1 is the `a`.
      - id: no-stop
        text: '`"antern"`'
        explanation: >-
          That runs to the end, which is what `code[1:]` does. Here the stop, 4, ends the slice.
    correct: stop-excluded
    followUps:
      stop-included:
        prompt: In `code[1:4]`, is the character at index 4 copied?
        options:
          - id: no
            text: No, a slice stops just before its stop index
          - id: yes
            text: Yes, both ends are included
          - id: depends
            text: Only when the slice is of a string
        correct: no
        explanation: >-
          A slice copies from the start index up to, but not including, the stop. So
          `code[1:4]` holds `4 - 1 = 3` characters.
      one-based:
        prompt: 'In `code = "lantern"`, which index holds the `l` at the front?'
        options:
          - id: zero
            text: Index 0
          - id: one
            text: Index 1
          - id: minus-one
            text: Index -1
        correct: zero
        explanation: >-
          Indices count from 0, so the `l` is at 0 and the `a` is at 1. A slice's start is an
          index like any other, so `code[1:4]` starts at the `a`.
      no-stop:
        prompt: What does the `4` in `code[1:4]` set?
        options:
          - id: stop
            text: The index the slice stops before
          - id: count
            text: How many characters to skip at the end
          - id: nothing
            text: Nothing; a slice always runs to the end
        correct: stop
        explanation: >-
          The second number is the stop. Leaving it out runs the slice to the end, and giving it
          ends the slice just before that index.

  - id: slice-negative-start-review
    heading: What does this give?
    tags: [arrays-strings]
    prompt: "`word = \"harbor\"`. What is `word[-3:]`?"
    options:
      - id: last-three
        text: '`"bor"`'
        explanation: >-
          `-3` names index `6 - 3 = 3`, the `b`, and leaving out the stop runs the slice to the end.
          So it copies the last three characters.
      - id: one-extra
        text: '`"rbor"`'
        explanation: >-
          That starts at index 2, which is `word[-4]`. `-1` is the last character, so `-3` is the
          third from the end.
      - id: front
        text: '`"har"`'
        explanation: >-
          Those are the first three characters, `word[:3]`. A negative start counts back from the
          end.
      - id: stops-early
        text: '`"bo"`'
        explanation: >-
          That stops before the last character, as `word[-3:-1]` would. With no stop given, the
          slice runs to the end.
    correct: last-three
    followUps:
      one-extra:
        prompt: '`word = "harbor"`. Which index does `-3` name?'
        options:
          - id: three
            text: Index 3, the `b`
          - id: two
            text: Index 2, the `r`
          - id: four
            text: Index 4, the `o`
        correct: three
        explanation: >-
          `-1` is the last index, 5, so `-3` is two steps further back: index `6 - 3 = 3`. The
          slice starts at the `b`.
      front:
        prompt: Where does a slice with a negative start begin?
        options:
          - id: from-end
            text: That many cells back from the end
          - id: from-front
            text: That many cells in from the front
          - id: at-zero
            text: Always at index 0
        correct: from-end
        explanation: >-
          A negative index counts back from the end in a slice, the same as when it reads one
          cell. `word[-3:]` starts three cells from the end.
      stops-early:
        prompt: Where does `word[-3:]` stop?
        options:
          - id: end
            text: At the end, since the stop is left out
          - id: before-last
            text: Just before the last character
          - id: at-start
            text: At index 3
        correct: end
        explanation: >-
          Leaving out the stop runs the slice to the end, so the last character is included.
          `word[-3:-1]` would stop before it.
