id: tree-answers-checkpoint
title: 'Tree answers: checkpoint'
description: Compare trees, pass values down and pass search results up on fresh trees, and find where a suggested solution goes wrong.
heading: Answer from the subtrees

questions:
  - id: tree-answers-exam-subtree
    heading: Which line completes it?
    tags: [tree, recursion]
    prompt: |-
      `sub` occurs in `root` when some node of `root`, together with every node below it, has the
      same shape and values as `sub`. `contains` should check that, using `same`, which returns
      `True` when two trees have the same shape and values. `sub` is not empty.

      ```python
      def contains(node, sub):
          if node is None:
              return False
          # ??? one line here
      ```

      ```text
            8
           / \
          3   5
         / \   \
        6   1   3
               /
              6
      ```

      In this tree `TreeNode(3, TreeNode(6))` occurs, at the 3 below 5, and `TreeNode(3, TreeNode(1))`
      does not. Which line completes `contains`?
    options:
      - id: whole-search
        text: "`return same(node, sub) or contains(node.left, sub) or contains(node.right, sub)`"
        explanation: >-
          Each call checks whether `sub` starts at its own node, then hands the same question to both
          children. So every node gets a turn, and `TreeNode(3, TreeNode(6))` is found at the 3 below
          5.
      - id: root-only
        text: "`return same(node, sub)`"
        explanation: >-
          That checks only the node it is first called on, the root 8. It returns `False` for
          `TreeNode(3, TreeNode(6))`, which sits two levels down.
      - id: values-only
        text: "`return node.val == sub.val or contains(node.left, sub) or contains(node.right, sub)`"
        explanation: >-
          That matches one value, not a whole subtree. For `TreeNode(3, TreeNode(1))` it returns
          `True` as soon as it reaches a 3, though neither 3 has only the left child 1.
      - id: children-only
        text: "`return same(node.left, sub) or same(node.right, sub)`"
        explanation: >-
          That compares `sub` with the root's two children and stops. The 3 below 5 is two levels
          down, so `TreeNode(3, TreeNode(6))` is missed.
    correct: whole-search
    followUps:
      root-only:
        prompt: Where in `root` can `sub` start?
        options:
          - { id: any-node, text: "At any node, so every node needs a `same` check" }
          - { id: root-node, text: "Only at the root, since `sub` must cover the whole tree" }
          - { id: leaf-node, text: "Only at a leaf" }
        correct: any-node
        explanation: >-
          A subtree is a node together with everything below it, and that node can be anywhere. The
          search has to reach each node and run `same` there.
      values-only:
        prompt: The left 3 has children 6 and 1. Does `TreeNode(3, TreeNode(1))` start there?
        options:
          - { id: shape-differs, text: "No. Its left child is 6, not 1, and it has a right child" }
          - { id: value-matches, text: "Yes. The values 3 and 1 both appear" }
          - { id: half, text: "Partly, which counts as a match" }
        correct: shape-differs
        explanation: >-
          Matching the top value is not enough. `same` checks every node's value and every link, so
          the shape below the 3 has to match too.
      children-only:
        prompt: How far down does this version look for `sub`?
        options:
          - { id: one-level, text: "One level, at the root's two children" }
          - { id: every-level, text: "Every level, since `same` is recursive" }
          - { id: no-levels, text: "Nowhere below the root" }
        correct: one-level
        explanation: >-
          `same` recurses, but only to compare two trees node by node from where it starts. The
          search for a starting node has to recurse too, through `contains`.

  - id: tree-answers-exam-mirror-copy
    heading: Which tree passes?
    tags: [tree, recursion]
    prompt: |-
      `a` and `b` are two separate copies of the same tree. `invert(b)` mirrors `b` left to right,
      swapping every node's children, and returns it. `same` returns `True` when two trees have the
      same shape and values.

      ```python
      result = same(a, invert(b))
      ```

      For which tree is `result` `True`?
    options:
      - id: mirrored
        text: '`TreeNode(5, TreeNode(6, None, TreeNode(8)), TreeNode(6, TreeNode(8), None))`'
        explanation: >-
          Inverting this tree gives the same tree back: the two 6s trade places, and each one's 8
          crosses from inner to inner. So `a` and the inverted `b` match. A tree that equals its own
          mirror image is symmetric.
      - id: copied
        text: '`TreeNode(5, TreeNode(6, None, TreeNode(8)), TreeNode(6, None, TreeNode(8)))`'
        explanation: >-
          The two sides are copies, not mirror images. Inverting moves each 8 to a left child, so
          under the first 6 `same` meets `None` against 8 and returns `False`.
      - id: values-differ
        text: '`TreeNode(5, TreeNode(6, TreeNode(8)), TreeNode(7, None, TreeNode(8)))`'
        explanation: >-
          The shape is its own mirror image, but the values are not: inverting puts 7 on the left,
          where `a` has 6.
      - id: chain
        text: '`TreeNode(5, TreeNode(6, TreeNode(8)))`'
        explanation: >-
          Inverting moves the whole chain to the right side, so `same` meets 6 against `None` on the
          left and returns `False`.
    correct: mirrored
    followUps:
      copied:
        prompt: After `invert`, where is the 8 below the first 6?
        options:
          - { id: left-now, text: "It is the left child of that 6, where `a` has nothing" }
          - { id: right-still, text: "Still the right child, since only the root swaps" }
          - { id: gone, text: "Under the root, since the 6s were removed" }
        correct: left-now
        explanation: >-
          `invert` swaps the children of every node, not just the root. Two sides that are copies of
          each other become mirror images, which differ from the original.
      values-differ:
        prompt: After `invert`, which value is the root's left child?
        options:
          - { id: seven, text: "7, which was on the right" }
          - { id: six, text: "6, as in `a`" }
          - { id: eight, text: "8, from the bottom level" }
        correct: seven
        explanation: >-
          A mirror image has to match values as well as shape. The root's children trade places, so
          7 meets the 6 in `a`.
      chain:
        prompt: After `invert`, which side of the root holds 6?
        options:
          - { id: right-side, text: "The right side, so `a` and the inverted copy differ" }
          - { id: left-side, text: "The left side, as before" }
          - { id: neither, text: "Neither, because a chain has no right side" }
        correct: right-side
        explanation: >-
          A chain that leans left becomes a chain that leans right. Only a tree that equals its own
          mirror image survives `invert` unchanged.

  - id: tree-answers-exam-path-numbers
    heading: What does it return?
    tags: [tree, dfs, recursion]
    prompt: |-
      Each root-to-leaf path spells a number, one digit per node with the root first: the path 4, 0,
      9 would spell 409. `total(root, 0)` adds up the numbers of every root-to-leaf path.

      ```python
      def total(node, num):
          if node is None:
              return 0
          num = num * 10 + node.val
          if node.left is None and node.right is None:
              return num
          return total(node.left, num) + total(node.right, num)
      ```

      ```text
            2
           / \
          7   5
         /   / \
        3   1   8
      ```

      What does `total(root, 0)` return?
    options:
      - id: right
        text: "`782`"
        explanation: >-
          The calls pass down 2, then 27 and 25. The leaves return 273, 251 and 258, and `273 + 251 +
          258` is 782.
      - id: every-node
        text: "`836`"
        explanation: >-
          That also adds the numbers at 2, 7 and 5: `2 + 27 + 273 + 25 + 251 + 258`. Only a leaf
          returns its number; the other calls return the sum of their children's results.
      - id: empty-sides
        text: "`1591`"
        explanation: >-
          That adds a number at every empty side, so 7's empty right side adds 27 and each leaf's
          number counts twice. A `None` returns 0 here, and only a leaf returns `num`.
      - id: reversed
        text: "`1376`"
        explanation: >-
          That reads each path from the leaf up: 372, 152 and 852. `num * 10 + node.val` shifts the
          digits so far one place left and adds the new one at the end, so the root's digit leads.
    correct: right
    followUps:
      every-node:
        prompt: What does the call on 7 return?
        options:
          - { id: child-sum, text: "273, the sum of its children's results" }
          - { id: own-plus, text: "27 plus 273, its own number and its child's" }
          - { id: own, text: "27, its own number" }
        correct: child-sum
        explanation: >-
          7 is not a leaf, so its call skips the `return num` line and returns only what its
          children's calls add up to: 273 from the left, 0 from the empty right.
      empty-sides:
        prompt: What does the call on 7's empty right side return?
        options:
          - { id: zero, text: "0, from the first check" }
          - { id: twenty-seven, text: "27, the number passed to it" }
          - { id: two-seventy, text: "270, one more digit" }
        correct: zero
        explanation: >-
          `None` returns 0, so an empty side adds nothing. A number is added only at a leaf, which
          has both sides empty.
      reversed:
        prompt: The call on 7 gets `num = 2`. What `num` does it pass to 3?
        options:
          - { id: twenty-seven, text: "27, since `2 * 10 + 7` is 27" }
          - { id: seventy-two, text: "72, since 7 goes in front" }
          - { id: nine, text: "9, since `2 + 7` is 9" }
        correct: twenty-seven
        explanation: >-
          Multiplying by 10 moves the digits so far one place left, and the new digit fills the
          ones place. The root's digit ends up first.

  - id: tree-answers-exam-debug-good
    heading: Which tree gets a wrong count?
    tags: [tree, dfs, recursion]
    prompt: |-
      A node is good when no node on the path from the root down to it holds a larger value. A
      suggested solution should count the good nodes, starting with `count_good(root, root.val)`.

      ```python
      def count_good(node, high):
          if node is None:
              return 0
          count = 0
          if node.val >= high:
              count = 1
          high = max(high, node.val)
          return count + count_good(node.left, node.val) + count_good(node.right, node.val)
      ```

      On which tree does it return a wrong count?
    options:
      - id: dip
        text: '`TreeNode(6, TreeNode(2, TreeNode(4)), TreeNode(7))`'
        explanation: >-
          The calls pass down `node.val`, not `high`, so the call on 2 tells 4 that the largest value
          above it is 2. 4 is counted, though the root's 6 is above it. The code returns 3; the right
          count is 2, for 6 and 7.
      - id: ties
        text: '`TreeNode(3, TreeNode(3), TreeNode(5))`'
        explanation: >-
          Each child is compared with the root, which is also the largest value above it. All three
          nodes are good, and the code returns 3, which is right.
      - id: drop
        text: '`TreeNode(5, TreeNode(7, TreeNode(6)), TreeNode(8))`'
        explanation: >-
          6 is compared with its parent 7, which is also the largest value above it, so 6 is rightly
          not counted. The code returns 3, for 5, 7 and 8, which is right.
      - id: rise
        text: '`TreeNode(1, TreeNode(2, TreeNode(3)))`'
        explanation: >-
          Each node's parent is the largest value above it, so passing the parent's value does no
          harm. All three are good, and the code returns 3, which is right.
    correct: dip
    followUps:
      ties:
        prompt: When does passing `node.val` instead of `high` change a count?
        options:
          - { id: smaller-parent, text: "When a node's parent is smaller than some node higher up" }
          - { id: equal-values, text: "When two nodes hold the same value" }
          - { id: always, text: "On every tree with more than one node" }
        correct: smaller-parent
        explanation: >-
          `high` and the parent's value differ only below a node that is smaller than something above
          it. In `TreeNode(3, TreeNode(3), TreeNode(5))` every parent is the largest value above its
          children.
      drop:
        prompt: In `TreeNode(5, TreeNode(7, TreeNode(6)), TreeNode(8))`, what is the largest value above 6?
        options:
          - { id: seven, text: "7, its parent, so the parent's value gives the same test" }
          - { id: five, text: "5, the root" }
          - { id: eight, text: "8, the largest value in the tree" }
        correct: seven
        explanation: >-
          The path above 6 is 5, 7, and 7 is the larger. The bug matters only where a parent is not
          the largest value above its children.
      rise:
        prompt: In `TreeNode(1, TreeNode(2, TreeNode(3)))`, does any node have a parent smaller than a node above it?
        options:
          - { id: no-dip, text: "No. Values only rise on the way down, so each parent is the largest so far" }
          - { id: dip-at-two, text: "Yes. 2 is smaller than 3" }
          - { id: dip-at-one, text: "Yes. The root 1 is the smallest value" }
        correct: no-dip
        explanation: >-
          On a path that only rises, the parent's value and `high` are the same number, so the bug
          never shows.

  - id: tree-answers-exam-passed-up
    format: tap-cell
    heading: Which node comes back?
    tags: [tree, dfs, recursion]
    prompt: |-
      An ancestor of a node is any node on the path from the root down to it, the node itself
      included. `lca` returns the lowest common ancestor of two nodes, the lowest node that is an
      ancestor of both. `lca(root, 'E', 'H')` runs on the tree below. Tap the node that the call on B
      returns.

      ```text
              A
             /
            B
           / \
          C   D
         / \
        E   F
           / \
          G   H
      ```
    code: |
      def lca(node, p, q):
          if node is None:
              return None
          if node.val == p or node.val == q:
              return node
          left = lca(node.left, p, q)
          right = lca(node.right, p, q)
          if left is not None and right is not None:
              return node
          if left is not None:
              return left
          return right
    sequence:
      kind: array
      name: nodes
      cells: [A, B, C, D, E, F, G, H]
    correct: 2
    explanation: >-
      C's left call returns E and its right call on F passes up H, so C returns itself. B gets C from
      its left and `None` from D, so it passes C up rather than returning itself.
    misses:
      - index: 0
        explanation: A is above B. A call returns a node from its own subtree.
      - index: 1
        explanation: >-
          B returns itself only when both of its sides found something. D's side holds neither
          target, so B passes up the C from its left.
      - index: 3
        explanation: D is not a target and has nothing below it, so its call returns `None`.
      - index: 4
        explanation: E is a target and returns itself to C, but C also gets H from its other side.
      - index: 5
        explanation: F has only H below it, so it passes H up to C.
      - index: 6
        explanation: G is not a target, so its call returns `None`.
      - index: 7
        explanation: H comes up to C through F. C has a target on each side, so it returns itself.

  - id: tree-answers-exam-unvisited
    heading: Which node is never reached?
    tags: [tree, dfs, recursion]
    prompt: |-
      `lca(root, 'R', 'W')` runs on the tree below. Values are distinct and both targets are in the
      tree.

      ```python
      def lca(node, p, q):
          if node is None:
              return None
          if node.val == p or node.val == q:
              return node
          left = lca(node.left, p, q)
          right = lca(node.right, p, q)
          if left is not None and right is not None:
              return node
          if left is not None:
              return left
          return right
      ```

      ```text
              M
            /   \
           N     O
          / \     \
         Q   R     S
            / \
           V   W
      ```

      Which of these nodes does `lca` never start a call on?
    options:
      - id: w
        text: W
        explanation: >-
          The call on R returns R as soon as it sees a target, so nothing below R gets a call. W is
          never reached, and the answer R is still right, since R is an ancestor of W.
      - id: q
        text: Q
        explanation: >-
          N calls its left child Q before its right child R. Q is not a target, so its call runs and
          returns `None`.
      - id: s
        text: S
        explanation: >-
          M's left call returns R, but M still runs its right call. The search goes down through O to
          S, which returns `None`.
      - id: o
        text: O
        explanation: >-
          The line that calls `lca(node.right, p, q)` runs in M whatever its left call found, so O
          gets a call and returns `None`.
    correct: w
    followUps:
      q:
        prompt: In which order does the call on N start its two calls?
        options:
          - { id: left-first, text: "Q first, then R" }
          - { id: right-first, text: "R first, then Q" }
          - { id: only-r, text: "Only R, since R is a target" }
        correct: left-first
        explanation: >-
          The left call is written first and runs first, whatever is below. Q's call returns `None`
          before R's call starts.
      s:
        prompt: M's left call returned R. Does M still make its right call?
        options:
          - { id: still-runs, text: "Yes. Both calls run before M checks what they found" }
          - { id: stops, text: "No. Finding a target ends the search" }
          - { id: only-if, text: "Only if R is not the answer" }
        correct: still-runs
        explanation: >-
          A call stops early only when its own node is a target. M is not, so it runs both lines
          before it decides what to return.
      o:
        prompt: Which calls stop without calling their children?
        options:
          - { id: target-or-none, text: "Calls on `None` and calls on a target" }
          - { id: any-found, text: "Any call after a target has been found anywhere" }
          - { id: leaves-only, text: "Only calls on leaves" }
        correct: target-or-none
        explanation: >-
          The two early returns are for `None` and for a node that is a target. Every other call runs
          both child calls, so O and S are reached.
