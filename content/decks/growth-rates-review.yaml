id: growth-rates-review
title: "Growth rates: review"
description: Fresh inputs for the Growth rates skills, for recall on later days. No worked examples this time.
heading: How many steps?

questions:
  - id: range-step-count-review
    heading: What does this print?
    tags: [complexity, python]
    prompt: |-
      ```python
      steps = 0
      for i in range(2, 15, 4):
          steps += 1
      print(steps)
      ```

      What does it print?
    options:
      - id: right
        text: '4'
        explanation: >-
          Starting at 2 and adding 4 each time gives four values below 15. The next one, 18, is
          past the stop, so there are four passes.
      - id: divided
        text: '3'
        explanation: >-
          Dividing the gap 15 - 2 by the step and rounding down gives 3, which leaves out the pass
          at the start value itself.
      - id: ignores-step
        text: '13'
        explanation: >-
          13 values lie from 2 up to 14, but a step of 4 visits only every fourth one.
      - id: last-value
        text: '14'
        explanation: >-
          14 is the last value `i` takes. The count is how many values the range produced, not
          the largest of them.
    correct: right
    followUps:
      divided:
        prompt: List the values directly. What does `range(2, 15, 4)` produce?
        options:
          - id: four-values
            text: 2, 6, 10 and 14
          - id: from-six
            text: 6, 10 and 14
          - id: to-ten
            text: 2, 6 and 10
        correct: four-values
        explanation: >-
          The start is always the first value, and each next value adds the step while it stays
          below 15. Listing the values is the safest way to count a short range.
      ignores-step:
        prompt: How far apart are the values of `range(2, 15, 4)`?
        options:
          - id: four-apart
            text: Four apart, because the step is 4
          - id: one-apart
            text: One apart, like any range
          - id: two-apart
            text: Two apart, because the range starts at 2
        correct: four-apart
        explanation: >-
          The third argument is the gap between values. A larger step leaves out more numbers, so
          the loop makes fewer passes over the same span.
      last-value:
        prompt: After the loop, `i` is 14 and `steps` is 4. What does each one record?
        options:
          - id: value-and-count
            text: '`i` keeps the last value it took, and `steps` counts the passes'
          - id: both-count
            text: Both count the passes, in different units
          - id: both-last
            text: Both keep the last value of the range
        correct: value-and-count
        explanation: >-
          A loop variable holds whatever value it was given last. Only a counter that adds one per
          pass tells you how many passes ran.

  - id: last-read-doubling-review
    format: tap-cell
    heading: Tap the last cell it prints
    tags: [complexity, python]
    prompt: Tap the last cell this loop prints.
    code: |
      nums = [4, 9, 2, 7, 5, 1, 8, 3]
      i = 1
      while i < len(nums):
          print(nums[i])
          i = i * 2
    sequence:
      kind: array
      name: nums
      cells: [4, 9, 2, 7, 5, 1, 8, 3]
    correct: 4
    explanation: >-
      `i` takes 1, 2 and 4, so the loop prints three cells and the last is index 4. Doubling 4
      gives 8, and `8 < len(nums)` is false.
    misses:
      - index: 0
        explanation: '`i` starts at 1, so index 0 is never printed.'
      - index: 1
        explanation: That is the first cell printed. `i` then doubles to 2 and to 4 before the loop ends.
      - index: 2
        explanation: That is the second cell printed. Doubling 2 gives 4, which is still below 8.
      - index: 3
        explanation: '`i` doubles, 1 to 2 to 4, so it never lands on 3. Only adding 1 each pass would reach it.'
      - index: 5
        explanation: '`i` jumps from 4 to 8, straight past index 5.'
      - index: 6
        explanation: '`i` jumps from 4 to 8, straight past index 6.'
      - index: 7
        explanation: >-
          A loop over every index would end here. This one doubles `i` from 4 to 8, and 8 is not
          below the length, so it stops first.

  - id: trace-pairs-count-review
    format: step-trace
    heading: Predict each step
    tags: [complexity, python]
    prompt: Step through the loops and predict each step before it is shown.
    code: |
      nums = [6, 2, 9, 4]
      steps = 0
      for i in range(len(nums)):
          for j in range(i + 1, len(nums)):
              steps += 1
    sequence:
      kind: array
      name: nums
      cells: [6, 2, 9, 4]
    start:
      - { name: i, at: 0 }
      - { name: j, at: 1 }
    steps:
      - line: 3
        ask: What is `steps` when the pass with `i` at 0 ends?
        options:
          - id: three
            text: '3'
            explanation: '`j` runs 1, 2, 3, the indices after `i`, so this pass adds three steps.'
          - id: four
            text: '4'
            explanation: >-
              That counts `j = 0` too. The inner range starts at `i + 1`, so `j` never sits on `i`
              itself.
          - id: one
            text: '1'
            explanation: >-
              The inner loop runs once for each index after `i`, and there are three of them on
              this pass.
        correct: three
        also:
          - { name: j, at: 3 }
      - line: 3
        ask: What is `steps` when the pass with `i` at 1 ends?
        options:
          - id: five
            text: '5'
            explanation: '`j` runs 2 and 3 on this pass, so 2 steps join the 3 from before.'
          - id: six
            text: '6'
            explanation: >-
              That adds three again. Each pass starts `j` one index later, so this pass adds one
              step fewer than the last.
          - id: two
            text: '2'
            explanation: >-
              2 is what this pass adds. `steps` keeps the 3 from the first pass, so it now reads
              5.
        correct: five
        also:
          - { name: i, at: 1 }
          - { name: j, at: 3 }
      - line: 4
        ask: On the pass with `i` at 2, where is `j` the one time the inner body runs?
        pointer: j
        correct: 3
        explanation: '`range(3, 4)` holds only 3, so the body runs once, with `j` on the last index.'
        misses:
          - index: 2
            explanation: '`j` starts at `i + 1`, which is 3. It never sits on `i`.'
        elsewhere: '`j` starts at `i + 1`, which is 3, and `range(3, 4)` stops there.'
        also:
          - { name: i, at: 2 }
      - ask: What is `steps` when both loops end?
        options:
          - id: six
            text: '6'
            explanation: >-
              The passes add 3, 2, 1 and 0. With `i` at 3 the inner range is `range(4, 4)`, which
              is empty, so the total stays 6.
          - id: seven
            text: '7'
            explanation: >-
              That gives the last pass a step. With `i` at 3 the inner range starts at 4, which is
              past the last index, so it adds nothing.
          - id: sixteen
            text: '16'
            explanation: >-
              4 × 4 counts every `j` on every pass. Here `j` starts after `i`, so later passes run
              fewer inner steps.
        correct: six
        also:
          - { name: i, at: 3 }

  - id: while-body-count-review
    heading: What does this print?
    tags: [complexity, python]
    prompt: |-
      ```python
      n = 5
      steps = 0
      while n > 0:
          n -= 2
          steps += 1
      print(steps, n)
      ```

      What does it print?
    options:
      - id: right
        text: '`3 -1`'
        explanation: >-
          `n` goes 5, 3, 1, -1. The test passes at 5, 3 and 1, so three passes run, and the last
          one takes `n` below zero.
      - id: stops-early
        text: '`2 1`'
        explanation: >-
          At `n = 1` the test `n > 0` is still true, so the loop runs once more and takes `n` to
          -1.
      - id: one-each
        text: '`5 0`'
        explanation: >-
          That takes `n` down by 1 on each pass. The body subtracts 2, so `n` reaches zero in
          about half as many passes.
      - id: counts-test
        text: '`4 -1`'
        explanation: >-
          The test `n > 0` is checked four times, but the fourth check fails. Only the three
          checks that pass run the body.
    correct: right
    followUps:
      stops-early:
        prompt: '`n` is 1. Does the loop run another pass?'
        options:
          - id: yes
            text: Yes, because 1 > 0 is true
          - id: no-negative
            text: No, because 1 - 2 would be negative
          - id: no-odd
            text: No, because 1 is less than the step of 2
        correct: yes
        explanation: >-
          A `while` loop checks only its test before each pass. It does not look ahead at what
          the body will do, so `n` can end below zero.
      one-each:
        prompt: What does `n -= 2` do on each pass?
        options:
          - id: minus-two
            text: It takes 2 away from `n`
          - id: minus-one
            text: It takes 1 away from `n`, twice over two passes
          - id: halves
            text: It halves `n`
        correct: minus-two
        explanation: >-
          `n -= 2` is short for `n = n - 2`. A bigger decrease per pass means fewer passes before
          the test fails.
      counts-test:
        prompt: How many times does a `while` loop check its test, compared with how many passes it runs?
        options:
          - id: one-more
            text: Once more than it runs, because the last check fails
          - id: same
            text: Exactly as many times as it runs
          - id: one-fewer
            text: Once fewer, because the first pass is free
        correct: one-more
        explanation: >-
          Every pass begins with a check that passed, and the loop ends on a check that failed.
          So a loop that ends on its own checks its test one extra time.

  - id: meet-in-middle-review
    format: drag-pointers
    heading: Drag the pointers
    tags: [complexity, two-pointers, python]
    prompt: >-
      Drag `i` and `j` to where they sit when the loop ends. `steps` then equals how many cells
      `i` moved.
    code: |
      i, j = 0, len(nums) - 1
      steps = 0
      while i < j:
          i += 1
          j -= 1
          steps += 1
    sequence:
      kind: array
      name: nums
      cells: [5, 1, 8, 3, 9, 2, 7, 4]
    pointers:
      - name: i
        start: 0
        correct: 4
        explanation: >-
          Each pass moves `i` one cell right and `j` one cell left. After 4 passes `i` is on 4 and
          `j` is on 3, so `i < j` fails and `steps` is 4, half of the 8 cells.
        misses:
          - index: 3
            explanation: >-
              With `i` on 3 and `j` on 4, `i < j` still holds, so one more pass runs and they cross.
          - index: 7
            explanation: '`i` moves only while it is left of `j`. They meet in the middle, not at the far end.'
        elsewhere: >-
          The two pointers close the gap by two cells per pass, so they cross after 4 passes, with
          `i` on 4.
      - name: j
        start: 7
        correct: 3
        explanation: '`j` moves left once per pass, 7 to 6, 5, 4 and 3.'
        misses:
          - index: 4
            explanation: >-
              With `j` on 4 and `i` on 3, `i < j` still holds, so one more pass moves `j` to 3.
          - index: 0
            explanation: '`j` stops as soon as `i` is no longer left of it, in the middle of the row.'
        elsewhere: '`j` moves one cell left per pass, and the loop runs 4 passes, so it ends on 3.'

  - id: double-pairs-review
    heading: What happens when n doubles?
    tags: [complexity, python]
    prompt: |-
      ```python
      def pairs(n):
          steps = 0
          for i in range(n):
              for j in range(i + 1, n):
                  steps += 1
          return steps
      ```

      `pairs(10)` returns 45. What does `pairs(20)` return?
    options:
      - id: right
        text: '190'
        explanation: >-
          The count is n(n - 1) / 2, and 20 × 19 / 2 is 190. That is a little over four times
          45, as a count that grows like n² should be.
      - id: doubles
        text: '90'
        explanation: >-
          90 is 45 doubled, which is how a single loop grows. Here both loops get longer when `n`
          doubles.
      - id: plus-one
        text: '46'
        explanation: >-
          One more step per doubling is how a halving loop grows. Both loops here move one index
          at a time.
      - id: squared
        text: '2025'
        explanation: >-
          2025 is 45 × 45. Doubling `n` doubles each loop's length, which multiplies the count by
          about 4, not by 45.
    correct: right
    followUps:
      doubles:
        prompt: When `n` doubles, how many outer passes are there, and how long is each inner loop?
        options:
          - id: both-double
            text: Twice as many passes, and each inner loop is about twice as long
          - id: passes-only
            text: Twice as many passes, and the inner loops stay the same length
          - id: inner-only
            text: The same number of passes, each twice as long
        correct: both-double
        explanation: >-
          Both loops are bounded by `n`. Doubling both factors multiplies the total by about 4.
      plus-one:
        prompt: Does any loop in `pairs` halve its range?
        options:
          - id: no-halving
            text: No, each loop steps through its range one index at a time
          - id: inner-halves
            text: Yes, the inner loop halves its range on each pass
          - id: outer-halves
            text: Yes, the outer loop halves `n`
        correct: no-halving
        explanation: >-
          The inner loop starts one index later on each pass, which shortens it by one, not by
          half. A loop that halves what is left, or doubles toward `n`, gives a count that rises by
          one when `n` doubles. Shortening by one does not.
      squared:
        prompt: For a count that grows like n², what does doubling `n` multiply the count by?
        options:
          - id: four
            text: About 4, since 2 × 2 is 4
          - id: itself
            text: The count itself, so it is squared
          - id: two
            text: Exactly 2
        correct: four
        explanation: >-
          Replacing `n` with `2n` in n² gives 4n². The multiplier depends on how much `n` grew,
          not on the size of the old count.

  - id: trace-step-two-review
    format: step-trace
    heading: Predict each step
    tags: [complexity, python]
    prompt: >-
      The row shows the indices 0 to 6. Step through the loop and predict each step before it is
      shown.
    code: |
      n = 6
      steps = 0
      i = n
      while i > 0:
          i -= 2
          steps += 1
    sequence:
      kind: array
      cells: [0, 1, 2, 3, 4, 5]
      pastEnd: true
    start:
      - { name: i, at: 6 }
    steps:
      - line: 4
        ask: Where is `i` after the first pass?
        pointer: i
        correct: 4
        explanation: '`i -= 2` moves `i` from 6 to 4.'
        misses:
          - index: 5
            explanation: That moves one cell. The body subtracts 2, so `i` skips 5.
          - index: 3
            explanation: That halves 6. The body subtracts 2, which takes 6 to 4.
        elsewhere: '`i -= 2` moves `i` two cells left, from 6 to 4.'
      - line: 4
        ask: What is `steps` when the loop ends?
        options:
          - id: three
            text: '3'
            explanation: '`i` goes 6, 4, 2, 0. At 0 the test `i > 0` fails, so three passes ran.'
          - id: six
            text: '6'
            explanation: Six passes would move `i` one cell at a time. Each pass here moves it two cells.
          - id: four
            text: '4'
            explanation: >-
              That counts a pass at `i = 0`. The test is `i > 0`, and 0 is not greater than 0.
        correct: three
        also:
          - { name: i, at: 0 }
      - ask: Run the same loop with `n = 12`. What is `steps` then?
        options:
          - id: six
            text: '6'
            explanation: >-
              `i` goes 12, 10, 8, 6, 4, 2, 0. Twice the distance at the same stride takes twice the
              passes, so the count grows in step with `n`.
          - id: four
            text: '4'
            explanation: >-
              One extra pass per doubling is how a halving loop grows. Subtracting 2 still walks the
              whole distance, so doubling `n` doubles the passes.
          - id: twelve
            text: '12'
            explanation: >-
              That is one pass per index. The stride of 2 halves the passes at every `n`, so 12
              becomes 6.
        correct: six

  - id: which-overtakes-review
    heading: Which takes the most steps?
    tags: [complexity]
    prompt: >-
      Four functions take `50 * n`, `n * n`, `n * log2(n)` and `1000` steps on an input of size
      `n`. At `n = 8` those counts are 400, 64, 24 and 1000. Which takes the most steps at
      `n = 10000`?
    options:
      - id: square
        text: '`n * n`'
        explanation: >-
          At 10000 it takes 100,000,000 steps. `50 * n` takes 500,000 and `n * log2(n)` about
          133,000. The square grows fastest, so it overtakes the others.
      - id: constant
        text: '`1000`'
        explanation: >-
          It is the largest at `n = 8`, but it never grows. Every count that grows with `n` passes
          it eventually.
      - id: linear
        text: '`50 * n`'
        explanation: >-
          It leads the growing counts at `n = 8` because of its constant 50. At `n = 10000` it is
          500,000 steps, far below the square.
      - id: n-log-n
        text: '`n * log2(n)`'
        explanation: >-
          Both it and `n * n` multiply `n` by something. Here that something is log2(n), about 13
          at 10000, while the square multiplies by 10000.
    correct: square
    followUps:
      constant:
        prompt: What happens to a count of 1000 steps as `n` grows?
        options:
          - id: unchanged
            text: It stays at 1000 whatever `n` is
          - id: slowly
            text: It grows slowly
          - id: falls
            text: It shrinks as `n` grows
        correct: unchanged
        explanation: >-
          A constant count ignores the input size. It can be large for small inputs and still lose
          to any count that grows.
      linear:
        prompt: '`50 * n` and `n * n` are equal at `n = 50`. What happens past that point?'
        options:
          - id: square-ahead
            text: '`n * n` stays ahead from then on'
          - id: swap-back
            text: They keep swapping places
          - id: linear-ahead
            text: '`50 * n` pulls ahead again'
        correct: square-ahead
        explanation: >-
          Past `n = 50`, each extra 1 in `n` adds `n` steps to the square and only 50 to the other
          count, so the square never falls behind again.
      n-log-n:
        prompt: At `n = 10000`, which is larger, log2(n) or `n`?
        options:
          - id: n
            text: '`n`, which is 10000, against about 13'
          - id: log
            text: log2(n), because a log grows fastest
          - id: equal
            text: They are about the same
        correct: n
        explanation: >-
          A log grows very slowly: doubling `n` adds only 1 to log2(n). So n × log2(n) stays far
          below n × n.

  - id: in-place-or-copy-review
    heading: Which allocates no new list?
    tags: [complexity, python]
    prompt: >-
      Each function body below returns `nums` in reverse order. Which one allocates no new list
      of `n` items?
    options:
      - id: in-place
        text: '`nums.reverse(); return nums`'
        explanation: >-
          `reverse` reorders the list's own slots and returns `None`. The function then returns
          the same list object, so nothing of size `n` is allocated. The caller's list is changed.
      - id: slice
        text: '`return nums[::-1]`'
        explanation: >-
          A slice always builds a new list in Python, here with all `n` items in reverse order.
      - id: list-reversed
        text: '`return list(reversed(nums))`'
        explanation: >-
          `reversed` alone is cheap, but `list(...)` walks it and stores every item in a fresh
          list.
      - id: comprehension
        text: '`return [nums[i] for i in range(len(nums) - 1, -1, -1)]`'
        explanation: >-
          A list comprehension builds its list as it runs, one slot per index, so it ends with all
          `n` items.
    correct: in-place
    followUps:
      slice:
        prompt: What does `nums[::-1]` return?
        options:
          - id: new-list
            text: A new list with its own `n` slots
          - id: view
            text: A view that reads `nums` backwards without copying
          - id: same
            text: The same list object, turned around
        correct: new-list
        explanation: >-
          Python list slices copy. Changing the result leaves `nums` alone, which is why it costs
          O(n) memory.
      list-reversed:
        prompt: >-
          `reversed(nums)` on its own allocates only a small iterator. What does wrapping it in
          `list(...)` add?
        options:
          - id: full-list
            text: A new list holding all `n` items
          - id: nothing
            text: Nothing, it hands back the iterator
          - id: second-iterator
            text: A second small iterator
        correct: full-list
        explanation: >-
          `list(...)` consumes the iterator and keeps every item it produces. The iterator was
          cheap, and storing what it yields is not.
      comprehension:
        prompt: When the comprehension finishes, how many items does its list hold?
        options:
          - id: n-items
            text: '`n`, one for each index'
          - id: lazy
            text: None, because a comprehension is evaluated lazily
          - id: one
            text: One, the last item it read
        correct: n-items
        explanation: >-
          Square brackets build a real list right away. Only a generator expression, written with
          parentheses, produces items one at a time.

  - id: running-totals-space-review
    heading: How much extra space?
    tags: [complexity, python]
    prompt: |-
      ```python
      def running_totals(nums):
          out = []
          total = 0
          for x in nums:
              total += x
              out.append(total)
          return out
      ```

      Not counting the input or the returned list, how much extra space does it use?
    options:
      - id: constant
        text: O(1)
        explanation: >-
          `out` is the returned list, which this question leaves out. What is left is `total` and
          the loop variable `x`, a fixed number of names.
      - id: linear
        text: O(n)
        explanation: >-
          `out` does grow to `n` items, but it is the list the function returns. Under the stated
          convention it does not count as extra.
      - id: quadratic
        text: O(n²)
        explanation: >-
          Each pass appends one total. Even counting `out`, the function stores `n` values, not
          one per pair.
    correct: constant
    followUps:
      linear:
        prompt: Under this question's convention, which memory counts as extra?
        options:
          - id: besides
            text: Only what the function allocates besides its input and its return value
          - id: all
            text: Everything the function allocates, including `out`
          - id: input
            text: Only the input
        correct: besides
        explanation: >-
          Extra space is often counted without the result, because any function returning `n` items
          needs room for them. A question has to say which way it counts.
      quadratic:
        prompt: How many items does `out` hold when the function returns?
        options:
          - id: n
            text: '`n`, one appended per pass'
          - id: n-squared
            text: About n², because each total keeps a copy of the earlier ones
          - id: half
            text: About n / 2
        correct: n
        explanation: >-
          Each total is a single number, the sum so far. It does not hold a copy of earlier items,
          so the list grows by one per pass.

  - id: in-twos-output-review
    heading: How much memory?
    tags: [complexity, python]
    prompt: |-
      ```python
      def in_twos(nums):
          return [nums[i:i + 2] for i in range(0, len(nums), 2)]
      ```

      `in_twos([1, 2, 3, 4, 5, 6])` returns `[[1, 2], [3, 4], [5, 6]]`. Counting the returned
      value, how does its memory grow with `n`?
    options:
      - id: linear
        text: O(n)
        explanation: >-
          There are about n / 2 small lists of at most 2 items each, so every input item is
          copied once. The total is proportional to `n`.
      - id: quadratic
        text: O(n²)
        explanation: >-
          A list of lists is quadratic only when each inner list grows with `n`, as in an n × n
          grid. These inner lists never hold more than 2 items.
      - id: constant
        text: O(1)
        explanation: >-
          Each slice `nums[i:i + 2]` is a new list. The result holds about n / 2 of them, so it
          grows with the input.
    correct: linear
    followUps:
      quadratic:
        prompt: How many numbers does the returned value hold in all, across its inner lists?
        options:
          - id: n
            text: '`n`, each input item once'
          - id: n-squared
            text: About n², since there is a list of lists
          - id: two
            text: '2'
        correct: n
        explanation: >-
          Count the stored items, not the nesting. Splitting `n` items into groups of two still
          stores `n` items, plus one small list per group.
      constant:
        prompt: What does the slice `nums[i:i + 2]` give back?
        options:
          - id: copy
            text: A new list of up to 2 items
          - id: view
            text: A view into `nums` that costs nothing
          - id: same
            text: The same list as `nums`
        correct: copy
        explanation: >-
          A slice of a list copies the chosen items into a new list. The comprehension keeps each
          of those lists in its result.

  - id: triangle-loops-review
    heading: What is its Big-O?
    tags: [complexity, python]
    prompt: |-
      ```python
      total = 0
      for i in range(n):
          for j in range(i, n):
              total += nums[j]
      ```

      How does the number of times `total += nums[j]` runs grow with `n`?
    options:
      - id: linear
        text: O(n)
        explanation: >-
          The inner loop does not run once per outer pass. It runs `n - i` times, so the total is
          `n + (n - 1) + ... + 1`, far more than `n`.
      - id: n-log-n
        text: O(n log n)
        explanation: >-
          A log n factor comes from halving or doubling, as in a loop with `j = j * 2`. This inner
          loop only starts one index later on each pass.
      - id: quadratic
        text: O(n²)
        explanation: >-
          The inner loop runs `n`, `n - 1`, and so on down to 1 times, which adds up to
          `n * (n + 1) // 2`. Big-O drops the factor 1/2 and the smaller term, leaving O(n²).
      - id: exponential
        text: O(2^n)
        explanation: >-
          A count of `2 ** n` doubles with each extra item, as when trying every subset. Two nested
          loops of at most `n` passes each cap the count at n × n.
    correct: quadratic
    followUps:
      linear:
        prompt: How many times does the inner body run in all when `n = 4`?
        options:
          - id: ten
            text: 10 times
          - id: four
            text: 4 times
          - id: sixteen
            text: 16 times
        correct: ten
        explanation: >-
          The inner loop runs 4, 3, 2 and 1 times, 10 in all. That is `n * (n + 1) // 2`, which
          grows like n × n, not like `n`.
      n-log-n:
        prompt: What kind of loop gives a log n count?
        options:
          - id: halving
            text: One that halves or doubles a value on each pass
          - id: start-later
            text: An inner loop that starts one index later each time
          - id: fixed-count
            text: A loop that runs a fixed number of times
        correct: halving
        explanation: >-
          A log n count comes from halving or doubling. Starting one index later takes only one
          pass off each inner loop, so the passes still add up to about n² / 2.
      exponential:
        prompt: What kind of work grows like `2 ** n`?
        options:
          - id: every-subset
            text: Trying every subset of the `n` items
          - id: every-pair
            text: Trying every pair of items
          - id: two-loops
            text: Running two loops over `n`, one after the other
        correct: every-subset
        explanation: >-
          Each extra item doubles the number of subsets, so trying them all grows like `2 ** n`.
          Every pair is only about n × n work.

  - id: doubling-size-review
    heading: What is its Big-O?
    tags: [complexity, python]
    prompt: |-
      ```python
      def rounds(n):
          size = 1
          count = 0
          while size < n:
              size = size * 2
              count += 1
          return count
      ```

      `rounds(1000)` returns 10. How does its number of passes grow with `n`?
    options:
      - id: log
        text: O(log n)
        explanation: >-
          `size` doubles on each pass, so it reaches `n` after about `log2(n)` passes. `2 ** 10` is
          1024, the first power of 2 that reaches 1000, which is why the call returns 10.
      - id: linear
        text: O(n)
        explanation: >-
          A loop that added 1 to `size` would need about `n` passes. Doubling reaches 1000 in 10.
      - id: constant
        text: O(1)
        explanation: >-
          10 passes is few, but `rounds(2000)` needs 11. A count that rises with `n`, however
          slowly, is not O(1).
      - id: quadratic
        text: O(n²)
        explanation: >-
          There is one loop and no loop inside it, and that one loop runs far fewer than `n`
          passes.
    correct: log
    followUps:
      linear:
        prompt: What does `size` hold after 3 passes?
        options:
          - id: eight
            text: 8, since it went 1, 2, 4, 8
          - id: four
            text: 4, since it went 1, 2, 3, 4
          - id: three
            text: 3, one per pass
        correct: eight
        explanation: >-
          Each pass doubles `size`, so after `k` passes it is `2 ** k`. It reaches `n` after about
          `log2(n)` passes, not `n`.
      constant:
        prompt: When `n` doubles, what happens to the number of passes?
        options:
          - id: one-more
            text: It goes up by one
          - id: same
            text: It stays the same
          - id: doubles
            text: It doubles
        correct: one-more
        explanation: >-
          One more doubling covers twice the distance, so each doubling of `n` costs one pass. That
          is O(log n): slow growth, but growth.
      quadratic:
        prompt: How many loops does `rounds` run, one inside another?
        options:
          - id: one
            text: One loop, with nothing nested in it
          - id: two
            text: Two, one inside the other
          - id: n-loops
            text: One loop per item
        correct: one
        explanation: >-
          n × n needs a loop of about `n` passes inside another. Here a single loop doubles
          `size`, which takes only about `log2(n)` passes.

  - id: ab-strings-review
    heading: How fast does it grow?
    tags: [complexity]
    prompt: >-
      A function builds every string of length `n` made from the letters `a` and `b`. For `n = 2`
      they are `aa`, `ab`, `ba` and `bb`. What happens to the number of strings when `n` grows by
      1, and what is its Big-O?
    options:
      - id: doubles
        text: It doubles, so O(2^n)
        explanation: >-
          Each string of length `n` gets an `a` version and a `b` version one letter longer, so
          every extra letter doubles the count. That makes `2 ** n` strings, 8 at `n = 3`.
      - id: plus-two
        text: It grows by 2, so O(n)
        explanation: >-
          Two letters per position multiply across positions rather than add. Length 3 gives
          2 × 2 × 2 = 8 strings, not 4 + 2 = 6.
      - id: times-four
        text: It is multiplied by 4, so O(n²)
        explanation: >-
          Multiplying by about 4 is what a count like n × n does when `n` doubles. Here `n` grows
          by only one, and one more letter doubles the count.
    correct: doubles
    followUps:
      plus-two:
        prompt: How many strings of length 3 use only `a` and `b`?
        options:
          - id: eight
            text: 8, two choices for each of the 3 letters
          - id: six
            text: 6, two more than for length 2
          - id: nine
            text: 9, three for each letter
        correct: eight
        explanation: >-
          The choices multiply: 2 × 2 × 2 is 8. Each new letter doubles the count, which is
          O(2^n).
      times-four:
        prompt: Going from `n = 2` to `n = 3`, the count goes from 4 to what?
        options:
          - id: eight
            text: 8, twice as many
          - id: sixteen
            text: 16, four times as many
          - id: nine
            text: 9, three squared
        correct: eight
        explanation: >-
          One more letter gives each old string two versions, so the count doubles. Doubling for
          every added letter is the `2 ** n` growth.

  - id: reverse-extra-space-review
    heading: How much extra space?
    tags: [complexity]
    prompt: >-
      A function takes a list of `n` numbers and returns a new list holding the same numbers in
      reverse order. It builds the result by appending each number to an empty list, starting
      from the last. Counting the returned list but not the input, how much extra space does it
      use?
    options:
      - id: constant
        text: O(1)
        explanation: >-
          A fixed number of names would be O(1), as when the list is reversed in place by swapping
          from both ends. Here the returned list counts, and it holds `n` numbers.
      - id: logarithmic
        text: O(log n)
        explanation: >-
          A log n amount comes from something that halves, and nothing here halves. The new list
          holds all `n` numbers.
      - id: linear
        text: O(n)
        explanation: >-
          The new list has `n` items, so its size grows in step with the input. The loop variables
          add only a fixed amount, which Big-O drops.
      - id: quadratic
        text: O(n²)
        explanation: >-
          Quadratic space needs about n × n stored values, such as a table with an entry for every
          pair of items. One list of `n` items is only O(n).
    correct: linear
    followUps:
      constant:
        prompt: Which way of reversing uses O(1) extra space?
        options:
          - id: swap-in-place
            text: Swap the first and last items, then move inward, changing the list in place
          - id: slice-copy
            text: Return the slice `nums[::-1]`
          - id: append-new
            text: Append each item to a new list, starting from the end
        correct: swap-in-place
        explanation: >-
          Swapping in place needs only two index names, so its extra space is fixed. A slice and an
          appended list each build a new list of `n` items.
      logarithmic:
        prompt: What does log n count?
        options:
          - id: halvings
            text: How many times `n` can be halved before it reaches 1
          - id: appends
            text: How many items a loop appends
          - id: copies
            text: How many lists a function builds
        correct: halvings
        explanation: >-
          log n counts halvings. A loop that appends one item per pass for `n` passes stores `n`
          items, which is O(n).
      quadratic:
        prompt: The loop appends one item per pass, `n` times. How many items does the result hold at the end?
        options:
          - id: n-items
            text: "`n` items, one per pass"
          - id: n-squared-items
            text: About n², because each append copies the items already there
          - id: one-item
            text: One item, since the list is rebuilt on every pass
        correct: n-items
        explanation: >-
          Each pass adds one item and keeps the earlier ones, so the list ends with `n` items and
          takes O(n) memory.
