id: hash-lookups-checkpoint
title: "Hash lookups: checkpoint"
description: Find where runs of consecutive numbers start, explain why each value needs only one visit, and choose the lookups for a pair search, on new inputs.
heading: Which one is right?

questions:
  - id: checkpoint-which-starts
    heading: Which values start a run?
    tags: [hash-map]
    prompt: |-
      ```python
      nums = [31, 4, 30, 6, 5, 32, 10]
      s = set(nums)
      starts = [x for x in nums if x - 1 not in s]
      ```

      Which values end up in `starts`?
    options:
      - id: right
        text: 4, 10 and 30
        explanation: >-
          3, 9 and 29 are missing from the set, so 4, 10 and 30 each begin a run: 4 to 6, the
          lone 10, and 30 to 32. Every other value has the value just below it in the set.
      - id: skip-lone
        text: 4 and 30
        explanation: Look again at 10.
      - id: run-ends
        text: 6, 10 and 32
        explanation: Which neighbor does the test look up?
      - id: smallest
        text: Only 4, the smallest value
        explanation: A start needs only the value one below it, `x - 1`, to be missing.
    correct: right
    followUps:
      skip-lone:
        prompt: 9 is not in the set. What does that make 10?
        options:
          - id: lone-start
            text: The start of a run of length 1
          - id: no-run
            text: Part of no run, since it has no neighbors
          - id: needs-next
            text: A start only if 11 is in the set too
        correct: lone-start
        explanation: >-
          The test asks only whether `x - 1` is absent. A value with no neighbors passes it, and
          its run is the value alone.
      run-ends:
        prompt: For `x = 32`, the test looks up 31. Is 31 in the set, and what follows?
        options:
          - id: continues
            text: Yes, so 32 continues a run and is not a start
          - id: starts
            text: No, so 32 starts a run
          - id: ends
            text: Yes, so 32 is a start because nothing comes after it
        correct: continues
        explanation: >-
          32 extends the run 30, 31, 32. Testing `x + 1` instead finds the last value of each run,
          where a walk upward stops rather than starts.
      smallest:
        prompt: Does 30 pass the test `x - 1 not in s`?
        options:
          - id: yes
            text: Yes, 29 is not in the set
          - id: no-smaller
            text: No, 4 is smaller and already started a run
          - id: no-one-run
            text: No, a list has only one run start
        correct: yes
        explanation: >-
          Each run has its own first value. The test looks at one neighbor, so it finds every
          run's start, not just the smallest value overall.

  - id: checkpoint-longest-start
    format: tap-cell
    heading: Tap the start of the longest run
    tags: [hash-map]
    prompt: >-
      The call below returns 4. Tap the value whose walk counts those 4.
    code: |
      def longest(nums):
          s = set(nums)
          best = 0
          for x in s:
              if x - 1 not in s:
                  y = x
                  while y + 1 in s:
                      y += 1
                  best = max(best, y - x + 1)
          return best

      longest([52, 18, 50, 17, 51, 19, 49, 30])
    sequence:
      kind: array
      name: nums
      cells: [52, 18, 50, 17, 51, 19, 49, 30]
    correct: 6
    explanation: >-
      48 is not in the set, so 49 starts a walk. It steps to 50, 51 and 52 and stops at the
      missing 53, a run of 4. The other walks start at 17 and 30 and count 3 and 1.
    misses:
      - index: 0
        explanation: 52 is where the longest run ends. The walk starts where the value one below, `x - 1`, is missing.
      - index: 1
        explanation: 17 is in the set, so 18 never starts a walk. It belongs to the run 17 to 19.
      - index: 2
        explanation: 49 is in the set, so 50 never starts a walk. Its run begins one value lower.
      - index: 3
        explanation: 17 does start a walk, but its run is 17, 18, 19, which counts 3.
      - index: 4
        explanation: 51 sits inside the run 49 to 52. 50 is in the set, so it never starts a walk.
      - index: 5
        explanation: 19 is the end of the run 17 to 19, which counts 3.
      - index: 7
        explanation: 30 starts a walk, but 31 is missing, so that walk counts 1.

  - id: checkpoint-why-linear
    heading: Why is it linear?
    tags: [hash-map, complexity]
    prompt: |-
      ```python
      def longest(nums):
          s = set(nums)
          best = 0
          for x in s:
              if x - 1 not in s:
                  y = x
                  while y + 1 in s:
                      y += 1
                  best = max(best, y - x + 1)
          return best
      ```

      This takes O(n) time on average, even with a `while` loop inside the `for` loop. Why?
    options:
      - id: one-walk
        text: Only a run's first value starts a walk, so no value is walked over twice
        explanation: >-
          The walk from a start covers that run alone, and no other value in the run starts one.
          So the `for` loop does n start tests and all the walks together take about n more
          steps, each lookup O(1) on average.
      - id: constant-lookups
        text: Each `in` test is O(1), so the two loops together cost O(n)
        explanation: Count the `while` tests if the start test were removed.
      - id: short-walks
        text: The walk stops at the first missing value, so each walk is short
        explanation: How long is the walk from 1 when `nums` is `[1, 2, ..., n]`?
      - id: sorted-set
        text: A set keeps its values sorted, so each walk only moves forward
        explanation: Does the code depend on the order in which it visits `s`?
    correct: one-walk
    followUps:
      constant-lookups:
        prompt: Remove the start test. On `[1, 2, ..., n]`, about how many `y + 1 in s` tests run?
        options:
          - id: quadratic
            text: About n²/2
          - id: linear
            text: About n
          - id: n-log-n
            text: About n log n
        correct: quadratic
        explanation: >-
          Without the start test every value walks to the end of the run, so the walks take
          n + (n - 1) + ... + 1 tests, about n²/2. Cheap lookups don't help when there are too
          many of them. The start test cuts the walks
          to one per run, which brings the total down to about n.
      short-walks:
        prompt: On `[1, 2, ..., n]`, how many steps does the walk from 1 take?
        options:
          - id: whole-run
            text: n - 1, across the whole run
          - id: one
            text: 1, it stops at once
          - id: log
            text: About log n
        correct: whole-run
        explanation: >-
          A walk is as long as its run, and a run can hold every value. What keeps the total linear
          is that each run is walked only once.
      sorted-set:
        prompt: Would the function still return the right answer if it visited `s` in a random order?
        options:
          - id: yes
            text: Yes, the start test doesn't depend on the visiting order
          - id: smallest-first
            text: No, the starts must be visited smallest first
          - id: sorted-storage
            text: No, the walk needs the set stored in sorted order
        correct: yes
        explanation: >-
          A Python set promises no sorted order. The start test and the walk use lookups, not
          positions, so any visiting order finds the same starts and the same walks.

  - id: checkpoint-list-duplicates
    heading: How many tests run?
    tags: [hash-map, complexity]
    prompt: |-
      This version loops over the list instead of the set:

      ```python
      def longest(nums):
          s = set(nums)
          best = 0
          for x in nums:
              if x - 1 not in s:
                  y = x
                  while y + 1 in s:
                      y += 1
                  best = max(best, y - x + 1)
          return best
      ```

      `longest([4, 5, 6, 4, 4, 4])` returns the right answer, 3. In total, how many times does
      the `while` test `y + 1 in s` run?
    options:
      - id: twelve
        text: '12'
        explanation: >-
          The list holds four copies of 4, and each passes the start test, so the run 4, 5, 6 is
          walked four times. Each walk tests 5, 6 and the missing 7. Looping over `s` would visit
          4 once and run the test 3 times.
      - id: three
        text: '3'
        explanation: Which does the `for` loop visit, the list or the set?
      - id: eight
        text: '8'
        explanation: Does the test that comes out false count as a run of the test?
      - id: fifteen
        text: '15'
        explanation: Do 5 and 6 pass the start test?
    correct: twelve
    followUps:
      three:
        prompt: The loop is `for x in nums`. How many times does `x` take the value 4?
        options:
          - id: four
            text: Four times, once per copy in the list
          - id: once
            text: Once, because the copies collapse
          - id: never
            text: Never, because 4 is a duplicate
        correct: four
        explanation: >-
          Only the set drops copies. A loop over the list visits every copy, and each copy of a
          run start starts its own walk.
      eight:
        prompt: Starting from `y = 4`, which tests does one walk run?
        options:
          - id: three-tests
            text: '`5 in s`, `6 in s` and `7 in s`, the last one false'
          - id: two-tests
            text: '`5 in s` and `6 in s` only'
          - id: from-four
            text: '`4 in s`, `5 in s` and `6 in s`'
        correct: three-tests
        explanation: >-
          This `while` has no `break`, so its test runs once more than its body: the last test
          comes out false and ends the walk.
      fifteen:
        prompt: 4 is in the set. Does 5 start a walk?
        options:
          - id: no
            text: No, the value one below it, 4, is present, so it fails the start test
          - id: yes-all
            text: Yes, every value in the list starts a walk
          - id: yes-once
            text: Yes, because 5 appears only once
        correct: no
        explanation: >-
          Only the copies of 4 pass the start test. 5 and 6 never start walks, so all the
          repeated work here comes from the repeated 4s.

  - id: checkpoint-gap-lookup
    heading: Which test belongs in the if?
    tags: [hash-map, python]
    prompt: |-
      `has_gap(nums, k)` should return `True` when two values in `nums` differ by exactly `k`,
      where `k` is greater than 0. It keeps the values it has passed in a set and tests each new
      value against them:

      ```python
      def has_gap(nums, k):
          seen = set()
          for x in nums:
              if ...:  # one test goes here
                  return True
              seen.add(x)
          return False
      ```

      Which test in place of `...` makes it right for every input?
    options:
      - id: both
        text: "`x - k in seen or x + k in seen`"
        explanation: >-
          An earlier value that differs from `x` by `k` is either `x - k`, below it, or `x + k`,
          above it. The scan cannot know which one came first, so it tests both, each in O(1) on
          average.
      - id: plus-only
        text: "`x + k in seen`"
        explanation: >-
          That finds a pair only when the larger value comes first. `has_gap([2, 5], 3)` tests
          5 for 8, misses the 2, and returns `False`.
      - id: minus-only
        text: "`x - k in seen`"
        explanation: >-
          That finds a pair only when the smaller value comes first. `has_gap([5, 2], 3)` tests
          2 for -1, misses the 5, and returns `False`.
      - id: flipped
        text: "`k - x in seen`"
        explanation: >-
          `k - x` is the complement for a sum of `k`, not a difference. `has_gap([1, 2], 3)`
          returns `True`, though 1 and 2 differ by 1.
    correct: both
    followUps:
      plus-only:
        prompt: With the test `x + k in seen`, what does `has_gap([2, 5], 3)` return?
        options:
          - id: no-pair
            text: "`False`, since 5 looks for 8"
          - id: found
            text: "`True`, since 5 and 2 differ by 3"
          - id: error
            text: It raises an error on the missing 8
        correct: no-pair
        explanation: >-
          When 5 arrives, the earlier value it pairs with is 2, which is `x - k`. A test for
          `x + k` alone misses it, so a pair whose larger value comes second is never found.
      minus-only:
        prompt: With the test `x - k in seen`, what does `has_gap([5, 2], 3)` return?
        options:
          - id: no-pair
            text: "`False`, since 2 looks for -1"
          - id: found
            text: "`True`, since 5 and 2 differ by 3"
          - id: error
            text: It raises an error, because -1 is negative
        correct: no-pair
        explanation: >-
          When 2 arrives, the earlier value it pairs with is 5, which is `x + k`. A test for
          `x - k` alone misses it, so a pair whose smaller value comes second is never found.
      flipped:
        prompt: For which task is `k - x` the value to look up?
        options:
          - id: sum
            text: Finding two values that add up to `k`
          - id: difference
            text: Finding two values that differ by `k`
          - id: product
            text: Finding two values whose product is `k`
        correct: sum
        explanation: >-
          `x + y == k` gives `y == k - x`, the two-sum complement. A difference of `k` gives
          `y == x - k` or `y == x + k`, depending on which value is larger.

  - id: checkpoint-debug-store-first
    heading: Which call does it fail on?
    tags: [hash-map, python]
    prompt: |-
      A suggested solution to two-sum should return two different indices whose values add up
      to `target`. Each call below has exactly one such pair. One detail is slightly
      off:

      ```python
      def pair(nums, target):
          seen = {}
          for i, x in enumerate(nums):
              seen[x] = i
              need = target - x
              if need in seen:
                  return [seen[need], i]
          return None
      ```

      Which call returns a wrong answer?
    options:
      - id: half-first
        text: "`pair([4, 2, 6], 8)`"
        explanation: >-
          The 4 is stored before its lookup, and `8 - 4` is 4, so the lookup finds the 4 itself
          and the call returns `[0, 0]`, one index twice. The real pair is `[1, 2]`. Looking up
          `need` before storing `x` fixes it, since `seen` then holds only earlier values.
      - id: half-last
        text: "`pair([-1, 9, 4], 8)`"
        explanation: >-
          4 is half of 8 here too, but the 9 finds the -1 first, and the call returns `[0, 1]`
          before it reaches the 4. That is right.
      - id: no-half
        text: "`pair([1, 5, 3], 8)`"
        explanation: >-
          No value is half of 8, so no value can find itself. The 3 finds the 5 stored at index
          1, and the call returns `[1, 2]`, which is right.
      - id: two-values
        text: "`pair([2, 7], 9)`"
        explanation: >-
          The 2 looks for 7, which is not stored yet. The 7 then finds the 2, and the call returns
          `[0, 1]`, which is right.
    correct: half-first
    followUps:
      half-last:
        prompt: For `pair([-1, 9, 4], 8)`, on which pass does the call return?
        options:
          - id: nine
            text: On the pass for 9, before the 4 is read
          - id: four
            text: On the pass for 4, which finds itself
          - id: never
            text: It never returns a pair, and gives `None`
        correct: nine
        explanation: >-
          The 9 needs -1, which is stored at index 0, so the call returns `[0, 1]`. A value that
          could find itself causes harm only if the loop reaches it before the real pair.
      no-half:
        prompt: In this code, when can a value find itself in `seen`?
        options:
          - id: half
            text: Only when it is half of the target, so `need` equals `x`
          - id: stored
            text: Every time, since each value is stored before its lookup
          - id: never
            text: Never, since `need` is a different variable from `x`
        correct: half
        explanation: >-
          Every value is stored before its lookup, but the lookup asks for `need`. The value just
          stored is found only when `need == x`, which means `x` is half of the target.
      two-values:
        prompt: What does `pair([2, 7], 9)` return?
        options:
          - id: right
            text: "`[0, 1]`, the 2 and the 7"
          - id: self
            text: "`[1, 1]`, the 7 found twice"
          - id: none
            text: "`None`, since the 2 finds nothing"
        correct: right
        explanation: >-
          The 2 misses and stays stored. The 7 needs 2, which is stored at index 0. Neither value
          is half of 9, so neither can find itself.
