id: arrays-and-strings-checkpoint
title: "Arrays and strings: checkpoint"
description: Trace a two-cursor edit on a new input. Each item combines reading positions, tracing a scan, and telling a shared list from a copy.
heading: What does this print?

questions:
  - id: checkpoint-reverse-range
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      def flip(chars, lo, hi):
          while lo < hi:
              chars[lo], chars[hi] = chars[hi], chars[lo]
              lo += 1
              hi -= 1

      word = list("sprint")
      flip(word, 1, 4)
      print("".join(word))
      ```
    options:
      - id: inclusive
        text: "`snirpt`"
        explanation: >-
          `lo` starts at 1 and `hi` at 4, and both ends are included. The first pass swaps the
          outer pair of that range and the second pass swaps the middle pair. Then `lo` passes `hi`.
          Positions 0 and 5 are untouched, so the result is `s` + `nirp` + `t`.
      - id: hi-exclusive
        text: "`sirpnt`"
        explanation: >-
          This reverses positions 1 to 3 only. Check whether `hi` itself gets swapped.
      - id: one-based
        text: "`irpsnt`"
        explanation: >-
          This reverses the first four letters. Count from 0 to find where position 1 is.
      - id: one-swap
        text: "`snript`"
        explanation: >-
          That is the word after the first swap. Check the loop condition again before stopping.
    correct: inclusive
    followUps:
      hi-exclusive:
        prompt: On the first pass, which two positions swap?
        options:
          - id: one-four
            text: 1 and 4
          - id: one-three
            text: 1 and 3
          - id: zero-three
            text: 0 and 3
        correct: one-four
        explanation: >-
          `chars[hi]` is read and written directly, so position 4 is inside the range. A slice such
          as `chars[1:4]` would stop before 4, but this loop uses `hi` as a position.
      one-based:
        prompt: In `list("sprint")`, which letter is at position 1?
        options:
          - id: p
            text: "`'p'`"
          - id: s
            text: "`'s'`"
          - id: r
            text: "`'r'`"
        correct: p
        explanation: >-
          Position 0 is `s`, so position 1 is the second letter. The swaps run from that `p` to the
          `n` at position 4.
      one-swap:
        prompt: After the first swap, `lo` is 2 and `hi` is 3. Does the loop run again?
        options:
          - id: again
            text: Yes, since 2 < 3
          - id: once
            text: No, the loop body runs once per call
          - id: neighbours
            text: No, since `lo` and `hi` are next to each other
        correct: again
        explanation: >-
          The loop continues while `lo < hi`, so the middle pair swaps too. After that `lo` is 3
          and `hi` is 2, and the loop stops.

  - id: checkpoint-mirror-edit
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      chars = list("candle")
      i, j = 0, len(chars) - 1
      while i < j:
          chars[j] = chars[i]
          i += 1
          j -= 1
      print("".join(chars))
      ```
    options:
      - id: mirror
        text: "`cannac`"
        explanation: >-
          Each pass copies the letter at `i` over the letter at `j`. The passes write into
          positions 5, 4 and 3, and then `i` passes `j`. The left half is only ever read, so it
          keeps `can`, and the right half becomes its mirror image.
      - id: direction
        text: "`elddle`"
        explanation: >-
          This copies the right half over the left. Check which side of the `=` each cursor is on.
      - id: swap
        text: "`eldnac`"
        explanation: >-
          That is `"candle"` reversed, which would need a swap. Look at how many slots each pass
          writes.
      - id: early-stop
        text: "`candac`"
        explanation: >-
          That is the word after two passes. Check `i < j` once more.
    correct: mirror
    followUps:
      direction:
        prompt: In `chars[j] = chars[i]`, which slot changes?
        options:
          - id: left
            text: "`chars[j]`, on the left of `=`"
          - id: right
            text: "`chars[i]`, on the right of `=`"
          - id: both
            text: Both, as in a swap
        correct: left
        explanation: >-
          Assignment reads the right side and writes into the left side. Here `j` walks in from the
          end, so the right half is overwritten.
      swap:
        prompt: How many slots does `chars[j] = chars[i]` change?
        options:
          - id: one
            text: One, and `chars[i]` keeps its letter
          - id: two
            text: Two, because the letters trade places
          - id: none
            text: None until the loop ends
        correct: one
        explanation: >-
          A swap needs both slots on the left, as in `chars[i], chars[j] = chars[j], chars[i]`.
          This line writes one slot, so the left letter ends up in both places.
      early-stop:
        prompt: After two passes, `i` is 2 and `j` is 3. What happens next?
        options:
          - id: one-more
            text: One more pass copies `n` into position 3
          - id: neighbours
            text: The loop stops, since the cursors are neighbours
          - id: half
            text: The loop stops, since half the word is done
        correct: one-more
        explanation: >-
          2 < 3 is true, so the loop writes once more. It stops when `i` is 3 and `j` is 2.

  - id: checkpoint-reverse-shared
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      tiles = list("planet")
      shown = tiles
      tiles[0], tiles[-1] = tiles[-1], tiles[0]
      kept = tiles[:]
      i, j = 1, len(tiles) - 2
      while i < j:
          tiles[i], tiles[j] = tiles[j], tiles[i]
          i += 1
          j -= 1
      print("".join(shown), "".join(kept))
      ```
    options:
      - id: alias-and-copy
        text: "`tenalp tlanep`"
        explanation: >-
          `shown` is a second name for `tiles`, so it sees every swap: the ends first, then the
          loop's swaps of 1 with 4 and 2 with 3, which finish the reversal. `kept` was copied
          after only the first swap, so it holds `tlanep`.
      - id: both-copies
        text: "`planet tlanep`"
        explanation: >-
          That would be right if `shown` were a copy. Compare how `shown` and `kept` were made.
      - id: both-shared
        text: "`tenalp tenalp`"
        explanation: >-
          That would be right if `kept` shared the list. Check when `tiles[:]` runs and what it
          builds.
      - id: swapped-roles
        text: "`tlanep tenalp`"
        explanation: >-
          This has the two names the other way round. Which one is a second name, and which one is
          a copy?
    correct: alias-and-copy
    followUps:
      both-copies:
        prompt: Which name sees the swaps made through `tiles`?
        options:
          - id: same
            text: "`shown`, because it names the same list"
          - id: saved
            text: "`kept`, because it was made from `tiles`"
          - id: neither
            text: Neither, because the swaps only use `tiles`
        correct: same
        explanation: >-
          Assignment adds a name without copying, so `shown` and `tiles` are one list. It was
          named before the first swap, and it still sees that swap and every later one.
      both-shared:
        prompt: When does `kept` get its letters?
        options:
          - id: once
            text: Once, when `tiles[:]` runs, after the ends are swapped
          - id: every-change
            text: Every time `tiles` changes
          - id: print
            text: When it is printed
        correct: once
        explanation: >-
          A slice copies the items at the moment it runs. By then only the `p` and the `t` have
          traded places, so `kept` holds `tlanep`, and the loop's swaps change `tiles`, not the
          copy.
      swapped-roles:
        prompt: Which line made a copy?
        options:
          - id: slice
            text: "`kept = tiles[:]`"
          - id: assign
            text: "`shown = tiles`"
          - id: both
            text: Both lines
        correct: slice
        explanation: >-
          The slice copies, and plain assignment only adds a name. So `kept` stops at the first
          swap and `shown` shows the whole reversal.
