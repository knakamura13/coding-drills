id: arrays-and-strings-checkpoint
title: "Arrays and strings: checkpoint"
description: Trace a two-pointer edit on a new input. Each item combines reading indices, tracing a scan, and reading a slice.
heading: What does this print?

questions:
  - id: checkpoint-reverse-range
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      def flip(chars, lo, hi):
          while lo < hi:
              chars[lo], chars[hi] = chars[hi], chars[lo]
              lo += 1
              hi -= 1

      word = list("sprint")
      flip(word, 1, 4)
      print("".join(word))
      ```
    options:
      - id: inclusive
        text: "`snirpt`"
        explanation: >-
          `lo` starts at 1 and `hi` at 4, and both ends are included. The first pass swaps the
          outer pair of that range and the second pass swaps the middle pair. Then `lo` passes `hi`.
          Indices 0 and 5 are untouched, so the result is `s` + `nirp` + `t`.
      - id: hi-exclusive
        text: "`sirpnt`"
        explanation: >-
          This reverses indices 1 to 3 only. Check whether `hi` itself gets swapped.
      - id: one-based
        text: "`irpsnt`"
        explanation: >-
          This reverses the first four letters. Count from 0 to find where index 1 is.
      - id: one-swap
        text: "`snript`"
        explanation: >-
          That is the word after the first swap. Check the loop condition again before stopping.
    correct: inclusive
    followUps:
      hi-exclusive:
        prompt: On the first pass, which two indices swap?
        options:
          - id: one-four
            text: 1 and 4
          - id: one-three
            text: 1 and 3
          - id: zero-three
            text: 0 and 3
        correct: one-four
        explanation: >-
          `chars[hi]` is read and written directly, so index 4 is inside the range. A slice such
          as `chars[1:4]` would stop before 4, but this loop uses `hi` as an index.
      one-based:
        prompt: In `list("sprint")`, which letter is at index 1?
        options:
          - id: p
            text: "`'p'`"
          - id: s
            text: "`'s'`"
          - id: r
            text: "`'r'`"
        correct: p
        explanation: >-
          Index 0 is `s`, so index 1 is the second letter. The swaps run from that `p` to the `n`
          at index 4.
      one-swap:
        prompt: After the first swap, `lo` is 2 and `hi` is 3. Does the loop run again?
        options:
          - id: again
            text: Yes, since 2 < 3
          - id: once
            text: No, the loop body runs once per call
          - id: neighbors
            text: No, since `lo` and `hi` are next to each other
        correct: again
        explanation: >-
          The loop continues while `lo < hi`, so the middle pair swaps too. After that `lo` is 3
          and `hi` is 2, and the loop stops.

  - id: checkpoint-mirror-edit
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      chars = list("candle")
      i, j = 0, len(chars) - 1
      while i < j:
          chars[j] = chars[i]
          i += 1
          j -= 1
      print("".join(chars))
      ```
    options:
      - id: mirror
        text: "`cannac`"
        explanation: >-
          Each pass copies the letter at `i` over the letter at `j`. The passes write into
          indices 5, 4 and 3, and then `i` passes `j`. The left half is only ever read, so it
          keeps `can`, and the right half becomes its mirror image.
      - id: direction
        text: "`elddle`"
        explanation: >-
          This copies the right half over the left. Check which side of the `=` each pointer is on.
      - id: swap
        text: "`eldnac`"
        explanation: >-
          That is `"candle"` reversed, which would need a swap. Look at how many cells each pass
          writes.
      - id: early-stop
        text: "`candac`"
        explanation: >-
          That is the word after two passes. Check `i < j` once more.
    correct: mirror
    followUps:
      direction:
        prompt: In `chars[j] = chars[i]`, which cell changes?
        options:
          - id: left
            text: "`chars[j]`, on the left of `=`"
          - id: right
            text: "`chars[i]`, on the right of `=`"
          - id: both
            text: Both, as in a swap
        correct: left
        explanation: >-
          Assignment reads the right side and writes into the left side. Here `j` walks in from the
          end, so the right half is overwritten.
      swap:
        prompt: How many cells does `chars[j] = chars[i]` change?
        options:
          - id: one
            text: One, and `chars[i]` keeps its letter
          - id: two
            text: Two, because the letters trade places
          - id: none
            text: None until the loop ends
        correct: one
        explanation: >-
          A swap needs both cells on the left, as in `chars[i], chars[j] = chars[j], chars[i]`.
          This line writes one cell, so the left letter ends up in both places.
      early-stop:
        prompt: After two passes, `i` is 2 and `j` is 3. What happens next?
        options:
          - id: one-more
            text: One more pass copies `n` into index 3
          - id: neighbors
            text: The loop stops, since the pointers are next to each other
          - id: half
            text: The loop stops, since half the word is done
        correct: one-more
        explanation: >-
          2 < 3 is true, so the loop writes once more. It stops when `i` is 3 and `j` is 2.

  - id: checkpoint-reverse-shared
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      tiles = list("planet")
      tiles[0], tiles[-1] = tiles[-1], tiles[0]
      kept = tiles[:]
      i, j = 1, len(tiles) - 2
      while i < j:
          tiles[i], tiles[j] = tiles[j], tiles[i]
          i += 1
          j -= 1
      print("".join(tiles), "".join(kept))
      ```
    options:
      - id: copy-at-the-time
        text: "`tenalp tlanep`"
        explanation: >-
          The ends swap first, then the loop swaps indices 1 and 4, then 2 and 3, which finishes
          the reversal of `tiles`. `kept` was copied after only the first swap, so it holds
          `tlanep`.
      - id: slice-follows
        text: "`tenalp tenalp`"
        explanation: >-
          That treats `kept` as following `tiles`. Check what `tiles[:]` builds, and when.
      - id: copied-first
        text: "`tenalp planet`"
        explanation: >-
          That copies `tiles` before the first swap. Line 3 runs after line 2, so `kept` already
          has the `t` and the `p` traded.
      - id: one-pass
        text: "`teanlp tlanep`"
        explanation: >-
          That stops the loop after one pass. Then `i` is 2 and `j` is 3, and `2 < 3` is still
          true.
    correct: copy-at-the-time
    followUps:
      slice-follows:
        prompt: When does `kept` get its letters?
        options:
          - id: once
            text: Once, when `tiles[:]` runs, after the ends are swapped
          - id: every-change
            text: Every time `tiles` changes
          - id: print
            text: When it is printed
        correct: once
        explanation: >-
          A slice copies the items into a new list at the moment it runs. The loop's swaps change
          `tiles`, not the copy.
      copied-first:
        prompt: What does `tiles` hold when line 3 runs?
        options:
          - id: ends-swapped
            text: "`tlanep`, with the first and last letters traded"
          - id: original
            text: "`planet`, since the loop has not run yet"
          - id: reversed
            text: "`tenalp`, the finished reversal"
        correct: ends-swapped
        explanation: >-
          Lines run in order. Line 2 has already swapped `tiles[0]` and `tiles[-1]`, so the copy
          starts with `t` and ends with `p`.
      one-pass:
        prompt: After the loop's first pass, `i` is 2 and `j` is 3. What happens next?
        options:
          - id: again
            text: A second pass swaps indices 2 and 3
          - id: stops
            text: The loop stops, since the pointers are next to each other
          - id: done
            text: The loop stops, since the ends were swapped before it
        correct: again
        explanation: >-
          `2 < 3` is true, so the loop runs again and swaps the middle pair. It stops once `i` is
          3 and `j` is 2.

  - id: checkpoint-reverse-short
    heading: What happens?
    tags: [arrays-strings, two-pointers]
    prompt: |-
      ```python
      def reverse(chars):
          i, j = 0, len(chars) - 1
          while i < j:
              chars[i], chars[j] = chars[j], chars[i]
              i += 1
              j -= 1
          return chars

      print(reverse(list("")), reverse(list("x")))
      ```
    options:
      - id: both-unchanged
        text: "Prints `[] ['x']`"
        explanation: >-
          For the empty list `j` starts at -1, and `0 < -1` is false. For `['x']` it starts at 0,
          and `0 < 0` is false. The loop body never runs, so no cell is read and both lists come
          back as they were.
      - id: empty-raises
        text: "Raises `IndexError` on the empty list"
        explanation: >-
          `j` starts at -1 there, but an index only fails when it is read. The test `0 < -1` is
          false, so line 4 never runs.
      - id: one-raises
        text: "Raises `IndexError` on the one-letter list"
        explanation: >-
          `j` starts at 0, a real index, and the test `0 < 0` is false anyway, so nothing is read.
    correct: both-unchanged
    followUps:
      empty-raises:
        prompt: For the empty list, `j` starts at -1. Does line 4 ever run?
        options:
          - id: never
            text: No, since `0 < -1` is false
          - id: once
            text: Yes, once, and it reads `chars[-1]`
          - id: until-error
            text: Yes, until `j` reaches 0
        correct: never
        explanation: >-
          The `while` test runs before every pass, including the first. When it is false at the
          start, the body never runs and no index is read.
      one-raises:
        prompt: For `['x']`, what are `i` and `j` before the loop?
        options:
          - id: both-zero
            text: Both 0, which is a real index
          - id: one-past
            text: "`i` is 0 and `j` is 1, past the end"
          - id: minus-one
            text: "`i` is 0 and `j` is -1"
        correct: both-zero
        explanation: >-
          `len(chars) - 1` is 0 for a one-item list. The pointers start on the same cell, `0 < 0`
          is false, and the list comes back unchanged.

  - id: checkpoint-debug-reverse
    heading: Which line is wrong?
    tags: [arrays-strings, two-pointers]
    prompt: |-
      A suggested solution reverses the list `chars` by swapping cells from both ends. It has one
      wrong line. Which line is it?

      ```python
      def reverse(chars):
          i, j = 0, len(chars)
          while i < j:
              chars[i], chars[j] = chars[j], chars[i]
              i += 1
              j -= 1
      ```
    options:
      - id: start-past-end
        text: "Line 2: `i, j = 0, len(chars)`"
        explanation: >-
          `len(chars)` is one past the last index, so on any list that is not empty the first swap
          reads `chars[len(chars)]` and raises `IndexError`. `j` must start at `len(chars) - 1`.
      - id: loop-test
        text: "Line 3: `while i < j:`"
        explanation: >-
          With `<`, the loop stops when the pointers meet or cross, which is right: a middle cell
          has no partner. `<=` would only swap it with itself.
      - id: swap-line
        text: "Line 4: the swap"
        explanation: >-
          Python reads both values on the right before it writes either cell, so this one line
          swaps two cells safely.
      - id: move-j
        text: "Line 6: `j -= 1`"
        explanation: >-
          `j` starts at the right end and has to move left, toward `i`, so subtracting 1 is right.
    correct: start-past-end
    followUps:
      loop-test:
        prompt: In a five-item list, `i` and `j` both reach index 2. Does that cell need a swap?
        options:
          - id: no-partner
            text: No, a cell swapped with itself does not change
          - id: yes-missed
            text: Yes, or the middle item stays out of place
          - id: yes-error
            text: Yes, or the loop raises an error
        correct: no-partner
        explanation: >-
          The middle cell of an odd-length list is already where a reversal puts it. Stopping when
          `i < j` fails skips only that no-op.
      swap-line:
        prompt: "`chars[i], chars[j] = chars[j], chars[i]` runs. When does Python read the two values on the right?"
        options:
          - id: first
            text: Both before either cell is written
          - id: interleaved
            text: One, then a write, then the other
          - id: after
            text: After both cells are written
        correct: first
        explanation: >-
          The whole right side is worked out first, then the values go into the cells on the
          left. So neither value is lost.
      move-j:
        prompt: "`j` starts at the right end. Which way must it move to meet `i`?"
        options:
          - id: left
            text: Left, so `j -= 1` is right
          - id: right
            text: Right, so it should be `j += 1`
          - id: stay
            text: Nowhere; only `i` moves
        correct: left
        explanation: >-
          The pointers start at both ends and move toward each other. `i` moves right with
          `i += 1`, and `j` moves left with `j -= 1`.
