id: stack-matching-checkpoint
title: "Stack matching: checkpoint"
description: Decide whether mixed bracket strings are balanced, on new inputs. Each item combines pushing and popping, matching a closer to the top, and reading the stack that is left.
heading: What does this give?

questions:
  - id: checkpoint-pick-balanced
    heading: Which one is balanced?
    tags: [stack, python]
    prompt: |-
      ```python
      PAIRS = {')': '(', ']': '[', '}': '{'}

      def balanced(s):
          stack = []
          for ch in s:
              if ch in '([{':
                  stack.append(ch)
              elif not stack or stack.pop() != PAIRS[ch]:
                  return False
          return not stack
      ```

      For which string does `balanced` return `True`?
    options:
      - id: nested
        text: "`([]){[]}`"
        explanation: >-
          `[]` closes inside the `(`, then the `)` closes it. `{[]}` does the same with a `{`.
          Every closer pops an opener of its own type, and the stack is empty at the end.
      - id: crossed
        text: "`({)}[]`"
        explanation: Look at the top of the stack when the first closer arrives.
      - id: stray
        text: "`(){}][`"
        explanation: Look at what the stack holds when the `]` arrives.
      - id: unclosed
        text: "`{(())}[`"
        explanation: Look at what the stack holds after the last character.
    correct: nested
    followUps:
      crossed:
        prompt: In `({)}[]`, what is on top of the stack when the `)` at index 2 arrives?
        options:
          - id: brace
            text: The `{`, so the `)` fails
          - id: paren
            text: The `(`, since a `)` reaches for its own type
          - id: nothing
            text: Nothing, the stack is empty
        correct: brace
        explanation: >-
          The `{` was pushed after the `(`, so it is on top. The `)` pops it, the types differ, and
          the call returns `False` at index 2.
      stray:
        prompt: In `(){}][`, what does the stack hold when the `]` at index 4 arrives?
        options:
          - id: empty
            text: Nothing, so the call returns `False` there
          - id: bracket
            text: The `[` from the last character
          - id: brace
            text: The `{`, left over from the `{}` pair
        correct: empty
        explanation: >-
          `()` and `{}` each push and pop, so the stack is empty again. The scan reads left to
          right, so the `[` after the `]` has not been pushed yet.
      unclosed:
        prompt: After `balanced` reads all of `{(())}[`, what is on the stack?
        options:
          - id: bracket
            text: "`['[']`, so the call returns `False`"
          - id: empty
            text: Nothing, since every closer matched
          - id: brace
            text: "`['{']`, the outermost opener"
        correct: bracket
        explanation: >-
          The `}` at index 5 closes the `{`, so the first six characters leave the stack empty. The
          final `[` is pushed and never closed, and `return not stack` gives `False`.

  - id: checkpoint-batch
    heading: What does this print?
    tags: [stack, python]
    prompt: |-
      ```python
      PAIRS = {')': '(', ']': '[', '}': '{'}

      def balanced(s):
          stack = []
          for ch in s:
              if ch in '([{':
                  stack.append(ch)
              elif not stack or stack.pop() != PAIRS[ch]:
                  return False
          return not stack

      tests = ['{()[]}', '([{}]', '[{]}()']
      print([balanced(s) for s in tests])
      ```
    options:
      - id: right
        text: "`[True, False, False]`"
        explanation: >-
          `{()[]}` closes every opener in order. `([{}]` closes the `{` and the `[` but ends with
          the `(` still open. In `[{]}()` the `]` pops the `{`, so it fails at index 2.
      - id: ignores-leftover
        text: "`[True, True, False]`"
        explanation: Trace `([{}]` to the end and look at the stack.
      - id: searches-deeper
        text: "`[True, False, True]`"
        explanation: Look at the top of the stack when the `]` in `[{]}()` arrives.
    correct: right
    followUps:
      ignores-leftover:
        prompt: "`([{}]` ends with the `(` still on the stack. What does `balanced` return for it?"
        options:
          - id: returns-false
            text: "`False`, from `return not stack`"
          - id: returns-true
            text: "`True`, because no closer failed"
          - id: error
            text: It fails with `IndexError`
        correct: returns-false
        explanation: >-
          A closer can only fail inside the loop, and an opener that is never closed fails nothing
          there. The last line is the check that catches it.
      searches-deeper:
        prompt: In `[{]}()`, the `]` arrives with `{` on top. What happens?
        options:
          - id: fails
            text: The `{` is popped, the types differ, and the call returns `False`
          - id: under
            text: The `[` under the `{` is popped instead
          - id: waits
            text: The `]` waits until the `}` has closed the `{`
        correct: fails
        explanation: >-
          The matcher pops the top before it compares. A closer never reaches past the top, so the
          crossed pair is rejected at index 2.

  - id: checkpoint-complete
    heading: What does this print?
    tags: [stack, python]
    prompt: |-
      ```python
      CLOSE = {'(': ')', '[': ']', '{': '}'}

      def complete(s):
          stack = []
          for ch in s:
              if ch in CLOSE:
                  stack.append(ch)
              elif not stack or CLOSE[stack.pop()] != ch:
                  return None
          return ''.join(CLOSE[c] for c in reversed(stack))

      print(complete('[(){[]'))
      ```

      `reversed(stack)` reads `stack` from its last item to its first, and `''.join(...)` glues
      the strings it is given into one.
    options:
      - id: reversed
        text: "`}]`"
        explanation: >-
          `()` and the inner `[]` are matched and popped. The `[` at index 0 and the `{` at index 3
          are left, with the `{` on top. Closing from the top down gives `}` and then `]`.
      - id: bottom-up
        text: "`]}`"
        explanation: Look at which leftover opener is on top, and which closer has to come first.
      - id: none
        text: "`None`"
        explanation: Look at which line returns `None`, and whether any closer here fails.
      - id: top-only
        text: "`}`"
        explanation: Look at how many openers are left on the stack.
    correct: reversed
    followUps:
      bottom-up:
        prompt: "The stack ends as `['[', '{']`. Which opener has to be closed first?"
        options:
          - id: brace
            text: The `{`, because it was opened last
          - id: bracket
            text: The `[`, because it was opened first
          - id: either
            text: Either one, as long as both get closed
        correct: brace
        explanation: >-
          A closer always meets the top of the stack. `]}` would send the `]` to the `{` and fail,
          which is why `complete` walks the stack in reverse.
      none:
        prompt: Which line of `complete` can return `None`?
        options:
          - id: in-loop
            text: The line inside the loop, when a closer fails
          - id: last
            text: The last line, when openers are left over
          - id: both
            text: Both of them
        correct: in-loop
        explanation: >-
          The last line always returns a string, possibly an empty one. Leftover openers are the
          input it turns into closers, not a failure.
      top-only:
        prompt: After a `}` closes the `{`, is `[(){[]}` balanced?
        options:
          - id: still-open
            text: No, the `[` at index 0 is still open
          - id: yes-top
            text: Yes, the `{` was the only opener left
          - id: yes-inner
            text: Yes, the `]` at index 5 closed the first `[`
        correct: still-open
        explanation: >-
          The `]` at index 5 popped the `[` at index 4, not the one at index 0. Two openers were left,
          so two closers are needed.

  - id: checkpoint-skip-bug
    heading: Which string does it misjudge?
    tags: [stack, python]
    prompt: |-
      ```python
      PAIRS = {')': '(', ']': '[', '}': '{'}

      def lenient(s):
          stack = []
          for ch in s:
              if ch in '([{':
                  stack.append(ch)
              elif stack and stack[-1] == PAIRS[ch]:
                  stack.pop()
          return not stack
      ```

      `lenient` reads the top with `stack[-1]`, which leaves it in place, and pops only when the
      closer matches it. Otherwise it moves on. For which string does it give a different answer
      from a correct balance check?
    options:
      - id: stray
        text: "`{}())`"
        explanation: >-
          `{}` and `()` match and leave the stack empty. The last `)` finds nothing open, which
          should end the check with `False`, but `lenient` just moves on. The stack is empty at the
          end, so it returns `True`.
      - id: crossed
        text: "`[{]}`"
        explanation: Trace `lenient` and look at what is left on its stack at the end.
      - id: unclosed
        text: "`[[{}]`"
        explanation: Trace `lenient` and look at what is left on its stack at the end.
      - id: balanced
        text: "`({}[])`"
        explanation: Check whether `lenient` ever skips a closer on this string.
    correct: stray
    followUps:
      crossed:
        prompt: What is on `lenient`'s stack when it finishes `[{]}`?
        options:
          - id: bracket
            text: "`['[']`, so it returns `False`, the same as a correct check"
          - id: empty
            text: Nothing, so it returns `True`
          - id: both
            text: "`['[', '{']`, since the `]` blocks the `}`"
        correct: bracket
        explanation: >-
          The `]` does not match the `{` on top, so it is skipped. The `}` then pops the `{`, and
          the `[` is left. The answer is `False`, right for the wrong reason.
      unclosed:
        prompt: What does `lenient('[[{}]')` leave on its stack?
        options:
          - id: first
            text: The `[` at index 0, so it returns `False`
          - id: nothing
            text: Nothing, so it returns `True`
          - id: brace
            text: The `{`, since it never matched
        correct: first
        explanation: >-
          The `}` and the `]` each match the top and pop it. The outer `[` is never closed, and the
          last line rejects the leftover, as a correct check would.
      balanced:
        prompt: On `({}[])`, does `lenient` ever skip a closer?
        options:
          - id: never
            text: No, each closer matches the top when it arrives
          - id: nested
            text: Yes, it skips closers inside another pair
          - id: last
            text: Yes, it skips the final `)`
        correct: never
        explanation: >-
          On a balanced string every closer matches the top, so `lenient` pops exactly as a correct
          check does and returns `True`. The two differ only when a closer is skipped.

  - id: bracket-balance
    heading: Which structure is needed?
    tags: [stack, python]
    prompt: >-
      A string contains only the characters `(`, `)`, `[`, `]`, `{`, and `}`. It is balanced when
      every closing bracket matches the most recent unmatched opener, that opener is of the same
      kind, and nothing is left open.
      For example, `({}[()])` is balanced, while `{[}]`, `[}`, `}`, and `[[` are not. In Python,
      which approach decides this correctly for every string?
    options:
      - id: one-counter
        text: "One counter: +1 per opener, -1 per closer, never below 0 and ending at 0"
        explanation: >-
          A counter sees only how many brackets are open, not which kind. It accepts `[}`, whose
          counter goes 1 then 0. With a single kind of bracket a counter is enough, but with three
          the kinds must match.
      - id: three-counters
        text: Three counters, one per bracket kind, each never below 0 and each ending at 0
        explanation: >-
          This catches `[}`, but it accepts `{[}]`: every counter rises and falls without going
          negative and ends at 0. Counts track how many of each kind are open, and that is not enough
          to reject a crossed pair.
      - id: stack-unguarded
        text: A stack of openers; pop on each closer with no empty check, and end with an empty stack
        explanation: >-
          This works until a closer arrives with nothing on the stack. For `}` there is no opener to
          match, and in Python a pop on an empty list raises `IndexError` rather than giving False.
          The stack must be checked for emptiness before every pop.
      - id: stack-guarded
        text: A stack of openers; a closer needs a non-empty stack and a matching top; end empty
        explanation: >-
          Push each opener. On a closer, answer False if the stack is empty (as for `}`), then pop and
          compare with the matching opener. After the loop, answer True only if the stack is empty,
          since `[[` leaves two openers.
    correct: stack-guarded
    followUps:
      one-counter:
        prompt: For `[}` the counter goes 1, then 0, and the string is accepted. What does the counter not know?
        options:
          - id: which-kind
            text: Which kind of opener is still open, so it cannot check that the closer matches it
          - id: opener-vs-closer
            text: Whether a bracket is an opener or a closer, so it treats `}` like an opener
          - id: went-negative
            text: Whether the count ever dropped below 0, which is what would reject this string
        correct: which-kind
        explanation: >-
          The counter does add for openers and subtract for closers, and here it never goes below 0.
          What it cannot say is that the open one is a `[` and the closer is a `}`. A stack stores
          the kinds, so the top is the opener that the next closer must match.
      three-counters:
        prompt: >-
          In `{[}]` every counter rises and falls without going negative and ends at 0, yet the string
          is not balanced. What do the counters ignore?
        options:
          - id: nesting-order
            text: Which opener is the most recent one, so `}` is accepted while `[` is still open and unmatched
          - id: per-kind
            text: Whether each kind is balanced on its own, since they only compare the grand totals
          - id: went-negative
            text: Whether a counter ever went negative, which is how this string should be rejected
        correct: nesting-order
        explanation: >-
          Counters track how many of each kind are open, but a closer must match the latest unmatched
          opener, not just any opener of its kind. That last-in, first-out rule is what a stack holds
          in its top entry.
      stack-unguarded:
        prompt: In Python, what does `stack.pop()` do on the string `}`, where no opener has been pushed?
        options:
          - id: raises
            text: "It raises `IndexError: pop from empty list`, so the function crashes instead of returning False"
          - id: returns-none
            text: It returns `None`, so the comparison fails and the function returns False
          - id: skips
            text: It does nothing, so the closer is skipped and the string can still be accepted
        correct: raises
        explanation: >-
          Popping an empty Python list raises `IndexError`, so a closer with an empty stack has to be
          handled before the pop and treated as unbalanced. The end-of-loop check for an empty stack
          is a separate rule: it rejects strings such as `((`.

  - id: checkpoint-debug-pop-front
    heading: Which call does it fail on?
    tags: [stack, python]
    prompt: |-
      A suggested balance check should return `True` exactly when every closer matches the most
      recent unclosed opener of its own type and nothing is left open. `stack.pop(0)` removes and
      returns the item at index 0. One detail is slightly off:

      ```python
      PAIRS = {')': '(', ']': '[', '}': '{'}

      def balanced(s):
          stack = []
          for ch in s:
              if ch in '([{':
                  stack.append(ch)
              elif not stack or stack.pop(0) != PAIRS[ch]:
                  return False
          return not stack
      ```

      Which call returns a wrong answer?
    options:
      - id: nested
        text: "`balanced('[()]')`"
        explanation: >-
          The `)` arrives with `[` and `(` on the stack. `pop(0)` takes the `[` at index 0, the
          oldest opener, instead of the `(` on top, so the call returns `False` for a balanced
          string. Popping the top with `stack.pop()` fixes it.
      - id: sequential
        text: "`balanced('{}()[]')`"
        explanation: >-
          Each closer arrives with one opener on the stack, so index 0 is also the top, and
          `pop(0)` takes the right opener. The call returns `True`, which is right.
      - id: wrong-type
        text: "`balanced('(]')`"
        explanation: >-
          The `]` takes the only opener, a `(`, which is the wrong type. The call returns `False`,
          which is right.
      - id: leftover
        text: "`balanced('[[]')`"
        explanation: >-
          The `]` takes the `[` at index 0 instead of the one on top, but both are `[`, so it
          matches. One `[` is left, and the call returns `False`, which is right.
    correct: nested
    followUps:
      sequential:
        prompt: In `{}()[]`, how many openers are on the stack when each closer arrives?
        options:
          - id: one
            text: One, so the oldest opener is also the newest
          - id: two
            text: Two, so `pop(0)` takes the wrong one
          - id: none
            text: None, so the call returns `False`
        correct: one
        explanation: >-
          With one item, the first item and the last are the same, so `pop(0)` and `pop()` agree.
          They differ only when two or more openers are open at once.
      wrong-type:
        prompt: In `(]`, what does `pop(0)` return when the `]` arrives?
        options:
          - id: paren
            text: The `(`, which does not match, so `False` is right
          - id: nothing
            text: Nothing, since the stack is empty
          - id: closer
            text: The `]` itself, since it was just read
        correct: paren
        explanation: >-
          The `(` is the only item, so it sits at index 0 and on top at once. It is the wrong type
          for `]`, and any correct check also returns `False`.
      leftover:
        prompt: In `[[]`, the `]` takes the `[` at index 0 instead of the one on top. Does that change the answer?
        options:
          - id: same
            text: No, both are `[`, and one is left either way
          - id: accepts
            text: Yes, the call returns `True`
          - id: crashes
            text: Yes, the call raises `IndexError`
        correct: same
        explanation: >-
          Taking the wrong one of two equal openers still matches the `]`, and one `[` stays open.
          The last line returns `False`, as a correct check does.
