id: dp-storage
title: "DP: saving space"
description: Keep only the past entries a table still reads, update old and new values in a safe order, and count states times work. Each card has a worked example on hand.
heading: Which one is right?

questions:
  - id: storage-tap-oldest-needed
    format: tap-cell
    heading: Which entry is still needed?
    tags: [dp, python]
    workedExample: |-
      This path saves memory in dynamic programming (DP). A table often reads only a few recent
      entries, so the older ones can be dropped. An entry is still needed only while some later
      step reads it. Here step `i` reads `dp[i-1]` and `dp[i-2]`, and `dp[5]` has just been
      written.

      1. The next step computes `dp[6]`, so it reads `dp[5]` and `dp[4]`. Both are still needed.
      2. Every step after that has a larger `i`, so its older read, `dp[i-2]`, lands on index 5 or
         higher. Only the step for `dp[6]` reaches back to index 4.
      3. So `dp[4]` is the oldest entry still needed: the next index, 6, minus the farthest
         look-back, 2. `dp[3]` and everything before it can be dropped.
    prompt: >-
      A climber takes 1 or 3 stairs at a time, and `ways[7]` has just been written. Tap the
      **oldest** entry that some later step still reads.
    code: |
      ways = [1, 1, 1]
      for i in range(3, n + 1):
          ways.append(ways[i - 1] + ways[i - 3])
    sequence: { kind: array, name: ways, cells: [1, 1, 1, 2, 3, 4, 6, 9] }
    correct: 5
    explanation: >-
      The next step computes `ways[8]` and reads `ways[7]` and `ways[5]`. Every step after that
      reads higher indices still, so `ways[5]` is the oldest entry left in use. Three values,
      `ways[5]` to `ways[7]`, are all the loop needs from here on.
    misses:
      - index: 0
        explanation: >-
          `ways[0]` was last read by `ways[3]`. The farthest look-back is 3, so a step at 8 or
          later never reaches back to index 0.
      - index: 1
        explanation: >-
          `ways[1]` was last read when `ways[4]` was computed. No later step looks back that far.
      - index: 2
        explanation: >-
          `ways[2]` was last read by `ways[5]`. From `ways[8]` on, the oldest read is `ways[i-3]`,
          which is index 5 or higher.
      - index: 3
        explanation: >-
          `ways[3]` fed `ways[6]` and is never read again. The next step looks back three cells
          from 8, which lands on 5.
      - index: 4
        explanation: >-
          `ways[4]` was read to compute `ways[7]`, the step that just ran. The next step is
          `ways[8]`, whose look-back of 3 lands on index 5.
      - index: 6
        explanation: >-
          `ways[6]` is still needed, by `ways[9]`, but it is not the oldest. `ways[8]` reads
          `ways[5]`, one cell further back.
      - index: 7
        explanation: >-
          `ways[7]` is the newest entry, not the oldest. The next step also reads `ways[5]`, three
          cells back from 8.

  - id: storage-window-width
    heading: How much must stay?
    tags: [dp, complexity]
    workedExample: |-
      Consider `dp[i] = dp[i-1] + dp[i-4]`, filled for `i` from 4 upward. A past entry must stay
      until the last step that reads it.

      1. Step `i` reads `dp[i-1]` and `dp[i-4]`. Every later step has a larger `i`, so it reads
         nothing older than `dp[i-4]`, and older entries can go.
      2. Step `i` does not read `dp[i-3]` or `dp[i-2]`, but later steps do: step `i + 1` reads
         `dp[i-3]` as its `dp[(i+1)-4]`, and step `i + 2` reads `dp[i-2]` as its `dp[(i+2)-4]`. So
         both must stay, even though they sit between the two reads.
      3. So the loop keeps four entries, `dp[i-4]` through `dp[i-1]`: as many as its farthest read
         reaches back, gaps included.
    prompt: |-
      A game scores plays worth 2 or 5 points, and `ways[i]` counts the orders that reach a score of
      `i`. Only `ways[n]` is returned.

      ```python
      ways = [1] + [0] * n
      for i in range(1, n + 1):
          if i >= 2:
              ways[i] += ways[i - 2]
          if i >= 5:
              ways[i] += ways[i - 5]
      return ways[n]
      ```

      Old entries can be dropped to save extra space, the memory a function uses beyond its input.
      What is the least the loop must keep from the past to compute every later entry?
    options:
      - id: two-reads
        text: Two values, `ways[i-2]` and `ways[i-5]`, because those are the only entries read
        explanation: >-
          Those are the reads for step `i`, but `ways[i-1]` becomes `ways[(i+1)-2]` on the very
          next step, and `ways[i-3]` and `ways[i-4]` are read a few steps later. Dropping them
          loses values that are still ahead.
      - id: last-five
        text: The last five entries, `ways[i-5]` up to `ways[i-1]`, read now or later
        explanation: >-
          Every index from `i-5` to `i-1` is read either now or on a later step, and nothing older
          is ever read again. Keeping those five entries takes O(1) extra space, and the loop
          still takes O(n) steps under unit-cost arithmetic.
      - id: last-three
        text: The last three entries, because the two reads are 5 - 2 = 3 cells apart
        explanation: >-
          Step `i` needs `ways[i-5]`. Keeping three entries holds only `ways[i-3]` through
          `ways[i-1]`, so it would have dropped that value too soon.
      - id: whole-table
        text: The whole table, because the two reads are not next to each other
        explanation: >-
          A gap between reads does not force the whole table. Everything older than `i-5` is never
          read again, so keeping the last five entries is enough.
    correct: last-five
    followUps:
      two-reads:
        prompt: >-
          At step `i >= 5`, the loop reads `ways[i-2]` and `ways[i-5]`. If at least four
          more steps remain, which future steps read `ways[i-1]`?
        options:
          - id: next-step
            text: Steps `i + 1` and `i + 4`
          - id: never
            text: Steps `i + 2` and `i + 5`
          - id: only-at-end
            text: Steps `i + 1` and `i + 3`
        correct: next-step
        explanation: >-
          Step `i + 1` reads back two entries to `i - 1`. Step `i + 4` reads back five to
          the same index. The value must be kept until its last read.
      last-three:
        prompt: What sets how many past entries a loop that drops old entries must keep?
        options:
          - id: gap
            text: The gap between the two look-backs
          - id: farthest
            text: The farthest look-back
          - id: count-of-reads
            text: The number of reads in the recurrence
        correct: farthest
        explanation: >-
          Step `i` reads back as far as `i-5`. Every index between `i-5` and `i-1` takes that
          position on some later step, so the loop has to keep all five.
      whole-table:
        prompt: After `ways[20]` is computed, which step ever reads `ways[14]` again?
        options:
          - id: none
            text: None, since the furthest any later step reaches is 21 - 5 = 16
          - id: step-twenty-one
            text: "`ways[21]`, because it reads every earlier entry"
          - id: last-step
            text: The step that computes `ways[n]`
        correct: none
        explanation: >-
          Each step reaches back at most 5 cells. Once the loop is past `i = 19`, index 14 is out
          of reach for good, so it can be dropped.

  - id: storage-trace-two-variables
    format: step-trace
    heading: Predict each step
    tags: [dp, python]
    workedExample: |-
      Consider `a = 1` and `b = 2`, then the line `a, b = b, a + b`. Python builds the whole right
      side from the old values before it assigns any name.

      1. The right side is `b, a + b`. With the old values that is `2, 1 + 2`, the pair `(2, 3)`.
      2. Only now are the names assigned: `a` takes 2 and `b` takes 3.
      3. Two separate lines, `a = b` and then `b = a + b`, would let the second line read the new
         `a = 2` and set `b = 4`. The one-line form reads only old values, so it gives `a = 2` and
         `b = 3`.
    prompt: >-
      A walker starts on stair 0 or 1, climbs 1 or 2 stairs at a time, and pays the cost of every
      stair it stands on. `a` and `b` hold the cheapest totals for the two stairs before `i`. Two
      variables that slide along the table like this are rolling variables. Predict each step.
    code: |
      def cheapest(cost):
          a, b = cost[0], cost[1]
          for i in range(2, len(cost)):
              a, b = b, cost[i] + min(a, b)
          return b

      cheapest([2, 7, 1, 5, 3, 4])
    sequence: { kind: array, name: cost, cells: [2, 7, 1, 5, 3, 4] }
    start:
      - { name: i, at: 2 }
    steps:
      - line: 4
        ask: "`a` is 2 and `b` is 7. After the pass with `i` at 2, what are `a` and `b`?"
        options:
          - id: shift
            text: a = 7, b = 3
            explanation: >-
              The right side is built from the old values: `b` is 7, and `1 + min(2, 7)` is 3. Then
              `a` takes 7 and `b` takes 3.
          - id: stay
            text: a = 2, b = 3
            explanation: >-
              `a` does change. The tuple moves the old `b` into `a`, so the pair slides one stair
              to the right.
          - id: new-a
            text: a = 7, b = 8
            explanation: >-
              That would use the new `a` inside `min`, as two separate lines would. The tuple reads
              `min(2, 7)` before either name changes, so `b` is 1 + 2.
        correct: shift
      - line: 4
        ask: After the pass with `i` at 3, what are `a` and `b`?
        options:
          - id: shift
            text: a = 3, b = 8
            explanation: >-
              `a` takes the old `b`, 3. The new `b` is `5 + min(7, 3)`, which is 8.
          - id: no-shift
            text: a = 7, b = 8
            explanation: >-
              `a` must move up to the old `b`, 3. Keeping 7 leaves `a` one stair behind.
          - id: max
            text: a = 3, b = 12
            explanation: >-
              12 is `5 + 7`, which picks the dearer stair. The walker takes the cheaper of the two
              ways in, so it adds `min(7, 3)`.
        correct: shift
        also:
          - { name: i, at: 3 }
      - line: 4
        ask: After the pass with `i` at 4, what are `a` and `b`?
        options:
          - id: shift
            text: a = 8, b = 6
            explanation: >-
              `a` takes 8. The new `b` is `3 + min(3, 8)`, which is 6, since stepping from stair 2
              is cheaper than from stair 3.
          - id: new-a
            text: a = 8, b = 11
            explanation: >-
              11 is `3 + min(8, 8)`. It comes from reading `a` after it was set to 8. In the tuple,
              `min` still sees the old `a`, 3.
          - id: same
            text: a = 6, b = 6
            explanation: >-
              `a` takes the old `b`, which is 8, not the value just computed.
        correct: shift
        also:
          - { name: i, at: 4 }
      - line: 5
        ask: The pass with `i` at 5 runs. What does the call return?
        options:
          - id: ten
            text: '10'
            explanation: >-
              `4 + min(8, 6)` is 10: stand on stairs 0, 2, 4 and 5 for 2 + 1 + 3 + 4. The full table
              is `[2, 7, 3, 8, 6, 10]`, and the two variables track its last two entries.
          - id: twelve
            text: '12'
            explanation: >-
              12 is `4 + 8`, stepping from stair 3. Stair 4 is cheaper at 6, so `min` picks it.
          - id: six
            text: '6'
            explanation: >-
              6 is the total for stair 4. The last pass still adds the 4 on stair 5.
        correct: ten
        also:
          - { name: i, at: 5 }

  - id: rolling-row-paths
    heading: Which cells do the reads stand for?
    tags: [dp, grid, python]
    workedExample: |-
      Consider a grid with 4 columns where a piece moves right or down, so
      `ways[r][c] = ways[r - 1][c] + ways[r][c - 1]`. One list `row` starts as row 0,
      `[1, 1, 1, 1]`, and each pass rewrites it in place, left to right, into the next row.

      1. On the pass for row 1, `c = 1` and `c = 2` have run, so `row` is `[1, 2, 3, 1]`. The
         entries left of `c = 3` already hold row 1, and `row[3]` still holds row 0.
      2. So in `row[3] += row[2]`, the old `row[3]`, 1, is `ways[0][3]`, the cell above, and
         `row[2]`, 3, is `ways[1][2]`, the cell to the left.
      3. Those are the two cells the full table adds, so `row[3]` becomes 4, which is `ways[1][3]`.
    prompt: |-
      A piece moves right or down on a grid with 3 columns, so
      `ways[r][c] = ways[r - 1][c] + ways[r][c - 1]`, and column 0 is all 1s. One list `row`
      replaces the table: it starts as row 0, and each pass rewrites it in place, left to right,
      into the next row.

      ```python
      row = [1, 1, 1]
      for r in range(1, R):
          for c in range(1, 3):
              row[c] += row[c - 1]
      ```

      On the pass for row 2, which cells of the full table do `row[2]` and `row[1]` stand for when
      `row[2] += row[1]` runs?
    options:
      - id: above-and-left
        text: "`row[2]` is `ways[1][2]`, the cell above; `row[1]` is `ways[2][1]`, the cell to the left"
        explanation: >-
          `row[2]` has not been rewritten on this pass, so it still holds row 1. `row[1]` was
          rewritten one step earlier, so it already holds row 2. Those are the cells the table
          adds: 3 + 3 = 6, which is `ways[2][2]`.
      - id: both-old
        text: "Both are row 1: `row[2]` is `ways[1][2]` and `row[1]` is `ways[1][1]`"
        explanation: >-
          `row[1]` was rewritten on this pass before `c` reached 2, so it no longer holds row 1.
          Adding `ways[1][1]` would count the diagonal, a move the piece cannot make.
      - id: both-new
        text: "Both are row 2: `row[2]` is `ways[2][2]` and `row[1]` is `ways[2][1]`"
        explanation: >-
          `ways[2][2]` is the cell being computed, so the line cannot read it yet. Until the write,
          `row[2]` still holds row 1's value, the cell above.
      - id: needs-two-rows
        text: "Row 1 is already gone, so the cell above needs a second list"
        explanation: >-
          A pass rewrites one entry at a time, left to right. Every entry the pass has not reached
          yet, `row[2]` among them, still holds row 1, so one list is enough.
    correct: above-and-left
    followUps:
      both-old:
        prompt: On the pass for row 2, which entries of `row` hold row 2 just before `row[2] += row[1]` runs?
        options:
          - { id: left-of-c, text: "`row[0]` and `row[1]`, the entries left of `c`" }
          - { id: none, text: "None, since the pass writes the row only when it ends" }
          - { id: all, text: "All three, since the pass started with row 2" }
        correct: left-of-c
        explanation: >-
          Each `row[c] += row[c - 1]` changes `row[c]` at once. Column 0 is 1 in every row, and
          `row[1]` was rewritten at `c = 1`, so the left neighbor is already row 2's value.
      both-new:
        prompt: Just before `row[2] += row[1]` runs, what does `row[2]` hold?
        options:
          - { id: above, text: "Row 1's count at column 2, the cell above" }
          - { id: this-cell, text: "Row 2's count at column 2, the cell being computed" }
          - { id: zero, text: "0, cleared for the new row" }
        correct: above
        explanation: >-
          The pass rewrites `row[2]` only when this line runs. Until then the entry holds what the
          last pass left there, the cell above.
      needs-two-rows:
        prompt: When the pass for row 2 reaches `c = 2`, which row does `row[2]` hold?
        options:
          - { id: row-one, text: "Row 1, since the pass has not reached it yet" }
          - { id: row-two, text: "Row 2, since the pass for row 2 has started" }
          - { id: lost, text: "Neither, since `row[1]` was just overwritten" }
        correct: row-one
        explanation: >-
          A pass overwrites an entry only when it reaches that entry. The cell above is read just
          before it is overwritten, so a second list would hold nothing the one list lacks.

  - id: knapsack-two-rows
    heading: What does the cell hold?
    tags: [dp, python]
    workedExample: |-
      Consider item 1, weight 2 and worth 3, and item 2, weight 3 and worth 4. `best[i][c]` is the
      best value from the first `i` items in a bag that holds weight `c`, each item packed at most
      once. Row 1 is `[0, 0, 3, 3, 3, 3]` for capacities 0 to 5.

      1. For `best[2][5]`, leaving item 2 out gives `best[1][5]`, which is 3.
      2. Packing item 2 uses 3 of the 5, which leaves room 2. The best for room 2 before item 2
         was considered is in row 1: `best[1][2]`, which is 3. So packing gives `3 + 4 = 7`.
      3. The cell keeps the larger choice, so `best[2][5]` is 7, both items.
    prompt: |-
      This is the 0/1 knapsack table: each item is packed whole or not at all, at most once.
      `best[i][c]` is the best value from the first `i` items in a bag that holds weight `c`. Each
      cell takes the larger of two choices: leave item `i` out, or pack it on top of the best for
      the room left, from the items before it. Item 1 weighs 3 and is worth 6, and item 2 weighs 2
      and is worth 4.

      ```
      c          0  1  2  3  4  5  6
      best[0]    0  0  0  0  0  0  0
      best[1]    0  0  0  6  6  6  6
      best[2]    0  0  4  6  ?
      ```

      What is `best[2][4]`?
    options:
      - id: six
        text: "6: leaving item 2 out beats packing it on `best[1][2]`"
        explanation: >-
          Leaving item 2 out gives `best[1][4]`, 6. Packing it leaves room 2, and the best for
          room 2 from item 1 alone is `best[1][2]`, 0, so packing gives 4. The larger is 6.
      - id: eight
        text: "8: item 2 packed on `best[2][2]`, which is 4"
        explanation: >-
          `best[2][2]` already holds item 2, so packing it again on top counts item 2 twice. The
          room left must come from row 1, the items before item 2.
      - id: four
        text: "4: item 2 packed on `best[1][2]`, which is 0"
        explanation: >-
          That is the packing choice, but the cell also has the choice to leave item 2 out, which
          keeps item 1 and is worth 6.
      - id: ten
        text: "10: item 2 packed on `best[1][4]`, which is 6"
        explanation: >-
          `best[1][4]` already packs item 1, which uses 3 of the 4. Item 2 weighs 2 more, so both
          together need room 5, and capacity 4 cannot hold them.
    correct: six
    followUps:
      eight:
        prompt: Which items can the value in `best[2][2]` already hold?
        options:
          - { id: item-two, text: "Item 2, which is why packing item 2 on it is wrong" }
          - { id: item-one, text: "Only item 1, since row 2 is built from row 1" }
          - { id: none, text: "None, since it is the empty bag" }
        correct: item-two
        explanation: >-
          Row 2 may use items 1 and 2, and `best[2][2]` is item 2 alone. Each item is packed at
          most once, so packing item 2 reads the room left in row 1.
      four:
        prompt: What are the two choices for `best[2][4]`?
        options:
          - { id: both, text: "Leave item 2 out, `best[1][4]`, or pack it, `best[1][2] + 4`" }
          - { id: pack-only, text: "Only pack item 2, since row 2 is for item 2" }
          - { id: skip-only, text: "Only leave item 2 out, since it does not fit" }
        correct: both
        explanation: >-
          A row adds one item, and the best bag may or may not use it. Here leaving it out keeps
          item 1, worth 6, which beats item 2 alone, worth 4.
      ten:
        prompt: Packing item 2 into a bag of capacity 4 leaves how much room for the items before it?
        options:
          - { id: two, text: "2, so the cell reads `best[1][2]`" }
          - { id: four, text: "4, so the cell reads `best[1][4]`" }
          - { id: six, text: "6, the capacity plus the item's weight" }
        correct: two
        explanation: >-
          Item 2 takes 2 of the 4, so the rest of the bag holds weight 2 at most. The pack choice
          reads the column `c - 2`, not `c`.

  - id: storage-tap-reused-item
    format: tap-cell
    heading: Where does the row go wrong?
    tags: [dp, python]
    workedExample: |-
      Consider `dp = [0, 0, 3, 3, 3, 3]`, the best value per capacity for one item of weight 2
      worth 3. A pass adds an item of weight 1 worth 2 that may be packed once, with
      `dp[w] = max(dp[w], dp[w - 1] + 2)` for `w` from 1 to 5, left to right.

      1. At `w = 1`, the loop reads `dp[0]`, which this pass never writes. So `dp[1]` becomes
         `max(0, 0 + 2) = 2`, the new item alone, and that is right.
      2. At `w = 2`, the loop reads `dp[1]`. It sits to the left of `w`, so this pass has already
         rewritten it to 2, and that 2 already uses the new item.
      3. So `dp[2]` becomes `max(3, 2 + 2) = 4`, the new item packed twice. With the old `dp[1] = 0`
         it would be `max(3, 0 + 2) = 3`, the right value, so capacity 2 is the first one that ends
         wrong.
    prompt: >-
      One row `dp` can replace the two-row knapsack table. Before a pass it holds the best value
      per capacity for the items so far, and the pass rewrites it in place to add one item,
      packed at most once. In `dp[w - wt] + val`, `dp[w - wt]` must be the best for the room left
      before this item was considered, so it must be a value from before this pass. The row holds
      the best for an item of weight 3 worth 4, and a pass adds an item of weight 2 worth 3, going
      **left to right**. Tap the first capacity that ends with a wrong value.
    code: |
      wt, val = 2, 3
      for w in range(wt, len(dp)):
          dp[w] = max(dp[w], dp[w - wt] + val)
    sequence: { kind: array, name: dp, cells: [0, 0, 0, 4, 4, 4, 4] }
    correct: 4
    explanation: >-
      At `w = 4` the loop reads `dp[2]`, which this pass already set to 3, the new item alone. So
      it stores 3 + 3 = 6, the item packed twice. With the old `dp[2]` of 0 it would keep 4. A
      loop from right to left reads only last-pass entries and gets `[0, 0, 3, 4, 4, 7, 7]`.
    misses:
      - index: 0
        explanation: >-
          The loop starts at `w = 2`, so `dp[0]` is never written. It stays 0, which is right.
      - index: 1
        explanation: >-
          `dp[1]` is below the item's weight and the loop never writes it. 0 is right.
      - index: 2
        explanation: >-
          `dp[2]` reads `dp[0]`, which this pass never writes. It becomes 3, the new item alone,
          and that is right.
      - index: 3
        explanation: >-
          `dp[3]` reads `dp[1]`, which this pass never writes, so it compares 4 with 0 + 3 and
          keeps 4. That is right.
      - index: 5
        explanation: >-
          `dp[5]` comes out as 7, which is right: it reads `dp[3]`, still 4, and adds 3 for both
          items. The first wrong value was written one step earlier.
      - index: 6
        explanation: >-
          `dp[6]` is wrong too: it reads the new `dp[4]` and stores 9. But the loop wrote a wrong
          value at `w = 4` first.

  - id: storage-unlimited-direction
    heading: Which direction is right?
    tags: [dp, python]
    workedExample: |-
      Consider `dp = [0, 0, 0, 0, 0]` for capacities 0 to 4 and an item of weight 2 worth 5, with
      `dp[w] = max(dp[w], dp[w - 2] + 5)`. The loop's direction decides whether `dp[w - 2]` is read
      before or after this pass rewrites it.

      1. From `w = 4` down to `w = 2`, every read lands on an entry this pass has not rewritten yet,
         so each value counts the item at most once. The row ends `[0, 0, 5, 5, 5]`.
      2. From `w = 2` up to `w = 4`, the pass writes `dp[2] = 5` first. Then `w = 4` reads that new
         5 and stores `5 + 5 = 10`, the item packed twice. The row ends `[0, 0, 5, 5, 10]`.
      3. So high to low uses each item at most once per pass, and low to high lets the same item be
         used again on the same pass.
    prompt: |-
      Here `dp[a]` counts the ways to pay amount `a` when each coin value may be used any number of
      times, and order does not matter.

      ```python
      dp = [1] + [0] * A
      for c in coins:
          for a in range(c, A + 1):
              dp[a] += dp[a - c]
      return dp[A]
      ```

      With `coins = [1, 2, 5]` and `A = 6` it returns 5. Which statement about the inner loop's
      direction is correct?
    options:
      - id: low-to-high
        text: Low to high is right, since `dp[a - c]` may already use coin `c`, so `c` can repeat
        explanation: >-
          Reading an entry this pass already updated adds one more copy of the same coin on top of
          ways that may use it. That is the point when coins are unlimited. Looping from high to
          low would read only last-pass entries and count each coin at most once.
      - id: high-to-low
        text: High to low is needed, since reading an updated entry always double counts
        explanation: >-
          Rereading an updated entry adds the same coin again. For items packed at most once that
          is an error, but here coins may repeat, so it is what the count needs. High to low
          returns 1 for this input, only `1 + 5`.
      - id: either
        text: Either direction gives 5, since the sum does not depend on the order it is built in
        explanation: >-
          The direction decides which version of `dp[a - c]` is read, not just the order of the
          additions. High to low returns 1 here, counting only `1 + 5`.
      - id: two-rows
        text: Neither works with one row; unlimited coins need a row per coin
        explanation: >-
          One row is enough. Low to high can read entries already updated on this coin's pass,
          which lets the coin repeat.
    correct: low-to-high
    followUps:
      high-to-low:
        prompt: >-
          With the loop running from high to low, what does `dp[a - c]` hold when `dp[a]` is
          updated?
        options:
          - id: before-coin
            text: The count before coin `c` was added, so each coin value is used at most once
          - id: after-coin
            text: The count that already includes coin `c`, so `c` can be used again
          - id: zero
            text: Zero, since the high-to-low loop clears entries as it goes
        correct: before-coin
        explanation: >-
          From high to low, smaller amounts have not been touched in this pass yet. That rule is
          right when each item is packed once, and wrong when a coin may repeat. For `[1, 2, 5]`
          and 6 it finds only `1 + 5`.
      either:
        prompt: For `coins = [1, 2, 5]` and `A = 6`, what does the loop return when it runs high to low?
        options:
          - id: one
            text: 1 way
          - id: five
            text: 5 ways
          - id: zero
            text: 0 ways
        correct: one
        explanation: >-
          High to low reads last-pass values, so each coin value appears at most once in a way.
          Among `{1, 2, 5}` only `1 + 5` makes 6. The direction changes what is counted.
      two-rows:
        prompt: >-
          On the low-to-high pass for coin 2, what does `dp[2]` hold when `dp[4]` is updated?
        options:
          - id: includes-c
            text: The count for amount 2 after the pass updated that entry
          - id: excludes-c
            text: The count for amount 2 before the pass updated that entry
          - id: undefined
            text: The count for amount 2 using only coin 2
        correct: includes-c
        explanation: >-
          The pass already updated `dp[2]`, so it counts `1 + 1` and `2`. Adding a coin 2
          to each gives the ways `1 + 1 + 2` and `2 + 2` for amount 4.

  - id: storage-count-lis
    heading: What is the time?
    tags: [dp, complexity]
    workedExample: |-
      Consider `dp[a]` for amounts `a` from 0 to `A`, where entry `a` runs `for c in coins:` and
      checks `dp[a - c]` once per coin. The time of a table is the sum, over its entries, of the
      work to fill each one.

      1. The work for entry `a` is the number of passes its inner loop makes. That loop runs once
         per coin, so with `k` coins entry `a` makes `k` checks.
      2. The coin list is the same for every entry, so each of the `A + 1` entries makes `k` checks.
      3. So the total is `(A + 1) × k` checks, which is O(A × k). With `A = 100` and 3 coins that is
         `101 × 3 = 303` checks.
    prompt: |-
      An increasing subsequence takes values from left to right, each larger than the one before,
      and may skip values. `dp[i]` is the length of the longest increasing subsequence that ends
      at `a[i]`.

      ```python
      dp = [1] * n
      for i in range(n):
          for j in range(i):
              if a[j] < a[i]:
                  dp[i] = max(dp[i], dp[j] + 1)
      return max(dp)
      ```

      What is the time of this code?
    options:
      - id: linear
        text: O(n), since each of the `n` entries is computed once
        explanation: >-
          Computed once is not the same as O(1) work. Entry `i` checks every `j` below it, so the
          checks add up to 0 + 1 + ... + (n - 1).
      - id: quadratic
        text: O(n²), since entry `i` checks all `i` earlier entries
        explanation: >-
          There are `n` states, and state `i` does `i` checks, so the total is n(n - 1)/2. For
          `n = 1000` that is 499,500 comparisons. The time is states times work per state, and
          here the work grows with `i`.
      - id: n-log-n
        text: O(n log n), since the inner scan stops at the first smaller value
        explanation: >-
          The inner loop has no `break`. It checks every `j` below `i`, whether or not one was
          smaller. A different method with binary search does reach O(n log n), but not this
          code.
      - id: exponential
        text: O(2ⁿ), which doubles with each added value, since every subsequence is a candidate
        explanation: >-
          The table never lists subsequences. It keeps one best length per end index and builds
          it from earlier entries.
    correct: quadratic
    followUps:
      linear:
        prompt: >-
          For `n = 5`, how many times does `a[j] < a[i]` run?
        options:
          - id: ten
            text: 10, since `i` does `i` checks and 0 + 1 + 2 + 3 + 4 = 10
          - id: five
            text: 5, one per entry
          - id: twenty-five
            text: 25, since every pair is checked in both orders
        correct: ten
        explanation: >-
          The total work is the sum of the work per state, not the number of states. With work
          `i` at state `i`, the sum is n(n - 1)/2, which grows like n².
      n-log-n:
        prompt: When does the inner `for j in range(i)` loop end?
        options:
          - id: after-all
            text: After it has checked every `j` from 0 to `i - 1`
          - id: first-smaller
            text: At the first `j` with `a[j] < a[i]`
          - id: halfway
            text: Halfway, since the rest was checked by earlier entries
        correct: after-all
        explanation: >-
          There is no `break`, and the best predecessor can be anywhere below `i`, so every `j`
          is checked. That makes the work at state `i` equal to `i`.
      exponential:
        prompt: How many values does the table store?
        options:
          - id: n
            text: "`n` values"
          - id: two-to-n
            text: 2ⁿ values
          - id: n-squared
            text: n² values
        correct: n
        explanation: >-
          Many subsequences end at the same index, and the table keeps only the best length for
          each. That is what keeps the work at O(n²) instead of O(2ⁿ).

  - id: storage-count-memo-calls
    heading: How much work and depth?
    tags: [dp, recursion, complexity]
    workedExample: |-
      Consider `f(n)` under `@cache`, which returns 1 when `n <= 2` and `f(n - 2) + f(n - 3)`
      otherwise, called as `f(10)`. The cache stores a result when its call returns, and a call
      whose argument is stored returns at once.

      1. Starting from 10 and taking `n - 2` and `n - 3` again and again reaches ten arguments: 0
         to 8, and 10.
      2. The first call with each argument runs the body and stores the result, and a later call
         with the same argument skips the body. So the body runs 10 times, once per argument.
      3. Nothing is stored until a call returns, so the first chain, `f(10)`, `f(8)`, `f(6)`,
         `f(4)`, `f(2)`, is live at once, one frame each on the stack. No chain is longer, so the
         deepest point is 5 live calls.
    prompt: |-
      ```python
      from functools import cache

      @cache
      def ways(n):
          if n <= 1:
              return 1
          return ways(n - 1) + ways(n - 2)

      ways(30)
      ```

      How many times does the body run past the cache, and how many `ways` calls are live (frames
      on the stack) at the deepest point?
    options:
      - id: thirty-one-thirty
        text: 31 body runs; at most 30 live calls, one per value from 30 to 1
        explanation: >-
          Arguments 0 to 30 are each computed once, 31 in all. The first chain goes 30, 29, ... down
          to 1 before anything is cached, which is 30 live calls. `ways(0)` is called later, from
          `ways(2)`, with the same 30 calls live. So the time is O(n) and the stack is O(n) deep.
      - id: thirty-one-two
        text: 31 body runs; at most 2 live calls, since each call reads two cached values
        explanation: >-
          Nothing is in the cache when the first chain starts. Each call waits on `ways(n - 1)`
          before it returns, so the stack fills down to `ways(1)`.
      - id: millions
        text: About 2.7 million body runs, since each call still makes two calls
        explanation: >-
          That is the count without the cache: 2,692,537 calls for `n = 30`. With the cache, a
          repeated argument is a lookup, so only 31 bodies run.
      - id: thirty-one-sixteen
        text: 31 body runs; at most 16 live calls, since half the calls step down by 2
        explanation: >-
          The deepest chain always takes the `n - 1` call first. That chain steps down by 1 from 30
          to 1, so 30 calls are live at once.
    correct: thirty-one-thirty
    followUps:
      thirty-one-two:
        prompt: When `ways(30)` first calls `ways(29)`, what is in the cache?
        options:
          - id: empty
            text: Nothing, since a value is stored only when its call returns
          - id: all
            text: Every value from 0 to 29, filled on the first call
          - id: two
            text: The two base values, 0 and 1
        correct: empty
        explanation: >-
          A cache fills from the bottom up as calls return. The first chain has to reach a stopping
          case before any value exists, so about `n` calls are live at that point.
      millions:
        prompt: What happens on the second call to `ways(28)`?
        options:
          - id: lookup
            text: It returns the stored value without running the body
          - id: rerun
            text: It runs the body again, since each call is separate
          - id: half
            text: It runs half the body, since one branch is cached
        correct: lookup
        explanation: >-
          A repeat argument is answered from the cache. The work is the number of distinct
          arguments times the work in one body, here 31 times a constant.
      thirty-one-sixteen:
        prompt: Which call does `ways(30)` make first?
        options:
          - id: minus-one
            text: "`ways(29)`, the left side of the `+`, and it nests down to `ways(1)`"
          - id: minus-two
            text: "`ways(28)`, since the smaller call is cheaper"
          - id: both
            text: Both at once, on separate stacks
        correct: minus-one
        explanation: >-
          Python evaluates the left operand first. Each call does the same, so the chain steps down
          by 1 until it reaches a stopping case, 30 live calls from the top.
